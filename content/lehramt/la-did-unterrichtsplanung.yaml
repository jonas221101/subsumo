    - id: p3
      label: Phasierung Einstieg - Erarbeitung - Sicherung
      weight: 2.0
      required: false
      keywords:
      - Einstieg
      - Erarbeitung
      - Sicherung
      card_slugs:
      - la-did-artikulation
    - id: p4
      label: Differenzierungsmaßnahmen konkret benannt
      weight: 2.0
      required: false
      keywords:
      - Differenzierung
      - differenzier
      - gestufte Hilfen
      - Hilfekarten
      - Sprachniveau
      - Glossar
      - Anforderungsbereich
