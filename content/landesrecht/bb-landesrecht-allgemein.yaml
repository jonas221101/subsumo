cards:
- slug: bb-lra-vwvfg
  type: norm
  front: Welches Verwaltungsverfahrensgesetz gilt fuer Landesbehoerden in Brandenburg?
  back: Verwaltungsverfahrensgesetz fuer das Land Brandenburg (VwVfGBbg) - Verweisung auf das VwVfG des
    Bundes. Das VwVfG des Bundes gilt nur fuer Bundesbehoerden (§ 1 VwVfG); fuer Landes- und Kommunalbehoerden
    ist das Landesgesetz massgeblich. Bei Verweisungsgesetzen werden die Bundesnormen 'entsprechend' angewendet
    und sind so zu zitieren (z. B. '§ 35 VwVfG i. V. m. § 1 des Landesgesetzes'), bei Vollgesetzen ist
    die Landesnorm selbst zu zitieren.
  norms:
  - Verwaltungsverfahrensgesetz fuer das Land Brandenburg (VwVfGBbg) - Verweisung auf das VwVfG des Bundes
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: bb-lra-verfassungsgericht
  type: norm
  front: Gibt es in Brandenburg eine Individualverfassungsbeschwerde zum Landesverfassungsgericht?
  back: 'Ja - Art. 6 Abs. 2 LV Bbg, §§ 45 ff. VerfGGBbg. Zustaendiges Gericht: Verfassungsgericht des
    Landes Brandenburg auf Grundlage der Verfassung des Landes Brandenburg (LV Bbg). Verfahrensgegenstand
    ist nur die Verletzung von Landesgrundrechten durch Landesstaatsgewalt; Bundesrecht ist Pruefungsmassstab
    nur, soweit die Landesverfassung darauf verweist. Daneben steht immer die Verfassungsbeschwerde zum
    BVerfG (Art. 93 Abs. 1 Nr. 4a GG).'
  norms:
  - Verfassung des Landes Brandenburg (LV Bbg)
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: bb-lra-kommunalverfassung
  type: norm
  front: Welches Gesetz regelt die Kommunalverfassung in Brandenburg und welche Hauptorgane hat die Gemeinde?
  back: 'Kommunalverfassung des Landes Brandenburg (BbgKVerf): Gemeindevertretung und Hauptverwaltungsbeamter
    (Buergermeister). Grundlage ist die Selbstverwaltungsgarantie (Art. 28 Abs. 2 GG und Landesverfassung):
    eigenverantwortliche Regelung aller Angelegenheiten der oertlichen Gemeinschaft. Klausurklassiker:
    Zustaendigkeitsstreit zwischen Vertretung und Verwaltungsspitze, Kommunalverfassungsstreit, Rechtsaufsicht.'
  norms:
  - 'Kommunalverfassung des Landes Brandenburg (BbgKVerf): Gemeindevertretung und Hauptverwaltungsbeamter
    (Buergermeister)'
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: bb-lra-bauordnung
  type: norm
  front: Wie heisst die Bauordnung in Brandenburg und wie ist eine Baugenehmigung zu pruefen?
  back: 'Brandenburgische Bauordnung (BbgBO). Anspruch auf Baugenehmigung besteht, wenn dem Vorhaben keine
    oeffentlich-rechtlichen Vorschriften entgegenstehen: Genehmigungs-beduerftigkeit (Errichtung, Aenderung,
    Nutzungsaenderung), keine Genehmigungsfreiheit, bauplanungsrechtliche Zulaessigkeit nach §§ 29 ff.
    BauGB (Bundesrecht), bauordnungsrechtliche Zulaessigkeit nach der Landesbauordnung (Abstandsflaechen,
    Gestaltung, Stellplaetze).'
  norms:
  - Brandenburgische Bauordnung (BbgBO)
  - §§ 29 ff. BauGB
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: bb-lra-pflichtstoff
  type: definition
  front: Welche Landesrechtsgebiete gehoeren in Brandenburg zum Pflichtstoff des Oeffentlichen Rechts?
  back: Polizei- und Ordnungsrecht (BbgPolG, BbgOBG); Kommunalrecht (BbgKVerf); Bauordnungsrecht (BbgBO);
    Landesverfassung. Landesrecht wird im Examen fast nie isoliert, sondern eingebettet in eine verwaltungsprozessuale
    Einkleidung (Anfechtungs-/Verpflichtungsklage, vorlaeufiger Rechtsschutz) geprueft - die Landesnorm
    ist die Ermaechtigungsgrundlage, der Aufbau bleibt der allgemeine.
  norms: []
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
