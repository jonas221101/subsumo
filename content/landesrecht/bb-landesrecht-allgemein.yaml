cards:
- slug: bb-lra-vwvfg
  type: norm
  front: Welches Verwaltungsverfahrensgesetz gilt für Landesbehörden in Brandenburg?
  back: Verwaltungsverfahrensgesetz für das Land Brandenburg (VwVfGBbg) - Verweisung auf das VwVfG des
    Bundes. Das VwVfG des Bundes gilt nur für Bundesbehörden (§ 1 VwVfG); für Landes- und Kommunalbehörden
    ist das Landesgesetz maßgeblich. Bei Verweisungsgesetzen werden die Bundesnormen 'entsprechend' angewendet
    und sind so zu zitieren (z. B. '§ 35 VwVfG i. V. m. § 1 des Landesgesetzes'), bei Vollgesetzen ist
    die Landesnorm selbst zu zitieren.
  norms:
  - Verwaltungsverfahrensgesetz für das Land Brandenburg (VwVfGBbg) - Verweisung auf das VwVfG des Bundes
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: bb-lra-verfassungsgericht
  type: norm
  front: Gibt es in Brandenburg eine Individualverfassungsbeschwerde zum Landesverfassungsgericht?
  back: 'Ja - Art. 6 Abs. 2 LV Bbg, §§ 45 ff. VerfGGBbg. Zuständiges Gericht: Verfassungsgericht des Landes
    Brandenburg auf Grundlage der Verfassung des Landes Brandenburg (LV Bbg). Verfahrensgegenstand ist
    nur die Verletzung von Landesgrundrechten durch Landesstaatsgewalt; Bundesrecht ist Prüfungsmaßstab
    nur, soweit die Landesverfassung darauf verweist. Daneben steht immer die Verfassungsbeschwerde zum
    BVerfG (Art. 93 Abs. 1 Nr. 4a GG).'
  norms:
  - Verfassung des Landes Brandenburg (LV Bbg)
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: bb-lra-kommunalverfassung
  type: norm
  front: Welches Gesetz regelt die Kommunalverfassung in Brandenburg und welche Hauptorgane hat die Gemeinde?
  back: 'Kommunalverfassung des Landes Brandenburg (BbgKVerf): Gemeindevertretung und Hauptverwaltungsbeamter
    (Bürgermeister). Grundlage ist die Selbstverwaltungsgarantie (Art. 28 Abs. 2 GG und Landesverfassung):
    eigenverantwortliche Regelung aller Angelegenheiten der örtlichen Gemeinschaft. Klausurklassiker:
    Zuständigkeitsstreit zwischen Vertretung und Verwaltungsspitze, Kommunalverfassungsstreit, Rechtsaufsicht.'
  norms:
  - 'Kommunalverfassung des Landes Brandenburg (BbgKVerf): Gemeindevertretung und Hauptverwaltungsbeamter
    (Bürgermeister)'
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: bb-lra-bauordnung
  type: norm
  front: Wie heißt die Bauordnung in Brandenburg und wie ist eine Baugenehmigung zu prüfen?
  back: 'Brandenburgische Bauordnung (BbgBO). Anspruch auf Baugenehmigung besteht, wenn dem Vorhaben keine
    öffentlich-rechtlichen Vorschriften entgegenstehen: Genehmigungsbedürftigkeit (Errichtung, Änderung,
    Nutzungsänderung), keine Genehmigungsfreiheit, bauplanungsrechtliche Zulässigkeit nach §§ 29 ff. BauGB
    (Bundesrecht), bauordnungsrechtliche Zulässigkeit nach der Landesbauordnung (Abstandsflächen, Gestaltung,
    Stellplätze).'
  norms:
  - Brandenburgische Bauordnung (BbgBO)
  - §§ 29 ff. BauGB
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: bb-lra-pflichtstoff
  type: definition
  front: Welche Landesrechtsgebiete gehören in Brandenburg zum Pflichtstoff des Öffentlichen Rechts?
  back: Polizei- und Ordnungsrecht (BbgPolG, BbgOBG); Kommunalrecht (BbgKVerf); Bauordnungsrecht (BbgBO);
    Landesverfassung. Landesrecht wird im Examen fast nie isoliert, sondern eingebettet in eine verwaltungsprozessuale
    Einkleidung (Anfechtungs-/Verpflichtungsklage, vorläufiger Rechtsschutz) geprüft - die Landesnorm
    ist die Ermächtigungsgrundlage, der Aufbau bleibt der allgemeine.
  norms: []
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
