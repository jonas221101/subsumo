cards:
- slug: sn-por-generalklausel
  type: norm
  front: Wo steht die polizeiliche Generalklausel in Sachsen und was setzt sie voraus?
  back: 'Fundstelle: § 12 SaechsPVDG (Polizeivollzugsdienst); § 12 SaechsPBG (Polizeibehoerden) - Nummerierung
    pruefen. Die Generalklausel ermaechtigt zu den notwendigen Massnahmen, um eine im Einzelfall bestehende
    Gefahr fuer die oeffentliche Sicherheit oder Ordnung abzuwehren. Sie ist subsidiaer: Greift eine Standardmassnahme
    oder ein Spezialgesetz, geht dieses vor. Auf der Rechtsfolgenseite besteht Ermessen, begrenzt durch
    den Grundsatz der Verhaeltnismaessigkeit.'
  norms:
  - § 12 SaechsPVDG (Polizeivollzugsdienst)
  - § 12 SaechsPBG (Polizeibehoerden) - Nummerierung pruefen
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sn-por-aufbau
  type: schema_step
  front: 'Aufbau: Rechtmaessigkeit einer Gefahrenabwehrmassnahme nach dem Landesrecht von Sachsen'
  back: 'I. Ermaechtigungsgrundlage (Saechsisches Polizeivollzugsdienstgesetz (SaechsPVDG) und Saechsisches
    Polizeibehoerdengesetz (SaechsPBG) - seit 2019 anstelle des SaechsPolG: Standardmassnahme vor Generalklausel).
    II. Formelle Rechtmaessigkeit: 1. Zustaendigkeit (sachlich: welche Behoerde - Polizeibehoerden (Gemeinden,
    Landkreise, Landesdirektion) nach SaechsPBG; Polizeivollzugsdienst nach SaechsPVDG; oertlich; instanziell),
    2. Verfahren (Anhoerung, § 28 VwVfG bzw. Landesrecht), 3. Form. III. Materielle Rechtmaessigkeit:
    1. Tatbestand (Schutzgut, Gefahrbegriff, Gefahrenprognose ex ante), 2. richtiger Adressat (Stoerer:
    Verhaltens-, Zustands- und Nichtstoerer im SaechsPVDG (Fundstelle pruefen)), 3. Rechtsfolge: Ermessen
    und Verhaeltnismaessigkeit (geeignet, erforderlich, angemessen).'
  norms:
  - § 12 SaechsPVDG (Polizeivollzugsdienst)
  - § 12 SaechsPBG (Polizeibehoerden) - Nummerierung pruefen
  - Verhaltens-, Zustands- und Nichtstoerer im SaechsPVDG (Fundstelle pruefen)
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sn-por-stoerer
  type: norm
  front: Wo sind Verhaltensstoerer, Zustandsstoerer und Nichtstoerer in Sachsen geregelt?
  back: 'Verhaltens-, Zustands- und Nichtstoerer im SaechsPVDG (Fundstelle pruefen). Verhaltensstoerer:
    wer die Gefahr durch sein Verhalten verursacht (Theorie der unmittelbaren Verursachung; Zweckveranlasser
    als Streitfrage). Zustandsstoerer: Inhaber der tatsaechlichen Gewalt bzw. Eigentuemer einer gefaehrlichen
    Sache. Nichtstoerer: Inanspruchnahme nur unter den engen Voraussetzungen des polizeilichen Notstands
    (gegenwaertige erhebliche Gefahr, Stoerer nicht greifbar, Behoerde selbst nicht in der Lage), mit
    Entschaedigungsanspruch.'
  norms:
  - Verhaltens-, Zustands- und Nichtstoerer im SaechsPVDG (Fundstelle pruefen)
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sn-por-zustaendigkeit
  type: definition
  front: Wer ist in Sachsen fuer die Gefahrenabwehr zustaendig - Ordnungs-/Sicherheitsbehoerde oder Polizei?
  back: 'Polizeibehoerden (Gemeinden, Landkreise, Landesdirektion) nach SaechsPBG; Polizeivollzugsdienst
    nach SaechsPVDG. Pruefungsrelevant ist die Abgrenzung: Die allgemeine Gefahrenabwehr liegt grundsaetzlich
    bei den Verwaltungs-/Ordnungsbehoerden; der Polizeivollzugsdienst wird taetig, wenn die Abwehr keinen
    Aufschub duldet (Eilfall) oder eine besondere Zuweisung besteht. Ein Handeln der unzustaendigen Behoerde
    macht die Massnahme formell rechtswidrig.'
  norms:
  - Saechsisches Polizeivollzugsdienstgesetz (SaechsPVDG) und Saechsisches Polizeibehoerdengesetz (SaechsPBG)
    - seit 2019 anstelle des SaechsPolG
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sn-por-vollstreckung
  type: norm
  front: Nach welchem Gesetz wird eine Gefahrenabwehrverfuegung in Sachsen vollstreckt?
  back: 'Saechsisches Verwaltungsvollstreckungsgesetz (SaechsVwVG). Regelfall ist das gestreckte Verfahren:
    Grundverfuegung - Androhung - Festsetzung - Anwendung des Zwangsmittels (Ersatzvornahme, Zwangsgeld,
    unmittelbarer Zwang). Bei Gefahr im Verzug sind Sofortvollzug bzw. unmittelbare Ausfuehrung ohne vorausgehenden
    Verwaltungsakt moeglich; die Kosten traegt der Pflichtige.'
  norms:
  - Saechsisches Verwaltungsvollstreckungsgesetz (SaechsVwVG)
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
