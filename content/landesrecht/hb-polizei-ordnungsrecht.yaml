cards:
- slug: hb-por-generalklausel
  type: norm
  front: Wo steht die polizeiliche Generalklausel in Bremen und was setzt sie voraus?
  back: 'Fundstelle: § 10 Abs. 1 BremPolG. Die Generalklausel ermaechtigt zu den notwendigen Massnahmen,
    um eine im Einzelfall bestehende Gefahr fuer die oeffentliche Sicherheit oder Ordnung abzuwehren.
    Sie ist subsidiaer: Greift eine Standardmassnahme oder ein Spezialgesetz, geht dieses vor. Auf der
    Rechtsfolgenseite besteht Ermessen, begrenzt durch den Grundsatz der Verhaeltnismaessigkeit.'
  norms:
  - § 10 Abs. 1 BremPolG
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: hb-por-aufbau
  type: schema_step
  front: 'Aufbau: Rechtmaessigkeit einer Gefahrenabwehrmassnahme nach dem Landesrecht von Bremen'
  back: 'I. Ermaechtigungsgrundlage (Bremisches Polizeigesetz (BremPolG): Standardmassnahme vor Generalklausel).
    II. Formelle Rechtmaessigkeit: 1. Zustaendigkeit (sachlich: welche Behoerde - Polizeibehoerden (Ortspolizeibehoerden)
    und Polizeivollzugsdienst nach dem BremPolG; oertlich; instanziell), 2. Verfahren (Anhoerung, § 28
    VwVfG bzw. Landesrecht), 3. Form. III. Materielle Rechtmaessigkeit: 1. Tatbestand (Schutzgut, Gefahrbegriff,
    Gefahrenprognose ex ante), 2. richtiger Adressat (Stoerer: §§ 5, 6, 7 BremPolG), 3. Rechtsfolge: Ermessen
    und Verhaeltnismaessigkeit (geeignet, erforderlich, angemessen).'
  norms:
  - § 10 Abs. 1 BremPolG
  - §§ 5, 6, 7 BremPolG
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: hb-por-stoerer
  type: norm
  front: Wo sind Verhaltensstoerer, Zustandsstoerer und Nichtstoerer in Bremen geregelt?
  back: '§§ 5, 6, 7 BremPolG. Verhaltensstoerer: wer die Gefahr durch sein Verhalten verursacht (Theorie
    der unmittelbaren Verursachung; Zweckveranlasser als Streitfrage). Zustandsstoerer: Inhaber der tatsaechlichen
    Gewalt bzw. Eigentuemer einer gefaehrlichen Sache. Nichtstoerer: Inanspruchnahme nur unter den engen
    Voraussetzungen des polizeilichen Notstands (gegenwaertige erhebliche Gefahr, Stoerer nicht greifbar,
    Behoerde selbst nicht in der Lage), mit Entschaedigungsanspruch.'
  norms:
  - §§ 5, 6, 7 BremPolG
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: hb-por-zustaendigkeit
  type: definition
  front: Wer ist in Bremen fuer die Gefahrenabwehr zustaendig - Ordnungs-/Sicherheitsbehoerde oder Polizei?
  back: 'Polizeibehoerden (Ortspolizeibehoerden) und Polizeivollzugsdienst nach dem BremPolG. Pruefungsrelevant
    ist die Abgrenzung: Die allgemeine Gefahrenabwehr liegt grundsaetzlich bei den Verwaltungs-/Ordnungsbehoerden;
    der Polizeivollzugsdienst wird taetig, wenn die Abwehr keinen Aufschub duldet (Eilfall) oder eine
    besondere Zuweisung besteht. Ein Handeln der unzustaendigen Behoerde macht die Massnahme formell rechtswidrig.'
  norms:
  - Bremisches Polizeigesetz (BremPolG)
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: hb-por-vollstreckung
  type: norm
  front: Nach welchem Gesetz wird eine Gefahrenabwehrverfuegung in Bremen vollstreckt?
  back: 'Bremisches Verwaltungsvollstreckungsgesetz (BremVwVG). Regelfall ist das gestreckte Verfahren:
    Grundverfuegung - Androhung - Festsetzung - Anwendung des Zwangsmittels (Ersatzvornahme, Zwangsgeld,
    unmittelbarer Zwang). Bei Gefahr im Verzug sind Sofortvollzug bzw. unmittelbare Ausfuehrung ohne vorausgehenden
    Verwaltungsakt moeglich; die Kosten traegt der Pflichtige.'
  norms:
  - Bremisches Verwaltungsvollstreckungsgesetz (BremVwVG)
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
