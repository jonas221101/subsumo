cards:
- slug: sh-por-generalklausel
  type: norm
  front: Wo steht die polizeiliche Generalklausel in Schleswig-Holstein und was setzt sie voraus?
  back: 'Fundstelle: § 174 LVwG SH. Die Generalklausel ermächtigt zu den notwendigen Maßnahmen, um eine
    im Einzelfall bestehende Gefahr für die öffentliche Sicherheit oder Ordnung abzuwehren. Sie ist subsidiär:
    Greift eine Standardmaßnahme oder ein Spezialgesetz, geht dieses vor. Auf der Rechtsfolgenseite besteht
    Ermessen, begrenzt durch den Grundsatz der Verhältnismäßigkeit. Zum Schutz privater Rechte wird die
    Gefahrenabwehr nur subsidiär tätig: Ein Einschreiten kommt nur in Betracht, wenn gerichtlicher Schutz
    nicht rechtzeitig zu erlangen ist und ohne die Maßnahme die Vereitelung oder wesentliche Erschwerung
    der Rechtsverwirklichung droht.'
  norms:
  - § 174 LVwG SH
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sh-por-aufbau
  type: schema_step
  front: 'Aufbau: Rechtmäßigkeit einer Gefahrenabwehrmaßnahme nach dem Landesrecht von Schleswig-Holstein'
  back: 'I. Ermächtigungsgrundlage (Landesverwaltungsgesetz (LVwG SH), Dritter Teil: Gefahrenabwehr (§§
    162 ff.): Standardmaßnahme vor Generalklausel). II. Formelle Rechtmäßigkeit: 1. Zuständigkeit (sachlich:
    welche Behörde - Ordnungsbehörden und Polizei nach §§ 162 ff. LVwG SH; örtlich; instanziell), 2. Verfahren
    (Anhörung nach dem jeweiligen Landesverwaltungsverfahrensgesetz), 3. Form. III. Materielle Rechtmäßigkeit:
    1. Tatbestand (Schutzgut, Gefahrbegriff, Gefahrenprognose ex ante), 2. richtiger Adressat (Störer:
    §§ 218, 219, 220 LVwG SH), 3. Rechtsfolge: Ermessen und Verhältnismäßigkeit (geeignet, erforderlich,
    angemessen).'
  norms:
  - § 174 LVwG SH
  - §§ 218, 219, 220 LVwG SH
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sh-por-stoerer
  type: norm
  front: Wo sind Verhaltensstörer, Zustandsstörer und Nichtstörer in Schleswig-Holstein geregelt?
  back: '§§ 218, 219, 220 LVwG SH. Verhaltensstörer: wer die Gefahr durch sein Verhalten verursacht (Theorie
    der unmittelbaren Verursachung; Zweckveranlasser als Streitfrage). Zustandsstörer: Inhaber der tatsächlichen
    Gewalt bzw. Eigentümer einer gefährlichen Sache. Nichtstörer: Inanspruchnahme nur unter den engen
    Voraussetzungen des polizeilichen Notstands (gegenwärtige erhebliche Gefahr, Störer nicht greifbar,
    Behörde selbst nicht in der Lage), mit Entschädigungsanspruch.'
  norms:
  - §§ 218, 219, 220 LVwG SH
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sh-por-zustaendigkeit
  type: definition
  front: Wer ist in Schleswig-Holstein für die Gefahrenabwehr zuständig - Ordnungs-/Sicherheitsbehörde
    oder Polizei?
  back: 'Ordnungsbehörden und Polizei nach §§ 162 ff. LVwG SH. Prüfungsrelevant ist die Abgrenzung: Die
    allgemeine Gefahrenabwehr liegt grundsätzlich bei den Verwaltungs-/Ordnungsbehörden; der Polizeivollzugsdienst
    wird tätig, wenn die Abwehr keinen Aufschub duldet (Eilfall) oder eine besondere Zuweisung besteht.
    Ein Handeln der unzuständigen Behörde macht die Maßnahme formell rechtswidrig.'
  norms:
  - 'Landesverwaltungsgesetz (LVwG SH), Dritter Teil: Gefahrenabwehr (§§ 162 ff.)'
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sh-por-vollstreckung
  type: norm
  front: Nach welchem Gesetz wird eine Gefahrenabwehrverfügung in Schleswig-Holstein vollstreckt?
  back: 'Verwaltungszwang nach §§ 228 ff. LVwG SH. Regelfall ist das gestreckte Verfahren: Grundverfügung
    - Androhung - Festsetzung - Anwendung des Zwangsmittels (Ersatzvornahme, Zwangsgeld, unmittelbarer
    Zwang). Bei Gefahr im Verzug sind Sofortvollzug bzw. unmittelbare Ausführung ohne vorausgehenden Verwaltungsakt
    möglich; die Kosten trägt der Pflichtige.'
  norms:
  - Verwaltungszwang nach §§ 228 ff. LVwG SH
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
