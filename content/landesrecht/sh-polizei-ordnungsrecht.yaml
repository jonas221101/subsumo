cards:
- slug: sh-por-generalklausel
  type: norm
  front: Wo steht die polizeiliche Generalklausel in Schleswig-Holstein und was setzt sie voraus?
  back: 'Fundstelle: § 174 LVwG SH. Die Generalklausel ermaechtigt zu den notwendigen Massnahmen, um eine
    im Einzelfall bestehende Gefahr fuer die oeffentliche Sicherheit oder Ordnung abzuwehren. Sie ist
    subsidiaer: Greift eine Standardmassnahme oder ein Spezialgesetz, geht dieses vor. Auf der Rechtsfolgenseite
    besteht Ermessen, begrenzt durch den Grundsatz der Verhaeltnismaessigkeit.'
  norms:
  - § 174 LVwG SH
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sh-por-aufbau
  type: schema_step
  front: 'Aufbau: Rechtmaessigkeit einer Gefahrenabwehrmassnahme nach dem Landesrecht von Schleswig-Holstein'
  back: 'I. Ermaechtigungsgrundlage (Landesverwaltungsgesetz (LVwG SH), Dritter Teil: Gefahrenabwehr (§§
    162 ff.): Standardmassnahme vor Generalklausel). II. Formelle Rechtmaessigkeit: 1. Zustaendigkeit
    (sachlich: welche Behoerde - Ordnungsbehoerden und Polizei nach §§ 162 ff. LVwG SH; oertlich; instanziell),
    2. Verfahren (Anhoerung, § 28 VwVfG bzw. Landesrecht), 3. Form. III. Materielle Rechtmaessigkeit:
    1. Tatbestand (Schutzgut, Gefahrbegriff, Gefahrenprognose ex ante), 2. richtiger Adressat (Stoerer:
    §§ 218, 219, 220 LVwG SH), 3. Rechtsfolge: Ermessen und Verhaeltnismaessigkeit (geeignet, erforderlich,
    angemessen).'
  norms:
  - § 174 LVwG SH
  - §§ 218, 219, 220 LVwG SH
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sh-por-stoerer
  type: norm
  front: Wo sind Verhaltensstoerer, Zustandsstoerer und Nichtstoerer in Schleswig-Holstein geregelt?
  back: '§§ 218, 219, 220 LVwG SH. Verhaltensstoerer: wer die Gefahr durch sein Verhalten verursacht (Theorie
    der unmittelbaren Verursachung; Zweckveranlasser als Streitfrage). Zustandsstoerer: Inhaber der tatsaechlichen
    Gewalt bzw. Eigentuemer einer gefaehrlichen Sache. Nichtstoerer: Inanspruchnahme nur unter den engen
    Voraussetzungen des polizeilichen Notstands (gegenwaertige erhebliche Gefahr, Stoerer nicht greifbar,
    Behoerde selbst nicht in der Lage), mit Entschaedigungsanspruch.'
  norms:
  - §§ 218, 219, 220 LVwG SH
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sh-por-zustaendigkeit
  type: definition
  front: Wer ist in Schleswig-Holstein fuer die Gefahrenabwehr zustaendig - Ordnungs-/Sicherheitsbehoerde
    oder Polizei?
  back: 'Ordnungsbehoerden und Polizei nach §§ 162 ff. LVwG SH. Pruefungsrelevant ist die Abgrenzung:
    Die allgemeine Gefahrenabwehr liegt grundsaetzlich bei den Verwaltungs-/Ordnungsbehoerden; der Polizeivollzugsdienst
    wird taetig, wenn die Abwehr keinen Aufschub duldet (Eilfall) oder eine besondere Zuweisung besteht.
    Ein Handeln der unzustaendigen Behoerde macht die Massnahme formell rechtswidrig.'
  norms:
  - 'Landesverwaltungsgesetz (LVwG SH), Dritter Teil: Gefahrenabwehr (§§ 162 ff.)'
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sh-por-vollstreckung
  type: norm
  front: Nach welchem Gesetz wird eine Gefahrenabwehrverfuegung in Schleswig-Holstein vollstreckt?
  back: 'Verwaltungszwang nach §§ 228 ff. LVwG SH. Regelfall ist das gestreckte Verfahren: Grundverfuegung
    - Androhung - Festsetzung - Anwendung des Zwangsmittels (Ersatzvornahme, Zwangsgeld, unmittelbarer
    Zwang). Bei Gefahr im Verzug sind Sofortvollzug bzw. unmittelbare Ausfuehrung ohne vorausgehenden
    Verwaltungsakt moeglich; die Kosten traegt der Pflichtige.'
  norms:
  - Verwaltungszwang nach §§ 228 ff. LVwG SH
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
