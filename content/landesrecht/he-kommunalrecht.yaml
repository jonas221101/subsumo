cards:
- slug: he-kom-organe
  type: norm
  front: >-
    Welche Organe hat die Gemeinde nach der HGO, und was kennzeichnet die hessische Magistratsverfassung?
  back: >-
    Organe der Gemeinde sind die Gemeindevertretung (in Städten: Stadtverordnetenversammlung) und der
    Gemeindevorstand (in Städten: Magistrat). Die Gemeindevertretung beschließt über die Angelegenheiten der Gemeinde, soweit sich aus der HGO nichts anderes ergibt, und überwacht die gesamte Verwaltung (§ 50 HGO); bestimmte Angelegenheiten kann sie nicht übertragen (§ 51 HGO). Der Gemeindevorstand ist die Verwaltungsbehörde der Gemeinde und besorgt nach den Beschlüssen der Gemeindevertretung die laufende Verwaltung (§§ 65, 66 HGO). Der Bürgermeister wird von den Bürgern direkt gewählt (§ 39 HGO), ist Vorsitzender des Gemeindevorstands (§ 65 Abs. 1 HGO), leitet und beaufsichtigt den Geschäftsgang der gesamten Verwaltung und bereitet die Beschlüsse des Gemeindevorstands vor (§ 70 HGO). Typisch für die hessische Magistratsverfassung ist die kollegiale
    Verwaltungsspitze; der Vorsitzende der Gemeindevertretung ist ein eigenes Amt, nicht der Bürgermeister.
  norms:
  - §§ 50, 51 HGO
  - §§ 65, 66 HGO
  - § 70 HGO
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-10
- slug: he-kom-zustaendigkeit
  type: definition
  front: Wie sind die Zuständigkeiten zwischen Gemeindevertretung und Gemeindevorstand abgegrenzt?
  back: >-
    Die Gemeindevertretung beschließt über die Angelegenheiten der Gemeinde, soweit sich aus der HGO nichts anderes ergibt; sie kann die Beschlussfassung über bestimmte Angelegenheiten auf den Gemeindevorstand oder einen Ausschuss übertragen, nicht aber die in § 51 HGO aufgeführten Angelegenheiten (§ 50 Abs. 1 HGO), zu denen u. a. Satzungen, die Haushaltssatzung und die allgemeinen Grundsätze der Verwaltung gehören. Der Gemeindevorstand ist die Verwaltungsbehörde der Gemeinde; er besorgt nach den Beschlüssen der Gemeindevertretung die laufende Verwaltung und bereitet die Beschlüsse vor und führt sie aus (§ 66 HGO). Handelt ein Organ im Zuständigkeitsbereich des anderen, ist die Maßnahme organschaftlich
    zuständigkeitswidrig; die Wirksamkeit nach außen richtet sich nach den Vertretungsregeln (§ 71 HGO).
  norms:
  - § 50 HGO
  - § 51 HGO
  - § 66 HGO
  - § 71 HGO
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-10
- slug: he-kom-verpflichtung
  type: norm
  front: >-
    Welche Form gilt für Verpflichtungserklärungen der Gemeinde in Hessen und welche Folgen hat ein Formverstoß?
  back: >-
    Erklärungen, durch die die Gemeinde verpflichtet werden soll, bedürfen der Schriftform oder müssen in elektronischer Form mit einer dauerhaft überprüfbaren qualifizierten elektronischen Signatur versehen sein. Sie sind nur rechtsverbindlich, wenn sie vom Bürgermeister oder seinem allgemeinen Vertreter sowie von einem weiteren Mitglied des Gemeindevorstands unterzeichnet sind (§ 71 Abs. 2 HGO). Das gilt nicht für Geschäfte der laufenden Verwaltung, die für die Gemeinde von nicht erheblicher Bedeutung sind, und für Erklärungen eines ausdrücklich Beauftragten, wenn die Vollmacht in dieser Form erteilt ist. Wird die Form nicht beachtet, fehlt dem Vertreter die Vertretungsmacht; der
    Vertrag ist nach h. M. schwebend unwirksam und kann formgerecht genehmigt werden (§ 177 BGB analog).
    Ein Vertrauensschutz des Vertragspartners besteht nicht, weil die Formvorschrift die Gemeinde schützen
    soll und für jedermann erkennbar ist; auch Treu und Glauben (§ 242 BGB) hilft nur in Ausnahmefällen.
    Gleiches gilt für öffentlich-rechtliche Verträge.
  norms:
  - § 71 HGO
  - § 177 BGB
  - § 242 BGB
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-10
- slug: he-kom-befangenheit
  type: norm
  front: >-
    Wann ist ein Mitglied der Gemeindevertretung wegen Widerstreits der Interessen ausgeschlossen?
  back: >-
    Nach § 25 HGO (Widerstreit der Interessen) darf ein ehrenamtlich Tätiger nicht beraten und entscheiden,
    wenn die Entscheidung ihm selbst, einem Angehörigen oder einer von ihm vertretenen natürlichen oder
    juristischen Person einen unmittelbaren Vorteil oder Nachteil bringen kann. Es genügt die Möglichkeit eines unmittelbaren Vorteils oder Nachteils; auf tatsächliche Beeinflussung kommt es nicht an. Nicht erfasst ist, wer nur als Angehöriger einer Berufs- oder Bevölkerungsgruppe beteiligt ist, deren gemeinsame Interessen berührt werden (§ 25 Abs. 1 S. 2 HGO). Das Mitglied hat die Befangenheit vorher mitzuteilen und muss den Beratungsraum verlassen (§ 25 Abs. 4 HGO). Beschlüsse, die unter Verletzung des Mitwirkungsverbots gefasst wurden, sind unwirksam; sie gelten jedoch sechs Monate nach der Beschlussfassung (bei erforderlicher Bekanntmachung nach dieser) als von Anfang an wirksam zustande gekommen, wenn nicht vorher der Gemeindevorstand oder der Bürgermeister widersprochen oder die Aufsichtsbehörde beanstandet hat (§ 25 Abs. 6 HGO). Eine Kausalitätsklausel enthält § 25 Abs. 6 HGO nicht.
  norms:
  - § 25 HGO
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-10
- slug: he-kom-satzung
  type: norm
  front: Wie entsteht eine wirksame Gemeindesatzung in Hessen?
  back: >-
    Die Gemeinde kann ihre Angelegenheiten durch Satzung regeln, soweit Gesetze nichts anderes bestimmen
    (§ 5 HGO; Art. 28 Abs. 2 GG, Art. 137 HV). Eingriffe in Freiheit und Eigentum der Bürger erfordern
    eine gesetzliche Ermächtigung (Wesentlichkeitstheorie). Formell sind Beschluss der Gemeindevertretung,
    Ausfertigung und öffentliche Bekanntmachung nötig; Satzungen sind auszufertigen und öffentlich bekannt zu machen (§ 5 Abs. 3 HGO). Für die Rechtswirksamkeit ist die Verletzung der in § 5 Abs. 4 HGO abschließend genannten Vorschriften (§§ 4c, 8c, 53, 56, 58, 82 Abs. 3 und 88 Abs. 2 HGO) unbeachtlich, wenn sie nicht innerhalb von sechs Monaten nach der öffentlichen Bekanntmachung schriftlich unter Bezeichnung der Tatsachen gegenüber der Gemeinde geltend gemacht worden ist; sonstige Fehler, etwa bei Ausfertigung und Bekanntmachung, werden davon nicht erfasst. Materielle Fehler werden nicht geheilt. Rechtsschutz: Inzidentkontrolle; die Normenkontrolle
    nach § 47 Abs. 1 Nr. 2 VwGO setzt eine landesrechtliche Bestimmung voraus; sie ist in § 15 HessAGVwGO enthalten (Verwaltungsgerichtshof, auch für Rechtsvorschriften außerhalb des § 47 Abs. 1 Nr. 1 VwGO), bei Satzungen nach dem
    BauGB gilt § 47 Abs. 1 Nr. 1 VwGO.
  norms:
  - § 5 HGO
  - Art. 28 Abs. 2 GG
  - § 47 VwGO
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-10
- slug: he-kom-einrichtung
  type: norm
  front: >-
    Unter welchen Voraussetzungen besteht ein Anspruch auf Benutzung öffentlicher Einrichtungen?
  back: >-
    Die Gemeinde schafft die für das wirtschaftliche, soziale und kulturelle Wohl ihrer Einwohner erforderlichen
    öffentlichen Einrichtungen (§ 19 HGO). Die Einwohner sind im Rahmen der bestehenden Vorschriften berechtigt,
    diese Einrichtungen zu benutzen (§ 20 HGO). Der Anspruch ist durch Widmung und Kapazität begrenzt;
    Gleichheitssatz und bei Parteien § 5 PartG begrenzen die Auswahl. Allein die politische Richtung einer
    nicht verbotenen Partei rechtfertigt keinen Ausschluss. Das Ob der Zulassung ist öffentlich-rechtlich
    (Verwaltungsakt), das Wie kann privatrechtlich geregelt werden (Zweistufentheorie). Grundbesitzer und Gewerbetreibende ohne Wohnsitz in der Gemeinde sind nach § 20 Abs. 2 HGO, juristische Personen und Personenvereinigungen nach § 20 Abs. 3 HGO entsprechend berechtigt.
  norms:
  - § 19 HGO
  - § 20 HGO
  - Art. 3 Abs. 1 GG
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-10
- slug: he-kom-aufsicht
  type: definition
  front: Welche Aufsichtsformen und -mittel kennt die HGO?
  back: >-
    Die Aufsicht des Staates soll sicherstellen, dass die Gemeinden im Einklang mit den Gesetzen verwaltet werden und dass die im Rahmen der Gesetze erteilten Weisungen befolgt werden (§ 135 HGO); Aufsichtsbehörden regelt § 136 HGO (§§ 135 ff. HGO). Aufsichtsbehörden sind je nach Gemeindeart und
    Aufsichtsstufe der Landrat, das Regierungspräsidium und das Ministerium des Innern. Die Aufsicht prüft
    die Rechtmäßigkeit, nicht die Zweckmäßigkeit. Mittel sind Informationsrecht, Beanstandung rechtswidriger
    Beschlüsse, Anordnung, Ersatzvornahme und Bestellung eines Beauftragten. Das Einschreiten steht im
    Ermessen; Dritte haben keinen Anspruch auf aufsichtliches Einschreiten. Die Gemeinde kann sich gegen
    Aufsichtsmaßnahmen auf Art. 28 Abs. 2 GG berufen und klagen.
  norms:
  - §§ 135 ff. HGO
  - Art. 28 Abs. 2 GG
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-10
- slug: he-kom-kommunalverfassungsstreit
  type: streitstand
  front: >-
    Wie sind Zulässigkeit und richtiger Beklagter im hessischen Kommunalverfassungsstreit zu prüfen?
  back: >-
    Streitet etwa eine Fraktion mit dem Vorsitzenden der Stadtverordnetenversammlung um Rederecht oder
    Tagesordnung, ist der Verwaltungsrechtsweg als nichtverfassungsrechtliche Streitigkeit nach § 40 Abs.
    1 VwGO eröffnet. Mangels Verwaltungsakt kommen Feststellungs- oder allgemeine Leistungsklage in Betracht.
    Die Fraktion ist als Organteil analog § 61 Nr. 2 VwGO beteiligtenfähig; nach h. M. muss sie analog
    § 42 Abs. 2 VwGO die Verletzung eigener organschaftlicher Rechte geltend machen, nicht Rechte der
    Gemeinde oder anderer Organe. Beklagter ist der Amtsträger oder das Organ, das das Recht bestreitet.
    Die Gegenansicht verzichtet auf die Analogie und verlangt ein allgemeines Rechtsschutzbedürfnis. Ein
    Vorverfahren findet mangels Verwaltungsakt nicht statt.
  norms:
  - § 40 Abs. 1 VwGO
  - § 42 Abs. 2 VwGO analog
  - § 61 VwGO
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-10
- slug: he-kom-aufbau
  type: schema_step
  front: 'Aufbau: Wirksamkeit eines von der Gemeinde geschlossenen Vertrags'
  back: >-
    I. Vertragsschluss, Vertretung: Angebot und Annahme (§§ 145 ff. BGB). II. Vertretungsmacht des Handelnden:
    Organ, Zuständigkeit, Form der Verpflichtungserklärung (§ 71 HGO). III. Rechtsfolge bei Formverstoß:
    Fehlen der Vertretungsmacht, schwebende Unwirksamkeit (§ 177 BGB analog), Genehmigung durch das zuständige
    Organ. IV. Kein Vertrauensschutz, keine Rechtsscheinhaftung.
  norms:
  - § 71 HGO
  - § 177 BGB
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-10
schemata:
- slug: he-schema-kom-vertretung
  title: Wirksamkeit gemeindlicher Verpflichtungserklärungen in Hessen
  norms:
  - § 71 HGO
  - § 177 BGB
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  steps:
  - label: I. Vertragsschluss
    hinweis: Angebot und Annahme; Vertrag der Gemeinde mit Privaten.
  - label: II. Vertretung der Gemeinde
    children:
    - label: '1. Handelnder: Bürgermeister oder Vertreter, Gemeindevorstand als Organ'
    - label: 2. Innenzuständigkeit (Gemeindevertretung vs. Gemeindevorstand)
    - label: >-
        3. Form: Schriftform (oder qualifiziert signierte elektronische Form) und Unterschrift von zwei Vertretungsberechtigten, § 71 Abs. 2 HGO
    - label: '4. Ausnahme: Geschäfte der laufenden Verwaltung'
  - label: III. Rechtsfolge eines Formverstoßes
    hinweis: Vertretungsmacht fehlt; schwebende Unwirksamkeit, § 177 BGB analog.
  - label: IV. Kein Vertrauensschutz
    hinweis: Rechtsscheinhaftung scheidet aus; § 242 BGB nur in engen Ausnahmen.
  stand: 2026-10
faelle:
- slug: he-fall-kom-verpflichtungserklaerung
  title: Der Beratungsvertrag des Bürgermeisters
  difficulty: 3
  minutes: 45
  quellen:
  - Eigener Sachverhalt der Redaktion
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  facts: >-
    Der Bürgermeister B der hessischen Gemeinde G unterzeichnet allein und handschriftlich einen schriftlichen
    Vertrag mit der Beratungsfirma F über eine umfangreiche Organisationsberatung für 180.000 Euro. Die
    Unterschrift eines weiteren Mitglieds des Gemeindevorstands fehlt. Der Vertrag betrifft kein Geschäft
    der laufenden Verwaltung. Der Gemeindevorstand hatte die Beauftragung zuvor beschlossen. Nach Abschluss
    der Beratung verweigert G die Zahlung mit der Begründung, der Vertrag sei wegen des Formverstoßes
    unwirksam. F verlangt Zahlung der Vergütung aus dem Vertrag.
  question: Kann F von G die vertraglich vereinbarte Vergütung verlangen?
  steps:
  - prompt: Was ist die Anspruchsgrundlage und was ist problematisch?
    erwartung: >-
      § 631 Abs. 1 bzw. § 611 BGB (Dienst-/Werkvertrag); fraglich ist die Wirksamkeit der Vertretung der
      Gemeinde durch B.
  - prompt: Hat B Vertretungsmacht?
    erwartung: >-
      Die Vertretungsmacht des Bürgermeisters bemisst sich nach der Formvorschrift des § 71 HGO. Erforderlich
      sind Schriftform und zwei Unterschriften, nämlich die Unterschrift des Bürgermeisters und die eines weiteren Mitglieds des Gemeindevorstands, sofern kein Geschäft der laufenden Verwaltung
      vorliegt. B hat allein unterzeichnet und die Form nicht eingehalten. Damit liegt ein Formverstoß
      vor, und B hatte deshalb keine Vertretungsmacht.
  - prompt: Folgen des Formverstoßes?
    erwartung: >-
      Der Vertrag ist schwebend unwirksam (§ 177 BGB analog) und wird erst durch formgerechte Genehmigung
      wirksam. Der Beschluss des Gemeindevorstands ersetzt die Form nicht. Eine Genehmigung liegt nicht
      vor; G verweigert sie.
  - prompt: Kommt Vertrauensschutz in Betracht?
    erwartung: >-
      Nein. Die Formvorschrift schützt die Gemeinde und ist für jedermann erkennbar; F musste sich über
      die Vertretungsregeln informieren. Eine Rechtsscheinhaftung scheidet aus. Ein Zahlungsanspruch aus
      dem Vertrag besteht nicht.
  expectation:
    pruefpunkte:
    - id: p1
      label: Vertretungsmacht des Bürgermeisters an § 71 HGO gemessen
      weight: 2.5
      required: true
      norms:
      - § 71 HGO
      keywords:
      - § 71 HGO
      - Vertretungsmacht
      - Verpflichtungserklärung
      - Bürgermeister
