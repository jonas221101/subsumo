cards:
- slug: ni-lra-vwvfg
  type: norm
  front: Welches Verwaltungsverfahrensgesetz gilt für Landesbehörden in Niedersachsen?
  back: Niedersächsisches Verwaltungsverfahrensgesetz (NVwVfG) - Verweisung auf das VwVfG des Bundes.
    Das VwVfG des Bundes gilt nur für Bundesbehörden (§ 1 VwVfG); für Landes- und Kommunalbehörden ist
    das Landesgesetz maßgeblich. Bei Verweisungsgesetzen werden die Bundesnormen 'entsprechend' angewendet
    und sind so zu zitieren (z. B. '§ 35 VwVfG i. V. m. § 1 des Landesgesetzes'), bei Vollgesetzen ist
    die Landesnorm selbst zu zitieren.
  norms:
  - Niedersächsisches Verwaltungsverfahrensgesetz (NVwVfG) - Verweisung auf das VwVfG des Bundes
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: ni-lra-verfassungsgericht
  type: norm
  front: Welche Verfahren stehen vor dem Niedersächsischen Staatsgerichtshof offen und wie verhält sich
    das zur Verfassungsbeschwerde zum BVerfG?
  back: Zuständig ist der Niedersächsische Staatsgerichtshof (Bückeburg) auf Grundlage von Art. 54 der Niedersächsischen Verfassung (NV) und des Gesetzes über den Staatsgerichtshof (NStGHG, dort § 8). Er entscheidet unter anderem in Organstreitigkeiten,
    in abstrakten und konkreten Normenkontrollverfahren, in Wahlprüfungssachen und über kommunale Verfassungsbeschwerden
    von Gemeinden und Landkreisen wegen Verletzung des Selbstverwaltungsrechts durch ein Landesgesetz (Art. 54 Nr. 5 NV). Eine allgemeine Individualverfassungsbeschwerde
    von Bürgerinnen und Bürgern zum Staatsgerichtshof sieht das niedersächsische Landesrecht nicht vor.
    Grundrechtsschutz gegen Akte der Landesstaatsgewalt erlangt der Einzelne daher über die Verfassungsbeschwerde
    zum Bundesverfassungsgericht nach Art. 93 Abs. 1 Nr. 4a GG. In der Klausur ist deshalb bei einer niedersächsischen
    Grundrechtsrüge regelmäßig die Bundesverfassungsbeschwerde zu prüfen.
  norms:
  - Art. 54 NV
  - Art. 93 Abs. 1 Nr. 4a GG
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-10
- slug: ni-lra-kommunalverfassung
  type: norm
  front: Welches Gesetz regelt die Kommunalverfassung in Niedersachsen und welche Hauptorgane hat die
    Gemeinde?
  back: 'Niedersächsisches Kommunalverfassungsgesetz (NKomVG): Hauptorgane der Gemeinde sind die Vertretung
    (Rat), der Hauptausschuss (früher Verwaltungsausschuss) und die Hauptverwaltungsbeamtin bzw. der Hauptverwaltungsbeamte
    (Bürgermeister). Der Rat trifft die grundlegenden Entscheidungen, der Hauptausschuss bereitet sie
    vor und entscheidet in den ihm zugewiesenen Angelegenheiten, der Hauptverwaltungsbeamte leitet die
    Verwaltung und vertritt die Gemeinde nach außen. Grundlage ist die Selbstverwaltungsgarantie (Art.
    28 Abs. 2 GG und Landesverfassung): eigenverantwortliche Regelung aller Angelegenheiten der örtlichen
    Gemeinschaft. Klausurklassiker: Zuständigkeitsstreit zwischen Vertretung und Verwaltungsspitze, Kommunalverfassungsstreit,
    Rechtsaufsicht.'
  norms:
  - Niedersächsisches Kommunalverfassungsgesetz (NKomVG)
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: ni-lra-bauordnung
  type: norm
  front: Wie heißt die Bauordnung in Niedersachsen und wie ist eine Baugenehmigung zu prüfen?
  back: Niedersächsische Bauordnung (NBauO). Ein Anspruch auf Baugenehmigung besteht, wenn dem Vorhaben
    keine öffentlich-rechtlichen Vorschriften entgegenstehen. Zu prüfen sind die Genehmigungsbedürftigkeit
    (Errichtung, Änderung, Nutzungsänderung; keine Verfahrensfreiheit), die bauplanungsrechtliche Zulässigkeit
    nach §§ 29 ff. BauGB (Bundesrecht) und die bauordnungsrechtliche Zulässigkeit nach der NBauO (Grenzabstände, Gestaltung, Stellplätze), soweit das jeweilige Verfahren sie zum Prüfprogramm macht. Die Baugenehmigung
    ergeht unbeschadet der Rechte Dritter; bei Ablehnung ist die Verpflichtungsklage statthaft.
  norms:
  - Niedersächsische Bauordnung (NBauO)
  - §§ 29 ff. BauGB
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: ni-lra-pflichtstoff
  type: definition
  front: Welche Landesrechtsgebiete gehören in Niedersachsen zum Pflichtstoff des Öffentlichen Rechts?
  back: Zum Pflichtstoff des Öffentlichen Rechts gehören in Niedersachsen das Polizei- und Ordnungsrecht
    (Niedersächsisches Polizei- und Ordnungsbehördengesetz, NPOG), das Kommunalrecht (NKomVG) und das
    Bauordnungsrecht (NBauO). Landesrecht wird im Examen fast nie isoliert geprüft, sondern in eine verwaltungsprozessuale
    Einkleidung eingebettet (Anfechtungs- oder Verpflichtungsklage, vorläufiger Rechtsschutz). Die Landesnorm
    liefert dann die Ermächtigungsgrundlage oder den Zuständigkeits- und Verfahrensmaßstab, der Aufbau
    bleibt der allgemeine.
  norms: []
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
