cards:
- slug: ni-lra-vwvfg
  type: norm
  front: Welches Verwaltungsverfahrensgesetz gilt für Landesbehörden in Niedersachsen?
  back: Niedersächsisches Verwaltungsverfahrensgesetz (NVwVfG) - Verweisung auf das VwVfG des Bundes.
    Das VwVfG des Bundes gilt nur für Bundesbehörden (§ 1 VwVfG); für Landes- und Kommunalbehörden ist
    das Landesgesetz maßgeblich. Bei Verweisungsgesetzen werden die Bundesnormen 'entsprechend' angewendet
    und sind so zu zitieren (z. B. '§ 35 VwVfG i. V. m. § 1 des Landesgesetzes'), bei Vollgesetzen ist
    die Landesnorm selbst zu zitieren.
  norms:
  - Niedersächsisches Verwaltungsverfahrensgesetz (NVwVfG) - Verweisung auf das VwVfG des Bundes
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: ni-lra-verfassungsgericht
  type: norm
  front: Welche Verfahren stehen vor dem Niedersächsischen Staatsgerichtshof offen und wie verhält sich das zur Verfassungsbeschwerde zum BVerfG?
  back: 'Zuständiges Gericht ist der Niedersächsische Staatsgerichtshof auf Grundlage der Niedersächsischen Verfassung (NV). Er entscheidet u. a. in Organstreitigkeiten, in Normenkontrollverfahren und über kommunale Verfassungsbeschwerden; Prüfungsmaßstab ist die Landesverfassung, Bundesrecht nur, soweit die Landesverfassung darauf verweist. Ob und in welchem Umfang einzelne Bürger Landesgrundrechte mit einer Individualverfassungsbeschwerde geltend machen können, richtet sich nach der NV und dem Gesetz über den Staatsgerichtshof und ist dort nachzulesen (redaktionell zu verifizieren). Daneben steht immer die Verfassungsbeschwerde zum BVerfG (Art. 93 Abs. 1 Nr. 4a GG), die gegenüber Landesverfassungsrechtsbehelfen eigenständig ist.'
  norms:
  - Niedersächsische Verfassung (NV)
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-10
- slug: ni-lra-kommunalverfassung
  type: norm
  front: Welches Gesetz regelt die Kommunalverfassung in Niedersachsen und welche Hauptorgane hat die
    Gemeinde?
  back: 'Niedersächsisches Kommunalverfassungsgesetz (NKomVG): Rat (§ 45), Verwaltungsausschuss (§ 74)
    und Hauptverwaltungsbeamter (§ 80). Grundlage ist die Selbstverwaltungsgarantie (Art. 28 Abs. 2 GG
    und Landesverfassung): eigenverantwortliche Regelung aller Angelegenheiten der örtlichen Gemeinschaft.
    Klausurklassiker: Zuständigkeitsstreit zwischen Vertretung und Verwaltungsspitze, Kommunalverfassungsstreit,
    Rechtsaufsicht.'
  norms:
  - 'Niedersächsisches Kommunalverfassungsgesetz (NKomVG): Rat (§ 45), Verwaltungsausschuss (§ 74) und
    Hauptverwaltungsbeamter (§ 80)'
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: ni-lra-bauordnung
  type: norm
  front: Wie heißt die Bauordnung in Niedersachsen und wie ist eine Baugenehmigung zu prüfen?
  back: 'Niedersächsische Bauordnung (NBauO). Anspruch auf Baugenehmigung besteht, wenn dem Vorhaben keine
    öffentlich-rechtlichen Vorschriften entgegenstehen: Genehmigungsbedürftigkeit (Errichtung, Änderung,
    Nutzungsänderung), keine Genehmigungsfreiheit, bauplanungsrechtliche Zulässigkeit nach §§ 29 ff. BauGB
    (Bundesrecht), bauordnungsrechtliche Zulässigkeit nach der Landesbauordnung (Abstandsflächen, Gestaltung,
    Stellplätze).'
  norms:
  - Niedersächsische Bauordnung (NBauO)
  - §§ 29 ff. BauGB
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: ni-lra-pflichtstoff
  type: definition
  front: Welche Landesrechtsgebiete gehören in Niedersachsen zum Pflichtstoff des Öffentlichen Rechts?
  back: Polizei- und Ordnungsrecht (NPOG); Kommunalrecht (NKomVG); Bauordnungsrecht (NBauO). Landesrecht
    wird im Examen fast nie isoliert, sondern eingebettet in eine verwaltungsprozessuale Einkleidung (Anfechtungs-/Verpflichtungsklage,
    vorläufiger Rechtsschutz) geprüft - die Landesnorm ist die Ermächtigungsgrundlage, der Aufbau bleibt
    der allgemeine.
  norms: []
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
