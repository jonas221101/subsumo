cards:
- slug: ni-lra-vwvfg
  type: norm
  front: Welches Verwaltungsverfahrensgesetz gilt fuer Landesbehoerden in Niedersachsen?
  back: Niedersaechsisches Verwaltungsverfahrensgesetz (NVwVfG) - Verweisung auf das VwVfG des Bundes.
    Das VwVfG des Bundes gilt nur fuer Bundesbehoerden (§ 1 VwVfG); fuer Landes- und Kommunalbehoerden
    ist das Landesgesetz massgeblich. Bei Verweisungsgesetzen werden die Bundesnormen 'entsprechend' angewendet
    und sind so zu zitieren (z. B. '§ 35 VwVfG i. V. m. § 1 des Landesgesetzes'), bei Vollgesetzen ist
    die Landesnorm selbst zu zitieren.
  norms:
  - Niedersaechsisches Verwaltungsverfahrensgesetz (NVwVfG) - Verweisung auf das VwVfG des Bundes
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: ni-lra-verfassungsgericht
  type: norm
  front: Gibt es in Niedersachsen eine Individualverfassungsbeschwerde zum Landesverfassungsgericht?
  back: 'Nein - keine Individualverfassungsbeschwerde zum Staatsgerichtshof. Zustaendiges Gericht: Niedersaechsischer
    Staatsgerichtshof auf Grundlage der Niedersaechsische Verfassung (NV). Verfahrensgegenstand ist nur
    die Verletzung von Landesgrundrechten durch Landesstaatsgewalt; Bundesrecht ist Pruefungsmassstab
    nur, soweit die Landesverfassung darauf verweist. Daneben steht immer die Verfassungsbeschwerde zum
    BVerfG (Art. 93 Abs. 1 Nr. 4a GG).'
  norms:
  - Niedersaechsische Verfassung (NV)
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: ni-lra-kommunalverfassung
  type: norm
  front: Welches Gesetz regelt die Kommunalverfassung in Niedersachsen und welche Hauptorgane hat die
    Gemeinde?
  back: 'Niedersaechsisches Kommunalverfassungsgesetz (NKomVG): Rat (§ 45), Verwaltungsausschuss (§ 74)
    und Hauptverwaltungsbeamter (§ 80). Grundlage ist die Selbstverwaltungsgarantie (Art. 28 Abs. 2 GG
    und Landesverfassung): eigenverantwortliche Regelung aller Angelegenheiten der oertlichen Gemeinschaft.
    Klausurklassiker: Zustaendigkeitsstreit zwischen Vertretung und Verwaltungsspitze, Kommunalverfassungsstreit,
    Rechtsaufsicht.'
  norms:
  - 'Niedersaechsisches Kommunalverfassungsgesetz (NKomVG): Rat (§ 45), Verwaltungsausschuss (§ 74) und
    Hauptverwaltungsbeamter (§ 80)'
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: ni-lra-bauordnung
  type: norm
  front: Wie heisst die Bauordnung in Niedersachsen und wie ist eine Baugenehmigung zu pruefen?
  back: 'Niedersaechsische Bauordnung (NBauO). Anspruch auf Baugenehmigung besteht, wenn dem Vorhaben
    keine oeffentlich-rechtlichen Vorschriften entgegenstehen: Genehmigungs-beduerftigkeit (Errichtung,
    Aenderung, Nutzungsaenderung), keine Genehmigungsfreiheit, bauplanungsrechtliche Zulaessigkeit nach
    §§ 29 ff. BauGB (Bundesrecht), bauordnungsrechtliche Zulaessigkeit nach der Landesbauordnung (Abstandsflaechen,
    Gestaltung, Stellplaetze).'
  norms:
  - Niedersaechsische Bauordnung (NBauO)
  - §§ 29 ff. BauGB
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: ni-lra-pflichtstoff
  type: definition
  front: Welche Landesrechtsgebiete gehoeren in Niedersachsen zum Pflichtstoff des Oeffentlichen Rechts?
  back: Polizei- und Ordnungsrecht (NPOG); Kommunalrecht (NKomVG); Bauordnungsrecht (NBauO). Landesrecht
    wird im Examen fast nie isoliert, sondern eingebettet in eine verwaltungsprozessuale Einkleidung (Anfechtungs-/Verpflichtungsklage,
    vorlaeufiger Rechtsschutz) geprueft - die Landesnorm ist die Ermaechtigungsgrundlage, der Aufbau bleibt
    der allgemeine.
  norms: []
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
