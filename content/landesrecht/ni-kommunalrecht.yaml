cards:
- slug: ni-kr-selbstverwaltung
  type: norm
  front: Was gewährleistet die kommunale Selbstverwaltung in Niedersachsen und woraus folgt sie?
  back: >-
    Die Gemeinden haben das Recht, alle Angelegenheiten der örtlichen Gemeinschaft im Rahmen der Gesetze
    in eigener Verantwortung zu regeln (Art. 28 Abs. 2 S. 1 GG; Art. 57 NV). Man unterscheidet die Rechtssubjektsgarantie,
    die Rechtsinstitutionsgarantie und die subjektive Rechtsstellungsgarantie. Inhaltlich umfasst die
    Garantie die Gemeindehoheiten (Gebiets-, Organisations-, Personal-, Planungs-, Rechtsetzungs- und
    Finanzhoheit). Gesetzliche Eingriffe sind zulässig, wenn sie den Kernbereich wahren und im Randbereich
    verhältnismäßig sind. Die Gemeinde kann sich gegen Eingriffe mit der Kommunalverfassungsbeschwerde
    (Art. 93 Abs. 1 Nr. 4b GG) und, soweit vorgesehen, vor dem Niedersächsischen Staatsgerichtshof wehren (kommunale Verfassungsbeschwerde gegen Landesgesetze, Art. 54 Nr. 5 NV).
  norms:
  - Art. 28 Abs. 2 S. 1 GG
  - Art. 93 Abs. 1 Nr. 4b GG
  - Art. 57 NV
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-10
- slug: ni-kr-rastede
  type: rechtsprechung
  front: >-
    Wie ist die gesetzliche Verlagerung einer Gemeindeaufgabe auf Kreis- oder Landesebene am Rastede-Maßstab
    zu prüfen?
  back: >-
    Wird eine Aufgabe der örtlichen Gemeinschaft durch Gesetz der Gemeinde entzogen, ist der Schutzbereich
    des Art. 28 Abs. 2 S. 1 GG und des Art. 57 NV eröffnet. Nach BVerfGE 79, 127 (Rastede) besteht eine
    Zuständigkeitsvermutung zugunsten der Gemeinde. Der Entzug ist nur aus Gründen des Gemeinwohls zulässig,
    insbesondere wenn eine ordnungsgemäße Aufgabenwahrnehmung auf Gemeindeebene sonst nicht gewährleistet
    wäre; bloße Verwaltungsvereinfachung oder Wirtschaftlichkeitserwägungen genügen nicht. Im Kernbereich
    gilt eine absolute Schranke, im Randbereich das Verhältnismäßigkeitsprinzip. Dem Gesetzgeber steht
    bei der Einschätzung ein Spielraum zu, der gerichtlich nur eingeschränkt überprüfbar ist. Rechtsschutz:
    Kommunalverfassungsbeschwerde nach Art. 93 Abs. 1 Nr. 4b GG oder landesverfassungsrechtliche Rechtsbehelfe.
  norms:
  - Art. 28 Abs. 2 S. 1 GG
  quellen:
  - 'Rechtsprechung: BVerfGE 79, 127 (Rastede)'
  - Eigenformulierung Redaktion
  stand: 2026-10
- slug: ni-kr-organe
  type: norm
  front: Welche Organe hat die Kommune nach dem NKomVG und wie ist die Einheitsspitze ausgestaltet?
  back: >-
    Das NKomVG folgt dem Modell der Einheitsspitze. Hauptorgane sind die Vertretung (Rat in Gemeinden
    und Städten, Kreistag im Landkreis; § 45 NKomVG), der Hauptausschuss (§§ 74, 76 NKomVG) und die Hauptverwaltungsbeamtin
    bzw. der Hauptverwaltungsbeamte (§ 80 NKomVG; Bürgermeister, Oberbürgermeister, Landrat). Der Rat
    ist das oberste Willensbildungsorgan, der Hauptausschuss bereitet die Beschlüsse der Vertretung vor (§ 76 Abs. 1 NKomVG) und
    entscheidet in den ihm zugewiesenen Angelegenheiten, der Hauptverwaltungsbeamte leitet und beaufsichtigt die Verwaltung (§ 85 Abs. 3 NKomVG) und vertritt die Kommune nach außen (§ 86 NKomVG). Besonderheit: Mehrere Mitgliedsgemeinden können eine Samtgemeinde bilden,
    die bestimmte Aufgaben für ihre Mitgliedsgemeinden wahrnimmt.
  norms:
  - Niedersächsisches Kommunalverfassungsgesetz (NKomVG)
  - § 45 NKomVG
  - § 74 NKomVG
  - § 76 NKomVG
  - § 80 NKomVG
  - § 85 Abs. 3 NKomVG
  - § 86 NKomVG
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-10
- slug: ni-kr-zustaendigkeit
  type: definition
  front: >-
    Wie werden in Niedersachsen die Zuständigkeiten zwischen Vertretung und Verwaltungsspitze abgegrenzt?
  back: >-
    Die Vertretung beschließt nach § 58 Abs. 1 NKomVG ausschließlich über die dort aufgezählten Angelegenheiten, u. a. grundlegende Ziele der Entwicklung der Kommune, Satzungen und Verordnungen, öffentliche Abgaben, die Haushaltssatzung, die Errichtung und Beteiligung an Unternehmen sowie die Verfügung über Vermögen;
    sie kann ihr Weisungs- und Kontrollrecht gegenüber der Verwaltung ausüben. Der Hauptausschuss (§ 76 Abs. 2 NKomVG) beschließt über die Angelegenheiten, für die weder die Vertretung noch (soweit vorhanden) Stadtbezirksrat, Ortsrat oder Betriebsausschuss noch nach § 85 der Hauptverwaltungsbeamte zuständig ist. Der Hauptverwaltungsbeamte (§ 85 NKomVG) bereitet die Beschlüsse vor, führt sie aus, leitet und beaufsichtigt die Verwaltung und ist u. a. für die ihm in § 85 Abs. 1 zugewiesenen Angelegenheiten zuständig. Die Abgrenzung wird in der Hauptsatzung
    konkretisiert. Ein Handeln des unzuständigen Organs macht die Entscheidung formell rechtswidrig.
  norms:
  - § 58 NKomVG
  - § 76 NKomVG
  - § 85 NKomVG
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-10
- slug: ni-kr-satzung
  type: definition
  front: Unter welchen Voraussetzungen ist eine gemeindliche Satzung in Niedersachsen rechtmäßig?
  back: >-
    Eine Satzung ist eine von der Gemeinde im Rahmen ihrer Selbstverwaltung erlassene Rechtsnorm (Art.
    28 Abs. 2 GG). Prüfung: (1) Ermächtigungsgrundlage: Die allgemeine Satzungsbefugnis (§ 10 Abs. 1 NKomVG) genügt für Regelungen ohne Grundrechtseingriff gegenüber Außenstehenden; Eingriffe in Grundrechte
    und Abgabenpflichten erfordern wegen des Vorbehalts des Gesetzes eine besondere gesetzliche Ermächtigung
    (Wesentlichkeitslehre). (2) Formelle Rechtmäßigkeit: Zuständigkeit der Vertretung (§ 58 Abs. 1 Nr. 5 NKomVG), ordnungsgemäßer
    Beschluss, Ausfertigung und Bekanntmachung. (3) Materielle Rechtmäßigkeit: Vereinbarkeit mit höherrangigem
    Recht, Bestimmtheit, Verhältnismäßigkeit und Gleichheitssatz. Rechtsschutz: Inzidentkontrolle oder Normenkontrolle nach § 47 Abs. 1 Nr. 2 VwGO i. V. m. § 75 NJG (Niedersachsen sieht die Normenkontrolle gegen untergesetzliche Rechtsvorschriften vor).
  norms:
  - Art. 28 Abs. 2 GG
  - § 47 VwGO
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-10
- slug: ni-kr-mitwirkungsverbot
  type: norm
  front: Wann gilt in Niedersachsen ein Mitwirkungsverbot für Ratsmitglieder?
  back: >-
    Nach § 41 Abs. 1 NKomVG dürfen ehrenamtlich Tätige (auch Abgeordnete der Vertretung) weder beratend noch entscheidend mitwirken, wenn die Entscheidung ihnen selbst, ihrem Ehegatten oder Lebenspartner, ihren Verwandten bis zum dritten oder Verschwägerten bis zum zweiten Grad (letztere während des Bestehens der Ehe oder Lebenspartnerschaft) oder einer von ihnen kraft Gesetzes oder Vollmacht vertretenen Person einen unmittelbaren Vorteil oder Nachteil bringen kann (zusätzlich § 41 Abs. 2 bei entgeltlicher Beschäftigung bei einem Dritten). Es entscheidet
    die objektive Möglichkeit eines Sonderinteresses; auf die tatsächliche Befangenheit kommt es nicht
    an. Ausnahmen bestehen u. a. für Wahlen, Beschlüsse über Rechtsnormen und Fälle, in denen jemand nur als Angehöriger einer Berufs- oder Bevölkerungsgruppe betroffen ist (§ 41 Abs. 1 S. 3, Abs. 3 NKomVG). Wirkte ein ausgeschlossenes Mitglied mit, ist der Beschluss unwirksam, wenn die Mitwirkung für das Abstimmungsergebnis entscheidend war (§ 41 Abs. 6 NKomVG); die Unbeachtlichkeitsregel des § 10 Abs. 2 S. 1 gilt entsprechend.
  norms:
  - § 41 NKomVG
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-10
- slug: ni-kr-oeffentliche-einrichtung
  type: definition
  front: >-
    Unter welchen Voraussetzungen haben Einwohner in Niedersachsen einen Anspruch auf Zulassung zu einer
    öffentlichen Einrichtung der Gemeinde?
  back: >-
    Eine öffentliche Einrichtung ist ein von der Gemeinde im öffentlichen Interesse unterhaltenes Angebot
    (z. B. Stadthalle, Friedhof, Schwimmbad), das nach einem Widmungsakt der Allgemeinheit oder einem
    bestimmten Personenkreis zur Verfügung steht. § 30 Abs. 1 NKomVG gewährt den Einwohnern im Rahmen der bestehenden Vorschriften einen Anspruch auf Zulassung zur Benutzung. Er besteht nur im Rahmen des Widmungszwecks
    und der Kapazität; die Gemeinde darf die Zulassung bei Kapazitätsengpässen nach sachgerechten Kriterien
    beschränken (Gleichbehandlung, Art. 3 Abs. 1 GG). Zweistufigkeit: Die Zulassungsentscheidung ist öffentlich-rechtlich
    (Verwaltungsrechtsweg), die Ausgestaltung der Nutzung kann privatrechtlich erfolgen (Zweistufentheorie).
    Auch Parteien können sich bei Überlassung gegenüber anderen Parteien auf Gleichbehandlung berufen.
  norms:
  - Art. 3 Abs. 1 GG
  - Art. 28 Abs. 2 GG
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-10
- slug: ni-kr-kommunalaufsicht
  type: norm
  front: >-
    Wie ist die Kommunalaufsicht in Niedersachsen ausgestaltet und wie kann sich die Gemeinde dagegen
    wehren?
  back: >-
    Die Kommunalaufsicht (§§ 170 ff. NKomVG) ist Rechtsaufsicht in den Selbstverwaltungsangelegenheiten
    (eigener Wirkungskreis) und im übertragenen Wirkungskreis zusätzlich Fachaufsicht, soweit gesetzlich
    vorgesehen. Die Mittel reichen von Unterrichtung (§ 172) und Beanstandung (§ 173) über die Anordnung und die Ersatzvornahme (§ 174) bis zur Bestellung eines Beauftragten (§ 175); sie sind gestuft und müssen verhältnismäßig sein. Aufsichtsbehörde
    ist je nach Gebietskörperschaft die kommunale Ebene oder das Land. Gegen aufsichtsbehördliche Maßnahmen
    kann sich die Gemeinde mit der Anfechtungsklage wehren; ihre Klagebefugnis folgt aus der Selbstverwaltungsgarantie
    (Art. 28 Abs. 2 GG). Dagegen besteht kein Anspruch Dritter auf aufsichtsbehördliches Einschreiten.
  norms:
  - §§ 170 ff. NKomVG
  - Art. 28 Abs. 2 GG
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-10
- slug: ni-kr-kommunalverfassungsstreit
  type: definition
  front: >-
    Wie sind Klageart, Klagebefugnis und Beklagter im Streit eines Ratsmitglieds mit der Verwaltungsspitze
    zu bestimmen?
  back: >-
    Verweigert die Hauptverwaltungsbeamtin einem Ratsmitglied etwa eine Auskunft, die dieses aus seinem
    Mandat herleitet, liegt ein Kommunalverfassungsstreit vor. Der Rechtsweg ist nach § 40 Abs. 1 VwGO
    eröffnet. Mangels Verwaltungsakt kommen die Feststellungsklage (§ 43 VwGO) oder die allgemeine Leistungsklage
    auf Auskunft in Betracht. Analog § 42 Abs. 2 VwGO muss das Ratsmitglied die Verletzung eigener organschaftlicher
    Rechte geltend machen; die Beteiligtenfähigkeit von Organen und Organteilen folgt aus § 61 Nr. 2 VwGO
    analog. Beklagt wird das Organ bzw. der Amtsträger, der das Recht bestreitet, nicht die Gemeinde.
    Das Rechtsschutzbedürfnis fehlt, wenn lediglich eine objektive Rechtmäßigkeitskontrolle begehrt wird.
  norms:
  - § 40 Abs. 1 VwGO
  - § 43 VwGO
  - § 61 Nr. 2 VwGO
  quellen:
  - VwGO, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-10
schemata:
- slug: ni-schema-kr-beschluss
  title: >-
    Rechtmäßigkeit eines Ratsbeschlusses (Beschluss der Vertretung) nach dem Kommunalrecht von Niedersachsen
  norms:
  - § 41 NKomVG
  - Art. 28 Abs. 2 GG
  - § 47 VwGO
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  steps:
  - label: I. Formelle Rechtmäßigkeit des Beschlusses
    children:
    - label: >-
        1. Zuständigkeit: Vertretung (Rat), Hauptausschuss (§ 76 NKomVG) oder Hauptverwaltungsbeamter
        (§ 85 NKomVG), Abgrenzung in der Hauptsatzung; Verbandskompetenz der Gemeinde
    - label: 2. Ordnungsgemäße Einberufung, Ladung, Öffentlichkeit der Sitzung, Beschlussfähigkeit
    - label: 3. Mitwirkungsverbote
      hinweis: >-
        Klausurklassiker: unmittelbarer Vorteil oder Nachteil für das Mitglied oder Angehörige; Kausalität
        der Mitwirkung für das Abstimmungsergebnis prüfen.
      children:
      - label: a) Voraussetzungen des Mitwirkungsverbots (§ 41 NKomVG)
      - label: b) Rechtsfolge für Beschluss und Heilung/Unbeachtlichkeit nach Landesrecht
    - label: 4. Erforderliche Mehrheit und Beschlussfassung
  - label: II. Materielle Rechtmäßigkeit
    children:
    - label: >-
        1. Ermächtigungsgrundlage (bei Satzungen: besondere Ermächtigung bei Grundrechtseingriffen, Wesentlichkeitslehre)
    - label: >-
        2. Vereinbarkeit mit höherrangigem Recht (Grundrechte, Gleichheitssatz, Bundes- und Landesrecht)
    - label: 3. Ermessen und Verhältnismäßigkeit
  - label: III. Ausfertigung und Bekanntmachung (bei Satzungen)
    hinweis: >-
      Fehler führen zur Unwirksamkeit; Heilungs- und Unbeachtlichkeitsregeln des Landesrechts beachten.
  - label: IV. Rechtsschutz
    children:
    - label: >-
        1. Außenrechtsstreit: Anfechtungs- oder Verpflichtungsklage; Normenkontrolle nach § 47 Abs. 1 Nr. 2 VwGO i. V. m. § 75 NJG
    - label: >-
        2. Innenrechtsstreit (Kommunalverfassungsstreit): Feststellungs- oder Leistungsklage, § 42 Abs.
        2 VwGO analog
faelle:
- slug: ni-fall-kr-mitwirkungsverbot
  title: Der Grundstücksverkauf an die Firma des Ehemanns
  difficulty: 3
  minutes: 45
  quellen:
  - Eigener Sachverhalt der Redaktion
  - NKomVG, amtliche Fassung
  facts: >-
    Der Rat der Stadt S in Niedersachsen beschließt mit 17 zu 16 Stimmen, ein städtisches Grundstück an
    die X-GmbH zu verkaufen. Ratsfrau R ist die Ehefrau des alleinigen Gesellschafters und Geschäftsführers
    der X-GmbH. R nimmt an der Beratung teil und stimmt für den Verkauf. Der Rat war ordnungsgemäß geladen
    und beschlussfähig; nach der Hauptsatzung entscheidet über Grundstücksverkäufe dieser Größe der Rat.
    Mitbewerber M, dessen höheres Angebot nicht berücksichtigt wurde, hält den Beschluss für rechtswidrig.
  question: Ist der Beschluss der Vertretung rechtmäßig?
  steps:
  - prompt: Liegt ein Beschluss im Zuständigkeitsbereich der Vertretung vor?
    erwartung: >-
      Ja: Nach der Hauptsatzung entscheidet der Rat über Grundstücksverkäufe dieser Größe; er war ordnungsgemäß
      geladen und beschlussfähig. Insoweit liegt kein formeller Mangel vor.
  - prompt: Unterlag das Mitglied einem Mitwirkungsverbot?
    erwartung: >-
      Ja: R ist mit dem Gesellschafter-Geschäftsführer der Käuferin verheiratet; der Verkauf bringt dem
      Ehemann als Angehörigem unmittelbar einen Vorteil. Das Mitwirkungsverbot (§ 41 NKomVG) ist erfüllt;
      das Mitglied durfte weder beraten noch abstimmen.
  - prompt: Welche Folge hat der Verstoß für den Beschluss?
    erwartung: >-
      Nach § 41 Abs. 6 S. 1 NKomVG ist der Beschluss unwirksam, wenn die Mitwirkung für das Abstimmungsergebnis
      entscheidend war. Hier wurde der Beschluss mit nur einer Stimme Mehrheit gefasst, sodass ohne die Stimme des befangenen
      Mitglieds keine Mehrheit bestanden hätte. Der Beschluss ist damit rechtswidrig bzw. unwirksam; Heilung
      oder Unbeachtlichkeit nach Landesrecht (z. B. durch Fristablauf, Neubeschluss) ist zu prüfen; dem
      Sachverhalt sind dafür keine Anhaltspunkte zu entnehmen.
  expectation:
    pruefpunkte:
    - id: p1
      label: Zuständigkeit der Vertretung und ordnungsgemäße Beschlussfassung festgestellt
      weight: 1.0
      required: false
      keywords:
      - Zuständigkeit der Vertretung
      - beschlussfähig
      - ordnungsgemäß geladen
      - Hauptsatzung
      card_slugs:
      - ni-kr-zustaendigkeit
    - id: p2
      label: Mitwirkungsverbot (§ 41 NKomVG) wegen unmittelbaren Vorteils bejaht
      weight: 3.0
      required: true
      norms:
      - § 41 NKomVG
      keywords:
      - Mitwirkungsverbot
      - unmittelbarer Vorteil
      - persönliches Interesse
      - Befangenheit
      - § 41 NKomVG
      card_slugs:
      - ni-kr-mitwirkungsverbot
    - id: p3
      label: Zurechnung des Interesses des Angehörigen bzw. des Unternehmens
      weight: 1.5
      required: false
      keywords:
      - Angehöriger
      - Ehegatte
      - Interessenkollision
      - Vertretung eines Dritten
      card_slugs:
      - ni-kr-mitwirkungsverbot
    - id: p4
      label: 'Kausalität: ohne die Stimme des Befangenen keine Mehrheit; Beschluss fehlerhaft'
      weight: 3.0
      required: true
      keywords:
      - Kausalität
      - ausschlaggebend
      - Stimme
      - Abstimmungsergebnis
      - unwirksam
      - rechtswidrig
      card_slugs:
      - ni-kr-mitwirkungsverbot
    - id: p5
      label: Heilung bzw. Unbeachtlichkeit nach Landesrecht erwogen
      weight: 1.0
      required: false
      keywords:
      - Heilung
      - Unbeachtlichkeit
      - Neubeschluss
      - Rügefrist
