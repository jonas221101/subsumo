cards:
- slug: rp-kom-selbstverwaltung
  type: definition
  front: >-
    Was gewährleistet die kommunale Selbstverwaltung nach Art. 28 Abs. 2 GG, und welche Aufgabenarten
    gibt es in Rheinland-Pfalz?
  back: >-
    Art. 28 Abs. 2 GG garantiert den Gemeinden das Recht, alle Angelegenheiten der örtlichen Gemeinschaft
    im Rahmen der Gesetze in eigener Verantwortung zu regeln (Allzuständigkeit). Die Garantie umfasst
    die Rechtssubjektsgarantie, die objektive Rechtsinstitutionsgarantie und die subjektive Rechtsstellungsgarantie.
    Sie schützt die Gemeindehoheiten, etwa Gebiets-, Organisations-, Personal-, Finanz-, Planungs- und
    Satzungshoheit. Eingriffe durch Gesetz sind zulässig, soweit der Kernbereich unangetastet bleibt und
    Aufgaben mit örtlichem Charakter nur aus Gründen des Gemeinwohls, insbesondere zur Sicherung einer
    ordnungsgemäßen Aufgabenwahrnehmung, entzogen werden (Rastede-Beschluss). Aufgabenarten nach § 2 GemO
    RP: freie Selbstverwaltungsaufgaben (Abs. 1 S. 1), Pflichtaufgaben der Selbstverwaltung (Abs. 1 S.
    2) sowie Auftragsangelegenheiten nach Weisung (Abs. 2); für Selbstverwaltungsaufgaben besteht nur
    Rechtsaufsicht (§ 117 GemO), für Auftragsangelegenheiten richtet sich die Aufsicht nach den jeweiligen
    Fachgesetzen (Weisungsrecht).
  norms:
  - Art. 28 Abs. 2 S. 1 GG
  - § 2 GemO RP
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  - BVerfGE 79, 127 (Rastede)
  stand: 2026-10
- slug: rp-kom-struktur
  type: definition
  front: >-
    Wie sind Ortsgemeinde, Verbandsgemeinde und verbandsfreie Gemeinde in Rheinland-Pfalz zu unterscheiden?
  back: >-
    Rheinland-Pfalz kennt eine zweistufige Gemeindestruktur. Ortsgemeinden gehören einer Verbandsgemeinde
    an, bleiben aber eigenständige Gebietskörperschaften mit Ortsgemeinderat und meist ehrenamtlichem
    Ortsbürgermeister. Die Verbandsgemeinde ist selbst Gebietskörperschaft (§ 64 Abs. 1 GemO) mit Verbandsgemeinderat
    und Bürgermeister; sie nimmt anstelle der Ortsgemeinden die in § 67 Abs. 1 GemO genannten Selbstverwaltungsaufgaben
    wahr, insbesondere die ihr nach den Schulgesetzen übertragenen Aufgaben, Brandschutz und technische
    Hilfe, Wasserversorgung und Abwasserbeseitigung (Nr. 1, 2, 5, 6), sowie die Flächennutzungsplanung
    (§ 67 Abs. 2 GemO). Verbandsfreie Gemeinden und kreisfreie Städte nehmen alle Aufgaben selbst wahr.
    Für die Klausur gilt: Zuerst klären, welche Körperschaft handelt, dann ob sie für die Aufgabe zuständig
    ist; Satzungen einer unzuständigen Körperschaft sind formell rechtswidrig.
  norms:
  - § 64 GemO RP
  - § 67 GemO RP
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-10
- slug: rp-kom-organe
  type: definition
  front: >-
    Wie sind die Zuständigkeiten von Gemeinderat und Bürgermeister in Rheinland-Pfalz verteilt, und welche
    Anforderungen gelten für Verpflichtungserklärungen?
  back: >-
    Organe der Gemeinde sind Gemeinderat und Bürgermeister (§ 28 GemO). Der Gemeinderat legt die Grundsätze
    für die Verwaltung fest und beschließt über alle Selbstverwaltungsangelegenheiten, soweit nicht ein
    Ausschuss oder kraft Gesetzes der Bürgermeister zuständig ist (§ 32 Abs. 1 GemO); Satzungen und der
    Haushaltsplan können nicht übertragen werden (§ 32 Abs. 2 Nr. 1, 2 GemO). Der Bürgermeister leitet
    die Gemeindeverwaltung, vertritt die Gemeinde nach außen, bereitet Beschlüsse vor, führt sie aus und
    erledigt die laufende Verwaltung (§ 47 Abs. 1 GemO). Die Abgrenzung der Zuständigkeiten ergibt sich
    aus der GemO RP und der Hauptsatzung; ein Beschluss des unzuständigen Organs ist formell rechtswidrig.
    Verpflichtungserklärungen, mit denen die Gemeinde zu Leistungen verpflichtet werden soll, bedürfen
    nach § 49 Abs. 1 GemO der Schriftform; sie sind nur rechtsverbindlich, wenn der Bürgermeister, der
    allgemeine Vertreter oder ein ständiger Vertreter unter Beifügung der Amtsbezeichnung handschriftlich
    unterzeichnet oder eine qualifizierte elektronische Signatur verwendet. Das gilt nicht für finanziell
    unerhebliche Geschäfte der laufenden Verwaltung (§ 49 Abs. 3 GemO). Diese Formvorschriften sind nach
    h. M. Vertretungsregelungen; ein Verstoß macht die Erklärung unwirksam, sie bindet die Gemeinde nicht.
  norms:
  - §§ 28, 32, 47 GemO RP
  - § 49 GemO RP
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-10
- slug: rp-kom-satzung
  type: norm
  front: Welche Anforderungen stellt das Recht in Rheinland-Pfalz an eine gemeindliche Satzung?
  back: >-
    Die Gemeinden können im Rahmen ihrer Aufgaben und der Gesetze Satzungen erlassen (§ 24 Abs. 1 GemO);
    der Gemeinderat beschließt sie in öffentlicher Sitzung (§ 24 Abs. 2), sie sind öffentlich bekanntzumachen
    (§ 24 Abs. 3). Satzungen über Auftragsangelegenheiten bedürfen einer besonderen gesetzlichen Ermächtigung.
    Eine allgemeine Satzungsermächtigung in der GemO RP genügt für Eingriffe in Grundrechte allerdings
    nicht; nach der Wesentlichkeitstheorie braucht es eine spezielle gesetzliche Ermächtigung (z. B. für
    Anschluss- und Benutzungszwang oder Abgaben). Prüfungsaufbau: I. Ermächtigungsgrundlage. II. Formelle
    Rechtmäßigkeit: Zuständigkeit des Gemeindeorgans (Gemeinderat), Verfahren (Beschlussfassung, Mitwirkungsverbote),
    Ausfertigung und ordnungsgemäße öffentliche Bekanntmachung. III. Materielle Rechtmäßigkeit: Vereinbarkeit
    mit höherrangigem Recht, Bestimmtheit, Verhältnismäßigkeit, Gleichheitssatz. Rechtsfolge eines Fehlers
    ist grundsätzlich Nichtigkeit; nach § 24 Abs. 6 GemO gelten Satzungen jedoch ein Jahr nach der Bekanntmachung
    als von Anfang an gültig zustande gekommen, wenn Verfahrens- oder Formvorschriften der GemO verletzt
    wurden; das gilt nicht bei Verletzung der Bestimmungen über Öffentlichkeit der Sitzung, Genehmigung,
    Ausfertigung oder Bekanntmachung oder wenn die Aufsichtsbehörde beanstandet oder jemand die Verletzung
    schriftlich geltend gemacht hat. Rechtsschutz: Normenkontrolle nach § 47 Abs. 1 Nr. 2 VwGO; in Rheinland-Pfalz
    ist sie durch § 4 Abs. 1 AGVwGO eröffnet (OVG).
  norms:
  - § 24 GemO RP
  - § 47 VwGO
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-10
- slug: rp-kom-anschlusszwang
  type: norm
  front: >-
    Unter welchen Voraussetzungen darf die Gemeinde einen Anschluss- und Benutzungszwang anordnen?
  back: >-
    Der Anschluss- und Benutzungszwang verpflichtet Grundstückseigentümer und Nutzer, ein Grundstück an
    eine gemeindliche Einrichtung anzuschließen und die Einrichtung zu benutzen (nach § 26 Abs. 1 GemO
    Wasserversorgung, Abwasserbeseitigung, Straßenreinigung, Fernheizung, den Anschluss von Heizungsanlagen
    an bestimmte Energieversorgungseinrichtungen sowie andere dem Gemeinwohl dienende Einrichtungen).
    Er ist ein Eingriff in Art. 2 Abs. 1, Art. 12 und Art. 14 GG und bedarf einer gesetzlichen Ermächtigung
    (§ 26 GemO), die die Gemeinde durch Satzung ausfüllt. Tatbestand: öffentliches Bedürfnis; Einrichtung
    der in § 26 Abs. 1 GemO genannten Art oder eine andere dem Gemeinwohl dienende Einrichtung; Verhältnismäßigkeit.
    Die Satzung kann Ausnahmen zulassen und den Zwang auf bestimmte Teile des Gemeindegebiets oder bestimmte
    Gruppen von Grundstücken oder Personen beschränken (§ 26 Abs. 2 GemO); Härtefallregelungen sind verfassungsrechtlich
    geboten.
  norms:
  - § 26 GemO RP
  - Art. 2 Abs. 1 GG
  - Art. 12 Abs. 1 GG
  - Art. 14 Abs. 1 GG
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-10
- slug: rp-kom-aufsicht
  type: streitstand
  front: Welche Arten der Kommunalaufsicht gibt es, und welchen Rechtsschutz hat die Gemeinde?
  back: >-
    Bei Selbstverwaltungsaufgaben besteht nur Rechtsaufsicht: Der Staat beaufsichtigt die Gemeinden, um
    sicherzustellen, dass die Verwaltung im Einklang mit dem geltenden Recht geführt wird (§ 117 GemO).
    Bei Auftragsangelegenheiten richtet sich die Aufsicht nach den jeweiligen Fachgesetzen (Weisungsrecht
    auch hinsichtlich der Zweckmäßigkeit). Die Aufsichtsmittel sind abgestuft: Unterrichtungsrecht (§
    120), Beanstandung (§ 121), Anordnung (§ 122), Aufhebung und Ersatzvornahme (§ 123), Bestellung eines
    Beauftragten (§ 124), Auflösung des Gemeinderats (§ 125 GemO); die Behörde entscheidet nach pflichtgemäßem
    Ermessen (Opportunitätsprinzip). Rechtsschutz der Gemeinde: Nach h. M. sind Aufsichtsmaßnahmen gegenüber
    der Gemeinde Verwaltungsakte, weil sie in die Selbstverwaltungsgarantie (Art. 28 Abs. 2 GG) eingreifen;
    statthaft ist die Anfechtungsklage; § 126 GemO eröffnet gegen Anordnungen der Aufsichtsbehörde die
    Klage zum Verwaltungsgericht. Die früher vertretene Gegenansicht sah in der Aufsicht eine Maßnahme
    im staatlichen Innenbereich ohne Außenwirkung; sie wird wegen der eigenen Rechtsstellung der Gemeinde
    überwiegend abgelehnt.
  norms:
  - §§ 117 bis 126 GemO RP
  - Art. 28 Abs. 2 S. 1 GG
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-10
- slug: rp-kom-buergerbegehren
  type: definition
  front: >-
    Wie funktionieren Bürgerbegehren und Bürgerentscheid, und welche Zulässigkeitsprobleme sind typisch?
  back: >-
    Mit dem Bürgerbegehren verlangen die Bürger, dass über eine Gemeindeangelegenheit ein Bürgerentscheid
    stattfindet; dieser ersetzt den Beschluss des Gemeindeorgans. Nach § 17a GemO RP ist das Bürgerbegehren
    schriftlich bei der Gemeindeverwaltung einzureichen und muss sich gegen einen Ratsbeschluss binnen
    vier Monaten richten (Abs. 3 S. 1). Es muss eine mit Ja oder Nein zu beantwortende Frage und eine
    Begründung enthalten und bis zu drei Vertretungsberechtigte benennen; erforderlich ist je nach Gemeindegröße
    die Unterschrift von 5 bis 9 % der wahlberechtigten Einwohner (Abs. 3 S. 3). Unzulässig ist es u.
    a. über Angelegenheiten, die kraft Gesetzes dem Bürgermeister obliegen, die innere Organisation, Rechtsverhältnisse
    der Ratsmitglieder und Bediensteten, Haushaltssatzung, Abgabensätze und Tarife, Bauleitpläne, Planfeststellungsvorhaben
    und gesetzwidrige Anträge (Abs. 2). Über die Zulässigkeit entscheidet der Gemeinderat nach Anhörung
    der Vertretungsberechtigten (Abs. 4 S. 2); ein Bürgerentscheid ist entschieden, wenn die Mehrheit
    mindestens 15 % der Stimmberechtigten beträgt (Abs. 7). Die Initiatoren können eine ablehnende Entscheidung
    vor dem Verwaltungsgericht angreifen.
  norms:
  - § 17a GemO RP
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-10
- slug: rp-kom-mitwirkung
  type: definition
  front: >-
    Wann gilt ein Mitwirkungsverbot für Mitglieder des Gemeindeorgans, und was folgt aus einem Verstoß?
  back: >-
    Wer ein Ehrenamt oder eine ehrenamtliche Tätigkeit ausübt, darf nach § 22 Abs. 1 GemO weder beratend
    noch entscheidend mitwirken, wenn die Entscheidung ihm selbst, Angehörigen oder einer von ihm vertretenen
    Person oder Gesellschaft einen unmittelbaren Vorteil oder Nachteil bringen kann. Unmittelbarkeit bedeutet:
    Die Entscheidung berührt das Sonderinteresse des Betroffenen ohne weiteren Vollzugsakt; ein Vorteil,
    den er mit einer Vielzahl von Personen teilt (Gruppeninteresse), genügt nicht (§ 22 Abs. 3 GemO).
    Beispiel: Eigentümer eines Grundstücks im Plangebiet bei der Beschlussfassung über den Bebauungsplan.
    Ein ausgeschlossenes Ratsmitglied darf sich bei öffentlicher Sitzung im Zuhörerbereich aufhalten (§
    22 Abs. 4 GemO). Ein Verstoß ist ein Verfahrensfehler: Nach § 22 Abs. 6 GemO ist die Entscheidung
    unwirksam, gilt aber als von Anfang an wirksam, wenn nicht innerhalb von drei Monaten der Bürgermeister
    ihre Ausführung aussetzt oder die Aufsichtsbehörde sie beanstandet; gegenüber demjenigen, der vorher
    einen förmlichen Rechtsbehelf eingelegt hat, tritt die Wirksamkeit nicht ein. Für Satzungen gilt §
    24 Abs. 6 GemO.
  norms:
  - § 22 GemO RP
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-10
