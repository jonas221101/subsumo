faelle:
- slug: rp-fall-kom-ortsgemeinde-abwasser
  title: Die Satzung der Ortsgemeinde
  difficulty: 3
  minutes: 45
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  facts: >-
    Die Ortsgemeinde O gehört in Rheinland-Pfalz einer Verbandsgemeinde V an. Der Ortsgemeinderat beschließt
    eine Satzung, die für alle Grundstücke in O den Anschluss an die öffentliche Abwasserbeseitigung und
    deren Benutzung vorschreibt. Die Satzung wird ordnungsgemäß ausgefertigt und bekannt gemacht. Abwasserbeseitigung
    ist nach dem Landesrecht Aufgabe der Verbandsgemeinde; die Verbandsgemeinde V betreibt die Kläranlage
    und die Kanalisation in O. Grundstückseigentümer E, der einen Anschlussbescheid der O auf Grundlage
    der Satzung erhält, hält die Satzung für rechtswidrig.
  question: Ist die Satzung der O rechtmäßig? Auf Befreiungsfragen ist nicht einzugehen.
  steps:
  - prompt: >-
      Welche Körperschaft ist für die Abwasserbeseitigung und die dazugehörige Satzung zuständig?
    erwartung: >-
      Die Abwasserbeseitigung gehört nach § 67 Abs. 1 S. 1 Nr. 6 GemO zu den Selbstverwaltungsaufgaben
      der Verbandsgemeinde. Folglich ist die Verbandsgemeinde, nicht die Ortsgemeinde, zum Erlass der
      Satzung über den Anschluss- und Benutzungszwang (§ 26, § 24 GemO) berechtigt.
  - prompt: Was folgt daraus für die Satzung der O?
    erwartung: >-
      O fehlt die Kompetenz zum Erlass der Satzung. Die Satzung ist formell rechtswidrig, weil sie von
      einer unzuständigen Körperschaft erlassen wurde. Die ordnungsgemäße Bekanntmachung heilt diesen
      Mangel nicht.
  - prompt: Besteht ein öffentliches Bedürfnis für den Anschluss- und Benutzungszwang an sich?
    erwartung: >-
      Ja, die geordnete Abwasserbeseitigung dient der Volksgesundheit und dem Umweltschutz; die Verbandsgemeinde
      hätte eine solche Satzung rechtmäßig erlassen können. Darauf kommt es für die Satzung der O nicht
      an.
  - prompt: Ergebnis und Folge für E?
    erwartung: >-
      Die Satzung der O ist rechtswidrig und nichtig. Der darauf gestützte Anschlussbescheid ist mangels
      Ermächtigungsgrundlage rechtswidrig.
  expectation:
    pruefpunkte:
    - id: p1
      label: Zuständigkeit der Verbandsgemeinde für die Abwasserbeseitigung erkannt
      weight: 3.0
      required: true
      keywords:
      - Verbandsgemeinde
      - Zuständigkeit der Verbandsgemeinde
      - Aufgabe der Verbandsgemeinde
      card_slugs:
      - rp-kom-struktur
    - id: p2
      label: Fehlende Kompetenz der Ortsgemeinde als formeller Mangel der Satzung
      weight: 2.5
      required: true
      keywords:
      - formell rechtswidrig
      - Unzuständigkeit
      - fehlende Kompetenz
      - unzuständige Körperschaft
      - Verbandskompetenz
      card_slugs:
      - rp-kom-satzung
      - rp-kom-struktur
    - id: p3
      label: Bekanntmachung heilt die Unzuständigkeit nicht; Satzung nichtig
      weight: 1.5
      required: false
      keywords:
      - Nichtigkeit
      - nichtig
      - Bekanntmachung heilt nicht
      - keine Ermächtigungsgrundlage
      card_slugs:
      - rp-kom-satzung
    - id: p4
      label: Öffentliches Bedürfnis grundsätzlich bejaht, aber irrelevant für das Ergebnis
      weight: 1.0
      required: false
      keywords:
      - öffentliches Bedürfnis
      - Volksgesundheit
      - Umweltschutz
      card_slugs:
      - rp-kom-anschlusszwang
    normzitate_geprueft: false
