faelle:
- slug: th-fall-bau-verpflichtungsklage-gestaltung
  title: "Das Wohnhaus im Wohngebiet"
  difficulty: 3
  minutes: 50
  quellen:
  - "Landesgesetze in der amtlichen Fassung (Landesrechtsportal)"
  - "Eigenformulierung Redaktion"
  - "§ 30 BauGB"
  - "§ 42 Abs. 1 VwGO"
  facts: >-
      B ist Eigentümer eines unbebauten Grundstücks in einem durch Bebauungsplan festgesetzten
      allgemeinen Wohngebiet in Thüringen. Der Bebauungsplan setzt die Art der baulichen Nutzung
      (allgemeines Wohngebiet), eine Grundflächenzahl von 0,4 und maximal zwei Vollgeschosse fest und
      enthält keine Gestaltungsvorschriften. B beantragt die Baugenehmigung für ein Einfamilienhaus
      mit zwei Vollgeschossen und einer Grundflächenzahl von 0,3. Das Vorhaben entspricht allen
      Vorgaben des Bebauungsplans und der ThürBO; die Erschließung ist gesichert, die Gemeinde hat ihr
      Einvernehmen erteilt. Die Bauaufsichtsbehörde lehnt den Antrag mit der Begründung ab, das Haus
      füge sich ästhetisch nicht in das Ortsbild ein. Eine Gestaltungssatzung existiert nicht.
  question: >-
      Welche Klageart ist statthaft, und hat die Klage in der Sache Erfolg? Auf Fragen der Klagefrist
      ist nicht einzugehen.
  steps:
  - prompt: "Welche Klageart ist statthaft, und ist B klagebefugt?"
    erwartung: >-
        Statthaft ist die Verpflichtungsklage (§ 42 Abs. 1 Var. 2 VwGO), weil B den Erlass der
        abgelehnten Baugenehmigung begehrt. B ist klagebefugt, da er einen Anspruch auf die Genehmigung
        geltend machen kann; die Baufreiheit ist von Art. 14 Abs. 1 GG umfasst.
  - prompt: "Welche Anspruchsgrundlage kommt in Betracht und was ist der Maßstab?"
    erwartung: >-
        Anspruchsgrundlage ist die Genehmigungsvorschrift der ThürBO. Die Baugenehmigung ist eine
        gebundene Entscheidung: Die Baugenehmigung ist zu erteilen, wenn dem Vorhaben keine im Prüfumfang zu prüfenden
        öffentlich-rechtlichen Vorschriften entgegenstehen; es besteht dann ein Anspruch auf Baugenehmigung.
  - prompt: "Ist das Vorhaben planungs- und bauordnungsrechtlich zulässig?"
    erwartung: >-
        Ja. Das Vorhaben liegt im Geltungsbereich eines qualifizierten Bebauungsplans und ist nach § 30
        Abs. 1 BauGB zulässig, weil es den Festsetzungen entspricht. Die Anforderungen der ThürBO sind
        erfüllt, die Erschließung ist gesichert, das gemeindliche Einvernehmen liegt vor.
  - prompt: >-
        Ist die ästhetische Begründung der Behörde ein tragfähiger Versagungsgrund?
    erwartung: >-
        Nein. Ohne Gestaltungssatzung oder eine konkrete bauordnungsrechtliche Verunstaltungsregelung
        ist eine bloße ästhetische Unzufriedenheit kein Versagungsgrund. Die Klage ist begründet; B hat
        Anspruch auf Erteilung der Baugenehmigung.
  expectation:
    pruefpunkte:
    - id: p1
      label: >-
          Verpflichtungsklage als statthafte Klageart; Baufreiheit und Klagebefugnis
      weight: 2.0
      required: true
