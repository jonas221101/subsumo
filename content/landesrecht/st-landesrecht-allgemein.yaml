cards:
- slug: st-lra-vwvfg
  type: norm
  front: Welches Verwaltungsverfahrensgesetz gilt für Landesbehörden in Sachsen-Anhalt?
  back: Verwaltungsverfahrensgesetz Sachsen-Anhalt (VwVfG LSA) - Verweisung auf das VwVfG des Bundes (§ 1 Abs. 1 VwVfG LSA). Das VwVfG des Bundes gilt nur für Bundesbehörden (§ 1 VwVfG); für Landes- und Kommunalbehörden ist
    das Landesgesetz maßgeblich. Bei Verweisungsgesetzen werden die Bundesnormen 'entsprechend' angewendet
    und sind so zu zitieren (z. B. '§ 35 VwVfG i. V. m. § 1 des Landesgesetzes'), bei Vollgesetzen ist
    die Landesnorm selbst zu zitieren.
  norms:
  - Verwaltungsverfahrensgesetz Sachsen-Anhalt (VwVfG LSA) - Verweisung auf das VwVfG des Bundes
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: st-lra-verfassungsgericht
  type: norm
  front: Gibt es in Sachsen-Anhalt eine Individualverfassungsbeschwerde zum Landesverfassungsgericht?
  back: 'Ja, aber nur gegen Landesgesetze: Art. 75 Nr. 6 Verf LSA (Verfassungsbeschwerde von jedermann mit der Behauptung, durch ein Landesgesetz unmittelbar in Grundrechten, grundrechtsgleichen oder staatsbürgerlichen Rechten verletzt zu sein; Nr. 7: kommunale Verfassungsbeschwerde). Gegen Verwaltungsakte oder Gerichtsentscheidungen gibt es keine Individualverfassungsbeschwerde zum Landesverfassungsgericht. Zuständiges Gericht: Landesverfassungsgericht Sachsen-Anhalt auf Grundlage der Verfassung des Landes Sachsen-Anhalt (Verf LSA). Verfahrensgegenstand ist nur die Verletzung
    von Landesgrundrechten durch Landesstaatsgewalt; Bundesrecht ist Prüfungsmaßstab nur, soweit die Landesverfassung
    darauf verweist. Daneben steht immer die Verfassungsbeschwerde zum BVerfG (Art. 93 Abs. 1 Nr. 4a GG).'
  norms:
  - Art. 75 Nr. 6, 7 Verf LSA
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: st-lra-kommunalverfassung
  type: norm
  front: Welches Gesetz regelt die Kommunalverfassung in Sachsen-Anhalt und welche Hauptorgane hat die
    Gemeinde?
  back: 'Kommunalverfassungsgesetz des Landes Sachsen-Anhalt (KVG LSA): Gemeinderat und Bürgermeister.
    Grundlage ist die Selbstverwaltungsgarantie (Art. 28 Abs. 2 GG und Landesverfassung): eigenverantwortliche
    Regelung aller Angelegenheiten der örtlichen Gemeinschaft. Klausurklassiker: Zuständigkeitsstreit
    zwischen Vertretung und Verwaltungsspitze, Kommunalverfassungsstreit, Rechtsaufsicht.'
  norms:
  - 'Kommunalverfassungsgesetz des Landes Sachsen-Anhalt (KVG LSA): Gemeinderat und Bürgermeister'
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: st-lra-bauordnung
  type: norm
  front: Wie heißt die Bauordnung in Sachsen-Anhalt und wie ist eine Baugenehmigung zu prüfen?
  back: 'Bauordnung Sachsen-Anhalt (BauO LSA). Anspruch auf Baugenehmigung besteht, wenn dem Vorhaben
    keine öffentlich-rechtlichen Vorschriften entgegenstehen: Genehmigungsbedürftigkeit (Errichtung, Änderung,
    Nutzungsänderung), keine Genehmigungsfreiheit, bauplanungsrechtliche Zulässigkeit nach §§ 29 ff. BauGB
    (Bundesrecht), bauordnungsrechtliche Zulässigkeit nach der Landesbauordnung (Abstandsflächen, Gestaltung,
    Stellplätze).'
  norms:
  - Bauordnung Sachsen-Anhalt (BauO LSA)
  - §§ 29 ff. BauGB
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: st-lra-pflichtstoff
  type: definition
  front: Welche Landesrechtsgebiete gehören in Sachsen-Anhalt zum Pflichtstoff des Öffentlichen Rechts?
  back: Ordnungsrecht (SOG LSA); Kommunalrecht (KVG LSA); Bauordnungsrecht (BauO LSA); Landesverfassung.
    Landesrecht wird im Examen fast nie isoliert, sondern eingebettet in eine verwaltungsprozessuale Einkleidung
    (Anfechtungs-/Verpflichtungsklage, vorläufiger Rechtsschutz) geprüft - die Landesnorm ist die Ermächtigungsgrundlage,
    der Aufbau bleibt der allgemeine.
  norms: []
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
