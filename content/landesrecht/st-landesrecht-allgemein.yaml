cards:
- slug: st-lra-vwvfg
  type: norm
  front: Welches Verwaltungsverfahrensgesetz gilt fuer Landesbehoerden in Sachsen-Anhalt?
  back: Verwaltungsverfahrensgesetz Sachsen-Anhalt (VwVfG LSA) - Verweisung auf das VwVfG des Bundes.
    Das VwVfG des Bundes gilt nur fuer Bundesbehoerden (§ 1 VwVfG); fuer Landes- und Kommunalbehoerden
    ist das Landesgesetz massgeblich. Bei Verweisungsgesetzen werden die Bundesnormen 'entsprechend' angewendet
    und sind so zu zitieren (z. B. '§ 35 VwVfG i. V. m. § 1 des Landesgesetzes'), bei Vollgesetzen ist
    die Landesnorm selbst zu zitieren.
  norms:
  - Verwaltungsverfahrensgesetz Sachsen-Anhalt (VwVfG LSA) - Verweisung auf das VwVfG des Bundes
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: st-lra-verfassungsgericht
  type: norm
  front: Gibt es in Sachsen-Anhalt eine Individualverfassungsbeschwerde zum Landesverfassungsgericht?
  back: 'Ja - Art. 75 Nr. 6 Verf LSA. Zustaendiges Gericht: Landesverfassungsgericht Sachsen-Anhalt auf
    Grundlage der Verfassung des Landes Sachsen-Anhalt (Verf LSA). Verfahrensgegenstand ist nur die Verletzung
    von Landesgrundrechten durch Landesstaatsgewalt; Bundesrecht ist Pruefungsmassstab nur, soweit die
    Landesverfassung darauf verweist. Daneben steht immer die Verfassungsbeschwerde zum BVerfG (Art. 93
    Abs. 1 Nr. 4a GG).'
  norms:
  - Verfassung des Landes Sachsen-Anhalt (Verf LSA)
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: st-lra-kommunalverfassung
  type: norm
  front: Welches Gesetz regelt die Kommunalverfassung in Sachsen-Anhalt und welche Hauptorgane hat die
    Gemeinde?
  back: 'Kommunalverfassungsgesetz des Landes Sachsen-Anhalt (KVG LSA): Gemeinderat und Buergermeister.
    Grundlage ist die Selbstverwaltungsgarantie (Art. 28 Abs. 2 GG und Landesverfassung): eigenverantwortliche
    Regelung aller Angelegenheiten der oertlichen Gemeinschaft. Klausurklassiker: Zustaendigkeitsstreit
    zwischen Vertretung und Verwaltungsspitze, Kommunalverfassungsstreit, Rechtsaufsicht.'
  norms:
  - 'Kommunalverfassungsgesetz des Landes Sachsen-Anhalt (KVG LSA): Gemeinderat und Buergermeister'
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: st-lra-bauordnung
  type: norm
  front: Wie heisst die Bauordnung in Sachsen-Anhalt und wie ist eine Baugenehmigung zu pruefen?
  back: 'Bauordnung Sachsen-Anhalt (BauO LSA). Anspruch auf Baugenehmigung besteht, wenn dem Vorhaben
    keine oeffentlich-rechtlichen Vorschriften entgegenstehen: Genehmigungs-beduerftigkeit (Errichtung,
    Aenderung, Nutzungsaenderung), keine Genehmigungsfreiheit, bauplanungsrechtliche Zulaessigkeit nach
    §§ 29 ff. BauGB (Bundesrecht), bauordnungsrechtliche Zulaessigkeit nach der Landesbauordnung (Abstandsflaechen,
    Gestaltung, Stellplaetze).'
  norms:
  - Bauordnung Sachsen-Anhalt (BauO LSA)
  - §§ 29 ff. BauGB
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: st-lra-pflichtstoff
  type: definition
  front: Welche Landesrechtsgebiete gehoeren in Sachsen-Anhalt zum Pflichtstoff des Oeffentlichen Rechts?
  back: Ordnungsrecht (SOG LSA); Kommunalrecht (KVG LSA); Bauordnungsrecht (BauO LSA); Landesverfassung.
    Landesrecht wird im Examen fast nie isoliert, sondern eingebettet in eine verwaltungsprozessuale Einkleidung
    (Anfechtungs-/Verpflichtungsklage, vorlaeufiger Rechtsschutz) geprueft - die Landesnorm ist die Ermaechtigungsgrundlage,
    der Aufbau bleibt der allgemeine.
  norms: []
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
