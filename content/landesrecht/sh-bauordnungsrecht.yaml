cards:
- slug: sh-bo-abgrenzung
  type: definition
  front: Wie grenzen sich Bauplanungsrecht und Bauordnungsrecht ab und welche Rolle spielt die LBO SH?
  back: 'Das Bauplanungsrecht regelt die städtebauliche Ordnung der Bodennutzung (Bebauungsplan, Zulässigkeit
    nach §§ 29 ff. BauGB); es ist Bundesrecht (Art. 74 Abs. 1 Nr. 18 GG). Das Bauordnungsrecht regelt
    als Landesrecht die Anforderungen an das einzelne Bauvorhaben im Sinne der Gefahrenabwehr: Standsicherheit,
    Brandschutz, Abstandsflächen, Gestaltung, Stellplätze und das Verfahren. Rechtsgrundlage in Schleswig-Holstein
    ist die Landesbauordnung für das Land Schleswig-Holstein (LBO SH). Im Genehmigungsverfahren sind beide
    Bereiche zu prüfen: Das Vorhaben muss bauplanungsrechtlich zulässig sein und darf bauordnungsrechtlichen
    Vorschriften nicht widersprechen. In der Klausur ist die Trennung der Prüfungsebenen wichtig, weil
    die Rechtsfolgen (Befreiung, § 31 Abs. 2 BauGB; Abweichung nach Landesrecht) unterschiedlich sind.'
  norms:
  - Landesbauordnung für das Land Schleswig-Holstein (LBO SH)
  - §§ 29 ff. BauGB
  - Art. 74 Abs. 1 Nr. 18 GG
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-10
- slug: sh-bo-baugenehmigung
  type: norm
  front: Unter welchen Voraussetzungen besteht in Schleswig-Holstein ein Anspruch auf Baugenehmigung?
  back: 'Der Bauherr hat Anspruch auf die Baugenehmigung, wenn dem Vorhaben keine öffentlich-rechtlichen
    Vorschriften entgegenstehen. Zu prüfen sind: (1) Genehmigungsbedürftigkeit (Errichtung, Änderung,
    Nutzungsänderung; keine Verfahrensfreiheit), (2) bauplanungsrechtliche Zulässigkeit (§§ 29 ff. BauGB;
    Einvernehmen der Gemeinde, § 36 BauGB), (3) bauordnungsrechtliche Zulässigkeit nach der LBO SH, soweit
    das Verfahren sie zum Prüfprogramm macht, und (4) sonstiges öffentliches Recht. Die Baugenehmigung
    ist ein Verwaltungsakt, der unbeschadet der Rechte Dritter ergeht. Untere Bauaufsichtsbehörden sind
    regelmäßig die Kreise und die kreisfreien Städte; die Gemeinde wirkt als Planungsträgerin mit (Einvernehmen
    nach § 36 BauGB). Rechtsschutz bei Ablehnung: Verpflichtungsklage nach § 42 Abs. 1 Var. 2 VwGO.'
  norms:
  - Landesbauordnung für das Land Schleswig-Holstein (LBO SH)
  - § 36 BauGB
  - § 42 Abs. 1 VwGO
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-10
- slug: sh-bo-verfahrensarten
  type: definition
  front: Welche Verfahrensarten kennt das Bauordnungsrecht in Schleswig-Holstein und was folgt daraus
    für die materielle Rechtmäßigkeit?
  back: 'Die LBO SH unterscheidet nach Gefährdungspotential und Größe des Vorhabens: verfahrensfreie Vorhaben,
    die Genehmigungsfreistellung bei qualifiziertem Bebauungsplan, das vereinfachte Genehmigungsverfahren
    mit eingeschränktem Prüfprogramm und das reguläre Genehmigungsverfahren mit umfassender Prüfung. Entscheidend
    ist: Verfahrensfreiheit oder eingeschränkte Prüfung bedeuten nicht, dass materielle Anforderungen
    entfallen; sie besagen nur, dass die Bauaufsichtsbehörde das Vorhaben nicht oder nicht vollständig
    vorab prüft. Auch verfahrensfreie Vorhaben müssen dem materiellen Recht entsprechen, und die Bauaufsichtsbehörde
    kann bei Verstößen einschreiten. Eine Baugenehmigung im vereinfachten Verfahren stellt nur die Vereinbarkeit
    mit den in diesem Verfahren geprüften Vorschriften fest.'
  norms:
  - Landesbauordnung für das Land Schleswig-Holstein (LBO SH)
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-10
- slug: sh-bo-abstandsflaechen
  type: norm
  front: Was regelt das Abstandsflächenrecht der LBO SH und welche Rechtsfolgen hat sein Verstoß?
  back: 'Abstandsflächen (§ 6 LBO SH) sind von oberirdischen Gebäuden freizuhaltende Flächen vor den Außenwänden.
    Sie dienen nach § 6 Abs. 1 LBO SH der ausreichenden Belichtung und Belüftung sowie einem ausreichenden Sozialabstand. Die Tiefe
    bemisst sich nach der Wandhöhe H; als Regelwert gilt 0,4 H mit einer Mindesttiefe von 3 m. Grundsätzlich
    liegt die Abstandsfläche auf dem Baugrundstück. Das Abstandsflächenrecht ist weitgehend drittschützend:
    Ein Nachbar kann sich gegen eine Baugenehmigung wehren, die diese Vorschriften verletzt. Unterschreitungen
    können im Wege der Abweichung (§ 67 LBO SH) gestattet werden, wenn Zweck und öffentliche Belange gewahrt
    sind. Ein Verstoß macht das Vorhaben materiell rechtswidrig und kann bauaufsichtliche Maßnahmen begründen.'
  norms:
  - § 6 LBO SH
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-10
- slug: sh-bo-nachbarschutz
  type: definition
  front: Unter welchen Voraussetzungen kann ein Nachbar in Schleswig-Holstein gegen eine Baugenehmigung
    vorgehen?
  back: 'Der Nachbar kann die Baugenehmigung mit Widerspruch bzw. Anfechtungsklage (Drittanfechtung) angreifen.
    Klagebefugt (§ 42 Abs. 2 VwGO) ist er, wenn er die Verletzung einer drittschützenden Norm geltend
    machen kann: nachbarschützend sind etwa die Abstandsflächenvorschriften der LBO SH, bestimmte Festsetzungen
    eines Bebauungsplans (Gebietserhaltungsanspruch) und das Gebot der Rücksichtnahme. Begründet ist die
    Klage nur, wenn die Genehmigung rechtswidrig ist und den Nachbarn in einem subjektiven öffentlichen
    Recht verletzt (Schutznormtheorie); allgemeine objektive Rechtsverstöße genügen nicht. Widerspruch
    und Anfechtungsklage des Nachbarn haben nach § 212a Abs. 1 BauGB keine aufschiebende Wirkung; vorläufiger
    Rechtsschutz wird über § 80a Abs. 3 i. V. m. § 80 Abs. 5 VwGO gewährt.'
  norms:
  - § 42 Abs. 2 VwGO
  - § 212a Abs. 1 BauGB
  - § 80a Abs. 3 VwGO
  - § 80 Abs. 5 VwGO
  quellen:
  - VwGO, amtliche Fassung
  - BauGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-10
- slug: sh-bo-eingriff
  type: norm
  front: Welche bauaufsichtlichen Eingriffsmaßnahmen gibt es in Schleswig-Holstein und wann genügt formelle
    Illegalität?
  back: Die Bauaufsichtsbehörde kann bei rechtswidrigen baulichen Anlagen nach der LBO SH einschreiten,
    insbesondere durch Baueinstellung (Stilllegungsverfügung), Nutzungsuntersagung und Beseitigungsanordnung.
    Zu unterscheiden sind formelle Illegalität (fehlende erforderliche Genehmigung) und materielle Illegalität
    (Widerspruch zu materiellem Recht). Für Baueinstellung und Nutzungsuntersagung genügt regelmäßig formelle
    Illegalität; wegen der Schwere des Eingriffs setzt die Beseitigungsanordnung nach h. M. materielle
    Illegalität voraus, weil sonst eine genehmigungsfähige Anlage beseitigt würde. Die Maßnahmen stehen
    im Ermessen; zu beachten sind Verhältnismäßigkeit, Gleichbehandlung und Bestandsschutz. Adressat ist
    regelmäßig der Bauherr oder der Eigentümer.
  norms:
  - Landesbauordnung für das Land Schleswig-Holstein (LBO SH)
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-10
- slug: sh-bo-bestandsschutz
  type: definition
  front: Was bedeutet Bestandsschutz im Bauordnungsrecht von Schleswig-Holstein?
  back: 'Bestandsschutz folgt aus Art. 14 Abs. 1 GG: Eine rechtmäßig errichtete bauliche Anlage darf in
    ihrem genehmigten Zustand und in der genehmigten Nutzung fortbestehen, auch wenn sich das Recht später
    ändert. Voraussetzung ist, dass die Anlage genehmigt oder zumindest zu irgendeinem Zeitpunkt materiell
    legal war. Eine Beseitigungsanordnung allein wegen späterer Rechtsänderung ist rechtswidrig. Nachträgliche
    Anpassungsverlangen sind nur nach ausdrücklicher gesetzlicher Ermächtigung und bei erheblicher Gefahr
    für Leben oder Gesundheit zulässig. Kein Bestandsschutz genießen Schwarzbauten, die nie genehmigt
    und nie genehmigungsfähig waren. Weitergehende Veränderungen (Erweiterung, Nutzungsänderung) sind
    vom Bestandsschutz nicht gedeckt.'
  norms:
  - Art. 14 Abs. 1 GG
  - Landesbauordnung für das Land Schleswig-Holstein (LBO SH)
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-10
- slug: sh-bo-abweichung
  type: definition
  front: Wann kann in Schleswig-Holstein von Anforderungen der LBO SH abgewichen werden und wie unterscheidet
    sich das von der Befreiung nach dem BauGB?
  back: Die LBO SH erlaubt es der Bauaufsichtsbehörde, Abweichungen von bauordnungsrechtlichen Anforderungen
    zuzulassen, wenn sie unter Berücksichtigung des Zwecks der Anforderung und unter Würdigung der nachbarlichen
    Belange mit den öffentlichen Belangen vereinbar sind. Die Bauaufsichtsbehörde "soll" bei Vorliegen der Voraussetzungen Abweichungen zulassen (§ 67 Abs. 1 LBO SH; gebundenes bzw. intendiertes Ermessen).
    Die Befreiung nach § 31 Abs. 2 BauGB betrifft dagegen Festsetzungen eines Bebauungsplans und ist Bauplanungsrecht.
    In der Klausur sind beide Instrumente zu trennen; für die Nachbarschutzprüfung ist maßgeblich, ob
    die verletzte Norm drittschützend ist und ob die Abweichung die nachbarlichen Belange würdigt.
  norms:
  - § 31 Abs. 2 BauGB
  - Landesbauordnung für das Land Schleswig-Holstein (LBO SH)
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - BauGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-10
schemata:
- slug: sh-schema-bo-eingriff
  title: Rechtmäßigkeit einer bauaufsichtlichen Eingriffsverfügung nach der LBO SH
  norms:
  - Landesbauordnung für das Land Schleswig-Holstein (LBO SH)
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  steps:
  - label: I. Ermächtigungsgrundlage
    hinweis: Eingriffsbefugnis der LBO SH (Baueinstellung, Nutzungsuntersagung, Beseitigungsanordnung)
      benennen.
  - label: II. Formelle Rechtmäßigkeit
    children:
    - label: 1. Zuständigkeit der Bauaufsichtsbehörde
    - label: 2. Anhörung
    - label: 3. Form, Bestimmtheit, Begründung
  - label: III. Materielle Rechtmäßigkeit
    children:
    - label: '1. Tatbestand: rechtswidrige bauliche Anlage oder Nutzung'
      hinweis: Zwischen formeller und materieller Illegalität unterscheiden; Beseitigung setzt materielle
        Illegalität voraus.
      children:
      - label: a) Genehmigungsbedürftigkeit und fehlende Genehmigung (formelle Illegalität)
      - label: b) Widerspruch zu bauplanungs- oder bauordnungsrechtlichen Vorschriften (materielle Illegalität)
      - label: c) Verfahrensfreiheit schließt materielle Illegalität nicht aus
    - label: 2. Kein Bestandsschutz (Art. 14 Abs. 1 GG)
    - label: '3. Richtiger Adressat: Bauherr, Eigentümer, Nutzer'
    - label: 4. Rechtsfolge
      hinweis: 'Ermessen: Entschließung, Auswahl der Maßnahme, Verhältnismäßigkeit, Gleichbehandlung (keine
        Gleichheit im Unrecht).'
      children:
      - label: a) Geeignetheit
      - label: b) Erforderlichkeit (milderes Mittel, etwa Nachgenehmigung)
      - label: c) Angemessenheit
  - label: IV. Rechtsschutz
    children:
    - label: 1. Anfechtungsklage gegen die Verfügung
    - label: 2. Vorläufiger Rechtsschutz, § 80 Abs. 5 VwGO, soweit sofort vollziehbar
faelle:
- slug: sh-fall-bo-bestandsschutz
  title: Die Garage von 1975
  difficulty: 3
  minutes: 45
  quellen:
  - Eigener Sachverhalt der Redaktion
  - LBO SH, amtliche Fassung
  facts: E ist Eigentümerin einer Garage in Schleswig-Holstein, die 1975 rechtmäßig genehmigt und errichtet
    wurde und damals den Abstandsvorschriften entsprach. Nach späteren Änderungen der Abstandsvorschriften
    hält die Garage heute den Mindestabstand zur Grenze nicht mehr ein. E nutzt die Garage unverändert.
    Die Bauaufsichtsbehörde ordnet die Beseitigung der Garage an, weil sie dem geltenden Recht widerspreche.
    Eine konkrete Gefahr für Leib, Leben oder Gesundheit geht von der Garage nicht aus.
  question: Ist die Beseitigungsanordnung rechtmäßig?
  steps:
  - prompt: Welche Voraussetzung hat die Beseitigungsanordnung nach der LBO SH?
    erwartung: Die Beseitigung setzt voraus, dass die bauliche Anlage rechtswidrig ist, und gehört zu
      den bauaufsichtlichen Eingriffsmaßnahmen. Zu prüfen ist, ob die Garage rechtswidrig im Sinne der
      Eingriffsnorm ist.
  - prompt: War die Garage formell und materiell legal?
    erwartung: 'Ja: Sie wurde 1975 genehmigt (formelle Legalität) und entsprach damals den Vorschriften
      (materielle Legalität). Dass sie heute dem geänderten Abstandsrecht nicht mehr entspricht, ändert
      daran nichts, solange Bestandsschutz besteht.'
  - prompt: Besteht Bestandsschutz und wirkt er hier?
    erwartung: 'Ja: Aus Art. 14 Abs. 1 GG folgt Bestandsschutz für die rechtmäßig errichtete und unverändert
      genutzte Garage. Eine spätere Rechtsänderung rechtfertigt allein keine Beseitigung.'
  - prompt: Ist eine Anpassung ausnahmsweise zulässig?
    erwartung: 'Nein: Nachträgliche Anpassungen sind nur bei gesetzlicher Ermächtigung und erheblicher
      Gefahr zulässig. Eine solche Gefahr besteht nicht. Die Beseitigungsanordnung ist rechtswidrig.'
  expectation:
    pruefpunkte:
    - id: p1
      label: Beseitigungsanordnung setzt Rechtswidrigkeit der Anlage voraus (bauaufsichtliche Eingriffsbefugnis
        der LBO SH)
      weight: 1.5
      required: false
      keywords:
      - Beseitigungsanordnung
      - Eingriffsbefugnis
      - LBO SH
      - rechtswidrige bauliche Anlage
