      card_slugs:
      - sh-bo-eingriff
    - id: p2
      label: Formelle und materielle Legalität der 1975 genehmigten Garage erkannt
      weight: 2.0
      required: true
      keywords:
      - genehmigt
      - formell legal
      - materiell legal
      - damals rechtmäßig
      - Baugenehmigung von 1975
      card_slugs:
      - sh-bo-bestandsschutz
    - id: p3
      label: Bestandsschutz aus Art. 14 Abs. 1 GG trotz späterer Rechtsänderung
      weight: 3.0
      required: true
      norms:
      - Art. 14 Abs. 1 GG
      keywords:
      - Bestandsschutz
      - Art. 14 Abs. 1 GG
      - spätere Rechtsänderung
      - Rechtsänderung
      - genehmigter Zustand
      card_slugs:
      - sh-bo-bestandsschutz
    - id: p4
      label: Keine nachträgliche Anpassung mangels erheblicher Gefahr
      weight: 2.0
