  title: Polizei- und Ordnungsrecht Berlin
  parent: or-sicherheitsrecht-generalklausel-standardmassnahmen
  bundesland: BE
  relevance: 4
  stand: 2026-09
  redaktion:
    erzeugt_von: claude-code (Redaktionsentwurf)
    status: in-pruefung
