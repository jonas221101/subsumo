cards:
- slug: be-por-generalklausel
  type: norm
  front: Wo steht die polizeiliche Generalklausel in Berlin und was setzt sie voraus?
  back: 'Fundstelle: § 17 Abs. 1 ASOG Bln. Die Generalklausel ermächtigt zu den notwendigen Maßnahmen,
    um eine im Einzelfall bestehende Gefahr für die öffentliche Sicherheit oder Ordnung abzuwehren. Sie
    ist subsidiär: Greift eine Standardmaßnahme oder ein Spezialgesetz, geht dieses vor. Auf der Rechtsfolgenseite
    besteht Ermessen, begrenzt durch den Grundsatz der Verhältnismäßigkeit. Zum Schutz privater Rechte
    wird die Gefahrenabwehr nur subsidiär tätig: Ein Einschreiten kommt nur in Betracht, wenn gerichtlicher
    Schutz nicht rechtzeitig zu erlangen ist und ohne die Maßnahme die Vereitelung oder wesentliche Erschwerung
    der Rechtsverwirklichung droht.'
  norms:
  - § 17 Abs. 1 ASOG Bln
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: be-por-standardmassnahmen
  type: norm
  front: Wo stehen die polizeilichen Standardmaßnahmen in Berlin?
  back: '§§ 18 ff. ASOG Bln - unter anderem Identitätsfeststellung, Platzverweis, Gewahrsam, Durchsuchung
    von Personen und Sachen, Sicherstellung. Standardmaßnahmen sind abschließende Spezialregelungen: Liegen
    ihre Voraussetzungen nicht vor, darf nicht auf die Generalklausel ausgewichen werden (Sperrwirkung).'
  norms:
  - §§ 18 ff. ASOG Bln
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: be-por-aufbau
  type: schema_step
  front: 'Aufbau: Rechtmäßigkeit einer Gefahrenabwehrmaßnahme nach dem Landesrecht von Berlin'
  back: 'I. Ermächtigungsgrundlage (Allgemeines Sicherheits- und Ordnungsgesetz (ASOG Bln): Standardmaßnahme
    vor Generalklausel). II. Formelle Rechtmäßigkeit: 1. Zuständigkeit (sachlich: welche Behörde - Ordnungsbehörden
    und Polizei im ASOG (§§ 2 ff.); Berlin ist Einheitsgemeinde mit Bezirken (BezVG); örtlich; instanziell),
    2. Verfahren (Anhörung nach § 28 VwVfG, anwendbar über § 1 Abs. 1 VwVfG Bln), 3. Form. III. Materielle
    Rechtmäßigkeit: 1. Tatbestand (Schutzgut, Gefahrbegriff, Gefahrenprognose ex ante), 2. richtiger Adressat
    (Störer: §§ 13, 14, 16 ASOG Bln), 3. Rechtsfolge: Ermessen und Verhältnismäßigkeit (geeignet, erforderlich,
    angemessen).'
  norms:
  - § 17 Abs. 1 ASOG Bln
  - §§ 13, 14, 16 ASOG Bln
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: be-por-stoerer
  type: norm
  front: Wo sind Verhaltensstörer, Zustandsstörer und Nichtstörer in Berlin geregelt?
  back: '§§ 13, 14, 16 ASOG Bln. Verhaltensstörer: wer die Gefahr durch sein Verhalten verursacht (Theorie
    der unmittelbaren Verursachung; Zweckveranlasser als Streitfrage). Zustandsstörer: Inhaber der tatsächlichen
    Gewalt bzw. Eigentümer einer gefährlichen Sache. Nichtstörer: Inanspruchnahme nur unter den engen
    Voraussetzungen des polizeilichen Notstands (gegenwärtige erhebliche Gefahr, Störer nicht greifbar,
    Behörde selbst nicht in der Lage), mit Entschädigungsanspruch.'
  norms:
  - §§ 13, 14, 16 ASOG Bln
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: be-por-zustaendigkeit
  type: definition
  front: Wer ist in Berlin für die Gefahrenabwehr zuständig - Ordnungs-/Sicherheitsbehörde oder Polizei?
  back: 'Ordnungsbehörden und Polizei im ASOG (§§ 2 ff.); Berlin ist Einheitsgemeinde mit Bezirken (BezVG).
    Prüfungsrelevant ist die Abgrenzung: Die allgemeine Gefahrenabwehr liegt grundsätzlich bei den Verwaltungs-/Ordnungsbehörden;
    der Polizeivollzugsdienst wird tätig, wenn die Abwehr keinen Aufschub duldet (Eilfall) oder eine besondere
    Zuweisung besteht. Ein Handeln der unzuständigen Behörde macht die Maßnahme formell rechtswidrig.'
  norms:
  - Allgemeines Sicherheits- und Ordnungsgesetz (ASOG Bln)
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: be-por-vollstreckung
  type: norm
  front: Nach welchem Gesetz wird eine Gefahrenabwehrverfügung in Berlin vollstreckt?
  back: 'Verwaltungs-Vollstreckungsgesetz (VwVG) des Bundes, das in Berlin über § 5a VwVfG Bln anwendbar
    ist. Für die Anwendung unmittelbaren Zwangs durch Vollzugsbeamte gilt ergänzend das Gesetz über die
    Anwendung unmittelbaren Zwanges bei der Ausübung öffentlicher Gewalt durch Vollzugsbeamte des Landes
    Berlin (UZwG Bln). Regelfall ist das gestreckte Verfahren: Grundverfügung - Androhung - Festsetzung
    - Anwendung des Zwangsmittels (Ersatzvornahme, Zwangsgeld, unmittelbarer Zwang). Bei Gefahr im Verzug
    sind Sofortvollzug bzw. unmittelbare Ausführung ohne vorausgehenden Verwaltungsakt möglich; die Kosten
    trägt der Pflichtige.'
  norms:
  - Verwaltungs-Vollstreckungsgesetz des Bundes (VwVG), anwendbar über § 5a VwVfG Bln
  - Gesetz über die Anwendung unmittelbaren Zwanges bei der Ausübung öffentlicher Gewalt durch Vollzugsbeamte
    des Landes Berlin (UZwG Bln)
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
