cards:
- slug: be-por-generalklausel
  type: norm
  front: Wo steht die polizeiliche Generalklausel in Berlin und was setzt sie voraus?
  back: 'Fundstelle: § 17 Abs. 1 ASOG Bln. Die Generalklausel ermaechtigt zu den notwendigen Massnahmen,
    um eine im Einzelfall bestehende Gefahr fuer die oeffentliche Sicherheit oder Ordnung abzuwehren.
    Sie ist subsidiaer: Greift eine Standardmassnahme oder ein Spezialgesetz, geht dieses vor. Auf der
    Rechtsfolgenseite besteht Ermessen, begrenzt durch den Grundsatz der Verhaeltnismaessigkeit.'
  norms:
  - § 17 Abs. 1 ASOG Bln
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: be-por-standardmassnahmen
  type: norm
  front: Wo stehen die polizeilichen Standardmassnahmen in Berlin?
  back: '§§ 18 ff. ASOG Bln - unter anderem Identitaetsfeststellung, Platzverweis, Gewahrsam, Durchsuchung
    von Personen und Sachen, Sicherstellung. Standardmassnahmen sind abschliessende Spezialregelungen:
    Liegen ihre Voraussetzungen nicht vor, darf nicht auf die Generalklausel ausgewichen werden (Sperrwirkung).'
  norms:
  - §§ 18 ff. ASOG Bln
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: be-por-aufbau
  type: schema_step
  front: 'Aufbau: Rechtmaessigkeit einer Gefahrenabwehrmassnahme nach dem Landesrecht von Berlin'
  back: 'I. Ermaechtigungsgrundlage (Allgemeines Sicherheits- und Ordnungsgesetz (ASOG Bln): Standardmassnahme
    vor Generalklausel). II. Formelle Rechtmaessigkeit: 1. Zustaendigkeit (sachlich: welche Behoerde -
    Ordnungsbehoerden und Polizei im ASOG (§§ 2 ff.); Berlin ist Einheitsgemeinde mit Bezirken (BezVG);
    oertlich; instanziell), 2. Verfahren (Anhoerung, § 28 VwVfG bzw. Landesrecht), 3. Form. III. Materielle
    Rechtmaessigkeit: 1. Tatbestand (Schutzgut, Gefahrbegriff, Gefahrenprognose ex ante), 2. richtiger
    Adressat (Stoerer: §§ 13, 14, 16 ASOG Bln), 3. Rechtsfolge: Ermessen und Verhaeltnismaessigkeit (geeignet,
    erforderlich, angemessen).'
  norms:
  - § 17 Abs. 1 ASOG Bln
  - §§ 13, 14, 16 ASOG Bln
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: be-por-stoerer
  type: norm
  front: Wo sind Verhaltensstoerer, Zustandsstoerer und Nichtstoerer in Berlin geregelt?
  back: '§§ 13, 14, 16 ASOG Bln. Verhaltensstoerer: wer die Gefahr durch sein Verhalten verursacht (Theorie
    der unmittelbaren Verursachung; Zweckveranlasser als Streitfrage). Zustandsstoerer: Inhaber der tatsaechlichen
    Gewalt bzw. Eigentuemer einer gefaehrlichen Sache. Nichtstoerer: Inanspruchnahme nur unter den engen
    Voraussetzungen des polizeilichen Notstands (gegenwaertige erhebliche Gefahr, Stoerer nicht greifbar,
    Behoerde selbst nicht in der Lage), mit Entschaedigungsanspruch.'
  norms:
  - §§ 13, 14, 16 ASOG Bln
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: be-por-zustaendigkeit
  type: definition
  front: Wer ist in Berlin fuer die Gefahrenabwehr zustaendig - Ordnungs-/Sicherheitsbehoerde oder Polizei?
  back: 'Ordnungsbehoerden und Polizei im ASOG (§§ 2 ff.); Berlin ist Einheitsgemeinde mit Bezirken (BezVG).
    Pruefungsrelevant ist die Abgrenzung: Die allgemeine Gefahrenabwehr liegt grundsaetzlich bei den Verwaltungs-/Ordnungsbehoerden;
    der Polizeivollzugsdienst wird taetig, wenn die Abwehr keinen Aufschub duldet (Eilfall) oder eine
    besondere Zuweisung besteht. Ein Handeln der unzustaendigen Behoerde macht die Massnahme formell rechtswidrig.'
  norms:
  - Allgemeines Sicherheits- und Ordnungsgesetz (ASOG Bln)
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: be-por-vollstreckung
  type: norm
  front: Nach welchem Gesetz wird eine Gefahrenabwehrverfuegung in Berlin vollstreckt?
  back: 'Verwaltungs-Vollstreckungsgesetz des Bundes ueber § 5a VwVfG Bln (pruefen). Regelfall ist das
    gestreckte Verfahren: Grundverfuegung - Androhung - Festsetzung - Anwendung des Zwangsmittels (Ersatzvornahme,
    Zwangsgeld, unmittelbarer Zwang). Bei Gefahr im Verzug sind Sofortvollzug bzw. unmittelbare Ausfuehrung
    ohne vorausgehenden Verwaltungsakt moeglich; die Kosten traegt der Pflichtige.'
  norms:
  - Verwaltungs-Vollstreckungsgesetz des Bundes ueber § 5a VwVfG Bln (pruefen)
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
