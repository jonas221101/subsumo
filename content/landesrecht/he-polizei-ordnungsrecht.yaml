cards:
- slug: he-por-generalklausel
  type: norm
  front: Wo steht die polizeiliche Generalklausel in Hessen und was setzt sie voraus?
  back: 'Fundstelle: § 11 HSOG. Die Generalklausel ermächtigt zu den notwendigen Maßnahmen, um eine im
    Einzelfall bestehende Gefahr für die öffentliche Sicherheit oder Ordnung abzuwehren. Sie ist subsidiär:
    Greift eine Standardmaßnahme oder ein Spezialgesetz, geht dieses vor. Auf der Rechtsfolgenseite besteht
    Ermessen, begrenzt durch den Grundsatz der Verhältnismäßigkeit. Zum Schutz privater Rechte wird die
    Gefahrenabwehr nur subsidiär tätig: Ein Einschreiten kommt nur in Betracht, wenn gerichtlicher Schutz
    nicht rechtzeitig zu erlangen ist und ohne die Maßnahme die Vereitelung oder wesentliche Erschwerung
    der Rechtsverwirklichung droht.'
  norms:
  - § 11 HSOG
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: he-por-standardmassnahmen
  type: norm
  front: Wo stehen die polizeilichen Standardmaßnahmen in Hessen?
  back: '§§ 12 ff. HSOG - unter anderem Identitätsfeststellung, Platzverweis, Gewahrsam, Durchsuchung
    von Personen und Sachen, Sicherstellung. Standardmaßnahmen sind abschließende Spezialregelungen: Liegen
    ihre Voraussetzungen nicht vor, darf nicht auf die Generalklausel ausgewichen werden (Sperrwirkung).'
  norms:
  - §§ 12 ff. HSOG
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: he-por-aufbau
  type: schema_step
  front: 'Aufbau: Rechtmäßigkeit einer Gefahrenabwehrmaßnahme nach dem Landesrecht von Hessen'
  back: 'I. Ermächtigungsgrundlage (Hessisches Gesetz über die öffentliche Sicherheit und Ordnung (HSOG):
    Standardmaßnahme vor Generalklausel). II. Formelle Rechtmäßigkeit: 1. Zuständigkeit (sachlich: welche
    Behörde - Gefahrenabwehrbehörden (allgemeine Ordnungsbehörden) und Polizeibehörden - beide im HSOG
    (§§ 1 ff.); Polizei bei Eilbedürftigkeit (§ 2 HSOG); örtlich; instanziell), 2. Verfahren (Anhörung
    nach § 28 HVwVfG), 3. Form. III. Materielle Rechtmäßigkeit: 1. Tatbestand (Schutzgut, Gefahrbegriff,
    Gefahrenprognose ex ante), 2. richtiger Adressat (Störer: §§ 6, 7, 9 HSOG), 3. Rechtsfolge: Ermessen
    und Verhältnismäßigkeit (geeignet, erforderlich, angemessen).'
  norms:
  - § 11 HSOG
  - §§ 6, 7, 9 HSOG
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: he-por-stoerer
  type: norm
  front: Wo sind Verhaltensstörer, Zustandsstörer und Nichtstörer in Hessen geregelt?
  back: '§§ 6, 7, 9 HSOG. Verhaltensstörer: wer die Gefahr durch sein Verhalten verursacht (Theorie der
    unmittelbaren Verursachung; Zweckveranlasser als Streitfrage). Zustandsstörer: Inhaber der tatsächlichen
    Gewalt bzw. Eigentümer einer gefährlichen Sache. Nichtstörer: Inanspruchnahme nur unter den engen
    Voraussetzungen des polizeilichen Notstands (gegenwärtige erhebliche Gefahr, Störer nicht greifbar,
    Behörde selbst nicht in der Lage), mit Entschädigungsanspruch.'
  norms:
  - §§ 6, 7, 9 HSOG
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: he-por-zustaendigkeit
  type: definition
  front: Wer ist in Hessen für die Gefahrenabwehr zuständig - Ordnungs-/Sicherheitsbehörde oder Polizei?
  back: 'Gefahrenabwehrbehörden (allgemeine Ordnungsbehörden) und Polizeibehörden - beide im HSOG (§§
    1 ff.); Polizei bei Eilbedürftigkeit (§ 2 HSOG). Prüfungsrelevant ist die Abgrenzung: Die allgemeine
    Gefahrenabwehr liegt grundsätzlich bei den Verwaltungs-/Ordnungsbehörden; der Polizeivollzugsdienst
    wird tätig, wenn die Abwehr keinen Aufschub duldet (Eilfall) oder eine besondere Zuweisung besteht.
    Ein Handeln der unzuständigen Behörde macht die Maßnahme formell rechtswidrig.'
  norms:
  - Hessisches Gesetz über die öffentliche Sicherheit und Ordnung (HSOG)
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: he-por-vollstreckung
  type: norm
  front: Nach welchem Gesetz wird eine Gefahrenabwehrverfügung in Hessen vollstreckt?
  back: 'Hessisches Verwaltungsvollstreckungsgesetz (HessVwVG). Regelfall ist das gestreckte Verfahren:
    Grundverfügung - Androhung - Festsetzung - Anwendung des Zwangsmittels (Ersatzvornahme, Zwangsgeld,
    unmittelbarer Zwang). Bei Gefahr im Verzug sind Sofortvollzug bzw. unmittelbare Ausführung ohne vorausgehenden
    Verwaltungsakt möglich; die Kosten trägt der Pflichtige.'
  norms:
  - Hessisches Verwaltungsvollstreckungsgesetz (HessVwVG)
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
