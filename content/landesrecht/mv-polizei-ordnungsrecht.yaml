cards:
- slug: mv-por-generalklausel
  type: norm
  front: Wo steht die polizeiliche Generalklausel in Mecklenburg-Vorpommern und was setzt sie voraus?
  back: 'Fundstelle: § 13 SOG M-V. Die Generalklausel ermächtigt zu den notwendigen Maßnahmen, um eine
    im Einzelfall bestehende Gefahr für die öffentliche Sicherheit oder Ordnung abzuwehren. Sie ist subsidiär:
    Greift eine Standardmaßnahme oder ein Spezialgesetz, geht dieses vor. Auf der Rechtsfolgenseite besteht
    Ermessen, begrenzt durch den Grundsatz der Verhältnismäßigkeit. Zum Schutz privater Rechte wird die
    Gefahrenabwehr nur subsidiär tätig: Ein Einschreiten kommt nur in Betracht, wenn gerichtlicher Schutz
    nicht rechtzeitig zu erlangen ist und ohne die Maßnahme die Vereitelung oder wesentliche Erschwerung
    der Rechtsverwirklichung droht.'
  norms:
  - § 13 SOG M-V
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: mv-por-aufbau
  type: schema_step
  front: 'Aufbau: Rechtmäßigkeit einer Gefahrenabwehrmaßnahme nach dem Landesrecht von Mecklenburg-Vorpommern'
  back: 'I. Ermächtigungsgrundlage (Sicherheits- und Ordnungsgesetz Mecklenburg-Vorpommern (SOG M-V):
    Standardmaßnahme vor Generalklausel). II. Formelle Rechtmäßigkeit: 1. Zuständigkeit (sachlich: welche
    Behörde - Ordnungsbehörden und Polizei im SOG M-V; Polizei bei Eilbedürftigkeit; örtlich; instanziell),
    2. Verfahren (Anhörung nach dem jeweiligen Landesverwaltungsverfahrensgesetz), 3. Form. III. Materielle
    Rechtmäßigkeit: 1. Tatbestand (Schutzgut, Gefahrbegriff, Gefahrenprognose ex ante), 2. richtiger Adressat
    (Störer: §§ 69, 70, 71 SOG M-V), 3. Rechtsfolge: Ermessen und Verhältnismäßigkeit (geeignet, erforderlich,
    angemessen).'
  norms:
  - § 13 SOG M-V
  - §§ 69, 70, 71 SOG M-V
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: mv-por-stoerer
  type: norm
  front: Wo sind Verhaltensstörer, Zustandsstörer und Nichtstörer in Mecklenburg-Vorpommern geregelt?
  back: '§§ 69, 70, 71 SOG M-V. Verhaltensstörer: wer die Gefahr durch sein Verhalten verursacht (Theorie
    der unmittelbaren Verursachung; Zweckveranlasser als Streitfrage). Zustandsstörer: Inhaber der tatsächlichen
    Gewalt bzw. Eigentümer einer gefährlichen Sache. Nichtstörer: Inanspruchnahme nur unter den engen
    Voraussetzungen des polizeilichen Notstands (gegenwärtige erhebliche Gefahr, Störer nicht greifbar,
    Behörde selbst nicht in der Lage), mit Entschädigungsanspruch.'
  norms:
  - §§ 69, 70, 71 SOG M-V
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: mv-por-zustaendigkeit
  type: definition
  front: Wer ist in Mecklenburg-Vorpommern für die Gefahrenabwehr zuständig - Ordnungs-/Sicherheitsbehörde
    oder Polizei?
  back: 'Ordnungsbehörden und Polizei im SOG M-V; Polizei bei Eilbedürftigkeit. Prüfungsrelevant ist die
    Abgrenzung: Die allgemeine Gefahrenabwehr liegt grundsätzlich bei den Verwaltungs-/Ordnungsbehörden;
    der Polizeivollzugsdienst wird tätig, wenn die Abwehr keinen Aufschub duldet (Eilfall) oder eine besondere
    Zuweisung besteht. Ein Handeln der unzuständigen Behörde macht die Maßnahme formell rechtswidrig.'
  norms:
  - Sicherheits- und Ordnungsgesetz Mecklenburg-Vorpommern (SOG M-V)
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: mv-por-vollstreckung
  type: norm
  front: Nach welchem Gesetz wird eine Gefahrenabwehrverfügung in Mecklenburg-Vorpommern vollstreckt?
  back: 'Verwaltungsvollstreckungsgesetz M-V (VwVG M-V). Regelfall ist das gestreckte Verfahren: Grundverfügung
    - Androhung - Festsetzung - Anwendung des Zwangsmittels (Ersatzvornahme, Zwangsgeld, unmittelbarer
    Zwang). Bei Gefahr im Verzug sind Sofortvollzug bzw. unmittelbare Ausführung ohne vorausgehenden Verwaltungsakt
    möglich; die Kosten trägt der Pflichtige.'
  norms:
  - Verwaltungsvollstreckungsgesetz M-V (VwVG M-V)
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
