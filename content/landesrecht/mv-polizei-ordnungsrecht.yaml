cards:
- slug: mv-por-generalklausel
  type: norm
  front: Wo steht die polizeiliche Generalklausel in Mecklenburg-Vorpommern und was setzt sie voraus?
  back: 'Fundstelle: § 13 SOG M-V. Die Generalklausel ermaechtigt zu den notwendigen Massnahmen, um eine
    im Einzelfall bestehende Gefahr fuer die oeffentliche Sicherheit oder Ordnung abzuwehren. Sie ist
    subsidiaer: Greift eine Standardmassnahme oder ein Spezialgesetz, geht dieses vor. Auf der Rechtsfolgenseite
    besteht Ermessen, begrenzt durch den Grundsatz der Verhaeltnismaessigkeit.'
  norms:
  - § 13 SOG M-V
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: mv-por-aufbau
  type: schema_step
  front: 'Aufbau: Rechtmaessigkeit einer Gefahrenabwehrmassnahme nach dem Landesrecht von Mecklenburg-Vorpommern'
  back: 'I. Ermaechtigungsgrundlage (Sicherheits- und Ordnungsgesetz Mecklenburg-Vorpommern (SOG M-V):
    Standardmassnahme vor Generalklausel). II. Formelle Rechtmaessigkeit: 1. Zustaendigkeit (sachlich:
    welche Behoerde - Ordnungsbehoerden und Polizei im SOG M-V; Polizei bei Eilbeduerftigkeit; oertlich;
    instanziell), 2. Verfahren (Anhoerung, § 28 VwVfG bzw. Landesrecht), 3. Form. III. Materielle Rechtmaessigkeit:
    1. Tatbestand (Schutzgut, Gefahrbegriff, Gefahrenprognose ex ante), 2. richtiger Adressat (Stoerer:
    §§ 69, 70, 71 SOG M-V), 3. Rechtsfolge: Ermessen und Verhaeltnismaessigkeit (geeignet, erforderlich,
    angemessen).'
  norms:
  - § 13 SOG M-V
  - §§ 69, 70, 71 SOG M-V
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: mv-por-stoerer
  type: norm
  front: Wo sind Verhaltensstoerer, Zustandsstoerer und Nichtstoerer in Mecklenburg-Vorpommern geregelt?
  back: '§§ 69, 70, 71 SOG M-V. Verhaltensstoerer: wer die Gefahr durch sein Verhalten verursacht (Theorie
    der unmittelbaren Verursachung; Zweckveranlasser als Streitfrage). Zustandsstoerer: Inhaber der tatsaechlichen
    Gewalt bzw. Eigentuemer einer gefaehrlichen Sache. Nichtstoerer: Inanspruchnahme nur unter den engen
    Voraussetzungen des polizeilichen Notstands (gegenwaertige erhebliche Gefahr, Stoerer nicht greifbar,
    Behoerde selbst nicht in der Lage), mit Entschaedigungsanspruch.'
  norms:
  - §§ 69, 70, 71 SOG M-V
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: mv-por-zustaendigkeit
  type: definition
  front: Wer ist in Mecklenburg-Vorpommern fuer die Gefahrenabwehr zustaendig - Ordnungs-/Sicherheitsbehoerde
    oder Polizei?
  back: 'Ordnungsbehoerden und Polizei im SOG M-V; Polizei bei Eilbeduerftigkeit. Pruefungsrelevant ist
    die Abgrenzung: Die allgemeine Gefahrenabwehr liegt grundsaetzlich bei den Verwaltungs-/Ordnungsbehoerden;
    der Polizeivollzugsdienst wird taetig, wenn die Abwehr keinen Aufschub duldet (Eilfall) oder eine
    besondere Zuweisung besteht. Ein Handeln der unzustaendigen Behoerde macht die Massnahme formell rechtswidrig.'
  norms:
  - Sicherheits- und Ordnungsgesetz Mecklenburg-Vorpommern (SOG M-V)
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: mv-por-vollstreckung
  type: norm
  front: Nach welchem Gesetz wird eine Gefahrenabwehrverfuegung in Mecklenburg-Vorpommern vollstreckt?
  back: 'Verwaltungsvollstreckungsgesetz M-V (VwVG M-V). Regelfall ist das gestreckte Verfahren: Grundverfuegung
    - Androhung - Festsetzung - Anwendung des Zwangsmittels (Ersatzvornahme, Zwangsgeld, unmittelbarer
    Zwang). Bei Gefahr im Verzug sind Sofortvollzug bzw. unmittelbare Ausfuehrung ohne vorausgehenden
    Verwaltungsakt moeglich; die Kosten traegt der Pflichtige.'
  norms:
  - Verwaltungsvollstreckungsgesetz M-V (VwVG M-V)
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
