  title: Kommunalrecht und Bezirksverwaltung Hamburg
  parent: or-vwvfg-verwaltungsakt
  bundesland: HH
  relevance: 4
  stand: 2026-10
  redaktion:
    erzeugt_von: claude-sonnet (Pflichtstoff-Vervollständigung)
