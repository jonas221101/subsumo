cards:
- slug: sn-lra-vwvfg
  type: norm
  front: Welches Verwaltungsverfahrensgesetz gilt für Landesbehörden in Sachsen?
  back: Sächsisches Verwaltungsverfahrens- und Verwaltungszustellungsgesetz (SächsVwVfZG) - Verweisung
    auf das VwVfG des Bundes. Das VwVfG des Bundes gilt nur für Bundesbehörden (§ 1 VwVfG); für Landes-
    und Kommunalbehörden ist das Landesgesetz maßgeblich. Bei Verweisungsgesetzen werden die Bundesnormen
    'entsprechend' angewendet und sind so zu zitieren (z. B. '§ 35 VwVfG i. V. m. § 1 des Landesgesetzes'),
    bei Vollgesetzen ist die Landesnorm selbst zu zitieren.
  norms:
  - Sächsisches Verwaltungsverfahrens- und Verwaltungszustellungsgesetz (SächsVwVfZG) - Verweisung auf
    das VwVfG des Bundes
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sn-lra-verfassungsgericht
  type: norm
  front: Gibt es in Sachsen eine Individualverfassungsbeschwerde zum Landesverfassungsgericht?
  back: 'Ja - Art. 81 Abs. 1 Nr. 4 SächsVerf, § 27 SächsVerfGHG (nach Rechtswegerschöpfung, mit Ausnahmen). Zuständiges Gericht: Verfassungsgerichtshof des Freistaates
    Sachsen auf Grundlage der Verfassung des Freistaates Sachsen (SächsVerf). Verfahrensgegenstand ist
    nur die Verletzung von Landesgrundrechten durch Landesstaatsgewalt; Bundesrecht ist Prüfungsmaßstab
    nur, soweit die Landesverfassung darauf verweist. Daneben steht immer die Verfassungsbeschwerde zum
    BVerfG (Art. 93 Abs. 1 Nr. 4a GG).'
  norms:
  - Verfassung des Freistaates Sachsen (SächsVerf)
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sn-lra-kommunalverfassung
  type: norm
  front: Welches Gesetz regelt die Kommunalverfassung in Sachsen und welche Hauptorgane hat die Gemeinde?
  back: 'Sächsische Gemeindeordnung (SächsGemO): Gemeinderat (§ 27) und Bürgermeister (§ 51). Grundlage
    ist die Selbstverwaltungsgarantie (Art. 28 Abs. 2 GG und Landesverfassung): eigenverantwortliche Regelung
    aller Angelegenheiten der örtlichen Gemeinschaft. Klausurklassiker: Zuständigkeitsstreit zwischen
    Vertretung und Verwaltungsspitze, Kommunalverfassungsstreit, Rechtsaufsicht.'
  norms:
  - 'Sächsische Gemeindeordnung (SächsGemO): Gemeinderat (§ 27) und Bürgermeister (§ 51)'
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sn-lra-bauordnung
  type: norm
  front: Wie heißt die Bauordnung in Sachsen und wie ist eine Baugenehmigung zu prüfen?
  back: 'Sächsische Bauordnung (SächsBO). Anspruch auf Baugenehmigung besteht, wenn dem Vorhaben keine
    öffentlich-rechtlichen Vorschriften entgegenstehen: Genehmigungsbedürftigkeit (Errichtung, Änderung,
    Nutzungsänderung), keine Genehmigungsfreiheit, bauplanungsrechtliche Zulässigkeit nach §§ 29 ff. BauGB
    (Bundesrecht), bauordnungsrechtliche Zulässigkeit nach der Landesbauordnung (Abstandsflächen, Gestaltung,
    Stellplätze).'
  norms:
  - Sächsische Bauordnung (SächsBO)
  - §§ 29 ff. BauGB
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sn-lra-pflichtstoff
  type: definition
  front: Welche Landesrechtsgebiete gehören in Sachsen zum Pflichtstoff des Öffentlichen Rechts?
  back: Polizeirecht (SächsPVDG, SächsPBG); Kommunalrecht (SächsGemO); Bauordnungsrecht (SächsBO); Landesverfassung.
    Landesrecht wird im Examen fast nie isoliert, sondern eingebettet in eine verwaltungsprozessuale Einkleidung
    (Anfechtungs-/Verpflichtungsklage, vorläufiger Rechtsschutz) geprüft - die Landesnorm ist die Ermächtigungsgrundlage,
    der Aufbau bleibt der allgemeine.
  norms: []
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
