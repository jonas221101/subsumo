cards:
- slug: th-lra-vwvfg
  type: norm
  front: Welches Verwaltungsverfahrensgesetz gilt für Landesbehörden in Thüringen?
  back: Thüringer Verwaltungsverfahrensgesetz (ThürVwVfG) - Vollgesetz. Das VwVfG des Bundes gilt nur
    für Bundesbehörden (§ 1 VwVfG); für Landes- und Kommunalbehörden ist das Landesgesetz maßgeblich.
    Bei Verweisungsgesetzen werden die Bundesnormen 'entsprechend' angewendet und sind so zu zitieren
    (z. B. '§ 35 VwVfG i. V. m. § 1 des Landesgesetzes'), bei Vollgesetzen ist die Landesnorm selbst zu
    zitieren.
  norms:
  - Thüringer Verwaltungsverfahrensgesetz (ThürVwVfG) - Vollgesetz
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: th-lra-verfassungsgericht
  type: norm
  front: Gibt es in Thüringen eine Individualverfassungsbeschwerde zum Landesverfassungsgericht?
  back: 'Ja - Art. 80 Abs. 1 Nr. 1 ThürVerf. Zuständiges Gericht: Thüringer Verfassungsgerichtshof auf
    Grundlage der Verfassung des Freistaats Thüringen (ThürVerf). Verfahrensgegenstand ist nur die Verletzung
    von Landesgrundrechten durch Landesstaatsgewalt; Bundesrecht ist Prüfungsmaßstab nur, soweit die Landesverfassung
    darauf verweist. Daneben steht immer die Verfassungsbeschwerde zum BVerfG (Art. 93 Abs. 1 Nr. 4a GG).'
  norms:
  - Verfassung des Freistaats Thüringen (ThürVerf)
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: th-lra-kommunalverfassung
  type: norm
  front: Welches Gesetz regelt die Kommunalverfassung in Thüringen und welche Hauptorgane hat die Gemeinde?
  back: 'Thüringer Kommunalordnung (ThürKO): Gemeinderat und Bürgermeister. Grundlage ist die Selbstverwaltungsgarantie
    (Art. 28 Abs. 2 GG und Landesverfassung): eigenverantwortliche Regelung aller Angelegenheiten der
    örtlichen Gemeinschaft. Klausurklassiker: Zuständigkeitsstreit zwischen Vertretung und Verwaltungsspitze,
    Kommunalverfassungsstreit, Rechtsaufsicht.'
  norms:
  - 'Thüringer Kommunalordnung (ThürKO): Gemeinderat und Bürgermeister'
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: th-lra-bauordnung
  type: norm
  front: Wie heißt die Bauordnung in Thüringen und wie ist eine Baugenehmigung zu prüfen?
  back: 'Thüringer Bauordnung (ThürBO). Anspruch auf Baugenehmigung besteht, wenn dem Vorhaben keine öffentlich-rechtlichen
    Vorschriften entgegenstehen: Genehmigungsbedürftigkeit (Errichtung, Änderung, Nutzungsänderung), keine
    Genehmigungsfreiheit, bauplanungsrechtliche Zulässigkeit nach §§ 29 ff. BauGB (Bundesrecht), bauordnungsrechtliche
    Zulässigkeit nach der Landesbauordnung (Abstandsflächen, Gestaltung, Stellplätze).'
  norms:
  - Thüringer Bauordnung (ThürBO)
  - §§ 29 ff. BauGB
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: th-lra-pflichtstoff
  type: definition
  front: Welche Landesrechtsgebiete gehören in Thüringen zum Pflichtstoff des Öffentlichen Rechts?
  back: Polizei- und Ordnungsrecht (ThürPAG, ThürOBG); Kommunalrecht (ThürKO); Bauordnungsrecht (ThürBO);
    Landesverfassung. Landesrecht wird im Examen fast nie isoliert, sondern eingebettet in eine verwaltungsprozessuale
    Einkleidung (Anfechtungs-/Verpflichtungsklage, vorläufiger Rechtsschutz) geprüft - die Landesnorm
    ist die Ermächtigungsgrundlage, der Aufbau bleibt der allgemeine.
  norms: []
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
