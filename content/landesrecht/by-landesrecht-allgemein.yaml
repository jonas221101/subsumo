cards:
- slug: by-lra-vwvfg
  type: norm
  front: Welches Verwaltungsverfahrensgesetz gilt für Landesbehörden in Bayern?
  back: Bayerisches Verwaltungsverfahrensgesetz (BayVwVfG) - Vollgesetz. Das VwVfG des Bundes gilt nur
    für Bundesbehörden (§ 1 VwVfG); für Landes- und Kommunalbehörden ist das Landesgesetz maßgeblich.
    Bei Verweisungsgesetzen werden die Bundesnormen 'entsprechend' angewendet und sind so zu zitieren
    (z. B. '§ 35 VwVfG i. V. m. § 1 des Landesgesetzes'), bei Vollgesetzen ist die Landesnorm selbst zu
    zitieren.
  norms:
  - Bayerisches Verwaltungsverfahrensgesetz (BayVwVfG) - Vollgesetz
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: by-lra-verfassungsgericht
  type: norm
  front: Gibt es in Bayern eine Individualverfassungsbeschwerde zum Landesverfassungsgericht?
  back: 'Ja - Art. 120 BV, Art. 51 VfGHG; daneben Popularklage Art. 98 Satz 4 BV. Zuständiges Gericht:
    Bayerischer Verfassungsgerichtshof auf Grundlage der Verfassung des Freistaates Bayern (BV). Verfahrensgegenstand
    ist nur die Verletzung von Landesgrundrechten durch Landesstaatsgewalt; Bundesrecht ist Prüfungsmaßstab
    nur, soweit die Landesverfassung darauf verweist. Daneben steht immer die Verfassungsbeschwerde zum
    BVerfG (Art. 93 Abs. 1 Nr. 4a GG).'
  norms:
  - Verfassung des Freistaates Bayern (BV)
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: by-lra-kommunalverfassung
  type: norm
  front: Welches Gesetz regelt die Kommunalverfassung in Bayern und welche Hauptorgane hat die Gemeinde?
  back: 'Gemeindeordnung (GO): Gemeinderat (Art. 30) und erster Bürgermeister (Art. 34), Organe Art. 29
    GO. Grundlage ist die Selbstverwaltungsgarantie (Art. 28 Abs. 2 GG und Landesverfassung): eigenverantwortliche
    Regelung aller Angelegenheiten der örtlichen Gemeinschaft. Klausurklassiker: Zuständigkeitsstreit
    zwischen Vertretung und Verwaltungsspitze, Kommunalverfassungsstreit, Rechtsaufsicht.'
  norms:
  - 'Gemeindeordnung (GO): Gemeinderat (Art. 30) und erster Bürgermeister (Art. 34), Organe Art. 29 GO'
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: by-lra-bauordnung
  type: norm
  front: Wie heißt die Bauordnung in Bayern und wie ist eine Baugenehmigung zu prüfen?
  back: 'Bayerische Bauordnung (BayBO). Anspruch auf Baugenehmigung besteht, wenn dem Vorhaben keine öffentlich-rechtlichen
    Vorschriften entgegenstehen: Genehmigungsbedürftigkeit (Errichtung, Änderung, Nutzungsänderung), keine
    Genehmigungsfreiheit, bauplanungsrechtliche Zulässigkeit nach §§ 29 ff. BauGB (Bundesrecht), bauordnungsrechtliche
    Zulässigkeit nach der Landesbauordnung (Abstandsflächen, Gestaltung, Stellplätze).'
  norms:
  - Bayerische Bauordnung (BayBO)
  - §§ 29 ff. BauGB
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: by-lra-pflichtstoff
  type: definition
  front: Welche Landesrechtsgebiete gehören in Bayern zum Pflichtstoff des Öffentlichen Rechts?
  back: Sicherheitsrecht (PAG, LStVG); Kommunalrecht (GO, LKrO); Bauordnungsrecht (BayBO); Bayerisches
    Verfassungsrecht inkl. Popularklage. Landesrecht wird im Examen fast nie isoliert, sondern eingebettet
    in eine verwaltungsprozessuale Einkleidung (Anfechtungs-/Verpflichtungsklage, vorläufiger Rechtsschutz)
    geprüft - die Landesnorm ist die Ermächtigungsgrundlage, der Aufbau bleibt der allgemeine.
  norms: []
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
