    - label: "3. Höhe der Kosten, Ermessen"
faelle:
- slug: st-fall-por-abschleppen-feuerwehrzufahrt
  title: "Das Fahrzeug in der Feuerwehrzufahrt"
  difficulty: 3
  minutes: 55
  quellen:
  - "Landesgesetze in der amtlichen Fassung (Landesrechtsportal)"
  - "Eigenformulierung Redaktion"
  - "§ 80 Abs. 2 S. 1 Nr. 2 VwGO"
  facts: >-
      Der Eigentümer E eines Pkw parkt sein Fahrzeug in Magdeburg auf einer Zufahrt, die mit absolutem
      Haltverbot (Zeichen 283) und dem Zusatzzeichen „Feuerwehrzufahrt“ beschildert ist. Eine
      Mitarbeiterin des Ordnungsamts stellt fest, dass das Fahrzeug die Zufahrt zu einem
      Mehrfamilienhaus vollständig versperrt, in dem ein Rettungsweg für die Feuerwehr freizuhalten
      ist. Sie lässt das Fahrzeug sofort durch ein Abschleppunternehmen entfernen, ohne E zuvor
      anzusprechen oder anzuschreiben. E hat sich zum Zeitpunkt der Maßnahme in einem nahen Geschäft
      aufgehalten. Das Ordnungsamt erlässt später einen Kostenbescheid über die Abschleppkosten. E
      meint, ohne vorherigen Verwaltungsakt und ohne Androhung sei das Abschleppen rechtswidrig
      gewesen, der Kostenbescheid daher ebenfalls.
  question: >-
      Ist der Kostenbescheid rechtmäßig? Es ist zu unterstellen, dass der Kostenbescheid formell
      ordnungsgemäß ergangen ist.
  steps:
  - prompt: >-
        Woran knüpft die Kostenentscheidung an, und was ist deshalb inzident zu prüfen?
    erwartung: >-
        Die Kostenpflicht setzt eine rechtmäßige Vollstreckungsmaßnahme voraus. Weil das Fahrzeug im
        Sofortvollzug entfernt wurde, ist inzident zu prüfen, ob die Maßnahme rechtmäßig war.
  - prompt: "Gab es eine wirksame Grundverfügung, die vollstreckt werden durfte?"
    erwartung: >-
        Ja. Das Verkehrszeichen mit Zusatzzeichen ist eine Allgemeinverfügung (Verwaltungsakt), die mit
        der Bekanntgabe gegenüber dem Verkehrsteilnehmer wirksam wird und nach § 80 Abs. 2 S. 1 Nr. 2
        VwGO sofort vollziehbar ist. E hat sie missachtet.
  - prompt: "Waren Androhung und Festsetzung entbehrlich?"
    erwartung: >-
        Ja. Wegen der Versperrung des Rettungswegs besteht eine gegenwärtige Gefahr; ein Vorgehen im
        gestreckten Verfahren würde den Erfolg der Maßnahme gefährden. Das Ordnungsamt durfte im
        Sofortvollzug handeln.
  - prompt: "Ist das Abschleppen verhältnismäßig, und wer trägt die Kosten?"
    erwartung: >-
        Ja. Das Abschleppen ist geeignet und erforderlich, weil E nicht erreichbar war und kein milderes
        gleich wirksames Mittel zur Freihaltung der Zufahrt bestand. Angemessen ist es wegen der
        Bedeutung des Rettungswegs. E ist als Eigentümer und Verhaltensstörer (er hat das Fahrzeug
        abgestellt) Kostenschuldner. Der Kostenbescheid ist rechtmäßig.
  expectation:
    pruefpunkte:
    - id: p1
      label: >-
          Rechtmäßigkeit der Vollstreckungsmaßnahme als Voraussetzung der Kosten inzident geprüft
      weight: 2.5
      required: true
      keywords:
      - "Kostenbescheid"
      - "inzident"
      - "Rechtmäßigkeit der Vollstreckungsmaßnahme"
      - "Rechtmäßigkeit des Abschleppens"
      - "Sofortvollzug"
      card_slugs:
      - "st-por-kosten"
      - "st-por-zwang"
    - id: p2
      label: >-
          Verkehrszeichen als wirksame, sofort vollziehbare Grundverfügung erkannt
      weight: 2.0
      required: true
      norms:
      - "§ 80 Abs. 2 S. 1 Nr. 2 VwGO"
      keywords:
      - "Allgemeinverfügung"
      - "Verkehrszeichen"
      - "Haltverbot"
      - "§ 80 Abs. 2 S. 1 Nr. 2 VwGO"
