- slug: st-schema-por-sofortvollzug-kosten
  title: >-
      Abschleppen: Sofortvollzug und Kostenbescheid nach SOG LSA und VwVG LSA
  norms:
  - "Verwaltungsvollstreckungsgesetz Sachsen-Anhalt (VwVG LSA)"
  - "§ 80 Abs. 2 S. 1 Nr. 2 VwGO"
  quellen:
  - "Landesgesetze in der amtlichen Fassung (Landesrechtsportal)"
  - "Eigenformulierung Redaktion"
  steps:
  - label: >-
      I. Rechtmäßigkeit des Kostenbescheids: Ermächtigungsgrundlage
  - label: "II. Formelle Rechtmäßigkeit des Kostenbescheids"
    hinweis: "Zuständigkeit, Anhörung, Form."
  - label: "III. Materielle Rechtmäßigkeit"
    children:
