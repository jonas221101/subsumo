cards:
- slug: mv-kr-selbstverwaltung
  type: norm
  front: >-
    Was gewährleistet die kommunale Selbstverwaltung in Mecklenburg-Vorpommern und woraus folgt sie?
  back: >-
    Die Gemeinden haben das Recht, alle Angelegenheiten der örtlichen Gemeinschaft im Rahmen der Gesetze
    in eigener Verantwortung zu regeln (Art. 28 Abs. 2 S. 1 GG; Art. 72 Verf M-V). Man unterscheidet die
    Rechtssubjektsgarantie, die Rechtsinstitutionsgarantie und die subjektive Rechtsstellungsgarantie.
    Inhaltlich umfasst die Garantie die Gemeindehoheiten (Gebiets-, Organisations-, Personal-, Planungs-,
    Rechtsetzungs- und Finanzhoheit). Gesetzliche Eingriffe sind zulässig, wenn sie den Kernbereich wahren
    und im Randbereich verhältnismäßig sind. Die Gemeinde kann sich gegen Eingriffe mit der Kommunalverfassungsbeschwerde
    (Art. 93 Abs. 1 Nr. 4b GG) und, soweit vorgesehen, vor dem Landesverfassungsgericht wehren.
  norms:
  - Art. 28 Abs. 2 S. 1 GG
  - Art. 93 Abs. 1 Nr. 4b GG
  - Art. 72 Verf M-V
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-10
- slug: mv-kr-rastede
  type: rechtsprechung
  front: >-
    Welchen Grundsatz hat das BVerfG in der Rastede-Entscheidung zur Aufgabenverteilung zwischen Gemeinden
    und höheren Ebenen aufgestellt?
  back: >-
    Nach BVerfGE 79, 127 (Rastede) umfasst Art. 28 Abs. 2 S. 1 GG eine Zuständigkeitsvermutung zugunsten
    der Gemeinden: Sie sind grundsätzlich für alle Angelegenheiten der örtlichen Gemeinschaft zuständig
    (Universalität des Aufgabenbereichs). Der Entzug örtlicher Aufgaben und ihre Verlagerung auf eine
    höhere Ebene ist nur aus Gründen des Gemeinwohls zulässig, insbesondere wenn eine ordnungsgemäße Aufgabenwahrnehmung
    auf Gemeindeebene sonst nicht sichergestellt wäre; bloße Verwaltungsvereinfachung oder Zuständigkeitskonzentration
    genügt nicht. Für den Kernbereich gilt eine absolute Schranke, für den Randbereich das Verhältnismäßigkeitsprinzip.
    Für die Klausur: erst Betroffenheit des Schutzbereichs (örtliche Angelegenheit), dann Rechtfertigung
    des Eingriffs prüfen.
  norms:
  - Art. 28 Abs. 2 S. 1 GG
  quellen:
  - >-
    Rechtsprechung: BVerfGE 79, 127 (Rastede)
  - Eigenformulierung Redaktion
  stand: 2026-10
- slug: mv-kr-organe
  type: norm
  front: >-
    Welche Organe hat die Gemeinde nach der Kommunalverfassung Mecklenburg-Vorpommern und wie ist die
    kommunale Ebene gegliedert?
  back: >-
    Hauptorgane der Gemeinde sind die Gemeindevertretung (in Städten Stadtvertretung) und der Bürgermeister.
    Die Vertretung ist das oberste Willensbildungsorgan, der Bürgermeister leitet die Verwaltung und vertritt
    die Gemeinde. Gemeinden können amtsfrei sein oder einem Amt angehören, das die Verwaltungsgeschäfte
    der amtsangehörigen Gemeinden führt; Organe des Amtes sind insbesondere der Amtsausschuss und der
    Amtsvorsteher. Auf der Ebene darüber stehen die Landkreise (Kreistag, Landrat) sowie die kreisfreien
    Städte Rostock und Schwerin. Rechtsgrundlage ist die Kommunalverfassung für das Land Mecklenburg-Vorpommern
    (KV M-V).
  norms:
  - >-
    Kommunalverfassung für das Land Mecklenburg-Vorpommern (KV M-V)
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-10
- slug: mv-kr-zustaendigkeit
  type: definition
  front: >-
    Wie werden in Mecklenburg-Vorpommern die Zuständigkeiten zwischen Vertretung und Verwaltungsspitze
    abgegrenzt?
  back: >-
    Die Gemeindevertretung entscheidet nach § 22 KV M-V in den wichtigen Selbstverwaltungsangelegenheiten,
    insbesondere über Satzungen, Haushalt und wesentliche Vermögensgeschäfte; sie kann Entscheidungen
    auf Ausschüsse oder den Bürgermeister übertragen, soweit das Gesetz keine ausschließliche Zuständigkeit
    vorsieht. Der Bürgermeister führt die laufenden Geschäfte der Verwaltung und bereitet die Beschlüsse
    der Vertretung vor und vollzieht sie. Die Abgrenzung der laufenden Verwaltung richtet sich nach der
    Bedeutung des Geschäfts für die Gemeinde und wird in der Hauptsatzung konkretisiert. In der Klausur
    ist zuerst das zuständige Organ zu bestimmen; die Entscheidung eines unzuständigen Organs ist formell
    rechtswidrig.
  norms:
  - >-
    § 22 KV M-V
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-10
- slug: mv-kr-satzung
  type: definition
  front: >-
    Unter welchen Voraussetzungen ist eine gemeindliche Satzung in Mecklenburg-Vorpommern rechtmäßig?
  back: >-
    Eine Satzung ist eine von der Gemeinde im Rahmen ihrer Selbstverwaltung erlassene Rechtsnorm (Art.
    28 Abs. 2 GG). Prüfung: (1) Ermächtigungsgrundlage: Die allgemeine Satzungsbefugnis der Gemeindeordnung
    genügt für Regelungen ohne Grundrechtseingriff gegenüber Außenstehenden; Eingriffe in Grundrechte
    und Abgabenpflichten erfordern wegen des Vorbehalts des Gesetzes eine besondere gesetzliche Ermächtigung
    (Wesentlichkeitslehre). (2) Formelle Rechtmäßigkeit: Zuständigkeit der Vertretung, ordnungsgemäßer
    Beschluss, Ausfertigung und Bekanntmachung. (3) Materielle Rechtmäßigkeit: Vereinbarkeit mit höherrangigem
    Recht, Bestimmtheit, Verhältnismäßigkeit und Gleichheitssatz. Rechtsschutz: Inzidentkontrolle oder
    Normenkontrolle nach § 47 VwGO, soweit das Landesrecht sie vorsieht.
  norms:
  - Art. 28 Abs. 2 GG
  - >-
    § 47 VwGO
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-10
- slug: mv-kr-mitwirkungsverbot
  type: norm
  front: >-
    Wann gilt in Mecklenburg-Vorpommern ein Mitwirkungsverbot für Gemeindevertreter?
  back: >-
    Nach § 24 KV M-V darf ein Mitglied der Gemeindevertretung nicht beratend oder entscheidend mitwirken,
    wenn die Entscheidung ihm selbst, einem Angehörigen oder einer von ihm vertretenen natürlichen oder
    juristischen Person einen unmittelbaren Vorteil oder Nachteil bringen kann. Es genügt die konkrete
    Möglichkeit eines Sonderinteresses; tatsächliche Befangenheit ist nicht erforderlich. Das Verbot sichert
    die Unbefangenheit der Entscheidung und das Vertrauen in die Gemeindeorgane. Ausnahmen gelten u. a.
    für Wahlen und Entscheidungen, die nur ein Gruppeninteresse berühren. Wirkt ein Ausgeschlossener mit,
    ist der Beschluss fehlerhaft, wenn die Mitwirkung für das Abstimmungsergebnis ursächlich sein konnte;
    Heilungs- und Unbeachtlichkeitsregeln des Landesrechts sind zu beachten.
  norms:
  - >-
    § 24 KV M-V
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-10
- slug: mv-kr-oeffentliche-einrichtung
  type: definition
  front: >-
    Unter welchen Voraussetzungen haben Einwohner in Mecklenburg-Vorpommern einen Anspruch auf Zulassung
    zu einer öffentlichen Einrichtung der Gemeinde?
  back: >-
    Eine öffentliche Einrichtung ist ein von der Gemeinde im öffentlichen Interesse unterhaltenes Angebot
    (z. B. Stadthalle, Friedhof, Schwimmbad), das nach einem Widmungsakt der Allgemeinheit oder einem
    bestimmten Personenkreis zur Verfügung steht. Die Gemeindeordnung gewährt den Einwohnern im Rahmen
    des geltenden Rechts einen Anspruch auf Zulassung zur Benutzung. Er besteht nur im Rahmen des Widmungszwecks
    und der Kapazität; die Gemeinde darf die Zulassung bei Kapazitätsengpässen nach sachgerechten Kriterien
    beschränken (Gleichbehandlung, Art. 3 Abs. 1 GG). Zweistufigkeit: Die Zulassungsentscheidung ist öffentlich-rechtlich
    (Verwaltungsrechtsweg), die Ausgestaltung der Nutzung kann privatrechtlich erfolgen (Zweistufentheorie).
    Auch Parteien können sich bei Überlassung gegenüber anderen Parteien auf Gleichbehandlung berufen.
  norms:
  - Art. 3 Abs. 1 GG
  - Art. 28 Abs. 2 GG
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-10
- slug: mv-kr-kommunalaufsicht
  type: norm
  front: >-
    Wie ist die Kommunalaufsicht in Mecklenburg-Vorpommern ausgestaltet und wie kann sich die Gemeinde
    dagegen wehren?
  back: >-
    Die Kommunalaufsicht ist Rechtsaufsicht in den Selbstverwaltungsangelegenheiten und, soweit gesetzlich
    vorgesehen, Fachaufsicht in den übertragenen Angelegenheiten. Ihre Mittel reichen von der Beratung
    und Beanstandung über die Anordnung und die Ersatzvornahme bis zur Einsetzung eines Beauftragten und
    sind nach dem Verhältnismäßigkeitsgrundsatz zu wählen. Aufsichtsbehörde ist für kreisangehörige Gemeinden
    regelmäßig der Landrat, im Übrigen das Land (Innenministerium). Gegen aufsichtsrechtliche Verfügungen
    kann die Gemeinde mit der Anfechtungsklage vorgehen; ihre Klagebefugnis folgt aus der Selbstverwaltungsgarantie
    (Art. 28 Abs. 2 GG). Ein Anspruch Dritter auf aufsichtsrechtliches Einschreiten besteht grundsätzlich
    nicht.
  norms:
  - >-
    Kommunalverfassung für das Land Mecklenburg-Vorpommern (KV M-V), Abschnitt Aufsicht
  - Art. 28 Abs. 2 GG
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-10
- slug: mv-kr-kommunalverfassungsstreit
  type: definition
  front: >-
    Was ist ein Kommunalverfassungsstreit und welche prozessualen Besonderheiten gelten?
  back: >-
    Der Kommunalverfassungsstreit ist ein Innenrechtsstreit zwischen Organen oder Organteilen einer Gemeinde
    (z. B. Ratsmitglied gegen Bürgermeister oder Vertretung) um organschaftliche Rechte und Pflichten.
    Der Verwaltungsrechtsweg ist nach § 40 Abs. 1 VwGO eröffnet. Klageart ist mangels Verwaltungsakt die
    Feststellungsklage (§ 43 VwGO) oder die allgemeine Leistungsklage (Unterlassung, Herausgabe). § 42
    Abs. 2 VwGO gilt analog: Das Organ muss geltend machen, in eigenen organschaftlichen Rechten verletzt
    zu sein; die Beteiligtenfähigkeit folgt aus § 61 Nr. 2 VwGO analog. Passivlegitimiert ist das Organ,
    das die Rechte bestreitet, nicht die Gemeinde. Das allgemeine Rechtsschutzbedürfnis fehlt, wenn das
    Organ nur objektive Rechtmäßigkeitskontrolle begehrt.
  norms:
  - >-
    § 40 Abs. 1 VwGO
  - >-
    § 43 VwGO
  - >-
    § 61 Nr. 2 VwGO
  quellen:
  - VwGO, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-10
schemata:
- slug: mv-schema-kr-beschluss
  title: >-
    Rechtmäßigkeit eines Beschlusses der Gemeindevertretung nach dem Kommunalrecht von Mecklenburg-Vorpommern
  norms:
  - >-
    § 24 KV M-V
  - Art. 28 Abs. 2 GG
  - >-
    § 47 VwGO
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  steps:
  - label: I. Formelle Rechtmäßigkeit des Beschlusses
    children:
    - label: >-
        1. Zuständigkeit: Vertretung oder Verwaltungsspitze (Hauptsatzung, Gemeindeordnung), Verbandskompetenz
        der Gemeinde
    - label: >-
        2. Ordnungsgemäße Einberufung, Ladung, Öffentlichkeit der Sitzung, Beschlussfähigkeit
    - label: 3. Mitwirkungsverbote
      hinweis: >-
        Klausurklassiker: unmittelbarer Vorteil oder Nachteil für das Mitglied oder Angehörige; Kausalität
        der Mitwirkung für das Abstimmungsergebnis prüfen.
      children:
      - label: a) Voraussetzungen des Mitwirkungsverbots (§ 24 KV M-V)
      - label: >-
          b) Rechtsfolge für Beschluss und Heilung/Unbeachtlichkeit nach Landesrecht
    - label: 4. Erforderliche Mehrheit und Beschlussfassung
  - label: II. Materielle Rechtmäßigkeit
    children:
    - label: >-
        1. Ermächtigungsgrundlage (bei Satzungen: besondere Ermächtigung bei Grundrechtseingriffen, Wesentlichkeitslehre)
    - label: >-
        2. Vereinbarkeit mit höherrangigem Recht (Grundrechte, Gleichheitssatz, Bundes- und Landesrecht)
    - label: 3. Ermessen und Verhältnismäßigkeit
  - label: III. Ausfertigung und Bekanntmachung (bei Satzungen)
    hinweis: >-
      Fehler führen zur Unwirksamkeit; Heilungs- und Unbeachtlichkeitsregeln des Landesrechts beachten.
  - label: IV. Rechtsschutz
    children:
    - label: >-
        1. Außenrechtsstreit: Anfechtungs- oder Verpflichtungsklage; Normenkontrolle nach § 47 VwGO nur,
        soweit das Landesrecht sie vorsieht
    - label: >-
        2. Innenrechtsstreit (Kommunalverfassungsstreit): Feststellungs- oder Leistungsklage, § 42 Abs.
        2 VwGO analog
faelle:
- slug: mv-fall-kr-mitwirkungsverbot
  title: Die Pacht des Strandkiosks
  difficulty: 3
  minutes: 45
  quellen:
  - Eigener Sachverhalt der Redaktion
  - KV M-V, amtliche Fassung
  facts: >-
    Die Gemeindevertretung der Gemeinde G in Mecklenburg-Vorpommern beschließt mit 11 zu 10 Stimmen, den
    gemeindeeigenen Strandkiosk an das Einzelunternehmen des F zu verpachten. Gemeindevertreter T ist
    der Sohn des F. Er nimmt an der Beratung teil und stimmt für die Verpachtung. Die Vertretung war ordnungsgemäß
    geladen und beschlussfähig; nach der Hauptsatzung entscheidet sie über die Verpachtung gemeindeeigener
    Anlagen. Ein unterlegener Bewerber hält den Beschluss für rechtswidrig.
  question: Ist der Beschluss der Vertretung rechtmäßig?
  steps:
  - prompt: >-
      Liegt ein Beschluss im Zuständigkeitsbereich der Vertretung vor?
    erwartung: >-
      Ja: Nach der Hauptsatzung entscheidet die Gemeindevertretung über die Verpachtung gemeindeeigener
      Anlagen; sie war ordnungsgemäß geladen und beschlussfähig.
  - prompt: Unterlag das Mitglied einem Mitwirkungsverbot?
    erwartung: >-
      Ja: T ist als Sohn des F Angehöriger in gerader Linie; die Verpachtung bringt F einen unmittelbaren
      Vorteil. Das Mitwirkungsverbot (§ 24 KV M-V) ist erfüllt; das Mitglied durfte weder beraten noch
      abstimmen.
  - prompt: Welche Folge hat der Verstoß für den Beschluss?
    erwartung: >-
      Der Beschluss ist fehlerhaft, wenn die Mitwirkung für das Abstimmungsergebnis ursächlich sein konnte.
      Hier wurde der Beschluss mit nur einer Stimme Mehrheit gefasst, sodass ohne die Stimme des befangenen
      Mitglieds keine Mehrheit bestanden hätte. Der Beschluss ist damit rechtswidrig bzw. unwirksam; Heilung
      oder Unbeachtlichkeit nach Landesrecht (z. B. durch Fristablauf, Neubeschluss) ist zu prüfen und
      liegt hier nicht vor.
  expectation:
    pruefpunkte:
    - id: p1
      label: >-
        Zuständigkeit der Vertretung und ordnungsgemäße Beschlussfassung festgestellt
      weight: 1.0
      required: false
      keywords:
      - Zuständigkeit der Vertretung
      - beschlussfähig
      - ordnungsgemäß geladen
      - Hauptsatzung
      card_slugs:
      - mv-kr-zustaendigkeit
    - id: p2
      label: >-
        Mitwirkungsverbot (§ 24 KV M-V) wegen unmittelbaren Vorteils bejaht
      weight: 3.0
      required: true
      norms:
      - >-
        § 24 KV M-V
      keywords:
      - Mitwirkungsverbot
      - unmittelbarer Vorteil
      - persönliches Interesse
      - Befangenheit
      - >-
        § 24 KV M-V
      card_slugs:
      - mv-kr-mitwirkungsverbot
    - id: p3
      label: >-
        Zurechnung des Interesses des Angehörigen bzw. des Unternehmens
      weight: 1.5
      required: false
      keywords:
      - Angehöriger
      - Ehegatte
      - Interessenkollision
      - Vertretung eines Dritten
      card_slugs:
      - mv-kr-mitwirkungsverbot
    - id: p4
      label: >-
        Kausalität: ohne die Stimme des Befangenen keine Mehrheit; Beschluss fehlerhaft
      weight: 3.0
      required: true
      keywords:
      - Kausalität
      - ausschlaggebend
      - Stimme
      - Abstimmungsergebnis
      - unwirksam
      - rechtswidrig
      card_slugs:
      - mv-kr-mitwirkungsverbot
    - id: p5
      label: Heilung bzw. Unbeachtlichkeit nach Landesrecht erwogen
      weight: 1.0
      required: false
      keywords:
      - Heilung
      - Unbeachtlichkeit
      - Neubeschluss
      - Rügefrist
