cards:
- slug: mv-bo-abgrenzung
  type: definition
  front: >-
    Wie grenzen sich Bauplanungsrecht und Bauordnungsrecht ab und welche Rolle spielt die LBauO M-V?
  back: >-
    Das Bauplanungsrecht regelt die städtebauliche Ordnung der Bodennutzung (Bebauungsplan, Zulässigkeit
    nach §§ 29 ff. BauGB); es ist Bundesrecht (Art. 74 Abs. 1 Nr. 18 GG). Das Bauordnungsrecht regelt
    als Landesrecht die Anforderungen an das einzelne Bauvorhaben im Sinne der Gefahrenabwehr: Standsicherheit,
    Brandschutz, Abstandsflächen, Gestaltung, Stellplätze und das Verfahren. Rechtsgrundlage in Mecklenburg-Vorpommern
    ist die Landesbauordnung Mecklenburg-Vorpommern (LBauO M-V). Im Genehmigungsverfahren sind beide Bereiche
    zu prüfen: Das Vorhaben muss bauplanungsrechtlich zulässig sein und darf bauordnungsrechtlichen Vorschriften
    nicht widersprechen. In der Klausur ist die Trennung der Prüfungsebenen wichtig, weil die Rechtsfolgen
    (Befreiung, § 31 Abs. 2 BauGB; Abweichung nach Landesrecht) unterschiedlich sind.
  norms:
  - Landesbauordnung Mecklenburg-Vorpommern (LBauO M-V)
  - >-
    §§ 29 ff. BauGB
  - Art. 74 Abs. 1 Nr. 18 GG
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-10
- slug: mv-bo-baugenehmigung
  type: norm
  front: >-
    Unter welchen Voraussetzungen besteht in Mecklenburg-Vorpommern ein Anspruch auf Baugenehmigung?
  back: >-
    Der Bauherr hat Anspruch auf die Baugenehmigung, wenn dem Vorhaben keine öffentlich-rechtlichen Vorschriften
    entgegenstehen. Zu prüfen sind: (1) Genehmigungsbedürftigkeit (Errichtung, Änderung, Nutzungsänderung;
    keine Verfahrensfreiheit), (2) bauplanungsrechtliche Zulässigkeit (§§ 29 ff. BauGB; Einvernehmen der
    Gemeinde, § 36 BauGB), (3) bauordnungsrechtliche Zulässigkeit nach der LBauO M-V, soweit das Verfahren
    sie zum Prüfprogramm macht, und (4) sonstiges öffentliches Recht. Die Baugenehmigung ist ein Verwaltungsakt,
    der unbeschadet der Rechte Dritter ergeht. Untere Bauaufsichtsbehörden sind regelmäßig die Landkreise
    und die kreisfreien Städte; die Gemeinde wirkt als Planungsträgerin mit (Einvernehmen nach § 36 BauGB).
    Rechtsschutz bei Ablehnung: Verpflichtungsklage nach § 42 Abs. 1 Var. 2 VwGO.
  norms:
  - Landesbauordnung Mecklenburg-Vorpommern (LBauO M-V)
  - >-
    § 36 BauGB
  - >-
    § 42 Abs. 1 VwGO
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-10
- slug: mv-bo-verfahrensarten
  type: definition
  front: >-
    Welche Verfahrensarten kennt das Bauordnungsrecht in Mecklenburg-Vorpommern und was folgt daraus für
    die materielle Rechtmäßigkeit?
  back: >-
    Die LBauO M-V unterscheidet nach Gefährdungspotential und Größe des Vorhabens: verfahrensfreie Vorhaben,
    die Genehmigungsfreistellung bei qualifiziertem Bebauungsplan, das vereinfachte Genehmigungsverfahren
    mit eingeschränktem Prüfprogramm und das reguläre Genehmigungsverfahren mit umfassender Prüfung. Entscheidend
    ist: Verfahrensfreiheit oder eingeschränkte Prüfung bedeuten nicht, dass materielle Anforderungen
    entfallen; sie besagen nur, dass die Bauaufsichtsbehörde das Vorhaben nicht oder nicht vollständig
    vorab prüft. Auch verfahrensfreie Vorhaben müssen dem materiellen Recht entsprechen, und die Bauaufsichtsbehörde
    kann bei Verstößen einschreiten. Eine Baugenehmigung im vereinfachten Verfahren stellt nur die Vereinbarkeit
    mit den in diesem Verfahren geprüften Vorschriften fest.
  norms:
  - Landesbauordnung Mecklenburg-Vorpommern (LBauO M-V)
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-10
- slug: mv-bo-abstandsflaechen
  type: norm
  front: >-
    Was regelt das Abstandsflächenrecht der LBauO M-V und welche Rechtsfolgen hat sein Verstoß?
  back: >-
    Abstandsflächen (§ 6 LBauO M-V) sind von oberirdischen Gebäuden freizuhaltende Flächen vor den Außenwänden.
    Sie dienen dem Brandschutz, der Belichtung, Belüftung und Besonnung sowie dem Wohnfrieden. Die Tiefe
    bemisst sich nach der Wandhöhe mit einem landesrechtlich festgelegten Faktor und einem Mindestmaß;
    der konkrete Faktor ist dem Gesetz zu entnehmen. Grundsätzlich liegt die Abstandsfläche auf dem Baugrundstück.
    Das Abstandsflächenrecht ist weitgehend drittschützend: Ein Nachbar kann sich gegen eine Baugenehmigung
    wehren, die diese Vorschriften verletzt. Unterschreitungen können im Wege der Abweichung (Landesrecht)
    gestattet werden, wenn Zweck und öffentliche Belange gewahrt sind. Ein Verstoß macht das Vorhaben
    materiell rechtswidrig und kann bauaufsichtliche Maßnahmen begründen.
  norms:
  - >-
    § 6 LBauO M-V
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-10
- slug: mv-bo-nachbarschutz
  type: definition
  front: >-
    Unter welchen Voraussetzungen kann ein Nachbar in Mecklenburg-Vorpommern gegen eine Baugenehmigung
    vorgehen?
  back: >-
    Der Nachbar kann die Baugenehmigung mit Widerspruch bzw. Anfechtungsklage (Drittanfechtung) angreifen.
    Klagebefugt (§ 42 Abs. 2 VwGO) ist er, wenn er die Verletzung einer drittschützenden Norm geltend
    machen kann: nachbarschützend sind etwa die Abstandsflächenvorschriften der LBauO M-V, bestimmte Festsetzungen
    eines Bebauungsplans (Gebietserhaltungsanspruch) und das Gebot der Rücksichtnahme. Begründet ist die
    Klage nur, wenn die Genehmigung rechtswidrig ist und den Nachbarn in einem subjektiven öffentlichen
    Recht verletzt (Schutznormtheorie); allgemeine objektive Rechtsverstöße genügen nicht. Widerspruch
    und Anfechtungsklage des Nachbarn haben nach § 212a Abs. 1 BauGB keine aufschiebende Wirkung; vorläufiger
    Rechtsschutz wird über § 80a Abs. 3 i. V. m. § 80 Abs. 5 VwGO gewährt.
  norms:
  - >-
    § 42 Abs. 2 VwGO
  - >-
    § 212a Abs. 1 BauGB
  - >-
    § 80a Abs. 3 VwGO
  - >-
    § 80 Abs. 5 VwGO
  quellen:
  - VwGO, amtliche Fassung
  - BauGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-10
- slug: mv-bo-eingriff
  type: norm
  front: >-
    Welche bauaufsichtlichen Eingriffsmaßnahmen gibt es in Mecklenburg-Vorpommern und wann genügt formelle
    Illegalität?
  back: >-
    Die Bauaufsichtsbehörde kann bei rechtswidrigen baulichen Anlagen nach der LBauO M-V einschreiten,
    insbesondere durch Baueinstellung (Stilllegungsverfügung), Nutzungsuntersagung und Beseitigungsanordnung.
    Zu unterscheiden sind formelle Illegalität (fehlende erforderliche Genehmigung) und materielle Illegalität
    (Widerspruch zu materiellem Recht). Für Baueinstellung und Nutzungsuntersagung genügt regelmäßig formelle
    Illegalität; wegen der Schwere des Eingriffs setzt die Beseitigungsanordnung nach h. M. materielle
    Illegalität voraus, weil sonst eine genehmigungsfähige Anlage beseitigt würde. Die Maßnahmen stehen
    im Ermessen; zu beachten sind Verhältnismäßigkeit, Gleichbehandlung und Bestandsschutz. Adressat ist
    regelmäßig der Bauherr oder der Eigentümer.
  norms:
  - Landesbauordnung Mecklenburg-Vorpommern (LBauO M-V)
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-10
- slug: mv-bo-bestandsschutz
  type: definition
  front: >-
    Was bedeutet Bestandsschutz im Bauordnungsrecht von Mecklenburg-Vorpommern?
  back: >-
    Bestandsschutz folgt aus Art. 14 Abs. 1 GG: Eine rechtmäßig errichtete bauliche Anlage darf in ihrem
    genehmigten Zustand und in der genehmigten Nutzung fortbestehen, auch wenn sich das Recht später ändert.
    Voraussetzung ist, dass die Anlage genehmigt oder zumindest zu irgendeinem Zeitpunkt materiell legal
    war. Eine Beseitigungsanordnung allein wegen späterer Rechtsänderung ist rechtswidrig. Nachträgliche
    Anpassungsverlangen sind nur nach ausdrücklicher gesetzlicher Ermächtigung und bei erheblicher Gefahr
    für Leben, Gesundheit oder öffentliche Sicherheit zulässig. Kein Bestandsschutz genießen Schwarzbauten,
    die nie genehmigt und nie genehmigungsfähig waren. Weitergehende Veränderungen (Erweiterung, Nutzungsänderung)
    sind vom Bestandsschutz nicht gedeckt.
  norms:
  - Art. 14 Abs. 1 GG
  - Landesbauordnung Mecklenburg-Vorpommern (LBauO M-V)
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-10
- slug: mv-bo-abweichung
  type: definition
  front: >-
    Wann kann in Mecklenburg-Vorpommern von Anforderungen der LBauO M-V abgewichen werden und wie unterscheidet
    sich das von der Befreiung nach dem BauGB?
  back: >-
    Die LBauO M-V erlaubt es der Bauaufsichtsbehörde, Abweichungen von bauordnungsrechtlichen Anforderungen
    zuzulassen, wenn sie unter Berücksichtigung des Zwecks der Anforderung und unter Würdigung der nachbarlichen
    Belange mit den öffentlichen Belangen vereinbar sind. Es handelt sich um eine Ermessensentscheidung,
    die bei Erfüllung der Voraussetzungen und ohne entgegenstehende Gründe auf null reduziert sein kann.
    Die Befreiung nach § 31 Abs. 2 BauGB betrifft dagegen Festsetzungen eines Bebauungsplans und ist Bauplanungsrecht.
    In der Klausur sind beide Instrumente zu trennen; für die Nachbarschutzprüfung ist maßgeblich, ob
    die verletzte Norm drittschützend ist und ob die Abweichung die nachbarlichen Belange würdigt.
  norms:
  - >-
    § 31 Abs. 2 BauGB
  - Landesbauordnung Mecklenburg-Vorpommern (LBauO M-V)
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - BauGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-10
schemata:
- slug: mv-schema-bo-eingriff
  title: >-
    Rechtmäßigkeit einer bauaufsichtlichen Eingriffsverfügung nach der LBauO M-V
  norms:
  - Landesbauordnung Mecklenburg-Vorpommern (LBauO M-V)
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  steps:
  - label: I. Ermächtigungsgrundlage
    hinweis: >-
      Eingriffsbefugnis der LBauO M-V (Baueinstellung, Nutzungsuntersagung, Beseitigungsanordnung) benennen.
  - label: II. Formelle Rechtmäßigkeit
    children:
    - label: 1. Zuständigkeit der Bauaufsichtsbehörde
    - label: 2. Anhörung
    - label: 3. Form, Bestimmtheit, Begründung
  - label: III. Materielle Rechtmäßigkeit
    children:
    - label: >-
        1. Tatbestand: rechtswidrige bauliche Anlage oder Nutzung
      hinweis: >-
        Zwischen formeller und materieller Illegalität unterscheiden; Beseitigung setzt materielle Illegalität
        voraus.
      children:
      - label: >-
          a) Genehmigungsbedürftigkeit und fehlende Genehmigung (formelle Illegalität)
      - label: >-
          b) Widerspruch zu bauplanungs- oder bauordnungsrechtlichen Vorschriften (materielle Illegalität)
      - label: >-
          c) Verfahrensfreiheit schließt materielle Illegalität nicht aus
    - label: 2. Kein Bestandsschutz (Art. 14 Abs. 1 GG)
    - label: >-
        3. Richtiger Adressat: Bauherr, Eigentümer, Nutzer
    - label: 4. Rechtsfolge
      hinweis: >-
        Ermessen: Entschließung, Auswahl der Maßnahme, Verhältnismäßigkeit, Gleichbehandlung (keine Gleichheit
        im Unrecht).
      children:
      - label: a) Geeignetheit
      - label: b) Erforderlichkeit (milderes Mittel, etwa Nachgenehmigung)
      - label: c) Angemessenheit
  - label: IV. Rechtsschutz
    children:
    - label: 1. Anfechtungsklage gegen die Verfügung
    - label: >-
        2. Vorläufiger Rechtsschutz, § 80 Abs. 5 VwGO, soweit sofort vollziehbar
faelle:
- slug: mv-fall-bo-verfahrensfrei
  title: Der verfahrensfreie Carport
  difficulty: 3
  minutes: 45
  quellen:
  - Eigener Sachverhalt der Redaktion
  - LBauO M-V, amtliche Fassung
  - BauGB, amtliche Fassung
  facts: >-
    A errichtet an der Grenze seines Grundstücks in Mecklenburg-Vorpommern einen Carport. Das Vorhaben
    ist nach der LBauO M-V verfahrensfrei. Es liegt jedoch außerhalb der im Bebauungsplan festgesetzten
    überbaubaren Grundstücksfläche; eine Befreiung wurde nicht beantragt und käme nicht in Betracht, weil
    die Grundzüge der Planung berührt würden. Die Bauaufsichtsbehörde ordnet nach Anhörung die Beseitigung
    an. A meint, ein verfahrensfreies Vorhaben dürfe die Behörde nicht beanstanden.
  question: Ist die Beseitigungsanordnung rechtmäßig?
  steps:
  - prompt: >-
      Befreit die Verfahrensfreiheit von den materiellen Anforderungen?
    erwartung: >-
      Nein: Verfahrensfreiheit bedeutet nur, dass keine Baugenehmigung erforderlich ist; das Vorhaben
      muss dem materiellen Recht trotzdem entsprechen. Die Bauaufsichtsbehörde darf bei Verstößen einschreiten.
  - prompt: Ist das Vorhaben materiell rechtswidrig?
    erwartung: >-
      Ja: Der Carport liegt außerhalb der überbaubaren Grundstücksfläche und widerspricht dem Bebauungsplan;
      eine Befreiung nach § 31 Abs. 2 BauGB scheidet aus. Damit liegt materielle Illegalität vor, die
      für die Beseitigung erforderlich ist.
  - prompt: Ist die Beseitigung ermessensfehlerfrei und verhältnismäßig?
    erwartung: >-
      Ja: Sie ist geeignet und erforderlich, da eine Legalisierung ausscheidet; sie ist angemessen, weil
      der Bebauungsplan verletzt wird und A als Bauherr schutzwürdiges Vertrauen nicht geltend machen
      kann. A ist als Bauherr und Eigentümer richtiger Adressat. Die Anordnung ist rechtmäßig.
  expectation:
    pruefpunkte:
    - id: p1
      label: >-
        Verfahrensfreiheit entbindet nicht von den materiellen Anforderungen
      weight: 3.0
      required: true
      keywords:
      - Verfahrensfreiheit
      - verfahrensfrei
      - materielle Anforderungen
      - materielles Recht
      - nicht von der Pflicht befreit
      card_slugs:
      - mv-bo-verfahrensarten
    - id: p2
      label: >-
        Materielle Illegalität: Verstoß gegen den Bebauungsplan, keine Befreiung nach § 31 Abs. 2 BauGB
      weight: 2.5
      required: true
      norms:
      - >-
        § 31 Abs. 2 BauGB
      keywords:
      - materielle Illegalität
      - Bebauungsplan
      - überbaubare Grundstücksfläche
      - >-
        § 31 Abs. 2 BauGB
      - Grundzüge der Planung
      card_slugs:
      - mv-bo-abweichung
      - mv-bo-eingriff
    - id: p3
      label: >-
        Beseitigung setzt materielle Illegalität voraus; Eingriffsbefugnis der LBauO M-V
      weight: 1.5
      required: false
      keywords:
      - Beseitigungsanordnung
      - Eingriffsbefugnis
      - LBauO M-V
      - Bauaufsichtsbehörde
      card_slugs:
      - mv-bo-eingriff
    - id: p4
      label: Adressat A, Ermessen und Verhältnismäßigkeit
      weight: 2.0
      required: false
      keywords:
      - Adressat
      - Bauherr
      - Verhältnismäßigkeit
      - Ermessen
      - erforderlich
      - angemessen
      card_slugs:
      - mv-bo-eingriff
