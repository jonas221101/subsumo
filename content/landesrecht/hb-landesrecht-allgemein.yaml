cards:
- slug: hb-lra-vwvfg
  type: norm
  front: Welches Verwaltungsverfahrensgesetz gilt für Landesbehörden in Bremen?
  back: Bremisches Verwaltungsverfahrensgesetz (BremVwVfG) - Vollgesetz. Das VwVfG des Bundes gilt nur
    für Bundesbehörden (§ 1 VwVfG); für Landes- und Kommunalbehörden ist das Landesgesetz maßgeblich.
    Bei Verweisungsgesetzen werden die Bundesnormen 'entsprechend' angewendet und sind so zu zitieren
    (z. B. '§ 35 VwVfG i. V. m. § 1 des Landesgesetzes'), bei Vollgesetzen ist die Landesnorm selbst zu
    zitieren.
  norms:
  - Bremisches Verwaltungsverfahrensgesetz (BremVwVfG) - Vollgesetz
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: hb-lra-verfassungsgericht
  type: norm
  front: Gibt es in Bremen eine Individualverfassungsbeschwerde zum Landesverfassungsgericht?
  back: 'Nein - keine Individualverfassungsbeschwerde zum Staatsgerichtshof. Zuständiges Gericht: Staatsgerichtshof
    der Freien Hansestadt Bremen auf Grundlage der Landesverfassung der Freien Hansestadt Bremen (BremLV).
    Verfahrensgegenstand ist nur die Verletzung von Landesgrundrechten durch Landesstaatsgewalt; Bundesrecht
    ist Prüfungsmaßstab nur, soweit die Landesverfassung darauf verweist. Daneben steht immer die Verfassungsbeschwerde
    zum BVerfG (Art. 93 Abs. 1 Nr. 4a GG).'
  norms:
  - Landesverfassung der Freien Hansestadt Bremen (BremLV)
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: hb-lra-kommunalverfassung
  type: norm
  front: Welche Gemeinden gibt es im Land Bremen und wie ist die Kommunalverfassung geregelt?
  back: 'Das Land Bremen besteht aus zwei Gemeinden (Zwei-Städte-Staat): der Stadtgemeinde Bremen und
    der Stadt Bremerhaven. Staats- und Gemeindeebene sind in der Stadtgemeinde Bremen organisatorisch
    verschränkt (Stadtbürgerschaft und Senat als Gemeindeorgane); für Bremerhaven gilt die Verfassung
    für die Stadt Bremerhaven. Beide Gemeinden genießen die Selbstverwaltungsgarantie des Art. 28 Abs.
    2 GG und der Landesverfassung: eigenverantwortliche Regelung aller Angelegenheiten der örtlichen Gemeinschaft.
    Anders als in Berlin und Hamburg handelt es sich nicht um eine Einheitsgemeinde. Klausurklassiker:
    Zuständigkeitsstreit zwischen Vertretung und Verwaltungsspitze, Kommunalverfassungsstreit, Rechtsaufsicht.'
  norms:
  - 'Zwei-Städte-Staat: Stadtgemeinde Bremen (Stadtbürgerschaft, Senat) und Stadt Bremerhaven (Verfassung
    für die Stadt Bremerhaven)'
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: hb-lra-bauordnung
  type: norm
  front: Wie heißt die Bauordnung in Bremen und wie ist eine Baugenehmigung zu prüfen?
  back: 'Bremische Landesbauordnung (BremLBO). Anspruch auf Baugenehmigung besteht, wenn dem Vorhaben
    keine öffentlich-rechtlichen Vorschriften entgegenstehen: Genehmigungsbedürftigkeit (Errichtung, Änderung,
    Nutzungsänderung), keine Genehmigungsfreiheit, bauplanungsrechtliche Zulässigkeit nach §§ 29 ff. BauGB
    (Bundesrecht), bauordnungsrechtliche Zulässigkeit nach der Landesbauordnung (Abstandsflächen, Gestaltung,
    Stellplätze).'
  norms:
  - Bremische Landesbauordnung (BremLBO)
  - §§ 29 ff. BauGB
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: hb-lra-pflichtstoff
  type: definition
  front: Welche Landesrechtsgebiete gehören in Bremen zum Pflichtstoff des Öffentlichen Rechts?
  back: Polizeirecht (BremPolG); Staatsorganisation des Zwei-Städte-Staats; Bauordnungsrecht (BremLBO).
    Landesrecht wird im Examen fast nie isoliert, sondern eingebettet in eine verwaltungsprozessuale Einkleidung
    (Anfechtungs-/Verpflichtungsklage, vorläufiger Rechtsschutz) geprüft - die Landesnorm ist die Ermächtigungsgrundlage,
    der Aufbau bleibt der allgemeine.
  norms: []
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
