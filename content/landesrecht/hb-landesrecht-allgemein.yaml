cards:
- slug: hb-lra-vwvfg
  type: norm
  front: Welches Verwaltungsverfahrensgesetz gilt fuer Landesbehoerden in Bremen?
  back: Bremisches Verwaltungsverfahrensgesetz (BremVwVfG) - Vollgesetz. Das VwVfG des Bundes gilt nur
    fuer Bundesbehoerden (§ 1 VwVfG); fuer Landes- und Kommunalbehoerden ist das Landesgesetz massgeblich.
    Bei Verweisungsgesetzen werden die Bundesnormen 'entsprechend' angewendet und sind so zu zitieren
    (z. B. '§ 35 VwVfG i. V. m. § 1 des Landesgesetzes'), bei Vollgesetzen ist die Landesnorm selbst zu
    zitieren.
  norms:
  - Bremisches Verwaltungsverfahrensgesetz (BremVwVfG) - Vollgesetz
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: hb-lra-verfassungsgericht
  type: norm
  front: Gibt es in Bremen eine Individualverfassungsbeschwerde zum Landesverfassungsgericht?
  back: 'Nein - keine Individualverfassungsbeschwerde zum Staatsgerichtshof. Zustaendiges Gericht: Staatsgerichtshof
    der Freien Hansestadt Bremen auf Grundlage der Landesverfassung der Freien Hansestadt Bremen (BremLV).
    Verfahrensgegenstand ist nur die Verletzung von Landesgrundrechten durch Landesstaatsgewalt; Bundesrecht
    ist Pruefungsmassstab nur, soweit die Landesverfassung darauf verweist. Daneben steht immer die Verfassungsbeschwerde
    zum BVerfG (Art. 93 Abs. 1 Nr. 4a GG).'
  norms:
  - Landesverfassung der Freien Hansestadt Bremen (BremLV)
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: hb-lra-kommunalverfassung
  type: norm
  front: Welches Gesetz regelt die Kommunalverfassung in Bremen und welche Hauptorgane hat die Gemeinde?
  back: 'Zwei-Stadt-Staat: Stadtgemeinde Bremen (Stadtbuergerschaft, Senat) und Stadt Bremerhaven (Verfassung
    fuer die Stadt Bremerhaven). Grundlage ist die Selbstverwaltungsgarantie (Art. 28 Abs. 2 GG und Landesverfassung):
    eigenverantwortliche Regelung aller Angelegenheiten der oertlichen Gemeinschaft. Klausurklassiker:
    Zustaendigkeitsstreit zwischen Vertretung und Verwaltungsspitze, Kommunalverfassungsstreit, Rechtsaufsicht.'
  norms:
  - 'Zwei-Stadt-Staat: Stadtgemeinde Bremen (Stadtbuergerschaft, Senat) und Stadt Bremerhaven (Verfassung
    fuer die Stadt Bremerhaven)'
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: hb-lra-bauordnung
  type: norm
  front: Wie heisst die Bauordnung in Bremen und wie ist eine Baugenehmigung zu pruefen?
  back: 'Bremische Landesbauordnung (BremLBO). Anspruch auf Baugenehmigung besteht, wenn dem Vorhaben
    keine oeffentlich-rechtlichen Vorschriften entgegenstehen: Genehmigungs-beduerftigkeit (Errichtung,
    Aenderung, Nutzungsaenderung), keine Genehmigungsfreiheit, bauplanungsrechtliche Zulaessigkeit nach
    §§ 29 ff. BauGB (Bundesrecht), bauordnungsrechtliche Zulaessigkeit nach der Landesbauordnung (Abstandsflaechen,
    Gestaltung, Stellplaetze).'
  norms:
  - Bremische Landesbauordnung (BremLBO)
  - §§ 29 ff. BauGB
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: hb-lra-pflichtstoff
  type: definition
  front: Welche Landesrechtsgebiete gehoeren in Bremen zum Pflichtstoff des Oeffentlichen Rechts?
  back: Polizeirecht (BremPolG); Staatsorganisation des Zwei-Staedte-Staats; Bauordnungsrecht (BremLBO).
    Landesrecht wird im Examen fast nie isoliert, sondern eingebettet in eine verwaltungsprozessuale Einkleidung
    (Anfechtungs-/Verpflichtungsklage, vorlaeufiger Rechtsschutz) geprueft - die Landesnorm ist die Ermaechtigungsgrundlage,
    der Aufbau bleibt der allgemeine.
  norms: []
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
