cards:
- slug: mv-lra-vwvfg
  type: norm
  front: Welches Verwaltungsverfahrensgesetz gilt für Landesbehörden in Mecklenburg-Vorpommern?
  back: Landesverwaltungsverfahrensgesetz M-V (VwVfG M-V) - Verweisung auf das VwVfG des Bundes. Das VwVfG
    des Bundes gilt nur für Bundesbehörden (§ 1 VwVfG); für Landes- und Kommunalbehörden ist das Landesgesetz
    maßgeblich. Bei Verweisungsgesetzen werden die Bundesnormen 'entsprechend' angewendet und sind so
    zu zitieren (z. B. '§ 35 VwVfG i. V. m. § 1 des Landesgesetzes'), bei Vollgesetzen ist die Landesnorm
    selbst zu zitieren.
  norms:
  - Landesverwaltungsverfahrensgesetz M-V (VwVfG M-V) - Verweisung auf das VwVfG des Bundes
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: mv-lra-verfassungsgericht
  type: norm
  front: Gibt es in Mecklenburg-Vorpommern eine Individualverfassungsbeschwerde zum Landesverfassungsgericht?
  back: 'Ja - Art. 53 Nr. 6 Verf M-V. Zuständiges Gericht: Landesverfassungsgericht Mecklenburg-Vorpommern
    auf Grundlage der Verfassung des Landes Mecklenburg-Vorpommern (Verf M-V). Verfahrensgegenstand ist
    nur die Verletzung von Landesgrundrechten durch Landesstaatsgewalt; Bundesrecht ist Prüfungsmaßstab
    nur, soweit die Landesverfassung darauf verweist. Daneben steht immer die Verfassungsbeschwerde zum
    BVerfG (Art. 93 Abs. 1 Nr. 4a GG).'
  norms:
  - Verfassung des Landes Mecklenburg-Vorpommern (Verf M-V)
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: mv-lra-kommunalverfassung
  type: norm
  front: Welches Gesetz regelt die Kommunalverfassung in Mecklenburg-Vorpommern und welche Hauptorgane
    hat die Gemeinde?
  back: 'Kommunalverfassung M-V (KV M-V): Gemeindevertretung und Bürgermeister. Grundlage ist die Selbstverwaltungsgarantie
    (Art. 28 Abs. 2 GG und Landesverfassung): eigenverantwortliche Regelung aller Angelegenheiten der
    örtlichen Gemeinschaft. Klausurklassiker: Zuständigkeitsstreit zwischen Vertretung und Verwaltungsspitze,
    Kommunalverfassungsstreit, Rechtsaufsicht.'
  norms:
  - 'Kommunalverfassung M-V (KV M-V): Gemeindevertretung und Bürgermeister'
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: mv-lra-bauordnung
  type: norm
  front: Wie heißt die Bauordnung in Mecklenburg-Vorpommern und wie ist eine Baugenehmigung zu prüfen?
  back: 'Landesbauordnung Mecklenburg-Vorpommern (LBauO M-V). Anspruch auf Baugenehmigung besteht, wenn
    dem Vorhaben keine öffentlich-rechtlichen Vorschriften entgegenstehen: Genehmigungsbedürftigkeit (Errichtung,
    Änderung, Nutzungsänderung), keine Genehmigungsfreiheit, bauplanungsrechtliche Zulässigkeit nach §§
    29 ff. BauGB (Bundesrecht), bauordnungsrechtliche Zulässigkeit nach der Landesbauordnung (Abstandsflächen,
    Gestaltung, Stellplätze).'
  norms:
  - Landesbauordnung Mecklenburg-Vorpommern (LBauO M-V)
  - §§ 29 ff. BauGB
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: mv-lra-pflichtstoff
  type: definition
  front: Welche Landesrechtsgebiete gehören in Mecklenburg-Vorpommern zum Pflichtstoff des Öffentlichen
    Rechts?
  back: Ordnungsrecht (SOG M-V); Kommunalrecht (KV M-V); Bauordnungsrecht (LBauO M-V); Landesverfassung.
    Landesrecht wird im Examen fast nie isoliert, sondern eingebettet in eine verwaltungsprozessuale Einkleidung
    (Anfechtungs-/Verpflichtungsklage, vorläufiger Rechtsschutz) geprüft - die Landesnorm ist die Ermächtigungsgrundlage,
    der Aufbau bleibt der allgemeine.
  norms: []
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
