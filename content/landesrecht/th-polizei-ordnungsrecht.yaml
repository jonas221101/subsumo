cards:
- slug: th-por-generalklausel
  type: norm
  front: Wo steht die polizeiliche Generalklausel in Thueringen und was setzt sie voraus?
  back: 'Fundstelle: § 12 Abs. 1 ThuerPAG; § 5 Abs. 1 ThuerOBG. Die Generalklausel ermaechtigt zu den
    notwendigen Massnahmen, um eine im Einzelfall bestehende Gefahr fuer die oeffentliche Sicherheit oder
    Ordnung abzuwehren. Sie ist subsidiaer: Greift eine Standardmassnahme oder ein Spezialgesetz, geht
    dieses vor. Auf der Rechtsfolgenseite besteht Ermessen, begrenzt durch den Grundsatz der Verhaeltnismaessigkeit.'
  norms:
  - § 12 Abs. 1 ThuerPAG
  - § 5 Abs. 1 ThuerOBG
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: th-por-aufbau
  type: schema_step
  front: 'Aufbau: Rechtmaessigkeit einer Gefahrenabwehrmassnahme nach dem Landesrecht von Thueringen'
  back: 'I. Ermaechtigungsgrundlage (Thueringer Polizeiaufgabengesetz (ThuerPAG) und Thueringer Ordnungsbehoerdengesetz
    (ThuerOBG): Standardmassnahme vor Generalklausel). II. Formelle Rechtmaessigkeit: 1. Zustaendigkeit
    (sachlich: welche Behoerde - Ordnungsbehoerden primaer (ThuerOBG), Polizei bei Eilbeduerftigkeit (§
    3 ThuerPAG); oertlich; instanziell), 2. Verfahren (Anhoerung, § 28 VwVfG bzw. Landesrecht), 3. Form.
    III. Materielle Rechtmaessigkeit: 1. Tatbestand (Schutzgut, Gefahrbegriff, Gefahrenprognose ex ante),
    2. richtiger Adressat (Stoerer: §§ 7, 8, 10 ThuerPAG; §§ 10, 11, 12 ThuerOBG), 3. Rechtsfolge: Ermessen
    und Verhaeltnismaessigkeit (geeignet, erforderlich, angemessen).'
  norms:
  - § 12 Abs. 1 ThuerPAG
  - § 5 Abs. 1 ThuerOBG
  - §§ 7, 8, 10 ThuerPAG
  - §§ 10, 11, 12 ThuerOBG
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: th-por-stoerer
  type: norm
  front: Wo sind Verhaltensstoerer, Zustandsstoerer und Nichtstoerer in Thueringen geregelt?
  back: '§§ 7, 8, 10 ThuerPAG; §§ 10, 11, 12 ThuerOBG. Verhaltensstoerer: wer die Gefahr durch sein Verhalten
    verursacht (Theorie der unmittelbaren Verursachung; Zweckveranlasser als Streitfrage). Zustandsstoerer:
    Inhaber der tatsaechlichen Gewalt bzw. Eigentuemer einer gefaehrlichen Sache. Nichtstoerer: Inanspruchnahme
    nur unter den engen Voraussetzungen des polizeilichen Notstands (gegenwaertige erhebliche Gefahr,
    Stoerer nicht greifbar, Behoerde selbst nicht in der Lage), mit Entschaedigungsanspruch.'
  norms:
  - §§ 7, 8, 10 ThuerPAG
  - §§ 10, 11, 12 ThuerOBG
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: th-por-zustaendigkeit
  type: definition
  front: Wer ist in Thueringen fuer die Gefahrenabwehr zustaendig - Ordnungs-/Sicherheitsbehoerde oder
    Polizei?
  back: 'Ordnungsbehoerden primaer (ThuerOBG), Polizei bei Eilbeduerftigkeit (§ 3 ThuerPAG). Pruefungsrelevant
    ist die Abgrenzung: Die allgemeine Gefahrenabwehr liegt grundsaetzlich bei den Verwaltungs-/Ordnungsbehoerden;
    der Polizeivollzugsdienst wird taetig, wenn die Abwehr keinen Aufschub duldet (Eilfall) oder eine
    besondere Zuweisung besteht. Ein Handeln der unzustaendigen Behoerde macht die Massnahme formell rechtswidrig.'
  norms:
  - Thueringer Polizeiaufgabengesetz (ThuerPAG) und Thueringer Ordnungsbehoerdengesetz (ThuerOBG)
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: th-por-vollstreckung
  type: norm
  front: Nach welchem Gesetz wird eine Gefahrenabwehrverfuegung in Thueringen vollstreckt?
  back: 'Thueringer Verwaltungszustellungs- und Vollstreckungsgesetz (ThuerVwZVG). Regelfall ist das gestreckte
    Verfahren: Grundverfuegung - Androhung - Festsetzung - Anwendung des Zwangsmittels (Ersatzvornahme,
    Zwangsgeld, unmittelbarer Zwang). Bei Gefahr im Verzug sind Sofortvollzug bzw. unmittelbare Ausfuehrung
    ohne vorausgehenden Verwaltungsakt moeglich; die Kosten traegt der Pflichtige.'
  norms:
  - Thueringer Verwaltungszustellungs- und Vollstreckungsgesetz (ThuerVwZVG)
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
