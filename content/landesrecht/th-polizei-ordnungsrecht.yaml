- slug: th-schema-por-stoererauswahl
  title: "Inanspruchnahme eines Verantwortlichen nach ThürPAG und ThürOBG"
  norms:
  - "§ 12 Abs. 1 ThürPAG"
  - "§ 5 Abs. 1 ThürOBG"
  - "§ 7 ThürPAG"
  - "§ 8 ThürPAG"
  - "§ 10 ThürPAG"
  - "§ 10 ThürOBG"
  - "§ 11 ThürOBG"
  - "§ 13 ThürOBG"
  quellen:
  - "Landesgesetze in der amtlichen Fassung (Landesrechtsportal)"
  - "Eigenformulierung Redaktion"
  steps:
  - label: "I. Ermächtigungsgrundlage"
  - label: "II. Formelle Rechtmäßigkeit"
    hinweis: >-
        Zuständigkeit der Ordnungsbehörde (ThürOBG), Eilzuständigkeit der Polizei (ThürPAG), Anhörung,
        Form.
  - label: "III. Materielle Rechtmäßigkeit"
    children:
    - label: "1. Konkrete Gefahr für ein Schutzgut"
    - label: "2. Verantwortlicher"
      children:
      - label: >-
          a) Verhaltensstörer: unmittelbare Verursachung
      - label: >-
          b) Zustandsstörer: Eigentümer oder Inhaber der tatsächlichen Gewalt
      - label: "c) Nichtstörer nur im Notstand"
    - label: "3. Störerauswahl als Ermessensentscheidung"
      hinweis: "Effektivität der Gefahrenabwehr; keine feste Rangfolge."
    - label: "4. Verhältnismäßigkeit und Zumutbarkeit"
faelle:
- slug: th-fall-por-stoererauswahl-oelspur
  title: "Die Ölspur"
  difficulty: 3
  minutes: 50
  quellen:
  - "Landesgesetze in der amtlichen Fassung (Landesrechtsportal)"
  - "Eigenformulierung Redaktion"
  - "BVerfGE 102, 1 (Altlasten, Zustandsverantwortlichkeit)"
  facts: >-
      Auf einer Gemeindestraße in Erfurt tritt aus dem Tank eines Lieferwagens, der dem Händler H
      gehört, Heizöl aus und zieht eine 200 Meter lange Spur auf der Fahrbahn. Der Fahrer, eine
      Aushilfskraft des H, hat die Spur nicht bemerkt und ist weitergefahren; er ist nicht zu
      ermitteln. Die Fahrbahn ist stark rutschig, mehrere Fahrzeuge geraten ins Schleudern. Die
      zuständige Ordnungsbehörde ermittelt den H als Eigentümer des Lieferwagens. Sie lässt die Spur
      durch eine Fachfirma beseitigen und verlangt von H die Kosten (1.800 Euro). H meint, er habe
      weder die Spur verursacht noch gewusst, dass der Tank leckt, und der Fahrer sei verantwortlich.
  question: >-
      Durfte die Ordnungsbehörde den H zur Kostentragung heranziehen? Die Beseitigung ist als
      zulässige Ersatzvornahme zu unterstellen.
  steps:
  - prompt: "Welche Gefahr liegt vor?"
    erwartung: >-
        Eine konkrete und gegenwärtige Gefahr für die öffentliche Sicherheit, nämlich für Leib und Leben
        der Verkehrsteilnehmer, durch die rutschige Fahrbahn.
  - prompt: "Wer ist Verantwortlicher, und kommt der Fahrer in Betracht?"
    erwartung: >-
        Der Fahrer wäre Verhaltensstörer, ist aber unbekannt und deshalb nicht greifbar. Auf ihn kommt
        es für die Entscheidung nicht an, weil mehrere Verantwortliche möglich sind.
  - prompt: "Ist H Verantwortlicher?"
    erwartung: >-
        Ja, H ist als Eigentümer des Lieferwagens Zustandsstörer, denn die Gefahr geht von der Sache aus
        (Zustandsverantwortlichkeit). Dass H die Ölspur nicht verursacht hat und den Defekt nicht
        kannte, ist unerheblich, da die Zustandsverantwortlichkeit nicht an Verschulden anknüpft.
  - prompt: >-
        War die Auswahl des H ermessensfehlerfrei, und besteht eine Kostengrenze?
    erwartung: >-
        Ja. Die Störerauswahl liegt im Auswahlermessen der Behörde; maßgeblich ist die Effektivität der Gefahrenabwehr, eine feste Rangfolge gibt es nicht. Der unbekannte Fahrer stand für eine effektive Gefahrenabwehr nicht zur Verfügung; H war bekannt, erreichbar und konnte die Beseitigung finanzieren. Die Kostenlast von 1.800 Euro ist für H zumutbar und verhältnismäßig, denn sie liegt weit unter dem Wert des Lieferwagens. Die Kostenpflicht des H besteht.
  expectation:
    pruefpunkte:
    - id: p1
      label: "Konkrete gegenwärtige Gefahr durch die Ölspur erkannt"
      weight: 1.5
      required: false
      keywords:
      - "konkrete Gefahr"
      - "gegenwärtige Gefahr"
      card_slugs:
      - "th-por-gefahr"
    - id: p2
      label: >-
          H als Zustandsstörer (Eigentümer der Sache) eingeordnet, Verschulden unerheblich
      weight: 3.0
      required: true
      norms:
      - "§ 8 ThürPAG"
      - "§ 11 ThürOBG"
      keywords:
      - "Zustandsstörer"
