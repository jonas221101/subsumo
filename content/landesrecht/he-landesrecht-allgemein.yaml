cards:
- slug: he-lra-vwvfg
  type: norm
  front: Welches Verwaltungsverfahrensgesetz gilt für Landesbehörden in Hessen?
  back: Hessisches Verwaltungsverfahrensgesetz (HVwVfG) - Vollgesetz. Das VwVfG des Bundes gilt nur für
    Bundesbehörden (§ 1 VwVfG); für Landes- und Kommunalbehörden ist das Landesgesetz maßgeblich. Bei
    Verweisungsgesetzen werden die Bundesnormen 'entsprechend' angewendet und sind so zu zitieren (z.
    B. '§ 35 VwVfG i. V. m. § 1 des Landesgesetzes'), bei Vollgesetzen ist die Landesnorm selbst zu zitieren.
  norms:
  - Hessisches Verwaltungsverfahrensgesetz (HVwVfG) - Vollgesetz
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: he-lra-verfassungsgericht
  type: norm
  front: Gibt es in Hessen eine Individualverfassungsbeschwerde zum Landesverfassungsgericht?
  back: 'Ja - Grundrechtsklage, Art. 131 HV, §§ 43 ff. StGHG. Zuständiges Gericht: Staatsgerichtshof des
    Landes Hessen auf Grundlage der Verfassung des Landes Hessen (HV). Verfahrensgegenstand ist nur die
    Verletzung von Landesgrundrechten durch Landesstaatsgewalt; Bundesrecht ist Prüfungsmaßstab nur, soweit
    die Landesverfassung darauf verweist. Daneben steht immer die Verfassungsbeschwerde zum BVerfG (Art.
    93 Abs. 1 Nr. 4a GG).'
  norms:
  - Verfassung des Landes Hessen (HV)
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: he-lra-kommunalverfassung
  type: norm
  front: Welches Gesetz regelt die Kommunalverfassung in Hessen und welche Hauptorgane hat die Gemeinde?
  back: 'Hessische Gemeindeordnung (HGO): Gemeindevertretung (§ 49) und Gemeindevorstand/Magistrat (§
    65) - Magistratsverfassung. Grundlage ist die Selbstverwaltungsgarantie (Art. 28 Abs. 2 GG und Landesverfassung):
    eigenverantwortliche Regelung aller Angelegenheiten der örtlichen Gemeinschaft. Klausurklassiker:
    Zuständigkeitsstreit zwischen Vertretung und Verwaltungsspitze, Kommunalverfassungsstreit, Rechtsaufsicht.'
  norms:
  - 'Hessische Gemeindeordnung (HGO): Gemeindevertretung (§ 49) und Gemeindevorstand/Magistrat (§ 65)
    - Magistratsverfassung'
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: he-lra-bauordnung
  type: norm
  front: Wie heißt die Bauordnung in Hessen und wie ist eine Baugenehmigung zu prüfen?
  back: 'Hessische Bauordnung (HBO). Anspruch auf Baugenehmigung besteht, wenn dem Vorhaben keine öffentlich-rechtlichen
    Vorschriften entgegenstehen: Genehmigungsbedürftigkeit (Errichtung, Änderung, Nutzungsänderung), keine
    Genehmigungsfreiheit, bauplanungsrechtliche Zulässigkeit nach §§ 29 ff. BauGB (Bundesrecht), bauordnungsrechtliche
    Zulässigkeit nach der Landesbauordnung (Abstandsflächen, Gestaltung, Stellplätze).'
  norms:
  - Hessische Bauordnung (HBO)
  - §§ 29 ff. BauGB
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: he-lra-pflichtstoff
  type: definition
  front: Welche Landesrechtsgebiete gehören in Hessen zum Pflichtstoff des Öffentlichen Rechts?
  back: Gefahrenabwehrrecht (HSOG); Kommunalrecht (HGO, Magistratsverfassung); Bauordnungsrecht (HBO);
    Hessische Verfassung und Grundrechtsklage. Landesrecht wird im Examen fast nie isoliert, sondern eingebettet
    in eine verwaltungsprozessuale Einkleidung (Anfechtungs-/Verpflichtungsklage, vorläufiger Rechtsschutz)
    geprüft - die Landesnorm ist die Ermächtigungsgrundlage, der Aufbau bleibt der allgemeine.
  norms: []
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
