cards:
- slug: he-lra-vwvfg
  type: norm
  front: Welches Verwaltungsverfahrensgesetz gilt fuer Landesbehoerden in Hessen?
  back: Hessisches Verwaltungsverfahrensgesetz (HVwVfG) - Vollgesetz. Das VwVfG des Bundes gilt nur fuer
    Bundesbehoerden (§ 1 VwVfG); fuer Landes- und Kommunalbehoerden ist das Landesgesetz massgeblich.
    Bei Verweisungsgesetzen werden die Bundesnormen 'entsprechend' angewendet und sind so zu zitieren
    (z. B. '§ 35 VwVfG i. V. m. § 1 des Landesgesetzes'), bei Vollgesetzen ist die Landesnorm selbst zu
    zitieren.
  norms:
  - Hessisches Verwaltungsverfahrensgesetz (HVwVfG) - Vollgesetz
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: he-lra-verfassungsgericht
  type: norm
  front: Gibt es in Hessen eine Individualverfassungsbeschwerde zum Landesverfassungsgericht?
  back: 'Ja - Grundrechtsklage, Art. 131 HV, §§ 43 ff. StGHG. Zustaendiges Gericht: Staatsgerichtshof
    des Landes Hessen auf Grundlage der Verfassung des Landes Hessen (HV). Verfahrensgegenstand ist nur
    die Verletzung von Landesgrundrechten durch Landesstaatsgewalt; Bundesrecht ist Pruefungsmassstab
    nur, soweit die Landesverfassung darauf verweist. Daneben steht immer die Verfassungsbeschwerde zum
    BVerfG (Art. 93 Abs. 1 Nr. 4a GG).'
  norms:
  - Verfassung des Landes Hessen (HV)
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: he-lra-kommunalverfassung
  type: norm
  front: Welches Gesetz regelt die Kommunalverfassung in Hessen und welche Hauptorgane hat die Gemeinde?
  back: 'Hessische Gemeindeordnung (HGO): Gemeindevertretung (§ 49) und Gemeindevorstand/Magistrat (§
    65) - Magistratsverfassung. Grundlage ist die Selbstverwaltungsgarantie (Art. 28 Abs. 2 GG und Landesverfassung):
    eigenverantwortliche Regelung aller Angelegenheiten der oertlichen Gemeinschaft. Klausurklassiker:
    Zustaendigkeitsstreit zwischen Vertretung und Verwaltungsspitze, Kommunalverfassungsstreit, Rechtsaufsicht.'
  norms:
  - 'Hessische Gemeindeordnung (HGO): Gemeindevertretung (§ 49) und Gemeindevorstand/Magistrat (§ 65)
    - Magistratsverfassung'
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: he-lra-bauordnung
  type: norm
  front: Wie heisst die Bauordnung in Hessen und wie ist eine Baugenehmigung zu pruefen?
  back: 'Hessische Bauordnung (HBO). Anspruch auf Baugenehmigung besteht, wenn dem Vorhaben keine oeffentlich-rechtlichen
    Vorschriften entgegenstehen: Genehmigungs-beduerftigkeit (Errichtung, Aenderung, Nutzungsaenderung),
    keine Genehmigungsfreiheit, bauplanungsrechtliche Zulaessigkeit nach §§ 29 ff. BauGB (Bundesrecht),
    bauordnungsrechtliche Zulaessigkeit nach der Landesbauordnung (Abstandsflaechen, Gestaltung, Stellplaetze).'
  norms:
  - Hessische Bauordnung (HBO)
  - §§ 29 ff. BauGB
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: he-lra-pflichtstoff
  type: definition
  front: Welche Landesrechtsgebiete gehoeren in Hessen zum Pflichtstoff des Oeffentlichen Rechts?
  back: Gefahrenabwehrrecht (HSOG); Kommunalrecht (HGO, Magistratsverfassung); Bauordnungsrecht (HBO);
    Hessische Verfassung und Grundrechtsklage. Landesrecht wird im Examen fast nie isoliert, sondern eingebettet
    in eine verwaltungsprozessuale Einkleidung (Anfechtungs-/Verpflichtungsklage, vorlaeufiger Rechtsschutz)
    geprueft - die Landesnorm ist die Ermaechtigungsgrundlage, der Aufbau bleibt der allgemeine.
  norms: []
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
