  - label: II. Ermächtigungsgrundlage
    children:
    - label: 1. Satzungsautonomie, Art. 23 BayGO
    - label: 2. Besondere gesetzliche Ermächtigung bei Grundrechtseingriffen
      hinweis: Etwa Art. 24 BayGO beim Anschluss- und Benutzungszwang.
  - label: III. Formelle Rechtmäßigkeit
    children:
    - label: '1. Zuständigkeit: Gemeinderat, Art. 29 BayGO'
    - label: '2. Verfahren: Ladung, Beschlussfähigkeit, Öffentlichkeit'
    - label: 3. Befangenheit, Art. 49 BayGO
      hinweis: Mitwirkung nur dann relevant, wenn sie für das Abstimmungsergebnis entscheidend war.
    - label: 4. Ausfertigung und Bekanntmachung, Art. 26 BayGO
  - label: IV. Materielle Rechtmäßigkeit
    children:
    - label: 1. Vereinbarkeit mit höherrangigem Recht
    - label: 2. Gleichheitssatz und Verhältnismäßigkeit
  - label: V. Zulassung zu einer öffentlichen Einrichtung, Art. 21 BayGO
    children:
    - label: 1. Öffentliche Einrichtung und Widmung
    - label: 2. Anspruchsberechtigter, Gleichbehandlung, Art. 3 Abs. 1 GG
    - label: 3. Kapazität und sachliche Versagungsgründe
  stand: 2026-10
faelle:
- slug: by-fall-kom-stadthalle
  title: Die Stadthalle und die Wählergruppe
  difficulty: 3
  minutes: 45
  quellen:
  - Eigener Sachverhalt der Redaktion
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  facts: >-
    Die bayerische Stadt X betreibt eine Stadthalle als öffentliche Einrichtung. Nach der Benutzungsordnung
    steht sie Vereinen, Parteien und Wählergruppen aus dem Stadtgebiet für Veranstaltungen zur Verfügung;
    in der Vergangenheit haben dort alle im Stadtrat vertretenen Gruppierungen Versammlungen abgehalten.
    Die örtliche Wählergruppe W, die bisher nicht im Stadtrat vertreten ist und ihren Sitz in X hat, beantragt
    die Halle für eine Wahlkampfveranstaltung am 5. des nächsten Monats. Der erste Bürgermeister lehnt
    ab, weil er die Positionen der Wählergruppe politisch für "unerwünscht" hält. Die Halle ist an diesem
    Tag frei. W möchte die Zulassung kurzfristig erreichen.
  question: >-
    Hat W einen Anspruch auf Überlassung der Stadthalle, und wie kann sie ihn kurzfristig durchsetzen?
  steps:
  - prompt: Auf welche Anspruchsgrundlage kann W sich stützen?
    erwartung: >-
      Auf Art. 21 Abs. 1 BayGO in Verbindung mit der Widmung der Stadthalle; ein Gleichbehandlungsanspruch
      ergibt sich zusätzlich aus Art. 3 Abs. 1 GG und der Selbstbindung der Verwaltung.
  - prompt: Ist W anspruchsberechtigt und die Halle eine öffentliche Einrichtung?
    erwartung: >-
      Ja: Die Halle ist durch die Benutzungsordnung und die Zulassungspraxis Vereinen, Parteien und Wählergruppen
      aus dem Stadtgebiet gewidmet; W hat ihren Sitz in X.
  - prompt: Darf die Stadt die Zulassung aus politischer Missbilligung versagen?
    erwartung: >-
      Nein: Die politische Ausrichtung ist kein sachlicher Versagungsgrund; die Ablehnung verstößt gegen
      den Gleichbehandlungsgrundsatz. Kapazitätsgründe liegen nicht vor, die Halle ist frei.
  - prompt: Wie kann W den Anspruch kurzfristig durchsetzen?
    erwartung: >-
      Mit einem Antrag auf einstweilige Anordnung nach § 123 Abs. 1 S. 2 VwGO (Regelungsanordnung); Anordnungsanspruch
      und Anordnungsgrund (Eilbedürftigkeit) sind glaubhaft zu machen.
  expectation:
    pruefpunkte:
    - id: p1
      label: Anspruch aus Art. 21 Abs. 1 BayGO und Widmung als öffentliche Einrichtung
      weight: 2.5
      required: true
      norms:
      - Art. 21 Abs. 1 BayGO
      keywords:
      - Art. 21 Abs. 1 BayGO
      - öffentliche Einrichtung
      - Widmung
      - Zulassungsanspruch
      - Benutzungsanspruch
      card_slugs:
      - by-kom-einrichtungen
    - id: p2
      label: Gleichbehandlung nach Art. 3 Abs. 1 GG und Selbstbindung der Verwaltung
      weight: 2.0
      required: true
      norms:
      - Art. 3 Abs. 1 GG
      keywords:
      - Gleichbehandlung
      - Art. 3 Abs. 1 GG
      - Selbstbindung der Verwaltung
      - Zulassungspraxis
      - Parteienprivileg
      card_slugs:
      - by-kom-einrichtungen
    - id: p3
      label: Keine sachlichen Versagungsgründe, politische Missbilligung unzulässig
      weight: 2.0
      required: false
      keywords:
      - politische Missbilligung
      - sachlicher Grund
      - Kapazität
      - Versagungsgrund
      - Neutralität
      card_slugs:
      - by-kom-einrichtungen
    - id: p4
      label: Einstweilige Anordnung nach § 123 VwGO als Rechtsschutz
      weight: 2.0
      required: true
      norms:
      - § 123 Abs. 1 VwGO
      keywords:
      - § 123 VwGO
      - einstweilige Anordnung
      - Regelungsanordnung
      - Anordnungsanspruch
      - Anordnungsgrund
      - Glaubhaftmachung
  stand: 2026-10
