  title: 'Kommunalrecht Bayern: Gemeindeordnung (BayGO)'
  parent: oeffentliches-recht
  bundesland: BY
  relevance: 4
  stand: 2026-10
  redaktion:
    erzeugt_von: claude-sonnet (Pflichtstoff-Vervollständigung)
    status: in-pruefung
    normzitate_geprueft: false
cards:
- slug: by-kom-wirkungskreis
  type: definition
  front: Was unterscheidet in Bayern den eigenen vom übertragenen Wirkungskreis der Gemeinde?
  back: >-
    Der eigene Wirkungskreis umfasst die Angelegenheiten der örtlichen Gemeinschaft, die die Gemeinde
    nach Art. 28 Abs. 2 GG und Art. 11 Abs. 2 BV in eigener Verantwortung regelt (Art. 6 BayGO). Der übertragene
    Wirkungskreis umfasst Aufgaben, die der Gemeinde durch Gesetz vom Staat zugewiesen sind (Art. 7 BayGO).
    Die Abgrenzung entscheidet über die Aufsicht: Im eigenen Wirkungskreis besteht nur Rechtsaufsicht,
    im übertragenen Wirkungskreis zusätzlich Fachaufsicht. Klausurrelevant ist die Zuordnung der Aufgabe
    nach dem einschlägigen Fachgesetz; auch Weisungsrechte und die Kontrolldichte hängen davon ab.
  norms:
  - Art. 28 Abs. 2 S. 1 GG
  - Art. 11 Abs. 2 BV
  - Art. 6 BayGO
  - Art. 7 BayGO
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-10
- slug: by-kom-organe
  type: definition
  front: Welche Organe hat die bayerische Gemeinde und wie sind die Zuständigkeiten verteilt?
  back: >-
    Die Gemeindeorgane sind der Gemeinderat und der erste Bürgermeister. Der Gemeinderat verwaltet die
    Gemeinde, soweit nicht der erste Bürgermeister kraft Gesetzes selbstständig entscheidet (Art. 29 BayGO);
    er ist das Hauptorgan für alle grundsätzlichen Entscheidungen. Der erste Bürgermeister ist zugleich
    Vorsitzender des Gemeinderats und eigenständiges Organ. Der Gemeinderat kann Aufgaben auf beschließende
    Ausschüsse übertragen; Ausnahmen gelten für Angelegenheiten, die ihm vorbehalten sind. Die Zuständigkeitsverteilung
    ist Teil der formellen Rechtmäßigkeit von Verwaltungsentscheidungen und Satzungen: Handelt das unzuständige
    Organ, ist die Entscheidung formell rechtswidrig, teils im Außenverhältnis bei Vertretungsmacht auch
    unwirksam.
  norms:
  - Art. 29 BayGO
  - Art. 37 BayGO
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-10
- slug: by-kom-buergermeister
  type: norm
  front: Welche Aufgaben erledigt der erste Bürgermeister in eigener Zuständigkeit?
  back: >-
    Nach Art. 37 Abs. 1 BayGO erledigt der erste Bürgermeister in eigener Zuständigkeit die laufenden
    Angelegenheiten, die für die Gemeinde keine grundsätzliche Bedeutung haben und keine erheblichen Verpflichtungen
    erwarten lassen, sowie den Vollzug der Beschlüsse des Gemeinderats und die in dringenden Fällen notwendigen
    Anordnungen. Außerdem sind ihm die Aufgaben im übertragenen Wirkungskreis zugewiesen. Klausurrelevant
    ist die Abgrenzung zu grundsätzlichen Fragen und die Bedeutung für die Gemeinde; wird eine Entscheidung
    vom Bürgermeister getroffen, die dem Gemeinderat vorbehalten ist, ist sie im Innenverhältnis rechtswidrig,
    kann aber im Außenverhältnis wirksam bleiben.
  norms:
  - Art. 37 Abs. 1 BayGO
  - Art. 29 BayGO
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-10
- slug: by-kom-vertretung
  type: norm
  front: Wer vertritt die Gemeinde nach außen und welche Form gilt für Verpflichtungserklärungen?
  back: >-
    Der erste Bürgermeister vertritt die Gemeinde nach außen (Art. 38 BayGO). Erklärungen, durch die die
    Gemeinde verpflichtet werden soll, bedürfen der Schriftform und sind vom ersten Bürgermeister oder
    dem Vertreter zu unterschreiben; ausgenommen sind Geschäfte der laufenden Verwaltung, die keine erheblichen
    Verpflichtungen begründen. Eine Verletzung der Vorschrift macht eine Erklärung nach h. M. nicht bloß
    rechtswidrig, sondern mangels Vertretungsmacht schwebend unwirksam, was für zivilrechtliche Ansprüche
    gegen die Gemeinde von Bedeutung ist. Die Vertretungsbefugnis des Bürgermeisters geht damit nicht
    weiter als die gesetzliche Form und die Zuständigkeit im Innenverhältnis; das schützt die Gemeinde
    als Rechtsträger vor eigenmächtigen Verpflichtungen.
  norms:
  - Art. 38 BayGO
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-10
- slug: by-kom-befangenheit
  type: norm
  front: Wann ist ein Gemeinderatsmitglied in Bayern wegen persönlicher Beteiligung ausgeschlossen?
  back: >-
    Nach Art. 49 BayGO darf ein Gemeinderatsmitglied an der Beratung und Abstimmung nicht teilnehmen,
    wenn der Beschluss ihm, einem Angehörigen oder einer von ihm vertretenen juristischen Person oder
    Vereinigung einen unmittelbaren Vorteil oder Nachteil bringen kann. Unmittelbar ist ein Vorteil, wenn
    er sich aus dem Beschluss selbst und nicht erst aus weiteren Entscheidungen ergibt; die Betroffenheit
    als Teil der Allgemeinheit (Gruppeninteresse) schließt nicht aus. Hat ein ausgeschlossenes Mitglied
    mitgewirkt, ist der Beschluss rechtswidrig, wenn die Mitwirkung für das Abstimmungsergebnis entscheidend
    war (Art. 49 Abs. 3 BayGO). Bei Satzungen und Bebauungsplänen wird dies häufig geprüft, auch im Hinblick
    auf Heilung und Planerhaltung.
  norms:
  - Art. 49 BayGO
  - Art. 49 Abs. 3 BayGO
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-10
- slug: by-kom-satzung
  type: norm
  front: Wie prüft man die Rechtmäßigkeit einer gemeindlichen Satzung in Bayern?
  back: >-
    Ermächtigung ist die Satzungsautonomie (Art. 23 BayGO) im eigenen Wirkungskreis; für Eingriffe in
    Grundrechte genügt sie nach h. M. nicht, es bedarf einer besonderen gesetzlichen Ermächtigung (Beispiele:
    Abgabensatzungen nach dem Kommunalabgabengesetz, Anschluss- und Benutzungszwang nach Art. 24 BayGO).
    Formell: Zuständigkeit des Gemeinderats (Art. 29 BayGO), ordnungsgemäßes Verfahren (Ladung, Beschlussfähigkeit,
    Befangenheit nach Art. 49 BayGO), Ausfertigung und Bekanntmachung (Art. 26 BayGO). Materiell: Vereinbarkeit
    mit höherrangigem Recht (Verfassung, Gesetz), insbesondere Gleichheitssatz und Verhältnismäßigkeit
    sowie Bestimmtheit. Rechtsfolge bei Verstößen ist grundsätzlich die Nichtigkeit; Verfahrensfehler
    können nach Maßgabe der Heilungs- und Rügefristen unbeachtlich werden.
  norms:
  - Art. 23 BayGO
  - Art. 24 BayGO
  - Art. 26 BayGO
  - Art. 29 BayGO
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-10
- slug: by-kom-anschlusszwang
  type: norm
  front: Was ist der Anschluss- und Benutzungszwang und unter welchen Voraussetzungen ist er zulässig?
  back: >-
    Die Gemeinde kann nach Art. 24 BayGO durch Satzung für Grundstücke ihres Gebiets den Anschluss an
    eine öffentliche Einrichtung (etwa Wasserversorgung, Abwasserbeseitigung, Fernwärme) und deren Benutzung
    vorschreiben, wenn ein dringendes öffentliches Bedürfnis besteht. Der Zwang greift in Art. 14 GG und
    Art. 2 Abs. 1 GG ein und ist daher an der Verhältnismäßigkeit zu messen. Für Gründe des Gemeinwohls
    reicht zum Beispiel der Schutz der Gesundheit, der Einwohner oder der Umwelt; wirtschaftliche Interessen
    der Gemeinde allein genügen nicht. Ausnahmen und Befreiungen sind zu regeln, wenn der Zwang im Einzelfall
    unzumutbar ist. Kontrollfragen sind Satzungsermächtigung, Bekanntmachung, dringendes öffentliches
    Bedürfnis und Verhältnismäßigkeit.
  norms:
  - Art. 24 BayGO
  - Art. 14 GG
  - Art. 2 Abs. 1 GG
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-10
- slug: by-kom-einrichtungen
  type: norm
  front: Welchen Anspruch haben Einwohner und Vereinigungen auf Benutzung einer öffentlichen Einrichtung?
  back: >-
    Nach Art. 21 Abs. 1 BayGO sind Gemeindeangehörige im Rahmen des geltenden Rechts berechtigt, die öffentlichen
    Einrichtungen der Gemeinde zu benutzen. Das gilt entsprechend für juristische Personen und Vereinigungen
    mit Sitz im Gemeindegebiet. Der Anspruch richtet sich nach dem Widmungszweck, der durch Satzung, Beschluss
    oder die tatsächliche Zulassungspraxis festgelegt wird; er besteht nur im Rahmen der vorhandenen Kapazität.
    Bei Parteien ergibt sich ein Anspruch auf gleiche Behandlung aus Art. 3 Abs. 1 GG, Art. 21 GG in Verbindung
    mit § 5 PartG, wenn die Einrichtung auch anderen Parteien oder Vereinigungen offensteht. Eine Verweigerung
    wegen politischer Missbilligung ist rechtswidrig; zulässig sind sachliche Gründe wie Kapazitätsgrenzen
    oder die Wahrung der öffentlichen Sicherheit. Im Eilverfahren kommt § 123 VwGO in Betracht.
  norms:
  - Art. 21 Abs. 1 BayGO
  - Art. 3 Abs. 1 GG
  - Art. 21 Abs. 1 GG
  - § 5 PartG
  - § 123 VwGO
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-10
- slug: by-kom-aufsicht
  type: definition
  front: Welche Aufsicht besteht über bayerische Gemeinden und wie wehrt sich die Gemeinde?
  back: >-
    Die staatliche Aufsicht über die Gemeinden ist in Art. 108 ff. BayGO geregelt. Im eigenen Wirkungskreis
    ist sie auf Rechtsaufsicht beschränkt: Der Staat darf nur prüfen, ob die Gemeinde die Gesetze einhält,
    nicht ob ihre Entscheidung zweckmäßig ist. Im übertragenen Wirkungskreis tritt die Fachaufsicht hinzu,
    die auch Zweckmäßigkeit und Weisungen erfasst. Rechtsaufsichtsbehörde ist für kreisangehörige Gemeinden
    das Landratsamt (Art. 110 BayGO). Aufsichtsmaßnahmen gegenüber der Gemeinde sind Verwaltungsakte;
    die Gemeinde kann sie mit der Anfechtungsklage angreifen und stützt ihre Klagebefugnis auf die kommunale
    Selbstverwaltungsgarantie des Art. 28 Abs. 2 GG. Aufsicht dient auch dem Schutz der Gemeinde, nicht
    nur der Kontrolle.
  norms:
  - Art. 108 ff. BayGO
  - Art. 110 BayGO
  - Art. 28 Abs. 2 GG
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-10
- slug: by-kom-kommunalverfassungsstreit
  type: streitstand
  front: Wie wird der Kommunalverfassungsstreit prozessual behandelt?
  back: >-
    Beim Kommunalverfassungsstreit streiten Organe oder Organteile (Gemeinderatsmitglied, Fraktion, Bürgermeister)
    über ihre Rechte aus der Gemeindeordnung. Der Rechtsweg ist nach § 40 Abs. 1 VwGO eröffnet, weil es
    sich um eine öffentlich-rechtliche Streitigkeit nichtverfassungsrechtlicher Art handelt. Die Klageart
    richtet sich nach dem Begehren, meist Feststellungs- oder allgemeine Leistungsklage. Streitig ist,
    ob für die Klagebefugnis § 42 Abs. 2 VwGO analog gilt: Die h. M. verlangt auch hier die Möglichkeit
    der Verletzung eigener Organrechte, um Popularklagen zu vermeiden; ein Organ kann nur eigene Rechte,
    nicht das objektive Recht durchsetzen. Beteiligtenfähigkeit wird aus § 61 Nr. 2 VwGO analog hergeleitet.
    Wegen des Rechtsträgers ist streitig, ob Beklagter das Organ oder die Gemeinde ist.
  norms:
  - § 40 Abs. 1 VwGO
  - § 42 Abs. 2 VwGO
  - § 61 Nr. 2 VwGO
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-10
- slug: by-kom-aufbau
  type: schema_step
  front: 'Aufbau: Kommunalrechtliche Klausur nach der BayGO'
  back: >-
    I. Handelnder Organträger und Zuständigkeit (Gemeinderat, Ausschuss, erster Bürgermeister; Art. 29,
    37 BayGO). II. Ermächtigungsgrundlage oder Satzungsermächtigung (Art. 23, 24 BayGO). III. Formelle
    Rechtmäßigkeit: Verfahren (Ladung, Beschlussfähigkeit, Befangenheit nach Art. 49 BayGO, Öffentlichkeit),
    Form, Ausfertigung und Bekanntmachung (Art. 26 BayGO). IV. Materielle Rechtmäßigkeit: höherrangiges
    Recht, Gleichheitssatz, Verhältnismäßigkeit. V. Rechtsfolgen und Rechtsschutz: Nichtigkeit oder Aufhebbarkeit,
    Aufsicht (Art. 108 ff. BayGO), Kommunalverfassungsstreit.
  norms:
  - Art. 29 BayGO
  - Art. 37 BayGO
  - Art. 49 BayGO
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-10
