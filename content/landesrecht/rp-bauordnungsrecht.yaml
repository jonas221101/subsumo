faelle:
- slug: rp-fall-bau-bestandsschutz-altbau
  title: Das Haus von 1955
  difficulty: 3
  minutes: 45
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  - Art. 14 Abs. 1 GG
  facts: E ist Eigentümer eines Wohnhauses in Rheinland-Pfalz, das 1955 mit Baugenehmigung errichtet wurde.
    Seither ist das Haus unverändert und wird von E als Wohnung genutzt. Nach den heute geltenden Vorschriften
    der Landesbauordnung wäre die Abstandsfläche zum Nachbargrundstück des N zu gering; bei Errichtung
    im Jahr 1955 entsprach das Gebäude jedoch den damals geltenden Abstandsvorschriften. Nach einem Streit
    mit E verlangt N von der Bauaufsichtsbehörde, die Beseitigung der überstehenden Hauswand anzuordnen.
    Die Behörde erlässt eine entsprechende Anordnung gegen E. E hält sie für rechtswidrig. Eine Gefahr
    für Leben oder Gesundheit besteht nicht.
  question: Ist die Beseitigungsanordnung gegen E rechtmäßig?
  steps:
  - prompt: Widerspricht das Gebäude der heutigen Rechtslage?
    erwartung: Ja. Nach den heute geltenden Abstandsvorschriften wäre die Abstandsfläche zu gering. Der
      Widerspruch zur aktuellen Rechtslage allein rechtfertigt aber keine Beseitigung.
  - prompt: Greift Bestandsschutz?
    erwartung: Ja. Das Gebäude wurde 1955 mit Baugenehmigung und in Übereinstimmung mit dem damaligen
      Recht errichtet und ist seit dem unverändert genutzt. Passiver Bestandsschutz aus Art. 14 Abs. 1
      GG schützt den genehmigten Bestand auch gegen später verschärfte Vorschriften.
  - prompt: Gibt es eine Ausnahme vom Bestandsschutz?
    erwartung: Nein. Ein Anpassungsverlangen wegen einer Gefahr für Leben oder Gesundheit kommt nicht
      in Betracht, weil keine solche Gefahr besteht. Der Bestandsschutz ist weder durch Zerstörung noch
      durch Nutzungsaufgabe erloschen.
  - prompt: Ergebnis?
    erwartung: Die Beseitigungsanordnung ist rechtswidrig. Auch das Verlangen des N ändert daran nichts,
      weil der Bestandsschutz das Gebäude gegenüber der verschärften Rechtslage sichert.
  expectation:
    pruefpunkte:
    - id: p1
      label: Passiver Bestandsschutz aus Art. 14 Abs. 1 GG für rechtmäßig errichteten Altbau bejaht
      weight: 3.0
      required: true
      norms:
      - Art. 14 Abs. 1 GG
      keywords:
      - Bestandsschutz
      - passiver Bestandsschutz
      - Art. 14 Abs. 1 GG
      - 1955 genehmigt
      - damals geltende Rechtslage
      card_slugs:
      - rp-bau-bestandsschutz
    - id: p2
      label: Spätere Rechtsverschärfung begründet für sich allein keine Beseitigung
      weight: 2.0
      required: true
      keywords:
      - spätere Rechtsänderung
      - heutige Rechtslage
      - nachträgliche Verschärfung
      - später verschärfte Vorschriften
      - verschärfte Rechtslage
      - aktuelle Rechtslage
      card_slugs:
      - rp-bau-bestandsschutz
      - rp-bau-eingriff
    - id: p3
      label: Kein Erlöschen und keine Gefahrenabwehr-Ausnahme
      weight: 1.5
      required: false
      keywords:
      - Gefahr für Leben und Gesundheit
      - Anpassungsverlangen
      - Erlöschen des Bestandsschutzes
      - Identität der Anlage
      card_slugs:
      - rp-bau-bestandsschutz
