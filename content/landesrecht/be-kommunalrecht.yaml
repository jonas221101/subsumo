cards:
- slug: be-kr-einheitsgemeinde
  type: norm
  front: >-
    Welchen Status hat Berlin im Verhältnis von Land und Gemeinde?
  back: >-
    Berlin ist ein Land der Bundesrepublik Deutschland und zugleich eine Stadt (Art. 1 Abs. 1 VvB). Es ist Einheitsgemeinde: Staatliche und gemeindliche Tätigkeit werden nicht getrennt (§ 2 LOG BE), beides nimmt dieselbe Rechtsperson, das Land Berlin, wahr; eine Gemeindeordnung wie in den Flächenländern gibt es nicht. Die Verwaltung ist zweistufig aufgebaut (Hauptverwaltung und Bezirksverwaltungen, § 3 Abs. 1 LOG BE). Die Grundlagen finden sich in der Verfassung von Berlin, im Bezirksverwaltungsgesetz (BezVG) und im Landesorganisationsgesetz (LOG BE) vom 10. Juli 2025, das zum 1. Januar 2026 das Allgemeine Zuständigkeitsgesetz (AZG) abgelöst hat. Für die Klausur wichtig: Die kommunalrechtlichen Fragen der Flächenländer (Gemeindeordnung,
    Rat, Bürgermeister) sind in Berlin als Bezirksverwaltung zu prüfen.
  norms:
  - Art. 1 Abs. 1 VvB
  - § 2 LOG BE
  - Bezirksverwaltungsgesetz (BezVG)
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-10
- slug: be-kr-bezirke
  type: definition
  front: Welche Rechtsstellung haben die Berliner Bezirke?
  back: >-
    Berlin gliedert sich in zwölf Bezirke (Art. 4 Abs. 1 VvB). Sie sind Selbstverwaltungseinheiten Berlins ohne Rechtspersönlichkeit (§ 2 Abs. 1 BezVG) und keine Gemeinden im Sinne des Art. 28 Abs. 2 GG. Sie erfüllen ihre Aufgaben nach den Grundsätzen der Selbstverwaltung und nehmen regelmäßig die örtlichen Verwaltungsaufgaben wahr (Art. 66 Abs. 2 VvB); alle Aufgaben, die nicht der Hauptverwaltung zugewiesen sind, nehmen die Bezirke wahr (Art. 67 Abs. 2 VvB). Rechtsträger ihrer Handlungen ist das Land Berlin. Folgen:
    Die Bezirke sind im Außenverhältnis nicht klagefähig gegen das Land und können nicht Beklagte einer
    Klage sein; zu verklagen ist das Land Berlin.
  norms:
  - Art. 66 ff. VvB
  - Bezirksverwaltungsgesetz (BezVG)
  - Art. 28 Abs. 2 GG
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-10
- slug: be-kr-organe
  type: definition
  front: >-
    Welche Organe hat der Berliner Bezirk und wie werden sie bestimmt?
  back: >-
    Organe der Bezirksverwaltung sind die Bezirksverordnetenversammlung (BVV) und das Bezirksamt. Die BVV ist Organ der bezirklichen Selbstverwaltung; sie übt die Kontrolle über die Verwaltung des Bezirks aus, beschließt den Bezirkshaushaltsplan und entscheidet in den ihr zugewiesenen Angelegenheiten (Art. 72 Abs. 1 VvB; §§ 12, 17 BezVG). Sie wählt die Mitglieder des Bezirksamts für die Dauer der Wahlperiode und kann ein Mitglied mit Zweidrittelmehrheit abberufen (§ 35 BezVG). Das Bezirksamt besteht aus der Bezirksbürgermeisterin bzw. dem Bezirksbürgermeister und den Bezirksstadträten (Art. 74 Abs. 1 VvB), ist die Verwaltungsbehörde des Bezirks und vertritt Berlin in Angelegenheiten seines Bezirks (Art. 74 Abs. 2 VvB; § 36 BezVG).
  norms:
  - Art. 66 ff. VvB
  - Bezirksverwaltungsgesetz (BezVG)
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-10
- slug: be-kr-zustaendigkeit
  type: definition
  front: >-
    Wie werden in Berlin die Aufgaben zwischen Hauptverwaltung und Bezirken abgegrenzt?
  back: >-
    Die Verwaltung ist zweistufig: Die Hauptverwaltung (Senat, Senatsverwaltungen) nimmt die Aufgaben von gesamtstädtischer Bedeutung wahr, das sind die Leitungsaufgaben sowie die Aufgaben der Polizei-, Justiz- und Steuerverwaltung und einzelne weitere Aufgaben, die wegen ihrer Eigenart zwingend einer Durchführung durch die Hauptverwaltung bedürfen (Art. 67 Abs. 1 VvB; § 8 Abs. 2 LOG BE). Die Bezirke nehmen alle anderen Aufgaben der Verwaltung wahr (Art. 67 Abs. 2 VvB). Die konkrete Zuordnung ergibt sich aus dem Landesorganisationsgesetz (LOG BE), das seit 1. Januar 2026 das frühere Allgemeine Zuständigkeitsgesetz (AZG) ablöst, sowie aus dem Zuständigkeitskatalog: Bis zu einer Rechtsverordnung nach § 13 LOG BE gilt der bisherige Allgemeine Zuständigkeitskatalog des AZG weiter (§ 51 LOG BE). Für die Klausur ist zunächst
    das handelnde Bezirksamt als Behörde der Bezirksverwaltung zu bestimmen, dann die sachliche Zuständigkeit nach dem LOG BE bzw. dem Fachgesetz zu prüfen. Handelt ein unzuständiges Bezirksamt oder die Hauptverwaltung
    statt des Bezirks, ist der Verwaltungsakt formell rechtswidrig (Zuständigkeitsfehler).
  norms:
  - Landesorganisationsgesetz (LOG BE)
  - Art. 66 ff. VvB
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-10
- slug: be-kr-beklagter
  type: definition
  front: >-
    Gegen wen richtet sich die Klage gegen einen Verwaltungsakt des Bezirksamts?
  back: >-
    Nach § 78 Abs. 1 Nr. 1 VwGO ist die Klage gegen den Bund, das Land oder die Körperschaft zu richten,
    deren Behörde den angefochtenen Verwaltungsakt erlassen hat (Rechtsträgerprinzip). Da die Bezirke
    keine eigene Rechtspersönlichkeit haben, ist Beklagter das Land Berlin (vertreten durch das Bezirksamt);
    Wo das Landesrecht das Behördenprinzip nach § 78 Abs. 1 Nr. 2 VwGO einführt, wäre stattdessen die Behörde zu verklagen; im Examen ist vom Rechtsträgerprinzip auszugehen, wenn der Sachverhalt nichts anderes ergibt. Die Klageschrift soll das Land Berlin und die handelnde
    Behörde bezeichnen (§ 82 Abs. 1 VwGO). Die Beteiligtenfähigkeit des Landes ergibt sich aus § 61 Nr.
    1 VwGO. Wer den Bezirk selbst verklagt, benennt den falschen Beklagten.
  norms:
  - >-
    § 78 Abs. 1 Nr. 1 VwGO
  - >-
    § 61 Nr. 1 VwGO
  - >-
    § 82 Abs. 1 VwGO
  quellen:
  - VwGO, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-10
- slug: be-kr-aufsicht
  type: norm
  front: >-
    Welche Aufsichts- und Eingriffsrechte hat die Hauptverwaltung gegenüber den Bezirken?
  back: >-
    Die Bezirksverwaltungen unterliegen der Bezirksaufsicht durch die für das jeweilige Politik- oder Querschnittsfeld zuständige Senatsverwaltung (§ 21 Abs. 1 LOG BE); sie stellt sicher, dass die Rechtmäßigkeit des Verwaltungshandelns gewahrt bleibt und Verwaltungsvorschriften eingehalten werden (§ 21 Abs. 2 LOG BE). Mittel sind Informations-, Aufhebungs- und Anweisungsrecht, Ersatzbeschlussfassungsrecht und Ersatzvornahme (§ 22 Abs. 1 LOG BE). Nach Art. 67 Abs. 1 VvB kann an Stelle der Fachaufsicht ein Eingriffsrecht vorgesehen werden: Nach § 23 LOG BE kann die zuständige Senatsverwaltung im Benehmen mit der für Bezirksangelegenheiten zuständigen Senatsverwaltung unabhängig von einem Rechtsverstoß Einzelweisung und Eintritt (§ 24 Abs. 3 LOG BE) ausüben, wenn ein Handeln oder Unterlassen eines bezirklichen Organs erhebliche Gesamtinteressen Berlins beeinträchtigt und eine Verständigung nicht zu erzielen ist. Die Maßnahmen sind verhältnismäßig auszuüben. Da Bezirk und Land derselben
    Rechtsperson angehören, ist die Aufsicht Teil des internen Verwaltungsaufbaus; ein Rechtsschutz des
    Bezirks gegen das Land nach Art. 28 Abs. 2 GG besteht nicht.
  norms:
  - §§ 21 bis 24 LOG BE
  - Bezirksverwaltungsgesetz (BezVG)
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-10
- slug: be-kr-keine-gemeinde
  type: streitstand
  front: >-
    Können sich Berliner Bezirke auf Art. 28 Abs. 2 GG und die kommunale Selbstverwaltung berufen?
  back: >-
    Nein. Die Bezirke sind unselbständige Teile der Landesverwaltung ohne Rechtspersönlichkeit und deshalb
    weder Gemeinden noch Gemeindeverbände im Sinne des Art. 28 Abs. 2 GG; eine Berufung auf die Selbstverwaltungsgarantie
    ist nicht möglich. Dafür spricht, dass Art. 28 Abs. 2 GG nur Gebietskörperschaften als Träger eigener
    Hoheitsrechte schützt, die ein Land von der Staatsebene abgrenzt; Berlin ist selbst Gemeinde und Land
    zugleich. Allenfalls besteht Raum für landesverfassungsrechtliche Rechte der Bezirke und für Rechte
    der BVV als Organ im Innenverhältnis. Das ändert nichts daran, dass der Bezirk gegen Weisungen des
    Senats nicht im Außenrechtsweg klagen kann.
  norms:
  - Art. 28 Abs. 2 GG
  - Art. 66 ff. VvB
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-10
- slug: be-kr-buergerbegehren
  type: norm
  front: >-
    Welche Beteiligungsrechte der Einwohner gibt es auf Bezirksebene in Berlin?
  back: >-
    Auf Bezirksebene sehen die Verfassung von Berlin und das BezVG Instrumente der Bürgerbeteiligung vor,
    insbesondere das Bürgerbegehren und den Bürgerentscheid in Angelegenheiten der Bezirksverwaltung und
    den Einwohnerantrag. An die Stelle von Beschlüssen der BVV können im Rahmen ihrer Zuständigkeit Bürgerentscheide treten (Art. 72 Abs. 2 VvB). Das Bürgerbegehren ist in allen Angelegenheiten möglich, in denen die BVV nach §§ 12 und 13 BezVG Beschlüsse fassen kann; unzulässig ist es, soweit es Rechts- oder Verwaltungsvorschriften oder einer Eingriffsentscheidung widerspricht, nicht aber allein deshalb, weil es finanzwirksam ist (§ 45 Abs. 1 BezVG). Den Einwohnerantrag (Empfehlungen an die BVV) regelt § 44 BezVG, den Bürgerentscheid § 46 BezVG. Die weiteren Zulässigkeitsvoraussetzungen (Fragestellung, Vertrauenspersonen, Quorum, Fristen) sind dem BezVG zu entnehmen. In der Klausur wird häufig die Zulässigkeit
    eines Bürgerbegehrens und die Zuständigkeit des Bezirks geprüft.
  norms:
  - §§ 44 bis 46 BezVG
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-10
schemata:
- slug: be-schema-kr-bezirksverwaltung
  title: >-
    Klage gegen Handeln der Berliner Bezirksverwaltung: Zuständigkeit und Beklagter
  norms:
  - >-
        § 78 Abs. 1 Nr. 1 VwGO
  - Landesorganisationsgesetz (LOG BE)
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  steps:
  - label: I. Wer hat gehandelt?
    hinweis: >-
      Bezirksamt, BVV oder Hauptverwaltung (Senatsverwaltung) unterscheiden.
  - label: II. Zuständigkeit
    children:
    - label: >-
        1. Gesamtstädtische Bedeutung: Hauptverwaltung nach dem LOG BE
    - label: 2. Sonst Zuständigkeit des Bezirksamts als Bezirksbehörde
    - label: >-
        3. Fachgesetzliche Spezialzuständigkeit (z. B. nach Ordnungs- oder Baurecht)
  - label: III. Rechtsträger
    hinweis: >-
      Der Bezirk hat keine Rechtspersönlichkeit; das Land Berlin ist Rechtsträger.
  - label: IV. Richtiger Beklagter
    children:
    - label: 1. Rechtsträgerprinzip, § 78 Abs. 1 Nr. 1 VwGO
    - label: 2. Vertretung durch das Bezirksamt, Bezeichnung der Behörde
  - label: V. Aufsicht und Eingriffsrecht
    hinweis: >-
      Weisungen und Selbsteintritt der Hauptverwaltung sind Binnenrecht; kein Klagerecht des Bezirks nach
      Art. 28 Abs. 2 GG.
  - label: VI. Materielle Rechtmäßigkeit
    hinweis: Nach dem jeweiligen Fachgesetz prüfen.
faelle:
- slug: be-fall-kr-bezirksamt-beklagter
  title: Die abgelehnte Sondernutzungserlaubnis
  difficulty: 3
  minutes: 40
  quellen:
  - Eigener Sachverhalt der Redaktion
  - VwGO, amtliche Fassung
  - Verfassung von Berlin und BezVG, amtliche Fassung
  facts: >-
    G betreibt ein Imbissgeschäft und beantragt beim Bezirksamt Charlottenburg-Wilmersdorf von Berlin
    die Erlaubnis, auf dem Gehweg vor seinem Lokal einen Verkaufsstand aufzustellen. Das Bezirksamt lehnt
    den Antrag durch Bescheid ab. Es handelt sich um eine örtliche Angelegenheit ohne gesamtstädtische
    Bedeutung. G möchte klagen und fragt, ob er das Bezirksamt, den Bezirk oder die zuständige Senatsverwaltung
    verklagen muss. Ferner fragt er, ob der Bezirk eine Weisung des Senats, den Antrag doch zu genehmigen,
    vor dem Verwaltungsgericht anfechten könnte.
  question: >-
    Wer ist richtiger Beklagter, und kann sich der Bezirk auf kommunale Selbstverwaltung berufen?
  steps:
  - prompt: Wer ist für die Entscheidung zuständig?
    erwartung: >-
      Das Bezirksamt als Behörde der Bezirksverwaltung; die Angelegenheit ist örtlich und weist keine
      gesamtstädtische Bedeutung auf, sodass die Hauptverwaltung nach dem LOG BE nicht zuständig ist.
  - prompt: Wen muss G verklagen?
    erwartung: >-
      Die Bezirke haben keine Rechtspersönlichkeit. Rechtsträger ist das Land Berlin; nach § 78 Abs. 1
      Nr. 1 VwGO ist die Klage gegen das Land Berlin zu richten, vertreten durch das Bezirksamt. Eine
      Klage gegen den Bezirk oder die Senatsverwaltung wäre falsch adressiert.
  - prompt: >-
      Kann der Bezirk eine Weisung des Senats gerichtlich angreifen?
    erwartung: >-
      Nein: Der Bezirk ist keine Gemeinde im Sinne des Art. 28 Abs. 2 GG und gehört derselben Rechtsperson
      wie die Hauptverwaltung an. Die Weisung ist Binnenrecht des Landes; ein Außenrechtsstreit zwischen
      Bezirk und Land scheidet aus.
  expectation:
    pruefpunkte:
    - id: p1
      label: >-
        Zuständigkeit des Bezirksamts mangels gesamtstädtischer Bedeutung (LOG BE) festgestellt
      weight: 1.5
      required: false
      keywords:
      - Bezirksamt
      - LOG BE
      - Landesorganisationsgesetz
      - AZG
      - gesamtstädtische Bedeutung
      - Bezirksverwaltung
      card_slugs:
      - be-kr-zustaendigkeit
    - id: p2
      label: >-
        Land Berlin als Beklagter nach dem Rechtsträgerprinzip (§ 78 Abs. 1 Nr. 1 VwGO)
      weight: 3.0
      required: true
      norms:
      - >-
        § 78 Abs. 1 Nr. 1 VwGO
      keywords:
      - Land Berlin
      - Rechtsträgerprinzip
      - >-
        § 78 Abs. 1 Nr. 1 VwGO
      - keine Rechtspersönlichkeit
      - vertreten durch das Bezirksamt
      card_slugs:
      - be-kr-beklagter
      - be-kr-bezirke
    - id: p3
      label: Bezirk ist keine Gemeinde im Sinne des Art. 28 Abs. 2 GG
      weight: 2.5
      required: true
      norms:
      - Art. 28 Abs. 2 GG
      keywords:
      - Art. 28 Abs. 2 GG
      - keine Gemeinde
      - unselbständige Verwaltungseinheit
      - Selbstverwaltungsgarantie
      - Einheitsgemeinde
      card_slugs:
      - be-kr-keine-gemeinde
      - be-kr-einheitsgemeinde
