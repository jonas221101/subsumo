cards:
- slug: sl-por-generalklausel
  type: norm
  front: Wo steht die polizeiliche Generalklausel in Saarland und was setzt sie voraus?
  back: 'Fundstelle: § 8 Abs. 1 SPolG. Die Generalklausel ermächtigt zu den notwendigen Maßnahmen, um
    eine im Einzelfall bestehende Gefahr für die öffentliche Sicherheit oder Ordnung abzuwehren. Sie ist
    subsidiär: Greift eine Standardmaßnahme oder ein Spezialgesetz, geht dieses vor. Auf der Rechtsfolgenseite
    besteht Ermessen, begrenzt durch den Grundsatz der Verhältnismäßigkeit. Zum Schutz privater Rechte
    wird die Gefahrenabwehr nur subsidiär tätig: Ein Einschreiten kommt nur in Betracht, wenn gerichtlicher
    Schutz nicht rechtzeitig zu erlangen ist und ohne die Maßnahme die Vereitelung oder wesentliche Erschwerung
    der Rechtsverwirklichung droht.'
  norms:
  - § 8 Abs. 1 SPolG
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sl-por-aufbau
  type: schema_step
  front: 'Aufbau: Rechtmäßigkeit einer Gefahrenabwehrmaßnahme nach dem Landesrecht von Saarland'
  back: 'I. Ermächtigungsgrundlage (Saarländisches Polizeigesetz (SPolG): Standardmaßnahme vor Generalklausel).
    II. Formelle Rechtmäßigkeit: 1. Zuständigkeit (sachlich: welche Behörde - Polizeiverwaltungsbehörden
    und Vollzugspolizei nach dem SPolG; örtlich; instanziell), 2. Verfahren (Anhörung nach § 28 SVwVfG),
    3. Form. III. Materielle Rechtmäßigkeit: 1. Tatbestand (Schutzgut, Gefahrbegriff, Gefahrenprognose
    ex ante), 2. richtiger Adressat (Störer: §§ 4, 5, 6 SPolG), 3. Rechtsfolge: Ermessen und Verhältnismäßigkeit
    (geeignet, erforderlich, angemessen).'
  norms:
  - § 8 Abs. 1 SPolG
  - §§ 4, 5, 6 SPolG
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sl-por-stoerer
  type: norm
  front: Wo sind Verhaltensstörer, Zustandsstörer und Nichtstörer in Saarland geregelt?
  back: '§§ 4, 5, 6 SPolG. Verhaltensstörer: wer die Gefahr durch sein Verhalten verursacht (Theorie der
    unmittelbaren Verursachung; Zweckveranlasser als Streitfrage). Zustandsstörer: Inhaber der tatsächlichen
    Gewalt bzw. Eigentümer einer gefährlichen Sache. Nichtstörer: Inanspruchnahme nur unter den engen
    Voraussetzungen des polizeilichen Notstands (gegenwärtige erhebliche Gefahr, Störer nicht greifbar,
    Behörde selbst nicht in der Lage), mit Anspruch auf angemessenen Schadensausgleich (§ 68 SPolG). Die Verantwortlichkeit knüpft an die objektive Zurechnung der Gefahr an, nicht an ein Verschulden. Bei mehreren Verantwortlichen trifft die Behörde die Auswahl nach pflichtgemäßem Ermessen (Störerauswahl).'
  norms:
  - §§ 4, 5, 6 SPolG
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sl-por-zustaendigkeit
  type: definition
  front: Wer ist in Saarland für die Gefahrenabwehr zuständig - Ordnungs-/Sicherheitsbehörde oder Polizei?
  back: 'Das SPolG unterscheidet zwischen den Polizeibehörden (Verwaltungsbehörden) und der Vollzugspolizei; welche Behörde sachlich und örtlich zuständig ist, ist dem SPolG zu entnehmen (Begriff der Polizei: § 1 Abs. 1 SPolG). Prüfungsrelevant ist die Abgrenzung: Die allgemeine Gefahrenabwehr liegt grundsätzlich bei den Verwaltungsbehörden; die Vollzugspolizei wird tätig, wenn die Abwehr keinen Aufschub duldet (Eilfall) oder eine besondere Zuweisung besteht.
    Ein Handeln der unzuständigen Behörde macht die Maßnahme formell rechtswidrig.'
  norms:
  - Saarländisches Polizeigesetz (SPolG)
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sl-por-vollstreckung
  type: norm
  front: Nach welchem Gesetz wird eine Gefahrenabwehrverfügung in Saarland vollstreckt?
  back: 'Für die Polizei regeln die §§ 44 bis 50 SPolG den Verwaltungszwang (Zwangsmittel: Ersatzvornahme, Zwangsgeld, unmittelbarer Zwang, § 45 SPolG); für andere Behörden gilt das Saarländische Verwaltungsvollstreckungsgesetz (SVwVG, Zwangsmittel §§ 13 ff.). Regelfall ist das gestreckte Verfahren:
    Grundverfügung - Androhung - Festsetzung - Anwendung des Zwangsmittels (Ersatzvornahme, Zwangsgeld,
    unmittelbarer Zwang). Bei Gefahr im Verzug sind Sofortvollzug bzw. unmittelbare Ausführung ohne vorausgehenden
    Verwaltungsakt möglich; die Kosten trägt der Pflichtige. Voraussetzungen des gestreckten Verfahrens sind ein wirksamer und vollstreckbarer Verwaltungsakt (unanfechtbar oder sofort vollziehbar), die Androhung mit angemessener Frist und die Festsetzung. Das Zwangsmittel muss verhältnismäßig sein, unmittelbarer Zwang ist nur letztes Mittel. Die Kosten werden dem Pflichtigen durch Kostenbescheid auferlegt.'
  norms:
  - §§ 44 bis 50 SPolG
  - Saarländisches Verwaltungsvollstreckungsgesetz (SVwVG)
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sl-por-gefahr
  type: definition
  front: >-
      Welche Gefahrbegriffe sind im Gefahrenabwehrrecht im Saarland zu unterscheiden?
  back: >-
      Gefahr ist eine Sachlage, die bei ungehindertem Geschehensablauf mit hinreichender
      Wahrscheinlichkeit in absehbarer Zeit zu einem Schaden für ein polizeiliches Schutzgut führt;
      maßgeblich ist die Prognose ex ante aus Sicht eines besonnenen Amtswalters. Konkrete Gefahr: im
      Einzelfall drohend, sie trägt Einzelmaßnahmen (Generalklausel, Standardmaßnahmen). Abstrakte
      Gefahr: nach allgemeiner Lebenserfahrung typischerweise drohend, sie trägt nur den Erlass einer
      Polizeiverordnung (SPolG). Qualifizierte Gefahren erhöhen die Anforderungen: erhebliche Gefahr
      (bedeutendes Rechtsgut), gegenwärtige Gefahr (Schadenseintritt hat begonnen oder steht
      unmittelbar bevor), Gefahr im Verzug (Abwarten würde den Erfolg der Maßnahme gefährden). Vom
      Gefahrenverdacht spricht man, wenn unklar ist, ob ein Schaden droht; hier kommt nur ein
      Gefahrerforschungseingriff in Betracht. Welche Qualifikation eine Standardmaßnahme verlangt,
      ergibt sich aus ihrem Tatbestand.
  norms:
  - "§ 8 Abs. 1 SPolG"
  quellen:
  - "Landesgesetze in der amtlichen Fassung (Landesrechtsportal)"
  - "Eigenformulierung Redaktion"
  stand: 2026-10
- slug: sl-por-anschein
  type: streitstand
  front: >-
      Anscheinsgefahr, Gefahrenverdacht und Putativgefahr: Wie sind sie abzugrenzen und welche
      Rechtsfolgen hat eine Fehlprognose?
  back: >-
      Anscheinsgefahr: Bei Erlass der Maßnahme sprach aus Sicht eines besonnenen Amtswalters ex ante
      alles für einen drohenden Schaden, tatsächlich bestand keine Gefahr. Nach h. M. liegt eine
      Gefahr im Rechtssinn vor, die Maßnahme ist rechtmäßig (Prognoseentscheidung). Gefahrenverdacht:
      Die Tatsachenlage ist unklar; zulässig ist grundsätzlich nur eine vorläufige, der Aufklärung
      dienende Maßnahme. Putativgefahr: Der Amtswalter nimmt ohne objektiv tragfähigen Anschein eine
      Gefahr an; die Maßnahme ist rechtswidrig. Streitig sind die Folgefragen beim Anscheinsstörer:
      Nach h. M. wird dem zu Unrecht Herangezogenen, der den Anschein nicht zurechenbar gesetzt hat,
      ein Ausgleich entsprechend dem Nichtstörer zugestanden und er wird nicht mit Kosten belastet;
      wer den Anschein zurechenbar veranlasst hat (etwa Fehlalarm durch Fahrlässigkeit), trägt die
      Kosten. Anderer Ansatz: Die Rechtmäßigkeit der Maßnahme schließe jeden Ausgleich aus.
  norms:
  - "§ 8 Abs. 1 SPolG"
  quellen:
  - "Landesgesetze in der amtlichen Fassung (Landesrechtsportal)"
  - "Eigenformulierung Redaktion"
  stand: 2026-10
- slug: sl-por-standard
  type: norm
  front: >-
      Welche Standardmaßnahmen kennt das Gefahrenabwehrrecht im Saarland und wie verhalten sie sich
      zur Generalklausel?
  back: >-
      Standardmaßnahmen sind typisierte Eingriffsbefugnisse mit eigenem Tatbestand: Befragung und
      Auskunftspflicht, Vorladung, Identitätsfeststellung, Platzverweisung und Aufenthaltsverbot,
      Gewahrsam, Durchsuchung von Personen und Sachen, Betreten und Durchsuchen von Wohnungen sowie
      Sicherstellung und Beschlagnahme. Sie sind im SPolG geregelt (Identitätsfeststellung § 9, Befragung/Vorladung § 11, Platzverweisung u. a. § 12, Gewahrsam § 13, Durchsuchung §§ 17, 18, Wohnungen §§ 19, 20, Sicherstellung § 21); ob und in welchem Umfang die Befugnisse auch den Ordnungs- bzw. Polizeibehörden zustehen, richtet sich nach dem jeweiligen Landesgesetz. Sie gehen
      der Generalklausel als speziellere Normen vor; ist ihr Tatbestand nicht erfüllt, darf nicht ohne
      Weiteres auf die Generalklausel ausgewichen werden, soweit die Standardmaßnahme die Materie
      abschließend regelt. Verfassungsrechtliche Vorgaben sind zu beachten: Gewahrsam verlangt eine
      richterliche Entscheidung (Art. 104 Abs. 2 GG), die Durchsuchung von Wohnungen grundsätzlich
      eine richterliche Anordnung (Art. 13 Abs. 2 GG), ihr Betreten zur Gefahrenabwehr ist an Art. 13
      Abs. 7 GG zu messen.
  norms:
  - "§§ 9 bis 25 SPolG"
  - "Art. 104 Abs. 2 GG"
  - "Art. 13 Abs. 2 GG"
  - "Art. 13 Abs. 7 GG"
  - "§ 8 Abs. 1 SPolG"
  quellen:
  - "Landesgesetze in der amtlichen Fassung (Landesrechtsportal)"
  - "Eigenformulierung Redaktion"
  stand: 2026-10
- slug: sl-por-stoererauswahl
  type: streitstand
  front: >-
      Wie wählt die Behörde zwischen mehreren Verantwortlichen aus, und wie wird der Zweckveranlasser
      behandelt?
  back: >-
      Gibt es mehrere Störer, wählt die Behörde nach pflichtgemäßem Ermessen aus. Leitlinie ist die
      effektive, schnelle und sichere Gefahrenabwehr; eine feste Rangfolge zwischen Verhaltens- und
      Zustandsstörer besteht nicht. Zu berücksichtigen sind Nähe zur Gefahr, Leistungsfähigkeit,
      Verursachungsbeitrag und Gleichbehandlung. Nichtstörer dürfen dagegen nur im polizeilichen
      Notstand herangezogen werden. Streitig ist die Reichweite der Verhaltensverantwortlichkeit: Nach
      der Theorie der unmittelbaren Verursachung ist nur verantwortlich, wer selbst die Gefahrengrenze
      überschreitet. Die Rechtsprechung und Teile des Schrifttums erweitern dies auf den
      Zweckveranlasser, der die unmittelbare Verursachung durch einen Dritten bezweckt oder sie als
      zwangsläufige Folge seines Tuns herbeiführt. Die Gegenansicht lehnt die Figur ab, weil sie die
      Unmittelbarkeit auflöse und die Verantwortlichkeit nicht gesetzlich gedeckt sei.
  norms:
  - "§ 4 SPolG"
  - "§ 5 SPolG"
  - "§ 6 SPolG"
  quellen:
  - "Landesgesetze in der amtlichen Fassung (Landesrechtsportal)"
  - "Eigenformulierung Redaktion"
  stand: 2026-10
- slug: sl-por-zwang
  type: definition
  front: >-
      Wie läuft die Vollstreckung einer Gefahrenabwehrverfügung im Saarland ab, und was gilt beim
      Sofortvollzug?
  back: >-
      Regelfall ist das gestreckte Verfahren: wirksame und vollstreckbare Grundverfügung (unanfechtbar
      oder sofort vollziehbar, § 80 Abs. 2 VwGO), Androhung des Zwangsmittels mit angemessener Frist,
      Festsetzung, Anwendung. Zwangsmittel sind Ersatzvornahme, Zwangsgeld und als letztes Mittel
      unmittelbarer Zwang; sie müssen verhältnismäßig sein. Für die Polizei
      regeln die §§ 44 bis 50 SPolG den Verwaltungszwang (Sofortvollzug ohne vorausgehenden Verwaltungsakt:
      § 44 Abs. 2 SPolG; Androhung: § 50 SPolG), für andere Behörden das Saarländische
      Verwaltungsvollstreckungsgesetz (SVwVG, dort § 18). Bei gegenwärtiger Gefahr kann
      die Behörde im Sofortvollzug ohne vorausgehenden Verwaltungsakt
      handeln, wenn die Maßnahme zur Abwehr der Gefahr notwendig ist und die Verantwortlichen nicht
      rechtzeitig herangezogen werden können. Typische Klausurkonstellation ist das Abschleppen eines
      Fahrzeugs; geprüft wird dann, ob die Grundverfügung, etwa ein Verkehrszeichen, wirksam war, ob
      Androhung und Festsetzung entbehrlich waren und ob das Zwangsmittel verhältnismäßig war.
  norms:
  - "§§ 44 bis 50 SPolG"
  - "Saarländisches Verwaltungsvollstreckungsgesetz (SVwVG)"
  - "§ 80 Abs. 2 S. 1 Nr. 2 VwGO"
  quellen:
  - "Landesgesetze in der amtlichen Fassung (Landesrechtsportal)"
  - "Eigenformulierung Redaktion"
  stand: 2026-10
- slug: sl-por-kosten
  type: norm
  front: >-
      Wer trägt die Kosten von Ersatzvornahme, unmittelbarer Ausführung und Zwang, und wo liegen die
      Grenzen der Kostenhaftung?
  back: >-
      Die Kosten einer Ersatzvornahme, des unmittelbaren Zwangs oder einer unmittelbaren Ausführung
      trägt grundsätzlich der Pflichtige bzw. der für die Gefahr Verantwortliche; sie werden durch
      Kostenbescheid (Leistungsbescheid) geltend gemacht und nach den Vorschriften der
      Verwaltungsvollstreckung beigetrieben (für die Ersatzvornahme der Polizei: § 46 Abs. 1 S. 2 SPolG). Bei Sofortvollzug ohne Grundverfügung prüft die
      Kostenentscheidung inzident, ob die Maßnahme rechtmäßig gewesen wäre, insbesondere ob eine
      Gefahr vorlag, der Kostenschuldner Störer war und die Maßnahme verhältnismäßig war. Für den
      Zustandsstörer ist die Kostenhaftung nach der Rechtsprechung des Bundesverfassungsgerichts aus
      Art. 14 GG begrenzt; sie darf nach Zumutbarkeit insbesondere den Wert des Grundstücks nach
      Sanierung nicht übersteigen, wenn die Gefahr nicht dem Risikobereich des Eigentümers zuzurechnen
      ist. Der Nichtstörer wird nicht mit Kosten belastet; ihm steht bei rechtmäßiger Inanspruchnahme nach
      § 6 SPolG ein angemessener Schadensausgleich zu (§ 68 Abs. 1 S. 1 SPolG).
  norms:
  - "Art. 14 Abs. 1 GG"
  - "Art. 14 Abs. 2 GG"
  - "§ 46 SPolG"
  - "§ 68 SPolG"
  - "Saarländisches Verwaltungsvollstreckungsgesetz (SVwVG)"
  quellen:
  - "Landesgesetze in der amtlichen Fassung (Landesrechtsportal)"
  - "Eigenformulierung Redaktion"
  - "BVerfGE 102, 1 (Altlasten, Zustandsverantwortlichkeit)"
  stand: 2026-10
- slug: sl-por-doppel
  type: streitstand
  front: >-
      Was gilt bei doppelfunktionalen Maßnahmen der Polizei (Gefahrenabwehr und Strafverfolgung)?
  back: >-
      Verfolgt eine polizeiliche Maßnahme zugleich präventive und repressive Zwecke, sind
      Rechtsgrundlage und Rechtsweg abhängig von ihrem Schwerpunkt. Nach h. M. und der Rechtsprechung
      entscheidet der erkennbare Schwerpunkt, der sich aus dem Anlass, dem Zweck und dem
      Gesamteindruck der Maßnahme ergibt. Überwiegt die Gefahrenabwehr, ist die Befugnis im SPolG bzw.
      im Ordnungsrecht zu suchen und der Verwaltungsrechtsweg eröffnet (§ 40 Abs. 1 VwGO). Überwiegt
      die Strafverfolgung, gilt die StPO; der Rechtsschutz richtet sich dann nach § 98 Abs. 2 S. 2
      StPO analog bzw. nach den §§ 23 ff. EGGVG. Lassen sich die Zwecke nicht gewichten, werden
      teilweise beide Regelungskomplexe nebeneinander angewendet oder dem Betroffenen ein Wahlrecht
      zugestanden. Die Klausur verlangt deshalb stets eine ausdrückliche Zuordnung des Handelns, bevor
      die Ermächtigungsgrundlage geprüft wird.
  norms:
  - "§ 40 Abs. 1 VwGO"
  - "§ 98 Abs. 2 StPO"
  - "§ 23 EGGVG"
  quellen:
  - "Landesgesetze in der amtlichen Fassung (Landesrechtsportal)"
  - "Eigenformulierung Redaktion"
  stand: 2026-10
schemata:
- slug: sl-schema-por-gewahrsam
  title: "Rechtmäßigkeit eines Schutzgewahrsams nach dem SPolG"
  norms:
  - "§ 8 Abs. 1 SPolG"
  - "§ 13 SPolG"
  - "§ 14 SPolG"
  - "Art. 104 Abs. 2 GG"
  quellen:
  - "Landesgesetze in der amtlichen Fassung (Landesrechtsportal)"
  - "Eigenformulierung Redaktion"
  steps:
  - label: >-
      I. Ermächtigungsgrundlage: Gewahrsam als Standardmaßnahme
    hinweis: >-
        Vorrang vor der Generalklausel (§ 8 Abs. 1 SPolG); Gewahrsamsgründe: § 13 SPolG.
  - label: "II. Formelle Rechtmäßigkeit"
    children:
    - label: >-
        1. Zuständigkeit: Vollzugspolizei
    - label: >-
        2. Verfahren: Bekanntgabe von Grund und Rechtsfolgen, Benachrichtigung von Angehörigen
      hinweis: "Verfahrensvorgaben der §§ 14 bis 16 SPolG zum Gewahrsam beachten."
  - label: "III. Materielle Rechtmäßigkeit"
    children:
    - label: >-
        1. Gewahrsamsgrund, z. B. Schutz vor Gefahr für Leib oder Leben bei hilfloser Lage
    - label: "2. Konkrete Gefahr, Prognose ex ante"
    - label: >-
        3. Verhältnismäßigkeit: mildere Mittel wie Verbringen zu Angehörigen oder in ein Krankenhaus
  - label: "IV. Richterliche Entscheidung nach Art. 104 Abs. 2 GG"
    hinweis: >-
        Unverzüglich herbeiführen (§ 14 Abs. 1 S. 1 SPolG), entbehrlich nur, wenn anzunehmen ist, dass die
        Entscheidung erst nach Wegfall des Grundes der Maßnahme ergehen würde (§ 14 Abs. 1 S. 2 SPolG).
faelle:
- slug: sl-fall-por-schutzgewahrsam
  title: "Die Nacht auf der Parkbank"
  difficulty: 3
  minutes: 45
  quellen:
  - "Landesgesetze in der amtlichen Fassung (Landesrechtsportal)"
  - "Eigenformulierung Redaktion"
  - "Art. 104 Abs. 2 GG"
  facts: >-
      Im Januar gegen 1 Uhr nachts, bei minus fünf Grad, finden Polizeibeamte in Saarbrücken den P
      stark alkoholisiert auf einer Parkbank liegend. P ist kaum ansprechbar, hat keine Jacke und kann
      nicht angeben, wo er wohnt; ein Alkoholtest ergibt 2,8 Promille. Er lehnt jede Hilfe ab und
      äußert nur, er wolle hier schlafen. Die Beamten bringen P in eine Zelle des Polizeireviers und
      nehmen ihn in Gewahrsam; eine richterliche Entscheidung holen sie nicht ein. Um 8 Uhr morgens,
      nüchtern geworden, wird P entlassen.
  question: >-
      War der Gewahrsam rechtmäßig, und musste eine richterliche Entscheidung herbeigeführt werden?
  steps:
  - prompt: >-
        Auf welcher Rechtsgrundlage und mit welchem Vorrang ist die Maßnahme zu prüfen?
    erwartung: >-
        Der Gewahrsam ist eine Standardmaßnahme (§ 13 SPolG) und geht der Generalklausel (§ 8 Abs. 1 SPolG)
        als speziellere Norm vor. Gewahrsamsgrund ist hier der Schutz des P vor Gefahr für Leib oder
        Leben in hilfloser Lage.
  - prompt: "Liegt eine Gefahr vor?"
    erwartung: >-
        Ja. Eine konkrete, gegenwärtige Gefahr für Leib und Leben des P besteht wegen Unterkühlung bei
        minus fünf Grad, Alkoholisierung und Hilflosigkeit. Die Prognose ex ante rechtfertigt den
        Eingriff.
  - prompt: "Ist der Gewahrsam verhältnismäßig?"
    erwartung: >-
        Ja. Mildere Mittel (Verbringen zu Angehörigen oder in eine Unterkunft) scheiden aus, weil P
        keine Angaben macht, jede Hilfe ablehnt und nicht ansprechbar ist. Die Freiheitsentziehung ist
        auf die Zeit der Gefahr beschränkt, die Entlassung erfolgte nach Nüchternwerden.
  - prompt: "Musste eine richterliche Entscheidung eingeholt werden?"
    erwartung: >-
        Art. 104 Abs. 2 GG verlangt für eine Freiheitsentziehung grundsätzlich unverzüglich eine
        richterliche Entscheidung. Sie ist aber entbehrlich, wenn feststeht, dass die Entlassung vor dem
        Ergehen der Entscheidung erfolgt. Das ist hier der Fall, weil P am Morgen nüchtern entlassen
        wurde und die Maßnahme nur wenige Stunden dauerte.
  expectation:
    pruefpunkte:
    - id: p1
      label: >-
          Gewahrsam als Standardmaßnahme mit Vorrang vor der Generalklausel erkannt
      weight: 2.0
      required: true
      norms:
      - "§ 8 Abs. 1 SPolG"
      keywords:
      - "Gewahrsam"
      - "Schutzgewahrsam"
      - "Standardmaßnahme"
