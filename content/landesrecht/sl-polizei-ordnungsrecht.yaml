cards:
- slug: sl-por-generalklausel
  type: norm
  front: Wo steht die polizeiliche Generalklausel in Saarland und was setzt sie voraus?
  back: 'Fundstelle: § 8 Abs. 1 SPolG. Die Generalklausel ermaechtigt zu den notwendigen Massnahmen, um
    eine im Einzelfall bestehende Gefahr fuer die oeffentliche Sicherheit oder Ordnung abzuwehren. Sie
    ist subsidiaer: Greift eine Standardmassnahme oder ein Spezialgesetz, geht dieses vor. Auf der Rechtsfolgenseite
    besteht Ermessen, begrenzt durch den Grundsatz der Verhaeltnismaessigkeit.'
  norms:
  - § 8 Abs. 1 SPolG
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sl-por-aufbau
  type: schema_step
  front: 'Aufbau: Rechtmaessigkeit einer Gefahrenabwehrmassnahme nach dem Landesrecht von Saarland'
  back: 'I. Ermaechtigungsgrundlage (Saarlaendisches Polizeigesetz (SPolG): Standardmassnahme vor Generalklausel).
    II. Formelle Rechtmaessigkeit: 1. Zustaendigkeit (sachlich: welche Behoerde - Polizeiverwaltungsbehoerden
    und Vollzugspolizei nach dem SPolG; oertlich; instanziell), 2. Verfahren (Anhoerung, § 28 VwVfG bzw.
    Landesrecht), 3. Form. III. Materielle Rechtmaessigkeit: 1. Tatbestand (Schutzgut, Gefahrbegriff,
    Gefahrenprognose ex ante), 2. richtiger Adressat (Stoerer: §§ 4, 5, 6 SPolG), 3. Rechtsfolge: Ermessen
    und Verhaeltnismaessigkeit (geeignet, erforderlich, angemessen).'
  norms:
  - § 8 Abs. 1 SPolG
  - §§ 4, 5, 6 SPolG
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sl-por-stoerer
  type: norm
  front: Wo sind Verhaltensstoerer, Zustandsstoerer und Nichtstoerer in Saarland geregelt?
  back: '§§ 4, 5, 6 SPolG. Verhaltensstoerer: wer die Gefahr durch sein Verhalten verursacht (Theorie
    der unmittelbaren Verursachung; Zweckveranlasser als Streitfrage). Zustandsstoerer: Inhaber der tatsaechlichen
    Gewalt bzw. Eigentuemer einer gefaehrlichen Sache. Nichtstoerer: Inanspruchnahme nur unter den engen
    Voraussetzungen des polizeilichen Notstands (gegenwaertige erhebliche Gefahr, Stoerer nicht greifbar,
    Behoerde selbst nicht in der Lage), mit Entschaedigungsanspruch.'
  norms:
  - §§ 4, 5, 6 SPolG
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sl-por-zustaendigkeit
  type: definition
  front: Wer ist in Saarland fuer die Gefahrenabwehr zustaendig - Ordnungs-/Sicherheitsbehoerde oder Polizei?
  back: 'Polizeiverwaltungsbehoerden und Vollzugspolizei nach dem SPolG. Pruefungsrelevant ist die Abgrenzung:
    Die allgemeine Gefahrenabwehr liegt grundsaetzlich bei den Verwaltungs-/Ordnungsbehoerden; der Polizeivollzugsdienst
    wird taetig, wenn die Abwehr keinen Aufschub duldet (Eilfall) oder eine besondere Zuweisung besteht.
    Ein Handeln der unzustaendigen Behoerde macht die Massnahme formell rechtswidrig.'
  norms:
  - Saarlaendisches Polizeigesetz (SPolG)
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sl-por-vollstreckung
  type: norm
  front: Nach welchem Gesetz wird eine Gefahrenabwehrverfuegung in Saarland vollstreckt?
  back: 'Saarlaendisches Verwaltungsvollstreckungsgesetz (SVwVG). Regelfall ist das gestreckte Verfahren:
    Grundverfuegung - Androhung - Festsetzung - Anwendung des Zwangsmittels (Ersatzvornahme, Zwangsgeld,
    unmittelbarer Zwang). Bei Gefahr im Verzug sind Sofortvollzug bzw. unmittelbare Ausfuehrung ohne vorausgehenden
    Verwaltungsakt moeglich; die Kosten traegt der Pflichtige.'
  norms:
  - Saarlaendisches Verwaltungsvollstreckungsgesetz (SVwVG)
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
