cards:
- slug: bw-por-generalklausel
  type: norm
  front: Wo steht die polizeiliche Generalklausel in Baden-Wuerttemberg und was setzt sie voraus?
  back: 'Fundstelle: §§ 1, 3 PolG BW. Die Generalklausel ermaechtigt zu den notwendigen Massnahmen, um
    eine im Einzelfall bestehende Gefahr fuer die oeffentliche Sicherheit oder Ordnung abzuwehren. Sie
    ist subsidiaer: Greift eine Standardmassnahme oder ein Spezialgesetz, geht dieses vor. Auf der Rechtsfolgenseite
    besteht Ermessen, begrenzt durch den Grundsatz der Verhaeltnismaessigkeit.'
  norms:
  - §§ 1, 3 PolG BW
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: bw-por-aufbau
  type: schema_step
  front: 'Aufbau: Rechtmaessigkeit einer Gefahrenabwehrmassnahme nach dem Landesrecht von Baden-Wuerttemberg'
  back: 'I. Ermaechtigungsgrundlage (Polizeigesetz Baden-Wuerttemberg (PolG BW): Standardmassnahme vor
    Generalklausel). II. Formelle Rechtmaessigkeit: 1. Zustaendigkeit (sachlich: welche Behoerde - Polizeibehoerden
    und Polizeivollzugsdienst im PolG BW (§§ 105 ff. PolG BW a. F., Zustaendigkeit pruefen); oertlich;
    instanziell), 2. Verfahren (Anhoerung, § 28 VwVfG bzw. Landesrecht), 3. Form. III. Materielle Rechtmaessigkeit:
    1. Tatbestand (Schutzgut, Gefahrbegriff, Gefahrenprognose ex ante), 2. richtiger Adressat (Stoerer:
    §§ 6, 7, 9 PolG BW), 3. Rechtsfolge: Ermessen und Verhaeltnismaessigkeit (geeignet, erforderlich,
    angemessen).'
  norms:
  - §§ 1, 3 PolG BW
  - §§ 6, 7, 9 PolG BW
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: bw-por-stoerer
  type: norm
  front: Wo sind Verhaltensstoerer, Zustandsstoerer und Nichtstoerer in Baden-Wuerttemberg geregelt?
  back: '§§ 6, 7, 9 PolG BW. Verhaltensstoerer: wer die Gefahr durch sein Verhalten verursacht (Theorie
    der unmittelbaren Verursachung; Zweckveranlasser als Streitfrage). Zustandsstoerer: Inhaber der tatsaechlichen
    Gewalt bzw. Eigentuemer einer gefaehrlichen Sache. Nichtstoerer: Inanspruchnahme nur unter den engen
    Voraussetzungen des polizeilichen Notstands (gegenwaertige erhebliche Gefahr, Stoerer nicht greifbar,
    Behoerde selbst nicht in der Lage), mit Entschaedigungsanspruch.'
  norms:
  - §§ 6, 7, 9 PolG BW
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: bw-por-zustaendigkeit
  type: definition
  front: Wer ist in Baden-Wuerttemberg fuer die Gefahrenabwehr zustaendig - Ordnungs-/Sicherheitsbehoerde
    oder Polizei?
  back: 'Polizeibehoerden und Polizeivollzugsdienst im PolG BW (§§ 105 ff. PolG BW a. F., Zustaendigkeit
    pruefen). Pruefungsrelevant ist die Abgrenzung: Die allgemeine Gefahrenabwehr liegt grundsaetzlich
    bei den Verwaltungs-/Ordnungsbehoerden; der Polizeivollzugsdienst wird taetig, wenn die Abwehr keinen
    Aufschub duldet (Eilfall) oder eine besondere Zuweisung besteht. Ein Handeln der unzustaendigen Behoerde
    macht die Massnahme formell rechtswidrig.'
  norms:
  - Polizeigesetz Baden-Wuerttemberg (PolG BW)
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: bw-por-vollstreckung
  type: norm
  front: Nach welchem Gesetz wird eine Gefahrenabwehrverfuegung in Baden-Wuerttemberg vollstreckt?
  back: 'Landesverwaltungsvollstreckungsgesetz (LVwVG). Regelfall ist das gestreckte Verfahren: Grundverfuegung
    - Androhung - Festsetzung - Anwendung des Zwangsmittels (Ersatzvornahme, Zwangsgeld, unmittelbarer
    Zwang). Bei Gefahr im Verzug sind Sofortvollzug bzw. unmittelbare Ausfuehrung ohne vorausgehenden
    Verwaltungsakt moeglich; die Kosten traegt der Pflichtige.'
  norms:
  - Landesverwaltungsvollstreckungsgesetz (LVwVG)
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
