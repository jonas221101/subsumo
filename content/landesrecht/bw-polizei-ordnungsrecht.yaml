cards:
- slug: bw-por-generalklausel
  type: norm
  front: Wo steht die polizeiliche Generalklausel in Baden-Württemberg und was setzt sie voraus?
  back: 'Fundstelle: § 3 PolG BW (Generalklausel); die Aufgabe der Gefahrenabwehr folgt aus § 1 PolG BW.
    Die Generalklausel ermächtigt zu den notwendigen Maßnahmen, um eine im Einzelfall bestehende Gefahr
    für die öffentliche Sicherheit oder Ordnung abzuwehren. Sie ist subsidiär: Greift eine Standardmaßnahme
    oder ein Spezialgesetz, geht dieses vor. Auf der Rechtsfolgenseite besteht Ermessen, begrenzt durch
    den Grundsatz der Verhältnismäßigkeit. Zum Schutz privater Rechte wird die Gefahrenabwehr nur subsidiär
    tätig: Ein Einschreiten kommt nur in Betracht, wenn gerichtlicher Schutz nicht rechtzeitig zu erlangen
    ist und ohne die Maßnahme die Vereitelung oder wesentliche Erschwerung der Rechtsverwirklichung droht.'
  norms:
  - §§ 1, 3 PolG BW
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: bw-por-standardmassnahmen
  type: norm
  front: Wo stehen die polizeilichen Standardmaßnahmen in Baden-Württemberg?
  back: 'Im PolG BW im Abschnitt über die polizeilichen Befugnisse - unter anderem Identitätsfeststellung,
    Platzverweis, Gewahrsam, Durchsuchung von Personen und Sachen, Sicherstellung. Standardmaßnahmen sind
    abschließende Spezialregelungen: Liegen ihre Voraussetzungen nicht vor, darf nicht auf die Generalklausel
    (§ 3 PolG BW) ausgewichen werden (Sperrwirkung).'
  norms:
  - Polizeigesetz Baden-Württemberg (PolG BW), Standardmaßnahmen
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: bw-por-aufbau
  type: schema_step
  front: 'Aufbau: Rechtmäßigkeit einer Gefahrenabwehrmaßnahme nach dem Landesrecht von Baden-Württemberg'
  back: 'I. Ermächtigungsgrundlage (Polizeigesetz Baden-Württemberg (PolG BW): Standardmaßnahme vor Generalklausel).
    II. Formelle Rechtmäßigkeit: 1. Zuständigkeit (sachlich: welche Behörde - allgemeine Polizeibehörden
    (insbesondere die Ortspolizeibehörden, also die Gemeinden) oder Polizeivollzugsdienst, jeweils nach
    dem PolG BW; örtlich; instanziell), 2. Verfahren (Anhörung nach § 28 LVwVfG BW), 3. Form. III. Materielle
    Rechtmäßigkeit: 1. Tatbestand (Schutzgut, Gefahrbegriff, Gefahrenprognose ex ante), 2. richtiger Adressat
    (Störer: §§ 6, 7, 9 PolG BW), 3. Rechtsfolge: Ermessen und Verhältnismäßigkeit (geeignet, erforderlich,
    angemessen).'
  norms:
  - §§ 1, 3 PolG BW
  - §§ 6, 7, 9 PolG BW
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: bw-por-stoerer
  type: norm
  front: Wo sind Verhaltensstörer, Zustandsstörer und Nichtstörer in Baden-Württemberg geregelt?
  back: '§§ 6, 7, 9 PolG BW. Verhaltensstörer: wer die Gefahr durch sein Verhalten verursacht (Theorie
    der unmittelbaren Verursachung; Zweckveranlasser als Streitfrage). Zustandsstörer: Inhaber der tatsächlichen
    Gewalt bzw. Eigentümer einer gefährlichen Sache. Nichtstörer: Inanspruchnahme nur unter den engen
    Voraussetzungen des polizeilichen Notstands (gegenwärtige erhebliche Gefahr, Störer nicht greifbar,
    Behörde selbst nicht in der Lage), mit Entschädigungsanspruch.'
  norms:
  - §§ 6, 7, 9 PolG BW
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: bw-por-zustaendigkeit
  type: definition
  front: Wer ist in Baden-Württemberg für die Gefahrenabwehr zuständig - Ordnungs-/Sicherheitsbehörde
    oder Polizei?
  back: Das PolG BW unterscheidet die allgemeinen Polizeibehörden (Ortspolizeibehörden sind die Gemeinden;
    daneben höhere und obere Behörden der Landesverwaltung) und den Polizeivollzugsdienst als eigene Organisation.
    Die Gefahrenabwehr obliegt grundsätzlich den Polizeibehörden; der Polizeivollzugsdienst handelt, wenn
    ein sofortiges Tätigwerden erforderlich ist (Eilfall), und in den ihm besonders zugewiesenen Aufgaben.
    Prüfungsrelevant ist die Abgrenzung. Ein Handeln der unzuständigen Behörde macht die Maßnahme formell
    rechtswidrig.
  norms:
  - Polizeigesetz Baden-Württemberg (PolG BW), Abschnitte zu Polizeibehörden und Polizeivollzugsdienst
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: bw-por-vollstreckung
  type: norm
  front: Nach welchem Gesetz wird eine Gefahrenabwehrverfügung in Baden-Württemberg vollstreckt?
  back: 'Landesverwaltungsvollstreckungsgesetz (LVwVG). Regelfall ist das gestreckte Verfahren: Grundverfügung
    - Androhung - Festsetzung - Anwendung des Zwangsmittels (Ersatzvornahme, Zwangsgeld, unmittelbarer
    Zwang). Bei Gefahr im Verzug sind Sofortvollzug bzw. unmittelbare Ausführung ohne vorausgehenden Verwaltungsakt
    möglich; die Kosten trägt der Pflichtige.'
  norms:
  - Landesverwaltungsvollstreckungsgesetz (LVwVG)
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
