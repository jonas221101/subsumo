cards:
- slug: ni-por-generalklausel
  type: norm
  front: Wo steht die polizeiliche Generalklausel in Niedersachsen und was setzt sie voraus?
  back: 'Fundstelle: § 11 NPOG. Die Generalklausel ermächtigt zu den notwendigen Maßnahmen, um eine im
    Einzelfall bestehende Gefahr für die öffentliche Sicherheit oder Ordnung abzuwehren. Sie ist subsidiär:
    Greift eine Standardmaßnahme oder ein Spezialgesetz, geht dieses vor. Auf der Rechtsfolgenseite besteht
    Ermessen, begrenzt durch den Grundsatz der Verhältnismäßigkeit. Zum Schutz privater Rechte wird die
    Gefahrenabwehr nur subsidiär tätig: Ein Einschreiten kommt nur in Betracht, wenn gerichtlicher Schutz
    nicht rechtzeitig zu erlangen ist und ohne die Maßnahme die Vereitelung oder wesentliche Erschwerung
    der Rechtsverwirklichung droht.'
  norms:
  - § 11 NPOG
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: ni-por-standardmassnahmen
  type: norm
  front: Wo stehen die polizeilichen Standardmaßnahmen in Niedersachsen?
  back: '§§ 12 ff. NPOG - unter anderem Identitätsfeststellung, Platzverweis, Gewahrsam, Durchsuchung
    von Personen und Sachen, Sicherstellung. Standardmaßnahmen sind abschließende Spezialregelungen: Liegen
    ihre Voraussetzungen nicht vor, darf nicht auf die Generalklausel ausgewichen werden (Sperrwirkung).'
  norms:
  - §§ 12 ff. NPOG
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: ni-por-aufbau
  type: schema_step
  front: 'Aufbau: Rechtmäßigkeit einer Gefahrenabwehrmaßnahme nach dem Landesrecht von Niedersachsen'
  back: 'I. Ermächtigungsgrundlage (Niedersächsisches Polizei- und Ordnungsbehördengesetz (NPOG): Standardmaßnahme
    vor Generalklausel). II. Formelle Rechtmäßigkeit: 1. Zuständigkeit (sachlich: welche Behörde - Verwaltungsbehörden
    (Gemeinden, Landkreise) und Polizei nach § 1 NPOG; Polizei bei Eilbedürftigkeit (§ 1 Abs. 2 NPOG);
    örtlich; instanziell), 2. Verfahren (Anhörung nach dem jeweiligen Landesverwaltungsverfahrensgesetz),
    3. Form. III. Materielle Rechtmäßigkeit: 1. Tatbestand (Schutzgut, Gefahrbegriff, Gefahrenprognose
    ex ante), 2. richtiger Adressat (Störer: §§ 6, 7, 8 NPOG), 3. Rechtsfolge: Ermessen und Verhältnismäßigkeit
    (geeignet, erforderlich, angemessen).'
  norms:
  - § 11 NPOG
  - §§ 6, 7, 8 NPOG
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: ni-por-stoerer
  type: norm
  front: Wo sind Verhaltensstörer, Zustandsstörer und Nichtstörer in Niedersachsen geregelt?
  back: '§§ 6, 7, 8 NPOG. Verhaltensstörer: wer die Gefahr durch sein Verhalten verursacht (Theorie der
    unmittelbaren Verursachung; Zweckveranlasser als Streitfrage). Zustandsstörer: Inhaber der tatsächlichen
    Gewalt bzw. Eigentümer einer gefährlichen Sache. Nichtstörer: Inanspruchnahme nur unter den engen
    Voraussetzungen des polizeilichen Notstands (gegenwärtige erhebliche Gefahr, Störer nicht greifbar,
    Behörde selbst nicht in der Lage), mit Entschädigungsanspruch.'
  norms:
  - §§ 6, 7, 8 NPOG
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: ni-por-zustaendigkeit
  type: definition
  front: Wer ist in Niedersachsen für die Gefahrenabwehr zuständig - Ordnungs-/Sicherheitsbehörde oder
    Polizei?
  back: 'Verwaltungsbehörden (Gemeinden, Landkreise) und Polizei nach § 1 NPOG; Polizei bei Eilbedürftigkeit
    (§ 1 Abs. 2 NPOG). Prüfungsrelevant ist die Abgrenzung: Die allgemeine Gefahrenabwehr liegt grundsätzlich
    bei den Verwaltungs-/Ordnungsbehörden; der Polizeivollzugsdienst wird tätig, wenn die Abwehr keinen
    Aufschub duldet (Eilfall) oder eine besondere Zuweisung besteht. Ein Handeln der unzuständigen Behörde
    macht die Maßnahme formell rechtswidrig.'
  norms:
  - Niedersächsisches Polizei- und Ordnungsbehördengesetz (NPOG)
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: ni-por-vollstreckung
  type: norm
  front: Nach welchem Gesetz wird eine Gefahrenabwehrverfügung in Niedersachsen vollstreckt?
  back: 'Niedersächsisches Verwaltungsvollstreckungsgesetz (NVwVG); Zwang nach §§ 64 ff. NPOG. Regelfall
    ist das gestreckte Verfahren: Grundverfügung - Androhung - Festsetzung - Anwendung des Zwangsmittels
    (Ersatzvornahme, Zwangsgeld, unmittelbarer Zwang). Bei Gefahr im Verzug sind Sofortvollzug bzw. unmittelbare
    Ausführung ohne vorausgehenden Verwaltungsakt möglich; die Kosten trägt der Pflichtige.'
  norms:
  - Niedersächsisches Verwaltungsvollstreckungsgesetz (NVwVG)
  - Zwang nach §§ 64 ff. NPOG
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
