cards:
- slug: bb-por-generalklausel
  type: norm
  front: Wo steht die polizeiliche Generalklausel in Brandenburg und was setzt sie voraus?
  back: 'Fundstelle: § 10 Abs. 1 BbgPolG; § 13 Abs. 1 BbgOBG. Die Generalklausel ermächtigt zu den notwendigen
    Maßnahmen, um eine im Einzelfall bestehende Gefahr für die öffentliche Sicherheit oder Ordnung abzuwehren.
    Sie ist subsidiär: Greift eine Standardmaßnahme oder ein Spezialgesetz, geht dieses vor. Auf der Rechtsfolgenseite
    besteht Ermessen, begrenzt durch den Grundsatz der Verhältnismäßigkeit. Zum Schutz privater Rechte
    wird die Gefahrenabwehr nur subsidiär tätig: Ein Einschreiten kommt nur in Betracht, wenn gerichtlicher
    Schutz nicht rechtzeitig zu erlangen ist und ohne die Maßnahme die Vereitelung oder wesentliche Erschwerung
    der Rechtsverwirklichung droht.'
  norms:
  - § 10 Abs. 1 BbgPolG
  - § 13 Abs. 1 BbgOBG
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: bb-por-aufbau
  type: schema_step
  front: 'Aufbau: Rechtmäßigkeit einer Gefahrenabwehrmaßnahme nach dem Landesrecht von Brandenburg'
  back: 'I. Ermächtigungsgrundlage (Brandenburgisches Polizeigesetz (BbgPolG) und Ordnungsbehördengesetz
    (BbgOBG): Standardmaßnahme vor Generalklausel). II. Formelle Rechtmäßigkeit: 1. Zuständigkeit (sachlich:
    welche Behörde - Ordnungsbehörden (BbgOBG) primär, Polizei (BbgPolG) bei Eilbedürftigkeit (§ 1 Abs.
    1 BbgPolG); örtlich; instanziell), 2. Verfahren (Anhörung nach dem jeweiligen Landesverwaltungsverfahrensgesetz),
    3. Form. III. Materielle Rechtmäßigkeit: 1. Tatbestand (Schutzgut, Gefahrbegriff, Gefahrenprognose
    ex ante), 2. richtiger Adressat (Störer: §§ 5, 6, 7 BbgPolG; §§ 16, 17, 18 BbgOBG), 3. Rechtsfolge:
    Ermessen und Verhältnismäßigkeit (geeignet, erforderlich, angemessen).'
  norms:
  - § 10 Abs. 1 BbgPolG
  - § 13 Abs. 1 BbgOBG
  - §§ 5, 6, 7 BbgPolG
  - §§ 16, 17, 18 BbgOBG
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: bb-por-stoerer
  type: norm
  front: Wo sind Verhaltensstörer, Zustandsstörer und Nichtstörer in Brandenburg geregelt?
  back: '§§ 5, 6, 7 BbgPolG; §§ 16, 17, 18 BbgOBG. Verhaltensstörer: wer die Gefahr durch sein Verhalten
    verursacht (Theorie der unmittelbaren Verursachung; Zweckveranlasser als Streitfrage). Zustandsstörer:
    Inhaber der tatsächlichen Gewalt bzw. Eigentümer einer gefährlichen Sache. Nichtstörer: Inanspruchnahme
    nur unter den engen Voraussetzungen des polizeilichen Notstands (gegenwärtige erhebliche Gefahr, Störer
    nicht greifbar, Behörde selbst nicht in der Lage), mit Entschädigungsanspruch.'
  norms:
  - §§ 5, 6, 7 BbgPolG
  - §§ 16, 17, 18 BbgOBG
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: bb-por-zustaendigkeit
  type: definition
  front: Wer ist in Brandenburg für die Gefahrenabwehr zuständig - Ordnungs-/Sicherheitsbehörde oder Polizei?
  back: 'Ordnungsbehörden (BbgOBG) primär, Polizei (BbgPolG) bei Eilbedürftigkeit (§ 1 Abs. 1 BbgPolG).
    Prüfungsrelevant ist die Abgrenzung: Die allgemeine Gefahrenabwehr liegt grundsätzlich bei den Verwaltungs-/Ordnungsbehörden;
    der Polizeivollzugsdienst wird tätig, wenn die Abwehr keinen Aufschub duldet (Eilfall) oder eine besondere
    Zuweisung besteht. Ein Handeln der unzuständigen Behörde macht die Maßnahme formell rechtswidrig.'
  norms:
  - Brandenburgisches Polizeigesetz (BbgPolG) und Ordnungsbehördengesetz (BbgOBG)
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: bb-por-vollstreckung
  type: norm
  front: Nach welchem Gesetz wird eine Gefahrenabwehrverfügung in Brandenburg vollstreckt?
  back: 'Verwaltungsvollstreckungsgesetz für das Land Brandenburg (VwVGBbg). Regelfall ist das gestreckte
    Verfahren: Grundverfügung - Androhung - Festsetzung - Anwendung des Zwangsmittels (Ersatzvornahme,
    Zwangsgeld, unmittelbarer Zwang). Bei Gefahr im Verzug sind Sofortvollzug bzw. unmittelbare Ausführung
    ohne vorausgehenden Verwaltungsakt möglich; die Kosten trägt der Pflichtige.'
  norms:
  - Verwaltungsvollstreckungsgesetz für das Land Brandenburg (VwVGBbg)
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
