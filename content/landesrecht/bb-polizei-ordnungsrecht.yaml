      - "Ordnungsbehörde nicht rechtzeitig"
      card_slugs:
      - "bb-por-zustaendigkeit"
    - id: p3
      label: "Konkrete gegenwärtige Gefahr für Leben und Gesundheit bejaht"
      weight: 2.0
