cards:
- slug: sh-lra-vwvfg
  type: norm
  front: Welches Verwaltungsverfahrensgesetz gilt für Landesbehörden in Schleswig-Holstein?
  back: Das Landesverwaltungsgesetz Schleswig-Holstein (LVwG SH) enthält eine eigenständige Vollregelung
    des Verwaltungsverfahrens und verweist nicht auf das VwVfG des Bundes. Das VwVfG des Bundes gilt nur
    für Bundesbehörden (§ 1 VwVfG); für Landes- und Kommunalbehörden ist das Landesgesetz maßgeblich.
    Bei Verweisungsgesetzen werden die Bundesnormen entsprechend angewendet und sind so zu zitieren (z.
    B. § 35 VwVfG i. V. m. dem Landesgesetz), bei Vollgesetzen wie dem LVwG SH ist die Landesnorm selbst
    zu zitieren. Inhaltlich entsprechen die Regelungen zum Verwaltungsakt weitgehend dem VwVfG.
  norms:
  - Landesverwaltungsgesetz Schleswig-Holstein (LVwG SH)
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sh-lra-verfassungsgericht
  type: norm
  front: Welche Verfahren stehen vor dem Schleswig-Holsteinischen Landesverfassungsgericht offen und wie
    verhält sich das zur Verfassungsbeschwerde zum BVerfG?
  back: 'Zuständig ist das Schleswig-Holsteinische Landesverfassungsgericht (Schleswig) auf Grundlage
    der Verfassung des Landes Schleswig-Holstein (LV SH) und des Landesverfassungsgerichtsgesetzes. Es
    entscheidet unter anderem in Organstreitigkeiten, in Normenkontrollverfahren, über kommunale Verfassungsbeschwerden
    und über Verfassungsbeschwerden: Eine Individualverfassungsbeschwerde ist in Schleswig-Holstein möglich,
    wenn der Beschwerdeführer geltend macht, durch die öffentliche Gewalt des Landes in einem in der Landesverfassung
    gewährleisteten Recht verletzt zu sein; sie setzt grundsätzlich die Erschöpfung des Rechtswegs voraus.
    Prüfungsmaßstab ist die Landesverfassung, Bundesrecht nur, soweit die Landesverfassung darauf verweist.
    Daneben steht immer die Verfassungsbeschwerde zum BVerfG (Art. 93 Abs. 1 Nr. 4a GG), die gegenüber
    dem Landesrechtsbehelf eigenständig ist.'
  norms:
  - Verfassung des Landes Schleswig-Holstein (LV SH)
  - Art. 93 Abs. 1 Nr. 4a GG
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-10
- slug: sh-lra-kommunalverfassung
  type: norm
  front: Welches Gesetz regelt die Kommunalverfassung in Schleswig-Holstein und welche Hauptorgane hat
    die Gemeinde?
  back: 'Die Gemeindeordnung für Schleswig-Holstein (GO SH) regelt die Kommunalverfassung. Hauptorgane
    der Gemeinde sind die Gemeindevertretung (in Städten die Stadtvertretung) und der Bürgermeister; viele
    Gemeinden gehören zudem einem Amt an. Grundlage ist die Selbstverwaltungsgarantie (Art. 28 Abs. 2
    GG und Landesverfassung): eigenverantwortliche Regelung aller Angelegenheiten der örtlichen Gemeinschaft.
    Klausurklassiker: Zuständigkeitsstreit zwischen Vertretung und Verwaltungsspitze, Kommunalverfassungsstreit,
    Rechtsaufsicht.'
  norms:
  - Gemeindeordnung für Schleswig-Holstein (GO SH)
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sh-lra-bauordnung
  type: norm
  front: Wie heißt die Bauordnung in Schleswig-Holstein und wie ist eine Baugenehmigung zu prüfen?
  back: Landesbauordnung für das Land Schleswig-Holstein (LBO SH). Ein Anspruch auf Baugenehmigung besteht,
    wenn dem Vorhaben keine öffentlich-rechtlichen Vorschriften entgegenstehen. Zu prüfen sind die Genehmigungsbedürftigkeit
    (Errichtung, Änderung, Nutzungsänderung; keine Verfahrensfreiheit), die bauplanungsrechtliche Zulässigkeit
    nach §§ 29 ff. BauGB (Bundesrecht) und die bauordnungsrechtliche Zulässigkeit nach der LBO SH (Abstandsflächen,
    Gestaltung, Stellplätze), soweit das jeweilige Verfahren sie zum Prüfprogramm macht. Die Baugenehmigung
    ergeht unbeschadet der Rechte Dritter; bei Ablehnung ist die Verpflichtungsklage statthaft.
  norms:
  - Landesbauordnung für das Land Schleswig-Holstein (LBO SH)
  - §§ 29 ff. BauGB
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sh-lra-pflichtstoff
  type: definition
  front: Welche Landesrechtsgebiete gehören in Schleswig-Holstein zum Pflichtstoff des Öffentlichen Rechts?
  back: Zum Pflichtstoff des Öffentlichen Rechts gehören in Schleswig-Holstein das Gefahrenabwehrrecht
    im Landesverwaltungsgesetz (LVwG SH), das Kommunalrecht (GO SH) und das Bauordnungsrecht (LBO SH).
    Landesrecht wird im Examen fast nie isoliert geprüft, sondern in eine verwaltungsprozessuale Einkleidung
    eingebettet (Anfechtungs- oder Verpflichtungsklage, vorläufiger Rechtsschutz). Die Landesnorm liefert
    dann die Ermächtigungsgrundlage oder den Zuständigkeits- und Verfahrensmaßstab, der Aufbau bleibt
    der allgemeine.
  norms: []
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
