cards:
- slug: sh-lra-vwvfg
  type: norm
  front: Welches Verwaltungsverfahrensgesetz gilt fuer Landesbehoerden in Schleswig-Holstein?
  back: Landesverwaltungsgesetz (LVwG SH) - eigenstaendige Vollregelung des Verwaltungsverfahrens (§§
    74 ff.), kein Verweis auf das VwVfG des Bundes. Das VwVfG des Bundes gilt nur fuer Bundesbehoerden
    (§ 1 VwVfG); fuer Landes- und Kommunalbehoerden ist das Landesgesetz massgeblich. Bei Verweisungsgesetzen
    werden die Bundesnormen 'entsprechend' angewendet und sind so zu zitieren (z. B. '§ 35 VwVfG i. V.
    m. § 1 des Landesgesetzes'), bei Vollgesetzen ist die Landesnorm selbst zu zitieren.
  norms:
  - Landesverwaltungsgesetz (LVwG SH) - eigenstaendige Vollregelung des Verwaltungsverfahrens (§§ 74 ff.),
    kein Verweis auf das VwVfG des Bundes
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sh-lra-verfassungsgericht
  type: norm
  front: Gibt es in Schleswig-Holstein eine Individualverfassungsbeschwerde zum Landesverfassungsgericht?
  back: 'Nein - keine Individualverfassungsbeschwerde zum Landesverfassungsgericht. Zustaendiges Gericht:
    Schleswig-Holsteinisches Landesverfassungsgericht auf Grundlage der Verfassung des Landes Schleswig-Holstein
    (LV SH). Verfahrensgegenstand ist nur die Verletzung von Landesgrundrechten durch Landesstaatsgewalt;
    Bundesrecht ist Pruefungsmassstab nur, soweit die Landesverfassung darauf verweist. Daneben steht
    immer die Verfassungsbeschwerde zum BVerfG (Art. 93 Abs. 1 Nr. 4a GG).'
  norms:
  - Verfassung des Landes Schleswig-Holstein (LV SH)
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sh-lra-kommunalverfassung
  type: norm
  front: Welches Gesetz regelt die Kommunalverfassung in Schleswig-Holstein und welche Hauptorgane hat
    die Gemeinde?
  back: 'Gemeindeordnung Schleswig-Holstein (GO SH): Gemeindevertretung und Buergermeister. Grundlage
    ist die Selbstverwaltungsgarantie (Art. 28 Abs. 2 GG und Landesverfassung): eigenverantwortliche Regelung
    aller Angelegenheiten der oertlichen Gemeinschaft. Klausurklassiker: Zustaendigkeitsstreit zwischen
    Vertretung und Verwaltungsspitze, Kommunalverfassungsstreit, Rechtsaufsicht.'
  norms:
  - 'Gemeindeordnung Schleswig-Holstein (GO SH): Gemeindevertretung und Buergermeister'
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sh-lra-bauordnung
  type: norm
  front: Wie heisst die Bauordnung in Schleswig-Holstein und wie ist eine Baugenehmigung zu pruefen?
  back: 'Landesbauordnung Schleswig-Holstein (LBO SH). Anspruch auf Baugenehmigung besteht, wenn dem Vorhaben
    keine oeffentlich-rechtlichen Vorschriften entgegenstehen: Genehmigungs-beduerftigkeit (Errichtung,
    Aenderung, Nutzungsaenderung), keine Genehmigungsfreiheit, bauplanungsrechtliche Zulaessigkeit nach
    §§ 29 ff. BauGB (Bundesrecht), bauordnungsrechtliche Zulaessigkeit nach der Landesbauordnung (Abstandsflaechen,
    Gestaltung, Stellplaetze).'
  norms:
  - Landesbauordnung Schleswig-Holstein (LBO SH)
  - §§ 29 ff. BauGB
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sh-lra-pflichtstoff
  type: definition
  front: Welche Landesrechtsgebiete gehoeren in Schleswig-Holstein zum Pflichtstoff des Oeffentlichen
    Rechts?
  back: Gefahrenabwehr- und Verwaltungsverfahrensrecht im LVwG; Kommunalrecht (GO SH); Bauordnungsrecht
    (LBO SH). Landesrecht wird im Examen fast nie isoliert, sondern eingebettet in eine verwaltungsprozessuale
    Einkleidung (Anfechtungs-/Verpflichtungsklage, vorlaeufiger Rechtsschutz) geprueft - die Landesnorm
    ist die Ermaechtigungsgrundlage, der Aufbau bleibt der allgemeine.
  norms: []
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
