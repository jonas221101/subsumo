cards:
- slug: sh-lra-vwvfg
  type: norm
  front: Welches Verwaltungsverfahrensgesetz gilt für Landesbehörden in Schleswig-Holstein?
  back: Landesverwaltungsgesetz (LVwG SH) - eigenständige Vollregelung des Verwaltungsverfahrens (§§ 74
    ff.), kein Verweis auf das VwVfG des Bundes. Das VwVfG des Bundes gilt nur für Bundesbehörden (§ 1
    VwVfG); für Landes- und Kommunalbehörden ist das Landesgesetz maßgeblich. Bei Verweisungsgesetzen
    werden die Bundesnormen 'entsprechend' angewendet und sind so zu zitieren (z. B. '§ 35 VwVfG i. V.
    m. § 1 des Landesgesetzes'), bei Vollgesetzen ist die Landesnorm selbst zu zitieren.
  norms:
  - Landesverwaltungsgesetz (LVwG SH) - eigenständige Vollregelung des Verwaltungsverfahrens (§§ 74 ff.),
    kein Verweis auf das VwVfG des Bundes
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sh-lra-verfassungsgericht
  type: norm
  front: Welche Verfahren stehen vor dem Schleswig-Holsteinischen Landesverfassungsgericht offen und wie verhält sich das zur Verfassungsbeschwerde zum BVerfG?
  back: 'Zuständiges Gericht ist das Schleswig-Holsteinische Landesverfassungsgericht auf Grundlage der Verfassung des Landes Schleswig-Holstein (LV SH). Es entscheidet u. a. in Organstreitigkeiten, in Normenkontrollverfahren und über kommunale Verfassungsbeschwerden; Prüfungsmaßstab ist die Landesverfassung, Bundesrecht nur, soweit die Landesverfassung darauf verweist. Ob und in welchem Umfang einzelne Bürger Landesgrundrechte mit einer Individualverfassungsbeschwerde geltend machen können, richtet sich nach der LV SH und dem Landesverfassungsgerichtsgesetz und ist dort nachzulesen (redaktionell zu verifizieren). Daneben steht immer die Verfassungsbeschwerde zum BVerfG (Art. 93 Abs. 1 Nr. 4a GG), die gegenüber Landesverfassungsrechtsbehelfen eigenständig ist.'
  norms:
  - Verfassung des Landes Schleswig-Holstein (LV SH)
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-10
- slug: sh-lra-kommunalverfassung
  type: norm
  front: Welches Gesetz regelt die Kommunalverfassung in Schleswig-Holstein und welche Hauptorgane hat
    die Gemeinde?
  back: 'Gemeindeordnung Schleswig-Holstein (GO SH): Gemeindevertretung und Bürgermeister. Grundlage ist
    die Selbstverwaltungsgarantie (Art. 28 Abs. 2 GG und Landesverfassung): eigenverantwortliche Regelung
    aller Angelegenheiten der örtlichen Gemeinschaft. Klausurklassiker: Zuständigkeitsstreit zwischen
    Vertretung und Verwaltungsspitze, Kommunalverfassungsstreit, Rechtsaufsicht.'
  norms:
  - 'Gemeindeordnung Schleswig-Holstein (GO SH): Gemeindevertretung und Bürgermeister'
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sh-lra-bauordnung
  type: norm
  front: Wie heißt die Bauordnung in Schleswig-Holstein und wie ist eine Baugenehmigung zu prüfen?
  back: 'Landesbauordnung Schleswig-Holstein (LBO SH). Anspruch auf Baugenehmigung besteht, wenn dem Vorhaben
    keine öffentlich-rechtlichen Vorschriften entgegenstehen: Genehmigungsbedürftigkeit (Errichtung, Änderung,
    Nutzungsänderung), keine Genehmigungsfreiheit, bauplanungsrechtliche Zulässigkeit nach §§ 29 ff. BauGB
    (Bundesrecht), bauordnungsrechtliche Zulässigkeit nach der Landesbauordnung (Abstandsflächen, Gestaltung,
    Stellplätze).'
  norms:
  - Landesbauordnung Schleswig-Holstein (LBO SH)
  - §§ 29 ff. BauGB
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sh-lra-pflichtstoff
  type: definition
  front: Welche Landesrechtsgebiete gehören in Schleswig-Holstein zum Pflichtstoff des Öffentlichen Rechts?
  back: Gefahrenabwehr- und Verwaltungsverfahrensrecht im LVwG; Kommunalrecht (GO SH); Bauordnungsrecht
    (LBO SH). Landesrecht wird im Examen fast nie isoliert, sondern eingebettet in eine verwaltungsprozessuale
    Einkleidung (Anfechtungs-/Verpflichtungsklage, vorläufiger Rechtsschutz) geprüft - die Landesnorm
    ist die Ermächtigungsgrundlage, der Aufbau bleibt der allgemeine.
  norms: []
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
