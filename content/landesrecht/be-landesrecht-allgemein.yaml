cards:
- slug: be-lra-vwvfg
  type: norm
  front: Welches Verwaltungsverfahrensgesetz gilt fuer Landesbehoerden in Berlin?
  back: Gesetz ueber das Verfahren der Berliner Verwaltung (VwVfG Bln) - Verweisung auf das VwVfG des
    Bundes (§ 1 VwVfG Bln). Das VwVfG des Bundes gilt nur fuer Bundesbehoerden (§ 1 VwVfG); fuer Landes-
    und Kommunalbehoerden ist das Landesgesetz massgeblich. Bei Verweisungsgesetzen werden die Bundesnormen
    'entsprechend' angewendet und sind so zu zitieren (z. B. '§ 35 VwVfG i. V. m. § 1 des Landesgesetzes'),
    bei Vollgesetzen ist die Landesnorm selbst zu zitieren.
  norms:
  - Gesetz ueber das Verfahren der Berliner Verwaltung (VwVfG Bln) - Verweisung auf das VwVfG des Bundes
    (§ 1 VwVfG Bln)
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: be-lra-verfassungsgericht
  type: norm
  front: Gibt es in Berlin eine Individualverfassungsbeschwerde zum Landesverfassungsgericht?
  back: 'Ja - § 49 VerfGHG Bln. Zustaendiges Gericht: Verfassungsgerichtshof des Landes Berlin auf Grundlage
    der Verfassung von Berlin (VvB). Verfahrensgegenstand ist nur die Verletzung von Landesgrundrechten
    durch Landesstaatsgewalt; Bundesrecht ist Pruefungsmassstab nur, soweit die Landesverfassung darauf
    verweist. Daneben steht immer die Verfassungsbeschwerde zum BVerfG (Art. 93 Abs. 1 Nr. 4a GG).'
  norms:
  - Verfassung von Berlin (VvB)
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: be-lra-kommunalverfassung
  type: norm
  front: Welches Gesetz regelt die Kommunalverfassung in Berlin und welche Hauptorgane hat die Gemeinde?
  back: 'Bezirksverwaltungsgesetz (BezVG): Bezirksverordnetenversammlung und Bezirksamt - keine Gemeinden.
    Grundlage ist die Selbstverwaltungsgarantie (Art. 28 Abs. 2 GG und Landesverfassung): eigenverantwortliche
    Regelung aller Angelegenheiten der oertlichen Gemeinschaft. Klausurklassiker: Zustaendigkeitsstreit
    zwischen Vertretung und Verwaltungsspitze, Kommunalverfassungsstreit, Rechtsaufsicht.'
  norms:
  - 'Bezirksverwaltungsgesetz (BezVG): Bezirksverordnetenversammlung und Bezirksamt - keine Gemeinden'
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: be-lra-bauordnung
  type: norm
  front: Wie heisst die Bauordnung in Berlin und wie ist eine Baugenehmigung zu pruefen?
  back: 'Bauordnung fuer Berlin (BauO Bln). Anspruch auf Baugenehmigung besteht, wenn dem Vorhaben keine
    oeffentlich-rechtlichen Vorschriften entgegenstehen: Genehmigungs-beduerftigkeit (Errichtung, Aenderung,
    Nutzungsaenderung), keine Genehmigungsfreiheit, bauplanungsrechtliche Zulaessigkeit nach §§ 29 ff.
    BauGB (Bundesrecht), bauordnungsrechtliche Zulaessigkeit nach der Landesbauordnung (Abstandsflaechen,
    Gestaltung, Stellplaetze).'
  norms:
  - Bauordnung fuer Berlin (BauO Bln)
  - §§ 29 ff. BauGB
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: be-lra-pflichtstoff
  type: definition
  front: Welche Landesrechtsgebiete gehoeren in Berlin zum Pflichtstoff des Oeffentlichen Rechts?
  back: Ordnungsrecht (ASOG); Bezirksverwaltung statt Kommunalrecht; Bauordnungsrecht (BauO Bln); Verfassung
    von Berlin. Landesrecht wird im Examen fast nie isoliert, sondern eingebettet in eine verwaltungsprozessuale
    Einkleidung (Anfechtungs-/Verpflichtungsklage, vorlaeufiger Rechtsschutz) geprueft - die Landesnorm
    ist die Ermaechtigungsgrundlage, der Aufbau bleibt der allgemeine.
  norms: []
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
