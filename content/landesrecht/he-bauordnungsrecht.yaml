cards:
- slug: he-bau-verfahren
  type: norm
  front: Welche Verfahrensarten kennt die HBO?
  back: >-
    Die HBO unterscheidet verfahrensfreie Bauvorhaben (§ 63 HBO), die Genehmigungsfreistellung (§ 64 HBO) für Vorhaben ohne Sonderbaueigenschaft im Geltungsbereich eines Bebauungsplans nach § 30 Abs. 1 oder §§ 12, 30 Abs. 2 BauGB, die keiner Ausnahme oder Befreiung nach § 31 BauGB und keiner Abweichung nach § 73 HBO bedürfen, bei gesicherter Erschließung und wenn die Gemeinde kein Genehmigungsverfahren verlangt, das vereinfachte Baugenehmigungsverfahren (§ 65 HBO) und das Baugenehmigungsverfahren für Sonderbauten (§ 66 HBO). Verfahrensfreiheit entbindet nur vom Genehmigungsverfahren, nicht von der Pflicht zur Einhaltung des materiellen Baurechts (§ 62 Abs. 2 HBO). Im vereinfachten Verfahren prüft die Bauaufsichtsbehörde nur die Zulässigkeit nach dem Baugesetzbuch, beantragte Abweichungen nach § 73 HBO und andere öffentlich-rechtliche Vorschriften, soweit wegen der Baugenehmigung eine Entscheidung nach diesen Vorschriften entfällt oder ersetzt wird (§ 65 Abs. 1 HBO); bei Sonderbauten wird auch die Zulässigkeit nach der HBO geprüft (§ 66 HBO). Die Baugenehmigung ist zu erteilen, wenn dem Vorhaben
    keine öffentlich-rechtlichen Vorschriften entgegenstehen.
  norms:
  - § 63 HBO
  - § 64 HBO
  - § 65 HBO
  - §§ 29 ff. BauGB
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-10
- slug: he-bau-genehmigungspflicht
  type: definition
  front: Wann bedarf ein Vorhaben in Hessen der Baugenehmigung?
  back: >-
    Die Errichtung, Aufstellung, Anbringung und Änderung sowie die Nutzungsänderung von Anlagen oder Teilen davon bedürfen der Baugenehmigung, soweit in §§ 63, 64, 64a, 78 und 79 HBO oder auf Grund des § 89 Abs. 4 S. 1 Nr. 1 HBO nichts anderes bestimmt ist (§ 62 Abs. 1 HBO). Bauliche Anlagen sind mit
    dem Erdboden verbundene, aus Bauprodukten hergestellte Anlagen. Die Nutzungsänderung ist genehmigungspflichtig,
    wenn für die neue Nutzung andere oder weitergehende öffentlich-rechtliche Anforderungen gelten. Erst
    wenn der Ausnahmetatbestand nicht greift, ist der Genehmigungsantrag zu stellen. Wer ohne Genehmigung
    baut, handelt formell illegal.
  norms:
  - § 62 HBO
  - § 63 HBO
  - § 65 HBO
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-10
- slug: he-bau-genehmigung
  type: definition
  front: Welche Rechtsnatur und Wirkungen hat die Baugenehmigung?
  back: >-
    Die Baugenehmigung ist ein feststellender Verwaltungsakt mit verfügendem Element: Sie stellt die Vereinbarkeit
    des Vorhabens mit dem öffentlichen Baurecht fest und gestattet die Ausführung. Sie wird unbeschadet
    der privaten Rechte Dritter erteilt. Aus Art. 14 Abs. 1 GG (Baufreiheit) folgt ein Anspruch auf Erteilung,
    wenn das Vorhaben genehmigungsfähig ist. Sie begründet Bestandsschutz. Eine rechtswidrige Genehmigung
    kann nach § 48 HVwVfG zurückgenommen werden. Nachbarn können sie nur anfechten, wenn sie in nachbarschützenden
    Rechten verletzt sind.
  norms:
  - Art. 14 Abs. 1 GG
  - § 48 HVwVfG
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-10
- slug: he-bau-abstandsflaechen
  type: norm
  front: Wie werden Abstandsflächen nach der HBO bemessen?
  back: >-
    Vor den Außenwänden oberirdischer Gebäude sind Abstandsflächen freizuhalten (§ 6 HBO). Die Tiefe beträgt allgemein 0,4 H (H = Wandhöhe), in Gewerbe- und Industriegebieten 0,2 H, in allen Fällen mindestens 2,50 m (§ 6 Abs. 5 HBO). Die Abstandsflächen müssen auf dem Grundstück
    selbst liegen und dürfen sich nicht überdecken; für die planungsrechtlich zulässige Grenzbebauung
    bestehen Ausnahmen. Die Bauaufsichtsbehörde soll Abweichungen zulassen, wenn sie unter Berücksichtigung des Zwecks der Anforderung und unter Würdigung der öffentlich-rechtlich geschützten nachbarlichen Belange mit den öffentlichen Belangen vereinbar sind (§ 73 Abs. 1 HBO). Die Vorschriften dienen Belichtung, Belüftung, Brandschutz und Wohnfrieden
    und sind nachbarschützend.
  norms:
  - § 6 HBO
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-10
- slug: he-bau-nachbarbeteiligung
  type: norm
  front: Wie werden Nachbarn beteiligt, und welche Bedeutung hat die Zustimmung?
  back: >-
    Die Bauaufsichtsbehörde soll die Nachbarschaft benachrichtigen, bevor von nachbarschützenden Vorschriften Abweichungen, Ausnahmen oder Befreiungen zugelassen werden; Einwendungen sind innerhalb von zwei Wochen nach Zugang der Benachrichtigung mitzuteilen (§ 71 Abs. 1 HBO). Wer den Abweichungen, Ausnahmen oder Befreiungen zugestimmt hat, wird nicht benachrichtigt (§ 71 Abs. 2 HBO); die Entscheidung ist nur denjenigen bekannt zu geben, deren Einwendungen nicht entsprochen wird (§ 71 Abs. 3 HBO). Die Beteiligung dient der Information und beeinflusst
    die Rechtsbehelfsfrist: Wird dem Nachbarn die Genehmigung nicht bekannt gegeben, läuft die Frist nicht;
    bei Kenntnis oder Kennenmüssen kann das Rügerecht nach Treu und Glauben verwirkt sein. Ein Verstoß
    gegen die Beteiligung allein führt nicht zur Aufhebung; maßgeblich ist die Verletzung nachbarschützender
    Normen.
  norms:
  - § 71 HBO
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-10
- slug: he-bau-nachbarschutz
  type: definition
  front: Wann ist die Nachbarklage gegen eine Baugenehmigung begründet?
  back: >-
    Die Anfechtungsklage des Nachbarn ist begründet, wenn die Baugenehmigung rechtswidrig ist und den
    Nachbarn in eigenen Rechten verletzt (§ 113 Abs. 1 S. 1 VwGO). Maßgeblich ist die Schutznormtheorie.
    Nachbarschützend sind die Abstandsflächenvorschriften (§ 6 HBO), der Gebietserhaltungsanspruch (Festsetzung
    der Baugebietsart, §§ 2 ff. BauNVO) und das Rücksichtnahmegebot (§ 15 Abs. 1 BauNVO; § 34 BauGB).
    Ein Verstoß gegen rein objektives Baurecht genügt nicht. Widerspruch und Klage haben keine aufschiebende
    Wirkung (§ 212a Abs. 1 BauGB); vorläufiger Rechtsschutz nach §§ 80a, 80 Abs. 5 VwGO.
  norms:
  - § 113 Abs. 1 S. 1 VwGO
  - § 6 HBO
  - § 15 BauNVO
  - § 212a Abs. 1 BauGB
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-10
- slug: he-bau-massnahmen
  type: norm
  front: Welche bauaufsichtlichen Maßnahmen gibt es bei rechtswidrigen Bauvorhaben?
  back: >-
    Die Bauaufsichtsbehörde überwacht die Einhaltung des öffentlichen Baurechts und trifft nach pflichtgemäßem
    Ermessen die erforderlichen Maßnahmen (§ 61 Abs. 2 HBO). Typisch sind die Baueinstellung (§ 81 HBO) sowie Beseitigungsanordnung und Nutzungsverbot (§ 82 Abs. 1 HBO); nach § 82 Abs. 2 HBO kann die Behörde auch verlangen, dass ein erforderliches Verfahren durchgeführt wird. Die Baueinstellung ist als vorläufige Maßnahme schon
    bei formeller Illegalität zulässig. Die Beseitigung setzt nach h. M. formelle und materielle Illegalität
    voraus, weil ein genehmigungsfähiges Bauwerk nicht beseitigt werden darf. Für die Nutzungsuntersagung
    genügt nach der Rechtsprechung die formelle Illegalität, wenn die Nutzung nicht offensichtlich genehmigungsfähig
    ist. Adressat ist der Verantwortliche; die Anordnung muss verhältnismäßig sein und den Gleichheitssatz
    beachten.
  norms:
  - § 61 HBO
  - § 81 HBO
  - § 82 HBO
  - Art. 14 Abs. 1 GG
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-10
- slug: he-bau-abbruch
  type: streitstand
  front: Setzt eine Beseitigungsverfügung materielle Illegalität voraus?
  back: >-
    Nach h. M. ist für die Beseitigung neben der formellen auch die materielle Illegalität erforderlich:
    Ein ohne Genehmigung errichtetes, aber genehmigungsfähiges Bauwerk darf nicht beseitigt werden, weil
    der Abbruch unverhältnismäßig wäre; der Bauherr ist stattdessen zum Bauantrag aufzufordern. Die Gegenansicht
    stellt auf die formelle Illegalität ab: Das Genehmigungsverfahren dürfe nicht umgangen werden (Vollzugsargument).
    Sie überzeugt für den Abbruch nicht, weil der Eingriff in Art. 14 GG schwer wiegt und nach Genehmigung
    rechtmäßig wäre. Bei der Nutzungsuntersagung wird die formelle Illegalität eher als ausreichend angesehen,
    weil sie aufhebbar ist.
  norms:
  - Art. 14 Abs. 1 GG
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-10
- slug: he-bau-aufbau
  type: schema_step
  front: 'Aufbau: bauaufsichtliche Beseitigungsverfügung'
  back: >-
    I. Ermächtigungsgrundlage (§ 82 Abs. 1 S. 1 HBO; Aufgaben und Befugnisse der Bauaufsicht § 61 Abs. 2 HBO). II. Formelle Rechtmäßigkeit: Zuständigkeit
    der Bauaufsichtsbehörde, Anhörung (§ 28 HVwVfG), Form. III. Materielle Rechtmäßigkeit: 1. Rechtswidriger
    Zustand (formelle und materielle Illegalität), 2. richtiger Adressat, 3. Ermessen und Verhältnismäßigkeit,
    Gleichbehandlung. IV. Vollstreckung.
  norms:
  - § 28 HVwVfG
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-10
schemata:
- slug: he-schema-bau-beseitigung
  title: Prüfung einer Beseitigungsverfügung nach der HBO
  norms:
  - § 28 HVwVfG
  - Art. 14 Abs. 1 GG
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  steps:
  - label: I. Ermächtigungsgrundlage
    hinweis: § 82 Abs. 1 S. 1 HBO; Aufgaben der Bauaufsicht § 61 Abs. 2 HBO.
  - label: II. Formelle Rechtmäßigkeit
    children:
    - label: '1. Zuständigkeit: Bauaufsichtsbehörde'
    - label: 2. Anhörung, § 28 HVwVfG
    - label: 3. Form
  - label: III. Materielle Rechtmäßigkeit
    children:
    - label: 1. Rechtswidriger Zustand
      hinweis: >-
        Formelle Illegalität (Genehmigung erforderlich und fehlt) und materielle Illegalität (Vorhaben
        nicht genehmigungsfähig).
    - label: '2. Adressat: Bauherr, Eigentümer'
    - label: 3. Ermessen und Verhältnismäßigkeit; Gleichbehandlung
  - label: IV. Vollstreckung
    hinweis: HessVwVG; Rechtsschutz nach § 80 Abs. 5 VwGO.
  stand: 2026-10
faelle:
- slug: he-fall-bau-beseitigung
  title: Der ungenehmigte Wintergarten
  difficulty: 3
  minutes: 45
  quellen:
  - Eigener Sachverhalt der Redaktion
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  facts: >-
    E errichtet an seinem Wohnhaus ohne Baugenehmigung einen Wintergarten, der genehmigungsbedürftig ist.
    Das Grundstück liegt in einem Gebiet mit Bebauungsplan, der Wohnnutzung und eine Bebauung in dem Umfang
    zulässt; der Wintergarten hält alle Abstandsflächen und die Festsetzungen des Bebauungsplans ein und
    verstößt gegen keine bauordnungsrechtliche Vorschrift. Die Bauaufsichtsbehörde erfährt davon, hört
    E an und ordnet dann die Beseitigung des Wintergartens an, weil dieser ohne Genehmigung errichtet
    worden sei. E hält die Verfügung für rechtswidrig.
  question: Ist die Beseitigungsverfügung rechtmäßig?
  steps:
  - prompt: Auf welche Rechtsgrundlage stützt sich die Verfügung?
    erwartung: >-
      Auf § 82 Abs. 1 S. 1 HBO (Beseitigungsanordnung) i. V. m. § 61 Abs. 2 HBO; die Bauaufsichtsbehörde ist zuständig, E wurde
      angehört (§ 28 HVwVfG).
  - prompt: Liegt formelle Illegalität vor?
    erwartung: Ja. Der Wintergarten ist genehmigungsbedürftig und wurde ohne Genehmigung errichtet.
  - prompt: Liegt materielle Illegalität vor?
    erwartung: >-
      Nein. Der Wintergarten verstößt weder gegen Bauplanungsrecht noch gegen Bauordnungsrecht (Abstandsflächen
      eingehalten); er wäre genehmigungsfähig, E hätte Anspruch auf Erteilung der Baugenehmigung.
  - prompt: Folge?
    erwartung: >-
      Die Beseitigung setzt nach h. M. materielle Illegalität voraus; sie ist unverhältnismäßig, weil
      die Behörde E auf das Bauantragsverfahren verweisen kann (milderes Mittel). Die Verfügung ist rechtswidrig;
      zulässig wäre die Aufforderung zum Bauantrag oder ggf. Baueinstellung.
  expectation:
    pruefpunkte:
    - id: p1
      label: Formelle Illegalität (genehmigungsbedürftig, keine Genehmigung) erkannt
      weight: 1.5
      required: true
      keywords:
      - formelle Illegalität
      - genehmigungsbedürftig
      - ohne Baugenehmigung
      - keine Genehmigung
      card_slugs:
      - he-bau-genehmigungspflicht
      - he-bau-abbruch
    - id: p2
      label: 'Materielle Illegalität verneint: Vorhaben genehmigungsfähig'
      weight: 3.0
      required: true
      keywords:
      - materielle Illegalität
      - genehmigungsfähig
      - Anspruch auf Baugenehmigung
      - keine Verstöße gegen Baurecht
      - Abstandsflächen eingehalten
      card_slugs:
      - he-bau-abbruch
    - id: p3
      label: Beseitigung nur bei formeller und materieller Illegalität; Verhältnismäßigkeit
      weight: 2.5
      required: true
      keywords:
      - formelle und materielle Illegalität
      - Verhältnismäßigkeit
      - Beseitigungsverfügung
      - unverhältnismäßig
      - milderes Mittel
      card_slugs:
      - he-bau-massnahmen
      - he-bau-abbruch
    - id: p4
      label: >-
        Alternativen genannt: Aufforderung zum Bauantrag, Baueinstellung; Streitstand zum Vollzugsargument
      weight: 1.0
      required: false
      keywords:
      - Bauantrag
      - Baueinstellung
      - Vollzugsargument
      - Aufforderung zum Bauantrag
      card_slugs:
      - he-bau-abbruch
  stand: 2026-10
