cards:
- slug: be-bo-abgrenzung
  type: definition
  front: >-
    Wie grenzen sich Bauplanungsrecht und Bauordnungsrecht ab und welche Rolle spielt die BauO Bln?
  back: >-
    Das Bauplanungsrecht regelt die städtebauliche Ordnung der Bodennutzung (Bebauungsplan, Zulässigkeit
    nach §§ 29 ff. BauGB); es ist Bundesrecht (Art. 74 Abs. 1 Nr. 18 GG). Das Bauordnungsrecht regelt
    als Landesrecht die Anforderungen an das einzelne Bauvorhaben im Sinne der Gefahrenabwehr: Standsicherheit,
    Brandschutz, Abstandsflächen, Gestaltung, Stellplätze und das Verfahren. Rechtsgrundlage in Berlin
    ist die Bauordnung für Berlin (BauO Bln). Im Genehmigungsverfahren sind beide Bereiche zu prüfen:
    Das Vorhaben muss bauplanungsrechtlich zulässig sein und darf bauordnungsrechtlichen Vorschriften
    nicht widersprechen. In der Klausur ist die Trennung der Prüfungsebenen wichtig, weil die Rechtsfolgen
    (Befreiung, § 31 Abs. 2 BauGB; Abweichung nach Landesrecht) unterschiedlich sind.
  norms:
  - Bauordnung für Berlin (BauO Bln)
  - >-
    §§ 29 ff. BauGB
  - Art. 74 Abs. 1 Nr. 18 GG
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-10
- slug: be-bo-baugenehmigung
  type: norm
  front: >-
    Unter welchen Voraussetzungen besteht in Berlin ein Anspruch auf Baugenehmigung?
  back: >-
    Der Bauherr hat Anspruch auf die Baugenehmigung, wenn dem Vorhaben keine öffentlich-rechtlichen Vorschriften
    entgegenstehen. Zu prüfen sind: (1) Genehmigungsbedürftigkeit (Errichtung, Änderung, Nutzungsänderung;
    keine Verfahrensfreiheit), (2) bauplanungsrechtliche Zulässigkeit (§§ 29 ff. BauGB; Einvernehmen der
    Gemeinde, § 36 BauGB), (3) bauordnungsrechtliche Zulässigkeit nach der BauO Bln, soweit das Verfahren
    sie zum Prüfprogramm macht, und (4) sonstiges öffentliches Recht. Die Baugenehmigung ist ein Verwaltungsakt,
    der unbeschadet der Rechte Dritter ergeht. Bauaufsichtsbehörden sind die Bezirksämter (untere Bauaufsicht)
    und die zuständige Senatsverwaltung (obere Bauaufsicht); Beklagter im Prozess ist das Land Berlin.
    Rechtsschutz bei Ablehnung: Verpflichtungsklage nach § 42 Abs. 1 Var. 2 VwGO.
  norms:
  - Bauordnung für Berlin (BauO Bln)
  - >-
    § 36 BauGB
  - >-
    § 42 Abs. 1 VwGO
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-10
- slug: be-bo-verfahrensarten
  type: definition
  front: >-
    Welche Verfahrensarten kennt das Bauordnungsrecht in Berlin und was folgt daraus für die materielle
    Rechtmäßigkeit?
  back: >-
    Die BauO Bln unterscheidet nach Gefährdungspotential und Größe des Vorhabens: verfahrensfreie Vorhaben,
    die Genehmigungsfreistellung bei qualifiziertem Bebauungsplan, das vereinfachte Genehmigungsverfahren
    mit eingeschränktem Prüfprogramm und das reguläre Genehmigungsverfahren mit umfassender Prüfung. Entscheidend
    ist: Verfahrensfreiheit oder eingeschränkte Prüfung bedeuten nicht, dass materielle Anforderungen
    entfallen; sie besagen nur, dass die Bauaufsichtsbehörde das Vorhaben nicht oder nicht vollständig
    vorab prüft. Auch verfahrensfreie Vorhaben müssen dem materiellen Recht entsprechen, und die Bauaufsichtsbehörde
    kann bei Verstößen einschreiten. Eine Baugenehmigung im vereinfachten Verfahren stellt nur die Vereinbarkeit
    mit den in diesem Verfahren geprüften Vorschriften fest.
  norms:
  - Bauordnung für Berlin (BauO Bln)
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-10
- slug: be-bo-abstandsflaechen
  type: norm
  front: >-
    Was regelt das Abstandsflächenrecht der BauO Bln und welche Rechtsfolgen hat sein Verstoß?
  back: >-
    Abstandsflächen (§ 6 BauO Bln) sind von oberirdischen Gebäuden freizuhaltende Flächen vor den Außenwänden.
    Sie dienen dem Brandschutz, der Belichtung, Belüftung und Besonnung sowie dem Wohnfrieden. In Berlin
    beträgt die Tiefe der Abstandsfläche grundsätzlich 0,4 H (H = Wandhöhe), mindestens 3 m (§ 6 BauO
    Bln). Grundsätzlich liegt die Abstandsfläche auf dem Baugrundstück. Das Abstandsflächenrecht ist weitgehend
    drittschützend: Ein Nachbar kann sich gegen eine Baugenehmigung wehren, die diese Vorschriften verletzt.
    Unterschreitungen können im Wege der Abweichung (Landesrecht) gestattet werden, wenn Zweck und öffentliche
    Belange gewahrt sind. Ein Verstoß macht das Vorhaben materiell rechtswidrig und kann bauaufsichtliche
    Maßnahmen begründen.
  norms:
  - >-
    § 6 BauO Bln
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-10
- slug: be-bo-nachbarschutz
  type: definition
  front: >-
    Unter welchen Voraussetzungen kann ein Nachbar in Berlin gegen eine Baugenehmigung vorgehen?
  back: >-
    Der Nachbar kann die Baugenehmigung mit Widerspruch bzw. Anfechtungsklage (Drittanfechtung) angreifen.
    Klagebefugt (§ 42 Abs. 2 VwGO) ist er, wenn er die Verletzung einer drittschützenden Norm geltend
    machen kann: nachbarschützend sind etwa die Abstandsflächenvorschriften der BauO Bln, bestimmte Festsetzungen
    eines Bebauungsplans (Gebietserhaltungsanspruch) und das Gebot der Rücksichtnahme. Begründet ist die
    Klage nur, wenn die Genehmigung rechtswidrig ist und den Nachbarn in einem subjektiven öffentlichen
    Recht verletzt (Schutznormtheorie); allgemeine objektive Rechtsverstöße genügen nicht. Widerspruch
    und Anfechtungsklage des Nachbarn haben nach § 212a Abs. 1 BauGB keine aufschiebende Wirkung; vorläufiger
    Rechtsschutz wird über § 80a Abs. 3 i. V. m. § 80 Abs. 5 VwGO gewährt.
  norms:
  - >-
    § 42 Abs. 2 VwGO
  - >-
    § 212a Abs. 1 BauGB
  - >-
    § 80a Abs. 3 VwGO
  - >-
    § 80 Abs. 5 VwGO
  quellen:
  - VwGO, amtliche Fassung
  - BauGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-10
- slug: be-bo-eingriff
  type: norm
  front: >-
    Welche bauaufsichtlichen Eingriffsmaßnahmen gibt es in Berlin und wann genügt formelle Illegalität?
  back: >-
    Die Bauaufsichtsbehörde kann bei rechtswidrigen baulichen Anlagen nach der BauO Bln einschreiten,
    insbesondere durch Baueinstellung (Stilllegungsverfügung), Nutzungsuntersagung und Beseitigungsanordnung.
    Zu unterscheiden sind formelle Illegalität (fehlende erforderliche Genehmigung) und materielle Illegalität
    (Widerspruch zu materiellem Recht). Für Baueinstellung und Nutzungsuntersagung genügt regelmäßig formelle
    Illegalität; wegen der Schwere des Eingriffs setzt die Beseitigungsanordnung nach h. M. materielle
    Illegalität voraus, weil sonst eine genehmigungsfähige Anlage beseitigt würde. Die Maßnahmen stehen
    im Ermessen; zu beachten sind Verhältnismäßigkeit, Gleichbehandlung und Bestandsschutz. Adressat ist
    regelmäßig der Bauherr oder der Eigentümer.
  norms:
  - Bauordnung für Berlin (BauO Bln)
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-10
- slug: be-bo-bestandsschutz
  type: definition
  front: Was bedeutet Bestandsschutz im Bauordnungsrecht von Berlin?
  back: >-
    Bestandsschutz folgt aus Art. 14 Abs. 1 GG: Eine rechtmäßig errichtete bauliche Anlage darf in ihrem
    genehmigten Zustand und in der genehmigten Nutzung fortbestehen, auch wenn sich das Recht später ändert.
    Voraussetzung ist, dass die Anlage genehmigt oder zumindest zu irgendeinem Zeitpunkt materiell legal
    war. Eine Beseitigungsanordnung allein wegen späterer Rechtsänderung ist rechtswidrig. Nachträgliche
    Anpassungsverlangen sind nur nach ausdrücklicher gesetzlicher Ermächtigung und bei erheblicher Gefahr
    für Leben, Gesundheit oder öffentliche Sicherheit zulässig. Kein Bestandsschutz genießen Schwarzbauten,
    die nie genehmigt und nie genehmigungsfähig waren. Weitergehende Veränderungen (Erweiterung, Nutzungsänderung)
    sind vom Bestandsschutz nicht gedeckt.
  norms:
  - Art. 14 Abs. 1 GG
  - Bauordnung für Berlin (BauO Bln)
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-10
- slug: be-bo-abweichung
  type: definition
  front: >-
    Wann kann in Berlin von Anforderungen der BauO Bln abgewichen werden und wie unterscheidet sich das
    von der Befreiung nach dem BauGB?
  back: >-
    Die BauO Bln erlaubt es der Bauaufsichtsbehörde, Abweichungen von bauordnungsrechtlichen Anforderungen
    zuzulassen, wenn sie unter Berücksichtigung des Zwecks der Anforderung und unter Würdigung der nachbarlichen
    Belange mit den öffentlichen Belangen vereinbar sind. Es handelt sich um eine Ermessensentscheidung,
    die bei Erfüllung der Voraussetzungen und ohne entgegenstehende Gründe auf null reduziert sein kann.
    Die Befreiung nach § 31 Abs. 2 BauGB betrifft dagegen Festsetzungen eines Bebauungsplans und ist Bauplanungsrecht.
    In der Klausur sind beide Instrumente zu trennen; für die Nachbarschutzprüfung ist maßgeblich, ob
    die verletzte Norm drittschützend ist und ob die Abweichung die nachbarlichen Belange würdigt.
  norms:
  - >-
    § 31 Abs. 2 BauGB
  - Bauordnung für Berlin (BauO Bln)
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - BauGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-10
schemata:
- slug: be-schema-bo-nachbarklage
  title: Nachbarklage gegen eine Baugenehmigung nach der BauO Bln
  norms:
  - Bauordnung für Berlin (BauO Bln)
  - >-
    § 42 Abs. 2 VwGO
  - >-
    § 212a Abs. 1 BauGB
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  steps:
  - label: I. Zulässigkeit der Anfechtungsklage des Nachbarn
    children:
    - label: 1. Verwaltungsrechtsweg, § 40 Abs. 1 VwGO
    - label: >-
        2. Statthafte Klageart: Drittanfechtung der Baugenehmigung
    - label: 3. Klagebefugnis, § 42 Abs. 2 VwGO
      hinweis: >-
        Mögliche Verletzung einer drittschützenden Norm (Abstandsflächen, Gebietserhaltungsanspruch, Rücksichtnahmegebot).
    - label: >-
        4. Vorverfahren und Klagefrist (Landesrecht und § 74 VwGO beachten)
    - label: 5. Richtiger Beklagter, § 78 VwGO
  - label: II. Begründetheit
    children:
    - label: >-
        1. Baugenehmigung objektiv rechtswidrig (Verstoß gegen Bauplanungs- oder Bauordnungsrecht)
    - label: >-
        2. Verletzung des Nachbarn in einem subjektiven öffentlichen Recht (Schutznormtheorie)
  - label: III. Vorläufiger Rechtsschutz
    hinweis: Keine aufschiebende Wirkung nach § 212a Abs. 1 BauGB.
    children:
    - label: Antrag nach § 80a Abs. 3 i. V. m. § 80 Abs. 5 VwGO
faelle:
- slug: be-fall-bo-nachbarklage
  title: Die zu kurze Abstandsfläche
  difficulty: 4
  minutes: 60
  quellen:
  - Eigener Sachverhalt der Redaktion
  - BauO Bln, amtliche Fassung
  - VwGO, amtliche Fassung
  - BauGB, amtliche Fassung
  facts: >-
    B erhält vom Bezirksamt eine Baugenehmigung für ein viergeschossiges Wohnhaus mit einer Wandhöhe von
    10 m. Die Außenwand steht 3 m von der Grenze zum Nachbargrundstück des N entfernt. Nach § 6 BauO Bln
    beträgt die erforderliche Tiefe der Abstandsfläche hier 0,4 H (H = Wandhöhe), mindestens 3 m. Eine
    Abweichung wurde nicht beantragt oder zugelassen; die Behörde hat die Unterschreitung übersehen. N
    legt form- und fristgerecht Widerspruch ein, der zurückgewiesen wird. B will sofort mit dem Bau beginnen.
    N möchte Klage erheben und zugleich verhindern, dass B vollendete Tatsachen schafft.
  question: >-
    Hat die Klage des N Erfolg, und wie kann N vorläufigen Rechtsschutz erlangen?
  steps:
  - prompt: Welche Klageart ist statthaft und ist N klagebefugt?
    erwartung: >-
      Statthaft ist die Anfechtungsklage des Nachbarn (Drittanfechtung der Baugenehmigung, § 42 Abs. 1
      Var. 1 VwGO). N ist klagebefugt, weil die Abstandsflächenvorschriften nach § 6 BauO Bln drittschützend
      sind und er geltend machen kann, in seinem subjektiven öffentlichen Recht verletzt zu sein (§ 42
      Abs. 2 VwGO).
  - prompt: Ist die Baugenehmigung rechtswidrig?
    erwartung: >-
      Ja: Erforderlich ist eine Abstandsfläche von 0,4 x 10 m = 4 m; tatsächlich beträgt der Abstand nur
      3 m. Die Abstandsfläche ist zu kurz und eine Abweichung liegt nicht vor, die Baugenehmigung verstößt
      daher gegen § 6 BauO Bln.
  - prompt: Ist N in eigenen Rechten verletzt?
    erwartung: >-
      Ja: Die verletzte Norm ist nachbarschützend; die Unterschreitung beeinträchtigt N in Belichtung,
      Belüftung und Wohnfrieden. Die Genehmigung ist rechtswidrig und verletzt N in seinen Rechten (Schutznormtheorie).
      Die Klage ist begründet.
  - prompt: Wie erlangt N vorläufigen Rechtsschutz?
    erwartung: >-
      Widerspruch und Anfechtungsklage des Nachbarn haben nach § 212a Abs. 1 BauGB keine aufschiebende
      Wirkung. N kann beim Verwaltungsgericht nach § 80a Abs. 3 i. V. m. § 80 Abs. 5 VwGO die Anordnung
      der aufschiebenden Wirkung beantragen.
  expectation:
    pruefpunkte:
    - id: p1
      label: >-
        Drittanfechtung der Baugenehmigung als statthafte Klageart; Klagebefugnis über drittschützende
        Norm
      weight: 2.0
      required: true
      norms:
      - >-
        § 42 Abs. 2 VwGO
      keywords:
      - Anfechtungsklage
      - Drittanfechtung
      - Klagebefugnis
      - drittschützend
      - nachbarschützend
      - >-
        § 42 Abs. 2 VwGO
      card_slugs:
      - be-bo-nachbarschutz
    - id: p2
      label: >-
        Abstandsfläche von 4 m erforderlich, nur 3 m vorhanden: Baugenehmigung rechtswidrig
      weight: 3.0
      required: true
      norms:
      - >-
        § 6 BauO Bln
      keywords:
      - 0,4 H
      - 4 m
      - Abstandsfläche
      - >-
        § 6 BauO Bln
      - Unterschreitung
      - keine Abweichung
      card_slugs:
      - be-bo-abstandsflaechen
    - id: p3
      label: >-
        Verletzung subjektiver Rechte des Nachbarn (Schutznormtheorie)
      weight: 2.0
