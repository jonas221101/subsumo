cards:
- slug: bb-kom-selbstverwaltung
  type: definition
  front: >-
      Was gewährleistet die kommunale Selbstverwaltung nach Art. 28 Abs. 2 GG, und welche
      Aufgabenarten gibt es in Brandenburg?
  back: >-
      Art. 28 Abs. 2 GG garantiert den Gemeinden das Recht, alle Angelegenheiten der örtlichen
      Gemeinschaft im Rahmen der Gesetze in eigener Verantwortung zu regeln (Allzuständigkeit). Die
      Garantie umfasst die Rechtssubjektsgarantie, die objektive Rechtsinstitutionsgarantie und die
      subjektive Rechtsstellungsgarantie. Sie schützt die Gemeindehoheiten, etwa Gebiets-,
      Organisations-, Personal-, Finanz-, Planungs- und Satzungshoheit. Eingriffe durch Gesetz sind
      zulässig, soweit der Kernbereich unangetastet bleibt und Aufgaben mit örtlichem Charakter nur
      aus Gründen des Gemeinwohls, insbesondere zur Sicherung einer ordnungsgemäßen
      Aufgabenwahrnehmung, entzogen werden (Rastede-Beschluss). Aufgabenarten nach der BbgKVerf: Selbstverwaltungsaufgaben (§ 2 Abs. 1 BbgKVerf), die durch Gesetz als pflichtige Selbstverwaltungsaufgaben auferlegt sein können, Pflichtaufgaben zur Erfüllung nach Weisung und ausnahmsweise Auftragsangelegenheiten (§ 2 Abs. 3 BbgKVerf). Bei Selbstverwaltungsaufgaben besteht nur Rechtsaufsicht (§ 109 BbgKVerf), bei Pflichtaufgaben zur Erfüllung nach Weisung Sonderaufsicht (§ 121 BbgKVerf), bei Auftragsangelegenheiten Fachaufsicht (§ 122 BbgKVerf).
  norms:
  - "Art. 28 Abs. 2 S. 1 GG"
  quellen:
  - "Landesgesetze in der amtlichen Fassung (Landesrechtsportal)"
  - "Eigenformulierung Redaktion"
  - "BVerfGE 79, 127 (Rastede)"
  stand: 2026-10
- slug: bb-kom-struktur
  type: definition
  front: >-
      Wie ist die kommunale Verwaltung in Brandenburg gegliedert (amtsfreie Gemeinden, Ämter,
      Landkreise)?
  back: >-
      Die BbgKVerf regelt die Gemeinden, Ämter und Landkreise in einem Gesetz. Amtsfreie Gemeinden verwalten sich selbst. Ämter sind Körperschaften des öffentlichen Rechts, die aus in der Regel aneinandergrenzenden Gemeinden desselben Landkreises bestehen (§ 133 BbgKVerf), die Hauptverwaltungsbeamter des Amtes ist der Amtsdirektor (§ 138 BbgKVerf); das Amt verwaltet und unterstützt die amtsangehörigen Gemeinden (§ 135 BbgKVerf). Die Gemeinden bleiben als amtsangehörige Gemeinden rechtlich selbständig und behalten Gemeindevertretung und
      ehrenamtlichen Bürgermeister, die Verwaltung führt jedoch das Amt, geleitet vom Amtsdirektor und
      kontrolliert vom Amtsausschuss. Das Amt führt die Beschlüsse der amtsangehörigen Gemeinden aus
      und erledigt übertragene Aufgaben. Für die Klausur ist deshalb bei Verwaltungshandeln zu fragen,
      ob die Gemeinde oder das Amt handelt und wer zur Vertretung berechtigt ist. Landkreise nehmen
      überörtliche Aufgaben wahr und erledigen daneben übertragene staatliche Aufgaben.
  norms:
  - "§§ 133 bis 138 BbgKVerf"
  quellen:
  - "Landesgesetze in der amtlichen Fassung (Landesrechtsportal)"
  - "Eigenformulierung Redaktion"
  stand: 2026-10
- slug: bb-kom-organe
  type: definition
  front: >-
      Wie sind die Zuständigkeiten von Gemeindevertretung und Bürgermeister in Brandenburg verteilt,
      und welche Anforderungen gelten für Verpflichtungserklärungen?
  back: >-
      Die Gemeindevertretung ist für alle Angelegenheiten der Gemeinde zuständig, soweit gesetzlich nichts anderes bestimmt ist (§ 28 Abs. 1 BbgKVerf); vorbehalten sind ihr u. a. die allgemeinen Grundsätze der Verwaltung, die Hauptsatzung, der Erlass von Satzungen und die Haushaltssatzung (§ 28 Abs. 2 BbgKVerf). Der Bürgermeister als Hauptverwaltungsbeamter bereitet die Beschlüsse vor, führt sie aus und führt die Geschäfte der laufenden Verwaltung (§ 54 Abs. 1 BbgKVerf) und vertritt die Gemeinde in Rechts- und Verwaltungsgeschäften (§ 57 Abs. 1 BbgKVerf). Die Abgrenzung der Zuständigkeiten ergibt sich aus der BbgKVerf und der Hauptsatzung; ein
      Beschluss des unzuständigen Organs ist formell rechtswidrig. Erklärungen, durch die die Gemeinde verpflichtet werden soll, bedürfen der Schriftform oder eines elektronischen Schriftformersatzes und sind vom Hauptverwaltungsbeamten und einer Stellvertretung nach § 56 BbgKVerf abzugeben (§ 57 Abs. 2 BbgKVerf); das gilt nicht für Geschäfte der laufenden Verwaltung (§ 57 Abs. 3) und nicht für Geschäfte eines Bevollmächtigten, dessen Vollmacht in dieser Form erteilt ist (§ 57 Abs. 4). Erklärungen, die diese Voraussetzungen nicht erfüllen, sind nach § 57 Abs. 5 BbgKVerf schwebend unwirksam; sie binden die Gemeinde nicht ohne Genehmigung in der gebotenen Form.
  norms:
  - "§ 28 BbgKVerf"
  - "§ 54 BbgKVerf"
  - "§ 57 BbgKVerf"
  quellen:
  - "Landesgesetze in der amtlichen Fassung (Landesrechtsportal)"
  - "Eigenformulierung Redaktion"
  stand: 2026-10
- slug: bb-kom-satzung
  type: norm
  front: >-
      Welche Anforderungen stellt das Recht in Brandenburg an eine gemeindliche Satzung?
  back: >-
      Die Gemeinden können ihre Angelegenheiten durch Satzung regeln (Satzungshoheit). Eine allgemeine
      Satzungsermächtigung in der BbgKVerf genügt für Eingriffe in Grundrechte allerdings nicht; nach
      der Wesentlichkeitstheorie braucht es eine spezielle gesetzliche Ermächtigung (z. B. für
      Anschluss- und Benutzungszwang oder Abgaben). Prüfungsaufbau: I. Ermächtigungsgrundlage. II.
      Formelle Rechtmäßigkeit: Zuständigkeit des Gemeindeorgans (Gemeindevertretung), Verfahren
      (Beschlussfassung, Mitwirkungsverbote), Ausfertigung und ordnungsgemäße öffentliche
      Bekanntmachung. III. Materielle Rechtmäßigkeit: Vereinbarkeit mit höherrangigem Recht,
      Bestimmtheit, Verhältnismäßigkeit, Gleichheitssatz. Rechtsfolge eines Fehlers ist grundsätzlich Nichtigkeit; die Verletzung landesrechtlicher Verfahrens- oder Formvorschriften ist nach § 3 Abs. 4 BbgKVerf jedoch unbeachtlich, wenn sie nicht innerhalb eines Jahres seit der öffentlichen Bekanntmachung schriftlich oder elektronisch unter Bezeichnung der verletzten Vorschrift und der den Mangel ergebenden Tatsache gegenüber der Gemeinde geltend gemacht worden ist (nicht bei Verletzung der Genehmigungsvorschriften; bei Bekanntmachungsfehlern nur, wenn der Inhalt in zumutbarer Weise verlässlich zur Kenntnis genommen werden konnte). Satzungen sind vom Hauptverwaltungsbeamten zu unterzeichnen und öffentlich bekannt zu machen (§ 3 Abs. 3 BbgKVerf).
      Rechtsschutz: Normenkontrolle nach § 47 Abs. 1 Nr. 2 VwGO i. V. m. § 4 Abs. 1 BbgVwGG (Oberverwaltungsgericht),
      daneben Inzidentkontrolle.
  norms:
  - "§ 3 BbgKVerf"
  - "§ 47 VwGO"
  quellen:
  - "Landesgesetze in der amtlichen Fassung (Landesrechtsportal)"
  - "Eigenformulierung Redaktion"
  stand: 2026-10
- slug: bb-kom-anschlusszwang
  type: norm
  front: >-
      Unter welchen Voraussetzungen darf die Gemeinde einen Anschluss- und Benutzungszwang anordnen?
  back: >-
      Der Anschluss- und Benutzungszwang verpflichtet Grundstückseigentümer und Nutzer, ein Grundstück
      an eine gemeindliche Einrichtung anzuschließen und die Einrichtung zu benutzen (etwa
      Wasserversorgung, Abwasser- und Abfallbeseitigung, Straßenreinigung, teils Fernwärme). Er ist
      ein Eingriff in Art. 2 Abs. 1, Art. 12 und Art. 14 GG und bedarf einer gesetzlichen Ermächtigung
      in der Gemeindeordnung, die die Gemeinde durch Satzung ausfüllt. Tatbestand: Gründe des öffentlichen Wohls (§ 12 Abs. 2 S. 1 BbgKVerf), das können auch Gründe des Schutzes der natürlichen Grundlagen des Lebens einschließlich des Klima- oder Ressourcenschutzes sein; Bestehen oder Schaffung einer öffentlichen Einrichtung; Verhältnismäßigkeit. Die Satzung kann Ausnahmen zulassen, insbesondere wenn auf Grundstücken Anlagen mit höherem Umweltstandard betrieben werden (§ 12 Abs. 3 BbgKVerf); aus Gründen der Verhältnismäßigkeit sind Härtefälle zu berücksichtigen. Ein Bürgerentscheid über Satzungen, in denen ein Anschluss- oder Benutzungszwang geregelt werden soll, findet nicht statt (§ 15 Abs. 5 BbgKVerf). Welche Einrichtungen erfasst sind, bestimmt die Satzung im Rahmen der gesetzlichen Ermächtigung.
  norms:
  - "§ 12 BbgKVerf"
  - "Art. 2 Abs. 1 GG"
  - "Art. 12 Abs. 1 GG"
  - "Art. 14 Abs. 1 GG"
  quellen:
  - "Landesgesetze in der amtlichen Fassung (Landesrechtsportal)"
  - "Eigenformulierung Redaktion"
  stand: 2026-10
- slug: bb-kom-aufsicht
  type: streitstand
  front: >-
      Welche Arten der Kommunalaufsicht gibt es, und welchen Rechtsschutz hat die Gemeinde?
  back: >-
      Bei Selbstverwaltungsangelegenheiten besteht nur Rechtsaufsicht (Kommunalaufsicht): Sie hat sicherzustellen, dass die Verwaltung der Gemeinden im Einklang mit den Gesetzen erfolgt (§ 109 BbgKVerf); Kommunalaufsichtsbehörde ist für kreisangehörige Gemeinden der Landrat, für kreisfreie Städte das Innenministerium (§ 110 BbgKVerf). Bei Pflichtaufgaben zur Erfüllung nach Weisung besteht Sonderaufsicht mit Weisungsrechten zur gesetzmäßigen Erfüllung (§ 121 BbgKVerf), bei Auftragsangelegenheiten Fachaufsicht, die sich auf die rechtmäßige und zweckmäßige Wahrnehmung der Aufgaben erstreckt (§ 122 BbgKVerf). Die Aufsichtsmittel der Kommunalaufsicht sind abgestuft: Unterrichtung (§ 112), Beanstandung (§ 113), Aufhebung (§ 114), Anordnung (§ 115), Ersatzvornahme (§ 116) und Bestellung eines Beauftragten (§ 117 BbgKVerf). Rechtsschutz der Gemeinde: Nach h. M. sind Aufsichtsmaßnahmen gegenüber der Gemeinde Verwaltungsakte, weil sie in die Selbstverwaltungsgarantie (Art. 28 Abs. 2 GG) eingreifen; statthaft ist die Anfechtungsklage, die ohne Vorverfahren erhoben werden kann und keine aufschiebende Wirkung hat (§ 119 BbgKVerf). Die früher vertretene Gegenansicht sah in der
      Aufsicht eine Maßnahme im staatlichen Innenbereich ohne Außenwirkung; sie wird wegen der eigenen
      Rechtsstellung der Gemeinde überwiegend abgelehnt.
  norms:
  - "§§ 109 ff. BbgKVerf"
  - "Art. 28 Abs. 2 S. 1 GG"
  quellen:
  - "Landesgesetze in der amtlichen Fassung (Landesrechtsportal)"
  - "Eigenformulierung Redaktion"
  stand: 2026-10
- slug: bb-kom-buergerbegehren
  type: definition
  front: >-
      Wie funktionieren Bürgerbegehren und Bürgerentscheid, und welche Zulässigkeitsprobleme sind
      typisch?
  back: >-
      Mit dem Bürgerbegehren verlangt die Bürgerschaft, dass über eine Angelegenheit, die in der Entscheidungszuständigkeit der Gemeindevertretung oder des Hauptausschusses liegt, ein Bürgerentscheid stattfindet (initiierendes Bürgerbegehren, § 15 Abs. 1 BbgKVerf); es kann sich auch gegen einen Beschluss richten (kassatorisches Bürgerbegehren, § 15 Abs. 4 BbgKVerf, Einreichung innerhalb von acht Wochen nach Veröffentlichung des Beschlusses zuzüglich bestimmter Verfahrenszeiträume). Typische Zulässigkeitsvoraussetzungen: eine mit Ja oder Nein zu beantwortende Frage mit Begründung, Vertrauensperson und Stellvertretung, die von der Gemeindeverwaltung mitgeteilte Kostenschätzung auf den Unterschriftenlisten, ein Unterschriftenquorum (für den Zulässigkeitsantrag das Doppelte der Zahl der Gemeindevertreter, für das Begehren mindestens 10 Prozent der Bürgerinnen und Bürger) und eine Angelegenheit außerhalb des Ausschlusskatalogs des § 15 Abs. 5 BbgKVerf. Ausgeschlossen sind u. a. Pflichtaufgaben zur Erfüllung nach Weisung und Auftragsangelegenheiten, Fragen der inneren Organisation, Rechtsverhältnisse der Gemeindevertreter, des Bürgermeisters und der Bediensteten, die Haushaltssatzung, Gemeindeabgaben und Entgelte, Satzungen über Anschluss- oder Benutzungszwang sowie die Bauleitplanung. Über die Zulässigkeit entscheidet die Kommunalaufsichtsbehörde; gegen ihre Entscheidung können die Vertrauenspersonen unmittelbar die Verwaltungsgerichte anrufen (§ 15 Abs. 2 BbgKVerf). Der Bürgerentscheid ist erfolgreich, wenn die Mehrheit der gültigen Stimmen mindestens 25 Prozent der Stimmberechtigten beträgt (§ 15 Abs. 6 BbgKVerf) und hat die Wirkung eines endgültigen Beschlusses der Gemeindevertretung (§ 15 Abs. 7 BbgKVerf).
  norms:
  - "§ 15 BbgKVerf"
  quellen:
  - "Landesgesetze in der amtlichen Fassung (Landesrechtsportal)"
  - "Eigenformulierung Redaktion"
  stand: 2026-10
- slug: bb-kom-mitwirkung
  type: definition
  front: >-
      Wann gilt ein Mitwirkungsverbot für Mitglieder des Gemeindeorgans, und was folgt aus einem
      Verstoß?
  back: >-
      Ein Mitglied darf an Beratung und Abstimmung nicht teilnehmen, wenn die Entscheidung ihm selbst,
      Angehörigen oder einer von ihm vertretenen Person oder Gesellschaft einen unmittelbaren Vorteil
      oder Nachteil bringen kann. Unmittelbarkeit bedeutet: Die Entscheidung berührt das
      Sonderinteresse des Betroffenen ohne weiteren Vollzugsakt; ein Vorteil, den er mit einer
      Vielzahl von Personen teilt (Gruppeninteresse), genügt regelmäßig nicht. Beispiel: Eigentümer
      eines Grundstücks im Plangebiet bei der Beschlussfassung über den Bebauungsplan. Das betroffene
      Mitglied hat den Verhandlungsraum zu verlassen. Die Mitwirkung eines wegen Befangenheit Betroffenen hat die Rechtswidrigkeit des Beschlusses nur zur Folge, wenn sie für das Abstimmungsergebnis entscheidend war; im Übrigen gilt § 3 Abs. 4 S. 1 BbgKVerf entsprechend (Unbeachtlichkeit nach einem Jahr, wenn der Fehler nicht rechtzeitig gerügt wird) (§ 22 Abs. 6 BbgKVerf). Das Mitwirkungsverbot gilt nicht, wenn der Vorteil oder Nachteil nur darauf beruht, dass jemand einer Berufs- oder Bevölkerungsgruppe angehört, deren gemeinsame Interessen berührt werden (§ 22 Abs. 3 Nr. 1 BbgKVerf).
  norms:
  - "§ 22 BbgKVerf"
  quellen:
  - "Landesgesetze in der amtlichen Fassung (Landesrechtsportal)"
  - "Eigenformulierung Redaktion"
  stand: 2026-10
schemata:
- slug: bb-schema-kom-satzung
  title: "Rechtmäßigkeit einer gemeindlichen Satzung (BbgKVerf)"
  norms:
  - "§ 3 BbgKVerf"
  - "§ 12 BbgKVerf"
  quellen:
  - "Landesgesetze in der amtlichen Fassung (Landesrechtsportal)"
  - "Eigenformulierung Redaktion"
  steps:
  - label: "I. Ermächtigungsgrundlage"
    hinweis: >-
        Allgemeine Satzungsbefugnis genügt nicht für Grundrechtseingriffe; Spezialermächtigung nennen.
  - label: "II. Formelle Rechtmäßigkeit"
    children:
    - label: >-
        1. Zuständigkeit des Gemeindeorgans (Gemeindevertretung) und der Körperschaft (Gemeinde oder
        Amt)
    - label: >-
        2. Verfahren: Beschlussfähigkeit, kein Verstoß gegen Mitwirkungsverbote
    - label: "3. Ausfertigung und Bekanntmachung"
    - label: "4. Unbeachtlichkeits- und Heilungsvorschriften bei Verfahrensfehlern"
      hinweis: "Landesrechtliche Fristen gesondert prüfen."
  - label: "III. Materielle Rechtmäßigkeit"
    children:
    - label: "1. Gründe des öffentlichen Wohls (§ 12 Abs. 2 BbgKVerf)"
      hinweis: >-
          Bei Anschluss- und Benutzungszwang sind die Gründe des öffentlichen Wohls zentral.
    - label: "2. Vereinbarkeit mit höherrangigem Recht, Bestimmtheit"
    - label: "3. Verhältnismäßigkeit, insbesondere Befreiungs- und Härtefallregelung"
    - label: "4. Gleichheitssatz"
faelle:
- slug: bb-fall-kom-anschlusszwang-wasser
  title: "Der Hausbrunnen"
  difficulty: 3
  minutes: 50
  quellen:
  - "Landesgesetze in der amtlichen Fassung (Landesrechtsportal)"
  - "Eigenformulierung Redaktion"
  - "Art. 2 Abs. 1 GG"
  - "Art. 14 Abs. 1 GG"
  facts: >-
      Die amtsfreie Gemeinde G in Brandenburg beschließt durch ihre Gemeindevertretung eine Satzung,
      die für alle Grundstücke im Gemeindegebiet den Anschluss an die gemeindliche Wasserversorgung
      und die Benutzung der Wasserversorgung vorschreibt. Die Satzung ist ordnungsgemäß beschlossen,
      ausgefertigt und öffentlich bekannt gemacht. Sie enthält eine Befreiungsmöglichkeit für Fälle,
      in denen der Anschluss unzumutbar ist oder das Gemeinwohl nicht beeinträchtigt wird. Der
      Grundstückseigentümer E betreibt einen eigenen Brunnen, aus dem er sein Trinkwasser bezieht,
      weil er so Wassergebühren spart. Ein amtliches Gutachten weist in seinem Brunnenwasser einen
      Nitratgehalt über dem zulässigen Grenzwert aus. E beantragt Befreiung vom Anschluss- und
      Benutzungszwang; G lehnt ab und ordnet den Anschluss an.
  question: >-
      Ist die Ablehnung der Befreiung und die Anschlussanordnung der G rechtmäßig? Auf die formelle
      Rechtmäßigkeit der Satzung ist nicht einzugehen.
  steps:
  - prompt: >-
        Welche Ermächtigung trägt die Satzung, und welchen Grundrechtseingriff bewirkt sie?
    erwartung: >-
        Die Ermächtigung folgt aus der Gemeindeordnung (BbgKVerf), die den Anschluss- und
        Benutzungszwang durch Satzung zulässt. Er greift in Art. 2 Abs. 1 GG, Art. 14 Abs. 1 GG (Eigentum am Grundstück) ein und bedarf deshalb einer gesetzlichen
        Ermächtigung.
  - prompt: >-
        Besteht ein öffentliches Bedürfnis für den Anschluss- und Benutzungszwang?
    erwartung: >-
        Ja. Die Sicherung einer einwandfreien Trinkwasserversorgung dient der Volksgesundheit und damit dem öffentlichen Wohl (§ 12 Abs. 2 BbgKVerf). Die Gemeinde darf deshalb für alle Grundstücke den Zwang vorsehen.
  - prompt: "Ist der Zwang verhältnismäßig, und war Befreiung geboten?"
    erwartung: >-
        Der Zwang ist verhältnismäßig: Er ist geeignet, erforderlich und angemessen, weil der Eigenbrunnen die Qualitätsstandards verfehlt. Die Satzung enthält eine Befreiungsregelung für Härtefälle, deren Voraussetzungen E verfehlt: Der Anschluss ist zumutbar, und das Gemeinwohl wäre wegen der Nitratbelastung beeinträchtigt. Das Interesse des E an Gebührenersparnis begründet keinen Härtefall.
  - prompt: "Wie ist das Ergebnis?"
    erwartung: >-
        Die Satzung ist rechtmäßig, die Ablehnung der Befreiung und die Anschlussanordnung sind
        rechtmäßig.
  expectation:
    pruefpunkte:
    - id: p1
      label: >-
          Anschluss- und Benutzungszwang als Satzungsregelung mit spezialgesetzlicher Ermächtigung und
          Grundrechtseingriff erkannt
      weight: 2.0
      required: true
      norms:
      - "Art. 2 Abs. 1 GG"
      - "Art. 14 Abs. 1 GG"
      keywords:
      - "Anschluss- und Benutzungszwang"
      - "Satzungsermächtigung"
      - "Grundrechtseingriff"
      - "Wesentlichkeitstheorie"
      - "Art. 14 Abs. 1 GG"
      card_slugs:
      - "bb-kom-anschlusszwang"
      - "bb-kom-satzung"
    - id: p2
      label: "Gründe des öffentlichen Wohls (Volksgesundheit, § 12 Abs. 2 BbgKVerf) bejaht"
      weight: 3.0
      required: true
      keywords:
      - "öffentliches Bedürfnis"
      - "Volksgesundheit"
      - "Gemeinwohl"
      - "Gesundheitsschutz"
      card_slugs:
      - "bb-kom-anschlusszwang"
    - id: p3
      label: "Verhältnismäßigkeit und Befreiungs- bzw. Härtefallregelung geprüft"
      weight: 2.0
      required: true
      keywords:
      - "Verhältnismäßigkeit"
      - "Befreiungsregelung"
      - "Härtefälle"
