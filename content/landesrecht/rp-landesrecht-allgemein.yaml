cards:
- slug: rp-lra-vwvfg
  type: norm
  front: Welches Verwaltungsverfahrensgesetz gilt fuer Landesbehoerden in Rheinland-Pfalz?
  back: Landesverwaltungsverfahrensgesetz (LVwVfG RP) - Verweisung auf das VwVfG des Bundes. Das VwVfG
    des Bundes gilt nur fuer Bundesbehoerden (§ 1 VwVfG); fuer Landes- und Kommunalbehoerden ist das Landesgesetz
    massgeblich. Bei Verweisungsgesetzen werden die Bundesnormen 'entsprechend' angewendet und sind so
    zu zitieren (z. B. '§ 35 VwVfG i. V. m. § 1 des Landesgesetzes'), bei Vollgesetzen ist die Landesnorm
    selbst zu zitieren.
  norms:
  - Landesverwaltungsverfahrensgesetz (LVwVfG RP) - Verweisung auf das VwVfG des Bundes
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: rp-lra-verfassungsgericht
  type: norm
  front: Gibt es in Rheinland-Pfalz eine Individualverfassungsbeschwerde zum Landesverfassungsgericht?
  back: 'Ja - Art. 130a LV RP. Zustaendiges Gericht: Verfassungsgerichtshof Rheinland-Pfalz auf Grundlage
    der Verfassung fuer Rheinland-Pfalz (LV RP). Verfahrensgegenstand ist nur die Verletzung von Landesgrundrechten
    durch Landesstaatsgewalt; Bundesrecht ist Pruefungsmassstab nur, soweit die Landesverfassung darauf
    verweist. Daneben steht immer die Verfassungsbeschwerde zum BVerfG (Art. 93 Abs. 1 Nr. 4a GG).'
  norms:
  - Verfassung fuer Rheinland-Pfalz (LV RP)
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: rp-lra-kommunalverfassung
  type: norm
  front: Welches Gesetz regelt die Kommunalverfassung in Rheinland-Pfalz und welche Hauptorgane hat die
    Gemeinde?
  back: 'Gemeindeordnung Rheinland-Pfalz (GemO RP): Gemeinderat und Buergermeister; Verbandsgemeinden
    als Besonderheit. Grundlage ist die Selbstverwaltungsgarantie (Art. 28 Abs. 2 GG und Landesverfassung):
    eigenverantwortliche Regelung aller Angelegenheiten der oertlichen Gemeinschaft. Klausurklassiker:
    Zustaendigkeitsstreit zwischen Vertretung und Verwaltungsspitze, Kommunalverfassungsstreit, Rechtsaufsicht.'
  norms:
  - 'Gemeindeordnung Rheinland-Pfalz (GemO RP): Gemeinderat und Buergermeister'
  - Verbandsgemeinden als Besonderheit
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: rp-lra-bauordnung
  type: norm
  front: Wie heisst die Bauordnung in Rheinland-Pfalz und wie ist eine Baugenehmigung zu pruefen?
  back: 'Landesbauordnung Rheinland-Pfalz (LBauO RP). Anspruch auf Baugenehmigung besteht, wenn dem Vorhaben
    keine oeffentlich-rechtlichen Vorschriften entgegenstehen: Genehmigungs-beduerftigkeit (Errichtung,
    Aenderung, Nutzungsaenderung), keine Genehmigungsfreiheit, bauplanungsrechtliche Zulaessigkeit nach
    §§ 29 ff. BauGB (Bundesrecht), bauordnungsrechtliche Zulaessigkeit nach der Landesbauordnung (Abstandsflaechen,
    Gestaltung, Stellplaetze).'
  norms:
  - Landesbauordnung Rheinland-Pfalz (LBauO RP)
  - §§ 29 ff. BauGB
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: rp-lra-pflichtstoff
  type: definition
  front: Welche Landesrechtsgebiete gehoeren in Rheinland-Pfalz zum Pflichtstoff des Oeffentlichen Rechts?
  back: Polizei- und Ordnungsrecht (POG); Kommunalrecht (GemO, Verbandsgemeinden); Bauordnungsrecht (LBauO);
    Landesverfassung. Landesrecht wird im Examen fast nie isoliert, sondern eingebettet in eine verwaltungsprozessuale
    Einkleidung (Anfechtungs-/Verpflichtungsklage, vorlaeufiger Rechtsschutz) geprueft - die Landesnorm
    ist die Ermaechtigungsgrundlage, der Aufbau bleibt der allgemeine.
  norms: []
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
