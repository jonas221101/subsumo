cards:
- slug: rp-lra-vwvfg
  type: norm
  front: Welches Verwaltungsverfahrensgesetz gilt für Landesbehörden in Rheinland-Pfalz?
  back: Landesverwaltungsverfahrensgesetz (LVwVfG RP) - Verweisung auf das VwVfG des Bundes. Das VwVfG
    des Bundes gilt nur für Bundesbehörden (§ 1 VwVfG); für Landes- und Kommunalbehörden ist das Landesgesetz
    maßgeblich. Bei Verweisungsgesetzen werden die Bundesnormen 'entsprechend' angewendet und sind so
    zu zitieren (z. B. '§ 35 VwVfG i. V. m. § 1 des Landesgesetzes'), bei Vollgesetzen ist die Landesnorm
    selbst zu zitieren.
  norms:
  - Landesverwaltungsverfahrensgesetz (LVwVfG RP) - Verweisung auf das VwVfG des Bundes
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: rp-lra-verfassungsgericht
  type: norm
  front: Gibt es in Rheinland-Pfalz eine Individualverfassungsbeschwerde zum Landesverfassungsgericht?
  back: 'Ja - Art. 130a LV RP. Zuständiges Gericht: Verfassungsgerichtshof Rheinland-Pfalz auf Grundlage
    der Verfassung für Rheinland-Pfalz (LV RP). Verfahrensgegenstand ist nur die Verletzung von Landesgrundrechten
    durch Landesstaatsgewalt; Bundesrecht ist Prüfungsmaßstab nur, soweit die Landesverfassung darauf
    verweist. Daneben steht immer die Verfassungsbeschwerde zum BVerfG (Art. 93 Abs. 1 Nr. 4a GG).'
  norms:
  - Verfassung für Rheinland-Pfalz (LV RP)
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: rp-lra-kommunalverfassung
  type: norm
  front: Welches Gesetz regelt die Kommunalverfassung in Rheinland-Pfalz und welche Hauptorgane hat die
    Gemeinde?
  back: 'Gemeindeordnung Rheinland-Pfalz (GemO RP): Gemeinderat und Bürgermeister; Verbandsgemeinden als
    Besonderheit. Grundlage ist die Selbstverwaltungsgarantie (Art. 28 Abs. 2 GG und Landesverfassung):
    eigenverantwortliche Regelung aller Angelegenheiten der örtlichen Gemeinschaft. Klausurklassiker:
    Zuständigkeitsstreit zwischen Vertretung und Verwaltungsspitze, Kommunalverfassungsstreit, Rechtsaufsicht.'
  norms:
  - 'Gemeindeordnung Rheinland-Pfalz (GemO RP): Gemeinderat und Bürgermeister'
  - Verbandsgemeinden als Besonderheit
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: rp-lra-bauordnung
  type: norm
  front: Wie heißt die Bauordnung in Rheinland-Pfalz und wie ist eine Baugenehmigung zu prüfen?
  back: 'Landesbauordnung Rheinland-Pfalz (LBauO RP). Anspruch auf Baugenehmigung besteht, wenn dem Vorhaben
    keine öffentlich-rechtlichen Vorschriften entgegenstehen: Genehmigungsbedürftigkeit (Errichtung, Änderung,
    Nutzungsänderung), keine Genehmigungsfreiheit, bauplanungsrechtliche Zulässigkeit nach §§ 29 ff. BauGB
    (Bundesrecht), bauordnungsrechtliche Zulässigkeit nach der Landesbauordnung (Abstandsflächen, Gestaltung,
    Stellplätze).'
  norms:
  - Landesbauordnung Rheinland-Pfalz (LBauO RP)
  - §§ 29 ff. BauGB
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: rp-lra-pflichtstoff
  type: definition
  front: Welche Landesrechtsgebiete gehören in Rheinland-Pfalz zum Pflichtstoff des Öffentlichen Rechts?
  back: Polizei- und Ordnungsrecht (POG); Kommunalrecht (GemO, Verbandsgemeinden); Bauordnungsrecht (LBauO);
    Landesverfassung. Landesrecht wird im Examen fast nie isoliert, sondern eingebettet in eine verwaltungsprozessuale
    Einkleidung (Anfechtungs-/Verpflichtungsklage, vorläufiger Rechtsschutz) geprüft - die Landesnorm
    ist die Ermächtigungsgrundlage, der Aufbau bleibt der allgemeine.
  norms: []
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
