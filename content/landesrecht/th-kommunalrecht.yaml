faelle:
- slug: th-fall-kom-aufsicht-stadthalle
  title: "Die Stadthalle für eine Partei"
  difficulty: 4
  minutes: 55
  quellen:
  - "Landesgesetze in der amtlichen Fassung (Landesrechtsportal)"
  - "Eigenformulierung Redaktion"
  - "Art. 3 Abs. 1 GG"
  - "§ 5 Abs. 1 PartG"
  facts: >-
      Die Gemeinde G in Thüringen betreibt die Stadthalle als öffentliche Einrichtung und überlässt
      sie nach einer Benutzungssatzung regelmäßig auch Parteien für Veranstaltungen im Vorfeld von
      Wahlen. Der Gemeinderat von G beschließt, die Halle künftig nur noch Partei A zu überlassen,
      weil die Mehrheit im Rat die Partei B ablehnt. B beantragt die Halle für einen
      Informationsabend; der Antrag wird unter Hinweis auf den Beschluss abgelehnt. Das Landratsamt
      als Rechtsaufsichtsbehörde beanstandet den Beschluss des Gemeinderats schriftlich und fordert
      seine Aufhebung. G meint, die Aufsicht habe sich nicht in die Entscheidung über die Vergabe der
      Halle einzumischen, die zum Kernbereich der Selbstverwaltung gehöre.
  question: >-
      Ist die Beanstandung durch das Landratsamt rechtmäßig? Ist G klagebefugt?
  steps:
  - prompt: "Um welche Art von Aufgabe handelt es sich, und welche Aufsicht greift?"
    erwartung: >-
        Der Betrieb der Stadthalle ist eine Selbstverwaltungsaufgabe. Es besteht daher nur
        Rechtsaufsicht: Die Aufsichtsbehörde darf einschreiten, wenn der Gemeinderat gegen Recht
        verstößt, nicht schon bei bloßer Unzweckmäßigkeit.
  - prompt: "Ist der Beschluss rechtswidrig?"
    erwartung: >-
        Ja. Hat die Gemeinde eine Einrichtung nach ihrer Widmung allgemein auch Parteien zur Verfügung
        gestellt, so ist sie nach § 5 Abs. 1 PartG und dem Gleichheitssatz (Art. 3 Abs. 1 GG) zur
        Gleichbehandlung aller Parteien verpflichtet. Ein Ausschluss der Partei B aus Ablehnung ihrer
        politischen Ausrichtung ist sachwidrig.
  - prompt: "Ist die Beanstandung als Aufsichtsmittel ermessensgerecht?"
    erwartung: >-
        Ja. Die Beanstandung ist das mildere, auf den Rechtsverstoß gerichtete Mittel; die
        Aufsichtsbehörde handelt im Rahmen ihres Aufsichtsermessens. Der Einwand der G, die Entscheidung
        gehöre zur Selbstverwaltung, greift nicht, denn Selbstverwaltung besteht nur im Rahmen der
        Gesetze.
  - prompt: "Kann G sich wehren?"
    erwartung: >-
        Ja. Die Beanstandung ist ein Verwaltungsakt, weil sie in die Rechte der Gemeinde aus Art. 28
        Abs. 2 GG eingreift; G kann Anfechtungsklage erheben und ist klagebefugt. Die Klage hätte in der
        Sache keinen Erfolg.
