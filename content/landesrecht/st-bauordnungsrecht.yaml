faelle:
- slug: st-fall-bau-beseitigung-ferienhaus
  title: "Das Blockhaus im Außenbereich"
  difficulty: 4
  minutes: 60
  quellen:
  - "Landesgesetze in der amtlichen Fassung (Landesrechtsportal)"
  - "Eigenformulierung Redaktion"
  - "§ 35 BauGB"
  facts: >-
      A errichtet im Außenbereich einer Gemeinde in Sachsen-Anhalt ohne Baugenehmigung ein 60
      Quadratmeter großes Blockhaus mit Wohnraum, Küche und Terrasse, das er als Ferienhaus nutzen
      will. Das Grundstück liegt in einer Wiese ohne Bebauungsplan, in unmittelbarer Nähe eines
      Landschaftsschutzgebiets. A betreibt weder Land- noch Forstwirtschaft. Die Bauaufsichtsbehörde
      ordnet nach Anhörung die Beseitigung des Blockhauses an. A meint, ein kleines Haus schade
      niemandem; die Behörde solle die Nutzung als Ferienhaus lieber dulden. Ein Bauantrag liegt nicht
      vor.
  question: "Ist die Beseitigungsanordnung rechtmäßig?"
  steps:
  - prompt: >-
        Welche Ermächtigungsgrundlage kommt in Betracht, und welche Voraussetzungen stellt die
        Beseitigungsanordnung?
    erwartung: >-
        Die BauO LSA ermächtigt die Bauaufsichtsbehörde zur Beseitigung rechtswidrig errichteter
        Anlagen. Als schärfste Maßnahme setzt sie grundsätzlich formelle und materielle Illegalität
        voraus.
  - prompt: "Liegt formelle Illegalität vor?"
    erwartung: >-
        Ja. Das Blockhaus mit Wohnraum ist eine genehmigungsbedürftige bauliche Anlage; eine
        Baugenehmigung liegt nicht vor.
  - prompt: "Liegt materielle Illegalität vor?"
    erwartung: >-
        Ja. Planungsrechtlich ist das Vorhaben im Außenbereich nach § 35 BauGB zu beurteilen. Als
        Ferienhaus ist es kein privilegiertes Vorhaben (§ 35 Abs. 1 BauGB); als sonstiges Vorhaben nach
        § 35 Abs. 2 BauGB beeinträchtigt es öffentliche Belange (§ 35 Abs. 3 BauGB), etwa durch die
        Gefahr der Entstehung einer Splittersiedlung und die Beeinträchtigung der Landschaft. Es ist
        nicht genehmigungsfähig.
  - prompt: "Ist die Beseitigung ermessensfehlerfrei und verhältnismäßig?"
    erwartung: >-
        Ja. Die Anordnung ist ermessensfehlerfrei und verhältnismäßig: Eine dauerhafte Duldung würde den rechtswidrigen Zustand verfestigen und die Gleichbehandlung mit rechtstreuen Bauherren verletzen. Auf Bestandsschutz kann sich A nicht berufen, da das Haus nie legal war. Die Beseitigungsanordnung ist rechtmäßig.
  expectation:
