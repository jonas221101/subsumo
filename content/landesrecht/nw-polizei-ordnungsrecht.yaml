cards:
- slug: nw-por-generalklausel
  type: norm
  front: Wo steht die polizeiliche Generalklausel in Nordrhein-Westfalen und was setzt sie voraus?
  back: 'Fundstelle: § 8 Abs. 1 PolG NRW; § 14 Abs. 1 OBG NRW. Die Generalklausel ermächtigt zu den notwendigen
    Maßnahmen, um eine im Einzelfall bestehende Gefahr für die öffentliche Sicherheit oder Ordnung abzuwehren.
    Sie ist subsidiär: Greift eine Standardmaßnahme oder ein Spezialgesetz, geht dieses vor. Auf der Rechtsfolgenseite
    besteht Ermessen, begrenzt durch den Grundsatz der Verhältnismäßigkeit. Zum Schutz privater Rechte
    wird die Gefahrenabwehr nur subsidiär tätig: Ein Einschreiten kommt nur in Betracht, wenn gerichtlicher
    Schutz nicht rechtzeitig zu erlangen ist und ohne die Maßnahme die Vereitelung oder wesentliche Erschwerung
    der Rechtsverwirklichung droht.'
  norms:
  - § 8 Abs. 1 PolG NRW
  - § 14 Abs. 1 OBG NRW
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: nw-por-standardmassnahmen
  type: norm
  front: Wo stehen die polizeilichen Standardmaßnahmen in Nordrhein-Westfalen?
  back: '§§ 9 ff. PolG NRW - unter anderem Identitätsfeststellung, Platzverweis, Gewahrsam, Durchsuchung
    von Personen und Sachen, Sicherstellung. Standardmaßnahmen sind abschließende Spezialregelungen: Liegen
    ihre Voraussetzungen nicht vor, darf nicht auf die Generalklausel ausgewichen werden (Sperrwirkung).'
  norms:
  - §§ 9 ff. PolG NRW
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: nw-por-aufbau
  type: schema_step
  front: 'Aufbau: Rechtmäßigkeit einer Gefahrenabwehrmaßnahme nach dem Landesrecht von Nordrhein-Westfalen'
  back: 'I. Ermächtigungsgrundlage (Polizeigesetz NRW (PolG NRW) und Ordnungsbehördengesetz NRW (OBG NRW):
    Standardmaßnahme vor Generalklausel). II. Formelle Rechtmäßigkeit: 1. Zuständigkeit (sachlich: welche
    Behörde - Ordnungsbehörden primär (§ 1 OBG NRW), Polizei nur bei Eilbedürftigkeit (§ 1 Abs. 1 Satz
    3 PolG NRW); örtlich; instanziell), 2. Verfahren (Anhörung nach § 28 VwVfG NRW), 3. Form. III. Materielle
    Rechtmäßigkeit: 1. Tatbestand (Schutzgut, Gefahrbegriff, Gefahrenprognose ex ante), 2. richtiger Adressat
    (Störer: §§ 4, 5, 6 PolG NRW; §§ 17, 18, 19 OBG NRW), 3. Rechtsfolge: Ermessen und Verhältnismäßigkeit
    (geeignet, erforderlich, angemessen).'
  norms:
  - § 8 Abs. 1 PolG NRW
  - § 14 Abs. 1 OBG NRW
  - §§ 4, 5, 6 PolG NRW
  - §§ 17, 18, 19 OBG NRW
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: nw-por-stoerer
  type: norm
  front: Wo sind Verhaltensstörer, Zustandsstörer und Nichtstörer in Nordrhein-Westfalen geregelt?
  back: '§§ 4, 5, 6 PolG NRW; §§ 17, 18, 19 OBG NRW. Verhaltensstörer: wer die Gefahr durch sein Verhalten
    verursacht (Theorie der unmittelbaren Verursachung; Zweckveranlasser als Streitfrage). Zustandsstörer:
    Inhaber der tatsächlichen Gewalt bzw. Eigentümer einer gefährlichen Sache. Nichtstörer: Inanspruchnahme
    nur unter den engen Voraussetzungen des polizeilichen Notstands (gegenwärtige erhebliche Gefahr, Störer
    nicht greifbar, Behörde selbst nicht in der Lage), mit Entschädigungsanspruch.'
  norms:
  - §§ 4, 5, 6 PolG NRW
  - §§ 17, 18, 19 OBG NRW
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: nw-por-zustaendigkeit
  type: definition
  front: Wer ist in Nordrhein-Westfalen für die Gefahrenabwehr zuständig - Ordnungs-/Sicherheitsbehörde
    oder Polizei?
  back: 'Ordnungsbehörden primär (§ 1 OBG NRW), Polizei nur bei Eilbedürftigkeit (§ 1 Abs. 1 Satz 3 PolG
    NRW). Prüfungsrelevant ist die Abgrenzung: Die allgemeine Gefahrenabwehr liegt grundsätzlich bei den
    Verwaltungs-/Ordnungsbehörden; der Polizeivollzugsdienst wird tätig, wenn die Abwehr keinen Aufschub
    duldet (Eilfall) oder eine besondere Zuweisung besteht. Ein Handeln der unzuständigen Behörde macht
    die Maßnahme formell rechtswidrig.'
  norms:
  - Polizeigesetz NRW (PolG NRW) und Ordnungsbehördengesetz NRW (OBG NRW)
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: nw-por-vollstreckung
  type: norm
  front: Nach welchem Gesetz wird eine Gefahrenabwehrverfügung in Nordrhein-Westfalen vollstreckt?
  back: 'Verwaltungsvollstreckungsgesetz NRW (VwVG NRW), §§ 55 ff. Regelfall ist das gestreckte Verfahren:
    Grundverfügung - Androhung - Festsetzung - Anwendung des Zwangsmittels (Ersatzvornahme, Zwangsgeld,
    unmittelbarer Zwang). Bei Gefahr im Verzug sind Sofortvollzug bzw. unmittelbare Ausführung ohne vorausgehenden
    Verwaltungsakt möglich; die Kosten trägt der Pflichtige.'
  norms:
  - Verwaltungsvollstreckungsgesetz NRW (VwVG NRW), §§ 55 ff.
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
