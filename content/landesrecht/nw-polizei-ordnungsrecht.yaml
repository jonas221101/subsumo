cards:
- slug: nw-por-generalklausel
  type: norm
  front: Wo steht die polizeiliche Generalklausel in Nordrhein-Westfalen und was setzt sie voraus?
  back: 'Fundstelle: § 8 Abs. 1 PolG NRW; § 14 Abs. 1 OBG NRW. Die Generalklausel ermaechtigt zu den notwendigen
    Massnahmen, um eine im Einzelfall bestehende Gefahr fuer die oeffentliche Sicherheit oder Ordnung
    abzuwehren. Sie ist subsidiaer: Greift eine Standardmassnahme oder ein Spezialgesetz, geht dieses
    vor. Auf der Rechtsfolgenseite besteht Ermessen, begrenzt durch den Grundsatz der Verhaeltnismaessigkeit.'
  norms:
  - § 8 Abs. 1 PolG NRW
  - § 14 Abs. 1 OBG NRW
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: nw-por-standardmassnahmen
  type: norm
  front: Wo stehen die polizeilichen Standardmassnahmen in Nordrhein-Westfalen?
  back: '§§ 9 ff. PolG NRW - unter anderem Identitaetsfeststellung, Platzverweis, Gewahrsam, Durchsuchung
    von Personen und Sachen, Sicherstellung. Standardmassnahmen sind abschliessende Spezialregelungen:
    Liegen ihre Voraussetzungen nicht vor, darf nicht auf die Generalklausel ausgewichen werden (Sperrwirkung).'
  norms:
  - §§ 9 ff. PolG NRW
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: nw-por-aufbau
  type: schema_step
  front: 'Aufbau: Rechtmaessigkeit einer Gefahrenabwehrmassnahme nach dem Landesrecht von Nordrhein-Westfalen'
  back: 'I. Ermaechtigungsgrundlage (Polizeigesetz NRW (PolG NRW) und Ordnungsbehoerdengesetz NRW (OBG
    NRW): Standardmassnahme vor Generalklausel). II. Formelle Rechtmaessigkeit: 1. Zustaendigkeit (sachlich:
    welche Behoerde - Ordnungsbehoerden primaer (§ 1 OBG NRW), Polizei nur bei Eilbeduerftigkeit (§ 1
    Abs. 1 Satz 3 PolG NRW); oertlich; instanziell), 2. Verfahren (Anhoerung, § 28 VwVfG bzw. Landesrecht),
    3. Form. III. Materielle Rechtmaessigkeit: 1. Tatbestand (Schutzgut, Gefahrbegriff, Gefahrenprognose
    ex ante), 2. richtiger Adressat (Stoerer: §§ 4, 5, 6 PolG NRW; §§ 17, 18, 19 OBG NRW), 3. Rechtsfolge:
    Ermessen und Verhaeltnismaessigkeit (geeignet, erforderlich, angemessen).'
  norms:
  - § 8 Abs. 1 PolG NRW
  - § 14 Abs. 1 OBG NRW
  - §§ 4, 5, 6 PolG NRW
  - §§ 17, 18, 19 OBG NRW
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: nw-por-stoerer
  type: norm
  front: Wo sind Verhaltensstoerer, Zustandsstoerer und Nichtstoerer in Nordrhein-Westfalen geregelt?
  back: '§§ 4, 5, 6 PolG NRW; §§ 17, 18, 19 OBG NRW. Verhaltensstoerer: wer die Gefahr durch sein Verhalten
    verursacht (Theorie der unmittelbaren Verursachung; Zweckveranlasser als Streitfrage). Zustandsstoerer:
    Inhaber der tatsaechlichen Gewalt bzw. Eigentuemer einer gefaehrlichen Sache. Nichtstoerer: Inanspruchnahme
    nur unter den engen Voraussetzungen des polizeilichen Notstands (gegenwaertige erhebliche Gefahr,
    Stoerer nicht greifbar, Behoerde selbst nicht in der Lage), mit Entschaedigungsanspruch.'
  norms:
  - §§ 4, 5, 6 PolG NRW
  - §§ 17, 18, 19 OBG NRW
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: nw-por-zustaendigkeit
  type: definition
  front: Wer ist in Nordrhein-Westfalen fuer die Gefahrenabwehr zustaendig - Ordnungs-/Sicherheitsbehoerde
    oder Polizei?
  back: 'Ordnungsbehoerden primaer (§ 1 OBG NRW), Polizei nur bei Eilbeduerftigkeit (§ 1 Abs. 1 Satz 3
    PolG NRW). Pruefungsrelevant ist die Abgrenzung: Die allgemeine Gefahrenabwehr liegt grundsaetzlich
    bei den Verwaltungs-/Ordnungsbehoerden; der Polizeivollzugsdienst wird taetig, wenn die Abwehr keinen
    Aufschub duldet (Eilfall) oder eine besondere Zuweisung besteht. Ein Handeln der unzustaendigen Behoerde
    macht die Massnahme formell rechtswidrig.'
  norms:
  - Polizeigesetz NRW (PolG NRW) und Ordnungsbehoerdengesetz NRW (OBG NRW)
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: nw-por-vollstreckung
  type: norm
  front: Nach welchem Gesetz wird eine Gefahrenabwehrverfuegung in Nordrhein-Westfalen vollstreckt?
  back: 'Verwaltungsvollstreckungsgesetz NRW (VwVG NRW), §§ 55 ff.. Regelfall ist das gestreckte Verfahren:
    Grundverfuegung - Androhung - Festsetzung - Anwendung des Zwangsmittels (Ersatzvornahme, Zwangsgeld,
    unmittelbarer Zwang). Bei Gefahr im Verzug sind Sofortvollzug bzw. unmittelbare Ausfuehrung ohne vorausgehenden
    Verwaltungsakt moeglich; die Kosten traegt der Pflichtige.'
  norms:
  - Verwaltungsvollstreckungsgesetz NRW (VwVG NRW), §§ 55 ff.
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
