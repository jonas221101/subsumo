cards:
- slug: hh-lra-vwvfg
  type: norm
  front: Welches Verwaltungsverfahrensgesetz gilt fuer Landesbehoerden in Hamburg?
  back: Hamburgisches Verwaltungsverfahrensgesetz (HmbVwVfG) - Vollgesetz. Das VwVfG des Bundes gilt nur
    fuer Bundesbehoerden (§ 1 VwVfG); fuer Landes- und Kommunalbehoerden ist das Landesgesetz massgeblich.
    Bei Verweisungsgesetzen werden die Bundesnormen 'entsprechend' angewendet und sind so zu zitieren
    (z. B. '§ 35 VwVfG i. V. m. § 1 des Landesgesetzes'), bei Vollgesetzen ist die Landesnorm selbst zu
    zitieren.
  norms:
  - Hamburgisches Verwaltungsverfahrensgesetz (HmbVwVfG) - Vollgesetz
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: hh-lra-verfassungsgericht
  type: norm
  front: Gibt es in Hamburg eine Individualverfassungsbeschwerde zum Landesverfassungsgericht?
  back: 'Nein - keine Individualverfassungsbeschwerde zum Hamburgischen Verfassungsgericht. Zustaendiges
    Gericht: Hamburgisches Verfassungsgericht auf Grundlage der Verfassung der Freien und Hansestadt Hamburg
    (HV). Verfahrensgegenstand ist nur die Verletzung von Landesgrundrechten durch Landesstaatsgewalt;
    Bundesrecht ist Pruefungsmassstab nur, soweit die Landesverfassung darauf verweist. Daneben steht
    immer die Verfassungsbeschwerde zum BVerfG (Art. 93 Abs. 1 Nr. 4a GG).'
  norms:
  - Verfassung der Freien und Hansestadt Hamburg (HV)
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: hh-lra-kommunalverfassung
  type: norm
  front: Welches Gesetz regelt die Kommunalverfassung in Hamburg und welche Hauptorgane hat die Gemeinde?
  back: 'Keine Gemeinden - Bezirksverwaltung nach dem Bezirksverwaltungsgesetz (BezVG). Grundlage ist
    die Selbstverwaltungsgarantie (Art. 28 Abs. 2 GG und Landesverfassung): eigenverantwortliche Regelung
    aller Angelegenheiten der oertlichen Gemeinschaft. Klausurklassiker: Zustaendigkeitsstreit zwischen
    Vertretung und Verwaltungsspitze, Kommunalverfassungsstreit, Rechtsaufsicht.'
  norms:
  - Keine Gemeinden - Bezirksverwaltung nach dem Bezirksverwaltungsgesetz (BezVG)
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: hh-lra-bauordnung
  type: norm
  front: Wie heisst die Bauordnung in Hamburg und wie ist eine Baugenehmigung zu pruefen?
  back: 'Hamburgische Bauordnung (HBauO). Anspruch auf Baugenehmigung besteht, wenn dem Vorhaben keine
    oeffentlich-rechtlichen Vorschriften entgegenstehen: Genehmigungs-beduerftigkeit (Errichtung, Aenderung,
    Nutzungsaenderung), keine Genehmigungsfreiheit, bauplanungsrechtliche Zulaessigkeit nach §§ 29 ff.
    BauGB (Bundesrecht), bauordnungsrechtliche Zulaessigkeit nach der Landesbauordnung (Abstandsflaechen,
    Gestaltung, Stellplaetze).'
  norms:
  - Hamburgische Bauordnung (HBauO)
  - §§ 29 ff. BauGB
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: hh-lra-pflichtstoff
  type: definition
  front: Welche Landesrechtsgebiete gehoeren in Hamburg zum Pflichtstoff des Oeffentlichen Rechts?
  back: Ordnungsrecht (SOG HH); Bezirksverwaltung; Bauordnungsrecht (HBauO). Landesrecht wird im Examen
    fast nie isoliert, sondern eingebettet in eine verwaltungsprozessuale Einkleidung (Anfechtungs-/Verpflichtungsklage,
    vorlaeufiger Rechtsschutz) geprueft - die Landesnorm ist die Ermaechtigungsgrundlage, der Aufbau bleibt
    der allgemeine.
  norms: []
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
