faelle:
- slug: bb-fall-bau-nachbarwiderspruch
  title: "Der Widerspruch des Nachbarn"
  difficulty: 3
  minutes: 50
  quellen:
  - "Landesgesetze in der amtlichen Fassung (Landesrechtsportal)"
  - "Eigenformulierung Redaktion"
  - "§ 212a Abs. 1 BauGB"
  facts: >-
      Bauherr B erhält von der Bauaufsichtsbehörde in Brandenburg eine Baugenehmigung für ein
      viergeschossiges Wohnhaus in geringem Abstand zur Grenze des Grundstücks des N. Nach den
      eingereichten Plänen unterschreitet das Gebäude die erforderliche Abstandsfläche zum Grundstück
      des N um 1,50 Meter; eine Abweichung wurde nicht beantragt und nicht erteilt. N legt Widerspruch
      gegen die Baugenehmigung ein. B beginnt trotzdem unverzüglich mit den Bauarbeiten. N möchte
      verhindern, dass vollendete Tatsachen geschaffen werden.
  question: >-
      Hat der Widerspruch des N aufschiebende Wirkung? Welchen vorläufigen Rechtsschutz kann N
      erlangen, und hat er Aussicht auf Erfolg?
  steps:
  - prompt: "Hat der Widerspruch aufschiebende Wirkung?"
    erwartung: >-
        Nein. Nach § 212a Abs. 1 BauGB haben Widerspruch und Anfechtungsklage eines Dritten gegen die
        bauaufsichtliche Zulassung eines Vorhabens keine aufschiebende Wirkung. Der Bauherr darf bauen.
  - prompt: "Welcher Antrag ist statthaft?"
    erwartung: >-
        N kann beim Verwaltungsgericht beantragen, die aufschiebende Wirkung seines Widerspruchs
        anzuordnen, § 80a Abs. 3 i. V. m. § 80 Abs. 5 S. 1 VwGO. Er ist als Dritter antragsbefugt, weil
        eine Verletzung nachbarschützender Rechte möglich erscheint.
  - prompt: >-
        Ist die Baugenehmigung rechtswidrig und verletzt sie den N in eigenen Rechten?
    erwartung: >-
        Ja. Das Vorhaben unterschreitet die erforderliche Abstandsfläche; die Genehmigung verstößt gegen
        das Abstandsflächenrecht der BbgBO, ohne dass eine Abweichung erteilt wurde. Das
        Abstandsflächenrecht ist nachbarschützend, N ist daher in eigenen Rechten verletzt
        (Schutznormtheorie).
  - prompt: "Wie fällt die Interessenabwägung aus?"
    erwartung: >-
        Weil die Hauptsache voraussichtlich Erfolg hat, überwiegt das Aussetzungsinteresse des N das
        Vollzugsinteresse des B; der Antrag hat Aussicht auf Erfolg.
  expectation:
    pruefpunkte:
    - id: p1
      label: "Fehlende aufschiebende Wirkung nach § 212a Abs. 1 BauGB erkannt"
      weight: 2.5
      required: true
      norms:
      - "§ 212a Abs. 1 BauGB"
      keywords:
      - "§ 212a Abs. 1 BauGB"
      - "keine aufschiebende Wirkung"
      - "Drittwiderspruch"
      - "Nachbarwiderspruch"
      - "Baugenehmigung eines Dritten"
      card_slugs:
      - "bb-bau-nachbarschutz"
    - id: p2
      label: "Statthafter Eilantrag nach § 80a Abs. 3 i. V. m. § 80 Abs. 5 VwGO"
      weight: 2.5
      required: true
      norms:
      - "§ 80a Abs. 3 VwGO"
      - "§ 80 Abs. 5 VwGO"
      keywords:
      - "§ 80a Abs. 3 VwGO"
      - "§ 80 Abs. 5 VwGO"
      - "Anordnung der aufschiebenden Wirkung"
      - "einstweiliger Rechtsschutz"
      - "Antrag auf Anordnung"
      card_slugs:
      - "bb-bau-nachbarschutz"
    - id: p3
      label: >-
          Abstandsflächenrecht als nachbarschützende Norm; Rechtsverletzung des N
      weight: 2.5
      required: true
      norms:
      - "§ 6 BbgBO"
      keywords:
      - "Abstandsflächen"
      - "nachbarschützend"
      - "Schutznormtheorie"
