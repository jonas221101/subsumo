  - label: "IV. Entscheidung über die Zulässigkeit und Rechtsschutz"
faelle:
- slug: st-fall-kom-buergerbegehren-haushalt
  title: "Das Bürgerbegehren gegen den Haushalt"
  difficulty: 3
  minutes: 40
  quellen:
  - "Landesgesetze in der amtlichen Fassung (Landesrechtsportal)"
  - "Eigenformulierung Redaktion"
  facts: >-
      In einer Gemeinde in Sachsen-Anhalt beschließt der Gemeinderat die Haushaltssatzung für das
      kommende Jahr, die erhebliche Kürzungen bei der Stadtbibliothek vorsieht. Eine Bürgerinitiative
      sammelt Unterschriften für ein Bürgerbegehren mit der Frage: „Sind Sie dafür, dass die
      Haushaltssatzung des kommenden Jahres aufgehoben und die Kürzungen bei der Stadtbibliothek
      zurückgenommen werden?“ Die Unterschriften werden fristgerecht eingereicht, das Quorum ist
      erreicht, die Frage ist mit Ja oder Nein zu beantworten und begründet. Die Kostenschätzung der Gemeinde ist in das Begehren aufgenommen. Der Gemeinderat lehnt die Zulassung des Bürgerbegehrens ab.
  question: >-
      Ist die Ablehnung rechtmäßig? Maßgeblich ist § 26 KVG LSA, der unter anderem die Haushaltssatzung und die kommunalen Abgaben als Gegenstand eines Bürgerbegehrens ausschließt (Abs. 2 S. 2 Nr. 3).
  steps:
  - prompt: "Wer entscheidet über die Zulässigkeit, und was wird geprüft?"
    erwartung: >-
        Der Gemeinderat entscheidet über die Zulässigkeit. Geprüft werden Gegenstand, Form und Inhalt, Quorum, Frist und Kostenschätzung.
  - prompt: "Sind Form, Quorum und Frist gewahrt?"
    erwartung: >-
        Ja. Frage, Begründung, Kostenschätzung, Unterschriftenquorum und Frist sind laut
        Sachverhalt erfüllt. An diesen Voraussetzungen scheitert das Begehren nicht.
  - prompt: "Ist der Gegenstand zulässig?"
    erwartung: >-
        Nein. Das Begehren richtet sich ausdrücklich gegen die Haushaltssatzung. Diese fällt in den
        Ausschlusskatalog des § 26 Abs. 2 S. 2 Nr. 3 KVG LSA, der das Haushaltsrecht des Rates vor Bürgerentscheiden
        schützt. Dass die Initiative nur die Kürzung der Bibliothek erreichen will, ändert nichts, weil
        das Begehren die Aufhebung der Haushaltssatzung verlangt.
  - prompt: "Ergebnis und Rechtsschutz?"
    erwartung: >-
        Das Bürgerbegehren ist unzulässig, die Ablehnung rechtmäßig. Die Initiatoren könnten die
        Entscheidung vor dem Verwaltungsgericht angreifen; die Klage hätte keinen Erfolg.
  expectation:
    pruefpunkte:
