cards:
- slug: bw-bau-verfahren
  type: norm
  front: Welche Verfahrensarten kennt die LBO BW?
  back: >-
    Die LBO BW unterscheidet verfahrensfreie Vorhaben (§ 50 LBO BW mit Anhang), das Kenntnisgabeverfahren (§ 51 LBO BW; u. a. Wohngebäude und sonstige Gebäude der Gebäudeklassen 1 bis 3 außer Gaststätten, bei Vorliegen der Voraussetzungen des § 51 Abs. 2 LBO BW, insbesondere planungsrechtlicher Art),
    das vereinfachte Baugenehmigungsverfahren (§ 52 LBO BW) und das reguläre Baugenehmigungsverfahren.
    Auch verfahrensfreie Vorhaben müssen dem materiellen Recht genügen (§ 50 Abs. 5 LBO BW); sie sind
    nur von der Pflicht zur Durchführung eines Genehmigungsverfahrens befreit. Im vereinfachten Verfahren prüft die Baurechtsbehörde die Übereinstimmung mit dem Bauplanungsrecht (§§ 14 und 29 bis 38 BauGB), mit den Abstandsflächenvorschriften der §§ 5 bis 7 LBO BW und mit bestimmten anderen öffentlich-rechtlichen Vorschriften außerhalb der LBO (§ 52 Abs. 2 LBO BW); die übrigen bauordnungsrechtlichen Vorschriften sind nicht Prüfgegenstand. Die Baugenehmigung ist zu erteilen, wenn dem
    Vorhaben keine öffentlich-rechtlichen Vorschriften entgegenstehen (§ 58 Abs. 1 LBO BW).
  norms:
  - § 49 LBO BW
  - § 50 LBO BW
  - § 51 LBO BW
  - § 52 LBO BW
  - § 58 Abs. 1 LBO BW
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-10
- slug: bw-bau-genehmigungspflicht
  type: definition
  front: >-
    Wann ist ein Vorhaben genehmigungspflichtig, und welche Rolle spielt der Begriff der baulichen Anlage?
  back: >-
    Die Errichtung und der Abbruch baulicher Anlagen sowie der in § 50 aufgeführten anderen Anlagen und Einrichtungen bedürfen der Baugenehmigung, soweit in §§ 50, 51, 69 oder 70 LBO BW nichts anderes bestimmt ist (§ 49 LBO BW). Eine bauliche Anlage
    ist eine mit dem Erdboden verbundene, aus Bauprodukten hergestellte Anlage; als solche gelten auch
    bestimmte aufgeschüttete und ähnliche Anlagen. Entscheidend ist die Prüfung in zwei Schritten: Anlage
    im Sinn der LBO BW, dann Verfahrensfreiheit nach dem Anhang zu § 50 LBO BW. Eine Nutzungsänderung ist nach § 50 Abs. 2 LBO BW verfahrensfrei, wenn für die neue Nutzung keine anderen oder weitergehenden Anforderungen gelten als für die bisherige Nutzung oder wenn dadurch Wohnraum im Innenbereich geschaffen wird; andernfalls bedarf sie der Genehmigung. Das materielle Bauplanungsrecht (§§ 29 ff. BauGB) ist über die Prüfung nach § 58 LBO BW Bestandteil
    der Genehmigung.
  norms:
  - § 49 LBO BW
  - § 50 LBO BW
  - §§ 29 ff. BauGB
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-10
- slug: bw-bau-genehmigung
  type: definition
  front: Welche Wirkungen hat eine Baugenehmigung?
  back: >-
    Die Baugenehmigung ist ein feststellender Verwaltungsakt mit Verfügungselement: Sie stellt fest, dass
    dem Vorhaben keine öffentlich-rechtlichen Vorschriften entgegenstehen, und gestattet die Ausführung
    (Bauschein). Sie ergeht unbeschadet der privaten Rechte Dritter (Grundsatz der Baufreiheit mit Vorbehalt
    von Rechten Dritter). Sie vermittelt einen Anspruch auf Erteilung, wenn das Vorhaben genehmigungsfähig
    ist (gebundene Entscheidung, Art. 14 Abs. 1 GG). Die Genehmigung gewährt Bestandsschutz im Rahmen
    des Genehmigungsinhalts. Eine Verletzung von Rechten Dritter macht sie nur dann rechtswidrig mit Folge
    der Aufhebung durch Drittanfechtung, wenn die verletzte Norm Nachbarschutz vermittelt.
  norms:
  - § 58 LBO BW
  - Art. 14 Abs. 1 GG
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-10
- slug: bw-bau-abstandsflaechen
  type: norm
  front: Wie werden Abstandsflächen nach der LBO BW bemessen?
  back: >-
    Vor den Außenwänden von Gebäuden sind Abstandsflächen von oberirdischen Gebäuden freizuhalten (§ 5
    LBO BW). Die Tiefe bemisst sich nach der Wandhöhe: allgemein 0,4 der Wandhöhe, in Kern-, Dorf-, urbanen und einigen weiteren Gebieten 0,2 und in Gewerbe- und Industriegebieten 0,125; sie darf 2,5 m, bei Wänden bis 5 m Breite 2 m, nicht unterschreiten (§ 5 Abs. 7 LBO BW). Die Abstandsflächen müssen auf dem Grundstück selbst liegen und dürfen sich nicht
    überdecken (Ausnahmen bestehen für zulässige Grenzbebauung). Sie dienen Belichtung, Belüftung, Brandschutz
    und Wahrung des Wohnfriedens. Abweichungen sind nach § 56 LBO BW unter Würdigung der nachbarlichen
    Interessen möglich. Die Vorschriften sind nachbarschützend, soweit sie dem Schutz des Nachbargrundstücks
    dienen.
  norms:
  - § 5 LBO BW
  - § 5 Abs. 7 LBO BW
  - § 56 LBO BW
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-10
- slug: bw-bau-nachbarbeteiligung
  type: norm
  front: Wie werden Nachbarn am Baugenehmigungsverfahren beteiligt?
  back: >-
    Soll eine Abweichung, Ausnahme oder Befreiung von nachbarschützenden Vorschriften erteilt werden, benachrichtigt die Gemeinde auf Veranlassung der Baurechtsbehörde die Angrenzer innerhalb von fünf Arbeitstagen ab Eingang der vollständigen Bauvorlagen (§ 55 Abs. 1 LBO BW); sonst ist keine Benachrichtigung vorgesehen. Einwendungen sind innerhalb von zwei Wochen nach Zustellung oder Bekanntgabe der Benachrichtigung vorzubringen; nicht fristgemäß geltend gemachte Einwendungen sind ausgeschlossen (materielle Präklusion, § 55 Abs. 2 LBO BW). Die Benachrichtigung entfällt bei Angrenzern, die in Textform zugestimmt oder die Bauvorlagen unterschrieben haben (§ 55 Abs. 1 S. 2 LBO BW). Die Baugenehmigung ist Angrenzern zuzustellen, deren Einwendungen nicht entsprochen wird oder deren geschützte Belange berührt sein können (§ 58 Abs. 1 LBO BW). Verletzt die Behörde die Beteiligungsvorschriften, führt das nicht für sich allein zur Aufhebung der Genehmigung; entscheidend ist die materielle Verletzung drittschützender Normen.
  norms:
  - § 55 LBO BW
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-10
- slug: bw-bau-nachbarschutz
  type: definition
  front: Wann kann ein Nachbar eine Baugenehmigung erfolgreich anfechten?
  back: >-
    Die Nachbarklage ist begründet, wenn die Baugenehmigung rechtswidrig ist und den Nachbarn in seinen
    Rechten verletzt (§ 113 Abs. 1 S. 1 VwGO). Maßgeblich ist die Schutznormtheorie: Nur die Verletzung
    nachbarschützender Normen führt zur Aufhebung. Nachbarschützend sind insbesondere die Vorschriften
    über Abstandsflächen, der Gebietserhaltungsanspruch (Festsetzung der Baugebietsart nach §§ 2 ff. BauNVO)
    und das Gebot der Rücksichtnahme (§ 15 Abs. 1 BauNVO) bzw. bei § 34 BauGB das Einfügungsgebot als
    Rücksichtnahmegebot. Nicht ausreichend ist ein reiner Verstoß gegen objektives Recht. Nach § 212a
    Abs. 1 BauGB haben Widerspruch und Anfechtungsklage des Nachbarn keine aufschiebende Wirkung; vorläufiger
    Rechtsschutz richtet sich nach § 80a, § 80 Abs. 5 VwGO.
  norms:
  - § 113 Abs. 1 S. 1 VwGO
  - § 212a Abs. 1 BauGB
  - § 80a VwGO
  - § 15 BauNVO
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-10
- slug: bw-bau-einstellung
  type: norm
  front: >-
    Welche bauaufsichtlichen Maßnahmen gibt es bei rechtswidrigen Vorhaben?
  back: >-
    Die Baurechtsbehörde kann bei formeller oder materieller Rechtswidrigkeit einschreiten: Baueinstellung
    (§ 64 LBO BW) bei Bau ohne erforderliche Genehmigung, Abbruchsanordnung und Nutzungsuntersagung (§
    65 LBO BW) bei Vorhaben, die gegen öffentlich-rechtliche Vorschriften verstoßen. Eine Baueinstellung
    ist schon bei formeller Illegalität zulässig, weil sie nur vorläufig ist. Der Abbruch setzt nach h.
    M. materielle Illegalität voraus, weil sonst ein Genehmigungsverfahren nachzuholen wäre; deshalb muss
    die Behörde prüfen, ob der Bau genehmigungsfähig ist. Das Ermessen ist durch die Verhältnismäßigkeit
    und den Gleichheitssatz begrenzt (keine Anordnung "nach Kassenlage"). Adressat ist der Verantwortliche
    (Bauherr, Eigentümer).
  norms:
  - § 64 LBO BW
  - § 65 LBO BW
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-10
- slug: bw-bau-abbruch
  type: streitstand
  front: Reicht formelle Illegalität für eine Abbruchsanordnung aus?
  back: >-
    Die h. M. verlangt für den Abbruch einer baulichen Anlage formelle und materielle Illegalität. Ein
    Gebäude, das zwar ohne Genehmigung errichtet wurde, aber genehmigungsfähig wäre, darf nicht abgerissen
    werden: Der Abbruch wäre unverhältnismäßig, weil ein milderes Mittel (Aufforderung zum Bauantrag)
    zur Verfügung steht und nach Genehmigung die Rechtmäßigkeit hergestellt wird. Teilweise wird die formelle
    Illegalität als hinreichender Eingriffsgrund angesehen, mit dem Argument, das Genehmigungsverfahren
    dürfe nicht umgangen werden (Vollzugsargument). Dem folgt die Rechtsprechung nur für vorläufige Maßnahmen
    wie Baueinstellung und eingeschränkt für die Nutzungsuntersagung. Entscheidend sind Verhältnismäßigkeit
    und Gleichbehandlung.
  norms:
  - § 65 LBO BW
  - Art. 14 Abs. 1 GG
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-10
- slug: bw-bau-aufbau
  type: schema_step
  front: 'Aufbau: Nachbarklage gegen eine Baugenehmigung'
  back: >-
    A. Zulässigkeit: Verwaltungsrechtsweg § 40 Abs. 1 VwGO, Anfechtungsklage § 42 Abs. 1 Var. 1 VwGO,
    Klagebefugnis (§ 42 Abs. 2 VwGO; Schutznormtheorie), Widerspruchsverfahren, Frist. B. Begründetheit:
    1. Baugenehmigung rechtswidrig (Genehmigungsfähigkeit nach LBO, BauGB), 2. Verletzung nachbarschützender
    Vorschriften, 3. Rechtsverletzung des Nachbarn (§ 113 Abs. 1 S. 1 VwGO).
  norms:
  - § 42 Abs. 2 VwGO
  - § 113 Abs. 1 S. 1 VwGO
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-10
