faelle:
- slug: bw-fall-bau-abstandsflaeche
  title: Der zu nahe Anbau
  difficulty: 3
  minutes: 50
  quellen:
  - Eigener Sachverhalt der Redaktion
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  facts: >-
    B erhält im vereinfachten Baugenehmigungsverfahren eine Baugenehmigung für den Anbau eines Wohnhauses
    mit einer Wandhöhe von 9 m, dessen Außenwand 2,5 m von der Grenze zum Grundstück des Nachbarn N entfernt liegt. Die Baurechtsbehörde hat in der Genehmigung die Einhaltung der Abstandsflächen ausdrücklich bejaht; eine Abweichung wurde nicht beantragt oder erteilt. Der Bebauungsplan setzt allgemeines Wohngebiet
    fest; das Vorhaben entspricht den planungsrechtlichen Festsetzungen. N wurde beteiligt, erhob Einwendungen
    und legte fristgerecht Widerspruch ein, der zurückgewiesen wurde. Er erhebt Anfechtungsklage zum Verwaltungsgericht.
    Es sind die Vorschriften der LBO BW anzuwenden; die Tiefe der Abstandsfläche beträgt in der Regel
    0,4 der Wandhöhe, mindestens 2,5 m.
  question: Hat die Klage des N Erfolg?
  steps:
  - prompt: Ist die Klage zulässig?
    erwartung: >-
      Ja. Der Verwaltungsrechtsweg ist eröffnet (§ 40 Abs. 1 VwGO), die Anfechtungsklage ist statthaft.
      N ist als Nachbar klagebefugt, weil die Abstandsflächenvorschriften möglicherweise drittschützend
      sind. Vorverfahren und Frist wurden gewahrt.
  - prompt: Ist die Baugenehmigung rechtswidrig?
    erwartung: >-
      Ja. Erforderlich wäre eine Abstandsfläche von 0,4 x 9 m = 3,6 m; vorhanden sind nur 2,5 m. Das Vorhaben verstößt gegen § 5 LBO BW und ist ohne Abweichung nicht genehmigungsfähig; die Baugenehmigung ist nach § 58 Abs. 1 LBO BW nur zu erteilen, wenn keine öffentlich-rechtlichen Vorschriften entgegenstehen.
  - prompt: Wird N in seinen Rechten verletzt?
    erwartung: >-
      Ja. Die Abstandsflächenvorschriften schützen den Nachbarn (Belichtung, Belüftung, Wohnfrieden) und sind nachbarschützend. Die Baugenehmigung ist damit rechtswidrig und verletzt N in seinen Rechten (Rechtsverletzung, § 113 Abs. 1 S. 1 VwGO); die Klage ist begründet, die Baugenehmigung wird aufgehoben.
  - prompt: Wie ist der Eilrechtsschutz?
    erwartung: >-
      Widerspruch und Klage haben nach § 212a Abs. 1 BauGB keine aufschiebende Wirkung; N muss nach §§
      80a, 80 Abs. 5 VwGO einen Antrag auf Anordnung der aufschiebenden Wirkung stellen.
  expectation:
