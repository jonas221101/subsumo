cards:
- slug: rp-por-generalklausel
  type: norm
  front: Wo steht die polizeiliche Generalklausel in Rheinland-Pfalz und was setzt sie voraus?
  back: 'Fundstelle: § 9 Abs. 1 POG RP. Die Generalklausel ermaechtigt zu den notwendigen Massnahmen,
    um eine im Einzelfall bestehende Gefahr fuer die oeffentliche Sicherheit oder Ordnung abzuwehren.
    Sie ist subsidiaer: Greift eine Standardmassnahme oder ein Spezialgesetz, geht dieses vor. Auf der
    Rechtsfolgenseite besteht Ermessen, begrenzt durch den Grundsatz der Verhaeltnismaessigkeit.'
  norms:
  - § 9 Abs. 1 POG RP
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: rp-por-aufbau
  type: schema_step
  front: 'Aufbau: Rechtmaessigkeit einer Gefahrenabwehrmassnahme nach dem Landesrecht von Rheinland-Pfalz'
  back: 'I. Ermaechtigungsgrundlage (Polizei- und Ordnungsbehoerdengesetz (POG RP): Standardmassnahme
    vor Generalklausel). II. Formelle Rechtmaessigkeit: 1. Zustaendigkeit (sachlich: welche Behoerde -
    Allgemeine Ordnungsbehoerden und Polizei nach § 1 POG; Polizei bei Eilbeduerftigkeit; oertlich; instanziell),
    2. Verfahren (Anhoerung, § 28 VwVfG bzw. Landesrecht), 3. Form. III. Materielle Rechtmaessigkeit:
    1. Tatbestand (Schutzgut, Gefahrbegriff, Gefahrenprognose ex ante), 2. richtiger Adressat (Stoerer:
    §§ 4, 5, 7 POG RP), 3. Rechtsfolge: Ermessen und Verhaeltnismaessigkeit (geeignet, erforderlich, angemessen).'
  norms:
  - § 9 Abs. 1 POG RP
  - §§ 4, 5, 7 POG RP
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: rp-por-stoerer
  type: norm
  front: Wo sind Verhaltensstoerer, Zustandsstoerer und Nichtstoerer in Rheinland-Pfalz geregelt?
  back: '§§ 4, 5, 7 POG RP. Verhaltensstoerer: wer die Gefahr durch sein Verhalten verursacht (Theorie
    der unmittelbaren Verursachung; Zweckveranlasser als Streitfrage). Zustandsstoerer: Inhaber der tatsaechlichen
    Gewalt bzw. Eigentuemer einer gefaehrlichen Sache. Nichtstoerer: Inanspruchnahme nur unter den engen
    Voraussetzungen des polizeilichen Notstands (gegenwaertige erhebliche Gefahr, Stoerer nicht greifbar,
    Behoerde selbst nicht in der Lage), mit Entschaedigungsanspruch.'
  norms:
  - §§ 4, 5, 7 POG RP
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: rp-por-zustaendigkeit
  type: definition
  front: Wer ist in Rheinland-Pfalz fuer die Gefahrenabwehr zustaendig - Ordnungs-/Sicherheitsbehoerde
    oder Polizei?
  back: 'Allgemeine Ordnungsbehoerden und Polizei nach § 1 POG; Polizei bei Eilbeduerftigkeit. Pruefungsrelevant
    ist die Abgrenzung: Die allgemeine Gefahrenabwehr liegt grundsaetzlich bei den Verwaltungs-/Ordnungsbehoerden;
    der Polizeivollzugsdienst wird taetig, wenn die Abwehr keinen Aufschub duldet (Eilfall) oder eine
    besondere Zuweisung besteht. Ein Handeln der unzustaendigen Behoerde macht die Massnahme formell rechtswidrig.'
  norms:
  - Polizei- und Ordnungsbehoerdengesetz (POG RP)
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: rp-por-vollstreckung
  type: norm
  front: Nach welchem Gesetz wird eine Gefahrenabwehrverfuegung in Rheinland-Pfalz vollstreckt?
  back: 'Landesverwaltungsvollstreckungsgesetz (LVwVG RP). Regelfall ist das gestreckte Verfahren: Grundverfuegung
    - Androhung - Festsetzung - Anwendung des Zwangsmittels (Ersatzvornahme, Zwangsgeld, unmittelbarer
    Zwang). Bei Gefahr im Verzug sind Sofortvollzug bzw. unmittelbare Ausfuehrung ohne vorausgehenden
    Verwaltungsakt moeglich; die Kosten traegt der Pflichtige.'
  norms:
  - Landesverwaltungsvollstreckungsgesetz (LVwVG RP)
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
