cards:
- slug: sl-lra-vwvfg
  type: norm
  front: Welches Verwaltungsverfahrensgesetz gilt fuer Landesbehoerden in Saarland?
  back: Saarlaendisches Verwaltungsverfahrensgesetz (SVwVfG) - Vollgesetz. Das VwVfG des Bundes gilt nur
    fuer Bundesbehoerden (§ 1 VwVfG); fuer Landes- und Kommunalbehoerden ist das Landesgesetz massgeblich.
    Bei Verweisungsgesetzen werden die Bundesnormen 'entsprechend' angewendet und sind so zu zitieren
    (z. B. '§ 35 VwVfG i. V. m. § 1 des Landesgesetzes'), bei Vollgesetzen ist die Landesnorm selbst zu
    zitieren.
  norms:
  - Saarlaendisches Verwaltungsverfahrensgesetz (SVwVfG) - Vollgesetz
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sl-lra-verfassungsgericht
  type: norm
  front: Gibt es in Saarland eine Individualverfassungsbeschwerde zum Landesverfassungsgericht?
  back: 'Ja - § 55 VerfGHG SL. Zustaendiges Gericht: Verfassungsgerichtshof des Saarlandes auf Grundlage
    der Verfassung des Saarlandes (SVerf). Verfahrensgegenstand ist nur die Verletzung von Landesgrundrechten
    durch Landesstaatsgewalt; Bundesrecht ist Pruefungsmassstab nur, soweit die Landesverfassung darauf
    verweist. Daneben steht immer die Verfassungsbeschwerde zum BVerfG (Art. 93 Abs. 1 Nr. 4a GG).'
  norms:
  - Verfassung des Saarlandes (SVerf)
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sl-lra-kommunalverfassung
  type: norm
  front: Welches Gesetz regelt die Kommunalverfassung in Saarland und welche Hauptorgane hat die Gemeinde?
  back: 'Kommunalselbstverwaltungsgesetz (KSVG): Gemeinderat und Buergermeister. Grundlage ist die Selbstverwaltungsgarantie
    (Art. 28 Abs. 2 GG und Landesverfassung): eigenverantwortliche Regelung aller Angelegenheiten der
    oertlichen Gemeinschaft. Klausurklassiker: Zustaendigkeitsstreit zwischen Vertretung und Verwaltungsspitze,
    Kommunalverfassungsstreit, Rechtsaufsicht.'
  norms:
  - 'Kommunalselbstverwaltungsgesetz (KSVG): Gemeinderat und Buergermeister'
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sl-lra-bauordnung
  type: norm
  front: Wie heisst die Bauordnung in Saarland und wie ist eine Baugenehmigung zu pruefen?
  back: 'Landesbauordnung Saarland (LBO SL). Anspruch auf Baugenehmigung besteht, wenn dem Vorhaben keine
    oeffentlich-rechtlichen Vorschriften entgegenstehen: Genehmigungs-beduerftigkeit (Errichtung, Aenderung,
    Nutzungsaenderung), keine Genehmigungsfreiheit, bauplanungsrechtliche Zulaessigkeit nach §§ 29 ff.
    BauGB (Bundesrecht), bauordnungsrechtliche Zulaessigkeit nach der Landesbauordnung (Abstandsflaechen,
    Gestaltung, Stellplaetze).'
  norms:
  - Landesbauordnung Saarland (LBO SL)
  - §§ 29 ff. BauGB
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sl-lra-pflichtstoff
  type: definition
  front: Welche Landesrechtsgebiete gehoeren in Saarland zum Pflichtstoff des Oeffentlichen Rechts?
  back: Polizeirecht (SPolG); Kommunalrecht (KSVG); Bauordnungsrecht (LBO); Landesverfassung. Landesrecht
    wird im Examen fast nie isoliert, sondern eingebettet in eine verwaltungsprozessuale Einkleidung (Anfechtungs-/Verpflichtungsklage,
    vorlaeufiger Rechtsschutz) geprueft - die Landesnorm ist die Ermaechtigungsgrundlage, der Aufbau bleibt
    der allgemeine.
  norms: []
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
