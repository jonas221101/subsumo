faelle:
- slug: sl-fall-bau-baueinstellung
  title: "Baubeginn ohne Genehmigung"
  difficulty: 3
  minutes: 40
  quellen:
  - "Landesgesetze in der amtlichen Fassung (Landesrechtsportal)"
  - "Eigenformulierung Redaktion"
  - "§ 80 Abs. 2 S. 1 Nr. 4 VwGO"
  facts: >-
      B beginnt in einer saarländischen Gemeinde mit dem Neubau eines Einfamilienhauses, ohne eine
      Baugenehmigung beantragt zu haben. Das Grundstück liegt in einem Wohngebiet, für das ein
      Bebauungsplan besteht; das Vorhaben würde nach Einschätzung der Bauaufsichtsbehörde den
      Festsetzungen des Plans entsprechen und wäre genehmigungsfähig. Das Haus ist nicht verfahrensfrei; ein Freistellungsverfahren hat B nicht durchgeführt, und die Voraussetzungen der Genehmigungsfreistellung liegen nicht vor. Die Bauaufsichtsbehörde ordnet nach Anhörung die Einstellung der Bauarbeiten an
      und ordnet die sofortige Vollziehung an. B hält die Anordnung für rechtswidrig, weil sein
      Vorhaben ohnehin genehmigungsfähig sei.
  question: "Ist die Baueinstellung rechtmäßig?"
  steps:
  - prompt: >-
        Welche Ermächtigungsgrundlage kommt in Betracht, und welche Art von Rechtswidrigkeit genügt?
    erwartung: >-
        Die LBO Saar ermächtigt die Bauaufsichtsbehörde, die Einstellung von Bauarbeiten anzuordnen, die
        ohne die erforderliche Genehmigung ausgeführt werden. Für die Baueinstellung genügt die formelle
        Illegalität.
  - prompt: "Liegt formelle Illegalität vor?"
    erwartung: >-
        Ja. Ein Einfamilienhaus ist genehmigungsbedürftig und nicht verfahrensfrei; B hat keine
        Baugenehmigung beantragt oder erhalten.
  - prompt: "Ist die materielle Genehmigungsfähigkeit relevant?"
    erwartung: >-
        Nein. Die Baueinstellung sichert das bauaufsichtliche Genehmigungsverfahren und vermeidet
        vollendete Tatsachen; sie setzt keine materielle Illegalität voraus. Dass das Vorhaben
        genehmigungsfähig wäre, ändert an der Rechtmäßigkeit nichts, B kann einen Bauantrag stellen.
  - prompt: "Ist die Maßnahme ermessensfehlerfrei und verhältnismäßig?"
    erwartung: >-
        Ja. Die Baueinstellung ist ein vorläufiges, mildes Mittel gegenüber Nutzungsuntersagung oder
        Beseitigung und geeignet, das Genehmigungsverfahren zu sichern. Die sofortige Vollziehung ist
        wegen des öffentlichen Interesses an der Einhaltung des Genehmigungsvorbehalts gerechtfertigt (§
        80 Abs. 2 S. 1 Nr. 4 VwGO). Die Baueinstellung ist rechtmäßig.
  expectation:
    pruefpunkte:
    - id: p1
      label: >-
          Baueinstellung bei formeller Illegalität: Genehmigungsbedürftigkeit und fehlende Genehmigung
      weight: 3.0
      required: true
      keywords:
      - "Baueinstellung"
      - "formelle Illegalität"
      - "ohne Baugenehmigung"
      - "genehmigungsbedürftig"
      - "nicht verfahrensfrei"
      card_slugs:
      - "sl-bau-eingriff"
      - "sl-bau-verfahren"
    - id: p2
      label: >-
          Materielle Genehmigungsfähigkeit ist für die Baueinstellung unerheblich
      weight: 2.5
      required: true
      keywords:
      - "materielle Genehmigungsfähigkeit unerheblich"
      - "Sicherung des Genehmigungsverfahrens"
      - "vollendete Tatsachen"
      - "Genehmigungsvorbehalt"
      card_slugs:
      - "sl-bau-eingriff"
    - id: p3
      label: "Ermessen und Verhältnismäßigkeit; Baueinstellung als mildes Mittel"
      weight: 1.5
      required: false
      keywords:
      - "Verhältnismäßigkeit"
      - "Ermessen"
      - "mildes Mittel"
      - "vorläufige Maßnahme"
      - "geeignet"
      card_slugs:
      - "sl-bau-eingriff"
    - id: p4
      label: "Anordnung der sofortigen Vollziehung nach § 80 Abs. 2 S. 1 Nr. 4 VwGO"
      weight: 1.0
      required: false
      norms:
      - "§ 80 Abs. 2 S. 1 Nr. 4 VwGO"
      keywords:
      - "sofortige Vollziehung"
      - "§ 80 Abs. 2 S. 1 Nr. 4 VwGO"
      - "öffentliches Interesse an der sofortigen Vollziehung"
      card_slugs:
      - "sl-bau-eingriff"
    normzitate_geprueft: false
