cards:
- slug: sl-bau-verfahren
  type: definition
  front: >-
    Welche Genehmigungsverfahren kennt die LBO Saar, und wie verhält sich das Bauordnungsrecht zum Bauplanungsrecht?
  back: >-
    Die Errichtung, Änderung und Nutzungsänderung baulicher Anlagen bedarf nach der Landesbauordnung des
    Saarlandes (LBO Saar) grundsätzlich der Baugenehmigung (§ 60 Abs. 1 LBO). Ausnahmen: verfahrensfreie
    Vorhaben (Katalog des § 61 LBO), die Genehmigungsfreistellung nach § 63 LBO (Gebäude der Gebäudeklassen
    1 bis 5 und sonstige Anlagen im Geltungsbereich eines Bebauungsplans im Sinne des § 30 Abs. 1 oder
    der §§ 12, 30 Abs. 2 BauGB, wenn sie dessen Festsetzungen nicht widersprechen, die Erschließung gesichert
    ist, keine Abweichung nach § 68 erforderlich ist und die Gemeinde nicht fristgerecht ein vereinfachtes
    Genehmigungsverfahren verlangt; nicht für Sonderbauten, Werbeanlagen u. a., § 63 Abs. 1 S. 2) sowie
    das vereinfachte Verfahren mit eingeschränktem Prüfumfang (§ 64 LBO) und das Baugenehmigungsverfahren
    mit umfassender Prüfung (§ 65 LBO) für die übrigen Vorhaben. Auf Verlangen der Bauherrschaft wird
    für verfahrensfreie und freigestellte Vorhaben ein Genehmigungsverfahren durchgeführt (§ 60 Abs. 3
    LBO). Verfahrensfreiheit bedeutet nicht materielle Freiheit: Die materiellen Anforderungen des Bauplanungs-
    und Bauordnungsrechts sind einzuhalten, die Bauaufsicht kann bei Verstößen einschreiten. Das Bauplanungsrecht
    (§§ 29 ff. BauGB) regelt als Bundesrecht die bodenrechtliche Zulässigkeit, das Bauordnungsrecht als
    Landesrecht Gefahrenabwehr, Gestaltung und Verfahren.
  norms:
  - §§ 60 bis 65 LBO Saar
  - § 29 BauGB
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-10
- slug: sl-bau-anspruch
  type: norm
  front: Hat der Bauherr einen Anspruch auf die Baugenehmigung, und wie wird er durchgesetzt?
  back: >-
    Die Baugenehmigung ist eine gebundene Entscheidung: Sie ist zu erteilen, wenn dem Vorhaben keine öffentlich-rechtlichen
    Vorschriften entgegenstehen, die im bauaufsichtlichen Genehmigungsverfahren zu prüfen sind (§ 73 Abs.
    1 S. 1 LBO; Art. 14 Abs. 1 GG schützt die in der Eigentumsgarantie liegende Baufreiheit im Rahmen
    der Gesetze). Der Prüfumfang hängt vom Verfahren ab; im vereinfachten Verfahren prüft die Bauaufsichtsbehörde
    das Bauplanungsrecht und sonstiges öffentliches Recht außerhalb des Bauordnungsrechts, die Abstandsflächen
    (§§ 7, 8), das barrierefreie Bauen (§ 50), örtliche Bauvorschriften (§ 85) und beantragte Abweichungen
    (§ 64 Abs. 2 LBO). Das Bauplanungsrecht folgt aus §§ 30, 34, 35 BauGB je nach Gebietslage (beplanter
    Bereich, Innenbereich, Außenbereich); wo die Gemeinde nicht selbst Genehmigungsbehörde ist, ist ihr
    Einvernehmen nach § 36 BauGB erforderlich. Die Genehmigung ergeht unbeschadet privater Rechte Dritter
    (§ 73 Abs. 4 LBO). Rechtsschutz: Verpflichtungsklage nach § 42 Abs. 1 Var. 2 VwGO, nach erfolglosem
    Antrag bzw. nach Versagung; mit Bauvorbescheid lassen sich einzelne Fragen vorab klären.
  norms:
  - Art. 14 Abs. 1 GG
  - § 36 BauGB
  - § 42 Abs. 1 VwGO
  - § 73 LBO Saar
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-10
- slug: sl-bau-abstandsflaechen
  type: norm
  front: Was regeln die Abstandsflächen, und sind sie nachbarschützend?
  back: >-
    Vor den Außenwänden von Gebäuden sind Flächen von oberirdischen Gebäuden freizuhalten (Abstandsflächen,
    § 7 Abs. 1 LBO). Ihre Tiefe bemisst sich nach der Wandhöhe H (§ 7 Abs. 4 LBO) und beträgt 0,4 H (§
    7 Abs. 5 S. 1 LBO); vor Außenwänden von Wohngebäuden der Gebäudeklassen 1 und 2 mit höchstens drei
    oberirdischen Geschossen genügt eine Tiefe von 3 m, in Gewerbe- und Industriegebieten 0,2 H; in allen
    Fällen beträgt die Mindesttiefe 3 m (§ 7 Abs. 5 S. 2 LBO). Die Abstandsflächen müssen grundsätzlich
    auf dem Grundstück selbst liegen (§ 7 Abs. 2) und dürfen sich nicht überdecken (§ 7 Abs. 3, mit Ausnahmen).
    Zwecke sind ausreichende Belichtung, Belüftung, Brandschutz und Wahrung des Wohnfriedens. Das Abstandsflächenrecht
    ist nachbarschützend, soweit seine Zwecke dem Nachbarn dienen; der Nachbar kann seine Verletzung daher
    rügen. An der Grenze darf gebaut werden, wenn das Planungsrecht Grenzbebauung vorschreibt oder zulässt
    (geschlossene Bauweise, § 22 BauNVO). Abweichungen sind nach § 68 LBO möglich, wenn der Schutzzweck
    gewahrt bleibt und nachbarliche Interessen angemessen berücksichtigt werden.
  norms:
  - § 7 LBO Saar
  - § 22 BauNVO
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-10
- slug: sl-bau-nachbarschutz
  type: streitstand
  front: >-
    Unter welchen Voraussetzungen kann ein Nachbar eine Baugenehmigung erfolgreich angreifen, und welche
    Rolle spielt § 212a BauGB?
  back: >-
    Die Drittanfechtung hat nur Erfolg, wenn die Genehmigung rechtswidrig ist und gerade gegen eine nachbarschützende
    Norm verstößt (Schutznormtheorie, § 113 Abs. 1 S. 1 VwGO). Nachbarschützend sind insbesondere das
    Abstandsflächenrecht, die Festsetzungen zur Art der baulichen Nutzung (Gebietserhaltungsanspruch)
    und das Gebot der Rücksichtnahme, das über § 15 Abs. 1 S. 2 BauNVO, § 34 Abs. 1 BauGB (Einfügen) oder
    § 35 Abs. 3 BauGB wirkt. Widerspruch und Anfechtungsklage des Nachbarn haben nach § 212a Abs. 1 BauGB
    keine aufschiebende Wirkung; der Bauherr darf auf Grundlage der Genehmigung bauen. Vorläufiger Rechtsschutz:
    Antrag auf Anordnung der aufschiebenden Wirkung nach § 80a Abs. 3 i. V. m. § 80 Abs. 5 VwGO. Die Nachbarbeteiligung
    richtet sich nach § 71 LBO; öffentlich-rechtliche Einwendungen sind innerhalb eines Monats nach Zugang
    der Benachrichtigung vorzubringen, sonst wird die benachrichtigte Nachbarschaft damit ausgeschlossen
    (§ 71 Abs. 1 S. 4, 5 LBO). Streitig ist, ob schon die formelle Rechtswidrigkeit wegen unterbliebener
    Nachbarbeteiligung allein zum Erfolg führt; nach h. M. kommt es auf eine materielle Verletzung subjektiv-öffentlicher
    Nachbarrechte an.
  norms:
  - § 212a Abs. 1 BauGB
  - § 80a Abs. 3 VwGO
  - § 80 Abs. 5 VwGO
  - § 15 Abs. 1 S. 2 BauNVO
  - § 113 Abs. 1 S. 1 VwGO
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-10
- slug: sl-bau-eingriff
  type: definition
  front: Welche bauaufsichtlichen Eingriffsmaßnahmen gibt es, und wann dürfen sie ergehen?
  back: >-
    Die Bauaufsichtsbehörde hat darüber zu wachen, dass die öffentlich-rechtlichen Vorschriften eingehalten
    werden, und trifft die nach pflichtgemäßem Ermessen erforderlichen Maßnahmen (§ 57 Abs. 2 LBO). Baueinstellung
    (§ 81 LBO; Regelbeispiel: Ausführung eines genehmigungsbedürftigen Vorhabens ohne Baugenehmigung,
    § 81 Abs. 1 S. 2 Nr. 1): Stilllegung einer Baustelle, die rechtswidrig begonnen wurde; sie setzt formelle
    Illegalität (fehlende Genehmigung) oder sonstigen Verstoß voraus und dient der Sicherung. Nutzungsuntersagung
    (§ 82 Abs. 2 LBO): Verbot einer rechtswidrigen Nutzung, regelmäßig bei formeller Illegalität, wenn
    die Nutzung nicht ohne Weiteres genehmigungsfähig ist. Beseitigungsanordnung (§ 82 Abs. 1 LBO, nur
    wenn nicht auf andere Weise rechtmäßige Zustände hergestellt werden können): die schärfste Maßnahme;
    sie setzt grundsätzlich formelle und materielle Illegalität voraus, weil eine Beseitigung bei materiell
    legalem Vorhaben unverhältnismäßig wäre. Alle Maßnahmen stehen im Ermessen der Behörde und müssen
    verhältnismäßig sein; Adressaten sind Bauherr, Eigentümer oder Nutzer. Ein Anspruch des Nachbarn auf
    Einschreiten besteht nur ausnahmsweise bei Verletzung nachbarschützender Vorschriften und Ermessensreduktion
    auf Null.
  norms:
  - §§ 57, 81, 82 LBO Saar
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-10
- slug: sl-bau-abweichung
  type: definition
  front: >-
    Wie unterscheiden sich Abweichung (Bauordnungsrecht) und Ausnahme bzw. Befreiung (Bauplanungsrecht)?
  back: >-
    Im Bauordnungsrecht soll die Bauaufsichtsbehörde nach § 68 Abs. 1 LBO Abweichungen von bauaufsichtlichen
    Anforderungen zulassen, wenn sie unter Berücksichtigung des Zwecks der Anforderung und unter Würdigung
    der öffentlich-rechtlich geschützten nachbarlichen Belange mit den öffentlichen Belangen vereinbar
    sind; die Abweichung ist gesondert in Textform zu beantragen und zu begründen (§ 68 Abs. 2 LBO). Im
    Bauplanungsrecht lässt § 31 Abs. 1 BauGB Ausnahmen zu, soweit der Bebauungsplan sie vorsieht. Nach
    § 31 Abs. 2 BauGB ist eine Befreiung von Festsetzungen möglich, wenn die Grundzüge der Planung nicht
    berührt werden und einer der Befreiungsgründe (Allgemeinwohl, städtebauliche Vertretbarkeit, offenbar
    nicht beabsichtigte Härte) vorliegt; die Abweichung muss zudem mit den öffentlichen Belangen vereinbar
    sein und nachbarliche Interessen würdigen. Wird von nachbarschützenden Festsetzungen befreit, hat
    der Nachbar einen Anspruch auf Würdigung seiner Belange.
  norms:
  - § 31 Abs. 1 BauGB
  - § 31 Abs. 2 BauGB
  - § 68 LBO Saar
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-10
- slug: sl-bau-bestandsschutz
  type: definition
  front: Was schützt der Bestandsschutz, und wo liegen seine Grenzen?
  back: >-
    Passiver Bestandsschutz folgt aus Art. 14 Abs. 1 GG: Eine bauliche Anlage, die zu irgendeinem Zeitpunkt
    rechtmäßig genehmigt oder materiell legal errichtet wurde, darf in ihrem genehmigten Bestand und ihrer
    Nutzung erhalten bleiben, auch wenn sich später die Rechtslage geändert hat; bauaufsichtliche Eingriffe
    wie Beseitigungsanordnung oder Nutzungsuntersagung scheiden aus, solange die Voraussetzungen fortbestehen.
    Der Schutz erlischt, wenn die Anlage zerstört, ihre Substanz in wesentlichem Umfang erneuert oder
    die Nutzung aufgegeben wird; die Identität der Anlage muss gewahrt sein. Einen aktiven Bestandsschutz,
    also einen unmittelbar aus Art. 14 GG abgeleiteten Anspruch auf Erweiterung oder Änderung, erkennt
    das Bundesverwaltungsgericht nicht mehr an. Bei bestandsgeschützten Anlagen können nach § 57 Abs.
    3 LBO Anforderungen gestellt werden, wenn dies zur Abwehr von erheblichen Gefahren für Leben und Gesundheit
    oder von unzumutbaren Belästigungen erforderlich ist.
  norms:
  - Art. 14 Abs. 1 GG
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-10
schemata:
- slug: sl-schema-bau-baueinstellung
  title: Baueinstellung als bauaufsichtliche Maßnahme (LBO Saar)
  norms:
  - §§ 57, 81, 82 LBO Saar
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  steps:
  - label: 'I. Ermächtigungsgrundlage: § 81 Abs. 1 LBO Saar'
  - label: II. Formelle Rechtmäßigkeit
    hinweis: Zuständigkeit, Anhörung, Form; Sofortvollzug beachten.
  - label: III. Materielle Rechtmäßigkeit
    children:
    - label: >-
        1. Baumaßnahme ohne erforderliche Genehmigung oder in Abweichung davon (formelle Illegalität)
      hinweis: >-
        Für die Baueinstellung genügt formelle Illegalität; materielle Rechtmäßigkeit entlastet nicht.
    - label: '2. Adressat: Bauherr, Unternehmer, Bauleiter'
    - label: 3. Ermessen und Verhältnismäßigkeit
      hinweis: Baueinstellung als vorläufige Sicherungsmaßnahme.
  - label: IV. Vollstreckung und vorläufiger Rechtsschutz
    hinweis: Anordnung der sofortigen Vollziehung, § 80 Abs. 2 S. 1 Nr. 4 VwGO.
faelle:
- slug: sl-fall-bau-baueinstellung
  title: Baubeginn ohne Genehmigung
  difficulty: 3
  minutes: 40
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  - § 80 Abs. 2 S. 1 Nr. 4 VwGO
  facts: >-
    B beginnt in einer saarländischen Gemeinde mit dem Neubau eines Einfamilienhauses, ohne eine Baugenehmigung
    beantragt zu haben. Das Grundstück liegt in einem Wohngebiet, für das ein Bebauungsplan besteht; das
    Vorhaben würde nach Einschätzung der Bauaufsichtsbehörde den Festsetzungen des Plans entsprechen und
    wäre genehmigungsfähig. Das Haus ist nicht verfahrensfrei; ein Freistellungsverfahren hat B nicht
    durchgeführt, und die Voraussetzungen der Genehmigungsfreistellung liegen nicht vor. Die Bauaufsichtsbehörde
    ordnet nach Anhörung die Einstellung der Bauarbeiten an und ordnet die sofortige Vollziehung an. B
    hält die Anordnung für rechtswidrig, weil sein Vorhaben ohnehin genehmigungsfähig sei.
  question: Ist die Baueinstellung rechtmäßig?
  steps:
  - prompt: >-
      Welche Ermächtigungsgrundlage kommt in Betracht, und welche Art von Rechtswidrigkeit genügt?
    erwartung: >-
      § 81 Abs. 1 LBO Saar ermächtigt die Bauaufsichtsbehörde, die Einstellung von Arbeiten anzuordnen
      (Regelbeispiel Nr. 1: Ausführung eines genehmigungsbedürftigen Vorhabens ohne Baugenehmigung), die
      ohne die erforderliche Genehmigung ausgeführt werden. Für die Baueinstellung genügt die formelle
      Illegalität.
  - prompt: Liegt formelle Illegalität vor?
    erwartung: >-
      Ja. Ein Einfamilienhaus ist genehmigungsbedürftig und nicht verfahrensfrei; B hat keine Baugenehmigung
      beantragt oder erhalten.
  - prompt: Ist die materielle Genehmigungsfähigkeit relevant?
    erwartung: >-
      Nein. Die Baueinstellung sichert das bauaufsichtliche Genehmigungsverfahren und vermeidet vollendete
      Tatsachen; sie setzt keine materielle Illegalität voraus. Dass das Vorhaben genehmigungsfähig wäre,
      ändert an der Rechtmäßigkeit nichts, B kann einen Bauantrag stellen.
  - prompt: Ist die Maßnahme ermessensfehlerfrei und verhältnismäßig?
    erwartung: >-
      Ja. Die Baueinstellung ist ein vorläufiges, mildes Mittel gegenüber Nutzungsuntersagung oder Beseitigung
      und geeignet, das Genehmigungsverfahren zu sichern. Die sofortige Vollziehung ist wegen des öffentlichen
      Interesses an der Einhaltung des Genehmigungsvorbehalts gerechtfertigt (§ 80 Abs. 2 S. 1 Nr. 4 VwGO).
      Die Baueinstellung ist rechtmäßig.
  expectation:
    pruefpunkte:
    - id: p1
      label: >-
        Baueinstellung bei formeller Illegalität: Genehmigungsbedürftigkeit und fehlende Genehmigung
      weight: 3.0
      required: true
      keywords:
      - Baueinstellung
      - formelle Illegalität
      - ohne Baugenehmigung
      - genehmigungsbedürftig
      - nicht verfahrensfrei
      card_slugs:
      - sl-bau-eingriff
      - sl-bau-verfahren
    - id: p2
      label: Materielle Genehmigungsfähigkeit ist für die Baueinstellung unerheblich
      weight: 2.5
      required: true
      keywords:
      - materielle Genehmigungsfähigkeit unerheblich
      - Sicherung des Genehmigungsverfahrens
      - vollendete Tatsachen
      - Genehmigungsvorbehalt
      card_slugs:
      - sl-bau-eingriff
    - id: p3
      label: Ermessen und Verhältnismäßigkeit; Baueinstellung als mildes Mittel
      weight: 1.5
      required: false
      keywords:
      - Verhältnismäßigkeit
      - Ermessen
      - mildes Mittel
      - vorläufige Maßnahme
      - geeignet
      card_slugs:
      - sl-bau-eingriff
    - id: p4
      label: Anordnung der sofortigen Vollziehung nach § 80 Abs. 2 S. 1 Nr. 4 VwGO
      weight: 1.0
      required: false
      norms:
      - § 80 Abs. 2 S. 1 Nr. 4 VwGO
      keywords:
      - sofortige Vollziehung
      - § 80 Abs. 2 S. 1 Nr. 4 VwGO
      - öffentliches Interesse an der sofortigen Vollziehung
      card_slugs:
      - sl-bau-eingriff
    normzitate_geprueft: false
