cards:
- slug: sl-kom-selbstverwaltung
  type: definition
  front: >-
      Was gewährleistet die kommunale Selbstverwaltung nach Art. 28 Abs. 2 GG, und welche
      Aufgabenarten gibt es im Saarland?
  back: >-
      Art. 28 Abs. 2 GG garantiert den Gemeinden das Recht, alle Angelegenheiten der örtlichen
      Gemeinschaft im Rahmen der Gesetze in eigener Verantwortung zu regeln (Allzuständigkeit). Die
      Garantie umfasst die Rechtssubjektsgarantie, die objektive Rechtsinstitutionsgarantie und die
      subjektive Rechtsstellungsgarantie. Sie schützt die Gemeindehoheiten, etwa Gebiets-,
      Organisations-, Personal-, Finanz-, Planungs- und Satzungshoheit. Eingriffe durch Gesetz sind
      zulässig, soweit der Kernbereich unangetastet bleibt und Aufgaben mit örtlichem Charakter nur
      aus Gründen des Gemeinwohls, insbesondere zur Sicherung einer ordnungsgemäßen
      Aufgabenwahrnehmung, entzogen werden (Rastede-Beschluss). Aufgabenarten: Selbstverwaltungsaufgaben (freiwillige und pflichtige) sowie Weisungs- bzw. Auftragsangelegenheiten (Einzelheiten im KSVG); für Selbstverwaltungsaufgaben besteht nur Rechtsaufsicht, für Weisungsaufgaben
      Fachaufsicht.
  norms:
  - "Art. 28 Abs. 2 S. 1 GG"
  quellen:
  - "Landesgesetze in der amtlichen Fassung (Landesrechtsportal)"
  - "Eigenformulierung Redaktion"
  - "BVerfGE 79, 127 (Rastede)"
  stand: 2026-10
- slug: sl-kom-struktur
  type: definition
  front: >-
      Welche kommunalen Körperschaften und Ortsgliederungen kennt das saarländische Kommunalrecht?
  back: >-
      Das KSVG regelt die Gemeinden und die Landkreise; daneben besteht der Regionalverband
      Saarbrücken als Gemeindeverband besonderer Art. Innerhalb der Gemeinde kann es Gemeindebezirke
      geben, in denen Bezirksräte oder Ortsräte mit Ortsvorstehern Anhörungs- und Entscheidungsrechte
      haben. Die Gemeinde handelt durch Gemeinderat und Bürgermeister; die Aufgaben sind nach eigenen
      Angelegenheiten (Selbstverwaltung) und übertragenen Angelegenheiten zu unterscheiden. Für die
      Klausur ist zu klären, welche Körperschaft und welches Organ handelt und ob die Aufgabe der
      Selbstverwaltung oder der Auftragsverwaltung zuzuordnen ist; davon hängt die Aufsicht ab.
  norms:
  - >-
      Vorschriften des KSVG zu Gemeinderat und Bürgermeister (Paragraphen hier nicht angegeben)
  quellen:
  - "Landesgesetze in der amtlichen Fassung (Landesrechtsportal)"
  - "Eigenformulierung Redaktion"
  stand: 2026-10
- slug: sl-kom-organe
  type: definition
  front: >-
      Wie sind die Zuständigkeiten von Gemeinderat und Bürgermeister im Saarland verteilt, und welche
      Anforderungen gelten für Verpflichtungserklärungen?
  back: >-
      Der Gemeinderat ist das Hauptorgan der Gemeinde und entscheidet über die grundlegenden
      Angelegenheiten, insbesondere Satzungen, den Haushalt, wesentliche Vermögensverfügungen und die
      Grundsätze der Verwaltung. Der Bürgermeister leitet die Verwaltung, führt die Beschlüsse aus,
      erledigt die laufenden Angelegenheiten und vertritt die Gemeinde nach außen. Die Abgrenzung der
      Zuständigkeiten ergibt sich aus dem KSVG und der Hauptsatzung; ein Beschluss des unzuständigen
      Organs ist formell rechtswidrig. Verpflichtungserklärungen, mit denen die Gemeinde zu Leistungen
      verpflichtet werden soll, bedürfen nach den Gemeindeordnungen einer besonderen Form (regelmäßig
      Schriftform und Unterschrift der Vertretungsberechtigten). Diese Formvorschriften sind nach h.
      M. Vertretungsregelungen; ein Verstoß macht die Erklärung unwirksam, sie bindet die Gemeinde
      nicht.
  norms:
  - >-
      Vorschriften des KSVG zu Gemeinderat und Bürgermeister (Paragraphen hier nicht angegeben)
  quellen:
  - "Landesgesetze in der amtlichen Fassung (Landesrechtsportal)"
  - "Eigenformulierung Redaktion"
  stand: 2026-10
- slug: sl-kom-satzung
  type: norm
  front: >-
      Welche Anforderungen stellt das Recht im Saarland an eine gemeindliche Satzung?
  back: >-
      Die Gemeinden können ihre Angelegenheiten durch Satzung regeln (Satzungshoheit). Eine allgemeine
      Satzungsermächtigung im KSVG genügt für Eingriffe in Grundrechte allerdings nicht; nach der
      Wesentlichkeitstheorie braucht es eine spezielle gesetzliche Ermächtigung (z. B. für Anschluss-
      und Benutzungszwang oder Abgaben). Prüfungsaufbau: I. Ermächtigungsgrundlage. II. Formelle
      Rechtmäßigkeit: Zuständigkeit des Gemeindeorgans (Gemeinderat), Verfahren (Beschlussfassung,
      Mitwirkungsverbote), Ausfertigung und ordnungsgemäße öffentliche Bekanntmachung. III. Materielle
      Rechtmäßigkeit: Vereinbarkeit mit höherrangigem Recht, Bestimmtheit, Verhältnismäßigkeit,
      Gleichheitssatz. Rechtsfolge eines Fehlers ist grundsätzlich Nichtigkeit; die Gemeindeordnungen
      enthalten jedoch Unbeachtlichkeits- und Heilungsvorschriften für bestimmte Verfahrens- und
      Formfehler, die in der Klausur gesondert zu prüfen sind. Rechtsschutz: Normenkontrolle nach § 47
      Abs. 1 Nr. 2 VwGO, soweit das Landesrecht sie eröffnet, sonst Inzidentkontrolle.
  norms:
  - "§ 12 KSVG"
  - "§ 47 VwGO"
  quellen:
  - "Landesgesetze in der amtlichen Fassung (Landesrechtsportal)"
  - "Eigenformulierung Redaktion"
  stand: 2026-10
- slug: sl-kom-anschlusszwang
  type: norm
  front: >-
      Unter welchen Voraussetzungen darf die Gemeinde einen Anschluss- und Benutzungszwang anordnen?
  back: >-
      Der Anschluss- und Benutzungszwang verpflichtet Grundstückseigentümer und Nutzer, ein Grundstück
      an eine gemeindliche Einrichtung anzuschließen und die Einrichtung zu benutzen (etwa
      Wasserversorgung, Abwasser- und Abfallbeseitigung, Straßenreinigung, teils Fernwärme). Er ist
      ein Eingriff in Art. 2 Abs. 1, Art. 12 und Art. 14 GG und bedarf einer gesetzlichen Ermächtigung
      in der Gemeindeordnung, die die Gemeinde durch Satzung ausfüllt. Tatbestand: öffentliches
      Bedürfnis, also Gründe des Gemeinwohls wie Volksgesundheit oder Umweltschutz; Bestehen oder
      Schaffung einer öffentlichen Einrichtung; Verhältnismäßigkeit. Die Satzung muss Befreiungs- bzw.
      Ausnahmemöglichkeiten für Härtefälle vorsehen. Welche Einrichtungen erfasst sind und ob weitere
      Gemeinwohlgründe (etwa Klimaschutz) ausdrücklich genannt sind, ergibt sich aus der jeweiligen
      Gemeindeordnung.
  norms:
  - >-
      Vorschriften des KSVG zum Anschluss- und Benutzungszwang (Paragraph hier nicht angegeben)
  - "Art. 2 Abs. 1 GG"
  - "Art. 12 Abs. 1 GG"
  - "Art. 14 Abs. 1 GG"
  quellen:
  - "Landesgesetze in der amtlichen Fassung (Landesrechtsportal)"
  - "Eigenformulierung Redaktion"
  stand: 2026-10
- slug: sl-kom-aufsicht
  type: streitstand
  front: >-
      Welche Arten der Kommunalaufsicht gibt es, und welchen Rechtsschutz hat die Gemeinde?
  back: >-
      Bei Selbstverwaltungsaufgaben besteht nur Rechtsaufsicht: Die Aufsichtsbehörde prüft die
      Rechtmäßigkeit, nicht die Zweckmäßigkeit. Bei Weisungsaufgaben (Auftragsangelegenheiten) besteht
      Fachaufsicht mit Weisungsrecht auch hinsichtlich der Zweckmäßigkeit. Die Aufsichtsmittel sind
      abgestuft: Information, Beanstandung rechtswidriger Beschlüsse, Anordnung, Ersatzvornahme,
      Bestellung eines Beauftragten; die Behörde entscheidet nach pflichtgemäßem Ermessen
      (Opportunitätsprinzip). Rechtsschutz der Gemeinde: Nach h. M. sind Aufsichtsmaßnahmen gegenüber
      der Gemeinde Verwaltungsakte, weil sie in die Selbstverwaltungsgarantie (Art. 28 Abs. 2 GG)
      eingreifen; statthaft ist die Anfechtungsklage. Die früher vertretene Gegenansicht sah in der
      Aufsicht eine Maßnahme im staatlichen Innenbereich ohne Außenwirkung; sie wird wegen der eigenen
      Rechtsstellung der Gemeinde überwiegend abgelehnt.
  norms:
  - "Kommunalaufsicht nach dem KSVG (Paragraphen hier nicht angegeben)"
  - "Art. 28 Abs. 2 S. 1 GG"
  quellen:
  - "Landesgesetze in der amtlichen Fassung (Landesrechtsportal)"
  - "Eigenformulierung Redaktion"
  stand: 2026-10
- slug: sl-kom-buergerbegehren
  type: definition
  front: >-
      Wie funktionieren Bürgerbegehren und Bürgerentscheid, und welche Zulässigkeitsprobleme sind
      typisch?
  back: >-
      Mit dem Bürgerbegehren verlangen die Bürger, dass über eine Gemeindeangelegenheit ein
      Bürgerentscheid stattfindet; dieser ersetzt den Beschluss des Gemeindeorgans. Typische
      Zulässigkeitsvoraussetzungen nach den Gemeindeordnungen: eine mit Ja oder Nein zu beantwortende
      Fragestellung mit Begründung, die Angabe der Vertretungsberechtigten, ein Unterschriftenquorum,
      in den meisten Ländern ein Vorschlag zur Deckung der Kosten, die Einhaltung einer Frist gegen
      bereits gefasste Beschlüsse sowie eine Angelegenheit der Gemeinde, die nicht in den
      Ausschlusskatalog fällt. Ausgeschlossen sind regelmäßig Haushaltssatzung, Abgaben und Entgelte,
      Personalangelegenheiten und weisungsgebundene Aufgaben. Die Entscheidung über die Zulässigkeit
      trifft das zuständige Gemeindeorgan; die Initiatoren können sie vor dem Verwaltungsgericht
      angreifen. Die Einzelheiten des Landesrechts (Quoren, Fristen, Katalog) sind in der Klausur der
      Gemeindeordnung zu entnehmen.
  norms:
  - >-
      Bürgerbegehren und Bürgerentscheid nach dem KSVG (Paragraphen hier nicht angegeben)
  quellen:
  - "Landesgesetze in der amtlichen Fassung (Landesrechtsportal)"
  - "Eigenformulierung Redaktion"
  stand: 2026-10
- slug: sl-kom-mitwirkung
  type: definition
  front: >-
      Wann gilt ein Mitwirkungsverbot für Mitglieder des Gemeindeorgans, und was folgt aus einem
      Verstoß?
  back: >-
      Ein Mitglied darf an Beratung und Abstimmung nicht teilnehmen, wenn die Entscheidung ihm selbst,
      Angehörigen oder einer von ihm vertretenen Person oder Gesellschaft einen unmittelbaren Vorteil
      oder Nachteil bringen kann. Unmittelbarkeit bedeutet: Die Entscheidung berührt das
      Sonderinteresse des Betroffenen ohne weiteren Vollzugsakt; ein Vorteil, den er mit einer
      Vielzahl von Personen teilt (Gruppeninteresse), genügt regelmäßig nicht. Beispiel: Eigentümer
      eines Grundstücks im Plangebiet bei der Beschlussfassung über den Bebauungsplan. Das betroffene
      Mitglied hat den Verhandlungsraum zu verlassen. Ein Verstoß ist ein Verfahrensfehler; der
      Beschluss ist rechtswidrig, wenn die Mitwirkung für das Abstimmungsergebnis ausschlaggebend sein
      konnte. Die Gemeindeordnungen enthalten Unbeachtlichkeits- und Heilungsvorschriften, die
      gesondert zu prüfen sind. Bei Satzungen können die Fehler nach Fristablauf unbeachtlich werden.
  norms:
  - "Mitwirkungsverbote des KSVG (Paragraph hier nicht angegeben)"
  quellen:
  - "Landesgesetze in der amtlichen Fassung (Landesrechtsportal)"
  - "Eigenformulierung Redaktion"
  stand: 2026-10
schemata:
- slug: sl-schema-kom-verpflichtungserklaerung
  title: "Wirksamkeit einer Verpflichtungserklärung der Gemeinde (KSVG)"
  norms:
  - >-
      Vorschriften des KSVG zu Gemeinderat und Bürgermeister (Paragraphen hier nicht angegeben)
  quellen:
  - "Landesgesetze in der amtlichen Fassung (Landesrechtsportal)"
  - "Eigenformulierung Redaktion"
  steps:
  - label: "I. Anspruch aus Vertrag gegen die Gemeinde"
    hinweis: "Vertragsschluss und Vertretung der Gemeinde trennen."
  - label: "II. Vertretung der Gemeinde"
    children:
    - label: >-
        1. Vertretungsberechtigtes Organ (Bürgermeister, ggf. weitere Vertreter)
    - label: >-
        2. Zuständigkeit im Innenverhältnis: Gemeinderat oder Bürgermeister (laufende Angelegenheit?)
      hinweis: >-
          Innenverhältnis berührt die Vertretungsmacht nach außen nur, soweit das Gesetz dies anordnet.
  - label: "III. Form der Verpflichtungserklärung"
    children:
    - label: >-
        1. Gesetzliche Formvorschrift (Schriftform, Unterschrift der Vertretungsberechtigten)
    - label: >-
        2. Rechtsfolge eines Formverstoßes: Unwirksamkeit (Vertrag zunächst schwebend unwirksam)
  - label: "IV. Nachträgliche Genehmigung / Vertrauensschutz"
    hinweis: >-
        Genehmigung in entsprechender Anwendung des § 177 BGB durch das zuständige Organ in der gebotenen Form möglich; Rechtsscheinsgrundsätze greifen wegen des Schutzzwecks der Formvorschrift grundsätzlich nicht.
faelle:
- slug: sl-fall-kom-verpflichtungserklaerung
  title: "Der telefonisch bestellte Dachausbau"
  difficulty: 3
  minutes: 40
  quellen:
  - "Landesgesetze in der amtlichen Fassung (Landesrechtsportal)"
  - "Eigenformulierung Redaktion"
  facts: >-
      Der Bürgermeister B einer saarländischen Gemeinde bestellt telefonisch beim Bauunternehmer U die
      Sanierung des Rathausdachs zum Preis von 150.000 Euro. Eine schriftliche Auftragsbestätigung
      oder eine von B unterschriebene Erklärung existiert nicht; der Gemeinderat wurde mit dem
      Vorhaben nicht befasst. U führt die Arbeiten aus und verlangt die vereinbarte Vergütung von der
      Gemeinde. Die Gemeinde verweigert die Zahlung unter Hinweis auf die gesetzlichen
      Formvorschriften für Verpflichtungserklärungen.
  question: >-
      Hat U gegen die Gemeinde einen vertraglichen Zahlungsanspruch? Auf Ansprüche aus
      Geschäftsführung ohne Auftrag und Bereicherungsrecht ist nicht einzugehen.
  steps:
  - prompt: >-
        Wer vertritt die Gemeinde, und welche Voraussetzungen stellt das Kommunalrecht an eine
        Verpflichtungserklärung?
    erwartung: >-
        Die Gemeinde wird vom Bürgermeister vertreten. Erklärungen, durch die die Gemeinde zu einer
        Leistung verpflichtet werden soll, bedürfen nach dem Kommunalrecht der Schriftform und der
        Unterschrift der Vertretungsberechtigten.
  - prompt: "Ist die Formvorschrift eingehalten?"
    erwartung: >-
        Nein. Die telefonische Bestellung erfüllt weder Schriftform noch Unterschrift.
  - prompt: "Welche Folge hat der Formverstoß?"
    erwartung: >-
        Die Formvorschrift gehört zur Vertretungsregelung; der Formverstoß hat Unwirksamkeit der
        Verpflichtungserklärung zur Folge. Der Vertrag ist schwebend unwirksam und kann nur durch formgerechte Genehmigung (§ 177 BGB analog) wirksam werden; eine solche liegt nicht vor. Die Gemeinde ist an die telefonische Bestellung nicht gebunden. Auf Rechtsscheingrundsätze oder Treu und Glauben kann sich U grundsätzlich nicht
        stützen, weil die Formvorschrift den Schutz der Gemeinde bezweckt.
  - prompt: "Ergebnis?"
    erwartung: >-
        Ein vertraglicher Zahlungsanspruch des U gegen die Gemeinde besteht nicht.
  expectation:
    pruefpunkte:
    - id: p1
      label: >-
          Formerfordernis für Verpflichtungserklärungen der Gemeinde (Schriftform, Unterschrift) erkannt
      weight: 2.5
      required: true
      keywords:
      - "Verpflichtungserklärung"
      - "Schriftform"
      - "Formvorschrift"
      - "Unterschrift des Bürgermeisters"
      - "Vertretungsregelung"
      card_slugs:
      - "sl-kom-organe"
    - id: p2
      label: >-
          Formverstoß als Unwirksamkeitsgrund begründet, nicht bloße Ordnungsvorschrift
      weight: 2.5
      required: true
      keywords:
      - "Unwirksamkeit"
      - "formunwirksam"
      - "zwingende Formvorschrift"
      - "nicht gebunden"
      - "schwebend unwirksam"
      card_slugs:
      - "sl-kom-organe"
    - id: p3
      label: "Rechtsschein und Treu und Glauben greifen grundsätzlich nicht"
      weight: 1.0
      required: false
      keywords:
      - "Rechtsschein"
      - "Treu und Glauben"
      - "Schutz der Gemeinde"
      - "kein Vertrauensschutz"
      card_slugs:
      - "sl-kom-organe"
    - id: p4
      label: >-
          Ergebnis: kein vertraglicher Zahlungsanspruch
      weight: 1.0
      required: false
      keywords:
      - "kein Zahlungsanspruch"
      - "kein vertraglicher Anspruch"
      - "Vergütungsanspruch besteht nicht"
      - "kein vertraglicher Zahlungsanspruch"
      - "Zahlungsanspruch besteht nicht"
      - "keine Vergütung aus Vertrag"
      card_slugs:
      - "sl-kom-organe"
    normzitate_geprueft: false
