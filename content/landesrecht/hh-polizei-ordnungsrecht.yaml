cards:
- slug: hh-por-generalklausel
  type: norm
  front: Wo steht die polizeiliche Generalklausel in Hamburg und was setzt sie voraus?
  back: 'Fundstelle: § 3 Abs. 1 SOG HH. Die Generalklausel ermächtigt zu den notwendigen Maßnahmen, um
    eine im Einzelfall bestehende Gefahr für die öffentliche Sicherheit oder Ordnung abzuwehren. Sie ist
    subsidiär: Greift eine Standardmaßnahme oder ein Spezialgesetz, geht dieses vor. Auf der Rechtsfolgenseite
    besteht Ermessen, begrenzt durch den Grundsatz der Verhältnismäßigkeit. Zum Schutz privater Rechte
    wird die Gefahrenabwehr nur subsidiär tätig: Ein Einschreiten kommt nur in Betracht, wenn gerichtlicher
    Schutz nicht rechtzeitig zu erlangen ist und ohne die Maßnahme die Vereitelung oder wesentliche Erschwerung
    der Rechtsverwirklichung droht.'
  norms:
  - § 3 Abs. 1 SOG HH
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: hh-por-aufbau
  type: schema_step
  front: 'Aufbau: Rechtmäßigkeit einer Gefahrenabwehrmaßnahme nach dem Landesrecht von Hamburg'
  back: 'I. Ermächtigungsgrundlage (Gesetz zum Schutz der öffentlichen Sicherheit und Ordnung (SOG HH)
    und Polizeidatenverarbeitungsgesetz (PolDVG): Standardmaßnahme vor Generalklausel). II. Formelle Rechtmäßigkeit:
    1. Zuständigkeit (sachlich: welche Behörde - Verwaltungsbehörden und Polizei im SOG HH; Hamburg ist
    Einheitsgemeinde mit Bezirken (BezVG); örtlich; instanziell), 2. Verfahren (Anhörung nach § 28 HmbVwVfG),
    3. Form. III. Materielle Rechtmäßigkeit: 1. Tatbestand (Schutzgut, Gefahrbegriff, Gefahrenprognose
    ex ante), 2. richtiger Adressat (Störer: §§ 8, 9, 10 SOG HH), 3. Rechtsfolge: Ermessen und Verhältnismäßigkeit
    (geeignet, erforderlich, angemessen).'
  norms:
  - § 3 Abs. 1 SOG HH
  - §§ 8, 9, 10 SOG HH
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: hh-por-stoerer
  type: norm
  front: Wo sind Verhaltensstörer, Zustandsstörer und Nichtstörer in Hamburg geregelt?
  back: '§§ 8, 9, 10 SOG HH. Verhaltensstörer: wer die Gefahr durch sein Verhalten verursacht (Theorie
    der unmittelbaren Verursachung; Zweckveranlasser als Streitfrage). Zustandsstörer: Inhaber der tatsächlichen
    Gewalt bzw. Eigentümer einer gefährlichen Sache. Nichtstörer: Inanspruchnahme nur unter den engen
    Voraussetzungen des polizeilichen Notstands (gegenwärtige erhebliche Gefahr, Störer nicht greifbar,
    Behörde selbst nicht in der Lage), mit Entschädigungsanspruch.'
  norms:
  - §§ 8, 9, 10 SOG HH
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: hh-por-zustaendigkeit
  type: definition
  front: Wer ist in Hamburg für die Gefahrenabwehr zuständig - Ordnungs-/Sicherheitsbehörde oder Polizei?
  back: 'Verwaltungsbehörden und Polizei im SOG HH; Hamburg ist Einheitsgemeinde mit Bezirken (BezVG).
    Prüfungsrelevant ist die Abgrenzung: Die allgemeine Gefahrenabwehr liegt grundsätzlich bei den Verwaltungs-/Ordnungsbehörden;
    der Polizeivollzugsdienst wird tätig, wenn die Abwehr keinen Aufschub duldet (Eilfall) oder eine besondere
    Zuweisung besteht. Ein Handeln der unzuständigen Behörde macht die Maßnahme formell rechtswidrig.'
  norms:
  - Gesetz zum Schutz der öffentlichen Sicherheit und Ordnung (SOG HH) und Polizeidatenverarbeitungsgesetz
    (PolDVG)
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: hh-por-vollstreckung
  type: norm
  front: Nach welchem Gesetz wird eine Gefahrenabwehrverfügung in Hamburg vollstreckt?
  back: 'Hamburgisches Verwaltungsvollstreckungsgesetz (HmbVwVG). Regelfall ist das gestreckte Verfahren:
    Grundverfügung - Androhung - Festsetzung - Anwendung des Zwangsmittels (Ersatzvornahme, Zwangsgeld,
    unmittelbarer Zwang). Bei Gefahr im Verzug sind Sofortvollzug bzw. unmittelbare Ausführung ohne vorausgehenden
    Verwaltungsakt möglich; die Kosten trägt der Pflichtige.'
  norms:
  - Hamburgisches Verwaltungsvollstreckungsgesetz (HmbVwVG)
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
