cards:
- slug: hh-por-generalklausel
  type: norm
  front: Wo steht die polizeiliche Generalklausel in Hamburg und was setzt sie voraus?
  back: 'Fundstelle: § 3 Abs. 1 SOG HH. Die Generalklausel ermaechtigt zu den notwendigen Massnahmen,
    um eine im Einzelfall bestehende Gefahr fuer die oeffentliche Sicherheit oder Ordnung abzuwehren.
    Sie ist subsidiaer: Greift eine Standardmassnahme oder ein Spezialgesetz, geht dieses vor. Auf der
    Rechtsfolgenseite besteht Ermessen, begrenzt durch den Grundsatz der Verhaeltnismaessigkeit.'
  norms:
  - § 3 Abs. 1 SOG HH
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: hh-por-aufbau
  type: schema_step
  front: 'Aufbau: Rechtmaessigkeit einer Gefahrenabwehrmassnahme nach dem Landesrecht von Hamburg'
  back: 'I. Ermaechtigungsgrundlage (Gesetz zum Schutz der oeffentlichen Sicherheit und Ordnung (SOG HH)
    und Polizeidatenverarbeitungsgesetz (PolDVG): Standardmassnahme vor Generalklausel). II. Formelle
    Rechtmaessigkeit: 1. Zustaendigkeit (sachlich: welche Behoerde - Verwaltungsbehoerden und Polizei
    im SOG HH; Hamburg ist Einheitsgemeinde mit Bezirken (BezVG); oertlich; instanziell), 2. Verfahren
    (Anhoerung, § 28 VwVfG bzw. Landesrecht), 3. Form. III. Materielle Rechtmaessigkeit: 1. Tatbestand
    (Schutzgut, Gefahrbegriff, Gefahrenprognose ex ante), 2. richtiger Adressat (Stoerer: §§ 8, 9, 10
    SOG HH), 3. Rechtsfolge: Ermessen und Verhaeltnismaessigkeit (geeignet, erforderlich, angemessen).'
  norms:
  - § 3 Abs. 1 SOG HH
  - §§ 8, 9, 10 SOG HH
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: hh-por-stoerer
  type: norm
  front: Wo sind Verhaltensstoerer, Zustandsstoerer und Nichtstoerer in Hamburg geregelt?
  back: '§§ 8, 9, 10 SOG HH. Verhaltensstoerer: wer die Gefahr durch sein Verhalten verursacht (Theorie
    der unmittelbaren Verursachung; Zweckveranlasser als Streitfrage). Zustandsstoerer: Inhaber der tatsaechlichen
    Gewalt bzw. Eigentuemer einer gefaehrlichen Sache. Nichtstoerer: Inanspruchnahme nur unter den engen
    Voraussetzungen des polizeilichen Notstands (gegenwaertige erhebliche Gefahr, Stoerer nicht greifbar,
    Behoerde selbst nicht in der Lage), mit Entschaedigungsanspruch.'
  norms:
  - §§ 8, 9, 10 SOG HH
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: hh-por-zustaendigkeit
  type: definition
  front: Wer ist in Hamburg fuer die Gefahrenabwehr zustaendig - Ordnungs-/Sicherheitsbehoerde oder Polizei?
  back: 'Verwaltungsbehoerden und Polizei im SOG HH; Hamburg ist Einheitsgemeinde mit Bezirken (BezVG).
    Pruefungsrelevant ist die Abgrenzung: Die allgemeine Gefahrenabwehr liegt grundsaetzlich bei den Verwaltungs-/Ordnungsbehoerden;
    der Polizeivollzugsdienst wird taetig, wenn die Abwehr keinen Aufschub duldet (Eilfall) oder eine
    besondere Zuweisung besteht. Ein Handeln der unzustaendigen Behoerde macht die Massnahme formell rechtswidrig.'
  norms:
  - Gesetz zum Schutz der oeffentlichen Sicherheit und Ordnung (SOG HH) und Polizeidatenverarbeitungsgesetz
    (PolDVG)
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: hh-por-vollstreckung
  type: norm
  front: Nach welchem Gesetz wird eine Gefahrenabwehrverfuegung in Hamburg vollstreckt?
  back: 'Hamburgisches Verwaltungsvollstreckungsgesetz (HmbVwVG). Regelfall ist das gestreckte Verfahren:
    Grundverfuegung - Androhung - Festsetzung - Anwendung des Zwangsmittels (Ersatzvornahme, Zwangsgeld,
    unmittelbarer Zwang). Bei Gefahr im Verzug sind Sofortvollzug bzw. unmittelbare Ausfuehrung ohne vorausgehenden
    Verwaltungsakt moeglich; die Kosten traegt der Pflichtige.'
  norms:
  - Hamburgisches Verwaltungsvollstreckungsgesetz (HmbVwVG)
  quellen:
  - Landesgesetze in der amtlichen Fassung (Landesrechtsportal)
  - Eigenformulierung Redaktion
  stand: 2026-09
