faelle:
- slug: sn-fall-bau-nutzungsuntersagung-wohnnutzung
  title: "Wohnen in der Lagerhalle"
  difficulty: 3
  minutes: 50
  quellen:
  - "Landesgesetze in der amtlichen Fassung (Landesrechtsportal)"
  - "Eigenformulierung Redaktion"
  - "§ 8 BauNVO"
  facts: >-
      E ist Eigentümer einer Lagerhalle in einem durch Bebauungsplan festgesetzten Gewerbegebiet in
      Sachsen. Er baut zwei Räume zu Wohnungen um und vermietet sie ohne Baugenehmigung an Arbeiter
      eines Subunternehmers, die dort dauerhaft wohnen. Die Wohnungen dienen weder dem Betriebsinhaber oder einem Betriebsleiter noch einer Aufsichts- oder Bereitschaftsperson des Gewerbebetriebs. Die
      Bauaufsichtsbehörde erfährt davon und untersagt E durch Verfügung die Nutzung der Räume zu
      Wohnzwecken. E meint, die Bauaufsicht müsse zunächst prüfen, ob die Nutzung nicht doch
      genehmigungsfähig sei; er habe die Räume sicher und ordentlich hergerichtet.
  question: "Ist die Nutzungsuntersagung rechtmäßig?"
  steps:
  - prompt: >-
        Welche Ermächtigungsgrundlage kommt in Betracht, und wann darf eine Nutzung untersagt werden?
    erwartung: >-
        Die SächsBO ermächtigt die Bauaufsichtsbehörde, rechtswidrige Nutzungen zu untersagen. Eine
        Nutzungsuntersagung setzt eine formell rechtswidrige Nutzung voraus, regelmäßig bei fehlender
        Genehmigung, bei der die Nutzung zudem nicht offensichtlich genehmigungsfähig ist.
  - prompt: "Ist die Nutzung formell rechtswidrig?"
    erwartung: >-
        Ja. Die Umnutzung von Gewerberäumen zu Wohnungen ist eine genehmigungsbedürftige
        Nutzungsänderung; eine Baugenehmigung liegt nicht vor.
  - prompt: "Ist die Nutzung auch materiell rechtswidrig?"
    erwartung: >-
        Ja. Im Gewerbegebiet sind Wohnungen nach der BauNVO nur ausnahmsweise für Aufsichts- und Bereitschaftspersonen sowie für Betriebsinhaber und Betriebsleiter zulässig, wenn sie dem Gewerbebetrieb zugeordnet und ihm gegenüber in Grundfläche und Baumasse untergeordnet sind (§ 8 Abs. 3 Nr. 1 BauNVO). Die Wohnnutzung durch Arbeiter eines
        Subunternehmers erfüllt diesen Ausnahmetatbestand nicht. Die Nutzung ist daher auch nicht
        genehmigungsfähig.
  - prompt: "Ist die Maßnahme ermessensfehlerfrei und verhältnismäßig?"
    erwartung: >-
        Ja. Die Untersagung ist geeignet und erforderlich, um den rechtswidrigen Zustand zu beenden;
        mildere Mittel scheiden angesichts der Nichtgenehmigungsfähigkeit aus. Dass die Räume ordentlich
        hergerichtet sind, ist unerheblich. Bestandsschutz besteht nicht, da die Nutzung nie rechtmäßig
        war. Die Nutzungsuntersagung ist rechtmäßig.
  expectation:
    pruefpunkte:
    - id: p1
      label: >-
          Formelle Illegalität: genehmigungsbedürftige Nutzungsänderung ohne Genehmigung
      weight: 2.5
      required: true
      keywords:
      - "Nutzungsänderung"
      - "formelle Illegalität"
      - "ohne Baugenehmigung"
      - "genehmigungsbedürftig"
      - "formell rechtswidrig"
      card_slugs:
