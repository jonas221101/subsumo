cards:
- slug: zr-delikt-rechtsgutsverletzung
  type: definition
  front: Welche Rechtsgüter/Rechte schützt § 823 Abs. 1 BGB?
  back: 'Der Katalog des § 823 Abs. 1 BGB ist abschließend: Leben, Körper, Gesundheit,
    Freiheit, Eigentum und ein sonstiges Recht. Als sonstiges Recht zählen nur absolute
    Rechte mit Ausschlussfunktion, etwa beschränkte dingliche Rechte, das berechtigte
    Besitzrecht, das allgemeine Persönlichkeitsrecht oder das Namensrecht. Das Recht
    am eingerichteten und ausgeübten Gewerbebetrieb ist ein von der Rechtsprechung
    entwickelter, subsidiärer Auffangtatbestand und kein Gegenbeispiel zur Abgeschlossenheit
    des Katalogs. Reine Vermögensschäden sind nicht erfasst.'
  norms:
  - § 823 Abs. 1 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-delikt-verletzungshandlung
  type: definition
  front: Was ist die Verletzungshandlung bei § 823 Abs. 1 BGB?
  back: Die Verletzungshandlung ist ein vom Willen beherrschtes oder beherrschbares
    menschliches Verhalten, das entweder in einem aktiven Tun oder - bei Bestehen
    einer Garantenstellung (z. B. aus Ingerenz oder Verkehrssicherungspflicht) - in
    einem pflichtwidrigen Unterlassen bestehen kann.
  norms:
  - § 823 Abs. 1 BGB
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-delikt-haftungsbegruendende-kausalitaet
  type: definition
  front: 'Definiere: haftungsbegründende Kausalität im Deliktsrecht'
  back: 'Die Verletzungshandlung muss für die Rechtsgutsverletzung nach der Äquivalenztheorie
    (conditio sine qua non) kausal sein und darf sich nicht als völlig außerhalb jeder
    Lebenserfahrung liegende, adäquat nicht mehr zurechenbare Folge darstellen (Adäquanztheorie).
    Zusätzlich begrenzend wirkt der Schutzzweck der Norm: Nur solche Schadensfolgen
    werden zugerechnet, die gerade in den Schutzbereich des § 823 Abs. 1 BGB fallen.'
  norms:
  - § 823 Abs. 1 BGB
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-delikt-rechtswidrigkeit
  type: definition
  front: Wie wird die Rechtswidrigkeit bei § 823 Abs. 1 BGB geprüft (Lehre vom Erfolgsunrecht)?
  back: 'Nach der Lehre vom Erfolgsunrecht indiziert die Verwirklichung des Tatbestands
    - also die Rechtsgutsverletzung durch die Verletzungshandlung - grundsätzlich
    die Rechtswidrigkeit; sie entfällt nur bei eingreifenden Rechtfertigungsgründen
    (z. B. §§ 227-229, 904 BGB, Einwilligung). Eine Ausnahme gilt bei mittelbaren
    Beeinträchtigungen und beim Unterlassen: Dort ist die Rechtswidrigkeit positiv
    festzustellen, etwa durch eine Interessen- und Güterabwägung.'
  norms:
  - § 823 Abs. 1 BGB
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-delikt-verschulden-276
  type: definition
  front: 'Definiere: Fahrlässigkeit im Deliktsrecht, § 276 Abs. 2 BGB'
  back: 'Fahrlässig handelt, wer die im Verkehr erforderliche Sorgfalt außer Acht
    lässt, § 276 Abs. 2 BGB. Maßgeblich ist ein objektiv-abstrakter Maßstab: Es kommt
    darauf an, wie sich ein gewissenhafter und besonnener Angehöriger des betroffenen
    Verkehrskreises in der konkreten Situation verhalten hätte - individuelle Fähigkeiten
    des Schädigers bleiben grundsätzlich außer Betracht.'
  norms:
  - § 276 Abs. 2 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-delikt-schaden-haftungsausfuellend
  type: definition
  front: 'Abgrenze: haftungsbegründende und haftungsausfüllende Kausalität'
  back: Die haftungsbegründende Kausalität verbindet die Verletzungshandlung mit der
    Rechtsgutsverletzung selbst (dem 'Ob' der Haftung). Die haftungsausfüllende Kausalität
    verbindet die Rechtsgutsverletzung mit dem daraus resultierenden Schaden (dem
    'Wie viel' der Haftung) und bestimmt so den Umfang des nach §§ 249 ff. BGB zu
    ersetzenden Schadens.
  norms:
  - § 823 Abs. 1 BGB
  - § 249 BGB
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-delikt-sonstiges-recht-gewerbebetrieb
  type: streitstand
  front: Was ist unter 'sonstiges Recht' i.S.d. § 823 Abs. 1 BGB zu verstehen, und
    welche Rolle spielt der eingerichtete und ausgeübte Gewerbebetrieb?
  back: Als sonstiges Recht wird nur ein absolutes Recht mit Ausschlussfunktion anerkannt,
    das dem Inhaber - wie Eigentum - eine ihm ausschließlich zugewiesene Rechtsposition
    gegenüber jedermann verschafft (z. B. beschränkte dingliche Rechte, das allgemeine
    Persönlichkeitsrecht). Das Recht am eingerichteten und ausgeübten Gewerbebetrieb
    ist nach ständiger Rechtsprechung als Auffangtatbestand anerkannt, greift aber
    nur subsidiär und setzt einen betriebsbezogenen Eingriff voraus - also eine Beeinträchtigung,
    die sich gegen den Betrieb als solchen richtet und nicht ohne Weiteres von anderen
    Rechtsgütern abgrenzbar ist.
  norms:
  - § 823 Abs. 1 BGB
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
schemata:
- slug: zr-schema-823
  title: Schadensersatzanspruch aus § 823 Abs. 1 BGB
  norms:
  - § 823 Abs. 1 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  steps:
  - label: I. Rechtsgutsverletzung
    hinweis: Leben, Körper, Gesundheit, Freiheit, Eigentum oder sonstiges Recht.
  - label: II. Verletzungshandlung
    children:
    - label: 1. Tun
    - label: 2. oder pflichtwidriges Unterlassen bei Garantenstellung
  - label: III. Haftungsbegründende Kausalität
    children:
    - label: 1. Äquivalenz (conditio sine qua non)
    - label: 2. Adäquanz und Schutzzweck der Norm
  - label: IV. Rechtswidrigkeit
    hinweis: Grundsätzlich indiziert; bei mittelbaren Beeinträchtigungen und Unterlassen
      positiv festzustellen.
  - label: V. Verschulden, § 276 BGB
    children:
    - label: 0. Deliktsfähigkeit, §§ 827, 828 BGB
      hinweis: Kinder unter sieben Jahren sowie Bewusstlose bzw. Geistesgestörte haften
        nicht; Minderjährige zwischen 7 und 17 Jahren nur bei Einsichtsfähigkeit.
    - label: 1. Vorsatz
    - label: 2. oder Fahrlässigkeit (objektiv-abstrakter Maßstab)
  - label: VI. Schaden und haftungsausfüllende Kausalität; Mitverschulden, § 254 BGB
  - label: 'VII. Rechtsfolge: Schadensersatz, §§ 249 ff. BGB; bei Körper- oder Gesundheitsverletzung
      auch Schmerzensgeld, § 253 Abs. 2 BGB'
faelle:
- slug: zr-fall-radfahrer-rotlicht
  title: Der abgelenkte Radfahrer
  difficulty: 2
  minutes: 45
  quellen:
  - Eigener Sachverhalt der Redaktion
  - BGB, amtliche Fassung
  facts: Radfahrer R fährt, während er auf sein Mobiltelefon schaut, bei Rotlicht
    über eine Kreuzung. Fußgänger F, der bei Grün die Fahrbahn überquert, wird von
    R erfasst und stürzt. F erleidet einen Bruch des rechten Unterarms; die ärztliche
    Behandlung kostet 800 Euro. Zudem wird sein Mantel beim Sturz zerrissen; ein gleichwertiger
    Ersatz kostet 150 Euro. F hat die Behandlungskosten selbst bezahlt; die Frage
    eines Forderungsübergangs auf eine Krankenkasse (§ 116 SGB X) ist nicht zu prüfen.
    F verlangt von R Ersatz in Höhe von insgesamt 950 Euro und außerdem ein angemessenes
    Schmerzensgeld.
  question: Hat F gegen R einen Anspruch auf Schadensersatz in Höhe von 950 Euro aus
    § 823 Abs. 1 BGB? Kommt daneben ein Schmerzensgeldanspruch dem Grunde nach in
    Betracht?
  steps:
  - prompt: Formuliere den Obersatz.
    erwartung: F könnte gegen R einen Anspruch auf Schadensersatz in Höhe von 950
      Euro aus § 823 Abs. 1 BGB haben.
  - prompt: Liegt eine Rechtsgutsverletzung vor?
    erwartung: Ja - der Armbruch verletzt Körper und Gesundheit des F, der zerrissene
      Mantel verletzt sein Eigentum.
  - prompt: Worin liegt die Verletzungshandlung?
    erwartung: Im Überfahren der roten Ampel durch R, während er durch sein Mobiltelefon
      abgelenkt war. Die Rechtswidrigkeit ist durch die Rechtsgutsverletzung indiziert
      (Erfolgsunrecht), Rechtfertigungsgründe sind nicht ersichtlich.
  - prompt: Ist die haftungsbegründende Kausalität gegeben?
    erwartung: Ja - hätte R nicht bei Rot die Kreuzung überquert, wäre es nicht zur
      Kollision gekommen; der Erfolg liegt auch nicht außerhalb jeder Lebenserfahrung.
  - prompt: Hat R fahrlässig gehandelt?
    erwartung: 'Ja, § 276 Abs. 2 BGB: Ein gewissenhafter Verkehrsteilnehmer hätte
      das Rotlicht beachtet und sich nicht durch sein Mobiltelefon ablenken lassen;
      R hat die im Verkehr erforderliche Sorgfalt außer Acht gelassen.'
  - prompt: Wie hoch ist der ersatzfähige Schaden?
    erwartung: 950 Euro - 800 Euro Behandlungskosten und 150 Euro für den zerrissenen
      Mantel. Der Schadensersatzanspruch des F gegen R besteht damit in Höhe von 950 Euro.
  - prompt: Kann F daneben Schmerzensgeld verlangen?
    erwartung: 'Ja, dem Grunde nach: Wegen der Verletzung von Körper und Gesundheit
      kann F auch für den immateriellen Schaden eine billige Entschädigung in Geld
      verlangen, § 253 Abs. 2 BGB; die Höhe bemisst sich nach Art und Schwere der
      Verletzung und ist hier nicht zu beziffern.'
