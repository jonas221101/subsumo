faelle:
- slug: zr-fall-radfahrer-rotlicht
  title: Der abgelenkte Radfahrer
  difficulty: 2
  minutes: 45
  quellen:
  - Eigener Sachverhalt der Redaktion
  - BGB, amtliche Fassung
  facts: Radfahrer R fährt, während er auf sein Mobiltelefon schaut, bei Rotlicht
    über eine Kreuzung. Fußgänger F, der bei Grün die Fahrbahn überquert, wird
    von R erfasst und stürzt. F erleidet einen Bruch des rechten Unterarms; die ärztliche
    Behandlung kostet 800 Euro. Zudem wird sein Mantel beim Sturz zerrissen; ein gleichwertiger
    Ersatz kostet 150 Euro. F verlangt von R Ersatz in Höhe von insgesamt 950 Euro.
  question: Hat F gegen R einen Anspruch auf Schadensersatz in Höhe von 950 Euro
    aus § 823 Abs. 1 BGB?
  steps:
  - prompt: Formuliere den Obersatz.
    erwartung: F könnte gegen R einen Anspruch auf Schadensersatz in Höhe von 950
      Euro aus § 823 Abs. 1 BGB haben.
  - prompt: Liegt eine Rechtsgutsverletzung vor?
    erwartung: Ja - der Armbruch verletzt Körper und Gesundheit des F, der zerrissene
      Mantel verletzt sein Eigentum.
  - prompt: Worin liegt die Verletzungshandlung?
    erwartung: Im Überfahren der roten Ampel durch R, während er durch sein Mobiltelefon
      abgelenkt war.
  - prompt: Ist die haftungsbegründende Kausalität gegeben?
    erwartung: Ja - hätte R nicht bei Rot die Kreuzung überquert, wäre es nicht
      zur Kollision gekommen; der Erfolg liegt auch nicht außerhalb jeder Lebenserfahrung.
  - prompt: Hat R fahrlässig gehandelt?
    erwartung: 'Ja, § 276 Abs. 2 BGB: Ein gewissenhafter Verkehrsteilnehmer hätte
      das Rotlicht beachtet und sich nicht durch sein Mobiltelefon ablenken lassen;
      R hat die im Verkehr erforderliche Sorgfalt außer Acht gelassen.'
  - prompt: Wie hoch ist der ersatzfähige Schaden?
    erwartung: 950 Euro - 800 Euro Behandlungskosten und 150 Euro für den zerrissenen
      Mantel.
