cards:
- slug: zr-delikt-rechtsgutsverletzung
  type: definition
  front: Welche Rechtsgüter/Rechte schützt § 823 Abs. 1 BGB?
  back: '§ 823 Abs. 1 BGB schützt abschließend aufgezählt: Leben, Körper, Gesundheit,
    Freiheit, Eigentum und sonstige Rechte (absolute Rechte mit Ausschlussfunktion,
    z. B. dingliche Rechte, das Persönlichkeitsrecht oder als Auffangtatbestand der
    eingerichtete und ausgeübte Gewerbebetrieb). Reine Vermögensschäden sind nicht
    erfasst.'
  norms:
  - § 823 Abs. 1 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-delikt-verletzungshandlung
  type: definition
  front: Was ist die Verletzungshandlung bei § 823 Abs. 1 BGB?
  back: Die Verletzungshandlung ist ein vom Willen beherrschtes oder beherrschbares
    menschliches Verhalten, das entweder in einem aktiven Tun oder - bei Bestehen
    einer Garantenstellung (z. B. aus Ingerenz oder Verkehrssicherungspflicht) - in
    einem pflichtwidrigen Unterlassen bestehen kann.
  norms:
  - § 823 Abs. 1 BGB
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-delikt-haftungsbegruendende-kausalitaet
  type: definition
  front: 'Definiere: haftungsbegründende Kausalität im Deliktsrecht'
  back: 'Die Verletzungshandlung muss für die Rechtsgutsverletzung nach der Äquivalenztheorie
    (conditio sine qua non) kausal sein und darf sich nicht als völlig außerhalb
    jeder Lebenserfahrung liegende, adäquat nicht mehr zurechenbare Folge darstellen
    (Adäquanztheorie). Zusätzlich begrenzend wirkt der Schutzzweck der Norm: Nur
    solche Schadensfolgen werden zugerechnet, die gerade in den Schutzbereich des
    § 823 Abs. 1 BGB fallen.'
  norms:
  - § 823 Abs. 1 BGB
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-delikt-rechtswidrigkeit
  type: definition
  front: Wie wird die Rechtswidrigkeit bei § 823 Abs. 1 BGB gepruft (Lehre vom Erfolgsunrecht)?
  back: 'Nach der Lehre vom Erfolgsunrecht indiziert die Verwirklichung des Tatbestands
    - also die Rechtsgutsverletzung durch die Verletzungshandlung - grundsätzlich
    die Rechtswidrigkeit; sie entfällt nur bei eingreifenden Rechtfertigungsgründen
    (z. B. §§ 227-229, 904 BGB, Einwilligung). Eine Ausnahme gilt bei mittelbaren
    Beeinträchtigungen und beim Unterlassen: Dort ist die Rechtswidrigkeit positiv
    festzustellen, etwa durch eine Interessen- und Güterabwägung.'
  norms:
  - § 823 Abs. 1 BGB
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-delikt-verschulden-276
  type: definition
  front: 'Definiere: Fahrlässigkeit im Deliktsrecht, § 276 Abs. 2 BGB'
  back: 'Fahrlässig handelt, wer die im Verkehr erforderliche Sorgfalt außer Acht
    lässt, § 276 Abs. 2 BGB. Maßgeblich ist ein objektiv-abstrakter Maßstab: Es
    kommt darauf an, wie sich ein gewissenhafter und besonnener Angehöriger des betroffenen
    Verkehrskreises in der konkreten Situation verhalten hätte - individuelle Fähigkeiten
    des Schädigers bleiben grundsätzlich außer Betracht.'
  norms:
  - § 276 Abs. 2 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-delikt-schaden-haftungsausfuellend
  type: definition
  front: 'Abgrenze: haftungsbegründende und haftungsausfüllende Kausalität'
  back: Die haftungsbegründende Kausalität verbindet die Verletzungshandlung mit
    der Rechtsgutsverletzung selbst (dem 'Ob' der Haftung). Die haftungsausfüllende
    Kausalität verbindet die Rechtsgutsverletzung mit dem daraus resultierenden Schaden
    (dem 'Wie viel' der Haftung) und bestimmt so den Umfang des nach §§ 249 ff. BGB
    zu ersetzenden Schadens.
  norms:
  - § 823 Abs. 1 BGB
  - § 249 BGB
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-delikt-sonstiges-recht-gewerbebetrieb
  type: streitstand
  front: Was ist unter 'sonstiges Recht' i.S.d. § 823 Abs. 1 BGB zu verstehen, und
    welche Rolle spielt der eingerichtete und ausgeübte Gewerbebetrieb?
  back: Als sonstiges Recht wird nur ein absolutes Recht mit Ausschlussfunktion anerkannt,
    das dem Inhaber - wie Eigentum - eine ihm ausschließlich zugewiesene Rechtsposition
    gegenüber jedermann verschafft (z. B. beschränkte dingliche Rechte, das allgemeine
    Persönlichkeitsrecht). Das Recht am eingerichteten und ausgeübten Gewerbebetrieb
    ist nach ständiger Rechtsprechung als Auffangtatbestand anerkannt, greift aber
    nur subsidiär und setzt einen betriebsbezogenen Eingriff voraus - also eine Beeinträchtigung,
    die sich gegen den Betrieb als solchen richtet und nicht ohne Weiteres von anderen
    Rechtsgütern abgrenzbar ist.
  norms:
  - § 823 Abs. 1 BGB
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
