- slug: zr-schema-maengelgewaehrleistung
  title: Maengelrechte des Kaeufers beim Sachkauf, §§ 434 ff. BGB
  norms:
  - § 434 Abs. 1 BGB
  - § 437 BGB
  - § 439 Abs. 1 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  steps:
  - label: I. Wirksamer Kaufvertrag, § 433 BGB
  - label: II. Sachmangel bei Gefahruebergang
    children:
    - label: 1. Subjektive Anforderungen, § 434 Abs. 2 BGB
    - label: 2. Objektive Anforderungen, § 434 Abs. 3 BGB
    - label: 3. Montageanforderungen, § 434 Abs. 4 BGB
      hinweis: Nur pruefen, wenn der Sachverhalt Anlass zur Montage gibt.
    - label: 4. Vorliegen bei Gefahruebergang, § 446 BGB
  - label: III. Kein Ausschluss der Maengelrechte
    children:
    - label: 1. Keine Kenntnis des Kaeufers vom Mangel, § 442 Abs. 1 BGB
    - label: 2. Keine wirksame Freizeichnung, §§ 444, 476 BGB
  - label: IV. Gewaehltes Maengelrecht
    children:
    - label: 1. Nacherfuellung, § 439 BGB
    - label: 2. Ruecktritt, §§ 440, 323, 326 Abs. 5 BGB
      hinweis: Fristsetzung zur Nacherfuellung grundsaetzlich erforderlich, ausser
        sie ist nach § 440 BGB oder §§ 323 Abs. 2, 326 Abs. 5 BGB entbehrlich.
    - label: 3. Minderung, § 441 BGB
    - label: 4. Schadensersatz, §§ 440, 280, 281, 283, 311a BGB
  - label: V. Keine Verjaehrung, § 438 BGB
faelle:
- slug: zr-fall-zurueckgedrehter-tachometer
  title: Der zurueckgedrehte Tachometer
  difficulty: 4
  minutes: 55
  quellen:
  - Eigener Sachverhalt der Redaktion
  - BGB, amtliche Fassung
  facts: 'Haendler V verkauft Kaeufer K einen gebrauchten Pkw fuer 12.000 Euro. Im
    Kaufvertrag ist als Beschaffenheit "Kilometerstand lt. Tacho: 60.000 km" vereinbart.
    Tatsaechlich betraegt die Laufleistung 110.000 km; der Tachometer wurde von einem
    Vorbesitzer manipuliert, was weder V noch K bei Vertragsschluss wussten. Zwei
    Monate nach Uebergabe faellt K die Abweichung bei einer Inspektion auf. K setzt
    V eine Frist von zwei Wochen zur Nachlieferung eines Fahrzeugs mit tatsaechlich
    60.000 km Laufleistung. V teilt mit, ein Fahrzeug mit exakt diesem Kilometerstand
    koenne er nicht beschaffen; auch die Korrektur des Kilometerstands am vorhandenen
    Fahrzeug sei technisch nicht moeglich. Nach fruchtlosem Fristablauf erklaert K
    den Ruecktritt vom Kaufvertrag und verlangt Rueckzahlung des Kaufpreises Zug um
    Zug gegen Ruecknahme des Fahrzeugs.'
  question: Kann K von V Rueckzahlung des Kaufpreises Zug um Zug gegen Ruecknahme
    des Fahrzeugs verlangen?
  steps:
  - prompt: Formuliere den Obersatz.
    erwartung: K koennte gegen V einen Anspruch auf Rueckzahlung des Kaufpreises Zug
      um Zug gegen Ruecknahme des Fahrzeugs aus §§ 437 Nr. 2, 440, 323, 346 Abs. 1
      BGB haben.
  - prompt: Liegt ein Sachmangel vor?
    erwartung: Ja - die vereinbarte Beschaffenheit "60.000 km" liegt nicht vor, da
      die tatsaechliche Laufleistung 110.000 km betraegt; damit fehlt eine subjektive
      Anforderung nach § 434 Abs. 2 BGB.
  - prompt: Liegt der Sachmangel bereits bei Gefahruebergang vor?
    erwartung: Ja - die Manipulation erfolgte bereits vor Uebergabe durch einen Vorbesitzer,
      sodass der Mangel bei Gefahruebergang (§ 446 BGB) bereits vorlag.
  - prompt: War die von K gesetzte Frist zur Nacherfuellung erforderlich?
    erwartung: Grundsaetzlich ja (§ 323 Abs. 1 BGB); K hat die Frist ohnehin gesetzt.
      Die verlangte Nachlieferung eines Fahrzeugs mit exakt 60.000 km Laufleistung
      ist jedoch unmoeglich, da ein solches Fahrzeug nicht existiert - die Nacherfuellung
      in dieser Art ist nach § 275 Abs. 1 BGB ausgeschlossen.
  - prompt: Welche Rechtsfolge hat die Unmoeglichkeit der Nachlieferung fuer den Ruecktritt?
    erwartung: Nach § 326 Abs. 5 i.V.m. § 323 BGB kann K vom Vertrag zuruecktreten,
      ohne dass es einer (weiteren) Fristsetzung bedarf, da die Nacherfuellung in
      dieser Art unmoeglich ist.
  - prompt: Ist die Pflichtverletzung unerheblich im Sinne des § 323 Abs. 5 S. 2 BGB?
    erwartung: Nein - eine Abweichung von rund 50.000 km bei der vereinbarten Laufleistung
      ist angesichts ihrer erheblichen Auswirkung auf den Fahrzeugwert keine unerhebliche
      Pflichtverletzung.
  - prompt: Welche Rechtsfolgen hat der wirksame Ruecktritt?
    erwartung: 'Es entsteht ein Rueckgewaehrschuldverhaeltnis, § 346 Abs. 1 BGB: V
      muss den Kaufpreis zurueckzahlen, K das Fahrzeug zurueckuebereignen - beides
      Zug um Zug.'
  expectation:
