cards:
- slug: zr-kaufrecht-sachmangel-begriff
  type: definition
  front: 'Definiere: Sachmangel, § 434 Abs. 1 BGB'
  back: Die Kaufsache ist frei von Sachmängeln, wenn sie bei Gefahrübergang den
    subjektiven Anforderungen, den objektiven Anforderungen und den Montageanforderungen
    entspricht, § 434 Abs. 1 BGB. Ein Sachmangel liegt vor, wenn mindestens eine dieser
    Anforderungen nicht erfüllt ist.
  norms:
  - § 434 Abs. 1 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-kaufrecht-subjektive-anforderungen
  type: definition
  front: 'Definiere: subjektive Anforderungen an die Kaufsache, § 434 Abs. 2 BGB'
  back: Die Sache entspricht den subjektiven Anforderungen, wenn sie die vereinbarte
    Beschaffenheit hat, sich für die nach dem Vertrag vorausgesetzte Verwendung eignet
    und mit dem vereinbarten Zubehör sowie den vereinbarten Anleitungen übergeben
    wird. Maßgeblich ist vorrangig die individuelle Parteivereinbarung.
  norms:
  - § 434 Abs. 2 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-kaufrecht-objektive-anforderungen
  type: definition
  front: 'Definiere: objektive Anforderungen an die Kaufsache, § 434 Abs. 3 BGB'
  back: Ergänzend zu den subjektiven Anforderungen muss sich die Sache für die gewöhnliche
    Verwendung eignen und eine Beschaffenheit aufweisen, die bei Sachen derselben
    Art üblich ist und die der Käufer nach Art der Sache erwarten kann - insbesondere
    unter Berücksichtigung öffentlicher Äußerungen des Verkäufers oder Herstellers.
    Objektive Anforderungen gelten zusätzlich, auch wenn die subjektiven Anforderungen
    erfüllt sind.
  norms:
  - § 434 Abs. 3 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-kaufrecht-rechte-des-kaeufers-437
  type: norm
  front: Welche Rechte gewährt § 437 BGB dem Käufer bei einem Mangel?
  back: '§ 437 BGB fasst die Mängelrechte des Käufers zusammen: Nacherfüllung nach
    § 439 BGB, Rücktritt nach §§ 440, 323, 326 Abs. 5 BGB oder Minderung nach § 441
    BGB sowie Schadensersatz nach §§ 440, 280, 281, 283, 311a BGB oder Ersatz vergeblicher
    Aufwendungen nach § 284 BGB. Die Norm ist eine Rechtsgrundverweisung: Sie gewährt
    selbst keinen Anspruch, sondern verweist auf die jeweiligen Anspruchsgrundlagen.'
  norms:
  - § 437 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-kaufrecht-nacherfuellung-wahlrecht
  type: definition
  front: 'Definiere: Nacherfüllung und das Wahlrecht des Käufers, § 439 Abs. 1 BGB'
  back: Der Käufer kann als Nacherfüllung nach seiner Wahl die Beseitigung des Mangels
    (Nachbesserung) oder die Lieferung einer mangelfreien Sache (Nachlieferung) verlangen,
    § 439 Abs. 1 BGB. Das Wahlrecht liegt beim Käufer, nicht beim Verkäufer; dieser
    trägt die zum Zweck der Nacherfüllung erforderlichen Aufwendungen.
  norms:
  - § 439 Abs. 1 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-kaufrecht-nacherfuellung-verweigerung
  type: norm
  front: Wann kann der Verkäufer die vom Käufer gewählte Art der Nacherfüllung
    verweigern?
  back: Der Verkäufer kann die vom Käufer gewählte Art der Nacherfüllung unbeschadet
    des § 275 Abs. 2 und 3 BGB verweigern, wenn sie nur mit unverhältnismäßigen
    Kosten möglich ist, § 439 Abs. 4 BGB. Bei der Beurteilung sind insbesondere der
    Wert der Sache in mangelfreiem Zustand, die Bedeutung des Mangels und die Frage
    zu berücksichtigen, ob auf die andere Art der Nacherfüllung ohne erhebliche
    Nachteile für den Käufer zurückgegriffen werden könnte.
  norms:
  - § 439 Abs. 4 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-kaufrecht-fristsetzung-entbehrlich
  type: norm
  front: Wann ist die für Rücktritt und Schadensersatz erforderliche Fristsetzung
    entbehrlich, § 440 BGB?
  back: Der Fristsetzung zur Nacherfüllung bedarf es zusätzlich zu den allgemeinen
    Fällen des § 323 Abs. 2 und des § 281 Abs. 2 BGB dann nicht, wenn der Verkäufer
    beide Arten der Nacherfüllung nach § 439 Abs. 4 BGB verweigert hat, wenn die
    Nacherfüllung fehlgeschlagen ist oder wenn dem Käufer die Nacherfüllung unzumutbar
    ist. Eine Nachbesserung gilt nach zwei erfolglosen Versuchen im Regelfall als
    fehlgeschlagen, sofern sich nicht aus der Art der Sache, des Mangels oder aus
    den sonstigen Umständen etwas anderes ergibt.
  norms:
  - § 440 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-kaufrecht-minderung-berechnung
  type: definition
  front: Wie wird die Minderung nach § 441 Abs. 3 BGB berechnet?
  back: Bei der Minderung ist der Kaufpreis in dem Verhältnis herabzusetzen, in welchem
    zur Zeit des Vertragsschlusses der Wert der Sache in mangelfreiem Zustand zu ihrem
    wirklichen Wert gestanden haben würde. Die Minderung ist damit betragsgenau berechenbar
    und unterscheidet sich vom Rücktritt dadurch, dass der Vertrag im Übrigen bestehen
    bleibt.
  norms:
  - § 441 Abs. 3 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-kaufrecht-verjaehrung-maengelanspruch
  type: norm
  front: Welche Verjährungsfrist gilt für Mängelansprüche beim Sachkauf, § 438
    BGB?
  back: Ansprüche wegen eines Sachmangels verjähren beim Sachkauf regelmäßig in
    zwei Jahren, § 438 Abs. 1 Nr. 3 BGB. Die Frist beginnt mit der Ablieferung der
    Sache, § 438 Abs. 2 BGB - abweichend von der allgemeinen Regelverjährung des
    § 199 BGB, die an die Kenntnis des Gläubigers anknüpft.
  norms:
  - § 438 Abs. 1 Nr. 3 BGB
  - § 438 Abs. 2 BGB
  - § 199 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-kaufrecht-ruecktritt-schadensersatz-kumulation
  type: streitstand
  front: Können Rücktritt und Schadensersatz statt der Leistung nebeneinander geltend
    gemacht werden?
  back: Rücktritt und Schadensersatz statt der ganzen Leistung schließen sich nicht
    gegenseitig aus, § 325 BGB, und können kumulativ geltend gemacht werden. Praktisch
    bedeutsam ist das etwa, wenn der Käufer nach dem Rücktritt zusätzlich Ersatz
    eines Mangelfolgeschadens verlangt, der durch die bloße Rückabwicklung nicht
    ausgeglichen wird. Die Minderung schließt dagegen als Gestaltungsrecht anstelle
    des Rücktritts eine gleichzeitige Geltendmachung von Schadensersatz statt der
    Leistung für denselben Mangel grundsätzlich nicht aus, da beide Rechtsbehelfe
    unterschiedliche Zwecke verfolgen.
  norms:
  - § 325 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-kaufrecht-ruecktritt-minderung-exklusivitaet
  type: streitstand
  front: Wie verhalten sich Rücktritt und Minderung zueinander?
  back: 'Rücktritt und Minderung sind alternative Gestaltungsrechte: Statt zurückzutreten,
    kann der Käufer den Kaufpreis durch Erklärung gegenüber dem Verkäufer mindern,
    § 441 Abs. 1 BGB. Erklärt der Käufer wirksam die Minderung, ist der Rücktritt
    wegen desselben Mangels ausgeschlossen und umgekehrt. Ein einmal wirksam ausgeübtes
    Gestaltungsrecht bindet den Käufer; ein Wechsel zum jeweils anderen Recht ist
    für denselben Mangel nicht mehr möglich.'
  norms:
  - § 441 Abs. 1 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
