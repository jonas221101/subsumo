topic:
  slug: zr-kaufrecht-maengelgewaehrleistung
  area: zivilrecht
  title: Mängelgewährleistung im Kaufrecht (vertieft), §§ 434 ff. BGB
  parent: zr-bgb-at
  relevance: 5
  stand: 2026-09
  redaktion:
    erzeugt_von: collector-agent-v1
    geprueft_von: reviewer-agent-v1
    geprueft_am: '2026-09-15'
    status: in-pruefung
    normzitate_geprueft: true
cards:
- slug: zr-kaufrecht-sachmangel-begriff
  type: definition
  front: 'Definiere: Sachmangel, § 434 Abs. 1 BGB'
  back: Die Kaufsache ist frei von Sachmängeln, wenn sie bei Gefahrübergang den subjektiven
    Anforderungen, den objektiven Anforderungen und den Montageanforderungen entspricht,
    § 434 Abs. 1 BGB. Ein Sachmangel liegt vor, wenn mindestens eine dieser Anforderungen
    nicht erfüllt ist.
  norms:
  - § 434 Abs. 1 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-kaufrecht-subjektive-anforderungen
  type: definition
  front: 'Definiere: subjektive Anforderungen an die Kaufsache, § 434 Abs. 2 BGB'
  back: Die Sache entspricht den subjektiven Anforderungen, wenn sie die vereinbarte
    Beschaffenheit hat, sich für die nach dem Vertrag vorausgesetzte Verwendung eignet
    und mit dem vereinbarten Zubehör sowie den vereinbarten Anleitungen übergeben
    wird. Maßgeblich ist vorrangig die individuelle Parteivereinbarung.
  norms:
  - § 434 Abs. 2 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-kaufrecht-objektive-anforderungen
  type: definition
  front: 'Definiere: objektive Anforderungen an die Kaufsache, § 434 Abs. 3 BGB'
  back: 'Soweit nicht wirksam eine abweichende Vereinbarung getroffen wurde, muss
    die Sache den objektiven Anforderungen des § 434 Abs. 3 BGB entsprechen: Sie muss
    sich für die gewöhnliche Verwendung eignen (Nr. 1); eine Beschaffenheit aufweisen,
    die bei Sachen derselben Art üblich ist und die der Käufer erwarten kann - dazu
    gehören etwa Menge, Qualität, Funktionalität, Kompatibilität, Sicherheit und Haltbarkeit,
    auch unter Berücksichtigung öffentlicher Äußerungen des Verkäufers oder Herstellers
    (Nr. 2); der Beschaffenheit einer Probe oder eines Musters entsprechen (Nr. 3);
    und mit dem üblichen Zubehör einschließlich Verpackung und Anleitungen geliefert
    werden (Nr. 4). Die objektiven Anforderungen gelten grundsätzlich zusätzlich zu
    den subjektiven, auch wenn diese erfüllt sind. Eine Abweichung ist möglich, aber
    an Voraussetzungen geknüpft: Beim Verbrauchsgüterkauf nur, wenn der Verbraucher
    vor Vertragsschluss eigens von der Abweichung eines bestimmten Merkmals in Kenntnis
    gesetzt wurde und die Abweichung im Vertrag ausdrücklich und gesondert vereinbart
    ist (§ 476 Abs. 1 S. 2 BGB).'
  norms:
  - § 434 Abs. 3 BGB
  - § 476 Abs. 1 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-kaufrecht-rechte-des-kaeufers-437
  type: norm
  front: Welche Rechte gewährt § 437 BGB dem Käufer bei einem Mangel?
  back: '§ 437 BGB fasst die Mängelrechte des Käufers zusammen: Nacherfüllung nach
    § 439 BGB, Rücktritt nach §§ 440, 323, 326 Abs. 5 BGB oder Minderung nach § 441
    BGB sowie Schadensersatz nach §§ 440, 280, 281, 283, 311a BGB oder Ersatz vergeblicher
    Aufwendungen nach § 284 BGB. Die Norm ist eine Rechtsgrundverweisung: Sie gewährt
    selbst keinen Anspruch, sondern verweist auf die jeweiligen Anspruchsgrundlagen.'
  norms:
  - § 437 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-kaufrecht-nacherfuellung-wahlrecht
  type: definition
  front: 'Definiere: Nacherfüllung und das Wahlrecht des Käufers, § 439 Abs. 1 BGB'
  back: Der Käufer kann als Nacherfüllung nach seiner Wahl die Beseitigung des Mangels
    (Nachbesserung) oder die Lieferung einer mangelfreien Sache (Nachlieferung) verlangen,
    § 439 Abs. 1 BGB. Das Wahlrecht liegt beim Käufer, nicht beim Verkäufer; dieser
    trägt die zum Zweck der Nacherfüllung erforderlichen Aufwendungen.
  norms:
  - § 439 Abs. 1 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-kaufrecht-nacherfuellung-verweigerung
  type: norm
  front: Wann kann der Verkäufer die vom Käufer gewählte Art der Nacherfüllung verweigern?
  back: Der Verkäufer kann die vom Käufer gewählte Art der Nacherfüllung unbeschadet
    des § 275 Abs. 2 und 3 BGB verweigern, wenn sie nur mit unverhältnismäßigen Kosten
    möglich ist, § 439 Abs. 4 BGB. Bei der Beurteilung sind insbesondere der Wert
    der Sache in mangelfreiem Zustand, die Bedeutung des Mangels und die Frage zu
    berücksichtigen, ob auf die andere Art der Nacherfüllung ohne erhebliche Nachteile
    für den Käufer zurückgegriffen werden könnte.
  norms:
  - § 439 Abs. 4 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-kaufrecht-fristsetzung-entbehrlich
  type: norm
  front: Wann ist die für Rücktritt und Schadensersatz erforderliche Fristsetzung
    entbehrlich, § 440 BGB?
  back: Der Fristsetzung zur Nacherfüllung bedarf es zusätzlich zu den allgemeinen
    Fällen des § 323 Abs. 2 und des § 281 Abs. 2 BGB dann nicht, wenn der Verkäufer
    beide Arten der Nacherfüllung nach § 439 Abs. 4 BGB verweigert hat, wenn die Nacherfüllung
    fehlgeschlagen ist oder wenn dem Käufer die Nacherfüllung unzumutbar ist. Eine
    Nachbesserung gilt nach zwei erfolglosen Versuchen im Regelfall als fehlgeschlagen,
    sofern sich nicht aus der Art der Sache, des Mangels oder aus den sonstigen Umständen
    etwas anderes ergibt.
  norms:
  - § 440 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-kaufrecht-minderung-berechnung
  type: definition
  front: Wie wird die Minderung nach § 441 Abs. 3 BGB berechnet?
  back: Bei der Minderung ist der Kaufpreis in dem Verhältnis herabzusetzen, in welchem
    zur Zeit des Vertragsschlusses der Wert der Sache in mangelfreiem Zustand zu ihrem
    wirklichen Wert gestanden haben würde. Die Minderung ist damit betragsgenau berechenbar
    und unterscheidet sich vom Rücktritt dadurch, dass der Vertrag im Übrigen bestehen
    bleibt.
  norms:
  - § 441 Abs. 3 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-kaufrecht-verjaehrung-maengelanspruch
  type: norm
  front: Welche Verjährungsfrist gilt für Mängelansprüche beim Sachkauf, § 438 BGB?
  back: 'Ansprüche wegen eines Sachmangels verjähren beim Sachkauf regelmäßig in zwei
    Jahren (§ 438 Abs. 1 Nr. 3 BGB); in 30 Jahren, wenn der Mangel in einem dinglichen
    Recht eines Dritten besteht, auf Grund dessen Herausgabe verlangt werden kann
    (Nr. 1); in fünf Jahren bei Bauwerken und bei Sachen, die entsprechend ihrer üblichen
    Verwendung für ein Bauwerk verwendet worden sind und dessen Mangelhaftigkeit verursacht
    haben (Nr. 2). Die Frist beginnt mit der Ablieferung der Sache (§ 438 Abs. 2 BGB)
    - abweichend von der allgemeinen Regelverjährung des § 199 BGB, die an die Kenntnis
    des Gläubigers anknüpft. Hat der Verkäufer den Mangel arglistig verschwiegen,
    gilt die Regelverjährung der §§ 195, 199 BGB, aber nicht vor Ablauf der Fristen
    nach Nr. 1 und 2 (§ 438 Abs. 3 BGB). Rücktritt und Minderung sind Gestaltungsrechte:
    Nach § 438 Abs. 4, 5 BGB i. V. m. § 218 BGB ist der Rücktritt bzw. die Minderung
    unwirksam, wenn der Nacherfüllungsanspruch verjährt ist und der Verkäufer sich
    darauf beruft. Beim Verbrauchsgüterkauf gelten ergänzende Sonderregeln (§ 475e
    BGB).'
  norms:
  - § 438 Abs. 1 Nr. 3 BGB
  - § 438 Abs. 2 BGB
  - § 438 Abs. 3 BGB
  - § 438 Abs. 4 BGB
  - § 218 BGB
  - § 199 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-kaufrecht-ruecktritt-schadensersatz-kumulation
  type: streitstand
  front: Können Rücktritt und Schadensersatz statt der Leistung nebeneinander geltend
    gemacht werden?
  back: 'Rücktritt und Schadensersatz schließen sich nicht gegenseitig aus, § 325
    BGB: Der Käufer kann nach dem Rücktritt Schadensersatz statt der ganzen Leistung
    verlangen, etwa für einen Mangelfolgeschaden, der durch die bloße Rückabwicklung
    nicht ausgeglichen wird. Die Minderung steht dagegen im Konflikt mit dem Schadensersatz
    statt der ganzen Leistung: Wer mindert, behält die Sache und den (herabgesetzten)
    Vertrag; der große Schadensersatz setzt die Rückgabe der Sache voraus und ist
    daher neben der Minderung ausgeschlossen. Möglich bleibt neben der Minderung nur
    der kleine Schadensersatz (Ersatz des Mangelschadens bzw. von Folgeschäden), wobei
    die Minderung auf den Schaden anzurechnen ist, damit der Wertverlust nicht doppelt
    ersetzt wird.'
  norms:
  - § 325 BGB
  - § 441 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-kaufrecht-ruecktritt-minderung-exklusivitaet
  type: streitstand
  front: Wie verhalten sich Rücktritt und Minderung zueinander?
  back: 'Rücktritt und Minderung sind alternative Gestaltungsrechte: Statt zurückzutreten,
    kann der Käufer den Kaufpreis durch Erklärung gegenüber dem Verkäufer mindern,
    § 441 Abs. 1 BGB. Als ausgeübtes Gestaltungsrecht ist die Erklärung unwiderruflich
    und bindend: Hat der Käufer wirksam gemindert, bleibt der Vertrag in herabgesetzter
    Form bestehen, ein späterer Rücktritt wegen desselben Mangels ist ausgeschlossen.
    Umgekehrt ist nach wirksamem Rücktritt für eine Minderung kein Raum mehr, weil
    der Vertrag in ein Rückgewährschuldverhältnis (§ 346 Abs. 1 BGB) umgewandelt wurde.
    Während der Käufer vor Ausübung zwischen beiden wählen kann, ist ein Wechsel danach
    für denselben Mangel nicht mehr möglich.'
  norms:
  - § 441 Abs. 1 BGB
  - § 346 Abs. 1 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
