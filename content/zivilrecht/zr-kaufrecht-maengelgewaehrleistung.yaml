- slug: zr-schema-maengelgewaehrleistung
  title: Mängelrechte des Käufers beim Sachkauf, §§ 434 ff. BGB
  norms:
  - § 434 Abs. 1 BGB
  - § 437 BGB
  - § 439 Abs. 1 BGB
  - § 323 Abs. 5 BGB
  - § 477 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  steps:
  - label: I. Wirksamer Kaufvertrag, § 433 BGB
  - label: II. Sachmangel bei Gefahrübergang
    children:
    - label: 1. Subjektive Anforderungen, § 434 Abs. 2 BGB
    - label: 2. Objektive Anforderungen, § 434 Abs. 3 BGB
    - label: 3. Montageanforderungen, § 434 Abs. 4 BGB
      hinweis: Nur prüfen, wenn der Sachverhalt Anlass zur Montage gibt.
    - label: 4. Vorliegen bei Gefahrübergang, § 446 BGB
  - label: III. Kein Ausschluss der Mängelrechte
    children:
    - label: 1. Keine Kenntnis des Käufers vom Mangel, § 442 Abs. 1 BGB
    - label: 2. Keine wirksame Freizeichnung, §§ 444, 476 BGB
  - label: IV. Gewähltes Mängelrecht
    children:
    - label: 1. Nacherfüllung, § 439 BGB
    - label: 2. Rücktritt, §§ 440, 323, 326 Abs. 5 BGB
      hinweis: Fristsetzung zur Nacherfüllung grundsätzlich erforderlich, außer sie
        ist nach § 440 BGB oder §§ 323 Abs. 2, 326 Abs. 5 BGB entbehrlich.
      children:
      - label: a) Erheblichkeit der Pflichtverletzung, § 323 Abs. 5 S. 2 BGB
      - label: b) Ausschluss bei überwiegender Verantwortlichkeit des Käufers, § 323
          Abs. 6 BGB
    - label: 3. Minderung, § 441 BGB
    - label: 4. Schadensersatz, §§ 440, 280, 281, 283, 311a BGB
  - label: V. Keine Verjährung, § 438 BGB
  - label: VI. Sonderregeln beim Verbrauchsgüterkauf, §§ 474 ff. BGB
    hinweis: 'Nur Hinweis: Ist der Käufer Verbraucher und der Verkäufer Unternehmer,
      sind insbesondere § 476 (Abweichungsverbot) und § 477 (Beweislastumkehr bei
      Mängeln innerhalb eines Jahres) zu beachten.'
faelle:
- slug: zr-fall-zurueckgedrehter-tachometer
  title: Der zurückgedrehte Tachometer
  difficulty: 4
  minutes: 55
  quellen:
  - Eigener Sachverhalt der Redaktion
  - BGB, amtliche Fassung
  facts: 'Händler V verkauft der Privatperson K (Verbraucherin) einen gebrauchten
    Pkw für 12.000 Euro. Im Kaufvertrag ist ausdrücklich als Beschaffenheit vereinbart:
    "Gesamtlaufleistung 60.000 km". Tatsächlich beträgt die Laufleistung 110.000 km;
    der Tachometer wurde von einem Vorbesitzer manipuliert, was weder V noch K bei
    Vertragsschluss wussten. Zwei Monate nach Übergabe fällt K die Abweichung bei
    einer Inspektion auf. K setzt V eine Frist von zwei Wochen zur Nacherfüllung.
    V teilt mit, es handle sich um ein Einzelstück; ein anderes Fahrzeug mit exakt
    dieser Laufleistung besitze er nicht, und die tatsächliche Laufleistung des verkauften
    Fahrzeugs lasse sich nicht verändern. Nach fruchtlosem Fristablauf erklärt K den
    Rücktritt vom Kaufvertrag und verlangt Rückzahlung des Kaufpreises Zug um Zug
    gegen Rücknahme des Fahrzeugs.'
  question: Kann K von V Rückzahlung des Kaufpreises Zug um Zug gegen Rücknahme des
    Fahrzeugs verlangen?
  steps:
  - prompt: Formuliere den Obersatz.
    erwartung: K könnte gegen V einen Anspruch auf Rückzahlung des Kaufpreises Zug
      um Zug gegen Rücknahme des Fahrzeugs aus §§ 437 Nr. 2, 323 Abs. 1, 326 Abs.
      5, 346 Abs. 1 BGB haben.
  - prompt: Liegt ein Sachmangel vor?
    erwartung: Ja - die vereinbarte Beschaffenheit "Gesamtlaufleistung 60.000 km"
      liegt nicht vor, da die tatsächliche Laufleistung 110.000 km beträgt; damit
      fehlt eine subjektive Anforderung nach § 434 Abs. 2 S. 1 Nr. 1 BGB. Dass die
      Parteien eine Beschaffenheit über die tatsächliche Laufleistung (nicht nur über
      die Anzeige des Tachos) vereinbart haben, folgt aus der Auslegung der Vereinbarung
      nach §§ 133, 157 BGB. Hilfsweise fehlt auch die nach § 434 Abs. 3 S. 1 Nr. 2
      BGB übliche Beschaffenheit.
  - prompt: Liegt der Sachmangel bereits bei Gefahrübergang vor?
    erwartung: 'Ja - die Manipulation erfolgte bereits vor Übergabe durch einen Vorbesitzer,
      sodass der Mangel bei Gefahrübergang (§ 446 BGB) bereits vorlag. Zusätzlich
      greift zugunsten der Verbraucherin K die Beweislastumkehr beim Verbrauchsgüterkauf:
      Zeigt sich der Mangel innerhalb eines Jahres seit Gefahrübergang, wird vermutet,
      dass er schon bei Gefahrübergang vorlag (§ 477 BGB).'
  - prompt: War die von K gesetzte Frist zur Nacherfüllung erforderlich?
    erwartung: 'Grundsätzlich ja (§ 323 Abs. 1 BGB); K hat die Frist ohnehin gesetzt.
      Beide Arten der Nacherfüllung sind jedoch ausgeschlossen, § 275 Abs. 1 BGB:
      Die Nachlieferung scheitert beim Stückkauf eines individuellen Gebrauchtwagens
      daran, dass die Sache nach dem Parteiwillen nicht austauschbar ist (nicht daran,
      dass kein Fahrzeug mit dieser Laufleistung existiert); die Nachbesserung ist
      unmöglich, weil sich die tatsächliche Laufleistung als historische Tatsache
      nicht ändern lässt.'
  - prompt: Welche Rechtsfolge hat die Unmöglichkeit der Nachlieferung für den Rücktritt?
    erwartung: 'Weil beide Arten der Nacherfüllung nach § 275 Abs. 1 BGB ausgeschlossen
      sind, kann K nach § 326 Abs. 5 i. V. m. § 323 BGB vom Vertrag zurücktreten,
      ohne dass es einer (weiteren) Fristsetzung bedarf (§ 326 Abs. 5 Hs. 2 BGB: §
      323 gilt ohne Fristsetzung). Die Entbehrlichkeit folgt nicht aus § 440 BGB,
      sondern aus § 326 Abs. 5 BGB.'
  - prompt: Ist die Pflichtverletzung unerheblich im Sinne des § 323 Abs. 5 S. 2 BGB?
    erwartung: Nein - eine Abweichung von rund 50.000 km bei der vereinbarten Laufleistung
      ist angesichts ihrer erheblichen Auswirkung auf den Fahrzeugwert keine unerhebliche
      Pflichtverletzung.
  - prompt: Welche Rechtsfolgen hat der wirksame Rücktritt?
    erwartung: 'Es entsteht ein Rückgewährschuldverhältnis, § 346 Abs. 1 BGB: V muss
      den Kaufpreis zurückzahlen, K das Fahrzeug zurückübereignen - beides Zug um
      Zug.'
