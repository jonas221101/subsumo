cards:
- slug: zr-kaufrecht-sachmangel-begriff
  type: definition
  front: 'Definiere: Sachmangel, § 434 Abs. 1 BGB'
  back: Die Kaufsache ist frei von Sachmaengeln, wenn sie bei Gefahruebergang den
    subjektiven Anforderungen, den objektiven Anforderungen und den Montageanforderungen
    entspricht, § 434 Abs. 1 BGB. Ein Sachmangel liegt vor, wenn mindestens eine dieser
    Anforderungen nicht erfuellt ist.
  norms:
  - § 434 Abs. 1 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-kaufrecht-subjektive-anforderungen
  type: definition
  front: 'Definiere: subjektive Anforderungen an die Kaufsache, § 434 Abs. 2 BGB'
  back: Die Sache entspricht den subjektiven Anforderungen, wenn sie die vereinbarte
    Beschaffenheit hat, sich fuer die nach dem Vertrag vorausgesetzte Verwendung eignet
    und mit dem vereinbarten Zubehoer sowie den vereinbarten Anleitungen uebergeben
    wird. Massgeblich ist vorrangig die individuelle Parteivereinbarung.
  norms:
  - § 434 Abs. 2 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-kaufrecht-objektive-anforderungen
  type: definition
  front: 'Definiere: objektive Anforderungen an die Kaufsache, § 434 Abs. 3 BGB'
  back: Ergaenzend zu den subjektiven Anforderungen muss sich die Sache fuer die gewoehnliche
    Verwendung eignen und eine Beschaffenheit aufweisen, die bei Sachen derselben
    Art ueblich ist und die der Kaeufer nach Art der Sache erwarten kann - insbesondere
    unter Beruecksichtigung oeffentlicher Aeusserungen des Verkaeufers oder Herstellers.
    Objektive Anforderungen gelten zusaetzlich, auch wenn die subjektiven Anforderungen
    erfuellt sind.
  norms:
  - § 434 Abs. 3 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-kaufrecht-rechte-des-kaeufers-437
  type: norm
  front: Welche Rechte gewaehrt § 437 BGB dem Kaeufer bei einem Mangel?
  back: '§ 437 BGB fasst die Maengelrechte des Kaeufers zusammen: Nacherfuellung nach
    § 439 BGB, Ruecktritt nach §§ 440, 323, 326 Abs. 5 BGB oder Minderung nach § 441
    BGB sowie Schadensersatz nach §§ 440, 280, 281, 283, 311a BGB oder Ersatz vergeblicher
    Aufwendungen nach § 284 BGB. Die Norm ist eine Rechtsgrundverweisung: Sie gewaehrt
    selbst keinen Anspruch, sondern verweist auf die jeweiligen Anspruchsgrundlagen.'
  norms:
  - § 437 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-kaufrecht-nacherfuellung-wahlrecht
  type: definition
  front: 'Definiere: Nacherfuellung und das Wahlrecht des Kaeufers, § 439 Abs. 1 BGB'
  back: Der Kaeufer kann als Nacherfuellung nach seiner Wahl die Beseitigung des Mangels
    (Nachbesserung) oder die Lieferung einer mangelfreien Sache (Nachlieferung) verlangen,
    § 439 Abs. 1 BGB. Das Wahlrecht liegt beim Kaeufer, nicht beim Verkaeufer; dieser
    traegt die zum Zweck der Nacherfuellung erforderlichen Aufwendungen.
  norms:
  - § 439 Abs. 1 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-kaufrecht-nacherfuellung-verweigerung
  type: norm
  front: Wann kann der Verkaeufer die vom Kaeufer gewaehlte Art der Nacherfuellung
    verweigern?
  back: Der Verkaeufer kann die vom Kaeufer gewaehlte Art der Nacherfuellung unbeschadet
    des § 275 Abs. 2 und 3 BGB verweigern, wenn sie nur mit unverhaeltnismaessigen
    Kosten moeglich ist, § 439 Abs. 4 BGB. Bei der Beurteilung sind insbesondere der
    Wert der Sache in mangelfreiem Zustand, die Bedeutung des Mangels und die Frage
    zu beruecksichtigen, ob auf die andere Art der Nacherfuellung ohne erhebliche
    Nachteile fuer den Kaeufer zurueckgegriffen werden koennte.
  norms:
  - § 439 Abs. 4 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-kaufrecht-fristsetzung-entbehrlich
  type: norm
  front: Wann ist die fuer Ruecktritt und Schadensersatz erforderliche Fristsetzung
    entbehrlich, § 440 BGB?
  back: Der Fristsetzung zur Nacherfuellung bedarf es zusaetzlich zu den allgemeinen
    Faellen des § 323 Abs. 2 und des § 281 Abs. 2 BGB dann nicht, wenn der Verkaeufer
    beide Arten der Nacherfuellung nach § 439 Abs. 4 BGB verweigert hat, wenn die
    Nacherfuellung fehlgeschlagen ist oder wenn dem Kaeufer die Nacherfuellung unzumutbar
    ist. Eine Nachbesserung gilt nach zwei erfolglosen Versuchen im Regelfall als
    fehlgeschlagen, sofern sich nicht aus der Art der Sache, des Mangels oder aus
    den sonstigen Umstaenden etwas anderes ergibt.
  norms:
  - § 440 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-kaufrecht-minderung-berechnung
  type: definition
  front: Wie wird die Minderung nach § 441 Abs. 3 BGB berechnet?
  back: Bei der Minderung ist der Kaufpreis in dem Verhaeltnis herabzusetzen, in welchem
    zur Zeit des Vertragsschlusses der Wert der Sache in mangelfreiem Zustand zu ihrem
    wirklichen Wert gestanden haben wuerde. Die Minderung ist damit betragsgenau berechenbar
    und unterscheidet sich vom Ruecktritt dadurch, dass der Vertrag im Uebrigen bestehen
    bleibt.
  norms:
  - § 441 Abs. 3 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-kaufrecht-verjaehrung-maengelanspruch
  type: norm
  front: Welche Verjaehrungsfrist gilt fuer Maengelansprueche beim Sachkauf, § 438
    BGB?
  back: Ansprueche wegen eines Sachmangels verjaehren beim Sachkauf regelmaessig in
    zwei Jahren, § 438 Abs. 1 Nr. 3 BGB. Die Frist beginnt mit der Ablieferung der
    Sache, § 438 Abs. 2 BGB - abweichend von der allgemeinen Regelverjaehrung des
    § 199 BGB, die an die Kenntnis des Glaeubigers anknuepft.
  norms:
  - § 438 Abs. 1 Nr. 3 BGB
  - § 438 Abs. 2 BGB
  - § 199 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-kaufrecht-ruecktritt-schadensersatz-kumulation
  type: streitstand
  front: Koennen Ruecktritt und Schadensersatz statt der Leistung nebeneinander geltend
    gemacht werden?
  back: Ruecktritt und Schadensersatz statt der ganzen Leistung schliessen sich nicht
    gegenseitig aus, § 325 BGB, und koennen kumulativ geltend gemacht werden. Praktisch
    bedeutsam ist das etwa, wenn der Kaeufer nach dem Ruecktritt zusaetzlich Ersatz
    eines Mangelfolgeschadens verlangt, der durch die blosse Rueckabwicklung nicht
    ausgeglichen wird. Die Minderung schliesst dagegen als Gestaltungsrecht anstelle
    des Ruecktritts eine gleichzeitige Geltendmachung von Schadensersatz statt der
    Leistung fuer denselben Mangel grundsaetzlich nicht aus, da beide Rechtsbehelfe
    unterschiedliche Zwecke verfolgen.
  norms:
  - § 325 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-kaufrecht-ruecktritt-minderung-exklusivitaet
  type: streitstand
  front: Wie verhalten sich Ruecktritt und Minderung zueinander?
  back: 'Ruecktritt und Minderung sind alternative Gestaltungsrechte: Statt zurueckzutreten,
    kann der Kaeufer den Kaufpreis durch Erklaerung gegenueber dem Verkaeufer mindern,
    § 441 Abs. 1 BGB. Erklaert der Kaeufer wirksam die Minderung, ist der Ruecktritt
    wegen desselben Mangels ausgeschlossen und umgekehrt. Ein einmal wirksam ausgeuebtes
    Gestaltungsrecht bindet den Kaeufer; ein Wechsel zum jeweils anderen Recht ist
    fuer denselben Mangel nicht mehr moeglich.'
  norms:
  - § 441 Abs. 1 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
