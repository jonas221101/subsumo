cards:
- slug: zr-schenk-begriff
  type: definition
  front: 'Definiere: Schenkung, § 516 Abs. 1 BGB'
  back: Eine Schenkung ist eine Zuwendung, durch die jemand aus seinem Vermögen einen anderen
    bereichert, wenn beide Teile darüber einig sind, dass die Zuwendung unentgeltlich erfolgt
    (§ 516 Abs. 1 BGB). Erforderlich sind danach eine Zuwendung (Vermögensverschiebung), die
    Bereicherung des Empfängers auf Kosten des Zuwendenden, und die Einigung über die Unentgeltlichkeit.
    Unentgeltlich ist die Zuwendung, wenn ihr keine Gegenleistung gegenübersteht, die nach
    dem Parteiwillen im Austausch geschuldet ist. Die Schenkung kann als Handschenkung durch
    sofortigen Vollzug oder als Schenkungsversprechen erfolgen, das zu einer Verpflichtung
    führt. Wird die Zuwendung ohne den Willen des anderen gemacht, kann der Zuwendende ihn
    unter Fristsetzung zur Erklärung auffordern; nach Fristablauf gilt die Schenkung als angenommen,
    wenn er sie nicht vorher abgelehnt hat (§ 516 Abs. 2 BGB). Abzugrenzen sind Gefälligkeiten
    ohne Rechtsbindungswillen, Leihe und Verzicht.
  norms:
  - § 516 Abs. 1 BGB
  - § 516 Abs. 2 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
- slug: zr-schenk-form-518
  type: norm
  front: Welche Form verlangt das Schenkungsversprechen (§ 518 BGB)?
  back: 'Zur Gültigkeit eines Vertrags, durch den eine Leistung schenkweise versprochen wird,
    ist die notarielle Beurkundung des Versprechens erforderlich (§ 518 Abs. 1 S. 1 BGB);
    das gilt auch für ein Schuldversprechen oder Schuldanerkenntnis (§ 518 Abs. 1 S. 2 BGB).
    Die Form schützt den Schenker vor Übereilung und erleichtert den Nachweis. Der Mangel
    der Form wird durch die Bewirkung der versprochenen Leistung geheilt (§ 518 Abs. 2 BGB).
    Das gilt nicht für die Handschenkung, bei der es kein Versprechen gibt: Wird die Leistung
    sofort bewirkt (etwa Übereignung nach § 929 S. 1 BGB), ist keine Form nötig, und die Schenkung
    ist Rechtsgrund des Erwerbs. Bei Grundstücken muss neben der Beurkundung des Schenkungsvertrags
    die Auflassung und Eintragung folgen (§§ 873, 925 BGB); mit der Eintragung wird der Formmangel
    des Vertrags nach § 311b Abs. 1 S. 2 BGB geheilt.'
  norms:
  - § 518 Abs. 1 BGB
  - § 518 Abs. 2 BGB
  - § 929 BGB
  - § 311b Abs. 1 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
- slug: zr-schenk-haftung-521-524
  type: norm
  front: Wie haftet der Schenker für Pflichtverletzungen und Mängel (§§ 521 bis 524 BGB)?
  back: 'Der Schenker hat nur Vorsatz und grobe Fahrlässigkeit zu vertreten (§ 521 BGB), weil
    er unentgeltlich leistet. Verzugszinsen schuldet er nicht (§ 522 BGB). Für Rechtsmängel
    haftet er nur, wenn er den Mangel arglistig verschwiegen hat; dann muss er dem Beschenkten
    den daraus entstehenden Schaden ersetzen (§ 523 Abs. 1 BGB). Entsprechendes gilt für Sachmängel:
    Auch hier haftet er nur bei arglistigem Verschweigen (§ 524 Abs. 1 BGB); bei einer nur
    der Gattung nach bestimmten Sache kann der Beschenkte in diesem Fall außerdem Lieferung
    einer mangelfreien Sache verlangen (§ 524 Abs. 2 BGB). Das Kaufrecht mit seinen Mängelrechten
    (§ 437 BGB) findet nicht Anwendung. Praktische Folge: Wer ein Geschenk mit versteckten
    Mängeln erhält, hat nur bei Arglist Ansprüche.'
  norms:
  - § 521 BGB
  - § 522 BGB
  - § 523 BGB
  - § 524 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
- slug: zr-schenk-notbedarf-528
  type: norm
  front: Wann kann der Schenker das Geschenk wegen Verarmung zurückfordern (§§ 528, 529 BGB)?
  back: Ist der Schenker nach Vollzug der Schenkung außerstande, seinen angemessenen Unterhalt
    zu bestreiten und die ihm gesetzlich obliegenden Unterhaltspflichten zu erfüllen, kann
    er vom Beschenkten die Herausgabe des Geschenks nach den Vorschriften über die Herausgabe
    einer ungerechtfertigten Bereicherung verlangen (§ 528 Abs. 1 S. 1 BGB, Rechtsfolgenverweisung
    auf §§ 818 ff. BGB). Der Beschenkte kann die Herausgabe abwenden, indem er den für den
    Unterhalt erforderlichen Betrag zahlt (§ 528 Abs. 1 S. 2 BGB). Der Anspruch ist ausgeschlossen,
    wenn der Schenker seine Bedürftigkeit vorsätzlich oder grob fahrlässig herbeigeführt hat
    oder zur Zeit des Eintritts der Bedürftigkeit seit der Leistung des Geschenks zehn Jahre
    verstrichen sind (§ 529 Abs. 1 BGB), sowie, wenn der Beschenkte bei Berücksichtigung seiner
    sonstigen Verpflichtungen außerstande ist, das Geschenk herauszugeben, ohne dass sein
    standesmäßiger Unterhalt gefährdet wird (§ 529 Abs. 2 BGB). Praktisch bedeutsam ist, dass
    der Anspruch auf den Sozialhilfeträger übergeleitet werden kann.
  norms:
  - § 528 Abs. 1 BGB
  - § 529 Abs. 1 BGB
  - § 529 Abs. 2 BGB
  - § 818 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
- slug: zr-schenk-widerruf-530
  type: norm
  front: Unter welchen Voraussetzungen kann eine Schenkung wegen groben Undanks widerrufen
    werden (§§ 530 ff. BGB)?
  back: Der Schenker kann die Schenkung widerrufen, wenn sich der Beschenkte durch eine schwere
    Verfehlung gegen den Schenker oder einen nahen Angehörigen groben Undanks schuldig macht
    (§ 530 Abs. 1 BGB). Eine schwere Verfehlung setzt objektiv ein erhebliches Fehlverhalten
    und subjektiv eine tadelnswerte Gesinnung voraus, die gegen die durch die Schenkung begründete
    Dankbarkeitspflicht verstößt (etwa Straftaten gegen den Schenker). Der Widerruf erfolgt
    durch Erklärung gegenüber dem Beschenkten (§ 531 Abs. 1 BGB); ist die Schenkung widerrufen,
    kann das Geschenk nach den Vorschriften über die Herausgabe einer ungerechtfertigten Bereicherung
    zurückgefordert werden (§ 531 Abs. 2 BGB). Der Widerruf ist ausgeschlossen, wenn der Schenker
    dem Beschenkten verziehen hat oder ein Jahr seit Kenntnis des Schenkers verstrichen ist
    (§ 532 BGB). Auf das Widerrufsrecht kann erst nach Eintritt des Undanks verzichtet werden
    (§ 533 BGB).
  norms:
  - § 530 Abs. 1 BGB
  - § 531 BGB
  - § 532 BGB
  - § 533 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
- slug: zr-schenk-auflage-gemischt
  type: definition
  front: 'Definiere: Schenkung unter Auflage und gemischte Schenkung'
  back: Bei der Schenkung unter Auflage (§ 525 Abs. 1 BGB) verpflichtet sich der Beschenkte
    zu einer Leistung, die ihm der Schenker auferlegt, etwa zu einer Pflege oder einem Wohnrecht;
    die Auflage ist keine Gegenleistung im Gegenseitigkeitsverhältnis, sondern mindert die
    Bereicherung. Der Schenker kann Vollziehung verlangen, nach seinem Tod auch der Erbe,
    bei öffentlichem Interesse die zuständige Behörde (§ 525 Abs. 2 BGB). Eine gemischte Schenkung
    liegt vor, wenn die Zuwendung teils entgeltlich und teils unentgeltlich ist und die Parteien
    sich über die Teilunentgeltlichkeit einig sind, etwa bei einem Verkauf deutlich unter
    Wert. Nach der Rechtsprechung gilt das Schenkungsrecht für den unentgeltlichen Teil; bei
    einheitlichem Geschäft entscheidet der Wille der Parteien. Entscheidend ist ein auffälliges,
    den Parteien bewusstes Missverhältnis von Leistung und Gegenleistung.
  norms:
  - § 525 BGB
  - § 516 Abs. 1 BGB
  - § 516 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
- slug: zr-schenk-abgrenzung-2301
  type: norm
  front: Wie wird die Schenkung von Verfügungen von Todes wegen abgegrenzt (§ 2301 BGB)?
  back: Auf ein Schenkungsversprechen, das unter der Bedingung erteilt wird, dass der Beschenkte
    den Schenker überlebt, finden die Vorschriften über Verfügungen von Todes wegen Anwendung
    (§ 2301 Abs. 1 S. 1 BGB), sodass die Formvorschriften des Erbrechts gelten. Das Schenkungsversprechen
    müsste also den Formen eines Testaments oder Erbvertrags genügen; die Beurkundung nach
    § 518 BGB reicht nicht. Wird die Schenkung dagegen vollzogen, indem der Schenker die Zuwendung
    bereits zu Lebzeiten bewirkt, gelten die Vorschriften über Schenkungen unter Lebenden
    (§ 2301 Abs. 2 BGB). Praktisch wird die Vollziehung vor dem Tod durch eine Vollmacht über
    den Tod hinaus oder durch Verträge zugunsten Dritter (§ 328 BGB) erreicht. Die Abgrenzung
    entscheidet über Form und Rechtsfolgen und ist ein Klausurklassiker im Grenzbereich von
    Schuld- und Erbrecht.
  norms:
  - § 2301 Abs. 1 BGB
  - § 2301 Abs. 2 BGB
  - § 518 BGB
  - § 328 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
- slug: zr-schenk-unbenannte-zuwendung
  type: definition
  front: 'Abgrenzung: Schenkung und unbenannte (ehebezogene) Zuwendung'
  back: Zuwendungen unter Ehegatten, die um der Ehe willen und zur Verwirklichung der ehelichen
    Lebensgemeinschaft erbracht werden, sind nach der Rechtsprechung des BGH keine Schenkung
    im Sinne des § 516 BGB, weil ihnen die Einigung über die Unentgeltlichkeit fehlt, wenn
    sie als Beitrag zur Ausgestaltung der Lebensgemeinschaft gedacht sind. Sie sind unbenannte
    (ehebezogene) Zuwendungen. Folge ist, dass die Formvorschrift des § 518 BGB nicht gilt
    und ein Rückforderungsrecht wegen groben Undanks (§ 530 BGB) nicht besteht. Bei Scheitern
    der Ehe kommt eine Rückforderung wegen Wegfalls der Geschäftsgrundlage (§ 313 BGB) in
    Betracht, soweit der Zugewinnausgleich zu keinem angemessenen Ergebnis führt. Für Zuwendungen
    unter Lebenspartnern oder nichtehelichen Partnern gelten ähnliche Grundsätze. Auf Zuwendungen
    im Rahmen der Altersvorsorge oder Vermögensübertragung zwischen Eltern und Kindern ist
    dagegen regelmäßig Schenkungsrecht anwendbar.
  norms:
  - § 516 BGB
  - § 518 BGB
  - § 530 BGB
  - § 313 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
