  steps:
  - label: I. Wirksame Schenkung, § 516 BGB
    hinweis: Zuwendung, Bereicherung, Einigung über Unentgeltlichkeit; Form nach § 518 BGB
      bzw. Vollzug.
  - label: II. Vollzug der Schenkung
    hinweis: Leistung des geschenkten Gegenstands an den Beschenkten.
  - label: III. Bedürftigkeit des Schenkers, § 528 Abs. 1 S. 1 BGB
    hinweis: Außerstande, den angemessenen Unterhalt zu bestreiten und gesetzliche Unterhaltspflichten
      zu erfüllen.
  - label: IV. Kein Ausschluss, § 529 BGB
    children:
    - label: 1. Keine vorsätzliche oder grob fahrlässige Herbeiführung der Bedürftigkeit
    - label: 2. Zehnjahresfrist, § 529 Abs. 1 BGB
    - label: 3. Keine Gefährdung des Unterhalts des Beschenkten, § 529 Abs. 2 BGB
  - label: V. Rechtsfolge
    hinweis: Herausgabe nach §§ 812 ff. BGB (Rechtsfolgenverweisung); Abwendungsbefugnis durch
      Zahlung, § 528 Abs. 1 S. 2 BGB.
faelle:
- slug: zr-fall-schenk-heim
  title: Das Haus und die Heimkosten
  difficulty: 3
  minutes: 45
  quellen:
  - Eigener Sachverhalt der Redaktion
  - BGB, amtliche Fassung
  facts: Die verwitwete Mutter M schenkt ihrem Sohn S vor vier Jahren ihr lastenfreies Hausgrundstück
    (Wert 250.000 Euro). Der Vertrag wird notariell beurkundet, die Auflassung erklärt und
    S als Eigentümer in das Grundbuch eingetragen. M behält keine weiteren Vermögenswerte
    außer einem Girokonto mit geringem Guthaben und bezieht eine Rente von monatlich 1.900
    Euro. Nach einem Schlaganfall muss M in ein Pflegeheim ziehen; die Heimkosten betragen
    monatlich 3.200 Euro, wovon die Pflegeversicherung 700 Euro trägt. Den restlichen Betrag
    kann M nicht aufbringen, die verbleibende Lücke beträgt 600 Euro. M hat ihre Bedürftigkeit
    weder vorsätzlich noch grob fahrlässig herbeigeführt. S verdient als Beamter 4.500 Euro
    netto monatlich, hat keine Unterhaltspflichten gegenüber anderen und könnte die Beträge
    aufbringen.
  question: Kann M von S Herausgabe des Hausgrundstücks verlangen, und wie kann S sich dagegen
    wehren?
  steps:
  - prompt: Welche Anspruchsgrundlage kommt in Betracht, und liegt eine wirksame Schenkung
      vor?
    erwartung: § 528 Abs. 1 S. 1 BGB. Die Zuwendung des Grundstücks war eine Schenkung (§
      516 Abs. 1 BGB), der Vertrag wurde notariell beurkundet (§ 518 Abs. 1 BGB) und vollzogen
      (Auflassung und Eintragung).
  - prompt: Ist M bedürftig im Sinne des § 528 Abs. 1 S. 1 BGB?
    erwartung: Ja. Nach Vollzug der Schenkung kann M ihren angemessenen Unterhalt nicht mehr
      aus eigenen Mitteln bestreiten, denn Rente und Pflegeversicherung decken die Heimkosten
      nicht; es verbleibt eine monatliche Lücke von 600 Euro.
  - prompt: Liegt ein Ausschlussgrund nach § 529 BGB vor?
    erwartung: Nein. Seit der Leistung sind vier, also weniger als zehn Jahre vergangen (§
      529 Abs. 1 BGB). M hat die Bedürftigkeit weder vorsätzlich noch grob fahrlässig herbeigeführt.
      S wird durch die Herausgabe in seinem angemessenen Unterhalt nicht gefährdet (§ 529
      Abs. 2 BGB).
  - prompt: Welche Rechtsfolge ergibt sich, und welche Abwendungsmöglichkeit hat S?
    erwartung: M kann Herausgabe des Geschenks nach den Vorschriften über die Herausgabe einer
      ungerechtfertigten Bereicherung verlangen (§ 528 Abs. 1 S. 1 BGB), grundsätzlich also
      Rückübertragung des Grundstücks. S kann die Herausgabe aber nach § 528 Abs. 1 S. 2 BGB
      durch laufende Zahlung des für den Unterhalt erforderlichen Betrags, hier 600 Euro monatlich,
      abwenden.
