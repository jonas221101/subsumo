      card_slugs:
      - zr-ev-globalzession-kollision
    - id: p3
      label: >-
        Vertragsbruchtheorie und Nichtigkeit der Globalzession nach § 138 Abs. 1 BGB
      weight: 3.0
      required: true
      norms:
