faelle:
- slug: zr-fall-verschwiegener-unfallschaden
  title: Der verschwiegene Unfallschaden
  difficulty: 3
  minutes: 35
  quellen:
  - Eigener Sachverhalt der Redaktion
  - BGB, amtliche Fassung
  - StGB, amtliche Fassung
  facts: Gebrauchtwagenhaendler G verkauft an Kaeuferin K ein Fahrzeug und erklaert
    dabei wissentlich wahrheitswidrig, es habe noch nie einen Unfallschaden gehabt,
    obwohl G positiv weiss, dass ein erheblicher, zwar fachgerecht aber teuer reparierter
    Vorschaden vorliegt. K verlaesst sich auf diese Angabe und zahlt den vereinbarten
    Kaufpreis von 14.000 EUR, obwohl das Fahrzeug wegen des verschwiegenen Vorschadens
    objektiv nur 11.000 EUR wert ist. Waere K der Vorschaden bekannt gewesen, haette
    sie den Kaufvertrag zu diesem Preis nicht geschlossen.
  question: Hat K gegen G einen Anspruch auf Zahlung von 3.000 EUR aus § 823 Abs.
    2 BGB in Verbindung mit § 263 StGB?
  steps:
  - prompt: Ist § 263 StGB ein Schutzgesetz im Sinne des § 823 Abs. 2 BGB?
    erwartung: Ja, § 263 StGB schuetzt zumindest auch das Vermoegen des Einzelnen
      vor taeuschungsbedingten Verfuegungen und ist damit ein individualschuetzendes
      Schutzgesetz.
  - prompt: Liegt objektiv ein Verstoss gegen § 263 StGB vor?
    erwartung: 'Ja: G taeuschte durch die wahrheitswidrige Behauptung der Unfallfreiheit
      ueber Tatsachen, K irrte hierueber und verfuegte durch die Kaufpreiszahlung
      ueber ihr Vermoegen, wodurch ihr ein Schaden in Hoehe der Wertdifferenz von
      3.000 EUR entstand.'
  - prompt: Liegt das erforderliche Verschulden vor?
    erwartung: 'Ja: G handelte vorsaetzlich, da er den Vorschaden positiv kannte und
      K bewusst darueber taeuschte; der von § 263 StGB vorausgesetzte Vorsatz ist
      zugleich das Verschulden im Sinne des § 823 Abs. 2 BGB.'
  - prompt: Warum scheidet ein Anspruch aus § 823 Abs. 1 BGB aus?
    erwartung: Weil K durch den ueberhoehten Kaufpreis lediglich einen reinen Vermoegensschaden
      erleidet; das Eigentum am Fahrzeug selbst wird durch die Taeuschung nicht verletzt
      und ist kein von Abs. 1 erfasster Fall.
  - prompt: Zu welchem Ergebnis kommt man?
    erwartung: K hat gegen G einen Anspruch auf Zahlung von 3.000 EUR aus § 823 Abs.
      2 BGB in Verbindung mit § 263 StGB.
