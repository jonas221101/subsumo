  - Eigenformulierung Redaktion
  steps:
  - label: I. Verletzung eines Schutzgesetzes
    children:
    - label: 1. Rechtsnorm mit zumindest auch individualschützendem Zweck
    - label: 2. Geschädigter im persönlichen Schutzbereich
    - label: 3. Schaden im sachlichen Schutzbereich (Schutzzweckzusammenhang)
  - label: II. Verschulden
    children:
    - label: '1. Schutzgesetz setzt Verschulden voraus: dessen Grad genügt'
    - label: '2. Schutzgesetz verschuldensunabhängig: eigenes Verschulden erforderlich,
