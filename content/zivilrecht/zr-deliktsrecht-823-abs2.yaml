cards:
- slug: zr-823-2-regelungsgehalt
  type: definition
  front: Was regelt § 823 Abs. 2 BGB?
  back: § 823 Abs. 2 S. 1 BGB gewährt Schadensersatz, wenn der Schädiger gegen ein
    den Schutz eines anderen bezweckendes Gesetz (Schutzgesetz) verstößt. Anders
    als § 823 Abs. 1 BGB setzt die Norm keine Verletzung eines der dort abschließend
    aufgezählten Rechtsgüter voraus, sondern knüpft an den Verstoß gegen eine
    außerhalb des Deliktsrechts stehende Schutznorm an.
  norms:
  - § 823 Abs. 2 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-823-2-schutzgesetzbegriff
  type: definition
  front: Wann ist eine Rechtsnorm ein Schutzgesetz im Sinne des § 823 Abs. 2 BGB?
  back: Ein Schutzgesetz ist jede Rechtsnorm, die nach Zweck und Inhalt zumindest
    auch dazu dienen soll, den Einzelnen oder einen bestimmten Kreis von Personen
    gegen die Verletzung eines bestimmten Rechtsguts zu schützen - nicht bloß als
    Reflex, sondern final gewollt. Erfasst sind sowohl Vorschriften des Strafrechts
    als auch des Verwaltungsrechts, sofern sie diesen Individualschutzzweck aufweisen.
  norms:
  - § 823 Abs. 2 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-823-2-263-tatbestand
  type: definition
  front: Welche objektiven Tatbestandsmerkmale müssen für einen Verstoß gegen
    das Schutzgesetz § 263 StGB (Betrug) im Rahmen des § 823 Abs. 2 BGB vorliegen?
  back: 'Der objektive Verstoß gegen § 263 Abs. 1 StGB als Schutzgesetz setzt vier,
    in einer Kausalkette aufeinander aufbauende Merkmale voraus: (1) eine Täuschung
    über Tatsachen durch Vorspiegelung falscher oder Entstellung bzw. Unterdrückung
    wahrer Tatsachen, (2) einen dadurch beim Getäuschten hervorgerufenen oder unterhaltenen
    Irrtum, (3) eine irrtumsbedingte Vermögensverfügung des Getäuschten und (4)
    einen dadurch eingetretenen Vermögensschaden. Fehlt eines dieser Merkmale oder
    die Kausalität zwischen ihnen, liegt kein objektiver Schutzgesetzverstoß vor.'
  norms:
  - § 263 Abs. 1 StGB
  quellen:
  - StGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-823-2-abgrenzung-ordnungsvorschriften
  type: definition
  front: Wie grenzt man ein Schutzgesetz von einer reinen Ordnungsvorschrift ab?
  back: Eine Norm, die ausschließlich das Interesse der Allgemeinheit oder eine funktionierende
    Verwaltungsordnung sichern soll, ohne dass der Schutz einzelner Personen bezweckt
    ist, ist keine Schutznorm im Sinne des § 823 Abs. 2 BGB - selbst wenn ihre Verletzung
    faktisch auch Einzelnen zugutekommt. Maßgeblich ist, ob der Individualschutz
    zum Normzweck gehört oder nur eine mittelbare, ungewollte Nebenfolge des allgemeinen
    Ordnungsinteresses ist.
  norms:
  - § 823 Abs. 2 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-823-2-persoenlicher-schutzbereich
  type: definition
  front: Was bedeutet der persönliche Schutzbereich beim Schutzgesetz?
  back: Der Geschädigte muss zu dem Personenkreis gehören, den das jeweilige Schutzgesetz
    gerade schützen will. Schützt eine Norm beispielsweise nur eine bestimmte Berufsgruppe
    oder Vertragspartei, kann sich ein außenstehender Dritter, der nicht zu diesem
    Kreis zählt, nicht auf die Verletzung dieser Norm berufen, selbst wenn er einen
    Schaden erlitten hat.
  norms:
  - § 823 Abs. 2 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-823-2-sachlicher-schutzbereich
  type: definition
  front: Was bedeutet der sachliche Schutzbereich (Schutzzweckzusammenhang) beim Schutzgesetz?
  back: Der eingetretene Schaden muss gerade aus der Verletzung desjenigen Interesses
    resultieren, das die verletzte Norm schützen will. Realisiert sich im Schaden
    eine ganz andere Gefahr als die, vor der das Schutzgesetz bewahren soll, fehlt
    der erforderliche Schutzzweckzusammenhang und ein Anspruch aus § 823 Abs. 2 BGB
    scheidet aus, obwohl objektiv gegen die Norm verstoßen wurde.
  norms:
  - § 823 Abs. 2 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-823-2-verschulden-s2
  type: definition
  front: Welche Bedeutung hat § 823 Abs. 2 S. 2 BGB für das Verschuldenserfordernis?
  back: Lässt das Schutzgesetz seinem Inhalt nach einen Verstoß auch ohne Verschulden
    zu, tritt die Ersatzpflicht nach § 823 Abs. 2 S. 2 BGB dennoch nur bei Verschulden
    des Handelnden ein. Setzt das Schutzgesetz selbst bereits Vorsatz oder Fahrlässigkeit
    voraus - wie die meisten Strafnormen -, ist dieses beim Schutzgesetz geprüfte
    Verschulden zugleich das deliktische Verschulden im Sinne des § 823 Abs. 2 BGB.
  norms:
  - § 823 Abs. 2 S. 2 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-823-2-beweislast
  type: definition
  front: Wie ist die Beweislast bei einem Anspruch aus § 823 Abs. 2 BGB grundsätzlich
    verteilt?
  back: Der Geschädigte trägt als Anspruchsteller grundsätzlich die Beweislast
    für den objektiven Verstoß gegen das Schutzgesetz und, soweit dieses ein Verschulden
    voraussetzt, für das Verschulden des Schädigers. Eine pauschale gesetzliche
    Umkehr der Beweislast sieht § 823 Abs. 2 BGB nicht vor; Beweiserleichterungen
    können sich allenfalls aus allgemeinen Beweisgrundsätzen wie dem Anscheinsbeweis
    bei typischen Geschehensabläufen ergeben.
  norms:
  - § 823 Abs. 2 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-823-2-verhaeltnis-abs1
  type: definition
  front: Wie verhält sich § 823 Abs. 2 BGB zu § 823 Abs. 1 BGB?
  back: § 823 Abs. 2 BGB ist eine eigenständige, neben § 823 Abs. 1 BGB anwendbare
    Anspruchsgrundlage. Während Abs. 1 nur die dort abschließend genannten Rechtsgüter
    schützt, kann über Abs. 2 in Verbindung mit einem individualschützenden Schutzgesetz
    auch der Ersatz reiner Vermögensschäden verlangt werden, sofern das Schutzgesetz
    gerade das Vermögen schützen soll. Beide Anspruchsgrundlagen können nebeneinander
    erfüllt sein.
  norms:
  - § 823 Abs. 2 BGB
  - § 823 Abs. 1 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
