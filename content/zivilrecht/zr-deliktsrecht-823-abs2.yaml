  - label: III. Kausaler Schaden
  - label: 'IV. Rechtsfolge: Schadensersatz, §§ 249 ff. BGB'
faelle:
- slug: zr-fall-verschwiegener-unfallschaden
  title: Der verschwiegene Unfallschaden
  difficulty: 3
  minutes: 35
  quellen:
  - Eigener Sachverhalt der Redaktion
  - BGB, amtliche Fassung
  - StGB, amtliche Fassung
  facts: Gebrauchtwagenhändler G verkauft an Käuferin K ein Fahrzeug und erklärt
    dabei wissentlich wahrheitswidrig, es habe noch nie einen Unfallschaden gehabt,
    obwohl G positiv weiß, dass ein erheblicher, zwar fachgerecht aber teuer reparierter
    Vorschaden vorliegt. K verlässt sich auf diese Angabe und zahlt den vereinbarten
    Kaufpreis von 14.000 EUR, obwohl das Fahrzeug wegen des verschwiegenen Vorschadens
    objektiv nur 11.000 EUR wert ist. Wäre K der Vorschaden bekannt gewesen, hätte
    sie den Kaufvertrag zu diesem Preis nicht geschlossen.
  question: Hat K gegen G einen Anspruch auf Zahlung von 3.000 EUR aus § 823 Abs.
    2 BGB in Verbindung mit § 263 StGB?
  steps:
  - prompt: Ist § 263 StGB ein Schutzgesetz im Sinne des § 823 Abs. 2 BGB?
    erwartung: Ja, § 263 StGB schützt zumindest auch das Vermögen des Einzelnen
      vor täuschungsbedingten Verfügungen und ist damit ein individualschützendes
      Schutzgesetz.
  - prompt: Liegt objektiv ein Verstoß gegen § 263 StGB vor?
    erwartung: 'Ja: G täuschte durch die wahrheitswidrige Behauptung der Unfallfreiheit
      über Tatsachen, K irrte hierüber und verfügte durch die Kaufpreiszahlung
      über ihr Vermögen, wodurch ihr ein Schaden in Höhe der Wertdifferenz von
      3.000 EUR entstand.'
  - prompt: Liegt das erforderliche Verschulden vor?
    erwartung: 'Ja: G handelte vorsätzlich, da er den Vorschaden positiv kannte und
      K bewusst darüber täuschte; der von § 263 StGB vorausgesetzte Vorsatz ist
      zugleich das Verschulden im Sinne des § 823 Abs. 2 BGB.'
  - prompt: Warum scheidet ein Anspruch aus § 823 Abs. 1 BGB aus?
    erwartung: Weil K durch den überhöhten Kaufpreis lediglich einen reinen Vermögensschaden
      erleidet; das Eigentum am Fahrzeug selbst wird durch die Täuschung nicht verletzt
      und ist kein von Abs. 1 erfasster Fall.
  - prompt: Zu welchem Ergebnis kommt man?
    erwartung: K hat gegen G einen Anspruch auf Zahlung von 3.000 EUR aus § 823 Abs.
      2 BGB in Verbindung mit § 263 StGB.
