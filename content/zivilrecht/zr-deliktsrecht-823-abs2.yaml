cards:
- slug: zr-823-2-regelungsgehalt
  type: definition
  front: Was regelt § 823 Abs. 2 BGB?
  back: § 823 Abs. 2 S. 1 BGB gewaehrt Schadensersatz, wenn der Schaediger gegen ein
    den Schutz eines anderen bezweckendes Gesetz (Schutzgesetz) verstoesst. Anders
    als § 823 Abs. 1 BGB setzt die Norm keine Verletzung eines der dort abschliessend
    aufgezaehlten Rechtsgueter voraus, sondern knuepft an den Verstoss gegen eine
    ausserhalb des Deliktsrechts stehende Schutznorm an.
  norms:
  - § 823 Abs. 2 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-823-2-schutzgesetzbegriff
  type: definition
  front: Wann ist eine Rechtsnorm ein Schutzgesetz im Sinne des § 823 Abs. 2 BGB?
  back: Ein Schutzgesetz ist jede Rechtsnorm, die nach Zweck und Inhalt zumindest
    auch dazu dienen soll, den Einzelnen oder einen bestimmten Kreis von Personen
    gegen die Verletzung eines bestimmten Rechtsguts zu schuetzen - nicht bloss als
    Reflex, sondern final gewollt. Erfasst sind sowohl Vorschriften des Strafrechts
    als auch des Verwaltungsrechts, sofern sie diesen Individualschutzzweck aufweisen.
  norms:
  - § 823 Abs. 2 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-823-2-abgrenzung-ordnungsvorschriften
  type: definition
  front: Wie grenzt man ein Schutzgesetz von einer reinen Ordnungsvorschrift ab?
  back: Eine Norm, die ausschliesslich das Interesse der Allgemeinheit oder eine funktionierende
    Verwaltungsordnung sichern soll, ohne dass der Schutz einzelner Personen bezweckt
    ist, ist keine Schutznorm im Sinne des § 823 Abs. 2 BGB - selbst wenn ihre Verletzung
    faktisch auch Einzelnen zugutekommt. Massgeblich ist, ob der Individualschutz
    zum Normzweck gehoert oder nur eine mittelbare, ungewollte Nebenfolge des allgemeinen
    Ordnungsinteresses ist.
  norms:
  - § 823 Abs. 2 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-823-2-persoenlicher-schutzbereich
  type: definition
  front: Was bedeutet der persoenliche Schutzbereich beim Schutzgesetz?
  back: Der Geschaedigte muss zu dem Personenkreis gehoeren, den das jeweilige Schutzgesetz
    gerade schuetzen will. Schuetzt eine Norm beispielsweise nur eine bestimmte Berufsgruppe
    oder Vertragspartei, kann sich ein aussenstehender Dritter, der nicht zu diesem
    Kreis zaehlt, nicht auf die Verletzung dieser Norm berufen, selbst wenn er einen
    Schaden erlitten hat.
  norms:
  - § 823 Abs. 2 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-823-2-sachlicher-schutzbereich
  type: definition
  front: Was bedeutet der sachliche Schutzbereich (Schutzzweckzusammenhang) beim Schutzgesetz?
  back: Der eingetretene Schaden muss gerade aus der Verletzung desjenigen Interesses
    resultieren, das die verletzte Norm schuetzen will. Realisiert sich im Schaden
    eine ganz andere Gefahr als die, vor der das Schutzgesetz bewahren soll, fehlt
    der erforderliche Schutzzweckzusammenhang und ein Anspruch aus § 823 Abs. 2 BGB
    scheidet aus, obwohl objektiv gegen die Norm verstossen wurde.
  norms:
  - § 823 Abs. 2 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-823-2-verschulden-s2
  type: definition
  front: Welche Bedeutung hat § 823 Abs. 2 S. 2 BGB fuer das Verschuldenserfordernis?
  back: Laesst das Schutzgesetz seinem Inhalt nach einen Verstoss auch ohne Verschulden
    zu, tritt die Ersatzpflicht nach § 823 Abs. 2 S. 2 BGB dennoch nur bei Verschulden
    des Handelnden ein. Setzt das Schutzgesetz selbst bereits Vorsatz oder Fahrlaessigkeit
    voraus - wie die meisten Strafnormen -, ist dieses beim Schutzgesetz gepruefte
    Verschulden zugleich das deliktische Verschulden im Sinne des § 823 Abs. 2 BGB.
  norms:
  - § 823 Abs. 2 S. 2 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-823-2-beweislast
  type: definition
  front: Wie ist die Beweislast bei einem Anspruch aus § 823 Abs. 2 BGB grundsaetzlich
    verteilt?
  back: Der Geschaedigte traegt als Anspruchsteller grundsaetzlich die Beweislast
    fuer den objektiven Verstoss gegen das Schutzgesetz und, soweit dieses ein Verschulden
    voraussetzt, fuer das Verschulden des Schaedigers. Eine pauschale gesetzliche
    Umkehr der Beweislast sieht § 823 Abs. 2 BGB nicht vor; Beweiserleichterungen
    koennen sich allenfalls aus allgemeinen Beweisgrundsaetzen wie dem Anscheinsbeweis
    bei typischen Geschehensablaeufen ergeben.
  norms:
  - § 823 Abs. 2 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-823-2-verhaeltnis-abs1
  type: definition
  front: Wie verhaelt sich § 823 Abs. 2 BGB zu § 823 Abs. 1 BGB?
  back: § 823 Abs. 2 BGB ist eine eigenstaendige, neben § 823 Abs. 1 BGB anwendbare
    Anspruchsgrundlage. Waehrend Abs. 1 nur die dort abschliessend genannten Rechtsgueter
    schuetzt, kann ueber Abs. 2 in Verbindung mit einem individualschuetzenden Schutzgesetz
    auch der Ersatz reiner Vermoegensschaeden verlangt werden, sofern das Schutzgesetz
    gerade das Vermoegen schuetzen soll. Beide Anspruchsgrundlagen koennen nebeneinander
    erfuellt sein.
  norms:
  - § 823 Abs. 2 BGB
  - § 823 Abs. 1 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
