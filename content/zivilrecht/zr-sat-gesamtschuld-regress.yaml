- slug: zr-schema-gs-ausgleich-426
  title: Ausgleichsanspruch unter Gesamtschuldnern, § 426 BGB
  norms:
  - § 421 BGB
  - § 426 Abs. 1 BGB
  - § 426 Abs. 2 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  steps:
  - label: I. Bestehen einer Gesamtschuld, § 421 BGB
    children:
    - label: 1. Mehrere Schuldner
    - label: 2. Dieselbe Leistung, gleichstufige Verpflichtung
      hinweis: Gleichstufigkeit und Identität des Leistungsinteresses prüfen; keine
        Subsidiarität.
    - label: 3. Entstehungsgrund (Vertrag, § 427 BGB, Gesetz, §§ 830, 840 BGB)
  - label: II. Leistung eines Schuldners an den Gläubiger
    hinweis: Befriedigung über den eigenen Anteil hinaus; Erfüllung wirkt für alle,
      § 422 Abs. 1 BGB.
  - label: III. Ausgleichsanspruch aus § 426 Abs. 1 BGB
    children:
    - label: 1. Ausgleichsmaßstab - gleiche Anteile oder abweichende Bestimmung
      hinweis: Im Schadensrecht Quote nach Verursachung und Verschulden, § 254 BGB
        entsprechend.
    - label: 2. Höhe des Anspruchs
    - label: 3. Ausfall eines Schuldners, § 426 Abs. 1 S. 2 BGB
  - label: IV. Übergegangene Forderung aus § 426 Abs. 2 BGB
    hinweis: Mit Neben- und Sicherungsrechten; Gläubiger darf nicht benachteiligt
      werden.
  - label: V. Besonderheiten
    children:
    - label: 1. Gestörte Gesamtschuld (Haftungsprivileg)
    - label: 2. Einzelwirkung und Gesamtwirkung, §§ 422 bis 425 BGB
faelle:
- slug: zr-fall-gs-rohrbruch
  title: Der geplatzte Wasserrohrbogen
  difficulty: 3
  minutes: 45
  quellen:
  - Eigener Sachverhalt der Redaktion
  - BGB, amtliche Fassung
  facts: >-
    Eigentümer E lässt in seinem Wohnhaus eine Wasserleitung umbauen. Die selbständigen
    Handwerker A (Installateur) und B (Elektriker) arbeiten unabhängig voneinander
    in demselben Raum. Beide verlegen fahrlässig und mit gleichem Verursachungsbeitrag
    Leitungen so, dass eine Wasserleitung durch Zusammenwirken ihrer Fehler platzt
    und das Parkett des E zerstört wird (Schaden 6.000 Euro). E verlangt von A den
    vollen Schadensersatz, den dieser zahlt. A möchte von B die Hälfte erstattet haben.
    B meint, er schulde nichts, da E ihn nie in Anspruch genommen habe. Das Verhältnis
    zwischen A und B ist vertraglich nicht geregelt.
  question: >-
    Kann A von B 3.000 Euro verlangen?
  steps:
  - prompt: Welche Anspruchsgrundlagen für A kommen in Betracht?
    erwartung: >-
      Der Ausgleichsanspruch aus § 426 Abs. 1 S. 1 BGB und die nach § 426 Abs. 2
      BGB auf A übergegangene Forderung des E gegen B.
  - prompt: Besteht eine Gesamtschuld zwischen A und B?
    erwartung: >-
      Ja. A und B schulden E jeweils auf Grund fahrlässiger Schadensverursachung
      (§ 823 Abs. 1 BGB, daneben vertragliche Ansprüche) Ersatz desselben Schadens.
      Die Verpflichtungen sind gleichstufig; die Haftung mehrerer Schädiger bildet
      eine Gesamtschuld (§ 840 Abs. 1 BGB, § 421 BGB).
  - prompt: Hat A über seinen Anteil hinaus geleistet und welche Wirkung hat seine
      Zahlung?
    erwartung: >-
      A hat den gesamten Schaden bezahlt. Die Erfüllung wirkt nach § 422 Abs. 1 BGB
      auch für B, dessen Schuld gegenüber E erlischt. Damit hat A mehr als seinen
      Anteil geleistet.
  - prompt: In welcher Höhe besteht der Ausgleichsanspruch?
    erwartung: >-
      Die Beteiligten tragen im Innenverhältnis zu gleichen Anteilen (§ 426 Abs. 1
      S. 1 BGB), hier auch nach gleichen Verursachungsbeiträgen, sodass B 3.000 Euro
      zu erstatten hat. Dass E den B nicht in Anspruch genommen hat, ist nach § 421
      S. 1 BGB unerheblich.
  - prompt: Welche Bedeutung hat § 426 Abs. 2 BGB?
    erwartung: >-
      Die Forderung des E gegen B geht in Höhe von 3.000 Euro kraft Gesetzes auf A
      über, mit Neben- und Sicherungsrechten (§§ 401, 412 BGB). E darf dadurch nicht
      benachteiligt werden.
  expectation:
    pruefpunkte:
