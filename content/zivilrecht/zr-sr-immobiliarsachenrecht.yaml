      - zr-immo-vormerkung-gutglaeubig
    - id: p4
      label: >-
        Relative Unwirksamkeit der Grundschuld nach § 883 Abs. 2 BGB und Anspruch
        aus § 888 BGB
      weight: 3.0
      required: true
      norms:
      - § 883 Abs. 2 BGB
      - § 888 BGB
      keywords:
