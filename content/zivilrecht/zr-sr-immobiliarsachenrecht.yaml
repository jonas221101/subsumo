      - nichtige Auflassung
      - Geschäftsunfähigkeit des B
      - Rechtsscheinträger
      card_slugs:
      - zr-immo-892-reichweite
    - id: p3
      label: >-
        Vormerkung zugunsten des C: gesicherter Anspruch, Akzessorietät und gutgläubiger
        Ersterwerb
      weight: 2.0
