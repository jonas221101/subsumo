      - § 288 Abs. 2 BGB
      keywords:
      - '288'
      - Verzugszinsen
      - Verbraucher
    - id: p7
      label: 'Ergebnis: beide Anspruesche bestehen'
      weight: 1.0
      keywords:
      - Anspruch besteht
      - H kann
      - hat H gegen K einen Anspruch
