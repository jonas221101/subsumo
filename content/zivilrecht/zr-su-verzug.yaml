faelle:
- slug: zr-fall-einbauschrank
  title: Der Einbauschrank
  difficulty: 3
  minutes: 40
  quellen:
  - Eigener Sachverhalt der Redaktion
  - BGB, amtliche Fassung
  facts: Schreinerin H fertigt für den Verbraucher K einen maßgeschneiderten Einbauschrank
    für dessen Privatwohnung, Werklohn 4.000 EUR. Laut Werkvertrag ist der Werklohn
    "binnen 14 Tagen nach Abnahme" zu zahlen. Die Abnahme erfolgt am 1.6. eines fiktiven
    Jahres; die Zahlungsfrist läuft damit mit Ablauf des 15.6. ab. K zahlt nicht.
    Am 20.6. mahnt H K schriftlich und fordert Zahlung binnen einer Woche. K zahlt
    weiterhin nicht. Erst am 20.8. überweist K die 4.000 EUR. Weil ihr das Geld fehlte,
    hatte H in der Zwischenzeit ihr Geschäftskonto überziehen müssen; dadurch sind
    ihr 120 EUR Überziehungszinsen entstanden. H verlangt von K Ersatz dieser 120
    EUR sowie gesetzliche Verzugszinsen auf die 4.000 EUR für denselben Zeitraum.
  question: Hat H gegen K einen Anspruch auf Ersatz der 120 EUR Überziehungszinsen
    und auf gesetzliche Verzugszinsen? Ab wann befand sich K in Verzug, und kann H
    beides nebeneinander für denselben Zeitraum verlangen?
  steps:
  - prompt: Nenne die Anspruchsgrundlage für die Überziehungszinsen.
    erwartung: § 280 Abs. 1, 2 iVm § 286 BGB (Schadensersatz wegen Verzögerung der
      Leistung).
  - prompt: Ab wann war die Werklohnforderung fällig, und ab wann trat Verzug ein?
      Kam es auf die Mahnung vom 20.6. an?
    erwartung: 'Die Leistungszeit ist an ein Ereignis (Abnahme) geknüpft und mit 14
      Tagen so bestimmt, dass sie sich von einem Kalendertag an berechnen lässt: Die
      Mahnung ist daher nach § 286 Abs. 2 Nr. 2 BGB entbehrlich; K ist mit Ablauf
      des 15.6., also ab dem 16.6., in Verzug. Die Mahnung vom 20.6. ist nur nachrangig
      von Bedeutung (wer Nr. 2 verneint, kommt mit Zugang der Mahnung am 20.6. nach
      § 286 Abs. 1 BGB in Verzug); die gesetzte Wochenfrist ist für den Verzugseintritt
      jedenfalls ohne Bedeutung. § 286 Abs. 3 BGB (30 Tage nach Fälligkeit und Rechnungszugang)
      greift nicht, weil keine Rechnung mit Verbraucherhinweis vorliegt.'
  - prompt: Ist das Vertretenmüssen problematisch?
    erwartung: Nein, es wird vermutet (§ 280 Abs. 1 S. 2 BGB) und K hat keine Entlastungsgründe
      vorgetragen.
  - prompt: Welche Rechtsgrundlage stützt den Anspruch auf Verzugszinsen und in welcher
      Höhe?
    erwartung: '§ 288 Abs. 1 BGB - fünf Prozentpunkte über dem Basiszinssatz; § 288
      Abs. 2 BGB (neun Prozentpunkte) greift nicht, weil K als Verbraucher am Rechtsgeschäft
      beteiligt ist. Die Verzugszinsen sind aber nur der pauschalierte Mindest-Zinsschaden:
      Ein konkret entstandener Zinsschaden (hier die Überziehungszinsen) kann nach
      § 288 Abs. 4 BGB nur als "weiterer Schaden" verlangt werden, also nicht zusätzlich
      zu den gesetzlichen Verzugszinsen für denselben Zeitraum, sondern nur, soweit
      er diese übersteigt (Anrechnung/Verbot der Doppelerfassung).'
  - prompt: Kann H die 120 EUR Überziehungszinsen und die Verzugszinsen kumulativ
      verlangen?
    erwartung: 'Nein, nicht für denselben Zeitraum und denselben Schaden (Kreditkosten
      für die ausstehenden 4.000 EUR): H kann entweder die gesetzlichen Verzugszinsen
      oder - höher, wenn nachgewiesen - den konkreten Zinsschaden von 120 EUR verlangen;
      auf die Verzugszinsen angerechnet wird der Betrag, soweit er sich deckt. Ergebnis:
      Anspruch auf 120 EUR (§§ 280 Abs. 1, 2, 286 BGB), daneben Verzugszinsen nur,
      soweit sie 120 EUR nicht ohnehin abgelten.'
  expectation:
