cards:
- slug: zr-su-verzug-voraussetzungen-286
  type: definition
  front: 'Definiere: Schuldnerverzug (§ 286 Abs. 1 BGB) - Voraussetzungen'
  back: 'Der Schuldner kommt in Verzug, wenn er auf eine fällige Mahnung des Gläubigers,
    die nach dem Eintritt der Fälligkeit erfolgt, nicht leistet (§ 286 Abs. 1 BGB).
    Voraussetzungen sind also: ein wirksames, durchsetzbares Schuldverhältnis, Fälligkeit
    und Durchsetzbarkeit der Forderung, eine Mahnung nach Fälligkeit (oder deren Entbehrlichkeit),
    das Ausbleiben der Leistung sowie das Vertretenmüssen der Nichtleistung (§ 286
    Abs. 4 BGB).'
  norms:
  - § 286 Abs. 1 BGB
  - § 286 Abs. 4 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-su-verzug-mahnung-begriff
  type: definition
  front: 'Definiere: Mahnung im Sinne des § 286 Abs. 1 BGB'
  back: Die Mahnung ist eine an den Schuldner gerichtete, einseitige und empfangsbedürftige
    Erklärung des Gläubigers, mit der dieser unzweideutig und bestimmt die Erbringung
    der geschuldeten Leistung verlangt. Sie ist formfrei möglich, muss aber nach Eintritt
    der Fälligkeit erfolgen; eine vorher erklärte Erinnerung ist als Mahnung wirkungslos.
    Der Mahnung stehen die Erhebung der Klage auf die Leistung sowie die Zustellung
    eines Mahnbescheids im Mahnverfahren gleich (§ 286 Abs. 1 S. 2 BGB).
  norms:
  - § 286 Abs. 1 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-su-verzug-entbehrlichkeit-286-2
  type: definition
  front: Wann ist die Mahnung nach § 286 Abs. 2 BGB entbehrlich?
  back: Die Mahnung ist entbehrlich, wenn (1) für die Leistung eine Zeit nach dem
    Kalender bestimmt ist (Nr. 1), (2) der Leistung ein Ereignis vorauszugehen hat
    und eine angemessene Zeit für die Leistung so bestimmt ist, dass sie sich von
    einem Kalendertag an berechnen lässt (Nr. 2), (3) der Schuldner die Leistung ernsthaft
    und endgültig verweigert (Nr. 3), oder (4) aus besonderen Gründen unter Abwägung
    der beiderseitigen Interessen der sofortige Eintritt des Verzugs gerechtfertigt
    ist (Nr. 4).
  norms:
  - § 286 Abs. 2 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-su-verzug-entgeltforderung-286-3
  type: definition
  front: Was regelt § 286 Abs. 3 BGB für Entgeltforderungen?
  back: Bei Entgeltforderungen kommt der Schuldner spätestens dann in Verzug, wenn
    er nicht innerhalb von 30 Tagen nach Fälligkeit und Zugang einer Rechnung leistet
    - auch ohne Mahnung (§ 286 Abs. 3 S. 1 BGB). Ist der Schuldner Verbraucher, gilt
    dies nur, wenn auf diese Folgen in der Rechnung besonders hingewiesen wurde (§
    286 Abs. 3 S. 2 BGB).
  norms:
  - § 286 Abs. 3 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-su-verzug-vertretenmuessen-286-4
  type: definition
  front: Welche Rolle spielt das Vertretenmüssen beim Verzug, § 286 Abs. 4 BGB?
  back: 'Der Verzug tritt nicht ein, solange die Leistung infolge eines Umstands unterbleibt,
    den der Schuldner nicht zu vertreten hat (§ 286 Abs. 4 BGB). Schon der Wortlaut
    ("nicht zu vertreten hat") legt die Darlegungs- und Beweislast für fehlendes Vertretenmüssen
    dem Schuldner auf; das Vertretenmüssen wird also vermutet. Maßgeblicher Verschuldensmaßstab
    ist § 276 BGB (Vorsatz und Fahrlässigkeit; Geldschulden: Beschaffungsrisiko, "Geld
    hat man zu haben").'
  norms:
  - § 286 Abs. 4 BGB
  - § 276 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-su-verzug-schadensersatz-280
  type: definition
  front: Wie verhält sich der Anspruch auf Verzugsschaden zu § 280 Abs. 1, 2 BGB?
  back: Der Ersatz des durch die Verzögerung der Leistung entstehenden Schadens setzt
    neben den allgemeinen Voraussetzungen des Schadensersatzes wegen Pflichtverletzung
    (§ 280 Abs. 1 BGB) zusätzlich die Voraussetzungen des Verzugs nach § 286 BGB voraus
    (§ 280 Abs. 2 BGB). § 286 BGB präzisiert also, unter welchen Bedingungen die bloße
    Verzögerung der Leistung eine ersatzfähige Pflichtverletzung darstellt.
  norms:
  - § 280 Abs. 1 BGB
  - § 280 Abs. 2 BGB
  - § 286 Abs. 1 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-su-verzugszinsen-288
  type: definition
  front: In welcher Höhe sind Verzugszinsen nach § 288 BGB zu zahlen?
  back: Eine während des Verzugs zu verzinsende Geldschuld ist mit Verzugszinsen zu
    verzinsen, die für das Jahr fünf Prozentpunkte über dem Basiszinssatz liegen (§
    288 Abs. 1 BGB). Bei Entgeltforderungen aus Rechtsgeschäften, an denen ein Verbraucher
    nicht beteiligt ist, beträgt der Verzugszins neun Prozentpunkte über dem Basiszinssatz
    (§ 288 Abs. 2 BGB). Die Geltendmachung eines weiteren Schadens bleibt unberührt
    (§ 288 Abs. 4 BGB) - ein konkreter Zinsschaden kann daher nicht zusätzlich zu
    den Verzugszinsen für denselben Zeitraum verlangt werden, sondern nur, soweit
    er sie übersteigt. Bei Entgeltforderungen, bei denen der Schuldner kein Verbraucher
    ist, kann der Gläubiger außerdem eine Pauschale von 40 Euro verlangen (§ 288 Abs.
    5 BGB).
  norms:
  - § 288 Abs. 1 BGB
  - § 288 Abs. 2 BGB
  - § 288 Abs. 4 BGB
  - § 288 Abs. 5 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-su-verschaerfte-haftung-287
  type: definition
  front: Was bewirkt die verschärfte Haftung des Schuldners im Verzug, § 287 BGB?
  back: Während des Verzugs hat der Schuldner jede Fahrlässigkeit zu vertreten (§
    287 S. 1 BGB) und haftet grundsätzlich auch für den während des Verzugs durch
    Zufall eintretenden Untergang oder eine während dessen eintretende Unmöglichkeit
    der Leistung (§ 287 S. 2 BGB) - es sei denn, der Schaden wäre auch bei rechtzeitiger
    Leistung eingetreten.
  norms:
  - § 287 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
