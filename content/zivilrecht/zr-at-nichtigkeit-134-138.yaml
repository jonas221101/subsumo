faelle:
- slug: zr-fall-at-nicht-schmuckverkauf
  title: Der Notverkauf des Schmucks
  difficulty: 3
  minutes: 40
  quellen:
  - Eigener Sachverhalt der Redaktion
  - BGB, amtliche Fassung
  facts: >-
    V muss kurzfristig die Miete bezahlen, sonst droht die Kündigung ihrer Wohnung.
    Sie bietet dem Händler H einen Familienschmuck zum Kauf an, dessen
    Marktwert 5.000 Euro beträgt. H erkennt die Notlage und erklärt, mehr als 1.500 Euro
    sei sein Höchstgebot. V geht auf das Angebot ein; H zahlt 1.500 Euro und V übergibt
    und übereignet den Schmuck. Zwei Wochen später verlangt V von H den Schmuck
    heraus. H verweigert die Herausgabe, weil er V die 1.500 Euro bezahlt habe.
  question: Kann V von H Herausgabe des Schmucks nach § 985 BGB verlangen?
  steps:
  - prompt: Formuliere den Obersatz.
    erwartung: >-
      V könnte gegen H einen Herausgabeanspruch aus § 985 BGB haben, wenn sie
      Eigentümerin geblieben ist, H Besitzer ist und kein Recht zum Besitz hat.
  - prompt: War V ursprünglich Eigentümerin und hat sie ihr Eigentum an H verloren?
    erwartung: >-
      V war Eigentümerin. Ein Eigentumserwerb des H nach § 929 S. 1 BGB setzt
      eine wirksame Einigung voraus. Diese könnte nach § 138 Abs. 2 BGB nichtig sein.
  - prompt: Liegt Wucher nach § 138 Abs. 2 BGB vor?
    erwartung: >-
      Ja. Es besteht ein auffälliges Missverhältnis (1.500 Euro gegenüber einem
      Wert von 5.000 Euro). V befand sich in einer Zwangslage (drohender Verlust der
      Wohnung), die H kannte und bewusst zum eigenen Vorteil ausnutzte (Ausbeutung).
  - prompt: Erfasst die Nichtigkeit auch die Übereignung?
    erwartung: >-
      Ja. § 138 Abs. 2 BGB erfasst nach dem Wortlaut ("versprechen oder gewähren
      lässt") auch das Verfügungsgeschäft. Die Einigung nach § 929 S. 1 BGB ist
      daher ebenfalls nichtig, sodass V Eigentümerin geblieben ist (Fehleridentität
      ausnahmsweise bejaht).
  - prompt: Ergebnis des Herausgabeanspruchs?
    erwartung: >-
      H ist Besitzer und hat kein Recht zum Besitz (§ 986 BGB), da der
      Kaufvertrag nichtig ist. V kann daher Herausgabe nach § 985 BGB verlangen.
      Der Kaufpreis ist nach den §§ 812 ff. BGB Gegenstand eines eigenen
      Anspruchs und hier nicht zu prüfen.
  expectation:
    pruefpunkte:
