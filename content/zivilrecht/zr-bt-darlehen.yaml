faelle:
- slug: zr-fall-darl-autokauf-widerruf
  title: Der finanzierte Neuwagen
  difficulty: 3
  minutes: 45
  quellen:
  - Eigener Sachverhalt der Redaktion
  - BGB, amtliche Fassung
  facts: 'Verbraucher V kauft am 1. Juni beim Autohaus A einen Neuwagen für 24.000 Euro. Die
    Finanzierung erfolgt durch die Bank B: Der Verkäufer von A legt V ein Formular der B vor,
    nimmt den Darlehensantrag auf und leitet ihn an B weiter; B zahlt die Darlehenssumme von
    24.000 Euro vereinbarungsgemäß unmittelbar an A. V erhält am 1. Juni die vollständige
    Vertragsurkunde mit allen nach Art. 247 EGBGB erforderlichen Pflichtangaben sowie eine
    ordnungsgemäße Widerrufsinformation. Der Pkw wird am 5. Juni an V übergeben. Am 10. Juni
    erklärt V gegenüber B schriftlich den Widerruf des Darlehensvertrags und verlangt, nicht
    mehr gebunden zu sein.'
  question: Ist der Widerruf wirksam, und welche Auswirkungen hat er auf den Kaufvertrag mit
    A?
  steps:
  - prompt: Besteht ein Widerrufsrecht?
    erwartung: Ja. Es liegt ein Verbraucherdarlehensvertrag nach § 491 Abs. 1 BGB vor (V ist
      Verbraucher, B Unternehmer, entgeltliches Darlehen). Nach § 495 Abs. 1 BGB steht V das
      Widerrufsrecht nach § 355 BGB zu.
  - prompt: Ist der Widerruf rechtzeitig und formgerecht?
    erwartung: Ja. Die Frist beträgt 14 Tage (§ 355 Abs. 2 S. 1 BGB) und beginnt mit Vertragsschluss, weil V am 1. Juni die Vertragsurkunde mit allen Pflichtangaben und der Widerrufsinformation erhalten hat (§ 356b BGB). Der Widerruf am 10. Juni erfolgte gegenüber dem Darlehensgeber innerhalb
      der Frist.
  - prompt: Sind Darlehens- und Kaufvertrag verbundene Verträge?
    erwartung: Ja. Das Darlehen dient der Finanzierung des Kaufpreises und wurde direkt an
      A ausgezahlt; B hat sich bei Vorbereitung und Abschluss der Mitwirkung des Autohauses
      bedient. Beide Verträge bilden eine wirtschaftliche Einheit (§ 358 Abs. 3 BGB).
  - prompt: Welche Wirkung hat der Widerruf auf den Kaufvertrag?
    erwartung: Der Widerruf des Darlehensvertrags erstreckt sich nach § 358 Abs. 2 BGB auf den verbundenen Kaufvertrag. V ist auch an seine auf den Abschluss des Kaufvertrags gerichtete Willenserklärung nicht mehr gebunden, der Kaufvertrag wird rückabgewickelt.
  - prompt: Wie erfolgt die Rückabwicklung?
    erwartung: Da B das Darlehen bereits an A ausgezahlt hat, tritt B im Verhältnis zu V in
      die Rechte und Pflichten des A aus der Rückabwicklung ein (§ 358 Abs. 4 BGB). V muss den Pkw herausgeben, gegebenenfalls mit Wertersatz für einen Wertverlust (§ 358 Abs. 4 S. 1, § 357a BGB), schuldet B aber keine Rückzahlung der an A gezahlten Darlehenssumme und keine Zinsen oder Kosten.
  expectation:
