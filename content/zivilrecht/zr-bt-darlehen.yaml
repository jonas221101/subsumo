  area: zivilrecht
  title: Darlehen und Verbraucherdarlehen, §§ 488 ff., 491 ff. BGB
  parent: zr-bgb-at
  relevance: 4
  stand: 2026-10
  redaktion:
    erzeugt_von: claude-sonnet (Pflichtstoff-Vervollständigung)
    status: in-pruefung
