cards:
- slug: zr-darl-begriff
  type: definition
  front: 'Definiere: Darlehensvertrag, § 488 BGB'
  back: 'Durch den Darlehensvertrag wird der Darlehensgeber verpflichtet, dem Darlehensnehmer
    einen Geldbetrag in der vereinbarten Höhe zur Verfügung zu stellen; der Darlehensnehmer
    ist verpflichtet, einen geschuldeten Zins zu zahlen und bei Fälligkeit das zur Verfügung
    gestellte Darlehen zurückzuerstatten (§ 488 Abs. 1 BGB). Der Darlehensvertrag ist ein
    Konsensualvertrag, kein Realvertrag: Er kommt durch Einigung zustande, nicht erst mit
    der Auszahlung. Er ist gegenseitig verpflichtend, soweit Zinsen geschuldet sind; zinslose
    Darlehen sind unvollkommen zweiseitig. Gegenstand der Rückzahlung ist nicht dieselbe Geldsumme,
    sondern Geld in gleicher Höhe. Das Sachdarlehen (§ 607 BGB) betrifft vertretbare Sachen.
    Ist die Fälligkeit nicht bestimmt, hängt sie von der Kündigung ab, für die eine Frist
    von drei Monaten gilt (§ 488 Abs. 3 BGB).'
  norms:
  - § 488 Abs. 1 BGB
  - § 488 Abs. 3 BGB
  - § 607 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
- slug: zr-darl-kuendigung-489-490
  type: norm
  front: Wann kann ein Darlehen gekündigt werden (§§ 489, 490 BGB)?
  back: 'Der Darlehensnehmer kann ein Darlehen mit gebundenem Sollzinssatz, dessen Zinsbindung vor der vereinbarten Rückzahlung endet und für das keine neue Zinsvereinbarung getroffen wurde, mit einer Frist von einem Monat zum Ende der Zinsbindung kündigen (§ 489 Abs. 1 Nr. 1 BGB). Unabhängig davon kann er jedes Darlehen nach zehn Jahren seit dem vollständigen Empfang mit einer Frist von sechs Monaten kündigen (§ 489 Abs. 1 Nr. 2 BGB). Bei veränderlichem Zinssatz kann er jederzeit mit einer Frist von drei Monaten kündigen (§ 489 Abs. 2 BGB). Beide Parteien können außerordentlich kündigen: Der Darlehensgeber,
    wenn in den Vermögensverhältnissen des Darlehensnehmers oder in der Werthaltigkeit einer
    Sicherheit eine wesentliche Verschlechterung eintritt oder einzutreten droht und dadurch
    die Rückerstattung gefährdet wird (§ 490 Abs. 1 BGB); der Darlehensnehmer bei gebundenem Sollzinssatz und Sicherung durch Grund- oder Schiffspfandrecht, wenn seine berechtigten Interessen es gebieten, etwa bei Verkauf des beliehenen Grundstücks, frühestens sechs Monate nach vollständigem Empfang und gegen Ersatz des dem Darlehensgeber entstehenden Schadens (Vorfälligkeitsentschädigung, § 490 Abs. 2 BGB). Die allgemeine Kündigung aus wichtigem Grund (§ 314 BGB) bleibt unberührt.'
  norms:
  - § 489 Abs. 1 BGB
  - § 489 Abs. 2 BGB
  - § 490 Abs. 1 BGB
  - § 490 Abs. 2 BGB
  - § 314 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
- slug: zr-darl-verbraucherdarlehen-491
  type: definition
  front: 'Definiere: Verbraucherdarlehensvertrag, § 491 BGB, und seine Form (§ 492 BGB)'
  back: Ein Verbraucherdarlehensvertrag ist ein entgeltlicher Darlehensvertrag zwischen einem
    Unternehmer als Darlehensgeber und einem Verbraucher als Darlehensnehmer (§ 491 Abs. 1
    BGB), mit dem Immobiliar-Verbraucherdarlehensvertrag (§ 491 Abs. 3 BGB) als Sonderform, der etwa durch Grundpfandrechte gesichert ist oder dem Erwerb von Grundstücken dient. Ausnahmen bestehen, etwa bei Darlehen mit einem
    Nettodarlehensbetrag unter 200 Euro (§ 491 Abs. 2 BGB). Die Vorschriften der §§ 491 ff.
    BGB schützen den Verbraucher durch Informations- und Formvorschriften, die einseitig zwingend
    sind (§ 512 BGB). Der Vertrag bedarf derzeit der Schriftform (§ 492 Abs. 1 S. 1 BGB; ab 20.11.2026 gilt nach dem Gesetz zur Umsetzung der Richtlinie (EU) 2023/2225, BGBl. 2026 I Nr. 139, für Allgemein-Verbraucherdarlehen die Textform, für Immobiliar-Verbraucherdarlehen weiterhin die Schriftform; Übergangsregel in Art. 229 § 71 EGBGB) und muss die Pflichtangaben
    nach Art. 247 EGBGB enthalten, insbesondere Nettodarlehensbetrag, Sollzinssatz, effektiven
    Jahreszins und Gesamtbetrag (§ 492 Abs. 2 BGB). Der Unternehmer muss vorvertraglich informieren
    (Art. 247 § 3 EGBGB) und die Kreditwürdigkeit prüfen (§ 505a BGB).
  norms:
  - § 491 Abs. 1 BGB
  - § 491 Abs. 2 BGB
  - § 492 Abs. 1 BGB
  - § 492 Abs. 2 BGB
  - § 512 BGB
  - § 505a BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
- slug: zr-darl-formmangel-494
  type: norm
  front: Welche Folgen hat ein Formmangel beim Verbraucherdarlehen (§ 494 BGB)?
  back: Ein Verbraucherdarlehensvertrag ist nichtig, wenn die Schriftform insgesamt nicht eingehalten wird oder eine der in Art. 247 §§ 6, 10 bis 13 EGBGB vorgeschriebenen Angaben fehlt (§ 494 Abs. 1 BGB).
    Der Mangel wird jedoch geheilt, soweit dem Darlehensnehmer das Darlehen ausbezahlt oder
    er es in Anspruch nimmt (§ 494 Abs. 2 S. 1 BGB). Zugleich ermäßigt sich der Sollzinssatz
    auf den gesetzlichen Zinssatz, wenn Angaben zum Sollzinssatz, zum effektiven Jahreszins
    oder zum Gesamtbetrag fehlen (§ 494 Abs. 2 S. 2 BGB); nicht angegebene Kosten sind nicht geschuldet (§ 494 Abs. 4 S. 1 BGB).
    Die Rechtsfolge soll den Darlehensgeber zu vollständiger Information anhalten, schließt aber die Rückzahlung des tatsächlich Empfangenen nicht aus.
  norms:
  - § 494 Abs. 1 BGB
  - § 494 Abs. 2 BGB
  - § 492 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
- slug: zr-darl-widerruf-495
  type: norm
  front: Wie funktioniert der Widerruf des Verbraucherdarlehens (§§ 495, 355, 356b BGB)?
  back: 'Dem Darlehensnehmer steht bei einem Verbraucherdarlehensvertrag ein Widerrufsrecht
    nach § 355 BGB zu (§ 495 Abs. 1 BGB). Die Widerrufsfrist beträgt 14 Tage (§ 355 Abs. 2
    S. 1 BGB). Sie beginnt nicht vor Vertragsschluss und nicht, bevor der Darlehensgeber dem Darlehensnehmer die Vertragsurkunde, den schriftlichen Antrag oder eine Abschrift davon zur Verfügung gestellt hat (§ 356b Abs. 1 BGB). Fehlen in der Urkunde die Pflichtangaben nach § 492 Abs. 2 BGB (dazu gehören die Angaben zum Widerrufsrecht), beginnt die Frist erst mit deren Nachholung nach § 492 Abs. 6 BGB und beträgt dann einen Monat (§ 356b Abs. 2 BGB). Der Widerruf erfolgt durch Erklärung gegenüber dem Darlehensgeber, eine Begründung
    ist nicht erforderlich (§ 355 Abs. 1 BGB); zur Fristwahrung genügt die rechtzeitige Absendung
    (§ 355 Abs. 1 S. 5 BGB). Für die Rückabwicklung gilt § 357b BGB: Die empfangenen Leistungen sind spätestens nach 30 Tagen zurückzugewähren. Der Widerruf unterliegt den Grenzen von Treu und Glauben (Rechtsmissbrauch, Verwirkung).'
  norms:
  - § 495 Abs. 1 BGB
  - § 355 BGB
  - § 356b BGB
  - § 357a BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
- slug: zr-darl-verbundene-vertraege-358
  type: norm
  front: Wann bilden Darlehen und finanzierter Vertrag eine wirtschaftliche Einheit (§ 358 Abs.
    3 BGB), und wie wirkt der Widerruf?
  back: 'Ein Verbraucherdarlehensvertrag und ein Vertrag über eine Ware oder andere Leistung sind
    verbunden, wenn das Darlehen ganz oder teilweise der Finanzierung des anderen Vertrags dient
    und beide Verträge eine wirtschaftliche Einheit bilden (§ 358 Abs. 3 S. 1 BGB). Sie wird besonders
    angenommen, wenn der Unternehmer selbst finanziert oder sich der Darlehensgeber bei Vorbereitung
    oder Abschluss des Darlehensvertrags der Mitwirkung des Unternehmers bedient (§ 358 Abs. 3
    S. 2 BGB). Bei finanziertem Grundstückserwerb liegt sie nur vor, wenn der Darlehensgeber das
    Grundstück selbst verschafft oder über die Kreditgewährung hinaus den Erwerb fördert (§ 358
    Abs. 3 S. 3 BGB). Rechtsfolge: Der Widerruf des Warenvertrags erstreckt sich auf den Darlehensvertrag
    (§ 358 Abs. 1 BGB), der Widerruf des Darlehensvertrags auf den verbundenen Vertrag (§ 358
    Abs. 2 BGB). Ist das Darlehen dem Unternehmer bereits zugeflossen, tritt der Darlehensgeber
    im Verhältnis zum Verbraucher in die Rechte und Pflichten des Unternehmers aus der Rückabwicklung
    ein (§ 358 Abs. 4 S. 5 BGB).'
  norms:
  - § 358 Abs. 1 BGB
  - § 358 Abs. 2 BGB
  - § 358 Abs. 3 BGB
  - § 358 Abs. 4 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
- slug: zr-darl-einwendungsdurchgriff-359
  type: norm
  front: Welche Grenzen hat der Einwendungsdurchgriff nach § 359 BGB?
  back: Bei verbundenen Verträgen kann der Darlehensnehmer die Rückzahlung des Darlehens verweigern,
    soweit Einwendungen aus dem verbundenen Vertrag ihn gegenüber dem Unternehmer zur Verweigerung
    seiner Leistung berechtigen (§ 359 Abs. 1 S. 1 BGB). Das durchbricht die Trennung von Darlehens-
    und Kaufvertrag und schützt den Verbraucher vor dem Risiko, das Darlehen trotz mangelhafter
    Leistung des Verkäufers zurückzahlen zu müssen. Der Durchgriff ist ausgeschlossen bei Einwendungen,
    die auf einer nach Abschluss des Darlehensvertrags vereinbarten Vertragsänderung beruhen (§
    359 Abs. 1 S. 2 BGB), und bei geringen Beträgen unter 200 Euro (§ 359 Abs. 2 BGB). Wegen eines
    Mangels kann der Darlehensnehmer die Rückzahlung erst verweigern, wenn die Nacherfüllung fehlgeschlagen
    ist (§ 359 Abs. 1 S. 3 BGB). Der Darlehensgeber behält eigene Rechte gegen den Unternehmer.
  norms:
  - § 359 Abs. 1 BGB
  - § 359 Abs. 2 BGB
  - § 358 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
- slug: zr-darl-kuendigung-498
  type: norm
  front: Wann kann der Darlehensgeber das Verbraucherdarlehen wegen Verzugs kündigen (§ 498
    BGB)?
  back: Bei einem Teilzahlungsdarlehen kann der Darlehensgeber den Vertrag wegen Zahlungsverzugs
    nur kündigen und den gesamten Restbetrag fällig stellen, wenn der Darlehensnehmer mit
    mindestens zwei aufeinanderfolgenden Teilzahlungen ganz oder teilweise und mit mindestens
    10 Prozent, bei einer Laufzeit von über drei Jahren mit 5 Prozent des Nennbetrags des
    Darlehens oder des Teilzahlungspreises im Verzug ist (§ 498 Abs. 1 S. 1 Nr. 1 BGB). Außerdem
    muss der Darlehensgeber dem Darlehensnehmer erfolglos eine zweiwöchige Frist zur Zahlung
    des rückständigen Betrags mit der Erklärung gesetzt haben, bei Nichtzahlung die gesamte
    Restschuld zu verlangen (Nr. 2). Er soll dem Darlehensnehmer spätestens mit der Fristsetzung
    ein Gespräch über Möglichkeiten einer einvernehmlichen Regelung anbieten (§ 498 Abs. 1
    S. 2 BGB). Die Regel schützt den Verbraucher vor einer vorschnellen Gesamtfälligstellung.
  norms:
  - § 498 Abs. 1 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
- slug: zr-darl-vorzeitige-rueckzahlung-500-502
  type: norm
  front: Welche Rechte hat der Darlehensnehmer bei vorzeitiger Rückzahlung (§§ 500, 502 BGB)?
  back: Der Darlehensnehmer kann einen Verbraucherdarlehensvertrag, bei dem keine Laufzeit
    bestimmt ist, jederzeit ganz oder teilweise kündigen; eine vereinbarte Kündigungsfrist
    darf einen Monat nicht überschreiten (§ 500 Abs. 1 BGB). Er kann seine Verbindlichkeiten
    aus einem Verbraucherdarlehensvertrag jederzeit ganz oder teilweise vorzeitig erfüllen
    (§ 500 Abs. 2 BGB). In diesem Fall kann der Darlehensgeber unter den Voraussetzungen des
    § 502 BGB eine angemessene Vorfälligkeitsentschädigung für den unmittelbar mit der vorzeitigen
    Rückzahlung zusammenhängenden Schaden verlangen, sofern bei Rückzahlung ein gebundener Sollzinssatz geschuldet wird (§ 502 Abs. 1 BGB). Die Entschädigung darf 1 Prozent des vorzeitig zurückgezahlten Betrags (0,5 Prozent, wenn der Zeitraum zwischen Rückzahlung und vereinbartem Ende ein Jahr nicht übersteigt) und den Sollzins für diese Restlaufzeit nicht überschreiten (§ 502 Abs. 3 BGB). Die Entschädigung
    entfällt in den Fällen des § 502 Abs. 2 BGB, etwa wenn die Rückzahlung aus einer Versicherung
    finanziert wird oder Angaben im Vertrag zur Kündigung oder Berechnung fehlen.
  norms:
  - § 500 Abs. 1 BGB
  - § 500 Abs. 2 BGB
  - § 502 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
