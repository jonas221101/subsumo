cards:
- slug: zr-985-anspruchsvoraussetzungen
  type: definition
  front: Welche drei Voraussetzungen hat der Herausgabeanspruch aus § 985 BGB?
  back: Der Anspruch aus § 985 BGB setzt voraus, dass der Anspruchsteller Eigentümer
    der Sache ist, der Anspruchsgegner Besitzer der Sache ist und der Besitzer kein
    Recht zum Besitz im Sinne des § 986 BGB hat.
  norms:
  - § 985 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-985-vindikationslage
  type: definition
  front: Was bezeichnet der Begriff 'Vindikationslage'?
  back: Die Vindikationslage beschreibt den Zustand, in dem die Voraussetzungen des
    § 985 BGB vorliegen - der Eigentümer ist nicht (mehr) Besitzer der Sache und
    der Besitzer hat kein Recht zum Besitz. Sie bildet zugleich die tatbestandliche
    Grundlage für die Ansprüche des Eigentümer-Besitzer-Verhältnisses aus §§ 987
    ff. BGB.
  norms:
  - § 985 BGB
  - § 986 BGB
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-986-recht-zum-besitz
  type: definition
  front: Was bewirkt ein Recht zum Besitz nach § 986 BGB?
  back: Hat der Besitzer ein Recht zum Besitz gegenüber dem Eigentümer - etwa aus
    einem schuldrechtlichen Vertrag wie Miete, Leihe oder Pacht, aus einem dinglichen
    Recht wie Nießbrauch oder Pfandrecht, oder aus Gesetz -, kann er die Herausgabe
    nach § 985 BGB verweigern. Das Recht zum Besitz wirkt dabei nur relativ, also
    nur im Verhältnis zu demjenigen, gegen den es sich richtet.
  norms:
  - § 986 BGB
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-ebv-systematik-987ff
  type: definition
  front: Welche Anspruchsgruppen regelt das Eigentümer-Besitzer-Verhältnis (EBV)
    neben dem Herausgabeanspruch?
  back: 'Das EBV der §§ 987 ff. BGB ergänzt den Herausgabeanspruch aus § 985 BGB
    um drei weitere Anspruchsgruppen zwischen nichtberechtigtem Besitzer und Eigentümer:
    den Nutzungsherausgabeanspruch (§§ 987, 988, 990, 993 BGB), den Schadensersatzanspruch
    bei Verschlechterung, Untergang oder Unmöglichkeit der Herausgabe (§§ 989, 990,
    991, 992 BGB) und den Verwendungsersatzanspruch des Besitzers gegen den Eigentümer
    (§§ 994 ff. BGB).'
  norms:
  - § 987 BGB
  - § 989 BGB
  - § 994 BGB
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-990-boesglaeubiger-besitzer
  type: definition
  front: Welche Rechtsfolge hat Bösgläubigkeit des Besitzers nach § 990 BGB?
  back: War der Besitzer bereits beim Besitzerwerb bösgläubig - kannte er also sein
    fehlendes Besitzrecht oder kannte er es grob fahrlässig nicht -, oder erfährt
    er dies später, haftet er ab diesem Zeitpunkt wie ein Besitzer, gegen den die
    Herausgabeklage rechtshängig ist. § 990 BGB erstreckt damit die verschärfte
    Haftung aus §§ 987, 989 BGB auf den bösgläubigen, aber noch nicht verklagten
    Besitzer.
  norms:
  - § 990 BGB
  - § 987 BGB
  - § 989 BGB
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-993-haftungsprivileg
  type: definition
  front: Worin besteht das Haftungsprivileg des § 993 Abs. 1 Halbsatz 2 BGB?
  back: Ein gutgläubiger und nicht verklagter unmittelbarer Besitzer haftet dem Eigentümer
    über die in §§ 987 bis 992 BGB genannten Fälle hinaus weder auf Nutzungsherausgabe
    noch auf Schadensersatz nach den allgemeinen Vorschriften - insbesondere nicht
    nach Delikts- oder Bereicherungsrecht. Das EBV verdrängt insoweit abschließend
    die allgemeine Haftung und schützt den redlichen Besitzer vor unkalkulierbaren
    Ansprüchen.
  norms:
  - § 993 Abs. 1 BGB
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-ebv-sperrwirkung
  type: streitstand
  front: Entfaltet die Vindikationslage eine Sperrwirkung gegenüber Ansprüchen aus
    Delikts- und Bereicherungsrecht?
  back: Nach ganz herrschender Meinung verdrängen die §§ 987 ff. BGB als abschließende
    Sonderregelung im Verhältnis von nichtberechtigtem Besitzer und Eigentümer die
    allgemeinen Anspruchsgrundlagen aus Deliktsrecht (§§ 823 ff. BGB) und Bereicherungsrecht
    (§§ 812 ff. BGB), soweit deren Tatbestände denselben Bereich betreffen wie das
    EBV - insbesondere Nutzungen und Verwendungen. Außerhalb dieses geregelten Bereichs,
    etwa bei einer eigenständigen Rechtsgutsverletzung durch den Besitzer, bleiben
    Delikts- und Bereicherungsansprüche unberührt anwendbar.
  norms:
  - § 985 BGB
  - § 987 BGB
  - § 812 BGB
  - § 823 BGB
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
schemata:
- slug: zr-schema-985
  title: Herausgabeanspruch aus § 985 BGB
  norms:
  - § 985 BGB
  - § 986 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  steps:
  - label: I. Anspruchsteller ist Eigentümer der Sache
  - label: II. Anspruchsgegner ist Besitzer der Sache
    children:
    - label: 1. unmittelbarer Besitz, § 854 Abs. 1 BGB
    - label: 2. oder mittelbarer Besitz, § 868 BGB
  - label: III. Kein Recht zum Besitz des Anspruchsgegners, § 986 BGB
    hinweis: Ein eigenes oder ein vom mittelbaren Besitzer abgeleitetes Besitzrecht
      schließt den Anspruch aus.
  - label: 'IV. Rechtsfolge: Herausgabe der Sache'
    hinweis: Ggf. nur Zug um Zug gegen Verwendungsersatz, § 1000 BGB.
  stand: 2026-09
faelle:
- slug: zr-fall-verspaetete-rueckgabe-985
  title: Die verspätete Rückgabe
  difficulty: 2
  minutes: 30
  quellen:
  - Eigener Sachverhalt der Redaktion
  - BGB, amtliche Fassung
  facts: Eigentümerin E leiht ihr Mountainbike der L befristet bis zum 1. März,
    § 604 Abs. 1 BGB. L nutzt das Rad über den vereinbarten Termin hinaus weiter
    und gibt es trotz Aufforderung der E nicht zurück.
  question: Hat E gegen L einen Anspruch auf Herausgabe des Mountainbikes aus § 985
    BGB?
  steps:
  - prompt: Formuliere den Obersatz.
    erwartung: E könnte gegen L einen Anspruch auf Herausgabe des Mountainbikes aus
      § 985 BGB haben.
  - prompt: Ist E Eigentümerin des Mountainbikes geblieben?
    erwartung: Ja - die Leihe ist ein rein schuldrechtliches Rechtsgeschäft und kein
      Verfügungsgeschäft; das Eigentum der E bleibt unberührt.
  - prompt: Ist L Besitzerin des Mountainbikes?
    erwartung: Ja - L übt die tatsächliche Sachherrschaft aus und ist damit unmittelbare
      Besitzerin, § 854 Abs. 1 BGB.
  - prompt: Hatte L ein Recht zum Besitz, und besteht es noch?
    erwartung: Ursprünglich ja, aus dem Leihvertrag, § 598 BGB. Mit Ablauf der vereinbarten
      Leihzeit endete das Leihverhältnis jedoch gemäß § 604 Abs. 1 BGB, sodass
      das Recht zum Besitz der L erloschen ist.
  - prompt: Wie ist der Anspruch zu bescheiden?
    erwartung: E hat gegen L einen Anspruch auf Herausgabe des Mountainbikes aus §
      985 BGB.
