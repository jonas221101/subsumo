cards:
- slug: zr-985-anspruchsvoraussetzungen
  type: definition
  front: Welche drei Voraussetzungen hat der Herausgabeanspruch aus § 985 BGB?
  back: Der Anspruch aus § 985 BGB setzt voraus, dass der Anspruchsteller Eigentuemer
    der Sache ist, der Anspruchsgegner Besitzer der Sache ist und der Besitzer kein
    Recht zum Besitz im Sinne des § 986 BGB hat.
  norms:
  - § 985 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-985-vindikationslage
  type: definition
  front: Was bezeichnet der Begriff 'Vindikationslage'?
  back: Die Vindikationslage beschreibt den Zustand, in dem die Voraussetzungen des
    § 985 BGB vorliegen - der Eigentuemer ist nicht (mehr) Besitzer der Sache und
    der Besitzer hat kein Recht zum Besitz. Sie bildet zugleich die tatbestandliche
    Grundlage fuer die Ansprueche des Eigentuemer-Besitzer-Verhaeltnisses aus §§ 987
    ff. BGB.
  norms:
  - § 985 BGB
  - § 986 BGB
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-986-recht-zum-besitz
  type: definition
  front: Was bewirkt ein Recht zum Besitz nach § 986 BGB?
  back: Hat der Besitzer ein Recht zum Besitz gegenueber dem Eigentuemer - etwa aus
    einem schuldrechtlichen Vertrag wie Miete, Leihe oder Pacht, aus einem dinglichen
    Recht wie Niessbrauch oder Pfandrecht, oder aus Gesetz -, kann er die Herausgabe
    nach § 985 BGB verweigern. Das Recht zum Besitz wirkt dabei nur relativ, also
    nur im Verhaeltnis zu demjenigen, gegen den es sich richtet.
  norms:
  - § 986 BGB
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-ebv-systematik-987ff
  type: definition
  front: Welche Anspruchsgruppen regelt das Eigentuemer-Besitzer-Verhaeltnis (EBV)
    neben dem Herausgabeanspruch?
  back: 'Das EBV der §§ 987 ff. BGB ergaenzt den Herausgabeanspruch aus § 985 BGB
    um drei weitere Anspruchsgruppen zwischen nichtberechtigtem Besitzer und Eigentuemer:
    den Nutzungsherausgabeanspruch (§§ 987, 988, 990, 993 BGB), den Schadensersatzanspruch
    bei Verschlechterung, Untergang oder Unmoeglichkeit der Herausgabe (§§ 989, 990,
    991, 992 BGB) und den Verwendungsersatzanspruch des Besitzers gegen den Eigentuemer
    (§§ 994 ff. BGB).'
  norms:
  - § 987 BGB
  - § 989 BGB
  - § 994 BGB
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-990-boesglaeubiger-besitzer
  type: definition
  front: Welche Rechtsfolge hat Boesglaeubigkeit des Besitzers nach § 990 BGB?
  back: War der Besitzer bereits beim Besitzerwerb boesglaeubig - kannte er also sein
    fehlendes Besitzrecht oder kannte er es grob fahrlaessig nicht -, oder erfaehrt
    er dies spaeter, haftet er ab diesem Zeitpunkt wie ein Besitzer, gegen den die
    Herausgabeklage rechtshaengig ist. § 990 BGB erstreckt damit die verschaerfte
    Haftung aus §§ 987, 989 BGB auf den boesglaeubigen, aber noch nicht verklagten
    Besitzer.
  norms:
  - § 990 BGB
  - § 987 BGB
  - § 989 BGB
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-993-haftungsprivileg
  type: definition
  front: Worin besteht das Haftungsprivileg des § 993 Abs. 1 Halbsatz 2 BGB?
  back: Ein gutglaeubiger und nicht verklagter unmittelbarer Besitzer haftet dem Eigentuemer
    ueber die in §§ 987 bis 992 BGB genannten Faelle hinaus weder auf Nutzungsherausgabe
    noch auf Schadensersatz nach den allgemeinen Vorschriften - insbesondere nicht
    nach Delikts- oder Bereicherungsrecht. Das EBV verdraengt insoweit abschliessend
    die allgemeine Haftung und schuetzt den redlichen Besitzer vor unkalkulierbaren
    Anspruechen.
  norms:
  - § 993 Abs. 1 BGB
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-ebv-sperrwirkung
  type: streitstand
  front: Entfaltet die Vindikationslage eine Sperrwirkung gegenueber Anspruechen aus
    Delikts- und Bereicherungsrecht?
  back: Nach ganz herrschender Meinung verdraengen die §§ 987 ff. BGB als abschliessende
    Sonderregelung im Verhaeltnis von nichtberechtigtem Besitzer und Eigentuemer die
    allgemeinen Anspruchsgrundlagen aus Deliktsrecht (§§ 823 ff. BGB) und Bereicherungsrecht
    (§§ 812 ff. BGB), soweit deren Tatbestaende denselben Bereich betreffen wie das
    EBV - insbesondere Nutzungen und Verwendungen. Ausserhalb dieses geregelten Bereichs,
    etwa bei einer eigenstaendigen Rechtsgutsverletzung durch den Besitzer, bleiben
    Delikts- und Bereicherungsansprueche unberuehrt anwendbar.
  norms:
  - § 985 BGB
  - § 987 BGB
  - § 812 BGB
  - § 823 BGB
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
schemata:
- slug: zr-schema-985
  title: Herausgabeanspruch aus § 985 BGB
  norms:
  - § 985 BGB
  - § 986 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  steps:
  - label: I. Anspruchsteller ist Eigentuemer der Sache
  - label: II. Anspruchsgegner ist Besitzer der Sache
    children:
    - label: 1. unmittelbarer Besitz, § 854 Abs. 1 BGB
    - label: 2. oder mittelbarer Besitz, § 868 BGB
  - label: III. Kein Recht zum Besitz des Anspruchsgegners, § 986 BGB
    hinweis: Ein eigenes oder ein vom mittelbaren Besitzer abgeleitetes Besitzrecht
      schliesst den Anspruch aus.
  - label: 'IV. Rechtsfolge: Herausgabe der Sache'
    hinweis: Ggf. nur Zug um Zug gegen Verwendungsersatz, § 1000 BGB.
  stand: 2026-09
faelle:
- slug: zr-fall-verspaetete-rueckgabe-985
  title: Die verspaetete Rueckgabe
  difficulty: 2
  minutes: 30
  quellen:
  - Eigener Sachverhalt der Redaktion
  - BGB, amtliche Fassung
  facts: Eigentuemerin E leiht ihr Mountainbike der L befristet bis zum 1. Maerz,
    § 604 Abs. 1 BGB. L nutzt das Rad ueber den vereinbarten Termin hinaus weiter
    und gibt es trotz Aufforderung der E nicht zurueck.
  question: Hat E gegen L einen Anspruch auf Herausgabe des Mountainbikes aus § 985
    BGB?
  steps:
  - prompt: Formuliere den Obersatz.
    erwartung: E koennte gegen L einen Anspruch auf Herausgabe des Mountainbikes aus
      § 985 BGB haben.
  - prompt: Ist E Eigentuemerin des Mountainbikes geblieben?
    erwartung: Ja - die Leihe ist ein rein schuldrechtliches Rechtsgeschaeft und kein
      Verfuegungsgeschaeft; das Eigentum der E bleibt unberuehrt.
  - prompt: Ist L Besitzerin des Mountainbikes?
    erwartung: Ja - L uebt die tatsaechliche Sachherrschaft aus und ist damit unmittelbare
      Besitzerin, § 854 Abs. 1 BGB.
  - prompt: Hatte L ein Recht zum Besitz, und besteht es noch?
    erwartung: Urspruenglich ja, aus dem Leihvertrag, § 598 BGB. Mit Ablauf der vereinbarten
      Leihzeit endete das Leihverhaeltnis jedoch gemaess § 604 Abs. 1 BGB, sodass
      das Recht zum Besitz der L erloschen ist.
  - prompt: Wie ist der Anspruch zu bescheiden?
    erwartung: E hat gegen L einen Anspruch auf Herausgabe des Mountainbikes aus §
      985 BGB.
