- slug: zr-schema-bmp-anweisung
  title: Bereicherungsausgleich in Anweisungsfällen
  norms:
  - § 812 Abs. 1 S. 1 Alt. 1 BGB
  - § 812 Abs. 1 S. 1 Alt. 2 BGB
  - § 818 Abs. 3 BGB
  - § 822 BGB
