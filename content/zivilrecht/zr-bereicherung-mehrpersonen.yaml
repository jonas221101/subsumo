  steps:
  - label: I. Zuordnung der Leistungen
    children:
    - label: >-
        1. Wer hat wem etwas zugewendet (Anweisender, Angewiesener, Empfänger)?
    - label: 2. Anweisung vorhanden und dem Anweisenden zurechenbar?
      hinweis: >-
        Fehlt sie, scheidet die Leistung des Angewiesenen für den Anweisenden aus;
        dann Direktanspruch gegen den Empfänger (Einordnung umstritten).
  - label: II. Lokalisierung des Mangels
    children:
    - label: >-
        1. Deckungsverhältnis fehlerhaft: Kondiktion Angewiesener gegen Anweisenden
    - label: '2. Valutaverhältnis fehlerhaft: Kondiktion Anweisender gegen Empfänger'
    - label: '3. Doppelmangel: Kondiktion jeweils im eigenen Verhältnis'
      hinweis: Kein Durchgriff des Angewiesenen auf den Empfänger.
  - label: III. Anspruch aus § 812 Abs. 1 S. 1 Alt. 1 BGB
    children:
    - label: 1. etwas erlangt
    - label: 2. durch Leistung
    - label: 3. ohne Rechtsgrund
  - label: IV. Umfang und Einwendungen
    hinweis: >-
      § 818 Abs. 1, 2 BGB, Entreicherung § 818 Abs. 3 BGB, verschärfte Haftung §§
      818 Abs. 4, 819 BGB.
  - label: V. Dritthaftung
    hinweis: Bei unentgeltlicher Weitergabe § 822 BGB.
faelle:
- slug: zr-fall-bmp-ueberweisung-kaufpreis
  title: Der angefochtene Laptopkauf
  difficulty: 4
  minutes: 60
  quellen:
  - Eigener Sachverhalt der Redaktion
  - BGB, amtliche Fassung
  facts: >-
    A kauft von V einen Laptop und erklärt sich beim Preis versehentlich mit 1.200
    Euro einverstanden, obwohl er 120 Euro erklären wollte; V hielt den Preis für
    zutreffend, ohne den Irrtum zu erkennen. A weist seine Bank B an, 1.200 Euro an
    V zu überweisen. B führt die Überweisung wirksam aus. V schenkt davon 1.000 Euro
    sofort seinem Sohn S, der nichts vom Hintergrund weiß und das Geld noch hat; 200 Euro hat V noch. Nachdem
    A den Irrtum bemerkt, ficht er den Kaufvertrag unverzüglich an. Das Girovertragsverhältnis
    zwischen A und B war in Ordnung; der Laptop ist noch nicht geliefert.
  question: Welche Ansprüche bestehen zwischen B, A, V und S (ohne § 122 BGB)?
  steps:
  - prompt: Wer hat an wen geleistet, und wie ist das Verhältnis der Beteiligten?
    erwartung: >-
      Anweisungsfall. Deckungsverhältnis A–B, Valutaverhältnis A–V. Die Zahlung der
      B an V ist Leistung der B an A und Leistung des A an V. Zwischen B und V besteht
      keine Leistungsbeziehung.
  - prompt: Hat B einen Anspruch gegen V oder gegen A?
    erwartung: >-
      Kein Anspruch gegen V (kein Durchgriff). Gegen A hat B Aufwendungsersatz aus
      dem wirksamen Deckungsverhältnis (§§ 675c, 670 BGB); das Deckungsverhältnis
      ist fehlerfrei, B kann ohne Weiteres belasten.
  - prompt: Hat A einen Anspruch gegen V auf Rückzahlung?
    erwartung: >-
      Ja, § 812 Abs. 1 S. 1 Alt. 1 BGB: V hat 1.200 Euro durch Leistung des A erlangt;
      der Kaufvertrag ist nach Anfechtung wegen Erklärungsirrtums von Anfang an nichtig
      (§§ 119 Abs. 1, 142 Abs. 1 BGB), also fehlt der Rechtsgrund.
  - prompt: Kann V sich auf Entreicherung berufen?
    erwartung: >-
      Ja, in Höhe von 1.000 Euro, die er unentgeltlich an S weitergegeben hat (§ 818
      Abs. 3 BGB). V kannte die Anfechtbarkeit nicht und musste sie nicht kennen (kein
      § 142 Abs. 2 BGB), eine verschärfte Haftung nach § 819 BGB besteht nicht. Nur
      200 Euro schuldet er.
  - prompt: Haftet S?
    erwartung: >-
      Ja, A kann von S 1.000 Euro nach § 822 BGB verlangen: V hat unentgeltlich an
      S zugewendet, und dadurch ist V von seiner Herausgabepflicht frei geworden.
  expectation:
