  steps:
  - label: I. Verfügung
    hinweis: Rechtsgeschäft, das unmittelbar ein Recht überträgt, belastet,
      aufhebt oder ändert (z. B. Einigung und Übergabe, § 929 S. 1 BGB).
  - label: II. Verfügender ist Nichtberechtigter
    hinweis: Weder Inhaber des Rechts noch verfügungsbefugt.
  - label: III. Wirksamkeit nach § 185 BGB
    children:
    - label: 1. Einwilligung des Berechtigten, § 185 Abs. 1 BGB
      hinweis: Widerruflich bis zur Vornahme, § 183 BGB.
    - label: 2. Genehmigung des Berechtigten, § 185 Abs. 2 S. 1 Var. 1 BGB
      children:
      - label: a) Erklärung gegenüber einem der Beteiligten, § 182 Abs. 1 BGB
      - label: b) Keine Form erforderlich, § 182 Abs. 2 BGB
      - label: c) Rückwirkung, § 184 Abs. 1 BGB
    - label: 3. Konvaleszenz, § 185 Abs. 2 S. 1 Var. 2 BGB
      hinweis: Heilung ex nunc.
    - label: 4. Beerbung, § 185 Abs. 2 S. 1 Var. 3 BGB
  - label: IV. Folgeansprüche
    children:
    - label: 1. Herausgabe des Erlöses, § 816 Abs. 1 S. 1 BGB
    - label: 2. Verlust von § 985 BGB gegen den Erwerber
faelle:
- slug: zr-fall-at-zust-genehmigung-verkauf
  title: Die geliehene Maschine
  difficulty: 3
  minutes: 40
  quellen:
  - Eigener Sachverhalt der Redaktion
  - BGB, amtliche Fassung
  facts: >-
    E leiht dem Bekannten H eine Spezialmaschine für drei Monate. H verkauft und
    übergibt die Maschine für 5.000 Euro an K. K, der weiß, dass die Maschine E gehört und H sie nur geliehen hat, zahlt den Kaufpreis.
    Als E dies erfährt, schreibt er H einen Brief, in dem er den Verkauf nachträglich
    "billigt" und von H die 5.000 Euro verlangt. Zugleich verlangt er aber von K
    Herausgabe der Maschine. Der Wert der Maschine beträgt 5.000 Euro.
  question: Wer ist Eigentümer der Maschine, und kann E von H Herausgabe der 5.000
    Euro verlangen?
  steps:
  - prompt: Ist K Eigentümer geworden, § 929 S. 1 BGB?
    erwartung: >-
      Zunächst nicht. Einigung und Übergabe liegen vor, aber H war als Entleiher
      Nichtberechtigter. Ein gutgläubiger Erwerb nach §§ 929 S. 1, 932 BGB scheitert, weil K bösgläubig war (§ 932 Abs. 2 BGB). Die Verfügung ist daher zunächst
      unwirksam.
  - prompt: Hat E die Verfügung wirksam genehmigt?
    erwartung: >-
      Ja. Die Genehmigung nach § 185 Abs. 2 S. 1 Var. 1 BGB kann nach § 182 Abs. 1 BGB
      gegenüber H als einem der Beteiligten erklärt werden und ist formfrei (§ 182 Abs. 2
      BGB). Die Genehmigung ist als "Billigung des Verkaufs" auszulegen. Sie wirkt nach §
      184 Abs. 1 BGB zurück, sodass K Eigentümer geworden ist.
  - prompt: Kann E von K Herausgabe nach § 985 BGB verlangen?
    erwartung: >-
      Nein. E hat durch die wirksame Genehmigung sein Eigentum verloren; K ist
      Eigentümer und hat ein Recht zum Besitz.
  - prompt: Kann E von H die 5.000 Euro verlangen?
    erwartung: >-
      Ja, aus § 816 Abs. 1 S. 1 BGB. H hat als Nichtberechtigter entgeltlich über die
      Maschine verfügt, die Verfügung ist E gegenüber durch die Genehmigung wirksam. H
      muss das durch die Verfügung Erlangte, den Kaufpreis von 5.000 Euro,
      herausgeben.
  expectation:
    pruefpunkte:
