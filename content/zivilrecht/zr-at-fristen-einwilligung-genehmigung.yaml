- slug: zr-schema-at-zust-185
  title: Wirksamkeit der Verfügung eines Nichtberechtigten, § 185 BGB
  norms:
  - § 185 BGB
  - § 182 BGB
  - § 184 BGB
  - § 816 Abs. 1 S. 1 BGB
