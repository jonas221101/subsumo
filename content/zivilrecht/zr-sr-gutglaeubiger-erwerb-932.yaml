cards:
- slug: zr-sr-gutglaeubiger-erwerb-932-grundgedanke
  type: definition
  front: Was ist der Grundgedanke des gutgläubigen Erwerbs, § 932 Abs. 1 BGB?
  back: 'Durch eine Veräußerung nach § 929 BGB wird der Erwerber auch dann Eigentümer,
    wenn die Sache dem Veräußerer nicht gehört - es sei denn, der Erwerber ist
    im maßgeblichen Zeitpunkt nicht in gutem Glauben (§ 932 Abs. 1 BGB). Der Rechtsschein,
    an den das Gesetz anknüpft, ist der Besitz des Veräußerers: Wer eine Sache
    besitzt, erweckt den (widerlegbaren) Anschein, ihr Eigentümer zu sein.'
  norms:
  - § 932 Abs. 1 BGB
  - § 929 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-sr-guter-glaube-932-2
  type: definition
  front: Wann fehlt dem Erwerber der gute Glaube, § 932 Abs. 2 BGB?
  back: Der Erwerber ist nicht in gutem Glauben, wenn ihm bekannt ist oder infolge
    grober Fahrlässigkeit unbekannt ist, dass die Sache nicht dem Veräußerer gehört
    (§ 932 Abs. 2 BGB). Grobe Fahrlässigkeit liegt vor, wenn der Erwerber die im
    Verkehr erforderliche Sorgfalt in ungewöhnlich hohem Masse verletzt und ganz
    naheliegende Umstände außer Acht lässt, die auf die fehlende Berechtigung des
    Veräußerers hindeuten.
  norms:
  - § 932 Abs. 2 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-sr-massgeblicher-zeitpunkt-guter-glaube
  type: definition
  front: Auf welchen Zeitpunkt kommt es für die Gutgläubigkeit des Erwerbers an?
  back: Maßgeblich ist grundsätzlich der Zeitpunkt, zu dem der Erwerber nach den
    §§ 929 ff. BGB das Eigentum erwerben würde - also regelmäßig der Zeitpunkt
    der Übergabe. Vollzieht sich der Erwerb erst später (z. B. beim Besitzkonstitut
    erst mit der tatsächlichen Besitzerlangung, § 933 BGB), muss der gute Glaube
    bis zu diesem späteren Zeitpunkt fortbestehen; entfällt er vorher, scheitert
    der Erwerb.
  norms:
  - § 932 Abs. 1 BGB
  - § 933 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-sr-gutglaeubiger-erwerb-933-besitzkonstitut
  type: definition
  front: Wie unterscheidet sich der gutgläubige Erwerb beim Besitzkonstitut, § 933
    BGB, von § 932 BGB?
  back: Wird die Übergabe durch ein Besitzkonstitut (§ 930 BGB) ersetzt, so geht
    das Eigentum erst über, wenn der Erwerber den Besitz der Sache vom Veräußerer
    erlangt hat - es sei denn, er ist zu dieser Zeit nicht mehr in gutem Glauben (§
    933 BGB). Die bloße Vereinbarung des Besitzmittlungsverhältnisses reicht also
    anders als bei § 932 BGB nicht aus, weil ihr kein nach außen erkennbarer Rechtsschein
    zukommt - erst der tatsächliche Besitzübergang schafft diesen.
  norms:
  - § 933 BGB
  - § 930 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-sr-gutglaeubiger-erwerb-934-abtretung
  type: definition
  front: Wie regelt § 934 BGB den gutgläubigen Erwerb bei Abtretung des Herausgabeanspruchs?
  back: 'Wird die Übergabe durch Abtretung des Herausgabeanspruchs (§ 931 BGB) ersetzt,
    differenziert § 934 BGB: War der veräußernde Nichtberechtigte mittelbarer Besitzer,
    wird der Erwerber schon mit der Abtretung Eigentümer. War er es nicht (die Sache
    befand sich bei einem Dritten, ohne dass der Veräußerer selbst mittelbaren Besitz
    hatte), wird der Erwerber erst Eigentümer, wenn er den Besitz von dem Dritten
    erlangt.'
  norms:
  - § 934 BGB
  - § 931 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-sr-abhandenkommen-935-1
  type: definition
  front: 'Definiere: Abhandenkommen, § 935 Abs. 1 BGB'
  back: Ein gutgläubiger Erwerb ist ausgeschlossen, wenn die Sache dem Eigentümer
    gestohlen worden, verloren gegangen oder sonst abhandengekommen ist (§ 935 Abs.
    1 BGB). Abhandenkommen bedeutet den unfreiwilligen Verlust des unmittelbaren Besitzes
    - anders als beim Diebstahl oder Verlust genügt für die Auffangvariante "sonst
    abhandengekommen" jeder Fall, in dem der unmittelbare Besitzer den Besitz ohne
    oder gegen seinen Willen einbüszt.
  norms:
  - § 935 Abs. 1 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-sr-935-2-ausnahmen-geld-versteigerung
  type: definition
  front: Welche Ausnahmen vom Ausschluss des gutgläubigen Erwerbs nennt § 935 Abs.
    2 BGB?
  back: Bei Geld, Inhaberpapieren und Sachen, die im Wege öffentlicher Versteigerung
    veräußert werden, greift der Ausschluss des § 935 Abs. 1 BGB nicht - ein gutgläubiger
    Erwerb ist hier auch bei Abhandenkommen möglich (§ 935 Abs. 2 BGB). Der Grund
    liegt im besonderen Verkehrsschutzbedürfnis bei umlauffähigen Sachen und bei
    Erwerbsvorgängen, denen ein besonderes Vertrauen entgegengebracht wird.
  norms:
  - § 935 Abs. 2 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-sr-abhandenkommen-mehrstufiger-besitz
  type: definition
  front: Kommt es für § 935 BGB auf den unmittelbaren oder auf den mittelbaren Besitzer
    an?
  back: Maßgeblich ist der unmittelbare Besitzer. Verliert dieser den Besitz unfreiwillig
    (z. B. wird ihm die Sache gestohlen), ist sie abhandengekommen - unabhängig davon,
    ob ein mittelbarer Besitzer (etwa der Eigentümer, der die Sache zuvor freiwillig
    einem Entleiher übergeben hatte) selbst freiwillig aus der Hand gegeben hat.
    Der Besitzdiener (§ 855 BGB) ist dagegen kein eigener Besitzer; sein unfreiwilliger
    Besitzverlust wird dem Besitzherrn zugerechnet.
  norms:
  - § 935 Abs. 1 BGB
  - § 855 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
schemata:
- slug: zr-schema-gutglaeubiger-erwerb-932
  title: Gutgläubiger Erwerb vom Nichtberechtigten, §§ 932 ff. BGB
  norms:
  - § 932 BGB
  - § 933 BGB
  - § 934 BGB
  - § 935 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  steps:
  - label: I. Rechtsgeschäftlicher Erwerbstatbestand nach §§ 929 ff. BGB
    hinweis: Einigung und Übergabe bzw. Übergabesurrogat, außer der Berechtigung
      des Veräußerers.
  - label: II. Nichtberechtigung des Veräußerers
  - label: III. Gutgläubigkeit des Erwerbers, § 932 Abs. 2 BGB
    hinweis: Kein Wissen und keine grobe Fahrlässigkeit hinsichtlich der fehlenden
      Berechtigung.
  - label: IV. Ausreichender Rechtsscheinstatbestand je nach Erwerbsart
    children:
    - label: '1. Bei Übergabe, § 929 S. 1, 2 BGB: Besitz des Veräußerers genügt'
    - label: '2. Bei Besitzkonstitut: erst mit tatsächlicher Besitzerlangung, § 933
        BGB'
    - label: '3. Bei Abtretung des Herausgabeanspruchs: differenzierend nach § 934
        BGB'
  - label: V. Kein Abhandenkommen, § 935 BGB
  - label: 'VI. Ergebnis: gutgläubiger Eigentumserwerb (+)/(-)'
faelle:
- slug: zr-fall-verliehenes-mountainbike
  title: Das verliehene Mountainbike
  difficulty: 3
  minutes: 35
  quellen:
  - Eigener Sachverhalt der Redaktion
  - BGB, amtliche Fassung
  facts: E verleiht sein Mountainbike für eine Woche an seinen Bekannten M. Ohne
    Wissen des E verkauft M das Fahrrad noch während der Leihzeit an den D für 200
    EUR und übergibt es ihm sofort; D geht davon aus, dass M der Eigentümer ist,
    und hat keinen Anlass, daran zu zweifeln. Als E nach Ablauf der Woche das Rad
    von M zurückverlangt, erfährt er von dem Verkauf und verlangt nun von D die
    Herausgabe des Fahrrads.
  question: Kann E von D die Herausgabe des Fahrrads gemäß § 985 BGB verlangen?
  steps:
  - prompt: Formuliere den Obersatz.
    erwartung: E könnte gegen D einen Anspruch auf Herausgabe aus § 985 BGB haben,
      wenn E Eigentümer und D Besitzer ohne eigenes Recht zum Besitz ist.
  - prompt: Konnte D trotz fehlender Berechtigung des M Eigentümer werden?
    erwartung: 'Ja, möglicherweise gutgläubig nach § 932 BGB: Einigung und Übergabe
      zwischen M und D liegen vor, M war aber Nichtberechtigter (nur Entleiher).'
  - prompt: War D in gutem Glauben?
    erwartung: Ja, laut Sachverhalt ging D ohne grobe Fahrlässigkeit davon aus, dass
      M Eigentümer sei.
  - prompt: Ist das Fahrrad dem E abhandengekommen, § 935 Abs. 1 BGB?
    erwartung: Nein. E hat das Rad freiwillig an M verliehen, und M hat es seinerseits
      freiwillig an D weitergegeben - auf keiner Besitzstufe liegt ein unfreiwilliger
      Besitzverlust vor.
  - prompt: Zu welchem Ergebnis kommst du?
    erwartung: D hat gutgläubig Eigentum erworben (§ 932 BGB); E hat sein Eigentum
      verloren und daher keinen Anspruch aus § 985 BGB gegen D.
  expectation:
    pruefpunkte:
    - id: p1
      label: Anspruchsgrundlage § 985 BGB genannt (Obersatz, Vindikationslage)
      weight: 1.5
      required: true
      norms:
      - § 985 BGB
      keywords:
      - '985'
      - Herausgabe
      card_slugs:
      - zr-sr-gutglaeubiger-erwerb-932-grundgedanke
    - id: p2
      label: Erwerbstatbestand § 929 S. 1 BGB zwischen M und D bejaht, aber M als
        Nichtberechtigter erkannt
      weight: 1.5
      norms:
      - § 929 BGB
      keywords:
      - '929'
      - Nichtberechtigter
      - Entleiher
      card_slugs:
      - zr-sr-gutglaeubiger-erwerb-932-grundgedanke
    - id: p3
      label: Gutgläubigkeit des D nach § 932 Abs. 2 BGB bejaht
      weight: 1.5
      norms:
      - § 932 Abs. 2 BGB
      keywords:
      - gutgläubig
      - '932'
      card_slugs:
      - zr-sr-guter-glaube-932-2
    - id: p4
      label: Kein Abhandenkommen nach § 935 Abs. 1 BGB erkannt und begründet (freiwillige
        Weggabe auf jeder Besitzstufe)
      weight: 3.0
      required: true
      norms:
      - § 935 Abs. 1 BGB
