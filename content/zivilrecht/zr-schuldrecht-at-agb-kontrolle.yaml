cards:
- slug: zr-agb-begriff-305
  type: definition
  front: 'Definiere: Allgemeine Geschäftsbedingungen (AGB), § 305 Abs. 1 BGB'
  back: Allgemeine Geschäftsbedingungen sind alle für eine Vielzahl von Verträgen
    vorformulierten Vertragsbedingungen, die eine Vertragspartei (der Verwender) der
    anderen Partei bei Abschluss eines Vertrags stellt. Unerheblich sind Umfang, Schriftart
    und Form der Bedingungen sowie ob sie einen gesonderten Bestandteil des Vertrags
    bilden oder in die Vertragsurkunde selbst aufgenommen werden.
  norms:
  - § 305 Abs. 1 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-agb-einbeziehung-305-2
  type: norm
  front: Welche Voraussetzungen nennt § 305 Abs. 2 BGB für die wirksame Einbeziehung
    von AGB?
  back: AGB werden nur Vertragsbestandteil, wenn der Verwender bei Vertragsschluss
    die andere Partei ausdrücklich oder, wo dies wegen der Art des Vertragsschlusses
    nur unter unverhältnismäßigen Schwierigkeiten möglich ist, durch deutlich
    sichtbaren Aushang auf sie hinweist (§ 305 Abs. 2 Nr. 1 BGB), der anderen Partei
    die zumutbare Möglichkeit verschafft, in zumutbarer Weise von ihrem Inhalt Kenntnis
    zu nehmen (§ 305 Abs. 2 Nr. 2 BGB), und die andere Partei mit ihrer Geltung einverstanden
    ist.
  norms:
  - § 305 Abs. 2 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-agb-vorrang-individualabrede
  type: norm
  front: Was regelt § 305b BGB (Vorrang der Individualabrede)?
  back: Individuelle Vertragsabreden zwischen den Parteien haben gemäß § 305b BGB
    stets Vorrang vor Allgemeinen Geschäftsbedingungen - unabhängig davon, ob die
    Individualabrede mündlich, schriftlich oder erst nach Abschluss des Formularvertrags
    getroffen wird. Eine kollidierende AGB-Klausel wird insoweit verdrängt, nicht
    nur ausgelegt.
  norms:
  - § 305b BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-agb-ueberraschende-klausel-305c1
  type: norm
  front: Wann wird eine AGB-Klausel nach § 305c Abs. 1 BGB nicht Vertragsbestandteil?
  back: Eine Bestimmung in Allgemeinen Geschäftsbedingungen, die nach den Umständen,
    insbesondere nach dem äußeren Erscheinungsbild des Vertrags, so ungewöhnlich
    ist, dass der Vertragspartner des Verwenders mit ihr nicht zu rechnen braucht,
    wird gemäß § 305c Abs. 1 BGB nicht Vertragsbestandteil - unabhängig von einer
    inhaltlichen Angemessenheitsprüfung nach § 307 BGB.
  norms:
  - § 305c Abs. 1 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-agb-unklarheitenregel-305c2
  type: norm
  front: Was besagt die Unklarheitenregel des § 305c Abs. 2 BGB?
  back: Bleiben nach Ausschöpfung der anerkannten Auslegungsmethoden Zweifel bei
    der Auslegung einer AGB-Klausel bestehen, gehen diese gemäß § 305c Abs. 2 BGB
    zulasten des Verwenders (contra-proferentem-Regel). Von mehreren vertretbaren
    Auslegungen setzt sich damit im Ergebnis die für den Vertragspartner günstigere
    durch.
  norms:
  - § 305c Abs. 2 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-agb-generalklausel-307
  type: definition
  front: 'Definiere: Die Generalklausel des § 307 Abs. 1, Abs. 2 BGB'
  back: Bestimmungen in Allgemeinen Geschäftsbedingungen sind gemäß § 307 Abs.
    1 BGB unwirksam, wenn sie den Vertragspartner des Verwenders entgegen den Geboten
    von Treu und Glauben unangemessen benachteiligen. Eine unangemessene Benachteiligung
    ist im Zweifel gemäß § 307 Abs. 2 BGB anzunehmen, wenn eine Bestimmung mit wesentlichen
    Grundgedanken der gesetzlichen Regelung, von der abgewichen wird, nicht zu vereinbaren
    ist (Nr. 1) oder wesentliche Rechte oder Pflichten, die sich aus der Natur des
    Vertrags ergeben, so einschränkt, dass die Erreichung des Vertragszwecks gefährdet
    ist (Nr. 2).
  norms:
  - § 307 Abs. 1 BGB
  - § 307 Abs. 2 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-agb-klauselverbote-308-309
  type: streitstand
  front: 'Abgrenze: Klauselverbote mit (§ 308 BGB) und ohne (§ 309 BGB) Wertungsmöglichkeit'
  back: § 309 BGB enthält starre Klauselverbote, bei denen dem Rechtsanwender kein
    Beurteilungsspielraum verbleibt - liegt der Tatbestand einer Nummer vor, ist die
    Klausel ohne weitere Abwägung unwirksam (z. B. § 309 Nr. 7 BGB zum Ausschluss
    der Haftung für Körper-, Gesundheits- und Lebensschäden). § 308 BGB enthält
    dagegen Klauselverbote mit Wertungsmöglichkeit, die unbestimmte Rechtsbegriffe
    wie "unangemessen lang" oder "ohne sachlichen Grund" verwenden und daher eine
    Abwägung im Einzelfall erfordern. Beide Kataloge gelten gemäß § 310 Abs. 1
    BGB nur im Verkehr mit Verbrauchern unmittelbar; im unternehmerischen Verkehr
    wirken sie über § 307 Abs. 1, 2 BGB als Indiz.
  norms:
  - § 308 BGB
  - § 309 BGB
  - § 310 Abs. 1 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-agb-rechtsfolge-306
  type: norm
  front: Was folgt aus § 306 Abs. 1 und Abs. 2 BGB, wenn eine AGB-Klausel unwirksam
    ist?
  back: Sind AGB ganz oder teilweise nicht Vertragsbestandteil geworden oder unwirksam,
    bleibt der Vertrag im Übrigen gemäß § 306 Abs. 1 BGB grundsätzlich wirksam.
    Anstelle der unwirksamen Klausel gelten nach § 306 Abs. 2 BGB die gesetzlichen
    Vorschriften. Eine geltungserhaltende Reduktion - also die Aufrechterhaltung der
    Klausel mit gerade noch zulässigem Inhalt - findet nicht statt.
  norms:
  - § 306 Abs. 1 BGB
  - § 306 Abs. 2 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
schemata:
- slug: zr-schema-agb-kontrolle
  title: Wirksamkeit einer AGB-Klausel, §§ 305 ff. BGB
  norms:
  - § 305 Abs. 1 BGB
  - § 305 Abs. 2 BGB
  - § 307 Abs. 1 BGB
  - § 306 Abs. 2 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  steps:
  - label: I. Vorliegen von AGB, § 305 Abs. 1 BGB
    children:
    - label: 1. Für eine Vielzahl von Verträgen vorformuliert
    - label: 2. Vom Verwender gestellt
  - label: II. Wirksame Einbeziehung, § 305 Abs. 2, 3 BGB
    children:
    - label: 1. Ausdrücklicher Hinweis bzw. deutlich sichtbarer Aushang
    - label: 2. Zumutbare Möglichkeit der Kenntnisnahme
    - label: 3. Einverständnis des anderen Teils
  - label: III. Vorrang der Individualabrede, § 305b BGB
    hinweis: Verdrängt eine kollidierende AGB-Klausel vollständig.
  - label: IV. Keine überraschende Klausel, § 305c Abs. 1 BGB
  - label: V. Inhaltskontrolle
    children:
    - label: 1. Klauselverbote ohne Wertungsmöglichkeit, § 309 BGB
    - label: 2. Klauselverbote mit Wertungsmöglichkeit, § 308 BGB
    - label: 3. Generalklausel, § 307 Abs. 1, 2 BGB
    hinweis: Im unternehmerischen Verkehr wirken §§ 308, 309 BGB nur über § 307 BGB,
      § 310 Abs. 1 BGB.
  - label: VI. Im Zweifel Auslegung zulasten des Verwenders, § 305c Abs. 2 BGB
  - label: 'VII. Rechtsfolge: Klausel entfällt, gesetzliches Recht tritt an ihre
      Stelle, § 306 Abs. 1, 2 BGB'
faelle:
- slug: zr-fall-moebelhaus-haftungsausschluss
  title: Die beschädigte Wohnungstür
  difficulty: 3
  minutes: 55
  quellen:
  - Eigener Sachverhalt der Redaktion
  - BGB, amtliche Fassung
  facts: 'Möbelhaus M verkauft über seinen Online-Shop Sofas an Verbraucher. Beim
    Bestellvorgang muss der Kunde eine Checkbox mit dem Hinweis "Ich akzeptiere die
    AGB von M" anklicken; über einen daneben stehenden Link können die vollständigen
    AGB jederzeit aufgerufen und heruntergeladen werden. Ohne Anklicken der Checkbox
    kann die Bestellung nicht abgeschlossen werden. Die AGB enthalten unter anderem
    folgende, drucktechnisch nicht hervorgehobene Klausel: "Schadensersatzansprüche
    des Kunden gegen M sind bei leichter Fahrlässigkeit vollständig ausgeschlossen,
    auch soweit sie auf der Verletzung wesentlicher Vertragspflichten beruhen." Kundin
    K bestellt bei M ein Sofa. Bei der Anlieferung durch einen Mitarbeiter des M wird
    die Wohnungstür der K durch leicht fahrlässiges Verhalten des Mitarbeiters beschädigt;
    die Reparatur kostet 600 Euro. M beruft sich gegenüber K auf den Haftungsausschluss
    in seinen AGB.'
  question: Kann K von M Ersatz der Reparaturkosten in Höhe von 600 Euro verlangen?
  steps:
  - prompt: Formuliere den Obersatz zur Anspruchsgrundlage.
    erwartung: K könnte gegen M einen Anspruch auf Schadensersatz aus § 280 Abs.
      1 BGB i.V.m. § 241 Abs. 2 BGB wegen Verletzung einer Schutzpflicht bei der Anlieferung
      haben.
  - prompt: Handelt es sich bei der Klausel um Allgemeine Geschäftsbedingungen, §
      305 Abs. 1 BGB?
    erwartung: Ja - die Klausel ist für eine Vielzahl von Verträgen vorformuliert
      und wird von M als Verwender allen Kunden bei Vertragsschluss gestellt.
  - prompt: Wurden die AGB gemäß § 305 Abs. 2 BGB wirksam einbezogen?
    erwartung: Ja - durch den Link erhielt K die zumutbare Möglichkeit der Kenntnisnahme,
      durch das Ankreuzen der Checkbox hat sie ihr Einverständnis erklärt; ein ausdrücklicher
      Hinweis auf die Geltung der AGB liegt im Text der Checkbox.
  - prompt: Ist die Klausel eine überraschende Klausel nach § 305c Abs. 1 BGB?
    erwartung: Nein - ein Haftungsausschluss in AGB eines Online-Shops ist keine so
      ungewöhnliche Regelung, dass ein Kunde nicht mit ihr rechnen müsste.
  - prompt: Hält die Klausel der Inhaltskontrolle nach § 307 BGB stand?
    erwartung: Nein - die Klausel schließt die Haftung für leicht fahrlässige Pflichtverletzungen
      ausdrücklich auch bei der Verletzung wesentlicher Vertragspflichten (Kardinalpflichten)
      aus. Das schränkt wesentliche Rechte, die sich aus der Natur des Vertrags ergeben,
      so ein, dass die Erreichung des Vertragszwecks gefährdet ist, § 307 Abs. 2
      Nr. 2 BGB - die Klausel benachteiligt K unangemessen und ist nach § 307 Abs.
      1 BGB unwirksam.
  - prompt: Welche Rechtsfolge hat die Unwirksamkeit der Klausel für den Kaufvertrag
      und den Anspruch der K?
    erwartung: Der Kaufvertrag bleibt gemäß § 306 Abs. 1 BGB im Übrigen wirksam;
      an die Stelle der unwirksamen Klausel tritt nach § 306 Abs. 2 BGB die gesetzliche
      Regelung, sodass M für die schuldhafte Pflichtverletzung seines Erfüllungsgehilfen
      gemäß § 280 Abs. 1 BGB i.V.m. § 278 BGB haftet.
  - prompt: Ergebnis?
    erwartung: K kann von M Ersatz der 600 Euro Reparaturkosten verlangen.
  expectation:
