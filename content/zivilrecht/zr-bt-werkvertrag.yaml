  steps:
  - label: I. Wirksamer Werkvertrag, § 631 BGB
    hinweis: Abgrenzung zu Kauf (§ 650 BGB) und Dienstvertrag (§ 611 BGB).
  - label: II. Mangel, § 633 BGB
    children:
    - label: 1. Subjektive Anforderungen, § 633 Abs. 2 S. 1 BGB
    - label: 2. Objektive Anforderungen, § 633 Abs. 2 S. 2 BGB
    - label: 3. Rechtsmangel, § 633 Abs. 3 BGB
  - label: III. Mangel bei Abnahme / Gefahrübergang
    hinweis: Abnahme, § 640 BGB; Beweislast vor und nach Abnahme. Bei Kenntnis Vorbehalt,
      § 640 Abs. 3 BGB.
  - label: IV. Kein Ausschluss der Rechte
    hinweis: Haftungsausschluss nur eingeschränkt, § 639 BGB; Kenntnis des Bestellers.
  - label: V. Rechtsfolgen, § 634 BGB
    children:
    - label: 1. Nacherfüllung, § 635 BGB
    - label: '2. Selbstvornahme, § 637 BGB: Frist, Aufwendungsersatz, Vorschuss'
    - label: 3. Rücktritt oder Minderung, §§ 636, 323, 638 BGB
    - label: 4. Schadensersatz, §§ 636, 280, 281 BGB
  - label: VI. Verjährung, § 634a BGB
    hinweis: Zwei Jahre bei Werken zur Herstellung, Wartung oder Veränderung einer Sache,
      fünf Jahre bei Bauwerken; Beginn mit Abnahme.
faelle:
- slug: zr-fall-werk-fliesen
  title: Das Bad mit falschem Gefälle
  difficulty: 3
  minutes: 50
  quellen:
  - Eigener Sachverhalt der Redaktion
  - BGB, amtliche Fassung
  facts: Unternehmer U verlegt im Bad des Bestellers B Bodenfliesen für eine vereinbarte Vergütung
    von 6.000 Euro. Bei der förmlichen Abnahme erklärt B, das Werk im Wesentlichen zu billigen;
    er behält sich aber ausdrücklich Rechte wegen eines von ihm festgestellten zu geringen
    Gefälles der bodengleichen Dusche vor, bei dem Wasser stehen bleibt. B zahlt auf die Vergütung
    zunächst 2.000 Euro. Eine Woche später setzt B dem U schriftlich eine Frist von 14 Tagen
    zur Beseitigung des Gefälles. U reagiert nicht. B beauftragt daraufhin die Fachfirma F,
    das Gefälle durch Ausbau und Neuverlegung der Fliesen im Duschbereich zu korrigieren;
    F berechnet 1.800 Euro, die B bezahlt. Die Kosten sind für die Beseitigung erforderlich
    und angemessen. U verlangt von B den Restwerklohn von 4.000 Euro.
  question: Kann U von B Zahlung von 4.000 Euro verlangen?
  steps:
  - prompt: Ist der Vergütungsanspruch entstanden und fällig?
    erwartung: Ja. Es besteht ein wirksamer Werkvertrag (§ 631 Abs. 1 BGB), das Werk wurde
      abgenommen (§ 640 Abs. 1 BGB), sodass der Restwerklohn nach § 641 Abs. 1 BGB fällig
      ist.
  - prompt: Hat B Mängelrechte, obwohl er abgenommen hat?
    erwartung: Ja. B hat die Abnahme in Kenntnis des Mangels erklärt, sich seine Rechte aber
      ausdrücklich vorbehalten (§ 640 Abs. 3 BGB). Das zu geringe Gefälle ist ein Mangel nach
      § 633 Abs. 2 BGB, da die Dusche für die gewöhnliche Verwendung nicht geeignet ist.
  - prompt: Liegen die Voraussetzungen der Selbstvornahme vor?
    erwartung: Ja. Nach § 637 Abs. 1 BGB kann B den Mangel selbst beseitigen und Ersatz der
      erforderlichen Aufwendungen verlangen, wenn er dem Unternehmer erfolglos eine angemessene
      Frist zur Nacherfüllung bestimmt hat. B hat eine Frist von 14 Tagen gesetzt, U hat nicht
      reagiert. Ein Verweigerungsrecht nach § 635 Abs. 3 BGB ist nicht ersichtlich.
  - prompt: Was folgt aus dem Aufwendungsersatzanspruch für die Forderung des U?
    erwartung: B hat gegen U einen Anspruch auf Ersatz der erforderlichen Aufwendungen von
      1.800 Euro (§§ 634 Nr. 2, 637 Abs. 1 BGB). Beide Forderungen sind gleichartig und fällig;
      B kann nach §§ 387, 389 BGB aufrechnen. Die Forderung des U erlischt in Höhe von 1.800
      Euro.
  - prompt: Ergebnis?
    erwartung: U kann von B noch 4.000 Euro - 1.800 Euro = 2.200 Euro verlangen.
