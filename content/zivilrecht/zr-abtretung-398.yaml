topic:
  slug: zr-abtretung-398
  area: zivilrecht
  title: "Abtretung, §§ 398-413 BGB"
  relevance: 4
  stand: 2026-09
  redaktion:
    erzeugt_von: claude-fable-5-1
    status: in-pruefung
    normzitate_geprueft: true
cards:
- slug: zr-abtretung-vertrag-398-norm
  type: norm
  front: "Was regelt § 398 BGB, und welche Rechtsnatur hat der Abtretungsvertrag?"
  back: "Nach § 398 S. 1 BGB kann eine Forderung vom Gläubiger durch Vertrag mit einem anderen auf diesen übertragen werden; mit Abschluss des Vertrags tritt der neue Gläubiger (Zessionar) an die Stelle des bisherigen Gläubigers (Zedent), § 398 S. 2 BGB. Der Abtretungsvertrag ist ein Verfügungsgeschäft über die Forderung: Er setzt sich aus zwei übereinstimmenden Willenserklärungen zusammen, ist grundsätzlich formfrei und abstrakt vom zugrunde liegenden Kausalgeschäft (Kauf, Sicherungsabrede, Schenkung). Die Unwirksamkeit des Kausalgeschäfts berührt die Abtretung daher nicht; der Zedent kann die Forderung dann nur nach § 812 Abs. 1 S. 1 Alt. 1 BGB zurückverlangen. Der Schuldner ist am Abtretungsvertrag nicht beteiligt und muss weder zustimmen noch benachrichtigt werden; sein Schutz wird durch die §§ 404 ff. BGB gewährleistet. Wirksamkeitsvoraussetzungen sind neben dem Vertrag das Bestehen der Forderung, die Berechtigung des Zedenten, die Bestimmtheit oder Bestimmbarkeit der Forderung und ihre Abtretbarkeit."
  norms:
  - § 398 S. 1 BGB
  - § 398 S. 2 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-abtretung-bestimmbarkeit
  type: definition
  front: "Was verlangt der Bestimmtheitsgrundsatz bei der Abtretung, insbesondere bei künftigen Forderungen und der Globalzession?"
  back: "Als Verfügung muss die Abtretung die übertragene Forderung so bezeichnen, dass sie im Zeitpunkt ihrer Entstehung eindeutig identifiziert werden kann; es genügt Bestimmbarkeit, Bestimmtheit im Abtretungszeitpunkt ist nicht erforderlich. Deshalb können auch künftige Forderungen abgetreten werden (Vorausabtretung), etwa alle Forderungen aus dem Weiterverkauf einer unter Eigentumsvorbehalt gelieferten Ware; die Verfügung wird mit Entstehung der Forderung ohne weiteres Zutun wirksam, wobei der Zessionar die Forderung nach h.M. unmittelbar erwirbt, wenn der Zedent bis dahin verfügungsbefugt geblieben ist. Bei der Globalzession, mit der ein Kreditnehmer alle bestehenden und künftigen Forderungen gegen bestimmte oder alle Kunden zur Sicherheit abtritt, ist Bestimmbarkeit gewahrt, wenn sich anhand der Abtretungsvereinbarung feststellen lässt, welche Forderungen erfasst sind (etwa alle Forderungen aus Lieferungen und Leistungen gegen Kunden mit Anfangsbuchstaben A bis K). Unbestimmt und daher unwirksam ist dagegen die Abtretung „eines Teils“ der Forderungen ohne Kriterium für die Auswahl."
  norms:
  - § 398 S. 1 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-abtretung-ausschluss-399-400
  type: definition
  front: "Wann ist eine Forderung nach §§ 399, 400 BGB nicht abtretbar?"
  back: "§ 399 Alt. 1 BGB schließt die Abtretung aus, wenn die Leistung an einen anderen als den ursprünglichen Gläubiger nicht ohne Veränderung ihres Inhalts erfolgen kann; das betrifft höchstpersönliche Ansprüche (Anspruch auf Dienstleistung gegenüber einer bestimmten Person, Unterhaltsansprüche in ihrem Kern), Ansprüche, die untrennbar mit einem Rechtsverhältnis verbunden sind (Befreiungsansprüche, solange der Gläubiger des Befreiungsanspruchs nicht an den Gläubiger der zu tilgenden Schuld abtritt), und Gestaltungsrechte ohne die zugehörige Forderung. § 399 Alt. 2 BGB erfasst das rechtsgeschäftliche Abtretungsverbot: Gläubiger und Schuldner können die Abtretbarkeit durch Vereinbarung ausschließen, was auch in Allgemeinen Geschäftsbedingungen möglich ist; die Abtretung ist dann nach h.M. absolut unwirksam, der Schuldner kann ihr aber nachträglich zustimmen. § 400 BGB verbietet die Abtretung unpfändbarer Forderungen, um das Existenzminimum des Gläubigers und die Sozialkassen zu schützen. Für beiderseitige Handelsgeschäfte enthält das Handelsgesetzbuch eine Sonderregel, nach der die Abtretung trotz vertraglichen Verbots wirksam ist und der Schuldner befreiend an den Zedenten leisten kann."
  norms:
  - § 399 Alt. 1 BGB
  - § 399 Alt. 2 BGB
  - § 400 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-abtretung-399-verbot-wirkung-streit
  type: streitstand
  front: "Wirkt ein vertragliches Abtretungsverbot nach § 399 Alt. 2 BGB absolut oder nur relativ?"
  back: "Nach herrschender Meinung und ständiger Rechtsprechung (BGH) hat das vertragliche Abtretungsverbot absolute Wirkung: Die verbotswidrige Abtretung ist gegenüber jedermann unwirksam, die Forderung verbleibt beim Zedenten, und auch Dritte, etwa Gläubiger des Zessionars, können sich nicht auf einen Forderungsübergang berufen. Begründung: Nach § 399 Alt. 2 BGB „kann“ die Forderung nicht abgetreten werden; die Parteien haben ihr durch die Vereinbarung die Verkehrsfähigkeit genommen und damit den Inhalt der Forderung selbst gestaltet (Inhaltstheorie). § 137 S. 1 BGB steht nicht entgegen, weil § 399 Alt. 2 BGB eine gesetzlich zugelassene Ausnahme ist. Die Gegenauffassung (Teile der Literatur) nimmt nur relative Unwirksamkeit an: Die Abtretung sei wirksam, der Schuldner könne sich aber gegenüber dem Zessionar auf das Verbot berufen und mit befreiender Wirkung an den Zedenten leisten. Dafür wird der Schutzzweck der Regelung angeführt, der allein dem Schuldner diene; Dritte müssten nicht geschützt werden. Praktisch bedeutsam ist der Streit bei der Frage, ob der Schuldner die Abtretung nachträglich genehmigen kann (nach h.M. ja, mit Wirkung ex nunc) und ob Sicherungsnehmer trotz Verbots eine gesicherte Position erlangen."
  norms:
  - § 399 Alt. 2 BGB
  - § 137 S. 1 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-abtretung-rechtsfolgen-401-402-403
  type: definition
  front: "Welche Rechtsfolgen hat die Abtretung nach §§ 401-403 BGB für Nebenrechte und Informationspflichten?"
  back: "Mit der Forderung gehen nach § 401 Abs. 1 BGB die akzessorischen Sicherungsrechte - Hypothek, Schiffshypothek, Pfandrecht und Bürgschaft - kraft Gesetzes auf den Zessionar über; sie können nicht getrennt von der Forderung zurückbehalten werden. Nach § 401 Abs. 2 BGB kann der neue Gläubiger auch Vorzugsrechte geltend machen, die mit der Forderung verbunden sind. Nicht akzessorische Sicherheiten (Sicherungsübereignung, Sicherungsgrundschuld, Vorbehaltseigentum) gehen nicht automatisch über; nach h.M. ist der Zedent aber aus der Sicherungsabrede oder analog § 401 BGB zu ihrer Übertragung verpflichtet. Unselbständige Hilfsrechte (Mahnung, Fristsetzung, Kündigung wegen der abgetretenen Forderung) folgen der Forderung ebenfalls. § 402 BGB verpflichtet den Zedenten, dem Zessionar die zur Geltendmachung nötige Auskunft zu erteilen und die Beweisurkunden auszuliefern; § 403 BGB gibt dem Zessionar einen Anspruch auf eine öffentlich beglaubigte Abtretungsurkunde. Diese Pflichten dienen der praktischen Durchsetzbarkeit, insbesondere gegenüber dem Schuldner, der nach § 410 BGB die Leistung bis zur Vorlage einer Abtretungsurkunde verweigern kann."
  norms:
  - § 401 Abs. 1 BGB
  - § 402 BGB
  - § 403 BGB
  - § 410 Abs. 1 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-abtretung-schuldnerschutz-404
  type: definition
  front: "Welche Einwendungen kann der Schuldner dem Zessionar nach § 404 BGB entgegenhalten?"
  back: "§ 404 BGB verwirklicht den Grundsatz, dass sich die Rechtsstellung des Schuldners durch die Abtretung nicht verschlechtern darf: Er kann dem neuen Gläubiger alle Einwendungen entgegensetzen, die zur Zeit der Abtretung gegen den bisherigen Gläubiger begründet waren. Erfasst sind rechtshindernde und rechtsvernichtende Einwendungen (Nichtigkeit des Grundgeschäfts, Erfüllung, Anfechtung, Rücktritt) ebenso wie Einreden (Verjährung, Stundung, Zurückbehaltungsrecht, Einrede des nicht erfüllten Vertrags). „Begründet“ ist eine Einwendung bereits dann, wenn ihr Rechtsgrund im Zeitpunkt der Abtretung gelegt war, auch wenn sie erst später entsteht oder ausgeübt wird; ein nach der Abtretung entstehender Mangelgewährleistungsanspruch aus einem vor der Abtretung geschlossenen Vertrag ist daher ebenso erfasst wie ein erst später erklärter Rücktritt. Nicht erfasst sind Einwendungen, deren Grundlage erst nach der Abtretung geschaffen wurde, etwa ein nachträglicher Erlassvertrag mit dem Zedenten (insoweit gilt § 407 BGB). Der gute Glaube des Zessionars an das Fehlen von Einwendungen wird nicht geschützt; eine Ausnahme enthält nur § 405 BGB für die Urkundenabtretung."
  norms:
  - § 404 BGB
  - § 405 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-abtretung-aufrechnung-406
  type: definition
  front: "Unter welchen Voraussetzungen kann der Schuldner nach § 406 BGB gegenüber dem Zessionar mit einer Forderung gegen den Zedenten aufrechnen?"
  back: "§ 406 BGB erweitert den Schuldnerschutz auf die Aufrechnung, die nach § 387 BGB eigentlich Gegenseitigkeit voraussetzt, an der es nach der Abtretung fehlt. Der Schuldner kann eine ihm gegen den Zedenten zustehende Forderung auch dem Zessionar gegenüber aufrechnen. Ausgeschlossen ist dies in zwei Fällen: Erstens, wenn der Schuldner beim Erwerb seiner Gegenforderung die Abtretung kannte; dann durfte er nicht mehr auf die Aufrechnungsmöglichkeit vertrauen. Zweitens, wenn die Gegenforderung erst nach Kenntnis von der Abtretung und später als die abgetretene Forderung fällig geworden ist; in diesem Fall hätte der Schuldner auch ohne Abtretung nicht aufrechnen können, weil er selbst zuerst hätte leisten müssen. Geschützt wird also das Vertrauen des Schuldners auf eine bereits vor Kenntnis der Abtretung angelegte Aufrechnungslage oder zumindest auf deren absehbaren Eintritt. Die Aufrechnungserklärung selbst ist nach der Abtretung gegenüber dem Zessionar als neuem Gläubiger abzugeben."
  norms:
  - § 406 BGB
  - § 387 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-abtretung-leistung-an-zedent-407
  type: definition
  front: "Was regelt § 407 BGB zur Leistung an den bisherigen Gläubiger?"
  back: "Weil der Schuldner von der Abtretung nichts wissen muss, schützt § 407 Abs. 1 BGB sein Vertrauen auf die fortbestehende Gläubigerstellung des Zedenten: Der Zessionar muss eine Leistung, die der Schuldner nach der Abtretung an den bisherigen Gläubiger bewirkt, sowie jedes Rechtsgeschäft, das zwischen Schuldner und bisherigem Gläubiger über die Forderung vorgenommen wird (Erlass, Stundung, Aufrechnungsvertrag), gegen sich gelten lassen, es sei denn, der Schuldner kannte die Abtretung bei der Leistung oder Vornahme des Rechtsgeschäfts. Nur positive Kenntnis schadet, grob fahrlässige Unkenntnis nicht; die Beweislast für die Kenntnis trägt der Zessionar. § 407 Abs. 2 BGB erstreckt den Schutz auf rechtskräftige Urteile in einem nach der Abtretung zwischen Schuldner und Zedent anhängig gewordenen Rechtsstreit. Die Vorschrift wirkt nur zugunsten des Schuldners: Er kann auf den Schutz verzichten und die Leistung an den Zedenten als nicht befreiend behandeln, etwa wenn dieser insolvent ist. Der Zessionar kann das vom Zedenten Erlangte nach § 816 Abs. 2 BGB herausverlangen. § 409 BGB ergänzt den Schutz für den Fall, dass der Gläubiger eine Abtretung anzeigt, die tatsächlich nicht oder nicht wirksam erfolgt ist."
  norms:
  - § 407 Abs. 1 BGB
  - § 407 Abs. 2 BGB
  - § 816 Abs. 2 BGB
  - § 409 Abs. 1 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-abtretung-mehrfachabtretung-408
  type: definition
  front: "Wie wird die Mehrfachabtretung derselben Forderung behandelt, und was bewirkt § 408 BGB?"
  back: "Tritt der Gläubiger dieselbe Forderung nacheinander an mehrere Personen ab, gilt das Prioritätsprinzip: Mit der ersten wirksamen Abtretung verliert der Zedent die Forderung, sodass jede weitere Abtretung als Verfügung eines Nichtberechtigten ins Leere geht. Einen gutgläubigen Erwerb von Forderungen kennt das Gesetz nicht (Ausnahme: § 405 BGB bei Vorlage einer Schuldurkunde), weshalb der Zweitzessionar auch bei Unkenntnis der Erstabtretung nichts erwirbt. Bei Vorausabtretungen künftiger Forderungen entscheidet ebenfalls der Zeitpunkt des Abtretungsvertrags, nicht der Zeitpunkt des Entstehens der Forderung. § 408 Abs. 1 BGB schützt den Schuldner, der in Unkenntnis der Erstabtretung an den Zweitzessionar leistet oder mit ihm ein Rechtsgeschäft vornimmt, indem er § 407 BGB für entsprechend anwendbar erklärt: Die Leistung an den vermeintlichen neuen Gläubiger befreit den Schuldner gegenüber dem wahren Gläubiger. Der Erstzessionar kann sich dann nach § 816 Abs. 2 BGB an den Zweitzessionar halten. Nach § 408 Abs. 2 BGB gilt dasselbe bei gerichtlicher Überweisung oder gesetzlichem Forderungsübergang."
  norms:
  - § 408 Abs. 1 BGB
  - § 408 Abs. 2 BGB
  - § 407 Abs. 1 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
