faelle:
- slug: zr-fall-abgetretener-werklohn
  title: "Der abgetretene Werklohn"
  difficulty: 3
  minutes: 45
  quellen:
  - Eigener Sachverhalt der Redaktion
  - BGB, amtliche Fassung
  facts: "Der Heizungsbauer A baut für den privaten Hausbesitzer B eine neue Heizungsanlage ein; nach Abnahme am 1.3. steht A ein Werklohn von 5.000 EUR zu. Um einen Kredit abzusichern, tritt A die Werklohnforderung am 10.3. schriftlich an die Bank C ab; B wird davon nicht informiert. Am 20.3. überweist B, der von der Abtretung nichts weiß, 2.000 EUR an A. Kurz darauf stellt sich heraus, dass A bei der Montage einen Ventilschaden verursacht hat, den B am 25.3. für 1.500 EUR durch einen anderen Betrieb beheben lässt, nachdem A die Nachbesserung endgültig verweigert hatte. Am 1.4. tritt A dieselbe Werklohnforderung, die er inzwischen als frei verfügbar ansieht, erneut an seinen Lieferanten D ab, der die Erstabtretung nicht kennt. Am 5.4. zeigt C dem B die Abtretung an und verlangt Zahlung von 5.000 EUR. B meint, er habe bereits 2.000 EUR bezahlt und könne mit seinem Kostenerstattungsanspruch von 1.500 EUR aufrechnen. D verlangt seinerseits von B Zahlung."
  question: "In welcher Höhe kann C von B Zahlung verlangen, und hat D einen Anspruch gegen B?"
  steps:
  - prompt: "Ist C durch die Abtretung vom 10.3. Gläubigerin der Werklohnforderung geworden?"
    erwartung: "Ja. A und C haben einen Abtretungsvertrag nach § 398 S. 1 BGB geschlossen; die Forderung bestand (Werklohn nach Abnahme fällig), A war Inhaber, die Forderung ist bestimmt und abtretbar (kein Fall des § 399 BGB oder § 400 BGB). Mit dem Vertrag ist C nach § 398 S. 2 BGB an die Stelle des A getreten. Eine Anzeige an B war nicht erforderlich."
  - prompt: "Wirkt die Zahlung der 2.000 EUR an A gegenüber C?"
    erwartung: "Ja. B hat nach der Abtretung an den bisherigen Gläubiger geleistet, ohne die Abtretung zu kennen. Nach § 407 Abs. 1 BGB muss C diese Leistung gegen sich gelten lassen; die Forderung ist in Höhe von 2.000 EUR erloschen. C kann sich wegen der 2.000 EUR nach § 816 Abs. 2 BGB an A halten."
  - prompt: "Kann B gegenüber C mit dem Kostenerstattungsanspruch von 1.500 EUR aufrechnen?"
    erwartung: "Ja. Der Anspruch auf Ersatz der Selbstvornahmekosten aus § 637 Abs. 1 BGB richtet sich gegen A, nicht gegen C, sodass es an der Gegenseitigkeit nach § 387 BGB fehlt. § 406 BGB erlaubt die Aufrechnung dennoch, weil B die Abtretung beim Erwerb der Gegenforderung nicht kannte und die Gegenforderung nicht erst nach Kenntnis von der Abtretung fällig geworden ist; die Aufrechnung ist gegenüber C zu erklären. Zusätzlich war der Mangel schon im Zeitpunkt der Abtretung angelegt, sodass B sich auch auf § 404 BGB berufen könnte. Die Forderung reduziert sich auf 1.500 EUR."
  - prompt: "Hat D durch die Abtretung vom 1.4. etwas erworben?"
    erwartung: "Nein. Im Zeitpunkt der Zweitabtretung war A nicht mehr Inhaber der Forderung; nach dem Prioritätsprinzip geht die zweite Abtretung ins Leere, ein gutgläubiger Forderungserwerb ist außerhalb des § 405 BGB nicht möglich. D hat keinen Anspruch gegen B. Hätte B in Unkenntnis der Erstabtretung an D geleistet, wäre er nach § 408 Abs. 1 BGB iVm § 407 Abs. 1 BGB befreit worden; dazu ist es nicht gekommen."
  expectation:
