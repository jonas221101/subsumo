- slug: zr-schema-gpr-grundschuld
  title: >-
    Anspruch des Gläubigers auf Duldung der Zwangsvollstreckung aus einer Sicherungsgrundschuld
  norms:
  - § 1147 BGB
  - § 1191 BGB
  - § 1192 Abs. 1 BGB
  - § 1192 Abs. 1a BGB
  - § 1193 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  steps:
  - label: I. Bestehen der Grundschuld
    children:
    - label: 1. Einigung und Eintragung, § 873 BGB
    - label: >-
        2. Berechtigung des Bestellers (Eigentümer oder gutgläubiger Erwerb, § 892
        BGB)
  - label: II. Gläubigerstellung
    children:
    - label: 1. Erstgläubiger oder Erwerber aus Abtretung, §§ 1154, 398 BGB
    - label: 2. Eintragung oder Brief bei der Übertragung
  - label: III. Fälligkeit
    hinweis: >-
      Kündigung, § 1193 BGB (Frist sechs Monate); Zahlungsverzug nicht Voraussetzung
      der Fälligkeit, aber Vollstreckung aus Titel.
  - label: IV. Kein Anspruchsausschluss durch Einreden
    children:
    - label: 1. Einreden aus dem Sicherungsvertrag
    - label: 2. Wirkung gegen den Erwerber, § 1192 Abs. 1a BGB
    - label: 3. Rückgewähranspruch nach Tilgung
  - label: V. Rechtsfolge
    hinweis: Duldung der Zwangsvollstreckung in das Grundstück, § 1147 BGB.
faelle:
- slug: zr-fall-gpr-sparkasse-bank
  title: Die abgetretene Grundschuld
  difficulty: 4
  minutes: 50
  quellen:
  - Eigener Sachverhalt der Redaktion
  - BGB, amtliche Fassung
  facts: >-
    Eigentümer E bestellt der Sparkasse S zur Sicherung eines Darlehens über 200.000
    Euro eine Buchgrundschuld über 200.000 Euro, die ordnungsgemäß im Grundbuch eingetragen
    wird; im Sicherungsvertrag ist vereinbart, dass die Grundschuld nur dazu dient,
    dieses Darlehen zu sichern. E tilgt das Darlehen im Mai 2025 vollständig. Im Juli
    2025 tritt S die Grundschuld ohne Rücksicht auf den Sicherungsvertrag an die Bank
    B ab, die den Sicherungsvertrag nicht kennt; die Abtretung wird im Grundbuch eingetragen.
    B verlangt von E nun Duldung der Zwangsvollstreckung in das Grundstück und hat
    die Grundschuld gekündigt, die Kündigungsfrist ist abgelaufen.
  question: >-
    Kann B von E nach § 1147 BGB die Duldung der Zwangsvollstreckung verlangen?
  steps:
  - prompt: Besteht die Grundschuld, und ist B Inhaberin?
    erwartung: >-
      Ja. Die Grundschuld wurde wirksam bestellt (§§ 873, 1191 BGB). S hat sie nach
      §§ 1154, 398 BGB mit Eintragung (§ 873 BGB) wirksam an B abgetreten. Der Wegfall
      der Forderung ändert nichts, weil die Grundschuld nicht akzessorisch ist.
  - prompt: Ist die Grundschuld fällig?
    erwartung: >-
      Ja, nach Kündigung und Ablauf der Frist von sechs Monaten (§ 1193 Abs. 1 BGB).
  - prompt: Welche Einrede hat E, und gegen wen wirkt sie?
    erwartung: >-
      E hat gegen S eine Einrede aus dem Sicherungsvertrag, weil das Darlehen getilgt
      und der Sicherungszweck entfallen ist (Rückgewähranspruch). Diese Einrede kann
      nach § 1192 Abs. 1a S. 1 BGB auch dem Erwerber B entgegengesetzt werden.
  - prompt: Hilft B ihr guter Glaube?
    erwartung: >-
      Nein. Für die Sicherungsgrundschuld gilt § 1157 S. 2 BGB insoweit nicht (§ 1192
      Abs. 1a S. 1 BGB). B muss sich die Einrede aus dem Sicherungsvertrag entgegenhalten
      lassen, obwohl sie ihn nicht kannte.
  - prompt: Wie lautet das Ergebnis?
    erwartung: >-
      B kann die Duldung der Zwangsvollstreckung nicht durchsetzen, weil E die Einrede
      aus dem Sicherungsvertrag zusteht. B kann sich an S halten; E kann Rückgewähr
      der Grundschuld verlangen.
  expectation:
    pruefpunkte:
    - id: p1
      label: >-
        Wirksame Grundschuld und Gläubigerstellung der B durch Abtretung (§§ 1154,
        398 BGB), keine Akzessorietät
      weight: 2.0
      required: true
      norms:
      - § 1154 BGB
      - § 398 BGB
      - § 1191 BGB
      keywords:
      - Grundschuld
      - nicht akzessorisch
      - § 1154
      - Abtretung
      - Eintragung
      card_slugs:
      - zr-gpr-grundschuld-1191
      - zr-gpr-uebertragung
    - id: p2
      label: Fälligkeit durch Kündigung nach § 1193 BGB
      weight: 1.0
      required: false
      norms:
      - § 1193 BGB
      keywords:
      - § 1193
      - Kündigung
      - sechs Monate
      - Fälligkeit
      card_slugs:
      - zr-gpr-verwertung-1147
    - id: p3
      label: Einrede aus dem Sicherungsvertrag (Tilgung, Rückgewähranspruch)
      weight: 2.5
      required: true
      norms:
      - § 1192 Abs. 1a BGB
      keywords:
      - Sicherungsvertrag
      - Sicherungsabrede
      - Einrede aus dem Sicherungsvertrag
      - Rückgewähranspruch
      - Sicherungszweck entfallen
      card_slugs:
      - zr-gpr-sicherungsvertrag-zweckerklaerung
    - id: p4
      label: >-
        Einrede wirkt gegen den Erwerber trotz guten Glaubens, § 1192 Abs. 1a BGB
      weight: 3.0
      required: true
      norms:
      - § 1192 Abs. 1a BGB
      - § 1157 BGB
      keywords:
      - § 1192 Abs. 1a
      - § 1157 S. 2
      - guter Glaube hilft nicht
      - einredefreier Erwerb
      - Erwerber muss Einrede gegen sich gelten lassen
      card_slugs:
      - zr-gpr-einreden-1192-abs1a
      - zr-gpr-einreden-1137-1157
