faelle:
- slug: zr-fall-schulpferd-und-hund
  title: "Das Schulpferd und der Hund"
  difficulty: 4
  minutes: 60
  quellen:
  - Eigener Sachverhalt der Redaktion
  - BGB, amtliche Fassung
  facts: "B betreibt einen Reitstall mit Reitschule. Zu seinen Angestellten gehört der Pferdepfleger C, den B vor zwei Jahren ohne jede Nachfrage nach Ausbildung oder Erfahrung eingestellt und seither weder angeleitet noch bei der Arbeit kontrolliert hat. Das Schulpferd P wird im Reitunterricht eingesetzt und finanziert sich durch die Unterrichtseinnahmen. Eines Nachmittags führt C das Pferd über den Hof, obwohl er weiß, dass dort gerade ein Lieferwagen rangiert; entgegen der üblichen Praxis hält er den Führstrick nur locker in einer Hand. A, die den Reitstall besucht, hat ihren unangeleinten Hund mitgebracht, obwohl am Eingang ein Schild auf die Leinenpflicht hinweist. Der Hund läuft bellend auf das Pferd zu. P scheut vor dem Hund und dem Motorenlärm, reißt sich los und tritt A gegen das Knie. A erleidet einen Bänderriss und hat Heilbehandlungskosten von 2.500 EUR sowie Schmerzen über mehrere Wochen."
  question: "Welche Ansprüche hat A gegen B? Ansprüche gegen C sind nicht zu prüfen."
  steps:
  - prompt: "Prüfe einen Anspruch der A gegen B aus § 831 Abs. 1 S. 1 BGB."
    erwartung: "C ist als angestellter, weisungsgebundener Pferdepfleger Verrichtungsgehilfe des B. Durch das unsorgfältige Führen des Pferdes hat C den objektiven Tatbestand des § 823 Abs. 1 BGB (Körperverletzung der A) rechtswidrig verwirklicht; auf sein Verschulden kommt es nach h.M. nicht an, es liegt aber ohnehin vor. Das Führen des Pferdes gehörte zu seinen Aufgaben, sodass er in Ausführung der Verrichtung handelte. Eine Exkulpation nach § 831 Abs. 1 S. 2 BGB scheidet aus, weil B den C weder sorgfältig ausgewählt noch angeleitet oder überwacht hat. B haftet."
  - prompt: "Haftet B auch als Tierhalter nach § 833 BGB?"
    erwartung: "B ist Tierhalter des P (Bestimmungsmacht, eigenes Interesse, Kostentragung). Die Verletzung beruht auf der spezifischen Tiergefahr, weil das Scheuen und Losreißen unberechenbares tierisches Verhalten ist. P ist als Schulpferd, das dem Erwerb des B dient, ein Nutztier im Sinne des § 833 S. 2 BGB, sodass keine Gefährdungshaftung nach § 833 S. 1 BGB eingreift. B kann sich aber nicht entlasten, weil zur Sorgfalt bei der Beaufsichtigung des Tieres auch die Auswahl und Anleitung der mit dem Tier betrauten Personen gehört und B insoweit versagt hat. B haftet auch aus § 833 S. 2 BGB."
  - prompt: "Muss sich A ein Mitverschulden anrechnen lassen?"
    erwartung: "A hat gegen die ausgeschilderte Leinenpflicht verstoßen; ihr unangeleinter Hund hat das Scheuen mitverursacht. Das ist ein Verschulden gegen sich selbst nach § 254 Abs. 1 BGB. Zusätzlich hat sich die Tiergefahr ihres eigenen Hundes verwirklicht, die ihr analog § 254 BGB als Halterin zuzurechnen ist. Im Rahmen der Abwägung ist eine deutliche Kürzung angemessen, etwa um ein Drittel; die Hauptverantwortung liegt wegen des unsorgfältigen Führens auf dem Hof trotz Lieferverkehrs bei B."
  - prompt: "Welche Schadensposten kann A ersetzt verlangen?"
    erwartung: "Die Heilbehandlungskosten von 2.500 EUR als Vermögensschaden nach § 249 Abs. 2 S. 1 BGB und wegen der Körperverletzung Schmerzensgeld nach § 253 Abs. 2 BGB, jeweils gekürzt um die Mitverschuldensquote."
