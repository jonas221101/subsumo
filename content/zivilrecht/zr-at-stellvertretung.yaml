cards:
- slug: zr-at-stellvertretung-wirkung
  type: definition
  front: 'Definiere: Stellvertretung (§ 164 Abs. 1 BGB) und ihre Rechtsfolge'
  back: Stellvertretung ist das Handeln im fremden Namen mit Vertretungsmacht. Gibt
    der Vertreter innerhalb der ihm zustehenden Vertretungsmacht im Namen des Vertretenen
    eine eigene Willenserklärung ab, wirkt diese unmittelbar für und gegen den Vertretenen
    (§ 164 Abs. 1 S. 1 BGB) - der Vertreter selbst wird nicht Vertragspartei.
  norms:
  - § 164 Abs. 1 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-at-offenkundigkeitsprinzip
  type: definition
  front: 'Definiere: Offenkundigkeitsprinzip bei der Stellvertretung'
  back: 'Der Vertreter muss erkennbar im fremden Namen handeln, damit § 164 Abs. 1
    BGB eingreift (Offenkundigkeitsprinzip). Maßgeblich ist die Auslegung nach §§
    133, 157 BGB aus Sicht des Erklärungsempfängers; ausdrückliches Nennen des
    Vertretenen ist nicht erforderlich, wenn sich das Handeln in fremdem Namen aus
    den Umständen ergibt (§ 164 Abs. 1 S. 2 BGB). Ausnahmen vom Offenkundigkeitsprinzip:
    das unternehmensbezogene Geschäft und das Geschäft für den, den es angeht (bei
    Bargeschäften des täglichen Lebens).'
  norms:
  - § 164 Abs. 1 BGB
  - § 133 BGB
  - § 157 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-at-vertretungsmacht
  type: definition
  front: 'Definiere: Vertretungsmacht - und ihre zwei Entstehungsgründe'
  back: Vertretungsmacht ist die Rechtsmacht, im Namen eines anderen mit Wirkung für
    und gegen diesen zu handeln. Sie entsteht entweder kraft Gesetzes (gesetzliche
    Vertretungsmacht, z. B. der Eltern nach § 1629 BGB oder des Vereinsvorstands nach
    § 26 Abs. 1 BGB) oder durch Rechtsgeschäft - dann heißt sie Vollmacht (§ 166
    Abs. 2 S. 1 BGB).
  norms:
  - § 164 Abs. 1 BGB
  - § 166 Abs. 2 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-at-vollmacht-innen-aussen
  type: definition
  front: 'Definiere: Vollmacht und die Abgrenzung Innen-/Außenvollmacht (§ 167 BGB)'
  back: Die Vollmacht ist die durch Rechtsgeschäft erteilte Vertretungsmacht (§ 166
    Abs. 2 S. 1 BGB) - eine einseitige, empfangsbedürftige Willenserklärung. Sie
    kann gegenüber dem zu Bevollmächtigenden selbst erteilt werden (Innenvollmacht,
    § 167 Abs. 1 Var. 1 BGB) oder gegenüber dem Dritten, dem gegenüber vertreten
    werden soll (Außenvollmacht, § 167 Abs. 1 Var. 2 BGB). Die Unterscheidung wirkt
    sich insbesondere auf den Vertrauensschutz Dritter aus (§§ 170-173 BGB).
  norms:
  - § 167 Abs. 1 BGB
  - §§ 170-173 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-at-duldungs-anscheinsvollmacht
  type: streitstand
  front: 'Abgrenze: Duldungsvollmacht und Anscheinsvollmacht (Rechtsscheinvollmacht)'
  back: 'Beide sind keine im Gesetz ausdrücklich geregelten Vollmachtsarten,

    sondern von der Rechtsprechung entwickelte Rechtsscheintatbestände,

    die eintreten, wenn der Vertretene keine Vollmacht erteilt hat, aber

    einen Zurechnungsgrund gesetzt hat und der Geschäftsgegner gutgläubig

    auf eine Bevollmächtigung vertraut hat.


    Duldungsvollmacht: Der Vertretene weiß positiv, dass ein anderer

    wiederholt in seinem Namen auftritt, und duldet dies, ohne

    einzuschreiten. Der Geschäftsgegner darf dieses Dulden nach Treu und

    Glauben als Bevollmächtigung verstehen.


    Anscheinsvollmacht: Der Vertretene kennt das Handeln des Scheinvertreters

    nicht positiv, hätte es aber bei Anwendung der im Verkehr erforderlichen

    Sorgfalt erkennen und verhindern können. Wegen des fehlenden positiven

    Wissens ist die Anscheinsvollmacht umstrittener als die Duldungsvollmacht;

    sie wird von der ständigen Rechtsprechung aber anerkannt, weil der

    Vertretene das Risiko des von ihm (fahrlässig) nicht unterbundenen

    Rechtsscheins näher zu tragen hat als der gutgläubige Dritte.


    Gemeinsame Voraussetzung beider Rechtsscheinvollmachten: ein von einer

    gewissen Dauer und Häufigkeit geprägtes Verhalten des vermeintlichen

    Vertreters, das dem Vertretenen zurechenbar ist, sowie Gutgläubigkeit

    und Vertrauen des Geschäftsgegners im Zeitpunkt des Geschäfts.

    '
  norms:
  - § 164 Abs. 1 BGB
  - § 242 BGB
  quellen:
  - Eigenformulierung Redaktion (ständige Rechtsprechung des BGH zu Rechtsscheinvollmachten)
  stand: 2026-09
- slug: zr-at-vollmachtloser-vertreter
  type: norm
  front: Was regelt § 177 BGB und was folgt daraus für den Vertrag?
  back: '§ 177 Abs. 1 BGB regelt den Vertragsschluss durch einen Vertreter ohne Vertretungsmacht:
    Der Vertrag ist zunächst schwebend unwirksam und hängt von der Genehmigung des
    Vertretenen ab. Verweigert der Vertretene die Genehmigung oder erfolgt sie nicht,
    ist der Vertrag endgültig unwirksam; der vollmachtlose Vertreter haftet dann
    grundsätzlich nach § 179 BGB auf Erfüllung oder Schadensersatz.'
  norms:
  - § 177 Abs. 1 BGB
  - § 179 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-at-in-sich-geschaeft
  type: definition
  front: 'Definiere: In-sich-Geschäft und das Verbot des § 181 BGB'
  back: 'Ein In-sich-Geschäft liegt vor, wenn der Vertreter im Namen des Vertretenen
    mit sich selbst im eigenen Namen (Selbstkontrahieren) oder als Vertreter eines
    Dritten (Mehrvertretung) ein Rechtsgeschäft vornimmt. § 181 BGB verbietet dies
    grundsätzlich wegen der Gefahr eines Interessenkonflikts. Ausnahmen: das Geschäft
    dient ausschließlich der Erfüllung einer Verbindlichkeit, oder der Vertretene
    hat das In-sich-Geschäft gestattet.'
  norms:
  - § 181 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
schemata:
- slug: zr-schema-stellvertretung
  title: Wirksame Stellvertretung, § 164 Abs. 1 BGB
  norms:
  - § 164 Abs. 1 BGB
  - §§ 166-181 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  steps:
  - label: I. Zulässigkeit der Stellvertretung
    hinweis: 'Grundsätzlich zulässig; Ausnahme: höchstpersönliche Geschäfte (z.
      B. Testamentserrichtung, § 2064 BGB).'
  - label: II. Eigene Willenserklärung des Vertreters
    hinweis: Abgrenzung zum Boten, der nur eine fremde Willenserklärung übermittelt.
  - label: III. Im fremden Namen (Offenkundigkeitsprinzip, § 164 Abs. 1 BGB)
    children:
    - label: 1. Ausdrückliches oder konkludentes Handeln in fremdem Namen
    - label: '2. Ausnahmen: unternehmensbezogenes Geschäft, Geschäft für den, den
        es angeht'
  - label: IV. Mit Vertretungsmacht
    children:
    - label: 1. Gesetzliche Vertretungsmacht
    - label: 2. Rechtsgeschäftliche Vertretungsmacht (Vollmacht, §§ 166 ff. BGB)
      children:
      - label: a) Innenvollmacht, § 167 Abs. 1 Var. 1 BGB
      - label: b) Außenvollmacht, § 167 Abs. 1 Var. 2 BGB
    - label: 3. Rechtsscheinvollmacht (Duldungs- oder Anscheinsvollmacht)
      hinweis: Nur prüfen, wenn keine ausdrückliche Vollmacht vorliegt und der Sachverhalt
        dazu Anlass gibt.
  - label: V. Kein Ausschluss der Vertretungsmacht im Einzelfall
    children:
    - label: 1. Kein Verstoß gegen § 181 BGB (In-sich-Geschäft)
    - label: 2. Kein Missbrauch der Vertretungsmacht (Kollusion bzw. Evidenz plus
        Treuwidrigkeit)
  - label: 'VI. Rechtsfolge: Wirkung für und gegen den Vertretenen, § 164 Abs. 1
      S. 1 BGB'
faelle:
- slug: zr-fall-anscheinsvollmacht
  title: Die Anscheinsvollmacht des Angestellten
  difficulty: 3
  minutes: 60
  quellen:
  - Eigener Sachverhalt der Redaktion
  - BGB, amtliche Fassung
  facts: 'Unternehmer U betreibt einen Großhandel für Büromaterial. Sein Angestellter
    M hat in der Vergangenheit wiederholt - stets ohne ausdrückliche Bevollmächtigung,
    aber mit Wissen des U - im Namen des U Bestellungen beim Lieferanten L aufgegeben;
    U hat die gelieferte Ware jedes Mal widerspruchslos bezahlt. Als M erneut im Namen
    des U bei L Ware im Wert von 3.000 Euro bestellt, befindet sich U - anders als
    bei den fruaheren Bestellungen - im Urlaub und weiß von dieser Bestellung nichts.
    Für L stellt sich die Bestellung nicht anders dar als die früheren; er liefert
    die Ware. Nach seiner Rückkehr weigert sich U, die Rechnung zu begleichen: Er
    habe M nie bevollmächtigt.'
  question: Hat L gegen U einen Anspruch auf Zahlung des Kaufpreises aus § 433 Abs.
    2 BGB?
  steps:
  - prompt: Formuliere den Obersatz.
    erwartung: L könnte gegen U einen Anspruch auf Zahlung des Kaufpreises aus §
      433 Abs. 2 BGB haben.
  - prompt: Ist zwischen L und U unmittelbar ein Kaufvertrag zustande gekommen?
    erwartung: Nicht durch eine eigene Erklärung des U - fraglich ist eine wirksame
      Stellvertretung durch M, § 164 Abs. 1 BGB.
  - prompt: Hatte M eine ausdrücklich erteilte Vollmacht?
    erwartung: Nein, weder eine Innen- noch eine Außenvollmacht wurde M ausdrücklich
      erteilt.
  - prompt: Kommt eine Duldungsvollmacht in Betracht?
    erwartung: Für die konkrete Bestellung nein, da U von dieser Bestellung nichts
      wusste - positive Kenntnis und Dulden fehlen gerade.
  - prompt: Kommt eine Anscheinsvollmacht in Betracht?
    erwartung: 'Ja: U hat durch das wiederholte, unwidersprochene Handeln des M einen
      Rechtsschein gesetzt, den er bei pflichtgemäßer Sorgfalt (z. B. durch Vorkehrungen
      für seine Abwesenheit) hätte erkennen und verhindern können; L durfte die
      Bestellung nach den bisherigen Umständen gutgläubig als bevollmächtigt ansehen.'
  expectation:
    pruefpunkte:
    - id: p1
      label: Obersatz mit § 433 Abs. 2 BGB
      weight: 1.5
      required: false
      norms:
      - § 433 Abs. 2 BGB
      keywords:
      - '433'
    - id: p2
      label: Handeln im fremden Namen erkannt, § 164 Abs. 1 BGB
      weight: 1.5
      required: false
      norms:
      - § 164 Abs. 1 BGB
      keywords:
      - fremden Namen
      - '164'
      card_slugs:
      - zr-at-offenkundigkeitsprinzip
    - id: p3
      label: Fehlen einer ausdrücklichen Innen- oder Außenvollmacht festgestellt
      weight: 1.5
      required: false
      keywords:
      - keine Vollmacht
      - nicht bevollmächtigt
      - ausdrücklich
      card_slugs:
      - zr-at-vollmacht-innen-aussen
    - id: p4
      label: Duldungsvollmacht mangels positiver Kenntnis für die konkrete Bestellung
        verneint
      weight: 2.0
      required: false
      keywords:
      - Duldungsvollmacht
      - positive Kenntnis
      card_slugs:
      - zr-at-duldungs-anscheinsvollmacht
    - id: p5
      label: Anscheinsvollmacht sauber definiert und subsumiert (Erkennbarkeit/Verhinderbarkeit
