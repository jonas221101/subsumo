cards:
- slug: zr-at-auslegung-ziel-133-157
  type: definition
  front: 'Definiere: Ziel der Auslegung nach §§ 133, 157 BGB'
  back: 'Die Auslegung von Willenserklärungen und Verträgen dient der Ermittlung
    ihres rechtlich maßgeblichen Inhalts. Nach § 133 BGB ist der wirkliche Wille
    zu erforschen, ohne am buchstäblichen Sinn des Ausdrucks zu haften; nach § 157
    BGB sind Verträge so auszulegen, wie Treu und Glauben mit Rücksicht auf die
    Verkehrssitte es erfordern. Beide Vorschriften werden gemeinsam angewandt: § 133
    BGB betont den Willen, § 157 BGB liefert den objektivierten Maßstab, wenn ein
    übereinstimmender Wille nicht feststellbar ist.'
  norms:
  - § 133 BGB
  - § 157 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-at-auslegung-empfangsbeduerftig
  type: definition
  front: 'Definiere: empfangsbedürftige Willenserklärung'
  back: Eine empfangsbedürftige Willenserklärung wird erst wirksam, wenn sie dem
    Erklärungsempfänger zugegangen ist, § 130 Abs. 1 BGB. Bis zum Zugang kann sie
    widerrufen werden, wenn der Widerruf vorher oder gleichzeitig zugeht. Beispiele
    sind Angebot, Annahme, Kündigung, Anfechtungserklärung und Mahnung.
  norms:
  - § 130 Abs. 1 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-at-auslegung-nicht-empfangsbeduerftig
  type: definition
  front: 'Definiere: nicht empfangsbedürftige Willenserklärung'
  back: 'Eine nicht empfangsbedürftige Willenserklärung wird bereits mit ihrer Abgabe
    wirksam, ohne dass es des Zugangs bei einem bestimmten Empfänger bedarf. Klassisches
    Beispiel ist die Auslobung: Wer durch öffentliche Bekanntmachung eine Belohnung
    für die Vornahme einer Handlung aussetzt, ist zur Zahlung an denjenigen verpflichtet,
    der die Handlung vorgenommen hat, auch ohne Rücksicht auf die Auslobung, § 657
    BGB.'
  norms:
  - § 657 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-at-auslegung-natuerliche-auslegung
  type: definition
  front: 'Definiere: natürliche (subjektive) Auslegung'
  back: Steht fest, dass Erklärender und Erklärungsempfänger eine Erklärung übereinstimmend
    im selben Sinn verstanden haben, gilt dieser übereinstimmend gewollte Sinn -
    unabhängig davon, ob er vom objektiven (äußeren) Erklärungswert abweicht.
    Der Empfängerschutz, der die normative Auslegung rechtfertigt, ist hier entbehrlich,
    weil kein Missverständnis vorliegt.
  norms:
  - § 133 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-at-auslegung-falsa-demonstratio
  type: definition
  front: Was besagt der Grundsatz 'falsa demonstratio non nocet'?
  back: 'Eine falsche Bezeichnung schadet nicht: Haben die Parteien übereinstimmend
    etwas anderes gewollt als das, was sie wörtlich erklärt haben, gilt das übereinstimmend
    Gewollte, nicht der objektive Wortlaut. Der Grundsatz ist Ausdruck der natürlichen
    Auslegung nach § 133 BGB und geht der normativen Auslegung vor, weil der wirkliche
    Wille Vorrang vor dem bloßen Erklärungswert hat.'
  norms:
  - § 133 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-at-auslegung-empfaengerhorizont
  type: definition
  front: 'Definiere: objektiver Empfängerhorizont'
  back: 'Der objektive Empfängerhorizont ist der Maßstab der normativen Auslegung:
    Maßgeblich ist, wie ein verständiger Erklärungsempfänger die Erklärung nach
    Treu und Glauben unter Berücksichtigung aller ihm erkennbaren Umstände und der
    Verkehrssitte verstehen durfte - nicht, wie der Erklärende sie tatsächlich gemeint
    hat oder wie der Empfänger sie subjektiv verstanden hat.'
  norms:
  - § 133 BGB
  - § 157 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-at-auslegung-normative-auslegung
  type: definition
  front: 'Definiere: normative (objektivierte) Auslegung'
  back: 'Kann ein übereinstimmender wirklicher Wille beider Seiten nicht festgestellt
    werden, ist die Erklärung nach dem objektiven Empfängerhorizont auszulegen:
    Maßgeblich ist, wie ein verständiger Empfänger sie nach Treu und Glauben und
    der Verkehrssitte verstehen durfte, §§ 133, 157 BGB. Diese Auslegung dient dem
    Vertrauensschutz des Erklärungsempfängers.'
  norms:
  - § 133 BGB
  - § 157 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-at-auslegung-vorrang-vor-anfechtung
  type: streitstand
  front: 'Abgrenze: In welchem Verhältnis stehen Auslegung und Anfechtung zueinander?'
  back: 'Die Auslegung geht der Anfechtung denknotwendig vor: Erst durch Auslegung
    wird ermittelt, welchen Inhalt eine Erklärung tatsächlich hat. Ergibt die Auslegung,
    dass Erklärender und Empfänger übereinstimmend dasselbe gemeint haben (natürliche
    Auslegung), bleibt für eine Anfechtung wegen Irrtums kein Raum, weil gar kein
    Auseinanderfallen von Wille und Erklärung vorliegt. Erst wenn die Auslegung -
    ggf. normativ nach dem Empfängerhorizont - einen Erklärungsinhalt ergibt, der
    vom wirklichen Willen des Erklärenden abweicht, kommt eine Anfechtung nach §
    119 Abs. 1 BGB in Betracht. Ein häufiger Klausurfehler ist es, direkt anzufechten,
    ohne zuvor auszulegen.'
  norms:
  - § 133 BGB
  - § 119 Abs. 1 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
schemata:
- slug: zr-schema-auslegung
  title: Auslegung einer Willenserklärung, §§ 133, 157 BGB
  norms:
  - § 133 BGB
  - § 157 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  steps:
  - label: I. Auslegungsbedürftigkeit
    hinweis: Nur bei mehrdeutigem oder auslegungsfähigem Erklärungsinhalt; eindeutige
      Erklärungen bedeuten nicht automatisch, dass sie nicht auszulegen sind (vgl.
      falsa demonstratio).
  - label: II. Natürliche Auslegung, § 133 BGB
    children:
    - label: 1. Übereinstimmender wirklicher Wille beider Seiten feststellbar?
    - label: '2. Falls ja: dieser Wille ist maßgeblich (falsa demonstratio non nocet)'
  - label: III. Normative Auslegung, §§ 133, 157 BGB
    children:
    - label: 1. Kein übereinstimmender wirklicher Wille feststellbar
    - label: '2. Objektiver Empfängerhorizont: Verständnis eines redlichen Erklärungsempfängers'
    - label: 3. Berücksichtigung von Treu und Glauben und Verkehrssitte, § 157 BGB
  - label: 'IV. Ergebnis: maßgeblicher Erklärungsinhalt'
  - label: V. Abgrenzung zur Anfechtung
    hinweis: Erst nach Feststellung des Erklärungsinhalts durch Auslegung ist zu
      prüfen, ob dieser vom wirklichen Willen abweicht und eine Anfechtung nach §
      119 BGB in Betracht kommt.
faelle:
- slug: zr-fall-verwechseltes-fahrradmodell
  title: Das verwechselte Fahrradmodell
  difficulty: 3
  minutes: 40
  quellen:
  - Eigener Sachverhalt der Redaktion
  - BGB, amtliche Fassung
  facts: 'Verkäufer V bietet Käuferin K in einer E-Mail sein gebrauchtes Rennrad
    des Herstellers "Radex" zum Preis von 450 Euro an. V besitzt zwei Rennräder dieses
    Herstellers - ein Modell "Sprint 200" und ein baugleich aussehendes, aber höherwertiges
    Modell "Sprint 300". Beim Verfassen der E-Mail verschreibt sich V und schreibt
    versehentlich "Sprint 300", meint aber weiterhin das "Sprint 200"-Modell anzubieten.
    K antwortet: "Ich nehme das Sprint 300 für 450 Euro." In einem späteren Telefonat
    stellen beide fest, dass ihnen ein Irrtum bei der Modellbezeichnung unterlaufen
    ist, sie sich über das gemeinte Rad (das "Sprint 200") aber tatsächlich einig
    waren. V weigert sich nun, das "Sprint 200" zu übergeben, und beruft sich darauf,
    dass im Schriftwechsel "Sprint 300" stehe.'
  question: Welches Fahrrad schuldet V der K zu übereignen und zu übergeben?
  steps:
  - prompt: Formuliere den Obersatz.
    erwartung: K könnte gegen V einen Anspruch auf Übergabe und Übereignung eines
      Fahrrads aus § 433 Abs. 1 S. 1 BGB haben.
  - prompt: Was ist Voraussetzung für einen wirksamen Kaufvertrag über ein bestimmtes
      Fahrrad?
    erwartung: Eine wirksame Einigung über Angebot und Annahme mit übereinstimmendem
      Inhalt hinsichtlich des Kaufgegenstands, §§ 145 ff. BGB.
  - prompt: Ist der Vertrag über das im Wortlaut genannte Modell 'Sprint 300' zustande
      gekommen?
    erwartung: Nein - maßgeblich ist nicht der objektive Wortlaut der Erklärungen,
      sondern der übereinstimmend gewollte Sinn. Beide Parteien meinten tatsächlich
      das Modell "Sprint 200".
  - prompt: Welcher Auslegungsgrundsatz ist hier einschlägig?
    erwartung: 'Der Grundsatz falsa demonstratio non nocet (§ 133 BGB): Eine falsche
      Bezeichnung schadet nicht, wenn beide Seiten übereinstimmend dasselbe gemeint
      haben.'
  - prompt: Ist für eine Anfechtung nach § 119 BGB noch Raum?
    erwartung: Nein - eine Anfechtung setzt ein Auseinanderfallen von Wille und Erklärung
      voraus. Da der Vertrag durch Auslegung bereits mit dem Inhalt "Sprint 200" zustande
      gekommen ist, wollten beide Parteien genau das, was gilt; ein Anfechtungsgrund
      fehlt.
  - prompt: Zu welchem Ergebnis kommst du?
    erwartung: Der Kaufvertrag ist über das Modell "Sprint 200" zustande gekommen;
      K kann von V Übergabe und Übereignung dieses Fahrrads verlangen.
  expectation:
    pruefpunkte:
    - id: p1
      label: Obersatz mit § 433 Abs. 1 S. 1 BGB formuliert
      weight: 1.0
      required: false
      norms:
      - § 433 Abs. 1 S. 1 BGB
      keywords:
      - '433'
    - id: p2
      label: Erkennt, dass der objektive Wortlaut ('Sprint 300') nicht automatisch
        maßgeblich ist
      weight: 2.0
      required: true
      norms:
      - § 133 BGB
      keywords:
      - Wortlaut
      - wirklicher Wille
      card_slugs:
      - zr-at-auslegung-ziel-133-157
    - id: p3
      label: Wendet falsa demonstratio non nocet korrekt an und begründet mit übereinstimmendem
        Willen
      weight: 3.0
      required: true
      norms:
      - § 133 BGB
      keywords:
      - falsa demonstratio
      - übereinstimmend
      card_slugs:
      - zr-at-auslegung-falsa-demonstratio
      - zr-at-auslegung-natuerliche-auslegung
    - id: p4
      label: Verneint eine Anfechtung mangels Auseinanderfallen von Wille und Erklärung
      weight: 2.0
      required: false
      norms:
      - § 119 Abs. 1 BGB
      keywords:
      - Anfechtung
      - kein Irrtum
      card_slugs:
      - zr-at-auslegung-vorrang-vor-anfechtung
    - id: p5
      label: 'Ergebnis: Kaufvertrag über das Modell Sprint 200'
      weight: 1.0
