cards:
- slug: zr-at-anfechtung-grundgedanke
  type: definition
  front: 'Definiere: Anfechtung und ihre Rechtsfolge, § 142 Abs. 1 BGB'
  back: Die Anfechtung ist ein einseitiges Gestaltungsrecht, mit dem eine wegen eines
    Willensmangels fehlerhafte, aber zunächst wirksame Willenserklärung nachträglich
    vernichtet werden kann. Wird ein anfechtbares Rechtsgeschäft wirksam angefochten,
    ist es gemäß § 142 Abs. 1 BGB als von Anfang an (ex tunc) nichtig anzusehen.
  norms:
  - § 142 Abs. 1 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-at-anfechtung-inhaltsirrtum
  type: definition
  front: 'Definiere: Inhaltsirrtum, § 119 Abs. 1 Var. 1 BGB'
  back: Ein Inhaltsirrtum liegt vor, wenn der Erklärende zwar genau das erklärt,
    was er erklären wollte, sich aber über die Bedeutung oder Tragweite seiner Erklärung
    irrt - Wille und Erklärung stimmen äußerlich überein, der Erklärende irrt
    jedoch über den rechtlichen oder tatsächlichen Gehalt des von ihm Erklärten.
  norms:
  - § 119 Abs. 1 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-at-anfechtung-eigenschaftsirrtum
  type: definition
  front: 'Definiere: Eigenschaftsirrtum, § 119 Abs. 2 BGB'
  back: Der Eigenschaftsirrtum ist ein gesetzlich als Inhaltsirrtum eingestufter Motivirrtum
    über verkehrswesentliche Eigenschaften einer Person oder Sache. Verkehrswesentlich
    sind Eigenschaften, die im Rechtsverkehr allgemein als wertbildend angesehen werden
    und dem Gegenstand oder der Person unmittelbar und nicht nur vorübergehend anhaften
    - bloße Werterwartungen oder Marktpreise zählen nicht dazu.
  norms:
  - § 119 Abs. 2 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-at-anfechtung-motivirrtum-abgrenzung
  type: streitstand
  front: 'Abgrenze: Warum ist der (sonstige) Motivirrtum grundsätzlich unbeachtlich?'
  back: Ein Motivirrtum betrifft die Beweggründe, aus denen jemand eine Willenserklärung
    abgibt, nicht aber deren Inhalt oder die Erklärungshandlung selbst. Da § 119
    BGB abschließend regelt, welche Irrtümer zur Anfechtung berechtigen, ist der
    sonstige Motivirrtum grundsätzlich unbeachtlich - sonst wäre die Bestandskraft
    von Willenserklärungen im Rechtsverkehr kaum noch verlässlich. Der Eigenschaftsirrtum
    (§ 119 Abs. 2 BGB) ist die einzige vom Gesetzgeber ausdrücklich als beachtlich
    erklärte Ausnahme; im Übrigen kommt allenfalls eine Anpassung wegen Störung
    der Geschäftsgrundlage (§ 313 BGB) in Betracht, wenn die Vorstellung über einen
    Umstand zur Grundlage des Vertrags geworden ist.
  norms:
  - § 119 Abs. 2 BGB
  - § 313 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-at-anfechtung-erklaerung-143
  type: norm
  front: Was regelt § 143 Abs. 1 und Abs. 2 BGB zur Anfechtungserklärung?
  back: Die Anfechtung erfolgt durch empfangsbedürftige Erklärung gegenüber dem
    Anfechtungsgegner (§ 143 Abs. 1 BGB). Bei einem Vertrag ist Anfechtungsgegner
    gemäß § 143 Abs. 2 BGB der andere Vertragsteil - eine Erklärung gegenüber
    Dritten genügt nicht. Eine bestimmte Form ist nicht vorgeschrieben; erforderlich
    ist nur, dass der Wille, sich vom Geschäft zu lösen, hinreichend deutlich zum
    Ausdruck kommt.
  norms:
  - § 143 Abs. 1 BGB
  - § 143 Abs. 2 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-at-anfechtung-frist-121
  type: norm
  front: Welche Anfechtungsfrist gilt für die Anfechtung nach §§ 119, 120 BGB?
  back: Die Anfechtung wegen Irrtums (§ 119 BGB) oder falscher Übermittlung (§ 120
    BGB) muss gemäß § 121 Abs. 1 BGB ohne schuldhaftes Zögern (unverzüglich) erfolgen,
    nachdem der Anfechtungsberechtigte vom Anfechtungsgrund Kenntnis erlangt hat.
    Unverzüglich bedeutet nicht sofort, sondern innerhalb einer den Umständen nach
    angemessenen Überlegungsfrist. Diese Frist ist strenger als die Jahresfrist des
    § 124 BGB für die Anfechtung wegen arglistiger Täuschung oder widerrechtlicher
    Drohung.
  norms:
  - § 121 Abs. 1 BGB
  - § 124 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-at-anfechtung-schadensersatz-122
  type: norm
  front: Welchen Anspruch gewährt § 122 Abs. 1 BGB dem Anfechtungsgegner und wo liegt
    seine Grenze?
  back: Ficht der Erklärende wirksam nach §§ 119, 120 BGB an, muss er gemäß § 122
    Abs. 1 BGB dem Anfechtungsgegner den Vertrauensschaden (negatives Interesse) ersetzen,
    den dieser dadurch erleidet, dass er auf die Gültigkeit der Erklärung vertraut
    hat - begrenzt der Höhe nach auf das Erfüllungsinteresse (positives Interesse).
    Der Anspruch entfällt nach § 122 Abs. 2 BGB, wenn der Geschädigte den Anfechtungsgrund
    kannte oder infolge Fahrlässigkeit nicht kannte.
  norms:
  - § 122 Abs. 1 BGB
  - § 122 Abs. 2 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
schemata:
- slug: zr-schema-anfechtung
  title: Wirksame Anfechtung wegen Irrtums, §§ 119, 121, 142 BGB
  norms:
  - § 119 Abs. 1 BGB
  - § 119 Abs. 2 BGB
  - § 121 Abs. 1 BGB
  - § 142 Abs. 1 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  steps:
  - label: I. Anfechtungserklärung, § 143 Abs. 1, 2 BGB
    hinweis: Empfangsbedürftig gegenüber dem Anfechtungsgegner; bei Verträgen der
      andere Vertragsteil.
  - label: II. Anfechtungsgrund
    children:
    - label: 1. Inhaltsirrtum, § 119 Abs. 1 Var. 1 BGB
    - label: 2. Erklärungsirrtum, § 119 Abs. 1 Var. 2 BGB
    - label: 3. Eigenschaftsirrtum, § 119 Abs. 2 BGB
    - label: 4. Sonstiger Motivirrtum unbeachtlich
  - label: III. Kausalität zwischen Irrtum und Erklärung
    hinweis: Bei Kenntnis der Sachlage und verständiger Würdigung hätte der Erklärende
      die Erklärung nicht mit diesem Inhalt abgegeben.
  - label: IV. Anfechtungsfrist
    children:
    - label: 1. § 121 Abs. 1 BGB - unverzüglich bei §§ 119, 120 BGB
    - label: 2. § 124 BGB - Jahresfrist bei § 123 BGB (nicht bei Irrtumsanfechtung
        einschlägig)
  - label: 'V. Rechtsfolge: Nichtigkeit von Anfang an, § 142 Abs. 1 BGB'
  - label: VI. Schadensersatzanspruch des Anfechtungsgegners, § 122 BGB
    children:
    - label: 1. Vertrauensschaden, begrenzt auf das Erfüllungsinteresse, § 122 Abs.
        1 BGB
    - label: 2. Kein Ausschluss nach § 122 Abs. 2 BGB
faelle:
- slug: zr-fall-zahlendreher-kaufangebot
  title: Der vertippte Kaufpreis
  difficulty: 3
  minutes: 50
  quellen:
  - Eigener Sachverhalt der Redaktion
  - BGB, amtliche Fassung
  facts: Verkäuferin V bietet Käufer K per E-Mail einen gebrauchten Kombi zum Kauf
    an. K möchte in seiner Antwort-E-Mail ein Gegenangebot über 7.500 Euro abgeben,
    vertippt sich aber beim Eintippen der Zahl und schreibt versehentlich "7.050 Euro".
    V liest die E-Mail und nimmt das Angebot über 7.050 Euro sofort per E-Mail an.
    Drei Tage später bemerkt K beim Abgleich seines Kontostands den Tippfehler und
    erklärt gegenüber V noch am selben Tag per E-Mail, er "fechte sein Angebot wegen
    des Zahlendrehers an". V verlangt weiterhin Erfüllung zum Preis von 7.050 Euro;
    hilfsweise, falls die Anfechtung wirksam sein sollte, verlangt sie von K Ersatz
    des Schadens, der ihr dadurch entstanden ist, dass sie im Vertrauen auf den Vertrag
    einem anderen Interessenten, der 7.800 Euro geboten hatte, bereits abgesagt hatte.
  question: Ist der Kaufvertrag zwischen K und V wirksam angefochten worden, und kann
    V von K Ersatz des ihr durch die Absage an den anderen Interessenten entstandenen
    Schadens verlangen?
  steps:
  - prompt: Formuliere den Obersatz zur Wirksamkeit der Anfechtung.
    erwartung: Der zwischen K und V zustande gekommene Kaufvertrag könnte durch Anfechtung
      des K gemäß § 142 Abs. 1 BGB rückwirkend als von Anfang an nichtig anzusehen
      sein.
  - prompt: Welche Willenserklärung des K kommt als Anfechtungsgegenstand in Betracht?
    erwartung: Das Gegenangebot des K über "7.050 Euro", das durch die Annahme der
      V zum Kaufvertrag geführt hat.
  - prompt: Liegt ein Inhaltsirrtum oder ein Erklärungsirrtum vor?
    erwartung: Ein Erklärungsirrtum nach § 119 Abs. 1 Var. 2 BGB - K wollte "7.500
      Euro" erklären, hat sich aber beim Eintippen vertan, sodass die abgegebene
      Erklärung von seinem tatsächlichen Willen abweicht; kein bloßer Irrtum über
      die Bedeutung des von ihm bewusst Erklärten.
  - prompt: Ist die Kausalität zwischen Irrtum und Erklärung gegeben?
    erwartung: Ja - bei Kenntnis der Sachlage und verständiger Würdigung hätte
      K die Erklärung mit dem Inhalt "7.050 Euro" nicht abgegeben.
  - prompt: Wurde die Anfechtung form- und fristgerecht erklärt?
    erwartung: Die Erklärung gegenüber V als Anfechtungsgegnerin genügt § 143 Abs.
      1, 2 BGB. Die Anfechtung noch am Tag der Entdeckung ist unverzüglich im Sinne
      des § 121 Abs. 1 BGB.
  - prompt: Welche Rechtsfolge hat die wirksame Anfechtung für den Kaufvertrag?
    erwartung: Der Kaufvertrag ist gemäß § 142 Abs. 1 BGB von Anfang an nichtig.
  - prompt: Kann V von K Ersatz ihres Schadens aus der Absage an den anderen Interessenten
      verlangen?
    erwartung: Ja, dem Grunde nach aus § 122 Abs. 1 BGB als Vertrauensschaden; der
      Ersatz ist aber der Höhe nach auf das Erfüllungsinteresse begrenzt, ein Ausschluss
      nach § 122 Abs. 2 BGB scheidet aus, da V den Irrtum weder kannte noch kennen
      musste.
  expectation:
    pruefpunkte:
    - id: p1
      label: Obersatz mit § 142 Abs. 1 BGB als Rechtsfolge der Anfechtung
      weight: 1.0
      required: false
      norms:
      - § 142 Abs. 1 BGB
      keywords:
      - '142'
      - von Anfang an nichtig
      card_slugs:
      - zr-at-anfechtung-grundgedanke
    - id: p2
      label: Erklärungsirrtum nach § 119 Abs. 1 Var. 2 BGB sauber definiert und subsumiert
      weight: 3.0
