cards:
- slug: zr-at-verjaehrung-regelfrist-195
  type: definition
  front: Wie lang ist die regelmäßige Verjährungsfrist nach § 195 BGB?
  back: Die regelmäßige Verjährungsfrist beträgt drei Jahre (§ 195 BGB). Sie gilt
    für alle Ansprüche, für die das Gesetz keine abweichende Sonderfrist vorsieht
    (z.B. § 196 BGB für Ansprüche in Bezug auf Grundstücke, § 197 BGB für bestimmte
    Ansprüche mit dreißigjähriger Frist).
  norms:
  - § 195 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-at-verjaehrung-fristbeginn-199-1
  type: definition
  front: Wann beginnt die regelmäßige Verjährungsfrist nach § 199 Abs. 1 BGB?
  back: Die regelmäßige Frist beginnt mit dem Schluss des Jahres, in dem der Anspruch
    entstanden ist und der Gläubiger von den anspruchsbegründenden Umständen und der
    Person des Schuldners Kenntnis erlangt hat oder ohne grobe Fahrlässigkeit hätte
    erlangen müssen (§ 199 Abs. 1 Nr. 1, Nr. 2 BGB). Beide Voraussetzungen - Anspruchsentstehung
    und Kenntnis bzw. grob fahrlässige Unkenntnis - müssen kumulativ vorliegen.
  norms:
  - § 199 Abs. 1 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-at-verjaehrung-kenntnis-grobe-fahrlaessigkeit
  type: definition
  front: Was unterscheidet Kenntnis von grob fahrlässiger Unkenntnis im Sinne des
    § 199 Abs. 1 Nr. 2 BGB?
  back: Kenntnis liegt vor, wenn der Gläubiger die anspruchsbegründenden Tatsachen
    und die Person des Schuldners tatsächlich positiv kennt. Grob fahrlässige Unkenntnis
    liegt vor, wenn sich dem Gläubiger diese Umstände förmlich aufdrängen und er ganz
    naheliegende Überlegungen nicht anstellt oder sich vor einer sich aufdrängenden
    Erkenntnis verschließt, obwohl sich ihm die für den Anspruch erheblichen Tatsachen
    ohne weiteres erschließen würden.
  norms:
  - § 199 Abs. 1 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-at-verjaehrung-hoechstfristen-199-2-4
  type: definition
  front: Welche kenntnisunabhängigen Höchstfristen sieht § 199 BGB vor?
  back: Unabhängig von Kenntnis oder grob fahrlässiger Unkenntnis verjähren Schadensersatzansprüche
    wegen Verletzung des Lebens, des Körpers, der Gesundheit oder der Freiheit in
    dreißig Jahren ab der Begehung der Handlung (§ 199 Abs. 2 BGB). Sonstige Schadensersatzansprüche
    verjähren spätestens in zehn Jahren ab Entstehung oder dreißig Jahren ab der Handlung,
    je nachdem, welche Frist früher endet (§ 199 Abs. 3 BGB). Andere Ansprüche als
    Schadensersatzansprüche verjähren spätestens in zehn Jahren ab Entstehung (§ 199
    Abs. 4 BGB).
  norms:
  - § 199 Abs. 2 BGB
  - § 199 Abs. 3 BGB
  - § 199 Abs. 4 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-at-verjaehrung-hemmung-verhandlungen-203
  type: definition
  front: Wie wirkt sich die Aufnahme von Verhandlungen auf die Verjährung aus, § 203
    BGB?
  back: 'Schweben zwischen Gläubiger und Schuldner Verhandlungen über den Anspruch
    oder die den Anspruch begründenden Umstände, ist die Verjährung gehemmt, bis der
    eine oder andere Teil die Fortsetzung der Verhandlungen verweigert (§ 203 S. 1
    BGB). Die Verjährung tritt frühestens drei Monate nach dem Ende der Hemmung ein
    (§ 203 S. 2 BGB). ''Verhandlungen'' sind weit zu verstehen: es genügt jeder Meinungsaustausch
    über den Anspruch oder seine Grundlagen, sofern nicht sofort und eindeutig jeder
    Anspruch abgelehnt wird.'
  norms:
  - § 203 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-at-verjaehrung-hemmung-rechtsverfolgung-204
  type: definition
  front: Welche Hemmungstatbestände nennt § 204 BGB beispielhaft?
  back: '§ 204 Abs. 1 BGB zählt zahlreiche Rechtsverfolgungshandlungen auf, die die
    Verjährung hemmen, etwa die Erhebung der Klage auf Leistung (§ 204 Abs. 1 Nr.
    1 BGB) oder die Zustellung eines Mahnbescheids im Mahnverfahren (§ 204 Abs. 1
    Nr. 3 BGB). Gemeinsamer Gedanke ist, dass der Gläubiger seinen Anspruch aktiv
    und erkennbar gegenüber dem Schuldner oder einer Stelle geltend macht, die über
    ihn entscheiden kann. Die Hemmung endet sechs Monate nach der rechtskräftigen
    Entscheidung oder anderweitigen Beendigung des eingeleiteten Verfahrens (§ 204
    Abs. 2 BGB). Vereinbarungen über die Verjährung sind nur begrenzt zulässig (§
    202 BGB: keine Erleichterung bei Vorsatz, höchstens 30 Jahre Verlängerung).'
  norms:
  - § 204 BGB
  - § 204 Abs. 2 BGB
  - § 202 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-at-verjaehrung-wirkung-hemmung-209
  type: definition
  front: Wie wirkt sich eine Hemmung rechnerisch auf die Verjährungsfrist aus, § 209
    BGB?
  back: Der Zeitraum, während dessen die Verjährung gehemmt ist, wird in die Verjährungsfrist
    nicht eingerechnet (§ 209 BGB). Die Frist läuft nach Wegfall des Hemmungsgrundes
    an der Stelle weiter, an der sie zu laufen aufgehört hatte - sie beginnt also
    nicht neu, sondern wird lediglich um die Dauer der Hemmung verlängert.
  norms:
  - § 209 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-at-verjaehrung-neubeginn-212
  type: definition
  front: Wann beginnt die Verjährung nach § 212 BGB neu?
  back: Die Verjährung beginnt erneut, wenn der Schuldner dem Gläubiger gegenüber
    den Anspruch durch Abschlagszahlung, Zinszahlung, Sicherheitsleistung oder in
    anderer Weise anerkennt (§ 212 Abs. 1 Nr. 1 BGB) oder wenn eine gerichtliche oder
    behördliche Vollstreckungshandlung vorgenommen oder beantragt wird (§ 212 Abs.
    1 Nr. 2 BGB). Anders als die Hemmung setzt der Neubeginn die volle Verjährungsfrist
    wieder von vorne in Gang, statt den bisherigen Fristlauf nur zu verlängern.
  norms:
  - § 212 Abs. 1 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-at-verjaehrung-einredewirkung-214
  type: definition
  front: Welche Rechtsfolge hat der Eintritt der Verjährung nach § 214 BGB?
  back: Die Verjährung führt nicht zum Erlöschen des Anspruchs, sondern gibt dem Schuldner
    lediglich das Recht, die Leistung zu verweigern (§ 214 Abs. 1 BGB) - eine sogenannte
    Einrede. Der Anspruch besteht fort, ist aber (als sogenannte Naturalobligation)
    nur solange erzwingbar, wie der Schuldner die Einrede nicht erhebt; das Gericht
    prüft die Verjährung nicht von Amts wegen. Das zur Befriedigung eines verjährten
    Anspruchs Geleistete kann auch dann nicht zurückgefordert werden, wenn in Unkenntnis
    der Verjährung geleistet wurde (§ 214 Abs. 2 BGB). Sicherheiten (Bürgschaft, Pfandrecht)
    bleiben trotz Verjährung der gesicherten Forderung verwertbar (§ 216 BGB).
  norms:
  - § 214 Abs. 1 BGB
  - § 214 Abs. 2 BGB
  - § 216 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
schemata:
- slug: zr-schema-verjaehrungseinrede
  title: Prüfung der Verjährungseinrede
  norms:
  - § 195 BGB
  - § 199 Abs. 1 BGB
  - § 214 Abs. 1 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  steps:
  - label: I. Anspruch entstanden und Verjährungsfrist bestimmt
    children:
    - label: 1. Regelmäßige Frist, § 195 BGB (drei Jahre), oder Sonderfrist
    - label: 2. Kenntnisunabhängige Höchstfristen, § 199 Abs. 2-4 BGB, beachten
  - label: II. Fristbeginn, § 199 Abs. 1 BGB
    children:
    - label: 1. Anspruchsentstehung
    - label: 2. Kenntnis oder grob fahrlässige Unkenntnis von Gläubiger, § 199 Abs.
        1 Nr. 2 BGB
  - label: III. Fristberechnung unter Berücksichtigung von Hemmung und Neubeginn
    children:
    - label: 1. Hemmungstatbestände, §§ 203, 204 BGB - Zeitraum nicht eingerechnet,
        § 209 BGB
    - label: 2. Neubeginn, § 212 BGB - Frist läuft komplett neu
  - label: IV. Ablauf der (ggf. verlängerten) Frist vor Geltendmachung
  - label: V. Erhebung der Einrede durch den Schuldner, § 214 Abs. 1 BGB
    hinweis: Ohne Erhebung bleibt der Anspruch trotz Verjährung durchsetzbar.
faelle:
- slug: zr-fall-die-vergessene-werklohnrechnung
  title: Die vergessene Werklohnrechnung
  difficulty: 3
  minutes: 35
  quellen:
  - Eigener Sachverhalt der Redaktion
  - BGB, amtliche Fassung
  facts: Handwerker H erbringt für Kunde K am 15.11.2020 eine Reparaturleistung an
    dessen Heizungsanlage. Der Werklohn in Höhe von 800 EUR wird sofort nach Abnahme
    fällig; H kennt Grund und Höhe seiner Forderung von Anfang an. H vergisst jedoch,
    eine Rechnung zu stellen. Im Juni 2021 sprechen H und K darüber, ob die Reparatur
    mängelfrei war; K hat Zweifel an der Qualität, äußert sich aber nicht verbindlich
    zur Zahlung und bittet nicht um Zahlungserleichterungen. Die Gespräche enden im
    August 2021 ergebnislos, weil K weitere Gespräche ablehnt. Erst im Januar 2025
    fordert H von K die Zahlung der 800 EUR. K beruft sich gegenüber H ausdrücklich
    auf Verjährung.
  question: Kann H von K noch Zahlung der 800 EUR verlangen?
  steps:
  - prompt: Welche Verjährungsfrist gilt für den Werklohnanspruch des H?
    erwartung: Die regelmäßige Frist von drei Jahren nach § 195 BGB, da keine Sonderfrist
      einschlägig ist.
  - prompt: Wann beginnt diese Frist zu laufen?
    erwartung: Mit dem Schluss des Jahres 2020 (§ 199 Abs. 1 BGB), da der Anspruch
      2020 entstanden ist und H als Gläubiger von Anfang an Kenntnis von den anspruchsbegründenden
      Umständen hatte.
  - prompt: Welche Wirkung haben die Verhandlungen von Juni bis August 2021 auf den
      Fristlauf?
    erwartung: Die Gespräche über die Frage, ob die Leistung mängelfrei war, sind
      Verhandlungen über den Anspruch im Sinne des § 203 BGB (weit zu verstehen) und
      hemmen die Verjährung von Juni bis August 2021; der Hemmungszeitraum wird nach
      § 209 BGB nicht in die Frist eingerechnet, sodass sich das Fristende entsprechend
      nach hinten verschiebt. Ein Anerkenntnis des K (Neubeginn nach § 212 Abs. 1
      Nr. 1 BGB) liegt nicht vor, da K sich nicht verbindlich zur Zahlung äußert.
  - prompt: Ist der Anspruch im Januar 2025 verjährt?
    erwartung: 'Ja: Selbst unter Berücksichtigung der rund zweimonatigen Hemmung im
      Jahr 2021 endet die auf den 31.12.2023 laufende Dreijahresfrist spätestens im
      Frühjahr 2024 und ist im Januar 2025 längst abgelaufen. Selbst wenn man in einem
      Gespräch über Zahlungserleichterungen ein Anerkenntnis mit Neubeginn der Frist
      (§ 212 Abs. 1 Nr. 1 BGB) sähe, wäre die neu laufende Dreijahresfrist spätestens
      im August 2024 abgelaufen.'
  - prompt: Kann K die Zahlung verweigern?
    erwartung: Ja, da K sich ausdrücklich auf die Verjährung beruft und damit die
      Einrede erhebt (§ 214 Abs. 1 BGB); der Anspruch erlischt nicht, ist aber nicht
      mehr durchsetzbar (Leistungsverweigerungsrecht). Leistet K dennoch in Unkenntnis
      der Verjährung, kann er das Geleistete nicht zurückfordern (§ 214 Abs. 2 BGB).
  expectation:
    pruefpunkte:
