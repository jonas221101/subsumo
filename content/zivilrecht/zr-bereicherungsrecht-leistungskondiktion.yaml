      keywords:
      - zweckgerichtet
      - Leistung
    - id: p3
      label: Rechtsgrundlosigkeit erkannt, da Werklohnanspruch bereits durch erste
        Zahlung gemaess § 362 Abs. 1 BGB erloschen war
      weight: 2.0
