      label: Obersatz mit § 812 Abs. 1 S. 1 Alt. 1 BGB
      weight: 1.0
      required: false
      norms:
      - § 812 Abs. 1 S. 1 Alt. 1 BGB
      keywords:
      - '812'
      - Leistungskondiktion
    - id: p2
      label: Leistung des U als bewusste, zweckgerichtete Vermoegensmehrung erkannt
      weight: 1.0
