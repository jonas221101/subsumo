cards:
- slug: zr-kondiktion-begriff-812
  type: definition
  front: 'Definiere: Leistungskondiktion, § 812 Abs. 1 S. 1 Alt. 1 BGB'
  back: Wer durch die Leistung eines anderen etwas ohne rechtlichen Grund erlangt,
    ist diesem gemäß § 812 Abs. 1 S. 1 Alt. 1 BGB zur Herausgabe verpflichtet. Die
    Leistungskondiktion greift damit ein, wenn eine bewusste und zweckgerichtete Vermögenszuwendung
    ihren rechtlichen Grund - meist ein Kausalgeschäft - von Anfang an nicht hatte.
  norms:
  - § 812 Abs. 1 S. 1 Alt. 1 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-kondiktion-leistungsbegriff
  type: definition
  front: 'Definiere: Leistung im bereicherungsrechtlichen Sinn'
  back: Leistung ist jede bewusste und zweckgerichtete Mehrung fremden Vermögens.
    Maßgeblich ist der erkennbare Zweck, den der Leistende mit seiner Zuwendung verfolgt
    - typischerweise die Erfüllung einer (vermeintlichen) Verbindlichkeit. In Mehrpersonenverhältnissen
    bestimmt der Leistungsbegriff, zwischen welchen Beteiligten rückabgewickelt werden
    muss, statt schematisch dem tatsächlichen Vermögensfluss zu folgen.
  norms:
  - § 812 Abs. 1 S. 1 Alt. 1 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-kondiktion-rechtsgrundlosigkeit
  type: streitstand
  front: 'Abgrenze: Rechtsgrundlosigkeit nach § 812 Abs. 1 S. 1 Alt. 1 BGB und Wegfall
    des Rechtsgrundes nach § 812 Abs. 1 S. 2 Alt. 1 BGB'
  back: Bei § 812 Abs. 1 S. 1 Alt. 1 BGB (condictio indebiti) fehlte der rechtliche
    Grund für die Leistung von Anfang an - etwa weil das zugrunde liegende Kausalgeschäft
    nichtig war oder gar nicht existierte. Bei § 812 Abs. 1 S. 2 Alt. 1 BGB (condictio
    ob causam finitam) bestand der Rechtsgrund zunächst, ist aber nachträglich weggefallen,
    etwa durch eine auflösende Bedingung oder einen Rücktritt außerhalb der §§
    346 ff. BGB. Beide Varianten teilen dieselbe Rechtsfolge (§ 818 BGB), unterscheiden
    sich aber im Zeitpunkt, auf den für die Rechtsgrundprüfung abzustellen ist.
  norms:
  - § 812 Abs. 1 S. 1 BGB
  - § 812 Abs. 1 S. 2 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-kondiktion-ausschluss-814
  type: norm
  front: Wann ist die Rückforderung nach § 814 BGB ausgeschlossen?
  back: Das zur Erfüllung einer Verbindlichkeit Geleistete kann gemäß § 814 BGB
    nicht zurückgefordert werden, wenn der Leistende positiv wusste, dass er zur
    Leistung nicht verpflichtet war. Bloße Zweifel oder fahrlässige Unkenntnis genügen
    nicht - ausgeschlossen ist nur die bewusste Zuwendung trotz Kenntnis der Nichtschuld.
  norms:
  - § 814 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-kondiktion-umfang-818-1-2
  type: norm
  front: Was muss der Bereicherungsschuldner nach § 818 Abs. 1 und Abs. 2 BGB herausgeben?
  back: Der Bereicherungsschuldner muss gemäß § 818 Abs. 1 BGB das Erlangte selbst
    sowie gezogene Nutzungen und alles, was er aufgrund eines erlangten Rechts oder
    als Ersatz für dessen Zerstörung, Beschädigung oder Entziehung erwirbt, herausgeben.
    Ist die Herausgabe wegen der Beschaffenheit des Erlangten - etwa bei verbrauchtem
    Geld - nicht möglich, hat er gemäß § 818 Abs. 2 BGB Wertersatz zu leisten.
  norms:
  - § 818 Abs. 1 BGB
  - § 818 Abs. 2 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-kondiktion-entreicherung-818-3
  type: definition
  front: 'Definiere: Entreicherung, § 818 Abs. 3 BGB'
  back: Die Verpflichtung zur Herausgabe oder zum Ersatz des Wertes ist gemäß §
    818 Abs. 3 BGB ausgeschlossen, soweit der Bereicherungsschuldner nicht mehr bereichert
    ist - etwa weil er das Erlangte für eine Ausgabe verbraucht hat, die er ohne
    den Erhalt nicht getätigt hätte (sogenannte Luxusausgabe/Vermögensdisposition).
    Kein Wegfall der Bereicherung liegt dagegen vor, soweit durch das Erlangte ohnehin
    fällige Ausgaben erspart wurden.
  norms:
  - § 818 Abs. 3 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-kondiktion-verschaerfte-haftung-819
  type: norm
  front: Wann kann sich der Bereicherungsschuldner nicht mehr auf Entreicherung nach
    § 818 Abs. 3 BGB berufen?
  back: Kannte der Empfänger den Mangel des rechtlichen Grundes beim Erwerb oder
    erfährt er ihn später, haftet er ab diesem Zeitpunkt gemäß § 819 Abs. 1 BGB
    verschärft nach den allgemeinen Vorschriften (§§ 292, 987 ff. BGB entsprechend)
    - die Berufung auf § 818 Abs. 3 BGB ist ihm dann verwehrt. Er muss das Erlangte
    daher auch insoweit ersetzen, als er nach Kenntniserlangung darüber verfügt
    hat.
  norms:
  - § 819 Abs. 1 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
schemata:
- slug: zr-schema-leistungskondiktion
  title: Anspruch aus Leistungskondiktion, § 812 Abs. 1 S. 1 Alt. 1 BGB
  norms:
  - § 812 Abs. 1 S. 1 Alt. 1 BGB
  - § 814 BGB
  - § 818 Abs. 1 BGB
  - § 818 Abs. 3 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  steps:
  - label: I. Etwas erlangt
    hinweis: Jeder Vermögensvorteil, z. B. Eigentum, Besitz, Geld, Befreiung von
      einer Verbindlichkeit.
  - label: II. Durch Leistung eines anderen
    children:
    - label: 1. Bewusste, zweckgerichtete Mehrung fremden Vermögens
    - label: '2. In Mehrpersonenverhältnissen: maßgebliches Leistungsverhältnis
        bestimmen'
  - label: III. Ohne rechtlichen Grund
    children:
    - label: 1. Rechtsgrund von Anfang an nicht bestanden, § 812 Abs. 1 S. 1 Alt.
        1 BGB
    - label: 2. Abgrenzung zum nachträglichen Wegfall, § 812 Abs. 1 S. 2 Alt. 1 BGB
  - label: IV. Kein Ausschluss der Kondiktion
    children:
    - label: 1. § 814 BGB - keine Kenntnis der Nichtschuld bei Leistung
    - label: 2. § 817 S. 2 BGB - kein beiderseitiger Gesetzes- oder Sittenverstoß
  - label: 'V. Rechtsfolge: Herausgabe des Erlangten, hilfsweise Wertersatz, § 818
      Abs. 1, 2 BGB'
  - label: VI. Umfang ggf. beschränkt durch Entreicherung, § 818 Abs. 3 BGB
    hinweis: Ausgeschlossen bei verschärfter Haftung wegen Kenntnis des Mangels,
      § 819 Abs. 1 BGB.
faelle:
- slug: zr-fall-doppelt-bezahlte-werklohnrechnung
  title: Die doppelt angewiesene Werklohnrechnung
  difficulty: 3
  minutes: 55
  quellen:
  - Eigener Sachverhalt der Redaktion
  - BGB, amtliche Fassung
  facts: Unternehmer U beauftragt Handwerker H mit Reparaturarbeiten für 1.200 Euro.
    H führt die Arbeiten aus und stellt eine Rechnung über 1.200 Euro, die die Buchhaltung
    des U ordnungsgemäß anweist. Wegen eines internen Buchhaltungsfehlers wird dieselbe
    Rechnung zwei Wochen später ein zweites Mal angewiesen, sodass H insgesamt 2.400
    Euro erhält, obwohl nur 1.200 Euro geschuldet waren. H bemerkt die Doppelzahlung
    sofort beim nächsten Kontoabgleich, unternimmt aber nichts. Kurz darauf gibt
    er 800 Euro der überzahlten Summe für eine Urlaubsreise aus, die er sich ohne
    die zweite Zahlung nicht geleistet hätte; die restlichen 400 Euro befinden sich
    noch auf seinem Konto. U verlangt von H Rückzahlung von 1.200 Euro.
  question: Kann U von H Zahlung von 1.200 Euro verlangen?
  steps:
  - prompt: Formuliere den Obersatz.
    erwartung: U könnte gegen H einen Anspruch auf Rückzahlung von 1.200 Euro aus
      § 812 Abs. 1 S. 1 Alt. 1 BGB haben.
  - prompt: Hat H durch eine Leistung des U etwas erlangt?
    erwartung: Ja - H hat durch die zweite, von U bewusst und zweckgerichtet zur (vermeintlichen)
      Erfüllung angewiesene Zahlung 1.200 Euro erlangt.
  - prompt: War diese Leistung ohne rechtlichen Grund?
    erwartung: Ja - der Werklohnanspruch des H aus § 631 Abs. 1 BGB war bereits durch
      die erste Zahlung gemäß § 362 Abs. 1 BGB erloschen; für die zweite Zahlung
      bestand daher von Anfang an kein Rechtsgrund.
  - prompt: Ist die Rückforderung nach § 814 BGB ausgeschlossen?
    erwartung: Nein - U wusste beim Anweisen der zweiten Zahlung wegen des Buchhaltungsfehlers
      nicht, dass er nicht mehr verpflichtet war; positive Kenntnis der Nichtschuld
      liegt nicht vor.
  - prompt: Kann sich H hinsichtlich der für die Reise ausgegebenen 800 Euro auf
      Entreicherung nach § 818 Abs. 3 BGB berufen?
    erwartung: Dem Grunde nach könnte eine Entreicherung vorliegen, da H sich die
      Reise ohne die Doppelzahlung nicht geleistet hätte (keine ersparten Aufwendungen).
  - prompt: Steht dem ein Umstand entgegen?
    erwartung: Ja - H hatte die Doppelzahlung bereits beim Kontoabgleich bemerkt,
      bevor er die 800 Euro für die Reise ausgab. Er kannte den Mangel des rechtlichen
      Grundes also schon vor der Vermögensdisposition und haftet ab diesem Zeitpunkt
      gemäß § 819 Abs. 1 BGB verschärft; die Berufung auf § 818 Abs. 3 BGB ist
      ihm deshalb für die 800 Euro verwehrt.
  - prompt: Ergebnis?
    erwartung: U kann von H die vollen 1.200 Euro verlangen - 400 Euro sind ohnehin
      noch vorhanden, die verbrauchten 800 Euro muss H wegen § 819 Abs. 1 BGB trotz
      Entreicherung ersetzen.
