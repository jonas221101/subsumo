topic:
  slug: zr-sr-ebv-987-ff
  area: zivilrecht
  title: "Sachenrecht: Eigentümer-Besitzer-Verhältnis, §§ 987-1003 BGB"
  parent: zr-sachenrecht-eigentumsherausgabe-985
  relevance: 5
  stand: 2026-09
  redaktion:
    erzeugt_von: claude-fable-5-1
    status: in-pruefung
    normzitate_geprueft: true
cards:
- slug: zr-ebv-nutzungsherausgabe-987
  type: norm
  front: "Unter welchen Voraussetzungen schuldet der Besitzer nach § 987 BGB die Herausgabe von Nutzungen?"
  back: "§ 987 Abs. 1 BGB verpflichtet den Besitzer, dem Eigentümer die Nutzungen herauszugeben, die er nach Eintritt der Rechtshängigkeit des Herausgabeanspruchs zieht. Nach § 987 Abs. 2 BGB schuldet er außerdem Ersatz für Nutzungen, die er nach Rechtshängigkeit schuldhaft nicht zieht, obwohl dies nach den Regeln einer ordnungsmäßigen Wirtschaft möglich gewesen wäre. Voraussetzung ist stets eine Vindikationslage (§§ 985, 986 BGB) im Zeitpunkt der Nutzungsziehung. Dem verklagten Besitzer wird nach § 990 Abs. 1 BGB der bösgläubige Besitzer gleichgestellt: Wer beim Besitzerwerb nicht in gutem Glauben war (§ 990 Abs. 1 S. 1 BGB) oder später positive Kenntnis von seinem fehlenden Besitzrecht erlangt (§ 990 Abs. 1 S. 2 BGB), haftet ab diesem Zeitpunkt nach § 987 BGB. Nutzungen sind nach § 100 BGB Früchte (§ 99 BGB) und Gebrauchsvorteile."
  norms:
  - § 987 Abs. 1 BGB
  - § 987 Abs. 2 BGB
  - § 990 Abs. 1 BGB
  - § 100 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-ebv-988-unentgeltlicher-besitzer
  type: definition
  front: "Was regelt § 988 BGB, und auf wen wendet die Rechtsprechung die Norm zusätzlich an?"
  back: "Nach § 988 BGB muss der redliche und unverklagte Besitzer, der den Besitz unentgeltlich erlangt hat, dem Eigentümer die vor Rechtshängigkeit gezogenen Nutzungen nach den Vorschriften über die Herausgabe einer ungerechtfertigten Bereicherung herausgeben (Rechtsfolgenverweisung auf §§ 818 ff. BGB, also mit Entreicherungseinwand nach § 818 Abs. 3 BGB). Der unentgeltliche Erwerber ist weniger schutzwürdig als derjenige, der für den Besitz eine Gegenleistung erbracht hat. Die Rechtsprechung wendet § 988 BGB entsprechend auch auf den Besitzer an, der den Besitz aufgrund eines unwirksamen entgeltlichen Vertrags erlangt hat (rechtsgrundloser Besitzerwerb), weil er die Nutzungen ohnehin nach Bereicherungsrecht an seinen Vertragspartner herausgeben müsste und deshalb nicht besser stehen soll als ein unentgeltlicher Erwerber."
  norms:
  - § 988 BGB
  - § 818 Abs. 3 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-ebv-988-analog-rechtsgrundlos-streit
  type: streitstand
  front: "Ist § 988 BGB auf den rechtsgrundlosen, aber entgeltlichen Besitzerwerb analog anwendbar?"
  back: "Der BGH bejaht seit Langem die entsprechende Anwendung des § 988 BGB auf den Besitzer, der den Besitz aufgrund eines nichtigen entgeltlichen Geschäfts erlangt hat: Der rechtsgrundlose Erwerb sei dem unentgeltlichen wertungsmäßig gleichzustellen, weil der Besitzer die Gegenleistung nach Bereicherungsrecht zurückverlangen kann und die Nutzungen deshalb im Ergebnis ohne Opfer erlangt hat. Folge ist, dass der Eigentümer die vor Rechtshängigkeit gezogenen Nutzungen nach §§ 988, 818 ff. BGB verlangen kann. Die wohl herrschende Literaturauffassung lehnt die Analogie ab: § 993 Abs. 1 Hs. 2 BGB privilegiere den redlichen unverklagten Besitzer bewusst, und der Eigentümer sei über die Leistungskondiktion hinreichend geschützt, weil er die Nutzungen unmittelbar aus § 812 Abs. 1 S. 1 Alt. 1 BGB iVm § 818 Abs. 1 BGB von seinem Vertragspartner herausverlangen könne, sofern er selbst die Sache geleistet hat. Nach dieser Auffassung ist die Leistungskondiktion neben dem EBV anwendbar, wenn der Eigentümer selbst geleistet hat; die Rechtsprechung erreicht über die Analogie dasselbe Ergebnis auch bei Leistung eines Dritten. In der Klausur ist der Streit nur relevant, wenn ein redlicher, unverklagter Besitzer aufgrund eines unwirksamen entgeltlichen Vertrags Nutzungen gezogen hat."
  norms:
  - § 988 BGB
  - § 993 Abs. 1 BGB
  - § 812 Abs. 1 S. 1 Alt. 1 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-ebv-schadensersatz-989-990
  type: definition
  front: "Unter welchen Voraussetzungen haftet der Besitzer nach §§ 989, 990 BGB auf Schadensersatz?"
  back: "§ 989 BGB verpflichtet den Besitzer, dem Eigentümer den Schaden zu ersetzen, der dadurch entsteht, dass infolge seines Verschuldens die Sache verschlechtert wird, untergeht oder aus einem anderen Grund nicht herausgegeben werden kann. Die Haftung setzt Rechtshängigkeit des Herausgabeanspruchs voraus; der bösgläubige Besitzer wird über § 990 Abs. 1 BGB gleichgestellt. Erforderlich sind also: Vindikationslage im Zeitpunkt der schädigenden Handlung, Rechtshängigkeit oder Bösgläubigkeit, Verschlechterung, Untergang oder sonstige Unmöglichkeit der Herausgabe, Verschulden des Besitzers (§ 276 BGB) und kausaler Schaden. Bösgläubig ist nach § 990 Abs. 1 S. 1 BGB iVm § 932 Abs. 2 BGB, wer beim Besitzerwerb weiß oder grob fahrlässig nicht weiß, dass ihm kein Besitzrecht zusteht; für die spätere Bösgläubigkeit verlangt § 990 Abs. 1 S. 2 BGB positive Kenntnis. Befindet sich der Besitzer außerdem im Verzug, haftet er nach § 990 Abs. 2 BGB weitergehend nach §§ 286 ff. BGB, insbesondere auch für Zufall nach § 287 S. 2 BGB."
  norms:
  - § 989 BGB
  - § 990 Abs. 1 BGB
  - § 990 Abs. 2 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-ebv-fremdbesitzerexzess-991-2
  type: definition
  front: "Was versteht man unter dem Fremdbesitzerexzess, und wie wird er nach § 991 Abs. 2 BGB behandelt?"
  back: "Ein Fremdbesitzerexzess liegt vor, wenn ein redlicher Fremdbesitzer (etwa ein vermeintlicher Mieter oder Entleiher) die Sache in einer Weise beschädigt, für die er auch gegenüber seinem vermeintlichen Vertragspartner einstehen müsste, weil er die Grenzen seines vermeintlichen Besitzrechts überschreitet. § 991 Abs. 2 BGB ordnet für den Fall des mittelbaren Besitzes an, dass der redliche unmittelbare Besitzer dem Eigentümer insoweit haftet, wie er dem mittelbaren Besitzer verantwortlich wäre. Die herrschende Meinung erweitert diesen Gedanken: Das Haftungsprivileg des § 993 Abs. 1 Hs. 2 BGB soll den redlichen Besitzer nur davor schützen, schlechter zu stehen als bei Wirksamkeit seines vermeintlichen Rechts. Überschreitet er dieses Recht, ist er nicht schutzwürdig, sodass die Sperrwirkung des EBV entfällt und § 823 Abs. 1 BGB anwendbar bleibt. Wer glaubt, Mieter zu sein, haftet für die fahrlässige Zerstörung der Mietsache also deliktisch, weil er auch als wirklicher Mieter hätte haften müssen."
  norms:
  - § 991 Abs. 2 BGB
  - § 993 Abs. 1 BGB
  - § 823 Abs. 1 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-ebv-deliktischer-besitzer-992
  type: definition
  front: "Wie haftet der deliktische Besitzer nach § 992 BGB?"
  back: "Hat sich der Besitzer den Besitz durch verbotene Eigenmacht (§ 858 BGB) oder durch eine Straftat verschafft, haftet er dem Eigentümer nach § 992 BGB nach den Vorschriften über den Schadensersatz wegen unerlaubter Handlungen, also nach §§ 823 ff. BGB. Für diesen Besitzer entfällt das Haftungsprivileg des EBV, weil er durch die Art des Besitzerwerbs nicht schutzwürdig ist. Nach herrschender Meinung ist § 992 BGB eine Rechtsgrundverweisung: Die Voraussetzungen des jeweiligen Deliktstatbestands, insbesondere Verschulden hinsichtlich der Besitzentziehung und der späteren Schädigung, müssen vorliegen; bei verbotener Eigenmacht verlangt die h.M. Verschulden bezüglich der Eigenmacht. Der Dieb ist regelmäßig zugleich bösgläubig, sodass daneben §§ 989, 990 BGB anwendbar sind."
  norms:
  - § 992 BGB
  - § 858 Abs. 1 BGB
  - § 823 Abs. 1 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-ebv-privileg-993-1-hs-2
  type: norm
  front: "Was ordnet § 993 Abs. 1 BGB für den redlichen, unverklagten Besitzer an?"
  back: "§ 993 Abs. 1 Hs. 1 BGB verpflichtet den redlichen unverklagten Besitzer nur zur Herausgabe von Übermaßfrüchten, also von Früchten, die nach den Regeln einer ordnungsmäßigen Wirtschaft nicht als Ertrag der Sache anzusehen sind, und dies nur nach Bereicherungsrecht. § 993 Abs. 1 Hs. 2 BGB stellt klar, dass er im Übrigen weder zur Herausgabe von Nutzungen noch zum Schadensersatz verpflichtet ist. Diese Regelung ist der Kern des Haftungsprivilegs des gutgläubigen Besitzers: Wer redlich glaubt, zum Besitz berechtigt zu sein, soll die Sache nutzen und sogar fahrlässig beschädigen dürfen, ohne dem Eigentümer zu haften. Aus dem Zusammenspiel von § 993 Abs. 1 Hs. 2 BGB und den §§ 987 ff. BGB folgert die herrschende Meinung die Sperrwirkung des EBV gegenüber Delikts- und Bereicherungsrecht für Nutzungen und Schäden an der Sache. Ausnahmen gelten für den Fremdbesitzerexzess, den deliktischen Besitzer (§ 992 BGB) und den unentgeltlichen Besitzer (§ 988 BGB)."
  norms:
  - § 993 Abs. 1 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-ebv-verwendungsersatz-994-996
  type: definition
  front: "Welche Verwendungen kann der Besitzer nach §§ 994-996 BGB vom Eigentümer ersetzt verlangen?"
  back: "Das Gesetz unterscheidet nach Art der Verwendung und nach der Redlichkeit des Besitzers. Notwendige Verwendungen, also solche, die zur Erhaltung oder ordnungsmäßigen Bewirtschaftung der Sache objektiv erforderlich sind, kann der redliche unverklagte Besitzer nach § 994 Abs. 1 S. 1 BGB ersetzt verlangen; ausgenommen sind nach § 994 Abs. 1 S. 2 BGB die gewöhnlichen Erhaltungskosten für die Zeit, in der ihm die Nutzungen verbleiben. Der verklagte oder bösgläubige Besitzer erhält notwendige Verwendungen nach § 994 Abs. 2 BGB nur nach den Vorschriften über die Geschäftsführung ohne Auftrag, also nur, wenn sie dem Interesse und Willen des Eigentümers entsprechen (§ 683 BGB). Nützliche Verwendungen, die den Wert der Sache erhöhen, ohne notwendig zu sein, kann nach § 996 BGB nur der redliche unverklagte Besitzer ersetzt verlangen, und nur soweit die Werterhöhung im Zeitpunkt der Wiedererlangung durch den Eigentümer noch besteht. Luxusverwendungen sind nie ersatzfähig; insoweit bleibt nur das Wegnahmerecht nach § 997 BGB."
  norms:
  - § 994 Abs. 1 BGB
  - § 994 Abs. 2 BGB
  - § 996 BGB
  - § 997 Abs. 1 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-ebv-verwendungsbegriff-streit
  type: streitstand
  front: "Enger oder weiter Verwendungsbegriff - sind sachändernde Maßnahmen wie die Errichtung eines Gebäudes Verwendungen im Sinne der §§ 994 ff. BGB?"
  back: "Nach dem engen Verwendungsbegriff der Rechtsprechung (BGH) sind Verwendungen nur Vermögensaufwendungen, die der Sache zugutekommen sollen, ohne sie grundlegend zu verändern; die Errichtung eines Gebäudes auf einem fremden Grundstück oder die Umgestaltung einer Sache zu einem anderen Zweck ist danach keine Verwendung, sodass ein Ersatz nach §§ 994 ff. BGB ausscheidet und nur das Wegnahmerecht (§ 997 BGB) sowie gegebenenfalls Bereicherungsansprüche nach §§ 951, 812 BGB in Betracht kommen. Nach dem weiten Verwendungsbegriff der überwiegenden Literatur erfasst der Begriff alle Aufwendungen, die der Sache zugutekommen, auch wenn sie diese verändern; die Interessen des Eigentümers, der eine unerwünschte Bebauung nicht bezahlen will, seien über die Beschränkung des § 996 BGB auf die fortbestehende Werterhöhung und über das Genehmigungserfordernis des § 1001 BGB hinreichend geschützt. Für die Rechtsprechung spricht, dass der Eigentümer sonst zur Finanzierung fremder Investitionsentscheidungen gezwungen würde; für die Literatur die Vermeidung von Wertungswidersprüchen zwischen erhaltenden und verändernden Maßnahmen."
  norms:
  - § 994 Abs. 1 BGB
  - § 996 BGB
  - § 997 Abs. 1 BGB
  - § 951 Abs. 1 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-ebv-durchsetzung-1000-1001
  type: definition
  front: "Wie werden Verwendungsersatzansprüche des Besitzers nach §§ 1000, 1001 BGB durchgesetzt?"
  back: "Nach § 1001 S. 1 BGB kann der Besitzer den Verwendungsersatz erst verlangen, wenn der Eigentümer die Sache wiedererlangt oder die Verwendungen genehmigt hat; der Anspruch ist bis dahin nicht fällig. Der Eigentümer kann sich der Zahlung entziehen, indem er die Sache nicht zurücknimmt; § 1003 BGB gibt dem Besitzer dann ein Befriedigungsrecht durch Verwertung der Sache. Solange der Besitzer die Sache noch hat, sichert ihn das Zurückbehaltungsrecht aus § 1000 S. 1 BGB: Er kann die Herausgabe verweigern, bis er wegen der Verwendungen befriedigt wird. Das Zurückbehaltungsrecht besteht nach § 1000 S. 2 BGB nicht, wenn der Besitzer die Sache durch eine vorsätzlich begangene unerlaubte Handlung erlangt hat. § 1000 BGB ist die sachenrechtliche Parallele zu § 273 BGB; im Prozess führt es zur Verurteilung zur Herausgabe Zug um Zug gegen Verwendungsersatz."
  norms:
  - § 1000 BGB
  - § 1001 BGB
  - § 1003 Abs. 1 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
