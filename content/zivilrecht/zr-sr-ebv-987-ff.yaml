  steps:
  - label: "I. Vindikationslage im maßgeblichen Zeitpunkt"
    children:
    - label: "1. Anspruchsteller ist Eigentümer"
    - label: "2. Anspruchsgegner ist Besitzer"
    - label: "3. Kein Recht zum Besitz, § 986 BGB"
    hinweis: "Maßgeblich ist der Zeitpunkt der Nutzungsziehung, der schädigenden Handlung oder der Verwendung - nicht der Zeitpunkt der Klage."
  - label: "II. Nutzungsherausgabe des Besitzers"
    children:
    - label: "1. Verklagter Besitzer: § 987 BGB (Abs. 1 gezogene, Abs. 2 schuldhaft nicht gezogene Nutzungen)"
    - label: "2. Bösgläubiger Besitzer: § 990 Abs. 1 BGB iVm § 987 BGB"
    - label: "3. Unentgeltlicher Besitzer: § 988 BGB (nach Rspr. analog auch bei rechtsgrundlosem Erwerb)"
    - label: "4. Redlicher unverklagter Besitzer: nur Übermaßfrüchte, § 993 Abs. 1 Hs. 1 BGB; im Übrigen keine Haftung, § 993 Abs. 1 Hs. 2 BGB"
  - label: "III. Schadensersatz des Besitzers"
    children:
    - label: "1. Verklagter Besitzer: § 989 BGB (Verschulden erforderlich)"
    - label: "2. Bösgläubiger Besitzer: §§ 990 Abs. 1, 989 BGB; bei Verzug weitergehend § 990 Abs. 2 BGB"
    - label: "3. Deliktischer Besitzer: § 992 BGB iVm §§ 823 ff. BGB"
    - label: "4. Redlicher Fremdbesitzer bei Überschreitung des vermeintlichen Besitzrechts: § 991 Abs. 2 BGB bzw. Fremdbesitzerexzess, § 823 Abs. 1 BGB anwendbar"
    - label: "5. Sonst: kein Schadensersatz, § 993 Abs. 1 Hs. 2 BGB - Sperrwirkung gegenüber §§ 823 ff., 812 ff. BGB"
  - label: "IV. Verwendungsersatz des Besitzers gegen den Eigentümer"
    children:
    - label: "1. Verwendung (enger Verwendungsbegriff der Rspr.)"
    - label: "2. Notwendige Verwendungen: § 994 Abs. 1 BGB (redlich, unverklagt) bzw. § 994 Abs. 2 BGB iVm GoA-Regeln (verklagt oder bösgläubig)"
    - label: "3. Nützliche Verwendungen: § 996 BGB, nur redlicher unverklagter Besitzer, nur fortbestehende Werterhöhung"
    - label: "4. Wegnahmerecht, § 997 BGB"
  - label: "V. Durchsetzung: Fälligkeit nach Wiedererlangung oder Genehmigung, § 1001 BGB; Zurückbehaltungsrecht, § 1000 BGB"
faelle:
- slug: zr-fall-gestohlenes-segelboot
  title: "Das gestohlene Segelboot"
  difficulty: 4
  minutes: 60
  quellen:
  - Eigener Sachverhalt der Redaktion
  - BGB, amtliche Fassung
  facts: "Dem A wird sein Segelboot aus dem Winterlager gestohlen. Der Dieb verkauft es unter falschem Namen an B, der von dem Diebstahl nichts ahnt und auch bei sorgfältiger Prüfung der vorgelegten Papiere keinen Anlass zu Zweifeln hätte. B zahlt 12.000 EUR. Im Frühjahr lässt B den defekten Bootsmotor für 1.500 EUR instand setzen, ohne den das Boot nicht hätte genutzt werden können, und baut für 800 EUR ein modernes Echolot ein, das den Wert des Bootes dauerhaft um 500 EUR steigert. Über den Sommer vermietet B das Boot an Feriengäste und erzielt 2.000 EUR Mieteinnahmen. Bei einem Törn im Juli beschädigt B durch eine fahrlässig unterlassene Kontrolle des Ankerplatzes den Rumpf; die Reparatur kostet 900 EUR. Im September erfährt B durch eine Fahndungsmeldung, dass das Boot dem A gestohlen worden ist. Dennoch vermietet er es noch im Oktober für 400 EUR weiter. Im November verlangt A von B Herausgabe des Bootes, Zahlung der gesamten Mieteinnahmen von 2.400 EUR sowie Ersatz der Rumpfreparatur von 900 EUR. B verlangt seinerseits Ersatz für Motor und Echolot und will das Boot bis zur Zahlung behalten."
  question: "Welche Ansprüche bestehen zwischen A und B? Die Herausgabepflicht des B nach § 985 BGB ist nur kurz zu begründen."
  steps:
  - prompt: "Besteht eine Vindikationslage, und ab wann ist B bösgläubig?"
    erwartung: "A ist Eigentümer geblieben, weil ein gutgläubiger Erwerb des B an der gestohlenen Sache nach § 935 Abs. 1 S. 1 BGB ausscheidet. B ist Besitzer ohne Recht zum Besitz (§ 986 BGB), der Kaufvertrag mit dem Dieb wirkt nicht gegenüber A. Beim Besitzerwerb war B gutgläubig (§ 990 Abs. 1 S. 1 BGB iVm § 932 Abs. 2 BGB: weder Kenntnis noch grobe Fahrlässigkeit). Ab der Fahndungsmeldung im September hat er positive Kenntnis und ist nach § 990 Abs. 1 S. 2 BGB bösgläubig."
  - prompt: "Kann A die Mieteinnahmen aus dem Sommer (2.000 EUR) und aus dem Oktober (400 EUR) verlangen?"
    erwartung: "Für den Sommer war B redlicher unverklagter Besitzer; er hat den Besitz entgeltlich erworben, § 988 BGB greift nicht, und Mieteinnahmen sind keine Übermaßfrüchte. Nach § 993 Abs. 1 Hs. 2 BGB schuldet er sie nicht; Bereicherungs- und Deliktsansprüche sind gesperrt. Für den Oktober haftet B als bösgläubiger Besitzer nach §§ 990 Abs. 1 S. 2, 987 Abs. 1 BGB auf Herausgabe der 400 EUR."
  - prompt: "Muss B den Rumpfschaden von 900 EUR ersetzen?"
    erwartung: "Nein. Im Juli war B gutgläubig und unverklagt; § 989 BGB greift mangels Rechtshängigkeit, § 990 Abs. 1 BGB mangels Bösgläubigkeit nicht. § 992 BGB scheidet aus, weil B den Besitz nicht durch verbotene Eigenmacht oder Straftat erlangt hat. Ein Fremdbesitzerexzess liegt nicht vor, da B sich für den Eigentümer hielt (Eigenbesitzer) und nicht die Grenzen eines vermeintlichen Fremdbesitzrechts überschritten hat. Nach § 993 Abs. 1 Hs. 2 BGB ist auch § 823 Abs. 1 BGB gesperrt."
  - prompt: "Welche Verwendungen kann B ersetzt verlangen, und kann er das Boot bis zur Zahlung zurückbehalten?"
    erwartung: "Die Motorinstandsetzung ist eine notwendige Verwendung, die B als damals redlicher unverklagter Besitzer nach § 994 Abs. 1 S. 1 BGB ersetzt verlangen kann (1.500 EUR); gewöhnliche Erhaltungskosten nach § 994 Abs. 1 S. 2 BGB liegen bei einer außerordentlichen Motorreparatur nicht vor. Das Echolot ist eine nützliche Verwendung; nach § 996 BGB ist nur die fortbestehende Werterhöhung von 500 EUR ersatzfähig, nicht der Aufwand von 800 EUR. Nach § 1000 S. 1 BGB kann B die Herausgabe verweigern, bis er wegen 2.000 EUR befriedigt ist; § 1000 S. 2 BGB greift nicht, weil B das Boot nicht durch vorsätzliche unerlaubte Handlung erlangt hat. Fällig wird der Anspruch nach § 1001 S. 1 BGB mit Wiedererlangung durch A oder Genehmigung."
