- slug: zr-schema-ebv-987-ff
  title: "Ansprüche im Eigentümer-Besitzer-Verhältnis, §§ 987-1003 BGB"
  norms:
  - § 987 BGB
  - § 989 BGB
  - § 990 BGB
  - § 993 BGB
