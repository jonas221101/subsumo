faelle:
- slug: zr-fall-miet-eigenbedarf
  title: Die Wohnung für die Tochter
  difficulty: 3
  minutes: 45
  quellen:
  - Eigener Sachverhalt der Redaktion
  - BGB, amtliche Fassung
  facts: Vermieter V ist Eigentümer eines Mehrfamilienhauses. Er hat die Wohnung im ersten
    Obergeschoss vor neun Jahren an Mieter M vermietet (drei Zimmer, 70 Quadratmeter). Am zweiten Werktag des Monats August erklärt V schriftlich die Kündigung zum 30. April des Folgejahres. Im Kündigungsschreiben
    heißt es, seine Tochter T (27) habe nach dem Studium eine Stelle in der Stadt angetreten
    und benötige die Wohnung für sich. Der Bedarf der T ist ernsthaft. Im gleichen Haus steht
    seit Monaten die gleich geschnittene Wohnung im zweiten Obergeschoss leer; V hat sie weder
    M noch T angeboten und auch zum Zeitpunkt der Kündigung nicht vermietet. M widerspricht
    der Kündigung und zieht nicht aus. V verlangt Räumung und Herausgabe.
  question: Hat V gegen M einen Anspruch auf Räumung und Herausgabe der Wohnung?
  steps:
  - prompt: Welche Anspruchsgrundlage kommt in Betracht und was ist Voraussetzung?
    erwartung: Anspruchsgrundlage ist § 546 Abs. 1 BGB, wonach der Mieter bei Beendigung des Mietverhältnisses zur Rückgabe der Mietsache verpflichtet ist. Zu prüfen ist, ob das Mietverhältnis durch die Kündigung beendet wurde.
  - prompt: Sind Form, Begründung und Frist der Kündigung gewahrt?
    erwartung: Ja. Die Kündigung ist schriftlich erklärt (§ 568 Abs. 1 BGB) und im Schreiben
      begründet (§ 573 Abs. 3 BGB). Die Kündigungsfrist beträgt für den Vermieter nach neun
      Jahren Überlassung neun Monate (§ 573c Abs. 1 S. 2 BGB) und wurde eingehalten.
  - prompt: Liegt ein berechtigtes Interesse vor?
    erwartung: 'Grundsätzlich ja: V benötigt die Wohnung für eine Familienangehörige, seine
      Tochter (Eigenbedarf, § 573 Abs. 2 Nr. 2 BGB). Der Nutzungswunsch ist ernsthaft und
      nachvollziehbar.'
  - prompt: Steht der Kündigung der Einwand des Rechtsmissbrauchs entgegen?
    erwartung: Ja. Der Vermieter ist verpflichtet, dem Mieter eine andere, in demselben Haus
      verfügbare, vergleichbare Wohnung anzubieten. Dass V die gleich geschnittene freie Wohnung
      im zweiten Obergeschoss weder M noch T angeboten hat, ist treuwidrig (§ 242 BGB).
  - prompt: Ergebnis?
    erwartung: Die Kündigung ist unwirksam, das Mietverhältnis besteht fort. V hat keinen
      Anspruch auf Räumung und Herausgabe nach § 546 Abs. 1 BGB.
  expectation:
    pruefpunkte:
