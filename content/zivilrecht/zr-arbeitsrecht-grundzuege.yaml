- slug: zr-fall-arb-gabelstapler
  title: Der Regalschaden
  difficulty: 2
  minutes: 35
  quellen:
  - Eigener Sachverhalt der Redaktion
  - BGB, amtliche Fassung
  facts: Lagerarbeiter A ist bei Arbeitgeberin G angestellt. Bei der Einlagerung einer Palette
    mit dem betriebseigenen Gabelstapler rutscht er bei ruhiger Fahrt für einen kurzen Moment
    mit dem Fuß vom Pedal ab, ohne dass eine ungewöhnliche Unaufmerksamkeit vorliegt. Der
    Stapler stößt gegen ein Hochregal und beschädigt es; der Sachschaden beträgt 6.000 Euro.
    A verdient 2.400 Euro brutto im Monat. G verlangt von A vollen Schadensersatz und meint,
    A müsse beweisen, dass er nicht schuldhaft gehandelt habe.
  question: Kann G von A Ersatz der 6.000 Euro verlangen?
  steps:
  - prompt: Welche Anspruchsgrundlage kommt in Betracht und liegt ein Arbeitsverhältnis vor?
    erwartung: § 280 Abs. 1 BGB in Verbindung mit § 241 Abs. 2 BGB (Rücksichtnahmepflicht
      auf das Eigentum des Arbeitgebers). A ist als weisungsgebunden Beschäftigter Arbeitnehmer
      nach § 611a Abs. 1 BGB.
  - prompt: Wer trägt die Beweislast für das Verschulden?
    erwartung: 'Nach § 619a BGB gilt § 280 Abs. 1 S. 2 BGB nicht: G muss das Vertretenmüssen
      des A beweisen; die Auffassung der G ist unzutreffend.'
  - prompt: Hat A die Pflichtverletzung zu vertreten?
    erwartung: Jede Fahrlässigkeit genügt für § 276 Abs. 1 BGB; es liegt jedoch nur ein kurzes
      Abrutschen ohne besondere Unachtsamkeit vor, also allenfalls leichteste Fahrlässigkeit.
  - prompt: Welche Wirkung hat die Haftungsprivilegierung bei dieser Tätigkeit?
    erwartung: Die Tätigkeit war betrieblich veranlasst. Bei leichtester Fahrlässigkeit entfällt
      die Haftung des Arbeitnehmers nach den Grundsätzen des innerbetrieblichen Schadensausgleichs
      vollständig. G hat keinen Anspruch auf Ersatz der 6.000 Euro gegen A.
  expectation:
