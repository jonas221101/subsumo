faelle:
- slug: zr-fall-die-gefaelschte-bilanz
  title: Die gefaelschte Bilanz
  difficulty: 4
  minutes: 40
  quellen:
  - Eigener Sachverhalt der Redaktion
  - BGB, amtliche Fassung
  facts: Geschaeftsfuehrer G der fiktiven Solaranlagen-GmbH wirbt gezielt Privatanleger
    fuer stille Beteiligungen. Um Investorin I zur Zeichnung einer Beteiligung in
    Hoehe von 25.000 EUR zu bewegen, legt er ihr eine von ihm frei erfundene Bilanz
    vor, die einen Jahresueberschuss von 400.000 EUR ausweist, obwohl G positiv weiss,
    dass die GmbH bereits erheblich ueberschuldet und zahlungsunfaehig ist. G handelt
    so, um sich selbst eine erfolgsabhaengige Vermittlungsprovision von 2.500 EUR
    zu sichern. I zeichnet die Beteiligung; wenige Wochen spaeter muss die GmbH Insolvenz
    anmelden, und die Einlage der I ist vollstaendig verloren.
  question: Hat I gegen G einen Anspruch auf Schadensersatz in Hoehe von 25.000 EUR
    aus § 826 BGB?
  steps:
  - prompt: Warum scheidet ein Anspruch aus § 823 Abs. 1 BGB als Grundlage fuer den
      Ersatz der 25.000 EUR aus?
    erwartung: Weil der Verlust der Einlage ein reiner Vermoegensschaden ist; das
      Vermoegen als solches gehoert nicht zu den in § 823 Abs. 1 BGB abschliessend
      genannten Rechtsguetern.
  - prompt: Ist das Verhalten des G als sittenwidrig zu qualifizieren?
    erwartung: 'Ja: die bewusste Vorlage einer frei erfundenen, die wirtschaftliche
      Lage der GmbH ins Gegenteil verkehrenden Bilanz zur gezielten Anlagetaeuschung
      verstoesst eindeutig gegen die grundlegenden Wertungen der Rechts- und Sittenordnung.'
  - prompt: Liegt der erforderliche Schaedigungsvorsatz vor?
    erwartung: 'Ja: G wusste um die Zahlungsunfaehigkeit der GmbH und nahm den Vermoegensverlust
      der I zumindest billigend in Kauf (dolus eventualis genuegt), um sich selbst
      die Provision zu sichern.'
  - prompt: Bezieht sich der Vorsatz auch auf die sittenwidrigkeitsbegruendenden Umstaende?
    erwartung: 'Ja: G kannte sowohl die Unrichtigkeit der Bilanz als auch deren taeuschende
      Zielrichtung gegenueber I.'
  - prompt: Zu welchem Ergebnis kommt man?
    erwartung: I hat gegen G einen Anspruch auf Schadensersatz in Hoehe von 25.000
      EUR aus § 826 BGB.
  expectation:
    pruefpunkte:
