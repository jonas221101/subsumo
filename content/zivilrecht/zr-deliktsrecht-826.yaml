cards:
- slug: zr-826-regelungsgehalt
  type: definition
  front: Was regelt § 826 BGB und welche Funktion hat die Norm im System des Deliktsrechts?
  back: '§ 826 BGB verpflichtet zum Schadensersatz, wer einem anderen in einer gegen
    die guten Sitten verstossenden Weise vorsaetzlich Schaden zufuegt. Die Norm wirkt
    als Auffangtatbestand: sie setzt weder eines der in § 823 Abs. 1 BGB abschliessend
    genannten Rechtsgueter noch ein Schutzgesetz im Sinne des § 823 Abs. 2 BGB voraus
    und erfasst dadurch insbesondere Faelle, in denen allein das Vermoegen geschaedigt
    wird.'
  norms:
  - § 826 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-826-sittenwidrigkeit-begriff
  type: definition
  front: Wie ist die Sittenwidrigkeit im Sinne des § 826 BGB zu bestimmen?
  back: Ein Verhalten ist sittenwidrig, wenn es nach seinem Gesamtcharakter - ermittelt
    durch zusammenfassende Wuerdigung von Inhalt, Beweggrund und Zweck des Handelns
    - mit den grundlegenden Wertungen der Rechts- und Sittenordnung nicht vereinbar
    ist. Es handelt sich um einen offenen Wertungsbegriff, der stets anhand der Umstaende
    des Einzelfalls auszufuellen ist, nicht um eine feste Fallgruppenliste.
  norms:
  - § 826 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-826-schaedigungsvorsatz
  type: definition
  front: Welche Anforderungen stellt § 826 BGB an den Schaedigungsvorsatz?
  back: Der Schaediger muss die Schaedigung des anderen zumindest fuer moeglich gehalten
    und billigend in Kauf genommen haben; bedingter Vorsatz (dolus eventualis) genuegt.
    Nicht erforderlich ist, dass der Schaediger den Schaden in allen Einzelheiten
    oder in seiner genauen Hoehe vorausgesehen hat - ausreichend ist die Voraussicht
    der Richtung und Art des Schadens.
  norms:
  - § 826 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-826-vorsatz-sittenwidrige-umstaende
  type: definition
  front: Muss sich der Vorsatz bei § 826 BGB auch auf die die Sittenwidrigkeit begruendenden
    Umstaende beziehen?
  back: 'Ja: der Vorsatz des Schaedigers muss sich nicht nur auf den Schaden selbst,
    sondern auch auf die tatsaechlichen Umstaende erstrecken, aus denen sich die Sittenwidrigkeit
    seines Verhaltens ergibt. Kennt der Handelnde diese Umstaende nicht, fehlt es
    am erforderlichen Vorsatz, selbst wenn sein Verhalten objektiv als sittenwidrig
    zu bewerten waere.'
  norms:
  - § 826 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-826-reine-vermoegensschaeden
  type: definition
  front: Welche Bedeutung hat § 826 BGB fuer den Ersatz reiner Vermoegensschaeden?
  back: Anders als § 823 Abs. 1 BGB, der nur die dort abschliessend genannten Rechtsgueter
    schuetzt, erfasst § 826 BGB uneingeschraenkt auch das Vermoegen als solches. Gerade
    deshalb ist die Norm die zentrale Anspruchsgrundlage fuer Faelle reiner Vermoegensschaeden
    ausserhalb vertraglicher Beziehungen, etwa bei vorsaetzlicher Falschinformation
    im Wirtschaftsverkehr.
  norms:
  - § 826 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-826-abgrenzung-823-1
  type: definition
  front: Wie unterscheidet sich § 826 BGB von § 823 Abs. 1 BGB?
  back: § 823 Abs. 1 BGB schuetzt nur die dort abschliessend aufgezaehlten Rechtsgueter
    (Leben, Koerper, Gesundheit, Freiheit, Eigentum, sonstiges Recht) und genuegt
    sich mit Fahrlaessigkeit. § 826 BGB verlangt demgegenueber Vorsatz und Sittenwidrigkeit,
    schuetzt dafuer aber unbeschraenkt jedes Vermoegensinteresse - die beiden Normen
    ergaenzen sich, statt sich auszuschliessen.
  norms:
  - § 826 BGB
  - § 823 Abs. 1 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-826-abgrenzung-823-2
  type: definition
  front: Wie unterscheidet sich § 826 BGB von § 823 Abs. 2 BGB?
  back: § 823 Abs. 2 BGB setzt den Verstoss gegen ein konkretes Schutzgesetz voraus
    und laesst je nach diesem Gesetz auch Fahrlaessigkeit genuegen. § 826 BGB benoetigt
    dagegen kein Schutzgesetz, verlangt dafuer aber stets Vorsatz sowohl hinsichtlich
    des Schadens als auch der sittenwidrigkeitsbegruendenden Umstaende - die Norm
    ist damit im Verschulden enger, im erfassten Interesse (jedes Vermoegensinteresse)
    aber weiter als § 823 Abs. 2 BGB.
  norms:
  - § 826 BGB
  - § 823 Abs. 2 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-826-rechtsfolge
  type: definition
  front: Welche Rechtsfolge hat ein Anspruch aus § 826 BGB?
  back: Der Schaediger ist gemaess §§ 249 ff. BGB zum Ersatz des durch die sittenwidrige
    Schaedigung verursachten Schadens verpflichtet. Je nach Fallgruppe kann dies auf
    Naturalrestitution (§ 249 Abs. 1 BGB), etwa die Rueckabwicklung eines durch Taeuschung
    veranlassten Geschaefts, oder auf Geldersatz des eingetretenen Vermoegensnachteils
    gerichtet sein.
  norms:
  - § 826 BGB
  - § 249 Abs. 1 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
