cards:
- slug: zr-826-regelungsgehalt
  type: definition
  front: Was regelt § 826 BGB und welche Funktion hat die Norm im System des Deliktsrechts?
  back: '§ 826 BGB verpflichtet zum Schadensersatz, wer einem anderen in einer gegen
    die guten Sitten verstoßenden Weise vorsätzlich Schaden zufügt. Die Norm wirkt
    als Auffangtatbestand: sie setzt weder eines der in § 823 Abs. 1 BGB abschließend
    genannten Rechtsgüter noch ein Schutzgesetz im Sinne des § 823 Abs. 2 BGB voraus
    und erfasst dadurch insbesondere Fälle, in denen allein das Vermögen geschädigt
    wird.'
  norms:
  - § 826 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-826-sittenwidrigkeit-begriff
  type: definition
  front: Wie ist die Sittenwidrigkeit im Sinne des § 826 BGB zu bestimmen?
  back: Ein Verhalten ist sittenwidrig, wenn es nach seinem Gesamtcharakter - ermittelt
    durch zusammenfassende Würdigung von Inhalt, Beweggrund und Zweck des Handelns
    - mit den grundlegenden Wertungen der Rechts- und Sittenordnung nicht vereinbar
    ist. Es handelt sich um einen offenen Wertungsbegriff, der stets anhand der Umstände
    des Einzelfalls auszufüllen ist, nicht um eine feste Fallgruppenliste.
  norms:
  - § 826 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-826-schaedigungsvorsatz
  type: definition
  front: Welche Anforderungen stellt § 826 BGB an den Schädigungsvorsatz?
  back: Der Schädiger muss die Schädigung des anderen zumindest für möglich gehalten
    und billigend in Kauf genommen haben; bedingter Vorsatz (dolus eventualis) genügt.
    Nicht erforderlich ist, dass der Schädiger den Schaden in allen Einzelheiten
    oder in seiner genauen Höhe vorausgesehen hat - ausreichend ist die Voraussicht
    der Richtung und Art des Schadens.
  norms:
  - § 826 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-826-vorsatz-sittenwidrige-umstaende
  type: definition
  front: Muss sich der Vorsatz bei § 826 BGB auch auf die die Sittenwidrigkeit begründenden
    Umstände beziehen?
  back: 'Ja: der Vorsatz des Schädigers muss sich nicht nur auf den Schaden selbst,
    sondern auch auf die tatsächlichen Umstände erstrecken, aus denen sich die Sittenwidrigkeit
    seines Verhaltens ergibt. Kennt der Handelnde diese Umstände nicht, fehlt es
    am erforderlichen Vorsatz, selbst wenn sein Verhalten objektiv als sittenwidrig
    zu bewerten wäre.'
  norms:
  - § 826 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-826-reine-vermoegensschaeden
  type: definition
  front: Welche Bedeutung hat § 826 BGB für den Ersatz reiner Vermögensschäden?
  back: Anders als § 823 Abs. 1 BGB, der nur die dort abschließend genannten Rechtsgüter
    schützt, erfasst § 826 BGB uneingeschränkt auch das Vermögen als solches. Gerade
    deshalb ist die Norm die zentrale Anspruchsgrundlage für Fälle reiner Vermögensschäden
    außerhalb vertraglicher Beziehungen, etwa bei vorsätzlicher Falschinformation
    im Wirtschaftsverkehr.
  norms:
  - § 826 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-826-abgrenzung-823-1
  type: definition
  front: Wie unterscheidet sich § 826 BGB von § 823 Abs. 1 BGB?
  back: § 823 Abs. 1 BGB schützt nur die dort abschließend aufgezählten Rechtsgüter
    (Leben, Körper, Gesundheit, Freiheit, Eigentum, sonstiges Recht) und genügt
    sich mit Fahrlässigkeit. § 826 BGB verlangt demgegenüber Vorsatz und Sittenwidrigkeit,
    schützt dafür aber unbeschränkt jedes Vermögensinteresse - die beiden Normen
    ergänzen sich, statt sich auszuschließen.
  norms:
  - § 826 BGB
  - § 823 Abs. 1 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-826-abgrenzung-823-2
  type: definition
  front: Wie unterscheidet sich § 826 BGB von § 823 Abs. 2 BGB?
  back: § 823 Abs. 2 BGB setzt den Verstoß gegen ein konkretes Schutzgesetz voraus
    und lässt je nach diesem Gesetz auch Fahrlässigkeit genügen. § 826 BGB benötigt
    dagegen kein Schutzgesetz, verlangt dafür aber stets Vorsatz sowohl hinsichtlich
    des Schadens als auch der sittenwidrigkeitsbegründenden Umstände - die Norm
    ist damit im Verschulden enger, im erfassten Interesse (jedes Vermögensinteresse)
    aber weiter als § 823 Abs. 2 BGB.
  norms:
  - § 826 BGB
  - § 823 Abs. 2 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-826-rechtsfolge
  type: definition
  front: Welche Rechtsfolge hat ein Anspruch aus § 826 BGB?
  back: Der Schädiger ist gemäß §§ 249 ff. BGB zum Ersatz des durch die sittenwidrige
    Schädigung verursachten Schadens verpflichtet. Je nach Fallgruppe kann dies auf
    Naturalrestitution (§ 249 Abs. 1 BGB), etwa die Rückabwicklung eines durch Täuschung
    veranlassten Geschäfts, oder auf Geldersatz des eingetretenen Vermögensnachteils
    gerichtet sein.
  norms:
  - § 826 BGB
  - § 249 Abs. 1 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
