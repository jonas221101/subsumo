faelle:
- slug: zr-fall-die-gefaelschte-bilanz
  title: Die gefälschte Bilanz
  difficulty: 4
  minutes: 40
  quellen:
  - Eigener Sachverhalt der Redaktion
  - BGB, amtliche Fassung
  facts: Geschäftsführer G der fiktiven Solaranlagen-GmbH wirbt gezielt Privatanleger
    für stille Beteiligungen. Um Investorin I zur Zeichnung einer Beteiligung in
    Höhe von 25.000 EUR zu bewegen, legt er ihr eine von ihm frei erfundene Bilanz
    vor, die einen Jahresüberschuss von 400.000 EUR ausweist, obwohl G positiv weiß,
    dass die GmbH bereits erheblich überschuldet und zahlungsunfähig ist. G handelt
    so, um sich selbst eine erfolgsabhängige Vermittlungsprovision von 2.500 EUR
    zu sichern. I zeichnet die Beteiligung; wenige Wochen später muss die GmbH Insolvenz
    anmelden, und die Einlage der I ist vollständig verloren.
  question: Hat I gegen G einen Anspruch auf Schadensersatz in Höhe von 25.000 EUR
    aus § 826 BGB?
  steps:
  - prompt: Warum scheidet ein Anspruch aus § 823 Abs. 1 BGB als Grundlage für den
      Ersatz der 25.000 EUR aus?
    erwartung: Weil der Verlust der Einlage ein reiner Vermögensschaden ist; das
      Vermögen als solches gehört nicht zu den in § 823 Abs. 1 BGB abschließend
      genannten Rechtsgütern.
  - prompt: Ist das Verhalten des G als sittenwidrig zu qualifizieren?
    erwartung: 'Ja: die bewusste Vorlage einer frei erfundenen, die wirtschaftliche
      Lage der GmbH ins Gegenteil verkehrenden Bilanz zur gezielten Anlagetäuschung
      verstößt eindeutig gegen die grundlegenden Wertungen der Rechts- und Sittenordnung.'
  - prompt: Liegt der erforderliche Schädigungsvorsatz vor?
    erwartung: 'Ja: G wusste um die Zahlungsunfähigkeit der GmbH und nahm den Vermögensverlust
      der I zumindest billigend in Kauf (dolus eventualis genügt), um sich selbst
      die Provision zu sichern.'
  - prompt: Bezieht sich der Vorsatz auch auf die sittenwidrigkeitsbegründenden Umstände?
    erwartung: 'Ja: G kannte sowohl die Unrichtigkeit der Bilanz als auch deren täuschende
      Zielrichtung gegenüber I.'
  - prompt: Zu welchem Ergebnis kommt man?
    erwartung: I hat gegen G einen Anspruch auf Schadensersatz in Höhe von 25.000
      EUR aus § 826 BGB.
  expectation:
    pruefpunkte:
    - id: p1
      label: § 826 BGB als einschlägige Anspruchsgrundlage benannt, da § 823 Abs.
        1 BGB den reinen Vermögensschaden nicht erfasst
      weight: 2.0
      required: true
      norms:
      - § 826 BGB
      - § 823 Abs. 1 BGB
      keywords:
      - '826'
      - reiner Vermögensschaden
      - 823 Abs. 1
      card_slugs:
      - zr-826-reine-vermoegensschaeden
      - zr-826-abgrenzung-823-1
