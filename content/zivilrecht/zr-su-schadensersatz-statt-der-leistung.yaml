cards:
- slug: zr-su-se-statt-leistung-systematik-280
  type: definition
  front: Wie ist der Schadensersatz statt der Leistung in § 280 BGB systematisch verankert?
  back: '§ 280 Abs. 1 BGB enthaelt den Grundtatbestand fuer Schadensersatz wegen einer
    Pflichtverletzung. Will der Glaeubiger Schadensersatz STATT der Leistung - also
    als Ersatz fuer die ausbleibende Leistung selbst, nicht nur fuer einen Verspaetungs-
    oder Begleitschaden -, so kann er dies nur unter den zusaetzlichen Voraussetzungen
    der §§ 281, 282 oder 283 BGB verlangen (§ 280 Abs. 3 BGB). § 281 BGB regelt den
    Hauptfall: Nichtleistung oder nicht vertragsgemaesse Leistung trotz Moeglichkeit
    der Leistung.'
  norms:
  - § 280 Abs. 1 BGB
  - § 280 Abs. 3 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-su-se-statt-leistung-voraussetzungen-281-1
  type: definition
  front: Nenne die Voraussetzungen des § 281 Abs. 1 BGB
  back: Der Glaeubiger kann Schadensersatz statt der Leistung verlangen, wenn der
    Schuldner eine faellige, durchsetzbare Leistung nicht oder nicht vertragsgemaess
    erbringt und der Glaeubiger dem Schuldner erfolglos eine angemessene Frist zur
    Leistung oder Nacherfuellung bestimmt hat (§ 281 Abs. 1 S. 1 BGB). Bei einer nicht
    vertragsgemaessen Leistung ist Schadensersatz statt der ganzen Leistung nur zu
    verlangen, wenn die Pflichtverletzung nicht unerheblich ist (§ 281 Abs. 1 S. 3
    BGB). Hinzukommen muss das Vertretenmuessen des Schuldners (§ 280 Abs. 1 S. 2
    BGB).
  norms:
  - § 281 Abs. 1 BGB
  - § 280 Abs. 1 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-su-se-statt-leistung-fristentbehrlichkeit-281-2
  type: definition
  front: Wann ist die Fristsetzung nach § 281 Abs. 2 BGB entbehrlich?
  back: Die Fristsetzung ist entbehrlich, wenn der Schuldner die Leistung ernsthaft
    und endgueltig verweigert oder wenn besondere Umstaende vorliegen, die unter Abwaegung
    der beiderseitigen Interessen die sofortige Geltendmachung des Schadensersatzanspruchs
    rechtfertigen (§ 281 Abs. 2 BGB). Diese Fallgruppen entsprechen denen der Mahnungsentbehrlichkeit
    in § 286 Abs. 2 Nr. 3 und Nr. 4 BGB.
  norms:
  - § 281 Abs. 2 BGB
  - § 286 Abs. 2 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-su-se-statt-leistung-ausschluss-281-4
  type: definition
  front: Welche Wirkung hat das Verlangen von Schadensersatz statt der ganzen Leistung,
    § 281 Abs. 4 BGB?
  back: 'Sobald der Glaeubiger Schadensersatz statt der ganzen Leistung verlangt,
    ist der Anspruch auf die Leistung selbst ausgeschlossen (§ 281 Abs. 4 BGB). Der
    Glaeubiger muss sich also entscheiden: Er kann nicht zugleich die urspruengliche
    Leistung und den vollen Schadensersatz statt dieser Leistung fordern - andernfalls
    stuende er besser, als wenn ordnungsgemaess erfuellt worden waere.'
  norms:
  - § 281 Abs. 4 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-su-se-statt-leistung-rueckgewaehr-281-5
  type: definition
  front: Was regelt § 281 Abs. 5 BGB fuer bereits erbrachte Leistungen?
  back: Verlangt der Glaeubiger Schadensersatz statt der ganzen Leistung, so ist der
    Schuldner berechtigt, vom Glaeubiger die Herausgabe einer bereits erhaltenen Leistung
    nach den Vorschriften ueber den Ruecktritt zu verlangen (§ 281 Abs. 5 BGB), und
    umgekehrt der Glaeubiger seine eigene Vorleistung zurueckzuverlangen. Es entsteht
    also ein Rueckgewaehrschuldverhaeltnis entsprechend den §§ 346 bis 348 BGB.
  norms:
  - § 281 Abs. 5 BGB
  - § 346 Abs. 1 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-su-se-statt-leistung-abgrenzung-283
  type: definition
  front: Wie unterscheiden sich § 281 BGB und § 283 BGB?
  back: § 281 BGB setzt voraus, dass die Leistung noch moeglich ist, der Schuldner
    sie aber trotz Fristsetzung nicht erbringt. § 283 BGB erfasst dagegen den Fall,
    dass der Schuldner nach § 275 Abs. 1 bis 3 BGB von der Leistungspflicht befreit
    ist, die Leistung also (nachtraeglich) unmoeglich geworden ist. Weil eine Fristsetzung
    zu einer unmoeglichen Leistung sinnlos waere, verlangt § 283 BGB keine Frist,
    sondern verweist unmittelbar auf die Voraussetzungen des § 280 Abs. 1 BGB.
  norms:
  - § 283 BGB
  - § 275 Abs. 1 BGB
  - § 280 Abs. 1 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-su-se-statt-leistung-ruecktritt-325
  type: definition
  front: Wie verhaelt sich der Anspruch auf Schadensersatz statt der Leistung zum
    Ruecktritt, § 325 BGB?
  back: Das Recht, Schadensersatz zu verlangen, wird durch den Ruecktritt nicht ausgeschlossen
    (§ 325 BGB). Der Glaeubiger kann also - anders als man wegen der Rueckabwicklungsfolgen
    vermuten koennte - sowohl vom Vertrag zuruecktreten (§ 323 BGB) als auch daneben
    Schadensersatz statt der Leistung verlangen; beide Rechtsfolgen schliessen sich
    nicht gegenseitig aus, sondern ergaenzen sich (der Ruecktritt beseitigt die primaeren
    Leistungspflichten, der Schadensersatz gleicht den verbleibenden Vermoegensschaden
    aus).
  norms:
  - § 325 BGB
  - § 323 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
