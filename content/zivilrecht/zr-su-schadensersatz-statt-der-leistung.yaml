cards:
- slug: zr-su-se-statt-leistung-systematik-280
  type: definition
  front: Wie ist der Schadensersatz statt der Leistung in § 280 BGB systematisch verankert?
  back: '§ 280 Abs. 1 BGB enthält den Grundtatbestand für Schadensersatz wegen einer
    Pflichtverletzung. Will der Gläubiger Schadensersatz STATT der Leistung - also
    als Ersatz für die ausbleibende Leistung selbst, nicht nur für einen Verspätungs-
    oder Begleitschaden -, so kann er dies nur unter den zusätzlichen Voraussetzungen
    der §§ 281, 282 oder 283 BGB verlangen (§ 280 Abs. 3 BGB). § 281 BGB regelt den
    Hauptfall: Nichtleistung oder nicht vertragsgemäße Leistung trotz Möglichkeit
    der Leistung.'
  norms:
  - § 280 Abs. 1 BGB
  - § 280 Abs. 3 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-su-se-statt-leistung-voraussetzungen-281-1
  type: definition
  front: Nenne die Voraussetzungen des § 281 Abs. 1 BGB
  back: Der Gläubiger kann Schadensersatz statt der Leistung verlangen, wenn der
    Schuldner eine fällige, durchsetzbare Leistung nicht oder nicht vertragsgemäß
    erbringt und der Gläubiger dem Schuldner erfolglos eine angemessene Frist zur
    Leistung oder Nacherfüllung bestimmt hat (§ 281 Abs. 1 S. 1 BGB). Bei einer nicht
    vertragsgemäßen Leistung ist Schadensersatz statt der ganzen Leistung nur zu
    verlangen, wenn die Pflichtverletzung nicht unerheblich ist (§ 281 Abs. 1 S. 3
    BGB). Hinzukommen muss das Vertretenmüssen des Schuldners (§ 280 Abs. 1 S. 2
    BGB).
  norms:
  - § 281 Abs. 1 BGB
  - § 280 Abs. 1 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-su-se-statt-leistung-fristentbehrlichkeit-281-2
  type: definition
  front: Wann ist die Fristsetzung nach § 281 Abs. 2 BGB entbehrlich?
  back: Die Fristsetzung ist entbehrlich, wenn der Schuldner die Leistung ernsthaft
    und endgültig verweigert oder wenn besondere Umstände vorliegen, die unter Abwägung
    der beiderseitigen Interessen die sofortige Geltendmachung des Schadensersatzanspruchs
    rechtfertigen (§ 281 Abs. 2 BGB). Diese Fallgruppen entsprechen denen der Mahnungsentbehrlichkeit
    in § 286 Abs. 2 Nr. 3 und Nr. 4 BGB.
  norms:
  - § 281 Abs. 2 BGB
  - § 286 Abs. 2 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-su-se-statt-leistung-ausschluss-281-4
  type: definition
  front: Welche Wirkung hat das Verlangen von Schadensersatz statt der ganzen Leistung,
    § 281 Abs. 4 BGB?
  back: 'Sobald der Gläubiger Schadensersatz statt der ganzen Leistung verlangt,
    ist der Anspruch auf die Leistung selbst ausgeschlossen (§ 281 Abs. 4 BGB). Der
    Gläubiger muss sich also entscheiden: Er kann nicht zugleich die ursprüngliche
    Leistung und den vollen Schadensersatz statt dieser Leistung fordern - andernfalls
    stünde er besser, als wenn ordnungsgemäß erfüllt worden wäre.'
  norms:
  - § 281 Abs. 4 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-su-se-statt-leistung-rueckgewaehr-281-5
  type: definition
  front: Was regelt § 281 Abs. 5 BGB für bereits erbrachte Leistungen?
  back: Verlangt der Gläubiger Schadensersatz statt der ganzen Leistung, so ist der
    Schuldner berechtigt, vom Gläubiger die Herausgabe einer bereits erhaltenen Leistung
    nach den Vorschriften über den Rücktritt zu verlangen (§ 281 Abs. 5 BGB), und
    umgekehrt der Gläubiger seine eigene Vorleistung zurückzuverlangen. Es entsteht
    also ein Rückgewährschuldverhältnis entsprechend den §§ 346 bis 348 BGB.
  norms:
  - § 281 Abs. 5 BGB
  - § 346 Abs. 1 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-su-se-statt-leistung-abgrenzung-283
  type: definition
  front: Wie unterscheiden sich § 281 BGB und § 283 BGB?
  back: § 281 BGB setzt voraus, dass die Leistung noch möglich ist, der Schuldner
    sie aber trotz Fristsetzung nicht erbringt. § 283 BGB erfasst dagegen den Fall,
    dass der Schuldner nach § 275 Abs. 1 bis 3 BGB von der Leistungspflicht befreit
    ist, die Leistung also (nachträglich) unmöglich geworden ist. Weil eine Fristsetzung
    zu einer unmöglichen Leistung sinnlos wäre, verlangt § 283 BGB keine Frist,
    sondern verweist unmittelbar auf die Voraussetzungen des § 280 Abs. 1 BGB.
  norms:
  - § 283 BGB
  - § 275 Abs. 1 BGB
  - § 280 Abs. 1 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-su-se-statt-leistung-ruecktritt-325
  type: definition
  front: Wie verhält sich der Anspruch auf Schadensersatz statt der Leistung zum
    Rücktritt, § 325 BGB?
  back: Das Recht, Schadensersatz zu verlangen, wird durch den Rücktritt nicht ausgeschlossen
    (§ 325 BGB). Der Gläubiger kann also - anders als man wegen der Rückabwicklungsfolgen
    vermuten könnte - sowohl vom Vertrag zurücktreten (§ 323 BGB) als auch daneben
    Schadensersatz statt der Leistung verlangen; beide Rechtsfolgen schließen sich
    nicht gegenseitig aus, sondern ergänzen sich (der Rücktritt beseitigt die primären
    Leistungspflichten, der Schadensersatz gleicht den verbleibenden Vermögensschaden
    aus).
  norms:
  - § 325 BGB
  - § 323 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
