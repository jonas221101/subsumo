faelle:
- slug: zr-fall-verzoegertes-atelierregal
  title: Das Atelierregal
  difficulty: 3
  minutes: 40
  quellen:
  - Eigener Sachverhalt der Redaktion
  - BGB, amtliche Fassung
  facts: Malerin M beauftragt Tischler T, ein maszgefertigtes Regal fuer ihr Atelier
    herzustellen und binnen vier Wochen zu liefern; Werklohn 1.200 EUR, den M vertragsgemaess
    vollstaendig im Voraus bezahlt. Nach vier Wochen liefert T nicht. M setzt T daraufhin
    schriftlich eine Frist von zwei weiteren Wochen und erklaert, sie werde sich danach
    anderweitig ein Regal beschaffen. Auch nach Ablauf dieser Frist liefert T nicht.
    M kauft daraufhin bei einem anderen Anbieter ein vergleichbares Regal fuer 1.500
    EUR. Sie verlangt von T die Rueckzahlung der 1.200 EUR sowie Ersatz der 300 EUR
    Mehrkosten des Ersatzkaufs.
  question: Hat M gegen T einen Anspruch auf Rueckzahlung der 1.200 EUR und auf Ersatz
    der 300 EUR Mehrkosten?
  steps:
  - prompt: Welche Anspruchsgrundlage stuetzt den Anspruch auf die 300 EUR Mehrkosten?
    erwartung: §§ 280 Abs. 1, 3, 281 BGB - Schadensersatz statt der Leistung.
  - prompt: Waren die Voraussetzungen des § 281 Abs. 1 BGB erfuellt?
    erwartung: 'Ja: T hat trotz Faelligkeit nach vier Wochen nicht geliefert, und
      M hat ihm erfolglos eine angemessene Frist von zwei Wochen zur Leistung gesetzt.'
  - prompt: Welche Rechtsfolge hat das Verlangen von Schadensersatz statt der ganzen
      Leistung fuer den urspruenglichen Werklohnanspruch bzw. die bereits erbrachte
      Vorauszahlung?
    erwartung: Der Leistungsanspruch ist ausgeschlossen (§ 281 Abs. 4 BGB); die bereits
      geleistete Vorauszahlung von 1.200 EUR ist nach § 281 Abs. 5 BGB iVm § 346 Abs.
      1 BGB zurueckzugewaehren.
  - prompt: Waere der Schadensersatzanspruch ausgeschlossen, wenn M zusaetzlich vom
      Vertrag zuruecktreten wuerde?
    erwartung: Nein, § 325 BGB stellt klar, dass der Ruecktritt den Anspruch auf Schadensersatz
      nicht ausschliesst.
