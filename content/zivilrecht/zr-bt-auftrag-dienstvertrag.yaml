- slug: zr-schema-auftr-670
  title: Aufwendungsersatzanspruch des Beauftragten, § 670 BGB
  norms:
  - § 662 BGB
  - § 670 BGB
  - § 669 BGB
  - § 667 BGB
  quellen:
  - BGB, amtliche Fassung
