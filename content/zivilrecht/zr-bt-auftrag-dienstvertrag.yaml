  steps:
  - label: I. Auftrag, § 662 BGB
    hinweis: Einigung über unentgeltliche Besorgung eines Geschäfts; Rechtsbindungswille,
      Abgrenzung zur Gefälligkeit.
  - label: II. Aufwendungen des Beauftragten
    hinweis: Freiwillige Vermögensopfer zum Zwecke der Ausführung (und auftragstypische Risiken).
  - label: III. Erforderlichkeit
    hinweis: 'Maßstab: Der Beauftragte durfte die Aufwendungen den Umständen nach für erforderlich
      halten (Sicht ex ante).'
  - label: IV. Rechtsfolge
    hinweis: Ersatz der Aufwendungen, ggf. Vorschuss (§ 669 BGB); Gegenansprüche des Auftraggebers
      auf Herausgabe, § 667 BGB, und Aufrechnung, §§ 387 ff. BGB.
faelle:
- slug: zr-fall-auftr-klavier
  title: Das Klavier aus der Nachbarstadt
  difficulty: 2
  minutes: 40
  quellen:
  - Eigener Sachverhalt der Redaktion
  - BGB, amtliche Fassung
  facts: Der Freund A bittet B, für ihn bei einem Händler in der 80 Kilometer entfernten Stadt
    ein gebrauchtes Klavier zu kaufen, das A dort besichtigt und zu einem Preis bis höchstens
    3.000 Euro ausgesucht hat. B sagt unentgeltlich zu; er soll das Klavier mit einem Transporter
    abholen. A zahlt B vorab 3.000 Euro in bar. B kauft das Klavier für 2.600 Euro und mietet
    für den Transport einen Transporter für 120 Euro, tankt für 30 Euro und liefert das Klavier
    bei A ab. A verlangt von B den nicht verbrauchten Vorschuss von 400 Euro zurück. B verlangt
    von A Ersatz der Transport- und Spritkosten von 150 Euro und meint, er habe die Sache
    umsonst gemacht und könne deshalb nichts verlangen. Der Händler hat dem B das Eigentum
    am Klavier übertragen.
  question: Welche Ansprüche haben A und B gegeneinander, und was muss im Ergebnis gezahlt
    werden?
  steps:
  - prompt: Welcher Vertrag liegt vor?
    erwartung: 'Ein Auftrag nach § 662 BGB: B hat sich verpflichtet, ein Geschäft für A unentgeltlich
      zu besorgen. Der Rechtsbindungswille ist aufgrund des nicht unerheblichen Werts (Klavier,
      2.600 Euro), des wirtschaftlichen Interesses des A und der Überlassung eines Vorschusses
      zu bejahen; es handelt sich nicht um eine bloße Gefälligkeit.'
  - prompt: Hat B einen Anspruch auf Ersatz seiner Kosten?
    erwartung: 'Ja. Nach § 670 BGB kann B Ersatz der Aufwendungen verlangen, die er den Umständen
      nach für erforderlich halten durfte. Mietkosten des Transporters (120 Euro) und Kraftstoff
      (30 Euro) waren für den Transport erforderlich. Die Unentgeltlichkeit des Auftrags
      betrifft nur die Vergütung; der Aufwendungsersatz bleibt davon unberührt.'
  - prompt: Hat A einen Anspruch auf Rückzahlung des Vorschusses und auf das Klavier?
    erwartung: Ja. Nach § 667 BGB muss B alles herausgeben, was er zur Ausführung des Auftrags
      erhalten und aus der Geschäftsbesorgung erlangt hat. Das ist das Klavier (Übereignung
      an A) und der nicht verbrauchte Teil des Vorschusses von 400 Euro (3.000 Euro minus
      2.600 Euro).
  - prompt: Ergebnis?
    erwartung: Die gegenseitigen Zahlungsansprüche (400 Euro von B an A; 150 Euro von A an
      B) sind gleichartig und können aufgerechnet werden (§§ 387, 389 BGB). B muss im Ergebnis
      250 Euro an A zahlen und das Klavier übereignen.
  expectation:
