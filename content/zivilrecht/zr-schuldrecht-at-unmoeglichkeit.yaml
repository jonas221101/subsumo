cards:
- slug: zr-su-unmoeglichkeit-begriff
  type: definition
  front: 'Definiere: Unmöglichkeit und ihre Rechtsfolge (§ 275 Abs. 1 BGB)'
  back: Unmöglichkeit liegt vor, wenn die Leistung für den Schuldner oder für jedermann
    tatsächlich oder rechtlich nicht erbracht werden kann. Nach § 275 Abs. 1 BGB
    ist der Anspruch auf die Leistung dann ausgeschlossen - die Norm wirkt als Einwendung,
    die von Amts wegen zu berücksichtigen ist, nicht als Einrede.
  norms:
  - § 275 Abs. 1 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-su-unmoeglichkeit-abgrenzung-subj-obj
  type: streitstand
  front: 'Abgrenze: objektive und subjektive Unmöglichkeit'
  back: Objektive Unmöglichkeit liegt vor, wenn die Leistung von niemandem erbracht
    werden kann. Subjektive Unmöglichkeit (Unvermögen) liegt vor, wenn nur der konkrete
    Schuldner die Leistung nicht erbringen kann, ein Dritter aber könnte. § 275 Abs.
    1 BGB erfasst nach heute einhelliger Auffassung beide Fälle gleichermaßen -
    die früher relevante Unterscheidung wirkt sich nur noch beim Vertretenmüssen
    (§ 276 BGB) aus, nicht mehr beim Ausschluss der Leistungspflicht selbst.
  norms:
  - § 275 Abs. 1 BGB
  - § 276 BGB
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-su-praktische-unmoeglichkeit
  type: definition
  front: 'Definiere: Praktische (wirtschaftliche) Unmöglichkeit, § 275 Abs. 2 BGB'
  back: Nach § 275 Abs. 2 BGB kann der Schuldner die Leistung verweigern, wenn sie
    einen Aufwand erfordert, der unter Beachtung des Leistungsinhalts und der Gebote
    von Treu und Glauben in einem groben Missverhältnis zum Leistungsinteresse des
    Gläubigers steht. Anders als Absatz 1 begründet Absatz 2 nur eine Einrede -
    der Schuldner muss sich darauf berufen, das Gericht berücksichtigt sie nicht
    von Amts wegen.
  norms:
  - § 275 Abs. 2 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-su-unzumutbarkeit-persoenlich
  type: definition
  front: 'Definiere: Persönliche Unzumutbarkeit, § 275 Abs. 3 BGB'
  back: Bei einer in Person zu erbringenden Leistung (z. B. künstlerische oder höchstpersönliche
    Dienste) kann der Schuldner die Leistung verweigern, wenn sie ihm unter Abwägung
    mit dem Leistungsinteresse des Gläubigers nicht zugemutet werden kann. Ebenfalls
    nur eine Einrede, anders als der von Amts wegen zu beachtende Absatz 1.
  norms:
  - § 275 Abs. 3 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-su-283-schadensersatz
  type: norm
  front: Was regelt § 283 BGB und warum ist dort keine Fristsetzung erforderlich?
  back: § 283 S. 1 BGB gewährt dem Gläubiger Schadensersatz statt der Leistung,
    wenn der Schuldner nach § 275 Abs. 1 bis 3 BGB nicht zu leisten braucht und er
    die Unmöglichkeit gemäß § 280 Abs. 1 BGB zu vertreten hat. Eine Fristsetzung
    wie bei § 281 BGB wäre hier sinnlos, weil die Leistung ohnehin nicht mehr nachgeholt
    werden kann - deshalb verweist § 283 BGB nur auf § 280 Abs. 1 BGB, nicht auf §
    281 BGB.
  norms:
  - § 283 BGB
  - § 280 Abs. 1 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-su-anfaengliche-nachtraegliche-unmoeglichkeit
  type: streitstand
  front: 'Abgrenze: anfängliche und nachträgliche Unmöglichkeit - Bedeutung für
    den Vertrag'
  back: Nachträgliche Unmöglichkeit tritt erst nach Vertragsschluss ein; der Vertrag
    bleibt wirksam, die Leistungspflicht entfällt nur nach § 275 BGB. Anfängliche
    Unmöglichkeit besteht schon bei Vertragsschluss; seit der Schuldrechtsreform
    steht § 311a Abs. 1 BGB klar, dass dies der Wirksamkeit des Vertrags nicht entgegensteht
    - der Gläubiger kann stattdessen nach § 311a Abs. 2 BGB Schadensersatz statt
    der Leistung verlangen, wenn der Schuldner das Leistungshindernis bei Vertragsschluss
    kannte oder hätte kennen müssen.
  norms:
  - § 311a Abs. 1 BGB
  - § 311a Abs. 2 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-su-stellvertretendes-commodum
  type: definition
  front: 'Definiere: Stellvertretendes commodum, § 285 BGB'
  back: Erlangt der Schuldner infolge des Umstands, der ihn nach § 275 Abs. 1 bis
    3 BGB von der Leistung befreit, einen Ersatz oder einen Ersatzanspruch (z. B.
    eine Versicherungsleistung oder einen Anspruch gegen einen Schädiger), kann der
    Gläubiger nach § 285 Abs. 1 BGB Herausgabe des Ersatzes oder Abtretung des Ersatzanspruchs
    verlangen - anstelle oder neben einem Schadensersatzanspruch.
  norms:
  - § 285 Abs. 1 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
schemata:
- slug: zr-schema-283-unmoeglichkeit
  title: Schadensersatz statt der Leistung wegen Unmöglichkeit, §§ 280 Abs. 1, 283
    BGB
  norms:
  - § 280 Abs. 1 BGB
  - § 283 BGB
  - § 275 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  steps:
  - label: I. Schuldverhältnis
    hinweis: Meist ein Vertrag, z. B. Kaufvertrag § 433 BGB.
  - label: II. Ausschluss der Leistungspflicht, § 275 Abs. 1-3 BGB
    children:
    - label: 1. Tatsächliche oder rechtliche Unmöglichkeit (Abs. 1)
    - label: 2. Grobes Missverhältnis von Aufwand und Leistungsinteresse (Abs. 2)
      hinweis: Nur prüfen, wenn der Sachverhalt dazu Anlass gibt - Einrede.
    - label: 3. Persönliche Unzumutbarkeit bei höchstpersönlicher Leistung (Abs.
        3)
      hinweis: Nur bei in Person zu erbringenden Leistungen - Einrede.
  - label: III. Vertretenmüssen des Schuldners, § 280 Abs. 1 S. 2 BGB
    hinweis: 'Wird vermutet; der Schuldner müsste sich entlasten (§ 276 BGB: Vorsatz,
      Fahrlässigkeit).'
  - label: IV. Keine Fristsetzung erforderlich, § 283 S. 1 BGB
    hinweis: Anders als bei § 281 BGB - eine Nachfrist wäre bei Unmöglichkeit sinnlos.
  - label: V. Schaden und haftungsausfüllende Kausalität
  - label: 'VI. Rechtsfolge: Schadensersatz statt der Leistung'
faelle:
- slug: zr-fall-zerstoertes-motorrad
  title: Das zerstörte Motorrad
  difficulty: 3
  minutes: 60
  quellen:
  - Eigener Sachverhalt der Redaktion
  - BGB, amtliche Fassung
  facts: Verkäufer V verkauft dem Käufer K ein bestimmtes gebrauchtes Motorrad (Baujahr
    2015, im Kaufvertrag über die Fahrgestellnummer eindeutig bezeichnet) für 3.000
    Euro. Übergabe und Bezahlung sollen eine Woche später bei V erfolgen. Zwei Tage
    vor dem vereinbarten Termin will V das Motorrad zu einer Wartung fahren und übersieht
    dabei fahrlässig eine rote Ampel; er verursacht einen Unfall, bei dem das Motorrad
    irreparabel zerstört wird. Ein Motorrad mit identischer Ausstattung und identischem
    Kilometerstand ist auf dem Gebrauchtmarkt zu denselben Konditionen nicht mehr
    zu beschaffen. K muss ein vergleichbares Ersatzmotorrad anderweitig für 3.500
    Euro kaufen und verlangt von V Ersatz der Differenz von 500 Euro.
  question: Hat K gegen V einen Anspruch auf Schadensersatz statt der Leistung in
    Höhe von 500 Euro aus §§ 280 Abs. 1, 283 BGB?
  steps:
  - prompt: Formuliere den Obersatz.
    erwartung: K könnte gegen V einen Anspruch auf Schadensersatz statt der Leistung
      in Höhe von 500 Euro aus §§ 280 Abs. 1, 283 BGB haben.
  - prompt: Welches Schuldverhältnis besteht zwischen K und V?
    erwartung: Ein wirksamer Kaufvertrag über das Motorrad, § 433 BGB.
  - prompt: Ist die Leistungspflicht des V ausgeschlossen?
    erwartung: 'Ja, § 275 Abs. 1 BGB: Das konkret geschuldete Motorrad ist eine Stückschuld
      und durch den Unfall vollständig zerstört worden; ein identisches Stück kann
      nicht mehr geliefert werden - tatsächliche Unmöglichkeit.'
  - prompt: Hat V die Unmöglichkeit zu vertreten?
    erwartung: 'Ja, § 280 Abs. 1 S. 2 BGB (Vermutung) i. V. m. § 276 BGB: V hat den
      Unfall durch das fahrlässige Überfahren der roten Ampel selbst verschuldet.'
  - prompt: Muss K dem V vor der Geltendmachung von Schadensersatz eine Frist setzen?
    erwartung: Nein. § 283 S. 1 BGB verweist gerade nicht auf das Fristsetzungserfordernis
      des § 281 BGB, weil die Leistung ohnehin nicht mehr nachgeholt werden kann.
  - prompt: Wie hoch ist der ersatzfähige Schaden?
    erwartung: 500 Euro - die Differenz zwischen dem vereinbarten Kaufpreis (3.000
      Euro) und den Kosten der Ersatzbeschaffung (3.500 Euro).
