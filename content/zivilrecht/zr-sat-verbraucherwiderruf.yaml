- slug: zr-schema-widr-widerruf
  title: Wirksamer Widerruf eines Verbrauchervertrags, §§ 312g, 355 BGB
  norms:
  - § 312g Abs. 1 BGB
  - § 355 BGB
  - § 357 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  steps:
  - label: I. Widerrufsrecht
    children:
    - label: 1. Verbrauchervertrag, § 312 Abs. 1, §§ 13, 14 BGB
    - label: 2. Außerhalb von Geschäftsräumen (§ 312b BGB) oder Fernabsatz (§ 312c
        BGB)
    - label: 3. Kein Ausschluss nach § 312g Abs. 2 BGB
      hinweis: Etwa Maßanfertigung, schnell verderbliche Ware, entsiegelte Hygieneartikel.
  - label: II. Widerrufserklärung, § 355 Abs. 1 BGB
    hinweis: Eindeutig, formfrei, gegenüber dem Unternehmer; keine Begründung nötig.
  - label: III. Widerrufsfrist, § 355 Abs. 2, § 356 BGB
    children:
    - label: 1. 14 Tage ab Fristbeginn (Erhalt der Ware, Vertragsschluss bei Dienstleistung)
    - label: 2. Ordnungsgemäße Belehrung - sonst kein Fristbeginn
    - label: 3. Fristwahrung durch rechtzeitige Absendung
    - label: 4. Erlöschen spätestens 12 Monate und 14 Tage ohne Belehrung, § 356 Abs. 4 BGB
  - label: IV. Rechtsfolgen, §§ 355 Abs. 3, 357, 357a, 361 BGB
    children:
    - label: 1. Rückgewähr der Leistungen binnen 14 Tagen
    - label: 2. Rücksendekosten und Wertersatz
    - label: 3. Verbundene Verträge, §§ 358, 359 BGB
faelle:
- slug: zr-fall-widr-notebook
  title: Notebook und Küchenfront im Onlinehandel
  difficulty: 2
  minutes: 40
  quellen:
  - Eigener Sachverhalt der Redaktion
  - BGB, amtliche Fassung
  facts: >-
    Verbraucherin A bestellt am 2. Mai im Internetshop des Händlers H zwei Waren:
    ein serienmäßiges Notebook für 900 Euro und eine nach ihren Maßangaben angefertigte
    Küchenfront für 1.500 Euro. H hat A vor Vertragsschluss ordnungsgemäß in Textform
    über das Widerrufsrecht belehrt und sie darüber unterrichtet, dass sie bei Widerruf
    die Rücksendekosten trägt. Das Notebook wird am 4. Mai geliefert, die Küchenfront am 12. Mai.
    A packt das Notebook aus, startet es und prüft kurz die Funktionen. Am 15. Mai
    erklärt A per E-Mail gegenüber H, sie widerrufe beide Verträge. H verweigert den
    Widerruf der Küchenfront und verlangt außerdem für das Notebook Wertersatz wegen
    der Inbetriebnahme.
  question: >-
    Kann A beide Verträge widerrufen und welche Ansprüche bestehen bezüglich des
    Notebooks?
  steps:
  - prompt: Liegt ein widerrufbarer Vertrag vor und warum?
    erwartung: >-
      Verbrauchervertrag nach § 312 Abs. 1 BGB (A ist Verbraucherin nach § 13 BGB,
      H Unternehmer nach § 14 BGB); beide Verträge wurden ausschließlich über Fernkommunikationsmittel
      im Fernabsatz geschlossen (§ 312c BGB). Damit besteht grundsätzlich ein Widerrufsrecht
      nach § 312g Abs. 1 BGB.
  - prompt: Ist der Widerruf des Notebook-Kaufs fristgerecht erklärt?
    erwartung: >-
      Ja. Die 14-tägige Frist (§ 355 Abs. 2 BGB) beginnt mit dem Erhalt der Ware
      (§ 356 Abs. 2 Nr. 1 BGB), die Belehrung wurde ordnungsgemäß erteilt. Beim Notebook
      ist das der 4. Mai; wegen der einheitlichen Bestellung mehrerer getrennt gelieferter
      Waren beginnt die Frist sogar erst mit dem Erhalt der letzten Ware am 12. Mai
      (§ 356 Abs. 2 Nr. 1 Buchst. b BGB). Die E-Mail vom 15. Mai genügt als formfreie Erklärung
      und wahrt die Frist in jedem Fall.
  - prompt: Ist der Widerruf bezüglich der Küchenfront ausgeschlossen?
    erwartung: >-
      Ja. Die Küchenfront wurde nach den Maßangaben der A angefertigt, sodass die
      Ausnahme des § 312g Abs. 2 S. 1 Nr. 1 BGB eingreift. Ein Widerrufsrecht besteht
      insoweit nicht.
  - prompt: Welche Pflichten bestehen nach dem Widerruf des Notebook-Kaufs?
    erwartung: >-
      Rückgewähr nach § 357 BGB: H muss den Kaufpreis erstatten (darf die Rückzahlung
      bis zum Erhalt oder Nachweis der Rücksendung verweigern), A muss das Notebook
      binnen 14 Tagen zurücksenden (§ 357 Abs. 1 BGB) und trägt die Rücksendekosten, weil
      sie hierüber unterrichtet wurde (§ 357 Abs. 5 BGB).
  - prompt: Kann H Wertersatz für die Inbetriebnahme verlangen?
    erwartung: >-
      Nein. Wertersatz setzt nach § 357a BGB einen Wertverlust voraus, der auf einen
      Umgang zurückzuführen ist, der zur Prüfung von Beschaffenheit, Eigenschaften
      und Funktionsweise nicht notwendig war. Auspacken, Starten und kurzes Prüfen
      sind zur Prüfung notwendig, wie sie auch im Ladengeschäft möglich wäre.
  expectation:
