  title: >-
    Gesetzlicher Eigentumserwerb: Verbindung, Vermischung, Verarbeitung, Fund, Ersitzung
  parent: zr-sachenrecht-eigentumsherausgabe-985
  relevance: 4
  stand: 2026-10
  redaktion:
    erzeugt_von: claude-sonnet (Pflichtstoff-Vervollständigung)
    status: in-pruefung
