faelle:
- slug: zr-fall-ger-tisch
  title: Der verwechselte Holzstapel
  difficulty: 3
  minutes: 40
  quellen:
  - Eigener Sachverhalt der Redaktion
  - BGB, amtliche Fassung
  facts: >-
    Schreiner S baut aus Eichenholz einen Esstisch (Verkaufswert 2.400 Euro). Das
    Holz (Wert 300 Euro) gehörte nicht ihm, sondern dem Händler E: S hatte in seinem
    Lager zwei gleich aussehende Stapel verwechselt, ohne die Etiketten zu prüfen.
    Die Arbeit des S ist handwerklich aufwendig; der Wert der Verarbeitung beträgt
    1.800 Euro. E verlangt von S den Tisch heraus, hilfsweise Ersatz.
  question: Wem gehört der Tisch, und welche Ansprüche hat E gegen S?
  steps:
  - prompt: Kann E den Tisch nach § 985 BGB herausverlangen?
    erwartung: >-
      Nein, wenn E sein Eigentum verloren hat. S ist Hersteller einer neuen Sache
      und erwirbt das Eigentum an dem Tisch nach § 950 Abs. 1 S. 1 BGB, denn der Wert
      der Verarbeitung (1.800 Euro) ist nicht erheblich geringer als der Stoffwert
      (300 Euro).
  - prompt: Erlöschen Rechte des E am Holz?
    erwartung: >-
      Ja, mit dem Eigentumserwerb des S erlischt das Eigentum des E an dem Holz (§
      950 Abs. 2 BGB).
  - prompt: Welcher Ausgleichsanspruch besteht?
    erwartung: >-
      E hat einen Anspruch aus § 951 Abs. 1 S. 1 BGB i. V. m. § 812 Abs. 1 S. 1 Alt.
      2 BGB auf Vergütung in Geld in Höhe des Wertes des verlorenen Rechts, also 300
      Euro. S ist in dieser Höhe bereichert; ein Rechtsgrund besteht nicht, und eine
      Leistung des E liegt nicht vor. Nicht der Wert des Tisches ist maßgeblich.
  - prompt: Besteht daneben ein deliktischer Anspruch?
    erwartung: >-
      Ja, § 823 Abs. 1 BGB (Eigentumsverletzung durch den Verlust nach § 950 BGB),
      da S das Holz bei Anwendung der erforderlichen Sorgfalt (Prüfen der Etiketten)
      nicht verwechselt hätte, § 276 Abs. 2 BGB. § 951 Abs. 2 S. 1 BGB lässt dies
      unberührt. Der Schaden beträgt ebenfalls 300 Euro (Wiederbeschaffungswert),
      eine Doppelung findet nicht statt.
  expectation:
    pruefpunkte:
    - id: p1
      label: >-
        Eigentumserwerb des S an dem Tisch nach § 950 Abs. 1 BGB (neue Sache, Hersteller,
        Wertvergleich)
      weight: 3.0
      required: true
      norms:
      - § 950 Abs. 1 BGB
      keywords:
      - § 950 Abs. 1
      - Verarbeitung
      - neue Sache
      - Hersteller
      - Wert der Verarbeitung
      card_slugs:
      - zr-ger-950-verarbeitung
      - zr-ger-hersteller-950
    - id: p2
      label: >-
        Kein Herausgabeanspruch aus § 985 BGB, weil E sein Eigentum verloren hat
      weight: 1.5
      required: true
      norms:
      - § 985 BGB
      - § 950 Abs. 2 BGB
      keywords:
      - § 985
      - Eigentum verloren
      - Eigentum erloschen
      - § 950 Abs. 2
      - kein Herausgabeanspruch
      card_slugs:
      - zr-ger-950-verarbeitung
    - id: p3
      label: >-
        Ausgleichsanspruch aus § 951 Abs. 1 BGB als Eingriffskondiktion in Höhe von
        300 Euro
      weight: 3.0
      required: true
      norms:
      - § 951 Abs. 1 BGB
      - § 812 Abs. 1 S. 1 Alt. 2 BGB
      keywords:
      - § 951
      - Eingriffskondiktion
      - § 812 Abs. 1 S. 1 Alt. 2
      - Rechtsgrundverweisung
      - Wert des verlorenen Rechts
      card_slugs:
      - zr-ger-951-ausgleich
    - id: p4
      label: >-
        Deliktischer Anspruch aus § 823 Abs. 1 BGB, unberührt nach § 951 Abs. 2 BGB
      weight: 1.5
      required: false
      norms:
      - § 823 Abs. 1 BGB
      - § 951 Abs. 2 BGB
      keywords:
      - § 823 Abs. 1
      - Eigentumsverletzung
      - § 951 Abs. 2
      - Fahrlässigkeit
      - deliktisch
      card_slugs:
      - zr-ger-951-ausgleich
  stand: 2026-10
