cards:
- slug: zr-buerg-begriff
  type: definition
  front: 'Definiere: Bürgschaft, § 765 BGB'
  back: 'Durch den Bürgschaftsvertrag verpflichtet sich der Bürge gegenüber dem Gläubiger
    eines Dritten, für die Erfüllung der Verbindlichkeit des Dritten (Hauptschuldner) einzustehen
    (§ 765 Abs. 1 BGB). Der Vertrag kommt zwischen Bürge und Gläubiger zustande; der Hauptschuldner
    ist nicht beteiligt. Er ist einseitig verpflichtend, denn nur der Bürge schuldet eine
    Leistung. Die Bürgschaft ist ein Sicherungsmittel (Personalsicherheit) und akzessorisch,
    also in Entstehung, Umfang und Bestand von der Hauptforderung abhängig. Sie kann auch
    für eine künftige oder bedingte Verbindlichkeit übernommen werden (§ 765 Abs. 2 BGB),
    muss aber hinreichend bestimmt sein: Gläubiger, Hauptschuldner und gesicherte Forderung
    müssen erkennbar sein.'
  norms:
  - § 765 Abs. 1 BGB
  - § 765 Abs. 2 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
- slug: zr-buerg-akzessorietaet
  type: norm
  front: Wie wirkt die Akzessorietät der Bürgschaft (§§ 767, 765 BGB)?
  back: Der Bürge haftet für die Hauptschuld in ihrem jeweiligen Bestand (§ 767 Abs. 1 S.
    1 BGB). Die Bürgschaft entsteht daher nur, wenn die gesicherte Forderung entsteht; erlischt
    die Hauptforderung, etwa durch Erfüllung, erlischt auch die Bürgschaft. Eine Minderung
    oder Änderung der Hauptschuld wirkt sich auf die Bürgschaft aus; eine Erweiterung der
    Hauptschuld durch ein Rechtsgeschäft des Hauptschuldners nach Übernahme der Bürgschaft
    erhöht die Haftung des Bürgen aber nicht (§ 767 Abs. 1 S. 3 BGB). Der Bürge haftet ferner
    für Nebenkosten der Rechtsverfolgung (§ 767 Abs. 2 BGB). Wird die Hauptforderung abgetreten,
    geht die Bürgschaft nach § 401 Abs. 1 BGB mit über. Akzessorietät bedeutet auch, dass
    die Bürgschaft nicht entsteht oder erlischt, wenn die Hauptschuld nicht besteht oder erloschen
    ist.
  norms:
  - § 767 Abs. 1 BGB
  - § 767 Abs. 2 BGB
  - § 401 Abs. 1 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
- slug: zr-buerg-form-766
  type: norm
  front: Welche Form verlangt die Bürgschaft (§ 766 BGB, § 350 HGB)?
  back: 'Die Bürgschaftserklärung bedarf der Schriftform (§ 766 S. 1 BGB, § 126 BGB). Die
    elektronische Form ist ausgeschlossen (§ 766 S. 2 BGB). Das Schriftformerfordernis dient
    dem Übereilungsschutz des Bürgen und gilt für die Erklärung des Bürgen, nicht für die
    Annahme durch den Gläubiger. Formmängel führen zur Nichtigkeit nach § 125 S. 1 BGB, werden
    aber geheilt, soweit der Bürge die Hauptverbindlichkeit erfüllt (§ 766 S. 3 BGB). Für
    Kaufleute gilt eine Ausnahme: Die Bürgschaft eines Kaufmanns, die für ihn ein Handelsgeschäft
    ist, ist auch formlos wirksam (§ 350 HGB). Die wesentlichen Inhalte, also Gläubiger, Hauptschuldner
    und gesicherte Forderung, müssen sich aus der Urkunde ergeben.'
  norms:
  - § 766 BGB
  - § 125 BGB
  - § 350 HGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
- slug: zr-buerg-einreden
  type: norm
  front: Welche Einreden hat der Bürge (§§ 768 bis 771 BGB)?
  back: 'Der Bürge kann die dem Hauptschuldner zustehenden Einreden geltend machen (§ 768
    Abs. 1 S. 1 BGB), etwa Verjährung, Stundung oder Zurückbehaltungsrecht. Er verliert sie
    nicht dadurch, dass der Hauptschuldner auf sie verzichtet (§ 768 Abs. 2 BGB). Ficht der
    Hauptschuldner an oder kann der Gläubiger gegen eine fällige Forderung des Hauptschuldners
    aufrechnen, steht dem Bürgen eine Einrede zu (§ 770 BGB); es ist eine Einrede, keine Einwendung.
    Daneben hat der Bürge die Einrede der Vorausklage (§ 771 BGB): Er kann die Befriedigung
    des Gläubigers verweigern, solange dieser nicht ohne Erfolg eine Zwangsvollstreckung gegen
    den Hauptschuldner versucht hat. Sie ist ausgeschlossen bei Verzicht, besonders bei der
    selbstschuldnerischen Bürgschaft (§ 773 Abs. 1 Nr. 1 BGB), bei Zahlungsunfähigkeit des
    Hauptschuldners (Nr. 4) und für Kaufleute im Handelsgeschäft (§ 349 HGB).'
  norms:
  - § 768 BGB
  - § 770 BGB
  - § 771 BGB
  - § 773 BGB
  - § 349 HGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
- slug: zr-buerg-regress-774
  type: norm
  front: Wie nimmt der Bürge Rückgriff (§ 774 BGB)?
  back: Soweit der Bürge den Gläubiger befriedigt, geht die Forderung des Gläubigers gegen
    den Hauptschuldner auf ihn über (§ 774 Abs. 1 S. 1 BGB, gesetzlicher Forderungsübergang).
    Mit der Forderung gehen nach § 401 BGB akzessorische Sicherheiten über. Der Übergang kann
    nicht zum Nachteil des Gläubigers geltend gemacht werden (§ 774 Abs. 1 S. 2 BGB); der
    Gläubiger behält Vorrang, wenn die Mittel nur zu einer Teilbefriedigung reichen. Einwendungen
    des Hauptschuldners bleiben bestehen (§ 774 Abs. 1 S. 3 BGB). Daneben hat der Bürge einen
    Anspruch aus dem Innenverhältnis zum Hauptschuldner, meist Auftrag (§ 670 BGB) oder Geschäftsführung
    ohne Auftrag (§§ 683, 670 BGB). Gibt der Gläubiger eine mit der Forderung verbundene Sicherheit
    auf, wird der Bürge frei, soweit er daraus hätte Ersatz erlangen können (§ 776 BGB).
  norms:
  - § 774 Abs. 1 BGB
  - § 401 BGB
  - § 670 BGB
  - § 776 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
- slug: zr-buerg-bverfg-buergschaft
  type: rechtsprechung
  front: Welche Vorgaben macht das Bundesverfassungsgericht zur Bürgschaft eines strukturell
    unterlegenen Bürgen?
  back: Das Bundesverfassungsgericht hat in der Bürgschaftsentscheidung entschieden, dass
    die Zivilgerichte bei Verträgen, in denen ein Vertragspartner so stark überlegen ist,
    dass er den Vertragsinhalt faktisch einseitig bestimmen kann, und die für den unterlegenen
    Teil ungewöhnlich belastend sind, die Privatautonomie schützen müssen (BVerfGE 89, 214).
    Die Generalklauseln (§§ 138, 242 BGB) sind Einbruchstellen der Grundrechte (Art. 2 Abs.
    1 GG, Sozialstaatsprinzip) in das Privatrecht. Auf dieser Grundlage hat der BGH die Rechtsprechung
    zur sittenwidrigen Angehörigenbürgschaft entwickelt. Die Entscheidung betraf die Bürgschaft
    einer jungen, vermögenslosen Tochter für Verbindlichkeiten ihres Vaters.
  norms:
  - § 138 Abs. 1 BGB
  - § 242 BGB
  - Art. 2 Abs. 1 GG
  quellen:
  - BGB, amtliche Fassung
  - BVerfGE 89, 214 (Bürgschaftsentscheidung)
  - Eigenformulierung Redaktion
- slug: zr-buerg-angehoerigenbuergschaft
  type: definition
  front: 'Definiere: sittenwidrige Angehörigenbürgschaft, § 138 Abs. 1 BGB'
  back: Die Angehörigenbürgschaft ist sittenwidrig und nichtig (§ 138 Abs. 1 BGB), wenn der
    Bürge, meist ein naher Angehöriger oder Lebenspartner des Hauptschuldners, durch die Bürgschaft
    finanziell krass überfordert wird und weitere Umstände hinzutreten. Nach der Rechtsprechung
    des BGH liegt eine krasse finanzielle Überforderung vor, wenn der Bürge voraussichtlich
    nicht einmal die laufenden Zinsen der Hauptschuld aus dem pfändbaren Teil seines Einkommens
    und Vermögens dauerhaft tragen kann. In diesem Fall wird widerleglich vermutet, dass er
    sich aus emotionaler Verbundenheit ohne Rücksicht auf das eigene Risiko verpflichtet hat
    und der Gläubiger dies in sittlich anstößiger Weise ausgenutzt hat. Der Gläubiger kann
    die Vermutung widerlegen, etwa durch ein eigenes wirtschaftliches Interesse des Bürgen
    am Darlehen. Schutzwürdig sind Bürgen nicht, wenn sie als Gesellschafter oder Geschäftsführer
    unmittelbaren Einfluss haben.
  norms:
  - § 138 Abs. 1 BGB
  - § 765 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
- slug: zr-buerg-abgrenzung
  type: definition
  front: 'Abgrenzung: Bürgschaft, Schuldbeitritt und selbstständige Garantie'
  back: 'Die Bürgschaft (§ 765 BGB) ist akzessorisch und formbedürftig (§ 766 BGB). Der Schuldbeitritt
    (kumulative Schuldübernahme) begründet eine eigene Verbindlichkeit des Beitretenden neben
    dem Altschuldner; beide haften als Gesamtschuldner (§ 421 BGB). Er ist formfrei, soweit
    die Hauptschuld keine Form verlangt, und im Bestand nicht akzessorisch. Die selbstständige
    Garantie (§ 311 Abs. 1 BGB) ist ein Vertrag, durch den der Garantiegeber verspricht, für
    einen bestimmten Erfolg oder das Ausbleiben eines Schadens einzustehen; sie ist nicht
    akzessorisch und formfrei, Einwendungen aus dem Verhältnis zwischen Gläubiger und Hauptschuldner
    kann der Garant dem Gläubiger nicht entgegenhalten. Entscheidend ist die Auslegung der
    Erklärung (§§ 133, 157 BGB): Ein wirtschaftliches Eigeninteresse des Erklärenden an der
    Erfüllung spricht für Schuldbeitritt, das Fehlen eines solchen Interesses im Zweifel für
    Bürgschaft. Ein formloser Schuldbeitritt kann einer Umgehung der Formvorschrift dienen
    und ist dann wie die Bürgschaft zu behandeln.'
  norms:
  - § 765 BGB
  - § 766 BGB
  - § 421 BGB
  - § 311 Abs. 1 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
- slug: zr-buerg-arten
  type: definition
  front: Welche Arten von Bürgschaften sind zu unterscheiden?
  back: Bei der gewöhnlichen Bürgschaft steht dem Bürgen die Einrede der Vorausklage zu (§
    771 BGB). Bei der selbstschuldnerischen Bürgschaft hat er auf sie verzichtet (§ 773 Abs.
    1 Nr. 1 BGB), bei Kaufleuten ist sie ohnehin ausgeschlossen (§ 349 HGB). Die Höchstbetragsbürgschaft
    begrenzt die Haftung auf einen festen Betrag, die Ausfallbürgschaft setzt den Ausfall
    des Gläubigers bei der Zwangsvollstreckung voraus. Mitbürgen haften als Gesamtschuldner
    (§ 769 BGB). Ein Nachbürge bürgt für die Erfüllung der Verpflichtung des Bürgen; ein Rückbürge
    sichert den Rückgriffsanspruch. Die Bürgschaft auf erstes Anfordern verpflichtet zur Zahlung
    nach Anforderung, sodass Einwendungen erst im Rückforderungsprozess geprüft werden. Sie
    ist wegen ihrer Härte nur eingeschränkt zulässig, besonders in Allgemeinen Geschäftsbedingungen.
  norms:
  - § 771 BGB
  - § 773 BGB
  - § 769 BGB
  - § 349 HGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
- slug: zr-buerg-globalbuergschaft
  type: rechtsprechung
  front: Ist eine Bürgschaft für alle bestehenden und künftigen Verbindlichkeiten in AGB wirksam?
  back: Der BGH hat entschieden, dass eine in Allgemeinen Geschäftsbedingungen des Gläubigers
    enthaltene weite Zweckerklärung, durch die die Bürgschaft nicht nur die Verbindlichkeit
    sichert, aus Anlass derer sie übernommen wurde, sondern auch alle künftigen Verbindlichkeiten
    des Hauptschuldners aus der Geschäftsverbindung, überraschend und unangemessen benachteiligend
    ist (BGHZ 130, 19). Eine solche Klausel gilt nicht als Vertragsbestandteil (§ 305c Abs.
    1 BGB) und hält der Inhaltskontrolle nicht stand (§ 307 BGB), weil sie das Haftungsrisiko
    des Bürgen unkalkulierbar macht und seine Dispositionsfreiheit aushöhlt. Wirksam bleibt
    die Bürgschaft für die Verbindlichkeit, die der Anlass der Bürgschaft war. Bei individuell
    vereinbarter weiter Zweckerklärung gilt die Beschränkung nicht.
  norms:
  - § 305c Abs. 1 BGB
  - § 307 BGB
  - § 767 Abs. 1 BGB
  quellen:
  - BGB, amtliche Fassung
  - BGHZ 130, 19
  - Eigenformulierung Redaktion
