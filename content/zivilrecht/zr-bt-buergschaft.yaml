faelle:
- slug: zr-fall-buerg-sohn
  title: Die Bürgschaft des Auszubildenden
  difficulty: 3
  minutes: 45
  quellen:
  - Eigener Sachverhalt der Redaktion
  - BGB, amtliche Fassung
  facts: Der Einzelunternehmer Vater V erhält von der Bank B ein Darlehen über 90.000 Euro
    für seinen Betrieb. B verlangt zusätzliche Sicherheiten und lässt sich von V's Sohn S
    (23 Jahre, Auszubildender, Nettoeinkommen 950 Euro, kein Vermögen) eine Bürgschaft über
    90.000 Euro unterschreiben. S ist weder am Betrieb beteiligt noch hat er sonst einen Vorteil
    aus dem Darlehen, die Darlehenssumme fließt allein V zu. Der Bürgschaftsvertrag wird schriftlich
    geschlossen und enthält Betrag, Hauptschuldner und gesicherte Forderung. B kennt die Einkommens-
    und Vermögenssituation des S und die familiäre Beziehung, belehrt S aber nicht über das
    Risiko. Als V zahlungsunfähig wird, nimmt B den S aus der Bürgschaft in Anspruch. Das
    Darlehen ist fällig und unstreitig in Höhe von 90.000 Euro offen.
  question: Kann B von S Zahlung von 90.000 Euro aus der Bürgschaft verlangen?
  steps:
  - prompt: Welche Anspruchsgrundlage kommt in Betracht und welche Wirksamkeitsvoraussetzungen
      sind unproblematisch?
    erwartung: § 765 Abs. 1 BGB. Der Bürgschaftsvertrag wurde schriftlich geschlossen (§ 766
      S. 1 BGB), er ist hinreichend bestimmt, und die Hauptforderung auf Rückzahlung des Darlehens
      (§ 488 Abs. 1 S. 2 BGB) besteht und ist fällig (§ 767 Abs. 1 BGB).
  - prompt: Könnte der Bürgschaftsvertrag nach § 138 Abs. 1 BGB nichtig sein?
    erwartung: 'Ja, wegen Sittenwidrigkeit einer Angehörigenbürgschaft. Zunächst ist S krass
      finanziell überfordert: Bei einem Einkommen von 950 Euro ohne Vermögen kann er nicht
      einmal die laufenden Zinsen der Hauptschuld von 90.000 Euro dauerhaft tragen.'
  - prompt: Welche Vermutung greift, und kann B sie widerlegen?
    erwartung: Weil S als Sohn mit V eng verbunden ist, wird widerleglich vermutet, dass er
      die Bürgschaft aus emotionaler Verbundenheit ohne Rücksicht auf das eigene Risiko übernommen
      hat und B dies ausgenutzt hat. Ein eigenes wirtschaftliches Interesse des S am Darlehen,
      das die Vermutung widerlegen würde, besteht nicht; B hat auch nicht aufgeklärt.
  - prompt: Ergebnis?
    erwartung: Die Bürgschaft ist nach § 138 Abs. 1 BGB nichtig. B hat gegen S keinen Anspruch
      aus § 765 Abs. 1 BGB. Seine Darlehensforderung gegen V bleibt unberührt.
