cards:
- slug: zr-cic-grundgedanke-311-2
  type: definition
  front: 'Definiere: Vorvertragliches Schuldverhältnis (culpa in contrahendo), § 311
    Abs. 2 BGB'
  back: Ein Schuldverhältnis mit Pflichten nach § 241 Abs. 2 BGB entsteht nicht erst
    mit Vertragsschluss, sondern schon durch die Aufnahme von Vertragsverhandlungen,
    die Anbahnung eines Vertrags oder ähnliche geschäftliche Kontakte (§ 311 Abs.
    2 BGB). Bereits in diesem vorvertraglichen Stadium schulden sich die Beteiligten
    gegenseitig Rücksicht auf ihre Rechte, Rechtsgüter und Interessen - eine Verletzung
    dieser Pflichten kann Schadensersatzansprüche auslösen, ohne dass überhaupt
    ein Vertrag zustande kommen muss.
  norms:
  - § 311 Abs. 2 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-cic-verhandlungen-311-2-nr1
  type: norm
  front: Was versteht § 311 Abs. 2 Nr. 1 BGB unter 'Aufnahme von Vertragsverhandlungen'?
  back: Ein Schuldverhältnis nach § 241 Abs. 2 BGB entsteht bereits, wenn die Parteien
    in Verhandlungen über den möglichen Abschluss eines Vertrags eintreten (§ 311
    Abs. 2 Nr. 1 BGB) - etwa durch Austausch von Angeboten, Auskünften oder Vertragsentwürfen.
    Ein bindender Antrag im Sinne des § 145 BGB ist dafür nicht erforderlich; bloße
    Kontaktaufnahme mit Geschäftswillen genügt.
  norms:
  - § 311 Abs. 2 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-cic-anbahnung-311-2-nr2
  type: norm
  front: Was ist mit 'Anbahnung eines Vertrags' nach § 311 Abs. 2 Nr. 2 BGB gemeint?
  back: Ein vorvertragliches Schuldverhältnis entsteht ferner durch die Anbahnung
    eines Vertrags, bei der ein Teil dem anderen im Hinblick auf eine etwaige rechtsgeschäftliche
    Beziehung die Möglichkeit zur Einwirkung auf dessen Rechte, Rechtsgüter und
    Interessen gewährt oder ihm diese anvertraut (§ 311 Abs. 2 Nr. 2 BGB) - klassischer
    Fall ist das Betreten von Geschäftsräumen, etwa zur Besichtigung einer zum Kauf
    angebotenen Sache.
  norms:
  - § 311 Abs. 2 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-cic-schutzpflicht-241-2
  type: definition
  front: 'Definiere: Schutz- und Rücksichtnahmepflichten, § 241 Abs. 2 BGB'
  back: Ein Schuldverhältnis kann nach seinem Inhalt jeden Teil zur Rücksicht auf
    die Rechte, Rechtsgüter und Interessen des anderen Teils verpflichten (§ 241
    Abs. 2 BGB). Anders als die Hauptleistungspflicht ist diese Pflicht nicht auf
    Erfüllung eines Leistungsversprechens gerichtet, sondern schützt den Bestand
    von Rechtsgütern und Vermögen des anderen Teils - dazu gehört insbesondere
    die Pflicht, den anderen über Umstände aufzuklären, die für dessen Entscheidung
    erkennbar erheblich sind.
  norms:
  - § 241 Abs. 2 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-cic-aufklaerungspflicht-kriterien
  type: streitstand
  front: Wann besteht eine Aufklärungspflicht über einen für den Vertragsschluss
    erheblichen Umstand?
  back: Eine Aufklärungspflicht besteht nicht schon deshalb, weil ein Umstand für
    die Entscheidung des anderen Teils von Bedeutung sein könnte - im Grundsatz muss
    sich jede Partei über die für sie wesentlichen Umstände selbst informieren.
    Eine Pflicht zur ungefragten Offenbarung entsteht ausnahmsweise dort, wo der eine
    Teil erkennen kann, dass der Umstand für die Entscheidung des anderen erkennbar
    erheblich ist, dieser die Information redlicherweise erwarten darf, und die Offenbarung
    dem Wissenden zumutbar ist, ohne dessen eigene schutzwürdige Interessen unangemessen
    zu beeinträchtigen. Je gewichtiger der verschwiegene Umstand für die Willensbildung
    des anderen Teils ist, desto eher überwiegt das Aufklärungsinteresse.
  norms:
  - § 241 Abs. 2 BGB
  - § 311 Abs. 2 BGB
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-cic-schadensersatz-280-1
  type: norm
  front: Welche Rechtsfolge knüpft § 280 Abs. 1 BGB an die Verletzung einer Pflicht
    aus § 241 Abs. 2 BGB?
  back: Verletzt der Schuldner eine Pflicht aus einem Schuldverhältnis - auch eine
    Rücksichtnahmepflicht nach § 241 Abs. 2 BGB - kann der Gläubiger Ersatz des
    dadurch entstehenden Schadens verlangen (§ 280 Abs. 1 S. 1 BGB), es sei denn,
    der Schuldner hat die Pflichtverletzung nicht zu vertreten (§ 280 Abs. 1 S. 2
    BGB, widerlegliche Vermutung des Vertretenmüssens zulasten des Schuldners).
  norms:
  - § 280 Abs. 1 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-cic-dritthaftung-311-3
  type: norm
  front: Wann kann ein Schuldverhältnis mit Pflichten nach § 241 Abs. 2 BGB auch
    zu einem Dritten entstehen, § 311 Abs. 3 BGB?
  back: Ein Schuldverhältnis mit Pflichten nach § 241 Abs. 2 BGB kann ausnahmsweise
    auch zu Personen entstehen, die nicht selbst Vertragspartei werden sollen (§ 311
    Abs. 3 S. 1 BGB) - insbesondere, wenn ein Dritter in besonderem Masse Vertrauen
    für sich in Anspruch nimmt und dadurch die Vertragsverhandlungen oder den Vertragsschluss
    erheblich beeinflusst (§ 311 Abs. 3 S. 2 BGB, sogenannte Sachwalterhaftung).
  norms:
  - § 311 Abs. 3 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-cic-rechtsfolge-grosser-kleiner-se
  type: definition
  front: 'Definiere: Großer und kleiner Schadensersatz als Rechtsfolge der c.i.c.'
  back: Der Geschädigte kann im Wege des Schadensersatzes verlangen, so gestellt
    zu werden, wie er ohne die Pflichtverletzung stünde (§ 249 Abs. 1 BGB) - bei
    einer Aufklärungspflichtverletzung beim Vertragsschluss bedeutet das grundsätzlich,
    dass er den Vertrag nicht geschlossen hätte. Er kann deshalb wahlweise die Aufhebung
    des Vertrags gegen Rückgabe der erhaltenen Leistung verlangen (großer Schadensersatz)
    oder den Vertrag bestehen lassen und nur den Minderwert bzw. Mehraufwand ausgleichen
    lassen, den die Pflichtverletzung verursacht hat (kleiner Schadensersatz) - je
    nachdem, welche Gestaltung seinem hypothetischen Verhalten bei pflichtgemäßer
    Aufklärung entspricht.
  norms:
  - § 249 Abs. 1 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
schemata:
- slug: zr-schema-cic-anspruch
  title: Schadensersatzanspruch aus culpa in contrahendo, §§ 280 Abs. 1, 311 Abs.
    2, 241 Abs. 2 BGB
  norms:
  - § 311 Abs. 2 BGB
  - § 241 Abs. 2 BGB
  - § 280 Abs. 1 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  steps:
  - label: I. Vorvertragliches Schuldverhältnis entstanden, § 311 Abs. 2 BGB
    children:
    - label: 1. Aufnahme von Vertragsverhandlungen, Nr. 1
    - label: 2. Vertragsanbahnung, Nr. 2
    - label: 3. Geschäftsähnliche Kontakte, Nr. 3
  - label: 'II. Pflichtverletzung: Verstoß gegen eine Rücksichtnahme- oder Aufklärungspflicht,
      § 241 Abs. 2 BGB'
    hinweis: Aufklärungspflicht nur bei erkennbarer Erheblichkeit des Umstands und
      Zumutbarkeit der Offenbarung.
  - label: III. Vertretenmüssen, § 280 Abs. 1 S. 2 BGB
    hinweis: Vermutet; Entlastung durch den Schuldner möglich.
  - label: IV. Kausaler Schaden
  - label: 'V. Rechtsfolge: Ersatz des Vertrauensschadens'
    children:
    - label: '1. Großer Schadensersatz: Vertragsaufhebung, § 249 Abs. 1 BGB'
    - label: '2. Kleiner Schadensersatz: Ausgleich des Minderwerts bei Vertragsbestand'
faelle:
- slug: zr-fall-gebrauchtwagen-vorschaden
  title: Der verschwiegene Vorschaden
  difficulty: 4
  minutes: 60
  quellen:
  - Eigener Sachverhalt der Redaktion
  - BGB, amtliche Fassung
  facts: Privatverkäuferin V bietet ihren fünf Jahre alten Gebrauchtwagen zum Verkauf
    an. Ihr ist bekannt, dass das Fahrzeug vor zwei Jahren bei einem Auffahrunfall
    einen erheblichen Unfallschaden erlitten hat, der zwar fachgerecht, aber mit hohem
    Aufwand repariert wurde - ein Umstand, der den Marktwert eines vergleichbaren
    unfallfreien Fahrzeugs um 3.000 Euro mindert. Beim Besichtigungstermin fragt Käufer
    K nicht ausdrücklich nach Unfallschäden; V erwähnt den Vorschaden ebenfalls
    nicht, obwohl ihr bewusst ist, dass K das Fahrzeug für unfallfrei hält und den
    vereinbarten Kaufpreis von 12.000 Euro nur deshalb zahlt. Der Kaufvertrag kommt
    zustande und wird vollzogen. Zwei Monate später erfährt K bei einer Inspektion
    vom Vorschaden. Ein vergleichbares tatsächlich unfallfreies Fahrzeug hätte 15.000
    Euro gekostet; ein Fahrzeug mit einem solchen (fachgerecht reparierten) Vorschaden
    hat einen Marktwert von nur 12.000 Euro. K möchte den Wagen behalten, verlangt
    aber von V einen Ausgleich für die Wertminderung.
  question: Kann K von V Ersatz in Höhe von 3.000 Euro verlangen, obwohl er den Wagen
    behalten und den Kaufvertrag nicht rückabwickeln möchte?
  steps:
  - prompt: Formuliere den Obersatz zum Anspruch des K.
    erwartung: K könnte gegen V einen Anspruch auf Schadensersatz aus §§ 280 Abs.
      1, 311 Abs. 2, 241 Abs. 2 BGB (culpa in contrahendo) haben.
  - prompt: Ist zwischen K und V ein vorvertragliches Schuldverhältnis entstanden?
    erwartung: Ja - durch die Aufnahme von Verhandlungen über den Fahrzeugkauf beim
      Besichtigungstermin ist ein Schuldverhältnis nach § 311 Abs. 2 Nr. 1 BGB entstanden.
  - prompt: Bestand für V eine Pflicht, den Vorschaden ungefragt zu offenbaren?
    erwartung: Ja - der Vorschaden mindert den Marktwert erheblich um 3.000 Euro und
      ist damit für die Kaufentscheidung des K erkennbar von wesentlicher Bedeutung;
      V wusste um diese Erheblichkeit und um die Unkenntnis des K, die Offenbarung
      war ihr ohne weiteres zumutbar. Die Pflicht zur Rücksicht auf die Vermögensinteressen
      des K aus § 241 Abs. 2 BGB umfasste daher eine ungefragte Aufklärungspflicht.
  - prompt: Liegt eine Pflichtverletzung vor?
    erwartung: Ja, V hat den ihr bekannten, aufklärungspflichtigen Vorschaden verschwiegen.
  - prompt: Hat V die Pflichtverletzung zu vertreten, § 280 Abs. 1 S. 2 BGB?
    erwartung: Ja - V handelte vorsätzlich, da sie den Vorschaden positiv kannte
      und bewusst verschwieg; ein Entlastungsbeweis ist nicht ersichtlich.
  - prompt: In welcher Form kann K Ersatz verlangen, wenn er den Vertrag nicht rückabwickeln
      möchte?
    erwartung: 'K kann den sogenannten kleinen Schadensersatz verlangen: Er behält
      das Fahrzeug und den Vertrag, erhält aber Ersatz des Minderwerts in Höhe der
      Differenz zwischen dem gezahlten Kaufpreis für ein (vermeintlich) unfallfreies
      Fahrzeug und dem tatsächlichen Wert des Fahrzeugs mit Vorschaden - hier 3.000
      Euro.'
  - prompt: Wie ist das Ergebnis zusammenzufassen?
    erwartung: K kann von V gemäß §§ 280 Abs. 1, 311 Abs. 2, 241 Abs. 2 BGB Ersatz
      von 3.000 Euro als kleinen Schadensersatz verlangen.
  expectation:
    pruefpunkte:
    - id: p1
      label: Vorvertragliches Schuldverhältnis durch Vertragsverhandlungen bejaht,
        § 311 Abs. 2 Nr. 1 BGB
      weight: 1.0
      required: false
      norms:
      - § 311 Abs. 2 BGB
      keywords:
      - '311'
      - Vertragsverhandlungen
      card_slugs:
      - zr-cic-grundgedanke-311-2
      - zr-cic-verhandlungen-311-2-nr1
    - id: p2
      label: Aufklärungspflicht bzgl. des erkennbar preisrelevanten Vorschadens begründet
        (Erkennbarkeit der Erheblichkeit, Zumutbarkeit der Offenbarung)
      weight: 3.0
      required: true
      norms:
      - § 241 Abs. 2 BGB
      keywords:
      - Aufklärungspflicht
      - erheblich
      - zumutbar
      card_slugs:
      - zr-cic-schutzpflicht-241-2
      - zr-cic-aufklaerungspflicht-kriterien
    - id: p3
      label: Pflichtverletzung durch Verschweigen trotz Kenntnis festgestellt
      weight: 1.0
      required: false
      keywords:
      - verschwiegen
      - Pflichtverletzung
    - id: p4
      label: Vertretenmüssen (Vorsatz) der V bejaht, § 280 Abs. 1 S. 2 BGB
      weight: 1.0
      required: false
      norms:
      - § 280 Abs. 1 BGB
      keywords:
      - Vorsatz
      - vertreten
      card_slugs:
      - zr-cic-schadensersatz-280-1
    - id: p5
      label: Wahlrecht zwischen großem und kleinem Schadensersatz erkannt; hier kleiner
        Schadensersatz in Höhe von 3.000 Euro sauber begründet
      weight: 3.0
