faelle:
- slug: zr-fall-zpo-kaufpreisklage
  title: Die Kaufpreisklage und das Versäumnisurteil
  difficulty: 3
  minutes: 45
  quellen:
  - Eigener Sachverhalt der Redaktion
  - ZPO und GVG, amtliche Fassung
  facts: Der in Köln wohnende K verkauft dem in München wohnenden B privat einen Oldtimer
    für 20.000 Euro. B zahlt nicht. K lässt sich von Rechtsanwalt R vertreten und klagt auf
    Zahlung von 20.000 Euro vor dem Landgericht München I. Zum Termin zur mündlichen Verhandlung,
    zu dem B ordnungsgemäß und rechtzeitig geladen war, erscheint B nicht. K beantragt Versäumnisurteil;
    das Gericht erlässt es antragsgemäß. Das Versäumnisurteil wird B am Montag, den 2. März
    2026, zugestellt. B lässt durch seinen Rechtsanwalt am 20. März 2026 Einspruch einlegen,
    ohne Wiedereinsetzungsgründe vorzutragen.
  question: War die Klage zulässig, durfte das Versäumnisurteil ergehen, und hat der Einspruch
    des B Erfolg?
  steps:
  - prompt: Ist das Landgericht München I sachlich und örtlich zuständig?
    erwartung: 'Sachlich: Der Streitwert von 20.000 Euro übersteigt die Grenze des § 23 Nr.
      1 GVG, damit ist das Landgericht zuständig (§ 71 Abs. 1 GVG). Örtlich: B hat in München
      seinen Wohnsitz, allgemeiner Gerichtsstand nach §§ 12, 13 ZPO; zudem Erfüllungsort der
      Geldschuld am Wohnsitz des Schuldners (§ 29 ZPO i. V. m. §§ 269, 270 Abs. 4 BGB).'
  - prompt: Sind die übrigen Zulässigkeitsvoraussetzungen erfüllt?
    erwartung: K und B sind parteifähig und prozessfähig (§§ 50, 52 ZPO). Die Postulationsfähigkeit
      ist durch die Vertretung durch Rechtsanwalt R gewahrt (§ 78 Abs. 1 ZPO). Der Antrag
      ist bestimmt (§ 253 Abs. 2 Nr. 2 ZPO). Die Klage ist zulässig.
  - prompt: Durfte das Versäumnisurteil ergehen?
    erwartung: Ja. Nach § 331 Abs. 1 ZPO ergeht es auf Antrag des Klägers gegen den im Termin
      nicht erschienenen Beklagten, wenn die Klage zulässig und schlüssig ist. Die Ladung
      war ordnungsgemäß und rechtzeitig (§ 335 Abs. 1 Nr. 2 ZPO). Das Tatsachenvorbringen
      des K (Kaufvertrag, Nichtzahlung) gilt als zugestanden und trägt den Antrag aus § 433
      Abs. 2 BGB.
  - prompt: Hat der Einspruch des B Erfolg?
    erwartung: Nein. Der Einspruch muss binnen zwei Wochen ab Zustellung eingelegt werden
      (§ 339 Abs. 1 ZPO, Notfrist). Die Frist lief mit der Zustellung am 2. März 2026 an und
      endete mit Ablauf des 16. März 2026 (§ 222 ZPO, §§ 187, 188 BGB). Der Einspruch vom
      20. März 2026 ist verspätet und wird nach § 341 Abs. 1 ZPO als unzulässig verworfen.
      Eine Wiedereinsetzung (§ 233 ZPO) scheidet mangels Vortrags von Gründen aus. Das Versäumnisurteil
      wird rechtskräftig.
  expectation:
    pruefpunkte:
