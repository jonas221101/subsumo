- slug: zr-schema-vgk-maengelrechte
  title: Zusatzprüfung beim Verbrauchsgüterkauf, §§ 474 ff. BGB
  norms:
  - § 474 BGB
  - § 477 BGB
  - § 475 Abs. 2 BGB
  - § 476 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  steps:
  - label: I. Anwendbarkeit der §§ 474 ff. BGB
    hinweis: Verbraucher (§ 13 BGB) kauft von Unternehmer (§ 14 BGB) eine bewegliche Sache;
      Vorab prüfen, nicht erst bei den Mängelrechten.
  - label: II. Gefahrübergang
    children:
    - label: 1. Übergabe, § 446 BGB
    - label: '2. Versendung: § 447 Abs. 1 BGB nur bei Auswahl des Transporteurs durch den
        Verbraucher, § 475 Abs. 2 BGB'
  - label: III. Sachmangel, § 434 BGB, bei Gefahrübergang
    children:
    - label: 1. Subjektive und objektive Anforderungen, auch Montage und digitale Elemente
    - label: '2. Beweislastumkehr, § 477 BGB: Mangel zeigt sich binnen eines Jahres'
  - label: IV. Mängelrechte, § 437 BGB
    hinweis: 'Reihenfolge: Nacherfüllung, dann Rücktritt oder Minderung, daneben Schadensersatz.'
    children:
    - label: 1. Nacherfüllung nach § 439 BGB mit Sonderregeln des § 475 BGB
    - label: 2. Aus- und Einbaukosten, § 439 Abs. 3 BGB
    - label: '3. Fristsetzung beim Rücktritt: § 475d BGB beachten'
  - label: V. Vereinbarungen
    hinweis: Haftungsausschluss und Verkürzung der Verjährung unwirksam, § 476 BGB.
  - label: VI. Verjährung
    hinweis: Zwei Jahre ab Ablieferung, § 438 Abs. 1 Nr. 3 BGB; Sonderregeln § 475e BGB.
faelle:
- slug: zr-fall-vgk-waschmaschine
  title: Die Waschmaschine mit Platinenschaden
  difficulty: 3
  minutes: 45
  quellen:
  - Eigener Sachverhalt der Redaktion
  - BGB, amtliche Fassung
  facts: 'Verbraucherin V bestellt im Onlineshop des Händlers H eine neue Waschmaschine für
    649 Euro. Die Maschine wird am 2. März von einem von H beauftragten Paketdienst geliefert
    und ordnungsgemäß in Betrieb genommen. Am 10. Dezember desselben Jahres fällt die Elektronik
    aus, die Maschine lässt sich nicht mehr starten. V zeigt H den Defekt unverzüglich an
    und verlangt Reparatur. H verweigert die Reparatur: In den Verkaufsbedingungen sei die
    Gewährleistung auf sechs Monate ab Lieferung begrenzt, außerdem habe V nicht bewiesen,
    dass der Defekt schon bei Lieferung angelegt gewesen sei; vielleicht habe eine Überspannung
    im Stromnetz der V die Platine zerstört. Ein vom Gericht beauftragter Sachverständiger
    kann die Ursache des Platinenschadens nicht klären: Ein Materialfehler ist ebenso möglich
    wie eine Überspannung. Weitere Umstände sind nicht bekannt.'
  question: Kann V von H Nacherfüllung in Form der Reparatur der Waschmaschine verlangen?
  steps:
  - prompt: Welches Vertragsrecht kommt zur Anwendung?
    erwartung: 'V ist Verbraucherin (§ 13 BGB), H Unternehmer (§ 14 BGB), die Waschmaschine
      ist eine bewegliche Sache: Es liegt ein Verbrauchsgüterkauf im Sinne des § 474 BGB vor,
      sodass neben §§ 433 ff. BGB die Sonderregeln der §§ 474 ff. BGB gelten.'
  - prompt: Liegt ein Sachmangel vor, und wann musste er vorliegen?
    erwartung: Eine Waschmaschine muss den objektiven Anforderungen des § 434 Abs. 3 BGB entsprechen,
      insbesondere eine übliche Haltbarkeit aufweisen. Ein Ausfall der Elektronik nach neun
      Monaten ist ein Mangelzustand. Maßgeblich ist der Gefahrübergang (§ 446 BGB), hier die
      Übergabe an V.
  - prompt: Wer trägt die Beweislast dafür, dass der Mangel bei Gefahrübergang vorlag?
    erwartung: Nach § 477 Abs. 1 BGB wird vermutet, dass der Mangel bereits bei Gefahrübergang
      vorlag, weil er sich innerhalb eines Jahres gezeigt hat. V muss nur die Mangelerscheinung
      beweisen, nicht deren Ursache. H müsste die Vermutung widerlegen; dies gelingt nicht,
      da die Ursache offen bleibt. Die Vermutung ist auch nicht mit Art der Sache oder des
      Mangels unvereinbar.
  - prompt: Ist die Klausel über die sechsmonatige Gewährleistung wirksam?
    erwartung: Nein. Nach § 476 Abs. 1, 2 BGB kann sich H nicht auf eine Vereinbarung berufen,
      die vor Mitteilung des Mangels die Verjährung auf unter zwei Jahre verkürzt. Die gesetzliche
      Verjährung beträgt zwei Jahre ab Ablieferung (§ 438 Abs. 1 Nr. 3 BGB) und ist nicht
      abgelaufen.
  - prompt: Ergebnis?
    erwartung: V kann von H nach §§ 437 Nr. 1, 439 Abs. 1 BGB Nacherfüllung verlangen; sie
      hat das Wahlrecht zwischen Nachbesserung und Ersatzlieferung und hat sich für Reparatur
      entschieden. Gründe für eine Verweigerung nach § 439 Abs. 4 BGB sind nicht ersichtlich.
  expectation:
