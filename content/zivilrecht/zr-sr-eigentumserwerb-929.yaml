cards:
- slug: zr-sr-929-voraussetzungen
  type: definition
  front: Nenne die Voraussetzungen der Übereignung einer beweglichen Sache, § 929
    S. 1 BGB
  back: 'Erforderlich sind: (1) die Einigung zwischen Veräußerer und Erwerber darüber,
    dass das Eigentum übergehen soll (dingliche Einigung), (2) die Übergabe der
    Sache an den Erwerber - oder ein gleichwertiges Übergabesurrogat (§§ 929 S. 2,
    930, 931 BGB) -, und (3) die Berechtigung des Veräußerers, also seine Eigentümerstellung
    im Zeitpunkt des Vollzugs. Fehlt die Berechtigung, kommt allenfalls ein gutgläubiger
    Erwerb nach § 932 BGB in Betracht.'
  norms:
  - § 929 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-sr-dingliche-einigung-abstraktionsprinzip
  type: definition
  front: Was ist die dingliche Einigung, und wie verhält sie sich zum Kausalgeschäft?
  back: 'Die dingliche Einigung ist der auf den unmittelbaren Eintritt der Rechtsänderung
    (Eigentumsübergang) gerichtete Vertrag zwischen Veräußerer und Erwerber. Sie
    ist von dem zugrunde liegenden Verpflichtungsgeschäft (z. B. Kaufvertrag, § 433
    BGB) rechtlich zu trennen und in ihrer Wirksamkeit von diesem unabhängig (Trennungs-
    und Abstraktionsprinzip): Ist der Kaufvertrag unwirksam, bleibt die Übereignung
    davon grundsätzlich unberührt - der Veräußerer behilft sich dann über das
    Bereicherungsrecht (§ 812 BGB).'
  norms:
  - § 929 BGB
  - § 433 BGB
  - § 812 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-sr-uebergabe-begriff
  type: definition
  front: 'Definiere: Übergabe im Sinne des § 929 S. 1 BGB'
  back: Übergabe ist der vollständige Verlust des unmittelbaren Besitzes durch den
    Veräußerer und der Erwerb des unmittelbaren (oder zumindest mittelbaren) Besitzes
    durch den Erwerber, wobei dies auf Veranlassung des Veräußerers geschehen muss.
    Es reicht, wenn der Veräußerer den Erwerb des Besitzes durch den Erwerber ermöglicht
    und daran mitwirkt (etwa durch Anweisung an einen Dritten, die Sache an den Erwerber
    herauszugeben).
  norms:
  - § 929 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-sr-929-s2-kurzer-weg
  type: definition
  front: Was regelt § 929 S. 2 BGB (kurzer Weg der Übereignung)?
  back: 'Ist der Erwerber bereits im Besitz der Sache, genügt zur Übereignung die
    bloße Einigung über den Eigentumsübergang - eine zusätzliche Übergabe wäre
    reine Förmelei, da der Erwerber den Besitz ja bereits hat (§ 929 S. 2 BGB). Klassischer
    Fall: Der Mieter einer Sache kauft diese von seinem Vermieter.'
  norms:
  - § 929 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-sr-besitzkonstitut-930
  type: definition
  front: 'Definiere: Besitzkonstitut, § 930 BGB'
  back: 'Ist der Veräußerer im Besitz der Sache, kann die Übergabe durch die Vereinbarung
    eines Besitzmittlungsverhältnisses ersetzt werden, aufgrund dessen der Erwerber
    den mittelbaren Besitz erlangt und der Veräußerer den unmittelbaren Besitz als
    Besitzmittler (§ 868 BGB) behält (§ 930 BGB). Beispiel: V verkauft und übereignet
    K eine Maschine, mietet sie aber sogleich von K zurück, um sie weiterzunutzen
    (Sale-and-lease-back).'
  norms:
  - § 930 BGB
  - § 868 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-sr-abtretung-herausgabeanspruch-931
  type: definition
  front: 'Definiere: Abtretung des Herausgabeanspruchs, § 931 BGB'
  back: Befindet sich die Sache im Besitz eines Dritten, kann die Übergabe dadurch
    ersetzt werden, dass der Veräußerer dem Erwerber seinen Anspruch auf Herausgabe
    der Sache gegen den Dritten abtritt (§ 931 BGB, § 398 BGB). Der Erwerber erlangt
    damit zunächst nur den mittelbaren Besitz über den abgetretenen Anspruch; erst
    mit dessen Durchsetzung erhält er den unmittelbaren Besitz.
  norms:
  - § 931 BGB
  - § 398 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-sr-eigentumsvorbehalt-bedingte-einigung
  type: definition
  front: Was ist der Eigentumsvorbehalt, und wie wirkt er sich auf die Einigung nach
    § 929 BGB aus?
  back: 'Beim Eigentumsvorbehalt (§ 449 Abs. 1 BGB) einigen sich die Parteien nicht
    über einen unbedingten, sondern über einen aufschiebend bedingten Eigentumsübergang:
    Das Eigentum soll erst mit vollständiger Zahlung des Kaufpreises auf den Erwerber
    übergehen (§ 158 Abs. 1 BGB). Bis dahin bleibt der Veräußerer Eigentümer,
    der Erwerber erlangt lediglich ein Anwartschaftsrecht.'
  norms:
  - § 449 BGB
  - § 158 Abs. 1 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-sr-929-berechtigung-veraeusserers
  type: definition
  front: Welche Rolle spielt die Berechtigung des Veräußerers bei § 929 BGB?
  back: '§ 929 BGB regelt den rechtsgeschäftlichen Erwerb vom Berechtigten: Er setzt
    voraus, dass der Veräußerer im Zeitpunkt des Vollzugs tatsächlich Eigentümer
    der Sache ist. Ist er es nicht, weil er selbst nicht Eigentümer ist oder über
    die Sache nicht verfügen darf, scheitert ein Eigentumserwerb nach § 929 BGB -
    der Erwerber kann das Eigentum dann allenfalls gutgläubig nach den §§ 932 ff.
    BGB erwerben.'
  norms:
  - § 929 BGB
  - § 932 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
schemata:
- slug: zr-schema-929-eigentumserwerb
  title: Eigentumserwerb an einer beweglichen Sache, § 929 BGB
  norms:
  - § 929 BGB
  - § 930 BGB
  - § 931 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  steps:
  - label: I. Einigung über den Eigentumsübergang
    hinweis: Ggf. aufschiebend bedingt bei Eigentumsvorbehalt, § 449 BGB.
  - label: II. Übergabe oder Übergabesurrogat
    children:
    - label: 1. Übergabe, § 929 S. 1 BGB
    - label: 2. Kurzer Weg (Erwerber bereits im Besitz), § 929 S. 2 BGB
    - label: 3. Besitzkonstitut, § 930 BGB
    - label: 4. Abtretung des Herausgabeanspruchs gegen den besitzenden Dritten, §
        931 BGB
  - label: III. Berechtigung (Eigentümerstellung) des Veräußerers
    hinweis: Fehlt sie, nur gutgläubiger Erwerb nach §§ 932 ff. BGB möglich.
  - label: 'IV. Ergebnis: Eigentumserwerb (+)/(-)'
faelle:
- slug: zr-fall-klavier-beim-klavierbauer
  title: Das Klavier beim Klavierbauer
  difficulty: 3
  minutes: 35
  quellen:
  - Eigener Sachverhalt der Redaktion
  - BGB, amtliche Fassung
  facts: 'Musikerin V hat ihr Klavier zur Reparatur bei Klavierbauer L abgegeben,
    der es in seiner Werkstatt aufbewahrt. Während der Reparatur verkauft V das Klavier
    für 3.000 EUR an K. V und K einigen sich, dass das Eigentum sofort auf K übergehen
    soll; da V das Klavier nicht selbst besitzt, tritt sie K ihren Anspruch gegen
    L auf Herausgabe des Klaviers ab. K zeigt L die Abtretung an und bittet ihn, das
    Klavier nach Abschluss der Reparatur an ihn herauszugeben. Als die Reparatur fertig
    ist, verlangt K von L die Herausgabe. L verweigert dies: Er kenne nur V als seine
    Vertragspartnerin und schulde die Herausgabe daher nur ihr.'
  question: Ist K Eigentümer des Klaviers geworden, und kann er von L die Herausgabe
    verlangen?
  steps:
  - prompt: Formuliere den Obersatz für den Herausgabeanspruch des K gegen L.
    erwartung: K könnte gegen L einen Anspruch auf Herausgabe des Klaviers aus §
      985 BGB haben, wenn K Eigentümer und L Besitzer ohne eigenes Recht zum Besitz
      gegenüber K ist.
  - prompt: Wie hat K das Eigentum am Klavier erworben?
    erwartung: 'Über § 929 S. 1 iVm § 931 BGB: Einigung zwischen V und K sowie Abtretung
      des Herausgabeanspruchs der V gegen L statt Übergabe, da das Klavier bei dem
      Dritten L lag.'
  - prompt: War V berechtigt, das Klavier auf diesem Weg zu übereignen?
    erwartung: Ja, V war unstreitig Eigentümerin des Klaviers.
  - prompt: Kann L sich gegenüber K darauf berufen, nur V zu kennen?
    erwartung: Nein. Mit wirksamer Abtretung und Anzeige an L ist K neuer Berechtigter
      des Herausgabeanspruchs geworden; L muss nun an K leisten und hat kein eigenes
      Besitzrecht gegenüber K.
  expectation:
