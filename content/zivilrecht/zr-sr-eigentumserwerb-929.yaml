    hinweis: Ggf. aufschiebend bedingt bei Eigentumsvorbehalt, § 449 BGB.
  - label: II. Uebergabe oder Uebergabesurrogat
    children:
    - label: 1. Uebergabe, § 929 S. 1 BGB
    - label: 2. Kurzer Weg (Erwerber bereits im Besitz), § 929 S. 2 BGB
    - label: 3. Besitzkonstitut, § 930 BGB
    - label: 4. Abtretung des Herausgabeanspruchs gegen den besitzenden Dritten, §
        931 BGB
  - label: III. Berechtigung (Eigentuemerstellung) des Veraeusserers
    hinweis: Fehlt sie, nur gutglaeubiger Erwerb nach §§ 932 ff. BGB moeglich.
  - label: 'IV. Ergebnis: Eigentumserwerb (+)/(-)'
faelle:
- slug: zr-fall-klavier-beim-klavierbauer
  title: Das Klavier beim Klavierbauer
  difficulty: 3
  minutes: 35
  quellen:
  - Eigener Sachverhalt der Redaktion
  - BGB, amtliche Fassung
  facts: 'Musikerin V hat ihr Klavier zur Reparatur bei Klavierbauer L abgegeben,
    der es in seiner Werkstatt aufbewahrt. Waehrend der Reparatur verkauft V das Klavier
    fuer 3.000 EUR an K. V und K einigen sich, dass das Eigentum sofort auf K uebergehen
    soll; da V das Klavier nicht selbst besitzt, tritt sie K ihren Anspruch gegen
    L auf Herausgabe des Klaviers ab. K zeigt L die Abtretung an und bittet ihn, das
    Klavier nach Abschluss der Reparatur an ihn herauszugeben. Als die Reparatur fertig
    ist, verlangt K von L die Herausgabe. L verweigert dies: Er kenne nur V als seine
    Vertragspartnerin und schulde die Herausgabe daher nur ihr.'
  question: Ist K Eigentuemer des Klaviers geworden, und kann er von L die Herausgabe
    verlangen?
  steps:
  - prompt: Formuliere den Obersatz fuer den Herausgabeanspruch des K gegen L.
    erwartung: K koennte gegen L einen Anspruch auf Herausgabe des Klaviers aus §
      985 BGB haben, wenn K Eigentuemer und L Besitzer ohne eigenes Recht zum Besitz
      gegenueber K ist.
  - prompt: Wie hat K das Eigentum am Klavier erworben?
    erwartung: 'Ueber § 929 S. 1 iVm § 931 BGB: Einigung zwischen V und K sowie Abtretung
      des Herausgabeanspruchs der V gegen L statt Uebergabe, da das Klavier bei dem
      Dritten L lag.'
  - prompt: War V berechtigt, das Klavier auf diesem Weg zu uebereignen?
    erwartung: Ja, V war unstreitig Eigentuemerin des Klaviers.
  - prompt: Kann L sich gegenueber K darauf berufen, nur V zu kennen?
    erwartung: Nein. Mit wirksamer Abtretung und Anzeige an L ist K neuer Berechtigter
      des Herausgabeanspruchs geworden; L muss nun an K leisten und hat kein eigenes
      Besitzrecht gegenueber K.
  expectation:
