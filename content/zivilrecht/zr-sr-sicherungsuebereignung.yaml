      - zr-sr-su-sicherungsabrede
    - id: p5
      label: 'Verwertungsreife bejaht: Gesamtfälligkeit durch Kündigung/Fälligstellung
        der gesicherten Forderung und Verzug (nicht schon aus dem Ratenverzug allein)'
      weight: 2.0
      required: true
      norms:
      - § 286 BGB
