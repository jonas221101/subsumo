      - zr-sr-su-verwertungsreife
    - id: p7
      label: Anspruchsgrundlage des Herausgabeverlangens benannt (Sicherungsabrede/Verwahrung,
        § 985 BGB; Recht zum Besitz mit Verwertungsreife erloschen)
      weight: 1.0
      keywords:
