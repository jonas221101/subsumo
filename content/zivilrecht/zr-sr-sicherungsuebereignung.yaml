cards:
- slug: zr-sr-su-rechtsnatur
  type: definition
  front: Was ist eine Sicherungsübereignung?
  back: 'Die Sicherungsübereignung ist die Übertragung des Eigentums an einer beweglichen
    Sache vom Sicherungsgeber auf den Sicherungsnehmer zur Absicherung einer Forderung,
    meist eines Darlehens. Der Sicherungsgeber bleibt dabei im unmittelbaren Besitz
    der Sache und kann sie weiter nutzen: sachenrechtlich entsteht Volleigentum beim
    Sicherungsnehmer, schuldrechtlich bleibt dessen Umgang mit dem Sicherungsgut durch
    die Sicherungsabrede gebunden.'
  norms:
  - § 929 S. 1 BGB
  - § 930 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-sr-su-929-930-besitzkonstitut
  type: definition
  front: Wie vollzieht sich die dingliche Übereignung bei der Sicherungsübereignung?
  back: Die Übereignung erfolgt nach §§ 929 S. 1, 930 BGB durch Einigung über den
    Eigentumsübergang und die Vereinbarung eines Besitzmittlungsverhältnisses im Sinne
    des § 868 BGB anstelle der tatsächlichen Übergabe. Der Sicherungsgeber bleibt
    unmittelbarer, der Sicherungsnehmer wird mittelbarer Besitzer; als Besitzmittlungsverhältnis
    dient regelmäßig ein zwischen den Parteien vereinbartes Verwahrungs- oder Leihverhältnis.
  norms:
  - § 929 S. 1 BGB
  - § 930 BGB
  - § 868 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-sr-su-sicherungsabrede
  type: definition
  front: Welche Funktion hat die Sicherungsabrede?
  back: Die Sicherungsabrede ist der schuldrechtliche Vertrag zwischen Sicherungsgeber
    und Sicherungsnehmer, der den kausalen Rechtsgrund für die Übereignung bildet.
    Sie legt insbesondere fest, welche Forderung gesichert wird, unter welchen Voraussetzungen
    der Sicherungsnehmer verwerten darf und wann er das Sicherungsgut nach Erledigung
    der gesicherten Forderung zurücktübertragen muss.
  norms:
  - § 311 Abs. 1 BGB
  - § 812 Abs. 1 S. 1 Alt. 1 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-sr-su-fiduziarisches-eigentum
  type: definition
  front: Wie ist die Rechtsstellung des Sicherungsnehmers vor Eintritt des Sicherungsfalls
    einzuordnen?
  back: Der Sicherungsnehmer wird zivilrechtlich Volleigentümer der Sache, ist aber
    im Verhältnis zum Sicherungsgeber durch die Sicherungsabrede schuldrechtlich gebunden
    - man spricht von fiduziarischem oder treuhänderischem Eigentum. Er darf das Sicherungsgut
    vor Eintritt des vereinbarten Sicherungsfalls nicht verwerten und muss es bei
    Erledigung der gesicherten Forderung zurücktübertragen.
  norms:
  - § 903 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-sr-su-verwertungsreife
  type: definition
  front: Wann darf der Sicherungsnehmer das Sicherungsgut verwerten (Verwertungsreife)?
  back: Verwertungsreife tritt regelmäßig ein, wenn die gesicherte Forderung fällig
    ist und der Sicherungsgeber mit deren Erfüllung in Verzug gerät; die genauen Voraussetzungen
    richten sich nach der jeweiligen Sicherungsabrede. Erst ab diesem Zeitpunkt darf
    der Sicherungsnehmer das in seinem Eigentum stehende Sicherungsgut verwerten,
    etwa durch freihändigen Verkauf.
  norms:
  - § 286 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-sr-su-abgrenzung-eigentumsvorbehalt-449
  type: definition
  front: Wie unterscheidet sich die Sicherungsübereignung vom Eigentumsvorbehalt,
    § 449 BGB?
  back: Beim Eigentumsvorbehalt behält der Verkäufer sein Eigentum bis zur vollständigen
    Zahlung des Kaufpreises (§ 449 Abs. 1 BGB) - das Eigentum sichert also den eigenen
    Zahlungsanspruch des Verkäufers. Bei der Sicherungsübereignung überträgt umgekehrt
    der Sicherungsgeber sein bereits bestehendes Eigentum auf einen typischerweise
    am Kaufvertrag unbeteiligten Dritten, meist eine Bank, um dessen Darlehensforderung
    abzusichern.
  norms:
  - § 449 Abs. 1 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-sr-su-abgrenzung-pfandrecht-1205
  type: definition
  front: Wie unterscheidet sich die Sicherungsübereignung vom vertraglichen Pfandrecht
    an beweglichen Sachen?
  back: Das vertragliche Pfandrecht an beweglichen Sachen erfordert nach § 1205 Abs.
    1 BGB grundsätzlich die Übergabe der Sache an den Pfandgläubiger (Faustpfandprinzip)
    und gewährt nur ein beschränktes dingliches Verwertungsrecht. Die Sicherungsübereignung
    überträgt demgegenüber Volleigentum, ohne dass der Sicherungsgeber den Besitz
    der Sache verliert - deshalb wird sie in der Praxis dem Pfandrecht meist vorgezogen,
    insbesondere bei Sachen, auf deren Nutzung der Sicherungsgeber angewiesen ist.
  norms:
  - § 1205 Abs. 1 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-sr-su-uebersicherung
  type: definition
  front: Was versteht man unter Übersicherung und welche Rechtsfolge hat sie?
  back: Übersicherung liegt vor, wenn der Wert des Sicherungsguts außer Verhältnis
    zur Höhe der gesicherten Forderung steht. Man unterscheidet die anfängliche Übersicherung
    (schon bei Vertragsschluss) von der nachträglichen (der Wert steigt oder die Forderung
    sinkt später). Anerkannt ist ein Freigabeanspruch des Sicherungsgebers hinsichtlich
    des überschießenden Teils, der aus der Sicherungsabrede unter Berücksichtigung
    von Treu und Glauben (§ 242 BGB) folgt, auch ohne ausdrückliche Klausel (vgl.
    BGH, Beschluss des Großen Zivilsenats vom 27.11.1997). Eine anfängliche Übersicherung
    führt nicht ohne Weiteres zur Nichtigkeit nach § 138 BGB; formularmäßige Sicherungsabreden
    ohne angemessene Freigabeklausel können aber nach § 307 BGB unwirksam sein.
  norms:
  - § 242 BGB
  - § 138 BGB
  - § 307 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-sr-su-bestimmtheitsgrundsatz
  type: definition
  front: Was verlangt der Bestimmtheitsgrundsatz bei der Sicherungsübereignung von
    Sachgesamtheiten?
  back: Im Sachenrecht kann nur eine einzelne, bestimmte Sache Gegenstand der Übereignung
    sein (Spezialitätsgrundsatz). Bei der Sicherungsübereignung eines Warenlagers
    oder einer Sachgesamtheit müssen die übereigneten Sachen daher im Zeitpunkt der
    Einigung durch einfache äußere Abgrenzungsmerkmale (z. B. Lagerort, Markierung,
    Raumsicherungsvertrag) für jeden Dritten bestimmbar sein; eine bloße Gattungsbezeichnung
    ("alle Maschinen") ohne Abgrenzung genügt nicht.
  norms:
  - § 929 S. 1 BGB
  - § 930 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-sr-su-insolvenz-absonderung
  type: definition
  front: Welche Stellung hat der Sicherungseigentümer in der Insolvenz des Sicherungsgebers?
  back: Der Sicherungseigentümer kann das Sicherungsgut in der Insolvenz des Sicherungsgebers
    nicht aussondern (§ 47 InsO), weil sein Eigentum nur Sicherungszwecken dient.
    Er hat ein Recht auf abgesonderte Befriedigung (Absonderungsrecht, § 51 Nr. 1
    InsO). Befindet sich das Sicherungsgut im Besitz des Insolvenzverwalters, ist
    dieser zur Verwertung berechtigt (§ 166 Abs. 1 InsO), der Sicherungsnehmer erhält
    den Erlös abzüglich der Feststellungs- und Verwertungskosten.
  norms:
  - § 51 Nr. 1 InsO
  - § 47 InsO
  - § 166 InsO
  quellen:
  - InsO, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-sr-su-weiterveraeusserung-durch-sicherungsgeber
  type: definition
  front: Kann ein Dritter vom Sicherungsgeber gutgläubig Eigentum am Sicherungsgut
    erwerben?
  back: Veräußert der Sicherungsgeber das sicherungsübereignete Gut an einen Dritten,
    ist er Nichtberechtigter, weil das Eigentum bei der Bank liegt. Der Dritte kann
    nach §§ 929 S. 1, 932 BGB gutgläubig Eigentum erwerben, wenn er nicht weiß und
    nicht grob fahrlässig verkennt, dass die Sache dem Veräußerer nicht gehört; die
    Sache ist der Bank auch nicht im Sinne des § 935 Abs. 1 BGB abhandengekommen,
    weil der Besitz des Sicherungsgebers auf freiwilliger Besitzüberlassung beruht.
    Die Bank kann dann Ersatz vom Sicherungsgeber verlangen (u. a. § 816 Abs. 1 S.
    1 BGB, Vertragsverletzung).
  norms:
  - § 932 BGB
  - § 935 Abs. 1 BGB
  - § 816 Abs. 1 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
schemata:
- slug: zr-schema-sicherungsuebereignung
  title: Wirksame Bestellung von Sicherungseigentum
  norms:
  - § 929 S. 1 BGB
  - § 930 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  steps:
  - label: I. Einigung über den Eigentumsübergang, § 929 S. 1 BGB
  - label: II. Vereinbarung eines Besitzmittlungsverhältnisses statt Übergabe, § 930
      BGB
    hinweis: Z.B. Verwahrung oder Leihe zwischen Sicherungsgeber und Sicherungsnehmer.
  - label: III. Berechtigung des Sicherungsgebers am Sicherungsgut
    hinweis: Fehlt sie, ist gutgläubiger Erwerb nach § 933 BGB erst mit tatsächlicher
      Besitzübertragung an den Sicherungsnehmer möglich, nicht bereits durch das Besitzkonstitut
      allein.
  - label: IV. Sicherungsabrede als kausaler Rechtsgrund
  - label: 'V. Rechtsfolge: fiduziarisches Volleigentum beim Sicherungsnehmer'
    children:
    - label: 1. Verwertungsrecht erst ab Verwertungsreife
    - label: 2. Rückübertragungs- bzw. Freigabeanspruch nach Erledigung der gesicherten
        Forderung
faelle:
- slug: zr-fall-kantenanleimmaschine
  title: Die Kantenanleimmaschine
  difficulty: 3
  minutes: 35
  quellen:
  - Eigener Sachverhalt der Redaktion
  - BGB, amtliche Fassung
  facts: Tischlereiinhaber U benötigt einen Betriebsmittelkredit über 40.000 EUR bei
    der fiktiven Sparkasse S. Zur Absicherung vereinbaren U und S schriftlich eine
    Sicherungsübereignung der im Betrieb befindlichen Kantenanleimmaschine KAM-500
    im Wert von 40.000 EUR; im selben Vertrag vereinbaren sie, dass U die Maschine
    im Rahmen eines Verwahrungsverhältnisses für S besitzt und im Betrieb weiter nutzen
    darf. Eine tatsächliche Übergabe der Maschine an S findet nie statt, U arbeitet
    unverändert mit ihr weiter. Nach dem Darlehensvertrag wird die gesamte Restschuld
    fällig, wenn der Darlehensnehmer mit zwei aufeinanderfolgenden Raten in Verzug
    gerät und S nach erfolgloser Mahnung mit Fristsetzung die Restschuld kündigt.
    U gerät mit drei aufeinanderfolgenden Kreditraten trotz Mahnung in Verzug; S kündigt
    die Restschuld nach erfolgloser Fristsetzung und verlangt die Herausgabe der Maschine
    zwecks Verwertung. U meint, S sei nie Eigentümerin geworden, da nie eine Übergabe
    stattgefunden habe.
  question: Ist S Sicherungseigentümerin der Kantenanleimmaschine geworden, und darf
    sie die Maschine wegen des Zahlungsverzugs des U verwerten?
  steps:
  - prompt: Ist eine Einigung über den Eigentumsübergang nach § 929 S. 1 BGB erfolgt?
    erwartung: Ja, U und S haben sich im Sicherungsvertrag ausdrücklich über den Übergang
      des Eigentums an der Maschine auf S geeinigt.
  - prompt: Wieso steht es der Wirksamkeit nicht entgegen, dass nie eine tatsächliche
      Übergabe stattgefunden hat?
    erwartung: Weil § 930 BGB die Übergabe durch die Vereinbarung eines Besitzmittlungsverhältnisses
      ersetzt; hier haben U und S ein Verwahrungsverhältnis vereinbart, aufgrund dessen
      U unmittelbarer und S mittelbarer Besitzer ist.
  - prompt: War U zur Übereignung berechtigt?
    erwartung: Ja, U war als Eigentümer der selbst erworbenen Maschine zur Übereignung
      berechtigt, sodass es auf einen gutgläubigen Erwerb nicht ankommt.
  - prompt: Liegt Verwertungsreife vor?
    erwartung: 'Ja: Allein der Verzug mit Raten macht nur die Raten fällig. Erst durch
      die Kündigung bzw. Gesamtfälligstellung nach dem Darlehensvertrag ist die gesamte
      gesicherte Restforderung fällig; da U trotz Mahnung und Fristsetzung nicht leistet,
      sind die Voraussetzungen der Sicherungsabrede für die Verwertung (Fälligkeit
      der gesicherten Forderung und Verzug) erfüllt. Verwertungsreife liegt vor.'
  - prompt: Auf welche Anspruchsgrundlage kann S das Herausgabeverlangen stützen?
    erwartung: 'Auf die Sicherungsabrede in Verbindung mit dem Verwahrungsverhältnis
      (Rückgabeverlangen des mittelbaren Besitzers, § 695 BGB analog bzw. vertragliche
      Herausgabepflicht bei Verwertungsreife) sowie auf § 985 BGB: S ist Eigentümerin,
      U unmittelbare Besitzerin; ihr Recht zum Besitz (§ 986 BGB) aus dem Verwahrungs-
      und Nutzungsverhältnis ist mit Eintritt der Verwertungsreife erloschen.'
  - prompt: Zu welchem Ergebnis kommt man?
    erwartung: S ist wirksam Sicherungseigentümerin geworden und darf die Maschine
      wegen der eingetretenen Verwertungsreife verwerten.
  expectation:
    pruefpunkte:
    - id: p1
      label: Einigung über den Eigentumsübergang nach § 929 S. 1 BGB bejaht
      weight: 1.5
      required: true
      norms:
      - § 929 S. 1 BGB
      keywords:
      - Übergang des Eigentums
      - Einigung über den Eigentumsübergang
      - § 929 S. 1
      - dingliche Einigung
      card_slugs:
      - zr-sr-su-929-930-besitzkonstitut
    - id: p2
      label: Besitzmittlungsverhältnis statt Übergabe nach § 930 BGB erkannt (Verwahrungsverhältnis)
      weight: 2.0
      required: true
      norms:
      - § 930 BGB
      keywords:
      - Besitzmittlungsverhältnis
      - § 930
      - Besitzkonstitut
      - U ist unmittelbarer, S mittelbarer Besitzer
      - Übergabe wird ersetzt
      - § 868
      card_slugs:
      - zr-sr-su-929-930-besitzkonstitut
    - id: p3
      label: Berechtigung des U als Eigentümer erkannt, gutgläubiger Erwerb daher
        nicht erforderlich
      weight: 1.0
      keywords:
      - U war als Eigentümer
      - zur Übereignung berechtigt
      - berechtigter Verfügender
      - gutgläubigen Erwerb nicht ankommt
      - Verfügungsbefugnis des U
