      beantragt werden.
  - prompt: Welchen Rechtsbehelf hat S und mit welchem Erfolg?
    erwartung: S kann die Vollstreckungsabwehrklage nach § 767 Abs. 1 ZPO beim Prozessgericht
      des ersten Rechtszugs erheben. Die Einwendung der Erfüllung (§ 362 Abs. 1 BGB) betrifft
      den titulierten Anspruch und ist erst nach Schluss der mündlichen Verhandlung (Mai)
      im Juni entstanden, sodass die Präklusion des § 767 Abs. 2 ZPO nicht greift. Die Klage
      ist begründet; die Zwangsvollstreckung aus dem Titel wird für unzulässig erklärt. Einstweilige
      Einstellung nach § 769 ZPO ist möglich.
