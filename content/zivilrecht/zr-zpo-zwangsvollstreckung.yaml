faelle:
- slug: zr-fall-zpo-zv-gepfaendetes-fahrrad
  title: Das gepfändete Rennrad
  difficulty: 3
  minutes: 40
  quellen:
  - Eigener Sachverhalt der Redaktion
  - ZPO, amtliche Fassung
  facts: Gläubiger G hat gegen Schuldner S ein rechtskräftiges, mit Vollstreckungsklausel
    versehenes und zugestelltes Urteil über 5.000 Euro. Die letzte mündliche Verhandlung fand
    im Mai statt. Im Juni überweist S den vollen Betrag von 5.000 Euro an G; G bestätigt den
    Eingang, betreibt aber dennoch die Zwangsvollstreckung. Im August pfändet Gerichtsvollzieher
    V bei S in dessen Wohnung ein hochwertiges Rennrad im Wert von 4.500 Euro und legt Pfandsiegel
    an. Das Rennrad gehört D, einem Freund des S, der es S für den Sommer geliehen hatte.
    D und S erfahren von der Pfändung.
  question: Welche Rechtsbehelfe haben D und S, und haben sie Erfolg?
  steps:
  - prompt: Welchen Rechtsbehelf hat D?
    erwartung: D ist Dritter. Er kann die Drittwiderspruchsklage nach § 771 Abs. 1 ZPO erheben,
      weil ihm als Eigentümer ein die Veräußerung hinderndes Recht am Rennrad zusteht.
  - prompt: Hat die Erinnerung des D nach § 766 ZPO Erfolg?
    erwartung: 'Nein. Der Gerichtsvollzieher hat das Verfahren ordnungsgemäß durchgeführt:
      Er pfändet Sachen im Gewahrsam des Schuldners und prüft nicht, wem sie gehören (§ 808
      Abs. 1 ZPO). Ein Verfahrensfehler liegt nicht vor; Eigentum ist mit § 771 ZPO geltend
      zu machen.'
  - prompt: Ist die Drittwiderspruchsklage des D begründet?
