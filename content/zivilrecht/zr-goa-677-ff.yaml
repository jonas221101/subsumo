  steps:
  - label: "I. Geschäftsbesorgung"
    hinweis: "Jede tatsächliche oder rechtsgeschäftliche Tätigkeit; reine Gefälligkeiten ohne wirtschaftlichen Bezug genügen nicht."
  - label: "II. Fremdes Geschäft"
    children:
    - label: "1. Objektiv fremdes, neutrales oder auch-fremdes Geschäft"
    - label: "2. Fremdgeschäftsführungswille (bei objektiv fremdem Geschäft vermutet; bei neutralem Geschäft nach außen erkennbar)"
      hinweis: "Beim auch-fremden Geschäft den Streit um die Vermutung ansprechen."
  - label: "III. Ohne Auftrag oder sonstige Berechtigung"
    hinweis: "Kein wirksamer Vertrag und keine gesetzliche Befugnis gegenüber dem Geschäftsherrn."
  - label: "IV. Berechtigung der Geschäftsführung"
    children:
    - label: "1. Übernahme entspricht dem Interesse des Geschäftsherrn, § 683 S. 1 BGB"
    - label: "2. Übernahme entspricht dem wirklichen, hilfsweise dem mutmaßlichen Willen, § 683 S. 1 BGB"
    - label: "3. Entgegenstehender Wille unbeachtlich, § 679 BGB"
    - label: "4. Genehmigung, § 684 S. 2 BGB"
  - label: "V. Rechtsfolge: Ersatz der Aufwendungen, § 683 S. 1 BGB iVm § 670 BGB"
    children:
    - label: "1. Freiwillige Vermögensopfer, die der Geschäftsführer für erforderlich halten durfte"
    - label: "2. Risikotypische Begleitschäden (h.M.)"
    - label: "3. Vergütung nur bei berufs- oder gewerbetypischer Tätigkeit"
  - label: "VI. Bei unberechtigter GoA: nur Bereicherungsausgleich, § 684 S. 1 BGB; ggf. Haftung des Geschäftsführers nach § 678 BGB"
faelle:
- slug: zr-fall-sturmschaden-am-nachbardach
  title: "Der Sturmschaden am Nachbardach"
  difficulty: 3
  minutes: 45
  quellen:
  - Eigener Sachverhalt der Redaktion
  - BGB, amtliche Fassung
  facts: "Während B für drei Wochen verreist ist, deckt ein Sturm einen Teil des Dachs seines Hauses ab. Nachbar A, selbstständiger Dachdeckermeister, kann B nicht erreichen. Um das Eindringen von Regen zu verhindern, sichert er das Dach noch am selben Tag mit einer Plane und ersetzt in den folgenden Tagen die zerstörten Ziegel. Für Plane und Ziegel wendet A 600 EUR auf; er arbeitet insgesamt fünf Stunden, für die er Kunden üblicherweise 60 EUR je Stunde berechnet. Beim Abstieg vom Dach rutscht A trotz sorgfältiger Sicherung aus und beschädigt dabei seinen eigenen Werkzeugkoffer (Schaden 150 EUR). Weil ihm der verwitterte Gartenzaun des B schon lange missfällt, streicht A bei der Gelegenheit auch den Zaun neu und verbraucht dafür Farbe im Wert von 80 EUR. Nach seiner Rückkehr ist B über die Dachreparatur erleichtert, erklärt A aber, den Zaun habe er im nächsten Jahr ohnehin abreißen wollen; einen Anstrich habe er nie gewollt. A verlangt von B 600 EUR Material, 300 EUR Arbeitslohn, 150 EUR für den Werkzeugkoffer und 80 EUR für die Zaunfarbe."
  question: "Welche Ansprüche hat A gegen B?"
  steps:
  - prompt: "Liegt hinsichtlich der Dachreparatur eine echte berechtigte GoA vor?"
    erwartung: "A hat mit der Sicherung und Reparatur des fremden Dachs ein objektiv fremdes Geschäft besorgt; der Fremdgeschäftsführungswille wird vermutet und ist auch tatsächlich gegeben. Ein Auftrag oder eine sonstige Berechtigung fehlt. Die Übernahme entspricht dem objektiven Interesse des B (Abwendung von Folgeschäden) und seinem mutmaßlichen Willen, da ein wirklicher Wille mangels Erreichbarkeit nicht feststellbar war (§ 683 S. 1 BGB). Die GoA ist berechtigt."
  - prompt: "Welche Positionen kann A als Aufwendungen nach §§ 683 S. 1, 670 BGB ersetzt verlangen?"
    erwartung: "Die Materialkosten von 600 EUR sind freiwillige Vermögensopfer, die A für erforderlich halten durfte. Die Arbeitsleistung ist grundsätzlich keine Aufwendung; da die Dachreparatur aber zum Beruf des A gehört, kann er nach h.M. die übliche Vergütung von 300 EUR verlangen (Rechtsgedanke des § 1877 Abs. 3 BGB). Der Schaden am Werkzeugkoffer ist ein risikotypischer Begleitschaden der Dacharbeit und nach h.M. ebenfalls als Aufwendung ersatzfähig (150 EUR)."
  - prompt: "Wie ist der Zaunanstrich zu beurteilen?"
    erwartung: "Auch der Zaunanstrich ist ein objektiv fremdes Geschäft ohne Auftrag. Die Übernahme entspricht aber weder dem Interesse noch dem mutmaßlichen Willen des B, der den Zaun abreißen wollte; eine Genehmigung nach § 684 S. 2 BGB hat B verweigert, § 679 BGB greift nicht. Die GoA ist insoweit unberechtigt. A kann nach § 684 S. 1 BGB nur Herausgabe des Erlangten nach Bereicherungsrecht verlangen; da der Anstrich eines zum Abriss bestimmten Zauns für B keinen Vermögenswert hat (aufgedrängte Bereicherung), schuldet B nichts."
