      label: >-
        Anspruchsgrundlage § 1 Abs. 1 S. 1 ProdHaftG und Herstellereigenschaft nach
        § 4 Abs. 1 ProdHaftG
      weight: 2.0
      required: true
      norms:
      - § 1 Abs. 1 ProdHaftG
      - § 4 Abs. 1 ProdHaftG
      keywords:
