cards:
- slug: zr-votv-schwebende-unwirksamkeit-177-1
  type: definition
  front: 'Definiere: Rechtsfolge des Vertragsschlusses durch einen Vertreter ohne
    Vertretungsmacht, § 177 Abs. 1 BGB'
  back: Schließt jemand als Vertreter im Namen eines anderen einen Vertrag, ohne
    dass ihm die dafür erforderliche Vertretungsmacht zusteht, hängt die Wirksamkeit
    des Vertrags für und gegen den Vertretenen von dessen Genehmigung ab (§ 177 Abs.
    1 BGB). Der Vertrag ist bis zur Entscheidung des Vertretenen schwebend unwirksam
    - weder endgültig wirksam noch endgültig nichtig.
  norms:
  - § 177 Abs. 1 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-votv-aufforderung-177-2
  type: norm
  front: Was regelt § 177 Abs. 2 BGB zur Aufforderung des Vertragspartners?
  back: Fordert der andere Teil den Vertretenen zur Erklärung über die Genehmigung
    auf, kann die Genehmigung nur ihm gegenüber erklärt werden; eine vorher gegenüber
    dem Vertreter erklärte Genehmigung wird unwirksam (§ 177 Abs. 2 S. 1 BGB). Die
    Genehmigung kann nur bis zum Ablauf von zwei Wochen nach Empfang der Aufforderung
    erklärt werden - wird sie nicht erklärt, gilt sie als verweigert (§ 177 Abs.
    2 S. 2 BGB). Die Vorschrift gibt dem Vertragspartner ein Mittel, die schwebende
    Unwirksamkeit zeitlich zu begrenzen.
  norms:
  - § 177 Abs. 2 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-votv-genehmigung-184-1
  type: norm
  front: Welche Rückwirkung hat die Genehmigung nach § 184 Abs. 1 BGB?
  back: Die Genehmigung wirkt auf den Zeitpunkt der Vornahme des Rechtsgeschäfts
    zurück (§ 184 Abs. 1 BGB), soweit nicht ein anderes bestimmt ist. Genehmigt der
    Vertretene den vom vollmachtlosen Vertreter geschlossenen Vertrag, gilt dieser
    also von Anfang an als wirksam - nicht erst ab dem Zeitpunkt der Genehmigungserklärung.
  norms:
  - § 184 Abs. 1 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-votv-widerrufsrecht-178
  type: definition
  front: 'Definiere: Widerrufsrecht des Vertragspartners, § 178 BGB'
  back: Bis zur Genehmigung des Vertrags durch den Vertretenen ist der andere Teil
    zum Widerruf berechtigt (§ 178 S. 1 BGB) - er kann sich also seinerseits vom schwebend
    unwirksamen Vertrag lösen, bevor der Vertretene entschieden hat. Das Widerrufsrecht
    ist ausgeschlossen, wenn der andere Teil den Mangel der Vertretungsmacht bei Vertragsschluss
    kannte (§ 178 S. 1 BGB). Der Widerruf kann wahlweise auch gegenüber dem Vertreter
    selbst erklärt werden (§ 178 S. 2 BGB) - das ist lediglich eine zusätzliche
    Erklärungsoption und keine an Kenntnis oder Zugeständnis des Mangels geknüpfte
    Einschränkung des Adressatenkreises.
  norms:
  - § 178 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-votv-haftung-179-1
  type: norm
  front: Wann und wie haftet der Vertreter ohne Vertretungsmacht nach § 179 Abs. 1
    BGB?
  back: Verweigert der Vertretene die Genehmigung, ist derjenige, der als Vertreter
    einen Vertrag geschlossen hat, dem anderen Teil zur Erfüllung oder zum Schadensersatz
    verpflichtet, wenn er die Genehmigung wusste, dass ihm die Vertretungsmacht fehlte
    - der andere Teil hat insoweit ein Wahlrecht (§ 179 Abs. 1 BGB). Voraussetzung
    ist positive Kenntnis des Vertreters vom Mangel der Vertretungsmacht im Zeitpunkt
    des Vertragsschlusses.
  norms:
  - § 179 Abs. 1 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-votv-haftung-179-2
  type: norm
  front: Wie ist die Haftung nach § 179 Abs. 2 BGB begrenzt, wenn der Vertreter den
    Mangel nicht kannte?
  back: Kannte der Vertreter den Mangel der Vertretungsmacht nicht, ist er nur zum
    Ersatz des Schadens verpflichtet, den der andere Teil dadurch erleidet, dass er
    auf die Vertretungsmacht vertraut hat (Vertrauensschaden) - begrenzt auf den Betrag
    des Interesses, das der andere Teil an der Wirksamkeit des Vertrags hat (Erfüllungsinteresse
    als Obergrenze, § 179 Abs. 2 BGB). Anders als nach Abs. 1 besteht in diesem Fall
    kein Wahlrecht auf Erfüllung.
  norms:
  - § 179 Abs. 2 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-votv-ausschluss-179-3
  type: norm
  front: In welchen Fällen entfällt die Haftung des Vertreters nach § 179 Abs. 3
    BGB?
  back: Die Haftung des Vertreters ist ausgeschlossen, wenn der andere Teil den Mangel
    der Vertretungsmacht kannte oder kennen musste (§ 179 Abs. 3 S. 1 BGB) - dann
    ist sein Vertrauen nicht schutzwürdig. Ebenso haftet ein in der Geschäftsfähigkeit
    beschränkter Vertreter nicht, es sei denn, er hat mit Zustimmung seines gesetzlichen
    Vertreters gehandelt (§ 179 Abs. 3 S. 2 BGB).
  norms:
  - § 179 Abs. 3 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: zr-votv-einseitiges-rechtsgeschaeft-180
  type: norm
  front: Was gilt für einseitige Rechtsgeschäfte ohne Vertretungsmacht, § 180 BGB?
  back: Bei einem einseitigen Rechtsgeschäft ist eine Vertretung ohne Vertretungsmacht
    grundsätzlich unzulässig - dem Empfänger einer solchen Erklärung fehlt sonst
    die Möglichkeit, die Wirksamkeit selbst zu klären, wie es der Vertragsschluss
    durch Genehmigung erlaubt (§ 180 S. 1 BGB). Hat der Erklärungsempfänger die
    vom Vertreter behauptete Vertretungsmacht bei der Vornahme des Geschäfts nicht
    beanstandet oder ist er mit dem Handeln ohne Vertretungsmacht einverstanden, sind
    die Vorschriften über Verträge (§§ 177-179 BGB) entsprechend anzuwenden (§ 180
    S. 2 BGB).
  norms:
  - § 180 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
schemata:
- slug: zr-schema-votv-haftung-179
  title: Haftung des Vertreters ohne Vertretungsmacht, §§ 177, 179 BGB
  norms:
  - § 177 Abs. 1 BGB
  - § 178 BGB
  - § 179 Abs. 1 BGB
  - § 179 Abs. 2 BGB
  - § 179 Abs. 3 BGB
  quellen:
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  steps:
  - label: I. Vertragsschluss durch Vertreter ohne (ausreichende) Vertretungsmacht
    children:
    - label: 1. Handeln im fremden Namen (Offenkundigkeitsprinzip)
    - label: 2. Fehlende oder überschrittene Vertretungsmacht
  - label: II. Schwebende Unwirksamkeit des Vertrags, § 177 Abs. 1 BGB
  - label: III. Keine wirksame Genehmigung durch den Vertretenen
    children:
    - label: 1. Ausdrückliche oder konkludente Verweigerung
    - label: 2. Fristablauf nach Aufforderung, § 177 Abs. 2 S. 2 BGB (gilt als Verweigerung)
  - label: IV. Kein wirksamer Widerruf des anderen Teils vor der Genehmigung, § 178
      BGB
    hinweis: Ausgeschlossen, wenn der andere Teil den Mangel der Vertretungsmacht
      bei Vertragsschluss kannte.
  - label: V. Haftung des Vertreters, § 179 BGB
    children:
    - label: 1. Wahlrecht auf Erfüllung oder Schadensersatz bei Kenntnis des Vertreters,
        § 179 Abs. 1 BGB
    - label: 2. Nur Vertrauensschaden, begrenzt auf das Erfüllungsinteresse, bei
        Unkenntnis, § 179 Abs. 2 BGB
    - label: 3. Ausschluss bei Kenntnis/Kennenmüssen des anderen Teils, § 179 Abs.
        3 BGB
faelle:
- slug: zr-fall-oldtimer-onkel-votv
  title: Der voreilige Oldtimer-Verkauf
  difficulty: 3
  minutes: 55
  quellen:
  - Eigener Sachverhalt der Redaktion
  - BGB, amtliche Fassung
  facts: Autohändler A möchte seinem Sammlerkunden K einen seltenen Oldtimer vermitteln,
    der seinem Onkel O gehört. Ohne O vorher zu kontaktieren, bietet A dem K gegenüber
    im Namen des O den Wagen für 15.000 Euro zum Kauf an - A ist der festen Überzeugung,
    O werde ohnehin zustimmen, weil O ihm gegenüber einmal beiläufig gesagt habe,
    er könne sich einen Verkauf 'irgendwann' vorstellen; eine Vollmacht hat O dem
    A tatsächlich nie erteilt. K nimmt das Angebot sofort an. Als A anschließend
    O informiert, lehnt dieser den Verkauf entschieden ab, weil er den Wagen doch
    behalten möchte. K hatte im Vertrauen auf den Kauf bereits sein eigenes Fahrzeug
    an einen Interessenten zu einem Preis verkauft, der 500 Euro unter dem sonst erzielbaren
    Marktwert lag, um schnell handelseinig zu werden. K verlangt von A wahlweise Übereignung
    des Oldtimers oder Ersatz des ihm entstandenen Schadens.
  question: 'Kann K von A gemäß § 179 BGB Erfüllung oder Schadensersatz verlangen,
    und falls nur Schadensersatz in Betracht kommt: in welcher Höhe?'
  steps:
  - prompt: Formuliere den Obersatz zur Wirksamkeit des Kaufvertrags zwischen K und
      O.
    erwartung: Der zwischen K und O durch das Handeln des A vermittelte Kaufvertrag
      könnte gemäß § 177 Abs. 1 BGB schwebend unwirksam und wegen der Verweigerung
      der Genehmigung durch O endgültig unwirksam sein.
  - prompt: Fehlte dem A die erforderliche Vertretungsmacht?
    erwartung: Ja - O hat dem A weder eine Innen- noch eine Außenvollmacht erteilt;
      die beiläufige Äußerung des O begründet keine Vertretungsmacht.
  - prompt: Wie wirkt sich die Verweigerung der Genehmigung durch O aus?
    erwartung: Der Vertrag ist damit endgültig unwirksam, § 177 Abs. 1 BGB.
  - prompt: Kann K von A gemäß § 179 Abs. 1 BGB wahlweise Erfüllung verlangen?
    erwartung: Nein - das Wahlrecht auf Erfüllung nach § 179 Abs. 1 BGB setzt voraus,
      dass A den Mangel seiner Vertretungsmacht kannte. A war lediglich subjektiv
      überzeugt, O werde zustimmen, und hatte keine positive Kenntnis, dass ihm keine
      Vollmacht zustand - er 'kannte' den Mangel im Sinne der Vorschrift nicht, auch
      wenn seine Annahme fahrlässig war.
  - prompt: Auf welcher Grundlage und in welchem Umfang haftet A dann?
    erwartung: A haftet nach § 179 Abs. 2 BGB nur auf Ersatz des Vertrauensschadens,
      den K dadurch erlitten hat, dass er auf die Wirksamkeit des Vertrags vertraut
      hat - hier die 500 Euro Mindererlös aus dem eilig abgeschlossenen Verkauf seines
      eigenen Fahrzeugs. Der Ersatz ist zudem auf das Erfüllungsinteresse begrenzt.
  - prompt: Ist die Haftung des A nach § 179 Abs. 3 BGB ausgeschlossen?
    erwartung: Nein - K kannte den Mangel der Vertretungsmacht weder, noch musste
      er ihn kennen; er durfte auf die Angaben des A vertrauen.
  - prompt: Wie ist das Ergebnis zusammenzufassen?
    erwartung: K kann von A keine Erfüllung, sondern nur Ersatz des Vertrauensschadens
      in Höhe von 500 Euro verlangen, § 179 Abs. 2 BGB.
  expectation:
