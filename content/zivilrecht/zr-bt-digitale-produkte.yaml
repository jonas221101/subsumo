  steps:
  - label: I. Anwendbarkeit der §§ 327 ff. BGB
    hinweis: Verbrauchervertrag; digitales Produkt (Inhalt oder Dienstleistung); Preis oder
      personenbezogene Daten als Gegenleistung. Abgrenzung zur Ware mit digitalen Elementen
      (Kaufrecht).
  - label: II. Bereitstellung, § 327b BGB
  - label: III. Produktmangel, § 327e BGB
    children:
    - label: 1. Subjektive Anforderungen
    - label: 2. Objektive Anforderungen, auch Aktualisierungen, § 327f BGB
    - label: 3. Keine wirksame Abweichung, § 327h BGB
    - label: 4. Maßgeblicher Zeitpunkt und Beweislast, § 327k BGB
  - label: IV. Nacherfüllung, § 327l BGB
    hinweis: Vorrang; Fristsetzung.
  - label: V. Vertragsbeendigung oder Minderung, §§ 327m, 327n BGB
    hinweis: Nur nach erfolgloser oder entbehrlicher Nacherfüllung.
  - label: VI. Schadens- und Aufwendungsersatz, § 327i BGB iVm §§ 280 ff. BGB
faelle:
- slug: zr-fall-dig-lernsoftware
  title: Die Lernsoftware ohne Update
  difficulty: 3
  minutes: 45
  quellen:
  - Eigener Sachverhalt der Redaktion
  - BGB, amtliche Fassung
  facts: Verbraucherin V erwirbt im Online-Shop des Softwareunternehmens U die Lizenz für
    eine Lernsoftware, die sie gegen Zahlung von 49 Euro als Download erhält (einmalige Bereitstellung).
    Die Software läuft zunächst einwandfrei. Fünf Monate später stellt das Betriebssystem
    von V ein Sicherheitsupdate bereit; seitdem stürzt die Lernsoftware beim Start ab, weil
    sie mit der neuen Betriebssystemversion nicht kompatibel ist. U hat für die Software seit
    dem Verkauf keine Aktualisierung bereitgestellt, obwohl dies technisch ohne Weiteres möglich
    wäre und Käufer einer solchen Software erwarten dürfen, dass sie über einen längeren Zeitraum
    nutzbar bleibt. V fordert U schriftlich auf, innerhalb von 14 Tagen eine kompatible Version
    bereitzustellen. U reagiert nicht. V möchte den Vertrag beenden und ihre 49 Euro zurück.
  question: Kann V von U die Beendigung des Vertrags und Erstattung des Kaufpreises verlangen?
  steps:
  - prompt: Welches Recht ist anwendbar?
    erwartung: V ist Verbraucherin, U Unternehmer. Vertragsgegenstand ist ein digitaler Inhalt
      (Software als Download) gegen Zahlung eines Preises. Es gelten die §§ 327 ff. BGB (§
      327 Abs. 1, 2 BGB), nicht das Kaufrecht mit Gewährleistung nach §§ 434 ff. BGB.
  - prompt: Liegt ein Mangel vor?
    erwartung: Ja. U hätte nach § 327f Abs. 1 BGB Aktualisierungen bereitstellen müssen, die
      zum Erhalt der Vertragsmäßigkeit erforderlich sind, für den Zeitraum, den der Verbraucher
      erwarten darf. Die Nichtbereitstellung eines Kompatibilitäts-Updates führt zu einem
      Produktmangel (§ 327e BGB). Auf eine Haftungsbefreiung nach § 327f Abs. 2 BGB kann sich U nicht berufen, denn V trifft keine Obliegenheit zur Installation, weil U keine Aktualisierung bereitgestellt hat.
  - prompt: Welche Rechte stehen V zu und in welcher Reihenfolge?
    erwartung: Vorrangig kann V Nacherfüllung verlangen (§ 327l BGB), also Bereitstellung
      einer kompatiblen Version. Diese hat V verlangt; U hat sie nicht innerhalb angemessener Frist erbracht. Damit sind die Voraussetzungen der Vertragsbeendigung nach § 327m Abs. 1 Nr. 2 BGB erfüllt; ein Fall der Unerheblichkeit des Mangels liegt nicht vor.
  - prompt: Ergebnis?
    erwartung: V kann den Vertrag durch Erklärung gegenüber U beenden (§ 327m BGB) und die
      Erstattung der gezahlten 49 Euro verlangen. Die Rückabwicklung richtet sich nach den
      Sonderregeln der §§ 327o ff. BGB; V darf das digitale Produkt nicht weiter nutzen.
