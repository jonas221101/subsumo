- slug: zr-schema-dig-maengelrechte
  title: Rechte des Verbrauchers bei mangelhaftem digitalem Produkt, §§ 327 ff. BGB
  norms:
  - § 327 Abs. 1 BGB
  - § 327e BGB
  - § 327f BGB
  - § 327l BGB
