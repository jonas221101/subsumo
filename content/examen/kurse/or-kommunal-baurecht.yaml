kurs:
  slug: or-kommunal-baurecht
  title: Kommunal- und Baurecht
  area: oeffentliches-recht
  semester_default: 5
  examenskurs: false
  stand: 2026-09
  quellen:
  - Pflichtfachkataloge der Länder (§ 5a Abs. 2 DRiG; z. B. § 18 JAPO Bayern, § 11 JAG NRW)
  - Eigenformulierung Redaktion
  beschreibung: In Vorbereitung. Derzeit nur die Landesrecht-Wegweiserkarten des eigenen Bundeslands zu Kommunalverfassung und Bauordnung (je eine Orientierungskarte); eigene Themen zu Kommunalrecht, Bauplanungs- und Bauordnungsrecht folgen und sind examenszentral.
  lernziele:
  - Das Gesetz zur Kommunalverfassung und die Bauordnung des eigenen Landes benennen und einordnen (Orientierung, noch keine Klausurtiefe)
  - Hauptorgane der Gemeinde nach dem Landesrecht des eigenen Bundeslands nennen
  klausurformat:
    typ: Fortgeschrittenenklausur
    minuten: 180
  topic_slugs: []
  landesrecht_kategorien:
  - landesrecht-allgemein
  fehlende_themen:
  - Kommunalrecht (Gemeindeorgane, Satzung, Kommunalaufsicht, Gemeindewirtschaft) (P1)
  - Bauplanungsrecht §§ 29 ff. BauGB (P1)
  - Bauordnungsrecht und Nachbarschutz (P1)
