kurs:
  slug: zr-schuldrecht-bt-vertraglich
  title: 'Vertragliche Schuldverhältnisse (derzeit: Kaufrecht)'
  area: zivilrecht
  semester_default: 3
  examenskurs: false
  stand: 2026-09
  quellen:
  - Pflichtfachkataloge der Laender (§ 5a Abs. 2 DRiG; z. B. § 18 JAPO Bayern, § 11 JAG NRW)
  - Eigenformulierung Redaktion
  beschreibung: Derzeit nur Kaufrecht mit Mängelgewährleistung als Kern; Grundlagen des Kaufvertrags aus dem BGB AT werden vorausgesetzt und wiederholt. Weitere vertragliche Schuldverhältnisse (Werk, Miete, Bürgschaft, Darlehen) fehlen noch.
  lernziele:
  - Maengelrechte des Kaeufers (§§ 434 ff. BGB) vollstaendig und in der richtigen Reihenfolge pruefen
  - Nacherfuellung, Ruecktritt, Minderung und Schadensersatz im Kaufrecht abgrenzen
  klausurformat:
    typ: Fortgeschrittenenklausur
    minuten: 180
  topic_slugs:
