  - zr-bgb-at
  landesrecht_kategorien: []
  fehlende_themen:
  - Verbrauchsgüterkauf, Gefahrübergang und Unternehmerregress (§§ 474 ff., 446 BGB) (P1)
  - Werkvertragsrecht, § 631 BGB (P1)
  - Mietrecht (P1)
  - Bürgschaft und Darlehen (P2)
  - Schenkung, Auftrag, Dienstvertrag (P3)
