kurs:
  slug: sr-bt-2
  title: 'Strafrecht BT II: Vermögensdelikte'
  area: strafrecht
  semester_default: 4
  examenskurs: false
  stand: 2026-09
  quellen:
  - Pflichtfachkataloge der Länder (§ 5a Abs. 2 DRiG; z. B. § 18 JAPO Bayern, § 11 JAG NRW)
  - Eigenformulierung Redaktion
  beschreibung: Diebstahl (inkl. §§ 243, 244), Unterschlagung, Raub, Erpressung, Betrug, Untreue sowie Anschlussdelikte (§§ 257-259) - der dichteste Klausurblock des Strafrechts. Sachbeschädigung, Computerbetrug und Brandstiftung fehlen noch.
  lernziele:
  - Wegnahme, Zueignungsabsicht und Gewahrsamsbegriff (§ 242 StGB) beherrschen
  - Betrug in der Vierschrittprüfung (Täuschung, Irrtum, Vermögensverfügung, Schaden) aufbauen
  - Raub, räuberische Erpressung und Diebstahl abgrenzen
  klausurformat:
    typ: Fortgeschrittenenklausur
    minuten: 180
  topic_slugs:
  - sr-bt-diebstahl
  - sr-bt-unterschlagung-246
  - sr-bt-raub
  - sr-bt-erpressung-253
  - sr-bt-betrug
  - sr-bt-untreue-266
  - sr-bt-diebstahl-qualifikationen-244
  - sr-bt-anschlussdelikte-257-259
  landesrecht_kategorien: []
  fehlende_themen:
  - Sachbeschädigung §§ 303 ff. StGB (P1)
  - Computerbetrug § 263a, Leistungserschleichung § 265a StGB (P1)
  - Räuberischer Diebstahl § 252, räuberischer Angriff auf Kraftfahrer § 316a StGB (P1)
  - Brandstiftungsdelikte §§ 306 ff. StGB (P1)
  - 'Urkundendelikte vertiefen: §§ 268, 269, 271, 274 StGB (P2)'
  - Insolvenz-/Wirtschaftsdelikte und Geldwäsche § 261 StGB (P3)
