  title: 'Strafrecht BT I: Delikte gegen die Person und Urkundendelikte'
  area: strafrecht
  semester_default: 3
  examenskurs: false
  stand: 2026-10
  quellen:
  - Pflichtfachkataloge der Länder (§ 5a Abs. 2 DRiG; z. B. § 18 JAPO Bayern, § 11 JAG NRW)
  - Eigenformulierung Redaktion
  beschreibung: 'Straftaten gegen Leben, körperliche Unversehrtheit, persönliche Freiheit und Ehre: Tötungs- und
    Körperverletzungsdelikte samt Ergänzungen, Aussetzung, Nötigung, Freiheitsdelikte, Geiselnahme, Grundzüge der
    Sexualdelikte, Ehrdelikte und Hausfriedensbruch sowie Urkundenfälschung.'
  lernziele:
  - Mordmerkmale systematisch prüfen und gegen den Vorsatz abgrenzen
  - Körperverletzungsdelikte (§§ 223 ff. StGB) einschließlich Qualifikationen aufbauen
  - Freiheitsdelikte (§§ 239, 239a, 239b, 240 StGB) abgrenzen
  - Beleidigungsdelikte und Rechtfertigung (§ 193 StGB) prüfen
  - Urkundenbegriff und Taathandlungen des § 267 StGB sicher subsumieren
