  - Eigenformulierung Redaktion
  beschreibung: Wiederholung von AT und BT auf Examensniveau, mit Blick auf mehrpersonale Sachverhalte und Konkurrenzfragen. Grundstock mit Schwerpunkt AT und Vermögensdelikten; Randdelikte (Brandstiftung, Aussage, Straßenverkehr), Freiheitsdelikte und die StPO fehlen noch.
  lernziele:
  - Mehrpersonale Sachverhalte nach Tatkomplexen und Beteiligten gliedern
  - AT-Figuren (Versuch, Irrtum, Beteiligung) innerhalb der BT-Delikte sicher anwenden
