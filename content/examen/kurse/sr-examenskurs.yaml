kurs:
  slug: sr-examenskurs
  title: Examenskurs Strafrecht
  area: strafrecht
  semester_default: 7
  examenskurs: true
  stand: 2026-10
  quellen:
  - Pflichtfachkataloge der Länder (§ 5a Abs. 2 DRiG; z. B. § 18 JAPO Bayern, § 11 JAG NRW)
  - Eigenformulierung Redaktion
  beschreibung: 'Wiederholung des Strafrechts auf Examensniveau: Allgemeiner Teil, Delikte gegen Person und Vermögen,
    Randdelikte (Brandstiftung, Aussage, Straßenverkehr, Amtsdelikte) und Strafprozessrecht, mit Blick auf mehrpersonale
    Sachverhalte und Konkurrenzfragen.'
  lernziele:
  - Mehrpersonale Sachverhalte nach Tatkomplexen und Beteiligten gliedern
  - AT-Figuren (Versuch, Irrtum, Beteiligung) innerhalb der BT-Delikte sicher anwenden
  - Konkurrenzen im Gutachten sauber auflösen
  - Strafprozessuale Zusatzfragen (Beweisverwertung, Zwangsmaßnahmen, Rechtsmittel) in die Klausur einbetten
  klausurformat:
    typ: Examensklausur
    minuten: 300
