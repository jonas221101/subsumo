  title: Verwaltungsrecht Allgemeiner Teil
  area: oeffentliches-recht
  semester_default: 3
  examenskurs: false
  stand: 2026-10
  quellen:
  - Pflichtfachkataloge der Länder (§ 5a Abs. 2 DRiG; z. B. § 18 JAPO Bayern, § 11 JAG NRW)
  - Eigenformulierung Redaktion
  beschreibung: Verwaltungsakt, Rechtmäßigkeitsprüfung, Ermessen, Nebenbestimmungen, Rücknahme und Widerruf, öffentlich-rechtlicher
    Vertrag und Realakt, Planfeststellung und Subventionen - nach dem Verwaltungsverfahrensgesetz des eigenen Bundeslands.
  lernziele:
  - Verwaltungsakt (§ 35 VwVfG) definieren und abgrenzen
  - Formelle und materielle Rechtmäßigkeit eines VA vollständig prüfen
  - §§ 48, 49 VwVfG mit Vertrauensschutz anwenden
  - Das richtige Landes-VwVfG zitieren (Vollgesetz oder Verweisung)
