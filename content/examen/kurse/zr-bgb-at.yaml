kurs:
  slug: zr-bgb-at
  title: BGB Allgemeiner Teil
  area: zivilrecht
  semester_default: 1
  examenskurs: false
  stand: 2026-10
  quellen:
  - Pflichtfachkataloge der Länder (§ 5a Abs. 2 DRiG; z. B. § 18 JAPO Bayern, § 11 JAG NRW)
  - Eigenformulierung Redaktion
  beschreibung: 'Rechtsgeschäftslehre als Fundament des gesamten Zivilrechts: Willenserklärung und Willensmängel,
    Vertragsschluss, Form, Nichtigkeit (§§ 134, 138), Anfechtung (auch §§ 123, 124), Bedingung und Befristung, Stellvertretung,
    Zustimmung und Genehmigung, Geschäftsfähigkeit, Verjährung. Der Pflichtstoff des BGB AT ist damit abgedeckt.'
  lernziele:
  - Willenserklärung, Zugang und Vertragsschluss (Angebot, Annahme, Dissens) sauber voneinander trennen
  - Anfechtungsgründe sicher voneinander abgrenzen (§§ 119, 120, 123 BGB) und Fristen prüfen
  - Formvorschriften, Verbotsgesetze und Sittenwidrigkeit (§§ 125, 134, 138 BGB) samt Rechtsfolgen (§§ 139, 140
    BGB) anwenden
  - Stellvertretung inklusive Vertreter ohne Vertretungsmacht und Genehmigung (§§ 177, 184 BGB) aufbauen
  - Minderjährigenrecht (§§ 104 ff. BGB) auf Fälle anwenden
  klausurformat:
    typ: Anfängerklausur
    minuten: 120
