  title: 'Strafrecht AT II: Versuch, Beteiligung, Unterlassen, Fahrlässigkeit'
  area: strafrecht
  semester_default: 2
  examenskurs: false
  stand: 2026-10
  quellen:
  - Pflichtfachkataloge der Länder (§ 5a Abs. 2 DRiG; z. B. § 18 JAPO Bayern, § 11 JAG NRW)
  - Eigenformulierung Redaktion
  beschreibung: Die Erweiterungen des Grunddelikts (Versuch/Rücktritt, Täterschaft/Teilnahme, Unterlassen, Fahrlässigkeit),
    die Konkurrenzen §§ 52, 53 StGB sowie Strafzumessung und Strafaussetzung. Versuch und Beteiligung sind auch
    in der Vertiefung (§ 28, mittelbare Täterschaft, § 30) abgedeckt.
  lernziele:
  - Versuchsaufbau mit Tatentschluss und unmittelbarem Ansetzen, Rücktritt nach § 24 StGB
  - Täterschaft und Teilnahme (§§ 25-27 StGB) abgrenzen
  - Unterlassungsdelikt (§ 13 StGB) und Fahrlässigkeitsdelikt aufbauen
