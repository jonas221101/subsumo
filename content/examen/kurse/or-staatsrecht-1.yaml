kurs:
  slug: or-staatsrecht-1
  title: 'Staatsrecht I: Staatsorganisationsrecht'
  area: oeffentliches-recht
  semester_default: 1
  examenskurs: false
  stand: 2026-10
  quellen:
  - Pflichtfachkataloge der Länder (§ 5a Abs. 2 DRiG; z. B. § 18 JAPO Bayern, § 11 JAG NRW)
  - Eigenformulierung Redaktion
  beschreibung: Staatsstrukturprinzipien und Wahlrechtsgrundsätze, Verfassungsorgane, Abgeordnete und Parteien,
    Gesetzgebungskompetenzen und -verfahren, Verwaltungskompetenzen und Finanzverfassung, Bundestreue sowie die
    Verfahren Organstreit, Normenkontrolle und Bund-Länder-Streit - ergänzt um die Verfassung des eigenen Bundeslands.
  lernziele:
  - Gesetzgebungsverfahren (Art. 76 ff. GG) mit Zustimmungs-/Einspruchsgesetz prüfen
  - Stellung und Befugnisse der Verfassungsorgane sowie Abgeordnetenstatus und Parteienrecht einordnen
  - Organstreitverfahren und Bund-Länder-Streit in Zulässigkeit und Begründetheit aufbauen
  - Verwaltungskompetenzen und Finanzverfassung (Art. 83 ff., 104a ff. GG) anwenden
  - Landesverfassung und Landesverfassungsgericht des eigenen Bundeslands einordnen
  klausurformat:
    typ: Anfängerklausur
    minuten: 120
