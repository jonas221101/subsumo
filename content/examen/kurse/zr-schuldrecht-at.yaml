kurs:
  slug: zr-schuldrecht-at
  title: Schuldrecht Allgemeiner Teil
  area: zivilrecht
  semester_default: 2
  examenskurs: false
  stand: 2026-10
  quellen:
  - Pflichtfachkataloge der Länder (§ 5a Abs. 2 DRiG; z. B. § 18 JAPO Bayern, § 11 JAG NRW)
  - Eigenformulierung Redaktion
  beschreibung: 'Leistungsstörungsrecht und allgemeines Schuldrecht: Vertretenmüssen und Gehilfenzurechnung, Unmöglichkeit,
    Verzug, Gläubigerverzug, Schadensersatz statt der Leistung, Rücktritt, vorvertragliche Pflichten, AGB-Kontrolle,
    Abtretung, Schuldübernahme, Erlöschen, Gesamtschuld, Verträge mit Drittwirkung, Störung der Geschäftsgrundlage,
    Verbraucherwiderruf und Schadensrecht (§§ 249-254 BGB). Der Pflichtstoff ist abgedeckt.'
  lernziele:
  - Das System der §§ 280 ff. BGB als Anspruchsgrundlagen-Baukasten beherrschen
  - Vertretenmüssen (§§ 276, 278 BGB) und Gehilfenzurechnung in der Klausur sauber prüfen
  - Unmöglichkeit (§ 275 BGB) und ihre Rechtsfolgen (§§ 283, 326 BGB) prüfen
  - Verzug, Gläubigerverzug und Rücktritt in der Klausur sauber voneinander trennen
  - Erlöschenstatbestände, Gesamtschuld und Gesamtschuldnerausgleich anwenden
  - Verträge mit Drittwirkung (§ 328 BGB, Schutzwirkung, Drittschadensliquidation) abgrenzen
  - AGB-Kontrolle und Verbraucherwiderruf als Einbettung in einen Vertragsfall anwenden
  klausurformat:
    typ: Anfängerklausur
    minuten: 120
