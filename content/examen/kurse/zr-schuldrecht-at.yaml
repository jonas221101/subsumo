  landesrecht_kategorien: []
  fehlende_themen:
  - §§ 276, 278 BGB (Vertretenmüssen, Erfüllungsgehilfe) als eigenes Thema (P1)
  - Gesamtschuld, Aufrechnung, Erfüllung und Erfüllungssurrogate (P1)
  - Vertrag mit Schutzwirkung zugunsten Dritter, § 328 BGB, Drittschadensliquidation (P1)
  - Störung der Geschäftsgrundlage, § 313 BGB (P2)
