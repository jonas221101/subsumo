kurs:
  slug: zr-schuldrecht-bt-gesetzlich
  title: 'Schuldrecht BT II: Gesetzliche Schuldverhältnisse'
  area: zivilrecht
  semester_default: 4
  examenskurs: false
  stand: 2026-10
  quellen:
  - Pflichtfachkataloge der Länder (§ 5a Abs. 2 DRiG; z. B. § 18 JAPO Bayern, § 11 JAG NRW)
  - Eigenformulierung Redaktion
  beschreibung: Deliktsrecht (§§ 823 ff. BGB, Verkehrspflichten, Gefährdungshaftung nach ProdHaftG und StVG) und
    Bereicherungsrecht (§§ 812 ff. BGB, auch im Mehrpersonenverhältnis) sowie die GoA - die Anspruchsgruppen, die
    in fast jeder Zivilrechtsklausur auftauchen.
  lernziele:
  - § 823 Abs. 1, Abs. 2 und § 826 BGB sowie § 831 und § 833 BGB als Anspruchsgrundlagen prüfen
  - Leistungskondiktion von der Nichtleistungskondiktion (§§ 812 Abs. 1 S. 1 Alt. 2, 816 BGB) abgrenzen
  - Geschäftsführung ohne Auftrag (§§ 677 ff. BGB) einordnen und aufbauen
  klausurformat:
    typ: Fortgeschrittenenklausur
    minuten: 180
