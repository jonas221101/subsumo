kurs:
  slug: zr-examenskurs
  title: Examenskurs Zivilrecht
  area: zivilrecht
  semester_default: 7
  examenskurs: true
  stand: 2026-10
  quellen:
  - Pflichtfachkataloge der Länder (§ 5a Abs. 2 DRiG; z. B. § 18 JAPO Bayern, § 11 JAG NRW)
  - Eigenformulierung Redaktion
  beschreibung: 'Wiederholung des zivilrechtlichen Pflichtstoffs auf Examensniveau: BGB AT, allgemeines Schuldrecht,
    vertragliche und gesetzliche Schuldverhältnisse, Sachenrecht (Mobiliar und Immobiliar) sowie die Nebengebiete
    in Grundzügen (Handels-, Gesellschafts-, Erb-, Familien-, Arbeitsrecht, ZPO).'
  lernziele:
  - Fünfstündige Examensklausuren mit mehreren Anspruchsverhältnissen strukturieren
  - Anspruchsgrundlagen aus Vertrag, Delikt, Bereicherung und Sachenrecht in der richtigen Reihenfolge prüfen
  - Mehrpersonenverhältnisse (Drittwirkung, Abtretung, Gesamtschuld, Bereicherung) sicher lösen
  - Nebengebiete (HGB, Gesellschafts-, Erb-, Familien-, Arbeitsrecht, ZPO) in Grundzügen in Klausuren einbetten
  klausurformat:
    typ: Examensklausur
    minuten: 300
