  fehlende_themen:
  - Vertrag zugunsten/mit Schutzwirkung für Dritte, § 328 BGB, Drittschadensliquidation (P1)
  - §§ 276, 278 BGB, Gesamtschuld, Aufrechnung, Erfüllung (P1)
  - Form, §§ 134, 138 BGB, Bedingung, §§ 116-118 BGB (P1)
  - Eigentumsvorbehalt/Anwartschaftsrecht, §§ 946 ff. BGB (P1)
  - Immobiliarsachenrecht und Besitz (P1)
  - Verbrauchsgüterkauf, Werk-, Miet-, Bürgschafts- und Darlehensvertrag (P1)
  - Bereicherungsrecht bei Mehrpersonenverhältnissen (P1)
  - Deliktsrecht vertiefen (Produkthaftung, § 7 StVG, § 839 BGB) (P2)
  - Störung der Geschäftsgrundlage, § 313 BGB, Verbraucherwiderruf (P2)
  - Handels- und Gesellschaftsrecht (HGB, GbR/MoPeG) (P2)
  - Familien- und Erbrecht Grundzüge (P3)
  - Arbeitsrecht (P3)
  - ZPO-Grundzüge (P3)
