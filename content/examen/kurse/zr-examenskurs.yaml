kurs:
  slug: zr-examenskurs
  title: Examenskurs Zivilrecht
  area: zivilrecht
  semester_default: 7
  examenskurs: true
  stand: 2026-09
  quellen:
  - Pflichtfachkataloge der Laender (§ 5a Abs. 2 DRiG; z. B. § 18 JAPO Bayern, § 11 JAG NRW)
  - Eigenformulierung Redaktion
  beschreibung: 'Wiederholung des zivilrechtlichen Kernstoffs auf Examensniveau (BGB AT, allgemeines Schuldrecht, Kauf, Delikt, Bereicherung, GoA, Mobiliarsachenrecht). Grundstock, noch nicht der gesamte Pflichtstoff: es fehlen u. a. Verträge mit Drittbezug, Werk-/Miet-/Sicherungsverträge, Immobiliarsachenrecht, Handels- und Gesellschaftsrecht.'
  lernziele:
  - Die bereits abgedeckten zivilrechtlichen Anspruchsgrundlagen sicher benennen und aufbauen
  - Fünfstündige Examensklausuren mit mehreren Anspruchsverhältnissen strukturieren (auf Basis des vorhandenen Grundstocks)
  klausurformat:
    typ: Examensklausur
    minuten: 300
