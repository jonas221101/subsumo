kurs:
  slug: or-examenskurs
  title: Examenskurs Öffentliches Recht
  area: oeffentliches-recht
  semester_default: 7
  examenskurs: true
  stand: 2026-10
  quellen:
  - Pflichtfachkataloge der Länder (§ 5a Abs. 2 DRiG; z. B. § 18 JAPO Bayern, § 11 JAG NRW)
  - Eigenformulierung Redaktion
  beschreibung: 'Wiederholung des Öffentlichen Rechts auf Examensniveau: Staatsorganisationsrecht, Grundrechte,
    Verfassungsprozess, Verwaltungsrecht AT und BT (Polizei-, Kommunal-, Baurecht), Verwaltungsprozess, Staatshaftung,
    Verwaltungsvollstreckung und Europarecht, ergänzt um das Landesrecht des eigenen Bundeslands (Polizei, Verfassung,
    Kommunal- und Bauordnungsrecht).'
  lernziele:
  - Verwaltungsrechtliche Examensklausur mit Landesrecht als Ermächtigungsgrundlage strukturieren
  - Verfassungsrechtliche Klausur mit Verfassungsbeschwerde, Normenkontrolle oder Organstreit aufbauen
  - Kommunal- und baurechtliche Einkleidungen in Verwaltungsprozessklausuren lösen
  - Unionsrechtliche Bezüge und Staatshaftungsansprüche in die Klausur einbetten
  klausurformat:
    typ: Examensklausur
    minuten: 300
