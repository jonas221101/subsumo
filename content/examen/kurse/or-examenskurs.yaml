  landesrecht_kategorien:
  - polizei-ordnungsrecht
  - landesrecht-allgemein
  fehlende_themen:
  - Kommunalrecht (P1)
  - Bauplanungsrecht §§ 29 ff. BauGB und Bauordnungsrecht/Nachbarschutz (P1)
  - Europarecht/Unionsrecht Grundzüge (P1)
  - Verfassungsorgane Art. 62 ff., Abgeordnete/Parteien Art. 21, 38, 46-48 GG (P1)
  - Grundrechte AT und weitere Grundrechte (Art. 4, 5 Abs. 3, 2 Abs. 2, 1 GG) (P1)
  - Verwaltungsrechtsweg § 40 VwGO, Widerspruchsverfahren, § 123 VwGO als eigenes Thema (P1)
  - Staatshaftung (P1)
  - 'Polizeirecht vertiefen: Störerauswahl, Zwang, Kosten (P1)'
  - Justizgrundrechte, Art. 13, 10, 9, 11, 6 GG (P2)
  - Öffentlich-rechtlicher Vertrag, Realakt (P2)
  - Verwaltungsvollstreckung, Art. 83 ff. GG (P2)
  - Bund-Länder-Streit, § 32 BVerfGG, Finanzverfassung (P2)
