kurs:
  slug: or-examenskurs
  title: Examenskurs Öffentliches Recht
  area: oeffentliches-recht
  semester_default: 7
  examenskurs: true
  stand: 2026-09
  quellen:
  - Pflichtfachkataloge der Länder (§ 5a Abs. 2 DRiG; z. B. § 18 JAPO Bayern, § 11 JAG NRW)
  - Eigenformulierung Redaktion
  beschreibung: Wiederholung von Staats- und Verwaltungsrecht auf Examensniveau, ergänzt um das Landesrecht-Wegweiserdeck des eigenen Bundeslands (Polizei, Verfassung, Kommunal-/Baurecht als Orientierung). Grundstock; Kommunal-, Bau- und Europarecht, Staatshaftung sowie viele Grundrechte fehlen noch.
  lernziele:
  - Verwaltungsrechtliche Examensklausur mit Landesrecht als Ermächtigungsgrundlage strukturieren (soweit abgedeckt)
  - Verfassungsrechtliche Klausur mit Verfassungsbeschwerde, Normenkontrolle oder Organstreit aufbauen
  klausurformat:
    typ: Examensklausur
    minuten: 300
