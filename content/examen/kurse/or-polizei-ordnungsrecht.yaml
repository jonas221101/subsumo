kurs:
  slug: or-polizei-ordnungsrecht
  title: Polizei- und Ordnungsrecht
  area: oeffentliches-recht
  semester_default: 5
  examenskurs: false
  stand: 2026-10
  quellen:
  - Pflichtfachkataloge der Länder (§ 5a Abs. 2 DRiG; z. B. § 18 JAPO Bayern, § 11 JAG NRW)
  - Eigenformulierung Redaktion
  beschreibung: 'Gefahrenabwehrrecht nach dem Polizei-/Ordnungsgesetz des eigenen Bundeslands: Generalklausel, Standardmaßnahmen,
    Störerauswahl, Nichtstörer, Zuständigkeit, Vollstreckung, Kosten und Versammlungsrecht.'
  lernziele:
  - Rechtmäßigkeit einer Gefahrenabwehrmaßnahme nach Landesrecht aufbauen
  - Generalklausel und Standardmaßnahmen des eigenen Landes mit Fundstelle zitieren
  - Störerauswahl, Nichtstörerinanspruchnahme und polizeilichen Notstand prüfen
  - Versammlungsrechtliche Maßnahmen (Auflagen, Verbot, Auflösung) nach Polizeifestigkeit und § 15 VersG/Landesrecht
    prüfen
  klausurformat:
    typ: Fortgeschrittenenklausur
    minuten: 180
