kurs:
  slug: or-staatsrecht-2
  title: 'Staatsrecht II: Grundrechte'
  area: oeffentliches-recht
  semester_default: 2
  examenskurs: false
  stand: 2026-10
  quellen:
  - Pflichtfachkataloge der Länder (§ 5a Abs. 2 DRiG; z. B. § 18 JAPO Bayern, § 11 JAG NRW)
  - Eigenformulierung Redaktion
  beschreibung: 'Grundrechte vollständig: Allgemeine Lehren (Berechtigung, Bindung, Schutzpflichten, Drittwirkung),
    Freiheitsrechte, Gleichheitsrechte und Justizgrundrechte mit der Verfassungsbeschwerde als Einkleidung.'
  lernziele:
  - Dreistufige Grundrechtsprüfung sicher schreiben
  - Grundrechtsberechtigung, Bindung, Schutzpflichten und Drittwirkung einordnen
  - Verfassungsbeschwerde zum BVerfG und - wo vorhanden - zum Landesverfassungsgericht aufbauen
  - Spezielle Grundrechte (Art. 1, 2, 3, 4, 5, 6, 8, 9, 12, 13, 14 GG) mit ihren Schrankensystemen abgrenzen
  - Justizgrundrechte und Art. 33 GG prüfen
  klausurformat:
    typ: Anfängerklausur
    minuten: 120
