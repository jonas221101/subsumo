kurs:
  slug: or-staatsrecht-2
  title: 'Staatsrecht II: Grundrechte'
  area: oeffentliches-recht
  semester_default: 2
  examenskurs: false
  stand: 2026-09
  quellen:
  - Pflichtfachkataloge der Laender (§ 5a Abs. 2 DRiG; z. B. § 18 JAPO Bayern, § 11 JAG NRW)
  - Eigenformulierung Redaktion
  beschreibung: Grundrechtsprüfung (Schutzbereich, Eingriff, Rechtfertigung) an den examensrelevantesten Grundrechten, mit der Verfassungsbeschwerde als Einkleidung. Weitere Grundrechte und Grundrechte AT fehlen noch.
  lernziele:
  - Dreistufige Grundrechtspruefung sicher schreiben
  - Verfassungsbeschwerde zum BVerfG und - wo vorhanden - zum Landesverfassungsgericht aufbauen
  - Spezielle Grundrechte (Art. 5, 8, 12, 14 GG) mit ihren Schrankensystemen abgrenzen
  klausurformat:
    typ: Anfaengerklausur
    minuten: 120
