  fehlende_themen:
  - 'Grundrechte AT: Schutzpflichten, Drittwirkung, Grundrechtsträger und -bindung (P1)'
  - Art. 4, 5 Abs. 3, Pressefreiheit, Art. 2 Abs. 2 und Art. 1 GG (P1)
  - Justizgrundrechte, Art. 13, 10, 9, 11, 6 GG (P2)
