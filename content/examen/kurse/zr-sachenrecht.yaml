  - Eigenformulierung Redaktion
  beschreibung: 'Mobiliar- und Immobiliarsachenrecht: Besitz und Besitzschutz, Eigentumsherausgabe, rechtsgeschäftlicher,
    gutgläubiger und gesetzlicher Erwerb, Sicherungsübereignung, Eigentumsvorbehalt und Anwartschaftsrecht, Eigentümer-Besitzer-Verhältnis,
    § 1004 BGB, Grundbuch, Auflassung, Vormerkung sowie Grundpfandrechte und Pfandrecht.'
  lernziele:
  - § 985 BGB mit Eigentumshistorie (chronologische Prüfung) aufbauen
  - Erwerb vom Nichtberechtigten (§§ 932 ff., 892 BGB) sicher prüfen
  - Sicherungsübereignung, Eigentumsvorbehalt und Anwartschaftsrecht als Kreditsicherheiten einordnen
  - Besitzarten und Besitzschutz (§§ 854 ff. BGB) anwenden
  - Grundstückserwerb (Auflassung, Eintragung, Vormerkung) und Grundpfandrechte aufbauen
