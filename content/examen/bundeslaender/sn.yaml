bundesland:
  code: SN
  name: Sachsen
  stand: 2026-09
  quellen:
  - Sächsisches Juristenausbildungsgesetz (SächsJAG) mit SächsJAPO (Landesrecht, amtliche Fassung)
  - Deutsches Richtergesetz (DRiG), §§ 5 ff.
  - Eigenformulierung Redaktion
  redaktion:
    erzeugt_von: claude-code (Redaktionsentwurf)
    status: in-pruefung
    normzitate_geprueft: false
    hinweis: Struktur- und Normangaben aus Redaktionswissen, nicht gegen die aktuelle Fassung von JAG/JAPO
      und Landesgesetzen verifiziert. Vor Freigabe die 'pruefliste_redaktion' abarbeiten (docs/32-examensvorbereitung.md
      Abschnitt 7).
  pruefungsamt:
    name: Landesjustizprüfungsamt beim Sächsischen Staatsministerium der Justiz
    sitz: Leipzig
  pruefungsordnung: Sächsisches Juristenausbildungsgesetz (SächsJAG) mit SächsJAPO
  klausuren:
    anzahl: 6
    dauer_minuten: 300
    verteilung:
      zivilrecht: 3
      strafrecht: 1
      oeffentliches-recht: 2
    hinweis: Fünfstündige Aufsichtsarbeiten. Die Verteilung auf die Rechtsgebiete bestimmt die Gewichtung
      der Examensreife im Examen-Reiter.
  hausarbeit: false
  muendliche_pruefung:
    beschreibung: Prüfungsgespräch in allen drei Rechtsgebieten nach bestandenem schriftlichen Teil;
      vielerorts mit Kurzvortrag.
  termine:
  - Zwei Prüfungsdurchgänge pro Jahr
  freiversuch:
    beschreibung: Freiversuch bei erstmaliger Meldung nach ununterbrochenem Studium bis zum Ende des achten
      Fachsemesters; ein nicht bestandener Freiversuch gilt als nicht unternommen. Anrechnungsregeln (Auslandssemester,
      Krankheit) im JAG des Landes.
  abschichtung:
    moeglich: false
    beschreibung: Keine Abschichtung - alle Aufsichtsarbeiten in einem Termin.
  notenverbesserung:
    beschreibung: Wer im Freiversuch bestanden hat, kann die Prüfung einmal zur Notenverbesserung wiederholen;
      die bessere Note zählt.
  hilfsmittel:
  - Schönfelder, Deutsche Gesetze (mit Ergänzungsband)
  - Sartorius I, Verfassungs- und Verwaltungsgesetze
  - Sächsische Landesrechtssammlung in der zugelassenen Ausgabe
  landesrecht:
    schwerpunkte:
    - Polizeirecht (SächsPVDG, SächsPBG)
    - Kommunalrecht (SächsGemO)
    - Bauordnungsrecht (SächsBO)
    - Landesverfassung
    normenspiegel:
      polizeigesetz: Sächsisches Polizeivollzugsdienstgesetz (SächsPVDG) und Sächsisches Polizeibehördengesetz
        (SächsPBG) - seit 2020 anstelle des SächsPolG
      polizei_generalklausel: § 12 SächsPVDG (Polizeivollzugsdienst); § 12 SächsPBG (Polizeibehörden)
        - Nummerierung prüfen
      stoerer: Verhaltens-, Zustands- und Nichtstörer im SächsPVDG (Fundstelle prüfen)
      ordnungsbehoerden: Polizeibehörden (Gemeinden, Landkreise, Landesdirektion) nach SächsPBG; Polizeivollzugsdienst
        nach SächsPVDG
      verwaltungsverfahrensgesetz: Sächsisches Verwaltungsverfahrens- und Verwaltungszustellungsgesetz
        (SächsVwVfZG) - Verweisung auf das VwVfG des Bundes
      vollstreckung: Sächsisches Verwaltungsvollstreckungsgesetz (SächsVwVG)
      kommunalverfassung: 'Sächsische Gemeindeordnung (SächsGemO): Gemeinderat (§ 27) und Bürgermeister
        (§ 51)'
      bauordnung: Sächsische Bauordnung (SächsBO)
      landesverfassung: Verfassung des Freistaates Sachsen (SächsVerf)
      verfassungsgericht: Verfassungsgerichtshof des Freistaates Sachsen
      individualverfassungsbeschwerde: Ja - Art. 81 Abs. 1 Nr. 4 SächsVerf
    besonderheiten:
    - Die Polizeirechtsreform (in Kraft seit 2020) hat das SächsPolG in zwei Gesetze aufgeteilt - Lernmaterial vor 2020
      ist veraltet.
  checkliste:
  - monate_vor_examen: 12
    titel: Meldefristen und Freiversuch prüfen
    detail: Fachsemesterzählung, Anrechnung von Auslands-/Urlaubssemestern und die Meldefrist beim Prüfungsamt
      klären - der Freiversuch hängt am Datum der Meldung, nicht am Klausurtermin.
  - monate_vor_examen: 9
    titel: Landesrecht in den Lernplan aufnehmen
    detail: Polizei- und Ordnungsrecht, Kommunalrecht, Bauordnungsrecht und das Landesverfassungsrecht
      werden im Öffentlichen Recht regelmäßig geprüft - das Landesrecht-Deck im Examen-Reiter deckt
      die Normenkenntnis ab.
  - monate_vor_examen: 6
    titel: Zugelassene Hilfsmittel besorgen und einrichten
    detail: Gesetzessammlungen in der zugelassenen Ausgabe, Nachlieferungen einsortieren, Markierungsregeln
      des Prüfungsamts beachten (keine Kommentierungen).
  - monate_vor_examen: 4
    titel: Klausuren unter Examensbedingungen schreiben
    detail: Fünf Stunden am Stück, handschriftlich oder wie in der Prüfung vorgesehen, mit den zugelassenen
      Hilfsmitteln - der Samstags-Klausurtag im Lernplan ist dafür reserviert.
  - monate_vor_examen: 2
    titel: Meldung zur Prüfung abgeben
    detail: Unterlagen (Leistungsnachweise, Schlüsselqualifikation, Fremdsprache, Praktika) vollständig
      einreichen.
  - monate_vor_examen: 1
    titel: 'Endspurt: Wiederholung statt Neues'
    detail: Keine neuen Themen mehr anfangen. Fällige Karten, Schemata rekonstruieren, Schwachstellen
      aus den Klausur-Rückmeldungen gezielt nacharbeiten.
  pruefliste_redaktion:
  - Zahl, Dauer und Verteilung der Aufsichtsarbeiten gegen die aktuelle JAG/JAPO-Fassung prüfen
  - Ob ein Hausarbeits-/Aktenvortragsanteil zur staatlichen Pflichtfachprüfung gehört
  - Prüfungstermine des laufenden Jahres beim Prüfungsamt abgleichen
  - Freiversuchs- und Notenverbesserungsregel (Semesterzahl, Fristen) prüfen
  - Zugelassene Hilfsmittel gegen die aktuelle Hilfsmittelbekanntmachung prüfen
  - Alle Normzitate im Normenspiegel gegen die geltende Gesetzesfassung prüfen
  - Generalklausel und Störerregeln im SächsPVDG/SächsPBG mit Paragraphennummer belegen
