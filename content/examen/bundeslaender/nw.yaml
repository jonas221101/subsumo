bundesland:
  code: NW
  name: Nordrhein-Westfalen
  stand: 2026-09
  quellen:
  - Juristenausbildungsgesetz Nordrhein-Westfalen (JAG NRW) (Landesrecht, amtliche Fassung)
  - Deutsches Richtergesetz (DRiG), §§ 5 ff.
  - Eigenformulierung Redaktion
  redaktion:
    erzeugt_von: claude-code (Redaktionsentwurf)
    status: in-pruefung
    normzitate_geprueft: false
    hinweis: Struktur- und Normangaben aus Redaktionswissen, nicht gegen die aktuelle Fassung von JAG/JAPO
      und Landesgesetzen verifiziert. Vor Freigabe die 'pruefliste_redaktion' abarbeiten (docs/32-examensvorbereitung.md
      Abschnitt 7).
  pruefungsamt:
    name: Landesjustizprüfungsamt beim Ministerium der Justiz NRW; Justizprüfungsämter bei den Oberlandesgerichten
      Düsseldorf, Hamm und Köln
    sitz: Düsseldorf
  pruefungsordnung: Juristenausbildungsgesetz Nordrhein-Westfalen (JAG NRW)
  klausuren:
    anzahl: 7
    dauer_minuten: 300
    verteilung:
      zivilrecht: 3
      strafrecht: 2
      oeffentliches-recht: 2
    hinweis: Fünfstündige Aufsichtsarbeiten. Die Verteilung auf die Rechtsgebiete bestimmt die Gewichtung
      der Examensreife im Examen-Reiter.
  hausarbeit: false
  muendliche_pruefung:
    beschreibung: Prüfungsgespräch in allen drei Rechtsgebieten nach bestandenem schriftlichen Teil;
      vielerorts mit Kurzvortrag.
  termine:
  - Mehrere Klausurtermine pro Jahr, organisiert über die Justizprüfungsämter bei den drei Oberlandesgerichten
  freiversuch:
    beschreibung: 'Freiversuch bei erstmaliger Meldung nach ununterbrochenem Studium bis zum Ende des
      achten Fachsemesters; ein nicht bestandener Freiversuch gilt als nicht unternommen. Anrechnungsregeln
      (Auslandssemester, Krankheit) im JAG des Landes. In NRW: § 25 JAG NRW.'
  abschichtung:
    moeglich: true
    beschreibung: 'Ja - § 12 JAG NRW: Die Aufsichtsarbeiten können nach Rechtsgebieten auf mehrere Prüfungstermine
      verteilt werden (Abschichtung), sofern die Voraussetzungen (Semesterzahl, Reihenfolge) eingehalten
      werden.'
  notenverbesserung:
    beschreibung: Wer im Freiversuch bestanden hat, kann die Prüfung einmal zur Notenverbesserung wiederholen;
      die bessere Note zählt.
  hilfsmittel:
  - Schönfelder, Deutsche Gesetze (mit Ergänzungsband)
  - Sartorius I, Verfassungs- und Verwaltungsgesetze
  - von Hippel/Rehborn, Gesetze des Landes Nordrhein-Westfalen
  landesrecht:
    schwerpunkte:
    - Polizei- und Ordnungsrecht (PolG NRW, OBG NRW)
    - Kommunalrecht (GO NRW)
    - Bauordnungsrecht (BauO NRW)
    - Landesverfassung
    normenspiegel:
      polizeigesetz: Polizeigesetz NRW (PolG NRW) und Ordnungsbehördengesetz NRW (OBG NRW)
      polizei_generalklausel: § 8 Abs. 1 PolG NRW; § 14 Abs. 1 OBG NRW
      standardmassnahmen: §§ 9 ff. PolG NRW
      stoerer: §§ 4, 5, 6 PolG NRW; §§ 17, 18, 19 OBG NRW
      ordnungsbehoerden: Ordnungsbehörden primär (§ 1 OBG NRW), Polizei nur bei Eilbedürftigkeit (§
        1 Abs. 1 Satz 3 PolG NRW)
      verwaltungsverfahrensgesetz: Verwaltungsverfahrensgesetz NRW (VwVfG NRW) - Vollgesetz
      vollstreckung: Verwaltungsvollstreckungsgesetz NRW (VwVG NRW), §§ 55 ff.
      kommunalverfassung: 'Gemeindeordnung NRW (GO NRW): Rat (§ 40) und Bürgermeister (§ 62)'
      bauordnung: Bauordnung NRW (BauO NRW 2018)
      landesverfassung: Verfassung für das Land Nordrhein-Westfalen (LV NRW)
      verfassungsgericht: Verfassungsgerichtshof für das Land Nordrhein-Westfalen
      individualverfassungsbeschwerde: Ja - seit 2019, Art. 75 Nr. 5a LV NRW, §§ 53 ff. VerfGHG NRW
    besonderheiten:
    - 'Einziges Land mit Abschichtung: die sieben Klausuren lassen sich nach Rechtsgebieten auf mehrere
      Termine verteilen (§ 12 JAG NRW).'
    - Sieben statt sechs Klausuren, davon zwei im Strafrecht - das Strafrecht wiegt hier schwerer als
      in den 3/1/2-Ländern.
    - Die Individualverfassungsbeschwerde zum VerfGH NRW gibt es erst seit 2019.
  checkliste:
  - monate_vor_examen: 12
    titel: Meldefristen und Freiversuch prüfen
    detail: Fachsemesterzählung, Anrechnung von Auslands-/Urlaubssemestern und die Meldefrist beim Prüfungsamt
      klären - der Freiversuch hängt am Datum der Meldung, nicht am Klausurtermin.
  - monate_vor_examen: 9
    titel: Landesrecht in den Lernplan aufnehmen
    detail: Polizei- und Ordnungsrecht, Kommunalrecht, Bauordnungsrecht und das Landesverfassungsrecht
      werden im Öffentlichen Recht regelmäßig geprüft - das Landesrecht-Deck im Examen-Reiter deckt
      die Normenkenntnis ab.
  - monate_vor_examen: 6
    titel: Zugelassene Hilfsmittel besorgen und einrichten
    detail: Gesetzessammlungen in der zugelassenen Ausgabe, Nachlieferungen einsortieren, Markierungsregeln
      des Prüfungsamts beachten (keine Kommentierungen).
  - monate_vor_examen: 4
    titel: Klausuren unter Examensbedingungen schreiben
    detail: Fünf Stunden am Stück, handschriftlich oder wie in der Prüfung vorgesehen, mit den zugelassenen
      Hilfsmitteln - der Samstags-Klausurtag im Lernplan ist dafür reserviert.
  - monate_vor_examen: 2
    titel: Meldung zur Prüfung abgeben
    detail: Unterlagen (Leistungsnachweise, Schlüsselqualifikation, Fremdsprache, Praktika) vollständig
      einreichen.
  - monate_vor_examen: 1
    titel: 'Endspurt: Wiederholung statt Neues'
    detail: Keine neuen Themen mehr anfangen. Fällige Karten, Schemata rekonstruieren, Schwachstellen
      aus den Klausur-Rückmeldungen gezielt nacharbeiten.
  pruefliste_redaktion:
  - Zahl, Dauer und Verteilung der Aufsichtsarbeiten gegen die aktuelle JAG/JAPO-Fassung prüfen
  - Ob ein Hausarbeits-/Aktenvortragsanteil zur staatlichen Pflichtfachprüfung gehört
  - Prüfungstermine des laufenden Jahres beim Prüfungsamt abgleichen
  - Freiversuchs- und Notenverbesserungsregel (Semesterzahl, Fristen) prüfen
  - Zugelassene Hilfsmittel gegen die aktuelle Hilfsmittelbekanntmachung prüfen
  - Alle Normzitate im Normenspiegel gegen die geltende Gesetzesfassung prüfen
  - 'Abschichtungsregel (§ 12 JAG NRW): zulässige Aufteilung und Fristen prüfen'
