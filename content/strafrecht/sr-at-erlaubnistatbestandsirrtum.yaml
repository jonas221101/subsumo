  stand: 2026-09
  steps:
  - label: I. Tatbestand des Vorsatzdelikts
    children:
    - label: 1. Objektiver Tatbestand
    - label: 2. Vorsatz hinsichtlich aller Tatumstände
      hinweis: Der Täter kennt die Tatumstände; § 16 Abs. 1 S. 1 StGB greift unmittelbar nicht.
  - label: II. Rechtswidrigkeit
    children:
    - label: 1. Objektive Prüfung des Rechtfertigungsgrundes (z. B. § 32 StGB)
    - label: '2. Ergebnis: keine Rechtfertigung, weil die rechtfertigende Lage objektiv fehlt'
  - label: III. Schuld
    children:
    - label: 1. Schuldfähigkeit
    - label: 2. Erlaubnistatbestandsirrtum
      children:
      - label: a) Vorstellung eines Sachverhalts, der einen anerkannten Rechtfertigungsgrund erfüllen würde
      - label: b) Abgrenzung zum Erlaubnisirrtum und zum Doppelirrtum (dann § 17 StGB)
      - label: c) Streitstand zur Rechtsfolge (strenge Schuldtheorie, negative Tatbestandsmerkmale, eingeschränkte Schuldtheorien)
      - label: d) Stellungnahme - rechtsfolgenverweisende eingeschränkte Schuldtheorie (h.M.)
    - label: '3. Ergebnis: Vorsatzschuld entfällt, keine Strafbarkeit aus dem Vorsatzdelikt'
  - label: IV. Fahrlässigkeitsdelikt, § 16 Abs. 1 S. 2 StGB
    children:
    - label: 1. Existenz eines Fahrlässigkeitstatbestands
    - label: 2. Vermeidbarkeit des Irrtums als Sorgfaltspflichtverletzung
    - label: 3. Übrige Voraussetzungen der Fahrlässigkeitsstrafbarkeit
  - label: V. Beteiligte
    children:
    - label: 1. Vorsätzliche rechtswidrige Haupttat nach h.M. gegeben - Teilnahme möglich
    - label: 2. Bei bewusster Irrtumsherbeiführung mittelbare Täterschaft, § 25 Abs. 1 Alt. 2 StGB
faelle:
- slug: sr-fall-jogger-im-park
  title: Der Jogger im Park
  difficulty: 4
  minutes: 60
  quellen:
  - Eigener Sachverhalt der Redaktion
  - StGB, amtliche Fassung
  stand: 2026-09
  facts: >-
    A geht spätabends mit seinem Bekannten C durch einen schlecht beleuchteten
    Park. Plötzlich läuft B in dunkler Sportkleidung schnell auf die beiden zu und
    greift dabei in seine Jackentasche, um sein Mobiltelefon herauszuholen, dessen
    Wecker gerade klingelt. C erkennt B sofort als seinen Nachbarn, der hier
    regelmäßig joggt, und weiß, dass B völlig harmlos ist. Trotzdem ruft C dem A zu:
    "Der hat ein Messer, schlag zu!" A, der B nicht kennt und in der Dunkelheit
    tatsächlich glaubt, gleich mit einem Messer angegriffen zu werden, schlägt B
    mit der Faust ins Gesicht. B erleidet einen Nasenbruch. Bei ruhiger Betrachtung
    hätte A erkennen können, dass B lediglich nach seinem Telefon griff.
  question: Wie haben sich A und C strafbar gemacht?
  steps:
  - prompt: Hat A den Tatbestand des § 223 Abs. 1 StGB erfüllt?
    erwartung: >-
      Ja - der Faustschlag mit Nasenbruch ist körperliche Misshandlung und
      Gesundheitsschädigung; A wusste und wollte, dass er B schlägt (Tatbestandsvorsatz).
  - prompt: Ist A durch Notwehr, § 32 StGB, gerechtfertigt?
    erwartung: >-
      Nein - objektiv lag kein Angriff des B vor; B wollte nur sein Telefon aus der
      Tasche holen. Ohne Notwehrlage scheidet eine Rechtfertigung aus.
  - prompt: Welcher Irrtum liegt bei A vor und wie ist er von § 17 StGB abzugrenzen?
    erwartung: >-
      A stellte sich einen gegenwärtigen rechtswidrigen Angriff mit einem Messer
      vor. Hätte diese Vorstellung zugetroffen, wäre der Faustschlag als
      erforderliche Verteidigung nach § 32 StGB gerechtfertigt gewesen. A irrt also
      über die tatsächlichen Voraussetzungen eines anerkannten Rechtfertigungsgrundes
      (Erlaubnistatbestandsirrtum, Putativnotwehr) und nicht über dessen rechtliche
      Grenzen; § 17 StGB passt nicht.
  - prompt: Welche Rechtsfolge hat der Erlaubnistatbestandsirrtum für A?
    erwartung: >-
      Nach der strengen Schuldtheorie bliebe A Vorsatztäter (§ 17 StGB, Irrtum
      vermeidbar). Nach der Lehre von den negativen Tatbestandsmerkmalen und der
      vorsatzunrechtsverneinenden eingeschränkten Schuldtheorie entfällt der Vorsatz
      nach § 16 Abs. 1 S. 1 StGB (direkt bzw. analog). Nach der
      rechtsfolgenverweisenden eingeschränkten Schuldtheorie (h.M.) bleibt der
      Tatbestandsvorsatz bestehen, aber die Vorsatzschuld entfällt. Der h.M. ist zu
      folgen: A ist nicht wegen vorsätzlicher Körperverletzung strafbar.
  - prompt: Hat sich A wegen fahrlässiger Körperverletzung, § 229 StGB, strafbar gemacht?
    erwartung: >-
      Ja - § 16 Abs. 1 S. 2 StGB lässt die Fahrlässigkeitsstrafbarkeit unberührt.
      A hätte bei ruhiger Betrachtung erkennen können, dass B nur nach seinem
      Telefon griff; der Irrtum war vermeidbar, A verletzte die gebotene Sorgfalt
      bei der Prüfung der Lage. Der Nasenbruch war vorhersehbar. A ist nach § 229 StGB
      strafbar.
  - prompt: Wie hat sich C strafbar gemacht?
    erwartung: >-
      C hat A durch seinen Zuruf zur Tat bestimmt und dabei den Irrtum des A
      bewusst hervorgerufen. Nach h.M. liegt eine vorsätzliche rechtswidrige
      Haupttat vor, sodass Anstiftung, § 26 StGB, zu § 223 StGB möglich ist. Weil C
      kraft überlegenen Wissens das Geschehen beherrschte, kommt vorrangig mittelbare
      Täterschaft, § 25 Abs. 1 Alt. 2 StGB, in Betracht; dahinter tritt die
      Anstiftung zurück. Nach den vorsatzverneinenden Theorien fehlt eine
      vorsätzliche Haupttat, sodass nur mittelbare Täterschaft in Betracht kommt -
      hier mit demselben Ergebnis.
  expectation:
    pruefpunkte:
