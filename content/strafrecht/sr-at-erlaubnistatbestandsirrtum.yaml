topic:
  slug: sr-at-erlaubnistatbestandsirrtum
  area: strafrecht
  title: Erlaubnistatbestandsirrtum - Abgrenzung §§ 16, 17 StGB, Schuldtheorien, Teilnahme
  parent: sr-at
  relevance: 5
  stand: 2026-09
  redaktion:
    erzeugt_von: claude-fable-5-1
    status: in-pruefung
    normzitate_geprueft: true
cards:
- slug: sr-eti-begriff
  type: definition
  front: 'Definiere: Erlaubnistatbestandsirrtum'
  back: >-
    Ein Erlaubnistatbestandsirrtum liegt vor, wenn der Täter irrig Umstände
    annimmt, bei deren tatsächlichem Vorliegen seine Tat durch einen anerkannten
    Rechtfertigungsgrund gedeckt wäre. Der Täter irrt also nicht über das Recht,
    sondern über den Sachverhalt auf der Ebene der Rechtfertigung: Er hält etwa
    eine harmlose Geste für einen Angriff und "verteidigt" sich (Putativnotwehr),
    oder er nimmt irrig eine Einwilligung an. Kennzeichnend ist, dass der
    vorgestellte Sachverhalt bei zutreffender rechtlicher Bewertung die Tat
    rechtfertigen würde. Der Irrtum ist gesetzlich nicht ausdrücklich geregelt;
    seine Behandlung ist umstritten.
  norms:
  - § 16 StGB
  - § 17 StGB
  - § 32 StGB
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sr-eti-gesetzliche-regelungen-16-17
  type: norm
  front: 'Was regeln § 16 Abs. 1 StGB und § 17 StGB, und warum passt keine der Normen unmittelbar auf den Erlaubnistatbestandsirrtum?'
  back: >-
    § 16 Abs. 1 S. 1 StGB bestimmt, dass nicht vorsätzlich handelt, wer bei
    Begehung der Tat einen Umstand nicht kennt, der zum gesetzlichen Tatbestand
    gehört; nach § 16 Abs. 1 S. 2 StGB bleibt die Strafbarkeit wegen fahrlässiger
    Begehung unberührt. § 17 StGB regelt das Fehlen der Einsicht, Unrecht zu tun:
    Bei Unvermeidbarkeit entfällt die Schuld, bei Vermeidbarkeit kann die Strafe
    nach § 49 Abs. 1 StGB gemildert werden. Der Erlaubnistatbestandsirrtum betrifft
    weder einen Umstand des gesetzlichen Tatbestands (der Täter kennt alle
    Tatumstände) noch eine fehlerhafte rechtliche Bewertung (der Täter kennt das
    Verbot und die Grenzen der Rechtfertigung). Er liegt strukturell zwischen
    beiden Normen: Sachverhaltsirrtum wie bei § 16 StGB, aber auf der Ebene der
    Rechtfertigung, deren Fehlen sonst § 17 StGB zugeordnet wird.
  norms:
  - § 16 Abs. 1 S. 1 StGB
  - § 16 Abs. 1 S. 2 StGB
  - § 17 StGB
  quellen:
  - StGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sr-eti-abgrenzung-erlaubnisirrtum-doppelirrtum
  type: definition
  front: Wie grenzt sich der Erlaubnistatbestandsirrtum vom Erlaubnisirrtum und vom Doppelirrtum ab?
  back: >-
    Beim Erlaubnisirrtum (indirekter Verbotsirrtum) erfasst der Täter den
    Sachverhalt richtig, nimmt aber irrig einen Rechtfertigungsgrund an, den die
    Rechtsordnung nicht kennt, oder dehnt die Grenzen eines anerkannten
    Rechtfertigungsgrundes zu weit aus (etwa die Annahme, Notwehr erlaube auch die
    Bestrafung des bereits fliehenden Angreifers). Dieser Irrtum ist unmittelbar
    nach § 17 StGB zu behandeln. Beim Doppelirrtum irrt der Täter sowohl über den
    Sachverhalt als auch über die rechtlichen Grenzen: Auch der vorgestellte
    Sachverhalt würde die Tat nicht rechtfertigen. Da die Rechtsordnung die Tat
    selbst bei zutreffender Vorstellung missbilligt, liegt kein
    Erlaubnistatbestandsirrtum vor; es gilt § 17 StGB. Prüfungsfrage ist also stets:
    Wäre die Tat gerechtfertigt, wenn die Vorstellung des Täters zuträfe?
  norms:
  - § 17 StGB
  - § 32 StGB
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sr-eti-theorien-streitstand
  type: streitstand
  front: 'Streitstand: Wie ist der Erlaubnistatbestandsirrtum rechtlich zu behandeln?'
  back: >-
    Problem: Der Täter kennt alle Tatumstände und das Verbot, stellt sich aber irrig
    eine rechtfertigende Sachlage vor. Entfällt der Vorsatz (§ 16 StGB), die Schuld
    (§ 17 StGB) oder etwas Drittes?

    Strenge Schuldtheorie: Jeder Irrtum über die Rechtswidrigkeit ist Verbotsirrtum,
    § 17 StGB. Der Täter handelt vorsätzlich und wird nur bei Unvermeidbarkeit
    entschuldigt. Kritik: Der Täter, der einen rechtfertigenden Sachverhalt
    annimmt, will rechtstreu handeln; ihn wie einen Vorsatztäter zu behandeln,
    verfehlt den Unrechtsgehalt.

    Lehre von den negativen Tatbestandsmerkmalen: Rechtfertigungsgründe sind
    negative Merkmale eines Gesamtunrechtstatbestands; der Irrtum über sie ist
    daher Tatumstandsirrtum, § 16 Abs. 1 S. 1 StGB direkt. Kritik: Die
    Unterscheidung zwischen tatbestandslosem und gerechtfertigtem Verhalten wird
    eingeebnet.

    Eingeschränkte Schuldtheorie (vorsatzunrechtsverneinend): Der Irrtum lässt den
    Vorsatz in analoger Anwendung des § 16 Abs. 1 S. 1 StGB entfallen, weil der
    Täter wie der Tatumstandsirrende keinen Handlungsunwert verwirklicht.

    Rechtsfolgenverweisende eingeschränkte Schuldtheorie (h.M., BGH): Der
    Tatbestandsvorsatz bleibt bestehen; die Tat ist eine vorsätzliche rechtswidrige
    Tat. Es entfällt aber die Vorsatzschuld, weil der Täter nicht die für den
    Vorsatzvorwurf typische rechtsfeindliche Gesinnung zeigt. § 16 Abs. 1 S. 1 StGB
    wird nur in seiner Rechtsfolge analog angewendet: keine Bestrafung aus dem
    Vorsatzdelikt, gegebenenfalls Fahrlässigkeitsstrafbarkeit nach § 16 Abs. 1 S. 2
    StGB.

    Konsequenz: Alle eingeschränkten Theorien führen beim Täter selbst zu demselben
    Ergebnis (keine Vorsatzstrafe, Fahrlässigkeitsdelikt bei Vermeidbarkeit). Sie
    unterscheiden sich bei der Teilnahme, weil nur nach der rechtsfolgenverweisenden
    Theorie eine vorsätzliche Haupttat vorliegt.
  norms:
  - § 16 Abs. 1 S. 1 StGB
  - § 16 Abs. 1 S. 2 StGB
  - § 17 StGB
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sr-eti-rechtsfolgenverweisend-vorsatzschuld
  type: definition
  front: Was bedeutet "Vorsatzschuld entfällt" nach der rechtsfolgenverweisenden eingeschränkten Schuldtheorie?
  back: >-
    Die h.M. trennt den Tatbestandsvorsatz (Wissen und Wollen der Tatumstände, im
    Unrechtstatbestand) von der Vorsatzschuld (dem gesteigerten Schuldvorwurf, der
    den Vorsatztäter trifft, weil er sich bewusst gegen das Rechtsgut entscheidet).
    Beim Erlaubnistatbestandsirrtum bleibt der Tatbestandsvorsatz erhalten - der
    Täter weiß, dass er einen Menschen verletzt. Weil er aber glaubt, im Recht zu
    sein, fehlt ihm die für den Vorsatzvorwurf charakteristische Gesinnung; sein
    Fehler liegt in mangelnder Sorgfalt bei der Prüfung der Lage und entspricht
    damit dem Fahrlässigkeitsvorwurf. Deshalb wird er wie ein Fahrlässigkeitstäter
    bestraft: Der Schuldvorwurf wird auf die Rechtsfolge des § 16 Abs. 1 StGB
    umgeleitet. Prüfungsstandort ist die Schuld, nach der Feststellung, dass
    objektiv kein Rechtfertigungsgrund vorlag.
  norms:
  - § 16 Abs. 1 StGB
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sr-eti-fahrlaessigkeit-vermeidbarkeit
  type: definition
  front: Unter welchen Voraussetzungen wird der Täter im Erlaubnistatbestandsirrtum aus dem Fahrlässigkeitsdelikt bestraft?
  back: >-
    Nach § 16 Abs. 1 S. 2 StGB (direkt oder analog) bleibt die Strafbarkeit wegen
    fahrlässiger Begehung unberührt. Dafür muss erstens ein entsprechendes
    Fahrlässigkeitsdelikt existieren (etwa § 229 StGB, § 222 StGB; nicht bei
    Sachbeschädigung oder Nötigung). Zweitens muss der Irrtum auf einer
    Sorgfaltspflichtverletzung beruhen: Der Täter hätte bei der ihm möglichen und
    zumutbaren Prüfung der Lage erkennen können, dass die rechtfertigende Situation
    nicht vorliegt (Vermeidbarkeit). Maßstab ist ein besonnener Mensch in der
    konkreten Lage des Täters mit dessen Sonderwissen; Zeitdruck und Bedrohungslage
    sind zu berücksichtigen. War der Irrtum unvermeidbar, bleibt der Täter
    straflos.
  norms:
  - § 16 Abs. 1 S. 2 StGB
  - § 229 StGB
  - § 222 StGB
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sr-eti-teilnahmeproblem-streitstand
  type: streitstand
  front: 'Streitstand: Ist Teilnahme an der Tat eines im Erlaubnistatbestandsirrtum handelnden Täters möglich?'
  back: >-
    Problem: Anstiftung und Beihilfe setzen nach §§ 26, 27 StGB eine vorsätzlich
    begangene rechtswidrige Haupttat voraus (limitierte Akzessorietät). Ob der
    Haupttäter im Erlaubnistatbestandsirrtum "vorsätzlich" handelt, hängt von der
    gewählten Theorie ab. Praktisch relevant ist der Fall, dass der Hintermann den
    Irrtum des Vordermanns kennt oder herbeiführt.

    Rechtsfolgenverweisende eingeschränkte Schuldtheorie (h.M.): Der
    Tatbestandsvorsatz des Haupttäters bleibt bestehen; es liegt eine vorsätzliche
    rechtswidrige Haupttat vor. Teilnahme ist daher möglich. Wer den Irrtum
    bewusst hervorruft, kann nach h.M. zugleich mittelbarer Täter kraft
    überlegenen Wissens sein, § 25 Abs. 1 Alt. 2 StGB; die Teilnahme tritt dann
    zurück. Der bloß fördernde Dritte ist Gehilfe oder Anstifter.

    Vorsatzunrechtsverneinende eingeschränkte Schuldtheorie und Lehre von den
    negativen Tatbestandsmerkmalen: Der Vorsatz des Haupttäters entfällt; eine
    vorsätzliche Haupttat fehlt. Teilnahme scheidet aus. Der Hintermann kann nur
    als mittelbarer Täter erfasst werden, wenn er die Voraussetzungen des § 25
    Abs. 1 Alt. 2 StGB erfüllt; andernfalls bleibt er straflos.

    Strenge Schuldtheorie: Der Haupttäter handelt vorsätzlich und rechtswidrig,
    Teilnahme ist ohne Weiteres möglich.

    Konsequenz: Das Teilnahmeproblem ist das Hauptargument für die
    rechtsfolgenverweisende Theorie, weil sie Strafbarkeitslücken beim Hintermann
    vermeidet, der die Voraussetzungen der mittelbaren Täterschaft nicht erfüllt.
  norms:
  - § 26 StGB
  - § 27 StGB
  - § 25 Abs. 1 Alt. 2 StGB
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sr-eti-pruefungsstandort-aufbau
  type: schema_step
  front: An welcher Stelle des Deliktsaufbaus wird der Erlaubnistatbestandsirrtum geprüft?
  back: >-
    Der Erlaubnistatbestandsirrtum wird nach h.M. erst geprüft, nachdem in der
    Rechtswidrigkeit festgestellt wurde, dass objektiv kein Rechtfertigungsgrund
    vorliegt (etwa weil kein Angriff gegeben war). In der Schuld ist dann
    darzustellen: (1) Der Täter stellte sich einen Sachverhalt vor, der einen
    anerkannten Rechtfertigungsgrund erfüllen würde (Abgrenzung zum
    Erlaubnisirrtum und zum Doppelirrtum). (2) Streitstand über die Rechtsfolge mit
    Stellungnahme für die rechtsfolgenverweisende eingeschränkte Schuldtheorie.
    (3) Ergebnis: keine Vorsatzschuld, Strafbarkeit aus dem Vorsatzdelikt entfällt.
    (4) Anschließend eigenständige Prüfung des Fahrlässigkeitsdelikts mit der
    Vermeidbarkeit des Irrtums als Sorgfaltspflichtverletzung. Wer der
    vorsatzunrechtsverneinenden Theorie folgt, prüft den Irrtum bereits im
    subjektiven Tatbestand oder unmittelbar nach der Rechtswidrigkeit.
  norms:
  - § 16 Abs. 1 StGB
  - § 32 StGB
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
schemata:
- slug: sr-schema-erlaubnistatbestandsirrtum
  title: Prüfung des Erlaubnistatbestandsirrtums (Putativnotwehr)
  norms:
  - § 16 StGB
  - § 17 StGB
  - § 32 StGB
  quellen:
