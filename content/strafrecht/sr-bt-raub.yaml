  steps:
  - label: I. Tatbestand
    children:
    - label: 1. Objektiver Tatbestand
      children:
      - label: a) Fremde bewegliche Sache
      - label: b) Wegnahme
      - label: c) Mittels Gewalt gegen eine Person oder Drohung mit gegenwärtiger
          Gefahr für Leib oder Leben (Nötigungsmittel)
      - label: d) Finaler Zusammenhang zwischen Nötigungsmittel und Wegnahme
        hinweis: Fasst der Täter den Wegnahmeentschluss erst nach der Gewaltanwendung,
          fehlt der finale Zusammenhang - dann kein Raub, ggf. § 252 StGB bei bereits
          vollendeter Wegnahme und Betroffenwerden auf frischer Tat.
    - label: 2. Subjektiver Tatbestand
      children:
      - label: a) Vorsatz bzgl. aller objektiven Tatbestandsmerkmale, § 15 StGB
      - label: b) Absicht rechtswidriger Zueignung (wie bei § 242 StGB)
  - label: 'Vorüberlegung: Wegnahme oder Weggabe? Gibt das Opfer die Sache selbst
      heraus, kommt statt § 249 StGB die räuberische Erpressung, §§ 253, 255 StGB,
      in Betracht (Abgrenzung beachten).'
  - label: II. Rechtswidrigkeit
  - label: III. Schuld
  - label: 'IV. Qualifikationen, §§ 250, 251 StGB (z. B. § 250 Abs. 2 Nr. 1: Verwenden
      eines gefährlichen Werkzeugs, etwa Messer)'
    hinweis: Nur prüfen, wenn der Sachverhalt dazu Anlass gibt.
faelle:
- slug: sr-fall-tankstellenueberfall
  title: Der Tankstellenüberfall
  difficulty: 3
  minutes: 50
  quellen:
  - Eigener Sachverhalt der Redaktion
  - StGB, amtliche Fassung
  facts: 'A betritt kurz vor Ladenschluss eine Tankstelle. Er hält dem Kassierer K
    ein Messer vor das Gesicht und verlangt: "Gib mir das Geld aus der Kasse, sonst
    steche ich zu." Aus Angst um sein Leben öffnet K die Kasse und weicht zurück.
    A greift selbst in die geöffnete Kasse, nimmt die Tageseinnahmen heraus, steckt
    sie ein und verlässt die Tankstelle, ohne K zu berühren.'
  question: Hat sich A strafbar gemacht? Gehe auf § 249 Abs. 1 StGB und dessen Qualifikationen
    ein.
  steps:
  - prompt: Formuliere den Obersatz.
    erwartung: A könnte sich durch die Wegnahme der Tageseinnahmen unter Drohung mit
      dem Messer wegen (schweren) Raubes gemäß §§ 249 Abs. 1, 250 StGB strafbar gemacht
      haben.
  - prompt: Liegt eine fremde bewegliche Sache und eine Wegnahme vor, obwohl K die
      Kasse selbst geöffnet hat? Wie ist der Fall von der räuberischen Erpressung
      abzugrenzen?
    erwartung: Ja - das Geld steht im Eigentum des Tankstellenbetreibers und ist beweglich.
      K öffnet nur die Kasse und weicht zurück; A nimmt das Geld selbst heraus und
      bricht den Gewahrsam des K gegen dessen Willen, ohne dass K eine Verfügung über
      das Geld vornimmt. Es liegt Wegnahme vor (Nehmen statt Geben), also Raub. Nach
      der Rspr. ist § 249 StGB als Spezialfall der räuberischen Erpressung ohnehin
      vorrangig; nach der Lit. schließen sich Raub und Erpressung aus, und hier fehlt
      die Weggabe. Hätte K das Geld selbst übergeben, wäre §§ 253, 255 StGB zu prüfen.
  - prompt: Welches Nötigungsmittel hat A eingesetzt?
    erwartung: Eine Drohung mit gegenwärtiger Gefahr für Leib oder Leben - A hat unmissverständlich
      in Aussicht gestellt, K mit dem Messer zu verletzen, falls er nicht gehorcht.
  - prompt: Besteht ein finaler Zusammenhang zwischen Drohung und Wegnahme?
    erwartung: Ja - A hat die Drohung gerade als Mittel zur Ermöglichung der Wegnahme
      eingesetzt, um den erwarteten Widerstand des K zu brechen.
  - prompt: Liegt Zueignungsabsicht vor?
    erwartung: Ja - A wollte das Geld dauerhaft seinem eigenen Vermögen einverleiben
      und den Betreiber dauerhaft davon ausschließen; ein Anspruch auf das Geld bestand
      nicht.
  - prompt: Kommt eine Qualifikation nach § 250 StGB in Betracht?
    erwartung: 'Ja - das Messer ist ein gefährliches Werkzeug (Waffe im technischen
      Sinne). A hat es nicht nur bei sich geführt (§ 250 Abs. 1 Nr. 1 lit. a StGB),
      sondern bei der Tat verwendet, indem er es dem K vor das Gesicht hielt und damit
      drohte: § 250 Abs. 2 Nr. 1 StGB (schwerer Raub, Mindeststrafe sieben Jahre).'
