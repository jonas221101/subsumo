cards:
- slug: sr-raub-grundtatbestand
  type: definition
  front: 'Definiere: Raub, Grundtatbestand § 249 Abs. 1 StGB'
  back: 'Raub begeht, wer mit Gewalt gegen eine Person oder unter Anwendung von Drohungen
    mit gegenwärtiger Gefahr für Leib oder Leben eine fremde bewegliche Sache einem
    anderen in der Absicht wegnimmt, die Sache sich oder einem Dritten rechtswidrig
    zuzüignen. Der Raub ist damit ein qualifizierter Diebstahl: Zum Grundtatbestand
    des § 242 StGB treten die Nötigungsmittel und der finale Zusammenhang zur Wegnahme
    hinzu.'
  norms:
  - § 249 Abs. 1 StGB
  - § 242 Abs. 1 StGB
  quellen:
  - § 249 StGB, amtlicher Wortlaut
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sr-raub-noetigungsmittel-gewalt
  type: definition
  front: 'Definiere: Gewalt gegen eine Person i.S.d. § 249 StGB'
  back: Gewalt gegen eine Person ist der durch körperliche Kraftentfaltung vermittelte,
    gegen den Körper des Opfers gerichtete physische Zwang, der geeignet ist, geleisteten
    oder erwarteten Widerstand zu überwinden. Nicht erforderlich ist eine körperliche
    Misshandlung - ausreichend ist jede körperlich vermittelte Zwangseinwirkung,
    etwa das Festhalten oder Wegstoßen des Opfers.
  norms:
  - § 249 Abs. 1 StGB
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sr-raub-noetigungsmittel-drohung
  type: definition
  front: 'Definiere: Drohung mit gegenwärtiger Gefahr für Leib oder Leben, § 249
    StGB'
  back: Drohung ist das ausdrückliche oder konkludente In-Aussicht-Stellen eines
    zukünftigen Übels, auf dessen Eintritt der Drohende Einfluss zu haben vorgibt.
    Die in Aussicht gestellte Gefahr muss gegenwärtig sein, also unmittelbar bevorstehen,
    und sich auf Leib oder Leben des Opfers oder einer ihm nahestehenden Person beziehen
    - eine bloße Drohung mit einer Sachbeschädigung genügt für § 249 StGB nicht.
  norms:
  - § 249 Abs. 1 StGB
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sr-raub-finaler-zusammenhang
  type: definition
  front: 'Definiere: finaler Zusammenhang beim Raub'
  back: 'Zwischen dem Nötigungsmittel und der Wegnahme muss ein finaler Zusammenhang
    bestehen: Der Täter muss die Gewalt oder Drohung gerade als Mittel zur Ermöglichung
    der Wegnahme einsetzen, das Opfer also bewusst zu dem Zweck nötigen, den erwarteten
    oder geleisteten Widerstand zu brechen. Setzt der Täter Gewalt zunächst aus
    anderen Gründen ein und fasst den Wegnahmeentschluss erst danach, fehlt es am
    finalen Zusammenhang - es liegt dann kein Raub vor, sondern allenfalls eine Nötigung
    oder Körperverletzung in Tateinheit mit einem eigenständigen Diebstahl. Nur
    wenn der Täter bereits eine fremde bewegliche Sache weggenommen hat, auf frischer
    Tat betroffen wird und anschließend Gewalt anwendet oder droht, um sich den Besitz
    der Beute zu erhalten, kommt räuberischer Diebstahl (§ 252 StGB) in Betracht
    - eine eigenständige, an strengere Voraussetzungen geknüpfte Konstellation,
    kein Auffangtatbestand für jeden fehlenden finalen Zusammenhang.'
  norms:
  - § 249 Abs. 1 StGB
  - § 252 StGB
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sr-raub-abgrenzung-raeuberische-erpressung
  type: streitstand
  front: 'Streitstand: Abgrenzung Raub (§ 249 StGB) zu räuberischer Erpressung (§
    255 StGB)'
  back: 'Problem: Sowohl Raub als auch räuberische Erpressung setzen Gewalt

    gegen eine Person oder Drohung mit gegenwärtiger Gefahr für Leib oder

    Leben voraus und führen zu einem Vermögensnachteil des Opfers. Da

    § 255 StGB denselben Strafrahmen wie § 249 StGB vorsieht, ist die

    Abgrenzung für die Strafhöhe selten entscheidend - wohl aber für den

    Prüfungsaufbau und die Konkurrenzen zu Qualifikationen.


    Rechtsprechung (Theorie vom äußeren Erscheinungsbild): Der BGH lehnt

    ein ungeschriebenes Tatbestandsmerkmal der Vermögensverfügung bei der

    Erpressung ab. Maßgeblich ist allein, wie sich der Vorgang objektiv

    darstellt: Nimmt sich der Täter die Sache selbst weg, liegt Raub vor;

    gibt das Opfer die Sache selbst heraus (Weggabe statt Wegnahme), liegt

    räuberische Erpressung vor - unabhängig davon, ob das Opfer dabei

    willentlich mitwirkt.


    Herrschende Literatur (Vermögensverfügungslehre): verlangt in

    Anlehnung an die Systematik von §§ 253, 263 StGB ein ungeschriebenes

    Tatbestandsmerkmal der Vermögensverfügung. Nur wenn das Opfer

    (wenngleich genötigt) durch ein eigenes Verhalten selbst über sein

    Vermögen verfügt, liegt Erpressung vor; erzwingt der Täter die

    Sachherausgabe gegen den erkennbaren entgegenstehenden Willen des

    Opfers ohne eigenen Mitwirkungsakt, bleibt es bei Raub - unabhängig

    vom äußeren Erscheinungsbild.


    Konsequenz: In der weit überwiegenden Zahl der Klausurfälle (Täter

    nimmt sich die Beute selbst, etwa aus einer geöffneten Kasse) führen

    beide Ansätze zum selben Ergebnis (Raub). Examensrelevant wird der

    Streit erst in Grenzfällen, in denen das Opfer die Sache aktiv

    übergibt, ohne dass eine eigene Entscheidung über das "Ob" der

    Vermögensminderung erkennbar ist.

    '
  norms:
  - § 249 Abs. 1 StGB
  - § 255 StGB
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sr-raub-qualifikationen-250
  type: norm
  front: Was regelt § 250 StGB?
  back: § 250 StGB enthält Qualifikationstatbestände des schweren Raubes, insbesondere
    das Beisichführen einer Waffe oder eines gefährlichen Werkzeugs (Abs. 1 Nr.
    1 lit. a) sowie die körperliche schwere Misshandlung oder das Verursachen der
    Gefahr des Todes des Opfers (Abs. 2 Nr. 3). Abs. 1 und Abs. 2 unterscheiden sich
    im Strafrahmen - Abs. 2 setzt eine tatsächliche Verwendung bzw. höhere Gefährdung
    voraus und ist damit die schwerere Variante.
  norms:
  - § 250 StGB
  - § 250 Abs. 1 StGB
  - § 250 Abs. 2 StGB
  quellen:
  - § 250 StGB, amtlicher Wortlaut
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sr-raub-erfolgsqualifikation-251
  type: norm
  front: Was ist an § 251 StGB besonders und was verlangt § 18 StGB dafür?
  back: '§ 251 StGB (Raub mit Todesfolge) ist eine erfolgsqualifizierte Straftat:
    Verursacht der Täter durch den Raub wenigstens leichtfertig den Tod eines anderen
    Menschen, erhöht sich die Strafe auf Freiheitsstrafe nicht unter zehn Jahren
    oder lebenslange Freiheitsstrafe. Nach § 18 StGB genügt für die schwerere Folge
    Fahrlässigkeit (hier: Leichtfertigkeit als gesteigerte Form der Fahrlässigkeit)
    - der Vorsatz muss sich nur auf den Grundtatbestand, nicht auf den Taterfolg beziehen.'
  norms:
  - § 251 StGB
  - § 18 StGB
  quellen:
  - § 251 StGB, amtlicher Wortlaut
  - Eigenformulierung Redaktion
  stand: 2026-09
schemata:
- slug: sr-schema-249
  title: Raub, § 249 Abs. 1 StGB
  norms:
  - § 249 Abs. 1 StGB
  quellen:
  - § 249 StGB, amtlicher Wortlaut
  - Eigenformulierung Redaktion
  steps:
  - label: I. Tatbestand
    children:
    - label: 1. Objektiver Tatbestand
      children:
      - label: a) Fremde bewegliche Sache
      - label: b) Wegnahme
      - label: c) Mittels Gewalt gegen eine Person oder Drohung mit gegenwärtiger
          Gefahr für Leib oder Leben (Nötigungsmittel)
      - label: d) Finaler Zusammenhang zwischen Nötigungsmittel und Wegnahme
        hinweis: Fasst der Täter den Wegnahmeentschluss erst nach der Gewaltanwendung,
          fehlt der finale Zusammenhang - dann kein Raub, ggf. § 252 StGB bei bereits
          vollendeter Wegnahme und Betroffenwerden auf frischer Tat.
    - label: 2. Subjektiver Tatbestand
      children:
      - label: a) Vorsatz bzgl. aller objektiven Tatbestandsmerkmale, § 15 StGB
      - label: b) Absicht rechtswidriger Zueignung (wie bei § 242 StGB)
  - label: II. Rechtswidrigkeit
  - label: III. Schuld
  - label: IV. Qualifikationen, §§ 250, 251 StGB
    hinweis: Nur prüfen, wenn der Sachverhalt dazu Anlass gibt.
faelle:
- slug: sr-fall-tankstellenueberfall
  title: Der Tankstellenüberfall
  difficulty: 3
  minutes: 50
  quellen:
  - Eigener Sachverhalt der Redaktion
  - StGB, amtliche Fassung
  facts: 'A betritt kurz vor Ladenschluss eine Tankstelle. Er hält dem Kassierer
    K ein Messer vor das Gesicht und verlangt: "Gib mir das Geld aus der Kasse, sonst
    steche ich zu." Aus Angst um sein Leben öffnet K die Kasse und legt die Tageseinnahmen
    auf den Tresen. A steckt das Geld ein und verlässt die Tankstelle, ohne K zu
    berühren.'
  question: Hat sich A wegen Raubes gemäß § 249 Abs. 1 StGB strafbar gemacht?
  steps:
  - prompt: Formuliere den Obersatz.
    erwartung: A könnte sich durch die Wegnahme der Tageseinnahmen unter Drohung
      mit dem Messer wegen Raubes gemäß § 249 Abs. 1 StGB strafbar gemacht haben.
  - prompt: Liegt eine fremde bewegliche Sache und eine Wegnahme vor, obwohl K das
      Geld selbst auf den Tresen gelegt hat?
    erwartung: Ja - das Geld steht im Eigentum des Tankstellenbetreibers und ist beweglich.
      Trotz des Ablegens durch K nimmt A es aus dessen Herrschaftsbereich eigenmächtig
      an sich; nach dem äußeren Erscheinungsbild bricht A den Gewahrsam des K und
      begründet eigenen - keine willentliche Vermögensverfügung des K.
  - prompt: Welches Nötigungsmittel hat A eingesetzt?
    erwartung: Eine Drohung mit gegenwärtiger Gefahr für Leib oder Leben - A hat
      unmissverständlich in Aussicht gestellt, K mit dem Messer zu verletzen, falls
      er nicht herausgibt.
  - prompt: Besteht ein finaler Zusammenhang zwischen Drohung und Wegnahme?
    erwartung: Ja - A hat die Drohung gerade eingesetzt, um den erwarteten Widerstand
      des K zu brechen und die Herausgabe des Geldes zu erreichen.
  - prompt: Liegt Züignungsabsicht vor?
    erwartung: Ja - A wollte das Geld dauerhaft seinem eigenen Vermögen einverleiben
      und den Betreiber dauerhaft davon ausschließen; ein Anspruch auf das Geld bestand
      nicht.
