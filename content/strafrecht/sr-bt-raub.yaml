cards:
- slug: sr-raub-grundtatbestand
  type: definition
  front: 'Definiere: Raub, Grundtatbestand § 249 Abs. 1 StGB'
  back: 'Raub begeht, wer mit Gewalt gegen eine Person oder unter Anwendung von Drohungen
    mit gegenwärtiger Gefahr für Leib oder Leben eine fremde bewegliche Sache einem
    anderen in der Absicht wegnimmt, die Sache sich oder einem Dritten rechtswidrig
    zuzueignen. Der Raub ist damit ein qualifizierter Diebstahl: Zum Grundtatbestand
    des § 242 StGB treten die Nötigungsmittel und der finale Zusammenhang zur Wegnahme
    hinzu.'
  norms:
  - § 249 Abs. 1 StGB
  - § 242 Abs. 1 StGB
  quellen:
  - § 249 StGB, amtlicher Wortlaut
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sr-raub-noetigungsmittel-gewalt
  type: definition
  front: 'Definiere: Gewalt gegen eine Person i.S.d. § 249 StGB'
  back: Gewalt gegen eine Person ist der durch körperliche Kraftentfaltung vermittelte,
    gegen den Körper des Opfers gerichtete physische Zwang, der geeignet ist, geleisteten
    oder erwarteten Widerstand zu überwinden. Nicht erforderlich ist eine körperliche
    Misshandlung - ausreichend ist jede körperlich vermittelte Zwangseinwirkung,
    etwa das Festhalten oder Wegstoßen des Opfers.
  norms:
  - § 249 Abs. 1 StGB
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sr-raub-noetigungsmittel-drohung
  type: definition
  front: 'Definiere: Drohung mit gegenwärtiger Gefahr für Leib oder Leben, § 249
    StGB'
  back: Drohung ist das ausdrückliche oder konkludente In-Aussicht-Stellen eines
    zukünftigen Übels, auf dessen Eintritt der Drohende Einfluss zu haben vorgibt.
    Die in Aussicht gestellte Gefahr muss gegenwärtig sein, also unmittelbar bevorstehen,
    und sich auf Leib oder Leben des Opfers oder einer ihm nahestehenden Person beziehen
    - eine bloße Drohung mit einer Sachbeschädigung genügt für § 249 StGB nicht.
  norms:
  - § 249 Abs. 1 StGB
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sr-raub-finaler-zusammenhang
  type: definition
  front: 'Definiere: finaler Zusammenhang beim Raub'
  back: 'Zwischen dem Nötigungsmittel und der Wegnahme muss ein finaler Zusammenhang
    bestehen: Der Täter muss die Gewalt oder Drohung als Mittel zur Ermöglichung der
    Wegnahme einsetzen, also den erwarteten oder geleisteten Widerstand gerade zum
    Zweck der Wegnahme brechen. Setzt der Täter Gewalt zunächst aus anderen Gründen
    ein und fasst den Wegnahmeentschluss erst danach, fehlt es grundsätzlich am finalen
    Zusammenhang. Nach der Rspr. genügt aber, wenn der Täter die noch fortwirkende
    Gewalt oder Drohung (die andauernde Zwangslage des Opfers) mit Wegnahmevorsatz
    bewusst ausnutzt: Dann dient die fortwirkende Nötigung als Mittel der Wegnahme,
    und es liegt Raub vor. Fehlt auch das, bleiben Nötigung oder Körperverletzung
    in Tateinheit oder Tatmehrheit mit einem eigenständigen Diebstahl. Hat der Täter
    die Sache bereits weggenommen, wird auf frischer Tat betroffen und wendet anschließend
    Gewalt an oder droht, um sich den Besitz der Beute zu erhalten, kommt räuberischer
    Diebstahl (§ 252 StGB) in Betracht - eine eigenständige Konstellation mit strengeren
    Voraussetzungen, kein Auffangtatbestand für jeden fehlenden finalen Zusammenhang.'
  norms:
  - § 249 Abs. 1 StGB
  - § 252 StGB
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sr-raub-abgrenzung-raeuberische-erpressung
  type: streitstand
  front: 'Streitstand: Abgrenzung Raub (§ 249 StGB) zu räuberischer Erpressung (§
    255 StGB)'
  back: |-
    Problem: Raub (§ 249 StGB) und räuberische Erpressung (§§ 253, 255 StGB) setzen jeweils Gewalt gegen eine Person oder Drohung mit gegenwärtiger Gefahr für Leib oder Leben voraus. Die Abgrenzung betrifft den Fall, dass das Opfer unter Zwang eine Sache selbst herausgibt (Weggabe) statt dass der Täter sie sich nimmt (Wegnahme).

    Rechtsprechung (Spezialität): § 255 StGB verlangt nach dem BGH keine Vermögensverfügung im technischen Sinne; jedes durch Nötigung erzwungene Handeln, Dulden oder Unterlassen mit vermögensschädigender Folge genügt. Der Raub ist danach ein Spezialfall der räuberischen Erpressung. Eine scharfe Abgrenzung ist nicht nötig: Liegt eine Wegnahme vor, ist § 249 StGB erfüllt (und verdrängt § 255 StGB); gibt das Opfer die Sache selbst heraus, bleibt § 255 StGB.

    Herrschende Literatur (Exklusivität, Verfügungslehre): Die räuberische Erpressung setzt wie § 263 StGB eine (genötigte) Vermögensverfügung voraus. Raub und räuberische Erpressung schließen sich aus: Erzwingt der Täter die Sache durch Wegnahme, ohne dass das Opfer aktiv mitwirkt (bloßes Dulden), liegt Raub vor; gibt das Opfer die Sache selbst weg (Geben statt Nehmen), liegt räuberische Erpressung vor. Maßgeblich ist das Erscheinungsbild des Vorgangs aus Opfersicht (äußeres Erscheinungsbild bzw. innere Willensrichtung).

    Konsequenz: Greift der Täter selbst in die geöffnete Kasse, ist nach beiden Ansichten Raub zu bejahen. Legt das Opfer das Geld selbst auf den Tresen und übergibt es, liegt nach beiden Ansichten räuberische Erpressung (Weggabe) vor; nach der Rspr. ist nur die Prüfung kürzer. Wegen des gleichen Strafrahmens (§ 255 StGB: Strafe wie der Räuber) ist der Streit nur für Aufbau, Tenor und Qualifikationen von Bedeutung.
  norms:
  - § 249 Abs. 1 StGB
  - § 255 StGB
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sr-raub-qualifikationen-250
  type: norm
  front: Was regelt § 250 StGB (schwerer Raub, Abs. 1 und Abs. 2)?
  back: '§ 250 StGB enthält Qualifikationstatbestände des schweren Raubes. Abs. 1
    (Mindeststrafe fünf Jahre): Beisichführen einer Waffe oder eines anderen gefährlichen
    Werkzeugs (Nr. 1 lit. a), Beisichführen eines sonstigen Werkzeugs oder Mittels
    zur Überwindung von Widerstand durch Gewalt oder Drohung (lit. b), Gefahr einer
    schweren Gesundheitsschädigung (lit. c) sowie Bandenraub (Nr. 2). Abs. 2 (Mindeststrafe
    sieben Jahre): Verwenden einer Waffe oder eines anderen gefährlichen Werkzeugs
    bei der Tat (Nr. 1, etwa das Messer vor das Gesicht halten oder damit drohen),
    Beisichführen einer Waffe beim Bandenraub (Nr. 2) sowie schwere körperliche Misshandlung
    oder Gefahr des Todes (Nr. 3). Abs. 2 Nr. 1 ist die klausurtypische Variante bei
    Drohung mit einem Messer.'
  norms:
  - § 250 StGB
  - § 250 Abs. 1 StGB
  - § 250 Abs. 2 StGB
  quellen:
  - § 250 StGB, amtlicher Wortlaut
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sr-raub-erfolgsqualifikation-251
  type: norm
  front: Was ist an § 251 StGB besonders und was verlangt § 18 StGB dafür?
  back: '§ 251 StGB (Raub mit Todesfolge) ist eine erfolgsqualifizierte Straftat:
    Verursacht der Täter durch den Raub oder eine seiner Handlungen wenigstens leichtfertig
    den Tod eines anderen Menschen, droht lebenslange Freiheitsstrafe oder Freiheitsstrafe
    nicht unter zehn Jahren. § 18 StGB verlangt für die schwerere Folge grundsätzlich
    wenigstens Fahrlässigkeit; § 251 StGB verschärft dieses Erfordernis aber ausdrücklich:
    Erforderlich ist Leichtfertigkeit, also grobe Fahrlässigkeit (Außerachtlassen
    einer besonders naheliegenden Möglichkeit des Todeseintritts). Einfache Fahrlässigkeit
    genügt nicht. Der Vorsatz muss sich nur auf den Grundtatbestand beziehen, nicht
    auf den Tod. Zwischen Grunddelikt und Todesfolge muss der spezifische Gefahrzusammenhang
    bestehen.'
  norms:
  - § 251 StGB
  - § 18 StGB
  quellen:
  - § 251 StGB, amtlicher Wortlaut
  - Eigenformulierung Redaktion
  stand: 2026-09
