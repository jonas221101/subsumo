topic:
  slug: sr-bt-raeuberischer-diebstahl-252
  area: strafrecht
  title: >-
    Räuberischer Diebstahl und räuberischer Angriff auf Kraftfahrer, §§ 252, 316a StGB
  parent: sr-at
  relevance: 4
  stand: 2026-10
  redaktion:
    erzeugt_von: claude-sonnet (Pflichtstoff-Vervollständigung)
    status: in-pruefung
    normzitate_geprueft: false
cards:
- slug: sr-rd-252-tatbestand
  type: norm
  front: Was bestraft § 252 StGB (räuberischer Diebstahl)?
  back: >-
    § 252 StGB bestraft, wer bei einem Diebstahl auf frischer Tat betroffen gegen eine Person
    Gewalt verübt oder Drohungen mit gegenwärtiger Gefahr für Leib oder Leben anwendet, um
    sich im Besitz des gestohlenen Gutes zu erhalten. Der Täter wird "gleich einem Räuber"
    bestraft, das heißt mit dem Strafrahmen des § 249 StGB. Die Vorschrift ist ein selbständiges
    Delikt, kein bloßer Strafzumessungsverweis; sie erfasst die Fälle, in denen die Nötigung
    erst nach Vollendung des Diebstahls (Gewahrsamswechsel) erfolgt, sodass § 249 StGB nicht
    greift. Bei Gewalt nach vollendeter Wegnahme fehlt der für den Raub nötige finale
    Zusammenhang zwischen Nötigung und Wegnahme. Das Delikt wird deshalb auch als "Raub mit umgekehrter Reihenfolge"
    bezeichnet.
  norms:
  - § 252 StGB
  - § 249 StGB
  quellen:
  - StGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-10
- slug: sr-rd-252-vortat-betreffen
  type: definition
  front: >-
    Definiere: "bei einem Diebstahl auf frischer Tat betroffen", § 252 StGB
  back: >-
    Vortat ist ein vollendeter Diebstahl, auch in den Formen der §§ 243 und 244 StGB; der
    bloße Versuch genügt nach h. M. nicht, da der Täter das Gut bereits erlangt haben muss,
    um es "behalten" zu wollen. Betroffen ist der Täter, wenn er am Tatort oder in unmittelbarer
    Nähe in zeitlichem Zusammenhang mit der Tat von einem anderen wahrgenommen wird. Es genügt,
    dass der Täter bemerkt wird, auch wenn er das nicht weiß. Auf frischer Tat ist der Täter
    betroffen, solange die Tat noch nicht beendet ist oder jedenfalls in unmittelbarem räumlich-zeitlichen
    Zusammenhang steht (Flucht, Verfolgung).
  norms:
  - § 252 StGB
  - § 242 StGB
  quellen:
  - StGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-10
- slug: sr-rd-252-betreffen-streit
  type: streitstand
  front: >-
    Streitstand: Wie weit reicht das "Betreffen auf frischer Tat" in räumlicher und zeitlicher
    Hinsicht?
  back: >-
    Die Rspr. versteht das Betreffen weit: Der Täter kann auch noch nach Verlassen des Tatorts
    angetroffen werden, solange ein enger räumlich-zeitlicher Zusammenhang besteht; die Verfolgung
    kann sich über eine gewisse Strecke und Zeit erstrecken. Entscheidend ist, dass der Täter
    die Beute noch nicht gesichert hat und die Tat deshalb noch "frisch" ist. Ein Teil der
    Lit. will das Merkmal restriktiver auslegen und verlangt ein Betreffen am Tatort selbst
    oder in unmittelbarer Nähe, weil sonst der Charakter des § 252 StGB als Nötigung zur Besitzerhaltung
    verloren geht. Für die Klausur genügt meist die Feststellung, dass der Täter nach wenigen Minuten
    und in geringer Entfernung vom Tatort wahrgenommen und verfolgt wird. Nach beiden Ansichten ist
    dies ausreichend.
  norms:
  - § 252 StGB
  quellen:
  - StGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-10
- slug: sr-rd-252-besitzerhaltung
  type: definition
  front: 'Definiere: Besitzerhaltungsabsicht, § 252 StGB'
  back: >-
    Der Täter muss Gewalt oder Drohung einsetzen, um sich im Besitz des gestohlenen Gutes
    zu erhalten. Die Besitzerhaltungsabsicht (finaler Zusammenhang) ist als überschießende
    Innentendenz ein subjektives Tatbestandsmerkmal: Sie muss das Handlungsziel sein, ist
    aber nicht notwendig das einzige oder vorrangige Motiv; erforderlich ist aber zielgerichtetes
    Wollen, nicht bloßes Wissen. Der Täter muss zumindest auch die Beute behalten wollen.
    Handelt er nur, um zu fliehen oder einer Festnahme zu entgehen, ohne die Beute behalten
    zu wollen, fehlt die Absicht; es verbleiben §§ 240, 223 StGB. "Besitz" ist hier untechnisch
    zu verstehen und meint die tatsächliche Herrschaft über das gestohlene Gut.
  norms:
  - § 252 StGB
  quellen:
  - StGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-10
- slug: sr-rd-252-noetigungsmittel-rechtsfolge
  type: norm
  front: >-
    Welche Nötigungsmittel setzt § 252 StGB voraus und welche Rechtsfolge gilt?
  back: >-
    Erforderlich ist Gewalt gegen eine Person (wie bei § 249 StGB) oder eine Drohung mit gegenwärtiger
    Gefahr für Leib oder Leben. Gewalt gegen Sachen genügt nicht. Die Nötigung muss sich nicht
    gegen den Bestohlenen richten; Adressat kann jeder sein, der den Täter am Behalten hindert,
    etwa ein Passant oder Verfolger. Rechtsfolge ist die Bestrafung "gleich einem Räuber".
    Die Qualifikationen der §§ 250 und 251 StGB sind anwendbar, wenn ihre Merkmale erfüllt
    sind (z. B. Mitführen einer Waffe oder eines gefährlichen Werkzeugs, das beim Entdeckt-Werden
    eingesetzt wird). Als Verbrechen ist auch der Versuch des § 252 StGB strafbar.
  norms:
  - § 252 StGB
  - § 250 StGB
  - § 251 StGB
  quellen:
  - StGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-10
- slug: sr-rd-252-konkurrenzen
  type: definition
  front: >-
    Wie verhalten sich Diebstahl, § 252 StGB und Körperverletzung zueinander?
  back: >-
    Der Täter des räuberischen Diebstahls ist zugleich Täter der Vortat. Das Verhältnis zur
    Vortat wird nicht einheitlich beurteilt: Überwiegend tritt der Vortatdiebstahl im Wege der
    Gesetzeskonkurrenz hinter § 252 StGB zurück; teilweise wird wegen der zwei selbständigen
    Handlungen Tatmehrheit angenommen. In der Klausur ist die gewählte Lösung kurz zu begründen. Wird bei der
    Nötigung zugleich eine Körperverletzung begangen, steht § 252 StGB damit in Tateinheit;
    die Körperverletzung ist nicht Bestandteil des § 252 StGB.
  norms:
  - § 252 StGB
  - § 52 StGB
  - § 53 StGB
  quellen:
  - StGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-10
- slug: sr-rd-316a-tatbestand
  type: norm
  front: Wie lautet der Tatbestand des § 316a Abs. 1 StGB?
  back: >-
    § 316a Abs. 1 StGB bestraft, wer zur Begehung eines Raubes (§§ 249, 250), eines räuberischen
    Diebstahls (§ 252) oder einer räuberischen Erpressung (§§ 253, 255) einen Angriff auf
    Leib, Leben oder die Entschlussfreiheit des Führers eines Kraftfahrzeugs oder eines Mitfahrers
    unter Ausnutzung der besonderen Verhältnisse des Straßenverkehrs verübt. Die Mindeststrafe
    beträgt fünf Jahre Freiheitsstrafe; ein minder schwerer Fall ist in Abs. 2 geregelt, die
    Todesfolge bei Leichtfertigkeit in Abs. 3. § 316a StGB ist ein Delikt mit vorverlagerter
    Vollendung: Die Tat ist vollendet, sobald der Angriff verübt ist, auch wenn es nicht zum
    Raub kommt. Die Absicht, eines der genannten Delikte zu begehen, ist überschießende Innentendenz.
  norms:
  - § 316a Abs. 1 StGB
  - § 316a Abs. 2 StGB
  - § 316a Abs. 3 StGB
  quellen:
  - StGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-10
- slug: sr-rd-316a-angriff
  type: definition
  front: >-
    Definiere: Angriff auf Leib, Leben oder Entschlussfreiheit, § 316a StGB
  back: >-
    Ein Angriff ist jede feindselige Einwirkung auf Leib, Leben oder die Entschlussfreiheit
    des Opfers, die sich gegen das Opfer als Fahrzeugführer oder Mitfahrer richtet. Er muss
    nicht auf einen Erfolg gerichtet sein, wohl aber den Angriffswillen des Täters erkennen
    lassen. Eine Verletzung ist nicht nötig; es genügt jedes Einwirken, das die Entschlussfreiheit
    beeinträchtigen soll, z. B. das Vorhalten einer Waffe. Die Entschlussfreiheit wird angegriffen,
    wenn der Täter versucht, den Willen des Opfers durch Nötigungsmittel zu beeinflussen.
    Der Angriff liegt zeitlich vor dem beabsichtigten Raub oder der beabsichtigten Erpressung
    und soll diese vorbereiten oder ermöglichen.
  norms:
  - § 316a Abs. 1 StGB
  quellen:
  - StGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-10
- slug: sr-rd-316a-besondere-verhaeltnisse
  type: streitstand
  front: >-
    Streitstand: Wann nutzt der Täter "die besonderen Verhältnisse des Straßenverkehrs" aus?
  back: >-
    Die Rspr. des BGH legt das Merkmal restriktiv aus. Der Täter muss gerade die Umstände
    ausnutzen, die dem Kraftfahrer im Verkehr eine besondere Schutzlosigkeit verleihen: Das
    Opfer ist durch die Beanspruchung als Fahrer (Konzentration auf Verkehr, Bindung an das
    Fahrzeug) in der Verteidigungsmöglichkeit eingeschränkt. Es genügt nicht, dass sich der
    Angriff im Straßenverkehr oder gegen den Fahrer eines Fahrzeugs ereignet; bei ruhendem
    Fahrzeug fehlt der Zusammenhang, wenn das Opfer in seiner Rolle als Fahrer nicht mehr
    beeinträchtigt ist. Die Lit. fordert teils noch strengere Begrenzungen wegen der hohen
    Mindeststrafe und des unklaren Rechtsguts. Ein Angriff während der Fahrt kann genügen; beim
    Halt (etwa an einer Ampel) kommt es darauf an, ob das Opfer noch durch seine Rolle als
    Fahrer in seiner Verteidigungsmöglichkeit beeinträchtigt ist.
  norms:
  - § 316a Abs. 1 StGB
  quellen:
  - StGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-10
- slug: sr-rd-316a-konkurrenzen
  type: definition
  front: >-
    Wie ist § 316a StGB von Raub und räuberischer Erpressung abzugrenzen und welche Konkurrenzen
    gelten?
  back: >-
    § 316a StGB tritt als zusätzlicher Tatbestand neben Raub oder räuberische Erpressung,
    wenn diese begangen werden; die Tat ist ein eigenständiges Delikt, das schon im Vorfeld
    vollendet ist. Kommt es zum Raub oder zur räuberischen Erpressung, besteht Tateinheit,
    weil die Angriffshandlung zugleich Nötigungsmittel sein kann. Der Täter muss die besonderen
    Verhältnisse des Straßenverkehrs erkennen und sich bewusst zunutze machen; bloßes Zusammentreffen
    von Angriff und Verkehrssituation genügt nicht. Wegen der Strafdrohung (mindestens fünf
    Jahre) ist die sorgfältige Prüfung der Voraussetzungen, namentlich der Ausnutzung, in
    der Klausur wichtig.
  norms:
  - § 316a StGB
  - § 249 StGB
  - § 255 StGB
  - § 52 StGB
  quellen:
  - StGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-10
schemata:
- slug: sr-schema-252
  title: Räuberischer Diebstahl, § 252 StGB
  quellen:
  - StGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-10
  norms:
  - § 252 StGB
  steps:
  - label: I. Tatbestand
    children:
    - label: 1. Objektiver Tatbestand
      children:
      - label: 'a) Vortat: vollendeter Diebstahl'
        hinweis: >-
          Zuerst den Diebstahl (§ 242 StGB) vollständig prüfen oder inzident feststellen;
          der Versuch genügt nicht.
      - label: b) Auf frischer Tat betroffen
        hinweis: >-
          Räumlich-zeitlicher Zusammenhang; Wahrnehmung durch einen anderen genügt.
      - label: >-
          c) Nötigungsmittel: Gewalt gegen eine Person oder Drohung mit gegenwärtiger Gefahr
          für Leib oder Leben
    - label: 2. Subjektiver Tatbestand
      children:
      - label: a) Vorsatz
      - label: >-
          b) Absicht, sich im Besitz des gestohlenen Gutes zu erhalten
        hinweis: >-
          Nur Flucht oder Festnahmevermeidung ohne Beutewillen genügt nicht.
  - label: II. Rechtswidrigkeit
  - label: III. Schuld
  - label: IV. Qualifikationen, §§ 250, 251 StGB
  - label: V. Konkurrenzen
    hinweis: >-
      Verhältnis zur Vortat (§ 242 StGB) kurz klären; Körperverletzung in Tateinheit mit §
      252 StGB.
