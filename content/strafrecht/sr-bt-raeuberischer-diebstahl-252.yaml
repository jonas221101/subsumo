faelle:
- slug: sr-fall-rd-kaufhausdetektiv
  title: Der Kaufhausdetektiv
  difficulty: 3
  minutes: 40
  quellen:
  - Eigener Sachverhalt der Redaktion
  - StGB, amtliche Fassung
  facts: >-
    A steckt in einem Elektronikmarkt unbemerkt ein Smartphone im Wert von 600 Euro in seine
    Jackentasche und verlässt das Geschäft, ohne zu bezahlen. Der Kaufhausdetektiv D hat den
    Vorgang im Markt unmittelbar beobachtet und folgt A. Auf dem Parkplatz vor dem Markt,
    etwa 30 Meter vom Ausgang entfernt und knapp eine Minute nach dem Verlassen des Geschäfts,
    hält D den A am Arm fest und fordert ihn auf, das Telefon herauszugeben. A will das Smartphone
    behalten und der Festnahme entgehen. Er schlägt D mit der Faust ins Gesicht, sodass dieser
    eine Platzwunde erleidet, und rennt davon.
  question: >-
    Hat sich A wegen räuberischen Diebstahls strafbar gemacht?
  steps:
  - prompt: Hat A einen Diebstahl begangen?
    erwartung: >-
      Ja - A hat das fremde bewegliche Smartphone weggenommen (Bruch fremden und Begründung
      neuen Gewahrsams) und handelte in Zueignungsabsicht, § 242 Abs. 1 StGB. Der Diebstahl
      ist vollendet, weil A das Gerät in der Jackentasche hatte und das Geschäft verlassen
      hat.
  - prompt: War A auf frischer Tat betroffen?
    erwartung: >-
      Ja - D hat A beim Diebstahl beobachtet und trifft ihn etwa 30 Meter hinter dem Ausgang
      und knapp eine Minute nach der Tat an. Er wird von D, der die Tat beobachtet hat, in unmittelbarem
      räumlich-zeitlichen Zusammenhang gestellt; das genügt auch nach der engeren Lit.-Ansicht.
  - prompt: Hat A Gewalt gegen eine Person angewendet?
    erwartung: >-
      Ja - der Faustschlag gegen D ist Gewalt gegen eine Person.
  - prompt: Handelte A mit der erforderlichen Absicht?
    erwartung: >-
      Ja - A wollte das gestohlene Smartphone behalten; die zusätzliche Absicht, der Festnahme
      zu entgehen, schadet nicht.
  - prompt: Weitere Delikte und Ergebnis?
    erwartung: >-
      A ist wegen räuberischen Diebstahls nach § 252 StGB strafbar, in Tateinheit mit Körperverletzung,
      § 223 Abs. 1 StGB. Das Verhältnis zum vorausgegangenen Diebstahl ist
      Konkurrenzfrage (überwiegend Gesetzeskonkurrenz, teilweise Tatmehrheit).
