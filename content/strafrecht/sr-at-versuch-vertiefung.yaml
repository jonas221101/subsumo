faelle:
- slug: sr-fall-versv-giftpraline
  title: Die vergiftete Praline
  difficulty: 4
  minutes: 60
  quellen:
  - Eigener Sachverhalt der Redaktion
  - StGB, amtliche Fassung
  facts: A und B beschließen, gemeinsam den C zu töten, der ihnen Geld schuldet. Nach
    dem Plan soll A eine mit tödlichem Gift versetzte Praline in C's Wohnung auf den
    Tisch legen; B soll C währenddessen im Treppenhaus aufhalten, damit A ungestört
    arbeiten kann. A legt die Praline auf den Tisch, während B im Treppenhaus mit
    C spricht. C betritt unmittelbar darauf die Wohnung, sieht die Praline sofort und isst sie. A beobachtet
    dies, erschrickt, bereut seine Tat und ruft sofort einen Notarzt. C überlebt dank
    schneller Behandlung. B hat nichts unternommen und von allem nichts bereut.
  question: Wie haben sich A und B wegen versuchten Totschlags (§§ 212 Abs. 1, 22,
    23 Abs. 1, 25 Abs. 2 StGB) strafbar gemacht? Heimtücke ist nicht zu prüfen.
  steps:
  - prompt: Liegen Tatentschluss und unmittelbares Ansetzen bei A und B vor?
    erwartung: Ja. Beide handelten mit Tötungsvorsatz und gemeinsamem Tatplan. A
      setzte mit dem Auslegen der Praline unmittelbar an. Nach der Gesamtlösung (§ 25
      Abs. 2 StGB) ist dies auch B zuzurechnen, dessen Beitrag (Ablenkung) zur gleichen
      Zeit stattfand. Es liegt also ein gemeinschaftlicher versuchter Totschlag vor.
  - prompt: Ist der Versuch fehlgeschlagen oder beendet?
    erwartung: Nicht fehlgeschlagen. Nachdem C die Praline gegessen hatte, hielt A den
      Tod für möglich und hatte alles aus seiner Sicht Erforderliche getan; es liegt
      ein beendeter Versuch vor, bei dem § 24 Abs. 1 S. 1 Var. 2, Abs. 2 S. 1 StGB ein
      Verhindern verlangt.
  - prompt: Ist A wirksam zurückgetreten?
    erwartung: Ja. A hat freiwillig den Notarzt gerufen und damit die Vollendung durch
      eine eigene, ursächliche Rettungshandlung verhindert. Er ist nach § 24 Abs. 2 S. 1
      StGB wegen Versuchs nicht zu bestrafen (persönlicher Strafaufhebungsgrund).
  - prompt: Wirkt der Rücktritt des A auch zugunsten des B?
    erwartung: Nein. Der Rücktritt wirkt nur persönlich. B hat die Vollendung weder
      verhindert noch sich ernsthaft darum bemüht. Dass die Tat unvollendet blieb, kam nicht
      durch sein Zutun. Ein Rücktritt nach § 24 Abs. 2 S. 2 StGB scheidet daher aus.
  - prompt: Wie ist die Strafbarkeit von B zu beurteilen?
    erwartung: B ist wegen versuchten Totschlags in Mittäterschaft strafbar (§§ 212
      Abs. 1, 22, 23 Abs. 1, 25 Abs. 2 StGB).
  expectation:
