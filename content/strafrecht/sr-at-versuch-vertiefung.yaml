cards:
- slug: sr-versv-ansetzen-formeln
  type: streitstand
  front: 'Streitstand: Mit welcher Formel wird das unmittelbare Ansetzen (§ 22 StGB) bestimmt?'
  back: >-
    Problem: Die Grenze zwischen straflosem Vorbereiten und strafbarem Versuch ist
    nur schwer zu ziehen. Die Definition (Handlungen, die nach der Vorstellung des
    Täters ohne wesentliche Zwischenschritte in die Tatbestandserfüllung einmünden
    und das Rechtsgut konkret gefährden) wird durch Formeln konkretisiert.

    Zwischenaktstheorie: Ein unmittelbares Ansetzen liegt vor, wenn zwischen der
    Handlung und der Tatbestandsverwirklichung keine wesentlichen Zwischenakte mehr
    liegen.

    Gefährdungsformel (Rspr., kombiniert mit der Zwischenaktsformel): Der Täter setzt
    an, sobald sein Tun aus seiner Sicht in ein Stadium der unmittelbaren Rechtsgutsgefährdung
    eintritt (Jetzt-geht-es-los).

    Sphärentheorie: Maßgeblich ist das Eindringen in die Schutzsphäre des Opfers
    (etwa das Betreten der Wohnung oder das Einwirken auf das Opfer).

    Die Formeln sind nicht trennscharf; in der Klausur ist die Subsumtion unter die
    Rechtsprechungsformel mit den Indizien (Nähe zur Verwirklichung, Zwischenakte,
    Gefährdung, Tatplan) entscheidend.
  norms:
  - § 22 StGB
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-10
- slug: sr-versv-ansetzen-mittaeter
  type: streitstand
  front: 'Streitstand: Unmittelbares Ansetzen bei Mittäterschaft (§§ 22, 25 Abs. 2 StGB)'
  back: >-
    Problem: Mittäter wirken arbeitsteilig; setzt einer von ihnen an, ist fraglich,
    ob dies auch den anderen zuzurechnen ist, die noch nicht tätig geworden sind.

    Gesamtlösung (Rspr., h.M.): Versuchsbeginn liegt für alle Mittäter vor, sobald
    einer von ihnen nach dem gemeinsamen Tatplan unmittelbar ansetzt (§ 25 Abs. 2
    StGB: wechselseitige Zurechnung der Tatbeiträge). Der Tatplan ist maßgeblich.
    Auch der Mittäter, der erst später eingreifen soll, setzt damit an.

    Einzellösung (Teile der Literatur): Für jeden Mittäter ist gesondert zu prüfen,
    ob er selbst nach seiner Vorstellung unmittelbar angesetzt hat. Argument: Ein
    Mittäter, der noch gar nichts tut, kann allein durch das Tun des anderen noch
    nicht in die Versuchsstrafbarkeit geraten (individuelle Gefährlichkeit).

    Differenzierende Ansätze: Zurechnung nur, wenn der vom Tatbeitrag des Einzelnen
    abhängige Teil unmittelbar bevorsteht.

    In Klausuren ist regelmäßig die Gesamtlösung vorzugswürdig; sie harmoniert mit
    der Mittäterzurechnung.
  norms:
  - § 22 StGB
  - § 25 Abs. 2 StGB
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-10
- slug: sr-versv-ansetzen-mittelbar
  type: streitstand
  front: 'Streitstand: Unmittelbares Ansetzen bei mittelbarer Täterschaft (§§ 22, 25 Abs. 1 Var. 2 StGB)'
  back: >-
    Problem: Der Hintermann bedient sich eines Werkzeugs. Fraglich ist, ob der
    Versuch des Hintermanns beginnt, wenn er auf das Werkzeug einwirkt, oder erst,
    wenn das Werkzeug selbst ansetzt.

    Gesamtlösung (Einwirkungstheorie): Der Hintermann setzt bereits mit der Einwirkung
    auf das Werkzeug an, wenn er alles Erforderliche getan hat; der Versuch beginnt
    mit der Einwirkung. Argument: Die Tat des Werkzeugs wird dem Hintermann voll
    zugerechnet.

    Einzellösung (Teil der Lit.): Der Versuch beginnt erst, wenn das Werkzeug
    unmittelbar ansetzt. Argument: Erst dann ist das Rechtsgut gefährdet; ohne
    Handlung des Werkzeugs bleibt die Tat im Vorbereitungsstadium.

    Rspr. und vermittelnde Lösung: Der Versuch beginnt, wenn der Hintermann das
    Geschehen aus der Hand gibt und aus seiner Sicht die Tat bei ungestörtem Ablauf
    unmittelbar in die Verwirklichung des Tatbestands einmündet oder das Werkzeug
    sofort tätig werden soll. Wird das Werkzeug erst später tätig, liegt noch kein
    Ansetzen vor.

    Hinweis: Die vermittelnde Lösung ist in Klausuren die gängige Argumentationslinie.
  norms:
  - § 22 StGB
  - § 25 Abs. 1 Var. 2 StGB
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-10
- slug: sr-versv-ansetzen-unterlassen
  type: streitstand
  front: 'Streitstand: Unmittelbares Ansetzen beim unechten Unterlassungsdelikt (§§ 13, 22 StGB)'
  back: >-
    Problem: Beim Unterlassen fehlt eine Ausführungshandlung. Fraglich ist, wann der
    Garant unmittelbar zur Tatbestandsverwirklichung ansetzt.

    Erste Rettungsmöglichkeit (Mindermeinung): Der Versuch beginnt, sobald der Garant
    die erste Rettungsmöglichkeit ungenutzt lässt. Kritik: zu weit, bloß wartende
    Passivität würde zu früh strafbar.

    Letzte Rettungsmöglichkeit (Teile der Lit.): Der Versuch beginnt erst, wenn der
    Garant die letzte Gelegenheit zum Eingreifen verstreichen lässt. Kritik: Der
    Versuch würde mit der Vollendung zusammenfallen.

    Gefährdungsansatz (h.M.): Maßgeblich ist, ob der Garant nach seiner Vorstellung
    das Rechtsgut unmittelbar gefährdet sieht und die Gefahr nach dem Tatplan sofort
    in den Erfolg umschlagen kann; dann beginnt der Versuch mit dem Verstreichenlassen
    der nächsten Möglichkeit.

    Die h.M. bevorzugt den Gefährdungsansatz, weil er die Gefährdungsformel auf
    das Unterlassen überträgt.
  norms:
  - § 13 StGB
  - § 22 StGB
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-10
- slug: sr-versv-wahndelikt
  type: definition
  front: 'Abgrenzung: untauglicher Versuch und Wahndelikt'
  back: >-
    Beim untauglichen Versuch irrt der Täter über Tatsachen: Er stellt sich einen
    Sachverhalt vor, der, wenn er vorläge, einen Straftatbestand erfüllen würde (etwa
    er schießt auf eine bereits tote Person, die er für lebend hält). Der untaugliche
    Versuch ist nach § 22 StGB strafbar (außer er ist grob unverständig, § 23 Abs. 3
    StGB). Beim Wahndelikt irrt der Täter dagegen über Rechtsfragen: Er hält ein tatsächlich
    straflos zulässiges Verhalten für strafbar, weil er eine Strafnorm erfindet oder
    deren Grenzen zu weit zieht (umgekehrter Verbotsirrtum). Das Wahndelikt ist straflos, weil es kein Versuch ist. Maßgeblich ist
    die Frage, ob der Täter einen Tatsachenirrtum (untauglich) oder einen Rechtsirrtum
    (Wahn) erleidet: Die Tat läge vor, wenn der vorgestellte Sachverhalt wirklich
    wäre (Versuch), nicht schon dann, wenn die Rechtsansicht des Täters zuträfe. Zur
    Abgrenzung kann auf die umgekehrte Irrtumslehre zurückgegriffen werden (umgekehrter
    Subsumtionsirrtum ist Wahndelikt, umgekehrter Tatbestandsirrtum ist Versuch).
  norms:
  - § 22 StGB
  - § 23 Abs. 3 StGB
  - § 16 Abs. 1 StGB
  - § 17 StGB
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-10
- slug: sr-versv-strafgrund
  type: streitstand
  front: 'Streitstand: Strafgrund des Versuchs (objektive, subjektive, Eindruckstheorie)'
  back: >-
    Problem: Der Versuch lässt den Erfolg ausbleiben; zu klären ist, warum er dennoch
    strafbar ist.

    Objektive Theorie: Strafgrund ist die objektive Gefährdung des Rechtsguts. Der
    untaugliche Versuch müsste danach straflos sein; er ist es aber nach § 22 StGB
    gerade nicht.

    Subjektive Theorie: Strafgrund ist der betätigte rechtsfeindliche Wille. Kritik:
    Auch der bloße Wille ohne Außenwirkung bliebe strafbar.

    Eindruckstheorie (h.M., Rspr.): Strafgrund ist der durch die Tat betätigte
    rechtsfeindliche Wille, der geeignet ist, das Vertrauen der Allgemeinheit in die
    Geltung der Rechtsordnung zu erschüttern und den Rechtsfrieden zu stören. Daraus
    folgen die Strafbarkeit des untauglichen Versuchs und die Privilegierung des grob
    unverständigen Versuchs (§ 23 Abs. 3 StGB), weil dieser keinen Eindruck hinterlässt.

    Bedeutung: Der Streit erklärt die Systematik, ist in Klausuren aber nur selten
    zu entscheiden.
  norms:
  - § 22 StGB
  - § 23 Abs. 3 StGB
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-10
- slug: sr-versv-ruecktritt-24-abs2
  type: norm
  front: Was regelt § 24 Abs. 2 StGB (Rücktritt bei mehreren Beteiligten)?
  back: >-
    Sind an der Tat mehrere beteiligt, so wird nach § 24 Abs. 2 S. 1 StGB wegen
    Versuchs nicht bestraft, wer freiwillig die Vollendung verhindert. Jedoch genügt
    zu seiner Straflosigkeit sein freiwilliges und ernsthaftes Bemühen, die Vollendung
    zu verhindern, wenn die Tat ohne sein Zutun nicht vollendet oder unabhängig von seinem
    früheren Tatbeitrag begangen wird (§ 24 Abs. 2 S. 2 StGB). Entscheidend ist:
    Für den Beteiligten, der seinen Tatbeitrag bereits geleistet hat, genügt die
    bloße Aufgabe des eigenen Tuns nicht. Er muss die Vollendung aktiv verhindern.
    Der Rücktritt wirkt als persönlicher Strafaufhebungsgrund nur für den Zurücktretenden;
    er ist für jeden Beteiligten gesondert zu prüfen.
  norms:
  - § 24 Abs. 2 StGB
  quellen:
  - StGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-10
- slug: sr-versv-ruecktritt-beteiligte
  type: definition
  front: Wie ist der Rücktritt von Mittätern, Anstiftern und Gehilfen (§ 24 Abs. 2 StGB) zu prüfen?
  back: >-
    Für jeden Beteiligten ist gesondert zu prüfen: (1) Kein Fehlschlag (der Fehlschlag
    ist nach den Vorstellungen des jeweiligen Beteiligten zu beurteilen). (2) Je nach
    Fortschritt ein beendeter oder unbeendeter Versuch; bei Mittätern genügt es
    nicht, wenn ein Mittäter sein Tun einstellt, sofern die anderen weitermachen: Er
    muss die Vollendung verhindern. (3) Hat der Beteiligte seinen Beitrag
    schon geleistet (Anstifter, Gehilfe, Mittäter im Vorbereitungsstadium), kann er
    die Vollendung durch Abbruch der Tat, Einwirkung auf die anderen oder Anzeige
    verhindern; reines Passivbleiben genügt nicht. (4) Freiwilligkeit. Erreicht er
    die Verhinderung nicht, hat er aber ernsthaft versucht, und die Tat bleibt ohne
    sein Zutun unvollendet oder wird unabhängig von seinem Beitrag vollendet, genügt
    sein ernsthaftes Bemühen. Der Rücktritt eines Beteiligten wirkt nicht für die
    übrigen Beteiligten.
  norms:
  - § 24 Abs. 2 StGB
  - § 24 Abs. 1 StGB
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-10
- slug: sr-versv-ruecktritt-verhindern
  type: definition
  front: 'Rücktritt vom beendeten Versuch: Wann liegt ein "Verhindern der Vollendung" vor?'
  back: >-
    Verhindern im Sinne des § 24 Abs. 1 S. 1 Var. 2, Abs. 2 S. 1 StGB setzt eine
    Rücktrittshandlung voraus, die für die Nichtvollendung (zumindest mit-)ursächlich
    ist und vom Täter mit dem Willen gesetzt wird, den Erfolg abzuwenden. Der Täter
    muss nicht selbst den Erfolg abwenden; er kann sich Dritter bedienen (etwa durch
    Notruf), muss die Rettung aber selbst in Gang setzen und darf sie nicht dem Zufall
    überlassen. Die Anforderungen an die Qualität der Rettungsmaßnahmen sind nicht
    einheitlich: Teile der Literatur verlangen die bestmögliche Rettungsmaßnahme; die
    Rechtsprechung stellt geringere Anforderungen und lässt genügen, dass der Täter
    eine nach seiner Vorstellung geeignete Maßnahme ergreift, die für die Nichtvollendung
    ursächlich wird. Tritt der Erfolg trotz der Bemühung ein, scheidet ein Rücktritt
    aus; das bloße Bemühen nach § 24 Abs. 1 S. 2 und Abs. 2 S. 2 StGB genügt nur,
    wenn die Tat ohne Zutun des Täters unvollendet bleibt.
  norms:
  - § 24 Abs. 1 S. 1 StGB
  - § 24 Abs. 2 S. 1 StGB
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-10
