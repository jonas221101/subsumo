cards:
- slug: sr-betrug-grundtatbestand
  type: definition
  front: 'Definiere: Betrug, Grundtatbestand § 263 Abs. 1 StGB'
  back: 'Betrug begeht, wer in der Absicht, sich oder einem Dritten einen rechtswidrigen
    Vermögensvorteil zu verschaffen, das Vermögen eines anderen dadurch beschädigt,
    dass er durch Vorspiegelung falscher oder durch Entstellung oder Unterdrückung
    wahrer Tatsachen einen Irrtum erregt oder unterhält. Die objektiven Merkmale
    müssen sich in einer Kausalkette aneinanderreihen: Täuschung führt zu Irrtum,
    Irrtum führt zu Vermögensverfügung, Verfügung führt zu Vermögensschaden.'
  norms:
  - § 263 Abs. 1 StGB
  quellen:
  - § 263 StGB, amtlicher Wortlaut
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sr-betrug-taeuschung
  type: definition
  front: 'Definiere: Täuschung über Tatsachen, § 263 Abs. 1 StGB'
  back: Täuschung ist jedes Verhalten, das auf die Vorstellung eines anderen einwirkt,
    um bei ihm eine Fehlvorstellung über Tatsachen hervorzurufen oder zu bestätigen.
    Tatsachen sind dem Beweis zugängliche, gegenwärtige oder vergangene Umstände
    der Außen- oder Innenwelt - reine Werturteile und Prognosen ohne Tatsachenkern
    genügen nicht. Die Täuschung kann ausdrücklich (durch Erklärung) oder konkludent
    (durch schlüssiges Verhalten, z. B. beim Betreten eines Geschäfts als zahlungsfähiger
    und -williger Kunde) erfolgen.
  norms:
  - § 263 Abs. 1 StGB
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sr-betrug-irrtum
  type: definition
  front: 'Definiere: Irrtum i.S.d. § 263 Abs. 1 StGB'
  back: Irrtum ist jede unrichtige, positive Vorstellung des Getäuschten über Tatsachen,
    die von der Wirklichkeit abweicht. Bloße Unkenntnis oder Zweifel genügen nicht
    - erforderlich ist eine tatsächliche Fehlvorstellung. Der Irrtum muss durch die
    Täuschung hervorgerufen oder unterhalten worden sein (Kausalität); ist der Getäuschte
    bereits vorher überzeugt oder gleichgültig, fehlt es am Irrtum.
  norms:
  - § 263 Abs. 1 StGB
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sr-betrug-vermoegensverfuegung
  type: definition
  front: 'Definiere: Vermögensverfügung, § 263 Abs. 1 StGB (ungeschriebenes Tatbestandsmerkmal)'
  back: 'Vermögensverfügung ist jedes Handeln, Dulden oder Unterlassen des Getäuschten,
    das sich unmittelbar vermögensmindernd auswirkt. Sie grenzt den Betrug (Selbstschädigungsdelikt)
    vom Diebstahl (Fremdschädigungsdelikt) ab: Beim Betrug wirkt das Opfer selbst
    an der eigenen Vermögensminderung mit. Erforderlich ist Unmittelbarkeit - zwischen
    Verfügung und Vermögensminderung darf keine weitere, eigenständige Zwischenhandlung
    nötig sein.'
  norms:
  - § 263 Abs. 1 StGB
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sr-betrug-vermoegensschaden
  type: definition
  front: 'Definiere: Vermögensschaden, § 263 Abs. 1 StGB (Prinzip der Gesamtsaldierung)'
  back: 'Nach dem wirtschaftlichen Vermögensbegriff wird der Wert des Vermögens
    vor und nach der Verfügung im Wege der Gesamtsaldierung verglichen: Ein Schaden
    liegt vor, wenn der Getäuschte durch die Verfügung wirtschaftlich schlechter
    steht als zuvor. Erhält er eine gleichwertige Gegenleistung, entfällt der Schaden;
    bei einem objektiv minderwertigen oder für seine Zwecke unbrauchbaren Gegenstand
    kann trotz formal äquivalenter Gegenleistung ein individueller Schadenseinschlag
    vorliegen.'
  norms:
  - § 263 Abs. 1 StGB
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sr-betrug-eingehungsbetrug
  type: definition
  front: 'Definiere: Eingehungsbetrug'
  back: 'Beim Eingehungsbetrug liegt der Vermögensschaden bereits im Vertragsschluss
    selbst, nicht erst in dessen Erfüllung: Weicht der Wert der vertraglich geschuldeten
    Gegenleistung des Täuschenden schon im Zeitpunkt des Vertragsschlusses zu Lasten
    des Getäuschten vom Wert der eigenen Leistung ab, ist bereits durch den Vertragsschluss
    eine schadensgleiche Vermögensgefährdung und damit ein vollendeter Schaden eingetreten
    - unabhängig davon, ob später tatsächlich erfüllt wird.'
  norms:
  - § 263 Abs. 1 StGB
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sr-betrug-bereicherungsabsicht
  type: definition
  front: 'Definiere: Absicht stoffgleicher, rechtswidriger Bereicherung, § 263 Abs.
    1 StGB'
  back: 'Der Täter muss beabsichtigen, sich oder einem Dritten einen Vermögensvorteil
    zu verschaffen, der stoffgleich mit dem Vermögensschaden des Opfers ist - der
    erstrebte Vorteil muss also die Kehrseite des Schadens sein und unmittelbar aus
    derselben Verfügung stammen. Die erstrebte Bereicherung muss zudem rechtswidrig
    sein: Hat der Täter einen fälligen und einredefreien Anspruch auf den erlangten
    Vorteil, entfällt die Rechtswidrigkeit.'
  norms:
  - § 263 Abs. 1 StGB
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sr-betrug-besonders-schwerer-fall
  type: norm
  front: Was regelt § 263 Abs. 3 StGB?
  back: § 263 Abs. 3 StGB enthält Regelbeispiele für einen besonders schweren Fall
    des Betrugs mit erhöhtem Strafrahmen (Freiheitsstrafe von sechs Monaten bis zehn
    Jahren), etwa bei gewerbsmäßiger Begehung, Herbeiführung eines Vermögensverlusts
    großen Ausmaßes oder Ausnutzung einer Amtsträger- oder Vertrauensstellung -
    ohne den Tatbestand des § 263 Abs. 1 StGB selbst zu ändern.
  norms:
  - § 263 Abs. 3 StGB
  quellen:
  - § 263 StGB, amtlicher Wortlaut
  - Eigenformulierung Redaktion
  stand: 2026-09
schemata:
- slug: sr-schema-263
  title: Betrug, § 263 Abs. 1 StGB
  norms:
  - § 263 Abs. 1 StGB
  quellen:
  - § 263 StGB, amtlicher Wortlaut
  - Eigenformulierung Redaktion
  steps:
  - label: I. Tatbestand
    children:
    - label: 1. Objektiver Tatbestand
      children:
      - label: a) Täuschung über Tatsachen
      - label: b) dadurch (Kausalität) Irrtum
      - label: c) dadurch (Kausalität) Vermögensverfügung
      - label: d) dadurch (Kausalität) Vermögensschaden (Gesamtsaldierung)
        hinweis: Bei Vertragsschlüssen ggf. bereits Eingehungsbetrug prüfen.
    - label: 2. Subjektiver Tatbestand
      children:
      - label: a) Vorsatz bzgl. aller objektiven Tatbestandsmerkmale, § 15 StGB
      - label: b) Absicht stoffgleicher, rechtswidriger Bereicherung
  - label: II. Rechtswidrigkeit
  - label: III. Schuld
  - label: IV. Besonders schwerer Fall, § 263 Abs. 3 StGB
    hinweis: Nur prüfen, wenn der Sachverhalt dazu Anlass gibt.
faelle:
- slug: sr-fall-gebrauchter-laptop
  title: Der gebrauchte Laptop
  difficulty: 3
  minutes: 50
  quellen:
  - Eigener Sachverhalt der Redaktion
  - StGB, amtliche Fassung
  facts: A bietet auf einem Online-Marktplatz einen gebrauchten Laptop zum Festpreis
    von 400 Euro an. In der Anzeige schreibt er wahrheitswidrig "Display technisch
    einwandfrei, keine Schäden". Tatsächlich hat das Display einen deutlichen Sprung,
    den A vor dem Fotografieren mit einer Displayfolie kaschiert hat. K liest die
    Anzeige, vertraut der Angabe und überweist A vorab 400 Euro. A verschickt daraufhin
    den Laptop. Als K das Gerät auspackt, bemerkt er den Sprung im Display; eine
    Reparatur würde 150 Euro kosten.
  question: Hat sich A gegenüber K wegen Betrugs gemäß § 263 Abs. 1 StGB strafbar
    gemacht?
  steps:
  - prompt: Formuliere den Obersatz.
    erwartung: A könnte sich durch die Anzeige und Entgegennahme der Zahlung wegen
      Betrugs gemäß § 263 Abs. 1 StGB zu Lasten des K strafbar gemacht haben.
  - prompt: Liegt eine Täuschung über Tatsachen vor?
    erwartung: Ja - die Behauptung 'Display technisch einwandfrei, keine Schäden'
      ist eine ausdrückliche Täuschung über eine dem Beweis zugängliche Tatsache,
      den tatsächlichen Zustand des Displays.
  - prompt: Ist bei K ein Irrtum entstanden und hat dieser zu einer Vermögensverfügung
      geführt?
    erwartung: Ja - K ging fälschlich von einem unbeschädigten Display aus und überwies
      deshalb die 400 Euro; die Überweisung ist eine unmittelbar vermögensmindernde
      Vermögensverfügung.
  - prompt: Liegt ein Vermögensschaden vor, obwohl K einen funktionierenden Laptop
      erhalten hat?
    erwartung: Ja. Nach dem Prinzip der Gesamtsaldierung ist der Wert des tatsächlich
      gelieferten, beschädigten Laptops geringer als der gezahlte Kaufpreis - der
      objektive Minderwert entspricht in etwa den 150 Euro Reparaturkosten.
  - prompt: Liegt Absicht stoffgleicher, rechtswidriger Bereicherung vor?
    erwartung: Ja - A wollte den vollen Kaufpreis erhalten, obwohl der Laptop weniger
      wert war; der erstrebte Vorteil (voller Kaufpreis) ist die Kehrseite des Schadens
      des K und rechtswidrig, da A keinen Anspruch auf den vollen Preis für die mangelhafte
      Sache hatte.
