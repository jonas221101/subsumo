      Strafantrag nach § 265a Abs. 3 i. V. m. §§ 247, 248a StGB.
faelle:
- slug: sr-fall-cb-gefundene-karte
  title: Die gefundene girocard
  difficulty: 3
  minutes: 40
  quellen:
  - Eigener Sachverhalt der Redaktion
  - StGB, amtliche Fassung
  facts: >-
    D beobachtet an einem Geldautomaten, wie O seine PIN 4711 eingibt. Als O beim Verlassen
    der Bankfiliale seine girocard auf den Boden fallen lässt, ohne es zu bemerken, hebt D
    sie auf. Eine Stunde später steckt D die Karte an einem Geldautomaten der Bank, bei der
    O sein Konto führt, ein, gibt die Zahl 4711 ein und hebt 500 Euro ab. Der Betrag wird
    dem Konto des O belastet. O bemerkt den Verlust am selben Abend und lässt die Karte sperren;
    ihn trifft kein grobes Verschulden, sodass die Bank ihm den Betrag erstattet. D behält
    das Geld.
  question: >-
    Hat sich D durch die Abhebung wegen Computerbetrugs nach § 263a Abs. 1 StGB strafbar gemacht?
    Andere Delikte sind nur kurz anzusprechen.
  steps:
  - prompt: >-
      Welche Variante des § 263a Abs. 1 StGB kommt in Betracht und liegt ein Datenverarbeitungsvorgang
      vor?
    erwartung: >-
      Ja - die Variante der unbefugten Verwendung von Daten (Var. 3): D verwendet die auf
      der Karte gespeicherten Daten und die PIN in den Datenverarbeitungsvorgang des Geldautomaten.
  - prompt: >-
      War die Verwendung "unbefugt"? Welche Auslegung ist vorzugswürdig?
    erwartung: >-
      Ja - nach der h. M. und Rspr. (betrugsspezifische Auslegung) ist die Verwendung unbefugt,
      weil ein Bankangestellter am Schalter über die Berechtigung des D zur Abhebung getäuscht
      würde. Die subjektive Auslegung käme zum selben Ergebnis, die computerspezifische Auslegung
      ebenfalls, wenn man die PIN-Verwendung durch einen Nichtberechtigten als Überwindung
      der Sicherung ansieht.
  - prompt: >-
      Wurde das Ergebnis des Datenverarbeitungsvorgangs beeinflusst und ist ein Vermögensschaden
      eingetreten?
    erwartung: >-
      Ja - der Automat gibt 500 Euro aus, die Auszahlung ist die unmittelbare Folge. Ein Schaden
      entsteht bei der Bank: Sie hat dem O den belasteten Betrag erstattet, ohne von
      ihm Ersatz verlangen zu können; ihr Vermögen ist um 500 Euro gemindert (Vermögensschaden
      der Bank, Gesamtsaldierung).
  - prompt: >-
      Handelte D vorsätzlich und mit Bereicherungsabsicht?
    erwartung: >-
      Ja - D wusste, dass er nicht zur Abhebung berechtigt war, und wollte sich das Geld rechtswidrig
      verschaffen (Stoffgleichheit).
  - prompt: Ergebnis?
    erwartung: >-
      D ist wegen Computerbetrugs nach § 263a Abs. 1 Var. 3 StGB strafbar. Es liegt
      kein Diebstahl am ausgegebenen Geld vor, denn der Automat gibt es im Wege der
      Gewahrsamsübertragung aus; es fehlt der Gewahrsamsbruch.
  expectation:
    pruefpunkte:
