cards:
- slug: sr-notstand-gefahrbegriff
  type: definition
  front: 'Definiere: Gefahr i.S.d. § 34 StGB'
  back: Eine Gefahr ist ein Zustand, in dem nach den Umständen des Einzelfalls der
    Eintritt eines schädigenden Ereignisses ernstlich droht, wenn dem drohenden Geschehensablauf
    nicht gegengesteuert wird. Sie kann von Menschen, Tieren, Naturereignissen oder
    technischen Defekten ausgehen - anders als bei § 32 StGB kommt es auf einen menschlichen
    Angriff nicht an.
  norms:
  - § 34 StGB
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sr-notstand-notstandslage
  type: definition
  front: 'Definiere: Notstandslage, § 34 S. 1 StGB'
  back: Eine Notstandslage liegt vor, wenn eine gegenwärtige, nicht anders abwendbare
    Gefahr für Leben, Leib, Freiheit, Ehre, Eigentum oder ein anderes Rechtsgut besteht.
    Gegenwärtig ist die Gefahr, wenn der Schaden sofort oder in allernächster Zeit
    einzutreten droht, wenn nicht eingegriffen wird - eine 'Dauergefahr' genügt ebenfalls,
    wenn sie jederzeit akut werden kann.
  norms:
  - § 34 Satz 1 StGB
  quellen:
  - StGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sr-notstand-erforderlichkeit
  type: definition
  front: Wann ist eine Notstandshandlung erforderlich i.S.d. § 34 Satz 1 StGB?
  back: Erforderlich ist die Notstandshandlung, wenn sie zur Abwendung der Gefahr
    geeignet und zugleich das relativ mildeste, gleich wirksame Mittel ist. Stehen
    dem Täter mehrere gleich geeignete Mittel zur Verfügung, muss er dasjenige wählen,
    das das beeinträchtigte Rechtsgut am wenigsten belastet.
  norms:
  - § 34 Satz 1 StGB
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sr-notstand-interessenabwaegung
  type: streitstand
  front: Nach welchen Kriterien bestimmt sich das 'wesentliche Überwiegen' der Interessen,
    § 34 Satz 1 StGB?
  back: 'Die Abwägung ist eine Gesamtbetrachtung aller Umstände des Einzelfalls,
    keine schematische Rangfolge. Maßgebliche Kriterien sind insbesondere: der Rang
    und die Bedeutung der kollidierenden Rechtsgüter, der Grad der drohenden Gefahr
    und die Wahrscheinlichkeit ihres Eintritts, die Erfolgsaussicht der Rettungshandlung,
    das Maß der zu erwartenden Rechtsgutsverletzung sowie die Frage, ob der Betroffene
    die Gefahr autonom mitverursacht hat. Ein bloßes Überwiegen genügt nicht -
    es muss sich um ein wesentliches, deutliches Überwiegen des geschützten gegenüber
    dem beeinträchtigten Interesse handeln.'
  norms:
  - § 34 Satz 1 StGB
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sr-notstand-angemessenheit
  type: norm
  front: Was leistet die Angemessenheitsklausel des § 34 Satz 2 StGB zusätzlich zur
    Interessenabwägung?
  back: § 34 Satz 2 StGB verlangt zusätzlich zum wesentlichen Überwiegen, dass die
    Tat ein angemessenes Mittel ist, die Gefahr abzuwenden. Die Klausel ist ein eigenständiges
    normatives Korrektiv für Fälle, in denen trotz günstiger Güterbilanz die Rechtsordnung
    ein bestimmtes Verfahren vorschreibt (z. B. richterliche Entscheidung, behördliches
    Verfahren) - wird dieses Verfahren umgangen, kann die Tat trotz überwiegenden
    Erhaltungsinteresses unangemessen und damit nicht gerechtfertigt sein.
  norms:
  - § 34 Satz 2 StGB
  quellen:
  - StGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sr-notstand-abgrenzung-notwehr-32
  type: definition
  front: 'Abgrenzung: Rechtfertigender Notstand, § 34 StGB, und Notwehr, § 32 StGB'
  back: Notwehr setzt einen gegenwärtigen rechtswidrigen Angriff eines Menschen voraus
    und erlaubt die Verteidigung gegen genau diesen Angreifer, ohne dass die Interessen
    gegeneinander abgewogen werden müssten (Rechtsbewährungsprinzip). Der Notstand
    nach § 34 StGB erfasst dagegen jede Gefahrenquelle - auch Naturereignisse, Tiere
    oder eigenes Fehlverhalten Dritter ohne Angriffsqualität - und erlaubt unter
    Umständen auch einen Eingriff in Rechtsgüter unbeteiligter Dritter (Aggressivnotstand),
    verlangt dafür aber ein wesentliches Überwiegen der Interessen und Angemessenheit.
  norms:
  - § 32 StGB
  - § 34 StGB
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sr-notstand-abgrenzung-entschuldigender-notstand-35
  type: definition
  front: 'Abgrenzung: Rechtfertigender Notstand, § 34 StGB, und entschuldigender Notstand,
    § 35 StGB'
  back: '§ 34 StGB schließt bereits die Rechtswidrigkeit der Tat aus - die Rechtsordnung
    billigt das Verhalten, jedermann muss es dulden. § 35 StGB lässt die Rechtswidrigkeit
    unberührt und entschuldigt nur die Schuld des Täters; die Tat bleibt Unrecht,
    gegen das sich Dritte ihrerseits mit Notwehr wehren dürften. § 35 StGB ist zudem
    enger gefasst: er schützt nur Leben, Leib und Freiheit des Täters oder einer
    ihm nahestehenden Person (§ 35 Abs. 1 Satz 1 StGB) und verlangt keine Interessenabwägung,
    sondern fragt nach der Zumutbarkeit, die Gefahr hinzunehmen.'
  norms:
  - § 34 StGB
  - § 35 Abs. 1 Satz 1 StGB
  quellen:
  - StGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
schemata:
- slug: sr-schema-notstand-34
  title: Rechtfertigender Notstand, § 34 StGB
  norms:
  - § 34 StGB
  quellen:
  - StGB, amtliche Fassung
  - Eigenformulierung Redaktion
  steps:
  - label: I. Notstandslage
    children:
    - label: 1. Gefahr für ein notstandsfähiges Rechtsgut (Leben, Leib, Freiheit,
        Ehre, Eigentum, anderes Rechtsgut)
    - label: 2. Gegenwärtigkeit der Gefahr
    - label: 3. Nicht anders abwendbar
  - label: II. Notstandshandlung
    children:
    - label: 1. Erforderlichkeit (relativ mildestes, gleich wirksames Mittel)
  - label: III. Interessenabwägung
    children:
    - label: 1. Rang und Bedeutung der kollidierenden Rechtsgüter
    - label: 2. Grad und Wahrscheinlichkeit der Gefahr, Erfolgsaussicht der Rettungshandlung
    - label: 3. Wesentliches Überwiegen des geschützten Interesses
    hinweis: Keine schematische Rangfolge, sondern Gesamtabwägung des Einzelfalls.
  - label: IV. Angemessenheit, § 34 Satz 2 StGB
    hinweis: Eigenständiges Korrektiv - va. relevant, wenn ein vorgeschriebenes Verfahren
      umgangen wird.
  - label: 'V. Ergebnis: Rechtswidrigkeit entfällt'
faelle:
- slug: sr-fall-hund-im-auto
  title: Der Hund im Auto
  difficulty: 2
  minutes: 30
  quellen:
  - Eigener Sachverhalt der Redaktion
  - StGB, amtliche Fassung
  facts: An einem heißen Sommertag geht A an einem auf einem Supermarktparkplatz
    abgestellten PKW vorbei und sieht darin einen Hund, der stark hechelt, unruhig
    hin- und herspringt und deutliche Anzeichen eines beginnenden Hitzschlags zeigt.
    Die Fensterscheiben sind vollständig geschlossen, der Halter ist nicht auffindbar
    und meldet sich auch nicht auf einen über die Parkplatzlautsprecher ausgerufenen
    Suchaufruf. Da A befürchtet, der Hund könne in den nächsten Minuten einen lebensgefährlichen
    Kreislaufkollaps erleiden, zerschlägt er mit einem griffbereiten Pflasterstein
    die Seitenscheibe und befreit den Hund. Die Reparatur der Scheibe kostet den Halter
    300 Euro.
  question: Hat sich A wegen Sachbeschädigung gemäß § 303 Abs. 1 StGB strafbar
    gemacht?
  steps:
  - prompt: Formuliere den Obersatz.
    erwartung: A könnte sich durch das Einschlagen der Seitenscheibe wegen Sachbeschädigung
      gemäß § 303 Abs. 1 StGB strafbar gemacht haben.
  - prompt: Liegt der Tatbestand der Sachbeschädigung vor?
    erwartung: Ja - die Scheibe ist eine fremde Sache, die A durch das Zerschlagen
      substanziell beschädigt hat.
  - prompt: Liegt eine Notstandslage nach § 34 Satz 1 StGB vor?
    erwartung: Ja - für den Hund droht eine gegenwärtige, nicht anders abwendbare
      Gefahr für Leben und körperliche Unversehrtheit durch drohenden Hitzschlag;
      der Halter ist nicht erreichbar.
  - prompt: War das Einschlagen der Scheibe erforderlich?
    erwartung: Ja - ein milderes, gleich wirksames Mittel, den Hund rechtzeitig zu
      befreien, stand A nicht zur Verfügung.
  - prompt: Überwiegt das geschützte Interesse wesentlich das beeinträchtigte?
    erwartung: Ja - Leben und Gesundheit des Tieres bei drohendem Hitzschlag wiegen
      wesentlich schwerer als der reine Sachwert einer Autoscheibe.
  - prompt: Ist die Tat auch angemessenes Mittel i.S.d. § 34 Satz 2 StGB?
    erwartung: Ja - kein vorgeschriebenes Verfahren wurde umgangen, das Einschlagen
      einer Scheibe zur Rettung eines akut gefährdeten Lebewesens ist ein sozial
      anerkanntes Mittel.
