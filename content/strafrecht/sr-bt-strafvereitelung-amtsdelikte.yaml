  steps:
  - label: I. Tatbestand
    children:
    - label: 1. Objektiver Tatbestand
      children:
      - label: a) Rechtswidrige Vortat eines anderen
        hinweis: Schuld der Vortat nicht erforderlich.
      - label: b) Tathandlung - Vereiteln der Bestrafung oder Maßnahme
        hinweis: Ganz oder teilweise; Teilvereitelung bei nicht unerheblicher Verzögerung.
      - label: c) Kausalität
    - label: 2. Subjektiver Tatbestand
      children:
      - label: a) Vorsatz bezüglich der Vortat
      - label: b) Absicht oder Wissentlichkeit bezüglich des Vereitelungserfolgs
  - label: II. Rechtswidrigkeit
    hinweis: Bei Verteidigern prüfen, ob prozessordnungsgemäße Mittel eingesetzt wurden.
  - label: III. Schuld
  - label: IV. Persönliche Strafausschließungsgründe
    children:
    - label: 1. Selbstbegünstigung, § 258 Abs. 5 StGB
    - label: 2. Angehörigenprivileg, § 258 Abs. 6 StGB
      hinweis: Gilt nicht bei § 258a StGB; Irrtum über die Angehörigeneigenschaft.
  - label: V. Qualifikation - Strafvereitelung im Amt, § 258a StGB
    hinweis: Nur prüfen, wenn der Täter Amtsträger mit Mitwirkungsbefugnis ist.
faelle:
- slug: sr-fall-sva-versteck
  title: Das Versteck
  difficulty: 3
  minutes: 40
  quellen:
  - Eigener Sachverhalt der Redaktion
  - StGB, amtliche Fassung
  facts: >-
    T hat bei einem Überfall auf eine Tankstelle den Kassierer mit einer Pistole
    bedroht und Geld erbeutet. Die Polizei fahndet nach T, gegen ihn besteht ein
    Haftbefehl. T meldet sich bei seinem Bekannten F, der nicht mit ihm verwandt ist, und
    erzählt, was er getan hat. F lässt T drei Wochen lang in seinem Ferienhaus
    wohnen, um zu verhindern, dass T festgenommen und bestraft wird. Auf Nachfrage
    der Polizei behauptet F wahrheitswidrig, T sei ins Ausland verreist. Erst nach
    drei Wochen findet die Polizei T durch einen Hinweis der Nachbarn.
  question: Hat sich F nach § 258 StGB strafbar gemacht? Wäre das Ergebnis anders, wenn F
    der Bruder des T wäre?
  steps:
  - prompt: Liegt eine rechtswidrige Vortat vor?
    erwartung: Ja. T hat mit dem Überfall eine rechtswidrige Tat (schwerer Raub bzw.
      räuberische Erpressung) begangen.
  - prompt: Hat F die Bestrafung des T vereitelt?
    erwartung: Ja, zumindest teilweise. Durch die Unterbringung und die falsche
      Auskunft wurde die Festnahme und damit die Bestrafung für drei Wochen und
      damit für nicht unerhebliche Zeit verzögert (Teilvereitelung).
  - prompt: Welche Vorsatzform hat F?
    erwartung: F handelte wissentlich und absichtlich, denn er wusste von der Tat
      und wollte gerade verhindern, dass T bestraft wird. Rechtfertigungs- und
      Schuldausschließungsgründe liegen nicht vor; die Selbstbegünstigung (§ 258
      Abs. 5 StGB) scheidet aus, weil F nicht auch seine eigene Bestrafung vermeiden
      wollte; F ist nicht Angehöriger. F ist nach § 258 Abs. 1 StGB strafbar.
  - prompt: Was gilt, wenn F der Bruder des T wäre?
    erwartung: Dann wäre F nach § 258 Abs. 6 StGB straffrei, weil er zugunsten eines
      Angehörigen (§ 11 Abs. 1 Nr. 1 StGB) handelte. Der Tatbestand bleibt erfüllt, das
      Privileg ist ein persönlicher Strafausschließungsgrund.
  expectation:
    pruefpunkte:
    - id: p1
      label: Rechtswidrige Vortat des T (Raub bzw. räuberische Erpressung) festgestellt
      weight: 1.0
      required: false
      norms:
