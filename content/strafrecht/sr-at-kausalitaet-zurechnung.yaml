cards:
- slug: sr-zurechnung-modifizierte-formel
  type: definition
  front: 'Definiere: die modifizierte conditio-sine-qua-non-Formel bei Mehrfachkausalität'
  back: 'Bei kumulativer Kausalität wirken mehrere Bedingungen erst gemeinsam zum
    Erfolg, von denen keine allein ausgereicht hätte - hier greift bereits die einfache
    Grundformel, da jede Bedingung nicht hinweggedacht werden kann, ohne dass der
    tatsächlich eingetretene Erfolg entfiele. Bei alternativer (Doppel-)Kausalität
    wirken dagegen mehrere Bedingungen unabhängig voneinander gleichzeitig, von denen
    jede für sich den Erfolg allein herbeigeführt hätte; hier versagt die Grundformel,
    weil sich jede Bedingung isoliert hinwegdenken ließe, ohne dass der Erfolg entfiele.
    Die modifizierte Formel korrigiert dies: Von mehreren Bedingungen, die zwar alternativ,
    nicht aber kumulativ hinweggedacht werden können, ist jede ursächlich.'
  norms:
  - § 212 StGB
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sr-zurechnung-adaequanztheorie
  type: definition
  front: 'Definiere: Adäquanztheorie'
  back: Nach der Adäquanztheorie ist eine Bedingung nur dann (rechtlich relevant)
    ursächlich, wenn sie nach der allgemeinen Lebenserfahrung nicht außerhalb aller
    Wahrscheinlichkeit liegt, den konkreten Erfolg herbeizuführen. Heute wird sie
    überwiegend nicht mehr als eigenständige Korrektur der Äquivalenztheorie behandelt,
    sondern ist in der Lehre von der objektiven Zurechnung aufgegangen, wo ihr Kerngedanke
    - die Vorhersehbarkeit des Erfolgs - im Rahmen der Risikorealisierung fortwirkt.
  norms: []
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sr-zurechnung-schutzzweck-der-norm
  type: definition
  front: 'Definiere: Schutzzweckzusammenhang (Schutzzweck der Norm)'
  back: Die objektive Zurechnung entfällt, wenn sich im tatbestandsmäßigen Erfolg
    nicht die vom Täter geschaffene rechtlich missbilligte Gefahr realisiert hat,
    sondern ein Risiko, das außerhalb des Schutzbereichs der verletzten Verhaltensnorm
    liegt. Eine Sorgfaltsnorm schützt nur vor den Gefahren, derentwegen sie erlassen
    wurde - verwirklicht sich im Erfolg ein Risiko, das die Norm gar nicht verhindern
    sollte, ist der Erfolg dem Täter nicht zuzurechnen.
  norms: []
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sr-zurechnung-eigenverantwortliche-selbstgefaehrdung
  type: streitstand
  front: 'Streitstand: Zurechnung bei eigenverantwortlicher Selbstgefährdung des
    Opfers'
  back: 'Problem: Fördert oder ermöglicht ein Dritter, dass sich ein anderer

    selbst einer Gefahr aussetzt, und verwirklicht sich diese Gefahr, stellt

    sich die Frage, ob der Dritte für den Erfolg (mit-)verantwortlich ist.


    Abgrenzung nach Tatherrschaft (h.M. und Rspr.): Maßgeblich ist, wer im

    letzten, zum Erfolg führenden Akt die Tatherrschaft innehat. Behält

    das Opfer bis zuletzt die freie, verantwortliche Entscheidung und führt

    es die gefährliche Handlung selbst aus, liegt eigenverantwortliche

    Selbstgefährdung vor: der Dritte, der die Gefahrenquelle nur

    bereitstellt oder bestärkt, haftet mangels tatbestandsmäßiger

    Fremdverletzung nicht, da die Selbstgefährdung selbst nicht

    tatbestandsmäßig ist (Prinzip der Selbstverantwortung).


    Übernimmt dagegen der Dritte selbst die zum Erfolg führende

    Ausführungshandlung, während sich das Opfer nur der Gefahr aussetzt

    (einverständliche Fremdgefährdung), schließt das bloße

    Einverständnis eine Zurechnung zum Dritten nicht von vornherein aus;

    eine Gleichstellung mit der straflosen Selbstgefährdung kommt nach

    h.M. nur in Betracht, wenn das Opfer das Risiko voll durchschaut und

    freiverantwortlich in Kauf genommen hat und dem Dritten kein

    überlegenes Sachwissen gegenüber dem Opfer zukommt.


    Konsequenz: Klausurtechnisch ist zuerst die Freiverantwortlichkeit des

    Opfers zu prüfen (keine relevanten Einsichts- oder Steuerungsdefizite,

    kein Irrtum über das Risiko), danach die Abgrenzung nach dem Kriterium

    der Tatherrschaft im entscheidenden Moment vorzunehmen.

    '
  norms: []
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sr-zurechnung-atypischer-kausalverlauf
  type: definition
  front: 'Definiere: atypischer Kausalverlauf'
  back: Ein atypischer Kausalverlauf liegt vor, wenn der Erfolg zwar äquivalent kausal
    auf dem Täterverhalten beruht, der tatsächliche Geschehensablauf aber derart
    außergewöhnlich vom nach allgemeiner Lebenserfahrung Erwartbaren abweicht, dass
    sich in ihm nicht mehr die vom Täter geschaffene Gefahr, sondern ein neues, eigenständiges
    Risiko realisiert; die objektive Zurechnung entfällt dann. Ein bloß unerwarteter,
    aber im Rahmen des allgemeinen Lebensrisikos liegender Verlauf (z. B. eine übliche
    ärztliche Behandlung der durch die Tat verursachten Verletzung) unterbricht die
    Zurechnung dagegen regelmäßig nicht.
  norms: []
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sr-zurechnung-dazwischentreten-dritter
  type: definition
  front: 'Definiere: Zurechnungsausschluss durch freiverantwortliches Dazwischentreten
    eines Dritten'
  back: Setzt nach der Ersthandlung ein Dritter eine neue, hiervon unabhängige und
    freiverantwortliche Ursache, die den Erfolg selbstständig herbeiführt, kann
    dies den Zurechnungszusammenhang zum Ersttäter unterbrechen. Erforderlich ist,
    dass der Zweitakt nicht durch den Ersttäter provoziert wurde und selbst freiverantwortlich
    sowie vorsätzlich erfolgt; ein bloß fahrlässiges oder unfreies Dazwischentreten
    des Dritten unterbricht die Zurechnung demgegenüber regelmäßig nicht.
  norms: []
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sr-zurechnung-pflichtwidrigkeitszusammenhang
  type: norm
  front: 'Definiere: Pflichtwidrigkeitszusammenhang (rechtmäßiges Alternativverhalten)'
  back: Bei Fahrlässigkeitsdelikten ist der Erfolg nicht objektiv zurechenbar, wenn
    er auch bei pflichtgemäßem Alternativverhalten des Täters mit an Sicherheit
    grenzender Wahrscheinlichkeit ebenso eingetreten wäre - dann realisiert sich
    im Erfolg nicht das vom Täter geschaffene rechtlich missbilligte Risiko, sondern
    das allgemeine Lebensrisiko, und der Pflichtwidrigkeitszusammenhang fehlt.
  norms:
  - § 222 StGB
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
schemata:
- slug: sr-schema-kausalitaet-obj-zurechnung
  title: Prüfung von Kausalität und objektiver Zurechnung beim Erfolgsdelikt
  norms:
  - § 212 StGB
  - § 222 StGB
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
  steps:
  - label: I. Kausalität (Äquivalenztheorie / conditio-sine-qua-non)
    children:
    - label: '1. Grundformel: Handlung nicht hinwegdenkbar, ohne dass der Erfolg entfiele'
    - label: 2. Modifikation bei Mehrfachkausalität (kumulativ / alternativ)
  - label: II. Objektive Zurechnung
    children:
    - label: 1. Schaffung einer rechtlich missbilligten Gefahr
      children:
      - label: a) Kein erlaubtes Risiko
      - label: b) Keine bloße Risikoverringerung
    - label: 2. Realisierung gerade dieser Gefahr im tatbestandsmäßigen Erfolg
      children:
      - label: a) Kein atypischer Kausalverlauf
      - label: b) Schutzzweckzusammenhang gewahrt
      - label: c) Kein Ausschluss durch freiverantwortliche Selbstgefährdung des
          Opfers oder freiverantwortliches Dazwischentreten Dritter
      - label: 'd) Bei Fahrlässigkeitsdelikten: Pflichtwidrigkeitszusammenhang (kein
          rechtmäßiges Alternativverhalten mit gleichem Erfolg)'
  - label: III. Ergebnis
faelle:
- slug: sr-fall-vertauschte-medikamente
  title: Die Fehlmedikation
  difficulty: 4
  minutes: 45
  quellen:
  - Eigener Sachverhalt der Redaktion
  - StGB, amtliche Fassung
  facts: A verursacht fahrlässig einen Verkehrsunfall, bei dem B einen offenen Beinbruch
    erleidet. B wird in ein Krankenhaus eingeliefert. Dort vertauscht eine Krankenschwester
    infolge einer Verwechslung der Patientenakten ein für B kontraindiziertes Medikament,
    das bei ihm eine allergische Reaktion mit tödlichem Kreislaufschock auslöst.
    B stirbt nicht an den Unfallverletzungen, sondern an der Medikamentenreaktion.
  question: Ist A der Tod des B im Rahmen des § 222 StGB objektiv zurechenbar?
  steps:
  - prompt: Ist A für den Tod des B äquivalent kausal geworden?
    erwartung: Ja - hätte A den Unfall nicht verursacht, wäre B nicht ins Krankenhaus
      gekommen und die tödliche Fehlmedikation wäre unterblieben.
  - prompt: Hat A durch den Unfall eine rechtlich missbilligte Gefahr geschaffen?
    erwartung: Ja - das fahrlässige Verursachen eines Verkehrsunfalls mit erheblicher
      Verletzungsfolge begründet eine rechtlich missbilligte Gefahr für Leib und
      Leben des B.
  - prompt: Realisiert sich im Tod des B gerade diese von A geschaffene Gefahr?
    erwartung: Nein - die grob fehlerhafte Medikamentenverwechslung durch die Krankenschwester
      steht in keinem inneren Zusammenhang mit der Art der Unfallverletzung und stellt
      einen derart außergewöhnlichen, eigenständigen Kausalverlauf dar, dass sich
      im Tod nicht mehr das vom Unfall ausgehende, sondern ein völlig neues Behandlungsrisiko
      realisiert.
  - prompt: Ergebnis?
    erwartung: Der Tod des B ist A objektiv nicht zurechenbar; A haftet nur für die
      durch den Unfall verursachte (fahrlässige) Körperverletzung, § 229 StGB, nicht
      für eine fahrlässige Tötung nach § 222 StGB.
  expectation:
    pruefpunkte:
    - id: p1
      label: Äquivalente Kausalität des A für den Tod bejaht (conditio-sine-qua-non)
      weight: 1.5
      required: false
      keywords:
      - hinweggedacht
      - kausal
    - id: p2
      label: Schaffung einer rechtlich missbilligten Gefahr durch den Verkehrsunfall
        bejaht
      weight: 1.5
      required: false
      norms:
      - § 222 StGB
      keywords:
      - missbilligte Gefahr
    - id: p3
      label: Atypischer Kausalverlauf durch die grob fehlerhafte Medikamentenverwechslung
        erkannt und begründet
      weight: 3.0
      required: true
      keywords:
      - atypisch
      - außergewöhnlich
      card_slugs:
      - sr-zurechnung-atypischer-kausalverlauf
    - id: p4
      label: 'Risikorealisierung verneint: es realisiert sich nicht das vom Unfall
        geschaffene, sondern ein eigenständiges Behandlungsrisiko'
      weight: 2.5
      required: true
      keywords:
      - Risikorealisierung
      - eigenständig
      card_slugs:
      - sr-zurechnung-schutzzweck-der-norm
    - id: p5
      label: Objektive Zurechnung des Todes zu A im Ergebnis verneint
      weight: 1.5
      required: true
      keywords:
      - nicht zurechenbar
      - verneint
      card_slugs:
      - sr-zurechnung-atypischer-kausalverlauf
    - id: p6
      label: Abgrenzung zur fahrlässigen Körperverletzung, § 229 StGB, als verbleibende
        Strafbarkeit angesprochen
      weight: 1.0
      required: false
      norms:
      - § 229 StGB
      keywords:
      - '229'
