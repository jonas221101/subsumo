faelle:
- slug: sr-fall-drohanruf-ueberweisung
  title: Der Drohanruf
  difficulty: 3
  minutes: 40
  quellen:
  - Eigener Sachverhalt der Redaktion
  - StGB, amtliche Fassung
  facts: A ruft den Geschäftsmann U an und droht ihm unmissverständlich, ihn zu
    töten, wenn er nicht binnen 24 Stunden 20.000 Euro auf ein von A genanntes Konto
    überweist. A macht deutlich, dass er die Adresse des U kennt und die Drohung
    ernst meint. Aus Angst um sein Leben überweist U den geforderten Betrag fristgerecht.
  question: Hat sich A wegen (räuberischer) Erpressung gemäß §§ 253, 255 StGB strafbar
    gemacht?
  steps:
  - prompt: Formuliere den Obersatz.
    erwartung: A könnte sich durch den Drohanruf wegen (räuberischer) Erpressung
      gemäß §§ 253, 255 StGB strafbar gemacht haben.
  - prompt: Liegt ein taugliches Nötigungsmittel vor?
    erwartung: Ja - die Todesdrohung ist eine Drohung mit einem empfindlichen Übel.
  - prompt: Liegt eine Vermögensverfügung des U vor?
    erwartung: Ja - U nimmt die Überweisung selbst vor; er verfügt eigenhändig
      über sein Vermögen, es liegt kein Wegnahmeakt eines Dritten vor.
  - prompt: Ist ein Vermögensnachteil eingetreten?
    erwartung: Ja - das Vermögen des U hat sich durch die Überweisung unmittelbar
      um 20.000 Euro verringert, ohne dass ein Ausgleich erfolgt.
  - prompt: Handelte A mit Bereicherungsabsicht, und ist diese stoffgleich?
    erwartung: Ja - A wollte sich um genau den Betrag bereichern, um den U geschädigt
      wird; Nachteil und erstrebter Vorteil beruhen auf demselben Vorgang.
  - prompt: Ist die Tat verwerflich i.S.d. § 253 Abs. 2 StGB?
    erwartung: Ja - die Androhung des Todes zur Erzwingung einer Geldzahlung ist offensichtlich
      verwerflich.
  - prompt: Liegt räuberische Erpressung, § 255 StGB, vor?
    erwartung: Ja - A droht mit gegenwärtiger Gefahr für das Leben des U selbst;
      A ist daher wie ein Räuber zu bestrafen.
