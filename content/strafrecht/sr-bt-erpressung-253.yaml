faelle:
- slug: sr-fall-drohanruf-ueberweisung
  title: Der Drohanruf
  difficulty: 3
  minutes: 40
  quellen:
  - Eigener Sachverhalt der Redaktion
  - StGB, amtliche Fassung
  facts: A ruft den Geschaeftsmann U an und droht ihm unmissverstaendlich, ihn zu
    toeten, wenn er nicht binnen 24 Stunden 20.000 Euro auf ein von A genanntes Konto
    ueberweist. A macht deutlich, dass er die Adresse des U kennt und die Drohung
    ernst meint. Aus Angst um sein Leben ueberweist U den geforderten Betrag fristgerecht.
  question: Hat sich A wegen (raeuberischer) Erpressung gemaess §§ 253, 255 StGB strafbar
    gemacht?
  steps:
  - prompt: Formuliere den Obersatz.
    erwartung: A koennte sich durch den Drohanruf wegen (raeuberischer) Erpressung
      gemaess §§ 253, 255 StGB strafbar gemacht haben.
  - prompt: Liegt ein taugliches Noetigungsmittel vor?
    erwartung: Ja - die Todesdrohung ist eine Drohung mit einem empfindlichen Uebel.
  - prompt: Liegt eine Vermoegensverfuegung des U vor?
    erwartung: Ja - U nimmt die Ueberweisung selbst vor; er verfuegt eigenhaendig
      ueber sein Vermoegen, es liegt kein Wegnahmeakt eines Dritten vor.
  - prompt: Ist ein Vermoegensnachteil eingetreten?
    erwartung: Ja - das Vermoegen des U hat sich durch die Ueberweisung unmittelbar
      um 20.000 Euro verringert, ohne dass ein Ausgleich erfolgt.
  - prompt: Handelte A mit Bereicherungsabsicht, und ist diese stoffgleich?
    erwartung: Ja - A wollte sich um genau den Betrag bereichern, um den U geschaedigt
      wird; Nachteil und erstrebter Vorteil beruhen auf demselben Vorgang.
  - prompt: Ist die Tat verwerflich i.S.d. § 253 Abs. 2 StGB?
    erwartung: Ja - die Androhung des Todes zur Erzwingung einer Geldzahlung ist offensichtlich
      verwerflich.
  - prompt: Liegt raeuberische Erpressung, § 255 StGB, vor?
    erwartung: Ja - A droht mit gegenwaertiger Gefahr fuer das Leben des U selbst;
      A ist daher wie ein Raeuber zu bestrafen.
  expectation:
    pruefpunkte:
    - id: p1
      label: Taugliches Noetigungsmittel (Drohung mit empfindlichem Uebel) bejaht
      weight: 1.0
      required: false
      norms:
      - § 253 Abs. 1 StGB
      keywords:
      - Drohung
      - empfindliches Uebel
    - id: p2
      label: Vermoegensverfuegung des U erkannt (eigene Ueberweisung statt Wegnahme)
      weight: 3.0
      required: true
      norms:
      - § 253 Abs. 1 StGB
      keywords:
      - Vermoegensverfuegung
      - ueberweist
    - id: p3
      label: Vermoegensnachteil bejaht
      weight: 1.0
      required: false
      keywords:
      - Vermoegensnachteil
    - id: p4
      label: Bereicherungsabsicht und Stoffgleichheit bejaht
      weight: 2.0
      required: true
      norms:
      - § 253 Abs. 1 StGB
      keywords:
      - Bereicherungsabsicht
      - stoffgleich
    - id: p5
      label: Verwerflichkeit gemaess § 253 Abs. 2 StGB bejaht
      weight: 1.0
      required: false
      norms:
      - § 253 Abs. 2 StGB
      keywords:
      - verwerflich
    - id: p6
      label: Raeuberische Erpressung, § 255 StGB, bejaht (Drohung mit gegenwaertiger
        Gefahr fuer das Leben)
      weight: 2.5
      required: true
      norms:
      - § 255 StGB
      keywords:
      - gegenwaertige Gefahr
      - Leben
