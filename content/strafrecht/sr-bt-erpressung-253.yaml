cards:
- slug: sr-erpressung-grundtatbestand
  type: definition
  front: 'Definiere: Erpressung, § 253 Abs. 1 StGB'
  back: Erpressung begeht, wer einen Menschen rechtswidrig mit Gewalt oder durch Drohung
    mit einem empfindlichen Übel zu einer Handlung, Duldung oder Unterlassung nötigt
    und dadurch dem Vermögen des Genötigten oder eines anderen Nachteil zufügt,
    um sich oder einen Dritten zu Unrecht zu bereichern. Die Erpressung ist damit
    das Vermögensdelikt-Gegenstück zur Nötigung, § 240 StGB, angereichert um Vermögensnachteil
    und Bereicherungsabsicht.
  norms:
  - § 253 Abs. 1 StGB
  quellen:
  - StGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sr-erpressung-vermoegensverfuegung-streitstand
  type: streitstand
  front: Setzt § 253 StGB eine (ungeschriebene) Vermögensverfügung des Genötigten
    voraus?
  back: 'Nach heute h.M. verlangt § 253 StGB - parallel zum Betrug - eine Vermögensverfügung
    des Genötigten: Er muss selbst, wenn auch genötigt, eine Handlung, Duldung oder
    Unterlassung vornehmen, die unmittelbar zu einer Vermögensminderung führt. Dieses
    ungeschriebene Tatbestandsmerkmal dient vor allem der Abgrenzung zu Diebstahl
    und Raub, bei denen der Täter die Sache selbst wegnimmt, während bei der Erpressung
    das Vermögensopfer selbst (wenn auch unter Zwang) über sein Vermögen disponiert.'
  norms:
  - § 253 Abs. 1 StGB
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sr-erpressung-vermoegensschaden
  type: definition
  front: Wie wird der Vermögensnachteil bei § 253 StGB ermittelt?
  back: Wie beim Betrug wird der Vermögensnachteil im Wege einer Gesamtsaldierung
    des Vermögens vor und nach der erzwungenen Verfügung bestimmt. Ein Nachteil
    liegt vor, wenn der Vergleich einen wirtschaftlichen Minderwert ergibt; ein gleichwertiger
    Ausgleich (etwa eine vollwertige Gegenleistung) schließt den Nachteil aus.
  norms:
  - § 253 Abs. 1 StGB
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sr-erpressung-stoffgleichheit
  type: definition
  front: Was bedeutet Stoffgleichheit der erstrebten Bereicherung bei § 253 StGB?
  back: 'Die vom Täter erstrebte Bereicherung muss stoffgleich mit dem beim Opfer
    eintretenden Vermögensnachteil sein: Beide müssen unmittelbar auf derselben
    Vermögensverschiebung beruhen, also zwei Seiten desselben Vorgangs sein. Erstrebt
    der Täter nur einen mittelbaren Vorteil ohne unmittelbaren Bezug zum Nachteil
    des Opfers, fehlt es an der Bereicherungsabsicht i.S.d. § 253 Abs. 1 StGB.'
  norms:
  - § 253 Abs. 1 StGB
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sr-erpressung-verwerflichkeit
  type: norm
  front: Welche Funktion hat § 253 Abs. 2 StGB?
  back: '§ 253 Abs. 2 StGB macht - parallel zu § 240 Abs. 2 StGB - die Rechtswidrigkeit
    der Erpressung von einer Zweck-Mittel-Relation abhängig: Die Tat ist nur dann
    rechtswidrig, wenn die Anwendung der Gewalt oder die Androhung des Übels zu dem
    angestrebten Bereicherungszweck als verwerflich anzusehen ist.'
  norms:
  - § 253 Abs. 2 StGB
  quellen:
  - StGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sr-erpressung-raeuberische-255
  type: norm
  front: Wann liegt räuberische Erpressung, § 255 StGB, vor und welche Rechtsfolge
    hat sie?
  back: Räuberische Erpressung liegt vor, wenn die Erpressung durch Gewalt gegen
    eine Person oder durch Drohung mit gegenwärtiger Gefahr für Leib oder Leben
    begangen wird. Rechtsfolge ist gemäß § 255 StGB, dass der Täter gleich einem
    Räuber - also nach dem Strafrahmen des § 249 StGB einschließlich der Qualifikationen
    §§ 250, 251 StGB - zu bestrafen ist.
  norms:
  - § 255 StGB
  - § 249 StGB
  quellen:
  - StGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sr-erpressung-abgrenzung-raub-249
  type: streitstand
  front: Wie grenzt sich die räuberische Erpressung von Raub, § 249 StGB, bei der
    Wegnahme beweglicher Sachen ab?
  back: 'Maßgeblich ist, wer die entscheidende Vermögensverschiebung vornimmt: Nimmt
    der Täter dem Opfer die Sache eigenhändig weg (bricht also fremden Gewahrsam
    und begründet neuen), liegt Raub vor. Übergibt das genötigte Opfer die Sache
    dagegen selbst - wenn auch unter dem Druck von Gewalt oder Drohung -, liegt eine
    eigene Vermögensverfügung und damit (räuberische) Erpressung vor. In den praktisch
    häufigen Grenzfällen, in denen beide Deutungen vertretbar erscheinen, ist nach
    der Rechtsprechung auf den erkennbaren äußeren Geschehensablauf und die Willensrichtung
    des Opfers abzustellen; Raub und räuberische Erpressung schließen sich bei ein-
    und demselben Gegenstand gegenseitig aus.'
  norms:
  - § 249 StGB
  - § 255 StGB
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
