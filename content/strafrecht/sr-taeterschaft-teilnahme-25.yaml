cards:
- slug: sr-taeterschaft-tatherrschaftslehre
  type: definition
  front: 'Definiere: Tatherrschaftslehre zur Abgrenzung von Täterschaft und Teilnahme'
  back: Nach der (heute h.M. zugrunde liegenden) Tatherrschaftslehre ist Täter, wer
    das Geschehen als Zentralgestalt final in den Händen hält, also den Ob und Wie
    der Tatbestandsverwirklichung steuert. Teilnehmer ist demgegenüber, wer den Tatentschluss
    eines anderen hervorruft (Anstiftung) oder dessen Tat lediglich fördert (Beihilfe),
    ohne selbst das Geschehen zu beherrschen.
  norms:
  - § 25 StGB
  - § 26 StGB
  - § 27 StGB
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sr-taeterschaft-unmittelbar
  type: norm
  front: 'Definiere: unmittelbare Täterschaft, § 25 Abs. 1 Var. 1 StGB'
  back: Unmittelbarer Täter ist, wer die Straftat selbst, also eigenhändig begeht
    (§ 25 Abs. 1 Var. 1 StGB). Er verwirklicht den objektiven und subjektiven Tatbestand
    vollständig in eigener Person und besitzt damit per se Tatherrschaft.
  norms:
  - § 25 Abs. 1 Var. 1 StGB
  quellen:
  - § 25 StGB, amtlicher Wortlaut
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sr-taeterschaft-mittelbar
  type: definition
  front: 'Definiere: mittelbare Täterschaft, § 25 Abs. 1 Var. 2 StGB'
  back: Mittelbarer Täter ist, wer die Straftat durch einen anderen begeht (§ 25
    Abs. 1 Var. 2 StGB), den er als menschliches Werkzeug für seine Zwecke einsetzt.
    Tatherrschaft besteht hier kraft überlegenen Wissens oder Willens gegenüber
    dem Vordermann, etwa weil dieser vorsatzlos, schuldlos, genötigt oder über die
    Tragweite seines Handelns getäuscht handelt und deshalb selbst nicht als Täter
    (Werkzeug) verantwortlich ist.
  norms:
  - § 25 Abs. 1 Var. 2 StGB
  quellen:
  - § 25 StGB, amtlicher Wortlaut
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sr-taeterschaft-mittaeterschaft
  type: definition
  front: 'Definiere: Mittäterschaft, § 25 Abs. 2 StGB'
  back: 'Mittäter ist, wer eine Straftat gemeinschaftlich mit einem anderen begeht
    (§ 25 Abs. 2 StGB). Voraussetzung sind (1) ein gemeinsamer Tatentschluss (Vorsatz
    bzgl. arbeitsteiligen Vorgehens) und (2) ein eigener Tatbeitrag, der nach der
    Tatherrschaftslehre funktionale Tatherrschaft begründet; meist wird dafür ein
    Beitrag von einigem Gewicht im Ausführungsstadium verlangt. Nach der Rspr. (wertende
    Gesamtbetrachtung von Tatinteresse, Umfang der Tatbeteiligung, Tatherrschaft oder
    Wille zur Tatherrschaft) kann auch ein Beitrag im Vorbereitungsstadium (Tatplaner,
    Bandenchef) Mittäterschaft begründen, wenn der Beteiligte die Tat wesentlich mitgestaltet
    und ein erhebliches Eigeninteresse hat. Eigenhändige Verwirklichung aller Tatbestandsmerkmale
    ist nicht erforderlich. Rechtsfolge ist die wechselseitige Zurechnung der Tatbeiträge:
    jeder Mittäter haftet für die Tat als Ganzes, soweit sie vom gemeinsamen Tatplan
    gedeckt ist.'
  norms:
  - § 25 Abs. 2 StGB
  quellen:
  - § 25 StGB, amtlicher Wortlaut
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sr-taeterschaft-anstiftung
  type: definition
  front: 'Definiere: Anstiftung, § 26 StGB'
  back: Anstifter ist, wer vorsätzlich einen anderen zu dessen vorsätzlich begangener
    rechtswidriger Tat bestimmt hat (§ 26 StGB). Erforderlich sind ein doppelter Anstiftervorsatz
    (bzgl. der Bestimmung des Täters zur Tat und bzgl. deren Vollendung) sowie ein
    kommunikativer Akt des Hervorrufens des Tatentschlusses beim zuvor noch nicht
    tatgeneigten Haupttäter (omnimodo facturus scheidet als Anstiftungsobjekt aus).
    Der Anstifter wird gemäß § 26 StGB gleich einem Täter bestraft.
  norms:
  - § 26 StGB
  quellen:
  - § 26 StGB, amtlicher Wortlaut
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sr-taeterschaft-beihilfe
  type: definition
  front: 'Definiere: Beihilfe, § 27 StGB'
  back: Gehilfe ist, wer vorsätzlich einem anderen zu dessen vorsätzlich begangener
    rechtswidriger Tat Hilfe geleistet hat (§ 27 Abs. 1 StGB). Die Hilfeleistung kann
    physisch (z. B. Bereitstellen von Mitteln) oder psychisch (Bestärkung des bereits
    gefassten Tatentschlusses) erfolgen und muss den Taterfolg lediglich fördern,
    nicht kausal für ihn sein. Erforderlich ist doppelter Gehilfenvorsatz. Die Strafe
    des Gehilfen richtet sich gemäß § 27 Abs. 2 StGB nach der Strafe des Täters,
    wird jedoch nach § 49 Abs. 1 StGB obligatorisch gemildert.
  norms:
  - § 27 StGB
  - § 49 Abs. 1 StGB
  quellen:
  - § 27 StGB, amtlicher Wortlaut
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sr-taeterschaft-akzessorietaet
  type: norm
  front: Was bedeutet limitierte Akzessorietät der Teilnahme?
  back: 'Anstiftung und Beihilfe setzen gemäß §§ 26, 27 StGB eine vorsätzlich begangene
    rechtswidrige Haupttat voraus (limitierte Akzessorietät): Tatbestandsmäßigkeit
    und Rechtswidrigkeit der Haupttat müssen vorliegen, eine schuldhafte Begehung
    durch den Haupttäter ist dagegen nicht erforderlich. Fehlt es bereits an einer
    vorsätzlichen rechtswidrigen Haupttat, scheidet eine Strafbarkeit wegen Teilnahme
    aus; in Betracht kommt dann allenfalls mittelbare Täterschaft.'
  norms:
  - § 26 StGB
  - § 27 StGB
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sr-taeterschaft-abgrenzung-mittaeterschaft-beihilfe
  type: streitstand
  front: 'Streitstand: Abgrenzung Mittäterschaft (§ 25 Abs. 2 StGB) und Beihilfe (§
    27 StGB)'
  back: |-
    Problem: Ob ein Tatbeteiligter, der die Tatbestandsmerkmale nicht eigenhändig verwirklicht, als Mittäter oder nur als Gehilfe haftet, entscheidet über die volle Zurechnung fremder Tatbeiträge (§ 25 Abs. 2 StGB) oder eine obligatorische Strafmilderung (§§ 27 Abs. 2, 49 Abs. 1 StGB).

    Subjektive Theorie (früher Rspr.): Maßgeblich ist der animus auctoris - will der Beteiligte die Tat als eigene (Täterwille), liegt Mittäterschaft vor; will er sie nur fremden Willen unterstützen (animus socii), ist er Gehilfe. Kritik: kaum justiziables, manipulationsanfälliges Kriterium ohne objektiven Anknüpfungspunkt.

    Tatherrschaftslehre (h.L.): Maßgeblich ist, ob der Beteiligte durch einen eigenen Beitrag von einigem Gewicht, typischerweise im Ausführungsstadium, funktionale Tatherrschaft über das Geschehen erlangt - er muss das Ob und Wie der Tatbestandsverwirklichung mitsteuern können. Ein Beitrag, der nur im Vorbereitungsstadium liegt (Roxin, enge Linie) oder nur fördert, ohne das Geschehen mitzubestimmen, begründet lediglich Beihilfe. Vorteil: objektiv nachprüfbares Kriterium.

    Rspr. (normativ-wertende Gesamtbetrachtung): Wertet Tatinteresse, Umfang der Tatbeteiligung und Tatherrschaft bzw. den Willen zu ihr in einer Gesamtwürdigung. Danach kann auch ein Beitrag im Vorbereitungsstadium Mittäterschaft begründen; ein Beitrag im Ausführungsstadium begründet sie nicht zwingend, wenn Eigeninteresse und Herrschaftswille fehlen.

    Beim Schmierestehen ist die Lit. gespalten: Teile sehen im Absichern der Tat funktionale Tatherrschaft (Mittäterschaft), andere nur Beihilfe, weil der Aufpasser das Ob und Wie nicht steuert. Die Rspr. entscheidet nach Tatinteresse (Beuteanteil, Planungsgleichrang).

    Konsequenz: In Klausuren sind beide Ansätze darzustellen, wenn sie zu unterschiedlichen Ergebnissen führen; der Streit ist offenzulegen.
  norms:
  - § 25 Abs. 2 StGB
  - § 27 StGB
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
schemata:
- slug: sr-schema-mittaeterschaft
  title: Prüfung der Mittäterschaft, § 25 Abs. 2 StGB
  norms:
  - § 25 Abs. 2 StGB
  - § 27 StGB
  quellen:
  - § 25 StGB, amtlicher Wortlaut
  - Eigenformulierung Redaktion
  stand: 2026-09
  steps:
  - label: I. Vorprüfung
    children:
    - label: 1. Keine Alleintäterschaft eines Beteiligten (dann kein Bedarf für §
        25 Abs. 2 StGB)
    - label: 2. Tatbestandsmäßige Haupttat (mindestens im Versuchsstadium)
  - label: II. Gemeinsamer Tatentschluss
    children:
    - label: 1. Bewusstes und gewolltes Zusammenwirken auf Grundlage eines gemeinsamen
        Tatplans
    - label: 2. Vorsatz bzgl. arbeitsteiliger Tatbegehung
  - label: III. Gemeinsame Tatbegehung (objektiver Tatbeitrag)
    children:
    - label: 1. Eigener Tatbeitrag von einigem Gewicht
    - label: 2. Beitrag jedenfalls auch im Ausführungsstadium (nach der Rspr. auch
        Vorbereitungsstadium bei Tatherrschaft/Tatinteresse)
    - label: '3. Funktionale Tatherrschaft: Mitbeherrschung von Ob und Wie der Tatbestandsverwirklichung'
  - label: IV. Zurechnung der Tatbeiträge, § 25 Abs. 2 StGB
    children:
    - label: 1. Wechselseitige Zurechnung, soweit vom gemeinsamen Tatplan gedeckt
    - label: 2. Exzess eines Mittäters wird den anderen nicht zugerechnet
  - label: V. Ergebnis
faelle:
- slug: sr-fall-schmiere-stehen
  title: Der Schmiere stehende Freund
  difficulty: 3
  minutes: 45
  quellen:
  - Eigener Sachverhalt der Redaktion
  - StGB, amtliche Fassung
  facts: A und B verabreden, gemeinsam in die leerstehende Ferienvilla des X einzubrechen
    und dort auffindbare Wertgegenstände zu entwenden. Nach dem gemeinsam gefassten
    Tatplan steigt A durch ein gekipptes Fenster in das Haus ein und packt Schmuck
    im Wert von 5.000 Euro in eine mitgebrachte Tasche, während B verabredungsgemäß
    vor dem Haus Schmiere steht und A per Handyzeichen warnen soll, falls sich jemand
    nähert. Während der gesamten Tatausführung erscheint niemand; A verlässt das Haus
    unbehelligt mit der Beute, B hat währenddessen ständig die Zufahrtsstraße im Blick.
    B hat den Einbruch gemeinsam mit A gleichberechtigt geplant und soll 40 % der
    Beute erhalten.
  question: Hat sich B als Mittäter strafbar gemacht (Diebstahl in Form des Wohnungseinbruchs,
    §§ 244 Abs. 1 Nr. 3, 25 Abs. 2 StGB) oder nur wegen Beihilfe, §§ 244 Abs. 1 Nr.
    3, 27 StGB? Gehe auf die Qualifikation kurz ein.
  steps:
  - prompt: Hat B selbst eine Wegnahmehandlung vorgenommen?
    erwartung: Nein - B hat die Sache nicht selbst weggenommen; eine Alleintäterschaft
      nach § 25 Abs. 1 Var. 1 StGB scheidet für B aus.
  - prompt: Liegt zwischen A und B ein gemeinsamer Tatentschluss vor?
    erwartung: Ja - A und B haben den Einbruch gemeinsam geplant und die Rollen (Einsteigen/Wegnehmen
      einerseits, Schmierestehen andererseits) einvernehmlich verteilt.
  - prompt: Ist das Schmierestehen ein Tatbeitrag von einigem Gewicht im Ausführungsstadium?
    erwartung: Ja - B erbringt seinen Beitrag während der eigentlichen Tatausführung
      und sichert die Tat unmittelbar ab; sein Beitrag ist für das ungestörte Gelingen
      des Diebstahls funktional bedeutsam.
  - prompt: Woran lässt sich die Abgrenzung zur Beihilfe festmachen? Wie entscheiden
      Tatherrschaftslehre und Rspr.?
    erwartung: 'Nach der Tatherrschaftslehre ist der Tatbeitrag im Ausführungsstadium
      und von Gewicht; das Absichern begründet bei laufender Tatausführung funktionale
      Tatherrschaft, nach strenger Sicht (Aufpasser steuert das Ob und Wie nicht)
      nur Beihilfe - die Lit. ist gespalten. Die Rspr. wertet das Tatinteresse (hier:
      Beuteanteil von 40 %, gleichrangige Planung, Eigeninteresse) und kommt ebenfalls
      zur Mittäterschaft. Mittäterschaft ist daher gut vertretbar; die Gegenansicht
      (Beihilfe) ist bei sauberer Argumentation ebenfalls vertretbar.'
  - prompt: Ergebnis?
    erwartung: B ist Mittäter des Diebstahls, §§ 242 Abs. 1, 25 Abs. 2 StGB; ihm wird
      die von A vorgenommene Wegnahme gemäß § 25 Abs. 2 StGB zugerechnet.
  - prompt: Welche Qualifikation ist verwirklicht?
    erwartung: 'A steigt durch das gekippte Fenster in die Ferienvilla ein: § 244
      Abs. 1 Nr. 3 StGB (Wohnungseinbruchdiebstahl); eine dauerhaft genutzte Privatwohnung
      im Sinne des Abs. 4 liegt bei der leerstehenden Ferienvilla nicht vor. Für B
      gilt dies über § 25 Abs. 2 StGB (bzw. bei Beihilfe über § 27 StGB).'
  expectation:
    pruefpunkte:
    - id: p1
      label: Obersatz mit §§ 244 Abs. 1 Nr. 3 (bzw. § 242 Abs. 1), 25 Abs. 2 StGB
      weight: 1.0
      required: false
      norms:
      - § 242 Abs. 1 StGB
      - § 25 Abs. 2 StGB
      keywords:
      - § 25 Abs. 2
      - §§ 242 Abs. 1, 25 Abs. 2
      - §§ 244 Abs. 1 Nr. 3, 25 Abs. 2
    - id: p2
      label: Eigene Alleintäterschaft des B verneint, da keine eigene Wegnahmehandlung
      weight: 1.0
      required: false
      keywords:
      - keine eigene Wegnahme
      - Alleintäterschaft scheidet aus
      - keine unmittelbare Täterschaft
      - Alleintäterschaft
