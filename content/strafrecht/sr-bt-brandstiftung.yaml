- slug: sr-schema-brand-306ff
  title: Schwere Brandstiftung, § 306a Abs. 1 Nr. 1 StGB, und einfache Brandstiftung, § 306 Abs. 1 StGB
  norms:
  - § 306 Abs. 1 StGB
  - § 306a Abs. 1 Nr. 1 StGB
  quellen:
  - StGB, amtliche Fassung
  - Eigenformulierung Redaktion
  steps:
  - label: I. Einfache Brandstiftung, § 306 Abs. 1 StGB
    children:
    - label: 1. Objektiver Tatbestand
      children:
      - label: a) Tatobjekt aus Nr. 1 bis 6 (z. B. Gebäude)
      - label: b) Fremdheit des Objekts
        hinweis: Eigentum zumindest auch eines anderen; Alleineigentum des Täters
          schließt § 306 aus, nicht aber § 306a.
      - label: c) Tathandlung - in Brand setzen oder durch Brandlegung ganz oder teilweise zerstören
        hinweis: Selbstständiges Weiterbrennen wesentlicher Bestandteile bzw. Unbrauchbarkeit
          eines Teils von einigem Gewicht.
    - label: 2. Subjektiver Tatbestand (Vorsatz)
    - label: 3. Rechtswidrigkeit und Schuld
  - label: II. Schwere Brandstiftung, § 306a Abs. 1 Nr. 1 StGB
    children:
    - label: 1. Objektiver Tatbestand
      children:
      - label: a) Tatobjekt - Gebäude oder Räumlichkeit, die der Wohnung von Menschen dient
        hinweis: Tatsächliche Wohnnutzung, Entwidmung prüfen; bei gemischt genutzten
          Gebäuden betrifft die Tathandlung den Wohnbereich?
      - label: b) Tathandlung wie bei § 306 Abs. 1 StGB
    - label: 2. Subjektiver Tatbestand (Vorsatz bezüglich Wohnnutzung und Tathandlung)
    - label: 3. Teleologische Reduktion bei ausgeschlossener Fremdgefährdung
      hinweis: Nur erörtern, wenn der Sachverhalt eine Gefährdung Dritter ersichtlich
        ausschließt.
    - label: 4. Rechtswidrigkeit und Schuld
  - label: III. Qualifikationen und Erfolgsqualifikation, §§ 306b, 306c StGB
    hinweis: Schwere Gesundheitsschädigung, Lebensgefahr, Verdeckungsabsicht, Todesfolge
      (wenigstens leichtfertig, § 18 StGB).
  - label: IV. Tätige Reue, § 306e StGB
    hinweis: Freiwilliges Löschen vor erheblichem Schaden; Rücktritt nach § 24 StGB
      nach Vollendung ausgeschlossen.
faelle:
- slug: sr-fall-brand-nachbarhaus
  title: Das Feuer am Nachbarhaus
  difficulty: 3
  minutes: 45
  quellen:
  - Eigener Sachverhalt der Redaktion
  - StGB, amtliche Fassung
  facts: >-
    Nach einem Streit um eine Grundstücksgrenze will B seinem Nachbarn N "einen
    Denkzettel verpassen". Er weiß, dass N, dessen Ehefrau und die Kinder das
    freistehende Einfamilienhaus des N bewohnen und nachts dort schlafen. Gegen
    ein Uhr nachts schüttet B Benzin auf die hölzerne Eingangstür und zündet sie an.
    Die Tür und die dahinterliegende Holzverkleidung des Hausflurs, auf die das Feuer
    durchschlägt, brennen weiter, auch nachdem das Benzin verbraucht ist. N wird vom
    Rauchmelder geweckt, löscht das Feuer mit einem Feuerlöscher, bevor es auf weitere
    Räume übergreift, und bringt seine Familie ins Freie. Verletzt wird niemand.
  question: Hat sich B wegen Brandstiftung nach den §§ 306, 306a StGB strafbar gemacht?
    Delikte der Körperverletzung und Tötung sind nicht zu prüfen.
  steps:
  - prompt: Liegt ein taugliches Tatobjekt des § 306 Abs. 1 StGB vor und ist es fremd?
    erwartung: Ja, das Einfamilienhaus ist ein Gebäude im Sinne des § 306 Abs.
      1 Nr. 1 StGB und steht im Eigentum des N, ist für B also fremd.
  - prompt: Hat B das Gebäude in Brand gesetzt?
    erwartung: Ja. Die Eingangstür und die Holzverkleidung des Hausflurs als für den
      Gebrauch wesentliche Gebäudebestandteile brannten selbstständig weiter, auch
      ohne fortwirkenden Zündstoff (Gebäude in Brand gesetzt). Auf die spätere Löschung durch N kommt es für die Vollendung nicht an.
  - prompt: Ist auch § 306a Abs. 1 Nr. 1 StGB erfüllt?
    erwartung: Ja. Das Haus dient der Wohnung von Menschen (§ 306a Abs. 1 Nr. 1 StGB). Die Familie N wohnt dort tatsächlich (tatsächliche Wohnnutzung). Die Brandlegung
      betrifft den Wohnbereich selbst (Eingang, Hausflur). Für eine teleologische
      Reduktion ist kein Raum (keine teleologische Reduktion), weil eine Gefährdung
      von Menschen im Haus besteht; das abstrakte Gefährdungsdelikt ist erfüllt. B wusste
      von der Anwesenheit der Familie und handelte vorsätzlich (Vorsatz bezüglich der
      Wohnnutzung und der Tathandlung).
  - prompt: Kommen die Qualifikationen der §§ 306b, 306c StGB in Betracht?
    erwartung: Nein. Es ist niemand verletzt oder gestorben, eine schwere Gesundheitsschädigung
      oder der Tod eines Menschen wurde nicht verursacht (§ 306b Abs. 1, § 306c StGB).
      Auch eine Lebensgefahr im Sinne des § 306b Abs. 2 Nr. 1 StGB wird nicht
      festgestellt. Die tätige Reue (§ 306e StGB) greift für B nicht, weil er das
      Feuer nicht löschte.
