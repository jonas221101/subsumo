  steps:
  - label: I. Tatbestand
    children:
    - label: 1. Grunddelikt - vorsätzliche Körperverletzung nach §§ 223 bis 226a StGB (vollendet oder versucht)
    - label: 2. Eintritt der schweren Folge (Tod bzw. Folge des § 226 Abs. 1 StGB)
    - label: 3. Kausalität zwischen Körperverletzung und schwerer Folge
    - label: 4. Tatbestandsspezifischer Gefahrzusammenhang (Unmittelbarkeitszusammenhang)
      children:
      - label: a) Anknüpfung an Erfolg oder Handlung (Letalitätslehre gegen h.M.)
      - label: b) Kein Ausschluss durch eigenverantwortliche Selbstgefährdung oder atypisches Dazwischentreten
    - label: 5. Wenigstens Fahrlässigkeit hinsichtlich der Folge, § 18 StGB - objektive Vorhersehbarkeit
      hinweis: Bei § 226 Abs. 2 StGB stattdessen Absicht oder Wissentlichkeit.
  - label: II. Rechtswidrigkeit
  - label: III. Schuld
    children:
    - label: 1. Allgemeine Schuldvoraussetzungen
    - label: 2. Subjektive Vorhersehbarkeit der schweren Folge
  - label: IV. Abgrenzung zum vorsätzlichen Tötungsdelikt
    hinweis: Bei Tötungsvorsatz §§ 212, 211 StGB vorrangig.
  - label: V. Konkurrenzen
    children:
    - label: 1. § 223 StGB und § 222 StGB verdrängt
    - label: 2. Tateinheit mit § 224 StGB (h.M.)
faelle:
- slug: sr-fall-flucht-im-treppenhaus
  title: Die Flucht im Treppenhaus
  difficulty: 4
  minutes: 60
  quellen:
  - Eigener Sachverhalt der Redaktion
  - StGB, amtliche Fassung
  stand: 2026-09
  facts: >-
    A stellt den B im dritten Stock eines Mietshauses zur Rede, weil B ihm Geld
    schuldet. Als B ausweichend antwortet, schlägt A ihm mehrfach mit der Faust ins
    Gesicht und ruft, er werde ihn "fertigmachen". B, der aus Nase und Lippe blutet,
    reißt sich los und rennt in Panik die Treppe hinunter, um A zu entkommen. A
    setzt ihm nach. Auf der Treppe zwischen erstem Stock und Erdgeschoss stolpert B,
    stürzt kopfüber die Stufen hinab und schlägt mit dem Kopf auf dem Steinboden auf.
    B stirbt noch am Unfallort an den Kopfverletzungen. A wollte B nicht töten und
    hatte an einen tödlichen Ausgang nicht gedacht.
  question: Hat sich A wegen Körperverletzung mit Todesfolge nach § 227 Abs. 1 StGB strafbar gemacht?
  steps:
  - prompt: Liegt eine vorsätzliche Körperverletzung als Grunddelikt vor?
    erwartung: >-
      Ja - die Faustschläge ins Gesicht mit blutender Nase und Lippe sind eine
      vollendete vorsätzliche Körperverletzung nach § 223 Abs. 1 StGB (körperliche
      Misshandlung und Gesundheitsschädigung).
  - prompt: Ist der Tod des B durch die Körperverletzung verursacht?
    erwartung: >-
      Ja - ohne die Schläge und die Verfolgung wäre B nicht in Panik die Treppe
      hinuntergerannt und nicht gestürzt. Die Körperverletzung ist nicht
      hinwegzudenken, ohne dass der Tod entfiele.
  - prompt: Besteht der tatbestandsspezifische Gefahrzusammenhang zwischen Körperverletzung und Tod?
    erwartung: >-
      Streitig. Nach der Letalitätslehre müsste der Tod aus dem Verletzungserfolg
      folgen; die Nasen- und Lippenverletzung war aber nicht tödlich, sodass § 227 StGB
      ausschiede. Nach Rspr. und h.M. genügt, dass sich die der Körperverletzungshandlung
      anhaftende Gefahr im Tod verwirklicht. Die panische Flucht vor einem
      Angreifer, der weiter zuschlägt und nachsetzt, ist die naheliegende Reaktion
      auf die Gewalt; der Sturz im Treppenhaus ist die Verwirklichung genau dieser
      Gefahr. Eine eigenverantwortliche Selbstgefährdung des B liegt nicht vor, weil
      B unter dem unmittelbaren Druck des Angriffs handelte. Der h.M. ist zu folgen;
      der Zusammenhang ist gegeben.
  - prompt: Handelte A hinsichtlich des Todes wenigstens fahrlässig, § 18 StGB?
    erwartung: >-
      Ja - dass ein blutendes, in Panik versetztes Opfer bei der Flucht über eine
      Treppe stürzt und sich tödlich verletzt, liegt nicht außerhalb der
      Lebenserfahrung. Der Tod war für einen besonnenen Menschen in der Lage des A
      objektiv vorhersehbar; A selbst hätte ihn vorhersehen können. Dass er nicht
      daran dachte, ist gerade der Fahrlässigkeitsvorwurf.
  - prompt: Ist § 227 StGB durch ein vorsätzliches Tötungsdelikt verdrängt?
    erwartung: >-
      Nein - A hatte keinen Tötungsvorsatz; §§ 212, 211 StGB scheiden aus. § 227 StGB
      bleibt anwendbar.
  - prompt: Wie lautet das Ergebnis, und wie ist das Konkurrenzverhältnis?
    erwartung: >-
      A hat sich nach § 227 Abs. 1 StGB strafbar gemacht. § 223 StGB und § 222 StGB
      treten dahinter zurück; die Bedrohung durch den Ausruf ist als mitbestrafte
      Begleittat ohne eigenständiges Gewicht.
  expectation:
