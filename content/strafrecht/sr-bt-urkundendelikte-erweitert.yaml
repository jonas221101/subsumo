faelle:
- slug: sr-fall-urk2-schuldschein
  title: Der zerrissene Schuldschein
  difficulty: 3
  minutes: 35
  quellen:
  - Eigener Sachverhalt der Redaktion
  - StGB, amtliche Fassung
  facts: >-
    S schuldet der G 5.000 Euro aus einem Darlehen, das G ihm gegen Aushändigung einer von
    S unterzeichneten Schuldschein-Urkunde gewährt hat. Die Urkunde verwahrt G in ihrer Wohnung.
    Bei einem Besuch nutzt S einen unbeobachteten Moment, nimmt den Schuldschein aus G's Schreibtisch,
    zerreißt ihn und verbrennt die Stücke im Ofen seiner Wohnung. S will verhindern, dass
    G die Darlehensforderung beweisen kann; sonstige Beweismittel hat G nicht. G stellt Strafanzeige.
  question: >-
    Hat sich S nach § 274 Abs. 1 Nr. 1 StGB strafbar gemacht?
  steps:
  - prompt: Ist der Schuldschein eine taugliche Urkunde?
    erwartung: >-
      Ja - er verkörpert eine Gedankenerklärung (Schuldanerkenntnis), ist zum Beweis der Darlehensforderung
      bestimmt und lässt S als Aussteller erkennen (Perpetuierungs-, Beweis-, Garantiefunktion).
  - prompt: >-
      Gehört die Urkunde dem S "nicht oder nicht ausschließlich"?
    erwartung: >-
      Ja - die Urkunde steht im Eigentum der G, und G hat auch das Beweisführungsrecht, weil
      sie die Darlehensforderung damit beweisen will. Auf den Streit um Eigentum oder Beweisführungsrecht
      kommt es nicht an, weil beide Ansichten zu G führen; für S ist die Urkunde fremd.
  - prompt: Welche Tathandlung liegt vor?
    erwartung: >-
      S hat die Urkunde durch Zerreißen und Verbrennen vernichtet.
  - prompt: >-
      Handelte S vorsätzlich und mit Nachteilszufügungsabsicht?
    erwartung: >-
      Ja - S wusste, dass die Urkunde der G gehört, und wollte ihr das Beweismittel entziehen,
      um die Beweisführung für die Forderung zu vereiteln (Nachteil im Sinne der Beeinträchtigung
      des Beweisführungsrechts).
  - prompt: Liegt ein Urkundendelikt nach § 267 StGB vor?
    erwartung: >-
      Nein - S hat keine Urkunde hergestellt oder verfälscht und nicht gebraucht, sondern
      vernichtet. § 267 StGB schützt die Echtheit, § 274 StGB das Beweisführungsrecht.
  - prompt: Ergebnis?
    erwartung: >-
      S ist wegen Urkundenunterdrückung nach § 274 Abs. 1 Nr. 1 StGB strafbar. Daneben kommen
      Delikte gegen das Eigentum der G in Betracht (§ 303 StGB), die hier nicht zu prüfen
      sind.
