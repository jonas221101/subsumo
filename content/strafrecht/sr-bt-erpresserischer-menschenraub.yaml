cards:
- slug: sr-emr-239a-tatbestand
  type: norm
  front: >-
    Wie lautet der Tatbestand des erpresserischen Menschenraubs, § 239a Abs. 1 StGB?
  back: >-
    § 239a Abs. 1 StGB bestraft, wer einen Menschen entführt oder sich eines Menschen bemächtigt,
    um die Sorge des Opfers um sein Wohl oder die Sorge eines Dritten um das Wohl des Opfers
    zu einer Erpressung (§ 253 StGB) auszunutzen (1. Alt.), oder wer die von ihm durch eine
    solche Handlung geschaffene Lage eines anderen zu einer solchen Erpressung ausnutzt (2. Alt.). Die Mindeststrafe beträgt fünf Jahre Freiheitsstrafe.
    Abs. 2 sieht für minder schwere Fälle Freiheitsstrafe nicht unter einem Jahr vor (ohne gesetzliche Obergrenze, also bis zum allgemeinen Höchstmaß von 15 Jahren, § 38 Abs. 2 StGB).
    Abs. 3 regelt die Todesfolge bei Leichtfertigkeit (lebenslange Freiheitsstrafe oder Freiheitsstrafe
    nicht unter zehn Jahren). Abs. 4 enthält eine Milderungsmöglichkeit, wenn der Täter das
    Opfer unter Verzicht auf die erstrebte Leistung in seinen Lebenskreis zurückgelangen lässt.
    Das Delikt ist ein Verbrechen.
  norms:
  - § 239a Abs. 1 StGB
  - § 239a Abs. 2 StGB
  - § 239a Abs. 3 StGB
  - § 239a Abs. 4 StGB
  - § 253 StGB
  quellen:
  - StGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-10
- slug: sr-emr-entfuehren-bemaechtigen
  type: definition
  front: >-
    Definiere: Entführen und Sich-Bemächtigen, §§ 239a, 239b StGB
  back: >-
    Entführen ist das Verbringen des Opfers an einen anderen Ort unter Einsatz von Gewalt,
    Drohung oder List, sodass es dort der Herrschaft des Täters ausgeliefert ist. Sich-Bemächtigen
    ist die Erlangung physischer Herrschaft über das Opfer in einer Weise, dass der Täter
    die Möglichkeit hat, auf das Opfer einzuwirken, ohne dass das Opfer dem entgehen kann.
    Beide Tatbestandsvarianten setzen die Erlangung eines Herrschaftsverhältnisses voraus,
    das die Basis für die geplante Erpressung bzw. Nötigung bildet. Ob das Opfer an einen
    anderen Ort verbracht wird, ist beim Sich-Bemächtigen unerheblich; auch ein Festhalten
    am Aufenthaltsort kann genügen. Die Zeit der Herrschaft muss nach der Rspr. eine gewisse
    Dauer erreichen (stabile Bemächtigungslage).
  norms:
  - § 239a Abs. 1 StGB
  - § 239b Abs. 1 StGB
  quellen:
  - StGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-10
- slug: sr-emr-sorge-dritter
  type: definition
  front: >-
    Welche Absicht verlangt § 239a Abs. 1 StGB und wer ist "Dritter"?
  back: >-
    Der Täter muss die Absicht haben, die Sorge des Opfers um sein eigenes Wohl oder die Sorge
    eines Dritten um das Wohl des Opfers zu einer Erpressung auszunutzen. Ausgenutzt wird die
    Sorge, wenn der Täter erwartet, dass der Sorgende aus Angst um das Wohlergehen des Opfers
    der Forderung nachkommt. Dritter ist jede vom Opfer verschiedene Person, die die Sorge um
    das Opfer hat, z. B. Angehörige oder Freunde des Opfers (Drei-Personen-Verhältnis). Die Absicht (zielgerichtetes Wollen) ist überschießende
    Innentendenz. Die Erpressung muss nicht stattfinden; § 239a StGB ist ein kupiertes Erfolgsdelikt,
    vollendet mit der Entführung oder Bemächtigung. Die beabsichtigte Erpressung muss die
    Voraussetzungen des § 253 StGB erfüllen (Vermögensvorteil, Bereicherungsabsicht).
  norms:
  - § 239a Abs. 1 StGB
  - § 253 StGB
  quellen:
  - StGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-10
- slug: sr-emr-zweipersonen-streit
  type: streitstand
  front: >-
    Streitstand: Wie weit reicht § 239a StGB im Zwei-Personen-Verhältnis (Restriktion des Tatbestands)?
  back: >-
    Beim Zwei-Personen-Verhältnis ist das Opfer zugleich Adressat der Erpressung: Der Täter
    bemächtigt sich des Opfers und fordert von ihm selbst Geld, ohne dass ein Dritter besorgt
    ist. Der Wortlaut erfasst auch die Sorge des Opfers um sein eigenes Wohl, deckt also diese
    Konstellation. Wegen der hohen Mindeststrafe von fünf Jahren und der Abgrenzung zu Raub und
    räuberischer Erpressung ist der Tatbestand aber nach der Rspr. des BGH teleologisch zu
    beschränken: Es muss eine stabile Bemächtigungslage mit einer gewissen Dauer geschaffen
    worden sein, in der die Bemächtigung eine eigenständige Bedeutung gegenüber dem beabsichtigten
    Raub oder der Erpressung hat und das Opfer der Einwirkung des Täters ausgeliefert ist. Teile
    der Lit. halten diese Restriktion für nicht weitgehend genug und fordern stärkere
    Einschränkungen, etwa im Hinblick auf das Verhältnis der Bemächtigung zur Nötigungshandlung.
  norms:
  - § 239a Abs. 1 StGB
  quellen:
  - StGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-10
- slug: sr-emr-stabile-lage
  type: definition
  front: >-
    Was bedeutet "stabile Bemächtigungslage" und wann liegt die Ausnutzungsvariante vor?
  back: >-
    Eine Bemächtigungslage ist stabil, wenn der Täter durch die Bemächtigung eine Situation
    geschaffen hat, die zeitlich und sachlich über das unmittelbare Raubgeschehen hinausgeht
    und in der das Opfer der Herrschaft des Täters nicht ohne Weiteres entkommen kann. Die
    bloße kurzfristige Gewaltanwendung, die zur Raubwegnahme dient, genügt nicht. Die zweite
    Alternative (Ausnutzung der geschaffenen Lage) erfasst Täter, die die Lage ursprünglich
    zu anderen Zwecken geschaffen haben (z. B. eine Geiselnahme auf der Flucht) und sie nachträglich
    zur Erpressung nutzen. Der Täter muss sich der Lage bewusst sein und sie ausnutzen wollen;
    der Entschluss zur Erpressung kann erst später gefasst werden.
  norms:
  - § 239a Abs. 1 StGB
  quellen:
  - StGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-10
- slug: sr-emr-239b-tatbestand
  type: norm
  front: >-
    Wie lautet der Tatbestand der Geiselnahme, § 239b Abs. 1 StGB?
  back: >-
    § 239b Abs. 1 StGB bestraft, wer einen Menschen entführt oder sich eines Menschen bemächtigt,
    um ihn oder einen Dritten durch Drohung mit dem Tod oder einer schweren Körperverletzung
    (§ 226 StGB) des Opfers oder mit dessen Freiheitsentziehung von über einer Woche Dauer
    zu einer Handlung, Duldung oder Unterlassung zu nötigen. Alternativ macht sich strafbar,
    wer die von ihm durch eine solche Handlung geschaffene Lage zu einer solchen Nötigung
    ausnutzt. Die Mindeststrafe beträgt fünf Jahre Freiheitsstrafe. § 239b Abs. 2 StGB verweist
    für minder schwere Fälle, Todesfolge und tätige Reue auf § 239a Abs. 2 bis 4 StGB. Die
    Geiselnahme ist nicht auf Vermögensziele beschränkt, sondern erfasst Nötigungsziele aller
    Art.
  norms:
  - § 239b Abs. 1 StGB
  - § 239b Abs. 2 StGB
  - § 226 StGB
  - § 240 StGB
  quellen:
  - StGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-10
- slug: sr-emr-abgrenzung-239a-239b
  type: definition
  front: >-
    Wie unterscheiden sich § 239a und § 239b StGB und wie sind sie von Freiheitsberaubung
    und Raub abzugrenzen?
  back: >-
    § 239a StGB setzt die Absicht einer Erpressung (§ 253 StGB) voraus, also die Absicht,
    sich oder einen Dritten durch Vermögensschädigung zu bereichern. § 239b StGB verlangt
    eine Nötigung zu einer beliebigen Handlung, Duldung oder Unterlassung durch Drohung mit
    dem Tod, schwerer Körperverletzung oder längerer Freiheitsentziehung. Die Freiheitsberaubung
    (§ 239 StGB, eigenes Thema) ist Grundlage beider Tatbestände, ob sie bei Verwirklichung von
    § 239a oder § 239b StGB zurücktritt oder in Tateinheit (§ 52 StGB) steht, wird nicht einheitlich
    beantwortet; in der Klausur ist die gewählte Lösung kurz zu begründen. Zum Raub (§ 249 StGB): Bei bloßer Gewaltanwendung zur Wegnahme liegt
    Raub vor; erst die stabile Bemächtigungslage mit Erpressungsabsicht führt zu § 239a StGB.
  norms:
  - § 239a StGB
  - § 239b StGB
  - § 239 StGB
  - § 249 StGB
  quellen:
  - StGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-10
- slug: sr-emr-versuch-vollendung-konkurrenzen
  type: definition
  front: >-
    Wann ist die Tat nach §§ 239a, 239b StGB vollendet und welche Konkurrenzen sind zu beachten?
  back: >-
    Beide Delikte sind kupierte Erfolgsdelikte: Sie sind mit dem Entführen oder Sich-Bemächtigen
    in der vom Gesetz verlangten Absicht vollendet; der Eintritt des erstrebten Erfolgs (Zahlung,
    Erfüllung der Forderung) ist nicht erforderlich. Der Versuch ist strafbar, § 23 Abs. 1
    StGB, und beginnt, wenn der Täter unmittelbar zur Entführung oder zum Bemächtigen ansetzt.
    Kommt es zur Erpressung, kann Tateinheit mit §§ 253, 255 StGB bestehen; auch Tateinheit
    mit Nötigung (§ 240 StGB) oder Körperverletzungsdelikten kommt in Betracht. Nach § 239a
    Abs. 4 StGB (auch für § 239b) kann das Gericht die Strafe mildern, wenn der Täter das
    Opfer unter Verzicht auf die erstrebte Leistung in seinen Lebenskreis zurückgelangen lässt.
  norms:
  - § 239a StGB
  - § 239b StGB
  - § 23 Abs. 1 StGB
  - § 52 StGB
  quellen:
  - StGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-10
schemata:
- slug: sr-schema-239a
  title: >-
    Erpresserischer Menschenraub und Geiselnahme, §§ 239a, 239b StGB
  quellen:
  - StGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-10
  norms:
  - § 239a Abs. 1 StGB
  - § 239b Abs. 1 StGB
  steps:
  - label: >-
      I. Tatbestand (§ 239a Abs. 1 StGB; § 239b parallel)
    children:
    - label: 1. Objektiver Tatbestand
      children:
      - label: >-
          a) 1. Alt.: Entführen oder Sich-Bemächtigen eines Menschen
        hinweis: >-
          Zeitliche und sachliche Stabilität der Bemächtigungslage prüfen; bei bloß kurzfristiger
          Gewalt Raub.
      - label: >-
          b) 2. Alt.: Ausnutzen der durch eine solche Handlung geschaffenen Lage
    - label: 2. Subjektiver Tatbestand
      children:
      - label: a) Vorsatz
      - label: >-
          b) Absicht, die Sorge eines Dritten um das Wohl des Opfers zu einer Erpressung auszunutzen
          (§ 239a) bzw. durch Drohung mit Tod, schwerer Körperverletzung oder Freiheitsentziehung
          über eine Woche zu nötigen (§ 239b)
        hinweis: >-
          Zwei-Personen-Verhältnis: vom Wortlaut erfasst (Sorge des Opfers um sein Wohl); Restriktion
          durch das Erfordernis einer stabilen Bemächtigungslage.
  - label: II. Rechtswidrigkeit
  - label: III. Schuld
  - label: 'IV. Strafzumessung: § 239a Abs. 2 bis 4 StGB'
    hinweis: >-
      Minder schwerer Fall; Todesfolge leichtfertig; tätige Reue durch Zurückgelangenlassen.
  - label: V. Konkurrenzen
    hinweis: >-
      Mit §§ 253, 255, 240, 239 und Körperverletzungsdelikten abgleichen.
faelle:
- slug: sr-fall-emr-schulweg-entfuehrung
  title: Die entführte Tochter
  difficulty: 3
  minutes: 40
  quellen:
  - Eigener Sachverhalt der Redaktion
  - StGB, amtliche Fassung
  facts: >-
    A und B wollen von dem wohlhabenden Unternehmer U Lösegeld erpressen. Sie passen dessen
    zehnjährige Tochter T auf dem Schulweg ab, zerren sie in einen Lieferwagen und bringen
    sie in eine abgelegene Hütte. Dort schließen sie T ein. A ruft anschließend U an und verlangt
    100.000 Euro; andernfalls werde T "nicht mehr nach Hause kommen". U informiert die Polizei.
    Bevor es zur Übergabe kommt, wird T am nächsten Morgen von der Polizei befreit.
  question: >-
    Haben sich A und B wegen erpresserischen Menschenraubs nach § 239a StGB strafbar gemacht?
  steps:
  - prompt: >-
      Haben A und B sich eines Menschen bemächtigt oder ihn entführt?
    erwartung: >-
      Ja - sie haben T durch Gewalt in den Lieferwagen gebracht und an einen anderen Ort verschleppt
      (Entführen) und dort eingeschlossen, sodass sie jederzeit auf T einwirken konnten (Sich-Bemächtigen).
      Die Lage war über das bloße Einwirken hinaus stabil und von gewisser Dauer.
  - prompt: >-
      Handelten sie, um die Sorge eines Dritten um das Wohl des Opfers zu einer Erpressung
      auszunutzen?
    erwartung: >-
      Ja - sie wollten die Sorge des U um das Leben seiner Tochter ausnutzen, um von U 100.000
      Euro zu erlangen. Die beabsichtigte Erpressung nach § 253 StGB (Nötigung mit einem empfindlichen
      Übel, Vermögensnachteil, Bereicherungsabsicht) ist erfüllt. U ist Dritter (nicht Opfer).
  - prompt: Ist es auf die Zahlung angekommen?
    erwartung: >-
      Nein - § 239a StGB ist ein kupiertes Erfolgsdelikt und mit der Bemächtigung in der Absicht
      vollendet. Die Befreiung durch die Polizei und das Ausbleiben der Zahlung ändern nichts.
  - prompt: Wie sind die Beiträge von A und B zuzurechnen?
    erwartung: >-
      Beide haben die Tat gemeinsam nach gemeinsamem Tatplan und arbeitsteilig begangen und
      sind Mittäter, § 25 Abs. 2 StGB.
  - prompt: Ergebnis?
    erwartung: >-
      A und B sind wegen erpresserischen Menschenraubs nach § 239a Abs. 1 StGB in Mittäterschaft
      strafbar.
