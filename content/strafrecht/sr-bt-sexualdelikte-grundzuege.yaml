- slug: sr-sexual-schema-177
  title: "Sexueller Übergriff, § 177 Abs. 1 und 2 StGB"
  norms:
  - "§ 177 Abs. 1 StGB"
  - "§ 177 Abs. 2 StGB"
  quellen:
  - "Eigenformulierung Redaktion"
  stand: 2026-10
  steps:
  - label: "I. Tatbestand"
    children:
    - label: "1. Objektiver Tatbestand"
      children:
      - label: "a) Sexuelle Handlung, § 184h StGB (Sexualbezug und Erheblichkeit)"
        hinweis: >-
          Erheblichkeitsschwelle prüfen; sonst § 184i StGB.
      - label: "b) Abs. 1: gegen den erkennbaren Willen der anderen Person"
        hinweis: >-
          Wille im Zeitpunkt der Handlung, objektiver Empfängerhorizont.
      - label: "c) Alternativ Abs. 2 Nr. 1 bis 5: Ausnutzen von Willensunfähigkeit, erheblicher Willenseinschränkung, Überraschungsmoment oder Zwangslage; Nötigung durch Drohung"
        hinweis: >-
          Bei Nr. 1 und 2 auf Kenntnis und Ausnutzen achten.
    - label: "2. Subjektiver Tatbestand: Vorsatz, insbesondere bezüglich des entgegenstehenden Willens"
      hinweis: >-
        Tatbestandsirrtum nach § 16 Abs. 1 StGB, wenn der Täter Einverständnis
        annimmt.
  - label: "II. Rechtswidrigkeit"
  - label: "III. Schuld"
  - label: "IV. Qualifikationen und Regelbeispiele, § 177 Abs. 4 bis 9 StGB"
    hinweis: >-
      Nur bei Anlass: Gewalt, Drohung, schutzlose Lage (Abs. 5); Regelbeispiele
      Abs. 6.
  - label: "V. Konkurrenzen"
    hinweis: >-
      § 184i StGB tritt als subsidiär zurück.
faelle:
- slug: sr-sexual-fall-feier
  title: "Die Feier und die Straßenbahn"
  difficulty: 4
  minutes: 45
  quellen:
  - "Eigener Sachverhalt der Redaktion"
  stand: 2026-10
  facts: >-
    A (28) und B (26) lernen sich auf einer Feier kennen. Im Verlauf des Abends
    will A die B küssen. B sagt deutlich: 'Nein, das möchte ich nicht' und dreht
    den Kopf weg. A fasst dennoch nach und küsst B mit einem Zungenkuss; B
    erstarrt und wehrt sich nicht. Gewalt wendet A nicht an. B verlässt
    anschließend die Feier. Am nächsten Tag berührt A die B in einer vollen
    Straßenbahn kurz und unvermittelt über der Kleidung am Gesäß; B hatte nicht
    damit gerechnet, sieht ihn erschrocken an und A steigt aus. B stellt
    Strafantrag wegen beider Vorfälle.
  question: >-
    Wie hat sich A nach §§ 177, 184i StGB strafbar gemacht? Prüfen Sie beide
    Vorfälle; Qualifikationen und Regelbeispiele sind nicht zu erörtern.
  steps:
  - prompt: >-
      Liegt beim Zungenkuss eine sexuelle Handlung i.S.d. § 184h Nr. 1 StGB vor?
    erwartung: >-
      Ja. Ein Zungenkuss hat nach seinem äußeren Erscheinungsbild eindeutigen
      Sexualbezug und überschreitet nach Art und Intensität die
      Erheblichkeitsschwelle. Er ist eine sexuelle Handlung.
  - prompt: >-
      Geschah der Zungenkuss gegen den erkennbaren Willen der B?
    erwartung: >-
      Ja. B hat ihre Ablehnung zuvor ausdrücklich erklärt ('Nein, das möchte ich
      nicht') und den Kopf weggedreht. Der Wille war nach dem Empfängerhorizont
      eines verständigen Dritten erkennbar; dass B später erstarrte, ändert
      daran nichts, denn Passivität ist keine Zustimmung. A handelte
      vorsätzlich. A ist nach § 177 Abs. 1 StGB strafbar; Rechtfertigungs- und
      Entschuldigungsgründe fehlen. Nötigungsmittel nach Abs. 5 liegen nicht
      vor.
  - prompt: >-
      Ist die Berührung in der Straßenbahn nach § 177 StGB strafbar?
    erwartung: >-
      Nein. Die flüchtige Berührung über der Kleidung erreicht nach h.M. nicht
      die Erheblichkeitsschwelle des § 184h Nr. 1 StGB und ist keine sexuelle
      Handlung i.S.d. § 177 StGB, auch wenn A ein Überraschungsmoment ausnutzte
      (Abs. 2 Nr. 3).
  - prompt: >-
      Ist die Berührung nach § 184i StGB strafbar?
    erwartung: >-
      Ja. A hat B in sexuell bestimmter Weise körperlich berührt und dadurch
      belästigt; er handelte vorsätzlich. Die Subsidiarität greift nicht, da §
      177 StGB für diesen Vorfall nicht erfüllt ist. Der Strafantrag der B nach
      § 184i Abs. 3 StGB liegt vor. Die beiden Vorfälle stehen in Tatmehrheit (§
      53 StGB).
  expectation:
