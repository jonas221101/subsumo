faelle:
- slug: sr-fall-geschaeftsfuehrer-privatueberweisung
  title: Die Privatueberweisung des Geschaeftsfuehrers
  difficulty: 4
  minutes: 45
  quellen:
  - Eigener Sachverhalt der Redaktion
  - StGB, amtliche Fassung
  facts: A ist alleinvertretungsberechtigter Geschaeftsfuehrer der X-GmbH und damit
    kraft seiner Organstellung zur Wahrnehmung der Vermoegensinteressen der Gesellschaft
    verpflichtet. Ohne Wissen oder Zustimmung der Gesellschafter ueberweist A 50.000
    Euro vom Geschaeftskonto der X-GmbH auf sein privates Konto, um damit eigene Schulden
    zu begleichen. Ein Anspruch der X-GmbH gegen A auf Rueckzahlung oder eine sonstige
    gleichwertige Gegenleistung besteht nicht.
  question: Hat sich A gegenueber der X-GmbH wegen Untreue gemaess § 266 Abs. 1 StGB
    strafbar gemacht?
  steps:
  - prompt: Formuliere den Obersatz.
    erwartung: A koennte sich durch die Ueberweisung wegen Untreue gemaess § 266 Abs.
      1 StGB strafbar gemacht haben.
  - prompt: Trifft A eine Vermoegensbetreuungspflicht gegenueber der X-GmbH?
    erwartung: Ja - als Geschaeftsfuehrer ist A kraft seiner Organstellung zur eigenverantwortlichen
      Wahrnehmung der Vermoegensinteressen der GmbH verpflichtet; diese Pflicht ist
      Hauptpflicht seines Amtes und von erheblichem Gewicht.
  - prompt: Liegt eine tatbestandsmaessige Tathandlung vor?
    erwartung: Ja - A hat seine im Aussenverhaeltnis wirksame Verfuegungsbefugnis
      ueber das Geschaeftskonto missbraucht, indem er sie im Innenverhaeltnis pflichtwidrig
      fuer private Zwecke einsetzte, ohne dass dies durch die Gesellschafter gedeckt
      war.
  - prompt: Ist der X-GmbH ein Vermoegensnachteil entstanden?
    erwartung: Ja - das Vermoegen der GmbH hat sich um 50.000 Euro verringert, ohne
      dass ein gleichwertiger Ausgleich (etwa ein Rueckzahlungsanspruch gegen A) besteht.
  - prompt: Handelte A vorsaetzlich?
    erwartung: Ja - A wusste um seine Pflichtenstellung und um die Pflichtwidrigkeit
      der Ueberweisung und wollte den Nachteil der GmbH herbeifuehren.
  - prompt: Formuliere das Ergebnis.
    erwartung: A hat sich wegen Untreue gemaess § 266 Abs. 1 StGB gegenueber der X-GmbH
      strafbar gemacht.
