cards:
- slug: sr-untreue-grundtatbestand
  type: definition
  front: 'Definiere: Untreue, § 266 Abs. 1 StGB, und ihre zwei Tatbestandsalternativen'
  back: '§ 266 Abs. 1 StGB stellt zwei Alternativen unter Strafe: den Missbrauchstatbestand
    (Missbrauch einer im Aussenverhaeltnis wirksam eingeraeumten Befugnis, ueber fremdes
    Vermoegen zu verfuegen oder einen anderen zu verpflichten) und den Treubruchtatbestand
    (Verletzung einer aus Gesetz, behoerdlichem Auftrag, Rechtsgeschaeft oder Treueverhaeltnis
    folgenden Pflicht, fremde Vermoegensinteressen wahrzunehmen). Beiden gemeinsam
    ist, dass dem Vermoegensinhaber dadurch ein Nachteil zugefuegt werden muss.'
  norms:
  - § 266 Abs. 1 StGB
  quellen:
  - StGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sr-untreue-missbrauchstatbestand
  type: definition
  front: Was kennzeichnet den Missbrauchstatbestand des § 266 Abs. 1 StGB?
  back: Der Taeter hat im Aussenverhaeltnis eine wirksame rechtliche Befugnis, ueber
    fremdes Vermoegen zu verfuegen oder einen Dritten zu verpflichten (z. B. Vertretungsmacht).
    Er missbraucht diese Befugnis, wenn er im Innenverhaeltnis seine Handlungsbefugnisse
    ueberschreitet - das nach aussen wirksame Rechtsgeschaeft ist also gerade pflichtwidrig,
    ohne deshalb unwirksam zu sein.
  norms:
  - § 266 Abs. 1 StGB
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sr-untreue-treubruchtatbestand
  type: definition
  front: Was kennzeichnet den Treubruchtatbestand des § 266 Abs. 1 StGB?
  back: Der Treubruchtatbestand setzt keine rechtsgeschaeftliche Vertretungsmacht
    voraus. Ausreichend ist die Verletzung einer Vermoegensbetreuungspflicht - einer
    Pflicht, fremde Vermoegensinteressen wahrzunehmen -, die sich aus Gesetz, behoerdlichem
    Auftrag, Rechtsgeschaeft oder einem tatsaechlichen Treueverhaeltnis ergeben kann.
  norms:
  - § 266 Abs. 1 StGB
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sr-untreue-vermoegensbetreuungspflicht
  type: streitstand
  front: Welche Anforderungen stellt die Rechtsprechung an die Vermoegensbetreuungspflicht?
  back: Die Pflicht muss eine Hauptpflicht des Rechtsverhaeltnisses sein - nicht nur
    eine beilaeufige Nebenpflicht -, von einigem Gewicht sein und dem Taeter einen
    gewissen Entscheidungsspielraum sowie eine gewisse Selbststaendigkeit bei der
    Wahrnehmung fremder Vermoegensinteressen belassen. Reine Ausfuehrungsgehilfen
    ohne eigenen Spielraum unterfallen der Norm regelmaessig nicht.
  norms:
  - § 266 Abs. 1 StGB
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sr-untreue-vermoegensnachteil
  type: definition
  front: Wie wird der Vermoegensnachteil bei § 266 StGB bestimmt, und was ist eine
    schadensgleiche Vermoegensgefaehrdung?
  back: Der Nachteil wird wie beim Betrug im Wege einer Gesamtsaldierung ermittelt.
    Nach staendiger Rechtsprechung kann auch eine konkrete Gefaehrdung des Vermoegens
    ausreichen, wenn sie nach wirtschaftlicher Betrachtungsweise bereits einer Vermoegensminderung
    gleichsteht (schadensgleiche Vermoegensgefaehrdung) - etwa bei einem hohen Ausfallrisiko
    einer Forderung.
  norms:
  - § 266 Abs. 1 StGB
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sr-untreue-bverfg-praezisierungsgebot
  type: rechtsprechung
  front: Was verlangt das Bundesverfassungsgericht fuer die Feststellung des Vermoegensnachteils
    bei § 266 StGB?
  back: 'Das Bundesverfassungsgericht hat entschieden, dass der Nachteilsbegriff des
    § 266 StGB dem strafrechtlichen Bestimmtheitsgebot des Art. 103 Abs. 2 GG genuegen
    muss: Die Gerichte duerfen den Nachteil, insbesondere eine schadensgleiche Vermoegensgefaehrdung,
    nicht pauschal behaupten, sondern muessen ihn eigenstaendig beziffern und wirtschaftlich
    nachvollziehbar begruenden. Blosse Wahrscheinlichkeitserwaegungen ohne konkrete
    Bezifferung genuegen den verfassungsrechtlichen Anforderungen nicht.'
  norms:
  - § 266 Abs. 1 StGB
  - Art. 103 Abs. 2 GG
  quellen:
  - BVerfGE, amtliche Sammlung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sr-untreue-besonders-schwerer-fall
  type: norm
  front: Was regelt § 266 Abs. 2 StGB?
  back: '§ 266 Abs. 2 StGB erklaert unter anderem § 263 Abs. 3 StGB fuer entsprechend
    anwendbar: Die dort genannten Regelbeispiele fuer einen besonders schweren Fall
    des Betrugs - etwa ein Vermoegensverlust grossen Ausmasses oder gewerbsmaessiges
    Handeln - gelten damit auch fuer die Untreue.'
  norms:
  - § 266 Abs. 2 StGB
  - § 263 Abs. 3 StGB
  quellen:
  - StGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
