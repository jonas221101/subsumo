cards:
- slug: sr-vorsatz-tatbestandsirrtum-def
  type: norm
  front: 'Definiere: Tatbestandsirrtum, § 16 Abs. 1 StGB'
  back: Ein Tatbestandsirrtum liegt vor, wenn der Taeter bei Begehung der Tat einen
    Umstand nicht kennt, der zum gesetzlichen Tatbestand gehoert (§ 16 Abs. 1 S. 1
    StGB). Die Vorsatzkenntnis muss sich auf alle objektiven Tatbestandsmerkmale beziehen
    (Kongruenzprinzip); fehlt sie, entfaellt der Vorsatz bereits auf Tatbestandsebene.
    Eine Fahrlaessigkeitsstrafbarkeit bleibt gemaess § 16 Abs. 1 S. 2 StGB unberuehrt,
    wenn ein entsprechendes Fahrlaessigkeitsdelikt existiert und der Irrtum vermeidbar
    war.
  norms:
  - § 16 Abs. 1 S. 1 StGB
  - § 16 Abs. 1 S. 2 StGB
  quellen:
  - § 16 StGB, amtlicher Wortlaut
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sr-vorsatz-error-in-persona
  type: definition
  front: 'Definiere: error in persona vel objecto'
  back: 'Ein error in persona (vel objecto) liegt vor, wenn der Taeter das von ihm
    anvisierte Tatobjekt zwar korrekt in seinen Willen aufnimmt und auch trifft, sich
    aber ueber dessen Identitaet irrt. Nach h.M. ist dieser Irrtum unbeachtlich, wenn
    die verwechselten Objekte tatbestandlich gleichwertig sind: der Vorsatz bezieht
    sich auf das tatsaechlich getroffene Objekt, sodass ein vollendetes Vorsatzdelikt
    vorliegt. Sind die Objekte tatbestandlich nicht gleichwertig, liegt hinsichtlich
    des getroffenen Objekts ein den Vorsatz ausschliessender Tatbestandsirrtum vor.'
  norms:
  - § 16 Abs. 1 StGB
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sr-vorsatz-aberratio-ictus
  type: definition
  front: 'Definiere: aberratio ictus (Fehlgehen der Tat)'
  back: 'Bei der aberratio ictus trifft die Tathandlung infolge eines Fehlgehens ein
    anderes als das vom Taeter anvisierte Objekt, ohne dass eine Verwechslung der
    Identitaet vorliegt - der Ausfuehrungsverlauf weicht objektiv vom Tatplan ab.
    Anders als der error in persona ist die aberratio ictus nach ganz h.M. stets beachtlich,
    auch bei gleichwertigen Tatobjekten: hinsichtlich des tatsaechlich getroffenen
    Objekts fehlt es am Vorsatz, § 16 Abs. 1 StGB; in Betracht kommen Versuch am anvisierten
    Objekt in Tateinheit mit einem vollendeten Fahrlaessigkeitsdelikt am getroffenen
    Objekt.'
  norms:
  - § 16 Abs. 1 StGB
  - § 22 StGB
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sr-vorsatz-error-aberratio-streitstand
  type: streitstand
  front: 'Streitstand: Behandlung des error in persona bei gleichwertigen Tatobjekten'
  back: 'Problem: Ob eine Verwechslung des Tatobjekts bei Gleichwertigkeit stets

    unbeachtlich ist oder wie eine aberratio ictus behandelt werden muss,

    entscheidet ueber vollendetes Vorsatzdelikt oder nur Versuch/

    Fahrlaessigkeit.


    Gleichwertigkeitstheorie (ganz h.M. und Rspr.): Der Vorsatz des Taeters

    bezieht sich generalisierend auf das tatbestandlich umschriebene

    Objekt, nicht auf ein bestimmtes Individuum; bei Gleichwertigkeit der

    Tatobjekte ist die Fehlvorstellung ueber die Identitaet ein

    unbeachtlicher Motivirrtum. Argument: Der Tatbestand individualisiert

    das Opfer nicht, das Unrecht der vollendeten Tat ist identisch

    verwirklicht.


    Konkretisierungstheorie (Literatur, Minderansicht): Der Vorsatz erfasst

    nur das konkret anvisierte, individualisierte Objekt; jede Abweichung -

    ob durch Fehlgehen oder Verwechslung - ist wie eine aberratio ictus zu

    behandeln (also stets Versuch/Fahrlaessigkeit). Argument: konsequente

    Anwendung des Kongruenzprinzips zwischen individuell gebildetem

    Vorsatz und Erfolg.


    Konsequenz: In der Klausur ist die Gleichwertigkeitstheorie als

    herrschende Ansicht darzustellen und zu vertreten; die

    Konkretisierungstheorie kann als Gegenposition kurz erwaehnt werden.

    '
  norms:
  - § 16 Abs. 1 StGB
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sr-vorsatz-verbotsirrtum-abgrenzung
  type: norm
  front: 'Definiere: Abgrenzung Tatbestandsirrtum (§ 16 StGB) und Verbotsirrtum (§
    17 StGB)'
  back: 'Der Tatbestandsirrtum betrifft die Unkenntnis eines zum gesetzlichen Tatbestand
    gehoerenden Umstands und schliesst gemaess § 16 Abs. 1 S. 1 StGB bereits den Vorsatz
    aus. Der Verbotsirrtum betrifft demgegenueber die Fehlvorstellung des Taeters,
    sein an sich vorsaetzlich und tatbestandsmaessig verwirklichtes Verhalten sei
    erlaubt - er kennt und will die Tatumstaende, verkennt aber deren rechtliche Bewertung
    als verboten. Der Verbotsirrtum laesst den Vorsatz unberuehrt und wirkt sich nur
    bei Unvermeidbarkeit auf der Schuldebene aus (§ 17 S. 1 StGB: Schuldausschluss;
    § 17 S. 2 StGB: bei Vermeidbarkeit fakultative Strafmilderung nach § 49 Abs. 1
    StGB).'
  norms:
  - § 16 Abs. 1 S. 1 StGB
  - § 17 S. 1 StGB
  - § 17 S. 2 StGB
  - § 49 Abs. 1 StGB
  quellen:
  - § 16 StGB, amtlicher Wortlaut
  - § 17 StGB, amtlicher Wortlaut
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sr-vorsatz-erlaubnistatbestandsirrtum
  type: definition
  front: 'Definiere: Erlaubnistatbestandsirrtum'
  back: Ein Erlaubnistatbestandsirrtum liegt vor, wenn der Taeter irrig Umstaende
    annimmt, die - laegen sie vor - einen anerkannten Rechtfertigungsgrund begruenden
    wuerden (z. B. Putativnotwehr). Er ist weder ein Tatbestandsirrtum i.S.d. § 16
    StGB, da die Kenntnis der Tatumstaende vollstaendig vorliegt, noch ein reiner
    Verbotsirrtum i.S.d. § 17 StGB, da der Taeter nicht die generelle Erlaubtheit
    der Rechtfertigung verkennt, sondern nur deren tatsaechliche Voraussetzungen im
    Einzelfall. Nach der (eingeschraenkten) rechtsfolgenverweisenden Schuldtheorie
    entfaellt in entsprechender Anwendung des § 16 Abs. 1 StGB die Vorsatzschuld;
    eine Fahrlaessigkeitsstrafbarkeit bleibt moeglich.
  norms:
  - § 16 Abs. 1 StGB
  - § 17 StGB
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sr-vorsatz-umgekehrter-tatbestandsirrtum
  type: norm
  front: 'Definiere: umgekehrter Tatbestandsirrtum'
  back: Beim umgekehrten Tatbestandsirrtum nimmt der Taeter irrig Umstaende an, die
    - laegen sie tatsaechlich vor - den objektiven Tatbestand erfuellen wuerden, obwohl
    sie in Wirklichkeit fehlen; er handelt subjektiv vorsaetzlich, obwohl der objektive
    Tatbestand nicht verwirklicht ist. Da der subjektive Tatentschluss vorliegt, aber
    der objektive Tatbestand fehlt, begruendet dieser Irrtum grundsaetzlich einen
    (ggf. untauglichen) Versuch, §§ 22, 23 Abs. 1 StGB.
  norms:
  - § 22 StGB
  - § 23 Abs. 1 StGB
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
schemata:
- slug: sr-schema-tatbestandsirrtum
  title: Pruefung eines Irrtums ueber Tatumstaende, § 16 StGB
  norms:
  - § 16 Abs. 1 StGB
  - § 17 StGB
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
  steps:
  - label: 'I. Feststellung: worauf bezieht sich die Fehlvorstellung?'
    children:
    - label: 1. Umstand gehoert zum gesetzlichen Tatbestand -> weiter mit II.
    - label: 2. Umstand betrifft nur die rechtliche Bewertung/Erlaubtheit -> Verbotsirrtum,
        § 17 StGB
  - label: II. Tatbestandsirrtum, § 16 Abs. 1 StGB
    children:
    - label: 1. Error in persona vel objecto (Verwechslung des Tatobjekts)
      children:
      - label: a) Gleichwertigkeit der Tatobjekte -> Irrtum unbeachtlich, Vorsatz
          (+)
      - label: b) Keine Gleichwertigkeit -> Vorsatz bzgl. getroffenem Objekt (-)
    - label: 2. Aberratio ictus (Fehlgehen der Tat)
      children:
      - label: a) Vorsatz bzgl. anvisiertem Objekt (-) hinsichtlich Vollendung
      - label: b) Versuch am anvisierten Objekt, §§ 22, 23 StGB
      - label: c) ggf. vollendetes Fahrlaessigkeitsdelikt am getroffenen Objekt
    - label: '3. Rechtsfolge: Vorsatzausschluss, ggf. Fahrlaessigkeitsstrafbarkeit,
        § 16 Abs. 1 S. 1, S. 2 StGB'
  - label: 'III. Sonderfall: Erlaubnistatbestandsirrtum (entspr. Anwendung § 16 Abs.
      1 StGB nach rechtsfolgenverweisender Schuldtheorie)'
  - label: IV. Ergebnis
faelle:
- slug: sr-fall-verfehlter-schuss
  title: Der verfehlte Schuss
  difficulty: 4
  minutes: 45
  quellen:
  - Eigener Sachverhalt der Redaktion
  - StGB, amtliche Fassung
  facts: A hasst B und will ihn toeten. A zielt mit einer geladenen Schusswaffe gezielt
    auf B, der etwa zehn Meter entfernt steht. Wegen seiner Aufregung und mangelnder
    Schiessfertigkeit verfehlt A sein Ziel deutlich; die Kugel trifft stattdessen
    den neben B stehenden, von A nicht wahrgenommenen C toedlich. B bleibt unverletzt.
  question: Wie hat sich A hinsichtlich des B und hinsichtlich des C strafbar gemacht?
  steps:
  - prompt: Hat A hinsichtlich des B ein vollendetes Toetungsdelikt begangen?
    erwartung: Nein - B wurde nicht getroffen, es fehlt am tatbestandsmaessigen Erfolg;
      in Betracht kommt hinsichtlich B nur ein versuchter Totschlag, §§ 212, 22, 23
      Abs. 1 StGB.
  - prompt: Bezieht sich der Vorsatz des A auch auf den Tod des C?
    erwartung: Nein - A hatte hinsichtlich C weder Wissen noch Wollen der Tatbestandsverwirklichung.
      Es handelt sich nicht um einen error in persona (keine Verwechslung), sondern
      um eine aberratio ictus, da die Ausfuehrung objektiv vom Tatplan abwich.
  - prompt: Wie wird die aberratio ictus dogmatisch behandelt?
    erwartung: 'Nach ganz h.M. ist die aberratio ictus - anders als der error in persona
      bei gleichwertigen Objekten - stets beachtlich: der Vorsatz erfasst nur das
      konkret anvisierte Objekt (B), sodass hinsichtlich C ein Tatbestandsirrtum vorliegt
      und der Vorsatz insoweit entfaellt, § 16 Abs. 1 S. 1 StGB.'
  - prompt: Welche Strafbarkeiten kommen fuer A in Betracht?
    erwartung: Versuchter Totschlag zum Nachteil des B (§§ 212, 22, 23 Abs. 1 StGB)
      in Tateinheit, § 52 StGB, mit vollendeter fahrlaessiger Toetung des C (§ 222
      StGB), da beim gezielten Schuss auf einen Menschen in Anwesenheit Dritter eine
      Sorgfaltspflichtverletzung und die Vorhersehbarkeit des Erfolgs zu bejahen sind.
  - prompt: Ergebnis?
    erwartung: A hat sich wegen versuchten Totschlags (§§ 212, 22, 23 Abs. 1 StGB)
      an B in Tateinheit mit fahrlaessiger Toetung (§ 222 StGB) des C strafbar gemacht.
  expectation:
    pruefpunkte:
    - id: p1
      label: Kein vollendetes Delikt zum Nachteil des B mangels Erfolgseintritt, aber
        Versuch bejaht
      weight: 2.0
      required: true
      norms:
      - § 212 StGB
      - § 22 StGB
      keywords:
      - '212'
      - Versuch
    - id: p2
      label: Aberratio ictus (kein error in persona) zutreffend erkannt und begruendet
      weight: 2.5
      required: true
      keywords:
      - aberratio ictus
    - id: p3
      label: Vorsatz bzgl. C nach § 16 Abs. 1 StGB verneint
      weight: 2.0
      required: true
      norms:
      - § 16 Abs. 1 StGB
      keywords:
      - 16 Abs. 1
    - id: p4
      label: Pruefung einer fahrlaessigen Toetung des C, § 222 StGB, mit Sorgfaltspflichtverletzung
        und Vorhersehbarkeit
      weight: 2.5
      required: true
      norms:
      - § 222 StGB
      keywords:
      - '222'
      - Sorgfaltspflicht
    - id: p5
      label: Tateinheit zwischen Versuch (B) und vollendeter Fahrlaessigkeitstat (C),
        § 52 StGB
      weight: 1.5
      required: false
      norms:
      - § 52 StGB
      keywords:
      - Tateinheit
      - '52'
    - id: p6
      label: Ergebnis korrekt zusammengefasst
      weight: 1.0
      required: false
      keywords:
      - Ergebnis
