topic:
  slug: sr-at
  area: strafrecht
  title: Strafrecht Allgemeiner Teil
  parent: strafrecht
  relevance: 5
  position: 10
  stand: "2026-09"

cards:
  - slug: sr-at-handlung
    type: definition
    front: "Definiere: strafrechtliche Handlung"
    back: >-
      Eine Handlung ist jedes vom menschlichen Willen beherrschte oder
      beherrschbare Verhalten. Keine Handlungen sind daher vis absoluta,
      Reflexbewegungen und Bewegungen im Zustand der Bewusstlosigkeit.
    norms: ["§ 13 StGB"]
    quellen: ["StGB, amtliche Fassung", "Eigenformulierung Redaktion"]

  - slug: sr-at-kausalitaet
    type: definition
    front: "Definiere: Kausalität (Äquivalenztheorie / conditio-sine-qua-non)"
    back: >-
      Ursächlich ist jede Bedingung, die nicht hinweggedacht werden kann, ohne
      dass der Erfolg in seiner konkreten Gestalt entfiele. Bei
      Mehrfachkausalität gilt die Modifikation: Von mehreren Bedingungen, die
      zwar alternativ, nicht aber kumulativ hinweggedacht werden können, ist
      jede ursächlich.
    norms: ["§ 212 StGB", "§ 223 StGB"]
    quellen: ["Eigenformulierung Redaktion"]

  - slug: sr-at-objektive-zurechnung
    type: definition
    front: "Definiere: objektive Zurechnung"
    back: >-
      Der Erfolg ist dem Täter objektiv zurechenbar, wenn er durch sein
      Verhalten eine rechtlich missbilligte Gefahr geschaffen hat und sich
      gerade diese Gefahr im tatbestandsmäßigen Erfolg realisiert hat.
      Ausschluss u. a. bei: erlaubtem Risiko, Risikoverringerung, atypischem
      Kausalverlauf, eigenverantwortlicher Selbstgefährdung, Dazwischentreten
      Dritter.
    norms: ["§ 212 StGB"]
    quellen: ["Eigenformulierung Redaktion"]

  - slug: sr-at-vorsatz
    type: definition
    front: "Definiere: Vorsatz"
    back: >-
      Vorsatz ist der Wille zur Verwirklichung des Tatbestandes in Kenntnis
      aller seiner objektiven Tatumstände - kurz: Wissen und Wollen der
      Tatbestandsverwirklichung. Erscheinungsformen: dolus directus 1. Grades
      (Absicht), dolus directus 2. Grades (direkter Vorsatz), dolus eventualis
      (bedingter Vorsatz).
    norms: ["§ 15 StGB", "§ 16 StGB"]
    quellen: ["StGB, amtliche Fassung", "Eigenformulierung Redaktion"]

  - slug: sr-at-dolus-eventualis
    type: streitstand
    front: "Streitstand: Abgrenzung dolus eventualis / bewusste Fahrlässigkeit"
    back: |
      Problem: Beide Formen setzen voraus, dass der Täter den Erfolgseintritt
      für möglich hält. Die Abgrenzung entscheidet über Vorsatz- oder
      Fahrlässigkeitsstrafbarkeit und damit oft über Jahre Freiheitsstrafe.

      Moeglichkeitstheorie: Vorsatz schon, wenn der Täter den Erfolg konkret
      für möglich hält und dennoch handelt. Argument: klare, gut
      handhabbare Grenze. Kritik: Der Fahrlässigkeitsbereich wird praktisch
      abgeschafft.

      Wahrscheinlichkeitstheorie: Vorsatz, wenn der Täter den Erfolg für
      wahrscheinlich (mehr als nur möglich) hält. Kritik: Die Schwelle der
      "Wahrscheinlichkeit" ist nicht bestimmbar.

      Gleichgueltigkeitstheorie: Vorsatz bei innerer Gleichgültigkeit
      gegenüber dem Rechtsgut. Kritik: Gesinnungsstrafrecht.

      h.M. und Rspr. (Billigungs- bzw. Ernstnahmetheorie): Vorsatz, wenn der
      Täter den Erfolg ernstlich für möglich hält und ihn billigend in Kauf
      nimmt, sich also mit ihm abfindet. Argumente: Nur diese Theorie erfasst
      neben dem kognitiven auch das voluntative Element, das § 15 StGB mit
      "Wollen" voraussetzt; sie ermöglicht die notwendige Abschichtung zur
      bewussten Fahrlässigkeit, bei der der Täter ernsthaft auf das Ausbleiben
      des Erfolges vertraut.

      Konsequenz: Bei hochgefährlichen Gewalthandlungen liegt die Annahme von
      Vorsatz nahe; die Hemmschwellentheorie bei Tötungsdelikten ist im Rahmen
      der Beweiswürdigung zu berücksichtigen, ersetzt aber keine
      Gesamtwürdigung.
    norms: ["§ 15 StGB", "§ 16 Abs. 1 StGB"]
    quellen: ["StGB, amtliche Fassung", "Eigenformulierung Redaktion"]

  - slug: sr-at-notwehr
    type: definition
    front: "Definiere: Notwehr (§ 32 StGB) und ihre Voraussetzungen"
    back: >-
      Notwehr ist die Verteidigung, die erforderlich ist, um einen
      gegenwärtigen rechtswidrigen Angriff von sich oder einem anderen
      abzuwenden (§ 32 Abs. 2 StGB). Aufbau: (1) Notwehrlage - gegenwärtiger,
      rechtswidriger Angriff; (2) Notwehrhandlung - erforderlich (geeignet und
      mildestes gleich wirksames Mittel) und geboten (keine sozialethische
      Einschränkung); (3) subjektives Rechtfertigungselement -
      Verteidigungswille.
    norms: ["§ 32 StGB"]
    quellen: ["§ 32 StGB, amtlicher Wortlaut", "Eigenformulierung Redaktion"]

  - slug: sr-at-angriff
    type: definition
    front: "Definiere: Angriff und Gegenwärtigkeit i.S.d. § 32 StGB"
    back: >-
      Angriff ist jede durch menschliches Verhalten drohende Verletzung
      rechtlich geschützter Interessen. Gegenwärtig ist der Angriff, der
      unmittelbar bevorsteht, gerade stattfindet oder noch andauert. Ein bereits
      beendeter oder erst künftiger Angriff trägt keine Notwehr.
    norms: ["§ 32 Abs. 2 StGB"]
    quellen: ["Eigenformulierung Redaktion"]

schemata:
  - slug: sr-schema-vorsatzdelikt
    title: "Aufbau des vollendeten vorsätzlichen Begehungsdelikts"
    norms: ["§ 15 StGB", "§ 32 StGB", "§ 20 StGB"]
    quellen: ["StGB, amtliche Fassung", "Eigenformulierung Redaktion"]
    steps:
      - label: "I. Tatbestand"
        children:
          - label: "1. Objektiver Tatbestand"
            children:
              - label: "a) Taterfolg"
              - label: "b) Tathandlung"
              - label: "c) Kausalität (conditio-sine-qua-non)"
              - label: "d) Objektive Zurechnung"
          - label: "2. Subjektiver Tatbestand"
            children:
              - label: "a) Vorsatz bzgl. aller objektiven Tatbestandsmerkmale, § 15 StGB"
              - label: "b) Besondere subjektive Merkmale (z. B. Züignungsabsicht)"
      - label: "II. Rechtswidrigkeit"
        children:
          - label: "1. Notwehr, § 32 StGB"
          - label: "2. Rechtfertigender Notstand, § 34 StGB"
          - label: "3. Einwilligung / mutmaßliche Einwilligung"
          - label: "4. Zivilrechtliche Rechtfertigungsgründe, §§ 227-229, 904 BGB"
      - label: "III. Schuld"
        children:
          - label: "1. Schuldfähigkeit, §§ 19, 20, 21 StGB"
          - label: "2. Unrechtsbewusstsein, § 17 StGB"
          - label: "3. Entschuldigungsgründe, §§ 33, 35 StGB"
      - label: "IV. Ergebnis, ggf. Strafantrag und Strafzumessung"

  - slug: sr-schema-223
    title: "Körperverletzung, § 223 Abs. 1 StGB"
    norms: ["§ 223 Abs. 1 StGB"]
    quellen: ["§ 223 StGB, amtlicher Wortlaut", "Eigenformulierung Redaktion"]
    steps:
      - label: "I. Tatbestand"
        children:
          - label: "1. Objektiver Tatbestand"
            children:
              - label: "a) Körperliche Misshandlung - üble, unangemessene Behandlung, die das körperliche Wohlbefinden oder die körperliche Unversehrtheit nicht nur unerheblich beeinträchtigt"
              - label: "b) oder Gesundheitsschädigung - Hervorrufen oder Steigern eines pathologischen Zustandes"
              - label: "c) Kausalität und objektive Zurechnung"
          - label: "2. Subjektiver Tatbestand: Vorsatz"
      - label: "II. Rechtswidrigkeit (insb. § 32 StGB, Einwilligung, § 228 StGB)"
      - label: "III. Schuld"
      - label: "IV. Strafantrag, § 230 StGB"

faelle:
  - slug: sr-fall-notwehr-schlagstock
    title: "Der Schlagstock"
    difficulty: 3
    minutes: 60
    quellen: ["Eigener Sachverhalt der Redaktion", "StGB, amtliche Fassung"]
    facts: >-
      A und B geraten vor einer Kneipe in Streit. B, der deutlich kräftiger ist,
      holt mit der Faust aus, um A ins Gesicht zu schlagen. A weicht zurück,
      zieht einen Teleskopschlagstock und schlägt B damit einmal kräftig auf
      den Oberarm. B erleidet eine Prellung und lässt von A ab. A hätte auch
      weglaufen können; die Straße war frei.
    question: "Hat sich A nach § 223 Abs. 1 StGB strafbar gemacht?"
    steps:
      - prompt: "Formuliere den Obersatz für die Strafbarkeit des A."
        erwartung: "A könnte sich durch den Schlag mit dem Teleskopschlagstock wegen Körperverletzung nach § 223 Abs. 1 StGB strafbar gemacht haben."
      - prompt: "Ist der objektive Tatbestand erfüllt?"
        erwartung: "Ja - die Prellung ist sowohl körperliche Misshandlung als auch Gesundheitsschädigung."
      - prompt: "Liegt eine Notwehrlage vor?"
        erwartung: "Ja - der unmittelbar bevorstehende Faustschlag ist ein gegenwärtiger rechtswidriger Angriff."
      - prompt: "War die Verteidigung erforderlich, obwohl A hätte fliehen können?"
        erwartung: "Ja. Flucht ist kein Verteidigungsmittel; das Recht muss dem Unrecht nicht weichen. Erforderlich ist das mildeste gleich wirksame Verteidigungsmittel."
    expectation:
      pruefpunkte:
        - id: p1
          label: "Obersatz mit § 223 Abs. 1 StGB"
          weight: 1.5
          required: true
          norms: ["§ 223 Abs. 1 StGB", "§ 223 StGB"]
          keywords: ["223"]
          card_slugs: ["sr-kv-koerperliche-misshandlung"]
        - id: p2
          label: "Körperliche Misshandlung und/oder Gesundheitsschädigung definiert und subsumiert"
          weight: 2.5
          required: true
          keywords: ["körperliche Misshandlung", "Gesundheitsschädigung", "Wohlbefinden"]
          card_slugs: ["sr-kv-koerperliche-misshandlung", "sr-kv-gesundheitsschaedigung"]
        - id: p3
          label: "Vorsatz bejaht, § 15 StGB"
          weight: 1.0
          norms: ["§ 15 StGB"]
          keywords: ["Vorsatz"]
          card_slugs: ["sr-at-vorsatz"]
        - id: p4
          label: "Notwehrlage: gegenwärtiger rechtswidriger Angriff"
          weight: 2.5
          required: true
          norms: ["§ 32 StGB", "§ 32 Abs. 2 StGB"]
          keywords: ["gegenwärtig", "rechtswidriger Angriff", "Notwehrlage"]
          card_slugs: ["sr-at-angriff", "sr-at-notwehr"]
        - id: p5
          label: "Erforderlichkeit: Flucht ist kein milderes Mittel, das Recht muss dem Unrecht nicht weichen"
          weight: 3.0
          required: true
          keywords: ["erforderlich", "Flucht", "mildeste", "muss dem Unrecht nicht weichen"]
          card_slugs: ["sr-at-notwehr"]
        - id: p6
          label: "Gebotenheit / sozialethische Einschränkungen geprüft"
          weight: 1.5
          keywords: ["geboten", "sozialethisch"]
          card_slugs: ["sr-at-notwehr"]
        - id: p7
          label: "Verteidigungswille als subjektives Rechtfertigungselement"
          weight: 1.0
          keywords: ["Verteidigungswille", "subjektives Rechtfertigungselement"]
          card_slugs: ["sr-at-notwehr"]
        - id: p8
          label: "Ergebnis: A ist gerechtfertigt und nicht strafbar"
          weight: 1.0
          keywords: ["gerechtfertigt", "nicht strafbar"]
