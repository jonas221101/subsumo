  stand: 2026-09
  steps:
  - label: I. Tatbestand
    children:
    - label: 1. Objektiver Tatbestand
      children:
      - label: a) Vorliegen einer Urkunde (Perpetuierungs-, Beweis-, Garantiefunktion)
          bzw. einer zusammengesetzten Urkunde/Gesamturkunde
      - label: 'b) Tathandlung: Herstellen einer unechten Urkunde (Var. 1) oder Verfälschen
          einer echten Urkunde (Var. 2) oder Gebrauchmachen einer unechten/verfälschten
          Urkunde (Var. 3)'
    - label: 2. Subjektiver Tatbestand
      children:
      - label: a) Vorsatz
      - label: b) Absicht, zur Täuschung im Rechtsverkehr zu gebrauchen (§ 267 Abs.
          1 a.E. StGB, überschießende Innentendenz)
  - label: II. Rechtswidrigkeit
  - label: III. Schuld
  - label: IV. Besonders schwerer Fall, § 267 Abs. 3 StGB
  - label: V. Ergebnis
faelle:
- slug: sr-fall-kreditantrag-fremder-name
  title: Der gefälschte Kreditantrag
  difficulty: 3
  minutes: 45
  quellen:
  - Eigener Sachverhalt der Redaktion
  - StGB, amtliche Fassung
  facts: A möchte bei einer fiktiven Sparkasse einen Kredit aufnehmen, erfüllt selbst
    aber nicht die Bonitätsanforderungen. Er nimmt daher ein leeres Vertragsformular,
    trägt als Vertragspartner den Namen seines Bekannten B ein und unterschreibt
    eigenhändig mit dem Namen "B". Anschließend reicht A das so erstellte Dokument
    bei der Sachbearbeiterin der Sparkasse als angeblich von B unterschriebenen Kreditantrag
    ein, um den Eindruck zu erwecken, B selbst habe den Antrag gestellt und unterschrieben.
    B hat von alledem nichts gewusst und den Antrag nicht autorisiert.
  question: Hat sich A wegen Urkundenfälschung gemäß § 267 Abs. 1 StGB strafbar
    gemacht?
  steps:
  - prompt: Ist der von A erstellte Kreditantrag eine Urkunde?
    erwartung: Ja - er ist verkörpert (Perpetuierungsfunktion), zum Beweis der Kreditantragstellung
      durch B bestimmt und geeignet (Beweisfunktion) und lässt B als vermeintlichen
      Aussteller erkennen (Garantiefunktion).
  - prompt: Ist die Urkunde unecht?
    erwartung: Ja - der aus der Urkunde erkennbare (scheinbare) Aussteller ist B,
      tatsächlicher Aussteller (wer die Erklärung gedanklich zu vertreten hat) ist
      jedoch A; es besteht eine Identitätstäuschung.
  - prompt: Welche Tathandlung hat A vorgenommen?
    erwartung: A hat die unechte Urkunde hergestellt, § 267 Abs. 1 Var. 1 StGB, indem
      er das Dokument unter dem fremden Namen des B anfertigte und unterschrieb.
  - prompt: Liegt zusätzlich ein Gebrauchmachen vor?
    erwartung: Ja - A hat die unechte Urkunde der Sachbearbeiterin der Sparkasse vorgelegt
      und ihr damit die Möglichkeit der sinnlichen Wahrnehmung verschafft, § 267
      Abs. 1 Var. 3 StGB; Herstellen und Gebrauchmachen stehen zueinander in Tateinheit,
      da beide Varianten dieselbe Urkunde betreffen.
  - prompt: Ist der subjektive Tatbestand erfüllt?
    erwartung: Ja - A handelte vorsätzlich hinsichtlich aller objektiven Umstände
      und mit der Absicht, durch Vorlage der Urkunde die Sachbearbeiterin über die
      Urheberschaft des Antrags zu täuschen und dadurch den Kredit zu erlangen.
  - prompt: Ergebnis?
    erwartung: A hat sich wegen Urkundenfälschung durch Herstellen und Gebrauchmachen
      einer unechten Urkunde gemäß § 267 Abs. 1 StGB strafbar gemacht.
