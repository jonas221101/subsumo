cards:
- slug: sr-urkunde-begriff
  type: definition
  front: 'Definiere: Urkunde i.S.d. § 267 StGB'
  back: 'Eine Urkunde ist jede verkoerperte Gedankenerklaerung, die zum Beweis einer
    rechtlich erheblichen Tatsache im Rechtsverkehr geeignet und bestimmt ist und
    ihren Aussteller erkennen laesst. Diese Definition wird ueblicherweise in drei
    Merkmale aufgegliedert: Perpetuierungs- funktion (Verkoerperung), Beweisfunktion
    (Eignung und Bestimmung zum Beweis) und Garantiefunktion (Erkennbarkeit des Ausstellers).'
  norms:
  - § 267 StGB
  quellen:
  - § 267 StGB, amtlicher Wortlaut
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sr-urkunde-perpetuierungsfunktion
  type: definition
  front: 'Definiere: Perpetuierungsfunktion der Urkunde'
  back: Die Gedankenerklaerung muss so dauerhaft verkoerpert sein, dass sie wahrnehmbar
    und wiederholt lesbar bzw. erkennbar bleibt. Blosse gesprochene Worte oder ein
    rein elektronisch gespeicherter, fuer das menschliche Auge ohne technische Zwischenschritte
    nicht unmittelbar sichtbarer Datensatz erfuellen die Perpetuierungsfunktion einer
    Urkunde nicht; fuer beweiserhebliche Daten gelten insoweit die Sonderregeln der
    Datenurkundendelikte.
  norms:
  - § 267 StGB
  - § 269 StGB
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sr-urkunde-beweisfunktion
  type: definition
  front: 'Definiere: Beweisfunktion der Urkunde'
  back: Die Erklaerung muss zum Beweis einer rechtlich erheblichen Tatsache im Rechtsverkehr
    bestimmt und zugleich objektiv geeignet sein. Bei der sogenannten Absichtsurkunde
    ergibt sich die Beweisbestimmung aus dem erkennbaren Zweck des Ausstellers; bei
    der sogenannten Zufallsurkunde genuegt bereits die objektive Eignung zum Beweis,
    ohne dass der Aussteller die Erklaerung zu Beweiszwecken geschaffen haben muss.
  norms:
  - § 267 StGB
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sr-urkunde-garantiefunktion
  type: definition
  front: 'Definiere: Garantiefunktion der Urkunde'
  back: Aus der Erklaerung muss erkennbar sein, wer als Aussteller fuer ihren gedanklichen
    Inhalt einsteht - nicht notwendig durch Namensnennung, auch aus den Umstaenden
    erkennbar (z. B. bei einem Kassenbon). Aussteller ist nach der geistigen Urheberschaftstheorie,
    wer die Erklaerung gedanklich zu vertreten hat; das muss nicht der technische
    Hersteller der Urkunde sein.
  norms:
  - § 267 StGB
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sr-urkunde-tathandlungen-herstellen-verfaelschen
  type: norm
  front: 'Definiere: Herstellen und Verfaelschen einer unechten Urkunde, § 267 Abs.
    1 StGB'
  back: Herstellen einer unechten Urkunde begeht, wer eine Urkunde schafft, die ueber
    die Identitaet ihres tatsaechlichen und ihres aus ihr erkennbaren (scheinbaren)
    Ausstellers taeuscht (Identitaetstaeuschung - die blosse schriftliche Luege ueber
    den Inhalt genuegt nicht). Verfaelschen begeht, wer den gedanklichen Inhalt einer
    zunaechst echten Urkunde nachtraeglich ohne Zustimmung des Ausstellers so veraendert,
    dass der Anschein entsteht, der veraenderte Inhalt stamme unveraendert vom scheinbaren
    Aussteller.
  norms:
  - § 267 Abs. 1 StGB
  quellen:
  - § 267 StGB, amtlicher Wortlaut
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sr-urkunde-gebrauchmachen
  type: norm
  front: 'Definiere: Gebrauchmachen einer unechten oder verfaelschten Urkunde, § 267
    Abs. 1 StGB'
  back: Gebrauchmachen ist jedes Zugaenglichmachen der unechten oder verfaelschten
    Urkunde fuer die sinnliche Wahrnehmung durch die Person, die getaeuscht werden
    soll, im Rechtsverkehr, sodass diese die Moeglichkeit erhaelt, vom vermeintlichen
    Beweiswert der Urkunde Kenntnis zu nehmen. Auf ein tatsaechliches Zur-Kenntnis-Nehmen
    kommt es nicht an - die blosse Kenntnisnahmemoeglichkeit genuegt.
  norms:
  - § 267 Abs. 1 StGB
  quellen:
  - § 267 StGB, amtlicher Wortlaut
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sr-urkunde-zusammengesetzte-gesamturkunde
  type: definition
  front: 'Definiere: zusammengesetzte Urkunde und Gesamturkunde'
  back: Bei einer zusammengesetzten Urkunde tritt zu einer schriftlichen Erklaerung
    eine koerperlich damit fest verbundene Bezugnahme (z. B. ein Preisschild auf einer
    Ware), sodass beide Teile eine einheitliche Beweisfunktion bilden; die Veraenderung
    nur eines Teils kann bereits die gesamte zusammengesetzte Urkunde verfaelschen.
    Eine Gesamturkunde entsteht, wenn mehrere Einzelurkunden durch eine amtliche Zusammenfassung
    (z. B. eine Buchfuehrung) eine zusaetzliche, ueber die Einzelurkunden hinausgehende
    eigene Beweisbestimmung erhalten, etwa hinsichtlich Vollstaendigkeit und Reihenfolge
    der Eintragungen.
  norms:
  - § 267 StGB
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
schemata:
- slug: sr-schema-267
  title: Urkundenfaelschung, § 267 Abs. 1 StGB
  norms:
  - § 267 Abs. 1 StGB
  - § 267 Abs. 3 StGB
  quellen:
