cards:
- slug: sr-urkunde-begriff
  type: definition
  front: 'Definiere: Urkunde i.S.d. § 267 StGB'
  back: 'Eine Urkunde ist jede verkörperte Gedankenerklärung, die zum Beweis einer
    rechtlich erheblichen Tatsache im Rechtsverkehr geeignet und bestimmt ist und
    ihren Aussteller erkennen lässt. Diese Definition wird üblicherweise in drei
    Merkmale aufgegliedert: Perpetuierungs- funktion (Verkörperung), Beweisfunktion
    (Eignung und Bestimmung zum Beweis) und Garantiefunktion (Erkennbarkeit des Ausstellers).'
  norms:
  - § 267 StGB
  quellen:
  - § 267 StGB, amtlicher Wortlaut
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sr-urkunde-perpetuierungsfunktion
  type: definition
  front: 'Definiere: Perpetuierungsfunktion der Urkunde'
  back: Die Gedankenerklärung muss so dauerhaft verkörpert sein, dass sie wahrnehmbar
    und wiederholt lesbar bzw. erkennbar bleibt. Bloße gesprochene Worte oder ein
    rein elektronisch gespeicherter, für das menschliche Auge ohne technische Zwischenschritte
    nicht unmittelbar sichtbarer Datensatz erfüllen die Perpetuierungsfunktion einer
    Urkunde nicht; für beweiserhebliche Daten gelten insoweit die Sonderregeln der
    Datenurkundendelikte.
  norms:
  - § 267 StGB
  - § 269 StGB
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sr-urkunde-beweisfunktion
  type: definition
  front: 'Definiere: Beweisfunktion der Urkunde'
  back: Die Erklärung muss zum Beweis einer rechtlich erheblichen Tatsache im Rechtsverkehr
    bestimmt und zugleich objektiv geeignet sein. Bei der sogenannten Absichtsurkunde
    ergibt sich die Beweisbestimmung aus dem erkennbaren Zweck des Ausstellers; bei
    der sogenannten Zufallsurkunde genügt bereits die objektive Eignung zum Beweis,
    ohne dass der Aussteller die Erklärung zu Beweiszwecken geschaffen haben muss.
  norms:
  - § 267 StGB
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sr-urkunde-garantiefunktion
  type: definition
  front: 'Definiere: Garantiefunktion der Urkunde'
  back: Aus der Erklärung muss erkennbar sein, wer als Aussteller für ihren gedanklichen
    Inhalt einsteht - nicht notwendig durch Namensnennung, auch aus den Umständen
    erkennbar (z. B. bei einem Kassenbon). Aussteller ist nach der geistigen Urheberschaftstheorie,
    wer die Erklärung gedanklich zu vertreten hat; das muss nicht der technische
    Hersteller der Urkunde sein.
  norms:
  - § 267 StGB
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sr-urkunde-tathandlungen-herstellen-verfaelschen
  type: norm
  front: 'Definiere: Herstellen und Verfälschen einer unechten Urkunde, § 267 Abs.
    1 StGB'
  back: Herstellen einer unechten Urkunde begeht, wer eine Urkunde schafft, die über
    die Identität ihres tatsächlichen und ihres aus ihr erkennbaren (scheinbaren)
    Ausstellers täuscht (Identitätstäuschung - die bloße schriftliche Lüge über
    den Inhalt genügt nicht). Verfälschen begeht, wer den gedanklichen Inhalt einer
    zunächst echten Urkunde nachträglich ohne Zustimmung des Ausstellers so verändert,
    dass der Anschein entsteht, der veränderte Inhalt stamme unverändert vom scheinbaren
    Aussteller.
  norms:
  - § 267 Abs. 1 StGB
  quellen:
  - § 267 StGB, amtlicher Wortlaut
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sr-urkunde-gebrauchmachen
  type: norm
  front: 'Definiere: Gebrauchmachen einer unechten oder verfälschten Urkunde, § 267
    Abs. 1 StGB'
  back: Gebrauchmachen ist jedes Zugänglichmachen der unechten oder verfälschten
    Urkunde für die sinnliche Wahrnehmung durch die Person, die getäuscht werden
    soll, im Rechtsverkehr, sodass diese die Möglichkeit erhält, vom vermeintlichen
    Beweiswert der Urkunde Kenntnis zu nehmen. Auf ein tatsächliches Zur-Kenntnis-Nehmen
    kommt es nicht an - die bloße Kenntnisnahmemöglichkeit genügt.
  norms:
  - § 267 Abs. 1 StGB
  quellen:
  - § 267 StGB, amtlicher Wortlaut
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sr-urkunde-zusammengesetzte-gesamturkunde
  type: definition
  front: 'Definiere: zusammengesetzte Urkunde und Gesamturkunde'
  back: Bei einer zusammengesetzten Urkunde tritt zu einer schriftlichen Erklärung
    eine körperlich damit fest verbundene Bezugnahme (z. B. ein Preisschild auf einer
    Ware), sodass beide Teile eine einheitliche Beweisfunktion bilden; die Veränderung
    nur eines Teils kann bereits die gesamte zusammengesetzte Urkunde verfälschen.
    Eine Gesamturkunde entsteht, wenn mehrere Einzelurkunden durch eine amtliche Zusammenfassung
    (z. B. eine Buchführung) eine zusätzliche, über die Einzelurkunden hinausgehende
    eigene Beweisbestimmung erhalten, etwa hinsichtlich Vollständigkeit und Reihenfolge
    der Eintragungen.
  norms:
  - § 267 StGB
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
schemata:
- slug: sr-schema-267
  title: Urkundenfälschung, § 267 Abs. 1 StGB
  norms:
  - § 267 Abs. 1 StGB
  - § 267 Abs. 3 StGB
  quellen:
  - § 267 StGB, amtlicher Wortlaut
