    - label: 2. Subjektiver Tatbestand - Vorsatz, Zueignungsabsicht, Vorsatz bezüglich der Rechtswidrigkeit der Zueignung
  - label: II. Qualifikation § 244 Abs. 1 StGB
    children:
    - label: 1. Nr. 1a - Waffe oder anderes gefährliches Werkzeug
      children:
      - label: a) Waffe im technischen Sinn oder objektiv gefährliches Werkzeug (str.)
      - label: b) Beisichführen zwischen Versuchsbeginn und Beendigung
      - label: c) Bewusstsein der Verfügbarkeit
    - label: 2. Nr. 1b - sonstiges Werkzeug oder Mittel mit Verwendungsabsicht gegen Personen
      hinweis: Keine offensichtlich ungefährlichen Scheinwaffen.
    - label: 3. Nr. 2 - Bandendiebstahl (mindestens drei Personen, Bandenabrede, Mitwirkung eines anderen Mitglieds)
    - label: 4. Nr. 3 - Wohnungseinbruchdiebstahl (Wohnung, Einbrechen, Einsteigen, falscher Schlüssel, Verborgenhalten)
  - label: III. Dauerhaft genutzte Privatwohnung, § 244 Abs. 4 StGB
    hinweis: Verbrechen; kein minder schwerer Fall.
  - label: IV. Rechtswidrigkeit
  - label: V. Schuld
  - label: VI. Strafzumessung und Konkurrenzen
    children:
    - label: 1. § 243 StGB tritt hinter § 244 StGB zurück
    - label: 2. § 123 StGB konsumiert
    - label: 3. Bei Gewalt gegen Personen § 249 StGB vorrangig
faelle:
- slug: sr-fall-taschenmesser-im-schlafzimmer
  title: Das Taschenmesser im Schlafzimmer
  difficulty: 4
  minutes: 60
  quellen:
  - Eigener Sachverhalt der Redaktion
  - StGB, amtliche Fassung
  stand: 2026-09
  facts: >-
    A beobachtet, dass B abends sein Einfamilienhaus verlässt, in dem B seit Jahren
    wohnt. Ein Schlafzimmerfenster im Erdgeschoss steht auf Kipp. A klettert durch
    das gekippte Fenster in das Haus, um Schmuck zu stehlen. In seiner Hosentasche
    trägt er wie immer sein Taschenmesser mit einer 8 cm langen Klinge, das er zum
    Öffnen von Paketen benutzt; er hat nicht vor, es bei der Tat gegen Menschen
    einzusetzen, weiß aber, dass er es dabei hat. A nimmt aus dem Nachttisch eine
    goldene Uhr im Wert von 2.000 Euro und verlässt das Haus durch die Terrassentür.
  question: Hat sich A wegen Diebstahls in einer Qualifikation nach § 244 StGB strafbar gemacht?
  steps:
  - prompt: Ist der Grundtatbestand des § 242 Abs. 1 StGB erfüllt?
    erwartung: >-
      Ja - die Uhr ist für A eine fremde bewegliche Sache; er hat den Gewahrsam des B
      gebrochen und eigenen begründet. A handelte vorsätzlich und mit
      Zueignungsabsicht; die Zueignung war rechtswidrig und A wusste das.
  - prompt: Liegt ein Wohnungseinbruchdiebstahl nach § 244 Abs. 1 Nr. 3 StGB vor?
    erwartung: >-
      Ja - das Einfamilienhaus ist eine Wohnung. A ist durch das gekippte Fenster,
      also auf einem nicht zum Eintritt bestimmten Weg unter Überwindung eines
      Hindernisses, eingestiegen. Das Einsteigen diente der Ausführung des
      Diebstahls.
  - prompt: Ist § 244 Abs. 4 StGB einschlägig?
    erwartung: >-
      Ja - B bewohnt das Haus seit Jahren, es handelt sich um eine dauerhaft genutzte
      Privatwohnung. Die Tat ist damit Verbrechen mit einem Strafrahmen von einem bis
      zu zehn Jahren.
  - prompt: Ist das Taschenmesser ein gefährliches Werkzeug im Sinne des § 244 Abs. 1 Nr. 1a StGB?
    erwartung: >-
      Streitig. Nach der Rspr. und h.M. genügt die objektive Eignung, erhebliche
      Verletzungen herbeizuführen; ein Messer mit 8 cm Klinge erfüllt sie ohne
      Weiteres, eine Verwendungsabsicht ist nicht erforderlich. Subjektive Ansätze
      der Literatur verlangen einen Verwendungsvorbehalt und würden Nr. 1a hier
      verneinen. Mit der Rspr. ist das Taschenmesser gefährliches Werkzeug.
  - prompt: Führte A das Messer bei sich?
    erwartung: >-
      Ja - A trug das Messer während der gesamten Tat griffbereit in der Hosentasche
      und war sich dessen bewusst. Dass er es nicht einsetzen wollte, ist bei Nr. 1a
      unerheblich.
  - prompt: Kommt auch § 244 Abs. 1 Nr. 1b StGB in Betracht?
    erwartung: >-
      Nein - Nr. 1b setzt die Absicht voraus, das Werkzeug gegen Personen einzusetzen.
      A hatte keine solche Absicht; zudem ist ein gefährliches Werkzeug bereits von
      Nr. 1a erfasst.
  - prompt: Wie sind die Konkurrenzen zu beurteilen?
    erwartung: >-
      A hat sich nach § 244 Abs. 1 Nr. 1a und Nr. 3, Abs. 4 StGB strafbar gemacht;
      es liegt eine Tat vor. § 242 StGB wird verdrängt, § 243 Abs. 1 S. 2 Nr. 1 StGB
      kommt neben der Qualifikation nicht zur Anwendung, § 123 StGB tritt als
      konsumierte Begleittat zurück.
