cards:
- slug: sr-gw-reform-2021
  type: norm
  front: >-
    Was hat die Reform des § 261 StGB im Jahr 2021 geändert (All-Crimes-Ansatz)?
  back: >-
    Seit der Reform (Gesetz zur Verbesserung der strafrechtlichen Bekämpfung der Geldwäsche,
    in Kraft seit März 2021) knüpft § 261 StGB nicht mehr an einen Katalog bestimmter Vortaten
    an, sondern an jede rechtswidrige Tat (All-Crimes-Ansatz). Jeder Gegenstand, der aus einer
    rechtswidrigen Tat herrührt, kann Tatobjekt sein; der frühere Vortatenkatalog entfällt.
    Damit ist der Anwendungsbereich erheblich größer; das Ziel ist, die Verschleierung inkriminierter
    Vermögenswerte umfassend zu erfassen und die Bekämpfung der Organisierten Kriminalität
    zu verbessern. Die Reform dient auch der Umsetzung europäischer Vorgaben. Die Verhältnismäßigkeit
    wird vor allem über die subjektiven Voraussetzungen, namentlich die Kenntnis der Herkunft,
    gewahrt.
  norms:
  - § 261 StGB
  quellen:
  - StGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-10
- slug: sr-gw-tatobjekt-herruehren
  type: definition
  front: >-
    Definiere: Gegenstand, der aus einer rechtswidrigen Tat herrührt, § 261 StGB
  back: >-
    Gegenstand ist jeder Vermögenswert, nicht nur körperliche Sachen, sondern auch Forderungen,
    Bankguthaben und Rechte. Rechtswidrige Tat ist nach § 11 Abs. 1 Nr. 5 StGB eine Tat, die
    den Tatbestand eines Strafgesetzes verwirklicht; Ordnungswidrigkeiten genügen nicht. Auch im Ausland begangene Taten kommen nach § 261 Abs. 9 StGB in Betracht, wenn sie am Tatort mit Strafe bedroht sind oder unter die dort genannten EU-Vorgaben fallen und nach deutschem Recht rechtswidrige Taten wären. Ein Gegenstand
    rührt aus der Tat her, wenn der Täter oder ein Beteiligter ihn durch die Tat oder für
    ihre Begehung erlangt hat (Tatertrag), und auch, wenn er an die Stelle des ursprünglichen
    Gegenstands getreten ist (Surrogat). Die Herkunft aus der Tat muss im Zeitpunkt der Tathandlung
    feststehen.
  norms:
  - § 261 StGB
  - § 11 Abs. 1 Nr. 5 StGB
  quellen:
  - StGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-10
- slug: sr-gw-kontamination-streit
  type: streitstand
  front: >-
    Streitstand: Wann ist ein Bankguthaben, auf das legale und illegale Gelder fließen, "inkriminiert"?
  back: >-
    Bei Vermischung von Geldern auf einem Konto stellt sich die Frage, ob das gesamte Guthaben
    als aus der Vortat herrührend anzusehen ist. Nach der Totalkontamination ist jede Verfügung
    über ein vermischtes Guthaben Geldwäsche, wenn ein Teil inkriminiert ist; das schützt
    die Verfolgbarkeit der Spur, ist aber sehr weit. Die Gegenauffassung beschränkt die Kontamination
    auf den wertmäßigen Anteil des Guthabens, der auf die inkriminierte Herkunft zurückgeht,
    und verlangt bei geringfügigen Beträgen die Einhaltung einer Bagatellgrenze, weil das
    Guthaben sonst nahezu jeden Geschäftsverkehr unmöglich macht. Eine einheitliche Linie
    hat sich nicht durchgesetzt; in der Klausur ist die gewählte Lösung zu begründen und der
    Einzelfall zu würdigen.
  norms:
  - § 261 StGB
  quellen:
  - StGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-10
- slug: sr-gw-tathandlungen
  type: definition
  front: Welche Tathandlungen erfasst § 261 Abs. 1 StGB?
  back: >-
    Die Tathandlungen sind: (1) Verbergen des Gegenstands; (2) Umtauschen, Übertragen oder
    Verbringen in der Absicht, das Auffinden, die Einziehung oder die Herkunftsermittlung
    zu vereiteln; (3) Sich-oder-einem-Dritten-Verschaffen, also die Erlangung
    tatsächlicher Verfügungsgewalt; (4) Verwahren oder Verwenden für sich oder einen Dritten,
    wenn der Täter die Herkunft des Gegenstands kennt (maßgeblich ist nach dem Wortlaut die
    Kenntnis zum Zeitpunkt des Erlangens). Verschaffen verlangt bei Nr. 3 im Unterschied zum
    bloßen Verwahren die einverständliche Erlangung einer eigenen Verfügungsgewalt. Die Absicht
    der Verschleierung gehört nur bei Nr. 2 zum Tatbestand; bei Nr. 1 und 3 genügt bedingter
    Vorsatz hinsichtlich der Herkunft, bei Nr. 4 ist positive Kenntnis erforderlich.
  norms:
  - § 261 Abs. 1 StGB
  quellen:
  - StGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-10
- slug: sr-gw-subjektiv-leichtfertig
  type: norm
  front: >-
    Welche subjektiven Anforderungen stellt § 261 StGB (Kenntnis, Leichtfertigkeit)?
  back: >-
    Für die Vorsatztat nach § 261 Abs. 1 StGB muss der Täter die Tathandlung wollen und die
    Herkunft des Gegenstands aus einer rechtswidrigen Tat zumindest für möglich halten und
    billigend in Kauf nehmen (bedingter Vorsatz). Für Verwahren und Verwenden (Nr. 4) verlangt
    das Gesetz darüber hinaus positive Kenntnis der Herkunft, nach dem Wortlaut bezogen auf den
    Zeitpunkt des Erlangens; bei den übrigen Handlungen genügt bedingter Vorsatz. Daneben stellt § 261 StGB auch die leichtfertige Unkenntnis
    der Herkunft unter Strafe. Leichtfertigkeit ist eine gesteigerte Form der Fahrlässigkeit
    und liegt vor, wenn sich dem Täter die Herkunft aus einer rechtswidrigen Tat geradezu
    aufdrängen musste und er dies aus besonderer Gleichgültigkeit oder grober Unachtsamkeit
    außer Acht lässt.
  norms:
  - § 261 StGB
  quellen:
  - StGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-10
- slug: sr-gw-verteidigerhonorar
  type: rechtsprechung
  front: >-
    Welche Grenzen setzt das Bundesverfassungsgericht der Strafbarkeit des Strafverteidigers,
    der ein Honorar aus inkriminierten Mitteln annimmt? (BVerfGE 110, 226)
  back: >-
    Das BVerfG hat entschieden, dass die Strafbarkeit des Strafverteidigers wegen Geldwäsche
    durch Annahme eines Honorars verfassungskonform eingeschränkt werden muss (BVerfGE 110,
    226). Zur Wahrung der Berufsfreiheit (Art. 12 Abs. 1 GG) und der Verteidigerstellung ist
    eine Strafbarkeit des Verteidigers nur dann zulässig, wenn er im Zeitpunkt der Annahme
    des Honorars sichere Kenntnis von der Herkunft des Geldes hat. Dolus eventualis genügt nicht. Der Gesetzgeber hat dies 2021 in § 261 Abs. 1 Satz 3 StGB (sichere Kenntnis) und Abs. 6 Satz 2 (keine Leichtfertigkeitsstrafbarkeit des Verteidigers) übernommen. Die Beschränkung hat das BVerfG 2015 (2 BvR 2558/14 u. a.) auch auf die Verschleierungsvarianten erstreckt. Die Annahme des Honorars ist ein Sich-Verschaffen des Gegenstands. Sie
    zeigt, dass der weite Tatbestand der Geldwäsche im Einzelfall verfassungskonform einzuschränken
    ist.
  norms:
  - § 261 StGB
  - Art. 12 Abs. 1 GG
  quellen:
  - StGB, amtliche Fassung
  - BVerfGE 110, 226
  - Eigenformulierung Redaktion
  stand: 2026-10
- slug: sr-gw-vortaeter-privileg
  type: streitstand
  front: >-
    Wie wird die Strafbarkeit des Vortäters und Vortatbeteiligten wegen Geldwäsche (Selbstgeldwäsche)
    behandelt?
  back: >-
    Nach § 261 Abs. 7 StGB wird wegen Geldwäsche nur bestraft, wer wegen Beteiligung an der Vortat strafbar ist, wenn er den Gegenstand in den Verkehr bringt und dabei die Herkunft verschleiert (Selbstgeldwäsche-Privileg); sonst bleibt er straflos. Der Grund liegt darin, dass die Strafe für die
    Vortat den Unrechtsgehalt der bloßen Sicherung und Verwertung der Beute miterfasst
    ("mitbestrafte Nachtat"). Das Privileg gilt nicht, wenn der Vortatbeteiligte den Gegenstand
    in den Verkehr bringt und dabei die rechtswidrige Herkunft verschleiert; dann ist er auch
    wegen Geldwäsche strafbar. In der Klausur ist die Vortatbeteiligung stets
    zu prüfen. Wer nicht an der Vortat beteiligt ist, kann ohne Einschränkung Täter sein.
  norms:
  - § 261 StGB
  quellen:
  - StGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-10
- slug: sr-gw-abgrenzung-hehlerei
  type: definition
  front: >-
    Wie unterscheiden sich Geldwäsche (§ 261 StGB) und Hehlerei (§ 259 StGB)?
  back: >-
    Die Hehlerei (§ 259 StGB) setzt eine Sache voraus, die ein anderer gestohlen oder sonst
    durch eine gegen fremdes Vermögen gerichtete rechtswidrige Tat erlangt hat. Sie schützt
    vor der Aufrechterhaltung der rechtswidrigen Vermögenslage (Perpetuierung) und verlangt
    ein einverständliches, abgeleitetes Erwerben (Ankaufen, Sich-Verschaffen) oder Absetzen(-Helfen).
    Die Geldwäsche erfasst dagegen jeden Gegenstand aus jeder rechtswidrigen Tat und schützt
    vorrangig die Rechtspflege; Handlungen sind auch Verbergen, Verwahren oder Verwenden.
    Eine bloße Verwahrung ohne eigene Verfügungsgewalt ist daher regelmäßig Geldwäsche, aber
    keine Hehlerei. Beide Delikte können in Tateinheit stehen (§ 52 StGB), wenn dieselbe Handlung
    beide Tatbestände erfüllt. Die Hehlerei verlangt außerdem Bereicherungsabsicht, die Geldwäsche
    Kenntnis oder (bei den übrigen Handlungen) Vorsatz hinsichtlich der Herkunft.
  norms:
  - § 261 StGB
  - § 259 StGB
  - § 52 StGB
  quellen:
  - StGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-10
- slug: sr-gw-konkurrenz-strafzumessung
  type: norm
  front: >-
    Welche Rechtsfolgen und Konkurrenzen sind bei § 261 StGB zu beachten?
  back: >-
    Die Grundstrafe beträgt Freiheitsstrafe bis zu fünf Jahren oder Geldstrafe (Abs. 1); Verpflichtete nach § 2 GwG trifft Freiheitsstrafe von drei Monaten bis zu fünf Jahren (Abs. 4). In besonders schweren Fällen (Regelbeispiele: Gewerbsmäßigkeit, Bande) beträgt der Rahmen sechs Monate bis zehn Jahre (Abs. 5). Leichtfertige Geldwäsche (Abs. 6) wird mit Freiheitsstrafe bis zu zwei Jahren oder Geldstrafe bestraft. Daneben steht die Einziehung nach den §§ 73 ff. StGB. Der Versuch ist strafbar (Abs. 3). Nach Abs. 8 bleibt straffrei, wer die Tat freiwillig anzeigt oder eine Anzeige veranlasst, bevor die Tat entdeckt war, und in den Fällen des Abs. 1 oder 2 zusätzlich die Sicherstellung des Gegenstands bewirkt.
    In Konkurrenz zu §§ 257, 259 StGB (Begünstigung, Hehlerei) ist die Tateinheit in Betracht
    zu ziehen, da die Rechtsgüter unterschiedlich sind. Begünstigung (§ 257 StGB) und Geldwäsche
    unterscheiden sich in der Zielrichtung: Die Begünstigung will dem Vortäter die Vorteile
    sichern, die Geldwäsche die Herkunft verschleiern.
  norms:
  - § 261 StGB
  - § 257 StGB
  - § 259 StGB
  - §§ 73 ff. StGB
  quellen:
  - StGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-10
schemata:
- slug: sr-schema-261
  title: Geldwäsche, § 261 StGB
  quellen:
  - StGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-10
  norms:
  - § 261 StGB
  steps:
  - label: I. Tatbestand
    children:
    - label: 1. Objektiver Tatbestand
      children:
      - label: >-
          a) Tatobjekt: Gegenstand, der aus einer rechtswidrigen Tat herrührt
        hinweis: >-
          Seit 2021 jede rechtswidrige Tat (All-Crimes); Ordnungswidrigkeit genügt nicht;
          Surrogate und Vermischung beachten.
      - label: >-
          b) Tathandlung: Verbergen, Umtauschen/Übertragen/Verbringen (mit Vereitelungsabsicht),
          Verschaffen, Verwahren/Verwenden
    - label: 2. Subjektiver Tatbestand
      children:
      - label: >-
          a) Vorsatz; Kenntnis der Herkunft bei Verschaffen/Verwahren
      - label: >-
          b) Bei Nr. 2: Absicht, Auffinden, Einziehung oder Herkunftsermittlung zu vereiteln
  - label: II. Rechtswidrigkeit
  - label: III. Schuld
  - label: 'IV. Persönliche Ausnahmen: Vortatbeteiligung'
    hinweis: >-
      Prüfen, ob der Täter an der Vortat beteiligt war und wie weit die Privilegierung reicht;
      Verteidigerhonorar: sichere Kenntnis nötig.
  - label: V. Leichtfertigkeitsvariante
    hinweis: >-
      Nur prüfen, wenn Vorsatz bezüglich der Herkunft fehlt.
  - label: VI. Konkurrenzen
    hinweis: >-
      Hehlerei, Begünstigung, Betrug: Abgrenzung nach Tathandlung und Schutzgut.
faelle:
- slug: sr-fall-gw-bargeld-wohnung
  title: Das Bargeld im Wäscheschrank
  difficulty: 3
  minutes: 40
  quellen:
  - Eigener Sachverhalt der Redaktion
  - StGB, amtliche Fassung
  facts: >-
    A erlangt durch einen betrügerischen Verkauf gefälschter Eintrittskarten 10.000 Euro in
    bar. Er bittet seinen Freund F, dem er den Betrug offen schildert, das Geld für einige
    Wochen in dessen Wohnung aufzubewahren, bis "Gras über die Sache gewachsen" sei. F willigt
    ein und legt das Bargeld in seinen Wäscheschrank. F will das Geld nicht für sich verwenden
    und erhält auch keine Gegenleistung. Er rechnet nicht mit der Rückgabe an die Betrogenen.
    Nach drei Wochen holt A das Geld ab.
  question: >-
    Hat sich F wegen Geldwäsche nach § 261 StGB strafbar gemacht? Hat er sich wegen Hehlerei
    nach § 259 StGB strafbar gemacht?
  steps:
  - prompt: Rührt das Geld aus einer rechtswidrigen Tat her?
    erwartung: >-
      Ja - die 10.000 Euro sind Ertrag eines vollendeten Betrugs (§ 263 StGB) des A und damit
      ein Gegenstand, der aus einer rechtswidrigen Tat herrührt. Auf einen Vortatenkatalog
      kommt es seit der Reform 2021 nicht mehr an.
  - prompt: Welche Tathandlung hat F vorgenommen?
    erwartung: >-
      F hat das Geld verwahrt, § 261 Abs. 1 Nr. 4 StGB. Verbergen nach Nr. 1 kommt daneben in
      Betracht, weil er es im Wäscheschrank versteckt.
  - prompt: Kannte F die Herkunft?
    erwartung: >-
      Ja - A hat ihm den Betrug offen geschildert; F handelte mit Kenntnis und Vorsatz.
  - prompt: Liegt auch Hehlerei nach § 259 StGB vor?
    erwartung: >-
      Nein - F hat sich die Sache nicht verschafft, weil er keine eigene Verfügungsgewalt
      erlangt hat, und hat auch nicht abgesetzt oder beim Absatz geholfen. Eine bloße Verwahrung
      genügt für § 259 StGB nicht.
  - prompt: Ergebnis?
    erwartung: >-
      F ist wegen Geldwäsche nach § 261 Abs. 1 StGB (Verwahren in Kenntnis der Herkunft) strafbar.
      Eine Strafbarkeit nach § 259 StGB scheidet aus.
  expectation:
    pruefpunkte:
    - id: p1
      label: >-
        Herrühren: Geld aus Betrug als Gegenstand aus rechtswidriger Tat (kein Vortatenkatalog
        mehr)
      weight: 2.0
      required: true
      norms:
      - § 261 StGB
      - § 263 StGB
      keywords:
