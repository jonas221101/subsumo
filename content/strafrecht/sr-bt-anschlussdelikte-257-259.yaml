- slug: sr-schema-259
  title: Hehlerei, § 259 StGB, mit Abgrenzung zu §§ 257, 258 StGB
  norms:
  - § 259 StGB
  - § 257 StGB
  - § 258 StGB
  quellen:
  - StGB, amtliche Fassung
