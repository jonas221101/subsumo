faelle:
- slug: sr-fall-sitzblockade-werkstor
  title: Die Sitzblockade vor dem Werkstor
  difficulty: 3
  minutes: 40
  quellen:
  - Eigener Sachverhalt der Redaktion
  - StGB, amtliche Fassung
  facts: A nimmt an einer Protestkundgebung gegen die Geschäftspraxis eines Unternehmens
    teil und setzt sich zusammen mit anderen Demonstranten auf die Fahrbahn unmittelbar
    vor die Zufahrt zum Werksgelände. Der herannahende LKW-Fahrer F muss unmittelbar
    vor den sitzenden Demonstranten anhalten, weil er sonst über sie hinwegfahren
    müsste. Im Laufe der nächsten Minuten reihen sich hinter F weitere Fahrzeuge
    auf; deren Fahrer, darunter N, kommen an F nicht vorbei und bleiben ebenfalls
    stehen, ohne selbst von Demonstranten blockiert zu sein. Die Blockade dauert 20
    Minuten, bis die Polizei die Sitzenden wegträgt.
  question: Hat sich A gegenüber F und gegenüber N jeweils wegen Nötigung gemäß
    § 240 Abs. 1 StGB strafbar gemacht?
  steps:
  - prompt: Formuliere den Obersatz für das Verhältnis A/F.
    erwartung: A könnte sich durch das Sitzen vor dem Fahrzeug des F wegen Nötigung
      gemäß § 240 Abs. 1 StGB strafbar gemacht haben.
  - prompt: Liegt gegenüber F Gewalt vor?
    erwartung: 'Ja - die körperliche Anwesenheit der Sitzenden vor dem Fahrzeug entfaltet
      eine körperlich vermittelte Zwangswirkung: F kann nur über Personen hinwegfahren,
      um weiterzukommen.'
  - prompt: Liegt gegenüber F ein Nötigungserfolg vor?
    erwartung: Ja - F unterlässt die Weiterfahrt, weil er durch die Blockade dazu
      gezwungen wird.
  - prompt: Ist die Tat gegenüber F auch verwerflich i.S.d. § 240 Abs. 2 StGB?
    erwartung: Im Ergebnis ja - bei einer längeren, gezielten Blockade eines Einzelnen
      überwiegt regelmäßig das Interesse an ungehinderter Fortbewegung gegenüber
      dem Protestanliegen.
  - prompt: Formuliere den Obersatz für das Verhältnis A/N.
    erwartung: A könnte sich auch gegenüber N wegen Nötigung gemäß § 240 Abs.
      1 StGB strafbar gemacht haben.
  - prompt: Liegt gegenüber N Gewalt vor?
    erwartung: Nein - N wird nicht durch die körperliche Anwesenheit der Demonstranten,
      sondern nur durch das vor ihm stehende Fahrzeug des F am Weiterfahren gehindert.
      Diese Zwangswirkung ist nur psychisch vermittelt und erfüllt nach der Zweite-Reihe-Rechtsprechung
      des Bundesverfassungsgerichts nicht den Gewaltbegriff des § 240 Abs. 1 StGB.
  - prompt: Formuliere das Ergebnis.
    erwartung: A hat sich gegenüber F wegen Nötigung gemäß § 240 Abs. 1 StGB strafbar
      gemacht, gegenüber N mangels Gewalt dagegen nicht.
  expectation:
    pruefpunkte:
