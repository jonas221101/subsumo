cards:
- slug: sr-noetigung-gewaltbegriff
  type: definition
  front: 'Definiere: Gewalt i.S.d. § 240 Abs. 1 StGB'
  back: Gewalt ist der Einsatz körperlicher Kraft durch den Täter, der beim Opfer
    eine körperlich (nicht nur psychisch) vermittelte Zwangswirkung entfaltet. Eine
    rein psychisch vermittelte Zwangswirkung - etwa bloßer Konformitätsdruck durch
    die Anwesenheit anderer - genügt nach der einschränkenden Rechtsprechung des
    Bundesverfassungsgerichts nicht.
  norms:
  - § 240 Abs. 1 StGB
  quellen:
  - StGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sr-noetigung-drohung-empfindliches-uebel
  type: definition
  front: 'Definiere: Drohung mit einem empfindlichen Übel, § 240 Abs. 1 StGB'
  back: Eine Drohung ist das In-Aussicht-Stellen eines künftigen Übels, auf dessen
    Eintritt der Drohende Einfluss zu haben vorgibt. Empfindlich ist das Übel, wenn
    es geeignet ist, einen besonnenen Menschen in der Lage des Bedrohten zu dem vom
    Täter verlangten Verhalten zu bestimmen.
  norms:
  - § 240 Abs. 1 StGB
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sr-noetigung-noetigungserfolg
  type: definition
  front: Was verlangt der Nötigungserfolg des § 240 Abs. 1 StGB und was folgt aus
    § 240 Abs. 3 StGB?
  back: '§ 240 StGB ist Erfolgsdelikt: Das Opfer muss durch das Nötigungsmittel tatsächlich
    zu einer Handlung, Duldung oder Unterlassung bestimmt worden sein - zwischen Nötigungsmittel
    und -erfolg muss ein Kausalzusammenhang bestehen. Bleibt dieser Erfolg aus, ist
    die Tat nicht vollendet; § 240 Abs. 3 StGB stellt jedoch den Versuch der Nötigung
    ausdrücklich unter Strafe.'
  norms:
  - § 240 Abs. 1 StGB
  - § 240 Abs. 3 StGB
  quellen:
  - StGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sr-noetigung-verwerflichkeit
  type: definition
  front: Welche Funktion hat die Verwerflichkeitsklausel des § 240 Abs. 2 StGB?
  back: '§ 240 Abs. 2 StGB macht die Rechtswidrigkeit von einer Zweck-Mittel-Relation
    abhaengig: Auch wenn Nötigungsmittel und verfolgter Zweck für sich genommen
    erlaubt sind, kann ihre konkrete Verknüpfung als verwerflich - in besonderem
    Masse sozialwidrig - erscheinen und die Tat rechtswidrig machen. Es handelt sich
    um ein eigenständiges Rechtswidrigkeitsmerkmal, nicht um ein Element des Tatbestands.'
  norms:
  - § 240 Abs. 2 StGB
  quellen:
  - StGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sr-noetigung-sitzblockade-zweite-reihe
  type: rechtsprechung
  front: Was besagt die 'Zweite-Reihe-Rechtsprechung' des Bundesverfassungsgerichts
    zu Sitzblockaden?
  back: 'Bei Sitzblockaden liegt gegenüber dem unmittelbar blockierten Fahrzeugführer
    Gewalt vor, weil dieser durch die körperliche Anwesenheit der Sitzenden physisch
    am Weiterfahren gehindert wird. Gegenüber nachfolgenden Fahrzeugführern, die
    nur durch das vor ihnen stehende (nicht selbst blockierte) Fahrzeug am Weiterfahren
    gehindert werden, fehlt es dagegen an Gewalt: die auf sie wirkende Zwangswirkung
    ist nur psychisch vermittelt. Ein weiter, ''vergeistigter'' Gewaltbegriff, der
    auch diese Fälle erfasst, verstößt gegen das strafrechtliche Bestimmtheitsgebot
    des Art. 103 Abs. 2 GG.'
  norms:
  - § 240 Abs. 1 StGB
  - Art. 103 Abs. 2 GG
  quellen:
  - BVerfGE, amtliche Sammlung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sr-noetigung-verwerflichkeit-sozialadaequanz
  type: streitstand
  front: Wann fehlt es trotz eingesetzter Drohung an der Verwerflichkeit i.S.d. §
    240 Abs. 2 StGB?
  back: Nicht jede Ankündigung eines Übels ist verwerflich. Setzt der Täter ein
    an sich zulässiges Mittel zur Durchsetzung eines sachlich damit zusammenhängenden,
    billigenswerten Zwecks ein - etwa die Ankündigung einer Strafanzeige, um einen
    bestehenden und fälligen Schadensersatzanspruch durchzusetzen - fehlt es regelmäßig
    an der Verwerflichkeit. Verwerflich wird die Verknüpfung erst, wenn zwischen
    dem angedrohten Übel und dem verfolgten Zweck kein innerer Zusammenhang mehr
    besteht oder das Mittel zur Durchsetzung eines nicht zu beanstandenden Zwecks
    unverhältnismäßig ist.
  norms:
  - § 240 Abs. 2 StGB
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sr-noetigung-besonders-schwere-faelle
  type: norm
  front: Was regelt § 240 Abs. 4 StGB?
  back: § 240 Abs. 4 StGB erhöht den Strafrahmen für besonders schwere Fälle auf
    Freiheitsstrafe von sechs Monaten bis zu fünf Jahren. Ein besonders schwerer
    Fall liegt in der Regel vor, wenn der Täter eine Schwangere nötigt, den Schwangerschaftsabbruch
    vornehmen zu lassen (§ 240 Abs. 4 Satz 2 Nr. 1 StGB), oder seine Befugnisse oder
    seine Stellung als Amtsträger missbraucht (§ 240 Abs. 4 Satz 2 Nr. 2 StGB).
  norms:
  - § 240 Abs. 4 Satz 2 Nr. 1 StGB
  - § 240 Abs. 4 Satz 2 Nr. 2 StGB
  quellen:
  - StGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
