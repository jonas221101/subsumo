      - sr-noetigung-sitzblockade-zweite-reihe
    - id: p5
      label: Bezug zur Zweite-Reihe-Rechtsprechung / Bestimmtheitsgebot, Art. 103
        Abs. 2 GG
      weight: 1.5
      required: false
      norms:
      - Art. 103 Abs. 2 GG
      keywords:
