cards:
- slug: sr-noetigung-gewaltbegriff
  type: definition
  front: 'Definiere: Gewalt i.S.d. § 240 Abs. 1 StGB'
  back: Gewalt ist der Einsatz koerperlicher Kraft durch den Taeter, der beim Opfer
    eine koerperlich (nicht nur psychisch) vermittelte Zwangswirkung entfaltet. Eine
    rein psychisch vermittelte Zwangswirkung - etwa blosser Konformitaetsdruck durch
    die Anwesenheit anderer - genuegt nach der einschraenkenden Rechtsprechung des
    Bundesverfassungsgerichts nicht.
  norms:
  - § 240 Abs. 1 StGB
  quellen:
  - StGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sr-noetigung-drohung-empfindliches-uebel
  type: definition
  front: 'Definiere: Drohung mit einem empfindlichen Uebel, § 240 Abs. 1 StGB'
  back: Eine Drohung ist das In-Aussicht-Stellen eines kuenftigen Uebels, auf dessen
    Eintritt der Drohende Einfluss zu haben vorgibt. Empfindlich ist das Uebel, wenn
    es geeignet ist, einen besonnenen Menschen in der Lage des Bedrohten zu dem vom
    Taeter verlangten Verhalten zu bestimmen.
  norms:
  - § 240 Abs. 1 StGB
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sr-noetigung-noetigungserfolg
  type: definition
  front: Was verlangt der Noetigungserfolg des § 240 Abs. 1 StGB und was folgt aus
    § 240 Abs. 3 StGB?
  back: '§ 240 StGB ist Erfolgsdelikt: Das Opfer muss durch das Noetigungsmittel tatsaechlich
    zu einer Handlung, Duldung oder Unterlassung bestimmt worden sein - zwischen Noetigungsmittel
    und -erfolg muss ein Kausalzusammenhang bestehen. Bleibt dieser Erfolg aus, ist
    die Tat nicht vollendet; § 240 Abs. 3 StGB stellt jedoch den Versuch der Noetigung
    ausdruecklich unter Strafe.'
  norms:
  - § 240 Abs. 1 StGB
  - § 240 Abs. 3 StGB
  quellen:
  - StGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sr-noetigung-verwerflichkeit
  type: definition
  front: Welche Funktion hat die Verwerflichkeitsklausel des § 240 Abs. 2 StGB?
  back: '§ 240 Abs. 2 StGB macht die Rechtswidrigkeit von einer Zweck-Mittel-Relation
    abhaengig: Auch wenn Noetigungsmittel und verfolgter Zweck fuer sich genommen
    erlaubt sind, kann ihre konkrete Verknuepfung als verwerflich - in besonderem
    Masse sozialwidrig - erscheinen und die Tat rechtswidrig machen. Es handelt sich
    um ein eigenstaendiges Rechtswidrigkeitsmerkmal, nicht um ein Element des Tatbestands.'
  norms:
  - § 240 Abs. 2 StGB
  quellen:
  - StGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sr-noetigung-sitzblockade-zweite-reihe
  type: rechtsprechung
  front: Was besagt die 'Zweite-Reihe-Rechtsprechung' des Bundesverfassungsgerichts
    zu Sitzblockaden?
  back: 'Bei Sitzblockaden liegt gegenueber dem unmittelbar blockierten Fahrzeugfuehrer
    Gewalt vor, weil dieser durch die koerperliche Anwesenheit der Sitzenden physisch
    am Weiterfahren gehindert wird. Gegenueber nachfolgenden Fahrzeugfuehrern, die
    nur durch das vor ihnen stehende (nicht selbst blockierte) Fahrzeug am Weiterfahren
    gehindert werden, fehlt es dagegen an Gewalt: die auf sie wirkende Zwangswirkung
    ist nur psychisch vermittelt. Ein weiter, ''vergeistigter'' Gewaltbegriff, der
    auch diese Faelle erfasst, verstoesst gegen das strafrechtliche Bestimmtheitsgebot
    des Art. 103 Abs. 2 GG.'
  norms:
  - § 240 Abs. 1 StGB
  - Art. 103 Abs. 2 GG
  quellen:
  - BVerfGE, amtliche Sammlung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sr-noetigung-verwerflichkeit-sozialadaequanz
  type: streitstand
  front: Wann fehlt es trotz eingesetzter Drohung an der Verwerflichkeit i.S.d. §
    240 Abs. 2 StGB?
  back: Nicht jede Ankuendigung eines Uebels ist verwerflich. Setzt der Taeter ein
    an sich zulaessiges Mittel zur Durchsetzung eines sachlich damit zusammenhaengenden,
    billigenswerten Zwecks ein - etwa die Ankuendigung einer Strafanzeige, um einen
    bestehenden und faelligen Schadensersatzanspruch durchzusetzen - fehlt es regelmaessig
    an der Verwerflichkeit. Verwerflich wird die Verknuepfung erst, wenn zwischen
    dem angedrohten Uebel und dem verfolgten Zweck kein innerer Zusammenhang mehr
    besteht oder das Mittel zur Durchsetzung eines nicht zu beanstandenden Zwecks
    unverhaeltnismaessig ist.
  norms:
  - § 240 Abs. 2 StGB
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sr-noetigung-besonders-schwere-faelle
  type: norm
  front: Was regelt § 240 Abs. 4 StGB?
  back: § 240 Abs. 4 StGB erhoeht den Strafrahmen fuer besonders schwere Faelle auf
    Freiheitsstrafe von sechs Monaten bis zu fuenf Jahren. Ein besonders schwerer
    Fall liegt in der Regel vor, wenn der Taeter eine Schwangere noetigt, den Schwangerschaftsabbruch
    vornehmen zu lassen (§ 240 Abs. 4 Satz 2 Nr. 1 StGB), oder seine Befugnisse oder
    seine Stellung als Amtstraeger missbraucht (§ 240 Abs. 4 Satz 2 Nr. 2 StGB).
  norms:
  - § 240 Abs. 4 Satz 2 Nr. 1 StGB
  - § 240 Abs. 4 Satz 2 Nr. 2 StGB
  quellen:
  - StGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
