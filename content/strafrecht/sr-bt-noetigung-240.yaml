      keywords:
      - Gewalt
      - körperlich
      card_slugs:
      - sr-noetigung-gewaltbegriff
    - id: p2
      label: Nötigungserfolg bei F erkannt (Unterlassen der Weiterfahrt)
      weight: 1.0
