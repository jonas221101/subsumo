faelle:
- slug: sr-fall-sitzblockade-werkstor
  title: Die Sitzblockade vor dem Werkstor
  difficulty: 3
  minutes: 40
  quellen:
  - Eigener Sachverhalt der Redaktion
  - StGB, amtliche Fassung
  facts: A nimmt an einer Protestkundgebung gegen die Geschaeftspraxis eines Unternehmens
    teil und setzt sich zusammen mit anderen Demonstranten auf die Fahrbahn unmittelbar
    vor die Zufahrt zum Werksgelaende. Der herannahende LKW-Fahrer F muss unmittelbar
    vor den sitzenden Demonstranten anhalten, weil er sonst ueber sie hinwegfahren
    muesste. Im Laufe der naechsten Minuten reihen sich hinter F weitere Fahrzeuge
    auf; deren Fahrer, darunter N, kommen an F nicht vorbei und bleiben ebenfalls
    stehen, ohne selbst von Demonstranten blockiert zu sein. Die Blockade dauert 20
    Minuten, bis die Polizei die Sitzenden wegtraegt.
  question: Hat sich A gegenueber F und gegenueber N jeweils wegen Noetigung gemaess
    § 240 Abs. 1 StGB strafbar gemacht?
  steps:
  - prompt: Formuliere den Obersatz fuer das Verhaeltnis A/F.
    erwartung: A koennte sich durch das Sitzen vor dem Fahrzeug des F wegen Noetigung
      gemaess § 240 Abs. 1 StGB strafbar gemacht haben.
  - prompt: Liegt gegenueber F Gewalt vor?
    erwartung: 'Ja - die koerperliche Anwesenheit der Sitzenden vor dem Fahrzeug entfaltet
      eine koerperlich vermittelte Zwangswirkung: F kann nur ueber Personen hinwegfahren,
      um weiterzukommen.'
  - prompt: Liegt gegenueber F ein Noetigungserfolg vor?
    erwartung: Ja - F unterlaesst die Weiterfahrt, weil er durch die Blockade dazu
      gezwungen wird.
  - prompt: Ist die Tat gegenueber F auch verwerflich i.S.d. § 240 Abs. 2 StGB?
    erwartung: Im Ergebnis ja - bei einer laengeren, gezielten Blockade eines Einzelnen
      ueberwiegt regelmaessig das Interesse an ungehinderter Fortbewegung gegenueber
      dem Protestanliegen.
  - prompt: Formuliere den Obersatz fuer das Verhaeltnis A/N.
    erwartung: A koennte sich auch gegenueber N wegen Noetigung gemaess § 240 Abs.
      1 StGB strafbar gemacht haben.
  - prompt: Liegt gegenueber N Gewalt vor?
    erwartung: Nein - N wird nicht durch die koerperliche Anwesenheit der Demonstranten,
      sondern nur durch das vor ihm stehende Fahrzeug des F am Weiterfahren gehindert.
      Diese Zwangswirkung ist nur psychisch vermittelt und erfuellt nach der Zweite-Reihe-Rechtsprechung
      des Bundesverfassungsgerichts nicht den Gewaltbegriff des § 240 Abs. 1 StGB.
  - prompt: Formuliere das Ergebnis.
    erwartung: A hat sich gegenueber F wegen Noetigung gemaess § 240 Abs. 1 StGB strafbar
      gemacht, gegenueber N mangels Gewalt dagegen nicht.
  expectation:
    pruefpunkte:
    - id: p1
      label: Gewalt gegenueber F bejaht (koerperlich vermittelte Zwangswirkung)
      weight: 2.5
      required: true
      norms:
      - § 240 Abs. 1 StGB
      keywords:
      - Gewalt
      - koerperlich
    - id: p2
      label: Noetigungserfolg bei F erkannt (Unterlassen der Weiterfahrt)
      weight: 1.0
      required: false
      keywords:
      - Noetigungserfolg
      - Weiterfahrt
    - id: p3
      label: Verwerflichkeit gegenueber F angesprochen und begruendet
      weight: 1.5
      required: false
      norms:
      - § 240 Abs. 2 StGB
      keywords:
      - verwerflich
    - id: p4
      label: Gewalt gegenueber N verneint mit Begruendung (nur psychisch vermittelte
        Zwangswirkung durch das stehende Fahrzeug)
      weight: 3.0
      required: true
      norms:
      - § 240 Abs. 1 StGB
      keywords:
      - psychisch vermittelt
      - keine Gewalt
    - id: p5
      label: Bezug zur Zweite-Reihe-Rechtsprechung / Bestimmtheitsgebot, Art. 103
        Abs. 2 GG
      weight: 1.5
      required: false
      norms:
      - Art. 103 Abs. 2 GG
      keywords:
      - Bestimmtheitsgebot
      - Zweite-Reihe
    - id: p6
      label: 'Differenziertes Ergebnis: strafbar ggue. F, nicht strafbar ggue. N'
      weight: 1.0
      required: false
      keywords:
      - gegenueber F
      - gegenueber N
