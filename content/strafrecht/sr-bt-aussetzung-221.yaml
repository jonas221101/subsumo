      - label: "b) Tathandlung"
        children:
        - label: "aa) Nr. 1: Versetzen in eine hilflose Lage (aktives Tun)"
        - label: "bb) Nr. 2: Im-Stich-Lassen in hilfloser Lage bei Obhut oder Beistandspflicht (Unterlassen)"
          hinweis: >-
            Garantenstellung/Obhut prüfen; räumliche Trennung nur bei Anlass
            erörtern.
      - label: "c) Hilflose Lage"
      - label: "d) Kausal herbeigeführte konkrete Gefahr des Todes oder einer schweren Gesundheitsschädigung"
        hinweis: >-
          Konkrete Gefahr: Eintritt der Verletzung hängt vom Zufall ab.
    - label: "2. Subjektiver Tatbestand: Vorsatz bezüglich aller Merkmale einschließlich Gefahr"
      hinweis: >-
        Bedingter Vorsatz genügt.
