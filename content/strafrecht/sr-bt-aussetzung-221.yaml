    hinweis: >-
      Eigenes Kind/anvertraute Person, schwere Gesundheitsschädigung,
      Todesverursachung (§ 18 StGB).
  - label: "V. Konkurrenzen"
    hinweis: >-
      Zu §§ 323c, 171, 225 und den Verletzungs-/Tötungsdelikten durch
      Unterlassen.
faelle:
- slug: sr-aussetz-fall-balkon
  title: "Das Kind auf dem Balkon"
  difficulty: 3
  minutes: 40
  quellen:
  - "Eigener Sachverhalt der Redaktion"
  stand: 2026-10
  facts: >-
    M ist alleinerziehende Mutter eines zweijährigen Sohnes S. Sie wohnt mit S
    in einer Wohnung im vierten Stock; zur Wohnung gehört ein Balkon, dessen
    Brüstung nur hüfthoch ist. S kann seit einigen Wochen selbstständig die
    Balkontür öffnen, was M weiß. Eines Abends möchte M ausgehen und findet
    keine Betreuung. Sie lässt S schlafend allein zurück, schließt die
    Wohnungstür ab und lässt die Balkontür unverschlossen; sie rechnet damit,
    dass S nicht aufwachen wird, hält es aber für möglich und nimmt das hin.
    Nach etwa zwei Stunden erwacht S, öffnet die Balkontür, tritt auf den Balkon
    und versucht, auf einen dort stehenden Stuhl zu klettern. Ein Nachbar
    bemerkt dies, alarmiert die Feuerwehr und rettet S durch Klingeln und
    Eindringen in die Wohnung rechtzeitig. S bleibt unverletzt.
  question: >-
    Wie hat sich M nach § 221 StGB strafbar gemacht? Tötungs- und
    Körperverletzungsdelikte sowie §§ 171 und 323c StGB sind nicht zu prüfen.
  steps:
  - prompt: >-
      Welche Variante des § 221 Abs. 1 StGB kommt in Betracht und warum?
    erwartung: >-
      In Betracht kommt Nr. 2 (Im-Stich-Lassen). S war als Zweijähriger allein
      in der Wohnung bereits hilflos; M hat ihn nicht erst in diese Lage
      versetzt (Nr. 1 scheidet aus), sondern ihn in seiner hilflosen Lage allein
      gelassen. M ist als Mutter Obhutspflichtige (§ 1626 BGB) und Garantin.
  - prompt: >-
      Ist S der Gefahr des Todes oder einer schweren Gesundheitsschädigung
      ausgesetzt worden?
    erwartung: >-
      Ja. Durch die unverschlossene Balkontür im vierten Stock bei hüfthoher
      Brüstung bestand eine konkrete Gefahr eines Sturzes mit tödlichen oder
      schweren Verletzungen; es war nur dem rettenden Eingreifen des Nachbarn zu
      verdanken, dass nichts geschah.
  - prompt: >-
      Handelte M vorsätzlich?
    erwartung: >-
      Ja, mit bedingtem Vorsatz. M wusste, dass S die Tür öffnen kann, hielt
      sein Erwachen für möglich und nahm die Gefahr billigend in Kauf. Ein
      Vertrauen auf ein Ausbleiben der Gefahr (bewusste Fahrlässigkeit) ist
      angesichts des Wissens nicht plausibel.
  - prompt: >-
      Welche Qualifikation ist einschlägig?
    erwartung: >-
      § 221 Abs. 2 Nr. 1 StGB: Die Tat richtet sich gegen das eigene Kind. Eine
      schwere Gesundheitsschädigung (Abs. 2 Nr. 2) oder der Tod (Abs. 3) sind
      nicht eingetreten. Rechtfertigungs- oder Entschuldigungsgründe liegen
      nicht vor; der Mangel an Betreuung rechtfertigt das Alleinlassen nicht.
