      § 242 StGB) tatbestandlich erfuellt ist.
faelle:
- slug: sr-fall-verkauftes-rennrad
  title: Das verkaufte Rennrad
  difficulty: 2
  minutes: 35
  quellen:
  - Eigener Sachverhalt der Redaktion
  - StGB, amtliche Fassung
  facts: A leiht sich von seinem Freund B dessen hochwertiges Rennrad fuer ein Wochenende,
    um an einem Amateurrennen teilzunehmen. Beide vereinbaren, dass A das Rad am Sonntagabend
    zurueckgibt. Am Montag verkauft A das Rad stattdessen ueber ein Online-Verkaufsportal
    an den gutglaeubigen Dritten C, weil er dringend Geld benoetigt.
  question: Hat sich A gegenueber B wegen (veruntreuender) Unterschlagung gemaess
    § 246 StGB strafbar gemacht?
  steps:
  - prompt: Formuliere den Obersatz.
    erwartung: A koennte sich durch den Verkauf des Rennrads wegen Unterschlagung
      gemaess § 246 Abs. 1, Abs. 2 StGB strafbar gemacht haben.
  - prompt: Ist das Rennrad eine fremde bewegliche Sache?
    erwartung: Ja - es steht im Eigentum des B.
  - prompt: Liegt eine Zueignung vor?
    erwartung: Ja - durch den Verkauf an C hat A seinen Willen, das Rad dauerhaft
      dem eigenen Vermoegen einzuverleiben und B davon dauerhaft auszuschliessen,
      nach aussen manifestiert.
  - prompt: War das Rad dem A anvertraut, § 246 Abs. 2 StGB?
    erwartung: Ja - A hatte das Rad aufgrund der Leihabrede mit B, also eines Vertrauensverhaeltnisses,
      in Besitz, mit der Massgabe, es zurueckzugeben.
  - prompt: Ist § 246 StGB gegenueber einem Diebstahl, § 242 StGB, subsidiaer verdraengt?
    erwartung: Nein - A hatte das Rad bereits rechtmaessig im eigenen Gewahrsam, es
      fehlt an einem Gewahrsamsbruch. Ein Diebstahl scheidet daher aus, § 246 StGB
      bleibt anwendbar.
  - prompt: Formuliere das Ergebnis.
    erwartung: A hat sich gegenueber B wegen veruntreuender Unterschlagung gemaess
      § 246 Abs. 1, Abs. 2 StGB strafbar gemacht.
