cards:
- slug: sr-unterschlagung-zueignungsbegriff
  type: definition
  front: 'Definiere: Zueignung i.S.d. § 246 StGB (Manifestationstheorie)'
  back: Nach der herrschenden Manifestationstheorie erfordert die Zueignung i.S.d.
    § 246 StGB ein nach außen tretendes Verhalten des Täters, das seinen Willen
    erkennbar macht, die Sache oder den in ihr verkörperten Wert dauerhaft dem eigenen
    Vermögen einzuverleiben und den Eigentümer dauerhaft von seiner Position auszuschließen.
    Ein bloß innerer Vorbehalt ohne erkennbare Betätigung genügt nicht.
  norms:
  - § 246 Abs. 1 StGB
  quellen:
  - StGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sr-unterschlagung-manifestation-beispiele
  type: streitstand
  front: Welche Verhaltensweisen manifestieren typischerweise den Züignungswillen
    bei § 246 StGB?
  back: Als Manifestation anerkannt sind insbesondere die Weiterveräußerung oder
    Verpfändung der Sache, ihr Verbrauch oder Einbau in eine eigene Sache sowie die
    endgültige Weigerung, die Sache trotz Herausgabeverlangens des Berechtigten herauszugeben,
    wenn sie mit einer Berühmung eigener Berechtigung verbunden ist. Bloßes Nichtstun
    oder ein nur vorläufiges Behalten der Sache genügt dagegen grundsätzlich nicht.
  norms:
  - § 246 Abs. 1 StGB
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sr-unterschlagung-subsidiaritaetsklausel
  type: norm
  front: Was bewirkt die Subsidiaritätsklausel des § 246 Abs. 1 a. E. StGB?
  back: § 246 StGB tritt zurück, wenn die Tat zugleich einen anderen, schwerer bestraften
    Züignungstatbestand erfüllt - insbesondere Diebstahl, § 242 StGB. Die Klausel
    verhindert, dass der Auffangtatbestand der Unterschlagung neben einer spezielleren
    und schwerer bedrohten Züignungsvorschrift eigenständig zur Anwendung kommt.
  norms:
  - § 246 Abs. 1 StGB
  - § 242 StGB
  quellen:
  - StGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sr-unterschlagung-anvertrautsein
  type: definition
  front: 'Definiere: Anvertrautsein i.S.d. § 246 Abs. 2 StGB'
  back: Anvertraut ist eine Sache, wenn der Täter die tatsächliche Gewalt über
    sie aufgrund eines vom Berechtigten gebilligten Vertrauensverhältnisses erlangt
    hat, mit der Maßgabe, sie in dessen Interesse zu verwenden, zu verwahren oder
    zurückzugeben. Ein rein tatsächliches Näheverhältnis ohne ein solches Vertrauenselement
    genügt nicht.
  norms:
  - § 246 Abs. 2 StGB
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sr-unterschlagung-veruntreuende-qualifikation
  type: norm
  front: Welche Rechtsfolge hat die veruntreuende Unterschlagung nach § 246 Abs. 2
    StGB?
  back: Ist die unterschlagene Sache dem Täter anvertraut, erhöht sich der Strafrahmen
    gegenüber § 246 Abs. 1 StGB auf Freiheitsstrafe bis zu fünf Jahren oder Geldstrafe.
    Der Gesetzgeber trägt damit dem gesteigerten Unrechtsgehalt Rechnung, der im
    Missbrauch des besonderen Vertrauensverhältnisses liegt.
  norms:
  - § 246 Abs. 2 StGB
  quellen:
  - StGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sr-unterschlagung-abgrenzung-diebstahl-242
  type: definition
  front: 'Abgrenzung: Unterschlagung, § 246 StGB, und Diebstahl, § 242 StGB'
  back: '§ 242 StGB verlangt eine Wegnahme, also den Bruch fremden und die Begründung
    neuen Gewahrsams. § 246 StGB setzt dagegen keinen Gewahrsamsbruch voraus: Der
    Täter hat die Sache regelmäßig bereits selbst rechtmäßig in Gewahrsam oder
    Besitz - etwa als Finder, Mieter oder Entleiher - und muss sie sich lediglich
    noch durch eine nach außen tretende Handlung zueignen. § 246 StGB ist daher das
    Auffangdelikt für Züignungen ohne Gewahrsamsbruch.'
  norms:
  - § 242 StGB
  - § 246 Abs. 1 StGB
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sr-unterschlagung-subsidiaritaet-nichtverfolgbare-vortat
  type: streitstand
  front: Bleibt § 246 StGB auch subsidiär, wenn die vorrangige, schwerer bedrohte
    Tat im Einzelfall nicht verfolgbar ist (z. B. verjährt)?
  back: 'Nach ganz h.M. ist die Subsidiaritätsklausel des § 246 Abs. 1 a. E. StGB
    rein formell zu verstehen: Es genügt, dass der Täter tatbestandlich auch eine
    andere, schwerer bedrohte Züignungsvorschrift erfüllt hat. Auf die tatsächliche
    Verfolgbarkeit dieser Tat im Einzelfall - etwa bei Verjährung oder fehlendem
    Strafantrag - kommt es nicht an; § 246 StGB bleibt auch dann zurückgedrängt.'
  norms:
  - § 246 Abs. 1 StGB
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
schemata:
- slug: sr-schema-246
  title: Unterschlagung, § 246 StGB
  norms:
  - § 246 StGB
  quellen:
  - StGB, amtliche Fassung
  - Eigenformulierung Redaktion
  steps:
  - label: I. Tatbestand
    children:
    - label: 1. Fremde bewegliche Sache
    - label: 2. Zueignung (nach außen tretende Manifestation des Züignungswillens)
    - label: 3. Rechtswidrigkeit der Zueignung
    - label: '4. Qualifikation: Anvertrautsein, § 246 Abs. 2 StGB'
      hinweis: Nur prüfen, wenn der Sachverhalt ein Vertrauensverhältnis zeigt (z.
        B. Leihe, Verwahrung, Arbeitsverhältnis).
  - label: II. Rechtswidrigkeit
  - label: III. Schuld
  - label: IV. Subsidiarität, § 246 Abs. 1 a. E. StGB
    hinweis: Prüfen, ob eine andere, schwerer bedrohte Züignungsvorschrift (insb.
      § 242 StGB) tatbestandlich erfüllt ist.
faelle:
- slug: sr-fall-verkauftes-rennrad
  title: Das verkaufte Rennrad
  difficulty: 2
  minutes: 35
  quellen:
  - Eigener Sachverhalt der Redaktion
  - StGB, amtliche Fassung
  facts: A leiht sich von seinem Freund B dessen hochwertiges Rennrad für ein Wochenende,
    um an einem Amateurrennen teilzunehmen. Beide vereinbaren, dass A das Rad am Sonntagabend
    zurückgibt. Am Montag verkauft A das Rad stattdessen über ein Online-Verkaufsportal
    an den gutgläubigen Dritten C, weil er dringend Geld benötigt.
  question: Hat sich A gegenüber B wegen (veruntreuender) Unterschlagung gemäß
    § 246 StGB strafbar gemacht?
  steps:
  - prompt: Formuliere den Obersatz.
    erwartung: A könnte sich durch den Verkauf des Rennrads wegen Unterschlagung
      gemäß § 246 Abs. 1, Abs. 2 StGB strafbar gemacht haben.
  - prompt: Ist das Rennrad eine fremde bewegliche Sache?
    erwartung: Ja - es steht im Eigentum des B.
  - prompt: Liegt eine Zueignung vor?
    erwartung: Ja - durch den Verkauf an C hat A seinen Willen, das Rad dauerhaft
      dem eigenen Vermögen einzuverleiben und B davon dauerhaft auszuschließen,
      nach außen manifestiert.
  - prompt: War das Rad dem A anvertraut, § 246 Abs. 2 StGB?
    erwartung: Ja - A hatte das Rad aufgrund der Leihabrede mit B, also eines Vertrauensverhältnisses,
      in Besitz, mit der Maßgabe, es zurückzugeben.
  - prompt: Ist § 246 StGB gegenüber einem Diebstahl, § 242 StGB, subsidiär verdrängt?
    erwartung: Nein - A hatte das Rad bereits rechtmäßig im eigenen Gewahrsam, es
      fehlt an einem Gewahrsamsbruch. Ein Diebstahl scheidet daher aus, § 246 StGB
      bleibt anwendbar.
  - prompt: Formuliere das Ergebnis.
    erwartung: A hat sich gegenüber B wegen veruntreuender Unterschlagung gemäß
      § 246 Abs. 1, Abs. 2 StGB strafbar gemacht.
