cards:
- slug: sr-unterschlagung-zueignungsbegriff
  type: definition
  front: 'Definiere: Zueignung i.S.d. § 246 StGB (Manifestationstheorie)'
  back: Nach der herrschenden Manifestationstheorie erfordert die Zueignung i.S.d.
    § 246 StGB ein nach aussen tretendes Verhalten des Taeters, das seinen Willen
    erkennbar macht, die Sache oder den in ihr verkoerperten Wert dauerhaft dem eigenen
    Vermoegen einzuverleiben und den Eigentuemer dauerhaft von seiner Position auszuschliessen.
    Ein bloss innerer Vorbehalt ohne erkennbare Betaetigung genuegt nicht.
  norms:
  - § 246 Abs. 1 StGB
  quellen:
  - StGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sr-unterschlagung-manifestation-beispiele
  type: streitstand
  front: Welche Verhaltensweisen manifestieren typischerweise den Zueignungswillen
    bei § 246 StGB?
  back: Als Manifestation anerkannt sind insbesondere die Weiterveraeusserung oder
    Verpfaendung der Sache, ihr Verbrauch oder Einbau in eine eigene Sache sowie die
    endgueltige Weigerung, die Sache trotz Herausgabeverlangens des Berechtigten herauszugeben,
    wenn sie mit einer Beruehmung eigener Berechtigung verbunden ist. Blosses Nichtstun
    oder ein nur vorlaeufiges Behalten der Sache genuegt dagegen grundsaetzlich nicht.
  norms:
  - § 246 Abs. 1 StGB
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sr-unterschlagung-subsidiaritaetsklausel
  type: norm
  front: Was bewirkt die Subsidiaritaetsklausel des § 246 Abs. 1 a. E. StGB?
  back: § 246 StGB tritt zurueck, wenn die Tat zugleich einen anderen, schwerer bestraften
    Zueignungstatbestand erfuellt - insbesondere Diebstahl, § 242 StGB. Die Klausel
    verhindert, dass der Auffangtatbestand der Unterschlagung neben einer spezielleren
    und schwerer bedrohten Zueignungsvorschrift eigenstaendig zur Anwendung kommt.
  norms:
  - § 246 Abs. 1 StGB
  - § 242 StGB
  quellen:
  - StGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sr-unterschlagung-anvertrautsein
  type: definition
  front: 'Definiere: Anvertrautsein i.S.d. § 246 Abs. 2 StGB'
  back: Anvertraut ist eine Sache, wenn der Taeter die tatsaechliche Gewalt ueber
    sie aufgrund eines vom Berechtigten gebilligten Vertrauensverhaeltnisses erlangt
    hat, mit der Massgabe, sie in dessen Interesse zu verwenden, zu verwahren oder
    zurueckzugeben. Ein rein tatsaechliches Naeheverhaeltnis ohne ein solches Vertrauenselement
    genuegt nicht.
  norms:
  - § 246 Abs. 2 StGB
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sr-unterschlagung-veruntreuende-qualifikation
  type: norm
  front: Welche Rechtsfolge hat die veruntreuende Unterschlagung nach § 246 Abs. 2
    StGB?
  back: Ist die unterschlagene Sache dem Taeter anvertraut, erhoeht sich der Strafrahmen
    gegenueber § 246 Abs. 1 StGB auf Freiheitsstrafe bis zu fuenf Jahren oder Geldstrafe.
    Der Gesetzgeber traegt damit dem gesteigerten Unrechtsgehalt Rechnung, der im
    Missbrauch des besonderen Vertrauensverhaeltnisses liegt.
  norms:
  - § 246 Abs. 2 StGB
  quellen:
  - StGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sr-unterschlagung-abgrenzung-diebstahl-242
  type: definition
  front: 'Abgrenzung: Unterschlagung, § 246 StGB, und Diebstahl, § 242 StGB'
  back: '§ 242 StGB verlangt eine Wegnahme, also den Bruch fremden und die Begruendung
    neuen Gewahrsams. § 246 StGB setzt dagegen keinen Gewahrsamsbruch voraus: Der
    Taeter hat die Sache regelmaessig bereits selbst rechtmaessig in Gewahrsam oder
    Besitz - etwa als Finder, Mieter oder Entleiher - und muss sie sich lediglich
    noch durch eine nach aussen tretende Handlung zueignen. § 246 StGB ist daher das
    Auffangdelikt fuer Zueignungen ohne Gewahrsamsbruch.'
  norms:
  - § 242 StGB
  - § 246 Abs. 1 StGB
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sr-unterschlagung-subsidiaritaet-nichtverfolgbare-vortat
  type: streitstand
  front: Bleibt § 246 StGB auch subsidiaer, wenn die vorrangige, schwerer bedrohte
    Tat im Einzelfall nicht verfolgbar ist (z. B. verjaehrt)?
  back: 'Nach ganz h.M. ist die Subsidiaritaetsklausel des § 246 Abs. 1 a. E. StGB
    rein formell zu verstehen: Es genuegt, dass der Taeter tatbestandlich auch eine
    andere, schwerer bedrohte Zueignungsvorschrift erfuellt hat. Auf die tatsaechliche
    Verfolgbarkeit dieser Tat im Einzelfall - etwa bei Verjaehrung oder fehlendem
    Strafantrag - kommt es nicht an; § 246 StGB bleibt auch dann zurueckgedraengt.'
  norms:
  - § 246 Abs. 1 StGB
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
