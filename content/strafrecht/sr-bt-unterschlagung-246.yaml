    - label: 2. Zueignung (nach aussen tretende Manifestation des Zueignungswillens)
    - label: 3. Rechtswidrigkeit der Zueignung
    - label: '4. Qualifikation: Anvertrautsein, § 246 Abs. 2 StGB'
      hinweis: Nur pruefen, wenn der Sachverhalt ein Vertrauensverhaeltnis zeigt (z.
        B. Leihe, Verwahrung, Arbeitsverhaeltnis).
  - label: II. Rechtswidrigkeit
