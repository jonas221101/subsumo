cards:
- slug: sr-unterlassen-echte-unechte
  type: definition
  front: 'Definiere: Abgrenzung echte und unechte Unterlassungsdelikte'
  back: Echte Unterlassungsdelikte sind im Gesetz als eigene Tatbestände mit einer
    allgemeinen, jedermann treffenden Handlungspflicht ausgestaltet (z. B. § 323c
    StGB, unterlassene Hilfeleistung); eine besondere Garantenstellung ist nicht erforderlich.
    Unechte Unterlassungsdelikte entstehen dadurch, dass ein im Gesetz als Begehungsdelikt
    formulierter Erfolgstatbestand über § 13 StGB auf die Nichtvornahme einer gebotenen
    Handlung erstreckt wird; hierfür ist eine besondere Rechtspflicht zum Handeln
    (Garantenstellung) erforderlich.
  norms:
  - § 13 StGB
  quellen:
  - § 13 StGB, amtlicher Wortlaut
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sr-unterlassen-voraussetzungen
  type: norm
  front: 'Definiere: die Voraussetzungen des unechten Unterlassungsdelikts, § 13 Abs.
    1 StGB'
  back: 'Voraussetzungen sind: Nichtabwendung des tatbestandsmäßigen Erfolgs; physisch-reale
    Handlungsmöglichkeit; hypothetische Kausalität (der Erfolg hätte bei Vornahme
    der gebotenen Handlung mit an Sicherheit grenzender Wahrscheinlichkeit vermieden
    werden können); eine Garantenstellung; bei verhaltensgebundenen Delikten die
    Entsprechung der Unterlassung mit der Tatbestandsverwirklichung durch Tun (§ 13
    Abs. 1 StGB); sowie Vorsatz bzw. Fahrlässigkeit.'
  norms:
  - § 13 Abs. 1 StGB
  quellen:
  - § 13 StGB, amtlicher Wortlaut
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sr-unterlassen-beschuetzergarant
  type: definition
  front: 'Definiere: Beschützergarant (Obhutsgarant)'
  back: 'Ein Beschützergarant ist zum Schutz eines bestimmten Rechtsguts vor allen
    drohenden Gefahren verpflichtet. Entstehungsgründe sind insbesondere: Gesetz
    (z. B. elterliche Sorge, §§ 1626, 1631 BGB), enge natürliche Verbundenheit (Ehe,
    eheähnliche Lebensgemeinschaft), die freiwillige Übernahme einer Schutzfunktion
    durch Vertrag oder tatsächliches Handeln (z. B. Bergführer, Babysitter) sowie
    eine Gefahrengemeinschaft.'
  norms:
  - §§ 1626, 1631 BGB
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sr-unterlassen-ueberwachergarant
  type: definition
  front: 'Definiere: Überwachergarant'
  back: 'Ein Überwachergarant ist verpflichtet, von einer ihm zugeordneten Gefahrenquelle
    ausgehende Risiken für Dritte abzuwenden. Entstehungsgründe sind insbesondere:
    vorangegangenes gefahrbegründendes Tun (Ingerenz), die Verantwortlichkeit für
    Sachen oder Anlagen (Verkehrssicherungspflichten) sowie die Aufsichtspflicht über
    das Verhalten Dritter, etwa der Eltern für ihre minderjährigen Kinder.'
  norms: []
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sr-unterlassen-ingerenz-pflichtwidrigkeit
  type: streitstand
  front: 'Streitstand: Erfordert die Garantenstellung aus Ingerenz ein pflichtwidriges
    Vorverhalten?'
  back: 'Problem: Ob jedes gefahrbegründende Vorverhalten oder nur ein

    pflichtwidriges eine Ingerenzgarantenstellung begründen kann,

    entscheidet über die Strafbarkeit wegen Unterlassens bei

    rechtmäßigem Vorverhalten.


    Früher von der Rspr. und Teilen der Literatur vertretene Ansicht:

    Jedes adäquat kausale, gefahrbegründende Vorverhalten löst die

    Ingerenzgarantenstellung aus - unabhängig davon, ob es pflichtwidrig

    war. Argument: Wer eine Gefahr gesetzt hat, ist am nächsten dran, sie

    auch abzuwenden.


    H.M. (heute auch von der Rspr. weitgehend übernommen): Nur ein

    pflichtwidriges (rechtswidriges) Vorverhalten begründet eine

    Garantenpflicht; rechtmäßiges Vorverhalten, etwa eine gerechtfertigte

    Notwehrhandlung, löst keine Ingerenzhaftung aus. Argument: Andernfalls

    würde derjenige, der sich rechtmäßig verhält, schlechter gestellt

    als nötig - Wertungswiderspruch zur Rechtfertigung.


    Konsequenz: Bei rechtmäßigem Vorverhalten (z. B. gerechtfertigter

    Notwehr) ist eine Ingerenzgarantenstellung nach h.M. abzulehnen; bei

    nur unklarer Pflichtwidrigkeit ist der Streit offenzulegen.

    '
  norms: []
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sr-unterlassen-entsprechungsklausel
  type: norm
  front: 'Definiere: Entsprechungsklausel, § 13 Abs. 1 StGB'
  back: Bei Tatbeständen, die nicht schlicht einen Erfolg voraussetzen, sondern besondere
    Tatmodalitäten des Täterverhaltens verlangen (verhaltensgebundene Delikte, z.
    B. Täuschung beim Betrug, § 263 StGB), muss die Unterlassung zusätzlich der
    Verwirklichung des gesetzlichen Tatbestandes durch aktives Tun entsprechen (§
    13 Abs. 1 a.E. StGB). Bei schlichten Erfolgsdelikten, bei denen das Gesetz nur
    den Erfolg, nicht eine bestimmte Handlungsweise voraussetzt, hat die Entsprechungsklausel
    regelmäßig keine eigenständige Bedeutung, da Tun und Unterlassen gleichermässen
    zum Erfolg führen können.
  norms:
  - § 13 Abs. 1 StGB
  quellen:
  - § 13 StGB, amtlicher Wortlaut
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sr-unterlassen-strafmilderung
  type: norm
  front: 'Definiere: die fakultative Strafmilderung, § 13 Abs. 2 StGB'
  back: Bei einem unechten Unterlassungsdelikt kann das Gericht die Strafe gemäß
    § 13 Abs. 2 i.V.m. § 49 Abs. 1 StGB mildern. Grund ist, dass das Unrecht des Unterlassens
    im Regelfall als geringfügiger gegenüber dem aktiven Herbeiführen des Erfolgs
    angesehen wird; zwingend ist die Milderung jedoch nicht, sie steht im Ermessen
    des Gerichts.
  norms:
  - § 13 Abs. 2 StGB
  - § 49 Abs. 1 StGB
  quellen:
  - § 13 StGB, amtlicher Wortlaut
  - Eigenformulierung Redaktion
  stand: 2026-09
schemata:
- slug: sr-schema-unterlassungsdelikt
  title: Prüfung des unechten Unterlassungsdelikts durch Unterlassen, § 13 StGB
  norms:
  - § 13 StGB
  quellen:
  - § 13 StGB, amtlicher Wortlaut
  - Eigenformulierung Redaktion
  stand: 2026-09
  steps:
  - label: I. Tatbestand
    children:
    - label: 1. Objektiver Tatbestand
      children:
      - label: a) Eintritt des tatbestandsmäßigen Erfolgs
      - label: b) Nichtvornahme der gebotenen Handlung trotz Handlungsmöglichkeit
      - label: c) Physisch-reale Handlungsmöglichkeit
      - label: 'd) Hypothetische Kausalität: Erfolg wäre bei Vornahme der gebotenen
          Handlung mit an Sicherheit grenzender Wahrscheinlichkeit entfallen'
      - label: e) Garantenstellung (Beschützer- oder Überwachergarant)
      - label: f) Entsprechung der Unterlassung mit der Tatbestandsverwirklichung
          durch Tun, § 13 Abs. 1 StGB (bei verhaltensgebundenen Delikten)
    - label: '2. Subjektiver Tatbestand: Vorsatz bzgl. aller objektiven Umstände
        einschließlich der die Garantenstellung begründenden Tatsachen'
  - label: II. Rechtswidrigkeit
  - label: III. Schuld
  - label: IV. Fakultative Strafmilderung, § 13 Abs. 2 StGB
  - label: V. Ergebnis
faelle:
- slug: sr-fall-untaetige-mutter-am-see
  title: Die Rettungsweste
  difficulty: 4
  minutes: 50
  quellen:
  - Eigener Sachverhalt der Redaktion
  - StGB, amtliche Fassung
  facts: M ist die Mutter des vierjährigen S. Bei einem gemeinsamen Ausflug an einen
    See gerät S beim Spielen unbemerkt von anderen Badegästen in tieferes Wasser
    und droht zu ertrinken. M bemerkt dies als Einzige, erkennt die Lebensgefahr für
    S klar und hätte S - selbst erfahrene Schwimmerin - ohne eigenes Risiko retten
    oder durch lautes Rufen sofort einen wenige Meter entfernten Rettungsschwimmer
    auf die Situation aufmerksam machen können. Da M sich seit längerem mit dem
    Vater des S um das alleinige Sorgerecht streitet und sich erhofft, von den belastenden
    Auseinandersetzungen befreit zu sein, wenn S nicht mehr lebt, unternimmt sie bewusst
    nichts und sieht dem Ertrinken des S tatenlos zu. S ertrinkt. Hätte M sofort
    eingegriffen oder Hilfe herbeigerufen, wäre S mit an Sicherheit grenzender Wahrscheinlichkeit
    gerettet worden.
  question: Hat sich M wegen Totschlags durch Unterlassen gemäß §§ 212 Abs. 1, 13
    StGB strafbar gemacht?
  steps:
  - prompt: Ist der Tod des S ein tatbestandsmäßiger Erfolg i.S.d. § 212 Abs. 1
      StGB?
    erwartung: Ja - der Tod eines Menschen ist der von § 212 Abs. 1 StGB vorausgesetzte
      Erfolg.
  - prompt: Hat M durch aktives Tun gehandelt oder unterlassen?
    erwartung: M hat unterlassen - sie hat trotz erkannter Lebensgefahr keine rettende
      Handlung vorgenommen; § 212 StGB ist daher i.V.m. § 13 StGB zu prüfen.
  - prompt: Hatte M die physisch-reale Möglichkeit zum Handeln?
    erwartung: Ja - als erfahrene Schwimmerin hätte sie selbst eingreifen oder jedenfalls
      durch Rufen den nahen Rettungsschwimmer alarmieren können.
  - prompt: Wäre der Erfolg bei Vornahme der gebotenen Handlung mit an Sicherheit
      grenzender Wahrscheinlichkeit entfallen?
    erwartung: Ja - laut Sachverhalt wäre S bei sofortigem Eingreifen mit an Sicherheit
      grenzender Wahrscheinlichkeit gerettet worden (hypothetische Kausalität).
  - prompt: Ist M Garantin für das Leben des S?
    erwartung: Ja - als Mutter trifft M kraft Gesetzes (§§ 1626, 1631 BGB) eine Beschützergarantenstellung
      für Leben und Gesundheit ihres minderjährigen Kindes.
  - prompt: Bedarf es hier zusätzlich der Entsprechungsklausel des § 13 Abs. 1 a.E.
      StGB?
    erwartung: Nein - § 212 StGB ist ein schlichtes Erfolgsdelikt ohne besondere Tatmodalität,
      sodass Tun und Unterlassen gleichermässen tatbestandsmäßig sein können;
      die Entsprechungsklausel hat hier keine eigenständige Bedeutung.
  - prompt: Ergebnis?
    erwartung: M hat sich wegen Totschlags durch Unterlassen gemäß §§ 212 Abs. 1,
      13 StGB strafbar gemacht.
  expectation:
