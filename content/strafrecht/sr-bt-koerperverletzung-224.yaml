cards:
- slug: sr-kv-koerperliche-misshandlung
  type: definition
  front: 'Definiere: körperliche Misshandlung, § 223 Abs. 1 StGB'
  back: Körperliche Misshandlung ist jede übele, unangemessene Behandlung, die das
    körperliche Wohlbefinden oder die körperliche Unversehrtheit des Opfers nicht
    nur unerheblich beeinträchtigt. Erfasst sind sowohl Substanzverletzungen (z.
    B. Schnitt- oder Schürfwunden) als auch reine Schmerz- oder Beeinträchtigungszufügungen
    ohne äußerlich sichtbare Verletzung, sofern die Erheblichkeitsschwelle überschritten
    ist.
  norms:
  - § 223 Abs. 1 StGB
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sr-kv-gesundheitsschaedigung
  type: definition
  front: 'Definiere: Gesundheitsschädigung, § 223 Abs. 1 StGB'
  back: Gesundheitsschädigung ist das Hervorrufen oder Steigern eines pathologischen,
    d. h. vom Normalzustand der körperlichen Funktionen nachteilig abweichenden Zustands.
    Die beiden Tatbestandsalternativen körperliche Misshandlung und Gesundheitsschädigung
    überschneiden sich in der Praxis häufig (z. B. bei einer Prellung), stehen aber
    selbstständig nebeneinander - schon eine Alternative genügt für den objektiven
    Tatbestand.
  norms:
  - § 223 Abs. 1 StGB
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sr-kv-224-qualifikationen-ueberblick
  type: norm
  front: Welche fünf Qualifikationsmerkmale nennt § 224 Abs. 1 StGB?
  back: '§ 224 Abs. 1 StGB qualifiziert die einfache Körperverletzung des § 223 StGB
    in fünf Alternativen: (1) Beibringung von Gift oder anderen gesundheitsschädlichen
    Stoffen, (2) mittels einer Waffe oder eines anderen gefährlichen Werkzeugs, (3)
    mittels eines hinterlistigen Überfalls, (4) mit einem anderen Beteiligten gemeinschaftlich,
    (5) mittels einer das Leben gefährdenden Behandlung. Bereits das Vorliegen einer
    einzigen Alternative genügt für die Qualifikation.'
  norms:
  - § 224 Abs. 1 StGB
  - § 224 Abs. 1 Nr. 1 StGB
  - § 224 Abs. 1 Nr. 2 StGB
  - § 224 Abs. 1 Nr. 3 StGB
  - § 224 Abs. 1 Nr. 4 StGB
  - § 224 Abs. 1 Nr. 5 StGB
  quellen:
  - § 224 StGB, amtlicher Wortlaut
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sr-kv-gefaehrliches-werkzeug
  type: definition
  front: 'Definiere: gefährliches Werkzeug, § 224 Abs. 1 Nr. 2 StGB'
  back: Ein gefährliches Werkzeug ist jeder vom Körper des Täters verschiedene,
    bewegliche Gegenstand, der nach seiner objektiven Beschaffenheit und der konkreten
    Art seiner Verwendung im Einzelfall geeignet ist, erhebliche Verletzungen herbeizuführen.
    Maßgeblich ist die tatsächliche Verwendung im Einzelfall, nicht eine abstrakte
    Gefährlichkeit des Gegenstands an sich - ein an sich harmloser Gegenstand kann
    durch die Art seines Einsatzes zum gefährlichen Werkzeug werden.
  norms:
  - § 224 Abs. 1 Nr. 2 StGB
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sr-kv-abgrenzung-werkzeug-koerperteil
  type: streitstand
  front: 'Streitstand: Ist ein Körperteil (z. B. ein beschuhter Fuß) ein ''gefährliches
    Werkzeug'' i.S.d. § 224 Abs. 1 Nr. 2 StGB?'
  back: 'Problem: Nr. 2 erfasst nur ein "Werkzeug", während bloße

    Körperkraft (Faustschlag, Fußtritt) grundsätzlich nur den

    Grundtatbestand des § 223 StGB trägt. Fraglich ist, ob und wann ein

    Fußtritt dennoch unter Nr. 2 fällt.


    Einigkeit besteht, dass der bloße Körper des Täters (Faust, Fuß)

    selbst kein Werkzeug ist: Werkzeug muss ein vom Körper verschiedener

    Gegenstand sein - sonst würde Nr. 2 neben § 223 StGB praktisch

    bedeutungslos, weil jede kräftige Schlag- oder Trittbewegung erfasst

    wäre.


    Bei einem beschuhten Fuß ist nicht der Fuß, sondern der Schuh der

    mögliche Gegenstand i.S.d. Nr. 2. Nach der Rechtsprechung kommt es auf

    die konkrete Beschaffenheit des Schuhwerks und die Art der Verwendung

    an: Ein fester, schwerer Stiefel, mit dem kräftig gegen empfindliche

    Körperregionen getreten wird, kann als gefährliches Werkzeug gelten;

    ein leichter Turnschuh in vergleichbarer Situation regelmäßig nicht.


    Konsequenz: Die pauschale Aussage "ein Fußtritt ist immer ein

    gefährliches Werkzeug" ist falsch - erforderlich ist stets eine

    Einzelfallprüfung von Schuhbeschaffenheit, Tretstärke und getroffener

    Körperregion.

    '
  norms:
  - § 224 Abs. 1 Nr. 2 StGB
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sr-kv-gemeinschaftlich
  type: definition
  front: 'Definiere: ''mit einem anderen Beteiligten gemeinschaftlich'', § 224 Abs.
    1 Nr. 4 StGB'
  back: Gemeinschaftlich i.S.d. Nr. 4 handelt, wer die Körperverletzung zusammen
    mit mindestens einem weiteren Beteiligten am Tatort verwirklicht. Erforderlich
    ist ein einverständliches Zusammenwirken mehrerer Personen bei der Tatausführung,
    durch das sich die Verteidigungsmöglichkeiten des Opfers gegenüber einem Einzeltäter
    verschlechtern. Nicht erforderlich ist, dass jeder Beteiligte selbst körperlich
    auf das Opfer einwirkt oder Mittäter i.S.d. § 25 Abs. 2 StGB ist - auch ein am
    Tatort anwesender, unterstützend mitwirkender Gehilfe genügt als "anderer Beteiligter".
  norms:
  - § 224 Abs. 1 Nr. 4 StGB
  - § 25 Abs. 2 StGB
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sr-kv-lebensgefaehrdende-behandlung
  type: definition
  front: 'Definiere: das Leben gefährdende Behandlung, § 224 Abs. 1 Nr. 5 StGB'
  back: Eine das Leben gefährdende Behandlung liegt vor, wenn die konkrete Art der
    Tatausführung nach den Umständen des Einzelfalls generell geeignet ist, das
    Leben des Opfers zu gefährden - eine tatsächliche Lebensgefahr oder gar Todesfolge
    ist nicht erforderlich. Beispiele sind Würgen bis zur Atemnot, ein Sturz aus
    großer Höhe herbeiführen oder Schläge gegen den Kopf mit erheblichem Krafteinsatz.
  norms:
  - § 224 Abs. 1 Nr. 5 StGB
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
schemata:
- slug: sr-schema-224
  title: Gefährliche Körperverletzung, §§ 223 Abs. 1, 224 Abs. 1 StGB
  norms:
  - § 223 Abs. 1 StGB
  - § 224 Abs. 1 StGB
  quellen:
  - §§ 223, 224 StGB, amtlicher Wortlaut
  - Eigenformulierung Redaktion
  steps:
  - label: I. Tatbestand
    children:
    - label: 1. Grundtatbestand, § 223 Abs. 1 StGB
      children:
      - label: a) Körperliche Misshandlung und/oder Gesundheitsschädigung
      - label: b) Kausalität und objektive Zurechnung
    - label: 2. Qualifikation, § 224 Abs. 1 StGB
      children:
      - label: 'a) Nr. 1: Gift oder andere gesundheitsschädliche Stoffe'
      - label: 'b) Nr. 2: Waffe oder anderes gefährliches Werkzeug'
        hinweis: Beim beschuhten Fuß kommt es auf Schuhbeschaffenheit und Tretstärke
          im Einzelfall an.
      - label: 'c) Nr. 3: hinterlistiger Überfall'
      - label: 'd) Nr. 4: mit einem anderen Beteiligten gemeinschaftlich'
      - label: 'e) Nr. 5: das Leben gefährdende Behandlung'
    - label: '3. Subjektiver Tatbestand: Vorsatz bzgl. Grundtatbestand und mind. einem
        Qualifikationsmerkmal, § 15 StGB'
  - label: II. Rechtswidrigkeit (insb. § 32 StGB, Einwilligung, § 228 StGB)
  - label: III. Schuld
  - label: IV. Strafantrag/Konkurrenzen
faelle:
- slug: sr-fall-stiefeltritt-zu-zweit
  title: Der Stiefeltritt zu zweit
  difficulty: 3
  minutes: 55
  quellen:
  - Eigener Sachverhalt der Redaktion
  - StGB, amtliche Fassung
  facts: A und B hatten sich zuvor verabredet, gemeinsam gegen O vorzugehen. Als O
    zu Boden geht, trägt A schwere Wanderstiefel mit fester Profilsohle und tritt
    mehrfach kräftig gegen den Rumpf des O, während B gleichzeitig neben A steht,
    auf O einschlägt und so verhindert, dass O sich aufrichten oder fliehen kann.
    O erleidet mehrere schmerzhafte Rippenprellungen.
  question: Hat sich A wegen gefährlicher Körperverletzung gemäß §§ 223 Abs. 1,
    224 Abs. 1 Nr. 2, Nr. 4 StGB strafbar gemacht?
  steps:
  - prompt: Formuliere den Obersatz.
    erwartung: A könnte sich durch die Tritte gegen O wegen gefährlicher Körperverletzung
      gemäß §§ 223 Abs. 1, 224 Abs. 1 Nr. 2, Nr. 4 StGB strafbar gemacht haben.
  - prompt: Liegt der objektive Tatbestand des § 223 Abs. 1 StGB vor?
    erwartung: Ja - die Rippenprellungen sind sowohl körperliche Misshandlung als
      auch Gesundheitsschädigung.
  - prompt: Sind die schweren Wanderstiefel ein gefährliches Werkzeug i.S.d. § 224
      Abs. 1 Nr. 2 StGB?
    erwartung: Ja - nicht der Fuß, sondern der feste Stiefel mit fester Sohle ist
      der vom Körper verschiedene Gegenstand; angesichts der kräftigen Tritte gegen
      den Rumpf war er nach Beschaffenheit und Verwendung geeignet, erhebliche Verletzungen
      herbeizuführen.
  - prompt: Handelte A 'mit einem anderen Beteiligten gemeinschaftlich' i.S.d. § 224
      Abs. 1 Nr. 4 StGB?
    erwartung: Ja - B wirkte verabredet und am Tatort zusammen mit A auf O ein und
      verschlechterte durch sein Einschlagen zusätzlich die Verteidigungsmöglichkeiten
      des O; ein voller § 25 Abs. 2 StGB-Mittäteranteil ist dafür nicht erforderlich.
  - prompt: Liegt Vorsatz bzgl. Grundtatbestand und Qualifikationsmerkmalen vor?
    erwartung: Ja - A handelte bewusst und gewollt sowohl hinsichtlich der Verletzung
      als auch hinsichtlich des Einsatzes der Stiefel und des gemeinsamen Vorgehens
      mit B.
