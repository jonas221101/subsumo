cards:
- slug: sr-versuch-begriff
  type: definition
  front: 'Definiere: Versuch, § 22 StGB'
  back: 'Eine Straftat versucht, wer nach seiner Vorstellung von der Tat zur Verwirklichung
    des Tatbestandes unmittelbar ansetzt. Der Versuch setzt sich damit aus zwei Elementen
    zusammen: dem Tatentschluss (subjektive Komponente) und dem unmittelbaren Ansetzen
    (objektive Komponente).'
  norms:
  - § 22 StGB
  quellen:
  - StGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sr-versuch-tatentschluss
  type: definition
  front: 'Definiere: Tatentschluss'
  back: Tatentschluss ist der unbedingte Wille des Taeters, alle objektiven Tatbestandsmerkmale
    zu verwirklichen, verbunden mit dem hierfuer erforderlichen Vorsatz (mindestens
    dolus eventualis) sowie etwaigen besonderen subjektiven Tatbestandsmerkmalen.
    Behaelt sich der Taeter die endgueltige Ausfuehrung noch vor (blosser Vorbehalt),
    fehlt es am unbedingten Handlungswillen und damit am Tatentschluss.
  norms:
  - § 22 StGB
  - § 15 StGB
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sr-versuch-unmittelbares-ansetzen
  type: definition
  front: Wann liegt ein unmittelbares Ansetzen i.S.d. § 22 StGB vor?
  back: 'Unmittelbares Ansetzen liegt vor, wenn der Taeter Handlungen vornimmt, die
    nach seiner Vorstellung von der Tat ohne wesentliche Zwischenschritte in die Tatbestandsverwirklichung
    einmuenden und die geschuetzten Rechtsgueter aus seiner Sicht bereits konkret
    gefaehrden - kurz: wenn es aus Tatersicht ''jetzt geht es los'' heisst.'
  norms:
  - § 22 StGB
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sr-versuch-strafbarkeit-23
  type: norm
  front: Wann ist der Versuch strafbar? (§ 23 Abs. 1 StGB)
  back: 'Der Versuch eines Verbrechens ist gemaess § 23 Abs. 1 StGB stets strafbar
    (§ 12 Abs. 1 StGB: im Mindestmass mit einem Jahr oder mehr Freiheitsstrafe bedrohte
    Taten). Der Versuch eines Vergehens ist dagegen nur strafbar, wenn das Gesetz
    es ausdruecklich bestimmt (z. B. § 242 Abs. 2 StGB fuer den Diebstahlsversuch).'
  norms:
  - § 23 Abs. 1 StGB
  - § 12 Abs. 1 StGB
  quellen:
  - StGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sr-ruecktritt-begriff
  type: definition
  front: 'Definiere: Ruecktritt vom Versuch, § 24 Abs. 1 StGB'
  back: Nach § 24 Abs. 1 StGB wird wegen Versuchs nicht bestraft, wer die weitere
    Ausfuehrung der Tat freiwillig aufgibt (beim unbeendeten Versuch) oder deren Vollendung
    freiwillig verhindert (beim beendeten Versuch). Der Ruecktritt ist ein persoenlicher
    Strafaufhebungsgrund und beseitigt die bereits begruendete Versuchsstrafbarkeit.
  norms:
  - § 24 Abs. 1 StGB
  quellen:
  - StGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sr-ruecktritt-ruecktrittshorizont
  type: streitstand
  front: Was ist der Ruecktrittshorizont und wonach bestimmt er sich?
  back: 'Ob ein Versuch unbeendet oder beendet ist, bestimmt sich nach dem

    sogenannten Ruecktrittshorizont: massgeblich ist nicht der urspruengliche

    Tatplan, sondern die Vorstellung des Taeters unmittelbar nach Abschluss

    der letzten von ihm vorgenommenen Ausfuehrungshandlung.


    Unbeendeter Versuch: Der Taeter glaubt, noch nicht alles Erforderliche

    zur Herbeifuehrung des Erfolgs getan zu haben. Hier genuegt fuer den

    Ruecktritt bereits das blosse Aufgeben der weiteren Tatausfuehrung.


    Beendeter Versuch: Der Taeter geht davon aus, bereits alles zur

    Herbeifuehrung des Erfolgs Erforderliche getan zu haben (der Erfolg werde

    auch ohne weiteres Zutun eintreten). Hier reicht blosses Untaetigbleiben

    fuer den Ruecktritt nicht aus - erforderlich ist ein aktives Verhindern

    der Vollendung, § 24 Abs. 1 S. 1 Var. 2 StGB.

    '
  norms:
  - § 24 Abs. 1 StGB
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sr-ruecktritt-freiwilligkeit
  type: definition
  front: Wann ist ein Ruecktritt freiwillig?
  back: Freiwillig handelt der Taeter, wenn er aus autonomen Motiven von der weiteren
    Tatausfuehrung absieht oder die Vollendung verhindert, er also 'Herr seiner Entschluesse'
    bleibt - etwa aus Reue, Mitleid oder Angst vor Strafe. Unfreiwillig (heteronom)
    ist der Ruecktritt dagegen, wenn aeussere Zwaenge den Taeter an der Weiterausfuehrung
    hindern, etwa das ploetzliche Erscheinen eines Dritten, das die Tatausfuehrung
    faktisch unmoeglich macht oder das Entdeckungsrisiko fuer den Taeter unzumutbar
    erhoeht.
  norms:
  - § 24 Abs. 1 StGB
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
