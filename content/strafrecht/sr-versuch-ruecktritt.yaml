faelle:
- slug: sr-fall-messerstich-ruecktritt
  title: Der vermeintlich toedliche Stich
  difficulty: 4
  minutes: 60
  quellen:
  - Eigener Sachverhalt der Redaktion
  - StGB, amtliche Fassung
  facts: Nach einem heftigen Streit sticht T dem O mit bedingtem Toetungsvorsatz einmal
    mit einem Messer in den Bauch. O sackt zusammen und bleibt regungslos liegen.
    T geht davon aus, O sei toedlich getroffen und werde in Kuerze sterben; er verlaesst
    fluchtartig den Tatort, ohne Rettungsmassnahmen einzuleiten oder Hilfe zu rufen.
    Ein wenig spaeter vorbeikommender Passant findet O noch lebend auf und alarmiert
    den Rettungsdienst. O ueberlebt nach einer Notoperation.
  question: Ist T wegen versuchten Totschlags gemaess §§ 212 Abs. 1, 22, 23 Abs. 1
    StGB strafbar?
  steps:
  - prompt: Formuliere die Vorpruefung und den Obersatz.
    erwartung: Da O nicht verstorben ist, kommt nur eine Versuchsstrafbarkeit in Betracht;
      der Versuch des Verbrechens Totschlag ist gemaess § 23 Abs. 1 StGB stets strafbar.
      T koennte sich wegen versuchten Totschlags gemaess §§ 212 Abs. 1, 22, 23 Abs.
      1 StGB strafbar gemacht haben.
  - prompt: Liegt Tatentschluss vor?
    erwartung: Ja - T handelte mit (zumindest bedingtem) Vorsatz, O zu toeten.
  - prompt: Liegt ein unmittelbares Ansetzen vor?
    erwartung: Ja - mit dem Messerstich hat T bereits die aus seiner Sicht zur Toetung
      fuehrende Handlung selbst vorgenommen.
  - prompt: Ist T vom Versuch zurueckgetreten?
    erwartung: 'Das ist zu pruefen: Nach dem Ruecktrittshorizont kommt es auf die
      Vorstellung des T nach dem Stich an - er hielt O fuer toedlich getroffen, ging
      also von einem beendeten Versuch aus.'
  - prompt: Genuegt es beim beendeten Versuch, dass T nichts weiter unternommen hat?
    erwartung: Nein. Beim beendeten Versuch erfordert § 24 Abs. 1 S. 1 Var. 2 StGB
      ein aktives Verhindern der Vollendung, etwa durch Rettungsmassnahmen oder einen
      Notruf. Blosses Untaetigbleiben genuegt nicht.
  - prompt: Ist T wirksam zurueckgetreten?
    erwartung: Nein - mangels Verhinderungshandlung liegt kein wirksamer Ruecktritt
      vor. T bleibt wegen versuchten Totschlags strafbar.
