faelle:
- slug: sr-fall-messerstich-ruecktritt
  title: Der vermeintlich tödliche Stich
  difficulty: 4
  minutes: 60
  quellen:
  - Eigener Sachverhalt der Redaktion
  - StGB, amtliche Fassung
  facts: Nach einem heftigen Streit sticht T dem O mit bedingtem Tötungsvorsatz einmal
    mit einem Messer in den Bauch. O sackt zusammen und bleibt regungslos liegen.
    T geht davon aus, O sei tödlich getroffen und werde in Kürze sterben; er verlässt
    fluchtartig den Tatort, ohne Rettungsmaßnahmen einzuleiten oder Hilfe zu rufen.
    Ein wenig später vorbeikommender Passant findet O noch lebend auf und alarmiert
    den Rettungsdienst. O überlebt nach einer Notoperation.
  question: Ist T wegen versuchten Totschlags gemäß §§ 212 Abs. 1, 22, 23 Abs. 1
    StGB strafbar?
  steps:
  - prompt: Formuliere die Vorprüfung und den Obersatz.
    erwartung: Da O nicht verstorben ist, kommt nur eine Versuchsstrafbarkeit in Betracht;
      der Versuch des Verbrechens Totschlag ist gemäß § 23 Abs. 1 StGB stets strafbar.
      T könnte sich wegen versuchten Totschlags gemäß §§ 212 Abs. 1, 22, 23 Abs.
      1 StGB strafbar gemacht haben.
  - prompt: Liegt Tatentschluss vor?
    erwartung: Ja - T handelte mit (zumindest bedingtem) Vorsatz, O zu töten.
  - prompt: Liegt ein unmittelbares Ansetzen vor?
    erwartung: Ja - mit dem Messerstich hat T bereits die aus seiner Sicht zur Tötung
      führende Handlung selbst vorgenommen.
  - prompt: Ist T vom Versuch zurückgetreten?
    erwartung: 'Das ist zu prüfen: Nach dem Rücktrittshorizont kommt es auf die
      Vorstellung des T nach dem Stich an - er hielt O für tödlich getroffen, ging
      also von einem beendeten Versuch aus.'
  - prompt: Genügt es beim beendeten Versuch, dass T nichts weiter unternommen hat?
    erwartung: Nein. Beim beendeten Versuch erfordert § 24 Abs. 1 S. 1 Var. 2 StGB
      ein aktives Verhindern der Vollendung, etwa durch Rettungsmaßnahmen oder einen
      Notruf. Bloßes Untätigbleiben genügt nicht.
  - prompt: Ist T wirksam zurückgetreten?
    erwartung: Nein - mangels Verhinderungshandlung liegt kein wirksamer Rücktritt
      vor. T bleibt wegen versuchten Totschlags strafbar.
  expectation:
