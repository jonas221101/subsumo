topic:
  slug: sr-versuch-ruecktritt
  area: strafrecht
  title: Versuch und Rücktritt, §§ 22 ff. StGB
  parent: sr-at
  relevance: 5
  stand: 2026-09
  redaktion:
    erzeugt_von: collector-agent-v1
    geprueft_von: reviewer-agent-v1
    geprueft_am: '2026-09-13'
    status: in-pruefung
    normzitate_geprueft: false
cards:
- slug: sr-versuch-begriff
  type: definition
  front: 'Definiere: Versuch, § 22 StGB'
  back: 'Eine Straftat versucht, wer nach seiner Vorstellung von der Tat zur Verwirklichung
    des Tatbestandes unmittelbar ansetzt. Der Versuch setzt sich damit aus zwei Elementen
    zusammen: dem Tatentschluss (subjektive Komponente) und dem unmittelbaren Ansetzen
    (objektive Komponente).'
  norms:
  - § 22 StGB
  quellen:
  - StGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sr-versuch-tatentschluss
  type: definition
  front: 'Definiere: Tatentschluss'
  back: Tatentschluss ist der unbedingte Wille des Täters, alle objektiven Tatbestandsmerkmale
    zu verwirklichen, verbunden mit dem hierfür erforderlichen Vorsatz (mindestens
    dolus eventualis) sowie etwaigen besonderen subjektiven Tatbestandsmerkmalen.
    Behält sich der Täter die endgültige Ausführung noch vor (bloßer Vorbehalt),
    fehlt es am unbedingten Handlungswillen und damit am Tatentschluss.
  norms:
  - § 22 StGB
  - § 15 StGB
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sr-versuch-unmittelbares-ansetzen
  type: definition
  front: Wann liegt ein unmittelbares Ansetzen i.S.d. § 22 StGB vor?
  back: 'Unmittelbares Ansetzen liegt vor, wenn der Täter Handlungen vornimmt, die
    nach seiner Vorstellung von der Tat ohne wesentliche Zwischenschritte in die Tatbestandsverwirklichung
    einmünden und die geschützten Rechtsgüter aus seiner Sicht bereits konkret
    gefährden - kurz: wenn es aus Tatersicht ''jetzt geht es los'' heißt.'
  norms:
  - § 22 StGB
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sr-versuch-strafbarkeit-23
  type: norm
  front: Wann ist der Versuch strafbar? (§ 23 Abs. 1 StGB)
  back: 'Der Versuch eines Verbrechens ist gemäß § 23 Abs. 1 StGB stets strafbar
    (§ 12 Abs. 1 StGB: im Mindestmaß mit einem Jahr oder mehr Freiheitsstrafe bedrohte
    Taten). Der Versuch eines Vergehens ist dagegen nur strafbar, wenn das Gesetz
    es ausdrücklich bestimmt (z. B. § 242 Abs. 2 StGB für den Diebstahlsversuch).'
  norms:
  - § 23 Abs. 1 StGB
  - § 12 Abs. 1 StGB
  quellen:
  - StGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sr-versuch-grob-unverstaendig-23-3
  type: norm
  front: Was regelt § 23 Abs. 3 StGB (grob unverständiger Versuch)?
  back: Verkennt der Täter aus grobem Unverstand, dass der Versuch nach der Art des
    Gegenstandes oder des Mittels, an dem oder mit dem die Tat begangen werden sollte,
    überhaupt nicht zur Vollendung führen konnte (abergläubische Mittel, absurde Vorstellungen),
    kann das Gericht von Strafe absehen oder die Strafe mildern. Der untaugliche Versuch
    ist im Übrigen strafbar; nur der grob unverständige Versuch wird privilegiert.
    Er ist vom (straflosen) Wahndelikt zu unterscheiden, bei dem der Täter eine in
    Wahrheit nicht bestehende Strafnorm annimmt.
  norms:
  - § 23 Abs. 3 StGB
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sr-ruecktritt-begriff
  type: definition
  front: 'Definiere: Rücktritt vom Versuch, § 24 Abs. 1 StGB'
  back: Nach § 24 Abs. 1 StGB wird wegen Versuchs nicht bestraft, wer die weitere
    Ausführung der Tat freiwillig aufgibt (unbeendeter Versuch) oder deren Vollendung
    freiwillig verhindert (beendeter Versuch); bleibt die Tat ohne sein Zutun unvollendet,
    genügt das freiwillige und ernsthafte Bemühen, die Vollendung zu verhindern (§
    24 Abs. 1 S. 2 StGB). Bei mehreren Tatbeteiligten gilt § 24 Abs. 2 StGB. Der Rücktritt
    ist ein persönlicher Strafaufhebungsgrund und beseitigt die bereits begründete
    Versuchsstrafbarkeit.
  norms:
  - § 24 Abs. 1 StGB
  quellen:
  - StGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sr-ruecktritt-fehlschlag
  type: definition
  front: 'Definiere: fehlgeschlagener Versuch (Ausschluss des Rücktritts)'
  back: 'Ein Versuch ist fehlgeschlagen, wenn der Täter nach der letzten Ausführungshandlung
    erkennt, dass er den tatbestandlichen Erfolg mit den ihm zur Verfügung stehenden
    oder erreichbaren Mitteln nicht mehr herbeiführen kann, ohne dass er sofort eine
    neue Handlungsmöglichkeit erlangt (Einzelaktstheorie gegen Gesamtbetrachtung:
    die Rspr. stellt auf eine Gesamtbetrachtung ab). Beim fehlgeschlagenen Versuch
    ist ein Rücktritt nach § 24 Abs. 1 StGB ausgeschlossen, weil der Täter die Tat
    nicht mehr freiwillig aufgeben kann. Der Fehlschlag ist deshalb vor der Unterscheidung
    beendet/unbeendet zu prüfen.'
  norms:
  - § 24 Abs. 1 StGB
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sr-ruecktritt-ruecktrittshorizont
  type: streitstand
  front: Was ist der Rücktrittshorizont und wonach bestimmt er sich?
  back: |-
    Ob ein Versuch unbeendet oder beendet ist, bestimmt sich nach dem Rücktrittshorizont: maßgeblich ist nicht der ursprüngliche Tatplan, sondern die Vorstellung des Täters nach Abschluss der letzten Ausführungshandlung (Gesamtbetrachtung aller Umstände; Korrektur des Rücktrittshorizonts ist möglich, solange kein Fehlschlag vorliegt).

    Unbeendeter Versuch: Der Täter glaubt, noch nicht alles Erforderliche zur Herbeiführung des Erfolgs getan zu haben, und hält den Erfolgseintritt mit den bisherigen Mitteln nicht für möglich. Hier genügt für den Rücktritt das bloße Aufgeben der weiteren Tatausführung (§ 24 Abs. 1 S. 1 Var. 1 StGB).

    Beendeter Versuch: Der Täter hält nach seiner Vorstellung den Eintritt des Erfolgs für möglich (nach der Rspr. genügt, dass er die Möglichkeit des Erfolgseintritts erkennt und nicht ausschließt; er muss ihn nicht sicher erwarten). Hier reicht bloßes Untätigbleiben nicht aus; erforderlich ist ein aktives Verhindern der Vollendung (§ 24 Abs. 1 S. 1 Var. 2 StGB). Bleibt die Vollendung ohne Zutun des Täters aus, genügt sein ernsthaftes Bemühen (§ 24 Abs. 1 S. 2 StGB).

    Vorfrage: Kein fehlgeschlagener Versuch. Fehlgeschlagen ist der Versuch, wenn der Täter erkennt, dass er die Tat mit den ihm zur Verfügung stehenden Mitteln nicht mehr vollenden kann; ein Rücktritt ist dann ausgeschlossen.
  norms:
  - § 24 Abs. 1 StGB
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sr-ruecktritt-freiwilligkeit
  type: definition
  front: Wann ist ein Rücktritt freiwillig?
  back: 'Freiwillig handelt der Täter, wenn er aus autonomen Motiven von der weiteren
    Tatausführung absieht oder die Vollendung verhindert, er also Herr seiner Entschlüsse
    bleibt, etwa aus Reue, Mitleid oder aus der Einsicht, dass sich die Tat nicht
    lohnt. Unfreiwillig (heteronom) ist der Rücktritt, wenn äußere Zwänge den Täter
    an der Weiterausführung hindern. Zwei Fallgruppen: (1) Allgemeine Angst vor Strafe
    oder Furcht vor Sanktionen ist für sich genommen nicht heteronom; (2) Furcht vor
    Entdeckung, die auf einem konkret erhöhten Entdeckungsrisiko beruht (z. B. das
    plötzliche Erscheinen eines Dritten, ein Alarm), ist dagegen heteronom, weil der
    Täter die Tat nicht mehr risikolos vollenden kann (Rspr.).'
  norms:
  - § 24 Abs. 1 StGB
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
