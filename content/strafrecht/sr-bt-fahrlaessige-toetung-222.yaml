faelle:
- slug: sr-fall-bungee-sprung-marodes-seil
  title: Der improvisierte Bungee-Sprung
  difficulty: 3
  minutes: 40
  quellen:
  - Eigener Sachverhalt der Redaktion
  - StGB, amtliche Fassung
  facts: Auf einer privaten Sommerfeier bietet A, ein selbsternannter Extremsport-Enthusiast
    ohne einschlaegige Ausbildung, den Gaesten einen improvisierten Bungee-Sprung
    von einer alten Bruecke an. A weist den volljaehrigen B ausdruecklich darauf hin,
    dass das von ihm mitgebrachte Seil selbstgebaut und nicht geprueft sei und durchaus
    reissen koenne. B, der das Risiko genau versteht, meldet sich dennoch freiwillig,
    laesst sich das Seil um die Fuesse binden und springt. Das Seil reisst, B stuerzt
    in die Tiefe und stirbt an den Folgen des Sturzes.
  question: Hat sich A dadurch, dass er den Sprung angeboten und das mangelhafte Seil
    zur Verfuegung gestellt hat, wegen fahrlaessiger Toetung gemaess § 222 StGB strafbar
    gemacht?
  steps:
  - prompt: Formuliere den Obersatz.
    erwartung: A koennte sich durch das Bereitstellen des Seils und Ermoeglichen des
      Sprungs wegen fahrlaessiger Toetung gemaess § 222 StGB strafbar gemacht haben.
  - prompt: Liegt eine objektive Sorgfaltspflichtverletzung vor?
    erwartung: Ja - das Bereitstellen eines erkennbar ungeprueften, selbstgebauten
      Sprungseils fuer einen Bungee-Sprung verstoesst gegen die im Verkehr erforderliche
      Sorgfalt.
  - prompt: Waren Erfolg und Kausalverlauf objektiv vorhersehbar?
    erwartung: Ja - dass ein ungeprueftes Seil reissen und der Springer dadurch toedlich
      verungluecken kann, liegt fuer einen besonnenen Menschen auf der Hand.
  - prompt: Entfaellt die objektive Zurechnung wegen eigenverantwortlicher Selbstgefaehrdung
      des B?
    erwartung: Ja - B kannte das Risiko genau, weil A ihn ausdruecklich gewarnt hatte,
      und hat sich freiwillig und eigenverantwortlich fuer den Sprung entschieden.
      Die Tatherrschaft ueber den lebensgefaehrlichen Akt selbst lag allein bei B;
      A hat die Gefahr lediglich ermoeglicht. Der Erfolg faellt daher in Bs eigenen
      Verantwortungsbereich.
  - prompt: Formuliere das Ergebnis.
    erwartung: A hat sich mangels objektiver Zurechnung des Erfolgs nicht wegen fahrlaessiger
      Toetung gemaess § 222 StGB strafbar gemacht.
  expectation:
    pruefpunkte:
    - id: p1
      label: Obersatz mit § 222 StGB
      weight: 1.0
      required: false
      norms:
      - § 222 StGB
      keywords:
      - '222'
    - id: p2
      label: Objektive Sorgfaltspflichtverletzung bejaht (mangelhaftes Seil)
      weight: 1.5
      required: false
      keywords:
      - Sorgfaltspflichtverletzung
    - id: p3
      label: Kausalitaet und objektive Vorhersehbarkeit bejaht
      weight: 1.0
      required: false
      keywords:
      - vorhersehbar
    - id: p4
      label: Eigenverantwortliche Selbstgefaehrdung erkannt und Zurechnung deshalb
        verneint
      weight: 3.5
      required: true
      norms:
      - § 222 StGB
      keywords:
      - eigenverantwortliche Selbstgefaehrdung
      - Zurechnung
    - id: p5
      label: 'Begruendung: B kannte das Risiko, traf freie Entscheidung, A hatte keine
        Tatherrschaft'
      weight: 2.0
      required: true
      keywords:
      - Tatherrschaft
      - eigene Entscheidung
    - id: p6
      label: 'Ergebnis: keine Strafbarkeit mangels objektiver Zurechnung'
      weight: 1.0
      required: false
      keywords:
      - nicht strafbar
      - keine Zurechnung
