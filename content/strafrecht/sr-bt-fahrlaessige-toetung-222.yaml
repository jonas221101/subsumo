    - label: 2. Individuelle Vorhersehbarkeit und Vermeidbarkeit
faelle:
- slug: sr-fall-bungee-sprung-marodes-seil
  title: Der improvisierte Bungee-Sprung
  difficulty: 3
  minutes: 40
  quellen:
  - Eigener Sachverhalt der Redaktion
  - StGB, amtliche Fassung
  facts: Auf einer privaten Sommerfeier bietet A, ein selbsternannter Extremsport-Enthusiast
    ohne einschlägige Ausbildung, den Gästen einen improvisierten Bungee-Sprung
    von einer alten Brücke an. A weist den volljährigen B ausdrücklich darauf hin,
    dass das von ihm mitgebrachte Seil selbstgebaut und nicht geprüft sei und durchaus
    reißen könne. B, der das Risiko genau versteht, meldet sich dennoch freiwillig,
    lässt sich das Seil um die Füße binden und springt. Das Seil reißt, B stürzt
    in die Tiefe und stirbt an den Folgen des Sturzes.
  question: Hat sich A dadurch, dass er den Sprung angeboten und das mangelhafte Seil
    zur Verfügung gestellt hat, wegen fahrlässiger Tötung gemäß § 222 StGB strafbar
    gemacht?
  steps:
  - prompt: Formuliere den Obersatz.
    erwartung: A könnte sich durch das Bereitstellen des Seils und Ermöglichen des
      Sprungs wegen fahrlässiger Tötung gemäß § 222 StGB strafbar gemacht haben.
  - prompt: Liegt eine objektive Sorgfaltspflichtverletzung vor?
    erwartung: Ja - das Bereitstellen eines erkennbar ungeprüften, selbstgebauten
      Sprungseils für einen Bungee-Sprung verstößt gegen die im Verkehr erforderliche
      Sorgfalt.
  - prompt: Waren Erfolg und Kausalverlauf objektiv vorhersehbar?
    erwartung: Ja - dass ein ungeprüftes Seil reißen und der Springer dadurch tödlich
      verunglücken kann, liegt für einen besonnenen Menschen auf der Hand.
  - prompt: Entfällt die objektive Zurechnung wegen eigenverantwortlicher Selbstgefährdung
      des B?
    erwartung: Ja - B kannte das Risiko genau, weil A ihn ausdrücklich gewarnt hatte,
      und hat sich freiwillig und eigenverantwortlich für den Sprung entschieden.
      Die Tatherrschaft über den lebensgefährlichen Akt selbst lag allein bei B;
      A hat die Gefahr lediglich ermöglicht. Der Erfolg fällt daher in Bs eigenen
      Verantwortungsbereich.
  - prompt: Formuliere das Ergebnis.
    erwartung: A hat sich mangels objektiver Zurechnung des Erfolgs nicht wegen fahrlässiger
      Tötung gemäß § 222 StGB strafbar gemacht.
  expectation:
    pruefpunkte:
    - id: p1
      label: Obersatz mit § 222 StGB
      weight: 1.0
      required: false
      norms:
      - § 222 StGB
      keywords:
      - '222'
    - id: p2
      label: Objektive Sorgfaltspflichtverletzung bejaht (mangelhaftes Seil)
      weight: 1.5
      required: false
      keywords:
      - Sorgfaltspflichtverletzung
      card_slugs:
      - sr-fahrlaessigkeit-objektive-sorgfaltspflichtverletzung
    - id: p3
      label: Kausalität und objektive Vorhersehbarkeit bejaht
      weight: 1.0
      required: false
      keywords:
      - vorhersehbar
      card_slugs:
      - sr-fahrlaessigkeit-objektive-vorhersehbarkeit
    - id: p4
      label: Eigenverantwortliche Selbstgefährdung erkannt und Zurechnung deshalb
        verneint
      weight: 3.5
      required: true
      norms:
      - § 222 StGB
      keywords:
      - eigenverantwortliche Selbstgefährdung
      - Zurechnung
      card_slugs:
      - sr-fahrlaessigkeit-eigenverantwortliche-selbstgefaehrdung
    - id: p5
      label: 'Begründung: B kannte das Risiko, traf freie Entscheidung, A hatte keine
        Tatherrschaft'
      weight: 2.0
      required: true
      keywords:
      - Tatherrschaft
      - eigene Entscheidung
      card_slugs:
      - sr-fahrlaessigkeit-eigenverantwortliche-selbstgefaehrdung
    - id: p6
      label: 'Ergebnis: keine Strafbarkeit mangels objektiver Zurechnung'
      weight: 1.0
      required: false
      keywords:
      - nicht strafbar
      - keine Zurechnung
