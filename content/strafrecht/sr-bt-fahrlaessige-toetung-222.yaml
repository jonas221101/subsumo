  - Eigenformulierung Redaktion
  steps:
  - label: I. Tatbestand
    children:
    - label: '1. Erfolg: Tod eines Menschen'
    - label: 2. Handlung und Kausalität (Äquivalenztheorie)
    - label: 3. Objektive Sorgfaltspflichtverletzung
    - label: 4. Objektive Vorhersehbarkeit von Erfolg und Kausalverlauf
    - label: 5. Objektive Zurechnung
      children:
      - label: a) Pflichtwidrigkeitszusammenhang (rechtmäßiges Alternativverhalten)
      - label: b) Schutzzweckzusammenhang
      - label: c) Kein Ausschluss durch eigenverantwortliche Selbstgefährdung des
          Opfers
        hinweis: Nur prüfen, wenn der Sachverhalt eine Mitwirkung oder Selbstgefährdung
          des späteren Opfers zeigt.
  - label: II. Rechtswidrigkeit
  - label: III. Schuld
    children:
