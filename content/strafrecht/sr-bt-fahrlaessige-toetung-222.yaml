cards:
- slug: sr-fahrlaessigkeit-begriff
  type: definition
  front: 'Definiere: Fahrlaessigkeit im Strafrecht'
  back: Fahrlaessig handelt, wer die im Verkehr erforderliche Sorgfalt ausser Acht
    laesst und dadurch einen tatbestandlichen Erfolg verursacht, den er bei Anwendung
    der gebotenen Sorgfalt haette vorhersehen und vermeiden koennen. Fahrlaessiges
    Handeln ist gemaess § 15 StGB nur strafbar, wenn das Gesetz dies ausdruecklich
    bestimmt - fuer die Toetung eines Menschen geschieht dies durch § 222 StGB.
  norms:
  - § 15 StGB
  - § 222 StGB
  quellen:
  - StGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sr-fahrlaessigkeit-objektive-sorgfaltspflichtverletzung
  type: definition
  front: Woran misst sich die objektive Sorgfaltspflichtverletzung?
  back: Massstab ist das Verhalten eines gewissenhaften und besonnenen Menschen aus
    dem Verkehrskreis des Taeters in der konkreten Situation. Konkretisieren Rechtsnormen
    (z. B. Verkehrs- oder Unfallverhuetungsvorschriften) den Sorgfaltsmassstab, indizieren
    sie regelmaessig dessen Verletzung; fehlen solche Normen, ist auf die allgemeine
    Verkehrserwartung abzustellen.
  norms:
  - § 222 StGB
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sr-fahrlaessigkeit-objektive-vorhersehbarkeit
  type: definition
  front: Was verlangt die objektive Vorhersehbarkeit beim Fahrlaessigkeitsdelikt?
  back: Der Eintritt des tatbestandlichen Erfolgs und der Kausalverlauf muessen in
    ihren wesentlichen Zuegen fuer einen besonnenen Menschen in der Position des Taeters
    vorhersehbar gewesen sein. Nicht erforderlich ist die Vorhersehbarkeit des konkreten
    Geschehensablaufs bis ins Detail.
  norms:
  - § 222 StGB
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sr-fahrlaessigkeit-pflichtwidrigkeitszusammenhang
  type: streitstand
  front: Was bedeutet Pflichtwidrigkeitszusammenhang, und welche Rolle spielt rechtmaessiges
    Alternativverhalten?
  back: Der Erfolg muss gerade auf der Sorgfaltspflichtverletzung beruhen. Waere derselbe
    Erfolg mit an Sicherheit grenzender Wahrscheinlichkeit auch bei pflichtgemaessem
    Verhalten eingetreten, fehlt es am Pflichtwidrigkeitszusammenhang und die objektive
    Zurechnung entfaellt. Nach der im Vordringen befindlichen Risikoerhoehungslehre
    genuegt es dagegen, dass das pflichtwidrige Verhalten das Risiko des Erfolgseintritts
    gegenueber pflichtgemaessem Verhalten messbar erhoeht hat.
  norms:
  - § 222 StGB
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sr-fahrlaessigkeit-schutzzweckzusammenhang
  type: definition
  front: Was verlangt der Schutzzweckzusammenhang beim Fahrlaessigkeitsdelikt?
  back: Der eingetretene Erfolg muss gerade in den Schutzbereich der verletzten Sorgfaltsnorm
    fallen. Verwirklicht sich im Erfolg ein Risiko, vor dem die verletzte Norm gar
    nicht schuetzen wollte, entfaellt die objektive Zurechnung trotz Sorgfaltspflichtverletzung
    und Kausalitaet.
  norms:
  - § 222 StGB
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sr-fahrlaessigkeit-eigenverantwortliche-selbstgefaehrdung
  type: streitstand
  front: Wann schliesst eigenverantwortliche Selbstgefaehrdung des Opfers die objektive
    Zurechnung aus?
  back: Begibt sich das Opfer in voller Kenntnis des Risikos freiwillig und eigenverantwortlich
    selbst in eine Gefahr, die sich anschliessend realisiert, faellt der Erfolg in
    seinen eigenen Verantwortungsbereich. Wer die Selbstgefaehrdung lediglich ermoeglicht
    oder foerdert, ohne selbst die Tatherrschaft ueber den gefaehrdenden Akt zu haben,
    haftet dafuer grundsaetzlich nicht wegen eines Fahrlaessigkeitsdelikts - vorausgesetzt,
    das Opfer durchschaut Art und Ausmass des Risikos ebenso wie derjenige, der die
    Gefahr foerdert. Anders liegt es bei der einverstaendlichen Fremdgefaehrdung,
    bei der ein anderer die Tatherrschaft behaelt und das Opfer sich lediglich in
    dessen Gefahrenbereich begibt - hier bleibt eine Zurechnung grundsaetzlich moeglich.
  norms:
  - § 222 StGB
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sr-fahrlaessigkeit-doppelter-massstab
  type: definition
  front: Warum wird bei der Fahrlaessigkeit zwischen einem objektiven und einem individuellen
    Massstab unterschieden?
  back: 'Auf Tatbestandsebene wird die Sorgfaltspflichtverletzung objektiv-generalisierend
    anhand eines gedachten gewissenhaften und besonnenen Menschen in der Situation
    und sozialen Rolle des Taeters bestimmt. Auf der Schuldebene kommt es dagegen
    auf die individuellen Faehigkeiten und Kenntnisse des konkreten Taeters an: Wer
    aufgrund persoenlicher Unterlegenheit die objektiv gebotene Sorgfalt gar nicht
    haette erbringen koennen, dem fehlt insoweit der individuelle Schuldvorwurf.'
  norms:
  - § 222 StGB
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
