cards:
- slug: sr-fahrlaessigkeit-begriff
  type: definition
  front: 'Definiere: Fahrlässigkeit im Strafrecht'
  back: Fahrlässig handelt, wer die im Verkehr erforderliche Sorgfalt außer Acht
    lässt und dadurch einen tatbestandlichen Erfolg verursacht, den er bei Anwendung
    der gebotenen Sorgfalt hätte vorhersehen und vermeiden können. Fahrlässiges
    Handeln ist gemäß § 15 StGB nur strafbar, wenn das Gesetz dies ausdrücklich
    bestimmt - für die Tötung eines Menschen geschieht dies durch § 222 StGB.
  norms:
  - § 15 StGB
  - § 222 StGB
  quellen:
  - StGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sr-fahrlaessigkeit-objektive-sorgfaltspflichtverletzung
  type: definition
  front: Woran misst sich die objektive Sorgfaltspflichtverletzung?
  back: Maßstab ist das Verhalten eines gewissenhaften und besonnenen Menschen aus
    dem Verkehrskreis des Täters in der konkreten Situation. Konkretisieren Rechtsnormen
    (z. B. Verkehrs- oder Unfallverhütungsvorschriften) den Sorgfaltsmaßstab, indizieren
    sie regelmäßig dessen Verletzung; fehlen solche Normen, ist auf die allgemeine
    Verkehrserwartung abzustellen.
  norms:
  - § 222 StGB
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sr-fahrlaessigkeit-objektive-vorhersehbarkeit
  type: definition
  front: Was verlangt die objektive Vorhersehbarkeit beim Fahrlässigkeitsdelikt?
  back: Der Eintritt des tatbestandlichen Erfolgs und der Kausalverlauf müssen in
    ihren wesentlichen Zügen für einen besonnenen Menschen in der Position des Täters
    vorhersehbar gewesen sein. Nicht erforderlich ist die Vorhersehbarkeit des konkreten
    Geschehensablaufs bis ins Detail.
  norms:
  - § 222 StGB
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sr-fahrlaessigkeit-pflichtwidrigkeitszusammenhang
  type: streitstand
  front: Was bedeutet Pflichtwidrigkeitszusammenhang, und welche Rolle spielt rechtmäßiges
    Alternativverhalten?
  back: Der Erfolg muss gerade auf der Sorgfaltspflichtverletzung beruhen. Wäre derselbe
    Erfolg mit an Sicherheit grenzender Wahrscheinlichkeit auch bei pflichtgemäßem
    Verhalten eingetreten, fehlt es am Pflichtwidrigkeitszusammenhang und die objektive
    Zurechnung entfällt. Nach der im Vordringen befindlichen Risikörhöhungslehre
    genügt es dagegen, dass das pflichtwidrige Verhalten das Risiko des Erfolgseintritts
    gegenüber pflichtgemäßem Verhalten messbar erhöht hat.
  norms:
  - § 222 StGB
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sr-fahrlaessigkeit-schutzzweckzusammenhang
  type: definition
  front: Was verlangt der Schutzzweckzusammenhang beim Fahrlässigkeitsdelikt?
  back: Der eingetretene Erfolg muss gerade in den Schutzbereich der verletzten Sorgfaltsnorm
    fallen. Verwirklicht sich im Erfolg ein Risiko, vor dem die verletzte Norm gar
    nicht schützen wollte, entfällt die objektive Zurechnung trotz Sorgfaltspflichtverletzung
    und Kausalität.
  norms:
  - § 222 StGB
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sr-fahrlaessigkeit-eigenverantwortliche-selbstgefaehrdung
  type: streitstand
  front: Wann schließt eigenverantwortliche Selbstgefährdung des Opfers die objektive
    Zurechnung aus?
  back: Begibt sich das Opfer in voller Kenntnis des Risikos freiwillig und eigenverantwortlich
    selbst in eine Gefahr, die sich anschließend realisiert, fällt der Erfolg in
    seinen eigenen Verantwortungsbereich. Wer die Selbstgefährdung lediglich ermöglicht
    oder fördert, ohne selbst die Tatherrschaft über den gefährdenden Akt zu haben,
    haftet dafür grundsätzlich nicht wegen eines Fahrlässigkeitsdelikts - vorausgesetzt,
    das Opfer durchschaut Art und Ausmaß des Risikos ebenso wie derjenige, der die
    Gefahr fördert. Anders liegt es bei der einverständlichen Fremdgefährdung,
    bei der ein anderer die Tatherrschaft behält und das Opfer sich lediglich in
    dessen Gefahrenbereich begibt - hier bleibt eine Zurechnung grundsätzlich möglich.
  norms:
  - § 222 StGB
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sr-fahrlaessigkeit-doppelter-massstab
  type: definition
  front: Warum wird bei der Fahrlässigkeit zwischen einem objektiven und einem individuellen
    Maßstab unterschieden?
  back: 'Auf Tatbestandsebene wird die Sorgfaltspflichtverletzung objektiv-generalisierend
    anhand eines gedachten gewissenhaften und besonnenen Menschen in der Situation
    und sozialen Rolle des Täters bestimmt. Auf der Schuldebene kommt es dagegen
    auf die individuellen Fähigkeiten und Kenntnisse des konkreten Täters an: Wer
    aufgrund persönlicher Unterlegenheit die objektiv gebotene Sorgfalt gar nicht
    hätte erbringen können, dem fehlt insoweit der individuelle Schuldvorwurf.'
  norms:
  - § 222 StGB
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
schemata:
- slug: sr-schema-222
  title: Fahrlässige Tötung, § 222 StGB
  norms:
  - § 222 StGB
  quellen:
