cards:
- slug: sr-hf-rechtsgut-tatobjekte
  type: definition
  front: Welches Rechtsgut schützt § 123 StGB und welche Tatobjekte nennt die Norm?
  back: >-
    § 123 StGB schützt das Hausrecht als Teil der Privatsphäre, also die Freiheit
    des Berechtigten, darüber zu bestimmen, wer sich in seinem befriedeten Bereich
    aufhält. Tatobjekte sind die Wohnung (Räume, die dem Aufenthalt von Menschen
    zum Zweck des Wohnens dienen, einschließlich Nebenräumen), die Geschäftsräume
    (Räume, die einer gewerblichen oder beruflichen Tätigkeit dienen, auch Büros und
    Verkaufsräume), das befriedete Besitztum und abgeschlossene Räume, die zum
    öffentlichen Dienst oder Verkehr bestimmt sind (Behörden, Bahnhöfe, Schulen).
    Befriedet ist ein Besitztum, wenn es durch zusammenhängende, äußerlich
    erkennbare Schutzvorkehrungen (Zaun, Mauer, Hecke) gegen willkürliches Betreten
    gesichert ist; lückenlose Einfriedung ist nicht nötig. Die Tat ist ein
    Antragsdelikt (§ 123 Abs. 2 StGB) mit Freiheitsstrafe bis zu einem Jahr oder
    Geldstrafe.
  norms:
  - § 123 Abs. 1 StGB
  - § 123 Abs. 2 StGB
  quellen:
  - StGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-10
- slug: sr-hf-berechtigter
  type: definition
  front: Wer ist Berechtigter im Sinne des § 123 StGB?
  back: >-
    Berechtigter ist, wer über den geschützten Raum rechtmäßig verfügt, also die
    Befugnis hat, über den Zutritt zu bestimmen (Inhaber des Hausrechts). Maßgeblich ist
    die tatsächliche und rechtlich geschützte Verfügungsmacht, nicht allein das
    Eigentum. Bei vermieteten Räumen ist der Mieter Berechtigter, der Vermieter
    nicht; im Betrieb ist es der Betriebsinhaber oder der Behördenleiter. Das
    Hausrecht kann delegiert werden (Hausmeister, Sicherheitsdienst, Angestellte
    für ihren Bereich). Bei mehreren gleichberechtigten Inhabern (Ehegatten,
    Wohngemeinschaft) kann grundsätzlich jeder Einlass gewähren. Streitig ist, wie
    Konflikte zu lösen sind: Teils gilt das Prioritätsprinzip (der erste
    erklärte Wille), teils kann der Widerspruch eines Mitinhabers den Zutritt
    entgegenstehen lassen, jedenfalls für gemeinsam genutzte Räume. Im eigenen
    Zimmer entscheidet der Bewohner allein. Strafantragsberechtigt ist der
    Verletzte, also der Berechtigte.
  norms:
  - § 123 Abs. 1 StGB
  - § 123 Abs. 2 StGB
  quellen:
  - StGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-10
- slug: sr-hf-eindringen
  type: definition
  front: Was bedeutet "Eindringen" bei § 123 Abs. 1 StGB?
  back: >-
    Eindringen ist das Betreten des geschützten Bereichs gegen den Willen
    des Berechtigten, also ohne dessen Einverständnis. Der Körper des Täters muss
    zumindest teilweise in den Raum gelangen; das bloße Hineinschauen oder
    Hineinreichen eines Gegenstands genügt nicht. Das Eindringen ist vollendet, sobald der Täter
    den Bereich betreten hat; es ist kein Dauerdelikt hinsichtlich des Eindringens,
    wohl aber hinsichtlich des anschließenden Verweilens. Der Wille des Berechtigten
    kann ausdrücklich oder konkludent erklärt sein; maßgeblich ist der nach außen
    erkennbare Wille. Fehlt der Wille, etwa weil der Berechtigte die Sache nicht
    bedacht hat, kommt es auf den mutmaßlichen Willen an. Bei öffentlich
    zugänglichen Räumen besteht ein generelles Einverständnis für alle, die den Zutritt
    zu den üblichen Zwecken wünschen, sofern kein Hausverbot gilt.
  norms:
  - § 123 Abs. 1 StGB
  quellen:
  - StGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-10
- slug: sr-hf-einverstaendnis
  type: streitstand
  front: 'Streitstand: Einverständnis, Einwilligung und Willensmängel bei § 123 StGB'
  back: >-
    Das Einverständnis des Berechtigten schließt bereits den Tatbestand aus, weil
    "Eindringen" den entgegenstehenden Willen voraussetzt (tatbestandsausschließendes
    Einverständnis); eine Einwilligung als Rechtfertigungsgrund kommt daneben nicht
    in Betracht. Bedeutung hat dies für die Behandlung von Willensmängeln. Die
    herrschende Auffassung hält auch ein durch Täuschung oder Irrtum erlangtes
    Einverständnis für wirksam, weil es auf den tatsächlich geäußerten natürlichen
    Willen ankomme (Beispiel: Dieb gibt sich als Kunde aus); der Schutz vor
    Täuschung sei Sache anderer Delikte (§ 263 StGB). Eine Mindermeinung nimmt
    Unwirksamkeit an, wenn der Täter über Identität oder den Zweck täuscht, den der
    Berechtigte nicht hingenommen hätte. Unwirksam ist das Einverständnis nach allen
    Meinungen, wenn es durch Gewalt oder Drohung erzwungen wurde. Das Einverständnis
    kann beschränkt sein (Zweckbindung, Zeit, Raum); wer die Grenzen überschreitet,
    dringt ein.
  norms:
  - § 123 Abs. 1 StGB
  - § 263 Abs. 1 StGB
  quellen:
  - StGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-10
- slug: sr-hf-verweilen
  type: definition
  front: Wann erfüllt das Verweilen ohne Befugnis den Tatbestand des § 123 Abs. 1 StGB?
  back: >-
    Die zweite Tatvariante ist ein echtes Unterlassungsdelikt: Strafbar ist,
    wer ohne Befugnis in den geschützten Räumen verweilt und sich auf die
    Aufforderung des Berechtigten nicht entfernt. Der Täter kann ursprünglich
    befugt eingetreten sein (zum Beispiel Kunde nach Ladenschluss, Gast nach
    Wegfall der Zustimmung). Notwendig ist eine Aufforderung, die ausdrücklich
    oder durch schlüssiges Verhalten erfolgt und deutlich macht, dass der
    Aufenthalt nicht mehr geduldet wird. Dem Täter ist eine angemessene Zeit zum
    Verlassen einzuräumen; die Frist hängt von den Umständen ab (Kleidung holen,
    Weg). Nicht erforderlich ist eine Wiederholung der Aufforderung. Verweilen
    bedeutet das Bleiben über die Dauer hinaus, die für das Verlassen nötig ist.
    Wer schon widerrechtlich eingedrungen ist, erfüllt die erste Variante; die
    zweite tritt dann zurück, beide bilden eine Tat.
  norms:
  - § 123 Abs. 1 StGB
  quellen:
  - StGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-10
- slug: sr-hf-widerrechtlich
  type: definition
  front: Welche Bedeutung hat "widerrechtlich" bzw. "ohne Befugnis" im Tatbestand des § 123 StGB?
  back: >-
    "Widerrechtlich" ist nach h.M. ein Hinweis auf die allgemeine Rechtswidrigkeit,
    kein eigenständiges Tatbestandsmerkmal. Es verweist auf Rechtfertigungsgründe, die
    das Eindringen oder Verweilen gestatten: öffentlich-rechtliche Befugnisse
    (Durchsuchung nach den §§ 102 ff. StPO, polizeiliche Eingriffsbefugnisse,
    Zutrittsrechte von Beamten), Notwehr und Notstand (§§ 32, 34 StGB; Betreten
    zur Rettung von Menschen), Selbsthilfe (§ 229 BGB) sowie
    vertragliche und gesetzliche Zutrittsrechte (zum Beispiel des Vermieters bei
    Gefahr im Verzug). Das Einverständnis ist dagegen Tatbestandsproblem
    (Eindringen). Ein Irrtum über die
    tatsächlichen Voraussetzungen eines Rechtfertigungsgrundes
    (Erlaubnistatbestandsirrtum) ist nach den allgemeinen Regeln zu behandeln.
  norms:
  - § 123 Abs. 1 StGB
  - § 32 StGB
  - § 34 StGB
  - § 229 BGB
  quellen:
  - StGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-10
- slug: sr-hf-hausverbot-oeffentlich
  type: rechtsprechung
  front: Hausverbot in öffentlich zugänglichen Räumen - was gilt für private und staatlich beherrschte Betreiber?
  back: >-
    Bei öffentlich zugänglichen Geschäftsräumen (Kaufhaus, Gaststätte) hat der
    private Inhaber ein Hausrecht, das er durch ein Hausverbot gegenüber einzelnen
    Personen ausüben darf. Das Hausverbot beseitigt das generelle Einverständnis;
    wer es missachtet, dringt ein. Das Hausverbot braucht grundsätzlich keinen
    sachlichen Grund, ist aber durch das AGG und zivilrechtliche Schranken
    begrenzt. Bei Räumen in staatlicher Hand gilt die Grundrechtsbindung. Das
    Bundesverfassungsgericht hat im Fraport-Urteil (BVerfGE 128, 226) entschieden,
    dass auch gemischtwirtschaftliche Unternehmen in öffentlicher Hand, die
    einen für die Allgemeinheit geöffneten Raum der Kommunikation betreiben
    (Flughafenterminal), unmittelbar grundrechtsgebunden sind. Ein Hausverbot
    gegen Versammlungen oder Meinungsäußerungen muss daher die Versammlungs- und
    Meinungsfreiheit (Art. 5, 8 GG) beachten und verhältnismäßig sein. Im
    Strafrecht wirkt sich das auf die Wirksamkeit der Befugnis aus.
  norms:
  - § 123 Abs. 1 StGB
  - Art. 8 Abs. 1 GG
  - Art. 5 Abs. 1 GG
  quellen:
  - BVerfGE 128, 226 (Fraport)
  - StGB, amtliche Fassung
  stand: 2026-10
- slug: sr-hf-124
  type: norm
  front: Was regelt der schwere Hausfriedensbruch, § 124 StGB?
  back: >-
    § 124 StGB bestraft jeden, der sich an dem Eindringen einer Menschenmenge beteiligt,
    die sich öffentlich zusammenrottet und in der Absicht, Gewalttätigkeiten gegen
    Personen oder Sachen mit vereinten Kräften zu begehen, in die Wohnung, die
    Geschäftsräume, das befriedete Besitztum eines anderen oder in abgeschlossene
    Räume, die zum öffentlichen Dienst oder Verkehr bestimmt sind, widerrechtlich
    eindringt. Die Strafe ist Freiheitsstrafe bis zu zwei Jahren oder Geldstrafe.
    Die Vorschrift setzt keinen Strafantrag voraus. Menschenmenge ist eine nach
    Zahl nicht mehr überschaubare Personenmehrheit; die Zusammenrottung muss
    öffentlich geschehen, also für einen unbestimmten Personenkreis wahrnehmbar
    oder zugänglich. Sie steht in engem Zusammenhang mit dem
    Landfriedensbruch (§ 125 StGB). Der Teilnehmer muss die Gewaltabsicht der Menge
    kennen.
  norms:
  - § 124 StGB
  - § 125 StGB
  quellen:
  - StGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-10
- slug: sr-hf-strafantrag-konkurrenzen
  type: norm
  front: Wie ist der Strafantrag nach § 123 Abs. 2 StGB geregelt und wie verhält sich § 123 StGB zu anderen Delikten?
  back: >-
    § 123 Abs. 2 StGB macht die Verfolgung von einem Strafantrag abhängig
    (absolutes Antragsdelikt). Antragsberechtigt ist der Verletzte, also der
    Berechtigte; die Frist beträgt drei Monate ab Kenntnis von Tat und Täter (§ 77b
    StGB). Die Staatsanwaltschaft kann bei besonderem öffentlichen Interesse nicht
    ohne Antrag verfolgen, anders als bei den relativen Antragsdelikten. Zu
    Eigentumsdelikten wie Diebstahl (§ 242 StGB) steht § 123 StGB regelmäßig in
    Tateinheit (§ 52 StGB), weil Hausfriedensbruch und Zueignung unterschiedliche
    Rechtsgüter betreffen; beim Wohnungseinbruchdiebstahl (§ 244 Abs. 4 StGB) wird das Verhältnis
    uneinheitlich beurteilt. Die Sachbeschädigung (§ 303 StGB) beim Einbrechen steht im
    Verhältnis der Tateinheit. Das Verweilen nach Aufforderung ist
    mit dem vorherigen Eindringen eine einheitliche Tat, wenn sie dasselbe Hausrecht
    verletzen.
  norms:
  - § 123 Abs. 2 StGB
  - § 77b StGB
  - § 52 StGB
  quellen:
  - StGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-10
