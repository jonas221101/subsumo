- slug: sr-schema-hf-123
  title: Hausfriedensbruch, § 123 Abs. 1 StGB
  norms:
  - § 123 Abs. 1 StGB
  - § 123 Abs. 2 StGB
  quellen:
  - StGB, amtliche Fassung
  - Eigenformulierung Redaktion
  steps:
  - label: I. Tatbestand
    children:
    - label: 1. Objektiver Tatbestand
      children:
      - label: a) Tatobjekt - Wohnung, Geschäftsräume, befriedetes Besitztum oder abgeschlossene Räume für öffentlichen Dienst oder Verkehr
        hinweis: Das Tatobjekt muss einem anderen zugeordnet sein.
      - label: b) Tathandlung - Eindringen oder Verweilen
        children:
        - label: aa) Eindringen - Betreten gegen den Willen des Berechtigten
          hinweis: Einverständnis? Hausverbot? Willensmängel (Täuschung) - Streit.
        - label: bb) Verweilen ohne Befugnis nach Aufforderung zum Entfernen
          hinweis: Angemessene Zeit zum Verlassen einräumen.
    - label: 2. Subjektiver Tatbestand (Vorsatz, bedingter Vorsatz genügt)
  - label: II. Rechtswidrigkeit ("widerrechtlich")
    hinweis: Rechtfertigungsgründe prüfen - Durchsuchungsbefugnis, Notstand, Notwehr,
      Selbsthilfe.
  - label: III. Schuld
  - label: IV. Strafantrag, § 123 Abs. 2 StGB
    hinweis: Strafantragsberechtigt ist der Hausrechtsinhaber; Frist drei Monate, § 77b
      StGB.
  - label: V. Schwerer Hausfriedensbruch, § 124 StGB
    hinweis: Nur bei Menschenmenge, die sich öffentlich zusammenrottet.
faelle:
- slug: sr-fall-hf-hausverbot
  title: Das Hausverbot in der Gaststätte
  difficulty: 2
  minutes: 30
  quellen:
  - Eigener Sachverhalt der Redaktion
  - StGB, amtliche Fassung
  facts: >-
    Gastwirt W betreibt eine Gaststätte. Vor drei Wochen hat G dort randaliert,
    Gläser zerschlagen und andere Gäste angepöbelt. W sprach daraufhin ein
    ausdrückliches Hausverbot aus: "Du bekommst hier nie wieder etwas zu trinken, du
    kommst nicht mehr rein." G nahm das zur Kenntnis. Einige Tage später betritt G
    während der Öffnungszeiten die Gaststätte, setzt sich an einen Tisch und
    bestellt ein Bier bei der Bedienung. W erkennt ihn nach zehn Minuten, fordert ihn
    deutlich auf, sofort zu gehen, und G bleibt trotzdem noch fünf Minuten sitzen,
    bevor er die Gaststätte verlässt. W stellt rechtzeitig Strafantrag.
  question: Hat sich G wegen Hausfriedensbruchs nach § 123 StGB strafbar gemacht?
  steps:
  - prompt: Handelt es sich bei der Gaststätte um ein taugliches Tatobjekt und wer ist Berechtigter?
    erwartung: Ja. Die Gaststätte besteht aus Geschäftsräumen im Sinne des § 123 Abs.
      1 StGB. Berechtigter ist W als Inhaber des Hausrechts.
  - prompt: Ist G eingedrungen, obwohl die Gaststätte für Gäste geöffnet ist?
    erwartung: Ja. Die Öffnung für das Publikum begründet ein generelles
      Einverständnis nur für Personen, gegen die kein Hausverbot besteht. W hat das
      Einverständnis gegenüber G durch das ausdrückliche Hausverbot ausgeschlossen. G
      betrat die Räume daher gegen den Willen des Berechtigten und ist
      widerrechtlich eingedrungen. Rechtfertigungsgründe sind nicht ersichtlich.
  - prompt: Wie ist das Verbleiben nach der Aufforderung zu bewerten?
    erwartung: Auch die zweite Variante (Verweilen nach Aufforderung) ist erfüllt, weil
      G nach der deutlichen Aufforderung nicht sofort ging. Sie tritt hinter das
      Eindringen zurück; beide Varianten bilden eine Tat.
  - prompt: Sind Vorsatz, Schuld und Strafantrag gegeben?
    erwartung: G kannte das Hausverbot und handelte vorsätzlich. Schuld liegt vor. W hat als
      Berechtigter fristgerecht Strafantrag nach § 123 Abs. 2 StGB gestellt; G ist
      strafbar.
