cards:
- slug: sr-diebstahl-fremde-bewegliche-sache
  type: definition
  front: 'Definiere: fremde bewegliche Sache i.S.d. § 242 Abs. 1 StGB'
  back: Eine Sache ist jeder körperliche Gegenstand (§ 90 BGB). Beweglich ist sie,
    wenn sie tatsächlich fortbewegt werden kann - auch wenn sie rechtlich unbeweglich
    ist. Fremd ist sie, wenn sie im Eigentum eines anderen steht und nicht herrenlos
    ist.
  norms:
  - § 242 Abs. 1 StGB
  - § 90 BGB
  quellen:
  - StGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sr-diebstahl-gewahrsam-begriff
  type: definition
  front: 'Definiere: Gewahrsam'
  back: Gewahrsam ist die von einem natürlichen Herrschaftswillen getragene tatsächliche
    Sachherrschaft, deren Reichweite sich nach der Verkehrsanschauung bestimmt. Auf
    zivilrechtlichen Besitz kommt es nicht an - auch ein Dieb kann strafrechtlich
    relevanten Gewahrsam an der gestohlenen Sache haben.
  norms:
  - § 242 Abs. 1 StGB
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sr-diebstahl-wegnahme-begriff
  type: definition
  front: 'Definiere: Wegnahme, § 242 Abs. 1 StGB'
  back: 'Wegnahme ist der Bruch fremden und die Begründung neuen, nicht notwendig
    täter­eigenen Gewahrsams. Bruch bedeutet: der Gewahrsam wird gegen oder ohne
    den Willen des bisherigen Gewahrsamsinhabers aufgehoben.'
  norms:
  - § 242 Abs. 1 StGB
  quellen:
  - StGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sr-diebstahl-vollendung-gewahrsamsenklave
  type: streitstand
  front: Wann ist die Wegnahme vollendet? Theorien, Gewahrsamswechsel und Beobachtung
  back: |-
    Historisch wurden verschiedene Zeitpunkte der Vollendung vertreten: Kontrektationstheorie (schon jede Berührung genügt), Apprehensionstheorie (das Ergreifen genügt), Ablationstheorie (die Sache muss aus dem Herrschaftsbereich des Berechtigten fortgetragen werden) und Illationstheorie (die Sache muss an den vom Täter erstrebten Ort gebracht werden). Heute maßgeblich ist die Gewahrsamswechseltheorie: Die Wegnahme ist vollendet, sobald der alte Gewahrsam gebrochen und neuer, eigener Gewahrsam begründet ist - beurteilt nach der Verkehrsanschauung.

    Bei kleinen, leicht verbergbaren Gegenständen genügt dafür das Einstecken in die am Körper getragene Kleidung oder Tasche: Der Täter begründet damit eigenen Gewahrsam innerhalb der fremden Gewahrsamssphäre (Gewahrsamsenklave); die Kleidung gehört zu seiner persönlichen Sphäre, der Zugriff des Berechtigten ist wegen des Zugriffs auf den Körper erschwert. Der Täter muss den Verkaufsraum nicht verlassen haben. Bei sperrigen Gegenständen (Fernseher) braucht es dagegen regelmäßig das Fortschaffen aus dem Herrschaftsbereich.

    Beobachtung: Wird der Täter von einem Detektiv oder Mitarbeiter beobachtet, hindert das die Vollendung nicht. Der Gewahrsamsbruch ist ein objektiver Gewahrsamswechsel; er hängt weder von der Heimlichkeit der Tat noch davon ab, dass der bisherige Inhaber den Verlust bemerkt (h.M.). Bloße Beobachtung und die Bereitschaft zum Eingreifen lassen den neu begründeten Gewahrsam nicht entfallen.
  norms:
  - § 242 Abs. 1 StGB
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sr-diebstahl-zueignungsabsicht
  type: definition
  front: 'Definiere: Absicht rechtswidriger Zueignung, § 242 Abs. 1 StGB'
  back: 'Zueignungsabsicht setzt zwei Komponenten voraus: die Aneignungskomponente
    - der Täter will die Sache oder zumindest den in ihr verkörperten Wert wenigstens
    vorübergehend seinem eigenen Vermögen einverleiben (insoweit ist dolus directus
    1. Grades erforderlich) - und die Enteignungskomponente - er will den Eigentümer
    dauerhaft aus seiner Position verdrängen (hierfür genügt dolus eventualis).'
  norms:
  - § 242 Abs. 1 StGB
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sr-diebstahl-rechtswidrigkeit-zueignung
  type: definition
  front: Wann ist die erstrebte Zueignung rechtswidrig?
  back: Die erstrebte Zueignung ist rechtswidrig, wenn dem Täter kein fälliger und
    einredefreier Anspruch auf Übereignung gerade dieser Sache zusteht. Bei einer
    Stückschuld (konkrete Sache geschuldet) und fälligem Anspruch ist die Zueignung
    nicht rechtswidrig. Bei einer Gattungsschuld (z. B. Geld) hat der Täter lediglich
    einen Anspruch auf Leistung durch den Schuldner; die Konkretisierung steht dem
    Schuldner zu (Wahlrecht, § 243 BGB). Der Täter hat kein Selbsthilferecht, sich
    irgendeine Sache der Gattung zu nehmen. Die Zueignung bleibt daher auch bei fälliger
    Gattungsschuld rechtswidrig (h.M.). Eine Gegenansicht stellt auf die wirtschaftliche
    Deckung von Anspruch und Erlangtem ab; sie verkennt die Entscheidungsbefugnis
    des Schuldners.
  norms:
  - § 242 Abs. 1 StGB
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sr-diebstahl-243-248a
  type: norm
  front: Was regeln § 243 StGB und § 248a StGB?
  back: '§ 243 StGB enthält Regelbeispiele für einen besonders schweren Fall des
    Diebstahls (z. B. Einbruchdiebstahl, § 243 Abs. 1 S. 2 Nr. 1 StGB) mit erhöhtem
    Strafrahmen, ohne den Tatbestand des § 242 StGB zu ändern. § 248a StGB macht
    den Diebstahl geringwertiger Sachen zu einem relativen Antragsdelikt: Er wird
    nur auf Antrag oder bei besonderem öffentlichen Interesse an der Strafverfolgung
    verfolgt.'
  norms:
  - § 243 StGB
  - § 248a StGB
  quellen:
  - StGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
schemata:
- slug: sr-schema-242
  title: Diebstahl, § 242 Abs. 1 StGB
  norms:
  - § 242 Abs. 1 StGB
  quellen:
  - StGB, amtliche Fassung
  - Eigenformulierung Redaktion
  steps:
  - label: I. Tatbestand
    children:
    - label: 1. Objektiver Tatbestand
      children:
      - label: a) Fremde bewegliche Sache
      - label: b) Wegnahme (Bruch fremden, Begründung neuen Gewahrsams)
        hinweis: Bei kleinen Gegenständen genügt das Einstecken in die Kleidung (eigener
          Gewahrsam in der Gewahrsamsenklave); Beobachtung durch Dritte hindert die
          Vollendung nicht. Der Täter muss den Tatort nicht verlassen haben.
    - label: 2. Subjektiver Tatbestand
      children:
      - label: a) Vorsatz bzgl. aller objektiven Tatbestandsmerkmale, § 15 StGB
      - label: b) Absicht rechtswidriger Zueignung
        children:
        - label: aa) Aneignungskomponente (dolus directus 1. Grades)
        - label: bb) Enteignungskomponente (dolus eventualis genügt)
        - label: cc) Rechtswidrigkeit der erstrebten Zueignung
  - label: II. Rechtswidrigkeit
  - label: III. Schuld
  - label: IV. Besonders schwerer Fall, § 243 StGB, und Strafantragserfordernis, §
      248a StGB
    hinweis: Nur prüfen, wenn der Sachverhalt dazu Anlass gibt.
faelle:
- slug: sr-fall-parfuemflasche
  title: Die Parfümflasche
  difficulty: 2
  minutes: 45
  quellen:
  - Eigener Sachverhalt der Redaktion
  - StGB, amtliche Fassung
  facts: A betritt eine Drogerie und nimmt eine Flasche Parfüm aus dem Regal. Um sie
    nicht bezahlen zu müssen, steckt er sie in die Innentasche seiner Jacke und geht
    in Richtung Ausgang. Kurz bevor er den Kassenbereich erreicht, wird er vom aufmerksamen
    Kaufhausdetektiv D angehalten, der die gesamte Szene beobachtet hatte; die Flasche
    wird sichergestellt. A hat das Ladengeschäft zu keinem Zeitpunkt verlassen.
  question: Hat sich A wegen vollendeten Diebstahls gemäß § 242 Abs. 1 StGB strafbar
    gemacht?
  steps:
  - prompt: Formuliere den Obersatz.
    erwartung: A könnte sich durch das Einstecken der Parfümflasche wegen Diebstahls
      gemäß § 242 Abs. 1 StGB strafbar gemacht haben.
  - prompt: Ist die Parfümflasche eine fremde bewegliche Sache?
    erwartung: Ja - sie steht im Eigentum der Drogerie und ist beweglich.
  - prompt: Liegt eine vollendete Wegnahme vor, obwohl A den Laden nicht verlassen
      hat?
    erwartung: 'Ja. Durch das Einstecken in die Innentasche der Jacke hat A eigenen
      neuen Gewahrsam in einer Gewahrsamsenklave innerhalb der fremden Gewahrsamssphäre
      begründet; der Gewahrsam der Drogerie ist gebrochen. Das Verlassen des Ladens
      ist nicht erforderlich. Dass der Detektiv D alles beobachtet hat, ändert nichts:
      Der Gewahrsamswechsel ist ein objektiver Vorgang und hängt nicht von Heimlichkeit
      ab; Beobachtung und Eingreifbereitschaft hindern die Vollendung nicht.'
  - prompt: Liegt Zueignungsabsicht vor?
    erwartung: Ja - A wollte die Flasche seinem eigenen Vermögen einverleiben (Aneignung)
      und die Drogerie dauerhaft von ihrem Eigentum ausschließen (Enteignung).
  - prompt: War die erstrebte Zueignung rechtswidrig?
    erwartung: Ja - A hatte keinen fälligen und einredefreien Anspruch auf Übereignung
      der Flasche.
