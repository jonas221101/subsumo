cards:
- slug: sr-diebstahl-fremde-bewegliche-sache
  type: definition
  front: 'Definiere: fremde bewegliche Sache i.S.d. § 242 Abs. 1 StGB'
  back: Eine Sache ist jeder koerperliche Gegenstand (§ 90 BGB). Beweglich ist sie,
    wenn sie tatsaechlich fortbewegt werden kann - auch wenn sie rechtlich unbeweglich
    ist. Fremd ist sie, wenn sie im Eigentum eines anderen steht und nicht herrenlos
    ist.
  norms:
  - § 242 Abs. 1 StGB
  - § 90 BGB
  quellen:
  - StGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sr-diebstahl-gewahrsam-begriff
  type: definition
  front: 'Definiere: Gewahrsam'
  back: Gewahrsam ist die von einem natuerlichen Herrschaftswillen getragene tatsaechliche
    Sachherrschaft, deren Reichweite sich nach der Verkehrsanschauung bestimmt. Auf
    zivilrechtlichen Besitz kommt es nicht an - auch ein Dieb kann strafrechtlich
    relevanten Gewahrsam an der gestohlenen Sache haben.
  norms:
  - § 242 Abs. 1 StGB
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sr-diebstahl-wegnahme-begriff
  type: definition
  front: 'Definiere: Wegnahme, § 242 Abs. 1 StGB'
  back: 'Wegnahme ist der Bruch fremden und die Begruendung neuen, nicht notwendig
    taeter­eigenen Gewahrsams. Bruch bedeutet: der Gewahrsam wird gegen oder ohne
    den Willen des bisherigen Gewahrsamsinhabers aufgehoben.'
  norms:
  - § 242 Abs. 1 StGB
  quellen:
  - StGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sr-diebstahl-vollendung-gewahrsamsenklave
  type: streitstand
  front: Wann ist die Wegnahme vollendet? Historische Theorien und heutige Loesung
  back: 'Historisch wurden verschiedene Zeitpunkte vertreten: Kontrektationstheorie

    (schon jede Beruehrung der Sache genuegt), Apprehensionstheorie (das

    Ergreifen der Sache genuegt) und Ablationstheorie (die Sache muss aus dem

    Herrschaftsbereich des Berechtigten fortgetragen werden). Alle drei gelten

    heute als zu weit bzw. zu eng.


    Heute massgeblich ist die Gewahrsamswechseltheorie: Wegnahme ist vollendet,

    sobald der alte Gewahrsam gebrochen und neuer, eigener Gewahrsam begruendet

    ist - beurteilt nach der Verkehrsanschauung. Bei kleinen, leicht in der

    Kleidung oder einer Tasche verbergbaren Gegenstaenden genuegt dafuer

    bereits das Einstecken in einen dem Zugriff Dritter entzogenen Bereich

    (sog. Gewahrsamsenklave) - der Taeter muss den Herrschaftsbereich des

    bisherigen Gewahrsamsinhabers (z. B. den Verkaufsraum) noch nicht

    verlassen haben.

    '
  norms:
  - § 242 Abs. 1 StGB
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sr-diebstahl-zueignungsabsicht
  type: definition
  front: 'Definiere: Absicht rechtswidriger Zueignung, § 242 Abs. 1 StGB'
  back: 'Zueignungsabsicht setzt zwei Komponenten voraus: die Aneignungskomponente
    - der Taeter will die Sache oder zumindest den in ihr verkoerperten Wert wenigstens
    voruebergehend seinem eigenen Vermoegen einverleiben (insoweit ist dolus directus
    1. Grades erforderlich) - und die Enteignungskomponente - er will den Eigentuemer
    dauerhaft aus seiner Position verdraengen (hierfuer genuegt dolus eventualis).'
  norms:
  - § 242 Abs. 1 StGB
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sr-diebstahl-rechtswidrigkeit-zueignung
  type: definition
  front: Wann ist die erstrebte Zueignung rechtswidrig?
  back: Die erstrebte Zueignung ist rechtswidrig, wenn dem Taeter kein faelliger und
    einredefreier Anspruch auf Uebereignung gerade dieser konkreten Sache zusteht.
    Hat der Taeter dagegen einen faelligen Anspruch auf eine gleichartige Sache aus
    einer Gattung (z. B. Geld), fehlt es bereits an der Gleichartigkeit mit dem geschuldeten
    Gegenstand - der Anspruch auf eine andere Sache derselben Gattung schliesst die
    Rechtswidrigkeit der Zueignung der konkreten weggenommenen Sache nicht aus.
  norms:
  - § 242 Abs. 1 StGB
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sr-diebstahl-243-248a
  type: norm
  front: Was regeln § 243 StGB und § 248a StGB?
  back: '§ 243 StGB enthaelt Regelbeispiele fuer einen besonders schweren Fall des
    Diebstahls (z. B. Einbruchdiebstahl, § 243 Abs. 1 S. 2 Nr. 1 StGB) mit erhoehtem
    Strafrahmen, ohne den Tatbestand des § 242 StGB zu aendern. § 248a StGB macht
    den Diebstahl geringwertiger Sachen zu einem relativen Antragsdelikt: Er wird
    nur auf Antrag oder bei besonderem oeffentlichen Interesse an der Strafverfolgung
    verfolgt.'
  norms:
  - § 243 StGB
  - § 248a StGB
  quellen:
  - StGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
schemata:
- slug: sr-schema-242
  title: Diebstahl, § 242 Abs. 1 StGB
  norms:
  - § 242 Abs. 1 StGB
  quellen:
  - StGB, amtliche Fassung
  - Eigenformulierung Redaktion
  steps:
  - label: I. Tatbestand
    children:
    - label: 1. Objektiver Tatbestand
      children:
      - label: a) Fremde bewegliche Sache
      - label: b) Wegnahme (Bruch fremden, Begruendung neuen Gewahrsams)
        hinweis: Bei kleinen Gegenstaenden genuegt das Einstecken in eine Gewahrsamsenklave,
          ohne dass der Taeter den Tatort verlassen haben muss.
    - label: 2. Subjektiver Tatbestand
      children:
      - label: a) Vorsatz bzgl. aller objektiven Tatbestandsmerkmale, § 15 StGB
      - label: b) Absicht rechtswidriger Zueignung
        children:
        - label: aa) Aneignungskomponente (dolus directus 1. Grades)
        - label: bb) Enteignungskomponente (dolus eventualis genuegt)
        - label: cc) Rechtswidrigkeit der erstrebten Zueignung
  - label: II. Rechtswidrigkeit
  - label: III. Schuld
  - label: IV. Besonders schwerer Fall, § 243 StGB, und Strafantragserfordernis, §
      248a StGB
    hinweis: Nur pruefen, wenn der Sachverhalt dazu Anlass gibt.
faelle:
- slug: sr-fall-parfuemflasche
  title: Die Parfuemflasche
  difficulty: 2
  minutes: 45
  quellen:
  - Eigener Sachverhalt der Redaktion
  - StGB, amtliche Fassung
  facts: A betritt eine Drogerie und nimmt eine Flasche Parfuem aus dem Regal. Um
    sie nicht bezahlen zu muessen, steckt er sie in die Innentasche seiner Jacke und
    geht in Richtung Ausgang. Kurz bevor er den Kassenbereich erreicht, wird er vom
    aufmerksamen Kaufhausdetektiv D angehalten, der die gesamte Szene beobachtet hatte;
    die Flasche wird sichergestellt. A hat das Ladengeschaeft zu keinem Zeitpunkt
    verlassen.
  question: Hat sich A wegen vollendeten Diebstahls gemaess § 242 Abs. 1 StGB strafbar
    gemacht?
  steps:
  - prompt: Formuliere den Obersatz.
    erwartung: A koennte sich durch das Einstecken der Parfuemflasche wegen Diebstahls
      gemaess § 242 Abs. 1 StGB strafbar gemacht haben.
  - prompt: Ist die Parfuemflasche eine fremde bewegliche Sache?
    erwartung: Ja - sie steht im Eigentum der Drogerie und ist beweglich.
  - prompt: Liegt eine vollendete Wegnahme vor, obwohl A den Laden nicht verlassen
      hat?
    erwartung: 'Ja. Durch das Einstecken in die Innentasche hat A eine Gewahrsamsenklave
      gebildet: Der Gewahrsam der Drogerie ist gebrochen, eigener neuer Gewahrsam
      des A begruendet - das Verlassen des Ladens ist dafuer nicht erforderlich.'
  - prompt: Liegt Zueignungsabsicht vor?
    erwartung: Ja - A wollte die Flasche seinem eigenen Vermoegen einverleiben (Aneignung)
      und die Drogerie dauerhaft von ihrem Eigentum ausschliessen (Enteignung).
  - prompt: War die erstrebte Zueignung rechtswidrig?
    erwartung: Ja - A hatte keinen faelligen und einredefreien Anspruch auf Uebereignung
      der Flasche.
