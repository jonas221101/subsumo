cards:
- slug: sr-toetung-totschlag-212
  type: definition
  front: 'Definiere: Totschlag, § 212 Abs. 1 StGB'
  back: Totschlag ist die vorsätzliche Tötung eines anderen Menschen, ohne dass
    die Voraussetzungen des Mordes (§ 211 StGB) vorliegen. Täter kann jedermann sein
    (Allgemeindelikt). Der objektive Tatbestand verlangt den Tod eines anderen Menschen
    sowie Kausalität und objektive Zurechnung der Tathandlung hierfür; subjektiv
    genügt bedingter Vorsatz.
  norms:
  - § 212 Abs. 1 StGB
  quellen:
  - § 212 StGB, amtlicher Wortlaut
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sr-toetung-mord-211-systematik
  type: definition
  front: 'Definiere: Systematik der Mordmerkmale, § 211 Abs. 2 StGB'
  back: '§ 211 Abs. 2 StGB nennt drei Gruppen von Mordmerkmalen. Erste Gruppe (Taterantrieb,
    täterbezogen): Mordlust, Befriedigung des Geschlechtstriebs, Habgier, sonstige
    niedrige Beweggründe. Zweite Gruppe (Tatausführung, tatbezogen): Heimtücke,
    Grausamkeit, mit gemeingefährlichen Mitteln. Dritte Gruppe (Tatzweck, täterbezogen):
    Ermöglichungsabsicht, Verdeckungsabsicht. Die Einordnung als täter- oder tatbezogen
    entscheidet, ob § 28 StGB bei Beteiligung mehrerer überhaupt anwendbar ist: Nur
    die täterbezogenen Mordmerkmale (erste und dritte Gruppe) sind besondere persönliche
    Merkmale i.S.d. § 28 StGB, während die tatbezogenen Merkmale (zweite Gruppe) jeden
    Beteiligten nach gewöhnlicher Akzessorietät binden. Ob bei den täterbezogenen
    Merkmalen § 28 Abs. 1 oder Abs. 2 StGB einschlägig ist, ist die davon unabhängige
    Streitfrage zwischen Qualifikationstheorie und Selbstständigkeitstheorie (s. Streitstand
    zum Verhältnis § 211/§ 212 StGB).'
  norms:
  - § 211 Abs. 2 StGB
  quellen:
  - § 211 StGB, amtlicher Wortlaut
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sr-toetung-heimtuecke
  type: definition
  front: 'Definiere: Heimtücke i.S.d. § 211 Abs. 2 StGB'
  back: 'Heimtückisch tötet, wer die Arg- und Wehrlosigkeit des Opfers bewusst zur
    Tat ausnutzt. Arglos ist, wer sich zu Beginn des ersten mit Tötungsvorsatz geführten
    Angriffs keines Angriffs auf sein Leben versieht; auch Schlafende sind arglos,
    wenn sie sich vor dem Einschlafen keines Angriffs versehen mussten. Wehrlos ist,
    wer infolge der Arglosigkeit in seiner Verteidigungsmöglichkeit zumindest erheblich
    eingeschränkt ist. Bei Kleinkindern und anderen Personen, die schon aus körperlichen
    Gründen arg- und wehrlos sind, kommt es nach der Rspr. auf die Arglosigkeit schutzbereiter
    Dritter an, deren Schutz der Täter ausschaltet. Subjektiv ist das Ausnutzungsbewusstsein
    erforderlich: Der Täter muss die Arg- und Wehrlosigkeit in ihrer Bedeutung für
    die Tatbegehung erfassen; im Affekt oder bei Erregung kann es fehlen. Die Rspr.
    verlangt zusätzlich eine feindliche Willensrichtung (fehlt bei Tötung aus Mitleid);
    Teile der Lit. fordern darüber hinaus als Tatbestandsrestriktion einen verwerflichen
    Vertrauensbruch (Perfidie).'
  norms:
  - § 211 Abs. 2 StGB
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sr-toetung-heimtuecke-einschraenkung
  type: streitstand
  front: 'Streitstand: Einschränkung der Heimtücke bei notstandsnahen Tötungssituationen'
  back: 'Problem: Der Heimtückemord (§ 211 StGB) führt zwingend zu

    lebenslanger Freiheitsstrafe, § 211 Abs. 1 StGB. Bei Tötungen aus

    einer notstandsnahen Verzweiflungslage (z. B. eine langjährig

    misshandelte Person tötet den schlafenden Peiniger) erscheint diese

    starre Rechtsfolge unangemessen hart, obwohl formal Arg- und

    Wehrlosigkeit vorliegen.


    Rechtsfolgenlösung der Rspr.: Bejaht formal Heimtücke,

    gewährt aber über eine analoge Anwendung von § 49 Abs. 1 Nr. 1 StGB

    eine Strafmilderung in außergewöhnlichen Fällen, in denen die

    lebenslange Freiheitsstrafe unverhältnismäßig wäre.


    Kritik / Tatbestandslösung (Teile der Literatur): Eine

    Strafzumessungskorrektur contra legem sei mit dem

    Bestimmtheitsgrundsatz (Art. 103 Abs. 2 GG) nicht vereinbar; richtig

    sei, das Mordmerkmal Heimtücke bereits auf Tatbestandsebene

    restriktiv auszulegen (z. B. Verneinung eines "verwerflichen

    Vertrauensbruchs").


    Konsequenz: Beide Wege führen im Ergebnis oft zur Vermeidung der

    lebenslangen Freiheitsstrafe, unterscheiden sich aber in der

    dogmatischen Verortung (Tatbestand vs. Rechtsfolge) und damit in der

    Prüfungsreihenfolge.

    '
  norms:
  - § 211 StGB
  - § 211 Abs. 2 StGB
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sr-toetung-verdeckungsabsicht
  type: definition
  front: 'Definiere: Verdeckungsabsicht i.S.d. § 211 Abs. 2 StGB'
  back: Verdeckungsabsicht handelt, wer tötet, um eine bereits begangene Straftat
    oder die eigene Beteiligung daran vor Entdeckung und Strafverfolgung zu verbergen.
    Zwischen der zu verdeckenden Tat und der Tötung muss ein finaler Zusammenhang
    bestehen; ein bloß zeitlicher oder räumlicher Zusammenhang genügt nicht.
  norms:
  - § 211 Abs. 2 StGB
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sr-toetung-niedrige-beweggruende
  type: definition
  front: 'Definiere: sonstige niedrige Beweggründe i.S.d. § 211 Abs. 2 StGB'
  back: 'Niedrig sind Beweggründe, die nach allgemeiner sittlicher Wertung auf tiefster
    Stufe stehen, durch hemmungslose, triebhafte Eigensucht bestimmt und deshalb besonders
    verwerflich, ja verächtlich sind. Erforderlich ist eine Gesamtwürdigung aller
    äußeren und inneren Umstände der Tat, der Lebensverhältnisse des Täters und seiner
    Persönlichkeit (Motivbündel). Positivbeispiele: Tötung aus Hass auf bestimmte
    Gruppen (z. B. Rassenhass), Tötung aus Besitzdenken bei Trennung (Trennungstötung,
    wenn der Täter dem Opfer das Recht auf ein eigenes Leben abspricht), Tötung aus
    Eifersucht in Form des Besitzdenkens, Tötung zur Beseitigung eines unliebsamen
    Menschen aus bloßer Bequemlichkeit. Negativbeispiele: Tötung aus Verzweiflung,
    aus Angst, im Affekt aus einer Konfliktlage heraus, aus Mitleid, wenn die Motive
    nachvollziehbar sind. Verachtung des Opfers und spontane Wut können also je nach
    Gesamtwürdigung niedrig sein oder nicht; entscheidend ist die Wertung im Einzelfall.'
  norms:
  - § 211 Abs. 2 StGB
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sr-toetung-abgrenzung-211-212
  type: streitstand
  front: 'Streitstand: Verhältnis von § 211 StGB zu § 212 StGB (eigenständiges Delikt
    oder Qualifikation)'
  back: 'Problem: Ist Mord (§ 211 StGB) eine Qualifikation zum Grundtatbestand

    Totschlag (§ 212 StGB) oder ein selbständiges Delikt? Relevant u. a.

    für die Anwendung von § 28 StGB bei täterbezogenen Mordmerkmalen und

    für die Konkurrenzlösung.


    Rspr. (Selbstständigkeitstheorie): § 211 StGB ist ein eigenständiger

    Tatbestand mit eigenem Unrechtsgehalt, kein Qualifikationstatbestand zu

    § 212 StGB - u. a. wegen der eigenständigen Tatbestandsstruktur und

    der Gesetzgebungsgeschichte.


    h.L. (Qualifikationstheorie): § 211 StGB qualifiziert den

    Grundtatbestand des § 212 StGB um die Mordmerkmale; das folgt aus dem

    inneren systematischen Verhältnis, wonach jeder Mord notwendig auch

    den Totschlagstatbestand erfüllt.


    Konsequenz: Nach der Qualifikationstheorie ist bei fehlendem

    täterbezogenem Mordmerkmal beim Tatbeteiligten konsequent auf § 212

    StGB i.V.m. § 28 Abs. 2 StGB zurückzugreifen; die Rspr. erreicht über

    § 28 Abs. 1 StGB im Ergebnis meist eine vergleichbare Strafmilderung.

    '
  norms:
  - § 211 StGB
  - § 212 StGB
  - § 28 StGB
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sr-toetung-auf-verlangen-216
  type: definition
  front: 'Definiere: Tötung auf Verlangen, § 216 StGB'
  back: 'Wer durch das ausdrückliche und ernstliche Verlangen des Getöteten zur Tötung
    bestimmt worden ist, wird nach dem gegenüber § 212 StGB milderen § 216 StGB bestraft
    (Freiheitsstrafe von sechs Monaten bis zu fünf Jahren). Das Verlangen muss vor
    der Tat ernstlich, ausdrücklich und in Kenntnis der Tragweite geäußert worden
    sein; bloße Einwilligung ohne aktives Verlangen genügt nicht (dann § 212 StGB,
    ggf. § 213 StGB). Abgrenzung zur straflosen Teilnahme an der Selbsttötung: Entscheidend
    ist die Tatherrschaft über den letzten lebensbeendenden Akt. Führt der Sterbewillige
    ihn selbst eigenverantwortlich aus (Selbsttötung), ist die Mitwirkung als Teilnahme
    an einer straflosen Haupttat nicht strafbar; liegt die Tatherrschaft beim Dritten,
    liegt § 216 StGB vor. Der frühere § 217 StGB (geschäftsmäßige Förderung der Selbsttötung)
    ist durch das BVerfG (Urteil vom 26.02.2020) für nichtig erklärt worden.'
  norms:
  - § 216 StGB
  quellen:
  - § 216 StGB, amtlicher Wortlaut
  - Eigenformulierung Redaktion
  stand: 2026-09
schemata:
- slug: sr-schema-toetungsdelikt
  title: 'Prüfungsschema: Tötungsdelikt (§§ 211, 212 StGB)'
  norms:
  - § 212 StGB
  - § 211 StGB
  - § 211 Abs. 2 StGB
  quellen:
  - § 211 StGB, amtlicher Wortlaut
  - § 212 StGB, amtlicher Wortlaut
  - Eigenformulierung Redaktion
  stand: 2026-09
  steps:
  - label: I. Tatbestand des § 212 Abs. 1 StGB (Grundtatbestand)
    children:
    - label: '1. Objektiver Tatbestand: Tod eines anderen Menschen, Kausalität, objektive
        Zurechnung'
    - label: '2. Subjektiver Tatbestand: Vorsatz, § 15 StGB (bedingter Vorsatz genügt)'
  - label: 'II. Privilegierung: Tötung auf Verlangen, § 216 StGB'
    hinweis: Gehört in die Tatbestandsprüfung (Sperrwirkung gegenüber §§ 211, 212).
      Nur prüfen, wenn der Sachverhalt ein Verlangen des Opfers nahelegt. Abgrenzung
      zur straflosen Teilnahme an der Selbsttötung nach der Tatherrschaft.
    children:
    - label: 1. Ausdrückliches und ernstliches Verlangen des Getöteten
    - label: 2. Täter ist durch das Verlangen zur Tötung bestimmt worden
  - label: III. Qualifizierende Mordmerkmale, § 211 Abs. 2 StGB
    hinweis: 'Aufbau umstritten: Nach der h.L. (Qualifikationstheorie) wird § 212
      vor § 211 geprüft; die Rspr. (Selbstständigkeitstheorie) sieht § 211 als eigenständigen
      Tatbestand. Der Streit wirkt sich bei Beteiligung mehrerer über § 28 StGB aus.'
    children:
    - label: '1. Erste Gruppe (Taterantrieb): Mordlust, Befriedigung des Geschlechtstriebs,
        Habgier, sonstige niedrige Beweggründe'
    - label: '2. Zweite Gruppe (Tatausführung): Heimtücke, Grausamkeit, gemeingefährliche
        Mittel'
    - label: '3. Dritte Gruppe (Tatzweck): Ermöglichungsabsicht, Verdeckungsabsicht'
  - label: IV. Rechtswidrigkeit und Schuld
  - label: V. Ergebnis und Konkurrenzen
    hinweis: Bei § 212 StGB ggf. minder schwerer Fall, § 213 StGB (Provokation durch
      Misshandlung oder schwere Beleidigung).
faelle:
- slug: sr-fall-nachtschicht-wachmann
  title: Der Wachmann
  difficulty: 5
  minutes: 90
  quellen:
  - Eigener Sachverhalt der Redaktion
  - StGB, amtliche Fassung
  stand: 2026-09
  facts: Wächter W sieht in einer Lagerhalle den Einbrecher E, der gerade Elektronikware
    in einen Transporter lädt. W hält E für einen Mitarbeiter der Spedition, grüßt
    freundlich und wendet sich seinem Diensttelefon zu. E bemerkt, dass W ihn gesehen
    hat und später beschreiben könnte, und beschließt, W zu töten, um nicht als Täter
    des Diebstahls identifiziert zu werden und straflos zu bleiben. Er schleicht sich
    von hinten an den ahnungslosen W heran, der ihm den Rücken zudreht, und ersticht
    ihn mit einem mitgeführten Messer, bevor W reagieren kann.
  question: Wie hat sich E strafbar gemacht?
  steps:
  - prompt: Ist der Grundtatbestand des § 212 Abs. 1 StGB erfüllt?
    erwartung: Ja - E hat den W vorsätzlich getötet.
  - prompt: Liegt das Mordmerkmal der Heimtücke vor?
    erwartung: Ja - W war arglos (rechnete nicht mit einem Angriff auf sein Leben)
      und dadurch wehrlos (konnte sich wegen der Überraschung nicht verteidigen);
      E nutzte dies bewusst aus.
  - prompt: Liegt zusätzlich Verdeckungsabsicht vor?
    erwartung: Ja - E tötete gezielt, um seine Identifizierung als Einbrecher und
      damit seine Strafverfolgung wegen des Diebstahls zu verhindern; der finale Zusammenhang
      zwischen Vortat und Tötung ist gegeben.
  expectation:
