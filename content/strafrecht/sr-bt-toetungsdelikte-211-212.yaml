faelle:
- slug: sr-fall-nachtschicht-wachmann
  title: Der Wachmann
  difficulty: 5
  minutes: 90
  quellen:
  - Eigener Sachverhalt der Redaktion
  - StGB, amtliche Fassung
  stand: 2026-09
  facts: Waechter W entdeckt waehrend seiner Nachtschicht in einer Lagerhalle den
    Einbrecher E, der gerade dabei ist, Elektronikware in einen Transporter zu laden.
    Um nicht als Zeuge identifiziert zu werden und straflos zu bleiben, beschliesst
    E, den W zu toeten. Er schleicht sich von hinten an den ahnungslosen W heran,
    der ihm den Ruecken zudreht und mit seinem Diensttelefon beschaeftigt ist, und
    ersticht ihn mit einem mitgefuehrten Messer, bevor W reagieren kann.
  question: Wie hat sich E strafbar gemacht?
  steps:
  - prompt: Ist der Grundtatbestand des § 212 Abs. 1 StGB erfuellt?
    erwartung: Ja - E hat den W vorsaetzlich getoetet.
  - prompt: Liegt das Mordmerkmal der Heimtuecke vor?
    erwartung: Ja - W war arglos (rechnete nicht mit einem Angriff auf sein Leben)
      und dadurch wehrlos (konnte sich wegen der Ueberraschung nicht verteidigen);
      E nutzte dies bewusst aus.
  - prompt: Liegt zusaetzlich Verdeckungsabsicht vor?
    erwartung: Ja - E toetete gezielt, um seine Identifizierung als Einbrecher und
      damit seine Strafverfolgung wegen des Diebstahls zu verhindern; der finale Zusammenhang
      zwischen Vortat und Toetung ist gegeben.
  expectation:
    pruefpunkte:
    - id: p1
      label: Obersatz und Grundtatbestand § 212 Abs. 1 StGB bejaht
      weight: 1.5
      required: true
      norms:
      - § 212 Abs. 1 StGB
      keywords:
      - '212'
      - Totschlag
    - id: p2
      label: Heimtuecke definiert (Arg- und Wehrlosigkeit) und subsumiert
      weight: 3.0
      required: true
      norms:
      - § 211 Abs. 2 StGB
      keywords:
      - arglos
      - wehrlos
      - Heimtuecke
    - id: p3
      label: Ausnutzungsbewusstsein hinsichtlich der Heimtuecke thematisiert
      weight: 1.5
      keywords:
      - Ausnutzungsbewusstsein
      - bewusst ausgenutzt
    - id: p4
      label: Verdeckungsabsicht definiert und finaler Zusammenhang zur Vortat (Diebstahl)
        subsumiert
      weight: 3.0
      required: true
      norms:
      - § 211 Abs. 2 StGB
      keywords:
      - Verdeckungsabsicht
      - finaler Zusammenhang
    - id: p5
      label: Streitstand zum Verhaeltnis § 211/§ 212 StGB zumindest angesprochen
      weight: 1.0
      keywords:
      - Qualifikation
      - eigenstaendig
    - id: p6
      label: 'Ergebnis: Strafbarkeit nach § 211 StGB (Mord)'
      weight: 1.0
      required: true
      keywords:
      - § 211
      - Mord
      - strafbar
