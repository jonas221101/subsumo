cards:
- slug: sr-toetung-totschlag-212
  type: definition
  front: 'Definiere: Totschlag, § 212 Abs. 1 StGB'
  back: Totschlag ist die vorsaetzliche Toetung eines anderen Menschen, ohne dass
    die Voraussetzungen des Mordes (§ 211 StGB) vorliegen. Taeter kann jedermann sein
    (Allgemeindelikt). Der objektive Tatbestand verlangt den Tod eines anderen Menschen
    sowie Kausalitaet und objektive Zurechnung der Tathandlung hierfuer; subjektiv
    genuegt bedingter Vorsatz.
  norms:
  - § 212 Abs. 1 StGB
  quellen:
  - § 212 StGB, amtlicher Wortlaut
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sr-toetung-mord-211-systematik
  type: definition
  front: 'Definiere: Systematik der Mordmerkmale, § 211 Abs. 2 StGB'
  back: '§ 211 Abs. 2 StGB nennt drei Gruppen von Mordmerkmalen. Erste Gruppe (Taterantrieb,
    taeterbezogen): Mordlust, Befriedigung des Geschlechtstriebs, Habgier, sonstige
    niedrige Beweggruende. Zweite Gruppe (Tatausfuehrung, tatbezogen): Heimtuecke,
    Grausamkeit, mit gemeingefaehrlichen Mitteln. Dritte Gruppe (Tatzweck, taeterbezogen):
    Ermoeglichungsabsicht, Verdeckungsabsicht. Die Einordnung als taeter- oder tatbezogen
    entscheidet, ob § 28 StGB bei Beteiligung mehrerer ueberhaupt anwendbar ist: Nur
    die taeterbezogenen Mordmerkmale (erste und dritte Gruppe) sind besondere persoenliche
    Merkmale i.S.d. § 28 StGB, waehrend die tatbezogenen Merkmale (zweite Gruppe) jeden
    Beteiligten nach gewoehnlicher Akzessorietaet binden. Ob bei den taeterbezogenen
    Merkmalen § 28 Abs. 1 oder Abs. 2 StGB einschlaegig ist, ist die davon unabhaengige
    Streitfrage zwischen Qualifikationstheorie und Selbststaendigkeitstheorie (s. Streitstand
    zum Verhaeltnis § 211/§ 212 StGB).'
  norms:
  - § 211 Abs. 2 StGB
  quellen:
  - § 211 StGB, amtlicher Wortlaut
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sr-toetung-heimtuecke
  type: definition
  front: 'Definiere: Heimtuecke i.S.d. § 211 Abs. 2 StGB'
  back: Heimtueckisch toetet, wer die Arg- und Wehrlosigkeit des Opfers bewusst zur
    Tat ausnutzt. Arglosigkeit setzt voraus, dass das Opfer sich im Angriffszeitpunkt
    keines erheblichen Angriffs auf sein Leben versieht; Wehrlosigkeit knuepft an
    die dadurch eingeschraenkte Verteidigungsmoeglichkeit an. Fuer das subjektive
    Ausnutzungsbewusstsein genuegt, dass der Taeter die die Heimtuecke begruendenden
    Umstaende in ihrer Bedeutung fuer die Tatbegehung erfasst.
  norms:
  - § 211 Abs. 2 StGB
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sr-toetung-heimtuecke-einschraenkung
  type: streitstand
  front: 'Streitstand: Einschraenkung der Heimtuecke bei notstandsnahen Toetungssituationen'
  back: 'Problem: Der Heimtueckemord (§ 211 StGB) fuehrt zwingend zu

    lebenslanger Freiheitsstrafe, § 211 Abs. 1 StGB. Bei Toetungen aus

    einer notstandsnahen Verzweiflungslage (z. B. eine langjaehrig

    misshandelte Person toetet den schlafenden Peiniger) erscheint diese

    starre Rechtsfolge unangemessen hart, obwohl formal Arg- und

    Wehrlosigkeit vorliegen.


    Rechtsfolgenloesung der Rspr.: Bejaht formal Heimtuecke,

    gewaehrt aber ueber eine analoge Anwendung von § 49 Abs. 1 Nr. 1 StGB

    eine Strafmilderung in aussergewoehnlichen Faellen, in denen die

    lebenslange Freiheitsstrafe unverhaeltnismaessig waere.


    Kritik / Tatbestandsloesung (Teile der Literatur): Eine

    Strafzumessungskorrektur contra legem sei mit dem

    Bestimmtheitsgrundsatz (Art. 103 Abs. 2 GG) nicht vereinbar; richtig

    sei, das Mordmerkmal Heimtuecke bereits auf Tatbestandsebene

    restriktiv auszulegen (z. B. Verneinung eines "verwerflichen

    Vertrauensbruchs").


    Konsequenz: Beide Wege fuehren im Ergebnis oft zur Vermeidung der

    lebenslangen Freiheitsstrafe, unterscheiden sich aber in der

    dogmatischen Verortung (Tatbestand vs. Rechtsfolge) und damit in der

    Pruefungsreihenfolge.

    '
  norms:
  - § 211 StGB
  - § 211 Abs. 2 StGB
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sr-toetung-verdeckungsabsicht
  type: definition
  front: 'Definiere: Verdeckungsabsicht i.S.d. § 211 Abs. 2 StGB'
  back: Verdeckungsabsicht handelt, wer toetet, um eine bereits begangene Straftat
    oder die eigene Beteiligung daran vor Entdeckung und Strafverfolgung zu verbergen.
    Zwischen der zu verdeckenden Tat und der Toetung muss ein finaler Zusammenhang
    bestehen; ein bloss zeitlicher oder raeumlicher Zusammenhang genuegt nicht.
  norms:
  - § 211 Abs. 2 StGB
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sr-toetung-niedrige-beweggruende
  type: definition
  front: 'Definiere: sonstige niedrige Beweggruende i.S.d. § 211 Abs. 2 StGB'
  back: Niedrig sind Beweggruende, die nach allgemeiner sittlicher Wertung auf tiefster
    Stufe stehen und in deutlichem Missverhaeltnis zum Anlass der Tat stehen, mithin
    besonders verwerflich sind. Erforderlich ist eine Gesamtwuerdigung der Umstaende
    der Tat und der Persoenlichkeit des Taeters; blosse Verachtung des Opfers oder
    spontane Wut allein genuegen nicht ohne Weiteres.
  norms:
  - § 211 Abs. 2 StGB
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sr-toetung-abgrenzung-211-212
  type: streitstand
  front: 'Streitstand: Verhaeltnis von § 211 StGB zu § 212 StGB (eigenstaendiges Delikt
    oder Qualifikation)'
  back: 'Problem: Ist Mord (§ 211 StGB) eine Qualifikation zum Grundtatbestand

    Totschlag (§ 212 StGB) oder ein selbstaendiges Delikt? Relevant u. a.

    fuer die Anwendung von § 28 StGB bei taeterbezogenen Mordmerkmalen und

    fuer die Konkurrenzloesung.


    Rspr. (Selbststaendigkeitstheorie): § 211 StGB ist ein eigenstaendiger

    Tatbestand mit eigenem Unrechtsgehalt, kein Qualifikationstatbestand zu

    § 212 StGB - u. a. wegen der eigenstaendigen Tatbestandsstruktur und

    der Gesetzgebungsgeschichte.


    h.L. (Qualifikationstheorie): § 211 StGB qualifiziert den

    Grundtatbestand des § 212 StGB um die Mordmerkmale; das folgt aus dem

    inneren systematischen Verhaeltnis, wonach jeder Mord notwendig auch

    den Totschlagstatbestand erfuellt.


    Konsequenz: Nach der Qualifikationstheorie ist bei fehlendem

    taeterbezogenem Mordmerkmal beim Tatbeteiligten konsequent auf § 212

    StGB i.V.m. § 28 Abs. 2 StGB zurueckzugreifen; die Rspr. erreicht ueber

    § 28 Abs. 1 StGB im Ergebnis meist eine vergleichbare Strafmilderung.

    '
  norms:
  - § 211 StGB
  - § 212 StGB
  - § 28 StGB
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sr-toetung-auf-verlangen-216
  type: definition
  front: 'Definiere: Toetung auf Verlangen, § 216 StGB'
  back: Wer durch das ausdruckliche und ernstliche Verlangen des Getoeteten zur Toetung
    bestimmt worden ist, wird nach dem gegenueber § 212 StGB milderen § 216 StGB bestraft.
    Das Verlangen muss vor der Tat ernstlich, ausdruecklich und in Kenntnis der Tragweite
    geaeussert worden sein; blosse Einwilligung ohne aktives Verlangen genuegt nicht.
  norms:
  - § 216 StGB
  quellen:
  - § 216 StGB, amtlicher Wortlaut
  - Eigenformulierung Redaktion
  stand: 2026-09
