      - vorsatzloses Werkzeug
      - fehlender Vorsatz
      - § 16 Abs. 1
      card_slugs:
      - sr-beteil-mittelbar-fallgruppen
    - id: p2
      label: Mittelbare Täterschaft des A durch Wissensherrschaft über das vorsatzlose
        Werkzeug
      weight: 3.0
      required: true
      norms:
      - § 25 Abs. 1 Var. 2 StGB
