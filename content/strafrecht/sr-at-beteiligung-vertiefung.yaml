      - Tatherrschaft kraft Irrtumsherrschaft
      card_slugs:
      - sr-beteil-mittelbar-fallgruppen
    - id: p3
      label: Diebstahl in mittelbarer Täterschaft bejaht (§§ 242, 25 Abs. 1 Var. 2 StGB)
