faelle:
- slug: sr-fall-wh-identitaetsfeststellung
  title: Der Stoß gegen den Polizisten
  difficulty: 3
  minutes: 45
  quellen:
  - Eigener Sachverhalt der Redaktion
  - StGB, amtliche Fassung
  facts: >-
    Nachts erhält eine Polizeistreife von einem Passanten den Hinweis, er habe
    gesehen, dass ein Mann mit roter Kapuzenjacke soeben mehrere Hauswände
    besprüht habe; der Mann gehe in Richtung Bahnhof. Polizeiobermeister P trifft
    wenige Minuten später in unmittelbarer Nähe auf A, der eine rote Kapuzenjacke
    trägt, und verlangt zur Klärung des Tatverdachts seinen Ausweis und eine
    kurze Identitätsfeststellung. A, der mit dem Sprühen nichts zu tun hat und keinen Ausweis bei sich trägt, weigert
    sich: "Ich war es nicht, lassen Sie mich in Ruhe." Als P ihn am Arm festhält,
    stößt A ihn mit beiden Händen kräftig vor die Brust, sodass P zu Boden fällt, und
    läuft weg. P bleibt unverletzt. A war überzeugt, P dürfe ihn als Unbeteiligten gar
    nicht festhalten; er hätte sich über die Rechtslage leicht informieren
    können und sich auch mit einer Beschwerde wehren können.
  question: Hat sich A nach §§ 113, 114 StGB strafbar gemacht? Konkurrenzen und
    weitere Delikte sind nicht zu prüfen.
  steps:
  - prompt: Liegen die objektiven Tatbestandsmerkmale vor?
    erwartung: Ja. P ist als Polizeibeamter Amtsträger und führte als Vollstreckungsbeamter
      eine Identitätsfeststellung durch. A leistete mit Gewalt Widerstand, indem er P
      kräftig vor die Brust stieß, um dem Festhalten zu entgehen; zugleich liegt ein tätlicher
      Angriff vor, denn der Stoß zielte unmittelbar auf den Körper.
  - prompt: War die Diensthandlung rechtmäßig?
    erwartung: Ja. Nach dem strafrechtlichen Rechtmäßigkeitsbegriff genügt, dass P
      zuständig war, die Förmlichkeiten wahrte und bei sorgfältiger Prüfung vertretbar
      von einem Anfangsverdacht ausgehen durfte (Hinweis des Passanten, passende Kleidung,
      zeitliche und räumliche Nähe; Maßnahme nach § 163b StPO; das Festhalten ist nach § 163b Abs. 1 S. 2 StPO zulässig,
      weil A keinen Ausweis dabei hatte). Dass A unschuldig ist, steht der
      Rechtmäßigkeit nicht entgegen, die Maßnahme war verhältnismäßig. Eine Rechtfertigung
      durch Notwehr (§ 32 StGB) scheidet aus, weil die rechtmäßige Maßnahme kein
      rechtswidriger Angriff ist.
  - prompt: Wie wirkt sich der Irrtum des A aus?
    erwartung: A hielt die Diensthandlung für nicht rechtmäßig, obwohl sie rechtmäßig war.
      Dies regelt § 113 Abs. 4 StGB. Der Irrtum war vermeidbar, weil sich A leicht
      über die Rechtslage hätte informieren können und Rechtsbehelfe zur Verfügung
      standen. Deshalb bleibt die Tat strafbar; das Gericht kann die Strafe mildern oder von
      Strafe absehen (§ 113 Abs. 4 S. 1 StGB, entsprechend § 114 Abs. 3 StGB).
