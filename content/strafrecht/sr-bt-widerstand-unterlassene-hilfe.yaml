topic:
  slug: sr-bt-widerstand-unterlassene-hilfe
  area: strafrecht
  title: Widerstand gegen Vollstreckungsbeamte (§§ 113, 114 StGB) und unterlassene Hilfeleistung (§ 323c StGB)
  parent: sr-at
  relevance: 4
  stand: 2026-10
  redaktion:
    erzeugt_von: claude-sonnet (Pflichtstoff-Vervollständigung)
    status: in-pruefung
    normzitate_geprueft: false
cards:
- slug: sr-wh-113-tatbestand
  type: definition
  front: Welche Voraussetzungen hat der Widerstand gegen Vollstreckungsbeamte, § 113 Abs. 1 StGB?
  back: >-
    Strafbar ist, wer einem Amtsträger oder Soldaten der Bundeswehr, der zur
    Vollstreckung von Gesetzen, Rechtsverordnungen, Urteilen, Gerichtsbeschlüssen oder
    Verfügungen berufen ist, bei der Vornahme einer solchen Diensthandlung mit
    Gewalt oder durch Drohung mit Gewalt Widerstand leistet. Geschützt werden
    die staatliche Vollstreckungsgewalt und die handelnden Personen. Der Widerstand
    muss bei der Vornahme der Diensthandlung erfolgen, also in zeitlichem und
    sachlichem Zusammenhang mit ihr. Die Tat ist ein Vergehen mit Freiheitsstrafe
    bis zu drei Jahren oder Geldstrafe. Subjektiv ist Vorsatz erforderlich, der
    sich auf die Amtsträgereigenschaft, die Diensthandlung und den Widerstand
    bezieht; ein Irrtum über die Rechtmäßigkeit der Diensthandlung wird in Abs. 3
    und 4 gesondert geregelt. Für Einsatzkräfte gleichgestellter Personen
    (etwa Feuerwehr, Rettungsdienst) gilt § 115 StGB.
  norms:
  - § 113 Abs. 1 StGB
  - § 115 StGB
  quellen:
  - StGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-10
- slug: sr-wh-gewalt-widerstand
  type: definition
  front: Was ist Gewalt, Drohung mit Gewalt und Widerstandleisten bei § 113 StGB?
  back: >-
    Gewalt ist die Entfaltung körperlicher Kraft, die auf den Körper des Amtsträgers
    wirkt oder ihn an der Vornahme der Diensthandlung hindern soll. Beispiele sind
    das Wegstoßen, Festhalten, Treten oder Losreißen mit körperlichem
    Kraftaufwand. Drohung mit Gewalt ist das Inaussichtstellen künftiger
    Gewaltanwendung, die der Täter beeinflussen kann. Widerstand leisten bedeutet,
    durch aktives Tun die Durchführung der Diensthandlung verhindern oder
    erschweren zu wollen. Passiver Widerstand, etwa Sitzenbleiben, Wegtragenlassen,
    bloße Weigerung oder bloßes Weglaufen, ist keine Gewalt. Gewalt gegen
    Sachen genügt nur, wenn sie sich mittelbar gegen den Amtsträger richtet
    (zum Beispiel Verbarrikadieren der Tür). Der Widerstand muss
    gegen die Vollstreckungshandlung gerichtet sein, nicht gegen die Person
    unabhängig von der Diensthandlung.
  norms:
  - § 113 Abs. 1 StGB
  quellen:
  - StGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-10
- slug: sr-wh-diensthandlung
  type: definition
  front: Wer ist Vollstreckungsbeamter und was ist eine Diensthandlung im Sinne der §§ 113, 114 StGB?
  back: >-
    Geschützt ist ein Amtsträger (§ 11 Abs. 1 Nr. 2 StGB) oder ein Soldat der
    Bundeswehr, der zur Vollstreckung von Gesetzen, Rechtsverordnungen, Urteilen,
    Gerichtsbeschlüssen oder Verfügungen berufen ist. Typische Fälle sind
    Polizeibeamte bei Festnahme, Durchsuchung, Platzverweis, Identitätsfeststellung oder
    Sicherstellung, Gerichtsvollzieher bei der Vollstreckung, Beamte des
    Ordnungsamtes beim Abschleppen. Vollstrecken ist die Durchsetzung eines
    Befehls oder die Anwendung unmittelbaren Zwangs auf Grund einer
    Eingriffsbefugnis. Reine Verwaltungstätigkeit ohne Zwangscharakter (Aktenführung,
    bloße Streifenfahrt) ist keine Vollstreckungshandlung im Sinne des § 113 StGB;
    § 114 StGB knüpft dagegen an jede Diensthandlung an, auch an allgemeine
    Diensthandlungen wie die Streifenfahrt. Die Diensthandlung
    beginnt mit unmittelbarem Ansetzen zur Maßnahme und dauert bis zu ihrem
    Abschluss; auch Vorbereitungs- und Nachbereitungsakte sind einbezogen, wenn
    sie in engem Zusammenhang stehen.
  norms:
  - § 113 Abs. 1 StGB
  - § 114 Abs. 1 StGB
  - § 11 Abs. 1 Nr. 2 StGB
  quellen:
  - StGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-10
- slug: sr-wh-rechtmaessigkeit-begriff
  type: streitstand
  front: 'Streitstand: Strafrechtlicher oder verwaltungsrechtlicher Rechtmäßigkeitsbegriff bei § 113 Abs. 3 StGB'
  back: >-
    § 113 Abs. 3 S. 1 StGB macht die Strafbarkeit von der Rechtmäßigkeit der
    Diensthandlung abhängig. Nach dem verwaltungsrechtlichen Rechtmäßigkeitsbegriff
    ist die Handlung nur rechtmäßig, wenn sie objektiv alle materiell- und
    formellrechtlichen Voraussetzungen erfüllt; das wahrt die Einheit der
    Rechtsordnung, belastet den Bürger aber, der die Rechtslage nicht sicher
    erkennen kann. Nach dem herrschenden strafrechtlichen Rechtmäßigkeitsbegriff genügt
    für die Rechtmäßigkeit, dass der Amtsträger örtlich und sachlich zuständig ist,
    die wesentlichen Förmlichkeiten wahrt und bei der Beurteilung der
    tatsächlichen Voraussetzungen sowie bei Ermessensentscheidungen pflichtgemäß
    verfährt. Eine Handlung bleibt danach rechtmäßig, wenn der Beamte bei sorgfältiger
    Prüfung zu einer vertretbaren, aus der Sicht ex ante gerechtfertigten Annahme
    gelangt, auch wenn sie sich später als unzutreffend erweist. Dafür spricht, dass
    der Vollstreckungsbeamte in Eilsituationen zum Handeln verpflichtet ist und
    nicht jede Fehlbeurteilung den Schutz der Vollstreckung entfallen lassen darf.
  norms:
  - § 113 Abs. 3 StGB
  quellen:
  - StGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-10
- slug: sr-wh-rechtmaessigkeit-pruefung
  type: norm
  front: Wie ist die Rechtmäßigkeit der Diensthandlung in der Klausur zu prüfen und welche Rechtsnatur hat sie?
  back: >-
    Die Rechtmäßigkeit der Diensthandlung ist nach dem Wortlaut des § 113 Abs. 3 StGB
    eine Voraussetzung der Strafbarkeit (nach h.M. objektive Bedingung der
    Strafbarkeit, Einordnung umstritten), die in der Klausur unmittelbar nach dem
    Tatbestand zu prüfen ist. Maßstab
    ist der Zeitpunkt der Diensthandlung. Geprüft werden: 1. die Eingriffsgrundlage
    (Ermächtigung, etwa Polizeigesetz, StPO, ZPO), 2. die sachliche und örtliche
    Zuständigkeit, 3. die Einhaltung wesentlicher Förmlichkeiten (zum Beispiel
    Ankündigung, Anhörung, Vorweisen des Dienstausweises soweit gesetzlich verlangt),
    4. die tatbestandlichen Voraussetzungen der Befugnisnorm, bei denen dem Amtsträger
    ein Spielraum für vertretbare Einschätzungen zusteht, und 5. die pflichtgemäße
    Ermessensausübung einschließlich Verhältnismäßigkeit. Ist die Handlung
    rechtswidrig, ist die Tat nicht nach § 113 StGB strafbar, ohne dass es auf
    den Irrtum des Täters ankommt. Notwehr (§ 32 StGB) gegen rechtswidrige
    Diensthandlungen bleibt gesondert zu prüfen.
  norms:
  - § 113 Abs. 3 StGB
  - § 32 StGB
  quellen:
  - StGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-10
- slug: sr-wh-113-irrtum
  type: norm
  front: Wie behandelt das Gesetz Irrtümer über die Rechtmäßigkeit der Diensthandlung, § 113 Abs. 3 und 4 StGB?
  back: >-
    Nach § 113 Abs. 3 S. 2 StGB ist die Tat auch dann nicht strafbar, wenn die
    Diensthandlung rechtswidrig ist und der Täter irrig annimmt, sie sei rechtmäßig:
    Allein die objektive Rechtmäßigkeit zählt. Nimmt der Täter dagegen irrig an, die
    Diensthandlung sei nicht rechtmäßig, obwohl sie rechtmäßig ist, gilt § 113 Abs. 4
    StGB: Konnte er den Irrtum vermeiden, kann das Gericht die Strafe mildern oder von
    Strafe absehen (S. 1). Konnte er ihn nicht vermeiden und war es ihm nach den
    ihm bekannten Umständen auch nicht zuzumuten, sich mit Rechtsbehelfen gegen die
    vermeintlich rechtswidrige Diensthandlung zu wehren, ist die Tat nicht nach
    dieser Vorschrift strafbar (S. 2); war ihm das Rechtsbehelfsverfahren dagegen
    zuzumuten, steht Milderung oder Absehen von Strafe im Ermessen des Gerichts (S. 3). Die Vorschrift regelt den umgekehrten
    Erlaubnisirrtum eigenständig und geht den allgemeinen Regeln der §§ 16, 17 StGB
    vor. Der Irrtum über tatsächliche Umstände der Amtsträgereigenschaft bleibt
    dagegen Tatbestandsirrtum (§ 16 StGB).
  norms:
  - § 113 Abs. 3 StGB
  - § 113 Abs. 4 StGB
  - § 16 StGB
  - § 17 StGB
  quellen:
  - StGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-10
- slug: sr-wh-113-abs2
  type: norm
  front: Welche besonders schweren Fälle nennt § 113 Abs. 2 StGB?
  back: >-
    § 113 Abs. 2 StGB sieht für besonders schwere Fälle Freiheitsstrafe von sechs
    Monaten bis zu fünf Jahren vor. Ein besonders schwerer Fall liegt in der Regel
    vor, wenn der Täter oder ein anderer Beteiligter eine Waffe oder ein anderes
    gefährliches Werkzeug bei sich führt (Nr. 1; eine Verwendungsabsicht verlangt der
    Wortlaut nicht), wenn der Täter durch eine Gewalttätigkeit den Angegriffenen in die Gefahr
    des Todes oder einer schweren Gesundheitsschädigung bringt (Nr. 2) oder wenn die
    Tat mit einem anderen Beteiligten gemeinschaftlich begangen wird (Nr. 3). Es handelt
    sich um Regelbeispiele: Die Indizwirkung kann durch besondere Umstände
    entkräftet werden, und ein unbenannter besonders schwerer Fall bleibt möglich. Die
    Regelbeispiele sind in der Klausur nach der Prüfung des Grundtatbestands in
    einem eigenen Abschnitt zu prüfen. Waffen im technischen Sinne sind
    Gegenstände, die ihrer Art nach dazu bestimmt sind, erhebliche Verletzungen
    zuzufügen (etwa Schusswaffen, Hieb- und Stichwaffen); gefährliche Werkzeuge sind
    sonstige Gegenstände, die nach Art und Einsatz dazu geeignet sind.
  norms:
  - § 113 Abs. 2 StGB
  quellen:
  - StGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-10
- slug: sr-wh-114-angriff
  type: norm
  front: Was regelt § 114 StGB (tätlicher Angriff auf Vollstreckungsbeamte)?
  back: >-
    § 114 Abs. 1 StGB bestraft, wer einen Amtsträger oder Soldaten der Bundeswehr
    bei einer Diensthandlung tätlich angreift, mit Freiheitsstrafe von drei Monaten
    bis zu fünf Jahren. Tätlicher Angriff ist eine unmittelbar auf den Körper
    zielende feindselige Handlung, die nicht zu einer Verletzung führen muss. Der Täter
    muss keinen Widerstand gegen die Vollstreckung leisten wollen. Abs. 2 erklärt
    die Regelungen über besonders schwere Fälle des § 113 Abs. 2 StGB für
    entsprechend anwendbar. Für die Rechtmäßigkeit der Diensthandlung und Irrtümer
    darüber verweist § 114 Abs. 3 StGB auf § 113 Abs. 3 und 4 StGB, soweit die Diensthandlung eine Vollstreckungshandlung im Sinne des § 113 Abs. 1 StGB ist. Die
    Vorschrift wurde eingeführt, um Gewalt gegen Polizei und Vollstreckungsbeamte
    deutlicher zu ahnden. § 114 StGB wird durch § 115 StGB auf Hilfeleistende der
    Feuerwehr, des Katastrophenschutzes und des Rettungsdienstes erstreckt.
  norms:
  - § 114 Abs. 1 StGB
  - § 114 Abs. 2 StGB
  - § 114 Abs. 3 StGB
  - § 115 StGB
  quellen:
  - StGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-10
- slug: sr-wh-323c-tatbestand
  type: definition
  front: Welche Voraussetzungen hat die unterlassene Hilfeleistung, § 323c Abs. 1 StGB?
  back: >-
    Strafbar ist, wer bei Unglücksfällen oder gemeiner Gefahr oder Not nicht Hilfe
    leistet, obwohl dies erforderlich und nach den Umständen zuzumuten, insbesondere
    ohne erhebliche eigene Gefahr und ohne Verletzung anderer wichtiger Pflichten
    möglich ist. Ein Unglücksfall ist ein plötzlich eintretendes Ereignis, das eine
    erhebliche Gefahr für Personen oder Sachen bringt oder zu bringen droht. Gemeine
    Gefahr oder Not ist eine Lage, die die Allgemeinheit oder eine unbestimmte
    Zahl von Menschen bedroht. Erforderlich ist die Hilfe, wenn sie zur Abwendung
    der Gefahr ex ante geeignet erscheint; Verhältnismäßigkeit und das Eingreifen
    anderer Helfer sind zu beachten. Die Tat ist ein echtes Unterlassungsdelikt;
    ein Garant wird nach § 13 StGB bestraft, § 323c StGB tritt dann zurück.
    Vorsatz erfordert die Kenntnis der Lage und der Hilfsmöglichkeit; Strafe:
    Freiheitsstrafe bis zu einem Jahr oder Geldstrafe.
  norms:
  - § 323c Abs. 1 StGB
  - § 13 StGB
  quellen:
  - StGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-10
- slug: sr-wh-323c-zumutbarkeit
  type: norm
  front: Wann ist Hilfeleistung nach § 323c StGB erforderlich und zumutbar?
  back: >-
    Welche Hilfe erforderlich ist, bestimmt sich nach der objektiv ex ante
    zu erwartenden Wirksamkeit. Der Hilfspflichtige muss nicht selbst
    fachkundig helfen, wenn die Alarmierung von Rettungskräften das Mittel der
    Wahl ist (Notruf); hat bereits ein anderer wirksam Hilfe geleistet, ist die Pflicht
    erfüllt. Nicht zumutbar ist eine Hilfe, die mit erheblicher eigener Gefahr
    (für Leib, Leben oder bedeutende Güter) verbunden wäre, oder die die
    Verletzung anderer wichtiger Pflichten verlangen würde (Aufsichts- und
    Berufspflichten). Maßstab ist der Durchschnittsbürger in der konkreten Lage.
    § 323c StGB ist eine Jedermannspflicht; eine Garantenstellung (etwa aus
    Ehe oder Lebensgemeinschaft) wird nach § 13 StGB geprüft. Auch der
    Verursacher des Unglücksfalls ist grundsätzlich hilfspflichtig. Wer sich durch
    die Hilfeleistung selbst belasten müsste, kann diese oft durch einen
    anonymen Notruf erfüllen.
  norms:
  - § 323c Abs. 1 StGB
  - § 13 StGB
  quellen:
  - StGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-10
- slug: sr-wh-323c-suizid
  type: streitstand
  front: 'Streitstand: Suizid und Suizidversuch als Unglücksfall im Sinne des § 323c StGB'
  back: >-
    Nach der traditionellen Rechtsprechung ist auch der Suizidversuch ein
    Unglücksfall, weil für den Betroffenen eine erhebliche Gefahr eintritt,
    deren Abwendung die Allgemeinheit nicht seinem Willen überlassen darf; wer
    nicht hilft, macht sich nach § 323c StGB strafbar. Kritiker (Teile der
    Literatur) halten den freiverantwortlichen Suizid dagegen nicht für einen
    Unglücksfall, weil der Verzicht auf Hilfe dem Selbstbestimmungsrecht des
    Betroffenen entspricht (Art. 2 Abs. 1 GG) und die Pflicht zur Hilfe sonst
    dem eigenen Willen widerspricht. Der BGH hat 2019 (Urteile vom 03.07.2019
    - 5 StR 132/18 und 5 StR 393/18) klargestellt, dass auch der freiverantwortliche
    Suizid ein Unglücksfall ist; Hilfe gegen den Willen des Suizidenten ist aber nicht
    erforderlich bzw. nicht zumutbar, sodass eine Strafbarkeit nach § 323c
    Abs. 1 StGB in diesen Fällen entfällt. Entscheidend ist die Freiverantwortlichkeit:
    Bei fehlender Freiverantwortlichkeit (Verzweiflungstat, psychische Erkrankung,
    Willensmangel) bleibt die Hilfspflicht nach allgemeiner Meinung bestehen. Die
    Hilfspflicht entfällt danach bei erkennbar freiverantwortlichem Suizid
    nicht, weil schon kein Unglücksfall vorläge, sondern wegen fehlender
    Erforderlichkeit und Zumutbarkeit der Hilfe. In der Klausur sind die Freiverantwortlichkeit und
    die erkennbaren Umstände sorgfältig zu subsumieren.
  norms:
  - § 323c Abs. 1 StGB
  - Art. 2 Abs. 1 GG
  quellen:
  - StGB, amtliche Fassung
  - Eigenformulierung Redaktion
  - "BGH, Urteile vom 03.07.2019 - 5 StR 132/18 und 5 StR 393/18"
  stand: 2026-10
- slug: sr-wh-323c-abs2
  type: norm
  front: Was regelt § 323c Abs. 2 StGB (Behinderung von Hilfeleistenden)?
  back: >-
    § 323c Abs. 2 StGB stellt unter Strafe, wer in einer Situation des Abs. 1 (Unglücksfall,
    gemeine Gefahr oder Not) eine Person behindert, die einem Dritten Hilfe leistet
    oder leisten will. Die Vorschrift wurde 2017 eingeführt, um sogenanntes Gaffen
    und das Behindern von Rettungskräften zu erfassen. Behindern ist jedes
    Verhalten, das die Hilfe erschwert oder verzögert, etwa durch Versperren des
    Zugangs oder Filmen und Fotografieren mit der Folge, dass Helfer gehindert werden.
    Hilfeleistende sind nicht nur professionelle Rettungskräfte, sondern jeder, der
    Hilfe leisten will. Das bloße Filmen oder Fotografieren ohne
    Behinderung erfüllt Abs. 2 nicht; daneben kommt eine Strafbarkeit nach § 201a
    StGB in Betracht. Die Tat ist ein Vorsatzdelikt, der Täter muss die Behinderung
    wollen oder zumindest in Kauf nehmen.
  norms:
  - § 323c Abs. 2 StGB
  - § 201a StGB
  quellen:
  - StGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-10
