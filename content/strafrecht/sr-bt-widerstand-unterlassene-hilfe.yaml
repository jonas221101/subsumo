      - label: b) Diensthandlung zur Vollstreckung
      - label: c) Tathandlung - Gewalt oder Drohung mit Gewalt, Widerstand leisten
        hinweis: Passiver Widerstand genügt nicht. Bei § 114 StGB tätlicher Angriff
