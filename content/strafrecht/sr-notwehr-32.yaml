cards:
- slug: sr-notwehr-abgestufte-verteidigung
  type: definition
  front: 'Definiere: abgestufte Verteidigung (Schutzwehr und Trutzwehr)'
  back: Bei der Wahl des erforderlichen Verteidigungsmittels muss der Angegriffene
    zunächst das mildeste gleich wirksame Mittel wählen. Reicht eine bloße Abwehrhandlung
    (Schutzwehr, z. B. Abblocken, Wegstoßen) aus, um den Angriff zu beenden, ist
    ein Gegenangriff (Trutzwehr, z. B. Zurückschlagen) nicht erforderlich. Erst wenn
    die Schutzwehr erkennbar nicht ausreicht, darf zur Trutzwehr übergegangen werden.
  norms:
  - § 32 StGB
  - § 32 Abs. 2 StGB
  quellen:
  - § 32 StGB, amtlicher Wortlaut
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sr-notwehr-nothilfe
  type: definition
  front: 'Definiere: Nothilfe, § 32 Abs. 2 StGB'
  back: Nothilfe ist die Notwehr zugunsten eines Dritten ("oder einem anderen"). Sie
    setzt dieselbe Notwehrlage voraus wie die Notwehr in eigener Sache. Streitig ist,
    ob der Nothelfer gegen den erkennbaren entgegenstehenden Willen des Angegriffenen
    eingreifen darf; nach h.M. entfällt die Rechtfertigung, wenn der Angegriffene
    über ein disponibles Rechtsgut frei verfügen darf und die Verteidigung erkennbar
    ablehnt.
  norms:
  - § 32 Abs. 2 StGB
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sr-notwehr-provokation
  type: streitstand
  front: 'Streitstand: Notwehrprovokation (Absichtsprovokation und sonstige vorwerfbare
    Provokation)'
  back: |-
    Problem: Wer den Angriff durch eigenes Vorverhalten herausgefordert hat, soll sich nicht uneingeschränkt auf Notwehr berufen können. Zu trennen sind zwei Fallgruppen.

    1. Absichtsprovokation: Der Täter provoziert den Angriff gezielt, um den Angreifer unter dem Deckmantel der Notwehr zu verletzen. Nach der Rspr. (BGH) ist das Notwehrrecht hier wegen Rechtsmissbrauchs ausgeschlossen. Teile der Lit. begründen das anders (fehlender Verteidigungswille, Rechtsmissbrauch, actio libera in causa) oder wollen nur das Ausweichgebot anwenden; im Ergebnis ist Notwehr bei echter Absichtsprovokation regelmäßig nicht gerechtfertigt.

    2. Sonstige (nicht absichtliche) vorwerfbare Provokation: Hat der Täter den Angriff rechtswidrig und vorwerfbar, aber ohne Provokationsabsicht veranlasst, bleibt das Notwehrrecht bestehen, ist aber eingeschränkt (abgestufte Lösung): (1) Ausweichen, wenn möglich; (2) andernfalls nur Schutzwehr; (3) Trutzwehr nur als letztes Mittel, wenn Ausweichen und Schutzwehr nicht ausreichen.

    Ein sozialadäquates oder rechtmäßiges Vorverhalten schränkt das Notwehrrecht nicht ein.
  norms:
  - § 32 StGB
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sr-notwehr-bagatelle-missverhaeltnis
  type: definition
  front: 'Definiere: sozialethische Einschränkung wegen krassen Missverhältnisses
    (Bagatellangriff)'
  back: Steht der drohende Schaden für den Angreifer in einem krassen, unerträglichen
    Missverhältnis zu dem vom Angriff bedrohten Rechtsgut (z. B. Todesgefahr für
    den Angreifer zur Abwehr eines geringfügigen Eigentumsangriffs), ist die Verteidigung
    nicht mehr "geboten" i.S.d. § 32 Abs. 1 StGB. Diese Einschränkung greift nur
    in Extremfällen; das Notwehrrecht kennt grundsätzlich keine Güter- und Interessenabwägung
    wie der rechtfertigende Notstand.
  norms:
  - § 32 Abs. 1 StGB
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sr-notwehr-schuldlos-handelnde
  type: definition
  front: 'Definiere: Einschränkung der Notwehr gegenüber erkennbar schuldlos Handelnden'
  back: 'Ist für den Angegriffenen erkennbar, dass der Angreifer schuldlos handelt
    (Kinder, erkennbar Betrunkene, erkennbar Geisteskranke i.S.d. § 20 StGB), wird
    sein Notwehrrecht eingeschränkt: Er muss vorrangig ausweichen oder sich auf Schutzwehr
    beschränken; eine verletzende Trutzwehr ist nur als letztes Mittel gerechtfertigt.
    Grund: Das Rechtsbewährungsprinzip tritt zurück, wenn kein vorwerfbares Unrecht
    des Angreifers droht.'
  norms:
  - § 32 StGB
  - § 20 StGB
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sr-notwehrexzess-33
  type: definition
  front: 'Definiere: Notwehrexzess, § 33 StGB'
  back: 'Überschreitet der Angegriffene aus Verwirrung, Furcht oder Schrecken die
    Grenzen der Notwehr, handelt er rechtswidrig, ist aber entschuldigt (Entschuldigungsgrund
    auf der Schuldebene, h.M.). § 33 wird daher erst nach der Rechtswidrigkeit in
    der Schuld geprüft. Erfasst ist nach h.M. nur der intensive Exzess (Überschreitung
    der erforderlichen Verteidigungsintensität bei bestehender Notwehrlage). Beim
    extensiven Exzess (Verteidigung vor Beginn oder nach Beendigung des Angriffs)
    fehlt die Notwehrlage; die Rspr. wendet § 33 hier nicht an (str.; Teile der Lit.
    wollen § 33 beim nachzeitigen Exzess analog anwenden). Abgrenzung der Affekte:
    Nur asthenische Affekte (Verwirrung, Furcht, Schrecken) entschuldigen. Sthenische
    Affekte wie Wut, Zorn, Hass, Empörung oder Kampfeslust genügen nicht. Reicht ein
    asthenischer Affekt als Mitmotiv aus, genügt das nach h.M. (Mischmotive).'
  norms:
  - § 33 StGB
  quellen:
  - § 33 StGB, amtlicher Wortlaut
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: sr-notwehr-erforderlichkeit-kriterien
  type: definition
  front: 'Definiere: Kriterien der Erforderlichkeit einer Notwehrhandlung'
  back: Erforderlich ist das unter den verfügbaren Mitteln geeignete und zugleich
    mildeste, das den Angriff mit Sicherheit sofort beendet. Maßgeblich ist eine
    Ex-ante-Betrachtung aus Sicht des Angegriffenen im Angriffszeitpunkt, nicht eine
    nachträgliche Betrachtung. Der Angegriffene muss kein Risiko eingehen, dass ein
    milderes Mittel den Angriff nur unsicher beendet.
  norms:
  - § 32 Abs. 2 StGB
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
schemata:
- slug: sr-schema-notwehrexzess
  title: 'Prüfung: Notwehr (§ 32 StGB) und Notwehrexzess (§ 33 StGB)'
  norms:
  - § 32 StGB
  - § 33 StGB
  quellen:
  - § 32 StGB, amtlicher Wortlaut
  - § 33 StGB, amtlicher Wortlaut
  - Eigenformulierung Redaktion
  stand: 2026-09
  steps:
  - label: I. Notwehrlage
    children:
    - label: 1. Angriff - jede drohende Verletzung rechtlich geschützter Interessen
    - label: 2. Gegenwärtigkeit - unmittelbar bevorstehend, andauernd oder gerade
        stattfindend
    - label: 3. Rechtswidrigkeit des Angriffs
  - label: II. Notwehrhandlung
    children:
    - label: 1. Erforderlichkeit - geeignetes und mildestes gleich sicher wirksames
        Mittel
    - label: 2. Gebotenheit - keine sozialethische Einschränkung
      children:
      - label: a) Krasses Missverhältnis (Bagatellangriff)
      - label: b) Angriff erkennbar schuldlos Handelnder
      - label: 'c) Provokation: bei Absichtsprovokation entfällt das Notwehrrecht
          (Rechtsmissbrauch), bei sonstiger vorwerfbarer Provokation abgestufte Lösung'
      - label: d) Enge persönliche Beziehung
  - label: 'III. Subjektives Rechtfertigungselement: Verteidigungswille'
  - label: 'IV. Ergebnis der Rechtfertigungsprüfung: Notwehr (+) bedeutet gerechtfertigt;
      bei Überschreitung bleibt die Tat rechtswidrig'
  - label: 'V. Schuld: Notwehrexzess, § 33 StGB (nur bei rechtswidriger Überschreitung)'
    children:
    - label: 1. Überschreitung der Notwehrgrenzen (intensiver Exzess)
    - label: '2. Asthenischer Affekt: Verwirrung, Furcht oder Schrecken (Wut, Zorn,
        Hass genügen nicht)'
    - label: '3. Rechtsfolge: Entschuldigung, keine Bestrafung'
faelle:
- slug: sr-fall-gartenzaunstreit
  title: Der Gartenzaunstreit
  difficulty: 4
  minutes: 75
  quellen:
  - Eigener Sachverhalt der Redaktion
  - StGB, amtliche Fassung
  stand: 2026-09
  facts: A und Nachbar N streiten seit Wochen über den Verlauf eines Gartenzauns.
    Eines Abends provoziert A den N absichtlich mit lauten Beleidigungen, um endlich
    "Klartext zu reden" - er rechnet fest damit, dass N handgreiflich wird, und hält
    schon vorsorglich einen schweren Spazierstock bereit. N läuft tatsächlich wutentbrannt
    auf A zu und holt zum Faustschlag aus. A schlägt N sofort mit voller Wucht den
    Spazierstock gegen den Kopf, obwohl ein Ausweichen zur nahen Haustür möglich gewesen
    wäre. N erleidet eine schwere Kopfverletzung.
  question: Hat sich A wegen gefährlicher Körperverletzung strafbar gemacht, oder
    ist er nach § 32 StGB gerechtfertigt?
  steps:
  - prompt: Ist der Tatbestand der gefährlichen Körperverletzung erfüllt?
    erwartung: Ja - A verletzt N durch den Schlag mit dem Spazierstock (gefährliches
      Werkzeug, § 224 Abs. 1 Nr. 2 StGB) vorsätzlich.
  - prompt: Liegt eine Notwehrlage vor?
    erwartung: Ja - der angesetzte Faustschlag des N ist ein gegenwärtiger, rechtswidriger
      Angriff auf die körperliche Unversehrtheit des A.
  - prompt: Welche Bedeutung hat die Absichtsprovokation für das Notwehrrecht?
    erwartung: A hat den Angriff gezielt herbeigeführt, um N unter dem Deckmantel
      der Notwehr zu verletzen. Nach der Rspr. (BGH) ist ihm das Notwehrrecht wegen
      Rechtsmissbrauchs versagt; nach der Gegenansicht in Teilen der Lit. besteht
      es nur eingeschränkt, A hätte dann jedenfalls ausweichen müssen. Die abgestufte
      Lösung (Ausweichen, Schutzwehr, Trutzwehr) gilt als Regel für die sonstige,
      nicht absichtliche Provokation.
  - prompt: Welche Konsequenz hat das für die Rechtfertigung?
    erwartung: 'A ist nicht gerechtfertigt: Nach der Rspr. entfällt § 32 StGB bei
      Absichtsprovokation; selbst bei Anwendung der abgestuften Lösung scheitert die
      Rechtfertigung, weil A trotz Ausweichmöglichkeit zur Haustür sofort mit einem
      gefährlichen Werkzeug zur Trutzwehr griff.'
  - prompt: Kommt eine Entschuldigung nach § 33 StGB in Betracht?
    erwartung: Nein - § 33 StGB verlangt einen asthenischen Affekt (Verwirrung, Furcht,
      Schrecken). A handelte planvoll aus Kampfeslust; Wut oder Zorn als sthenische
      Affekte genügen nicht. A ist daher wegen gefährlicher Körperverletzung strafbar.
  expectation:
