cards:
- slug: mb-tm-kraft
  type: definition
  front: Kraft als Vektor
  back: Eine Kraft ist durch Betrag, Richtung und Angriffspunkt bestimmt (gebundener Vektor). Am starren
    Körper darf sie entlang ihrer Wirkungslinie verschoben werden (Linienflüchtigkeit). Kräfte mit gemeinsamem
    Angriffspunkt werden vektoriell addiert (Kräfteparallelogramm).
  quellen:
  - Eigenformulierung Redaktion
- slug: mb-tm-moment
  type: formel
  front: Moment einer Kraft
  back: 'M = F · l, wobei l der senkrechte Abstand (Hebelarm) der Wirkungslinie vom Bezugspunkt ist. Vorzeichen
    nach Drehsinn (üblich: gegen den Uhrzeigersinn positiv). Ein Kräftepaar erzeugt ein freies Moment,
    das vom Bezugspunkt unabhängig ist.'
  einheiten:
  - M in N·m
  - F in N
  - l in m
  quellen:
  - Eigenformulierung Redaktion
- slug: mb-tm-gleichgewicht
  type: formel
  front: Gleichgewichtsbedingungen der ebenen Statik
  back: Σ F_x = 0, Σ F_y = 0, Σ M_(P) = 0 um einen beliebigen Bezugspunkt P. Drei Gleichungen, also höchstens
    drei Unbekannte je Teilkörper. Geschickte Wahl von P (durch zwei unbekannte Kräfte) entkoppelt die
    Gleichungen.
  einheiten:
  - F in N
  - M in N·m
  quellen:
  - Eigenformulierung Redaktion
- slug: mb-tm-lagerarten
  type: definition
  front: Lagerarten und ihre Wertigkeit
  back: 'Loslager (Rollenlager): eine Reaktionskraft senkrecht zur Verschiebungsrichtung, Wertigkeit 1.
    Festlager (Gelenklager): zwei Reaktionskräfte, Wertigkeit 2. Feste Einspannung: zwei Kräfte und ein
    Einspannmoment, Wertigkeit 3. Gelenk zwischen Teilen: überträgt Kräfte, kein Moment.'
  quellen:
  - Eigenformulierung Redaktion
- slug: mb-tm-statische-bestimmtheit
  type: definition
  front: Statische Bestimmtheit
  back: 'Ein ebenes System ist statisch bestimmt, wenn die Zahl der Lagerreaktionen (Wertigkeiten a) plus
    Zwischenreaktionen z gleich 3·n ist (n = Zahl der Teilkörper) und die Lager nicht ungünstig angeordnet
    sind (z. B. alle Wirkungslinien durch einen Punkt). a + z > 3n: statisch unbestimmt, Lösung nur mit
    Verformungsbedingungen; a + z < 3n: beweglich.'
  quellen:
  - Eigenformulierung Redaktion
- slug: mb-tm-freischneiden
  type: verfahren
  front: Freischneiden (Freikörperbild)
  back: '1. Körper gedanklich aus seiner Umgebung lösen. 2. An jeder Schnittstelle die Reaktionen eintragen:
    Lager nach Wertigkeit, Seile nur Zug, Stäbe nur Längskraft. 3. Eingeprägte Lasten (Kräfte, Momente,
    Eigengewicht im Schwerpunkt) eintragen. 4. Koordinatensystem und positive Drehrichtung festlegen.
    Erst dann Gleichgewichtsbedingungen aufstellen.'
  quellen:
  - Eigenformulierung Redaktion
- slug: mb-tm-streckenlast
  type: formel
  front: Resultierende einer Streckenlast
  back: 'Konstante Streckenlast q über die Länge l: Resultierende F_R = q · l, Angriff in der Mitte bei
    l/2. Dreieckslast mit Maximum q₀: F_R = q₀ · l / 2, Angriff bei l/3 vom Nullpunkt entfernt auf der
    Seite des Maximums (2l/3 vom Nullende).'
  einheiten:
  - q in N/m
  - F_R in N
  - l in m
  quellen:
  - Eigenformulierung Redaktion
- slug: mb-tm-schnittgroessen
  type: definition
  front: Schnittgrößen N, Q, M
  back: 'Beim Schnitt durch einen Balken treten Normalkraft N (längs), Querkraft Q (quer) und Biegemoment
    M auf. Zusammenhang: dQ/dx = −q(x) und dM/dx = Q(x). Das Biegemoment ist dort extremal, wo die Querkraft
    null wird.'
  quellen:
  - Eigenformulierung Redaktion
schemata:
- slug: mb-tm-schema-lagerreaktionen
  title: 'Lösungsschema: Lagerreaktionen eines Balkens bestimmen'
  quellen:
  - Eigenformulierung Redaktion
  steps:
  - label: '1. Freischneiden: Lager durch ihre Reaktionskräfte ersetzen (Freikörperbild)'
  - label: 2. Statische Bestimmtheit prüfen (a + z = 3n)
  - label: 3. Streckenlasten durch ihre Resultierenden ersetzen (Betrag und Angriffspunkt)
  - label: 4. Momentengleichgewicht um ein Lager aufstellen
    hinweis: Bezugspunkt im Lager mit den meisten Unbekannten - dann fällt es aus der Gleichung.
  - label: 5. Kräftegleichgewicht Σ F_y = 0 und Σ F_x = 0
  - label: '6. Kontrolle: Momentengleichgewicht um das andere Lager muss aufgehen'
  - label: 7. Bei Bedarf Schnittgrößenverläufe N, Q, M und Maximalmoment bestimmen
faelle:
- slug: mb-tm-aufgabe-balken-einzelkraft
  title: Balken auf zwei Stützen mit Einzelkraft
  difficulty: 1
  minutes: 20
  quellen:
  - Eigene Aufgabe der Redaktion
  facts: Ein Balken der Länge l = 4 m liegt links auf einem Festlager A und rechts auf einem Loslager
    B. Im Abstand a = 1 m von A greift eine vertikale Einzelkraft F = 10 kN nach unten an. Das Eigengewicht
    des Balkens wird vernachlässigt.
  question: Bestimme die Lagerreaktionen in A und B sowie das maximale Biegemoment.
  steps:
  - prompt: Schneide frei und prüfe die statische Bestimmtheit.
    erwartung: 'Festlager A: A_x, A_y (Wertigkeit 2); Loslager B: B_y (Wertigkeit 1). 2 + 1 = 3 = 3·1
      - statisch bestimmt.'
  - prompt: Stelle das Momentengleichgewicht um A auf.
    erwartung: 'Σ M_(A) = 0: B_y · 4 m − 10 kN · 1 m = 0 → B_y = 2,5 kN.'
  - prompt: Stelle das Kräftegleichgewicht auf.
    erwartung: 'Σ F_y = 0: A_y + B_y − 10 kN = 0 → A_y = 7,5 kN. Σ F_x = 0: A_x = 0.'
  - prompt: Kontrolliere über das Moment um B.
    erwartung: Σ M_(B) = −A_y · 4 m + 10 kN · 3 m = −30 + 30 = 0 ✓.
  - prompt: Wo ist das Biegemoment maximal und wie groß ist es?
    erwartung: 'Unter der Einzelkraft (dort springt die Querkraft durch null): M_max = A_y · a = 7,5 kN
      · 1 m = 7,5 kN·m.'
  expectation:
    pruefpunkte:
    - id: p1
      label: Statische Bestimmtheit geprüft (3 Reaktionen)
      weight: 1.0
      required: false
      keywords:
      - statisch bestimmt
      - Wertigkeit
      - drei Unbekannte
      - 3 Unbekannte
      card_slugs:
