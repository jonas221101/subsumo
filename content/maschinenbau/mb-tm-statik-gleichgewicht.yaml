    - id: p2
      label: B_y = 2,5 kN aus dem Momentengleichgewicht
      weight: 3.0
      required: true
      keywords:
      - 2,5 kN
      - 2,5kN
      - 2500 N
      card_slugs:
      - mb-tm-gleichgewicht
    - id: p3
      label: A_y = 7,5 kN
      weight: 3.0
      required: true
      keywords:
      - 7,5 kN
      - 7,5kN
      - 7500 N
      card_slugs:
      - mb-tm-gleichgewicht
    - id: p4
      label: Horizontalreaktion A_x = 0
      weight: 1.0
      required: false
      keywords:
      - A_x = 0
      - Ax = 0
      - keine Horizontalkraft
      - horizontal 0
