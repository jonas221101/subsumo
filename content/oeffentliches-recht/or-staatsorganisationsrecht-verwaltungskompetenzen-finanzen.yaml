faelle:
- slug: or-fall-vk-weisung-auftragsverwaltung
  title: Die Weisung zur Kernenergieaufsicht
  difficulty: 3
  minutes: 45
  quellen:
  - Eigener Sachverhalt der Redaktion
  - GG, amtliche Fassung
  facts: >-
    Das Land L führt die Aufsicht über eine kerntechnische Anlage nach einem Bundesgesetz aus, das mit Zustimmung des Bundesrates bestimmt, dass die Länder es im Auftrag des Bundes ausführen. Das zuständige Bundesministerium hält die Anlage für nicht mehr hinreichend sicher und weist das Landesumweltministerium von L an, die Betriebsgenehmigung zu widerrufen. L hält den Widerruf für unzweckmäßig, weil die Sicherheitslage überschaubar sei, und weigert sich. Das Bundesministerium richtet daraufhin unmittelbar eine Weisung an das nachgeordnete Landesamt, ohne dass ein dringender Fall vorliegt oder das Landesumweltministerium zugestimmt hat. L beantragt beim Bundesverfassungsgericht festzustellen, dass beide Weisungen rechtswidrig sind.
  question: Sind die beiden Weisungen verfassungsgemäß, und kann sich L gegen sie wehren?
  steps:
  - prompt: Welche Verwaltungsart liegt vor?
    erwartung: Bundesauftragsverwaltung, Art. 85 GG, in Verbindung mit Art. 87c GG, weil das Bundesgesetz die Ausführung im Auftrag des Bundes mit Zustimmung des Bundesrates bestimmt.
  - prompt: Darf der Bund dem Land die Weisung zum Widerruf erteilen, obwohl L sie für unzweckmäßig hält?
    erwartung: Ja. Der Bund hat in der Bundesauftragsverwaltung die Sachkompetenz und übt Recht- und Zweckmäßigkeitsaufsicht aus, Art. 85 Abs. 3 und 4 GG. Die erste Weisung ist an die oberste Landesbehörde gerichtet und daher zulässig; L muss sie befolgen, auch wenn es sie für unzweckmäßig hält. Grenze wäre nur das Gebot bundesfreundlichen Verhaltens.
  - prompt: Ist die unmittelbare Weisung an das Landesamt zulässig?
    erwartung: Nein. Weisungen sind, außer wenn die Bundesregierung es für dringlich erachtet, an die obersten Landesbehörden zu richten, Art. 85 Abs. 3 S. 2 GG. Ein Dringlichkeitsfall liegt nicht vor, die oberste Landesbehörde hat nicht zugestimmt; die zweite Weisung ist deshalb rechtswidrig.
  - prompt: Welcher Rechtsschutz steht L zu?
    erwartung: Bund-Länder-Streit nach Art. 93 Abs. 1 Nr. 3 GG, §§ 68 ff. BVerfGG. L darf die Weisung nicht eigenmächtig missachten, kann sie aber gerichtlich klären lassen.
