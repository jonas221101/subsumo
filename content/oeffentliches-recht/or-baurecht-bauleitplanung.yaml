- slug: or-fall-br-bl-gewerbegebiet-normenkontrolle
  title: Das Gewerbegebiet neben dem Wohnhaus
  difficulty: 4
  minutes: 70
  quellen:
  - Eigener Sachverhalt der Redaktion
  - BauGB, amtliche Fassung
  - VwGO, amtliche Fassung
  facts: >-
    Die Gemeinde G beschließt als Satzung den Bebauungsplan „Gewerbepark Ost“, der auf einer bislang unbebauten
    Fläche ein Gewerbegebiet im Sinne von § 8 BauNVO festsetzt. Die Fläche grenzt unmittelbar an das Wohnhaus des N,
    das in einem allgemeinen Wohngebiet liegt. Während der Beteiligung der Öffentlichkeit hat N schriftlich vorgetragen, der
    zu erwartende Lärm von Lkw-Verkehr und Betrieben werde ihn unzumutbar beeinträchtigen, und ein Gutachten gefordert.
    Der Gemeinderat hat den Einwand in der Sitzung nicht erörtert, kein Lärmgutachten eingeholt und keine
    Lärmschutzfestsetzungen aufgenommen; die Begründung des Plans enthält zum Lärm keine Ausführungen. Der Plan wird am
    1. März bekannt gemacht, die Bekanntmachung enthält die Hinweise nach § 215 Abs. 2 BauGB. N rügt die
    Abwägungsmängel am 1. Juli schriftlich bei der Gemeinde und stellt am 1. November des gleichen Jahres beim zuständigen
    Oberverwaltungsgericht einen Normenkontrollantrag.
  question: Ist der Normenkontrollantrag des N zulässig und begründet?
  steps:
  - prompt: Ist der Normenkontrollantrag zulässig?
    erwartung: Statthaft nach § 47 Abs. 1 Nr. 1 VwGO (Bebauungsplan als Satzung nach dem BauGB). N ist antragsbefugt, weil seine Lärmschutzinteressen abwägungserheblich sind und er in seinem Recht auf gerechte Abwägung nach § 1 Abs. 7 BauGB verletzt sein kann (§ 47 Abs. 2 S. 1 VwGO). Die Jahresfrist ist gewahrt (Antrag am 1. November, Bekanntmachung am 1. März).
  - prompt: Liegt ein Fehler im Verfahren oder in der Abwägung vor?
    erwartung: Ja. Die Lärmbelange des N waren der Gemeinde bekannt (Einwand im Auslegungsverfahren); sie hat sie nicht ermittelt und bewertet (§ 2 Abs. 3 BauGB) und nicht in die Abwägung eingestellt. Das ist ein Ermittlungs- und Bewertungsdefizit (§ 2 Abs. 3 BauGB) und zugleich ein Abwägungsdefizit im Sinne der Abwägungsfehlerlehre, § 1 Abs. 7 BauGB.
  - prompt: Ist der Mangel nach den §§ 214, 215 BauGB beachtlich?
    erwartung: Der Ermittlungs- und Bewertungsfehler ist nach § 214 Abs. 1 S. 1 Nr. 1 BauGB beachtlich, denn er betrifft wesentliche, der Gemeinde bekannte Belange, ist offensichtlich (ergibt sich aus Akten und Begründung) und von Einfluss auf das Ergebnis des Verfahrens, weil bei Berücksichtigung des Lärms konkret möglich ist, dass die Gemeinde anders geplant hätte (z. B. Gliederung, Lärmkontingente). Für den Abwägungsvorgang im Übrigen gilt dasselbe nach § 214 Abs. 3 S. 2 BauGB. Der Mangel ist nicht unbeachtlich geworden, weil N ihn innerhalb eines Jahres seit Bekanntmachung schriftlich gerügt hat (§ 215 Abs. 1 BauGB). Der Hinweis nach § 215 Abs. 2 BauGB wurde erteilt.
  - prompt: Welche Rechtsfolge hat die Entscheidung des Gerichts, und was kann die Gemeinde tun?
    erwartung: Der Antrag ist begründet. Das Gericht erklärt den Bebauungsplan für unwirksam, die Entscheidung ist allgemein verbindlich (§ 47 Abs. 5 S. 2 VwGO). Die Gemeinde kann den Mangel in einem ergänzenden Verfahren beheben und den Plan ggf. rückwirkend in Kraft setzen (§ 214 Abs. 4 BauGB).
