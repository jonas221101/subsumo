- slug: or-schema-br-bl-bebauungsplan-rechtmaessigkeit
  title: Rechtmäßigkeit eines Bebauungsplans (Normenkontrolle)
  norms:
  - § 47 VwGO
  - § 1 Abs. 7 BauGB
  - §§ 214, 215 BauGB
  quellen:
  - BauGB, amtliche Fassung
  - VwGO, amtliche Fassung
  - Eigenformulierung Redaktion
  steps:
  - label: A. Zulässigkeit des Normenkontrollantrags, § 47 VwGO
    children:
    - label: I. Statthaftigkeit – Bebauungsplan als Satzung nach dem BauGB, § 47 Abs. 1 Nr. 1 VwGO
    - label: II. Antragsbefugnis, § 47 Abs. 2 S. 1 VwGO
      hinweis: Möglichkeit der Verletzung des Rechts auf gerechte Abwägung der eigenen Belange.
    - label: III. Antragsfrist – ein Jahr nach Bekanntmachung
    - label: IV. Antragsgegner und Gericht – Gemeinde, OVG oder VGH
    - label: V. Rechtsschutzbedürfnis
  - label: B. Begründetheit
    children:
    - label: I. Formelle Rechtmäßigkeit
      children:
      - label: 1. Zuständigkeit (Gemeinderat) und Verfahren (§§ 2 bis 4a BauGB)
      - label: 2. Satzungsbeschluss, Ausfertigung, Bekanntmachung (§ 10 BauGB)
    - label: II. Materielle Rechtmäßigkeit
      children:
      - label: 1. Erforderlichkeit, § 1 Abs. 3 BauGB
      - label: 2. Anpassung an Ziele der Raumordnung, § 1 Abs. 4 BauGB
      - label: 3. Entwicklungsgebot, § 8 Abs. 2 BauGB
      - label: 4. Zulässige Festsetzungen, § 9 BauGB, BauNVO
      - label: 5. Abwägungsgebot, § 1 Abs. 7 BauGB
        hinweis: Ermittlung (§ 2 Abs. 3), Ausfall, Defizit, Fehleinschätzung, Disproportionalität.
    - label: III. Beachtlichkeit der Mängel
      children:
      - label: 1. §§ 214, 215 BauGB – Offensichtlichkeit, Einfluss auf das Ergebnis, Rüge binnen eines Jahres
      - label: 2. Ergänzendes Verfahren, § 214 Abs. 4 BauGB
    - label: IV. Rechtsfolge – Unwirksamkeit, § 47 Abs. 5 S. 2 VwGO
