faelle:
- slug: or-fall-ea-bewerbungsverfahrensanspruch
  title: Die verhinderte Beförderung
  difficulty: 3
  minutes: 60
  quellen:
  - Eigener Sachverhalt der Redaktion
  - VwGO, amtliche Fassung
  - Eigenformulierung Redaktion
  facts: Bundesbeamtin B bewirbt sich um eine ausgeschriebene Beförderungsstelle der Besoldungsgruppe
    A 13 bei einer Bundesbehörde. Mitbewerber ist C. Nach den aktuellen dienstlichen Beurteilungen
    ist B in der Gesamtnote um eine volle Notenstufe besser als C. Die Behörde entscheidet
    sich dennoch für C, weil dieser dienstälter sei, und teilt B mit, die Ernennung des C
    solle in drei Tagen erfolgen. B hält die Auswahl für rechtswidrig. Sie möchte verhindern,
    dass die Stelle endgültig besetzt wird, bevor über ihre Rechte entschieden ist. Eine Hauptsacheklage
    hat sie noch nicht erhoben.
  question: Welchen Rechtsbehelf soll B wählen, und hat er Aussicht auf Erfolg?
  steps:
  - prompt: Ist der Verwaltungsrechtsweg eröffnet, und welcher Rechtsbehelf ist statthaft?
    erwartung: Der Verwaltungsrechtsweg folgt aus § 126 Abs. 1 BBG. B begehrt keine Aufhebung
      eines belastenden Verwaltungsakts, sondern die Sicherung ihrer Rechte; statthaft ist
      der Antrag nach § 123 Abs. 1 VwGO (Sicherungsanordnung, S. 1), § 123 Abs. 5 VwGO steht
      nicht entgegen.
  - prompt: Besteht ein Anordnungsanspruch?
    erwartung: Ja. B hat einen Bewerbungsverfahrensanspruch aus Art. 33 Abs. 2 GG. Die Auswahl
      muss sich an Eignung, Befähigung und fachlicher Leistung orientieren; das Dienstalter
      ist nur Hilfskriterium bei gleichem Leistungsstand. Da B besser beurteilt ist, ist die
      Auswahl des C fehlerhaft, und B kann bei fehlerfreier Auswahl zum Zuge kommen.
  - prompt: Besteht ein Anordnungsgrund?
    erwartung: Ja. Nach der Ernennung des C droht Rechtsvereitelung wegen der Ämterstabilität;
      die Ernennung steht unmittelbar bevor (drei Tage). Ein Zuwarten auf das Hauptsacheverfahren
      ist unzumutbar.
  - prompt: Wird die Hauptsache vorweggenommen, und mit welchem Inhalt ergeht die Anordnung?
    erwartung: Nein. Die Anordnung untersagt der Behörde vorläufig, die Stelle mit C zu besetzen,
      bis über die Auswahl neu entschieden oder die Hauptsache abgeschlossen ist; sie verschafft
      B die Stelle nicht. Es handelt sich um eine reine Sicherungsanordnung; der Antrag hat
      Erfolg.
