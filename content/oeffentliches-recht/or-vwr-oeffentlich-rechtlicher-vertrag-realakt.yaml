faelle:
- slug: or-fall-vwr-vertrag-baugenehmigung-spende
  title: Baugenehmigung gegen Spende
  difficulty: 3
  minutes: 60
  quellen:
  - Eigener Sachverhalt der Redaktion
  - VwVfG, amtliche Fassung
  - Eigenformulierung Redaktion
  facts: Bauherr B beantragt bei der Bauaufsichtsbehörde der Stadt S eine Baugenehmigung für
    ein Einfamilienhaus. Das Vorhaben erfüllt alle bauordnungs- und bauplanungsrechtlichen
    Voraussetzungen; B hat Anspruch auf die Genehmigung. Der zuständige Sachbearbeiter erklärt,
    die Genehmigung werde „schneller und problemlos“ erteilt, wenn B der Stadt 20.000 Euro
    für den allgemeinen städtischen Haushalt zuwende. B und S schließen daraufhin einen schriftlichen
    Vertrag, in dem sich S zur Erteilung der Baugenehmigung und B zur Zahlung von 20.000 Euro
    verpflichten. B zahlt und erhält die Genehmigung. Später verlangt B das Geld zurück.
  question: Ist der Vertrag wirksam? Hat B einen Anspruch auf Rückzahlung der 20.000 Euro?
  steps:
  - prompt: Handelt es sich um einen öffentlich-rechtlichen Vertrag, und ist er subordinationsrechtlich?
    erwartung: Ja. Gegenstand ist die Erteilung einer Baugenehmigung, also hoheitliches Handeln
      (§ 54 S. 1 VwVfG). Die Behörde steht B in einem Über-/Unterordnungsverhältnis gegenüber
      und hätte durch Verwaltungsakt handeln können; es liegt ein subordinationsrechtlicher
      Austauschvertrag vor (§ 54 S. 2 VwVfG, § 56 VwVfG).
  - prompt: Ist der Vertrag nach § 56 VwVfG zulässig?
    erwartung: Nein. Die Gegenleistung fließt in den allgemeinen Haushalt und ist nicht für
      einen bestimmten, im Vertrag vereinbarten Zweck der Aufgabenerfüllung bestimmt; ein
      sachlicher Zusammenhang mit der Baugenehmigung fehlt (§ 56 Abs. 1 VwVfG). Zudem hatte
      B einen Anspruch auf die Genehmigung; eine Gegenleistung wäre nur zulässig, wenn sie
      Gegenstand einer Nebenbestimmung sein könnte (§ 56 Abs. 2 VwVfG), was nicht der Fall
      ist.
  - prompt: Welche Rechtsfolge hat dies, und besteht ein Rückzahlungsanspruch?
    erwartung: Der Vertrag ist nach § 59 Abs. 2 Nr. 4 VwVfG nichtig, da sich die Behörde eine
      unzulässige Gegenleistung versprechen ließ. Die Zahlung erfolgte ohne Rechtsgrund; B
      hat gegen S einen öffentlich-rechtlichen Erstattungsanspruch (in entsprechender Anwendung
      der §§ 812 ff. BGB) auf Rückzahlung der 20.000 Euro. Die Baugenehmigung bleibt als eigenständiger
      Verwaltungsakt unberührt.
