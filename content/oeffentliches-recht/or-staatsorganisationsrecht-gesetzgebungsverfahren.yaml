cards:
- slug: or-gg-gesetzgebung-initiativrecht
  type: norm
  front: Wer hat nach Art. 76 Abs. 1 GG das Recht, Gesetzesvorlagen beim Bundestag
    einzubringen?
  back: Gesetzesvorlagen werden beim Bundestag eingebracht durch die Bundesregierung,
    aus der Mitte des Bundestages (nach dessen Geschaeftsordnung, praktisch durch
    eine Fraktion oder eine Mindestzahl von Abgeordneten) oder durch den Bundesrat.
    Dieses Initiativrecht ist abschliessend - ein Volksgesetzgebungsverfahren auf
    Bundesebene sieht das Grundgesetz nicht vor.
  norms:
  - Art. 76 Abs. 1 GG
  quellen:
  - GG, amtliche Fassung
  stand: 2026-09
- slug: or-gg-gesetzgebung-erster-durchgang
  type: norm
  front: Was regelt der sogenannte 'erste Durchgang' nach Art. 76 Abs. 2, 3 GG?
  back: Nach Art. 76 Abs. 2 GG sind Vorlagen der Bundesregierung zunaechst dem Bundesrat
    zuzuleiten, der innerhalb von sechs Wochen dazu Stellung nehmen kann, bevor die
    Vorlage an den Bundestag weitergeleitet wird; bei besonderer Eilbeduerftigkeit
    kann die Bundesregierung diese Frist auf drei Wochen verkuerzen. Umgekehrt sind
    nach Art. 76 Abs. 3 GG Vorlagen des Bundesrates zunaechst der Bundesregierung
    zuzuleiten, die sie innerhalb von sechs Wochen mit ihrer Stellungnahme an den
    Bundestag weiterleitet. Dieser 'erste Durchgang' gibt dem jeweils anderen Verfassungsorgan
    fruehzeitig Gehoer, ohne bereits eine Bindungswirkung fuer den spaeteren Bundestagsbeschluss
    zu entfalten.
  norms:
  - Art. 76 Abs. 2 GG
  - Art. 76 Abs. 3 GG
  quellen:
  - GG, amtliche Fassung
  stand: 2026-09
- slug: or-gg-gesetzgebung-zustimmungs-einspruchsgesetz
  type: definition
  front: Wie unterscheiden sich Zustimmungsgesetz und Einspruchsgesetz?
  back: Ein Zustimmungsgesetz bedarf der ausdruecklichen Zustimmung des Bundesrates,
    um wirksam zustande zu kommen - verweigert der Bundesrat die Zustimmung, ist das
    Gesetz gescheitert. Ein Einspruchsgesetz kommt dagegen auch ohne Zustimmung des
    Bundesrates zustande; der Bundesrat kann lediglich Einspruch einlegen, den der
    Bundestag mit entsprechender Mehrheit zurueckweisen kann. Ob ein Gesetz zustimmungsbeduerftig
    ist, ergibt sich nicht aus einer allgemeinen Vorschrift, sondern nur aus einzelnen,
    das Grundgesetz ausdruecklich benennenden Zustimmungsvorbehalten (z. B. Art. 79
    Abs. 2, Art. 84 Abs. 1, Art. 105 Abs. 3 GG) - im Zweifel handelt es sich um ein
    Einspruchsgesetz.
  norms:
  - Art. 79 Abs. 2 GG
  - Art. 84 Abs. 1 GG
  - Art. 105 Abs. 3 GG
  quellen:
  - GG, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: or-gg-gesetzgebung-vermittlungsausschuss
  type: norm
  front: Wer kann den Vermittlungsausschuss nach Art. 77 Abs. 2 GG anrufen, und wozu
    dient er?
  back: Der Vermittlungsausschuss aus Mitgliedern von Bundestag und Bundesrat dient
    dazu, bei Meinungsverschiedenheiten ueber ein vom Bundestag beschlossenes Gesetz
    einen Kompromissvorschlag zu erarbeiten. Er kann vom Bundesrat innerhalb von drei
    Wochen nach Zuleitung des Gesetzes angerufen werden; bei Zustimmungsgesetzen koennen
    auch Bundestag und Bundesregierung die Einberufung verlangen. Der Vermittlungsausschuss
    selbst trifft keine endgueltige Entscheidung, sondern unterbreitet einen Aenderungsvorschlag,
    ueber den der Bundestag erneut beschliessen muss.
  norms:
  - Art. 77 Abs. 2 GG
  quellen:
  - GG, amtliche Fassung
  stand: 2026-09
- slug: or-gg-gesetzgebung-zustandekommen-zustimmungsgesetz
  type: norm
  front: Wann kommt ein Zustimmungsgesetz nach Art. 78 GG zustande?
  back: Ein vom Bundestag beschlossenes Gesetz kommt zustande, wenn der Bundesrat
    zustimmt, einen Antrag auf Anrufung des Vermittlungsausschusses nicht innerhalb
    der vorgesehenen Frist stellt, einen Einigungsvorschlag des Vermittlungsausschusses
    billigt oder - bei einem Einspruchsgesetz - keinen Einspruch einlegt bzw. der
    Einspruch vom Bundestag zurueckgewiesen wird. Bei einem echten Zustimmungsgesetz
    genuegt eine blosse Nichteinlegung von Einspruch dagegen NICHT - erforderlich
    ist die ausdrueckliche Zustimmung, da ohne sie das Gesetz gar nicht erst wirksam
    beschlossen ist.
  norms:
  - Art. 78 GG
  quellen:
  - GG, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: or-gg-gesetzgebung-einspruch-zurueckweisung
  type: norm
  front: Mit welcher Mehrheit kann der Bundestag einen Einspruch des Bundesrates zurueckweisen,
    Art. 77 Abs. 3, 4 GG?
  back: Hat der Bundesrat mit der Mehrheit seiner Stimmen Einspruch eingelegt, kann
    der Bundestag ihn mit der Mehrheit seiner Mitglieder (absolute Mehrheit) zurueckweisen.
    Hat der Bundesrat den Einspruch dagegen mit einer Mehrheit von mindestens zwei
    Dritteln seiner Stimmen beschlossen, bedarf die Zurueckweisung durch den Bundestag
    einer Mehrheit von zwei Dritteln der abgegebenen Stimmen, mindestens der Mehrheit
    der Mitglieder des Bundestages. Gelingt die Zurueckweisung nicht, ist das Gesetz
    endgueltig gescheitert.
  norms:
  - Art. 77 Abs. 3 GG
  - Art. 77 Abs. 4 GG
  quellen:
  - GG, amtliche Fassung
  stand: 2026-09
- slug: or-gg-gesetzgebung-ausfertigung-verkuendung
  type: norm
  front: Was regelt Art. 82 Abs. 1 GG zu Ausfertigung und Verkuendung eines Gesetzes?
  back: Nach Art. 82 Abs. 1 GG werden die nach den Vorschriften des Grundgesetzes
    zustande gekommenen Gesetze vom Bundespraesidenten nach Gegenzeichnung ausgefertigt
    und im Bundesgesetzblatt verkuendet. Erst mit ordnungsgemaesser Verkuendung wird
    das Gesetz Teil der geltenden Rechtsordnung; sofern nichts anderes bestimmt ist,
    tritt es nach Art. 82 Abs. 2 GG am vierzehnten Tag nach Ablauf des Tages in Kraft,
    an dem das Bundesgesetzblatt ausgegeben wurde.
  norms:
  - Art. 82 Abs. 1 GG
  - Art. 82 Abs. 2 GG
  quellen:
  - GG, amtliche Fassung
  stand: 2026-09
- slug: or-gg-gesetzgebung-pruefungsrecht-bundespraesident
  type: streitstand
  front: Wie weit reicht das Pruefungsrecht des Bundespraesidenten vor der Ausfertigung
    eines Gesetzes?
  back: 'Unstreitig steht dem Bundespraesidenten ein formelles Pruefungsrecht zu:
    er darf die Ausfertigung verweigern, wenn das Gesetz nicht ordnungsgemaess nach
    den Vorschriften des Grundgesetzes zustande gekommen ist. Streitig ist der Umfang
    eines materiellen Pruefungsrechts. Nach einer engen Auffassung darf der Bundespraesident
    die Ausfertigung nur bei offensichtlichen, schwerwiegenden Verstoessen gegen das
    Grundgesetz verweigern (evidenzbezogene Pruefung), um die Gewaltenteilung und
    die Autoritaet des Bundesverfassungsgerichts als eigentlichem Hueter der Verfassung
    nicht zu unterlaufen. Eine weitergehende Auffassung raeumt ihm ein umfassendes
    materielles Pruefungsrecht ein, das sich aus seinem Amtseid zur Verteidigung des
    Grundgesetzes ergebe.'
  norms:
  - Art. 82 Abs. 1 GG
  quellen:
  - GG, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: or-gg-gesetzgebung-formelle-verfassungsmaessigkeit
  type: schema_step
  front: Welche drei Pruefungsschritte umfasst die formelle Verfassungsmaessigkeit
    eines Bundesgesetzes?
  back: 'Die formelle Verfassungsmaessigkeit gliedert sich in drei Pruefungsschritte:
    erstens die Gesetzgebungszustaendigkeit des Bundes (insbesondere Art. 70 ff. GG),
    zweitens das Gesetzgebungsverfahren (ordnungsgemaesse Einbringung nach Art. 76
    GG, Beschlussfassung im Bundestag, erforderliche Beteiligung des Bundesrates einschliesslich
    einer etwaigen Anrufung des Vermittlungsausschusses nach Art. 77 GG) und drittens
    die Form (Gegenzeichnung, Ausfertigung und Verkuendung nach Art. 82 GG). Diese
    Gliederung ist zugleich der klassische Pruefungsstandort in einer abstrakten oder
    konkreten Normenkontrolle, bevor die materielle Verfassungsmaessigkeit (Vereinbarkeit
    des Gesetzesinhalts mit dem Grundgesetz) untersucht wird.'
  norms:
  - Art. 76 GG
  - Art. 77 GG
  - Art. 82 GG
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
