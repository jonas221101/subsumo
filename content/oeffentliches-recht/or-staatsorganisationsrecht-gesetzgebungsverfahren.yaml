  steps:
  - label: I. Gesetzgebungszustaendigkeit des Bundes
    hinweis: Art. 70 ff. GG - hier nicht vertieft, siehe eigenstaendige Themen zur
      Kompetenzordnung.
  - label: II. Gesetzgebungsverfahren
    children:
    - label: 1. Einbringung durch ein initiativberechtigtes Organ, Art. 76 Abs. 1
        GG
    - label: 2. Ggf. erster Durchgang bei Regierungs- oder Bundesratsvorlagen, Art.
        76 Abs. 2 GG
    - label: 3. Beschlussfassung im Bundestag
    - label: 4. Beteiligung des Bundesrates, Art. 77 Abs. 1 GG
      children:
      - label: 'a) Einordnung: Zustimmungsgesetz oder Einspruchsgesetz?'
      - label: b) Ggf. Anrufung des Vermittlungsausschusses, Art. 77 Abs. 2 GG
      - label: 'c) Bei Zustimmungsgesetz: ausdrueckliche Zustimmung erforderlich,
          Art. 78 GG'
      - label: 'd) Bei Einspruchsgesetz: kein oder erfolglos zurueckgewiesener Einspruch,
          Art. 77 Abs. 3, 4 GG'
  - label: III. Form
    children:
    - label: 1. Gegenzeichnung
    - label: 2. Ausfertigung durch den Bundespraesidenten, Art. 82 Abs. 1 GG
    - label: 3. Verkuendung im Bundesgesetzblatt, Art. 82 Abs. 1, 2 GG
  - label: 'IV. Ergebnis: Gesetz formell verfassungsgemaess zustande gekommen (oder
      nicht)'
faelle:
- slug: or-fall-verkanntes-zustimmungsgesetz
  title: Das verkannte Zustimmungsgesetz
  difficulty: 4
  minutes: 45
  quellen:
  - Eigener Sachverhalt der Redaktion
  - GG, amtliche Fassung
  facts: Der Bundestag beschliesst ein (fiktives) Gesetz, das nach einer ausdruecklichen
    Bestimmung des Grundgesetzes der Zustimmung des Bundesrates bedarf. Die Bundestagsverwaltung
    behandelt das Gesetz irrtuemlich als einfaches Einspruchsgesetz. Der Bundesrat,
    der die Zustimmungsbeduerftigkeit ebenfalls nicht erkennt, legt gegen das Gesetz
    mit einfacher Mehrheit 'Einspruch' ein. Der Bundestag weist diesen Einspruch daraufhin
    mit der Mehrheit seiner Mitglieder zurueck. Der Bundespraesident fertigt das Gesetz
    in der Annahme aus, das Verfahren sei ordnungsgemaess abgeschlossen, und es wird
    im Bundesgesetzblatt verkuendet.
  question: Ist das Gesetz formell verfassungsgemaess zustande gekommen?
  steps:
  - prompt: Um welchen Gesetzestyp handelt es sich nach der Vorgabe des Sachverhalts?
    erwartung: Um ein Zustimmungsgesetz, da eine ausdrueckliche Bestimmung des Grundgesetzes
      die Zustimmung des Bundesrates vorschreibt (echte Zustimmungsvorbehalte finden
      sich nur einzeln im Grundgesetz, z. B. Art. 79 Abs. 2, Art. 84 Abs. 1 GG).
  - prompt: Genuegt fuer das Zustandekommen eines Zustimmungsgesetzes die blosse Zurueckweisung
      eines (vermeintlichen) Einspruchs?
    erwartung: Nein. Bei einem echten Zustimmungsgesetz ist die ausdrueckliche Zustimmung
      des Bundesrates konstitutive Voraussetzung fuer das Zustandekommen, Art. 78
      GG. Die Zurueckweisung eines Einspruchs ersetzt diese Zustimmung nicht, da das
      Einspruchsverfahren fuer Zustimmungsgesetze gar nicht das vorgesehene Verfahren
      ist.
  - prompt: Hat der Bundesrat im Sachverhalt eine Zustimmung erteilt?
    erwartung: Nein - der Bundesrat hat lediglich (fehlerhaft) 'Einspruch' eingelegt,
      keine Zustimmung erklaert. Eine ausdrueckliche Zustimmungserklaerung fehlt vollstaendig.
  - prompt: Welche Folge hat das fehlerhafte Verfahren fuer die formelle Verfassungsmaessigkeit
      des Gesetzes?
    erwartung: Das Gesetz ist formell verfassungswidrig, weil es mangels der erforderlichen
      Zustimmung des Bundesrates nicht wirksam nach Art. 78 GG zustande gekommen ist
      - unabhaengig davon, dass der Bundestag den (unzutreffend eingeordneten) Einspruch
      zurueckgewiesen hat.
  - prompt: Aendert die Ausfertigung durch den Bundespraesidenten etwas an diesem
      Ergebnis?
    erwartung: Nein. Die Ausfertigung nach Art. 82 Abs. 1 GG setzt ein nach den Vorschriften
      des Grundgesetzes ordnungsgemaess zustande gekommenes Gesetz voraus; ein Verfahrensfehler
      beim Zustandekommen wird durch die - hier auf einem Irrtum beruhende - Ausfertigung
      nicht geheilt.
  expectation:
    pruefpunkte:
    - id: p1
      label: Zutreffende Einordnung als Zustimmungsgesetz anhand der Sachverhaltsvorgabe
      weight: 1.5
      required: false
      keywords:
      - Zustimmungsgesetz
      - ausdrueckliche Bestimmung
    - id: p2
      label: Erkenntnis, dass die Zurueckweisung eines Einspruchs die erforderliche
        Zustimmung nicht ersetzt
      weight: 3.0
      required: true
      keywords:
      - Einspruch ersetzt nicht
      - Zustimmung erforderlich
      - Art. 78
    - id: p3
      label: Feststellung, dass eine ausdrueckliche Zustimmungserklaerung des Bundesrates
        fehlt
      weight: 2.0
      required: true
      keywords:
      - keine Zustimmung erteilt
      - fehlt
    - id: p4
      label: 'Ergebnis: Gesetz mangels wirksamen Zustandekommens formell verfassungswidrig'
      weight: 2.0
      required: true
      keywords:
      - formell verfassungswidrig
      - nicht zustande gekommen
    - id: p5
      label: Erkenntnis, dass die Ausfertigung den Verfahrensfehler nicht heilt
      weight: 1.5
      required: false
      keywords:
      - Ausfertigung heilt nicht
      - Verfahrensfehler
