cards:
- slug: or-gg-gesetzgebung-initiativrecht
  type: norm
  front: Wer hat nach Art. 76 Abs. 1 GG das Recht, Gesetzesvorlagen beim Bundestag
    einzubringen?
  back: Gesetzesvorlagen werden beim Bundestag eingebracht durch die Bundesregierung,
    aus der Mitte des Bundestages (nach dessen Geschäftsordnung, praktisch durch
    eine Fraktion oder eine Mindestzahl von Abgeordneten) oder durch den Bundesrat.
    Dieses Initiativrecht ist abschließend - ein Volksgesetzgebungsverfahren auf
    Bundesebene sieht das Grundgesetz nicht vor.
  norms:
  - Art. 76 Abs. 1 GG
  quellen:
  - GG, amtliche Fassung
  stand: 2026-09
- slug: or-gg-gesetzgebung-erster-durchgang
  type: norm
  front: Was regelt der sogenannte 'erste Durchgang' nach Art. 76 Abs. 2, 3 GG?
  back: Nach Art. 76 Abs. 2 GG sind Vorlagen der Bundesregierung zunächst dem Bundesrat
    zuzuleiten, der innerhalb von sechs Wochen dazu Stellung nehmen kann, bevor die
    Vorlage an den Bundestag weitergeleitet wird; bei besonderer Eilbedürftigkeit
    kann die Bundesregierung diese Frist auf drei Wochen verkürzen. Umgekehrt sind
    nach Art. 76 Abs. 3 GG Vorlagen des Bundesrates zunächst der Bundesregierung
    zuzuleiten, die sie innerhalb von sechs Wochen mit ihrer Stellungnahme an den
    Bundestag weiterleitet. Dieser 'erste Durchgang' gibt dem jeweils anderen Verfassungsorgan
    frühzeitig Gehör, ohne bereits eine Bindungswirkung für den späteren Bundestagsbeschluss
    zu entfalten.
  norms:
  - Art. 76 Abs. 2 GG
  - Art. 76 Abs. 3 GG
  quellen:
  - GG, amtliche Fassung
  stand: 2026-09
- slug: or-gg-gesetzgebung-zustimmungs-einspruchsgesetz
  type: definition
  front: Wie unterscheiden sich Zustimmungsgesetz und Einspruchsgesetz?
  back: Ein Zustimmungsgesetz bedarf der ausdrücklichen Zustimmung des Bundesrates,
    um wirksam zustande zu kommen - verweigert der Bundesrat die Zustimmung, ist das
    Gesetz gescheitert. Ein Einspruchsgesetz kommt dagegen auch ohne Zustimmung des
    Bundesrates zustande; der Bundesrat kann lediglich Einspruch einlegen, den der
    Bundestag mit entsprechender Mehrheit zurückweisen kann. Ob ein Gesetz zustimmungsbedürftig
    ist, ergibt sich nicht aus einer allgemeinen Vorschrift, sondern nur aus einzelnen,
    das Grundgesetz ausdrücklich benennenden Zustimmungsvorbehalten (z. B. Art. 79
    Abs. 2, Art. 84 Abs. 1, Art. 105 Abs. 3 GG) - im Zweifel handelt es sich um ein
    Einspruchsgesetz.
  norms:
  - Art. 79 Abs. 2 GG
  - Art. 84 Abs. 1 GG
  - Art. 105 Abs. 3 GG
  quellen:
  - GG, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: or-gg-gesetzgebung-vermittlungsausschuss
  type: norm
  front: Wer kann den Vermittlungsausschuss nach Art. 77 Abs. 2 GG anrufen, und wozu
    dient er?
  back: Der Vermittlungsausschuss aus Mitgliedern von Bundestag und Bundesrat dient
    dazu, bei Meinungsverschiedenheiten über ein vom Bundestag beschlossenes Gesetz
    einen Kompromissvorschlag zu erarbeiten. Er kann vom Bundesrat innerhalb von drei
    Wochen nach Zuleitung des Gesetzes angerufen werden; bei Zustimmungsgesetzen können
    auch Bundestag und Bundesregierung die Einberufung verlangen. Der Vermittlungsausschuss
    selbst trifft keine endgültige Entscheidung, sondern unterbreitet einen Änderungsvorschlag,
    über den der Bundestag erneut beschließen muss.
  norms:
  - Art. 77 Abs. 2 GG
  quellen:
  - GG, amtliche Fassung
  stand: 2026-09
- slug: or-gg-gesetzgebung-zustandekommen-zustimmungsgesetz
  type: norm
  front: Wann kommt ein Zustimmungsgesetz nach Art. 78 GG zustande?
  back: Ein vom Bundestag beschlossenes Gesetz kommt zustande, wenn der Bundesrat
    zustimmt, einen Antrag auf Anrufung des Vermittlungsausschusses nicht innerhalb
    der vorgesehenen Frist stellt, einen Einigungsvorschlag des Vermittlungsausschusses
    billigt oder - bei einem Einspruchsgesetz - keinen Einspruch einlegt bzw. der
    Einspruch vom Bundestag zurückgewiesen wird. Bei einem echten Zustimmungsgesetz
    genügt eine bloße Nichteinlegung von Einspruch dagegen NICHT - erforderlich
    ist die ausdrückliche Zustimmung, da ohne sie das Gesetz gar nicht erst wirksam
    beschlossen ist.
  norms:
  - Art. 78 GG
  quellen:
  - GG, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: or-gg-gesetzgebung-einspruch-zurueckweisung
  type: norm
  front: Mit welcher Mehrheit kann der Bundestag einen Einspruch des Bundesrates zurückweisen,
    Art. 77 Abs. 3, 4 GG?
  back: Hat der Bundesrat mit der Mehrheit seiner Stimmen Einspruch eingelegt, kann
    der Bundestag ihn mit der Mehrheit seiner Mitglieder (absolute Mehrheit) zurückweisen.
    Hat der Bundesrat den Einspruch dagegen mit einer Mehrheit von mindestens zwei
    Dritteln seiner Stimmen beschlossen, bedarf die Zurückweisung durch den Bundestag
    einer Mehrheit von zwei Dritteln der abgegebenen Stimmen, mindestens der Mehrheit
    der Mitglieder des Bundestages. Gelingt die Zurückweisung nicht, ist das Gesetz
    endgültig gescheitert.
  norms:
  - Art. 77 Abs. 3 GG
  - Art. 77 Abs. 4 GG
  quellen:
  - GG, amtliche Fassung
  stand: 2026-09
- slug: or-gg-gesetzgebung-ausfertigung-verkuendung
  type: norm
  front: Was regelt Art. 82 Abs. 1 GG zu Ausfertigung und Verkündung eines Gesetzes?
  back: Nach Art. 82 Abs. 1 GG werden die nach den Vorschriften des Grundgesetzes
    zustande gekommenen Gesetze vom Bundespräsidenten nach Gegenzeichnung ausgefertigt
    und im Bundesgesetzblatt verkündet. Erst mit ordnungsgemäßer Verkündung wird
    das Gesetz Teil der geltenden Rechtsordnung; sofern nichts anderes bestimmt ist,
    tritt es nach Art. 82 Abs. 2 GG am vierzehnten Tag nach Ablauf des Tages in Kraft,
    an dem das Bundesgesetzblatt ausgegeben wurde.
  norms:
  - Art. 82 Abs. 1 GG
  - Art. 82 Abs. 2 GG
  quellen:
  - GG, amtliche Fassung
  stand: 2026-09
- slug: or-gg-gesetzgebung-pruefungsrecht-bundespraesident
  type: streitstand
  front: Wie weit reicht das Prüfungsrecht des Bundespräsidenten vor der Ausfertigung
    eines Gesetzes?
  back: 'Unstreitig steht dem Bundespräsidenten ein formelles Prüfungsrecht zu:
    er darf die Ausfertigung verweigern, wenn das Gesetz nicht ordnungsgemäß nach
    den Vorschriften des Grundgesetzes zustande gekommen ist. Streitig ist der Umfang
    eines materiellen Prüfungsrechts. Nach einer engen Auffassung darf der Bundespräsident
    die Ausfertigung nur bei offensichtlichen, schwerwiegenden Verstößen gegen das
    Grundgesetz verweigern (evidenzbezogene Prüfung), um die Gewaltenteilung und
    die Autorität des Bundesverfassungsgerichts als eigentlichem Hüter der Verfassung
    nicht zu unterlaufen. Eine weitergehende Auffassung räumt ihm ein umfassendes
    materielles Prüfungsrecht ein, das sich aus seinem Amtseid zur Verteidigung des
    Grundgesetzes ergebe.'
  norms:
  - Art. 82 Abs. 1 GG
  quellen:
  - GG, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: or-gg-gesetzgebung-formelle-verfassungsmaessigkeit
  type: schema_step
  front: Welche drei Prüfungsschritte umfasst die formelle Verfassungsmäßigkeit
    eines Bundesgesetzes?
  back: 'Die formelle Verfassungsmäßigkeit gliedert sich in drei Prüfungsschritte:
    erstens die Gesetzgebungszuständigkeit des Bundes (insbesondere Art. 70 ff. GG),
    zweitens das Gesetzgebungsverfahren (ordnungsgemäße Einbringung nach Art. 76
    GG, Beschlussfassung im Bundestag, erforderliche Beteiligung des Bundesrates einschließlich
    einer etwaigen Anrufung des Vermittlungsausschusses nach Art. 77 GG) und drittens
    die Form (Gegenzeichnung, Ausfertigung und Verkündung nach Art. 82 GG). Diese
    Gliederung ist zugleich der klassische Prüfungsstandort in einer abstrakten oder
    konkreten Normenkontrolle, bevor die materielle Verfassungsmäßigkeit (Vereinbarkeit
    des Gesetzesinhalts mit dem Grundgesetz) untersucht wird.'
  norms:
  - Art. 76 GG
  - Art. 77 GG
  - Art. 82 GG
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
