faelle:
- slug: or-fall-verkanntes-zustimmungsgesetz
  title: Das verkannte Zustimmungsgesetz
  difficulty: 4
  minutes: 45
  quellen:
  - Eigener Sachverhalt der Redaktion
  - GG, amtliche Fassung
  facts: Der Bundestag beschließt ein (fiktives) Gesetz, das nach einer ausdrücklichen
    Bestimmung des Grundgesetzes der Zustimmung des Bundesrates bedarf. Die Bundestagsverwaltung
    behandelt das Gesetz irrtümlich als einfaches Einspruchsgesetz. Der Bundesrat,
    der die Zustimmungsbedürftigkeit ebenfalls nicht erkennt, legt gegen das Gesetz
    mit einfacher Mehrheit 'Einspruch' ein. Der Bundestag weist diesen Einspruch daraufhin
    mit der Mehrheit seiner Mitglieder zurück. Der Bundespräsident fertigt das Gesetz
    in der Annahme aus, das Verfahren sei ordnungsgemäß abgeschlossen, und es wird
    im Bundesgesetzblatt verkündet.
  question: Ist das Gesetz formell verfassungsgemäß zustande gekommen?
  steps:
  - prompt: Um welchen Gesetzestyp handelt es sich nach der Vorgabe des Sachverhalts?
    erwartung: Um ein Zustimmungsgesetz, da eine ausdrückliche Bestimmung des Grundgesetzes
      die Zustimmung des Bundesrates vorschreibt (echte Zustimmungsvorbehalte finden
      sich nur einzeln im Grundgesetz, z. B. Art. 79 Abs. 2, Art. 84 Abs. 1 GG).
  - prompt: Genügt für das Zustandekommen eines Zustimmungsgesetzes die bloße Zurückweisung
      eines (vermeintlichen) Einspruchs?
    erwartung: Nein. Bei einem echten Zustimmungsgesetz ist die ausdrückliche Zustimmung
      des Bundesrates konstitutive Voraussetzung für das Zustandekommen, Art. 78
      GG. Die Zurückweisung eines Einspruchs ersetzt diese Zustimmung nicht, da das
      Einspruchsverfahren für Zustimmungsgesetze gar nicht das vorgesehene Verfahren
      ist.
  - prompt: Hat der Bundesrat im Sachverhalt eine Zustimmung erteilt?
    erwartung: Nein - der Bundesrat hat lediglich (fehlerhaft) 'Einspruch' eingelegt,
      keine Zustimmung erklärt. Eine ausdrückliche Zustimmungserklärung fehlt vollständig.
  - prompt: Welche Folge hat das fehlerhafte Verfahren für die formelle Verfassungsmäßigkeit
      des Gesetzes?
    erwartung: Das Gesetz ist formell verfassungswidrig, weil es mangels der erforderlichen
      Zustimmung des Bundesrates nicht wirksam nach Art. 78 GG zustande gekommen ist
      - unabhängig davon, dass der Bundestag den (unzutreffend eingeordneten) Einspruch
      zurückgewiesen hat.
  - prompt: Ändert die Ausfertigung durch den Bundespräsidenten etwas an diesem
      Ergebnis?
    erwartung: Nein. Die Ausfertigung nach Art. 82 Abs. 1 GG setzt ein nach den Vorschriften
      des Grundgesetzes ordnungsgemäß zustande gekommenes Gesetz voraus; ein Verfahrensfehler
      beim Zustandekommen wird durch die - hier auf einem Irrtum beruhende - Ausfertigung
      nicht geheilt.
  expectation:
    pruefpunkte:
