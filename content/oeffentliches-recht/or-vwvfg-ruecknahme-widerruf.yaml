cards:
- slug: or-vwvfg-rw-abgrenzung-48-49
  type: definition
  front: Wonach unterscheiden sich Ruecknahme und Widerruf eines Verwaltungsakts?
  back: Die Ruecknahme (§ 48 VwVfG) betrifft einen von Anfang an rechtswidrigen Verwaltungsakt
    und beseitigt ihn rueckwirkend fuer die Vergangenheit. Der Widerruf (§ 49 VwVfG)
    betrifft einen im Zeitpunkt seines Erlasses rechtmaessigen Verwaltungsakt, dessen
    Aufhebung an spaeter eintretende Umstaende anknuepft und grundsaetzlich nur fuer
    die Zukunft wirkt. Beide Vorschriften setzen einen unanfechtbaren oder noch anfechtbaren
    Verwaltungsakt voraus und sind nach dem Begleitwort des Gesetzes als Ermessensvorschriften
    ausgestaltet.
  norms:
  - § 48 VwVfG
  - § 49 VwVfG
  quellen:
  - VwVfG, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: or-vwvfg-rw-ruecknahme-voraussetzungen
  type: norm
  front: Welche Grundvoraussetzungen nennt § 48 Abs. 1 S. 1 VwVfG fuer die Ruecknahme?
  back: Ein rechtswidriger Verwaltungsakt kann, auch nachdem er unanfechtbar geworden
    ist, ganz oder teilweise mit Wirkung fuer die Zukunft oder fuer die Vergangenheit
    zurueckgenommen werden. Die Rechtswidrigkeit muss im Zeitpunkt des Erlasses vorgelegen
    haben oder nachtraeglich fortbestehen; die Rechtsfolge steht im Ermessen der Behoerde,
    soweit nicht die besonderen Einschraenkungen der Absaetze 2 bis 4 eingreifen.
  norms:
  - § 48 Abs. 1 S. 1 VwVfG
  quellen:
  - VwVfG, amtliche Fassung
  stand: 2026-09
- slug: or-vwvfg-rw-vertrauensschutz-abs2
  type: streitstand
  front: Wie funktioniert der Vertrauensschutz bei Ruecknahme eines begünstigenden
    VA mit Geld- oder Sachleistung nach § 48 Abs. 2 VwVfG?
  back: Begruendet oder bestaetigt der rechtswidrige Verwaltungsakt eine einmalige
    oder laufende Geld- oder teilbare Sachleistung, darf er nicht zurueckgenommen
    werden, soweit der Begünstigte auf seinen Bestand vertraut hat und sein Vertrauen
    unter Abwaegung mit dem oeffentlichen Interesse an einer Ruecknahme schutzwuerdig
    ist. Auf Vertrauen kann sich der Begünstigte insbesondere berufen, wenn er gewaehrte
    Leistungen verbraucht oder eine Vermoegensdisposition getroffen hat, die er nicht
    mehr oder nur unter unzumutbaren Nachteilen rueckgaengig machen kann. Der Vertrauensschutz
    ist ausgeschlossen, wenn einer der in § 48 Abs. 2 S. 3 VwVfG genannten Faelle
    vorliegt - insbesondere arglistige Taeuschung, Drohung, Bestechung, vorsaetzlich
    oder grob fahrlaessig unrichtige oder unvollstaendige Angaben oder Kenntnis bzw.
    grob fahrlaessige Unkenntnis der Rechtswidrigkeit.
  norms:
  - § 48 Abs. 2 S. 1 VwVfG
  - § 48 Abs. 2 S. 2 VwVfG
  - § 48 Abs. 2 S. 3 VwVfG
  quellen:
  - VwVfG, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: or-vwvfg-rw-beguenstigende-va-abs3
  type: norm
  front: Wie wird ein rechtswidriger begünstigender VA ohne Geld- oder Sachleistung
    nach § 48 Abs. 3 VwVfG zurueckgenommen?
  back: Bei sonstigen begünstigenden Verwaltungsakten - also solchen ohne Geld- oder
    teilbare Sachleistung - ist die Ruecknahme fuer die Vergangenheit nicht an die
    qualifizierten Ausschlussgruende des Absatzes 2 gebunden. Vertraut der Begünstigte
    gleichwohl schutzwuerdig auf den Bestand und wird ihm dadurch ein Vermoegensnachteil
    verursacht, hat ihm die Behoerde auf Antrag diesen Nachteil bis zur Hoehe des
    Interesses am Fortbestand auszugleichen - kein Bestandsschutz wie in Absatz 2,
    sondern nur ein finanzieller Ausgleichsanspruch.
  norms:
  - § 48 Abs. 3 VwVfG
  quellen:
  - VwVfG, amtliche Fassung
  stand: 2026-09
- slug: or-vwvfg-rw-jahresfrist-abs4
  type: norm
  front: Wann beginnt die Jahresfrist des § 48 Abs. 4 VwVfG und was regelt sie?
  back: Ist der Ruecknahme ein Fall des § 48 Abs. 2 S. 3 Nr. 1 bis 3 VwVfG vorausgegangen
    oder wird die Ruecknahme wegen nachtraeglich bekannt gewordener Tatsachen erforderlich,
    ist sie nur innerhalb eines Jahres seit dem Zeitpunkt zulaessig, in dem die Behoerde
    von den Tatsachen Kenntnis erlangt hat, die die Ruecknahme des rechtswidrigen
    Verwaltungsakts rechtfertigen. Massgeblich ist die vollstaendige Kenntnis der
    fuer die Ruecknahmeentscheidung erheblichen Tatsachen durch den zustaendigen Amtstraeger,
    nicht blosse Zweifel oder ein bloss geaeusserter Verdacht.
  norms:
  - § 48 Abs. 4 VwVfG
  quellen:
  - VwVfG, amtliche Fassung
  stand: 2026-09
- slug: or-vwvfg-rw-widerruf-belastend-begünstigend
  type: definition
  front: Wie unterscheidet § 49 VwVfG den Widerruf belastender von begünstigenden
    Verwaltungsakten?
  back: Ein rechtmaessiger, nicht begünstigender Verwaltungsakt kann nach § 49 Abs.
    1 VwVfG auch nachtraeglich ganz oder teilweise widerrufen werden, ausser ein Verwaltungsakt
    gleichen Inhalts muesste erneut erlassen werden oder ein Widerruf ist aus anderen
    Gruenden unzulaessig - die Behoerde hat hierbei freies Ermessen. Ein rechtmaessiger
    begünstigender Verwaltungsakt darf dagegen nach § 49 Abs. 2 S. 1 VwVfG nur widerrufen
    werden, wenn einer der dort abschliessend genannten Gruende vorliegt, etwa ein
    Widerrufsvorbehalt, die Nichterfuellung einer Auflage oder eine nachtraegliche
    Aenderung der Sach- oder Rechtslage, die das oeffentliche Interesse gefaehrden
    wuerde.
  norms:
  - § 49 Abs. 1 VwVfG
  - § 49 Abs. 2 S. 1 VwVfG
  quellen:
  - VwVfG, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: or-vwvfg-rw-entschaedigung-49-abs6
  type: norm
  front: Wann entsteht ein Entschaedigungsanspruch nach § 49 Abs. 6 VwVfG?
  back: Widerruft die Behoerde einen rechtmaessigen begünstigenden Verwaltungsakt
    aus einem der Gruende des § 49 Abs. 2 S. 1 Nr. 3, 4, 5 VwVfG - also wegen nachtraeglicher
    Aenderung der Rechtslage, neuer Tatsachen oder zur Abwendung schwerer Nachteile
    fuer das Gemeinwohl -, hat sie dem Betroffenen auf Antrag den Vermoegensnachteil
    auszugleichen, den er dadurch erleidet, dass er auf den Bestand des Verwaltungsakts
    vertraut hat, soweit sein Vertrauen schutzwuerdig ist. Beim Widerruf wegen eines
    Widerrufsvorbehalts (Nr. 1) oder wegen Nichterfuellung einer Auflage (Nr. 2) besteht
    dagegen KEIN Anspruch aus Abs. 6, weil der Begünstigte dort entweder von vornherein
    mit dem Widerruf rechnen musste oder den Grund selbst zu vertreten hat. Der Anspruch
    ist der Hoehe nach auf das Erfuellungsinteresse begrenzt.
  norms:
  - § 49 Abs. 6 VwVfG
  - § 49 Abs. 2 S. 1 Nr. 3, 4, 5 VwVfG
  quellen:
  - VwVfG, amtliche Fassung
  stand: 2026-09
- slug: or-vwvfg-rw-ermessen-rechtsfolge
  type: schema_step
  front: Welche Pruefungsstelle betrifft das Ermessen bei §§ 48, 49 VwVfG und was
    folgt daraus?
  back: Sowohl § 48 als auch § 49 VwVfG formulieren die Rechtsfolge als 'kann' - die
    Ruecknahme bzw. der Widerruf stehen damit im Ermessen der Behoerde, das nach §
    40 VwVfG entsprechend dem Zweck der Ermaechtigung und unter Einhaltung der gesetzlichen
    Grenzen auszuueben ist. In der Klausur ist die Ermessensausuebung als eigener
    Pruefungspunkt NACH der Feststellung, dass die tatbestandlichen Voraussetzungen
    (Rechtswidrigkeit/Rechtmaessigkeit, kein Fristablauf, kein Vertrauensschutzausschluss)
    vorliegen, zu pruefen - haeufig ist das Ermessen bei eindeutigem Ueberwiegen des
    oeffentlichen Interesses (z. B. Verstoss gegen zwingendes Recht) auf Null reduziert.
  norms:
  - § 48 VwVfG
  - § 49 VwVfG
  - § 40 VwVfG
  quellen:
  - VwVfG, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
