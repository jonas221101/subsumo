    children:
    - label: 1. Verwaltungsakt i.S.d. § 35 VwVfG
    - label: 2. Rechtmäßigkeit im Erlasszeitpunkt und fortbestehend
  - label: II. Widerrufsgrund
    children:
    - label: '1. Belastender VA: freies Widerrufsrecht, § 49 Abs. 1 VwVfG'
    - label: '2. Begünstigender VA: abschließender Katalog, § 49 Abs. 2 S. 1 VwVfG'
  - label: III. Ermessen, § 40 VwVfG
  - label: IV. Entschädigung, § 49 Abs. 6 VwVfG
    hinweis: Nur bei Widerruf aus den Gründen des § 49 Abs. 2 S. 1 Nr. 3, 4, 5 VwVfG
      - nicht bei Widerrufsvorbehalt (Nr. 1) oder Auflagenverstoß (Nr. 2).
  - label: V. Ergebnis
faelle:
- slug: or-fall-foerderbescheid-ruecknahme
  title: Der zu spät entdeckte Fehler im Förderbescheid
  difficulty: 4
  minutes: 55
  quellen:
  - Eigener Sachverhalt der Redaktion
  - VwVfG, amtliche Fassung
  facts: Die zuständige (fiktive) Landesbehörde bewilligt der Unternehmerin U mit
    Bescheid vom 10.01.2025 eine einmalige Existenzgründungsförderung in Höhe von
    20.000 Euro, die U im Februar 2025 vollständig für die Anschaffung von Betriebsausstattung
    verwendet. Tatsächlich hätte U die Förderung wegen Überschreitens der maßgeblichen
    Umsatzgrenze nicht erhalten dürfen; der zuständige Sachbearbeiter hatte bei
    der Bewilligung einen Rechenfehler in den eingereichten Unterlagen übersehen,
    obwohl U alle Angaben wahrheitsgemäß und vollständig gemacht hatte. Im Dezember
    2025 fällt der Fehler einem anderen Sachbearbeiter bei einer Stichprobenprüfung
    auf; die Behörde stellt daraufhin im Januar 2026 fest, dass der Bescheid von
    Anfang an rechtswidrig war, und möchte ihn nun zurüknehmen und die Fördersumme
    zurückfordern.
  question: Kann die Behörde den Förderbescheid im Januar 2026 gegenüber U wirksam
    zurücknehmen?
  steps:
  - prompt: Welche Ermächtigungsgrundlage kommt für die Rücknahme in Betracht?
    erwartung: § 48 Abs. 1 VwVfG, da der Förderbescheid ein begünstigender Verwaltungsakt
      ist, der von Anfang an rechtswidrig war.
  - prompt: Steht der Rücknahme ein Vertrauensschutz nach § 48 Abs. 2 VwVfG entgegen?
    erwartung: Der Bescheid gewährt eine einmalige Geldleistung, sodass § 48 Abs.
      2 VwVfG anwendbar ist. U hat die Förderung verbraucht (Anschaffung von Betriebsausstattung),
      also auf den Bestand vertraut und eine nicht mehr rückgängig zu machende Disposition
      getroffen.
  - prompt: Ist das Vertrauen der U schutzwürdig, oder greift ein Ausschlussgrund
      nach § 48 Abs. 2 S. 3 VwVfG?
    erwartung: 'Kein Ausschlussgrund einschlägig: U hat wahrheitsgemäße und vollständige
      Angaben gemacht und weder vorsätzlich noch grob fahrlässig gehandelt; der
      Fehler lag allein bei der Behörde. Das Vertrauen ist grundsätzlich schutzwürdig.'
  - prompt: Ist die Rücknahme innerhalb der Jahresfrist des § 48 Abs. 4 VwVfG erfolgt?
    erwartung: Ja - die Behörde hat erst im Dezember 2025 durch die Stichprobenprüfung
      vollständige Kenntnis der rücknahmebegründenden Tatsachen erlangt; die Rücknahme
      im Januar 2026 liegt innerhalb eines Jahres danach.
  - prompt: Wie wirkt sich das schutzwürdige Vertrauen der U im Ergebnis aus?
    erwartung: Die Rücknahme ist wegen des schutzwürdigen, nicht ausgeschlossenen
      Vertrauens der U nach § 48 Abs. 2 S. 1 VwVfG unzulässig; die Behörde kann
      den Bescheid nicht wirksam zurücknehmen, sondern müsste allenfalls für die
      Zukunft widerrufen, wenn ein Widerrufsgrund vorliegt.
  expectation:
    pruefpunkte:
    - id: p1
      label: § 48 Abs. 1 VwVfG als einschlägige Ermächtigungsgrundlage erkannt
      weight: 1.5
      required: false
      norms:
      - § 48 Abs. 1 VwVfG
      keywords:
      - '48'
      - rechtswidrig
      card_slugs:
      - or-vwvfg-rw-ruecknahme-voraussetzungen
    - id: p2
      label: Anwendbarkeit des § 48 Abs. 2 VwVfG wegen Geldleistung erkannt
      weight: 1.5
