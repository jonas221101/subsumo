  steps:
  - label: I. Anwendbarkeit des § 48 VwVfG
    children:
    - label: 1. Verwaltungsakt i.S.d. § 35 VwVfG
    - label: 2. Rechtswidrigkeit des Verwaltungsakts
  - label: II. Rücknahmesperre bei begünstigenden Verwaltungsakten
    children:
    - label: '1. Geld- oder teilbare Sachleistung: Vertrauensschutz nach § 48 Abs.
        2 VwVfG'
      children:
      - label: a) Vertrauen auf den Bestand betätigt (Verbrauch, Disposition)
      - label: b) Schutzwürdigkeit des Vertrauens
      - label: c) Kein Ausschlussgrund nach § 48 Abs. 2 S. 3 VwVfG
    - label: '2. Sonstige begünstigende VA: nur Ausgleichsanspruch nach § 48 Abs.
        3 VwVfG'
  - label: III. Jahresfrist, § 48 Abs. 4 VwVfG
    hinweis: Nur relevant bei nachtraeglich bekannt gewordenen Tatsachen bzw. Faellen
      des § 48 Abs. 2 S. 3 Nr. 1-3 VwVfG.
  - label: IV. Ermessen, § 40 VwVfG
    hinweis: '''Kann''-Vorschrift; Ermessensreduzierung auf Null bei ueberwiegendem
      oeffentlichen Interesse pruefen.'
  - label: 'V. Ergebnis: Rechtsfolge (ex tunc oder ex nunc)'
