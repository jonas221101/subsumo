    - id: p3
      label: Vertrauensbetätigung durch Verbrauch der Fördersumme (Disposition)
        benannt
      weight: 2.0
      required: true
      keywords:
      - Vertrauensbetätigung
      - Disposition
      - verbraucht
      card_slugs:
