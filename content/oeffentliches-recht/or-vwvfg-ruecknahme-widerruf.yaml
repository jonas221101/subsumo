cards:
- slug: or-vwvfg-rw-abgrenzung-48-49
  type: definition
  front: Wonach unterscheiden sich Rücknahme und Widerruf eines Verwaltungsakts?
  back: Die Rücknahme (§ 48 VwVfG) betrifft einen von Anfang an rechtswidrigen Verwaltungsakt
    und beseitigt ihn rückwirkend für die Vergangenheit. Der Widerruf (§ 49 VwVfG)
    betrifft einen im Zeitpunkt seines Erlasses rechtmäßigen Verwaltungsakt, dessen
    Aufhebung an später eintretende Umstände anknüpft und grundsätzlich nur für
    die Zukunft wirkt. Beide Vorschriften setzen einen unanfechtbaren oder noch anfechtbaren
    Verwaltungsakt voraus und sind nach dem Begleitwort des Gesetzes als Ermessensvorschriften
    ausgestaltet.
  norms:
  - § 48 VwVfG
  - § 49 VwVfG
  quellen:
  - VwVfG, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: or-vwvfg-rw-ruecknahme-voraussetzungen
  type: norm
  front: Welche Grundvoraussetzungen nennt § 48 Abs. 1 S. 1 VwVfG für die Rücknahme?
  back: Ein rechtswidriger Verwaltungsakt kann, auch nachdem er unanfechtbar geworden
    ist, ganz oder teilweise mit Wirkung für die Zukunft oder für die Vergangenheit
    zurückgenommen werden. Die Rechtswidrigkeit muss im Zeitpunkt des Erlasses vorgelegen
    haben oder nachträglich fortbestehen; die Rechtsfolge steht im Ermessen der Behörde,
    soweit nicht die besonderen Einschränkungen der Absätze 2 bis 4 eingreifen.
  norms:
  - § 48 Abs. 1 S. 1 VwVfG
  quellen:
  - VwVfG, amtliche Fassung
  stand: 2026-09
- slug: or-vwvfg-rw-vertrauensschutz-abs2
  type: streitstand
  front: Wie funktioniert der Vertrauensschutz bei Rücknahme eines begünstigenden
    VA mit Geld- oder Sachleistung nach § 48 Abs. 2 VwVfG?
  back: Begründet oder bestätigt der rechtswidrige Verwaltungsakt eine einmalige
    oder laufende Geld- oder teilbare Sachleistung, darf er nicht zurückgenommen
    werden, soweit der Begünstigte auf seinen Bestand vertraut hat und sein Vertrauen
    unter Abwägung mit dem öffentlichen Interesse an einer Rücknahme schutzwürdig
    ist. Auf Vertrauen kann sich der Begünstigte insbesondere berufen, wenn er gewährte
    Leistungen verbraucht oder eine Vermögensdisposition getroffen hat, die er nicht
    mehr oder nur unter unzumutbaren Nachteilen rückgängig machen kann. Der Vertrauensschutz
    ist ausgeschlossen, wenn einer der in § 48 Abs. 2 S. 3 VwVfG genannten Fälle
    vorliegt - insbesondere arglistige Täuschung, Drohung, Bestechung, vorsätzlich
    oder grob fahrlässig unrichtige oder unvollständige Angaben oder Kenntnis bzw.
    grob fahrlässige Unkenntnis der Rechtswidrigkeit.
  norms:
  - § 48 Abs. 2 S. 1 VwVfG
  - § 48 Abs. 2 S. 2 VwVfG
  - § 48 Abs. 2 S. 3 VwVfG
  quellen:
  - VwVfG, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: or-vwvfg-rw-beguenstigende-va-abs3
  type: norm
  front: Wie wird ein rechtswidriger begünstigender VA ohne Geld- oder Sachleistung
    nach § 48 Abs. 3 VwVfG zurückgenommen?
  back: Bei sonstigen begünstigenden Verwaltungsakten - also solchen ohne Geld- oder
    teilbare Sachleistung - ist die Rücknahme für die Vergangenheit nicht an die
    qualifizierten Ausschlussgründe des Absatzes 2 gebunden. Vertraut der Begünstigte
    gleichwohl schutzwürdig auf den Bestand und wird ihm dadurch ein Vermögensnachteil
    verursacht, hat ihm die Behörde auf Antrag diesen Nachteil bis zur Höhe des
    Interesses am Fortbestand auszugleichen - kein Bestandsschutz wie in Absatz 2,
    sondern nur ein finanzieller Ausgleichsanspruch.
  norms:
  - § 48 Abs. 3 VwVfG
  quellen:
  - VwVfG, amtliche Fassung
  stand: 2026-09
- slug: or-vwvfg-rw-jahresfrist-abs4
  type: norm
  front: Wann beginnt die Jahresfrist des § 48 Abs. 4 VwVfG und was regelt sie?
  back: Die Jahresfrist des § 48 Abs. 4 VwVfG gilt für die Fälle des § 48 Abs. 2
    S. 3 Nr. 2 und 3 VwVfG sowie für sonstige nachträglich bekannt gewordene rücknahmebegründende
    Tatsachen - die Rücknahme ist dann nur innerhalb eines Jahres seit dem Zeitpunkt
    zulässig, in dem die Behörde von den Tatsachen Kenntnis erlangt hat, die die
    Rücknahme des rechtswidrigen Verwaltungsakts rechtfertigen. Für den Fall des
    § 48 Abs. 2 S. 3 Nr. 1 VwVfG (arglistige Täuschung, Drohung oder Bestechung)
    gilt die Jahresfrist dagegen gerade NICHT (§ 48 Abs. 4 S. 2 VwVfG) - die Rücknahme
    ist dort zeitlich unbefristet möglich. Maßgeblich ist im Übrigen die vollständige
    Kenntnis der für die Rücknahmeentscheidung erheblichen Tatsachen durch den zuständigen
    Amtsträger, nicht bloße Zweifel oder ein bloß geäußerter Verdacht.
  norms:
  - § 48 Abs. 4 VwVfG
  - § 48 Abs. 2 S. 3 VwVfG
  quellen:
  - VwVfG, amtliche Fassung
  stand: 2026-09
- slug: or-vwvfg-rw-widerruf-belastend-begünstigend
  type: definition
  front: Wie unterscheidet § 49 VwVfG den Widerruf belastender von begünstigenden
    Verwaltungsakten?
  back: Ein rechtmäßiger, nicht begünstigender Verwaltungsakt kann nach § 49 Abs.
    1 VwVfG auch nachträglich ganz oder teilweise widerrufen werden, außer ein Verwaltungsakt
    gleichen Inhalts müsste erneut erlassen werden oder ein Widerruf ist aus anderen
    Gründen unzulässig - die Behörde hat hierbei freies Ermessen. Ein rechtmäßiger
    begünstigender Verwaltungsakt darf dagegen nach § 49 Abs. 2 S. 1 VwVfG nur widerrufen
    werden, wenn einer der dort abschließend genannten Gründe vorliegt, etwa ein
    Widerrufsvorbehalt, die Nichterfüllung einer Auflage oder eine nachträgliche
    Änderung der Sach- oder Rechtslage, die das öffentliche Interesse gefährden
    würde.
  norms:
  - § 49 Abs. 1 VwVfG
  - § 49 Abs. 2 S. 1 VwVfG
  quellen:
  - VwVfG, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: or-vwvfg-rw-entschaedigung-49-abs6
  type: norm
  front: Wann entsteht ein Entschädigungsanspruch nach § 49 Abs. 6 VwVfG?
  back: Widerruft die Behörde einen rechtmäßigen begünstigenden Verwaltungsakt
    aus einem der Gründe des § 49 Abs. 2 S. 1 Nr. 3, 4, 5 VwVfG - also wegen nachträglicher
    Änderung der Rechtslage, neuer Tatsachen oder zur Abwendung schwerer Nachteile
    für das Gemeinwohl -, hat sie dem Betroffenen auf Antrag den Vermögensnachteil
    auszugleichen, den er dadurch erleidet, dass er auf den Bestand des Verwaltungsakts
    vertraut hat, soweit sein Vertrauen schutzwürdig ist. Beim Widerruf wegen eines
    Widerrufsvorbehalts (Nr. 1) oder wegen Nichterfüllung einer Auflage (Nr. 2) besteht
    dagegen KEIN Anspruch aus Abs. 6, weil der Begünstigte dort entweder von vornherein
    mit dem Widerruf rechnen musste oder den Grund selbst zu vertreten hat. Der Anspruch
    ist der Höhe nach auf das Erfüllungsinteresse begrenzt.
  norms:
  - § 49 Abs. 6 VwVfG
  - § 49 Abs. 2 S. 1 Nr. 3, 4, 5 VwVfG
  quellen:
  - VwVfG, amtliche Fassung
  stand: 2026-09
- slug: or-vwvfg-rw-ermessen-rechtsfolge
  type: schema_step
  front: Welche Prüfungsstelle betrifft das Ermessen bei §§ 48, 49 VwVfG und was
    folgt daraus?
  back: Sowohl § 48 als auch § 49 VwVfG formulieren die Rechtsfolge als 'kann' - die
    Rücknahme bzw. der Widerruf stehen damit im Ermessen der Behörde, das nach §
    40 VwVfG entsprechend dem Zweck der Ermächtigung und unter Einhaltung der gesetzlichen
    Grenzen auszuüben ist. In der Klausur ist die Ermessensausübung als eigener
    Prüfungspunkt NACH der Feststellung, dass die tatbestandlichen Voraussetzungen
    (Rechtswidrigkeit/Rechtmäßigkeit, kein Fristablauf, kein Vertrauensschutzausschluss)
    vorliegen, zu prüfen - häufig ist das Ermessen bei eindeutigem Überwiegen des
    öffentlichen Interesses (z. B. Verstoß gegen zwingendes Recht) auf Null reduziert.
  norms:
  - § 48 VwVfG
  - § 49 VwVfG
  - § 40 VwVfG
  quellen:
  - VwVfG, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
schemata:
- slug: or-schema-vwvfg-ruecknahme-48
  title: Rücknahme eines rechtswidrigen Verwaltungsakts, § 48 VwVfG
  norms:
  - § 48 VwVfG
  quellen:
  - VwVfG, amtliche Fassung
  - Eigenformulierung Redaktion
  steps:
  - label: I. Anwendbarkeit des § 48 VwVfG
    children:
    - label: 1. Verwaltungsakt i.S.d. § 35 VwVfG
    - label: 2. Rechtswidrigkeit des Verwaltungsakts
  - label: II. Rücknahmesperre bei begünstigenden Verwaltungsakten
    children:
    - label: '1. Geld- oder teilbare Sachleistung: Vertrauensschutz nach § 48 Abs.
        2 VwVfG'
      children:
      - label: a) Vertrauen auf den Bestand betätigt (Verbrauch, Disposition)
      - label: b) Schutzwürdigkeit des Vertrauens
      - label: c) Kein Ausschlussgrund nach § 48 Abs. 2 S. 3 VwVfG
    - label: '2. Sonstige begünstigende VA: nur Ausgleichsanspruch nach § 48 Abs.
        3 VwVfG'
  - label: III. Jahresfrist, § 48 Abs. 4 VwVfG
    hinweis: Gilt bei nachträglich bekannt gewordenen Tatsachen und in den Fällen
      des § 48 Abs. 2 S. 3 Nr. 2, 3 VwVfG. Im Fall der Nr. 1 (arglistige Täuschung,
      Drohung, Bestechung) gilt die Jahresfrist nach § 48 Abs. 4 S. 2 VwVfG gerade
      nicht - Rücknahme dort zeitlich unbefristet möglich.
  - label: IV. Ermessen, § 40 VwVfG
    hinweis: '''Kann''-Vorschrift; Ermessensreduzierung auf Null bei überwiegendem
      öffentlichen Interesse prüfen.'
  - label: 'V. Ergebnis: Rechtsfolge (ex tunc oder ex nunc)'
- slug: or-schema-vwvfg-widerruf-49
  title: Widerruf eines rechtmäßigen Verwaltungsakts, § 49 VwVfG
