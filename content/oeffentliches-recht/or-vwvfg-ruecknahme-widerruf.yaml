faelle:
- slug: or-fall-foerderbescheid-ruecknahme
  title: Der zu spaet entdeckte Fehler im Foerderbescheid
  difficulty: 4
  minutes: 55
  quellen:
  - Eigener Sachverhalt der Redaktion
  - VwVfG, amtliche Fassung
  facts: Die zustaendige (fiktive) Landesbehoerde bewilligt der Unternehmerin U mit
    Bescheid vom 10.01.2025 eine einmalige Existenzgruendungsfoerderung in Hoehe von
    20.000 Euro, die U im Februar 2025 vollstaendig fuer die Anschaffung von Betriebsausstattung
    verwendet. Tatsaechlich haette U die Foerderung wegen Ueberschreitens der massgeblichen
    Umsatzgrenze nicht erhalten duerfen; der zustaendige Sachbearbeiter hatte bei
    der Bewilligung einen Rechenfehler in den eingereichten Unterlagen uebersehen,
    obwohl U alle Angaben wahrheitsgemaess und vollstaendig gemacht hatte. Im Dezember
    2025 faellt der Fehler einem anderen Sachbearbeiter bei einer Stichprobenpruefung
    auf; die Behoerde stellt daraufhin im Januar 2026 fest, dass der Bescheid von
    Anfang an rechtswidrig war, und moechte ihn nun zurueknehmen und die Foerdersumme
    zurueckfordern.
  question: Kann die Behoerde den Foerderbescheid im Januar 2026 gegenueber U wirksam
    zuruecknehmen?
  steps:
  - prompt: Welche Ermaechtigungsgrundlage kommt fuer die Ruecknahme in Betracht?
    erwartung: § 48 Abs. 1 VwVfG, da der Foerderbescheid ein begünstigender Verwaltungsakt
      ist, der von Anfang an rechtswidrig war.
  - prompt: Steht der Ruecknahme ein Vertrauensschutz nach § 48 Abs. 2 VwVfG entgegen?
    erwartung: Der Bescheid gewaehrt eine einmalige Geldleistung, sodass § 48 Abs.
      2 VwVfG anwendbar ist. U hat die Foerderung verbraucht (Anschaffung von Betriebsausstattung),
      also auf den Bestand vertraut und eine nicht mehr rueckgaengig zu machende Disposition
      getroffen.
  - prompt: Ist das Vertrauen der U schutzwuerdig, oder greift ein Ausschlussgrund
      nach § 48 Abs. 2 S. 3 VwVfG?
    erwartung: 'Kein Ausschlussgrund einschlaegig: U hat wahrheitsgemaesse und vollstaendige
      Angaben gemacht und weder vorsaetzlich noch grob fahrlaessig gehandelt; der
      Fehler lag allein bei der Behoerde. Das Vertrauen ist grundsaetzlich schutzwuerdig.'
  - prompt: Ist die Ruecknahme innerhalb der Jahresfrist des § 48 Abs. 4 VwVfG erfolgt?
    erwartung: Ja - die Behoerde hat erst im Dezember 2025 durch die Stichprobenpruefung
      vollstaendige Kenntnis der ruecknahmebegruendenden Tatsachen erlangt; die Ruecknahme
      im Januar 2026 liegt innerhalb eines Jahres danach.
  - prompt: Wie wirkt sich das schutzwuerdige Vertrauen der U im Ergebnis aus?
    erwartung: Die Ruecknahme ist wegen des schutzwuerdigen, nicht ausgeschlossenen
      Vertrauens der U nach § 48 Abs. 2 S. 1 VwVfG unzulaessig; die Behoerde kann
      den Bescheid nicht wirksam zuruecknehmen, sondern muesste allenfalls fuer die
      Zukunft widerrufen, wenn ein Widerrufsgrund vorliegt.
  expectation:
    pruefpunkte:
    - id: p1
      label: § 48 Abs. 1 VwVfG als einschlaegige Ermaechtigungsgrundlage erkannt
      weight: 1.5
      required: false
      norms:
      - § 48 Abs. 1 VwVfG
      keywords:
      - '48'
      - rechtswidrig
    - id: p2
      label: Anwendbarkeit des § 48 Abs. 2 VwVfG wegen Geldleistung erkannt
      weight: 1.5
      required: false
      norms:
      - § 48 Abs. 2 VwVfG
      keywords:
      - Geldleistung
      - Abs. 2
    - id: p3
      label: Vertrauensbetaetigung durch Verbrauch der Foerdersumme (Disposition)
        benannt
      weight: 2.0
      required: true
      keywords:
      - Vertrauensbetaetigung
      - Disposition
      - verbraucht
    - id: p4
      label: Kein Ausschlussgrund nach § 48 Abs. 2 S. 3 VwVfG, da U weder taeuschte
        noch grob fahrlaessig handelte
      weight: 3.0
      required: true
      keywords:
      - kein Ausschlussgrund
      - grob fahrlaessig
      - Fehler der Behoerde
    - id: p5
      label: Jahresfrist des § 48 Abs. 4 VwVfG gewahrt (Kenntnis erst Dezember 2025)
      weight: 2.0
      required: true
      keywords:
      - Jahresfrist
      - Kenntnis
    - id: p6
      label: 'Ergebnis: Ruecknahme wegen schutzwuerdigen Vertrauens unzulaessig'
      weight: 1.0
      required: false
      keywords:
      - unzulaessig
      - Vertrauen schutzwuerdig
