  area: oeffentliches-recht
  title: Rücknahme und Widerruf, §§ 48, 49 VwVfG
  parent: oeffentliches-recht
  relevance: 5
  stand: 2026-09
  redaktion:
    erzeugt_von: collector-agent-v1
    geprueft_von: reviewer-agent-v1
