  - Eigenformulierung Redaktion
  steps:
  - label: I. Zulässigkeit
    children:
    - label: 1. Antragsberechtigung - Beteiligter des Hauptsacheverfahrens
    - label: 2. Hauptsacheverfahren anhängig oder zu erwarten, in der Hauptsache nicht offensichtlich unzulässig
    - label: 3. Rechtsschutzbedürfnis und Dringlichkeit
  - label: II. Begründetheit
    children:
    - label: 1. Erfolgsaussichten der Hauptsache nur summarisch - offensichtlich unbegründet führt zur Ablehnung
    - label: 2. Bei offenem Ausgang - Folgenabwägung (Doppelhypothese)
    - label: 3. Dringende Gebotenheit - schwerer Nachteil, drohende Gewalt, wichtiger Grund des gemeinen Wohls
    hinweis: Irreversibilität der Nachteile ist entscheidend; gegen Gesetze strenger Maßstab.
  - label: III. Entscheidung und Wirkung
    hinweis: Vorläufige Regelung, keine Vorwegnahme der Hauptsache; Außerkrafttreten nach sechs Monaten, § 32 Abs. 6 BVerfGG.
faelle:
- slug: or-fall-bl-legalplanung-gemeinde
  title: Die Umgehungsstraße per Gesetz
  difficulty: 4
  minutes: 50
  quellen:
  - Eigener Sachverhalt der Redaktion
  - GG, amtliche Fassung
  - BVerfGG, amtliche Fassung
  facts: >-
    Ein Bundesgesetz ordnet unmittelbar den Bau einer Umgehungsstraße über Gemarkungsfläche der Gemeinde G an und ersetzt dafür die sonst übliche Planfeststellung (Legalplanung). Die Trasse zerschneidet ein von G im Bebauungsplan als Wohngebiet ausgewiesenes und teilweise bereits erschlossenes Gelände. Ein weiterer Vollzugsakt ist nicht erforderlich. Drei Monate nach der Verkündung erhebt G Verfassungsbeschwerde zum Bundesverfassungsgericht mit der Begründung, ihre Planungshoheit werde verletzt. Mit dem Baubeginn in sechs Wochen sollen die erschlossenen Flächen unwiederbringlich überbaut werden. Eine spätere Verwirklichung des Straßenprojekts würde sich bei Erfolg der Beschwerde nur um etwa ein halbes Jahr verzögern; Gefahren für Leben oder Gesundheit sind damit nicht verbunden. G beantragt zugleich, den Vollzug des Gesetzes vorläufig auszusetzen.
  question: Ist die Kommunalverfassungsbeschwerde zulässig, und hat der Eilantrag der G Erfolg?
  steps:
  - prompt: Ist die Kommunalverfassungsbeschwerde der G zulässig?
    erwartung: Ja. G ist Gemeinde und damit beschwerdeführungsberechtigt nach Art. 93 Abs. 1 Nr. 4b GG, § 91 BVerfGG; Gegenstand ist ein Bundesgesetz; es erscheint möglich, dass die Planungshoheit als Teil der Selbstverwaltung nach Art. 28 Abs. 2 S. 1 GG verletzt ist; G ist selbst, gegenwärtig und unmittelbar betroffen, weil das Gesetz ohne weiteren Vollzugsakt wirkt; die Jahresfrist des § 93 Abs. 3 BVerfGG ist mit drei Monaten gewahrt. Der Vorrang des Landesverfassungsgerichts (§ 91 S. 2 BVerfGG) betrifft nur Landesgesetze.
  - prompt: Ist der Eilantrag zulässig, und sind die Erfolgsaussichten in der Hauptsache offensichtlich ausgeschlossen?
    erwartung: Der Antrag ist zulässig, die Beschwerde ist anhängig und nicht offensichtlich unzulässig. In der Hauptsache ist der Ausgang offen. Überörtliche Verkehrsinteressen können einen Eingriff in die Planungshoheit rechtfertigen, die Abwägung ist aber nicht von vornherein entschieden. Die Beschwerde ist deshalb weder offensichtlich unbegründet noch offensichtlich begründet.
  - prompt: Wie fällt die Folgenabwägung aus?
    erwartung: Ohne einstweilige Anordnung und bei späterem Erfolg der Hauptsache wären die erschlossenen Flächen unwiederbringlich überbaut, die Planungshoheit wäre endgültig vereitelt. Mit einstweiliger Anordnung und späterem Misserfolg der Hauptsache würde das Straßenprojekt nur um etwa ein halbes Jahr verzögert. Der irreversible Schaden wiegt schwerer; die einstweilige Anordnung ist zum Schutz vor schweren Nachteilen dringend geboten. Der strenge Maßstab bei Gesetzen steht dem nicht entgegen, weil die Nachteile besonderes Gewicht haben.
  - prompt: Wie ist der Antrag insgesamt zu bescheiden?
    erwartung: Dem Antrag ist stattzugeben. Das Gericht setzt den Vollzug des Gesetzes im Bereich der Gemarkung vorläufig aus (§ 32 Abs. 1 BVerfGG).
