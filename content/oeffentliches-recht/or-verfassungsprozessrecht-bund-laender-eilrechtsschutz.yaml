cards:
- slug: or-bl-bund-laender-streit-gegenstand
  type: norm
  front: "Was ist Gegenstand des Bund-Länder-Streits nach Art. 93 Abs. 1 Nr. 3 GG, und wer ist beteiligt?"
  back: >-
    Das Bundesverfassungsgericht entscheidet bei Meinungsverschiedenheiten über Rechte und Pflichten des Bundes und der Länder, insbesondere bei der Ausführung von Bundesrecht durch die Länder und bei der Ausübung der Bundesaufsicht (Art. 93 Abs. 1 Nr. 3 GG, §§ 68 bis 70 BVerfGG). Antragsteller und Antragsgegner können nur die Bundesregierung für den Bund und die jeweilige Landesregierung für das Land sein (§ 68 BVerfGG); Parlamente, Fraktionen, Gemeinden oder Parteien sind nicht beteiligtenfähig. Streitgegenstand ist ein Rechtsverhältnis zwischen Bund und Land im Bundesstaat, etwa die Verletzung der Verwaltungskompetenzen (Art. 83 ff. GG), des Weisungsrechts in der Bundesauftragsverwaltung oder des Grundsatzes der Bundestreue. Der Bund-Länder-Streit ist ein kontradiktorisches Verfahren und schützt die föderalen Kompetenzen, nicht individuelle Grundrechte. Er ist Ausdruck des bundesstaatlichen Prinzips (Art. 20 Abs. 1 GG) und dient dem Rechtsfrieden zwischen Bund und Ländern.
  norms:
  - Art. 93 Abs. 1 Nr. 3 GG
  - § 68 BVerfGG
  - Art. 20 Abs. 1 GG
  quellen:
  - GG, amtliche Fassung
  - BVerfGG, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-10
- slug: or-bl-bund-laender-streit-zulaessigkeit
  type: norm
  front: "Welche Zulässigkeitsvoraussetzungen hat der Bund-Länder-Streit (§§ 68, 69, 64 BVerfGG)?"
  back: >-
    Der Antrag ist zulässig, wenn die Beteiligten antragsberechtigt sind (Bundesregierung, Landesregierung, § 68 BVerfGG) und ein tauglicher Antragsgegenstand vorliegt: eine rechtserhebliche Maßnahme oder Unterlassung des Antragsgegners (§ 69 in Verbindung mit § 64 Abs. 1 BVerfGG). Der Antragsteller muss geltend machen, durch die Maßnahme oder Unterlassung in seinen verfassungsmäßigen Rechten und Pflichten verletzt oder unmittelbar gefährdet zu sein (Antragsbefugnis, Möglichkeitstheorie). Der Antrag ist binnen sechs Monaten zu stellen, nachdem die Maßnahme oder Unterlassung dem Antragsteller bekannt geworden ist (§ 69 in Verbindung mit § 64 Abs. 3 BVerfGG). Hinzu kommt das allgemeine Rechtsschutzbedürfnis. Art. 93 Abs. 1 Nr. 4 GG (andere öffentlich-rechtliche Streitigkeiten zwischen Bund und Ländern) tritt als Auffangtatbestand zurück, wenn der Streit unter Nr. 3 fällt. Streitigkeiten innerhalb eines Landes entscheidet das Landesverfassungsgericht (Art. 99 GG).
  norms:
  - Art. 93 Abs. 1 Nr. 3 GG
  - § 69 BVerfGG
  - § 64 BVerfGG
  quellen:
  - GG, amtliche Fassung
  - BVerfGG, amtliche Fassung
  stand: 2026-10
- slug: or-bl-ea-voraussetzungen-art32
  type: norm
  front: "Unter welchen Voraussetzungen kann das Bundesverfassungsgericht eine einstweilige Anordnung nach § 32 Abs. 1 BVerfGG erlassen?"
  back: >-
    Das Bundesverfassungsgericht kann im Streitfall einen Zustand durch einstweilige Anordnung vorläufig regeln, wenn dies zur Abwehr schwerer Nachteile, zur Verhinderung drohender Gewalt oder aus einem anderen wichtigen Grund zum gemeinen Wohl dringend geboten ist (§ 32 Abs. 1 BVerfGG). Die einstweilige Anordnung setzt ein Hauptsacheverfahren voraus, das anhängig oder zumindest zu erwarten ist; sie ist in allen Verfahrensarten möglich, auch im Organstreit, im Bund-Länder-Streit und bei der Verfassungsbeschwerde. Der Antrag ist unzulässig, wenn er in der Hauptsache offensichtlich unzulässig ist; er ist unbegründet, wenn die Hauptsache offensichtlich unbegründet ist. Sie dient nur der vorläufigen Sicherung und soll die Entscheidung in der Hauptsache nicht vorwegnehmen. Wegen ihrer Tragweite, besonders bei vorläufigen Eingriffen in Entscheidungen anderer Verfassungsorgane, wird sie zurückhaltend und nach einem strengen Maßstab erlassen.
  norms:
  - § 32 Abs. 1 BVerfGG
  quellen:
  - BVerfGG, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-10
- slug: or-bl-ea-folgenabwaegung
  type: definition
  front: "Wie läuft die Folgenabwägung bei der einstweiligen Anordnung nach § 32 BVerfGG ab?"
  back: >-
    Die Prüfung erfolgt in zwei Schritten. Zunächst werden die Erfolgsaussichten der Hauptsache nur summarisch geprüft: Ist der Antrag in der Hauptsache offensichtlich unzulässig oder unbegründet, wird die einstweilige Anordnung abgelehnt; ist er offensichtlich begründet, kann sie ergehen, wenn der Nachteil dringend abzuwenden ist. Ist der Ausgang der Hauptsache offen, nimmt das Gericht eine Folgenabwägung (Doppelhypothese) vor: Es vergleicht die Nachteile, die entstehen, wenn die einstweilige Anordnung nicht erlassen wird, die Hauptsache aber Erfolg hat, mit denen, die eintreten, wenn sie erlassen wird, die Hauptsache aber erfolglos bleibt. Die Gründe für den Erlass müssen so schwer wiegen, dass die Anordnung unabweisbar ist. Maßgeblich ist vor allem, ob die Nachteile irreversibel oder nur schwer revidierbar sind und welches Gewicht sie haben. Erst wenn die Nachteile bei Ablehnung deutlich überwiegen, wird der Antrag begründet.
  norms:
  - § 32 Abs. 1 BVerfGG
  quellen:
  - BVerfGG, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-10
- slug: or-bl-ea-gegen-gesetze-strenger-massstab
  type: streitstand
  front: "Gilt für die einstweilige Anordnung gegen ein Gesetz ein strengerer Maßstab?"
  back: >-
    Wer die vorläufige Aussetzung eines in Kraft getretenen oder zu verkündenden Gesetzes begehrt, verlangt einen erheblichen Eingriff in die Gestaltungsfreiheit des demokratisch legitimierten Gesetzgebers. Nach der Praxis des Bundesverfassungsgerichts ist daher ein besonders strenger Maßstab anzulegen: Die Nachteile müssen von besonderem Gewicht sein, und eine Aussetzung wird nur ausnahmsweise erlassen. Das Gericht prüft zudem, ob die Hauptsache nicht offensichtlich unbegründet ist, ohne bereits die Verfassungsmäßigkeit abschließend zu klären. Kritik: Der strenge Maßstab verkürze den effektiven Rechtsschutz (Art. 19 Abs. 4 GG ist beim Gesetz freilich nicht unmittelbar einschlägig) und überlasse dem Gesetzgeber vollendete Tatsachen. Befürworter verweisen auf Gewaltenteilung und Funktionsfähigkeit der Staatsorgane. Entscheidend bleibt in der Fallbearbeitung die Abwägung zwischen irreversiblen Schäden und der nur zeitlichen Verzögerung der Gesetzesumsetzung.
  norms:
  - § 32 Abs. 1 BVerfGG
  - Art. 20 Abs. 2 GG
  quellen:
  - BVerfGG, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-10
- slug: or-bl-ea-verfahren-wirkung
  type: norm
  front: "Wie läuft das Verfahren der einstweiligen Anordnung ab, und wie lange wirkt sie?"
  back: >-
    Die einstweilige Anordnung kann ohne mündliche Verhandlung ergehen (§ 32 Abs. 2 S. 1 BVerfGG). Den Äußerungsberechtigten, etwa dem Antragsgegner, ist vor der Entscheidung Gelegenheit zur Stellungnahme zu geben (S. 2); bei besonderer Dringlichkeit kann davon abgesehen werden. Wird die einstweilige Anordnung ohne mündliche Verhandlung erlassen, kann Widerspruch eingelegt werden, über den nach mündlicher Verhandlung entschieden wird (Abs. 3), der Widerspruch hat keine aufschiebende Wirkung. Die einstweilige Anordnung tritt nach sechs Monaten außer Kraft (Abs. 6 S. 1); sie kann mit Zweidrittelmehrheit wiederholt werden (S. 2). Mit der Entscheidung in der Hauptsache endet die einstweilige Anordnung.
  norms:
  - § 32 Abs. 2 BVerfGG
  - § 32 Abs. 3 BVerfGG
  - § 32 Abs. 6 BVerfGG
  quellen:
  - BVerfGG, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-10
- slug: or-bl-kommunalverfassungsbeschwerde-zulaessigkeit
  type: norm
  front: "Welche Zulässigkeitsvoraussetzungen hat die Kommunalverfassungsbeschwerde (Art. 93 Abs. 1 Nr. 4b GG, § 91 BVerfGG)?"
  back: >-
    Gemeinden und Gemeindeverbände können wegen Verletzung des Rechts auf Selbstverwaltung nach Art. 28 GG durch ein Gesetz Verfassungsbeschwerde erheben (Art. 93 Abs. 1 Nr. 4b GG, § 91 BVerfGG). Beschwerdeführer sind also Gemeinden, Kreise und sonstige kommunale Zusammenschlüsse; sie sind nicht grundrechtsfähig im Sinne des Art. 19 Abs. 3 GG, können sich daher nur auf Art. 28 Abs. 2 GG berufen. Gegenstand ist ein Bundes- oder Landesgesetz. Die Beschwerdebefugnis verlangt die Möglichkeit einer Verletzung von Art. 28 Abs. 2 GG sowie die eigene, gegenwärtige und unmittelbare Betroffenheit. Die Beschwerde ist binnen eines Jahres nach Inkrafttreten des Gesetzes zu erheben (§ 93 Abs. 3 BVerfGG). Bei Landesgesetzen ist die Beschwerde zum Bundesverfassungsgericht ausgeschlossen, soweit Beschwerde zum Landesverfassungsgericht erhoben werden kann (§ 91 S. 2 BVerfGG, Subsidiarität). Nach dem Grundsatz der materiellen Subsidiarität ist zudem der fachgerichtliche Rechtsweg zu beschreiten, wenn er die Rechte der Gemeinde schützen kann.
  norms:
  - Art. 93 Abs. 1 Nr. 4b GG
  - § 91 BVerfGG
  - § 93 Abs. 3 BVerfGG
  - Art. 28 Abs. 2 GG
  quellen:
  - GG, amtliche Fassung
  - BVerfGG, amtliche Fassung
  stand: 2026-10
- slug: or-bl-selbstverwaltungsgarantie-rastede
  type: rechtsprechung
  front: "Welchen Maßstab legt das Bundesverfassungsgericht an die kommunale Selbstverwaltungsgarantie an (BVerfGE 79, 127 – Rastede)?"
  back: >-
    Art. 28 Abs. 2 S. 1 GG gewährleistet den Gemeinden das Recht, alle Angelegenheiten der örtlichen Gemeinschaft im Rahmen der Gesetze in eigener Verantwortung zu regeln. Das Bundesverfassungsgericht hat daraus eine Regelzuständigkeit der Gemeinden für Aufgaben mit örtlichem Charakter abgeleitet (Aufgabenverteilungsprinzip); sie dürfen ihnen nur aus Gründen des Gemeininteresses, insbesondere zur Sicherung einer ordnungsgemäßen Aufgabenwahrnehmung, entzogen werden (BVerfGE 79, 127). Dem Gesetzgeber ist ein Kernbereich der Selbstverwaltung verwehrt, der nicht ausgehöhlt werden darf. Außerhalb dieses Kerns ist die Selbstverwaltung gesetzlich ausgestaltbar, verlangt aber einen Eingriff nur aus Gründen des öffentlichen Wohls unter Wahrung der Verhältnismäßigkeit. Die Planungshoheit ist als Teil der Selbstverwaltung geschützt. Hinzu kommt die Garantie angemessener Finanzausstattung (Art. 28 Abs. 2 S. 3 GG). Gemeinden müssen vor Eingriffen im Rahmen des Gesetzgebungsverfahrens angemessen angehört werden.
  norms:
  - Art. 28 Abs. 2 S. 1 GG
  - Art. 28 Abs. 2 S. 3 GG
  quellen:
  - GG, amtliche Fassung
  - BVerfGE 79, 127
  stand: 2026-10
- slug: or-bl-abgrenzung-verfahrensarten
  type: definition
  front: "Wie grenzt man Bund-Länder-Streit, Organstreit und Kommunalverfassungsbeschwerde ab?"
  back: >-
    Der Organstreit (Art. 93 Abs. 1 Nr. 1 GG) schützt die Rechte oberster Bundesorgane und ihrer Teile im Verhältnis zueinander (horizontale Gewaltenteilung). Der Bund-Länder-Streit (Nr. 3) betrifft die Rechte und Pflichten des Bundes und der Länder untereinander (vertikale Gewaltenteilung); Beteiligte sind ausschließlich die Bundesregierung und die Landesregierungen. Die Kommunalverfassungsbeschwerde (Nr. 4b) dient dem Schutz der kommunalen Selbstverwaltung vor Gesetzen. Die abstrakte Normenkontrolle (Nr. 2) ist objektiv und setzt keine eigene Rechtsverletzung voraus. Die Verfassungsbeschwerde (Nr. 4a) schützt Grundrechte und grundrechtsgleiche Rechte. Alle Verfahren sind mit der einstweiligen Anordnung nach § 32 BVerfGG kombinierbar. In der Klausur ist zuerst zu fragen, wer antragsberechtigt ist und welches Recht er geltend macht.
  norms:
  - Art. 93 Abs. 1 Nr. 1 GG
  - Art. 93 Abs. 1 Nr. 3 GG
  - Art. 93 Abs. 1 Nr. 4b GG
  quellen:
  - GG, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-10
