cards:
- slug: or-va-rm-ermaechtigungsgrundlage-erfordernis
  type: definition
  front: Wann bedarf der Erlass eines Verwaltungsakts einer gesetzlichen Ermächtigungsgrundlage
    (Vorbehalt des Gesetzes)?
  back: Jeder belastende Eingriff in Freiheit oder Eigentum (Eingriffsverwaltung)
    bedarf einer gesetzlichen Ermächtigungsgrundlage. Bei begünstigenden Maßnahmen
    der Leistungsverwaltung ist eine Ermächtigungsgrundlage nur erforderlich, soweit
    die Wesentlichkeitstheorie dies verlangt - etwa bei erheblicher Grundrechtsrelevanz
    der Entscheidung.
  norms:
  - Art. 20 Abs. 3 GG
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: or-va-rm-zustaendigkeit-arten
  type: definition
  front: Welche drei Arten der Zuständigkeit sind im Rahmen der formellen Rechtmäßigkeit
    zu prüfen?
  back: Die sachliche Zuständigkeit (welche Behörde für die Aufgabe zuständig
    ist), die örtliche Zuständigkeit (räumlicher Zuständigkeitsbereich) und die
    instanzielle bzw. funktionelle Zuständigkeit (welche Ebene oder welcher Amtsträger
    innerhalb der Behörde handeln darf).
  norms: []
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: or-va-rm-anhoerungspflicht
  type: norm
  front: Wann ist ein Beteiligter vor Erlass eines belastenden Verwaltungsakts anzuhören,
    § 28 Abs. 1 VwVfG?
  back: Bevor ein Verwaltungsakt erlassen wird, der in Rechte eines Beteiligten eingreift,
    ist ihm Gelegenheit zu geben, sich zu den für die Entscheidung erheblichen Tatsachen
    zu äußern. § 28 Abs. 2 VwVfG regelt Ausnahmen, etwa bei Gefahr im Verzug oder
    in Massenverfahren.
  norms:
  - § 28 Abs. 1 VwVfG
  - § 28 Abs. 2 VwVfG
  quellen:
  - VwVfG, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: or-va-rm-heilung-verfahrensfehler
  type: norm
  front: Welche Verfahrens- und Formfehler können nach § 45 VwVfG geheilt werden,
    und bis wann?
  back: § 45 Abs. 1 VwVfG erlaubt die Heilung bestimmter Fehler - etwa der fehlenden
    Begründung oder der unterbliebenen Anhörung - durch Nachholung der jeweiligen
    Verfahrenshandlung. Nach § 45 Abs. 2 VwVfG ist die Heilung grundsätzlich bis
    zum Abschluss der letzten Tatsacheninstanz eines verwaltungsgerichtlichen Verfahrens
    möglich.
  norms:
  - § 45 Abs. 1 VwVfG
  - § 45 Abs. 2 VwVfG
  quellen:
  - VwVfG, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: or-va-rm-unbeachtlichkeit-verfahrensfehler
  type: streitstand
  front: Wann ist ein Verfahrens- oder Formfehler nach § 46 VwVfG unbeachtlich?
  back: Ein Verfahrens- oder Formfehler, der nicht zur Nichtigkeit führt, ist unbeachtlich,
    wenn offensichtlich ist, dass er die Entscheidung in der Sache nicht beeinflusst
    hat. Bei gebundenen Entscheidungen ist das regelmäßig der Fall; bei Ermessensentscheidungen
    lässt sich die fehlende Kausalität des Fehlers dagegen meist nicht mit der erforderlichen
    Offensichtlichkeit feststellen, sodass § 46 VwVfG hier kaum greift.
  norms:
  - § 46 VwVfG
  quellen:
  - VwVfG, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: or-va-rm-tatbestand-rechtsfolge-unterscheidung
  type: schema_step
  front: Wie ist auf der materiellen Ebene zwischen Tatbestand und Rechtsfolge der
    Ermächtigungsgrundlage zu unterscheiden?
  back: Auf Tatbestandsseite ist zu prüfen, ob die tatbestandlichen Voraussetzungen
    der Norm erfüllt sind - unbestimmte Rechtsbegriffe sind dabei grundsätzlich
    voll gerichtlich überprüfbar, ausnahmsweise besteht ein Beurteilungsspielraum.
    Auf Rechtsfolgenseite ist zu prüfen, ob die Behörde - soweit ihr Ermessen eröffnet
    ist - dieses fehlerfrei ausgeübt hat.
  norms:
  - § 40 VwVfG
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: or-va-rm-aufbauschema-grobstruktur
  type: schema_step
  front: Nenne die vier Grobpunkte der Rechtmäßigkeitsprüfung eines Verwaltungsakts.
  back: (1) Ermächtigungsgrundlage, (2) formelle Rechtmäßigkeit (Zuständigkeit,
    Verfahren, Form), (3) materielle Rechtmäßigkeit (Tatbestand, ggf. Ermessen,
    Rechtsfolge), (4) Ergebnis - mit Differenzierung zwischen bloßer Rechtswidrigkeit
    (aufhebbar) und Nichtigkeit nach § 44 Abs. 1 VwVfG (von Anfang an unwirksam).
  norms:
  - § 44 Abs. 1 VwVfG
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
schemata:
- slug: or-schema-va-rechtmaessigkeitspruefung
  title: Rechtmäßigkeitsprüfung eines Verwaltungsakts (Gutachtenschema)
  norms:
  - § 35 VwVfG
  - § 40 VwVfG
  - § 44 Abs. 1 VwVfG
  quellen:
  - VwVfG, amtliche Fassung
  - Eigenformulierung Redaktion
  steps:
  - label: I. Ermächtigungsgrundlage
    children:
    - label: 1. Anwendbares Verfahrensrecht (Bundes- oder Landes-VwVfG, § 1 VwVfG)
    - label: 2. Wirksame Ermächtigungsgrundlage vorhanden (Vorbehalt des Gesetzes
        bei belastenden VA)
  - label: II. Formelle Rechtmäßigkeit
    children:
    - label: 1. Zuständigkeit (sachlich, örtlich, instanziell)
    - label: 2. Verfahren, insbesondere Anhörung, § 28 VwVfG
    - label: 3. Form
  - label: III. Materielle Rechtmäßigkeit
    children:
    - label: 1. Tatbestand der Ermächtigungsgrundlage erfüllt
    - label: '2. Rechtsfolge: bei Ermessensnorm fehlerfreie Ermessensausübung, §
        40 VwVfG'
  - label: IV. Ergebnis
    children:
    - label: 1. Rechtswidrig, aber nicht nichtig -> aufhebbar
    - label: 2. Nichtig, § 44 Abs. 1 VwVfG -> von Anfang an unwirksam
    - label: 3. Verfahrens-/Formfehler ggf. geheilt (§ 45 VwVfG) oder unbeachtlich
        (§ 46 VwVfG)
faelle:
- slug: or-fall-versaeumter-anhoerungstermin
  title: Der versäumte Anhörungstermin
  difficulty: 4
  minutes: 60
  quellen:
  - Eigener Sachverhalt der Redaktion
  - VwVfG, amtliche Fassung
  facts: Die zuständige Ordnungsbehörde untersagt dem Gewerbetreibenden G durch
    Bescheid den Weiterbetrieb seines Imbissstands wegen wiederholter hygienerechtlicher
    Verstöße, gestützt auf eine einschlägige gewerberechtliche Ermächtigungsgrundlage,
    die der Behörde Ermessen einräumt. Vor Erlass des Bescheids hört die Behörde
    den G nicht an. Im anschließenden Widerspruchsverfahren erhält G ausführlich
    Gelegenheit, sich zu den Vorwürfen zu äußern und Unterlagen vorzulegen; der
    Widerspruchsbescheid hält die Untersagung im Ergebnis aufrecht.
  question: War der Ausgangsbescheid formell rechtmäßig, und wirkt sich ein etwaiger
    Anhörungsmangel auf die Rechtmäßigkeit aus?
  steps:
  - prompt: Lag ein Anhörungsmangel vor?
    erwartung: Ja - § 28 Abs. 1 VwVfG verlangt vor Erlass eines belastenden Verwaltungsakts
      Gelegenheit zur Äußerung; diese fehlte hier vollständig, eine Ausnahme nach
      § 28 Abs. 2 VwVfG ist nicht ersichtlich.
  - prompt: Kann der Mangel geheilt werden?
    erwartung: Ja - nach § 45 Abs. 1, Abs. 2 VwVfG kann die unterbliebene Anhörung
      bis zum Abschluss der letzten Tatsacheninstanz eines verwaltungsgerichtlichen
      Verfahrens nachgeholt werden; die ausführliche Gelegenheit im Widerspruchsverfahren
      erfüllt diese Anforderungen.
  - prompt: Wäre der Mangel hilfsweise nach § 46 VwVfG unbeachtlich?
    erwartung: Nein - da es sich um eine Ermessensentscheidung handelt, lässt sich
      nicht mit der erforderlichen Offensichtlichkeit ausschließen, dass eine vorherige
      Anhörung die Ermessensausübung beeinflusst hätte; § 46 VwVfG greift daher
      nicht, es kommt allein auf die Heilung nach § 45 VwVfG an.
  - prompt: Zu welchem Ergebnis führt das?
    erwartung: Der ursprüngliche Verfahrensfehler wurde durch Nachholung der Anhörung
      im Widerspruchsverfahren geheilt; der Bescheid ist in der Gestalt des Widerspruchsbescheids
      formell rechtmäßig.
  expectation:
    pruefpunkte:
    - id: p1
      label: Anhörungsmangel nach § 28 Abs. 1 VwVfG erkannt, keine Ausnahme ersichtlich
      weight: 2.0
      required: true
      norms:
      - § 28 Abs. 1 VwVfG
      keywords:
      - Anhörung
      - § 28
      card_slugs:
      - or-va-rm-anhoerungspflicht
    - id: p2
      label: Heilungsmöglichkeit nach § 45 Abs. 1, Abs. 2 VwVfG durch Nachholung
        im Widerspruchsverfahren erkannt
      weight: 3.0
      required: true
      norms:
      - § 45 Abs. 1 VwVfG
      - § 45 Abs. 2 VwVfG
      keywords:
      - Heilung
      - § 45
      - Nachholung
      card_slugs:
      - or-va-rm-heilung-verfahrensfehler
    - id: p3
      label: § 46 VwVfG zutreffend als nicht einschlägig erkannt (Ermessensentscheidung,
        fehlende Offensichtlichkeit)
      weight: 2.5
      required: true
      norms:
      - § 46 VwVfG
      keywords:
      - § 46
      - Ermessen
      - Offensichtlichkeit
      card_slugs:
      - or-va-rm-unbeachtlichkeit-verfahrensfehler
    - id: p4
      label: Zuständigkeit und Ermächtigungsgrundlage als unproblematisch benannt
      weight: 1.0
      required: false
      keywords:
      - Ermächtigungsgrundlage
      - zuständig
      card_slugs:
      - or-va-rm-zustaendigkeit-arten
      - or-va-rm-ermaechtigungsgrundlage-erfordernis
    - id: p5
      label: 'Ergebnis: formelle Rechtmäßigkeit in Gestalt des Widerspruchsbescheids
        durch Heilung hergestellt'
      weight: 1.5
