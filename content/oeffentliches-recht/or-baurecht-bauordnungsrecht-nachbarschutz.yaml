faelle:
- slug: or-fall-br-bn-nachbarklage-innenbereich
  title: Die Möbelfabrik im Wohngebiet
  difficulty: 4
  minutes: 70
  quellen:
  - Eigener Sachverhalt der Redaktion
  - BauGB, amtliche Fassung
  - BauNVO, amtliche Fassung
  - VwGO, amtliche Fassung
  facts: >-
    In der Straße X der Stadt S stehen ganz überwiegend Wohnhäuser; vereinzelt gibt es einen Bäcker, eine Arztpraxis und
    eine Gaststätte. Für das Gebiet besteht kein Bebauungsplan; es liegt im Zusammenhang bebauter Ortsteile und entspricht
    seiner Eigenart nach einem allgemeinen Wohngebiet. Bauherr B beantragt die Genehmigung für eine Möbelfabrik mit
    Schreinereimaschinen, Lkw-Anlieferung und Betrieb in zwei Schichten auf einem Grundstück in der Straße X. Die Baugenehmigungsbehörde
    erteilt die Genehmigung, nachdem die Gemeinde ihr Einvernehmen erteilt hat. N, Eigentümer eines Wohnhauses in der
    Straße X, vier Häuser vom Baugrundstück entfernt, hält die Genehmigung für rechtswidrig. Konkrete Lärmmessungen liegen nicht
    vor, nach Angaben der Behörde wird der Immissionsrichtwert eingehalten. Ein Vorverfahren ist im Land nicht vorgesehen. N
    erhebt innerhalb eines Monats nach Bekanntgabe Klage; B beginnt sofort mit dem Bau.
  question: Hat die Klage des N Aussicht auf Erfolg, und wie kann N verhindern, dass B vor der Entscheidung baut?
  steps:
  - prompt: Ist die Klage zulässig?
    erwartung: Verwaltungsrechtsweg nach § 40 Abs. 1 VwGO; statthaft ist die Anfechtungsklage (Nachbarklage gegen die Baugenehmigung, § 42 Abs. 1 Var. 1 VwGO). N ist als Eigentümer eines Grundstücks im selben Baugebiet Nachbar und klagebefugt, weil ihm ein Gebietserhaltungsanspruch möglicherweise zusteht (§ 42 Abs. 2 VwGO). Kein Vorverfahren, die Monatsfrist ist gewahrt. B ist notwendig beizuladen (§ 65 Abs. 2 VwGO).
  - prompt: Nach welchem Maßstab beurteilt sich die Zulässigkeit der Möbelfabrik?
    erwartung: § 34 Abs. 2 BauGB, weil die Umgebung einem allgemeinen Wohngebiet (§ 4 BauNVO) entspricht. Eine Möbelfabrik mit Maschinenbetrieb, Lkw-Verkehr und Zweischichtbetrieb ist ein störender Gewerbebetrieb. Sie ist im allgemeinen Wohngebiet weder allgemein zulässig (§ 4 Abs. 2 BauNVO) noch ausnahmsweise (§ 4 Abs. 3 BauNVO erfasst nur nicht störende Gewerbebetriebe) und damit nach § 34 Abs. 2 BauGB unzulässig. Die Baugenehmigung ist rechtswidrig. Das Einvernehmen der Gemeinde ändert daran nichts.
  - prompt: Ist N dadurch in eigenen Rechten verletzt?
    erwartung: Ja. Die Festsetzungen zur Art der baulichen Nutzung (hier das faktische Baugebiet nach § 34 Abs. 2 BauGB) sind nachbarschützend. Nach dem Gebietserhaltungsanspruch (BVerwGE 94, 151) kann N die gebietswidrige Nutzung abwehren, ohne dass eine konkrete Beeinträchtigung nachgewiesen werden muss. Dass der Lärmrichtwert eingehalten wird, ist daher unerheblich. Die Klage ist begründet (§ 113 Abs. 1 S. 1 VwGO).
  - prompt: Wie kann N den Baubeginn verhindern?
    erwartung: Nach § 212a Abs. 1 BauGB hat seine Klage keine aufschiebende Wirkung. N kann deshalb beim Verwaltungsgericht nach § 80a Abs. 3 i. V. m. § 80 Abs. 5 VwGO die Anordnung der aufschiebenden Wirkung beantragen (zuvor ggf. bei der Behörde nach § 80a Abs. 1 Nr. 2 VwGO). Wegen der offensichtlichen Erfolgsaussichten in der Hauptsache fällt die Interessenabwägung zu seinen Gunsten aus.
