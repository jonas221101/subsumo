- slug: or-schema-br-bn-nachbarklage
  title: Nachbarklage gegen eine Baugenehmigung (Anfechtungsklage)
  norms:
  - § 42 VwGO
  - § 113 Abs. 1 S. 1 VwGO
  quellen:
