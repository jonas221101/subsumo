  steps:
  - label: A. Zulässigkeit
    children:
    - label: I. Verwaltungsrechtsweg, § 40 Abs. 1 VwGO
    - label: II. Statthafte Klageart – Anfechtung der Baugenehmigung, § 42 Abs. 1 Var. 1 VwGO
    - label: III. Klagebefugnis, § 42 Abs. 2 VwGO
      children:
      - label: 1. Nachbarstellung – Eigentümer oder dinglich Berechtigter
      - label: 2. Mögliche Verletzung einer drittschützenden Norm
        hinweis: Gebietserhaltungsanspruch, Rücksichtnahmegebot, Abstandsflächen.
    - label: IV. Vorverfahren, Frist, Verwirkung – §§ 68, 74 VwGO
    - label: V. Beteiligte – Beklagter § 78 Abs. 1 Nr. 1 VwGO, Beiladung des Bauherrn § 65 Abs. 2 VwGO
  - label: B. Begründetheit, § 113 Abs. 1 S. 1 VwGO
    children:
    - label: I. Rechtswidrigkeit der Baugenehmigung (Prüfungsumfang des Verfahrens)
      children:
      - label: 1. Bauplanungsrecht – §§ 30, 34, 35 BauGB, BauNVO
      - label: 2. Bauordnungsrecht – Abstandsflächen und weitere Normen
    - label: II. Verletzung in eigenen Rechten
      children:
      - label: 1. Drittschutz der verletzten Norm (Schutznormtheorie)
      - label: 2. Konkrete Beeinträchtigung nur bei Rücksichtnahmegebot erforderlich
  - label: C. Vorläufiger Rechtsschutz
    hinweis: § 212a BauGB – Antrag nach § 80a Abs. 3 i. V. m. § 80 Abs. 5 VwGO.
