topic:
  slug: or-vwgo-allgemeine-leistungsklage-feststellungsklage
  area: oeffentliches-recht
  title: Allgemeine Leistungsklage und Feststellungsklage, § 43 VwGO
  parent: oeffentliches-recht
  relevance: 4
  stand: 2026-09
  redaktion:
    erzeugt_von: claude-fable-5-1
    status: in-pruefung
    normzitate_geprueft: true
cards:
- slug: or-vwgo-alk-statthaftigkeit
  type: definition
  front: Wann ist die allgemeine Leistungsklage statthaft?
  back: >-
    Die allgemeine Leistungsklage ist statthaft, wenn der Kläger ein Tun,
    Dulden oder Unterlassen der Verwaltung begehrt, das kein Verwaltungsakt
    ist - also schlichtes Verwaltungshandeln oder einen Realakt. Sie ist in der
    VwGO nicht ausdrücklich geregelt, wird aber an mehreren Stellen
    vorausgesetzt (§ 43 Abs. 2 S. 1, § 111, § 113 Abs. 4 VwGO) und ist
    allgemein anerkannt. Typische Anwendungsfälle sind Klagen auf Auszahlung
    bewilligter Gelder, auf Auskunft, auf Widerruf oder Unterlassung
    ehrverletzender Äußerungen von Amtsträgern, auf Folgenbeseitigung sowie
    Klagen des Staates gegen den Bürger, für die kein Verwaltungsakt erlassen
    werden darf. Ihr Spiegelbild ist die Unterlassungsklage gegen drohendes
    schlichtes Verwaltungshandeln.
  norms:
  - § 43 Abs. 2 S. 1 VwGO
  - § 111 VwGO
  - § 113 Abs. 4 VwGO
  quellen:
  - VwGO, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: or-vwgo-alk-abgrenzung-verpflichtungsklage
  type: definition
  front: Wie grenzt man die allgemeine Leistungsklage von der Verpflichtungsklage
    ab?
  back: >-
    Entscheidend ist die Rechtsnatur des begehrten Verwaltungshandelns: Zielt
    das Begehren auf den Erlass eines Verwaltungsakts i.S.d. § 35 VwVfG, ist
    die Verpflichtungsklage nach § 42 Abs. 1 Alt. 2 VwGO statthaft; zielt es
    auf ein sonstiges Handeln (Realakt, Zahlung, Auskunft, Unterlassung), die
    allgemeine Leistungsklage. Die Abgrenzung ist nicht nur begrifflich: Für
    die Verpflichtungsklage gelten Klagebefugnis (§ 42 Abs. 2 VwGO),
    Vorverfahren (§ 68 Abs. 2 VwGO) und Klagefrist (§ 74 Abs. 2 VwGO) kraft
    Gesetzes, bei der allgemeinen Leistungsklage entfallen Vorverfahren und
    Frist; die Klagebefugnis wird nach h.M. analog § 42 Abs. 2 VwGO verlangt,
    um Popularklagen auszuschließen. Ein zweistufiges Verhältnis kann
    entstehen, wenn über ein Begehren zunächst durch Verwaltungsakt zu
    entscheiden ist (z. B. Bewilligung) und erst die Auszahlung schlichtes
    Handeln darstellt.
  norms:
  - § 42 Abs. 1 VwGO
  - § 42 Abs. 2 VwGO
  - § 35 VwVfG
  quellen:
  - VwGO, amtliche Fassung
  - VwVfG, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: or-vwgo-alk-klagebefugnis-analog
  type: streitstand
  front: Ist bei der allgemeinen Leistungsklage eine Klagebefugnis erforderlich?
  back: >-
    § 42 Abs. 2 VwGO gilt seinem Wortlaut nach nur für Anfechtungs- und
    Verpflichtungsklage. Die herrschende Meinung wendet die Vorschrift auf die
    allgemeine Leistungsklage analog an: Die Regelungslücke ist planwidrig,
    weil die VwGO die allgemeine Leistungsklage nur beiläufig erwähnt, und die
    Interessenlage entspricht der Verpflichtungsklage - auch hier soll die
    Popularklage ausgeschlossen werden, da der Verwaltungsrechtsschutz nach
    Art. 19 Abs. 4 GG subjektiv-rechtlich ausgestaltet ist. Der Kläger muss
    daher geltend machen, einen möglichen Anspruch auf das begehrte Handeln zu
    haben. Eine Mindermeinung verzichtet auf die Analogie und prüft die
    Anspruchsberechtigung ausschließlich im Rahmen des allgemeinen
    Rechtsschutzbedürfnisses oder der Begründetheit. Praktische Unterschiede
    ergeben sich selten, da die Möglichkeit eines eigenen Anspruchs in beiden
    Ansätzen geprüft wird.
  norms:
  - § 42 Abs. 2 VwGO
  - Art. 19 Abs. 4 GG
  quellen:
  - VwGO, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: or-vwgo-fk-norm-43-abs1
  type: norm
  front: Was regelt § 43 Abs. 1 VwGO und welche Zulässigkeitsvoraussetzungen
    enthält er?
  back: >-
    Nach § 43 Abs. 1 VwGO kann durch Klage die Feststellung des Bestehens oder
    Nichtbestehens eines Rechtsverhältnisses oder der Nichtigkeit eines
    Verwaltungsakts begehrt werden, wenn der Kläger ein berechtigtes Interesse
    an der baldigen Feststellung hat. Die Norm enthält damit drei
    Zulässigkeitsvoraussetzungen: ein feststellungsfähiges Rechtsverhältnis
    (oder einen nichtigen Verwaltungsakt) als Gegenstand, das berechtigte
    Feststellungsinteresse sowie - über § 43 Abs. 2 S. 1 VwGO - die
    Subsidiarität gegenüber Gestaltungs- und Leistungsklagen. Die
    Nichtigkeitsfeststellungsklage ist nach § 43 Abs. 2 S. 2 VwGO von der
    Subsidiarität ausgenommen.
  norms:
  - § 43 Abs. 1 VwGO
  - § 43 Abs. 2 S. 1 VwGO
  - § 43 Abs. 2 S. 2 VwGO
  quellen:
  - VwGO, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: or-vwgo-fk-rechtsverhaeltnis-begriff
  type: definition
  front: 'Definiere: Rechtsverhältnis i.S.d. § 43 Abs. 1 VwGO'
  back: >-
    Ein Rechtsverhältnis ist die sich aus einem konkreten Sachverhalt aufgrund
    einer öffentlich-rechtlichen Norm ergebende rechtliche Beziehung einer
    Person zu einer anderen Person oder zu einer Sache. Erforderlich ist ein
    hinreichend konkretisierter, überschaubarer Sachverhalt; abstrakte
    Rechtsfragen, bloße Vorfragen oder unselbständige Elemente eines
    Rechtsverhältnisses (etwa die Auslegung eines einzelnen Tatbestandsmerkmals)
    sind nicht feststellungsfähig. Feststellungsfähig sind auch einzelne
    Berechtigungen oder Pflichten aus einem umfassenderen Rechtsverhältnis,
    Drittrechtsverhältnisse (zwischen dem Beklagten und einem Dritten), wenn
    der Kläger davon in eigenen Rechten betroffen ist, sowie künftige
    Rechtsverhältnisse, sofern sie bereits hinreichend konkret absehbar sind.
  norms:
  - § 43 Abs. 1 VwGO
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: or-vwgo-fk-feststellungsinteresse
  type: definition
  front: Welche Anforderungen gelten an das berechtigte Interesse an baldiger
    Feststellung, § 43 Abs. 1 VwGO?
  back: >-
    Das berechtigte Interesse umfasst jedes schutzwürdige Interesse
    rechtlicher, wirtschaftlicher oder ideeller Art; es ist weiter als das
    rechtliche Interesse im Zivilprozess. "Baldig" verlangt, dass die
    Feststellung gegenwärtig geeignet ist, die Rechtsposition des Klägers zu
    verbessern - typischerweise weil Unsicherheit über das Rechtsverhältnis
    besteht und der Kläger sein Verhalten danach ausrichten muss, weil ihm
    Sanktionen drohen (vorbeugender Rechtsschutz) oder weil der Beklagte das
    Recht des Klägers bestreitet. Bei vergangenen Rechtsverhältnissen gelten
    die Fallgruppen der Fortsetzungsfeststellungsklage entsprechend
    (Wiederholungsgefahr, Rehabilitation, Präjudiz, tiefgreifender
    Grundrechtseingriff). Das Interesse muss gegenüber dem Beklagten bestehen
    und im Zeitpunkt der letzten mündlichen Verhandlung vorliegen.
  norms:
  - § 43 Abs. 1 VwGO
  quellen:
  - VwGO, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: or-vwgo-fk-subsidiaritaet-43-abs2
  type: streitstand
  front: Wie weit reicht die Subsidiarität der Feststellungsklage nach § 43 Abs. 2
    S. 1 VwGO?
  back: >-
    Nach § 43 Abs. 2 S. 1 VwGO ist die Feststellungsklage unzulässig, soweit
    der Kläger seine Rechte durch Gestaltungs- oder Leistungsklage verfolgen
    kann oder hätte verfolgen können. Zweck ist es, die besonderen
    Sachurteilsvoraussetzungen dieser Klagen (Vorverfahren, Frist) nicht zu
    umgehen und den effektiveren, vollstreckbaren Rechtsschutz vorzuziehen.
    Umstritten ist die Reichweite bei Klagen gegen Hoheitsträger: Nach der
    herrschenden Rechtsprechung greift die Subsidiarität nicht, wenn der
    Beklagte eine juristische Person des öffentlichen Rechts ist, weil von
    dieser erwartet werden kann, dass sie einem Feststellungsurteil auch ohne
    Vollstreckungsdruck nachkommt (Art. 20 Abs. 3 GG); die Feststellungsklage
    ist dann neben der allgemeinen Leistungsklage zulässig, solange keine
    Umgehung der Anfechtungs- oder Verpflichtungsvoraussetzungen droht. Eine
    Literaturauffassung wendet § 43 Abs. 2 S. 1 VwGO dem Wortlaut entsprechend
    streng an. Unstreitig gilt die Subsidiarität, soweit eine
    Anfechtungs- oder Verpflichtungsklage möglich ist oder war: Deren
    Vorverfahren und Fristen dürfen nicht über § 43 VwGO ausgehebelt werden.
  norms:
  - § 43 Abs. 2 S. 1 VwGO
  - Art. 20 Abs. 3 GG
  quellen:
  - VwGO, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: or-vwgo-fk-nichtigkeitsfeststellungsklage
  type: norm
  front: Was gilt für die Nichtigkeitsfeststellungsklage, § 43 Abs. 1 Alt. 2 VwGO?
  back: >-
    Mit der Nichtigkeitsfeststellungsklage begehrt der Kläger die Feststellung,
    dass ein Verwaltungsakt nichtig ist (§ 44 VwVfG). Da ein nichtiger
    Verwaltungsakt keine Rechtswirkungen entfaltet, könnte man ihn an sich
    ignorieren; wegen des Rechtsscheins besteht aber ein Bedürfnis nach
    verbindlicher Klärung. Die Klage ist nach § 43 Abs. 2 S. 2 VwGO von der
    Subsidiarität ausgenommen; sie steht damit alternativ neben der
    Anfechtungsklage, die gegen einen nichtigen Verwaltungsakt ebenfalls
    zulässig ist. Vorverfahren und Klagefrist gelten für sie nicht, wohl aber
    eine Klagebefugnis analog § 42 Abs. 2 VwGO. Stellt sich in der Begründetheit
    heraus, dass der Verwaltungsakt nur rechtswidrig, nicht nichtig ist, wird
    die Klage abgewiesen - der Kläger sollte daher hilfsweise Anfechtungsklage
    erheben, solange deren Frist läuft.
  norms:
  - § 43 Abs. 1 VwGO
  - § 43 Abs. 2 S. 2 VwGO
  - § 44 VwVfG
  quellen:
  - VwGO, amtliche Fassung
  - VwVfG, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: or-vwgo-alk-fk-begruendetheit
  type: schema_step
  front: Wann sind allgemeine Leistungsklage und Feststellungsklage begründet?
  back: >-
    Die allgemeine Leistungsklage ist begründet, wenn dem Kläger der geltend
    gemachte Anspruch auf das Tun, Dulden oder Unterlassen zusteht - es ist
    also eine Anspruchsgrundlage zu benennen (Gesetz, öffentlich-rechtlicher
    Vertrag, Zusicherung, Folgenbeseitigungsanspruch, öffentlich-rechtlicher
    Unterlassungsanspruch) und deren Voraussetzungen sind zu prüfen; passiv
    legitimiert ist der Rechtsträger, gegen den sich der Anspruch richtet. Die
    Feststellungsklage ist begründet, wenn das behauptete Rechtsverhältnis
    tatsächlich besteht bzw. nicht besteht oder der Verwaltungsakt tatsächlich
    nichtig ist. Das Urteil hat nur feststellende Wirkung und ist nicht
    vollstreckbar; § 113 VwGO ist nicht anwendbar, es gilt § 121 VwGO
    (Rechtskraft).
  norms:
  - § 43 Abs. 1 VwGO
  - § 121 VwGO
  quellen:
  - VwGO, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
