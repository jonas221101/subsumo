  - label: II. Statthaftigkeit, § 43 Abs. 1 VwGO
    children:
    - label: 1. Feststellungsfähiges Rechtsverhältnis (konkret, öffentlich-rechtlich,
        zwischen Kläger und Beklagtem oder Drittrechtsverhältnis mit eigener Betroffenheit)
    - label: 2. Alternativ Nichtigkeit eines Verwaltungsakts, § 43 Abs. 1 Alt. 2
        VwGO
    hinweis: Abgrenzung zur allgemeinen Leistungsklage (Begehren auf konkretes Handeln)
      und zur Verpflichtungsklage (Begehren auf Verwaltungsakt).
  - label: III. Berechtigtes Interesse an baldiger Feststellung
    children:
    - label: 1. Rechtliches, wirtschaftliches oder ideelles Interesse
    - label: 2. Gegenwartsbezug ("baldig") - bei vergangenen Rechtsverhältnissen
        Fallgruppen der Fortsetzungsfeststellungsklage
  - label: IV. Klagebefugnis, § 42 Abs. 2 VwGO analog
    hinweis: Nach h.M. erforderlich, um Popularklagen auszuschließen; bei Drittrechtsverhältnissen
      eigene Betroffenheit darlegen.
  - label: V. Subsidiarität, § 43 Abs. 2 S. 1 VwGO
    children:
    - label: 1. Vorrang von Anfechtungs- und Verpflichtungsklage (stets)
    - label: 2. Vorrang der allgemeinen Leistungsklage - nach h.M. nicht gegenüber
        Hoheitsträgern
    - label: 3. Ausnahme Nichtigkeitsfeststellungsklage, § 43 Abs. 2 S. 2 VwGO
  - label: VI. Beteiligte, § 61 VwGO, richtiger Beklagter (Rechtsträgerprinzip)
    hinweis: Kein Vorverfahren, keine Klagefrist; Grenze ist die Verwirkung.
  - label: VII. Allgemeines Rechtsschutzbedürfnis
faelle:
- slug: or-fall-warnung-buergermeister-verbraucherschutz
  title: Die öffentliche Warnung des Bürgermeisters
  difficulty: 3
  minutes: 50
  quellen:
  - Eigener Sachverhalt der Redaktion
  - VwGO, amtliche Fassung
  - GG, amtliche Fassung
  facts: >-
    A betreibt in der Stadt S ein Fitnessstudio. Nachdem sich mehrere
    Mitglieder über Vertragsklauseln beschwert haben, erklärt der
    Bürgermeister der Stadt S in einer Pressemitteilung auf der städtischen
    Internetseite, das Studio des A arbeite "mit unseriösen Methoden" und
    Bürger sollten dort "keine Verträge mehr abschließen". Eine gesetzliche
    Grundlage für Verbraucherwarnungen durch die Stadt besteht nicht;
    Vertragsklauseln von Fitnessstudios gehören auch nicht zum kommunalen
    Aufgabenkreis der Stadt S. A verzeichnet in den folgenden Wochen einen
    deutlichen Rückgang an Neuverträgen. Er möchte erstens erreichen, dass die
    Pressemitteilung von der Internetseite entfernt wird und dass die Stadt S
    ihre Behauptung nicht wiederholt, und zweitens gerichtlich geklärt wissen,
    dass die Stadt S nicht berechtigt ist, vor seinem Unternehmen zu warnen. Er
    erhebt ohne Vorverfahren Klage vor dem Verwaltungsgericht.
  question: Welche Klagearten sind für die beiden Begehren des A statthaft, und
    haben die Klagen Aussicht auf Erfolg?
  steps:
  - prompt: Ist der Verwaltungsrechtsweg eröffnet, obwohl die Stadt eine Äußerung
      und keinen Bescheid abgegeben hat?
    erwartung: >-
      Ja - maßgeblich ist die Natur des Rechtsverhältnisses, aus dem der
      Anspruch hergeleitet wird. Der Bürgermeister hat als Amtsträger in
      amtlicher Funktion und in Wahrnehmung öffentlicher Aufgaben gesprochen;
      die Äußerung ist dem öffentlichen Recht zuzuordnen. Öffentlich-rechtliche
      Streitigkeit nichtverfassungsrechtlicher Art, § 40 Abs. 1 S. 1 VwGO.
  - prompt: Welche Klageart ist für das Begehren auf Entfernung und Unterlassung
      der Äußerung statthaft?
    erwartung: >-
      Die Pressemitteilung ist ein Realakt, kein Verwaltungsakt - ihr fehlt die
      auf Rechtswirkung gerichtete Regelung. Das Begehren auf Entfernung (Tun)
      und künftiges Unterlassen richtet sich daher auf schlichtes
      Verwaltungshandeln. Statthaft ist die allgemeine Leistungsklage (in Form
      der Folgenbeseitigungs- und Unterlassungsklage), nicht die
      Verpflichtungsklage.
  - prompt: Welche Klageart ist für das Begehren auf Klärung der fehlenden
      Warnbefugnis statthaft, und steht § 43 Abs. 2 S. 1 VwGO entgegen?
    erwartung: >-
      Ob die Stadt S berechtigt ist, vor dem Unternehmen des A zu warnen, ist
      ein konkretes öffentlich-rechtliches Rechtsverhältnis zwischen A und der
      Stadt S; statthaft ist die Feststellungsklage nach § 43 Abs. 1 VwGO. Die
      Subsidiarität nach § 43 Abs. 2 S. 1 VwGO greift nach h.M. nicht, weil
      die Beklagte ein Hoheitsträger ist, von dem die Beachtung eines
      Feststellungsurteils erwartet werden kann, und weil keine Anfechtungs-
      oder Verpflichtungsklage umgangen wird. Das Feststellungsinteresse
      folgt aus der andauernden Unsicherheit und dem drohenden weiteren
      Umsatzrückgang.
  - prompt: Bedarf es einer Klagebefugnis, eines Vorverfahrens oder der Einhaltung
      einer Klagefrist?
    erwartung: >-
      Für beide Klagen ist nach h.M. eine Klagebefugnis analog § 42 Abs. 2
      VwGO erforderlich; A kann als Betroffener der Äußerung eine Verletzung
      in Art. 12 Abs. 1 GG und im allgemeinen Persönlichkeitsrecht seines
      Unternehmens geltend machen. Vorverfahren und Klagefrist gelten für
      allgemeine Leistungs- und Feststellungsklage nicht.
  - prompt: Ist die Leistungsklage begründet?
    erwartung: >-
      Anspruchsgrundlage ist der öffentlich-rechtliche Unterlassungs- und
      Folgenbeseitigungsanspruch, hergeleitet aus den Grundrechten (Art. 12
      Abs. 1 GG) und dem Rechtsstaatsprinzip. Amtliche Warnungen mit
      grundrechtsbeeinträchtigender Wirkung setzen mindestens voraus, dass sich
      die Behörde im Rahmen ihrer Aufgabenzuweisung bewegt, die Tatsachen
      zutreffend und sachlich wiedergibt und verhältnismäßig handelt. Die
      Stadt S handelte außerhalb ihres Aufgabenkreises und wertend ("unseriöse
      Methoden") ohne gesicherte Tatsachengrundlage. Der Eingriff ist
      rechtswidrig, die Beeinträchtigung dauert an; A hat Anspruch auf
      Entfernung und Unterlassung.
  expectation:
