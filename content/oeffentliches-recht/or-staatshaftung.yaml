faelle:
- slug: or-fall-sh-dienstfahrt-unfall
  title: Der Unfall auf der Dienstfahrt
  difficulty: 3
  minutes: 60
  quellen:
  - Eigener Sachverhalt der Redaktion
  - BGB und GG, amtliche Fassung
  - Eigenformulierung Redaktion
  facts: Der Angestellte M des Ordnungsamts der Stadt S fährt mit einem Dienstwagen zu einer
    Gewerbekontrolle, die er im Auftrag der Behörde durchführen soll. Beim Abbiegen übersieht
    er fahrlässig das vorfahrtsberechtigte Auto der G. Bei dem Zusammenstoß entsteht an dem
    Fahrzeug der G ein Sachschaden von 8.000 Euro. Weitere Ersatzmöglichkeiten hat G nicht. Sonderrechte
    nach der StVO nimmt M nicht in Anspruch. Der Unfall wäre bei Beachtung der Vorfahrtsregeln
    vermeidbar gewesen.
  question: Hat G Anspruch auf Ersatz des Schadens gegen die Stadt S oder gegen M? Welches
    Gericht ist zuständig?
  steps:
  - prompt: Handelte M in Ausübung eines öffentlichen Amtes?
    erwartung: Ja. M erfüllte hoheitliche Aufgaben (Gewerbeüberwachung); die Dienstfahrt steht
      in engem äußeren und inneren Zusammenhang mit der Aufgabe. M ist Amtsträger im haftungsrechtlichen
      Sinn, auch als Angestellter.
  - prompt: Verletzte M eine drittbezogene Amtspflicht und handelte er schuldhaft?
    erwartung: Ja. Die Verkehrsvorschriften (Vorfahrt) bestehen auch zum Schutz anderer Verkehrsteilnehmer;
      die Pflicht ist drittgerichtet. Das Übersehen ist fahrlässig (§ 276 BGB).
  - prompt: Steht das Verweisungsprivileg des § 839 Abs. 1 S. 2 BGB entgegen?
    erwartung: Nein. Bei Teilnahme am allgemeinen Straßenverkehr ohne Sonderrechte gilt das
      Verweisungsprivileg nach der Rechtsprechung nicht; im Übrigen hat G keine anderweitige
      Ersatzmöglichkeit gegen einen Dritten.
  - prompt: Wer haftet, und welcher Rechtsweg ist eröffnet?
    erwartung: Anspruchsgegner ist die Stadt S (Haftungsüberleitung, Art. 34 S. 1 GG), nicht
      M persönlich. Zuständig sind die ordentlichen Gerichte, Landgericht (Art. 34 S. 3 GG,
      § 71 Abs. 2 Nr. 2 GVG).
  expectation:
