  - label: II. Anspruchsvoraussetzungen
    children:
    - label: 1. Handeln eines Amtsträgers in Ausübung eines öffentlichen Amtes
      hinweis: Funktionaler Beamtenbegriff; Verwaltungshelfer als Werkzeug.
