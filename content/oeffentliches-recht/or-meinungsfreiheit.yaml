cards:
- slug: or-gr-art5-schutzbereich-meinung
  type: definition
  front: 'Definiere: Meinung i.S.d. Art. 5 Abs. 1 S. 1 GG'
  back: Eine Meinung ist eine durch Elemente der Stellungnahme, des Dafürhaltens
    oder des Meinens geprägte Äußerung im Rahmen einer geistigen Auseinandersetzung.
    Sie ist subjektiv geprägt und nicht auf ihre Richtigkeit hin überprüfbar -
    im Unterschied zur Tatsachenbehauptung.
  norms:
  - Art. 5 Abs. 1 S. 1 GG
  quellen:
  - GG, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: or-gr-art5-abgrenzung-tatsachenbehauptung
  type: definition
  front: Wie grenzt man Meinung von Tatsachenbehauptung ab, und warum ist das relevant?
  back: Tatsachenbehauptungen sind dem Beweis zugänglich (wahr oder falsch); bewusst
    unwahre Tatsachenbehauptungen fällen von vornherein nicht in den Schutzbereich
    des Art. 5 Abs. 1 GG. Bei Äußerungen mit Meinungs- und Tatsachenelementen ist
    für die Einordnung der Gesamtcharakter bzw. der Schwerpunkt der Äußerung maßgeblich.
  norms:
  - Art. 5 Abs. 1 S. 1 GG
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: or-gr-art5-informations-und-medienfreiheiten
  type: norm
  front: Welche Kommunikationsfreiheiten enthält Art. 5 Abs. 1 GG neben der Meinungsäußerungsfreiheit?
  back: Satz 1 gewährt zusätzlich die Informationsfreiheit - das Recht, sich aus
    allgemein zugänglichen Quellen ungehindert zu unterrichten. Satz 2 gewährleistet
    die Pressefreiheit sowie die Freiheit der Berichterstattung durch Rundfunk und
    Film.
  norms:
  - Art. 5 Abs. 1 S. 1 GG
  - Art. 5 Abs. 1 S. 2 GG
  quellen:
  - GG, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: or-gr-art5-zensurverbot
  type: norm
  front: Was verbietet das Zensurverbot des Art. 5 Abs. 1 S. 3 GG, und wie weit reicht
    es?
  back: Nach ganz herrschender Auffassung verbietet Art. 5 Abs. 1 S. 3 GG nur die
    Vorzensur - eine präventive behördliche Kontrolle, bei der die Veröffentlichung
    von einer vorherigen Erlaubnis abhängig gemacht wird. Repressive Maßnahmen nach
    erfolgter Veröffentlichung fällen nicht darunter, müssen sich aber an Art.
    5 Abs. 2 GG messen lassen.
  norms:
  - Art. 5 Abs. 1 S. 3 GG
  - Art. 5 Abs. 2 GG
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: or-gr-art5-schrankentrias
  type: schema_step
  front: Nenne die Schrankentrias des Art. 5 Abs. 2 GG.
  back: Allgemeine Gesetze, gesetzliche Bestimmungen zum Schutz der Jugend und das
    Recht der persönlichen Ehre.
  norms:
  - Art. 5 Abs. 2 GG
  quellen:
  - GG, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: or-gr-art5-allgemeines-gesetz-sonderrechtslehre
  type: definition
  front: 'Definiere: "Allgemeines Gesetz" i.S.d. Art. 5 Abs. 2 GG (Sonderrechtslehre)'
  back: Ein allgemeines Gesetz ist ein Gesetz, das sich nicht gegen die Meinungsfreiheit
    als solche oder gegen eine bestimmte Meinung richtet, sondern dem Schutz eines
    unabhängig vom Inhalt einer Meinung zu schützenden Rechtsguts dient und die
    Meinungsfreiheit diesem Rechtsgüterschutz unterordnet.
  norms:
  - Art. 5 Abs. 2 GG
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: or-gr-art5-wechselwirkungslehre
  type: definition
  front: Was besagt die Wechselwirkungslehre im Rahmen von Art. 5 Abs. 2 GG?
  back: 'Ein allgemeines Gesetz, das die Meinungsfreiheit beschränkt, muss seinerseits
    im Lichte der Bedeutung des beschränkten Grundrechts ausgelegt werden: Die schrankenziehende
    Norm darf die Meinungsfreiheit nicht stärker einschränken, als es der von ihr
    bezweckte Rechtsgüterschutz erfordert.'
  norms:
  - Art. 5 Abs. 2 GG
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: or-gr-art5-schmaehkritik
  type: streitstand
  front: Welche Folge hat die Einordnung einer Äußerung als Schmähkritik für die
    Abwägung mit der persönlichen Ehre?
  back: Schmähkritik liegt nur ausnahmsweise vor, wenn eine Äußerung nicht mehr
    der Auseinandersetzung in der Sache dient, sondern ausschließlich der Diffamierung
    der Person. In diesem engen Ausnahmefall tritt die Meinungsfreiheit ohne weitere
    Einzelfallabwägung zurück - deshalb ist der Begriff nach der Rechtsprechung
    eng auszulegen.
  norms:
  - Art. 5 Abs. 2 GG
  - Art. 1 Abs. 1 GG
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
schemata:
- slug: or-schema-art5-meinungsfreiheit
  title: Prüfung eines Eingriffs in Art. 5 Abs. 1 S. 1 GG
  norms:
  - Art. 5 Abs. 1 S. 1 GG
  - Art. 5 Abs. 2 GG
  quellen:
  - GG, amtliche Fassung
  - Eigenformulierung Redaktion
  steps:
  - label: I. Schutzbereich
    children:
    - label: '1. Persönlich: jedermann (Jedermann-Grundrecht)'
    - label: '2. Sachlich: Meinung (wertende Stellungnahme) - Abgrenzung zur Tatsachenbehauptung'
  - label: II. Eingriff
  - label: III. Verfassungsrechtliche Rechtfertigung
    children:
    - label: '1. Schranke: Schrankentrias des Art. 5 Abs. 2 GG'
      children:
      - label: 'a) Bei allgemeinem Gesetz: Prüfung nach der Sonderrechtslehre'
    - label: 2. Schranken-Schranken
      children:
      - label: a) Wechselwirkungslehre
      - label: b) Abwägung im Einzelfall, außer bei Schmähkritik (dann kein Abwägungserfordernis)
  - label: IV. Ergebnis
faelle:
- slug: or-fall-satireplakat
  title: Das Satireplakat
  difficulty: 4
  minutes: 75
  quellen:
  - Eigener Sachverhalt der Redaktion
  - GG, amtliche Fassung
  facts: 'Anlässlich des Jahrestags einer umstrittenen kommunalen Bauentscheidung
    hängt der Künstler K an einer von der Stadt genehmigten Plakatwand ein selbst
    gestaltetes Plakat auf. Es zeigt eine karikaturistische Darstellung des fiktiven
    Baudezernenten D mit dem Text "Baudezernent D: Ihre Inkompetenz betoniert unsere
    Stadt!". Die zuständige Ordnungsbehörde ordnet die sofortige Entfernung des
    Plakats an und stützt dies auf eine ortsrechtliche Vorschrift, die ehrverletzende
    Darstellungen von Amtsträgern im öffentlichen Straßenraum untersagt. K hält
    die Entfernungsanordnung für einen unverhältnismäßigen Eingriff in seine Meinungsfreiheit.'
  question: Verletzt die Entfernungsanordnung den K in seinem Grundrecht aus Art.
    5 Abs. 1 S. 1 GG?
  steps:
  - prompt: Ist der Schutzbereich der Meinungsfreiheit eröffnet?
    erwartung: Ja - Karikatur und Text sind wertende, meinungsbildende Äußerungen,
      die nicht dem Wahrheitsbeweis zugänglich sind, keine Tatsachenbehauptung.
  - prompt: Liegt ein Eingriff vor?
    erwartung: Ja - die Entfernungsanordnung als belastender Verwaltungsakt unterbindet
      die weitere Verbreitung der Meinung.
  - prompt: Ist die ortsrechtliche Vorschrift ein "allgemeines Gesetz" i.S.d. Art.
      5 Abs. 2 GG?
    erwartung: Nach der Sonderrechtslehre zu prüfen, ob die Vorschrift die Ehre aller
      Amtsträger unabhängig vom Inhalt der jeweiligen Kritik schützt (dann allgemeines
      Gesetz) oder sich meinungsspezifisch gegen Kritik an Amtsträgern richtet (dann
      kein allgemeines Gesetz); hier schützt sie das Rechtsgut Ehre unabhängig von
      der konkreten Meinung, sodass ein allgemeines Gesetz vorliegt.
  - prompt: Liegt Schmähkritik vor, die eine Abwägung entbehrlich macht?
    erwartung: Nein - die Karikatur nimmt erkennbar auf die konkrete Bausache Bezug
      und dient der Auseinandersetzung in der Sache, nicht ausschließlich der Diffamierung
      der Person D.
  - prompt: Wie fällt die Abwägung im Einzelfall aus?
    erwartung: 'Zugunsten des K: kommunalpolitische Kritik an einem Amtsträger in
      dessen amtlicher Funktion genießt besonderes Gewicht; eine überspitzte, polemische
      Formulierung ist von der Meinungsfreiheit gedeckt, solange sie - wie hier -
      nicht in Schmähkritik umschlägt.'
  expectation:
    pruefpunkte:
    - id: p1
      label: Schutzbereich der Meinungsfreiheit bejaht (wertende Äußerung, keine
