      - bloßes Objekt
      - Subjektqualität
      - Verrechnung von Menschenleben
      - Instrumentalisierung
      card_slugs:
      - or-gr-wl-menschenwuerde-objektformel
      - or-gr-wl-luftsicherheitsgesetz
    - id: p3
      label: Keine Rechtfertigung durch Schutzpflicht, Abwägungsfestigkeit der Würde
      weight: 3.0
      required: true
      keywords:
      - abwägungsfest
