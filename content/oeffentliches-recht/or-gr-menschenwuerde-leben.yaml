topic:
  slug: or-gr-menschenwuerde-leben
  area: oeffentliches-recht
  title: 'Art. 1 Abs. 1, Art. 2 Abs. 2, Art. 104 GG: Menschenwürde, Leben, körperliche Unversehrtheit, Freiheit der Person'
  parent: or-grundrechte
  relevance: 5
  stand: 2026-10
  redaktion:
    erzeugt_von: claude-sonnet (Pflichtstoff-Vervollständigung)
    status: in-pruefung
    normzitate_geprueft: false
cards:
- slug: or-gr-wl-menschenwuerde-objektformel
  type: definition
  front: "Was schützt Art. 1 Abs. 1 GG, und wie wird die Verletzung der Menschenwürde festgestellt (Objektformel)?"
  back: >-
    Art. 1 Abs. 1 GG verpflichtet alle staatliche Gewalt, die Würde des Menschen
    zu achten und zu schützen. Nach h. M. und BVerfG ist die Menschenwürde ein
    subjektives Grundrecht, nicht nur ein objektives Verfassungsprinzip. Sie
    steht jedem Menschen zu und ist nicht an Eigenschaften oder Leistungen
    geknüpft. Ob sie verletzt ist, bestimmt das BVerfG anhand der Objektformel
    (Dürig): Die Menschenwürde ist betroffen, wenn der konkrete Mensch zum
    bloßen Objekt, zu einem bloßen Mittel, zur vertretbaren Größe herabgewürdigt
    wird. Das BVerfG ergänzt diese Formel, weil sie allein zu unbestimmt ist, um
    die Fallgruppen: Es muss eine Behandlung vorliegen, die die Subjektqualität
    des Menschen prinzipiell in Frage stellt und Ausdruck der Verachtung des
    Wertes ist, der dem Menschen kraft seines Personseins zukommt (Abhörurteil,
    BVerfGE 30, 1). Typische Fälle sind Folter, Sklaverei, Entwürdigung durch
    erniedrigende Strafen und die Verweigerung des Existenzminimums.
  norms:
  - Art. 1 Abs. 1 GG
  quellen:
  - GG, amtliche Fassung
  - BVerfGE 30, 1 (Abhörurteil)
- slug: or-gr-wl-menschenwuerde-abwaegungsfest
  type: streitstand
  front: "Ist die Menschenwürde abwägungsfest? Wie wird der Eingriff bestimmt?"
  back: >-
    Art. 1 Abs. 1 GG enthält keinen Schrankenvorbehalt und gilt nach der
    Rechtsprechung absolut: Eine Abwägung mit anderen Verfassungsgütern findet
    nicht statt, jeder Eingriff ist zugleich Verletzung. Dogmatisch wird dem
    durch einen engen Schutzbereich Rechnung getragen. Nach dem BVerfG und der
    h. M. entscheidet über die Annahme eines Eingriffs die Frage, ob nach den
    Umständen eine Behandlung vorliegt, die die Subjektqualität des Menschen
    grundsätzlich in Frage stellt. Dabei fließen Wertungen ein, die der Sache nach
    eine Abwägung enthalten, was Kritiker als Verschleierung bemängeln (Lehre
    vom relativen Würdeschutz: Der Schutzbereich sei weit, eine Abwägung also
    doch möglich). Die h. M. hält aus Gründen der Rechtssicherheit an der
    Absolutheit fest. Nicht abwägungsfähig ist auch die Verrechnung von
    Menschenleben mit dem Ziel, die Rettung vieler durch Opferung weniger zu
    erreichen. Die Würde bleibt auch dem Straftäter erhalten.
  norms:
  - Art. 1 Abs. 1 GG
  - Art. 79 Abs. 3 GG
  quellen:
  - GG, amtliche Fassung
  - BVerfGE 109, 279
- slug: or-gr-wl-luftsicherheitsgesetz
  type: rechtsprechung
  front: "Warum erklärte das BVerfG die Abschussermächtigung im Luftsicherheitsgesetz für nichtig?"
  back: >-
    In der Entscheidung zu § 14 Abs. 3 LuftSiG (BVerfGE 115, 118, 2006)
    erklärte das BVerfG die Ermächtigung zum Abschuss eines entführten
    Passagierflugzeugs, mit dem ein Anschlag auf Menschenleben drohte, für
    nichtig. Formell fehlte dem Bund die Gesetzgebungskompetenz für den
    Streitkräfteeinsatz mit spezifisch militärischen Waffen im Inneren. Materiell
    verstoße die Regelung gegen Art. 2 Abs. 2 S. 1 i. V. m. Art. 1 Abs. 1 GG,
    soweit der Abschuss Unbeteiligte an Bord treffe. Diese würden zum bloßen
    Objekt staatlichen Handelns gemacht und zur Rettung anderer instrumentalisiert;
    ihr Leben werde nach Zahl verrechnet. Das Lebensrecht der Unbeteiligten
    steht nicht zur Disposition des Staates, auch nicht wegen der Schutzpflicht
    gegenüber den Menschen am Boden, denn diese rechtfertigt keinen Eingriff in
    die Menschenwürde.
  norms:
  - Art. 1 Abs. 1 GG
  - Art. 2 Abs. 2 S. 1 GG
  - Art. 35 Abs. 2, 3 GG
  quellen:
  - BVerfGE 115, 118 (Luftsicherheitsgesetz)
- slug: or-gr-wl-leben-schutzbereich-eingriff
  type: definition
  front: "Wie weit reichen das Recht auf Leben und das Recht auf körperliche Unversehrtheit (Art. 2 Abs. 2 S. 1 GG)?"
  back: >-
    Das Recht auf Leben schützt das biologisch-physische Dasein ab Entstehung des
    menschlichen Lebens; nach der Rechtsprechung des BVerfG besteht der Schutz
    jedenfalls ab der Nidation (den frühesten Zeitpunkt hat das Gericht offen
    gelassen), nach teilweise vertretener Ansicht schon mit der Verschmelzung von
    Ei- und Samenzelle. Er endet mit dem Tod (nach h. M. Hirntod). Das Grundrecht begründet keine Pflicht zu leben; das selbstbestimmte Sterben ist als Teil des allgemeinen Persönlichkeitsrechts geschützt (BVerfG 2020 zur geschäftsmäßigen Sterbehilfe). Das Recht auf körperliche Unversehrtheit erfasst die
    Gesundheit im biologisch-physiologischen Sinn und, soweit
    mit Schmerzen oder körperlichen Folgen verbunden, auch seelische
    Beeinträchtigungen. Eingriffe sind etwa die Tötung, Zwangsbehandlung,
    Blutentnahme, Impfpflicht, aber auch Immissionen mit Gesundheitsgefahren.
    Eine Einwilligung schließt den Eingriff aus (z. B. bei der ärztlichen
    Behandlung). Schranke ist der einfache Gesetzesvorbehalt des Art. 2 Abs. 2
    S. 3 GG.
  norms:
  - Art. 2 Abs. 2 S. 1 GG
  - Art. 2 Abs. 2 S. 3 GG
  quellen:
  - GG, amtliche Fassung
  - BVerfGE 39, 1
  - BVerfGE 153, 182 (Sterbehilfe)
- slug: or-gr-wl-klimabeschluss-schutzpflicht
  type: rechtsprechung
  front: "Was hat das BVerfG im Klimabeschluss zu Schutzpflicht und intertemporaler Freiheitssicherung entschieden?"
  back: >-
    Im Klimabeschluss (BVerfGE 157, 30, März 2021) hat das BVerfG zunächst
    festgehalten, dass Art. 2 Abs. 2 S. 1 GG eine Schutzpflicht des Staates auch
    gegenüber Gefahren des Klimawandels begründet, die Teil der Verpflichtung aus
    Art. 20a GG ist, die natürlichen Lebensgrundlagen zu schützen. Eine Verletzung
    dieser Schutzpflicht (Untermaßverbot) sah es aber nicht. Erfolg hatte die
    Verfassungsbeschwerde im Übrigen: Die Regelungen des Klimaschutzgesetzes über
    die zulässigen Emissionsmengen bis 2030 verschieben hohe Minderungslasten
    unumkehrbar auf Zeiträume nach 2030 und greifen damit
    in grundrechtlich geschützte Freiheit der Beschwerdeführer ein
    (eingriffsähnliche Vorwirkung, intertemporale Freiheitssicherung). Das
    CO2-Budget ist nach dem Gericht eine knappe Ressource, die nicht einseitig
    zulasten künftiger Generationen verbraucht werden darf; der Gesetzgeber musste
    Reduktionsziele für die Zeit nach 2030 selbst regeln. Art. 20a GG ist
    justiziabel, begründet aber keinen Vorrang vor anderen Belangen.
  norms:
  - Art. 2 Abs. 2 S. 1 GG
  - Art. 20a GG
  quellen:
  - BVerfGE 157, 30 (Klimabeschluss)
- slug: or-gr-wl-ungeborenes-leben-schutzkonzept
  type: rechtsprechung
  front: "Welche Vorgaben macht das BVerfG für den Schutz des ungeborenen Lebens?"
  back: >-
    Nach BVerfGE 39, 1 und 88, 203 erstreckt sich der Schutz des Art. 2 Abs. 2 S.
    1 GG i. V. m. Art. 1 Abs. 1 GG auch auf das ungeborene Leben. Der Staat ist
    verpflichtet, dieses auch gegenüber der Mutter zu schützen. Der Schwangerschaftsabbruch ist grundsätzlich als Unrecht anzusehen, der Gesetzgeber darf
    aber ein Beratungskonzept wählen: Ein Abbruch nach Beratung darf
    straflos bleiben, darf aber nicht für gerechtfertigt erklärt werden; der
    Staat billigt die Abtreibung nicht. Dem
    Untermaßverbot genügt der Schutz, wenn er angemessen und wirksam ist. Die
    Verfassung verlangt nicht in jedem Fall den Einsatz des Strafrechts, aber ein
    Mindestmaß an Schutz, das sich am Rechtsgut orientiert und
    die Belange der Frau (Art. 2 Abs. 1, Art. 1 Abs. 1 GG) angemessen
    berücksichtigt. Die konkrete Ausgestaltung (§§ 218 ff. StGB) bleibt Sache
    des Gesetzgebers im Rahmen seines Einschätzungsspielraums.
  norms:
  - Art. 2 Abs. 2 S. 1 GG
  - Art. 1 Abs. 1 GG
  - § 218a StGB
  quellen:
  - BVerfGE 39, 1
  - BVerfGE 88, 203
- slug: or-gr-wl-freiheit-der-person-entziehung-beschraenkung
  type: definition
  front: "Was schützt die Freiheit der Person (Art. 2 Abs. 2 S. 2, Art. 104 GG)? Freiheitsentziehung oder -beschränkung?"
  back: >-
    Art. 2 Abs. 2 S. 2 GG schützt die körperliche Bewegungsfreiheit, also das
    Recht, einen Ort aufzusuchen oder zu verlassen, soweit er tatsächlich und
    rechtlich zugänglich ist. Art. 104 GG konkretisiert die Schranken-Schranken.
    Zu unterscheiden sind zwei Eingriffsstufen. Freiheitsbeschränkung ist die
    Einschränkung der Bewegungsfreiheit in einzelne Richtungen, etwa Platzverweis
    oder Aufenthaltsverbot; hier genügt nach Art. 104 Abs. 1 S. 1 GG
    ein förmliches Gesetz. Freiheitsentziehung ist die Aufhebung der Bewegungsfreiheit
    nach allen Seiten gegen den Willen des Betroffenen, etwa Untersuchungshaft,
    Gewahrsam oder Unterbringung. Sie ist zusätzlich nur auf Grundlage einer
    richterlichen Entscheidung zulässig, Art. 104 Abs. 2 GG. Die Abgrenzung richtet sich nach Intensität und Dauer der Maßnahme.
  norms:
  - Art. 2 Abs. 2 S. 2 GG
  - Art. 104 Abs. 1 GG
  - Art. 104 Abs. 2 GG
  quellen:
  - GG, amtliche Fassung
  - Eigenformulierung Redaktion
- slug: or-gr-wl-art104-richtervorbehalt-fristen
  type: norm
  front: "Welche Verfahrensgarantien enthält Art. 104 GG bei Freiheitsentziehungen?"
  back: >-
    Art. 104 Abs. 1 S. 1 GG verlangt für jede Beschränkung der Freiheit der
    Person ein förmliches Gesetz und die Beachtung der darin vorgeschriebenen
    Formen. Festgehaltene Personen dürfen nach Satz 2 weder seelisch noch körperlich
    misshandelt werden; das Verbot ist absolut. Über die Zulässigkeit und die
    Fortdauer einer Freiheitsentziehung hat nach Abs. 2 S. 1 allein der Richter zu
    entscheiden. Bei einer Freiheitsentziehung ohne richterliche Anordnung ist
    unverzüglich eine richterliche Entscheidung herbeizuführen (Abs. 2 S. 2).
    Die Polizei darf aus eigener Machtvollkommenheit niemanden länger als bis zum
    Ende des Tages nach dem Ergreifen in eigenem Gewahrsam halten (Abs. 2 S. 3).
    Für den vorläufig Festgenommenen wegen des Verdachts einer strafbaren
    Handlung gilt Abs. 3 mit der Frist bis zum Ablauf des Tages nach der
    Festnahme. Von jeder richterlichen Entscheidung über Anordnung oder Fortdauer
    ist nach Abs. 4 ein Angehöriger oder eine Vertrauensperson zu unterrichten.
  norms:
  - Art. 104 Abs. 1 GG
  - Art. 104 Abs. 2 GG
  - Art. 104 Abs. 3 GG
  - Art. 104 Abs. 4 GG
  quellen:
  - GG, amtliche Fassung
- slug: or-gr-wl-folter-verbot-rettungsfolter
  type: streitstand
  front: "Ist Folter zur Rettung eines Menschenlebens zulässig (Rettungsfolter)?"
  back: >-
    Nach ganz h. M. ist auch die Androhung oder Anwendung von Folter zur
    Rettung von Menschenleben unzulässig. Das Folterverbot folgt aus Art. 1
    Abs. 1 GG und für Festgehaltene zusätzlich aus Art. 104 Abs. 1 S. 2 GG; es
    gilt absolut, weil der Betroffene zum bloßen Objekt der Informationsgewinnung
    gemacht wird. Auch Art. 3 EMRK und Art. 4 GRCh enthalten ein notstandsfestes
    Verbot. Eine Abwägung zwischen der Würde des Verdächtigen und dem Leben des
    Entführten findet nicht statt. Eine Mindermeinung will in Extremfällen eine
    Ausnahme zulassen: Der Schutzbereich der Würde des Täters sei beschränkt, weil
    er die Gefahr selbst verursacht habe, oder die Schutzpflicht für das Opfer
    verdränge die Würde des Täters. Dem wird entgegengehalten, dass das den
    Absolutheitsanspruch des Art. 1 Abs. 1 GG aufgäbe und niemand auf die
    Verfassung vertrauen könnte, wenn die Würde unter Abwägungsvorbehalt stünde.
    Strafrechtlich bleibt § 34 StGB für den Folternden umstritten.
  norms:
  - Art. 1 Abs. 1 GG
  - Art. 104 Abs. 1 S. 2 GG
  - Art. 3 EMRK
  quellen:
  - GG, amtliche Fassung
  - Eigenformulierung Redaktion
- slug: or-gr-wl-gesetzesvorbehalt-art2-abs2-s3
  type: norm
  front: "Welche Schranken gelten für Art. 2 Abs. 2 GG, und welche Anforderungen stellt die Verhältnismäßigkeit?"
  back: >-
    Nach Art. 2 Abs. 2 S. 3 GG darf in die Rechte aus Satz 1 und 2 nur aufgrund
    eines Gesetzes eingegriffen werden (einfacher Gesetzesvorbehalt). Dieses
    Gesetz muss formell und materiell verfassungsgemäß sein, insbesondere bestimmt
    und verhältnismäßig. Bei Eingriffen in das Leben ist die Anforderung nach dem
    BVerfG besonders streng: Ein Eingriff in das Lebensrecht kommt nur zum Schutz gleichrangiger Rechtsgüter und nur als letztes Mittel in Betracht; die Todesstrafe ist nach Art. 102 GG abgeschafft. Der gezielte Rettungsschuss ist nach den Polizeigesetzen nur als letztes Mittel zur Abwehr einer gegenwärtigen Lebensgefahr oder schwerwiegenden Gefahr für die körperliche Unversehrtheit zulässig. Für
    Eingriffe in die Freiheit der Person ergänzt Art. 104 GG die
    Schranken-Schranken. Wesentliche Entscheidungen wie Impf- und
    Behandlungspflichten muss der Gesetzgeber selbst treffen.
  norms:
  - Art. 2 Abs. 2 S. 3 GG
  - Art. 19 Abs. 2 GG
  - Art. 102 GG
  quellen:
  - GG, amtliche Fassung
  - Eigenformulierung Redaktion
schemata:
- slug: or-schema-gr-wl-art2-abs2-lebensrecht
  title: Prüfung eines Eingriffs in Art. 2 Abs. 2 S. 1 GG und Art. 1 Abs. 1 GG
  norms:
  - Art. 2 Abs. 2 S. 1 GG
  - Art. 1 Abs. 1 GG
  - Art. 2 Abs. 2 S. 3 GG
  quellen:
  - GG, amtliche Fassung
  - Eigenformulierung Redaktion
  steps:
  - label: I. Schutzbereich
    children:
    - label: 1. Persönlich (Jedermannrecht, auch ungeborenes Leben)
    - label: 2. Sachlich (Leben, körperliche Unversehrtheit)
  - label: II. Eingriff
    hinweis: Auch Gefährdungen und Schutzpflichtverletzungen sind zu prüfen. Wer
      Menschen zum bloßen Objekt macht (Objektformel), greift zugleich in Art. 1
      Abs. 1 GG ein.
  - label: III. Rechtfertigung
    children:
    - label: 1. Gesetzesvorbehalt (Art. 2 Abs. 2 S. 3 GG)
    - label: 2. Formelle Verfassungsmäßigkeit (insb. Gesetzgebungskompetenz)
    - label: 3. Materielle Verfassungsmäßigkeit
      children:
      - label: a) Bestimmtheit, Wesentlichkeit
      - label: b) Verhältnismäßigkeit (bei Leben besonders strenger Maßstab)
      - label: c) Menschenwürdekern (Art. 1 Abs. 1 GG) - keine Abwägung
        hinweis: Verrechnung von Menschenleben ist unzulässig.
  - label: IV. Ergebnis
faelle:
- slug: or-fall-gr-wl-abschussermaechtigung
  title: Die Abschussermächtigung für entführte Flugzeuge
  difficulty: 4
  minutes: 50
  quellen:
  - Eigener Sachverhalt der Redaktion
  - GG, amtliche Fassung
  facts: >-
    Der Bundesgesetzgeber erlässt (fiktiv) ein Gesetz, das der Bundeswehr
    erlaubt, ein von Terroristen entführtes, vollbesetztes Passagierflugzeug
    abzuschießen, wenn sonst mit Sicherheit der Absturz auf ein dicht
    besiedeltes Wohngebiet droht und der Abschuss das einzige Mittel zur Abwehr
    ist. Die Passagierin P, die regelmäßig fliegt, erhebt Verfassungsbeschwerde
    gegen das Gesetz mit der Begründung, im Ernstfall sei sie an Bord
    unmittelbar betroffen. Die Verfassungsbeschwerde ist zulässig; Kompetenz- und Verfahrensfragen sind nicht zu prüfen. Die Bundesregierung
    verweist darauf, dass der Staat das Leben der vielen Menschen am Boden
    schützen müsse.
  question: Verletzt das Gesetz die Passagierin P in ihren Grundrechten?
  steps:
  - prompt: Ist das Gesetz ein Eingriff in Art. 2 Abs. 2 S. 1 GG?
    erwartung: Ja. Die Ermächtigung zum Abschuss erlaubt die vorsätzliche Tötung
      der Menschen an Bord und greift damit in das Recht auf Leben ein. Das
      Gesetz selbst wirkt für P bereits belastend, weil sie als regelmäßige
      Fluggästin betroffen sein kann.
  - prompt: Verstößt der Eingriff gegen Art. 1 Abs. 1 GG?
    erwartung: Ja. Die unbeteiligten Passagiere werden vom Staat zum bloßen
      Objekt gemacht, ihr Leben wird nach Zahl verrechnet und zur Rettung anderer
      eingesetzt. Dies verletzt die Subjektqualität und die Menschenwürde.
  - prompt: Rechtfertigt die Schutzpflicht für die Menschen am Boden den Eingriff?
    erwartung: Nein. Die Schutzpflicht gegenüber den Menschen am Boden reicht nicht
      so weit, dass sie einen Eingriff in die unantastbare Würde der Passagiere
      rechtfertigt. Eine Abwägung zwischen Leben und Leben findet wegen der
      Absolutheit des Art. 1 Abs. 1 GG nicht statt. Das Gesetz ist verfassungswidrig
      und nichtig.
  expectation:
    pruefpunkte:
    - id: p1
      label: Eingriff in das Lebensrecht Art. 2 Abs. 2 S. 1 GG festgestellt
      weight: 1.5
      required: true
      norms:
      - Art. 2 Abs. 2 S. 1 GG
      keywords:
      - Recht auf Leben
      - Tötung der Passagiere
      - Eingriff in das Leben
      - Art. 2 Abs. 2 S. 1 GG
      card_slugs:
      - or-gr-wl-leben-schutzbereich-eingriff
    - id: p2
      label: Menschenwürdeverstoß über die Objektformel begründet
      weight: 3.0
      required: true
      norms:
      - Art. 1 Abs. 1 GG
