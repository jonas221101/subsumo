cards:
- slug: or-gr-rel-einheitliches-grundrecht
  type: definition
  front: "Was schützt Art. 4 Abs. 1 und 2 GG, und warum spricht man von einem einheitlichen Grundrecht?"
  back: >-
    Art. 4 Abs. 1 und 2 GG gewährleisten die Freiheit des Glaubens, des
    Gewissens und des religiösen und weltanschaulichen Bekenntnisses sowie die
    ungestörte Religionsausübung. Nach dem BVerfG handelt es sich nicht um mehrere
    selbstständige Grundrechte, sondern um ein einheitliches Grundrecht der
    Glaubens- und Bekenntnisfreiheit mit einem weiten Schutzbereich. Er umfasst
    die innere Freiheit (forum internum), einen Glauben zu bilden und zu haben,
    und die äußere Freiheit (forum externum), den Glauben zu bekennen, zu
    verbreiten und sein Verhalten daran auszurichten, einschließlich der negativen
    Religionsfreiheit, keinen Glauben zu haben oder zu bekennen. Geschützt sind
    Einzelne wie Religionsgemeinschaften und Weltanschauungsgemeinschaften, auch
    juristische Personen (Art. 19 Abs. 3 GG). Es ist ein Jedermannrecht. Praktisch
    entscheidet daher die Reichweite der Schranken, nicht die Frage, ob ein
    bestimmtes Verhalten unter Glaube oder Gewissen fällt.
  norms:
  - Art. 4 Abs. 1 GG
  - Art. 4 Abs. 2 GG
  quellen:
  - GG, amtliche Fassung
  - BVerfGE 24, 236 (Aktion Rumpelkammer)
- slug: or-gr-rel-schutzbereich-religionsbegriff
  type: definition
  front: "Wie weit reicht der Schutzbereich der Religionsfreiheit, und wer bestimmt, was religiös ist?"
  back: >-
    Glaube im Sinne von Art. 4 GG ist die Überzeugung von der Stellung des
    Menschen in der Welt und seinem Bezug zu einem transzendenten Bezugspunkt
    (Religion) oder zu einer umfassenden Sinndeutung ohne Transzendenz
    (Weltanschauung). Staatliche Stellen dürfen den Glauben nicht inhaltlich
    bewerten (Neutralitätsgebot); ob ein Verhalten Ausdruck des Glaubens ist, richtet
    sich daher maßgeblich nach dem Selbstverständnis der Betroffenen. Es muss aber
    plausibel dargelegt werden, dass das Verhalten nach der Überzeugung des
    Betroffenen eine verbindliche Glaubensregel ist. Die Grenze liegt dort, wo sich die
    Religion nur als Vorwand für andere Zwecke darstellt, etwa rein
    kommerzielle Betätigung. Geschützt ist nicht nur das Gebet, sondern auch die
    glaubensgeleitete Lebensführung, etwa Kleidung wie ein Kopftuch, Speise-
    und Schlachtvorschriften (Schächten, BVerfGE 104, 337) und die Missionierung.
  norms:
  - Art. 4 Abs. 1 GG
  - Art. 4 Abs. 2 GG
  quellen:
  - BVerfGE 104, 337 (Schächten)
  - BVerfGE 108, 282 (Kopftuch)
- slug: or-gr-rel-vorbehaltlos-schranken
  type: streitstand
  front: "Welchen Schranken unterliegt Art. 4 GG, obwohl er vorbehaltlos gewährleistet ist?"
  back: >-
    Art. 4 Abs. 1 und 2 GG enthalten keinen ausdrücklichen Gesetzesvorbehalt.
    Streitig ist, ob die über Art. 140 GG geltenden Normen der WRV Schranken
    liefern. Eine ältere Auffassung wollte den Vorbehalt der allgemeinen Gesetze
    heranziehen, der in Art. 136 Abs. 1 WRV angelegt ist, weil bürgerliche Pflichten
    vom Bekenntnis unabhängig seien. Das BVerfG und die h. M. lehnen das ab: Art. 4
    GG ist ein vorbehaltloses Grundrecht, das durch Art. 136 WRV nicht eingeschränkt
    wird, weil sonst die starke Gewährleistung entwertet würde (BVerfGE 33, 23).
    Eingeschränkt werden kann das Grundrecht daher nur durch kollidierendes
    Verfassungsrecht, also Grundrechte Dritter und Rechtsgüter mit Verfassungsrang
    wie die Funktionsfähigkeit der Rechtspflege oder den staatlichen
    Erziehungsauftrag. Für den Eingriff ist zudem eine gesetzliche Grundlage
    erforderlich (Wesentlichkeit). Der Konflikt wird im Wege der praktischen
    Konkordanz gelöst; beide Rechtsgüter sind so zu optimieren, dass beide
    möglichst weitgehend wirksam bleiben.
  norms:
  - Art. 4 Abs. 1, 2 GG
  - Art. 140 GG
  - Art. 136 Abs. 1 WRV
  quellen:
  - GG, amtliche Fassung
  - BVerfGE 33, 23 (Eidesverweigerung)
- slug: or-gr-rel-kopftuch-lehrerin-2003-2015
  type: rechtsprechung
  front: "Was haben die Kopftuch-Entscheidungen des BVerfG zur Lehrerin (2003, 2015) entschieden?"
  back: >-
    Im Ludin-Urteil (BVerfGE 108, 282, 2003) hat das BVerfG gesagt, dass eine
    Lehrerin mit Kopftuch in der öffentlichen Schule in die Glaubensfreiheit eingreift, wenn ihr deswegen die Einstellung in den Schuldienst verwehrt wird (Art. 4 und Art. 33 Abs. 2, 3 GG). Die Ablehnung der Einstellung mangels Eignung bedurfte einer hinreichend bestimmten gesetzlichen Grundlage; an dieser fehlte es, der Landesgesetzgeber konnte sie aber schaffen. Daraufhin erließen mehrere Länder Verbote religiöser
    Bekundungen. Im Beschluss BVerfGE 138, 296 (2015) hat das BVerfG ein
    pauschales Verbot für Lehrkräfte in der öffentlichen Schule als
    unverhältnismäßig angesehen. Ein Verbot ist nur zulässig, wenn von der
    Bekundung eine hinreichend konkrete Gefahr für den Schulfrieden oder die
    staatliche Neutralität ausgeht; eine abstrakte Gefahr genügt nicht. Das
    Landesgesetz war verfassungskonform auszulegen. Eine Privilegierung christlich-abendländischer Bekundungen ist unzulässig.
  norms:
  - Art. 4 Abs. 1, 2 GG
  - Art. 33 Abs. 2, 3 GG
  - Art. 7 Abs. 1 GG
  quellen:
  - BVerfGE 108, 282 (Kopftuch I)
  - BVerfGE 138, 296 (Kopftuch II)
- slug: or-gr-rel-kopftuch-rechtsreferendarin-2020
  type: rechtsprechung
  front: "Was hat das BVerfG 2020 zum Kopftuch der Rechtsreferendarin entschieden?"
  back: >-
    Im Beschluss vom 14.1.2020 (2 BvR 1333/17, BVerfGE 153, 1) hat das BVerfG
    ein hessisches Verbot für Rechtsreferendarinnen, bei Tätigkeiten mit
    Außenwirkung, etwa als Vertreterin der Staatsanwaltschaft oder Sitzungsleiterin
    im Termin, ein Kopftuch zu tragen, verfassungsrechtlich nicht beanstandet. Es
    handelt sich um einen Eingriff in Art. 4 Abs. 1, 2 GG, der durch den
    Grundsatz der weltanschaulich-religiösen Neutralität des Staates, die
    Funktionsfähigkeit der Rechtspflege und die negative Religionsfreiheit der
    Verfahrensbeteiligten gerechtfertigt sei. Die Rechtsreferendarin ist zwar
    nur in der Ausbildung und nicht Beamtin im statusrechtlichen Sinn, das
    Neutralitätsinteresse wiege aber bei der Ausübung hoheitlicher Aufgaben
    schwerer, zumal die Ausbildung auch ohne hoheitliche Außentätigkeit absolviert werden kann. Die Entscheidung unterscheidet sich von der
    Lehrerinnen-Rechtsprechung, die eine konkrete Gefahr verlangt.
  norms:
  - Art. 4 Abs. 1, 2 GG
  - Art. 33 Abs. 3 GG
  - Art. 12 Abs. 1 GG
  quellen:
  - BVerfGE 153, 1 (Rechtsreferendarin)
- slug: or-gr-rel-kruzifix
  type: rechtsprechung
  front: "Warum hat das BVerfG das Kruzifix im Klassenzimmer beanstandet (Kruzifix-Beschluss)?"
  back: >-
    Im Kruzifix-Beschluss (BVerfGE 93, 1, 1995) ging es um die bayerische
    Regelung, in jedem Klassenzimmer der Volksschulen ein Kreuz anzubringen. Das BVerfG
    sah darin einen Verstoß gegen Art. 4 Abs. 1 GG, weil die Schüler wegen der
    allgemeinen Schulpflicht im Unterricht zwangsweise mit dem Kreuz als Symbol
    des christlichen Glaubens konfrontiert werden und sich ihm nicht entziehen
    können. Die negative Religionsfreiheit wird dadurch verletzt, die staatliche
    Neutralität zwischen den Bekenntnissen missachtet. Anders als beim
    Schulgebet, bei dem die Teilnahme freiwillig ist, fehlt die Ausweichmöglichkeit.
    Der Beschluss hat eine politische Debatte ausgelöst; die bayerische
    Neuregelung sieht ein Kreuz nach einer Widerspruchsregelung mit
    Einzelfallausgleich vor. 
  norms:
  - Art. 4 Abs. 1 GG
  - Art. 7 Abs. 1 GG
  - Art. 6 Abs. 2 GG
  quellen:
  - BVerfGE 93, 1 (Kruzifix)
- slug: or-gr-rel-staatskirchenrecht-art140
  type: norm
  front: "Was regeln Art. 140 GG i. V. m. Art. 136 bis 139, 141 WRV?"
  back: >-
    Art. 140 GG inkorporiert die Kirchenartikel der Weimarer Reichsverfassung
    (WRV) als vollgültiges Verfassungsrecht in das Grundgesetz. Wichtig sind Art. 136
    Abs. 1 WRV (bürgerliche und staatsbürgerliche Rechte und Pflichten sind vom
    religiösen Bekenntnis unabhängig), Art. 136 Abs. 3 WRV (niemand ist
    verpflichtet, seine religiöse Überzeugung zu offenbaren, Frage nur, soweit
    Rechte oder Pflichten davon abhängen), Art. 137 Abs. 1 WRV (keine
    Staatskirche), Art. 137 Abs. 3 WRV (Religionsgesellschaften ordnen und
    verwalten ihre Angelegenheiten selbständig innerhalb der Schranken des für
    alle geltenden Gesetzes) sowie Art. 137 Abs. 5 WRV (Körperschaftsstatus).
    Das Selbstbestimmungsrecht der Kirchen umfasst auch das kirchliche
    Arbeitsrecht; die Schranke des für alle geltenden Gesetzes wird nach der
    Wechselwirkungslehre ausgelegt: Das Gesetz ist im Licht des
    Selbstbestimmungsrechts zu verstehen. Art. 4 GG und die Kirchenartikel stehen
    nebeneinander.
  norms:
  - Art. 140 GG
  - Art. 136 WRV
  - Art. 137 Abs. 3 WRV
  quellen:
  - GG, amtliche Fassung
  - WRV, amtliche Fassung
- slug: or-gr-rel-gewissensfreiheit
  type: definition
  front: "Was ist Gewissensfreiheit im Sinne des Art. 4 Abs. 1, 3 GG, und wann ist sie verletzt?"
  back: >-
    Gewissensentscheidung ist nach dem BVerfG jede ernste sittliche, d. h. an den
    Kategorien von Gut und Böse orientierte Entscheidung, die der Einzelne in
    einer bestimmten Lage als für sich bindend und unbedingt verpflichtend
    innerlich erfährt, sodass er gegen sie nicht ohne ernste Gewissensnot handeln
    könnte (BVerfGE 12, 45). Art. 4 Abs. 1 GG schützt das Gewissen in seiner
    inneren Bildung und der Verhaltensbetätigung. Art. 4 Abs. 3 GG regelt das
    Recht, den Kriegsdienst mit der Waffe zu verweigern, als Spezialfall. Weil
    Art. 4 vorbehaltlos gilt, lässt sich ein Gewissenskonflikt nur durch
    kollidierendes Verfassungsrecht begrenzen; die Rechtsordnung muss aber nicht
    jede Gewissensentscheidung gegen allgemeine Gesetze durchsetzen. Der Staat muss
    nach Möglichkeit Ausweichmöglichkeiten bieten. Die Gewissensfreiheit gibt
    kein allgemeines Recht, Gesetzen aus Gewissensgründen die Befolgung zu
    verweigern; sonst würde die Rechtsordnung aufgelöst.
  norms:
  - Art. 4 Abs. 1 GG
  - Art. 4 Abs. 3 GG
  quellen:
  - BVerfGE 12, 45
  - GG, amtliche Fassung
- slug: or-gr-rel-negative-religionsfreiheit-schule
  type: definition
  front: "Wie sind positive und negative Religionsfreiheit der Schüler und der Elternrechte im Schulwesen auszugleichen?"
  back: >-
    Im Schulwesen kollidieren die positive Religionsfreiheit, zum Beispiel der
    Wunsch nach einem Schulgebet oder religiös geprägten Unterricht, mit der
    negativen Religionsfreiheit anderer Schüler, dem Elternrecht (Art. 6 Abs. 2 GG)
    und dem staatlichen Erziehungsauftrag (Art. 7 Abs. 1 GG). Der Staat hat die
    Pflicht zur Neutralität, die aber nicht Laizismus bedeutet. Das BVerfG versteht
    sie als offene und übergreifende Neutralität, die die Identifikation mit einem
    bestimmten Bekenntnis verbietet, aber Raum für religiöse Bezüge lässt
    (christliche Gemeinschaftsschule, BVerfGE 41, 29; freiwilliges Schulgebet,
    BVerfGE 52, 223). Die negative Freiheit schützt nicht davor, im Alltag mit
    religiösen Bekundungen Anderer konfrontiert zu werden, wohl aber vor staatlich
    veranlassten Glaubensakten und Symbolen, denen man sich nicht entziehen kann.
    Dabei wird zwischen staatlicher Gestaltung und privater Bekundung unterschieden.
  norms:
  - Art. 4 Abs. 1 GG
  - Art. 6 Abs. 2 GG
  - Art. 7 Abs. 1 GG
  quellen:
  - BVerfGE 41, 29
  - BVerfGE 52, 223
schemata:
- slug: or-schema-gr-rel-art4-pruefung
  title: Prüfung des Art. 4 Abs. 1, 2 GG
  norms:
  - Art. 4 Abs. 1 GG
  - Art. 4 Abs. 2 GG
  quellen:
  - GG, amtliche Fassung
  - Eigenformulierung Redaktion
  steps:
  - label: I. Schutzbereich
    children:
    - label: 1. Persönlich (Jedermannrecht, Art. 19 Abs. 3 GG)
    - label: 2. Sachlich
      children:
      - label: a) Glaube, Gewissen, Bekenntnis (forum internum und externum)
      - label: b) Ungestörte Religionsausübung, negative Religionsfreiheit
        hinweis: Es genügt die plausible Darlegung nach dem Selbstverständnis.
          Keine inhaltliche Bewertung der Religion durch den Staat.
  - label: II. Eingriff
    hinweis: Jede staatliche Maßnahme, die das Bekenntnis oder die Ausübung verbietet
      oder erschwert, auch eine zwangsweise Konfrontation mit Symbolen.
  - label: III. Rechtfertigung
    children:
    - label: 1. Schranke - nur kollidierendes Verfassungsrecht
      hinweis: Kein Vorbehalt der allgemeinen Gesetze (Art. 136 Abs. 1 WRV).
    - label: 2. Gesetzliche Grundlage (Wesentlichkeit)
    - label: 3. Praktische Konkordanz und Verhältnismäßigkeit
      hinweis: Konkrete Gefahr verlangt bei Lehrkräften im Schuldienst, strengerer
        Maßstab bei Hoheitsträgern in der Ausbildung.
  - label: IV. Ergebnis
faelle:
- slug: or-fall-gr-rel-kopftuchverbot-lehrerin
  title: Das pauschale Kopftuchverbot an öffentlichen Schulen
  difficulty: 4
  minutes: 50
  quellen:
  - Eigener Sachverhalt der Redaktion
  - GG, amtliche Fassung
  facts: >-
    Das (fiktive) Schulgesetz eines Landes bestimmt, dass Lehrkräfte an öffentlichen
    Schulen im Unterricht keine äußeren Symbole tragen dürfen, die eine religiöse
    Überzeugung zum Ausdruck bringen. Die muslimische Lehrerin L, die seit Jahren
    unbeanstandet an einer Grundschule unterrichtet, trägt aus religiöser
    Überzeugung ein Kopftuch. Die Schulaufsicht untersagt ihr das Tragen im
    Unterricht, ohne dass es je zu Konflikten mit Eltern oder Schülern gekommen
    wäre. L erhebt nach Erschöpfung des Rechtswegs Verfassungsbeschwerde.
  question: Verletzt die Untersagung die L in ihrer Glaubensfreiheit?
  steps:
  - prompt: Ist der Schutzbereich des Art. 4 Abs. 1, 2 GG eröffnet, und liegt ein Eingriff vor?
    erwartung: Ja. Das Tragen des Kopftuchs ist nach ihrem Selbstverständnis eine
      verbindliche Glaubensregel und damit Bekenntnis und Religionsausübung. Das
      Verbot im Unterricht ist ein Eingriff, weil es sie vor die Wahl stellt,
      zwischen Glaubensgebot und Berufsausübung zu entscheiden.
  - prompt: Welche Schranke greift, und welche Gegenrechte sind abzuwägen?
    erwartung: Art. 4 GG ist vorbehaltlos gewährleistet, es kommt nur kollidierendes
      Verfassungsrecht in Betracht, hier der staatliche Erziehungsauftrag und die
      Neutralitätspflicht (Art. 7 Abs. 1 GG), die negative Religionsfreiheit der
      Schüler und das Elternrecht (Art. 6 Abs. 2 GG). Für den Eingriff ist
      zudem eine gesetzliche Grundlage nötig, die hier vorliegt.
  - prompt: Ist das pauschale Verbot verhältnismäßig?
    erwartung: Nein. Nach BVerfGE 138, 296 ist ein pauschales Verbot unangemessen,
      weil die abstrakte Möglichkeit einer Gefährdung nicht genügt. Es bedarf einer
      hinreichend konkreten Gefahr für den Schulfrieden oder die staatliche
      Neutralität. Hier gab es keinen Konflikt. Das Verbot greift unverhältnismäßig
      in Art. 4 Abs. 1, 2 GG ein und verletzt L, soweit es ohne diese Gefahrenschwelle
      angewandt wird.
