cards:
- slug: or-ap-freies-mandat-art38
  type: definition
  front: "Was bedeutet das freie Mandat des Abgeordneten nach Art. 38 Abs. 1 S. 2 GG?"
  back: >-
    Die Abgeordneten des Bundestages sind Vertreter des ganzen Volkes, an Aufträge und Weisungen nicht gebunden und nur ihrem Gewissen unterworfen. Das schließt ein imperatives Mandat aus: Weder Wähler noch Partei oder Fraktion können dem Abgeordneten verbindliche Weisungen erteilen oder ihn durch Rückruf aus dem Amt entfernen. Das Mandat gehört dem Abgeordneten, nicht der Partei; er behält es deshalb auch bei Austritt oder Ausschluss aus Partei oder Fraktion, ein Mandatsverlust tritt nur in den gesetzlich abschließend geregelten Fällen ein (§ 46 BWahlG). Faktischer Fraktionszwang und politische Fraktionsdisziplin sind zulässig, soweit sie nicht in rechtlich verbindlichen Zwang umschlagen. Aus dem Status folgen die Statusrechte des Abgeordneten, etwa Rede-, Frage-, Antrags- und Stimmrecht sowie das Recht auf Mitwirkung in Ausschüssen. Sie können im Organstreit geltend gemacht werden.
  norms:
  - Art. 38 Abs. 1 S. 2 GG
  - § 46 BWahlG
  quellen:
  - GG, amtliche Fassung
  - BWahlG, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-10
- slug: or-ap-fraktionen-rechtsstellung
  type: definition
  front: "Welche Rechtsstellung haben Fraktionen im Bundestag, und woraus leiten sie ihre Rechte ab?"
  back: >-
    Fraktionen sind Zusammenschlüsse von Abgeordneten derselben Partei (oder politisch gleichgerichteter Parteien), die in der Geschäftsordnung des Bundestages mit eigenen Rechten ausgestattet sind. Sie sind notwendige Einrichtungen des Verfassungslebens, weil sie die parlamentarische Arbeit bündeln und die Willensbildung erleichtern; ihre Rechtsstellung leitet sich aus dem Abgeordnetenstatus (Art. 38 Abs. 1 S. 2 GG) und der Geschäftsordnungsautonomie (Art. 40 Abs. 1 GG) ab. Eine Fraktion setzt nach der Geschäftsordnung mindestens fünf Prozent der Bundestagsmitglieder voraus (§ 10 GOBT). Aus dem Grundsatz der Spiegelbildlichkeit folgt, dass Ausschüsse die Stärkeverhältnisse des Plenums abbilden müssen. Fraktionen sind im Organstreit beteiligtenfähig und können in Prozessstandschaft Rechte des gesamten Bundestages geltend machen. Die Fraktion hat dagegen keine eigene Rechtsmacht über das Mandat ihrer Mitglieder.
  norms:
  - Art. 38 Abs. 1 S. 2 GG
  - Art. 40 Abs. 1 GG
  - § 10 GOBT
  quellen:
  - GG, amtliche Fassung
  - GOBT, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-10
- slug: or-ap-fraktionslose-abgeordnete
  type: rechtsprechung
  front: "Welche Rechte haben fraktionslose Abgeordnete (BVerfGE 80, 188 – Wüppesahl)?"
  back: >-
    Alle Abgeordneten haben den gleichen Status; Art. 38 Abs. 1 S. 2 GG kennt keinen Abgeordneten minderen Rechts. Das Bundesverfassungsgericht hat deshalb entschieden, dass auch ein fraktionsloser Abgeordneter einen Anspruch auf Beteiligung an der parlamentarischen Arbeit hat: Er hat das Rede- und Stimmrecht im Plenum und das Recht auf Mitarbeit in einem Ausschuss, dort allerdings ohne Stimmrecht (beratende Stimme); Initiativrechte dürfen an Quoren gebunden werden (BVerfGE 80, 188). Beschränkungen sind zulässig, soweit sie zur Sicherung der Funktionsfähigkeit des Parlaments erforderlich sind und die Gleichheit der Abgeordneten nicht unverhältnismäßig verletzen; eine einfache Gleichstellung mit Fraktionen ist nicht verlangt. Für Zusammenschlüsse unterhalb der Fraktionsstärke (Gruppen) hat das Gericht entsprechend einen Anspruch auf angemessene Berücksichtigung bejaht (BVerfGE 84, 304). Wer ausgeschlossen wird, kann Organstreit führen.
  norms:
  - Art. 38 Abs. 1 S. 2 GG
  - Art. 93 Abs. 1 Nr. 1 GG
  quellen:
  - GG, amtliche Fassung
  - BVerfGE 80, 188
  - BVerfGE 84, 304
  stand: 2026-10
- slug: or-ap-indemnitaet-immunitaet
  type: norm
  front: "Was regeln Indemnität, Immunität, Zeugnisverweigerungsrecht und Entschädigung in Art. 46–48 GG?"
  back: >-
    Die Indemnität schützt Abgeordnete davor, wegen einer Abstimmung oder Äußerung im Bundestag oder in einem Ausschuss gerichtlich oder dienstlich verfolgt zu werden; ausgenommen sind verleumderische Beleidigungen (Art. 46 Abs. 1 GG). Der Schutz gilt zeitlich unbegrenzt, auch nach dem Ausscheiden. Die Immunität erlaubt die Verfolgung wegen einer mit Strafe bedrohten Handlung nur mit Genehmigung des Bundestages, es sei denn, der Abgeordnete wird bei der Begehung oder im Laufe des folgenden Tages festgenommen (Art. 46 Abs. 2 GG); der Bundestag kann ein Verfahren aussetzen (Abs. 4). Sie ist ein Recht des Parlaments, nicht des Einzelnen. Art. 47 GG gibt ein Zeugnisverweigerungsrecht und ein Beschlagnahmeverbot. Art. 48 GG sichert die freie Mandatsausübung (Urlaubsanspruch für Wahlbewerber, Behinderungsverbot) und garantiert eine angemessene, unabhängig sichernde Entschädigung (Abs. 3); die Höhe der Abgeordnetendiäten muss der Bundestag selbst und öffentlich beschließen (BVerfGE 40, 296).
  norms:
  - Art. 46 Abs. 1 GG
  - Art. 46 Abs. 2 GG
  - Art. 47 GG
  - Art. 48 Abs. 3 GG
  quellen:
  - GG, amtliche Fassung
  - BVerfGE 40, 296
  stand: 2026-10
- slug: or-ap-parteien-stellung-art21
  type: norm
  front: "Welche verfassungsrechtliche Stellung haben Parteien nach Art. 21 Abs. 1 GG?"
  back: >-
    Die Parteien wirken bei der politischen Willensbildung des Volkes mit (Art. 21 Abs. 1 S. 1 GG). Sie sind keine Staatsorgane, sondern freie, im gesellschaftlichen Raum wurzelnde Vereinigungen, aber verfassungsrechtlich institutionalisiert. Ihre Gründung ist frei (S. 2), ihre innere Ordnung muss demokratischen Grundsätzen entsprechen (S. 3), und sie müssen über die Herkunft und Verwendung ihrer Mittel öffentlich Rechenschaft geben (S. 4). Aus der Freiheit der Parteien folgt ein Status der Freiheit (Staatsfreiheit, Programmfreiheit), aus Art. 21 Abs. 1 in Verbindung mit Art. 3 Abs. 1 GG ein Status der Gleichheit (Chancengleichheit). Das Parteiengesetz (PartG) konkretisiert die Rechtsstellung. Parteien sind Grundrechtsträger (Art. 19 Abs. 3 GG), können sich aber auch im Organstreit auf ihren Status aus Art. 21 GG berufen, sofern ein oberstes Bundesorgan ihn beeinträchtigt. Der Grundsatz der Staatsfreiheit begrenzt die staatliche Parteienfinanzierung auf einen Teilbetrag der Gesamteinnahmen.
  norms:
  - Art. 21 Abs. 1 GG
  - Art. 19 Abs. 3 GG
  quellen:
  - GG, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-10
- slug: or-ap-chancengleichheit-parteien
  type: streitstand
  front: "Wann verletzt staatliches Handeln die Chancengleichheit der Parteien, insbesondere durch Äußerungen von Amtsträgern?"
  back: >-
    Die Chancengleichheit folgt aus Art. 21 Abs. 1 in Verbindung mit Art. 3 Abs. 1 GG und gilt vor allem im Wahlkampf strikt: Der Staat darf nicht zugunsten oder zulasten einer Partei in den Wettbewerb eingreifen, er muss neutral bleiben. Bei staatlichen Leistungen (Sendezeiten, Hallennutzung) ist eine abgestufte Chancengleichheit nach der Bedeutung der Partei zulässig. Für Äußerungen von Regierungsmitgliedern gilt: Als Amtsträger dürfen sie sich nicht unter Einsatz amtlicher Autorität oder Ressourcen parteiergreifend äußern. Eine amtliche Äußerung mit negativer Bewertung einer Partei unter Berufung auf das Amt verletzt Art. 21 Abs. 1 GG, jedenfalls außerhalb einer rein privaten, parteipolitischen Rolle; das Bundesverfassungsgericht hat dies für eine Äußerung der damaligen Bundeskanzlerin bei einem Auslandsaufenthalt in amtlicher Eigenschaft bejaht (BVerfG, Urteil vom 15.06.2022 – 2 BvE 4/20, 2 BvE 5/20). Die Gegenposition, Regierungsmitglieder dürften sich stets wie jeder Bürger politisch äußern, trägt daher nicht; entscheidend bleibt im Einzelfall, ob die Äußerung unter Inanspruchnahme der Amtsautorität erfolgte.
  norms:
  - Art. 21 Abs. 1 GG
  - Art. 3 Abs. 1 GG
  quellen:
  - GG, amtliche Fassung
  - BVerfG, Urteil vom 15.06.2022 – 2 BvE 4/20, 2 BvE 5/20
  stand: 2026-10
- slug: or-ap-parteiverbot-art21-abs2
  type: norm
  front: "Unter welchen Voraussetzungen kann eine Partei verboten werden (Art. 21 Abs. 2 und 4 GG)?"
  back: >-
    Parteien, die nach ihren Zielen oder nach dem Verhalten ihrer Anhänger darauf ausgehen, die freiheitliche demokratische Grundordnung zu beeinträchtigen oder zu beseitigen oder den Bestand der Bundesrepublik Deutschland zu gefährden, sind verfassungswidrig (Art. 21 Abs. 2 S. 1 GG). Über die Verfassungswidrigkeit entscheidet allein das Bundesverfassungsgericht (Art. 21 Abs. 4, § 13 Nr. 2 BVerfGG, Parteienprivileg); bis dahin darf die Partei nicht als verfassungswidrig behandelt werden. Antragsberechtigt sind Bundestag, Bundesrat und Bundesregierung (§ 43 BVerfGG). Verlangt wird eine aktiv kämpferische, aggressive Haltung gegenüber der Grundordnung; bloße Ablehnung genügt nicht (BVerfGE 5, 85 – KPD). Das Bundesverfassungsgericht verlangt zudem Anhaltspunkte von Gewicht, die es als möglich erscheinen lassen, dass das Handeln der Partei zum Erfolg führt (Potentialität); an ihr scheiterte das Verbot der NPD (BVerfGE 144, 20). Rechtsfolgen sind Auflösung, Verbot von Ersatzorganisationen und Mandatsverlust.
  norms:
  - Art. 21 Abs. 2 S. 1 GG
  - Art. 21 Abs. 4 GG
  - § 43 BVerfGG
  quellen:
  - GG, amtliche Fassung
  - BVerfGE 5, 85
  - BVerfGE 144, 20
  stand: 2026-10
- slug: or-ap-finanzierungsausschluss-art21-abs3
  type: norm
  front: "Was regelt der Ausschluss von der staatlichen Parteienfinanzierung nach Art. 21 Abs. 3 GG?"
  back: >-
    Seit der Grundgesetzänderung von 2017 sind Parteien, die nach ihren Zielen oder dem Verhalten ihrer Anhänger darauf ausgerichtet sind, die freiheitliche demokratische Grundordnung zu beeinträchtigen oder zu beseitigen oder den Bestand der Bundesrepublik zu gefährden, von der staatlichen Finanzierung ausgeschlossen (Art. 21 Abs. 3 S. 1 GG). Wird der Ausschluss festgestellt, entfällt auch die steuerliche Begünstigung der Partei und ihrer Zuwendungen (S. 2). Der Tatbestand ist gegenüber dem Verbot abgesenkt: Es kommt nicht darauf an, ob die Partei Erfolgsaussichten hat (keine Potentialität); sie muss nur auf Beseitigung oder Beeinträchtigung der Grundordnung ausgerichtet sein. Die Entscheidung trifft allein das Bundesverfassungsgericht (Art. 21 Abs. 4 GG), das den Ausschluss erstmals 2024 gegenüber der früheren NPD (jetzt „Die Heimat“) für sechs Jahre ausgesprochen hat (BVerfG, Urteil vom 23.01.2024 – 2 BvB 1/19). Der Ausschluss ist zeitlich befristet und kann verlängert werden.
  norms:
  - Art. 21 Abs. 3 GG
  - Art. 21 Abs. 4 GG
  quellen:
  - GG, amtliche Fassung
  - BVerfG, Urteil vom 23.01.2024 – 2 BvB 1/19
  stand: 2026-10
- slug: or-ap-sperrklausel-fuenf-prozent
  type: rechtsprechung
  front: "Ist die Fünf-Prozent-Sperrklausel mit der Wahlrechtsgleichheit vereinbar?"
  back: >-
    Die Sperrklausel greift in die Wahlgleichheit (Erfolgswertgleichheit) und in die Chancengleichheit der Parteien ein, weil Stimmen für Parteien unter fünf Prozent ohne Erfolgswert bleiben. Sie ist nur durch zwingende Gründe gerechtfertigt; als solcher Grund ist die Sicherung der Funktionsfähigkeit des Parlaments anerkannt, weil sie Zersplitterung verhindert und stabile Mehrheiten ermöglicht. Für den Bundestag hält das Bundesverfassungsgericht die Fünf-Prozent-Klausel für zulässig (BVerfGE 95, 408). Der Gesetzgeber muss die Rechtfertigung aber regelmäßig überprüfen. Für das Europäische Parlament waren dagegen weder die Fünf-Prozent- noch die Drei-Prozent-Klausel zu rechtfertigen (BVerfGE 129, 300; BVerfGE 135, 259), weil dessen Funktionsfähigkeit nicht beeinträchtigt wird. Auch für Kommunalwahlen ist eine Sperrklausel regelmäßig nicht gerechtfertigt (BVerfGE 120, 82). Eine Grundmandatsklausel mildert die Wirkung der Sperrklausel ab.
  norms:
  - Art. 38 Abs. 1 S. 1 GG
  - Art. 21 Abs. 1 GG
  - Art. 3 Abs. 1 GG
  quellen:
  - GG, amtliche Fassung
  - BVerfGE 95, 408
  - BVerfGE 129, 300
  - BVerfGE 135, 259
  - BVerfGE 120, 82
  stand: 2026-10
- slug: or-ap-wahlrechtsreform-2023-bverfg-2024
  type: rechtsprechung
  front: "Was hat die Wahlrechtsreform 2023 geändert, und wie hat das Bundesverfassungsgericht 2024 entschieden?"
  back: >-
    Das Wahlrechtsänderungsgesetz 2023 begrenzt den Bundestag auf 630 Sitze und beseitigt Überhang- und Ausgleichsmandate. Die Sitzverteilung richtet sich allein nach dem Zweitstimmenergebnis; ein Wahlkreissieger erhält das Direktmandat nur, wenn es von der Zweitstimmendeckung seiner Partei getragen wird. Außerdem sollte die Grundmandatsklausel entfallen, wonach Parteien mit drei Direktmandaten unabhängig von der Fünf-Prozent-Hürde nach ihrem Zweitstimmenanteil in den Bundestag einziehen. Mit Urteil vom 30.07.2024 (2 BvF 1/23 u. a.) hat das Bundesverfassungsgericht das Zweitstimmendeckungsverfahren als verfassungsgemäß gebilligt (einstimmig). Die Fünf-Prozent-Sperrklausel ohne Grundmandatsklausel verstößt dagegen derzeit gegen Art. 21 Abs. 1 und Art. 38 Abs. 1 S. 1 GG (7 : 1 Stimmen); bis zu einer Neuregelung gilt sie mit der Maßgabe fort, dass Parteien mit weniger als 5 % der Zweitstimmen nur dann nicht berücksichtigt werden, wenn ihre Bewerber in weniger als drei Wahlkreisen die meisten Erststimmen erhalten haben (Grundmandatsklausel). Spätere gesetzgeberische Änderungen sind zu beachten.
  norms:
  - Art. 38 Abs. 1 S. 1 GG
  - Art. 21 Abs. 1 GG
  - Art. 3 Abs. 1 GG
  quellen:
  - GG, amtliche Fassung
  - BVerfG, Urteil vom 30.07.2024 – 2 BvF 1/23 u. a.
  stand: 2026-10
