faelle:
- slug: or-fall-ap-fraktionslose-abgeordnete
  title: Die Abgeordnete ohne Fraktion
  difficulty: 3
  minutes: 45
  quellen:
  - Eigener Sachverhalt der Redaktion
  - GG, amtliche Fassung
  - BVerfGG, amtliche Fassung
  facts: >-
    Die Bundestagsabgeordnete A wurde über die Landesliste der Partei P in den Bundestag gewählt. Nach einem Streit über die Parteilinie tritt sie aus der Partei P und aus der Fraktion der P aus. Die Fraktion verlangt von A, ihr Mandat niederzulegen, es gehöre der Partei, die sie ins Parlament gebracht habe. A weigert sich. Der Bundestag beschließt daraufhin eine Änderung seiner Geschäftsordnung (fiktiv): Redezeiten im Plenum werden nur an Fraktionen vergeben, fraktionslose Abgeordnete erhalten nie das Wort und dürfen auch nicht in Ausschüssen mitarbeiten. A stellt vier Monate nach dem Beschluss einen Antrag im Organstreitverfahren gegen den Bundestag.
  question: Verliert A ihr Mandat, und ist ihr Antrag erfolgreich?
  steps:
  - prompt: Muss A ihr Mandat niederlegen oder verliert sie es?
    erwartung: Nein. Der Abgeordnete ist Vertreter des ganzen Volkes, an Aufträge und Weisungen nicht gebunden (Art. 38 Abs. 1 S. 2 GG). Das Mandat gehört dem Abgeordneten, nicht der Partei; ein Mandatsverlust tritt nur in den gesetzlich geregelten Fällen ein (§ 46 BWahlG), nicht durch Austritt aus Partei oder Fraktion.
  - prompt: Ist der Organstreitantrag zulässig?
    erwartung: Ja. A ist als einzelne Abgeordnete mit eigenen Rechten aus Art. 38 Abs. 1 S. 2 GG beteiligtenfähig (Art. 93 Abs. 1 Nr. 1 GG), der Bundestag als oberstes Bundesorgan ebenfalls; der Beschluss ist rechtserhebliche Maßnahme; A kann in ihren Statusrechten verletzt sein (Möglichkeitstheorie); die Sechsmonatsfrist des § 64 Abs. 3 BVerfGG ist mit vier Monaten gewahrt.
  - prompt: Ist der Antrag begründet?
    erwartung: Ja. Alle Abgeordneten haben den gleichen Status. Fraktionslose haben einen Anspruch auf Mitwirkung (Rederecht, Stimmrecht im Plenum, Ausschussmitarbeit zumindest mit beratender Stimme). Der vollständige Ausschluss von Rederecht und Ausschussarbeit ist zur Sicherung der Funktionsfähigkeit des Parlaments nicht erforderlich und daher unverhältnismäßig; zulässig wären nur maßvolle Beschränkungen, etwa kürzere Redezeiten. Der Antrag ist damit zulässig und begründet; A ist in ihren Statusrechten verletzt.
