cards:
- slug: or-bw-bundestreue-grundsatz
  type: definition
  front: "Was besagt der Grundsatz der Bundestreue, und woraus wird er hergeleitet?"
  back: >-
    Der Grundsatz der Bundestreue, auch bundesfreundliches Verhalten genannt, verpflichtet Bund und Länder, bei der Ausübung ihrer Kompetenzen aufeinander Rücksicht zu nehmen und zusammenzuwirken. Er ist ein ungeschriebener Verfassungsgrundsatz und wird aus dem Bundesstaatsprinzip (Art. 20 Abs. 1 GG) abgeleitet; er gilt wechselseitig im Verhältnis zwischen dem Bund und den Ländern sowie zwischen den Ländern untereinander. Aus ihm folgen Pflichten zur Rücksichtnahme, zur Information, zur Anhörung und zur Kooperation, etwa vor dem Abschluss von Verträgen mit Auswirkungen auf die Länder oder bei der Ausübung von Weisungsrechten. Das Bundesverfassungsgericht hat das Gebot früh anerkannt und etwa im Fernsehurteil angewandt, das das Verhalten der Bundesregierung gegenüber den Ländern bei der Gründung einer Fernsehgesellschaft betraf (BVerfGE 12, 205). Verstöße können im Bund-Länder-Streit nach Art. 93 Abs. 1 Nr. 3 GG gerügt werden. Die Bundestreue ist ein Prüfungsmaßstab in der Begründetheit.
  norms:
  - Art. 20 Abs. 1 GG
  - Art. 93 Abs. 1 Nr. 3 GG
  quellen:
  - GG, amtliche Fassung
  - BVerfGE 12, 205
  - Eigenformulierung Redaktion
  stand: 2026-10
- slug: or-bw-bundestreue-akzessorietaet
  type: streitstand
  front: "Begründet die Bundestreue selbständige Rechte und Pflichten, oder wirkt sie nur akzessorisch?"
  back: >-
    Nach gefestigter Rechtsprechung ist die Bundestreue akzessorisch: Sie setzt ein bereits bestehendes verfassungsrechtliches Rechtsverhältnis voraus und konkretisiert dessen Ausübung. Sie begründet keine neuen, eigenständigen Kompetenzen und keine selbständigen Pflichten, sondern ist eine Schranke der Kompetenzausübung und modifiziert sie im Einzelfall. Ein Verstoß liegt deshalb nur vor, wenn eine Kompetenz rücksichtslos oder missbräuchlich ausgeübt wird. Eine Mindermeinung in der Literatur räumt der Bundestreue auch eigenständige Kooperationspflichten ein und versteht sie als allgemeinen Verfassungsgrundsatz, der nicht nur eine Ausübungsschranke bildet. Dagegen spricht, dass das Grundgesetz die Kompetenzen abschließend verteilt und die Bundestreue sonst als Einfallstor für Kompetenzverschiebungen wirken würde. In der Klausur ist die Bundestreue deshalb stets in Verbindung mit einer konkreten Kompetenznorm zu prüfen.
  norms:
  - Art. 20 Abs. 1 GG
  quellen:
  - GG, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-10
- slug: or-bw-homogenitaet-art28
  type: norm
  front: "Was verlangt die Homogenitätsklausel des Art. 28 Abs. 1 GG von der Verfassungsordnung der Länder?"
  back: >-
    Die verfassungsmäßige Ordnung in den Ländern muss den Grundsätzen des republikanischen, demokratischen und sozialen Rechtsstaates im Sinne des Grundgesetzes entsprechen (Art. 28 Abs. 1 S. 1 GG). In den Ländern, Kreisen und Gemeinden muss das Volk eine Vertretung haben, die aus allgemeinen, unmittelbaren, freien, gleichen und geheimen Wahlen hervorgegangen ist (S. 2); bei Kommunalwahlen sind auch Unionsbürger wahlberechtigt und wählbar (S. 3). Die Homogenität verlangt Übereinstimmung in den Grundprinzipien, nicht Uniformität. Die Länder haben Verfassungsautonomie und können ihre Staatsorganisation, etwa Volksgesetzgebung, Landtagswahlrecht und Regierungsbildung, eigenständig regeln, solange sie sich in diesem Rahmen halten. Der Bund gewährleistet, dass die verfassungsmäßige Ordnung der Länder den Grundrechten und den Bestimmungen der Abs. 1 und 2 entspricht (Art. 28 Abs. 3 GG). Die Landesgrundrechte bleiben nach Art. 142 GG in Kraft, soweit sie mit den Grundrechten des Grundgesetzes übereinstimmen.
  norms:
  - Art. 28 Abs. 1 GG
  - Art. 28 Abs. 3 GG
  - Art. 142 GG
  quellen:
  - GG, amtliche Fassung
  stand: 2026-10
- slug: or-bw-bundeszwang-art37
  type: norm
  front: "Unter welchen Voraussetzungen ist Bundeszwang nach Art. 37 GG zulässig?"
  back: >-
    Erfüllt ein Land die ihm nach dem Grundgesetz oder einem anderen Bundesgesetz obliegenden Bundespflichten nicht, kann die Bundesregierung mit Zustimmung des Bundesrates die notwendigen Maßnahmen treffen, um das Land im Wege des Bundeszwanges zur Erfüllung seiner Pflichten anzuhalten (Art. 37 Abs. 1 GG). Voraussetzungen sind erstens eine Bundespflicht des Landes, zweitens deren Verletzung durch Tun oder Unterlassen und drittens die Zustimmung des Bundesrates als Beschluss. Die Maßnahme muss notwendig und verhältnismäßig sein und tritt als äußerstes Mittel hinter milderen Instrumenten wie der Bundesaufsicht (Art. 84, 85 GG) zurück. Für den Vollzug hat die Bundesregierung oder ihr Beauftragter ein Weisungsrecht gegenüber allen Ländern und ihren Behörden (Abs. 2). Ob zuvor das Bundesverfassungsgericht im Bund-Länder-Streit die Pflichtverletzung feststellen muss, ist nicht abschließend geklärt; das Verfahren nach Art. 93 Abs. 1 Nr. 3 GG ist jedenfalls der übliche Weg. Bundeszwang ist in der Praxis bisher nie angewandt worden.
  norms:
  - Art. 37 Abs. 1 GG
  - Art. 37 Abs. 2 GG
  - Art. 93 Abs. 1 Nr. 3 GG
  quellen:
  - GG, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-10
- slug: or-bw-streitkraefte-art87a
  type: norm
  front: "Welche Einsatzgrenzen gelten für die Streitkräfte nach Art. 87a und Art. 24 Abs. 2 GG?"
  back: >-
    Der Bund stellt Streitkräfte zur Verteidigung auf (Art. 87a Abs. 1 S. 1 GG). Außer zur Verteidigung dürfen sie nur eingesetzt werden, soweit das Grundgesetz es ausdrücklich zulässt (Art. 87a Abs. 2 GG, Enumerationsprinzip). Auslandseinsätze stützt das Bundesverfassungsgericht auf Art. 24 Abs. 2 GG: Der Bund kann sich zur Wahrung des Friedens einem System gegenseitiger kollektiver Sicherheit einordnen und darin in Beschränkungen seiner Hoheitsrechte einwilligen; dazu zählen die Vereinten Nationen und die NATO sowie vergleichbare Bündnisse, soweit sie strikt friedenssichernd ausgerichtet sind (BVerfGE 90, 286). Im Inneren sind Einsätze nur in den ausdrücklich geregelten Fällen zulässig, etwa bei Katastrophen und schweren Unglücksfällen (Art. 35 Abs. 2 und 3 GG), im Verteidigungs- und Spannungsfall sowie im inneren Notstand (Art. 87a Abs. 3 und 4 GG). Der Oberbefehl liegt im Frieden beim Verteidigungsminister, im Verteidigungsfall beim Bundeskanzler (Art. 65a, 115b GG).
  norms:
  - Art. 87a Abs. 1 GG
  - Art. 87a Abs. 2 GG
  - Art. 24 Abs. 2 GG
  - Art. 65a GG
  quellen:
  - GG, amtliche Fassung
  - BVerfGE 90, 286
  stand: 2026-10
- slug: or-bw-parlamentsvorbehalt-auslandseinsatz
  type: rechtsprechung
  front: "Warum bedarf der Auslandseinsatz bewaffneter Streitkräfte der Zustimmung des Bundestages (BVerfGE 90, 286)?"
  back: >-
    Das Bundesverfassungsgericht hat im Out-of-area-Urteil vom 12.07.1994 entschieden, dass der Einsatz bewaffneter Streitkräfte in einem System gegenseitiger kollektiver Sicherheit grundsätzlich der vorherigen konstitutiven Zustimmung des Bundestages bedarf (BVerfGE 90, 286). Der Parlamentsvorbehalt ergibt sich nicht aus einer ausdrücklichen Norm, sondern aus der Gesamtkonzeption der Wehrverfassung des Grundgesetzes: Die Streitkräfte sind als Parlamentsheer in die demokratische Ordnung eingebunden, der Bundestag hat Kontroll- und Mitentscheidungsbefugnisse (etwa Art. 45a, 45b, 87a Abs. 1 S. 2, Art. 115a GG). Der Einsatz bewaffneter Streitkräfte ist eine Entscheidung von besonderem Gewicht, die der Regierung nicht allein überlassen bleiben darf. Das Parlamentsbeteiligungsgesetz (ParlBG, 2005) konkretisiert das Verfahren. Das Gericht bestätigte den Vorbehalt für Einsätze, die im Rahmen eines Bündnisses die Einbeziehung in bewaffnete Unternehmungen erwarten lassen (BVerfGE 121, 135 – AWACS Türkei).
  norms:
  - Art. 24 Abs. 2 GG
  - Art. 87a Abs. 1 S. 2 GG
  - Art. 115a GG
  quellen:
  - GG, amtliche Fassung
  - ParlBG, amtliche Fassung
  - BVerfGE 90, 286
  - BVerfGE 121, 135
  stand: 2026-10
- slug: or-bw-parlbg-eilfall-rueckruf
  type: norm
  front: "Welche Ausnahmen und Rechte des Bundestages sieht das Parlamentsbeteiligungsgesetz vor?"
  back: >-
    Das Parlamentsbeteiligungsgesetz verlangt den Antrag der Bundesregierung auf Zustimmung des Bundestages vor dem Einsatz bewaffneter Streitkräfte im Ausland (§ 1 ParlBG). Einsätze geringer Intensität und Tragweite können in einem vereinfachten Verfahren zugestimmt werden (§ 4 ParlBG). Bei Gefahr im Verzug darf der Einsatz bereits vor der Zustimmung beginnen; der Antrag ist unverzüglich nachzuholen (§ 5 ParlBG). Einsätze zur Rettung von Menschen aus besonderer Gefahr für Leib oder Leben, bei denen die öffentliche Befassung die Rettung gefährden würde, bedürfen nur der nachträglichen Unterrichtung (§ 5 ParlBG). Der Bundestag kann die Zustimmung zu einem Einsatz widerrufen und den Rückruf der Streitkräfte verlangen (§ 8 ParlBG). Der Parlamentsvorbehalt gilt dabei nur für Einsätze, bei denen die konkrete Einbeziehung in bewaffnete Auseinandersetzungen zu erwarten ist; Hilfe im humanitären Bereich ohne Bewaffnung unterliegt ihm nicht.
  norms:
  - § 1 ParlBG
  - § 4 ParlBG
  - § 5 ParlBG
  - § 8 ParlBG
  quellen:
  - ParlBG, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-10
- slug: or-bw-rechtsschutz-parlamentsvorbehalt
  type: definition
  front: "Wie lässt sich der Parlamentsvorbehalt gerichtlich durchsetzen?"
  back: >-
    Verletzt die Bundesregierung den Parlamentsvorbehalt, kann dies im Organstreitverfahren nach Art. 93 Abs. 1 Nr. 1 GG, §§ 63 ff. BVerfGG geltend gemacht werden. Antragsteller kann eine Fraktion des Bundestages sein, die in Prozessstandschaft die Rechte des Bundestages als Gesamtorgan geltend macht (§ 64 Abs. 1 BVerfGG); sie muss ausdrücklich im eigenen Namen die Rechte des Bundestages rügen. Antragsgegner ist die Bundesregierung, Antragsgegenstand die Entsendung der Streitkräfte ohne Zustimmung. Einzelne Abgeordnete können Rechte des Bundestages nicht in Prozessstandschaft rügen. Die sechsmonatige Antragsfrist nach § 64 Abs. 3 BVerfGG ist zu beachten. Das Gericht stellt im Erfolgsfall nur die Verletzung fest (§ 67 BVerfGG) und hebt den Einsatz nicht auf. Der Eilrechtsschutz nach § 32 BVerfGG kommt in Betracht, wird aber wegen der außenpolitischen Tragweite zurückhaltend gewährt.
  norms:
  - Art. 93 Abs. 1 Nr. 1 GG
  - § 64 BVerfGG
  - § 67 BVerfGG
  quellen:
  - GG, amtliche Fassung
  - BVerfGG, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-10
