faelle:
- slug: or-fall-bw-fregatte-ohne-bundestag
  title: Die Fregatte ohne Bundestagsbeschluss
  difficulty: 3
  minutes: 45
  quellen:
  - Eigener Sachverhalt der Redaktion
  - GG, amtliche Fassung
  - BVerfGG, amtliche Fassung
  facts: >-
    Die Bundesregierung beschließt, eine Fregatte der Bundeswehr im Rahmen eines von der NATO geführten Einsatzes zum Schutz der Handelsschifffahrt in ein fernes Seegebiet zu entsenden. In dem Seegebiet kam es zuletzt wiederholt zu bewaffneten Angriffen auf Handelsschiffe. Die Besatzung soll Handelsschiffe notfalls mit Waffengewalt gegen Angriffe verteidigen. Der Beschluss fällt drei Wochen vor der geplanten Abfahrt; einen Antrag auf Zustimmung stellt die Bundesregierung nicht, da die Mehrheit im Bundestag ohnehin sicher sei. Eine Eilsituation oder ein Rettungseinsatz liegt nicht vor. Die Oppositionsfraktion F stellt zwei Monate später einen Organstreitantrag gegen die Bundesregierung und rügt ausdrücklich im eigenen Namen die Verletzung der Rechte des Bundestages.
  question: Ist der Antrag der F zulässig und begründet?
  steps:
  - prompt: Ist der Antrag zulässig?
    erwartung: Ja. F ist als Fraktion beteiligtenfähig, die Bundesregierung als oberstes Bundesorgan ebenfalls (Art. 93 Abs. 1 Nr. 1 GG). Die Entsendung ohne Zustimmung ist eine rechtserhebliche Maßnahme. F ist antragsbefugt, weil sie in Prozessstandschaft die Rechte des Bundestages geltend macht (§ 64 Abs. 1 BVerfGG) und ausdrücklich im eigenen Namen die Rechte des Bundestages rügt. Die Sechsmonatsfrist ist mit zwei Monaten gewahrt.
  - prompt: Bedarf der Einsatz der Zustimmung des Bundestages?
    erwartung: Ja. Der Einsatz bewaffneter Streitkräfte im Rahmen eines Systems gegenseitiger kollektiver Sicherheit (NATO, Art. 24 Abs. 2 GG) bedarf nach der Rechtsprechung (BVerfGE 90, 286) grundsätzlich der vorherigen konstitutiven Zustimmung des Bundestages. Hier ist die Einbeziehung in bewaffnete Unternehmungen zu erwarten, weil die Besatzung Waffengewalt anwenden soll.
  - prompt: Greift eine Ausnahme ein?
    erwartung: Nein. Es liegt weder Gefahr im Verzug noch ein Rettungseinsatz im Sinne des § 5 ParlBG vor; drei Wochen Vorlauf ließen eine Befassung zu. Dass eine Mehrheit im Bundestag sicher sei, ersetzt den formellen Beschluss nicht.
  - prompt: Mit welchem Ergebnis ist der Antrag begründet?
    erwartung: Der Antrag ist begründet. Die Bundesregierung hat die Rechte des Bundestages aus dem Parlamentsvorbehalt verletzt; das Gericht stellt dies fest, § 67 BVerfGG.
