cards:
- slug: or-gr-art14-schutzbereich
  type: definition
  front: Was schützt der sachliche Schutzbereich des Art. 14 Abs. 1 S. 1 GG?
  back: Art. 14 Abs. 1 S. 1 GG schützt das Eigentum als konkrete, vermögenswerte
    Rechtsposition, die dem Einzelnen von der Rechtsordnung so zugeordnet ist, dass
    er die Befugnisse zur Nutzung, zum Gebrauch und zur Verfügung über diese Position
    hat. Erfasst sind Sacheigentum ebenso wie sonstige vermögenswerte private Rechte
    (z. B. dingliche Rechte, Forderungen). Nicht geschützt sind bloße Erwerbschancen,
    Umsatz- und Gewinnaussichten oder das Vermögen als Ganzes.
  norms:
  - Art. 14 Abs. 1 GG
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: or-gr-art14-inhalts-schrankenbestimmung
  type: definition
  front: 'Definiere: Inhalts- und Schrankenbestimmung, Art. 14 Abs. 1 S. 2 GG'
  back: Eine Inhalts- und Schrankenbestimmung ist eine generell-abstrakte gesetzliche
    Regelung, die Rechte und Pflichten des Eigentümers für die Zukunft festlegt
    und damit den Inhalt des Eigentums als Institut und Rechtsverhältnis erst ausgestaltet
    - anders als die Enteignung entzieht sie keine bereits konkret zugeordnete Rechtsposition,
    sondern bestimmt allgemein, was 'Eigentum' im jeweiligen Regelungsbereich künftig
    bedeutet.
  norms:
  - Art. 14 Abs. 1 GG
  quellen:
  - GG, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: or-gr-art14-enteignung
  type: definition
  front: 'Definiere: Enteignung, Art. 14 Abs. 3 GG'
  back: Die Enteignung ist der vollständige oder teilweise, gezielte hoheitliche
    Entzug konkreter, durch Art. 14 Abs. 1 GG geschützter Eigentumspositionen zur
    Erfüllung bestimmter öffentlicher Aufgaben - entweder unmittelbar durch Gesetz
    (Legalenteignung) oder durch Verwaltungsakt aufgrund eines Gesetzes (Administrativenteignung,
    § 87 Abs. 1 der einschlägigen Fachgesetze). Sie setzt eine vollziehende Umsetzung
    in Form eines konkreten Zugriffs voraus, nicht nur eine abstrakte Neuregelung.
  norms:
  - Art. 14 Abs. 3 GG
  quellen:
  - GG, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: or-gr-art14-trennungstheorie
  type: streitstand
  front: Was besagt die Trennungstheorie des BVerfG zum Verhältnis von Inhalts- und
    Schrankenbestimmung und Enteignung?
  back: 'Nach der Trennungstheorie sind Inhalts- und Schrankenbestimmung (Art. 14
    Abs. 1 S. 2 GG) und Enteignung (Art. 14 Abs. 3 GG) zwei eigenständige, nicht
    ineinander überführbare Rechtsinstitute, die sich nach der Handlungsform des
    Normgebers unterscheiden: eine generell- abstrakte, zukunftsbezogene Neubestimmung
    des Eigentumsinhalts ist stets Inhalts- und Schrankenbestimmung, unabhängig davon,
    wie schwerwiegend sie den Einzelnen trifft - eine unverhältnismäßig belastende
    Inhaltsbestimmung wird also nicht automatisch zur Enteignung, sondern bleibt verfassungswidrige
    Inhaltsbestimmung.'
  norms:
  - Art. 14 Abs. 1 GG
  - Art. 14 Abs. 3 GG
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: or-gr-art14-junktimklausel
  type: norm
  front: Was verlangt die Junktimklausel des Art. 14 Abs. 3 S. 2 GG?
  back: Ein enteignendes Gesetz muss Art und Ausmaß der Entschädigung bereits selbst
    regeln, Art. 14 Abs. 3 S. 2 GG. Fehlt diese Regelung im Enteignungsgesetz selbst,
    ist die Ermächtigungsgrundlage bereits verfassungswidrig - eine spätere, gesonderte
    Entschädigungsregelung kann diesen Mangel nicht heilen. Die Junktimklausel soll
    sicherstellen, dass sich der Gesetzgeber der finanziellen Tragweite seiner Enteignungsentscheidung
    bewusst wird.
  norms:
  - Art. 14 Abs. 3 GG
  quellen:
  - GG, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: or-gr-art14-sozialbindung
  type: norm
  front: Was regelt Art. 14 Abs. 2 GG (Sozialbindung des Eigentums)?
  back: 'Eigentum verpflichtet; sein Gebrauch soll zugleich dem Wohle der Allgemeinheit
    dienen, Art. 14 Abs. 2 GG. Die Vorschrift ist kein eigenständiger Eingriffstatbestand,
    sondern eine Direktive an den Gesetzgeber bei der Ausgestaltung von Inhalts- und
    Schrankenbestimmungen: je stärker ein Eigentumsgegenstand in einem sozialen Bezug
    und einer sozialen Funktion steht, desto weitergehend darf der Gesetzgeber Nutzungsbefugnisse
    zugunsten der Allgemeinheit beschränken.'
  norms:
  - Art. 14 Abs. 2 GG
  quellen:
  - GG, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: or-gr-art14-ausgleichspflichtige-inhaltsbestimmung
  type: streitstand
  front: Was ist eine ausgleichspflichtige Inhaltsbestimmung?
  back: Erweist sich eine an sich zulässige Inhalts- und Schrankenbestimmung im Einzelfall
    als unverhältnismäßig belastend - etwa weil sie den Eigentümer im Vergleich
    zu anderen Betroffenen atypisch schwer trifft -, kann der Gesetzgeber die Verhältnismäßigkeit
    durch eine Ausgleichs- oder Übergangsregelung (z. B. finanzieller Ausgleich,
    Härteklauseln) wiederherstellen, statt die Regelung insgesamt zu verwerfen. Ohne
    eine solche Ausgleichsregelung ist die Inhaltsbestimmung unverhältnismäßig
    und damit verfassungswidrig - sie wird dadurch aber nach der Trennungstheorie
    nicht zur Enteignung.
  norms:
  - Art. 14 Abs. 1 GG
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
schemata:
- slug: or-schema-art14-eigentumsgarantie
  title: Prüfung des Art. 14 GG
  norms:
  - Art. 14 Abs. 1 GG
  - Art. 14 Abs. 2 GG
  - Art. 14 Abs. 3 GG
  quellen:
  - GG, amtliche Fassung
  - Eigenformulierung Redaktion
  steps:
  - label: I. Schutzbereich
    children:
    - label: '1. Persönlich: Jedermann, bei juristischen Personen Art. 19 Abs. 3
        GG'
    - label: '2. Sachlich: konkrete, vermögenswerte Rechtsposition, Art. 14 Abs.
        1 S. 1 GG'
  - label: II. Eingriff - Einordnung nach der Trennungstheorie
    children:
    - label: '1. Inhalts- und Schrankenbestimmung: generell-abstrakte, zukunftsbezogene
        Neubestimmung des Eigentumsinhalts, Art. 14 Abs. 1 S. 2 GG'
    - label: '2. Enteignung: vollständiger oder teilweiser, gezielter Entzug einer
        konkreten Eigentumsposition zur Erfüllung bestimmter öffentlicher Aufgaben,
        Art. 14 Abs. 3 GG'
  - label: III. Verfassungsrechtliche Rechtfertigung
    children:
    - label: '1. Bei Enteignung: gesetzliche Grundlage, Gemeinwohlgrund, Junktimklausel
        (Art. 14 Abs. 3 S. 2 GG), Verhältnismäßigkeit'
    - label: '2. Bei Inhalts- und Schrankenbestimmung: formelle und materielle Verfassungsmäßigkeit,
        Verhältnismäßigkeit unter Berücksichtigung der Sozialbindung (Art. 14
        Abs. 2 GG), ggf. Ausgleichspflicht'
  - label: IV. Ergebnis
faelle:
- slug: or-fall-strassenbau-enteignung-ohne-entschaedigungsregelung
  title: Die Grundstücksübertragung für den Bundesstraßenbau
  difficulty: 4
  minutes: 65
  quellen:
  - Eigener Sachverhalt der Redaktion
  - GG, amtliche Fassung
  facts: Ein (fiktives) Landesstraßenbaugesetz ermächtigt die Straßenbaubehörde,
    zur Verwirklichung eines konkreten Bundesstraßenbauvorhabens durch Verwaltungsakt
    das Eigentum an einzelnen benötigten Grundstücken auf den Straßenbaulastträger
    zu übertragen. Das Gesetz selbst enthält keinerlei Regelung über Art und Ausmaß
    einer Entschädigung; die Behörde verweist die betroffene Grundstückseigentümerin
    E auf ein "noch zu erlassendes gesondertes Entschädigungsgesetz". Gestützt auf
    diese Ermächtigung entzieht die Behörde der E durch Verwaltungsakt das Eigentum
    an ihrem Grundstück.
  question: Ist der Eigentumsentzug mit Art. 14 GG vereinbar?
  steps:
  - prompt: Ist der Schutzbereich des Art. 14 Abs. 1 GG eröffnet?
    erwartung: Ja - das Eigentum am Grundstück ist eine konkrete, vermögenswerte
      Rechtsposition der E.
  - prompt: Handelt es sich um eine Inhalts- und Schrankenbestimmung oder um eine
      Enteignung?
    erwartung: 'Um eine Enteignung, genauer eine Administrativenteignung: Die Behörde
      entzieht der E durch Verwaltungsakt gezielt eine konkrete Eigentumsposition
      zur Erfüllung einer bestimmten öffentlichen Aufgabe (Straßenbau) - keine
      generell-abstrakte Neuregelung des Eigentumsinhalts.'
  - prompt: Genügt die Ermächtigungsgrundlage den Anforderungen des Art. 14 Abs.
      3 GG?
    erwartung: Nein - das Gesetz selbst regelt weder Art noch Ausmaß einer Entschädigung
      und verstößt damit gegen die Junktimklausel des Art. 14 Abs. 3 S. 2 GG. Der
      Verweis auf ein erst noch zu erlassendes gesondertes Entschädigungsgesetz heilt
      diesen Mangel nicht.
  - prompt: Welche Folge hat der Verstoß gegen die Junktimklausel?
    erwartung: Die Ermächtigungsgrundlage ist bereits verfassungswidrig; der hierauf
      gestützte Eigentumsentzug ist damit ebenfalls rechtswidrig und verletzt die
      E in ihrem Grundrecht aus Art. 14 GG.
  expectation:
    pruefpunkte:
    - id: p1
      label: Schutzbereich des Art. 14 Abs. 1 GG bejaht
