- slug: or-fall-sev-sondernutzung-untersagung
  title: Die untersagte Außenbewirtung
  difficulty: 3
  minutes: 60
  quellen:
  - Eigener Sachverhalt der Redaktion
  - VwGO, amtliche Fassung
  - Eigenformulierung Redaktion
  facts: Die Stadt S untersagt der Gastronomie-GmbH G durch schriftlichen Bescheid die Sondernutzung
    des Gehwegs vor ihrem Lokal für Tische und Stühle. Sie stützt sich auf das Straßenrecht
    des Landes. Der Bescheid wird der G am 4. März bekanntgegeben und enthält eine ordnungsgemäße
    Rechtsbehelfsbelehrung. Im Land ist das Widerspruchsverfahren gegen solche Bescheide vorgeschrieben.
    Der Geschäftsführer der G legt am 2. April Widerspruch bei der S ein. Die zuständige Widerspruchsbehörde
    weist den Widerspruch zurück; der Widerspruchsbescheid wird am 23. Mai zugestellt. Am
    20. Juni erhebt G Klage auf Aufhebung des Bescheids „gegen den Oberbürgermeister der Stadt
    S“. Alle Fristen enden an einem Werktag. Nach dem Landesrecht ist der Rechtsträger zu
    verklagen (Rechtsträgerprinzip).
  question: Ist die Klage der G zulässig? Prüfen Sie Rechtsweg, Beteiligten- und Prozessfähigkeit,
    Klagebefugnis, Vorverfahren und den richtigen Beklagten.
  steps:
  - prompt: Ist der Verwaltungsrechtsweg eröffnet?
    erwartung: Ja. Streitentscheidend ist das Straßenrecht, das die Stadt als Trägerin hoheitlicher
      Gewalt berechtigt (modifizierte Subjektstheorie); die Untersagung ergeht durch Verwaltungsakt.
      Streit nichtverfassungsrechtlicher Art, keine abdrängende Sonderzuweisung, § 40 Abs.
      1 S. 1 VwGO.
  - prompt: Ist G beteiligten- und prozessfähig, und ist sie klagebefugt?
    erwartung: Als juristische Person ist G beteiligtenfähig (§ 61 Nr. 1 Var. 2 VwGO) und
      handelt durch ihren Geschäftsführer (§ 62 Abs. 3 VwGO). Als Adressatin des belastenden
      Verwaltungsakts ist sie über Art. 2 Abs. 1 GG bzw. Art. 12 GG klagebefugt (Adressatentheorie),
      § 42 Abs. 2 VwGO.
  - prompt: Wurde das Vorverfahren ordnungsgemäß durchgeführt?
    erwartung: Ja. Die Widerspruchsfrist von einem Monat nach Bekanntgabe (§ 70 Abs. 1 VwGO)
      lief bis zum 4. April; der Widerspruch vom 2. April war fristgerecht und bei der Ausgangsbehörde
      eingelegt. Der Widerspruchsbescheid liegt vor. Die Klagefrist (§ 74 Abs. 1 S. 1 VwGO)
      lief bis zum 23. Juni; die Klage vom 20. Juni ist fristgerecht.
  - prompt: Wer ist richtiger Beklagter?
    erwartung: Nach dem Rechtsträgerprinzip (§ 78 Abs. 1 Nr. 1 VwGO) ist die Stadt S zu verklagen,
      nicht der Oberbürgermeister. Die Bezeichnung ist durch Auslegung (§ 88 VwGO) als Klage gegen die Stadt zu verstehen und im Rubrum zu berichtigen. Die Klage ist daher insgesamt zulässig.
  expectation:
    pruefpunkte:
    - id: p1
      label: Verwaltungsrechtsweg nach § 40 Abs. 1 S. 1 VwGO bejaht (öffentlich-rechtliche
        Streitigkeit nach Sonderrechtstheorie)
      weight: 2.0
      required: true
      norms:
