- slug: or-schema-vwgo-sev-sachentscheidungsvoraussetzungen
  title: Sachentscheidungsvoraussetzungen der verwaltungsgerichtlichen Klage
  norms:
  - § 40 Abs. 1 VwGO
  - § 42 Abs. 2 VwGO
  - § 61 VwGO
  - § 62 VwGO
  - § 68 VwGO
  - § 78 VwGO
  quellen:
  - VwGO, amtliche Fassung
  - Eigenformulierung Redaktion
  steps:
  - label: I. Verwaltungsrechtsweg
    children:
    - label: 1. Aufdrängende Sonderzuweisung (z. B. § 126 Abs. 1 BBG)
    - label: 2. Öffentlich-rechtliche Streitigkeit, § 40 Abs. 1 S. 1 VwGO
      hinweis: Modifizierte Subjektstheorie; bei Doppelcharakter Zwei-Stufen-Theorie beachten.
    - label: 3. Nichtverfassungsrechtlicher Art (doppelte Verfassungsunmittelbarkeit)
    - label: 4. Keine abdrängende Sonderzuweisung (§ 40 Abs. 2 VwGO, Art. 34 S. 3 GG)
  - label: II. Statthafte Klageart (§ 88 VwGO)
  - label: III. Klagebefugnis, § 42 Abs. 2 VwGO
    hinweis: Adressatentheorie bei Belastung des Adressaten, Schutznormtheorie bei Dritten.
  - label: IV. Beteiligten- und Prozessfähigkeit, §§ 61, 62 VwGO
  - label: V. Richtiger Klagegegner, § 78 VwGO
    hinweis: Rechtsträgerprinzip; Behördenprinzip nur, wenn Landesrecht dies bestimmt.
  - label: VI. Vorverfahren, §§ 68 ff. VwGO
    children:
    - label: 1. Erforderlich? (Landesrecht; § 68 Abs. 1 S. 2 VwGO)
    - label: 2. Widerspruch statthaft, widerspruchsbefugt, Form und Frist, § 70 VwGO
  - label: VII. Klagefrist, § 74 VwGO
  - label: VIII. Beiladung, § 65 VwGO
    hinweis: Keine Sachentscheidungsvoraussetzung, aber verfahrensrechtlich zu beachten.
