cards:
- slug: or-vwgo-vk-statthaftigkeit
  type: definition
  front: Wann ist die Verpflichtungsklage statthafte Klageart, § 42 Abs. 1 Var. 2
    VwGO?
  back: 'Die Verpflichtungsklage ist statthaft, wenn der Klaeger nach seinem Vorbringen
    die Verurteilung der Behoerde zum Erlass eines von ihr abgelehnten oder unterlassenen
    Verwaltungsakts begehrt. Sie zerfaellt in zwei Varianten: die Versagungsgegenklage
    (die Behoerde hat den Antrag ausdruecklich abgelehnt) und die Untaetigkeitsklage
    (die Behoerde hat ueber den Antrag gar nicht entschieden, § 75 VwGO).'
  norms:
  - § 42 Abs. 1 VwGO
  quellen:
  - VwGO, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: or-vwgo-vk-versagungsgegenklage-untaetigkeitsklage
  type: definition
  front: Grenze Versagungsgegenklage und Untaetigkeitsklage voneinander ab
  back: Bei der Versagungsgegenklage ist ueber den Antrag bereits durch Ablehnungsbescheid
    entschieden worden; sie setzt regelmaessig ein erfolglos durchgefuehrtes Vorverfahren
    voraus. Bei der Untaetigkeitsklage nach § 75 VwGO hat die Behoerde ueber einen
    Antrag oder Widerspruch ohne zureichenden Grund innerhalb angemessener Frist nicht
    entschieden; hier ersetzt der blosse Zeitablauf das sonst erforderliche Vorverfahren
    bzw. den Erlass eines Bescheids.
  norms:
  - § 42 Abs. 1 VwGO
  - § 75 VwGO
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: or-vwgo-vk-klagebefugnis
  type: definition
  front: Wie wird die Klagebefugnis bei der Verpflichtungsklage begruendet, § 42 Abs.
    2 VwGO analog?
  back: Klagebefugt ist, wer geltend macht, moeglicherweise einen Anspruch auf den
    begehrten Verwaltungsakt zu haben - sei es aus einer gebundenen Norm oder aus
    einem Anspruch auf ermessens- bzw. beurteilungsfehlerfreie Entscheidung. Wie bei
    der Anfechtungsklage genuegt nach der Moeglichkeitstheorie, dass ein solcher Anspruch
    nicht offensichtlich und eindeutig ausgeschlossen ist.
  norms:
  - § 42 Abs. 2 VwGO
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: or-vwgo-vk-untaetigkeitsklage-sperrfrist
  type: norm
  front: Welche Sperrfrist gilt fuer die Untaetigkeitsklage, § 75 S. 2 VwGO?
  back: Die Klage darf grundsaetzlich nicht vor Ablauf von drei Monaten seit Antragstellung
    oder Einlegung des Widerspruchs erhoben werden, § 75 S. 2 VwGO, es sei denn, es
    liegt wegen besonderer Umstaende des Falles ein kuerzerer Zeitraum nahe. Hat die
    Behoerde der Fristsetzung einen zureichenden Grund fuer die Nichtentscheidung
    mitgeteilt, kann das Gericht das Verfahren aussetzen, § 75 S. 3 VwGO.
  norms:
  - § 75 VwGO
  quellen:
  - VwGO, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: or-vwgo-vk-klagefrist-versagungsgegenklage
  type: norm
  front: Welche Klagefrist gilt bei der Versagungsgegenklage?
  back: Wie bei der Anfechtungsklage ist die Versagungsgegenklage innerhalb eines
    Monats nach Zustellung des ablehnenden Widerspruchsbescheids zu erheben, § 74
    Abs. 2 i.V.m. Abs. 1 VwGO; ist ausnahmsweise kein Vorverfahren erforderlich, laeuft
    die Frist ab Bekanntgabe des Ablehnungsbescheids. Bei der Untaetigkeitsklage nach
    § 75 VwGO gilt demgegenueber keine Klagefrist in diesem Sinne, da noch kein bestandskraeftiger
    Bescheid vorliegt.
  norms:
  - § 74 Abs. 2 VwGO
  - § 74 Abs. 1 VwGO
  quellen:
  - VwGO, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: or-vwgo-vk-bescheidungs-vornahmeurteil
  type: streitstand
  front: Unterscheide Vornahmeurteil und Bescheidungsurteil, § 113 Abs. 5 VwGO
  back: Ist die Sache spruchreif und steht dem Klaeger der begehrte Anspruch zu, verurteilt
    das Gericht die Behoerde zum Erlass des beantragten Verwaltungsakts (Vornahmeurteil,
    § 113 Abs. 5 S. 1 VwGO). Fehlt es an der Spruchreife - etwa weil der Behoerde
    Ermessen oder ein Beurteilungsspielraum zusteht und dessen fehlerfreie Ausuebung
    noch aussteht - verurteilt das Gericht die Behoerde nur zur erneuten Bescheidung
    unter Beachtung der Rechtsauffassung des Gerichts (Bescheidungsurteil, § 113 Abs.
    5 S. 2 VwGO).
  norms:
  - § 113 Abs. 5 VwGO
  quellen:
  - VwGO, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
