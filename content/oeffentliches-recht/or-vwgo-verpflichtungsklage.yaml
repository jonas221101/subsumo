faelle:
- slug: or-fall-baugenehmigung-untaetigkeitsklage
  title: Die unbeantwortete Bauantrag
  difficulty: 4
  minutes: 60
  quellen:
  - Eigener Sachverhalt der Redaktion
  - VwGO, amtliche Fassung
  facts: A beantragt bei der zustaendigen Bauaufsichtsbehoerde die Erteilung einer
    Baugenehmigung fuer ein Wohnhaus. Vier Monate nach vollstaendiger Antragstellung
    hat die Behoerde weder entschieden noch A einen zureichenden Grund fuer die Verzoegerung
    mitgeteilt. A moechte nun unmittelbar Klage auf Erteilung der Baugenehmigung erheben,
    ohne zuvor ein foermliches Vorverfahren durchlaufen zu haben.
  question: Ist eine solche Klage des A zulaessig?
  steps:
  - prompt: Welche Klageart ist statthaft?
    erwartung: Die Verpflichtungsklage, § 42 Abs. 1 Var. 2 VwGO, in der Variante der
      Untaetigkeitsklage, § 75 VwGO - A begehrt den Erlass eines bislang unterlassenen
      Verwaltungsakts.
  - prompt: Ist ein Vorverfahren vor Klageerhebung erforderlich?
    erwartung: Nein - bei der Untaetigkeitsklage tritt an die Stelle des Vorverfahrens
      der Ablauf der Sperrfrist des § 75 S. 2 VwGO.
  - prompt: Ist die Sperrfrist des § 75 S. 2 VwGO abgelaufen?
    erwartung: Ja - seit Antragstellung sind vier Monate vergangen und damit mehr
      als die Regelfrist von drei Monaten; ein zureichender Grund fuer die Verzoegerung
      wurde A nicht mitgeteilt.
  - prompt: Ist A klagebefugt?
    erwartung: Ja - A macht geltend, moeglicherweise einen Anspruch auf die Baugenehmigung
      zu haben; dieser Anspruch ist nicht von vornherein offensichtlich ausgeschlossen.
  expectation:
    pruefpunkte:
    - id: p1
      label: Verpflichtungsklage als statthafte Klageart in der Variante der Untaetigkeitsklage
        erkannt
      weight: 2.5
      required: true
      norms:
      - § 42 Abs. 1 VwGO
      - § 75 VwGO
      keywords:
      - Verpflichtungsklage
      - Untaetigkeitsklage
      - § 75
    - id: p2
      label: Sperrfrist des § 75 S. 2 VwGO (drei Monate) korrekt angewandt und als
        abgelaufen erkannt
      weight: 3.0
      required: true
      norms:
      - § 75 VwGO
      keywords:
      - Sperrfrist
      - drei Monate
      - zureichender Grund
    - id: p3
      label: Kein Vorverfahren vor Klageerhebung erforderlich, da Sperrfrist an dessen
        Stelle tritt
      weight: 1.5
      required: false
      keywords:
      - Vorverfahren
      - entbehrlich
    - id: p4
      label: Klagebefugnis nach der Moeglichkeitstheorie bejaht
      weight: 1.5
      required: false
      keywords:
      - Klagebefugnis
      - moeglich
    - id: p5
      label: 'Ergebnis: Klage ist zulaessig'
      weight: 1.0
      required: false
      keywords:
      - zulaessig
