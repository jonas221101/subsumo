faelle:
- slug: or-fall-baugenehmigung-untaetigkeitsklage
  title: Die unbeantwortete Bauantrag
  difficulty: 4
  minutes: 60
  quellen:
  - Eigener Sachverhalt der Redaktion
  - VwGO, amtliche Fassung
  facts: A beantragt bei der zuständigen Bauaufsichtsbehörde die Erteilung einer
    Baugenehmigung für ein Wohnhaus. Vier Monate nach vollständiger Antragstellung
    hat die Behörde weder entschieden noch A einen zureichenden Grund für die Verzögerung
    mitgeteilt. A möchte nun unmittelbar Klage auf Erteilung der Baugenehmigung erheben,
    ohne zuvor ein förmliches Vorverfahren durchlaufen zu haben.
  question: Ist eine solche Klage des A zulässig?
  steps:
  - prompt: Welche Klageart ist statthaft?
    erwartung: Die Verpflichtungsklage, § 42 Abs. 1 Var. 2 VwGO, in der Variante der
      Untätigkeitsklage, § 75 VwGO - A begehrt den Erlass eines bislang unterlassenen
      Verwaltungsakts.
  - prompt: Ist ein Vorverfahren vor Klageerhebung erforderlich?
    erwartung: Nein - bei der Untätigkeitsklage tritt an die Stelle des Vorverfahrens
      der Ablauf der Sperrfrist des § 75 S. 2 VwGO.
  - prompt: Ist die Sperrfrist des § 75 S. 2 VwGO abgelaufen?
    erwartung: Ja - seit Antragstellung sind vier Monate vergangen und damit mehr
      als die Regelfrist von drei Monaten; ein zureichender Grund für die Verzögerung
      wurde A nicht mitgeteilt.
  - prompt: Ist A klagebefugt?
    erwartung: Ja - A macht geltend, möglicherweise einen Anspruch auf die Baugenehmigung
      zu haben; dieser Anspruch ist nicht von vornherein offensichtlich ausgeschlossen.
