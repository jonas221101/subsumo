cards:
- slug: or-vwvfg-va-begriff
  type: definition
  front: 'Definiere: Verwaltungsakt, § 35 S. 1 VwVfG'
  back: Ein Verwaltungsakt ist jede Verfügung, Entscheidung oder andere hoheitliche
    Maßnahme, die eine Behörde zur Regelung eines Einzelfalls auf dem Gebiet des
    öffentlichen Rechts trifft und die auf unmittelbare Rechtswirkung nach außen
    gerichtet ist. Diese fünf Merkmale müssen kumulativ vorliegen.
  norms:
  - § 35 VwVfG
  quellen:
  - VwVfG, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: or-vwvfg-va-hoheitliche-massnahme
  type: definition
  front: Wann handelt eine Behörde 'hoheitlich' i.S.d. § 35 VwVfG?
  back: Hoheitlich handelt eine Behörde, wenn sie einseitig kraft oeffentlich-rechtlicher
    Befugnis auftritt - im Unterschied zum Handeln in Formen des Privatrechts (etwa
    beim fiskalischen Hilfsgeschäft) oder zu schlicht tatsächlichem Verwaltungshandeln
    ohne Regelungsanspruch. Die Behörde muss dem Bürger in einem Über-/Unterordnungsverhältnis
    gegenübertreten.
  norms:
  - § 35 VwVfG
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: or-vwvfg-va-regelung-abgrenzung-realakt
  type: definition
  front: 'Definiere: ''Regelung'' i.S.d. § 35 VwVfG und grenze sie vom Realakt ab'
  back: Eine Regelung liegt vor, wenn die Maßnahme auf die Setzung einer verbindlichen
    Rechtsfolge gerichtet ist - Begründung, Änderung, Aufhebung oder verbindliche
    Feststellung eines Rechtsverhältnisses. Daran fehlt es beim Realakt, der nur
    eine tatsächliche Wirkung entfaltet, ohne selbst eine Rechtsfolge auszusprechen
    (z. B. die tatsächliche Durchführung einer angeordneten Maßnahme, eine unverbindliche
    Auskunft oder ein bloßer Hinweis).
  norms:
  - § 35 VwVfG
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: or-vwvfg-va-einzelfall-allgemeinverfuegung
  type: norm
  front: Was ist eine Allgemeinverfügung, § 35 S. 2 VwVfG?
  back: Die Allgemeinverfügung ist ein Verwaltungsakt, der sich an einen nach allgemeinen
    Merkmalen bestimmten oder bestimmbaren Personenkreis richtet (personenbezogene
    Allgemeinverfügung) oder die oeffentlich-rechtliche Eigenschaft einer Sache oder
    ihre Benutzung durch die Allgemeinheit betrifft (sachbezogene Allgemeinverfügung).
    Sie ist trotz der Vielzahl Betroffener weiterhin ein Einzelfall i.S.d. § 35 S.
    1 VwVfG, keine abstrakt-generelle Regelung wie eine Rechtsnorm.
  norms:
  - § 35 VwVfG
  quellen:
  - VwVfG, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: or-vwvfg-va-aussenwirkung
  type: definition
  front: Wann fehlt es an der Außenwirkung einer behördlichen Maßnahme?
  back: Außenwirkung fehlt bei rein verwaltungsinternen Maßnahmen, die sich innerhalb
    eines Über-/Unterordnungsverhältnisses derselben Verwaltungsorganisation erschöpfen
    und keinen Außenstehenden unmittelbar in eigenen Rechten betreffen - etwa Weisungen
    an nachgeordnete Behörden oder Dienstanweisungen an Beamte in ihrer Funktion
    als Amtsträger. Betrifft die Maßnahme den Beamten hingegen in seiner Rechtsstellung
    als Grundrechtsträger (z. B. eine Disziplinarmaßnahme), liegt Außenwirkung
    vor.
  norms:
  - § 35 VwVfG
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: or-vwvfg-va-nichtigkeit
  type: norm
  front: Wann ist ein Verwaltungsakt nichtig, § 44 Abs. 1 VwVfG?
  back: Ein Verwaltungsakt ist nichtig, soweit er an einem besonders schwerwiegenden
    Fehler leidet und dies bei verständiger Würdigung aller in Betracht kommenden
    Umstände offensichtlich ist, § 44 Abs. 1 VwVfG. § 44 Abs. 2 VwVfG nennt hierzu
    nicht abschließende Regelbeispiele (z. B. schriftlicher Erlass ohne erkennbare
    erlassende Behörde, Verstoß gegen die guten Sitten), § 44 Abs. 3 VwVfG Gegenbeispiele,
    die für sich allein die Nichtigkeit gerade nicht begründen.
  norms:
  - § 44 Abs. 1 VwVfG
  - § 44 Abs. 2 VwVfG
  - § 44 Abs. 3 VwVfG
  quellen:
  - VwVfG, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: or-vwvfg-va-formelle-materielle-rechtmaessigkeit
  type: schema_step
  front: Nenne die zwei Ebenen der Rechtmäßigkeitsprüfung eines Verwaltungsakts
  back: 'Formelle Rechtmäßigkeit: Zuständigkeit der handelnden Behörde, ordnungsgemäßes
    Verfahren (insbesondere Anhörung, § 28 VwVfG) und Form. Materielle Rechtmäßigkeit:
    Vorliegen einer tauglichen Ermächtigungsgrundlage, Erfüllung ihrer Tatbestandsvoraussetzungen
    und rechtmäßige Rechtsfolge - bei Ermessensnormen zusätzlich fehlerfreie Ermessensausübung,
    § 40 VwVfG. Ein Verstoß gegen eine der beiden Ebenen macht den Verwaltungsakt
    rechtswidrig, führt aber nur bei Erreichen der Schwelle des § 44 VwVfG zur Nichtigkeit.'
  norms:
  - § 28 VwVfG
  - § 40 VwVfG
  - § 44 Abs. 1 VwVfG
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
schemata:
- slug: or-schema-vwvfg-va-vorliegen
  title: Liegt ein Verwaltungsakt vor?, § 35 VwVfG
  norms:
  - § 35 VwVfG
  quellen:
  - VwVfG, amtliche Fassung
  - Eigenformulierung Redaktion
  steps:
  - label: I. Hoheitliche Maßnahme einer Behörde
    hinweis: Behördenbegriff, § 1 Abs. 4 VwVfG - jede Stelle, die Aufgaben der öffentlichen
      Verwaltung wahrnimmt.
  - label: II. Auf dem Gebiet des öffentlichen Rechts
  - label: III. Regelung
    children:
    - label: Setzung einer verbindlichen Rechtsfolge - Abgrenzung zum Realakt (keine
        Rechtsfolge) und zur unverbindlichen Auskunft
  - label: IV. Einzelfall
    children:
    - label: auch als Allgemeinverfügung, § 35 S. 2 VwVfG, möglich
  - label: V. Außenwirkung
    hinweis: Unmittelbare Rechtswirkung gegenüber einem der Verwaltung nicht organisatorisch
      eingegliederten Außenstehenden.
  - label: VI. Ergebnis
faelle:
- slug: or-fall-duldungsverfuegung-vermessung
  title: Die Duldungsverfügung der Katasterbehörde
  difficulty: 3
  minutes: 45
  quellen:
  - Eigener Sachverhalt der Redaktion
  - VwVfG, amtliche Fassung
  facts: Die zuständige Katasterbehörde ordnet gegenüber dem Grundstückseigentümer
    E schriftlich an, dass er die Betretung seines Grundstücks durch Vermessungspersonal
    am 15. des Monats zur Durchführung einer Grenzvermessung zu dulden habe (Duldungsverfügung),
    gestützt auf eine gesetzliche Ermächtigung. E meint, hierbei handele es sich
    lediglich um die Ankündigung eines rein tatsächlichen Vorgangs, gegen den er
    sich nicht gesondert zur Wehr setzen könne.
  question: Ist die Duldungsverfügung ein Verwaltungsakt i.S.d. § 35 VwVfG?
  steps:
  - prompt: Liegt eine hoheitliche Maßnahme einer Behörde vor?
    erwartung: Ja - die Katasterbehörde ist Behörde i.S.d. § 1 Abs. 4 VwVfG und
      handelt einseitig kraft oeffentlich-rechtlicher Befugnis.
  - prompt: Liegt eine Regelung vor, oder handelt es sich nur um einen Realakt?
    erwartung: Die Duldungsverfügung selbst ist eine Regelung, da sie verbindlich
      eine Duldungspflicht des E begründet. Die spätere tatsächliche Vermessung
      dagegen ist ein Realakt ohne eigenen Regelungscharakter.
  - prompt: Liegt ein Einzelfall vor?
    erwartung: Ja - die Anordnung richtet sich an den individuell bestimmten E hinsichtlich
      eines konkreten Grundstücks.
  - prompt: Liegt Außenwirkung vor?
    erwartung: Ja - E ist als Grundstückseigentümer ein der Verwaltung nicht eingegliederter
      Außenstehender, der unmittelbar in seiner Rechtsstellung (Duldungspflicht)
      betroffen wird.
