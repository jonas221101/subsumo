- slug: or-schema-kr-aw-wirtschaftliche-betaetigung
  title: Zulässigkeit der wirtschaftlichen Betätigung einer Gemeinde
  norms:
  - Art. 28 Abs. 2 S. 1 GG
  quellen:
  - GG, amtliche Fassung
  - Gemeindeordnungen der Länder (Landesrechtsportale)
