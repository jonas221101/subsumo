topic:
  slug: or-kommunalrecht-aufsicht-wirtschaft
  area: oeffentliches-recht
  title: Kommunalaufsicht und wirtschaftliche Betätigung der Gemeinde
  parent: oeffentliches-recht
  relevance: 4
  stand: 2026-10
  redaktion:
    erzeugt_von: claude-sonnet (Pflichtstoff-Vervollständigung)
    status: in-pruefung
    normzitate_geprueft: false
cards:
- slug: or-kr-aw-aufsicht-arten
  type: definition
  front: Wie unterscheiden sich Rechtsaufsicht und Fachaufsicht über die Gemeinden?
  back: >-
    Die Kommunalaufsicht sichert, dass die Gemeinden im Einklang mit dem Recht handeln. Bei Selbstverwaltungsaufgaben
    (eigener Wirkungskreis, weisungsfreie Aufgaben) beschränkt sie sich auf die Rechtsaufsicht: Geprüft wird
    nur die Rechtmäßigkeit, nicht die Zweckmäßigkeit des gemeindlichen Handelns. Das folgt aus Art. 28
    Abs. 2 GG, der der Gemeinde ein Eigenverantwortungsrecht gibt. Bei übertragenen Aufgaben (übertragener
    Wirkungskreis, Weisungsaufgaben) tritt die Fachaufsicht hinzu: Die Fachaufsichtsbehörde kann auch die
    Zweckmäßigkeit überprüfen und Weisungen erteilen. Aufsichtsbehörden sind je nach Land das Landratsamt
    oder die Bezirksregierung (untere und obere) und das Innenministerium. Das Aufsichtsverhältnis
    besteht zwischen Staat und Gemeinde als Rechtsträgern.
  norms:
  - Art. 28 Abs. 2 S. 1 GG
  quellen:
  - Gemeindeordnungen der Länder (Landesrechtsportale)
  - Eigenformulierung Redaktion
  stand: 2026-10
- slug: or-kr-aw-aufsichtsmittel
  type: definition
  front: Welche Aufsichtsmittel stehen der Kommunalaufsicht zur Verfügung?
  back: >-
    Die Gemeindeordnungen sehen ein abgestuftes Instrumentarium vor. Zunächst kann die Aufsichtsbehörde sich
    unterrichten lassen und Auskünfte, Berichte und Akteneinsicht verlangen (Informationsrecht). Ergeben sich
    Rechtsverstöße, kann sie Beschlüsse und Anordnungen der Gemeinde beanstanden und die Aufhebung verlangen
    (Beanstandung). Unterlässt die Gemeinde eine ihr obliegende gesetzliche Pflicht, kann die Behörde sie
    anweisen, die erforderlichen Maßnahmen zu treffen (Anordnung). Kommt die Gemeinde dem nicht nach, ist die
    Ersatzvornahme durch die Aufsichtsbehörde oder einen Beauftragten zulässig. Als schärfstes Mittel kann ein
    Beauftragter bestellt werden, der Aufgaben der Gemeinde an deren Stelle wahrnimmt, wenn die Ersatzvornahme
    nicht ausreicht. Die Aufsichtsbehörde handelt nach pflichtgemäßem Ermessen (Opportunitätsprinzip); die
    Mittel müssen verhältnismäßig sein, und es gilt der Grundsatz der kommunalfreundlichen Aufsicht.
  norms:
  - Art. 28 Abs. 2 S. 1 GG
  quellen:
  - Gemeindeordnungen der Länder (Landesrechtsportale)
  - Eigenformulierung Redaktion
  stand: 2026-10
- slug: or-kr-aw-aufsicht-genehmigungsvorbehalt
  type: norm
  front: Welche Bedeutung haben Genehmigungs- und Anzeigepflichten gegenüber der Aufsichtsbehörde?
  back: >-
    Für bedeutsame Entscheidungen der Gemeinden sehen die Gemeindeordnungen vorbeugende Aufsicht vor. Bestimmte
    Rechtsgeschäfte und Satzungen bedürfen der Genehmigung der Aufsichtsbehörde, andere müssen angezeigt
    werden; typische Beispiele sind der Gesamtbetrag der Kreditaufnahmen in der Haushaltssatzung, die
    Übernahme von Bürgschaften und die Gründung oder Beteiligung an wirtschaftlichen Unternehmen. Eine
    Genehmigung ist ein Verwaltungsakt, der der Gemeinde gegenüber ergeht und deren Maßnahme erst wirksam
    macht; ohne die erforderliche Genehmigung ist die Maßnahme schwebend unwirksam. Die Behörde prüft
    grundsätzlich nur die Rechtmäßigkeit; einen Ermessensspielraum hat sie nur, wenn das Gesetz ihn ausdrücklich
    einräumt. Die Verweigerung der Genehmigung kann die Gemeinde mit der Verpflichtungsklage angreifen.
  norms:
  - Art. 28 Abs. 2 GG
  - § 35 VwVfG
  quellen:
  - Gemeindeordnungen der Länder (Landesrechtsportale)
  - Eigenformulierung Redaktion
  stand: 2026-10
- slug: or-kr-aw-rechtsschutz-gemeinde
  type: streitstand
  front: Welche Rechtsschutzmöglichkeiten hat die Gemeinde gegen Maßnahmen der Kommunalaufsicht, und handelt es sich um Verwaltungsakte?
  back: >-
    Die Aufsichtsbehörde handelt gegenüber der Gemeinde als selbständigem Rechtssubjekt. Maßnahmen der
    Rechtsaufsicht (Beanstandung, Anordnung, Ersatzvornahme) in Selbstverwaltungsangelegenheiten sind nach der
    ganz h. M. Verwaltungsakte, weil sie in die Rechtsstellung der Gemeinde aus Art. 28 Abs. 2 GG eingreifen
    und damit Außenwirkung haben. Die Gemeinde klagt mit der Anfechtungsklage (bei Ablehnung einer
    Genehmigung mit der Verpflichtungsklage); klagebefugt ist sie aus Art. 28 Abs. 2 GG. Beklagter ist das
    Land bzw. die Aufsichtsbehörde je nach § 78 Abs. 1 VwGO und Landesrecht. Fachaufsichtliche Weisungen im
    übertragenen Wirkungskreis sind nach h. M. keine Verwaltungsakte, weil die Gemeinde hier nur
    Verwaltungsträgerin des Staates ist und keine eigene Rechtsstellung hat; Rechtsschutz besteht nur in
    Ausnahmefällen, wenn die Weisung in den Kernbereich der Selbstverwaltung eingreift oder die Grenzen der
    Fachaufsicht überschreitet (dann Feststellungsklage).
  norms:
  - Art. 28 Abs. 2 GG
  - § 35 VwVfG
  - § 42 VwGO
  - § 43 VwGO
  quellen:
  - VwGO, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-10
- slug: or-kr-aw-kein-drittschutz
  type: definition
  front: Hat ein Dritter einen Anspruch auf Einschreiten der Kommunalaufsicht?
  back: >-
    Grundsätzlich nicht. Die Kommunalaufsicht dient dem öffentlichen Interesse an der Rechtmäßigkeit des
    gemeindlichen Handelns und der Funktionsfähigkeit der Selbstverwaltung; sie schützt nicht die Rechte
    einzelner Bürger. Bürger können Anregungen geben (Aufsichtsbeschwerde als formloser Rechtsbehelf) und
    erhalten ein Recht auf Bescheidung, aber keinen Anspruch auf ein bestimmtes Einschreiten. Eine
    Ausnahme kann bestehen, wenn die Aufsichtsbehörde bei einer gravierenden, schwerwiegenden
    Rechtsverletzung zum Schutz einer drittschützenden Norm einschreiten müsste und ihr Ermessen daher auf Null
    reduziert ist; das wird nur selten angenommen. Der Betroffene ist auf den Rechtsschutz gegen die
    Gemeinde selbst verwiesen (Unterlassungs- oder Leistungsklage, Anfechtung des konkreten Verwaltungsakts).
  norms:
  - Art. 28 Abs. 2 GG
  quellen:
  - Gemeindeordnungen der Länder (Landesrechtsportale)
  - Eigenformulierung Redaktion
  stand: 2026-10
- slug: or-kr-aw-wirtschaft-schrankentrias
  type: norm
  front: Unter welchen Voraussetzungen darf sich die Gemeinde wirtschaftlich betätigen (Schrankentrias)?
  back: >-
    Die Gemeindeordnungen lassen wirtschaftliche Unternehmen der Gemeinde nur unter Schranken zu, die sich in
    drei Voraussetzungen zusammenfassen lassen. Erstens muss ein öffentlicher Zweck die Betätigung rechtfertigen;
    die bloße Gewinnerzielung genügt nicht, sie darf aber als Nebenzweck verfolgt werden. Zweitens muss die
    Betätigung nach Art und Umfang in einem angemessenen Verhältnis zur Leistungsfähigkeit der Gemeinde und zum
    voraussichtlichen Bedarf stehen. Drittens gilt die Subsidiaritätsklausel: Der Zweck darf nicht ebenso gut
    oder wirtschaftlich durch einen privaten Dritten erreicht werden können; die Ausgestaltung (einfache oder
    qualifizierte Subsidiarität) unterscheidet sich je nach Land. Nicht erfasst sind die Einrichtungen, die
    das Gesetz nicht als wirtschaftliche Betätigung ansieht (Bildung, Kultur, Gesundheit, Sozialwesen u. a.;
    Negativkataloge der Länder), und Hilfsbetriebe.
  norms:
  - Art. 28 Abs. 2 S. 1 GG
  quellen:
  - Gemeindeordnungen der Länder (Landesrechtsportale)
  - Eigenformulierung Redaktion
  stand: 2026-10
- slug: or-kr-aw-wirtschaft-oeffentlicher-zweck
  type: definition
  front: Was bedeutet „öffentlicher Zweck“ bei der wirtschaftlichen Betätigung der Gemeinde, und was ist der Örtlichkeitsgrundsatz?
  back: >-
    Ein öffentlicher Zweck liegt vor, wenn die Betätigung der Erfüllung von Gemeinwohlaufgaben der örtlichen
    Gemeinschaft dient, also vor allem der Daseinsvorsorge (Energie, Wasser, Verkehr, Entsorgung). Er ist
    ein unbestimmter Rechtsbegriff mit Einschätzungsspielraum der Gemeinde und wird gerichtlich nur auf
    offensichtliche Überschreitung überprüft. Die Erzielung von Einnahmen für den Haushalt ist für sich kein
    öffentlicher Zweck; sonst wäre die Schranke wirkungslos. Der Örtlichkeitsgrundsatz folgt aus Art. 28 Abs. 2
    GG: Die Gemeinde darf sich nur in den Angelegenheiten der örtlichen Gemeinschaft betätigen. Eine
    Betätigung außerhalb des Gemeindegebiets ist nur zulässig, wenn ein örtlicher Bezug besteht, die
    Interessen der betroffenen Nachbargemeinden gewahrt werden und das Landesrecht es erlaubt.
  norms:
  - Art. 28 Abs. 2 S. 1 GG
  quellen:
  - Gemeindeordnungen der Länder (Landesrechtsportale)
  - Eigenformulierung Redaktion
  stand: 2026-10
- slug: or-kr-aw-wirtschaft-drittschutz
  type: streitstand
  front: Können private Konkurrenten sich gegen die wirtschaftliche Betätigung der Gemeinde wehren (Drittschutz)?
  back: >-
    Das ist stark vom jeweiligen Landesrecht abhängig und umstritten. Die Schranken der Gemeindeordnung (öffentlicher
    Zweck, Leistungsfähigkeit) dienen nach h. M. nur dem öffentlichen Interesse und dem Schutz der Gemeinde, nicht
    dem Konkurrentenschutz. Für die Subsidiaritätsklausel nehmen einzelne Gerichte und Teile der Literatur
    drittschützende Wirkung an, weil sie gerade die Verdrängung privater Anbieter verhindern soll;
    die Gegenansicht sieht auch sie als reine Gemeinwohlnorm, sofern der Gesetzgeber nichts anderes bestimmt hat.
    Grundrechtlich kommt Art. 12 Abs. 1 GG nur bei einer erheblichen, unzumutbaren Beeinträchtigung
    in Betracht (Verdrängungswettbewerb, Monopolisierung); der bloße Wettbewerb allein reicht nicht.
    Daneben kommt der Weg über das Wettbewerbsrecht vor den Zivilgerichten in Betracht (§ 3a UWG), wenn die
    Gemeindevorschrift als Marktverhaltensregel angesehen wird.
  norms:
  - Art. 12 Abs. 1 GG
  - § 42 Abs. 2 VwGO
  quellen:
  - Gemeindeordnungen der Länder (Landesrechtsportale)
  - Eigenformulierung Redaktion
  stand: 2026-10
- slug: or-kr-aw-wirtschaft-rechtsformen
  type: definition
  front: In welchen Organisationsformen kann die Gemeinde wirtschaftlich tätig werden, und was gilt für die Grundrechtsbindung?
  back: >-
    Die Gemeinde kann Unternehmen in öffentlich-rechtlicher Form betreiben, als Regiebetrieb (unselbständig, Teil
    der Verwaltung), Eigenbetrieb (organisatorisch und finanzwirtschaftlich verselbständigt) oder
    Anstalt des öffentlichen Rechts, oder in privatrechtlicher Form als Eigengesellschaft (GmbH, AG) oder
    Beteiligung an Gesellschaften. Die Gemeindeordnungen verlangen dafür zusätzliche Voraussetzungen wie
    Haftungsbegrenzung, ausreichenden Einfluss der Gemeinde und Beschränkung auf Rechtsformen mit begrenzter Haftung. Die
    Wahl der Privatrechtsform entbindet nicht von den öffentlich-rechtlichen Bindungen: Die Gemeinde unterliegt
    auch bei privatrechtlichem Handeln der Grundrechtsbindung (Art. 1 Abs. 3 GG, Verwaltungsprivatrecht), und
    Zulassungs- und Gleichbehandlungsansprüche bleiben bestehen.
  norms:
  - Art. 1 Abs. 3 GG
  quellen:
  - GG, amtliche Fassung
  - Gemeindeordnungen der Länder (Landesrechtsportale)
  - Eigenformulierung Redaktion
  stand: 2026-10
