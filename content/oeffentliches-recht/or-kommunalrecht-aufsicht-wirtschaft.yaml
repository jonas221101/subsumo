  steps:
  - label: I. Wirtschaftliche Betätigung im Sinne der Gemeindeordnung
    hinweis: Negativkatalog beachten (Bildung, Kultur, Gesundheit, Soziales, Hilfsbetriebe).
  - label: II. Formelle Voraussetzungen
    children:
    - label: 1. Beschluss der zuständigen Gemeindevertretung
    - label: 2. Genehmigung oder Anzeige nach Landesrecht
  - label: III. Materielle Schrankentrias
    children:
    - label: 1. Öffentlicher Zweck – nicht bloße Gewinnerzielung
    - label: 2. Angemessenes Verhältnis zur Leistungsfähigkeit und zum Bedarf
    - label: 3. Subsidiarität gegenüber privaten Anbietern
      hinweis: Landesrecht unterscheidet einfache und qualifizierte Subsidiaritätsklausel.
  - label: IV. Örtlichkeitsgrundsatz und Rechtsform
  - label: V. Rechtsfolgen und Rechtsschutz
    children:
    - label: 1. Rechtsaufsicht – Beanstandung rechtswidriger Beschlüsse
    - label: 2. Drittschutz von Konkurrenten – nach Landesrecht und Art. 12 Abs. 1 GG zu prüfen
faelle:
- slug: or-fall-kr-aw-gartenbetrieb
  title: Der städtische Gartenpflegebetrieb
  difficulty: 3
  minutes: 45
  quellen:
  - Eigener Sachverhalt der Redaktion
  - Gemeindeordnungen der Länder (Landesrechtsportale)
  facts: >-
    Die Stadt S steht vor einer Haushaltslücke. Der Stadtrat beschließt, einen städtischen Betrieb
    „Stadtgrün“ zu gründen, der neben der Pflege öffentlicher Anlagen auch Gartenpflege und Gartengestaltung
    für Privatkunden zu Marktpreisen anbietet, um zusätzliche Einnahmen für den Haushalt zu erzielen. In S
    arbeiten mehrere Gartenbaubetriebe, die diese Leistungen in ausreichender Qualität und zu üblichen Preisen
    anbieten. Die Gemeindeordnung des Landes erlaubt wirtschaftliche Unternehmen nur, wenn ein öffentlicher
    Zweck sie rechtfertigt, sie in einem angemessenen Verhältnis zur Leistungsfähigkeit der Gemeinde stehen und
    der Zweck nicht ebenso gut und wirtschaftlich durch einen Privaten erfüllt werden kann. Der Gartenbaubetrieb G
    verlangt von der Rechtsaufsichtsbehörde, gegen den Beschluss einzuschreiten.
  question: Ist die Gründung des Betriebs „Stadtgrün“ für Privatkunden zulässig, und hat G einen Anspruch auf aufsichtsbehördliches Einschreiten?
  steps:
  - prompt: Liegt eine wirtschaftliche Betätigung vor, und welche Schranken gelten?
    erwartung: Der Angebotsbereich für Privatkunden zu Marktpreisen ist wirtschaftliche Betätigung. Es gilt die Schrankentrias der Gemeindeordnung (öffentlicher Zweck, Leistungsfähigkeit, Subsidiarität).
  - prompt: Ist ein öffentlicher Zweck gegeben?
    erwartung: Nein. Zusätzliche Einnahmen für den Haushalt sind nur Gewinnerzielung und kein öffentlicher Zweck. Die Pflege öffentlicher Anlagen wäre unproblematisch, sie ist aber nicht Gegenstand der Frage.
  - prompt: Ist die Subsidiaritätsklausel erfüllt?
    erwartung: Nein. Private Gartenbaubetriebe erbringen die Leistungen ebenso gut und wirtschaftlich, der Zweck kann also durch Private erfüllt werden. Die Betätigung ist damit rechtswidrig.
  - prompt: Kann G das Einschreiten der Rechtsaufsicht verlangen?
    erwartung: Die Rechtsaufsicht kann den Beschluss beanstanden und die Aufhebung verlangen (Ermessen). Ein Anspruch des G auf Einschreiten besteht grundsätzlich nicht, weil die Aufsicht nur im öffentlichen Interesse besteht; eine Ermessensreduzierung auf Null ist nicht ersichtlich. Ob die Subsidiaritätsklausel für Konkurrenten drittschützend ist, entscheidet das Landesrecht; Art. 12 Abs. 1 GG schützt nur vor Verdrängung.
