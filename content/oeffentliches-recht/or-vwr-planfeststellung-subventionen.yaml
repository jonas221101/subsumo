faelle:
- slug: or-fall-vwr-plan-laermschutz-anlieger
  title: Straßenplanung ohne Lärmschutz
  difficulty: 4
  minutes: 70
  quellen:
  - Eigener Sachverhalt der Redaktion
  - VwVfG, amtliche Fassung
  - Eigenformulierung Redaktion
  facts: Die zuständige Planfeststellungsbehörde stellt den Plan für den Neubau einer Landesstraße
    fest. Anlieger A wohnt etwa 40 Meter von der geplanten Trasse entfernt; sein Grundstück
    wird nicht in Anspruch genommen. A hat rechtzeitig Einwendungen erhoben und auf zu erwartende
    Lärmimmissionen hingewiesen. Ein im Verfahren eingereichtes Lärmgutachten zeigt, dass
    die für Wohngebiete maßgeblichen Grenzwerte am Haus des A überschritten werden. Die Behörde
    hat dieses Gutachten nicht berücksichtigt und keine Lärmschutzmaßnahmen angeordnet; der
    Beschluss enthält dazu keine Erwägungen. Die Planrechtfertigung ist unproblematisch gegeben.
    Weitere Mängel liegen nicht vor. Durch Lärmschutzvorkehrungen (z. B. Schallschutzwand)
    ließe sich der Mangel beheben, ohne dass das Gesamtkonzept der Planung berührt würde.
    A erhebt Klage und beantragt die Aufhebung des gesamten Planfeststellungsbeschlusses.
  question: Ist die Klage zulässig, und mit welchem Ergebnis ist sie begründet?
  steps:
  - prompt: Ist A klagebefugt?
    erwartung: Ja. A ist als Anlieger mit Lärmbetroffenheit nicht Enteignungsbetroffener;
      ihm steht aber ein subjektives Recht auf gerechte Abwägung seiner Belange und auf Einhaltung
      drittschützender Immissionsvorschriften zu. Die Verletzung ist möglich, § 42 Abs. 2
      VwGO. Seine Einwendungen waren rechtzeitig, eine Präklusion greift nicht.
  - prompt: Liegt ein Fehler im Planfeststellungsbeschluss vor?
    erwartung: 'Ja, ein Abwägungsdefizit (Abwägungsausfall hinsichtlich der Lärmbelange):
      Die Behörde hat den relevanten Belang des Lärmschutzes nicht ermittelt und nicht in
      die Abwägung eingestellt. Der Mangel ist offensichtlich und auf das Ergebnis von Einfluss
      (§ 75 Abs. 1a S. 1 VwVfG), zudem werden Immissionsgrenzwerte verletzt.'
  - prompt: Führt der Fehler zur Aufhebung des Beschlusses?
    erwartung: Nein. Nach § 75 Abs. 1a S. 2 VwVfG kommt eine Aufhebung nur in Betracht, wenn
      der Mangel nicht durch Planergänzung oder ein ergänzendes Verfahren behoben werden kann.
      Hier lässt sich der Mangel durch Schutzvorkehrungen (Lärmschutzwand) beheben (§ 74 Abs.
      2 S. 2 VwVfG). A hat nur Anspruch auf Planergänzung; sein Aufhebungsantrag ist auszulegen
      (§ 88 VwGO) und hat nur als Minus, nämlich als Begehren auf Verpflichtung zur Planergänzung,
      Erfolg; im Übrigen wird die Klage abgewiesen.
  expectation:
    pruefpunkte:
