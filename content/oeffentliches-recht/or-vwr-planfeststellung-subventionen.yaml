cards:
- slug: or-vwr-plan-planfeststellung-verfahren
  type: definition
  front: Was ist die Planfeststellung, und wie läuft das Verfahren nach §§ 72 ff. VwVfG ab?
  back: >-
    Die Planfeststellung ist ein förmliches Verwaltungsverfahren für Vorhaben, bei denen Gesetz
    (Fachplanungsrecht) sie vorschreibt, etwa Straßen (§ 17 FStrG), Eisenbahnen (§ 18 AEG)
    oder Flughäfen (§ 8 LuftVG). Für das Verfahren gelten die §§ 72 bis 78 VwVfG, soweit Fachgesetze
    nichts Abweichendes bestimmen (§ 72 Abs. 1 VwVfG). Das Verfahren besteht aus dem Anhörungsverfahren
    (§ 73 VwVfG: Plan des Vorhabenträgers, Auslegung, Einwendungen, Stellungnahmen der Behörden,
    Erörterung, Stellungnahme der Anhörungsbehörde) und der Entscheidung der Planfeststellungsbehörde
    durch Planfeststellungsbeschluss (§ 74 VwVfG), der Verwaltungsakt ist. Bei Vorhaben von
    unwesentlicher Bedeutung genügt statt der Planfeststellung eine Plangenehmigung (§ 74
    Abs. 6 VwVfG). Die Landesverwaltungsverfahrensgesetze enthalten entsprechende Vorschriften;
    die Fachplanungsgesetze der Länder weichen im Einzelnen ab.
  norms:
  - § 72 VwVfG
  - § 73 VwVfG
  - § 74 VwVfG
  - § 74 Abs. 6 VwVfG
  quellen: &id001
  - VwVfG, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-10
- slug: or-vwr-plan-konzentrationswirkung-75
  type: definition
  front: Welche Wirkungen hat der Planfeststellungsbeschluss nach § 75 VwVfG?
  back: >-
    Der Planfeststellungsbeschluss hat Konzentrationswirkung: Neben ihm sind andere behördliche
    Entscheidungen, insbesondere öffentlich-rechtliche Genehmigungen, Verleihungen, Erlaubnisse,
    Bewilligungen, Zustimmungen und Planfeststellungen nicht erforderlich (§ 75 Abs. 1 S.
    1 VwVfG). Die Konzentration ist formell, das heißt die materiellen Anforderungen der konzentrierten
    Genehmigungen bleiben zu beachten; ausgenommen sind nach § 75 Abs. 1 S. 1 VwVfG wasserrechtliche
    Erlaubnisse und Bewilligungen, für die das Wasserhaushaltsgesetz Sonderregeln enthält.
    Zudem hat der Beschluss Gestaltungswirkung: Er regelt alle öffentlich-rechtlichen Beziehungen
    zwischen dem Vorhabenträger und den durch den Plan Betroffenen rechtsgestaltend (§ 75
    Abs. 1 S. 2 VwVfG). Nach § 75 Abs. 2 S. 1 VwVfG sind nach Unanfechtbarkeit Ansprüche auf
    Unterlassung, Beseitigung oder Änderung ausgeschlossen (Ausschlusswirkung gegenüber privatrechtlichen
    Abwehransprüchen). Bei nicht voraussehbaren Wirkungen sind Schutzvorkehrungen oder Entschädigung
    vorgesehen (§ 75 Abs. 2 S. 2 bis 4 VwVfG). Daneben besteht enteignungsrechtliche Vorwirkung
    nach Fachgesetz.
  norms:
  - § 75 Abs. 1 VwVfG
  - § 75 Abs. 2 VwVfG
  quellen: *id001
  stand: 2026-10
- slug: or-vwr-plan-planrechtfertigung-planungsleitsaetze
  type: definition
  front: Was bedeuten Planrechtfertigung und Planungsleitsätze?
  back: >-
    Die Planrechtfertigung ist die erste Stufe der materiellen Rechtmäßigkeit: Das Vorhaben
    muss gemessen an den Zielen des Fachplanungsgesetzes erforderlich sein, das heißt vernünftigerweise
    geboten (nicht zwingend unausweichlich). Es besteht ein Planungsbedarf, wenn die Ziele
    des Gesetzes das Vorhaben rechtfertigen (z. B. Verbesserung der Verkehrsverhältnisse).
    Planungsleitsätze sind zwingende gesetzliche Vorgaben, die der Abwägung nicht zugänglich
    sind und strikt zu beachten sind (z. B. Immissionsgrenzwerte, artenschutzrechtliche Verbote,
    Vorschriften des Naturschutzes mit Verbotscharakter); ihre Verletzung führt zur Rechtswidrigkeit,
    wenn keine Ausnahme oder Befreiung vorliegt. Optimierungsgebote sind demgegenüber Abwägungsdirektiven,
    die möglichst weitgehend zu verwirklichen sind. Die Prüfung folgt dem Dreischritt: Planrechtfertigung,
    Planungsleitsätze und Optimierungsgebote, sodann Abwägung.
  norms:
  - § 74 Abs. 1 VwVfG
  quellen: *id001
  stand: 2026-10
- slug: or-vwr-plan-abwaegungsgebot
  type: definition
  front: Was verlangt das Abwägungsgebot, und welche Abwägungsfehler gibt es?
  back: >-
    Die Planfeststellungsbehörde hat bei ihrer Entscheidung planerische Gestaltungsfreiheit
    (Planungsermessen), die durch das Abwägungsgebot gebunden ist: Sie muss alle von dem Vorhaben
    berührten öffentlichen und privaten Belange ermitteln, gewichten und in einen gerechten
    Ausgleich bringen (Rechtsstaatsprinzip; Fachplanungsrecht). Die Abwägungsfehlerlehre unterscheidet:
    Abwägungsausfall (es findet keine Abwägung statt), Abwägungsdefizit (relevante Belange
    werden nicht ermittelt oder nicht eingestellt), Abwägungsfehleinschätzung (Bedeutung eines
    Belangs wird verkannt) und Abwägungsdisproportionalität (der Ausgleich steht außer Verhältnis
    zur objektiven Gewichtung der Belange). Das Gericht kontrolliert nur die Einhaltung dieser
    Grenzen, nicht die Zweckmäßigkeit der Planung; die Abwägungsentscheidung selbst ist Planungsermessen.
    Betroffene haben ein subjektives Recht auf gerechte Abwägung ihrer eigenen Belange.
  norms:
  - § 74 Abs. 1 VwVfG
  - Art. 20 Abs. 3 GG
  quellen:
  - VwVfG, amtliche Fassung
  - Eigenformulierung Redaktion
  - Eigenformulierung Redaktion
  stand: 2026-10
- slug: or-vwr-plan-planerhaltung-75-abs1a
  type: norm
  front: Welche Folgen haben Fehler im Planfeststellungsbeschluss (§ 75 Abs. 1a VwVfG)?
  back: >-
    Mängel bei der Abwägung sind nur erheblich, wenn sie offensichtlich und auf das Abwägungsergebnis
    von Einfluss gewesen sind, § 75 Abs. 1a S. 1 VwVfG. Erhebliche Mängel führen nur dann
    zur Aufhebung des Planfeststellungsbeschlusses oder zur Feststellung seiner Rechtswidrigkeit
    und Nichtvollziehbarkeit, wenn sie nicht durch Planergänzung oder durch ein ergänzendes
    Verfahren behoben werden können, § 75 Abs. 1a S. 2 VwVfG (Planerhaltungsgrundsatz). Der
    Kläger hat daher regelmäßig nur Anspruch auf Planergänzung (Schutzauflagen nach § 74 Abs.
    2 S. 2 VwVfG) und nicht auf Aufhebung, wenn der Fehler behebbar ist und das Gesamtkonzept
    nicht berührt. Bei Verfahrensfehlern ist § 46 VwVfG zu beachten. Maßgeblich ist die Sach-
    und Rechtslage im Zeitpunkt des Beschlusses.
  norms:
  - § 75 Abs. 1a VwVfG
  - § 74 Abs. 2 S. 2 VwVfG
  - § 46 VwVfG
  quellen: *id001
  stand: 2026-10
- slug: or-vwr-plan-planfeststellung-rechtsschutz
  type: norm
  front: Wer kann sich gegen einen Planfeststellungsbeschluss wehren, und welche Klageart
    ist statthaft?
  back: >-
    Statthaft ist die Anfechtungsklage gegen den Planfeststellungsbeschluss (Verwaltungsakt,
    § 42 Abs. 1 VwGO) oder, wenn der Kläger nur Schutzvorkehrungen begehrt, die Verpflichtungsklage
    auf Planergänzung. Die Klagebefugnis (§ 42 Abs. 2 VwGO) hängt vom Maß der Betroffenheit
    ab: Der Enteignungsbetroffene kann im Wege der Anfechtung die objektive Rechtmäßigkeit
    des Beschlusses umfassend prüfen lassen (Art. 14 Abs. 3 GG); sonstige Betroffene (z. B.
    Anlieger mit Lärmbetroffenheit) haben nur Anspruch auf gerechte Abwägung ihrer Belange
    und auf Einhaltung drittschützender Normen. Zuständig ist wegen der Bedeutung der Vorhaben
    oft das Oberverwaltungsgericht oder das Bundesverwaltungsgericht in erster Instanz (§
    48, § 50 VwGO). Einwendungen müssen im Anhörungsverfahren rechtzeitig erhoben werden;
    nach Ablauf der Einwendungsfrist sind sie nach § 73 Abs. 4 S. 3 VwVfG ausgeschlossen (materielle
    Präklusion), was unionsrechtlich und im Umweltrecht eingeschränkt wurde.
  norms:
  - § 42 VwGO
  - § 73 Abs. 4 VwVfG
  - § 48 VwGO
  - § 50 VwGO
  - Art. 14 Abs. 3 GG
  quellen:
  - VwVfG, amtliche Fassung
  - Eigenformulierung Redaktion
  - VwGO, amtliche Fassung
  stand: 2026-10
- slug: or-vwr-plan-subvention-begriff-rechtsgrundlage
  type: streitstand
  front: Was ist eine Subvention, und genügt der Haushaltsplan als Rechtsgrundlage?
  back: >-
    Eine Subvention ist eine Leistung der öffentlichen Hand an Private ohne marktübliche Gegenleistung
    zur Förderung eines öffentlichen Zwecks (Zuschuss, Darlehen, Bürgschaft, Steuervergünstigung).
    Die Vergabe erfolgt meist nach Förderrichtlinien (Verwaltungsvorschriften) im Ermessen
    der Behörde. Streitig ist, ob für die Gewährung ein Parlamentsgesetz erforderlich ist.
    Die Rechtsprechung lässt für begünstigende Subventionen im Grundsatz den Haushaltsplan
    (haushaltsrechtliche Ermächtigung) und Förderrichtlinien genügen, sofern nicht in Grundrechte
    Dritter eingegriffen wird; die Gleichbehandlung folgt aus der Selbstbindung der Verwaltung
    (Art. 3 Abs. 1 GG). Die Gegenauffassung verlangt nach der Wesentlichkeitstheorie ein Gesetz,
    wenn die Subvention wesentlich ist, insbesondere wenn sie wettbewerbsrelevant ist und
    die Grundrechte von Konkurrenten berührt (Art. 12 Abs. 1 GG). Ein Anspruch auf Subvention
    besteht nur bei gesetzlicher Zusage oder bei Selbstbindung; im Übrigen Anspruch auf fehlerfreie
    Ermessensentscheidung.
  norms:
  - Art. 3 Abs. 1 GG
  - Art. 12 Abs. 1 GG
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-10
- slug: or-vwr-plan-subvention-zwei-stufen
  type: definition
  front: Wie wirkt die Zwei-Stufen-Theorie bei Subventionen, und was gilt für Rückforderung?
  back: >-
    Bei Subventionen unterscheidet die Zwei-Stufen-Theorie die Entscheidung über das „Ob“
    der Gewährung von der Abwicklung („Wie“): Die Bewilligung ist öffentlich-rechtlich (Verwaltungsakt,
    Bewilligungsbescheid), die Abwicklung kann privatrechtlich erfolgen, etwa durch Darlehensvertrag
    mit der Bank oder Zahlung auf privatrechtlicher Grundlage. Rechtsweg: für das „Ob“ Verwaltungsgerichte,
    für das „Wie“ ordentliche Gerichte. Bei Zuschüssen wird heute überwiegend die einstufige
    Lösung vertreten: Bewilligung durch Verwaltungsakt, Abwicklung durch Zuwendungsbescheid
    mit Nebenbestimmungen, sodass alles öffentlich-rechtlich ist. Wird die Subvention durch
    Verwaltungsakt bewilligt, richtet sich die Rückforderung nach den §§ 48, 49 Abs. 3, 49a
    VwVfG, nicht nach Bereicherungsrecht; bei privatrechtlicher Abwicklung nach Vertragsrecht.
    Der Verwaltungsakt bleibt Anknüpfungspunkt, und die Behörde muss den Verwaltungsakt zuerst
    aufheben, bevor sie zurückfordert.
  norms:
  - § 48 VwVfG
  - § 49 Abs. 3 VwVfG
  - § 49a VwVfG
  - § 17 Abs. 2 GVG
  quellen:
  - VwVfG, amtliche Fassung
  - Eigenformulierung Redaktion
  - GVG, amtliche Fassung
  stand: 2026-10
- slug: or-vwr-plan-beihilfenrecht
  type: norm
  front: Welche Rolle spielt das EU-Beihilfenrecht bei Subventionen?
  back: >-
    Staatliche oder aus staatlichen Mitteln gewährte Beihilfen gleich welcher Art, die durch
    Begünstigung bestimmter Unternehmen oder Produktionszweige den Wettbewerb verfälschen
    oder zu verfälschen drohen, sind mit dem Binnenmarkt unvereinbar, soweit sie den Handel
    zwischen Mitgliedstaaten beeinträchtigen, Art. 107 Abs. 1 AEUV (Ausnahmen in Abs. 2 und
    3). Neue Beihilfen sind bei der Kommission anzumelden und dürfen vor deren Genehmigung
    nicht gewährt werden (Durchführungsverbot, Art. 108 Abs. 3 AEUV). Eine unter Verstoß gegen
    das Durchführungsverbot gewährte Beihilfe ist rechtswidrig; die nationalen Behörden und
    Gerichte müssen sie zurückfordern, der Empfänger kann sich auf Vertrauensschutz nur ausnahmsweise
    berufen, wenn das Verfahren nicht eingehalten wurde. Im nationalen Recht werden §§ 48,
    49a VwVfG unionsrechtskonform ausgelegt (Effektivitätsgrundsatz). Ausnahmen bestehen für
    De-minimis-Beihilfen und Gruppenfreistellungen.
  norms:
  - Art. 107 Abs. 1 AEUV
  - Art. 108 Abs. 3 AEUV
  - § 48 VwVfG
  - § 49a VwVfG
  quellen:
  - AEUV, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-10
