- slug: or-vwgo-ak-zeitstrahl-fristen
  type: zeitstrahl
  title: Fristenlauf bis zur Anfechtungsklage
  quellen:
  - VwGO, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-11
  punkte:
  - label: Erlass und Bekanntgabe des Verwaltungsakts
    hinweis: Die Bekanntgabe (§ 41 VwVfG) setzt die Widerspruchsfrist in Gang - bei ordnungsgemäßer
      Rechtsbehelfsbelehrung, § 58 Abs. 1 VwGO.
  - label: Widerspruch, § 69 VwGO
    hinweis: Innerhalb eines Monats nach Bekanntgabe, § 70 Abs. 1 VwGO. Entbehrlich nur in den gesetzlichen
      Ausnahmefällen des § 68 Abs. 1 S. 2 VwGO.
  - label: Abhilfe oder Widerspruchsbescheid
    hinweis: Die Behörde hilft ab, § 72 VwGO, oder die Widerspruchsbehörde weist zurück
      und erlässt den Widerspruchsbescheid, § 73 VwGO. Der Widerspruchsbescheid wird zugestellt,
      § 73 Abs. 3 S. 1 VwGO.
  - label: Anfechtungsklage, § 42 Abs. 1 Var. 1 VwGO
    hinweis: Innerhalb eines Monats nach Bekanntgabe (Zustellung) des Widerspruchsbescheids,
      § 74 Abs. 1 S. 1 VwGO. Fehlt die Rechtsbehelfsbelehrung oder ist sie fehlerhaft, gilt
      die Jahresfrist, § 58 Abs. 2 VwGO.
