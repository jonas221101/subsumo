      - § 42 Abs. 1 VwGO
      keywords:
      - Anfechtungsklage
      - statthaft
      - Aufhebung
      card_slugs:
      - or-vwgo-ak-statthaftigkeit
    - id: p2
      label: Klagebefugnis über die Adressatentheorie (Art. 2 Abs. 1 GG) begründet
      weight: 2.5
      required: true
      norms:
      - § 42 Abs. 2 VwGO
      - Art. 2 Abs. 1 GG
      keywords:
      - Adressatentheorie
      - Klagebefugnis
      - Art. 2 Abs. 1 GG
      card_slugs:
      - or-vwgo-ak-adressatentheorie
    - id: p3
      label: Vorverfahren nach § 68 Abs. 1 VwGO als durchgeführt geprüft
      weight: 1.5
      required: false
      keywords:
      - Vorverfahren
      - Widerspruch
      card_slugs:
      - or-vwgo-ak-vorverfahren
    - id: p4
      label: Klagefrist des § 74 Abs. 1 VwGO korrekt ab Zustellung des Widerspruchsbescheids
        berechnet und als gewahrt erkannt
      weight: 3.0
      required: true
      norms:
      - § 74 Abs. 1 VwGO
