cards:
- slug: or-vwgo-ak-statthaftigkeit
  type: definition
  front: Wann ist die Anfechtungsklage die statthafte Klageart, § 42 Abs. 1 Var. 1
    VwGO?
  back: 'Die Anfechtungsklage ist statthaft, wenn der Kläger nach seinem Vorbringen
    die vollständige oder teilweise Aufhebung eines belastenden Verwaltungsakts begehrt.
    Maßgeblich ist das Klagebegehren nach seinem wirklichen Sinn (§ 88 VwGO entsprechend),
    nicht die vom Kläger gewählte Bezeichnung. Auch ein bereits vollzogener, aber
    noch wirksamer Verwaltungsakt kann angefochten werden: Der Vollzug ist keine Erledigung,
    und das Gericht kann nach § 113 Abs. 1 S. 2 VwGO auf Antrag aussprechen, dass
    und wie die Vollziehung rückgängig zu machen ist (Folgenbeseitigung). Nur wenn
    sich der Verwaltungsakt erledigt hat (§ 43 Abs. 2 VwVfG, etwa durch Zeitablauf
    oder Rücknahme), kommt statt der Aufhebung die Fortsetzungsfeststellungsklage
    nach § 113 Abs. 1 S. 4 VwGO in Betracht.'
  norms:
  - § 42 Abs. 1 VwGO
  quellen:
  - VwGO, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: or-vwgo-ak-klagebefugnis-moeglichkeitstheorie
  type: definition
  front: 'Definiere: Klagebefugnis nach § 42 Abs. 2 VwGO (Möglichkeitstheorie)'
  back: Klagebefugt ist, wer geltend macht, durch den Verwaltungsakt in eigenen Rechten
    verletzt zu sein. Nach der Möglichkeitstheorie genügt es, dass eine Rechtsverletzung
    nach dem Klägervorbringen möglich erscheint - sie darf nicht offensichtlich und
    eindeutig nach jeder Betrachtungsweise ausgeschlossen sein. Die Klagebefugnis
    ist eine reine Zulässigkeitsvoraussetzung; ob die Rechtsverletzung tatsächlich
    vorliegt, ist erst eine Frage der Begründetheit.
  norms:
  - § 42 Abs. 2 VwGO
  quellen:
  - VwGO, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: or-vwgo-ak-adressatentheorie
  type: streitstand
  front: Wie begründet der Adressat eines belastenden Verwaltungsakts seine Klagebefugnis?
  back: 'Nach der Adressatentheorie folgt die Klagebefugnis des Adressaten eines ihn
    belastenden Verwaltungsakts bereits aus Art. 2 Abs. 1 GG (allgemeine Handlungsfreiheit):
    Jede staatliche Belastung, die sich als Eingriff in ein subjektives Recht darstellen
    kann, berührt zumindest möglicherweise dieses Auffanggrundrecht. Eine gesonderte
    Prüfung, ob gerade die verletzte Norm auch dem Schutz des Adressaten dient, ist
    bei ihm anders als beim Drittbetroffenen nicht erforderlich.'
  norms:
  - § 42 Abs. 2 VwGO
  - Art. 2 Abs. 1 GG
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: or-vwgo-ak-drittanfechtung-schutznormtheorie
  type: streitstand
  front: Wann ist ein Dritter, an den sich der Verwaltungsakt nicht richtet, klagebefugt?
  back: Bei der Drittanfechtungsklage muss der Dritte sich auf eine Norm berufen können,
    die nach der Schutznormtheorie nicht nur dem Allgemeininteresse, sondern zumindest
    auch dem Schutz seiner Individualinteressen zu dienen bestimmt ist - ermittelt
    durch Auslegung der Norm nach Wortlaut, Systematik, Entstehungsgeschichte und
    Zweck, insbesondere danach, ob sie einen abgrenzbaren Kreis Dritter von der Allgemeinheit
    unterscheidet. Reine Reflexwirkungen einer im öffentlichen Interesse erlassenen
    Norm genügen nicht.
  norms:
  - § 42 Abs. 2 VwGO
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: or-vwgo-ak-vorverfahren
  type: norm
  front: Was regelt § 68 Abs. 1 VwGO und wann ist ein Vorverfahren entbehrlich?
  back: Vor Erhebung der Anfechtungsklage ist grundsätzlich in einem Vorverfahren
    (Widerspruchsverfahren) die Rechtmäßigkeit und Zweckmäßigkeit des Verwaltungsakts
    nachzuprüfen, § 68 Abs. 1 S. 1 VwGO. Entbehrlich ist das Vorverfahren, wenn ein
    Gesetz dies bestimmt (§ 68 Abs. 1 S. 2 Hs. 1 VwGO) - davon haben mehrere Länder
    Gebrauch gemacht und das Widerspruchsverfahren ganz oder weitgehend abgeschafft
    (z. B. Bayern, Niedersachsen, Nordrhein-Westfalen; maßgeblich ist stets das jeweilige
    Landesrecht). Weiter ist es entbehrlich, wenn der Verwaltungsakt von einer obersten
    Bundes- oder Landesbehörde erlassen wurde, es sei denn, ein Gesetz schreibt die
    Nachprüfung vor (Nr. 1), oder wenn erst der Abhilfe- oder Widerspruchsbescheid
    erstmalig eine zusätzliche selbständige Beschwer enthält (Nr. 2). Bei Untätigkeit
    der Behörde tritt die Untätigkeitsklage nach Ablauf der Sperrfrist des § 75 VwGO
    an die Stelle des Vorverfahrens.
  norms:
  - § 68 Abs. 1 VwGO
  - § 75 VwGO
  quellen:
  - VwGO, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: or-vwgo-ak-klagefrist
  type: norm
  front: Welche Klagefrist gilt für die Anfechtungsklage nach § 74 Abs. 1 VwGO?
  back: Die Anfechtungsklage ist innerhalb eines Monats nach Zustellung des Widerspruchsbescheids
    zu erheben, § 74 Abs. 1 S. 1 VwGO; ist kein Vorverfahren erforderlich, läuft die
    Frist ab Bekanntgabe des Verwaltungsakts, § 74 Abs. 1 S. 2 VwGO. Die Frist beginnt
    nur bei ordnungsgemäßer Rechtsbehelfsbelehrung, § 58 Abs. 1 VwGO - andernfalls
    gilt die Jahresfrist des § 58 Abs. 2 VwGO.
  norms:
  - § 74 Abs. 1 VwGO
  - § 58 Abs. 1 VwGO
  - § 58 Abs. 2 VwGO
  quellen:
  - VwGO, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
