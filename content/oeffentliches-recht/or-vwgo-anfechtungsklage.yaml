faelle:
- slug: or-fall-gewerbeuntersagung-anfechtung
  title: Die sofort vollziehbare Gewerbeuntersagung
  difficulty: 4
  minutes: 70
  quellen:
  - Eigener Sachverhalt der Redaktion
  - VwGO, amtliche Fassung
  facts: Die zustaendige Behoerde untersagt dem G mit schriftlichem Bescheid die Ausuebung
    seines Gewerbes und ordnet die sofortige Vollziehung an. G legt form- und fristgerecht
    Widerspruch ein; die Widerspruchsbehoerde weist den Widerspruch durch Widerspruchsbescheid
    zurueck, der dem G am 3. Juni zugestellt wird. G moechte gegen die Untersagung
    vorgehen und sucht am 2. Juli anwaltlichen Rat. Sein Ziel ist die vollstaendige
    Aufhebung des Bescheids.
  question: Wie muesste G vorgehen, und ist eine am 2. Juli erhobene Klage zulaessig?
  steps:
  - prompt: Welche Klageart ist statthaft?
    erwartung: Die Anfechtungsklage, § 42 Abs. 1 Var. 1 VwGO - G begehrt die Aufhebung
      eines belastenden Verwaltungsakts (Gewerbeuntersagung).
  - prompt: Ist G klagebefugt?
    erwartung: Ja - als Adressat des belastenden Verwaltungsakts folgt die moegliche
      Rechtsverletzung bereits aus Art. 2 Abs. 1 GG (Adressatentheorie).
  - prompt: War ein Vorverfahren erforderlich und wurde es durchgefuehrt?
    erwartung: Ja, § 68 Abs. 1 VwGO - G hat form- und fristgerecht Widerspruch eingelegt,
      ueber den durch Widerspruchsbescheid entschieden wurde.
  - prompt: Ist die Klagefrist des § 74 Abs. 1 VwGO gewahrt?
    erwartung: Nein - die Monatsfrist ab Zustellung des Widerspruchsbescheids (3.
      Juni) endet am 3. Juli; eine erst am 2. Juli erhobene Klage waere aber noch
      fristgerecht, da der 2. Juli innerhalb der Monatsfrist liegt.
  expectation:
