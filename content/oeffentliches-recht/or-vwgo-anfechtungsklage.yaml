faelle:
- slug: or-fall-gewerbeuntersagung-anfechtung
  title: Die sofort vollziehbare Gewerbeuntersagung
  difficulty: 4
  minutes: 70
  quellen:
  - Eigener Sachverhalt der Redaktion
  - VwGO, amtliche Fassung
  facts: Die zuständige Behörde untersagt dem G mit schriftlichem Bescheid die Ausübung
    seines Gewerbes und ordnet die sofortige Vollziehung an. G legt form- und fristgerecht
    Widerspruch ein; die Widerspruchsbehörde weist den Widerspruch durch Widerspruchsbescheid
    zurück, der dem G am 3. Juni zugestellt wird. G möchte gegen die Untersagung vorgehen
    und sucht am 2. Juli anwaltlichen Rat. Sein Ziel ist die vollständige Aufhebung
    des Bescheids.
  question: Wie müsste G vorgehen, und ist eine am 2. Juli erhobene Klage zulässig?
  steps:
  - prompt: Welche Klageart ist statthaft?
    erwartung: Die Anfechtungsklage, § 42 Abs. 1 Var. 1 VwGO - G begehrt die Aufhebung
      eines belastenden Verwaltungsakts (Gewerbeuntersagung).
  - prompt: Ist G klagebefugt?
    erwartung: Ja - als Adressat des belastenden Verwaltungsakts folgt die mögliche
      Rechtsverletzung bereits aus Art. 2 Abs. 1 GG (Adressatentheorie).
  - prompt: War ein Vorverfahren erforderlich und wurde es durchgeführt?
    erwartung: Ja, § 68 Abs. 1 VwGO - G hat form- und fristgerecht Widerspruch eingelegt,
      über den durch Widerspruchsbescheid entschieden wurde.
  - prompt: Ist die Klagefrist des § 74 Abs. 1 VwGO gewahrt?
    erwartung: 'Ja - die Klagefrist beträgt einen Monat ab Zustellung des Widerspruchsbescheids
      am 3. Juni, § 74 Abs. 1 S. 1 VwGO. Die Frist endet mit Ablauf des 3. Juli (§
      57 Abs. 2 VwGO i. V. m. § 222 ZPO, § 188 Abs. 2 BGB: der Tag, der durch seine
      Zahl dem Tag der Zustellung entspricht). Eine am 2. Juli erhobene Klage ist
      fristgerecht, die Frist ist gewahrt, da der 2. Juli noch innerhalb der Monatsfrist
      liegt.'
