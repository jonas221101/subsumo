cards:
- slug: or-vwgo-ak-statthaftigkeit
  type: definition
  front: Wann ist die Anfechtungsklage die statthafte Klageart, § 42 Abs. 1 Var. 1
    VwGO?
  back: Die Anfechtungsklage ist statthaft, wenn der Klaeger nach seinem Vorbringen
    die vollstaendige oder teilweise Aufhebung eines belastenden Verwaltungsakts begehrt.
    Massgeblich ist das Klagebegehren nach seinem wirklichen Sinn (§ 88 VwGO entsprechend),
    nicht die vom Klaeger gewaehlte Bezeichnung. Ist der Verwaltungsakt bereits vollzogen
    oder hat er sich erledigt, kommt statt der Aufhebung nur noch eine Fortsetzungsfeststellung
    in Betracht.
  norms:
  - § 42 Abs. 1 VwGO
  quellen:
  - VwGO, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: or-vwgo-ak-klagebefugnis-moeglichkeitstheorie
  type: definition
  front: 'Definiere: Klagebefugnis nach § 42 Abs. 2 VwGO (Moeglichkeitstheorie)'
  back: Klagebefugt ist, wer geltend macht, durch den Verwaltungsakt in eigenen Rechten
    verletzt zu sein. Nach der Moeglichkeitstheorie genuegt es, dass eine Rechtsverletzung
    nach dem Klaegervorbringen moeglich erscheint - sie darf nicht offensichtlich
    und eindeutig nach jeder Betrachtungsweise ausgeschlossen sein. Die Klagebefugnis
    ist eine reine Zulaessigkeitsvoraussetzung; ob die Rechtsverletzung tatsaechlich
    vorliegt, ist erst eine Frage der Begruendetheit.
  norms:
  - § 42 Abs. 2 VwGO
  quellen:
  - VwGO, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: or-vwgo-ak-adressatentheorie
  type: streitstand
  front: Wie begruendet der Adressat eines belastenden Verwaltungsakts seine Klagebefugnis?
  back: 'Nach der Adressatentheorie folgt die Klagebefugnis des Adressaten eines ihn
    belastenden Verwaltungsakts bereits aus Art. 2 Abs. 1 GG (allgemeine Handlungsfreiheit):
    Jede staatliche Belastung, die sich als Eingriff in ein subjektives Recht darstellen
    kann, beruehrt zumindest moeglicherweise dieses Auffanggrundrecht. Eine gesonderte
    Pruefung, ob gerade die verletzte Norm auch dem Schutz des Adressaten dient, ist
    bei ihm anders als beim Drittbetroffenen nicht erforderlich.'
  norms:
  - § 42 Abs. 2 VwGO
  - Art. 2 Abs. 1 GG
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: or-vwgo-ak-drittanfechtung-schutznormtheorie
  type: streitstand
  front: Wann ist ein Dritter, an den sich der Verwaltungsakt nicht richtet, klagebefugt?
  back: Bei der Drittanfechtungsklage muss der Dritte sich auf eine Norm berufen koennen,
    die nach der Schutznormtheorie nicht nur dem Allgemeininteresse, sondern zumindest
    auch dem Schutz seiner Individualinteressen zu dienen bestimmt ist - ermittelt
    durch Auslegung der Norm nach Wortlaut, Systematik, Entstehungsgeschichte und
    Zweck, insbesondere danach, ob sie einen abgrenzbaren Kreis Dritter von der Allgemeinheit
    unterscheidet. Reine Reflexwirkungen einer im oeffentlichen Interesse erlassenen
    Norm genuegen nicht.
  norms:
  - § 42 Abs. 2 VwGO
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: or-vwgo-ak-vorverfahren
  type: norm
  front: Was regelt § 68 Abs. 1 VwGO und wann ist ein Vorverfahren entbehrlich?
  back: Vor Erhebung der Anfechtungsklage ist grundsaetzlich in einem Vorverfahren
    (Widerspruchsverfahren) die Rechtmaessigkeit und Zweckmaessigkeit des Verwaltungsakts
    nachzupruefen, § 68 Abs. 1 S. 1 VwGO. Entbehrlich ist das Vorverfahren u. a.,
    wenn ein Gesetz dies bestimmt, wenn der Verwaltungsakt von einer obersten Bundes-
    oder Landesbehoerde erlassen wurde (Ausnahme bei Erstbescheidung, § 68 Abs. 1
    S. 2 VwGO) oder wenn ein Fall des § 75 VwGO (Untaetigkeit der Behoerde) vorliegt.
  norms:
  - § 68 Abs. 1 VwGO
  - § 75 VwGO
  quellen:
  - VwGO, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: or-vwgo-ak-klagefrist
  type: norm
  front: Welche Klagefrist gilt fuer die Anfechtungsklage nach § 74 Abs. 1 VwGO?
  back: Die Anfechtungsklage ist innerhalb eines Monats nach Zustellung des Widerspruchsbescheids
    zu erheben, § 74 Abs. 1 S. 1 VwGO; ist kein Vorverfahren erforderlich, laeuft
    die Frist ab Bekanntgabe des Verwaltungsakts, § 74 Abs. 1 S. 2 VwGO. Die Frist
    beginnt nur bei ordnungsgemaesser Rechtsbehelfsbelehrung, § 58 Abs. 1 VwGO - andernfalls
    gilt die Jahresfrist des § 58 Abs. 2 VwGO.
  norms:
  - § 74 Abs. 1 VwGO
  - § 58 Abs. 1 VwGO
  - § 58 Abs. 2 VwGO
  quellen:
  - VwGO, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
