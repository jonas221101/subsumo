- slug: or-schema-vwr-vollstreckung-zwangsmittel
  title: Rechtmäßigkeit einer Maßnahme der Verwaltungsvollstreckung (Zwangsmittel)
  norms:
  - § 6 VwVG
  - § 9 VwVG
  - § 13 VwVG
  quellen: *id001
  steps:
  - label: 'I. Ermächtigungsgrundlage: VwVG (Bund) bzw. Landesvollstreckungsrecht'
    hinweis: Landesrechtlich unterschiedlich; sonst § 6 VwVG als Muster verwenden.
  - label: II. Formelle Rechtmäßigkeit
    children:
    - label: 1. Zuständigkeit der Vollstreckungsbehörde
    - label: 2. Verfahren und Form (Anhörung, Schriftform)
  - label: 'III. Materielle Rechtmäßigkeit: Gestrecktes Verfahren'
    children:
    - label: 1. Grundverwaltungsakt vorhanden, wirksam, auf Handlung/Duldung/Unterlassung
        gerichtet
      hinweis: Rechtmäßigkeit des Grund-VA nicht Voraussetzung (h. M.); nur Wirksamkeit.
    - label: '2. Vollstreckbarkeit: unanfechtbar oder sofort vollziehbar, § 6 Abs. 1 VwVG'
    - label: 3. Androhung, § 13 VwVG (Frist, bestimmtes Zwangsmittel)
    - label: 4. Festsetzung (bei Zwangsgeld) und Anwendung des Zwangsmittels
    - label: 5. Zwangsmittel zulässig und verhältnismäßig, §§ 9 bis 12 VwVG
  - label: 'IV. Alternativ: Sofortvollzug, § 6 Abs. 2 VwVG'
    hinweis: Hypothetischer Verwaltungsakt rechtmäßig? Gefahr, Notwendigkeit.
  - label: 'V. Kosten: Kostenbescheid rechtmäßig, Höhe und Schuldner'
faelle:
- slug: or-fall-vwr-vollstr-schrottauto-ersatzvornahme
  title: Das Schrottauto im Hof
  difficulty: 3
  minutes: 60
  quellen:
  - Eigener Sachverhalt der Redaktion
  - VwVG, amtliche Fassung (Bund)
  - Eigenformulierung Redaktion
  facts: Die zuständige Behörde ordnet gegenüber dem Eigentümer E durch schriftlichen Verwaltungsakt
    an, ein abgestelltes, nicht mehr fahrbereites Fahrzeug von seinem Grundstück zu entfernen
    und ordnungsgemäß zu entsorgen. Sie stützt sich dabei auf eine rechtlich vorgesehene Ermächtigung;
    ob die Anordnung materiell rechtmäßig war, ist zweifelhaft. E ficht den Bescheid nicht
    an; er wird bestandskräftig. Nach Ablauf der gesetzten Frist droht die Behörde in einem
    weiteren schriftlichen Bescheid unter Setzung einer angemessenen Frist die Ersatzvornahme
    an und nennt voraussichtliche Kosten von 850 Euro. E bleibt untätig. Die Behörde beauftragt
    einen Abschleppunternehmer, der das Fahrzeug entfernt und 850 Euro in Rechnung stellt.
    Die Behörde setzt die Kosten gegenüber E durch Kostenbescheid fest. E meint, die Grundverfügung
    sei rechtswidrig gewesen und deshalb auch der Kostenbescheid. Es gelten Vorschriften,
    die dem VwVG des Bundes entsprechen.
  question: Ist der Kostenbescheid rechtmäßig?
  steps:
  - prompt: Welche Vollstreckungsform liegt vor, und welche Voraussetzungen müssen erfüllt
      sein?
    erwartung: 'Gestrecktes Verfahren nach § 6 Abs. 1 VwVG: wirksamer, vollstreckbarer Grundverwaltungsakt,
      Androhung (§ 13 VwVG) mit Fristsetzung, dann Ersatzvornahme (§ 10 VwVG), weil die Entsorgung
      eine vertretbare Handlung ist.'
  - prompt: War der Grundverwaltungsakt vollstreckbar, und ist seine Rechtswidrigkeit zu prüfen?
    erwartung: Er ist bestandskräftig und damit unanfechtbar (§ 6 Abs. 1 VwVG), wirksam (§
      43 VwVfG) und nicht nichtig (§ 44 VwVfG). Nach h. M. ist seine Rechtmäßigkeit im Vollstreckungsverfahren
      nicht zu prüfen (keine Konnexität); der Einwand des E greift nicht durch.
  - prompt: War die Androhung ordnungsgemäß und die Ersatzvornahme das richtige Mittel?
    erwartung: Ja. Die Androhung erfolgte schriftlich mit angemessener Frist, benannte das
      Zwangsmittel bestimmt und nannte voraussichtliche Kosten (§ 13 VwVG). Die Entsorgung
      ist eine vertretbare Handlung, die Ersatzvornahme verhältnismäßig (§ 9 Abs. 2 VwVG).
  - prompt: Ist der Kostenbescheid rechtmäßig?
    erwartung: Ja. Der Pflichtige trägt die Kosten der Ersatzvornahme (§ 10 VwVG); die Kosten
      sind tatsächlich entstanden und angemessen (850 Euro); der Kostenbescheid ist rechtmäßig.
