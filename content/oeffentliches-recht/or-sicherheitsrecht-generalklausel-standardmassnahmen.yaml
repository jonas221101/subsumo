cards:
- slug: or-sr-schutzgut-oeffentliche-sicherheit
  type: definition
  front: Was schützt das Schutzgut 'öffentliche Sicherheit' im Polizei- und Ordnungsrecht?
  back: 'Öffentliche Sicherheit umfasst die Unverletzlichkeit der objektiven Rechtsordnung
    (aller Normen des öffentlichen Rechts einschließlich des Straf- und Ordnungswidrigkeitenrechts),
    der subjektiven Rechte und Rechtsgüter des Einzelnen (Leben, Gesundheit, Eigentum,
    Ehre) sowie des Bestands des Staates und seiner Einrichtungen. Ein Verstoß gegen
    eine Norm des öffentlichen Rechts begründet grundsätzlich bereits eine Gefahr
    für die öffentliche Sicherheit. Der Schutz privater Rechte ist dagegen nur subsidiär
    Aufgabe der Polizei: Sie wird hier nur tätig, wenn gerichtlicher Schutz nicht
    rechtzeitig zu erlangen ist und ohne polizeiliche Hilfe die Verwirklichung des
    Rechts vereitelt oder wesentlich erschwert würde (vgl. die Subsidiaritätsklauseln
    der Polizeigesetze der Länder). Bloße Verstöße gegen Zivilrecht sind daher für
    sich keine Gefahr für die öffentliche Sicherheit.'
  norms: []
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: or-sr-schutzgut-oeffentliche-ordnung
  type: definition
  front: Was ist die 'öffentliche Ordnung', und warum hat dieses Schutzgut praktisch
    an Bedeutung verloren?
  back: Die öffentliche Ordnung bezeichnet die Gesamtheit der ungeschriebenen Regeln,
    deren Befolgung nach den jeweils herrschenden Anschauungen als unerlässliche Voraussetzung
    eines gedeihlichen Zusammenlebens innerhalb eines bestimmten Gebiets angesehen
    wird. Wegen des rechtsstaatlichen Bestimmtheitsgebots und der zunehmenden Ausdifferenzierung
    geschriebenen Rechts ist der eigenständige Anwendungsbereich dieses Schutzguts
    heute sehr klein geworden - die Rechtsprechung verlangt einen begründeten Ausnahmefall,
    in dem kein geschriebenes Recht einschlägig ist, aber ein Verhalten evident als
    grob sozialwidrig empfunden wird.
  norms:
  - Art. 20 Abs. 3 GG
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: or-sr-konkrete-gefahr
  type: definition
  front: 'Definiere: konkrete Gefahr im Polizei- und Ordnungsrecht'
  back: 'Eine konkrete Gefahr liegt vor, wenn eine Sachlage oder ein Verhalten bei
    ungehindertem Ablauf des objektiv zu erwartenden Geschehens mit hinreichender
    Wahrscheinlichkeit in absehbarer Zeit zu einem Schaden für die öffentliche Sicherheit
    oder Ordnung führt. Maßstab für die Wahrscheinlichkeit ist eine Je-desto-Formel:
    je höherrangig das bedrohte Rechtsgut und je gewichtiger der drohende Schaden,
    desto geringere Anforderungen sind an den Grad der Wahrscheinlichkeit zu stellen.'
  norms: []
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: or-sr-anscheinsgefahr
  type: streitstand
  front: Was ist eine Anscheinsgefahr, und wie wirkt sie sich auf die Rechtmäßigkeit
    des Einschreitens aus?
  back: 'Eine Anscheinsgefahr liegt vor, wenn ein pflichtgemäß und sachkundig handelnder
    Amtsträger bei verständiger Würdigung der im Zeitpunkt des Handelns erkennbaren
    Umstände (ex-ante-Sicht) das Vorliegen einer Gefahr bejahen durfte, sich aber
    im Nachhinein (ex-post) herausstellt, dass tatsächlich keine Gefahr bestand. Die
    Prognose fällt also bereits ex ante positiv aus; der Schaden tritt nur objektiv
    nicht ein. Nach heute herrschender Auffassung ist die Anscheinsgefahr polizeirechtlich
    einer echten Gefahr gleichgestellt - die Maßnahme ist rechtmäßig, wenn die Ex-ante-Prognose
    sorgfältig war. Streitig ist dagegen, wer die Kosten einer daraufhin ergriffenen
    Maßnahme trägt, wenn sich die Prognose als falsch erweist: nach einer Ansicht
    der vermeintliche Handlungsstörer (da er den Anschein gesetzt hat), nach anderer
    Ansicht die Allgemeinheit, wenn den vermeintlichen Störer kein Verschulden an
    der Fehlvorstellung trifft. Abzugrenzen ist der Gefahrenverdacht, bei dem schon
    ex ante offen ist, ob eine Gefahr besteht.'
  norms: []
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: or-sr-gefahrenverdacht
  type: definition
  front: Wie unterscheidet sich der Gefahrenverdacht von der Anscheinsgefahr, und
    welche Maßnahmen sind dort zulässig?
  back: 'Beim Gefahrenverdacht bleibt bereits ex ante ungewiss, ob eine Gefahr besteht:
    Es gibt Anhaltspunkte für einen möglichen Schadenseintritt, aber die Behörde kann
    das Vorliegen der Gefahr (Sachverhalt oder Wahrscheinlichkeit des Schadenseintritts)
    noch nicht verlässlich beurteilen. Bei der Anscheinsgefahr dagegen bejaht der
    Amtsträger die Gefahr ex ante auf sorgfältiger Grundlage; nur ex post zeigt sich,
    dass objektiv keine Gefahr bestand. Auf einen bloßen Gefahrenverdacht können keine
    endgültigen Gefahrenabwehrmaßnahmen gestützt werden, sondern nur sogenannte Gefahrerforschungseingriffe
    - vorläufige, auf Sachverhaltsaufklärung gerichtete Maßnahmen, die verhältnismäßig
    auf das zur Aufklärung Erforderliche zu begrenzen sind. Ob und in welchem Umfang
    das Landesrecht Eingriffe schon bei bloßem Verdacht zulässt, richtet sich nach
    der jeweiligen Befugnisnorm.'
  norms: []
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: or-sr-subsidiaritaet-generalklausel
  type: definition
  front: In welchem Verhältnis stehen die polizeiliche Generalklausel und die Standardmaßnahmen
    zueinander?
  back: 'Standardmaßnahmen (z. B. Identitätsfeststellung, Platzverweis, Durchsuchung,
    Sicherstellung) sind bereichsspezifische, vom Gesetzgeber für typische, wiederkehrende
    Eingriffssituationen ausformulierte Befugnisnormen mit eigenen, meist engeren
    Voraussetzungen und gehen der Generalklausel als spezielleres Recht vor (lex specialis).
    Fällt die Maßnahme in den Anwendungsbereich einer Standardmaßnahme, entfaltet
    diese Sperrwirkung: Die Generalklausel darf dann nicht herangezogen werden, um
    deren Voraussetzungen zu umgehen. Die Generalklausel - die Ermächtigung, die nötigen
    Maßnahmen zur Abwehr einer im Einzelfall bestehenden Gefahr zu treffen - ist subsidiär
    und kommt nur zum Zug, wenn keine Standardmaßnahme die konkrete Maßnahme erfasst.
    Diese Subsidiarität ist in der Klausur stets VOR dem Rückgriff auf die Generalklausel
    zu prüfen.'
  norms:
  - Art. 20 Abs. 3 GG
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: or-sr-stoererbegriffe
  type: definition
  front: Unterscheide Handlungsstörer, Zustandsstörer und Nichtstörer
  back: Handlungsstörer ist, wer die Gefahr durch eigenes Verhalten unmittelbar verursacht
    hat. Zustandsstörer ist, wer die tatsächliche oder rechtliche Gewalt über eine
    Sache innehat, von der die Gefahr ausgeht, unabhängig von eigenem Verschulden.
    Zwischen mehreren Verantwortlichen trifft die Behörde eine Störerauswahl nach
    pflichtgemäßem Ermessen, vorrangig nach dem Gebot effektiver Gefahrenabwehr (Schnelligkeit
    und Wirksamkeit), nicht nach Verschulden oder Leistungsfähigkeit; auch auf Seiten
    des Verantwortlichen gilt das Verhältnismäßigkeitsgebot. Ein Nichtstörer kann
    nur unter engen, kumulativen Voraussetzungen des polizeilichen Notstands in Anspruch
    genommen werden - insbesondere bei einer gegenwärtigen erheblichen Gefahr, wenn
    Maßnahmen gegen Störer nicht oder nicht rechtzeitig möglich sind und die Behörde
    nicht anders und nicht rechtzeitig selbst handeln kann. Für die dadurch entstandenen
    Nachteile steht dem in Anspruch genommenen Nichtstörer nach den Polizei- und Ordnungsgesetzen
    der Länder ein Entschädigungs- bzw. Ausgleichsanspruch zu.
  norms: []
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: or-sr-verhaeltnismaessigkeit-eingriffsgrundlage
  type: norm
  front: Woraus folgt das Verhältnismäßigkeitsgebot für polizeiliche Maßnahmen, und
    was bedeutet es für die Auswahl zwischen Generalklausel und Ermessen?
  back: Das Verhältnismäßigkeitsgebot folgt aus dem Rechtsstaatsprinzip (Art. 20 Abs.
    3 GG) und begrenzt jeden Grundrechtseingriff - im Sicherheitsrecht häufig einen
    Eingriff in die allgemeine Handlungsfreiheit (Art. 2 Abs. 1 GG) des Betroffenen.
    Die Maßnahme muss geeignet, erforderlich und angemessen sein. Sowohl die Generalklausel
    als auch die meisten Standardmaßnahmen sind zudem als Ermessensvorschriften ausgestaltet
    ('kann'), sodass zusätzlich zur tatbestandlichen Rechtmäßigkeit eine fehlerfreie
    Ermessensausübung hinzutreten muss - vergleichbar dem allgemeinen Ermessensmaßstab
    des § 40 VwVfG, auch wenn das Sicherheitsrecht regelmäßig eigene, dem VwVfG vorgehende
    Ermessensvorschriften enthält.
  norms:
  - Art. 20 Abs. 3 GG
  - Art. 2 Abs. 1 GG
  - § 40 VwVfG
  quellen:
  - GG, amtliche Fassung
  - VwVfG, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
schemata:
- slug: or-schema-sicherheitsrecht-generalklausel
  title: 'Rechtmäßigkeit einer polizeilichen Maßnahme: Standardmaßnahme und Generalklausel'
  norms:
  - Art. 20 Abs. 3 GG
  quellen:
  - Eigenformulierung Redaktion
  steps:
  - label: I. Ermächtigungsgrundlage
    children:
    - label: 1. Vorrang einer Standardmaßnahme? (Subsidiaritäts- und Sperrwirkungsprüfung)
      hinweis: Zuerst die speziellen Befugnisnormen (z. B. Platzverweis, Identitätsfeststellung,
        Gewahrsam, Durchsuchung, Sicherstellung) prüfen. Greift eine Standardmaßnahme,
        ist die Generalklausel gesperrt; nur wenn keine Standardmaßnahme die Maßnahme
        erfasst, kommt die Generalklausel zur Anwendung.
    - label: 2. Generalklausel als Auffangbefugnis, falls keine Standardmaßnahme einschlägig
  - label: II. Formelle Rechtmäßigkeit
    children:
    - label: 1. Sachliche und örtliche Zuständigkeit (Polizei- oder Ordnungsbehörde,
        Eilzuständigkeit)
    - label: 2. Verfahren (Anhörung, soweit nicht entbehrlich) und Form
  - label: III. Materielle Voraussetzungen der gewählten Befugnisnorm
    children:
    - label: '1. Schutzgut: öffentliche Sicherheit oder öffentliche Ordnung betroffen'
    - label: 2. Gefahr
      children:
      - label: a) Konkrete Gefahr (Regelfall)
      - label: b) Anscheinsgefahr - polizeirechtlich der Gefahr gleichgestellt bei
          sorgfältiger Ex-ante-Prognose
      - label: c) Gefahrenverdacht - nur Gefahrerforschungseingriffe zulässig
  - label: IV. Richtiger Adressat (Störerauswahl)
    children:
    - label: 1. Handlungs- oder Zustandsstörer
    - label: 2. Auswahl unter mehreren Störern nach dem Gebot effektiver Gefahrenabwehr
    - label: 3. Ausnahmsweise Nichtstörer bei polizeilichem Notstand (kumulative Voraussetzungen);
        Ausgleichs- bzw. Entschädigungsanspruch
  - label: V. Ermessen und Verhältnismäßigkeit
    hinweis: Entschließungs- und Auswahlermessen; Geeignetheit, Erforderlichkeit,
      Angemessenheit; Rechtsstaatsprinzip, Art. 20 Abs. 3 GG.
  - label: VI. Ergebnis
faelle:
- slug: or-fall-herrenloser-koffer-bahnhofsvorplatz
  title: Der herrenlose Koffer auf dem Bahnhofsvorplatz
  difficulty: 3
  minutes: 40
  quellen:
  - Eigener Sachverhalt der Redaktion
  facts: Auf dem Vorplatz eines (fiktiven) Hauptbahnhofs entdecken zwei Streifenbeamte
    der zuständigen Polizeibehörde einen unbeaufsichtigten Koffer, der mehrfach tickende
    Geräusche von sich gibt. Da zur selben Zeit in der naheliegenden Innenstadt eine
    große öffentliche Veranstaltung stattfindet, gehen die Beamten nach pflichtgemäßer
    Einschätzung der Lage von einer möglichen Sprengvorrichtung aus und sperren den
    Vorplatz großräumig ab; alle Personen im Umkreis von 50 Metern werden zum Verlassen
    des Bereichs aufgefordert. Eine anschließende Untersuchung durch den Entschärfungsdienst
    ergibt, dass es sich um einen vergessenen Wecker mit tickendem Uhrwerk in einer
    harmlosen Reisetasche handelte - eine tatsächliche Gefahr bestand zu keinem Zeitpunkt.
    Der Reisende R, der den Bahnhofsvorplatz während der Absperrung nicht betreten
    durfte und dadurch seinen Zug verpasste, hält die Maßnahme für rechtswidrig, weil
    sich im Nachhinein herausgestellt habe, dass gar keine Gefahr vorlag.
  question: War die Absperrung des Bahnhofsvorplatzes und die Platzverweisung der
    anwesenden Personen rechtmäßig?
  steps:
  - prompt: Welche Art von Gefahrenlage liegt hier vor?
    erwartung: Eine Anscheinsgefahr - die Beamten durften nach der ex-ante erkennbaren
      Sachlage (tickender Koffer, große Veranstaltung in der Nähe) sachkundig von
      einer Gefahr ausgehen, obwohl sich ex-post herausstellte, dass keine echte Gefahr
      bestand.
  - prompt: Ist die Anscheinsgefahr für die Rechtmäßigkeit der Maßnahme einer echten
      Gefahr gleichgestellt?
    erwartung: Ja - nach heute herrschender Auffassung reicht für die Rechtmäßigkeit
      des Einschreitens eine sorgfältige, pflichtgemäße Ex-ante-Prognose aus; dass
      sich die Gefahr im Nachhinein nicht bestätigt, macht die Maßnahme nicht rückwirkend
      rechtswidrig.
  - prompt: War vorrangig eine Standardmaßnahme statt der Generalklausel zu prüfen?
    erwartung: Ja - die Aufforderung an die Anwesenden, den Bereich zu verlassen,
      und das Verbot, ihn zu betreten (großräumige Absperrung), ist ein Platzverweis,
      also eine Standardmaßnahme (z. B. Art. 16 PAG, § 34 PolG NRW, § 29 ASOG Bln).
      Diese ist gegenüber der Generalklausel vorrangig und entfaltet Sperrwirkung;
      auf die Generalklausel darf nicht zurückgegriffen werden. Der Platzverweis setzt
      eine (hier ex ante bejahte) Gefahr voraus, und die Anwesenden sind weder Handlungs-
      noch Zustandsstörer.
  - prompt: Gegen wen durfte sich die Maßnahme richten (Störer oder Nichtstörer)?
    erwartung: 'Die anwesenden Passanten und Reisenden sind weder Handlungs- noch
      Zustandsstörer, sondern Nichtstörer. Ihre Inanspruchnahme ist nur im polizeilichen
      Notstand zulässig (z. B. Art. 10 PAG, § 6 PolG NRW): gegenwärtige erhebliche
      Gefahr, keine rechtzeitig mögliche Inanspruchnahme eines Störers (der Eigentümer
      des Koffers ist unbekannt), keine eigene rechtzeitige Abhilfe durch die Behörde
      und keine eigene erhebliche Gefährdung der Betroffenen. Diese Voraussetzungen
      liegen hier vor. Die Betroffenen können nach den Polizeigesetzen der Länder
      für ihre Nachteile Entschädigung bzw. Ausgleich verlangen.'
  - prompt: War die Maßnahme verhältnismäßig?
    erwartung: Ja - angesichts der potenziell hochrangigen bedrohten Rechtsgüter (Leben,
      Gesundheit einer Vielzahl von Personen) war die großräumige, zeitlich auf die
      Gefahraufklärung begrenzte Absperrung geeignet, erforderlich und angemessen,
      auch wenn einzelne Reisende dadurch Nachteile wie einen verpassten Zug erlitten.
  - prompt: Ist der Einwand des R durchgreifend, die Maßnahme sei rechtswidrig, weil
      sich im Nachhinein keine echte Gefahr bestätigt habe?
    erwartung: Nein - für die Rechtmäßigkeitsbeurteilung ist die Ex-ante-Sicht eines
      pflichtgemäß handelnden Amtsträgers maßgeblich, nicht das später bekannt gewordene
      tatsächliche Ergebnis. Der Einwand des R geht daher fehl.
