- slug: or-schema-gr-jgr-konkurrentenstreit
  title: Konkurrentenstreit nach Art. 33 Abs. 2 GG (Eilrechtsschutz)
  norms:
  - Art. 33 Abs. 2 GG
  - Art. 19 Abs. 4 GG
  - § 123 VwGO
  quellen:
