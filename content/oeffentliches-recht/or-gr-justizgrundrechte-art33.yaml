  - Eigenformulierung Redaktion
  steps:
  - label: I. Zulässigkeit des Antrags nach § 123 VwGO
    children:
    - label: 1. Verwaltungsrechtsweg (§ 40 VwGO, beamtenrechtlich § 54 BeamtStG)
    - label: 2. Statthaftigkeit - Sicherungsanordnung
    - label: 3. Antragsbefugnis (Bewerbungsverfahrensanspruch)
  - label: II. Begründetheit
    children:
    - label: 1. Anordnungsgrund - Eilbedürftigkeit
      hinweis: Ämterstabilität - mit der Ernennung wäre die Stelle besetzt und der
        Rechtsschutz in der Hauptsache vereitelt.
    - label: 2. Anordnungsanspruch - Verletzung des Bewerbungsverfahrensanspruchs
      children:
      - label: a) Rechtmäßigkeit der Auswahl nach Eignung, Befähigung, fachlicher Leistung
      - label: b) Fehler bei der Auswahl (Beurteilung, Hilfskriterien)
        hinweis: Dienstalter nur als Hilfskriterium bei Leistungsgleichstand.
      - label: c) Möglichkeit einer erneuten Auswahl zugunsten des Antragstellers
    - label: 3. Dokumentation der Auswahlentscheidung
  - label: III. Ergebnis
faelle:
- slug: or-fall-gr-jgr-beford-dienstalter
  title: Beförderung nach Dienstalter statt Bestenauslese
  difficulty: 3
  minutes: 40
  quellen:
  - Eigener Sachverhalt der Redaktion
  - GG, amtliche Fassung
  facts: >-
    Beim Land L soll die Leitung eines Referats besetzt werden. Beamter B hat in
    der letzten dienstlichen Beurteilung die Note „sehr gut“ (Spitzennote),
    Beamter C die Note „gut“. C ist jedoch zehn Jahre länger im Dienst. Die
    Behörde entscheidet sich für C, weil bei gleichwertiger Eignung stets das
    Dienstalter den Ausschlag gebe; die Beurteilungen seien nicht entscheidend. Die
    Entscheidung wird B per Schreiben mitgeteilt, die Ernennung des C ist für die
    kommende Woche vorgesehen. B ist der Ansicht, die Auswahl sei rechtswidrig,
    und möchte verhindern, dass C ernannt wird.
  question: Verletzt die Auswahl den B in seinen Rechten, und wie kann B sein Ziel erreichen?
  steps:
  - prompt: Welches Recht des B ist betroffen, und welchen Maßstab muss die Auswahl wahren?
    erwartung: Der Bewerbungsverfahrensanspruch aus Art. 33 Abs. 2 GG. Die Auswahl
      muss nach Eignung, Befähigung und fachlicher Leistung erfolgen
      (Bestenauslese). Dazu sind in erster Linie die aktuellen dienstlichen
      Beurteilungen heranzuziehen.
  - prompt: War die Auswahl des C rechtmäßig?
    erwartung: Nein. B ist nach der Beurteilung besser. Das Dienstalter ist nur ein
      Hilfskriterium, das bei im Wesentlichen gleichem Leistungsstand
      herangezogen werden darf. Hier ist B aber besser beurteilt (Spitzennote). Die
      Entscheidung verletzt Art. 33 Abs. 2 GG und den Bewerbungsverfahrensanspruch
      des B.
  - prompt: Wie kann B die Ernennung des C verhindern?
    erwartung: B muss vor der Ernennung beim Verwaltungsgericht einen Antrag auf
      einstweilige Anordnung nach § 123 VwGO (Sicherungsanordnung) stellen, mit dem
      er der Behörde untersagt, die Stelle mit C zu besetzen. Denn mit der
      Aushändigung der Ernennungsurkunde tritt Ämterstabilität ein, sodass eine
      Hauptsacheklage danach in der Regel erfolglos wäre. Nach Art. 19 Abs. 4 GG
      war die vorherige Mitteilung der Entscheidung an B geboten, damit er
      rechtzeitig Rechtsschutz erlangen kann.
