    - label: 2. Wiederherstellung der aufschiebenden Wirkung, Var. 2 - bei behördlicher
        Sofortvollzugsanordnung, § 80 Abs. 2 Nr. 4 VwGO
  - label: III. Antragsbefugnis, § 42 Abs. 2 VwGO analog
  - label: IV. Ordnungsgemäße Antragstellung, allgemeines Rechtsschutzbedürfnis
    hinweis: Bei Var. 2 regelmäßig vorheriger erfolgloser Antrag auf Aussetzung
