  - label: VI. Ergebnis
faelle:
- slug: or-fall-gewerbeuntersagung-sofortvollzug
  title: Die formelhaft begründete Sofortvollzugsanordnung
  difficulty: 4
  minutes: 60
  quellen:
  - Eigener Sachverhalt der Redaktion
  - VwGO, amtliche Fassung
  facts: Die zuständige Behörde untersagt dem G die Ausübung seines Gewerbes und
    ordnet zugleich die sofortige Vollziehung an. Zur Begründung der Vollziehungsanordnung
    führt sie lediglich aus, "die sofortige Vollziehung liegt im öffentlichen Interesse",
    ohne auf die konkreten Umstände des Falles einzugehen. G legt fristgerecht Widerspruch
    ein und möchte vorläufigen Rechtsschutz erlangen, bevor über den Widerspruch
    entschieden ist.
  question: Welcher Antrag ist statthaft, und hat er Aussicht auf Erfolg?
  steps:
  - prompt: Welcher Antrag ist statthaft?
    erwartung: Der Antrag auf Wiederherstellung der aufschiebenden Wirkung, § 80 Abs.
      5 S. 1 Var. 2 VwGO - die Behörde selbst hat die sofortige Vollziehung angeordnet,
      § 80 Abs. 2 Nr. 4 VwGO.
  - prompt: Ist G antragsbefugt?
    erwartung: Ja - als Adressat der belastenden Gewerbeuntersagung macht G möglicherweise
      eine Rechtsverletzung geltend, § 42 Abs. 2 VwGO analog.
  - prompt: Genügt die Begründung der Vollziehungsanordnung den Anforderungen des
      § 80 Abs. 3 VwGO?
    erwartung: Nein - die Formel 'liegt im öffentlichen Interesse' ist eine floskelhafte
      Wendung ohne Bezug zu den konkreten Umständen des Falles und erfüllt nicht
      die Anforderungen an eine einzelfallbezogene Begründung.
  - prompt: Wie wirkt sich der Begründungsmangel auf den Erfolg des Antrags aus?
    erwartung: Die Vollziehungsanordnung ist formell rechtswidrig; unabhängig von
      der materiellen Rechtmäßigkeit der Gewerbeuntersagung selbst überwiegt deshalb
      regelmäßig das Aussetzungsinteresse des G, sodass das Gericht die aufschiebende
      Wirkung wiederherstellt.
  expectation:
    pruefpunkte:
    - id: p1
      label: Statthafter Antrag als Wiederherstellung der aufschiebenden Wirkung,
        § 80 Abs. 5 S. 1 Var. 2 VwGO, erkannt
      weight: 2.5
      required: true
      norms:
      - § 80 Abs. 5 VwGO
      keywords:
      - Wiederherstellung
      - Var. 2
      - § 80 Abs. 5
      card_slugs:
      - or-vwgo-vrs-anordnung-vs-wiederherstellung
    - id: p2
      label: Zuordnung zu § 80 Abs. 2 Nr. 4 VwGO (behördlich angeordneter Sofortvollzug)
      weight: 2.0
      required: true
      norms:
      - § 80 Abs. 2 VwGO
      keywords:
      - § 80 Abs. 2 Nr. 4
      - behördliche Anordnung
      card_slugs:
      - or-vwgo-vrs-ausnahmen-80-abs2
    - id: p3
      label: Begründungsmangel nach § 80 Abs. 3 VwGO erkannt und als floskelhaft
        qualifiziert
      weight: 3.0
      required: true
      norms:
      - § 80 Abs. 3 VwGO
      keywords:
      - Begründung
      - floskelhaft
      - Einzelfall
      card_slugs:
      - or-vwgo-vrs-begruendungspflicht-sofortvollzug
    - id: p4
      label: Antragsbefugnis bejaht
      weight: 1.0
      required: false
      keywords:
      - Antragsbefugnis
    - id: p5
      label: 'Ergebnis: Antrag begründet, aufschiebende Wirkung wird wiederhergestellt'
      weight: 1.5
      required: false
      keywords:
      - begründet
      - wiederhergestellt

