  - label: VI. Ergebnis
faelle:
- slug: or-fall-gewerbeuntersagung-sofortvollzug
  title: Die formelhaft begruendete Sofortvollzugsanordnung
  difficulty: 4
  minutes: 60
  quellen:
  - Eigener Sachverhalt der Redaktion
  - VwGO, amtliche Fassung
  facts: Die zustaendige Behoerde untersagt dem G die Ausuebung seines Gewerbes und
    ordnet zugleich die sofortige Vollziehung an. Zur Begruendung der Vollziehungsanordnung
    fuehrt sie lediglich aus, "die sofortige Vollziehung liegt im oeffentlichen Interesse",
    ohne auf die konkreten Umstaende des Falles einzugehen. G legt fristgerecht Widerspruch
    ein und moechte vorlaeufigen Rechtsschutz erlangen, bevor ueber den Widerspruch
    entschieden ist.
  question: Welcher Antrag ist statthaft, und hat er Aussicht auf Erfolg?
  steps:
  - prompt: Welcher Antrag ist statthaft?
    erwartung: Der Antrag auf Wiederherstellung der aufschiebenden Wirkung, § 80 Abs.
      5 S. 1 Var. 2 VwGO - die Behoerde selbst hat die sofortige Vollziehung angeordnet,
      § 80 Abs. 2 Nr. 4 VwGO.
  - prompt: Ist G antragsbefugt?
    erwartung: Ja - als Adressat der belastenden Gewerbeuntersagung macht G moeglicherweise
      eine Rechtsverletzung geltend, § 42 Abs. 2 VwGO analog.
  - prompt: Genuegt die Begruendung der Vollziehungsanordnung den Anforderungen des
      § 80 Abs. 3 VwGO?
    erwartung: Nein - die Formel 'liegt im oeffentlichen Interesse' ist eine floskelhafte
      Wendung ohne Bezug zu den konkreten Umstaenden des Falles und erfuellt nicht
      die Anforderungen an eine einzelfallbezogene Begruendung.
  - prompt: Wie wirkt sich der Begruendungsmangel auf den Erfolg des Antrags aus?
    erwartung: Die Vollziehungsanordnung ist formell rechtswidrig; unabhaengig von
      der materiellen Rechtmaessigkeit der Gewerbeuntersagung selbst ueberwiegt deshalb
      regelmaessig das Aussetzungsinteresse des G, sodass das Gericht die aufschiebende
      Wirkung wiederherstellt.
  expectation:
    pruefpunkte:
    - id: p1
      label: Statthafter Antrag als Wiederherstellung der aufschiebenden Wirkung,
        § 80 Abs. 5 S. 1 Var. 2 VwGO, erkannt
      weight: 2.5
      required: true
      norms:
      - § 80 Abs. 5 VwGO
      keywords:
      - Wiederherstellung
      - Var. 2
      - § 80 Abs. 5
    - id: p2
      label: Zuordnung zu § 80 Abs. 2 Nr. 4 VwGO (behoerdlich angeordneter Sofortvollzug)
      weight: 2.0
      required: true
      norms:
      - § 80 Abs. 2 VwGO
      keywords:
      - § 80 Abs. 2 Nr. 4
      - behoerdliche Anordnung
    - id: p3
      label: Begruendungsmangel nach § 80 Abs. 3 VwGO erkannt und als floskelhaft
        qualifiziert
      weight: 3.0
      required: true
      norms:
      - § 80 Abs. 3 VwGO
      keywords:
      - Begruendung
      - floskelhaft
      - Einzelfall
    - id: p4
      label: Antragsbefugnis bejaht
      weight: 1.0
      required: false
      keywords:
      - Antragsbefugnis
    - id: p5
      label: 'Ergebnis: Antrag begruendet, aufschiebende Wirkung wird wiederhergestellt'
      weight: 1.5
      required: false
      keywords:
      - begruendet
      - wiederhergestellt
