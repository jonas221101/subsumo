cards:
- slug: or-vwgo-vrs-grundsatz-aufschiebende-wirkung
  type: definition
  front: Was ist der Grundsatz des § 80 Abs. 1 VwGO?
  back: 'Widerspruch und Anfechtungsklage haben grundsaetzlich aufschiebende Wirkung,
    § 80 Abs. 1 S. 1 VwGO: Der angefochtene Verwaltungsakt darf bis zur bestandskraeftigen
    oder rechtskraeftigen Entscheidung nicht vollzogen werden. Dieser Suspensiveffekt
    ist die Regel; er entfaellt nur in den in § 80 Abs. 2 VwGO abschliessend aufgezaehlten
    Faellen.'
  norms:
  - § 80 Abs. 1 VwGO
  quellen:
  - VwGO, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: or-vwgo-vrs-ausnahmen-80-abs2
  type: norm
  front: Nenne die Ausnahmen vom Suspensiveffekt nach § 80 Abs. 2 VwGO
  back: Die aufschiebende Wirkung entfaellt bei (1) der Anforderung von oeffentlichen
    Abgaben und Kosten, (2) unaufschiebbaren Anordnungen und Massnahmen von Polizeivollzugsbeamten,
    (3) sonstigen bundes- oder landesrechtlich angeordneten Faellen sowie (4) der
    behoerdlichen Anordnung der sofortigen Vollziehung im oeffentlichen Interesse
    oder im ueberwiegenden Interesse eines Beteiligten.
  norms:
  - § 80 Abs. 2 VwGO
  quellen:
  - VwGO, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: or-vwgo-vrs-anordnung-vs-wiederherstellung
  type: streitstand
  front: Grenze 'Anordnung' und 'Wiederherstellung' der aufschiebenden Wirkung, §
    80 Abs. 5 S. 1 VwGO, voneinander ab
  back: Ein Antrag auf Anordnung der aufschiebenden Wirkung (Var. 1) ist statthaft,
    wenn diese kraft Gesetzes entfallen ist (§ 80 Abs. 2 Nr. 1-3 VwGO) - hier muss
    sie erst geschaffen werden. Ein Antrag auf Wiederherstellung der aufschiebenden
    Wirkung (Var. 2) ist statthaft, wenn eine Behoerde selbst die sofortige Vollziehung
    angeordnet hat (§ 80 Abs. 2 Nr. 4 VwGO) - hier bestand die aufschiebende Wirkung
    urspruenglich und soll wiederhergestellt werden.
  norms:
  - § 80 Abs. 5 VwGO
  - § 80 Abs. 2 VwGO
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: or-vwgo-vrs-begruendungspflicht-sofortvollzug
  type: norm
  front: Was verlangt § 80 Abs. 3 S. 1 VwGO bei behoerdlicher Anordnung des Sofortvollzugs?
  back: Ordnet die Behoerde selbst die sofortige Vollziehung an, ist das besondere
    Interesse an der sofortigen Vollziehung schriftlich zu begruenden, § 80 Abs. 3
    S. 1 VwGO. Erforderlich ist eine auf den konkreten Einzelfall bezogene, in sich
    schluessige Darlegung der Dringlichkeitsgruende; formelhafte Wendungen, die auf
    jeden vergleichbaren Fall gleichermassen passen wuerden, genuegen nicht. Ein Begruendungsmangel
    fuehrt zur formellen Rechtswidrigkeit der Vollziehungsanordnung, laesst den Grundverwaltungsakt
    selbst aber unberuehrt.
  norms:
  - § 80 Abs. 3 VwGO
  quellen:
  - VwGO, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: or-vwgo-vrs-pruefungsmassstab
  type: definition
  front: Nach welchem Massstab entscheidet das Gericht ueber einen Antrag nach § 80
    Abs. 5 VwGO?
  back: 'Das Gericht trifft eine eigene Ermessensentscheidung aufgrund einer Interessenabwaegung
    zwischen dem Vollzugsinteresse und dem Aussetzungsinteresse des Antragstellers.
    Massgeblich orientiert sich diese Abwaegung an den nach summarischer Pruefung
    erkennbaren Erfolgsaussichten der Hauptsache: Sind ernstliche Zweifel an der Rechtmaessigkeit
    des Verwaltungsakts erkennbar oder ist er offensichtlich rechtswidrig, ueberwiegt
    regelmaessig das Aussetzungsinteresse; ist er offensichtlich rechtmaessig, ueberwiegt
    regelmaessig das Vollzugsinteresse.'
  norms:
  - § 80 Abs. 5 VwGO
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: or-vwgo-vrs-doppelwirkung-80a
  type: norm
  front: Was regelt § 80a VwGO?
  back: § 80a VwGO erstreckt den vorlaeufigen Rechtsschutz auf Verwaltungsakte mit
    Doppelwirkung, also solche, die einen Beguenstigten und zugleich einen belasteten
    Dritten betreffen (z. B. eine Baugenehmigung fuer den Bauherrn und den anfechtenden
    Nachbarn). Legt der Dritte Widerspruch oder Klage gegen den den anderen beguenstigenden
    Verwaltungsakt ein, kann die Behoerde auf Antrag des Beguenstigten die sofortige
    Vollziehung anordnen (§ 80a Abs. 1 Nr. 1 VwGO) oder auf Antrag des Dritten die
    Vollziehung aussetzen (§ 80a Abs. 1 Nr. 2 VwGO); das Gericht kann entsprechend
    nach § 80a Abs. 3 i.V.m. § 80 Abs. 5 VwGO entscheiden.
  norms:
  - § 80a Abs. 1 VwGO
  - § 80a Abs. 3 VwGO
  quellen:
  - VwGO, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
schemata:
- slug: or-schema-vwgo-80-abs5
  title: Antrag nach § 80 Abs. 5 VwGO
  norms:
