cards:
- slug: or-vwgo-vrs-grundsatz-aufschiebende-wirkung
  type: definition
  front: Was ist der Grundsatz des § 80 Abs. 1 VwGO?
  back: 'Widerspruch und Anfechtungsklage haben grundsätzlich aufschiebende Wirkung,
    § 80 Abs. 1 S. 1 VwGO: Der angefochtene Verwaltungsakt darf bis zur bestandskräftigen
    oder rechtskräftigen Entscheidung nicht vollzogen werden. Dieser Suspensiveffekt
    ist die Regel; er entfällt nur in den in § 80 Abs. 2 VwGO abschließend aufgezählten
    Fällen.'
  norms:
  - § 80 Abs. 1 VwGO
  quellen:
  - VwGO, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: or-vwgo-vrs-ausnahmen-80-abs2
  type: norm
  front: Nenne die Ausnahmen vom Suspensiveffekt nach § 80 Abs. 2 VwGO
  back: Die aufschiebende Wirkung entfällt bei (1) der Anforderung von öffentlichen
    Abgaben und Kosten, (2) unaufschiebbaren Anordnungen und Maßnahmen von Polizeivollzugsbeamten,
    (3) sonstigen bundes- oder landesrechtlich angeordneten Fällen sowie (4) der
    behördlichen Anordnung der sofortigen Vollziehung im öffentlichen Interesse
    oder im überwiegenden Interesse eines Beteiligten.
  norms:
  - § 80 Abs. 2 VwGO
  quellen:
  - VwGO, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: or-vwgo-vrs-anordnung-vs-wiederherstellung
  type: streitstand
  front: Grenze 'Anordnung' und 'Wiederherstellung' der aufschiebenden Wirkung, §
    80 Abs. 5 S. 1 VwGO, voneinander ab
  back: Ein Antrag auf Anordnung der aufschiebenden Wirkung (Var. 1) ist statthaft,
    wenn diese kraft Gesetzes entfallen ist (§ 80 Abs. 2 Nr. 1-3 VwGO) - hier muss
    sie erst geschaffen werden. Ein Antrag auf Wiederherstellung der aufschiebenden
    Wirkung (Var. 2) ist statthaft, wenn eine Behörde selbst die sofortige Vollziehung
    angeordnet hat (§ 80 Abs. 2 Nr. 4 VwGO) - hier bestand die aufschiebende Wirkung
    ursprünglich und soll wiederhergestellt werden.
  norms:
  - § 80 Abs. 5 VwGO
  - § 80 Abs. 2 VwGO
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: or-vwgo-vrs-begruendungspflicht-sofortvollzug
  type: norm
  front: Was verlangt § 80 Abs. 3 S. 1 VwGO bei behördlicher Anordnung des Sofortvollzugs?
  back: Ordnet die Behörde selbst die sofortige Vollziehung an, ist das besondere
    Interesse an der sofortigen Vollziehung schriftlich zu begründen, § 80 Abs. 3
    S. 1 VwGO. Erforderlich ist eine auf den konkreten Einzelfall bezogene, in sich
    schlüssige Darlegung der Dringlichkeitsgründe; formelhafte Wendungen, die auf
    jeden vergleichbaren Fall gleichermaßen passen würden, genügen nicht. Ein Begründungsmangel
    führt zur formellen Rechtswidrigkeit der Vollziehungsanordnung, lässt den Grundverwaltungsakt
    selbst aber unberührt.
  norms:
  - § 80 Abs. 3 VwGO
  quellen:
  - VwGO, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: or-vwgo-vrs-pruefungsmassstab
  type: definition
  front: Nach welchem Maßstab entscheidet das Gericht über einen Antrag nach § 80
    Abs. 5 VwGO?
  back: 'Das Gericht trifft eine eigene Ermessensentscheidung aufgrund einer Interessenabwägung
    zwischen dem Vollzugsinteresse und dem Aussetzungsinteresse des Antragstellers.
    Maßgeblich orientiert sich diese Abwägung an den nach summarischer Prüfung
    erkennbaren Erfolgsaussichten der Hauptsache: Sind ernstliche Zweifel an der Rechtmäßigkeit
    des Verwaltungsakts erkennbar oder ist er offensichtlich rechtswidrig, überwiegt
    regelmäßig das Aussetzungsinteresse; ist er offensichtlich rechtmäßig, überwiegt
    regelmäßig das Vollzugsinteresse.'
  norms:
  - § 80 Abs. 5 VwGO
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: or-vwgo-vrs-doppelwirkung-80a
  type: norm
  front: Was regelt § 80a VwGO?
  back: § 80a VwGO erstreckt den vorläufigen Rechtsschutz auf Verwaltungsakte mit
    Doppelwirkung, also solche, die einen Begünstigten und zugleich einen belasteten
    Dritten betreffen (z. B. eine Baugenehmigung für den Bauherrn und den anfechtenden
    Nachbarn). Legt der Dritte Widerspruch oder Klage gegen den den anderen begünstigenden
    Verwaltungsakt ein, kann die Behörde auf Antrag des Begünstigten die sofortige
    Vollziehung anordnen (§ 80a Abs. 1 Nr. 1 VwGO) oder auf Antrag des Dritten die
    Vollziehung aussetzen (§ 80a Abs. 1 Nr. 2 VwGO); das Gericht kann entsprechend
    nach § 80a Abs. 3 i.V.m. § 80 Abs. 5 VwGO entscheiden.
  norms:
  - § 80a Abs. 1 VwGO
  - § 80a Abs. 3 VwGO
  quellen:
  - VwGO, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
