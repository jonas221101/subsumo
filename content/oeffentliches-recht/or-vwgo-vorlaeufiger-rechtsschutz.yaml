  - label: II. Statthafter Antrag
    children:
    - label: 1. Anordnung der aufschiebenden Wirkung, Var. 1 - bei gesetzlichem Ausschluss,
        § 80 Abs. 2 Nr. 1-3 VwGO
    - label: 2. Wiederherstellung der aufschiebenden Wirkung, Var. 2 - bei behoerdlicher
        Sofortvollzugsanordnung, § 80 Abs. 2 Nr. 4 VwGO
  - label: III. Antragsbefugnis, § 42 Abs. 2 VwGO analog
  - label: IV. Ordnungsgemaesse Antragstellung, allgemeines Rechtsschutzbeduerfnis
    hinweis: Bei Var. 2 regelmaessig vorheriger erfolgloser Antrag auf Aussetzung
      bei der Behoerde, § 80 Abs. 6 VwGO (bei Abgaben/Kosten).
  - label: V. Begruendetheit
    children:
