    - id: p6
      label: Rechtsfolge Unwirksamkeitserklärung mit Allgemeinverbindlichkeit und
        Veröffentlichungspflicht nach § 47 Abs. 5 S. 2 VwGO benannt
      weight: 1.5
      required: true
      norms:
      - § 47 Abs. 5 S. 2 VwGO
      keywords:
