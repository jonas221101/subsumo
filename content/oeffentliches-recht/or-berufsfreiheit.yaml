cards:
- slug: or-gr-art12-berufsbegriff
  type: definition
  front: 'Definiere: Beruf i.S.d. Art. 12 Abs. 1 GG'
  back: Beruf ist jede auf Dauer angelegte, der Schaffung und Aufrechterhaltung einer
    Lebensgrundlage dienende Tätigkeit, die nicht schlechthin gemeinschaftsschädlich
    ist. Der Begriff ist bewusst weit gefasst und erfasst auch neu entstehende oder
    unkonventionelle Erwerbstätigkeiten.
  norms:
  - Art. 12 Abs. 1 GG
  quellen:
  - GG, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: or-gr-art12-schutzbereich
  type: definition
  front: Was umfasst der sachliche Schutzbereich des Art. 12 Abs. 1 GG?
  back: Art. 12 Abs. 1 GG schützt als einheitliches Grundrecht der Berufsfreiheit
    die freie Wahl des Berufs, des Arbeitsplatzes und der Ausbildungsstätte (Satz
    1) sowie die Berufsausübung, die durch Gesetz geregelt werden kann (Satz 2).
    Trotz der Aufspaltung in zwei Sätze handelt es sich nach ständiger Auffassung
    um ein einheitliches Grundrecht der Berufsfreiheit, dessen Teilbereiche unterschiedlich
    intensiv eingeschränkt werden können.
  norms:
  - Art. 12 Abs. 1 GG
  quellen:
  - GG, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: or-gr-art12-persoenlicher-schutzbereich
  type: definition
  front: Wer ist Grundrechtsträger des Art. 12 Abs. 1 GG?
  back: Art. 12 Abs. 1 GG ist ein Deutschen-Grundrecht (Art. 116 GG) und schützt
    unmittelbar nur deutsche Staatsangehörige sowie inländische juristische Personen,
    soweit das Grundrecht seinem Wesen nach auf sie anwendbar ist (Art. 19 Abs. 3
    GG). Ausländer können sich für ihre Berufsfreiheit auf die allgemeine Handlungsfreiheit
    aus Art. 2 Abs. 1 GG berufen.
  norms:
  - Art. 12 Abs. 1 GG
  - Art. 116 GG
  - Art. 19 Abs. 3 GG
  - Art. 2 Abs. 1 GG
  quellen:
  - GG, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: or-gr-art12-eingriff
  type: definition
  front: Wann liegt ein Eingriff in Art. 12 Abs. 1 GG vor?
  back: Ein Eingriff liegt vor, wenn eine staatliche Maßnahme eine unmittelbar berufsregelnde
    Tendenz hat, also gerade auf die berufliche Betätigung abzielt oder sie zumindest
    zwangsläufig mitregelt - im Unterschied zu Maßnahmen, die die Berufsausübung
    nur als bloße Rand- oder Nebenfolge einer nicht berufsbezogenen Regelung berühren.
  norms:
  - Art. 12 Abs. 1 GG
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: or-gr-art12-dreistufentheorie
  type: streitstand
  front: Erläutere die Drei-Stufen-Theorie zu Art. 12 Abs. 1 GG
  back: 'Die Drei-Stufen-Theorie ordnet Eingriffe in die Berufsfreiheit nach ihrer

    Intensität und staffelt die Anforderungen an ihre Rechtfertigung

    entsprechend:


    Stufe 1 - Regelungen der Berufsausübung: Der geringste Eingriff, da nur

    das "Wie" der beruflichen Tätigkeit betroffen ist. Bereits vernünftige

    Erwägungen des Gemeinwohls rechtfertigen die Regelung.


    Stufe 2 - subjektive Zulassungsvoraussetzungen: Betreffen das "Ob" des

    Berufszugangs, knüpfen aber an in der Person des Bewerbers liegende

    Eigenschaften an (z. B. eine erforderliche Ausbildung oder Prüfung).

    Gerechtfertigt, soweit sie dem Schutz eines wichtigen Gemeinschaftsguts

    dienen und verhältnismäßig sind.


    Stufe 3 - objektive Zulassungsvoraussetzungen: Der schwerste Eingriff,

    da der Zugang unabhängig von persönlichen Eigenschaften des Bewerbers

    versperrt wird (z. B. eine Bedarfsprüfung). Nur gerechtfertigt zur

    Abwehr nachweisbarer oder mit hoher Wahrscheinlichkeit zu erwartender

    schwerer Gefahren für ein überragend wichtiges Gemeinschaftsgut - reiner

    Konkurrentenschutz genügt dafür nicht.

    '
  norms:
  - Art. 12 Abs. 1 GG
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: or-gr-art12-schranke
  type: norm
  front: Welche Schranke gilt für Art. 12 Abs. 1 GG?
  back: Art. 12 Abs. 1 S. 2 GG enthält einen einfachen Gesetzesvorbehalt, der seinem
    Wortlaut nach nur die Berufsausübung erfasst. Nach ständiger Auffassung erstreckt
    sich dieser Vorbehalt wegen des einheitlichen Grundrechts der Berufsfreiheit auch
    auf die Berufswahl - dort verlangt der Grundsatz der Verhältnismäßigkeit im
    Rahmen der Drei-Stufen-Theorie allerdings strengere Anforderungen als bei einer
    reinen Berufsausübungsregelung.
  norms:
  - Art. 12 Abs. 1 S. 2 GG
  quellen:
  - GG, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
schemata:
- slug: or-schema-art12-berufsfreiheit
  title: Eingriff in Art. 12 Abs. 1 GG und Rechtfertigung nach der Drei-Stufen-Theorie
  norms:
  - Art. 12 Abs. 1 GG
  quellen:
  - GG, amtliche Fassung
  - Eigenformulierung Redaktion
  steps:
  - label: I. Schutzbereich
    children:
    - label: '1. Persönlich: Deutsche i.S.d. Art. 116 GG (Art. 19 Abs. 3 GG bei juristischen
        Personen)'
    - label: '2. Sachlich: Beruf - Berufswahl (inkl. Ausbildungsstätte und Arbeitsplatz)
        und Berufsausübung'
  - label: II. Eingriff
    hinweis: Staatliche Maßnahme mit unmittelbar berufsregelnder Tendenz.
  - label: III. Verfassungsrechtliche Rechtfertigung
    children:
    - label: '1. Schranke: Gesetzesvorbehalt, Art. 12 Abs. 1 S. 2 GG'
    - label: 2. Formelle Verfassungsmäßigkeit des Gesetzes
    - label: '3. Materielle Verfassungsmäßigkeit: Verhältnismäßigkeit nach der
        Drei-Stufen-Theorie'
      children:
      - label: 'a) Stufe 1: Berufsausübungsregelung - vernünftige Gemeinwohlerwägungen
          genügen'
      - label: 'b) Stufe 2: subjektive Zulassungsvoraussetzungen - Schutz eines wichtigen
          Gemeinschaftsguts'
      - label: 'c) Stufe 3: objektive Zulassungsvoraussetzungen - nur zur Abwehr nachweisbarer
          oder höchstwahrscheinlicher schwerer Gefahren für ein überragend wichtiges
          Gemeinschaftsgut'
  - label: IV. Ergebnis
faelle:
- slug: or-fall-baeckerei-bedarfspruefung
  title: Die Bedarfsprüfung für die neue Bäckerei
  difficulty: 4
  minutes: 60
  quellen:
  - Eigener Sachverhalt der Redaktion
  - GG, amtliche Fassung
  facts: Ein (fiktives) Landesgesetz zur Sicherung des Backwarenhandwerks schreibt
    vor, dass die Eröffnung eines neuen Backwarenfachgeschäfts einer behördlichen
    Genehmigung bedarf, die nur erteilt wird, wenn die zuständige Behörde einen
    ausreichenden wirtschaftlichen Bedarf für ein weiteres Geschäft in der jeweiligen
    Gemeinde feststellt. Ziel des Gesetzes ist nach seiner Begründung ausdrücklich,
    bestehende Backwarenfachgeschäfte vor wirtschaftlicher Konkurrenz durch Neugründungen
    zu schützen. B, deutscher Staatsangehöriger und gelernter Bäcker, möchte in
    einer Gemeinde eine neue Bäckerei eröffnen. Die Behörde verweigert die Genehmigung,
    weil in der Gemeinde bereits drei Bäckereien ansässig seien und ein weiterer
    Bedarf nicht bestehe - unabhängig von der fachlichen Qualifikation des B, die
    nicht in Zweifel steht.
  question: Verletzt die Ablehnung der Genehmigung den B in seinem Grundrecht aus
    Art. 12 Abs. 1 GG?
  steps:
  - prompt: Formuliere den Prüfungssatz.
    erwartung: Die Ablehnung der Genehmigung könnte B in seinem Grundrecht auf Berufsfreiheit
      aus Art. 12 Abs. 1 GG verletzen.
  - prompt: Ist der Schutzbereich des Art. 12 Abs. 1 GG eröffnet?
    erwartung: Ja - B ist als Deutscher Grundrechtsträger, und die Eröffnung einer
      Bäckerei ist Berufswahl, die vom sachlichen Schutzbereich umfasst ist.
  - prompt: Liegt ein Eingriff vor?
    erwartung: Ja - die Versagung der erforderlichen Genehmigung hat unmittelbar berufsregelnde
      Tendenz und hindert B am Berufszugang.
  - prompt: Auf welcher Stufe der Drei-Stufen-Theorie ist die Bedarfsprüfung einzuordnen?
    erwartung: 'Auf der dritten Stufe (objektive Zulassungsvoraussetzung): Der Bedarf
      hängt nicht von persönlichen Eigenschaften des B ab, sondern allein von der
      Marktlage, die B nicht beeinflussen kann.'
  - prompt: Ist die Bedarfsprüfung auf dieser Stufe gerechtfertigt?
    erwartung: Nein. Objektive Zulassungsvoraussetzungen sind nur zur Abwehr nachweisbarer
      oder höchstwahrscheinlicher schwerer Gefahren für ein überragend wichtiges
      Gemeinschaftsgut gerechtfertigt. Der bloße Schutz bestehender Betriebe vor
      wirtschaftlicher Konkurrenz ist kein überragend wichtiges Gemeinschaftsgut
      in diesem Sinne.
