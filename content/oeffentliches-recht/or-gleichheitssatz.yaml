cards:
- slug: or-gr-glbs-vergleichspaar
  type: definition
  front: Wie wird eine Ungleichbehandlung i.S.d. Art. 3 Abs. 1 GG festgestellt?
  back: 'Zunächst ist ein taugliches Vergleichspaar zu bilden: zwei Personen oder
    Personengruppen, die hinsichtlich eines gemeinsamen Oberbegriffs wesentlich gleich
    sind, aber vom Normgeber unterschiedlich behandelt werden. Fehlt es an einer solchen
    wesentlichen Vergleichbarkeit, liegt schon keine Ungleichbehandlung vor, die rechtfertigungsbedürftig
    wäre.'
  norms:
  - Art. 3 Abs. 1 GG
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: or-gr-glbs-willkuerformel
  type: definition
  front: Was verlangt die Willkürformel zu Art. 3 Abs. 1 GG?
  back: Nach der (älteren) Willkürformel ist eine Ungleichbehandlung bereits gerechtfertigt,
    wenn sich für sie ein sachlicher, nicht evident unvertretbarer Grund finden lässt
    - der Gesetzgeber muss also nicht den 'besten', sondern nur irgendeinen nachvollziehbaren
    Grund gehabt haben. Dieser großzügige Maßstab gilt nach der neuen Formel weiterhin
    für Differenzierungen, die allein an Verhaltensweisen anknüpfen.
  norms:
  - Art. 3 Abs. 1 GG
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: or-gr-glbs-abstufung-pruefungsmassstab
  type: streitstand
  front: Wovon hängt nach der neuen Formel ab, ob ein strengerer oder ein großzügigerer
    Rechtfertigungsmaßstab gilt?
  back: 'Maßgeblich sind vor allem zwei Kriterien: Erstens, ob die Differenzierung
    an ein personenbezogenes Merkmal anknüpft, das der Einzelne nicht oder nur schwer
    beeinflussen kann (strengerer Maßstab), oder an ein bloßes Verhalten (großzügigerer
    Willkürmaßstab). Zweitens, je näher das Differenzierungsmerkmal an den in Art.
    3 Abs. 3 GG genannten Merkmalen liegt oder je stärker sich die Ungleichbehandlung
    auf die Ausübung grundrechtlich geschützter Freiheiten auswirkt, desto strenger
    sind die Anforderungen an die Rechtfertigung.'
  norms:
  - Art. 3 Abs. 1 GG
  - Art. 3 Abs. 3 GG
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: or-gr-glbs-rechtfertigung-verhaeltnismaessigkeit
  type: schema_step
  front: Wie wird eine Ungleichbehandlung beim strengen Prüfungsmaßstab gerechtfertigt?
  back: 'Beim strengen Maßstab genügt ein sachlicher Grund nicht mehr; die Ungleichbehandlung
    muss vielmehr einem legitimen Zweck dienen und in einer echten Verhältnismäßigkeitsprüfung
    bestehen: Das Differenzierungskriterium muss zur Zweckerreichung geeignet, erforderlich
    (kein milderes, gleich wirksames Differenzierungskriterium) und angemessen sein
    - die Vor- und Nachteile der Differenzierung müssen in einem ausgewogenen Verhältnis
    zum verfolgten Zweck stehen.'
  norms:
  - Art. 3 Abs. 1 GG
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: or-gr-glbs-verhaeltnis-abs2-abs3
  type: norm
  front: In welchem Verhältnis stehen Art. 3 Abs. 2, 3 GG zu Art. 3 Abs. 1 GG?
  back: Art. 3 Abs. 2 GG (Gleichberechtigung von Mann und Frau) und Art. 3 Abs. 3
    GG (Verbot der Benachteiligung/Bevorzugung wegen Geschlecht, Abstammung, Rasse,
    Sprache, Heimat und Herkunft, Glauben, religiöser oder politischer Anschauungen
    sowie Behinderung) sind speziellere Ausprägungen des allgemeinen Gleichheitssatzes
    und gehen als lex specialis der Prüfung des Art. 3 Abs. 1 GG vor, soweit eine
    Differenzierung gerade an eines dieser Merkmale anknüpft. Anders als bei Art.
    3 Abs. 1 GG ist eine Rechtfertigung bei Art. 3 Abs. 3 GG nur in engen, vom BVerfG
    anerkannten Ausnahmefällen möglich.
  norms:
  - Art. 3 Abs. 2 GG
  - Art. 3 Abs. 3 GG
  - Art. 3 Abs. 1 GG
  quellen:
  - GG, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: or-gr-glbs-jedermanngrundrecht
  type: definition
  front: Wer ist Grundrechtsträger des Art. 3 Abs. 1 GG?
  back: Art. 3 Abs. 1 GG ist ein Jedermann-Grundrecht und steht damit unabhängig
    von der Staatsangehörigkeit jeder natürlichen Person zu. Inländische juristische
    Personen können sich nach Art. 19 Abs. 3 GG ebenfalls auf den allgemeinen Gleichheitssatz
    berufen, soweit er seinem Wesen nach auf sie anwendbar ist - etwa bei der Gleichbehandlung
    im Wirtschaftsverkehr.
  norms:
  - Art. 3 Abs. 1 GG
  - Art. 19 Abs. 3 GG
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
schemata:
- slug: or-schema-art3-gleichheitssatz
  title: Prüfung des Art. 3 Abs. 1 GG
  norms:
