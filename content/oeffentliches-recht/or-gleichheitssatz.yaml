          3 Abs. 3 GG bzw. Grundrechtsausübung betroffen -> strenge Verhältnismäßigkeitsprüfung
      - label: b) rein verhaltensbezogen -> Willkürformel (sachlicher Grund genügt)
    - label: 2. Legitimer Zweck der Differenzierung
    - label: '3. Beim strengen Maßstab: Geeignetheit, Erforderlichkeit, Angemessenheit
        der Differenzierung'
