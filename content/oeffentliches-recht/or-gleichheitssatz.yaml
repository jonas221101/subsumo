      keywords:
      - Vergleichspaar
      - wesentlich gleich
      - Ungleichbehandlung
      card_slugs:
      - or-gr-glbs-vergleichspaar
    - id: p2
      label: Strenger Prüfungsmaßstab zutreffend begründet (personenbezogenes,
        nicht beeinflussbares Merkmal)
      weight: 3.0
