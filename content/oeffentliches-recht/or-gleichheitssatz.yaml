      keywords:
      - personenbezogen
      - strenger Maßstab
      - nicht beeinflussbar
      card_slugs:
      - or-gr-glbs-abstufung-pruefungsmassstab
    - id: p3
      label: Rechtfertigung anhand Geeignetheit/Erforderlichkeit geprüft und mangels
        tragfähiger Begründung verneint
      weight: 3.0
