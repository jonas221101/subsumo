faelle:
- slug: or-fall-studiengebuehrenbefreiung-beamteneltern
  title: Die Studiengebührenbefreiung für Kinder von Landesbeamten
  difficulty: 4
  minutes: 60
  quellen:
  - Eigener Sachverhalt der Redaktion
  - GG, amtliche Fassung
  facts: Ein (fiktives) Landesgesetz befreit Studierende von der allgemeinen Studiengebühr,
    wenn mindestens ein Elternteil im Landesdienst als Beamter beschäftigt ist. Die
    Studentin S, deren Eltern nicht im Landesdienst stehen, muss die volle Studiengebühr
    entrichten. Zur Begründung führt der Gesetzgeber lediglich pauschal aus, die
    Regelung stärke "die Bindung des Landesdienstes an den Hochschulstandort"; nähere
    Ausführungen dazu, weshalb gerade die Beamteneigenschaft der Eltern und nicht
    etwa eine eigene Bindung der Studierenden maßgeblich sein soll, fehlen.
  question: Verletzt die Regelung die S in ihrem Recht aus Art. 3 Abs. 1 GG?
  steps:
  - prompt: Liegt eine Ungleichbehandlung wesentlich Gleicher vor?
    erwartung: Ja - Studierende mit im Landesdienst beschäftigten Eltern und Studierende
      ohne diese Elterneigenschaft sind hinsichtlich der Nutzung der Hochschuleinrichtungen
      wesentlich gleich, werden aber bei der Gebührenpflicht unterschiedlich behandelt.
  - prompt: Welcher Prüfungsmaßstab ist anzulegen?
    erwartung: Der strenge Verhältnismäßigkeitsmaßstab - die Differenzierung knüpft
      an ein personenbezogenes Merkmal an (Beschäftigungsstatus der Eltern), das
      S selbst nicht beeinflussen kann.
  - prompt: Ist die Ungleichbehandlung gerechtfertigt?
    erwartung: Nein - selbst wenn man die 'Bindung des Landesdienstes an den Hochschulstandort'
      als legitimen Zweck unterstellt, fehlt es an einer nachvollziehbaren Begründung,
      weshalb gerade die Beamteneigenschaft der Eltern zur Erreichung dieses Zwecks
      geeignet und erforderlich sein soll; die pauschale Begründung trägt die Differenzierung
      nicht.
  expectation:
    pruefpunkte:
