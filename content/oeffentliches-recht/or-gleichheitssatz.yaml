faelle:
- slug: or-fall-studiengebuehrenbefreiung-beamteneltern
  title: Die Studiengebuehrenbefreiung fuer Kinder von Landesbeamten
  difficulty: 4
  minutes: 60
  quellen:
  - Eigener Sachverhalt der Redaktion
  - GG, amtliche Fassung
  facts: Ein (fiktives) Landesgesetz befreit Studierende von der allgemeinen Studiengebuehr,
    wenn mindestens ein Elternteil im Landesdienst als Beamter beschaeftigt ist. Die
    Studentin S, deren Eltern nicht im Landesdienst stehen, muss die volle Studiengebuehr
    entrichten. Zur Begruendung fuehrt der Gesetzgeber lediglich pauschal aus, die
    Regelung staerke "die Bindung des Landesdienstes an den Hochschulstandort"; naehere
    Ausfuehrungen dazu, weshalb gerade die Beamteneigenschaft der Eltern und nicht
    etwa eine eigene Bindung der Studierenden massgeblich sein soll, fehlen.
  question: Verletzt die Regelung die S in ihrem Recht aus Art. 3 Abs. 1 GG?
  steps:
  - prompt: Liegt eine Ungleichbehandlung wesentlich Gleicher vor?
    erwartung: Ja - Studierende mit im Landesdienst beschaeftigten Eltern und Studierende
      ohne diese Elterneigenschaft sind hinsichtlich der Nutzung der Hochschuleinrichtungen
      wesentlich gleich, werden aber bei der Gebuehrenpflicht unterschiedlich behandelt.
  - prompt: Welcher Pruefungsmassstab ist anzulegen?
    erwartung: Der strenge Verhaeltnismaessigkeitsmassstab - die Differenzierung knuepft
      an ein personenbezogenes Merkmal an (Beschaeftigungsstatus der Eltern), das
      S selbst nicht beeinflussen kann.
  - prompt: Ist die Ungleichbehandlung gerechtfertigt?
    erwartung: Nein - selbst wenn man die 'Bindung des Landesdienstes an den Hochschulstandort'
      als legitimen Zweck unterstellt, fehlt es an einer nachvollziehbaren Begruendung,
      weshalb gerade die Beamteneigenschaft der Eltern zur Erreichung dieses Zwecks
      geeignet und erforderlich sein soll; die pauschale Begruendung traegt die Differenzierung
      nicht.
  expectation:
    pruefpunkte:
