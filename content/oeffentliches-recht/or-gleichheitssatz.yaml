cards:
- slug: or-gr-glbs-vergleichspaar
  type: definition
  front: Wie wird eine Ungleichbehandlung i.S.d. Art. 3 Abs. 1 GG festgestellt?
  back: 'Zunaechst ist ein taugliches Vergleichspaar zu bilden: zwei Personen oder
    Personengruppen, die hinsichtlich eines gemeinsamen Oberbegriffs wesentlich gleich
    sind, aber vom Normgeber unterschiedlich behandelt werden. Fehlt es an einer solchen
    wesentlichen Vergleichbarkeit, liegt schon keine Ungleichbehandlung vor, die rechtfertigungsbeduerftig
    waere.'
  norms:
  - Art. 3 Abs. 1 GG
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: or-gr-glbs-willkuerformel
  type: definition
  front: Was verlangt die Willkuerformel zu Art. 3 Abs. 1 GG?
  back: Nach der (aelteren) Willkuerformel ist eine Ungleichbehandlung bereits gerechtfertigt,
    wenn sich fuer sie ein sachlicher, nicht evident unvertretbarer Grund finden laesst
    - der Gesetzgeber muss also nicht den 'besten', sondern nur irgendeinen nachvollziehbaren
    Grund gehabt haben. Dieser grosszuegige Massstab gilt nach der neuen Formel weiterhin
    fuer Differenzierungen, die allein an Verhaltensweisen anknuepfen.
  norms:
  - Art. 3 Abs. 1 GG
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: or-gr-glbs-abstufung-pruefungsmassstab
  type: streitstand
  front: Wovon haengt nach der neuen Formel ab, ob ein strengerer oder ein grosszuegigerer
    Rechtfertigungsmassstab gilt?
  back: 'Massgeblich sind vor allem zwei Kriterien: Erstens, ob die Differenzierung
    an ein personenbezogenes Merkmal anknuepft, das der Einzelne nicht oder nur schwer
    beeinflussen kann (strengerer Massstab), oder an ein blosses Verhalten (grosszuegigerer
    Willkuermassstab). Zweitens, je naeher das Differenzierungsmerkmal an den in Art.
    3 Abs. 3 GG genannten Merkmalen liegt oder je staerker sich die Ungleichbehandlung
    auf die Ausuebung grundrechtlich geschuetzter Freiheiten auswirkt, desto strenger
    sind die Anforderungen an die Rechtfertigung.'
  norms:
  - Art. 3 Abs. 1 GG
  - Art. 3 Abs. 3 GG
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: or-gr-glbs-rechtfertigung-verhaeltnismaessigkeit
  type: schema_step
  front: Wie wird eine Ungleichbehandlung beim strengen Pruefungsmassstab gerechtfertigt?
  back: 'Beim strengen Massstab genuegt ein sachlicher Grund nicht mehr; die Ungleichbehandlung
    muss vielmehr einem legitimen Zweck dienen und in einer echten Verhaeltnismaessigkeitspruefung
    bestehen: Das Differenzierungskriterium muss zur Zweckerreichung geeignet, erforderlich
    (kein milderes, gleich wirksames Differenzierungskriterium) und angemessen sein
    - die Vor- und Nachteile der Differenzierung muessen in einem ausgewogenen Verhaeltnis
    zum verfolgten Zweck stehen.'
  norms:
  - Art. 3 Abs. 1 GG
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: or-gr-glbs-verhaeltnis-abs2-abs3
  type: norm
  front: In welchem Verhaeltnis stehen Art. 3 Abs. 2, 3 GG zu Art. 3 Abs. 1 GG?
  back: Art. 3 Abs. 2 GG (Gleichberechtigung von Mann und Frau) und Art. 3 Abs. 3
    GG (Verbot der Benachteiligung/Bevorzugung wegen Geschlecht, Abstammung, Rasse,
    Sprache, Heimat und Herkunft, Glauben, religioeser oder politischer Anschauungen
    sowie Behinderung) sind speziellere Auspraegungen des allgemeinen Gleichheitssatzes
    und gehen als lex specialis der Pruefung des Art. 3 Abs. 1 GG vor, soweit eine
    Differenzierung gerade an eines dieser Merkmale anknuepft. Anders als bei Art.
    3 Abs. 1 GG ist eine Rechtfertigung bei Art. 3 Abs. 3 GG nur in engen, vom BVerfG
    anerkannten Ausnahmefaellen moeglich.
  norms:
  - Art. 3 Abs. 2 GG
  - Art. 3 Abs. 3 GG
  - Art. 3 Abs. 1 GG
  quellen:
  - GG, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: or-gr-glbs-jedermanngrundrecht
  type: definition
  front: Wer ist Grundrechtstraeger des Art. 3 Abs. 1 GG?
  back: Art. 3 Abs. 1 GG ist ein Jedermann-Grundrecht und steht damit unabhaengig
    von der Staatsangehoerigkeit jeder natuerlichen Person zu. Inlaendische juristische
    Personen koennen sich nach Art. 19 Abs. 3 GG ebenfalls auf den allgemeinen Gleichheitssatz
    berufen, soweit er seinem Wesen nach auf sie anwendbar ist - etwa bei der Gleichbehandlung
    im Wirtschaftsverkehr.
  norms:
  - Art. 3 Abs. 1 GG
  - Art. 19 Abs. 3 GG
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
