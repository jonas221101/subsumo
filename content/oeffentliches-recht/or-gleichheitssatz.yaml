      - personenbezogen
      - strenger Massstab
      - nicht beeinflussbar
      card_slugs:
      - or-gr-glbs-abstufung-pruefungsmassstab
    - id: p3
      label: Rechtfertigung anhand Geeignetheit/Erforderlichkeit geprueft und mangels
        tragfaehiger Begruendung verneint
      weight: 3.0
