cards:
- slug: or-vwvfg-nb-begriff
  type: definition
  front: 'Definiere: Nebenbestimmung i.S.d. § 36 VwVfG'
  back: 'Eine Nebenbestimmung ist eine dem Verwaltungsakt beigefügte zusätzliche
    Regelung, die den eigentlichen Regelungsgehalt des Verwaltungsakts (Hauptregelung)
    einschränkt, ergänzt oder von einem zukünftigen Ereignis abhängig macht. §
    36 Abs. 2 VwVfG zählt fünf Typen abschließend auf: Befristung, Bedingung, Widerrufsvorbehalt,
    Auflage und Auflagenvorbehalt.'
  norms:
  - § 36 VwVfG
  quellen:
  - VwVfG, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: or-vwvfg-nb-befristung
  type: definition
  front: Was ist eine Befristung, § 36 Abs. 2 Nr. 1 VwVfG?
  back: Die Befristung bestimmt, dass eine Vergünstigung oder Belastung zu einem bestimmten
    Zeitpunkt beginnt, endet oder nur für einen bestimmten Zeitraum gilt. Maßgeblich
    ist ein kalendermäßig oder sonst sicher bestimmbarer Zeitpunkt - im Unterschied
    zur Bedingung hängt der Eintritt nicht von einem ungewissen zukünftigen Ereignis
    ab.
  norms:
  - § 36 Abs. 2 Nr. 1 VwVfG
  quellen:
  - VwVfG, amtliche Fassung
  stand: 2026-09
- slug: or-vwvfg-nb-bedingung
  type: definition
  front: Was ist eine Bedingung, § 36 Abs. 2 Nr. 2 VwVfG, und welche Arten gibt es?
  back: Bei der Bedingung hängt der Eintritt oder der Wegfall einer Vergünstigung
    oder Belastung vom ungewissen Eintritt eines zukünftigen Ereignisses ab. Bei
    der aufschiebenden Bedingung wird die Regelung erst mit Bedingungseintritt wirksam,
    bei der auflösenden Bedingung endet eine bereits wirksame Regelung mit Bedingungseintritt.
    Anders als bei der Befristung ist ungewiss, OB das Ereignis eintritt, nicht nur
    WANN.
  norms:
  - § 36 Abs. 2 Nr. 2 VwVfG
  quellen:
  - VwVfG, amtliche Fassung
  stand: 2026-09
- slug: or-vwvfg-nb-widerrufsvorbehalt
  type: definition
  front: Was bewirkt ein Widerrufsvorbehalt, § 36 Abs. 2 Nr. 3 VwVfG?
  back: Der Widerrufsvorbehalt behält der Behörde vor, den an sich rechtmäßigen
    und wirksamen Verwaltungsakt später durch eigene neue Entscheidung zu widerrufen,
    ohne dass es hierfür noch eines Widerrufsgrundes nach § 49 Abs. 2 VwVfG bedürfte.
    Er unterscheidet sich von der auflösenden Bedingung dadurch, dass der Wegfall
    nicht automatisch mit einem Ereignis eintritt, sondern eine erneute Ermessensentscheidung
    der Behörde voraussetzt.
  norms:
  - § 36 Abs. 2 Nr. 3 VwVfG
  quellen:
  - VwVfG, amtliche Fassung
  stand: 2026-09
- slug: or-vwvfg-nb-auflage
  type: definition
  front: Was ist eine Auflage, § 36 Abs. 2 Nr. 4 VwVfG?
  back: Die Auflage schreibt dem Begünstigten eines Verwaltungsakts ein zusätzliches
    Tun, Dulden oder Unterlassen vor, ohne dass die Wirksamkeit der Hauptregelung
    selbst davon abhängt. Der Verwaltungsakt wird also unabhängig davon wirksam,
    ob die Auflage erfüllt wird - ihre Nichterfüllung kann aber Vollstreckungsmaßnahmen
    oder einen Widerruf nach § 49 Abs. 2 S. 1 Nr. 2 VwVfG nach sich ziehen.
  norms:
  - § 36 Abs. 2 Nr. 4 VwVfG
  quellen:
  - VwVfG, amtliche Fassung
  stand: 2026-09
- slug: or-vwvfg-nb-abgrenzung-bedingung-auflage
  type: streitstand
  front: Wie grenzt man die auflösende Bedingung von der Auflage ab, und warum ist
    das examensrelevant?
  back: 'Bei der auflösenden Bedingung hängt die Wirksamkeit der Hauptregelung selbst
    automatisch vom Bedingungseintritt ab - der Verwaltungsakt erledigt sich ''von
    selbst'', sobald das Ereignis eintritt. Bei der Auflage bleibt die Hauptregelung
    unabhängig von der Erfüllung der zusätzlichen Pflicht wirksam; die Behörde
    muss bei Nichterfüllung aktiv werden (Vollstreckung oder Widerruf). Im Zweifel
    ist bei mehrdeutigem Wortlaut die mildere Auflage anzunehmen, da sie den Bestand
    des Verwaltungsakts nicht automatisch gefährdet. Die Abgrenzung entscheidet zugleich
    über den statthaften Rechtsschutz: nur gegen die Auflage kommt nach ständiger
    Rechtsprechung eine isolierte Anfechtungsklage in Betracht.'
  norms:
  - § 36 Abs. 2 Nr. 2 VwVfG
  - § 36 Abs. 2 Nr. 4 VwVfG
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: or-vwvfg-nb-zulaessigkeit-gebundener-va
  type: norm
  front: Wann ist eine Nebenbestimmung bei einem gebundenen Verwaltungsakt (Anspruch
    auf Erlass) zulässig?
  back: Besteht ein Anspruch auf den Verwaltungsakt, darf er nach § 36 Abs. 1 VwVfG
    nur dann mit einer Nebenbestimmung versehen werden, wenn sie entweder durch eine
    Rechtsvorschrift ausdrücklich zugelassen ist (Var. 1) oder wenn sie sicherstellen
    soll, dass die gesetzlichen Voraussetzungen des Verwaltungsakts erfüllt werden
    (Var. 2). Beide Varianten sind eng auszulegen, da der Anspruch des Bürgers auf
    den Verwaltungsakt sonst durch die Hintertür ausgehöhlt würde.
  norms:
  - § 36 Abs. 1 VwVfG
  quellen:
  - VwVfG, amtliche Fassung
  stand: 2026-09
- slug: or-vwvfg-nb-zulaessigkeit-ermessens-va
  type: norm
  front: Wann ist eine Nebenbestimmung bei einem Ermessens-Verwaltungsakt (kein Anspruch)
    zulässig?
  back: 'Besteht kein Anspruch auf den Verwaltungsakt, darf die Behörde ihn nach
    § 36 Abs. 2 VwVfG unbeschadet des Absatzes 1 grundsätzlich mit jeder der fünf
    dort genannten Nebenbestimmungen versehen - dies folgt aus dem Erst-recht-Schluss,
    dass wer den VA insgesamt versagen dürfte, ihn erst recht nur eingeschränkt
    erlassen darf. Grenze ist das Kopplungsverbot des § 36 Abs. 3 VwVfG: die Nebenbestimmung
    darf dem Zweck des Verwaltungsakts nicht zuwiderlaufen und muss pflichtgemäßem
    Ermessen entsprechen, insbesondere verhältnismäßig sein.'
  norms:
  - § 36 Abs. 2 VwVfG
  - § 36 Abs. 3 VwVfG
  quellen:
  - VwVfG, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: or-vwvfg-nb-isolierte-anfechtbarkeit
  type: streitstand
  front: Ist die Auflage isoliert, also ohne den begünstigenden Haupt-Verwaltungsakt,
    anfechtbar?
  back: Nach ständiger Rechtsprechung ist die Auflage ein eigenständiger, von der
    Hauptregelung abtrennbarer Verwaltungsakt und daher stets statthafter Gegenstand
    einer eigenen Anfechtungsklage - die Frage, ob der begünstigende Verwaltungsakt
    auch ohne die Auflage rechtmäßig erlassen werden durfte (Teilbarkeit), betrifft
    nach dieser Auffassung nicht die Zulässigkeit, sondern erst die Begründetheit
    der Klage. Teile der Literatur wollen dagegen bereits die statthafte Klageart
    nach der Art der Nebenbestimmung differenzieren und bei untrennbar mit der Hauptregelung
    verknüpften Nebenbestimmungen (Bedingung, Befristung) nur eine Verpflichtungsklage
    auf Erlass ohne Nebenbestimmung zulassen.
  norms:
  - § 42 Abs. 1 Var. 1 VwGO
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
