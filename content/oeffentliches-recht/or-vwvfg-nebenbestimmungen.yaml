        in rechtmäßiger Weise erlassen (dürfen/müssen)?'
  - label: III. Ergebnis
faelle:
- slug: or-fall-gaststaettenerlaubnis-laermauflage
  title: Die Gaststättenerlaubnis mit der Lärmschutzauflage
  difficulty: 3
  minutes: 45
  quellen:
  - Eigener Sachverhalt der Redaktion
  - VwVfG, amtliche Fassung
  facts: Die (fiktive) Ordnungsbehörde erteilt dem G eine gaststättenrechtliche
    Erlaubnis, auf die G nach dem einschlägigen (fiktiven) Fachrecht keinen strikten
    Rechtsanspruch hat, sondern die im Ermessen der Behörde steht. Die Erlaubnis
    wird mit der Nebenbestimmung versehen, dass G eine schalldämmende Tür einbauen
    und diese ab 22 Uhr geschlossen halten muss, um die Nachbarschaft vor Lärm zu
    schützen. G hält die Auflage für unverhältnismäßig, da bereits die bestehende
    Bausubstanz ausreichenden Lärmschutz biete, und möchte allein gegen die Nebenbestimmung
    vorgehen, ohne die Erlaubnis als solche infrage zu stellen.
  question: Ist eine isolierte Anfechtungsklage des G gegen die Nebenbestimmung zulässig,
    und hat sie in der Sache Aussicht auf Erfolg, wenn die Lärmschutzauflage tatsächlich
    unverhältnismäßig ist?
  steps:
  - prompt: Um welche Art von Nebenbestimmung handelt es sich?
    erwartung: Um eine Auflage nach § 36 Abs. 2 Nr. 4 VwVfG - G wird ein zusätzliches
      Tun (Einbau) und Unterlassen (Geschlossenhalten) vorgeschrieben, während die
      Erlaubnis selbst unabhängig davon wirksam ist.
  - prompt: Ist die isolierte Anfechtungsklage gegen die Auflage statthaft?
    erwartung: Ja - nach ständiger Rechtsprechung ist die Auflage ein eigenständiger
      Verwaltungsakt und daher stets isoliert mit der Anfechtungsklage angreifbar;
      die Frage der Teilbarkeit ist erst in der Begründetheit zu prüfen.
  - prompt: War die Auflage nach § 36 Abs. 2 VwVfG dem Grunde nach zulässig?
    erwartung: Ja - da kein Anspruch auf die Gaststättenerlaubnis besteht, durfte
      die Behörde sie nach § 36 Abs. 2 Nr. 4 VwVfG mit einer Auflage versehen.
  - prompt: Verstößt die konkrete Auflage gegen das Kopplungsverbot des § 36 Abs.
      3 VwVfG?
    erwartung: 'Ja, wenn sie unverhältnismäßig ist: Eine Auflage, die über das
      zum Lärmschutz Erforderliche hinausgeht, obwohl die vorhandene Bausubstanz
      bereits ausreicht, widerspricht dem Grundsatz der Verhältnismäßigkeit und
      damit dem Kopplungsverbot.'
  - prompt: Wie wirkt sich die Rechtswidrigkeit der Auflage auf die Erlaubnis selbst
      aus?
    erwartung: Die Aufhebung der Auflage lässt die Gaststättenerlaubnis im Übrigen
      unberührt, wenn die Behörde die Erlaubnis auch ohne diese konkrete Auflage
      in rechtmäßiger Weise hätte erlassen können - das ist hier der Fall, da
      die Erlaubnis als solche nicht von der Lärmschutzfrage abhängt.
  expectation:
    pruefpunkte:
