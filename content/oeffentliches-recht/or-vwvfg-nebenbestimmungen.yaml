- slug: or-schema-vwvfg-nebenbestimmung-zulaessigkeit
  title: Zulässigkeit einer Nebenbestimmung, § 36 VwVfG
  norms:
  - § 36 VwVfG
  quellen:
  - VwVfG, amtliche Fassung
  - Eigenformulierung Redaktion
  steps:
  - label: I. Vorliegen eines Verwaltungsakts mit Nebenbestimmung
    children:
    - label: 1. Hauptregelung, § 35 VwVfG
    - label: 2. Nebenbestimmung nach § 36 Abs. 2 Nr. 1-5 VwVfG
  - label: II. Besteht ein Anspruch auf den Verwaltungsakt?
    children:
    - label: '1. Ja: gebundener VA - Zulässigkeit nur nach § 36 Abs. 1 VwVfG (Rechtsvorschrift
        oder Sicherstellungsfunktion)'
    - label: '2. Nein: Ermessens-VA - Zulässigkeit nach § 36 Abs. 2 VwVfG'
  - label: III. Kopplungsverbot, § 36 Abs. 3 VwVfG
    hinweis: Nebenbestimmung darf dem Zweck des Verwaltungsakts nicht zuwiderlaufen;
      Verhältnismäßigkeit im Rahmen des Ermessens.
  - label: 'IV. Ergebnis: Nebenbestimmung zulässig oder rechtswidrig'
- slug: or-schema-vwvfg-isolierte-anfechtung-auflage
  title: Isolierte Anfechtungsklage gegen eine Auflage
  norms:
