      - § 36 Abs. 2 Nr. 4 VwVfG
      keywords:
      - Auflage
      - Nr. 4
      card_slugs:
      - or-vwvfg-nb-auflage
    - id: p2
      label: Isolierte Anfechtungsklage als statthafte Klageart erkannt und begründet
