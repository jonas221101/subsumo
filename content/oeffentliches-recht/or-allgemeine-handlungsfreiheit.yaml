cards:
- slug: or-gr-art2-schutzbereich-weites-verstaendnis
  type: definition
  front: Wie weit reicht der Schutzbereich des Art. 2 Abs. 1 GG nach dem weiten Verständnis
    der Rechtsprechung?
  back: Art. 2 Abs. 1 GG schützt nach ständiger Rechtsprechung nicht nur einen engen
    Kernbereich der Persönlichkeitsentfaltung, sondern jedes menschliche Verhalten
    unabhängig von seinem Gewicht für die Persönlichkeit - die allgemeine Handlungsfreiheit
    im umfassenden Sinne.
  norms:
  - Art. 2 Abs. 1 GG
  quellen:
  - GG, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: or-gr-art2-auffanggrundrecht
  type: definition
  front: Was bedeutet, dass Art. 2 Abs. 1 GG ein "Auffanggrundrecht" ist?
  back: Art. 2 Abs. 1 GG tritt im Wege der Spezialität hinter jedes speziellere Freiheitsgrundrecht
    zurück, dessen Schutzbereich für das fragliche Verhalten eröffnet ist. Er kommt
    nur zur Anwendung, wenn kein anderes Freiheitsgrundrecht - etwa Art. 5, 8, 12
    oder 14 GG - einschlägig ist.
  norms:
  - Art. 2 Abs. 1 GG
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: or-gr-art2-schrankentrias
  type: schema_step
  front: Nenne die drei Schranken der allgemeinen Handlungsfreiheit.
  back: Rechte anderer, verfassungsmäßige Ordnung und Sittengesetz. Diese Schrankentrias
    ist bewusst weit gefasst - sie kompensiert den weiten Schutzbereich des Art. 2
    Abs. 1 GG.
  norms:
  - Art. 2 Abs. 1 GG
  quellen:
  - GG, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: or-gr-art2-verfassungsmaessige-ordnung
  type: definition
  front: 'Definiere: "verfassungsmäßige Ordnung" i.S.d. Art. 2 Abs. 1 GG'
  back: Die Gesamtheit der Normen, die formell und materiell mit der Verfassung in
    Einklang stehen - also jede verfassungsmäßig zustande gekommene und inhaltlich
    verfassungsgemäße Rechtsnorm. Der Begriff ist damit deutlich weiter als etwa
    in Art. 20 Abs. 3 GG, wo er nur die Verfassungsordnung selbst meint.
  norms:
  - Art. 2 Abs. 1 GG
  - Art. 20 Abs. 3 GG
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: or-gr-art2-schranken-schranke-verhaeltnismaessigkeit
  type: schema_step
  front: Welche Schranken-Schranke wirkt dem weiten Schutzbereich und den weiten Schranken
    des Art. 2 Abs. 1 GG entgegen?
  back: Jeder Eingriff muss trotz der weiten Schrankentrias dem Verhältnismäßigkeitsgrundsatz
    genügen. Die geringe Kontrolldichte auf Schutzbereichs- und Schrankenebene wird
    so durch eine wirksame Verhältnismäßigkeitsprüfung auf der Rechtfertigungsebene
    ausgeglichen.
  norms:
  - Art. 20 Abs. 3 GG
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: or-gr-art2-informationelle-selbstbestimmung
  type: norm
  front: Welches eigenständige Recht wird aus Art. 2 Abs. 1 GG i.V.m. Art. 1 Abs.
    1 GG hergeleitet?
  back: 'Das Recht auf informationelle Selbstbestimmung: die Befugnis des Einzelnen,
    grundsätzlich selbst über die Preisgabe und Verwendung seiner personenbezogenen
    Daten zu bestimmen. Es ist eine besondere Ausprägung des allgemeinen Persönlichkeitsrechts.'
  norms:
  - Art. 2 Abs. 1 GG
  - Art. 1 Abs. 1 GG
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: or-gr-art2-abgrenzung-art12
  type: definition
  front: Wann ist statt Art. 2 Abs. 1 GG Art. 12 Abs. 1 GG einschlägig?
  back: Immer dann, wenn das betroffene Verhalten eine auf Erwerb gerichtete, auf
    Dauer angelegte Tätigkeit zur Schaffung und Erhaltung einer Lebensgrundlage betrifft
    - die Berufsfreiheit geht als spezielleres Freiheitsgrundrecht der allgemeinen
    Handlungsfreiheit vor.
  norms:
  - Art. 12 Abs. 1 GG
  - Art. 2 Abs. 1 GG
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
schemata:
- slug: or-schema-art2-handlungsfreiheit
  title: Prüfung eines Eingriffs in Art. 2 Abs. 1 GG
  norms:
  - Art. 2 Abs. 1 GG
  - Art. 20 Abs. 3 GG
  quellen:
  - GG, amtliche Fassung
  - Eigenformulierung Redaktion
  steps:
  - label: I. Schutzbereich
    children:
    - label: '1. Sachlich: grundsätzlich jedes menschliche Verhalten (weites Verständnis)'
    - label: '2. Subsidiarität: kein spezielleres Freiheitsgrundrecht einschlägig'
  - label: II. Eingriff
    hinweis: Moderner Eingriffsbegriff.
  - label: III. Verfassungsrechtliche Rechtfertigung
    children:
    - label: '1. Schranke: Rechte anderer, verfassungsmäßige Ordnung oder Sittengesetz'
    - label: 2. Schranken-Schranken
      children:
      - label: a) Formelle Verfassungsmäßigkeit der Schranke
      - label: b) Materielle Verfassungsmäßigkeit, insbesondere Verhältnismäßigkeit
          und Bestimmtheitsgebot
  - label: IV. Ergebnis
faelle:
- slug: or-fall-naechtlicher-tretroller
  title: Der nächtliche Tretroller
  difficulty: 3
  minutes: 60
  quellen:
  - Eigener Sachverhalt der Redaktion
  - GG, amtliche Fassung
  facts: Die Gemeinde G erlässt eine ordnungsbehördliche Verordnung, die das Befahren
    der Fußgängerzone mit Elektro-Tretrollern rund um die Uhr vollständig untersagt
    - unabhängig von Tageszeit und tatsächlichem Fußgängeraufkommen. Zur Begründung
    verweist der Verordnungsgeber pauschal auf eine abstrakte Unfallgefahr, ohne dies
    näher zu belegen. K fährt regelmäßig gegen 2 Uhr nachts, wenn die Fußgängerzone
    menschenleer ist, mit seinem Elektro-Tretroller hindurch und wird von der Ordnungsbehörde
    mit einem Bußgeld belegt.
  question: Verletzt die Verordnung den K in seinem Grundrecht aus Art. 2 Abs. 1 GG,
    soweit sie das Befahren auch während der Nachtstunden untersagt?
  steps:
  - prompt: Welches Grundrecht ist einschlägig?
    erwartung: Art. 2 Abs. 1 GG - das Fahren mit dem Tretroller fällt unter das weite
      Verständnis jedes menschlichen Verhaltens; ein spezielleres Freiheitsgrundrecht
      (insbesondere Art. 12 Abs. 1 GG mangels beruflicher Betätigung) ist nicht einschlägig.
  - prompt: Liegt ein Eingriff vor?
    erwartung: Ja - Verbot und Bußgeld machen dem K das gewünschte Verhalten unmöglich;
      es handelt sich um einen finalen, unmittelbaren, rechtsförmigen Eingriff.
  - prompt: Welche Schranke greift?
    erwartung: Die verfassungsmäßige Ordnung - jede formell und materiell verfassungsgemäße
      Rechtsnorm, hier die Verordnung, sofern sie auf einer wirksamen Ermächtigungsgrundlage
      beruht.
  - prompt: Woran könnte die Rechtfertigung für das nächtliche Verbot scheitern?
    erwartung: 'An der Erforderlichkeit: Während der Nachtstunden ohne relevantes
      Fußgängeraufkommen fördert ein absolutes Verbot den Schutzzweck nicht in
      gleichem Masse wie tagsüber; eine zeitlich differenzierte Regelung wäre ein
      milderes, gleich wirksames Mittel.'
