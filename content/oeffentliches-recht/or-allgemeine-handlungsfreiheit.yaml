cards:
- slug: or-gr-art2-schutzbereich-weites-verstaendnis
  type: definition
  front: Wie weit reicht der Schutzbereich des Art. 2 Abs. 1 GG nach dem weiten Verstaendnis
    der Rechtsprechung?
  back: Art. 2 Abs. 1 GG schuetzt nach staendiger Rechtsprechung nicht nur einen engen
    Kernbereich der Persoenlichkeitsentfaltung, sondern jedes menschliche Verhalten
    unabhaengig von seinem Gewicht fuer die Persoenlichkeit - die allgemeine Handlungsfreiheit
    im umfassenden Sinne.
  norms:
  - Art. 2 Abs. 1 GG
  quellen:
  - GG, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: or-gr-art2-auffanggrundrecht
  type: definition
  front: Was bedeutet, dass Art. 2 Abs. 1 GG ein "Auffanggrundrecht" ist?
  back: Art. 2 Abs. 1 GG tritt im Wege der Spezialitaet hinter jedes speziellere Freiheitsgrundrecht
    zurueck, dessen Schutzbereich fuer das fragliche Verhalten eroeffnet ist. Er kommt
    nur zur Anwendung, wenn kein anderes Freiheitsgrundrecht - etwa Art. 5, 8, 12
    oder 14 GG - einschlaegig ist.
  norms:
  - Art. 2 Abs. 1 GG
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: or-gr-art2-schrankentrias
  type: schema_step
  front: Nenne die drei Schranken der allgemeinen Handlungsfreiheit.
  back: Rechte anderer, verfassungsmaessige Ordnung und Sittengesetz. Diese Schrankentrias
    ist bewusst weit gefasst - sie kompensiert den weiten Schutzbereich des Art. 2
    Abs. 1 GG.
  norms:
  - Art. 2 Abs. 1 GG
  quellen:
  - GG, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: or-gr-art2-verfassungsmaessige-ordnung
  type: definition
  front: 'Definiere: "verfassungsmaessige Ordnung" i.S.d. Art. 2 Abs. 1 GG'
  back: Die Gesamtheit der Normen, die formell und materiell mit der Verfassung in
    Einklang stehen - also jede verfassungsmaessig zustande gekommene und inhaltlich
    verfassungsgemaesse Rechtsnorm. Der Begriff ist damit deutlich weiter als etwa
    in Art. 20 Abs. 3 GG, wo er nur die Verfassungsordnung selbst meint.
  norms:
  - Art. 2 Abs. 1 GG
  - Art. 20 Abs. 3 GG
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: or-gr-art2-schranken-schranke-verhaeltnismaessigkeit
  type: schema_step
  front: Welche Schranken-Schranke wirkt dem weiten Schutzbereich und den weiten Schranken
    des Art. 2 Abs. 1 GG entgegen?
  back: Jeder Eingriff muss trotz der weiten Schrankentrias dem Verhaeltnismaessigkeitsgrundsatz
    genuegen. Die geringe Kontrolldichte auf Schutzbereichs- und Schrankenebene wird
    so durch eine wirksame Verhaeltnismaessigkeitspruefung auf der Rechtfertigungsebene
    ausgeglichen.
  norms:
  - Art. 20 Abs. 3 GG
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: or-gr-art2-informationelle-selbstbestimmung
  type: norm
  front: Welches eigenstaendige Recht wird aus Art. 2 Abs. 1 GG i.V.m. Art. 1 Abs.
    1 GG hergeleitet?
  back: 'Das Recht auf informationelle Selbstbestimmung: die Befugnis des Einzelnen,
    grundsaetzlich selbst ueber die Preisgabe und Verwendung seiner personenbezogenen
    Daten zu bestimmen. Es ist eine besondere Auspraegung des allgemeinen Persoenlichkeitsrechts.'
  norms:
  - Art. 2 Abs. 1 GG
  - Art. 1 Abs. 1 GG
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: or-gr-art2-abgrenzung-art12
  type: definition
  front: Wann ist statt Art. 2 Abs. 1 GG Art. 12 Abs. 1 GG einschlaegig?
  back: Immer dann, wenn das betroffene Verhalten eine auf Erwerb gerichtete, auf
    Dauer angelegte Taetigkeit zur Schaffung und Erhaltung einer Lebensgrundlage betrifft
    - die Berufsfreiheit geht als spezielleres Freiheitsgrundrecht der allgemeinen
    Handlungsfreiheit vor.
  norms:
  - Art. 12 Abs. 1 GG
  - Art. 2 Abs. 1 GG
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
schemata:
- slug: or-schema-art2-handlungsfreiheit
  title: Pruefung eines Eingriffs in Art. 2 Abs. 1 GG
  norms:
  - Art. 2 Abs. 1 GG
  - Art. 20 Abs. 3 GG
  quellen:
  - GG, amtliche Fassung
  - Eigenformulierung Redaktion
  steps:
  - label: I. Schutzbereich
    children:
    - label: '1. Sachlich: grundsaetzlich jedes menschliche Verhalten (weites Verstaendnis)'
    - label: '2. Subsidiaritaet: kein spezielleres Freiheitsgrundrecht einschlaegig'
  - label: II. Eingriff
    hinweis: Moderner Eingriffsbegriff.
  - label: III. Verfassungsrechtliche Rechtfertigung
    children:
    - label: '1. Schranke: Rechte anderer, verfassungsmaessige Ordnung oder Sittengesetz'
    - label: 2. Schranken-Schranken
      children:
      - label: a) Formelle Verfassungsmaessigkeit der Schranke
      - label: b) Materielle Verfassungsmaessigkeit, insbesondere Verhaeltnismaessigkeit
          und Bestimmtheitsgebot
  - label: IV. Ergebnis
faelle:
- slug: or-fall-naechtlicher-tretroller
  title: Der naechtliche Tretroller
  difficulty: 3
  minutes: 60
  quellen:
  - Eigener Sachverhalt der Redaktion
  - GG, amtliche Fassung
  facts: Die Gemeinde G erlaesst eine ordnungsbehoerdliche Verordnung, die das Befahren
    der Fussgaengerzone mit Elektro-Tretrollern rund um die Uhr vollstaendig untersagt
    - unabhaengig von Tageszeit und tatsaechlichem Fussgaengeraufkommen. Zur Begruendung
    verweist der Verordnungsgeber pauschal auf eine abstrakte Unfallgefahr, ohne dies
    naeher zu belegen. K faehrt regelmaessig gegen 2 Uhr nachts, wenn die Fussgaengerzone
    menschenleer ist, mit seinem Elektro-Tretroller hindurch und wird von der Ordnungsbehoerde
    mit einem Bussgeld belegt.
  question: Verletzt die Verordnung den K in seinem Grundrecht aus Art. 2 Abs. 1 GG,
    soweit sie das Befahren auch waehrend der Nachtstunden untersagt?
  steps:
  - prompt: Welches Grundrecht ist einschlaegig?
    erwartung: Art. 2 Abs. 1 GG - das Fahren mit dem Tretroller faellt unter das weite
      Verstaendnis jedes menschlichen Verhaltens; ein spezielleres Freiheitsgrundrecht
      (insbesondere Art. 12 Abs. 1 GG mangels beruflicher Betaetigung) ist nicht einschlaegig.
  - prompt: Liegt ein Eingriff vor?
    erwartung: Ja - Verbot und Bussgeld machen dem K das gewuenschte Verhalten unmoeglich;
      es handelt sich um einen finalen, unmittelbaren, rechtsfoermigen Eingriff.
  - prompt: Welche Schranke greift?
    erwartung: Die verfassungsmaessige Ordnung - jede formell und materiell verfassungsgemaesse
      Rechtsnorm, hier die Verordnung, sofern sie auf einer wirksamen Ermaechtigungsgrundlage
      beruht.
  - prompt: Woran koennte die Rechtfertigung fuer das naechtliche Verbot scheitern?
    erwartung: 'An der Erforderlichkeit: Waehrend der Nachtstunden ohne relevantes
      Fussgaengeraufkommen foerdert ein absolutes Verbot den Schutzzweck nicht in
      gleichem Masse wie tagsueber; eine zeitlich differenzierte Regelung waere ein
      milderes, gleich wirksames Mittel.'
  expectation:
