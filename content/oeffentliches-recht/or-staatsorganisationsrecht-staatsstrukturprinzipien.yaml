topic:
  slug: or-staatsorganisationsrecht-staatsstrukturprinzipien
  area: oeffentliches-recht
  title: Die Staatsstrukturprinzipien des Art. 20 GG und die Wahlrechtsgrundsätze
  parent: oeffentliches-recht
  relevance: 5
  stand: 2026-09
  redaktion:
    erzeugt_von: claude-fable-5-1
    status: in-pruefung
    normzitate_geprueft: true
cards:
- slug: or-ssp-ueberblick-art20-ewigkeitsgarantie
  type: norm
  front: Welche Staatsstrukturprinzipien enthält Art. 20 GG und wie sind sie
    geschützt?
  back: >-
    Art. 20 Abs. 1 GG bestimmt die Bundesrepublik als demokratischen und
    sozialen Bundesstaat und legt damit Republik, Demokratie, Sozialstaat und
    Bundesstaat fest. Art. 20 Abs. 2 GG konkretisiert das Demokratieprinzip
    (Volkssouveränität, Ausübung der Staatsgewalt durch Wahlen, Abstimmungen
    und besondere Organe) und normiert die Gewaltenteilung; Art. 20 Abs. 3 GG
    enthält den Kern des Rechtsstaatsprinzips (Bindung der Gesetzgebung an die
    verfassungsmäßige Ordnung, von vollziehender Gewalt und Rechtsprechung an
    Gesetz und Recht). Das Rechtsstaatsprinzip als solches ist nicht
    ausdrücklich genannt, wird aber aus Art. 20 Abs. 3 GG, Art. 28 Abs. 1 S. 1
    GG, Art. 1 Abs. 3 GG und Art. 19 Abs. 4 GG hergeleitet. Nach Art. 79
    Abs. 3 GG sind die in Art. 20 GG niedergelegten Grundsätze der
    Verfassungsänderung entzogen (Ewigkeitsgarantie); geschützt sind allerdings
    nur die Grundsätze, nicht jede Einzelausprägung. Art. 20 Abs. 4 GG gewährt
    das Widerstandsrecht als grundrechtsgleiches Recht.
  norms:
  - Art. 20 Abs. 1 GG
  - Art. 20 Abs. 2 GG
  - Art. 20 Abs. 3 GG
  - Art. 79 Abs. 3 GG
  - Art. 28 Abs. 1 S. 1 GG
  quellen:
  - GG, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: or-ssp-demokratie-legitimationskette
  type: definition
  front: Was verlangt das Demokratieprinzip an demokratischer Legitimation
    staatlichen Handelns?
  back: >-
    Nach Art. 20 Abs. 2 S. 1 GG geht alle Staatsgewalt vom Volke aus. Jede
    Ausübung von Staatsgewalt muss sich daher auf das Volk zurückführen lassen.
    Das Bundesverfassungsgericht unterscheidet drei Legitimationsformen: die
    institutionell-funktionelle Legitimation (die Verfassung selbst
    konstituiert die Gewalten), die personelle Legitimation (ununterbrochene
    Legitimationskette vom Volk über das Parlament zu jedem Amtswalter, etwa
    durch Wahl der Regierung durch das Parlament und Ernennung der Beamten
    durch die Regierung) und die sachlich-inhaltliche Legitimation (Bindung
    an das Parlamentsgesetz und Weisungsabhängigkeit gegenüber
    parlamentarisch verantwortlichen Stellen). Entscheidend ist nicht die
    Form der einzelnen Komponente, sondern ein hinreichendes
    Legitimationsniveau insgesamt. Ministerialfreie Räume und
    weisungsunabhängige Stellen sind daher rechtfertigungsbedürftig.
    Staatsvolk ist das deutsche Volk (Art. 116 Abs. 1 GG); ein kommunales
    Wahlrecht für Unionsbürger folgt aus Art. 28 Abs. 1 S. 3 GG.
  norms:
  - Art. 20 Abs. 2 S. 1 GG
  - Art. 20 Abs. 2 S. 2 GG
  - Art. 28 Abs. 1 S. 3 GG
  quellen:
  - GG, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: or-ssp-wahlrechtsgrundsaetze-art38
  type: norm
  front: Nenne und erläutere die Wahlrechtsgrundsätze des Art. 38 Abs. 1 S. 1 GG.
  back: >-
    Die Abgeordneten des Bundestages werden in allgemeiner, unmittelbarer,
    freier, gleicher und geheimer Wahl gewählt. Allgemein bedeutet, dass
    grundsätzlich alle Staatsbürger wahlberechtigt und wählbar sind;
    Beschränkungen (Alter, Wohnsitz) bedürfen eines zwingenden Grundes.
    Unmittelbar heißt, dass zwischen Wähler und Gewähltem keine fremde
    Willensentscheidung tritt - Wahlmänner sind ausgeschlossen, starre Listen
    sind zulässig. Frei verlangt, dass der Wähler ohne Zwang und unzulässige
    Beeinflussung entscheidet, insbesondere ohne staatliche Wahlwerbung. Gleich
    fordert Zählwertgleichheit (jede Stimme zählt gleich) und bei der
    Verhältniswahl auch Erfolgswertgleichheit (jede Stimme trägt gleich zum
    Ergebnis bei); Differenzierungen wie die Fünf-Prozent-Sperrklausel
    bedürfen eines besonderen, zwingenden Grundes (Funktionsfähigkeit des
    Parlaments). Geheim bedeutet, dass die Stimmabgabe für andere nicht
    erkennbar ist. Die Grundsätze gelten nach Art. 28 Abs. 1 S. 2 GG auch für
    Länder, Kreise und Gemeinden. Ein Verstoß kann im Wahlprüfungsverfahren
    (Art. 41 GG) und mit der Verfassungsbeschwerde gerügt werden, da Art. 38
    GG ein grundrechtsgleiches Recht ist (Art. 93 Abs. 1 Nr. 4a GG).
  norms:
  - Art. 38 Abs. 1 S. 1 GG
  - Art. 28 Abs. 1 S. 2 GG
  - Art. 41 GG
  quellen:
  - GG, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: or-ssp-rechtsstaat-vorrang-vorbehalt-gesetz
  type: definition
  front: Unterscheide Vorrang und Vorbehalt des Gesetzes.
  back: >-
    Der Vorrang des Gesetzes (Art. 20 Abs. 3 GG) verbietet der Verwaltung und
    der Rechtsprechung, gegen bestehende Gesetze zu handeln: Kein Akt der
    Exekutive darf einem Parlamentsgesetz widersprechen (negative
    Gesetzesbindung). Der Vorbehalt des Gesetzes verlangt darüber hinaus, dass
    die Verwaltung in bestimmten Bereichen nur tätig werden darf, wenn sie
    dazu durch ein Gesetz ermächtigt ist (positive Gesetzesbindung).
    Unstreitig gilt der Vorbehalt für alle Eingriffe in Freiheit und Eigentum
    (Eingriffsvorbehalt). Nach der Wesentlichkeitstheorie des
    Bundesverfassungsgerichts ist er darüber hinaus auf alle "wesentlichen"
    Entscheidungen erstreckt: Der parlamentarische Gesetzgeber muss die für
    die Grundrechtsverwirklichung wesentlichen Fragen selbst regeln und darf
    sie nicht der Exekutive überlassen (Parlamentsvorbehalt). Wesentlich ist
    eine Regelung vor allem nach ihrer Grundrechtsrelevanz und ihrer
    Bedeutung für die Allgemeinheit. Je wesentlicher, desto höher sind auch
    die Anforderungen an die Regelungsdichte des Gesetzes; für
    Rechtsverordnungen konkretisiert Art. 80 Abs. 1 S. 2 GG dies durch das
    Gebot, Inhalt, Zweck und Ausmaß der Ermächtigung zu bestimmen.
  norms:
  - Art. 20 Abs. 3 GG
  - Art. 80 Abs. 1 S. 2 GG
  quellen:
  - GG, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: or-ssp-vorbehalt-leistungsverwaltung
  type: streitstand
  front: Gilt der Vorbehalt des Gesetzes auch für die Leistungsverwaltung?
  back: >-
    Unstreitig bedarf jeder Grundrechtseingriff einer gesetzlichen Grundlage.
    Umstritten ist, ob auch die gewährende Verwaltung (Subventionen, soziale
    Leistungen, Nutzung öffentlicher Einrichtungen) nur auf gesetzlicher
    Grundlage handeln darf. Nach der Lehre vom Totalvorbehalt bedarf jedes
    Verwaltungshandeln eines Gesetzes, weil Art. 20 Abs. 3 GG die
    vollziehende Gewalt umfassend an Gesetz und Recht binde und auch
    Leistungen Verteilungsentscheidungen mit Grundrechtsrelevanz (Art. 3
    Abs. 1 GG) seien. Die herrschende Meinung lehnt einen Totalvorbehalt ab:
    Die Verwaltung müsse handlungsfähig bleiben, und der demokratisch
    legitimierte Haushaltsgesetzgeber steuere die Leistungsverwaltung bereits
    durch die Bereitstellung von Mitteln im Haushaltsplan. Sie verlangt nach
    der Wesentlichkeitstheorie ein Gesetz aber dann, wenn die Leistung für
    die Grundrechtsverwirklichung wesentlich ist (etwa Leistungen zur
    Sicherung des Existenzminimums), wenn die Gewährung zugleich in Rechte
    Dritter eingreift (Konkurrentensubvention) oder wenn Leistungen mit
    belastenden Bedingungen verknüpft werden. Für einfache Subventionen
    genügt danach ein Haushaltstitel in Verbindung mit Verwaltungsvorschriften
    und dem Gleichheitssatz.
  norms:
  - Art. 20 Abs. 3 GG
  - Art. 3 Abs. 1 GG
  - Art. 110 Abs. 2 GG
  quellen:
  - GG, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: or-ssp-bestimmtheitsgebot
  type: definition
  front: Was verlangt das rechtsstaatliche Bestimmtheitsgebot?
  back: >-
    Gesetzliche Regelungen müssen so bestimmt gefasst sein, dass der Betroffene
    die Rechtslage erkennen und sein Verhalten danach ausrichten kann, die
    Verwaltung hinreichend klare Handlungsmaßstäbe erhält und die Gerichte die
    Anwendung kontrollieren können. Das Gebot folgt aus dem
    Rechtsstaatsprinzip (Art. 20 Abs. 3 GG) und dient Rechtssicherheit,
    Vorhersehbarkeit und Gewaltenteilung. Die Anforderungen sind abgestuft:
    Sie steigen mit der Intensität des Grundrechtseingriffs und sind bei
    Straf- und Ordnungswidrigkeitentatbeständen durch Art. 103 Abs. 2 GG
    besonders streng. Unbestimmte Rechtsbegriffe und Generalklauseln
    ("öffentliche Sicherheit", "Zuverlässigkeit") sind zulässig, wenn sie
    mit den üblichen Auslegungsmethoden konkretisierbar sind und eine
    gefestigte Auslegungspraxis vorliegt. Ein Verstoß liegt vor, wenn die
    Norm inhaltlich widersprüchlich ist, die Rechtsfolge nicht erkennen lässt
    oder die wesentliche Entscheidung faktisch der Verwaltung überlässt.
  norms:
  - Art. 20 Abs. 3 GG
  - Art. 103 Abs. 2 GG
  quellen:
  - GG, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: or-ssp-rueckwirkung-echt-unecht
  type: streitstand
  front: Wie werden echte und unechte Rückwirkung abgegrenzt und wie ist die
    Terminologie umstritten?
  back: >-
    Das Rückwirkungsverbot folgt aus dem Vertrauensschutz als Bestandteil des
    Rechtsstaatsprinzips (Art. 20 Abs. 3 GG), außerhalb des Strafrechts, wo
    Art. 103 Abs. 2 GG ein absolutes Verbot enthält. Nach der klassischen
    Terminologie liegt echte Rückwirkung vor, wenn ein Gesetz nachträglich
    ändernd in abgewickelte, der Vergangenheit angehörende Tatbestände
    eingreift; unechte Rückwirkung, wenn es auf gegenwärtige, noch nicht
    abgeschlossene Sachverhalte und Rechtsbeziehungen für die Zukunft einwirkt
    und damit zugleich die betroffene Rechtsposition entwertet. Der Zweite
    Senat des Bundesverfassungsgerichts verwendet stattdessen die Begriffe
    "Rückbewirkung von Rechtsfolgen" (die Rechtsfolge soll schon für einen
    Zeitraum vor der Verkündung eintreten) und "tatbestandliche
    Rückanknüpfung" (die Rechtsfolge tritt erst nach Verkündung ein, knüpft
    aber an Sachverhalte aus der Vergangenheit an); maßgeblich ist danach der
    zeitliche Anwendungsbereich der Rechtsfolge, nicht der "Abschluss" eines
    Sachverhalts. Beide Ansätze führen regelmäßig zu denselben Ergebnissen,
    unterscheiden sich aber bei Sachverhalten, die vor Verkündung begonnen,
    aber danach fortdauern (z. B. laufende Verträge, Periodensteuern). In der
    Klausur sind beide Begriffspaare zu nennen und die Zuordnung ist zu
    begründen; wesentlich ist die Konsequenz: Echte Rückwirkung ist
    grundsätzlich unzulässig, unechte Rückwirkung grundsätzlich zulässig,
    aber an Verhältnismäßigkeit und Vertrauensschutz zu messen.
  norms:
  - Art. 20 Abs. 3 GG
  - Art. 103 Abs. 2 GG
  quellen:
  - GG, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: or-ssp-rueckwirkung-ausnahmen-abwaegung
  type: definition
  front: Wann ist echte Rückwirkung ausnahmsweise zulässig, und wie wird unechte
    Rückwirkung geprüft?
  back: >-
    Echte Rückwirkung ist ausnahmsweise zulässig, wenn kein schutzwürdiges
    Vertrauen besteht. Das Bundesverfassungsgericht hat Fallgruppen
    anerkannt: (1) Der Bürger musste mit der Neuregelung rechnen, etwa weil
    der Gesetzesbeschluss des Bundestages bereits gefasst war (Vertrauen
    endet mit dem endgültigen Gesetzesbeschluss, nicht erst mit der
    Verkündung); (2) die bisherige Rechtslage war unklar und verworren oder
    lückenhaft; (3) die bisherige Norm war verfassungswidrig oder nichtig und
    wird durch eine gültige ersetzt; (4) es entsteht kein oder nur ein
    unerheblicher Schaden (Bagatellvorbehalt); (5) zwingende Gründe des
    Gemeinwohls, die dem Vertrauensschutz vorgehen. Unechte Rückwirkung ist
    grundsätzlich zulässig, weil der Bürger nicht auf den Fortbestand der
    Rechtslage vertrauen darf. Sie ist jedoch unzulässig, wenn das Gesetz zur
    Erreichung seines Zwecks ungeeignet oder nicht erforderlich ist oder
    wenn die Bestandsinteressen der Betroffenen die Veränderungsgründe des
    Gesetzgebers überwiegen (Abwägung); der Gesetzgeber muss gegebenenfalls
    Übergangsregelungen schaffen. Je schutzwürdiger das Vertrauen (z. B.
    getätigte Investitionen im Vertrauen auf eine befristete Förderung), desto
    gewichtiger müssen die Änderungsgründe sein.
  norms:
  - Art. 20 Abs. 3 GG
  quellen:
  - GG, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: or-ssp-bundesstaat-sozialstaat-republik
  type: definition
  front: Erläutere kurz Bundesstaats-, Sozialstaats- und Republikprinzip.
  back: >-
    Bundesstaat: Die Staatsgewalt ist zwischen dem Bund und den Ländern
    aufgeteilt, die beide Staatsqualität besitzen. Die Länder haben eigene
    Verfassungen (Art. 28 Abs. 1 GG), eigene Gesetzgebung (Art. 30, Art. 70
    GG), Verwaltung (Art. 83 GG) und Rechtsprechung und wirken über den
    Bundesrat an der Bundesgesetzgebung mit (Art. 50 GG). Aus dem
    Bundesstaatsprinzip folgt das ungeschriebene Gebot bundesfreundlichen
    Verhaltens (Bundestreue), das Bund und Länder zu gegenseitiger
    Rücksichtnahme verpflichtet. Sozialstaat: Der Staat ist verpflichtet, für
    soziale Gerechtigkeit und Sicherheit zu sorgen und ein menschenwürdiges
    Existenzminimum zu gewährleisten (Art. 1 Abs. 1 GG i.V.m. Art. 20 Abs. 1
    GG). Das Prinzip ist Gestaltungsauftrag an den Gesetzgeber, begründet
    aber grundsätzlich keine unmittelbaren Leistungsansprüche und dient als
    Auslegungsmaßstab und Rechtfertigungsgrund für Grundrechtseingriffe.
    Republik: Das Staatsoberhaupt wird auf Zeit gewählt (Art. 54 GG); die
    Monarchie ist ausgeschlossen. Im weiteren Sinn verpflichtet das Prinzip
    auf Gemeinwohlorientierung der Herrschaft.
  norms:
  - Art. 20 Abs. 1 GG
  - Art. 28 Abs. 1 GG
  - Art. 30 GG
  - Art. 50 GG
  - Art. 54 GG
  quellen:
  - GG, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
schemata:
- slug: or-schema-ssp-rueckwirkung-pruefung
  title: Prüfung eines rückwirkenden Gesetzes am Rechtsstaatsprinzip, Art. 20 Abs.
    3 GG
  norms:
  - Art. 20 Abs. 3 GG
  - Art. 103 Abs. 2 GG
  quellen:
  - GG, amtliche Fassung
  - Eigenformulierung Redaktion
  steps:
  - label: I. Anwendungsbereich - kein Strafgesetz (sonst absolutes Verbot des Art.
      103 Abs. 2 GG)
  - label: II. Liegt überhaupt eine Rückwirkung vor?
    hinweis: Maßgeblich ist der Vergleich zwischen Verkündungszeitpunkt und dem
      zeitlichen Anwendungsbereich der Rechtsfolge.
  - label: III. Einordnung der Rückwirkung
    children:
    - label: 1. Echte Rückwirkung / Rückbewirkung von Rechtsfolgen - Rechtsfolge
        soll für einen Zeitraum vor der Verkündung gelten bzw. Eingriff in abgeschlossene
        Sachverhalte
    - label: 2. Unechte Rückwirkung / tatbestandliche Rückanknüpfung - Rechtsfolge
        erst nach Verkündung, aber Anknüpfung an in der Vergangenheit begonnene
        Sachverhalte
    hinweis: Beide Terminologien nennen; bei Periodenabgaben und laufenden Rechtsverhältnissen
      Einordnung begründen.
  - label: IV. Echte Rückwirkung - grundsätzlich unzulässig
    children:
    - label: 1. Vertrauen nicht schutzwürdig, weil mit der Regelung zu rechnen war
        (ab Gesetzesbeschluss des Bundestages bzw. Landtags)
    - label: 2. Unklare oder verworrene Rechtslage
    - label: 3. Ersetzung einer nichtigen Norm
    - label: 4. Bagatellvorbehalt
    - label: 5. Zwingende Gründe des Gemeinwohls
  - label: V. Unechte Rückwirkung - grundsätzlich zulässig
    children:
    - label: 1. Schutzwürdiges Vertrauen des Betroffenen (Dispositionen im Vertrauen
        auf die alte Rechtslage)
    - label: 2. Änderungsinteresse des Gesetzgebers (Gemeinwohlgründe)
    - label: 3. Abwägung und Verhältnismäßigkeit; Erfordernis von Übergangsregelungen
  - label: VI. Ergebnis
    hinweis: Verstoß gegen das Rechtsstaatsprinzip führt zur Verfassungswidrigkeit
      der Norm; bei Grundrechtsbezug ist der Vertrauensschutz im Rahmen der Verhältnismäßigkeit
      des Grundrechtseingriffs zu prüfen.
faelle:
- slug: or-fall-rueckwirkende-kuerzung-solarfoerderung
  title: Die rückwirkend gekürzte Solarförderung
  difficulty: 4
  minutes: 60
  quellen:
  - Eigener Sachverhalt der Redaktion
  - GG, amtliche Fassung
  facts: >-
    Ein Gesetz des Landes L aus dem Jahr 2023 gewährt Eigentümern, die auf
    ihrem Wohnhaus eine Photovoltaikanlage installieren, einen jährlichen
    Zuschuss von 500 Euro für zehn Jahre ab Inbetriebnahme; der Zuschuss wird
    jeweils zum Jahresende für das abgelaufene Jahr durch Bescheid festgesetzt
    und ausgezahlt. A nimmt im Vertrauen darauf im Mai 2024 eine Anlage in
    Betrieb und finanziert sie über einen Kredit, dessen Raten mit der
    Förderung kalkuliert sind. Wegen einer angespannten Haushaltslage
    beschließt der Landtag des Landes L am 20. November 2026 ein
    Änderungsgesetz, das am 15. Dezember 2026 verkündet wird. Es bestimmt
    erstens, dass der Zuschuss für die Jahre 2025 und 2026 nachträglich auf
    300 Euro reduziert wird und bereits ausgezahlte Beträge für 2025
    zurückzuzahlen sind, und zweitens, dass ab dem Jahr 2027 für alle
    laufenden Förderfälle nur noch 300 Euro gezahlt werden. Übergangs- oder
    Härtefallregelungen enthält das Gesetz nicht. Eine Verlautbarung, dass
    eine Kürzung geplant sei, hatte es vor dem 20. November 2026 nicht
    gegeben. A hält beide Regelungen für verfassungswidrig.
  question: Sind die beiden Regelungen des Änderungsgesetzes mit dem
    Rechtsstaatsprinzip vereinbar?
  steps:
  - prompt: Welcher verfassungsrechtliche Maßstab ist einschlägig, und liegt ein
      Fall des Art. 103 Abs. 2 GG vor?
    erwartung: >-
      Maßstab ist das aus dem Rechtsstaatsprinzip (Art. 20 Abs. 3 GG)
      folgende Gebot des Vertrauensschutzes in seiner Ausprägung als
      Rückwirkungsverbot. Art. 103 Abs. 2 GG ist nicht einschlägig, weil es
      sich nicht um ein Strafgesetz handelt; das Verbot ist daher kein
      absolutes, sondern lässt Abwägung und Ausnahmen zu.
  - prompt: Ordne die Kürzung für die Jahre 2025 und 2026 einschließlich der
      Rückzahlungspflicht ein.
    erwartung: >-
      Die Förderung für 2025 ist bereits festgesetzt und ausgezahlt, der
      Sachverhalt ist abgeschlossen; auch für 2026 soll die Rechtsfolge für
      einen Zeitraum vor der Verkündung am 15. Dezember 2026 geändert werden.
      Es handelt sich um echte Rückwirkung bzw. Rückbewirkung von
      Rechtsfolgen: Das Gesetz greift nachträglich ändernd in der
      Vergangenheit angehörende Tatbestände ein. Eine solche Rückwirkung ist
      grundsätzlich unzulässig.
  - prompt: Greift für die Jahre 2025 und 2026 eine Ausnahme vom Verbot echter
      Rückwirkung?
    erwartung: >-
      Nein. A musste mit der Kürzung nicht rechnen - vor dem Gesetzesbeschluss
      am 20. November 2026 gab es keine Ankündigung, und das Vertrauen endet
      frühestens mit dem Gesetzesbeschluss; dies könnte allenfalls für die
      Zeit vom 20. November bis Jahresende 2026 gelten, nicht für 2025 und
      den überwiegenden Teil von 2026. Die alte Rechtslage war klar, die Norm
      gültig. Ein Bagatellfall liegt bei 200 Euro pro Jahr zuzüglich
      Rückzahlung nicht vor. Die angespannte Haushaltslage ist kein
      zwingender Gemeinwohlgrund, der eine echte Rückwirkung rechtfertigt;
      fiskalische Interessen genügen hierfür nach ständiger Rechtsprechung
      nicht. Die Regelung verstößt gegen das Rechtsstaatsprinzip.
  - prompt: Ordne die Kürzung ab 2027 ein und prüfe ihre Zulässigkeit.
    erwartung: >-
      Die Kürzung ab 2027 wirkt nur für die Zukunft, knüpft aber an den in
      der Vergangenheit in Betrieb genommenen und bereits in die Förderung
      aufgenommenen Anlagenbestand an - unechte Rückwirkung bzw.
      tatbestandliche Rückanknüpfung. Sie ist grundsätzlich zulässig, muss
      aber verhältnismäßig sein. Das Vertrauen des A ist besonders
      schutzwürdig: Das Gesetz versprach eine feste zehnjährige Förderung,
      und A hat im Vertrauen darauf eine kreditfinanzierte Investition
      getätigt, die er nicht mehr rückgängig machen kann. Dem steht das
      legitime Interesse an der Haushaltskonsolidierung gegenüber. Da das
      Gesetz weder eine Übergangsregelung noch eine Härtefallklausel für
      bereits getätigte Investitionen vorsieht, überwiegt das
      Bestandsinteresse des A; die Regelung ist jedenfalls ohne
      Übergangsregelung unangemessen und damit verfassungswidrig. Vertretbar
      ist, eine maßvolle Kürzung mit Übergangsfrist für zulässig zu halten.
  - prompt: Welche Bedeutung haben Grundrechte des A neben dem Rechtsstaatsprinzip?
    erwartung: >-
      Der Vertrauensschutz wird, soweit ein Grundrecht betroffen ist, in dessen
      Rahmen geprüft. Ein Anspruch auf eine staatliche Subvention ist kein
      Eigentum i.S.d. Art. 14 Abs. 1 GG, da es an einer Eigenleistung des A
      fehlt; in Betracht kommt Art. 2 Abs. 1 GG. Inhaltlich ändert sich an der
      Abwägung nichts - die rechtsstaatlichen Maßstäbe werden dort als
      Schranken-Schranke herangezogen.
  expectation:
    pruefpunkte:
    - id: p1
      label: Rechtsstaatsprinzip aus Art. 20 Abs. 3 GG als Maßstab benannt und Art.
        103 Abs. 2 GG als nicht einschlägig abgegrenzt
      weight: 1.0
      required: false
