topic:
  slug: or-kommunalrecht-selbstverwaltung
  area: oeffentliches-recht
  title: Kommunale Selbstverwaltung, Art. 28 Abs. 2 GG, und Aufgabenarten
  parent: oeffentliches-recht
  relevance: 5
  stand: 2026-10
  redaktion:
    erzeugt_von: claude-sonnet (Pflichtstoff-Vervollständigung)
    status: in-pruefung
    normzitate_geprueft: false
cards:
- slug: or-kr-sv-art28-norm
  type: norm
  front: Was gewährleistet Art. 28 Abs. 2 GG den Gemeinden und den Gemeindeverbänden?
  back: >-
    Nach Art. 28 Abs. 2 S. 1 GG muss den Gemeinden das Recht gewährleistet sein, alle Angelegenheiten
    der örtlichen Gemeinschaft im Rahmen der Gesetze in eigener Verantwortung zu regeln. Auch die
    Gemeindeverbände (insbesondere die Landkreise) haben nach S. 2 das Recht der Selbstverwaltung, jedoch
    nur im Rahmen ihres gesetzlichen Aufgabenbereichs; sie haben also keine eigene Allzuständigkeit.
    Nach S. 3 umfasst die Gewährleistung auch die Grundlagen der finanziellen Eigenverantwortung, zu
    denen eine mit Hebesatzrecht verbundene wirtschaftskraftbezogene Steuerquelle gehört. Die Norm
    bindet vor allem die Landesgesetzgeber, die das Kommunalrecht regeln, aber auch den Bundesgesetzgeber
    und die Exekutive. Der Gesetzesvorbehalt („im Rahmen der Gesetze“) ist kein Freibrief, denn er
    unterliegt seinerseits den Grenzen der Garantie.
  norms:
  - Art. 28 Abs. 2 S. 1 GG
  - Art. 28 Abs. 2 S. 2 GG
  - Art. 28 Abs. 2 S. 3 GG
  quellen:
  - GG, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-10
- slug: or-kr-sv-gewaehrleistungsebenen
  type: definition
  front: Welche drei Gewährleistungsebenen unterscheidet man bei der kommunalen Selbstverwaltungsgarantie?
  back: >-
    Üblich ist die Unterscheidung von drei Ebenen. Die institutionelle Rechtssubjektsgarantie schützt die
    Gemeinden als Institution, also das Rechtsinstitut „Gemeinde“ überhaupt. Die einzelne Gemeinde ist nicht
    in ihrem Bestand geschützt; Gebietsänderungen und Eingemeindungen sind zulässig, wenn sie durch Gründe
    des Gemeinwohls gedeckt und die betroffenen Gemeinden zuvor angehört worden sind. Die objektive
    Rechtsinstitutionsgarantie sichert die Selbstverwaltung als Einrichtung mit typusprägenden Merkmalen,
    vor allem einen Kernbereich eigener Aufgaben, und bindet den Gesetzgeber bei der Ausgestaltung. Die
    subjektive Rechtsstellungsgarantie gibt der einzelnen Gemeinde ein Recht auf Wahrung ihrer
    Selbstverwaltung und ermöglicht den Rechtsschutz, vor allem die Kommunalverfassungsbeschwerde nach
    Art. 93 Abs. 1 Nr. 4b GG.
  norms:
  - Art. 28 Abs. 2 GG
  - Art. 93 Abs. 1 Nr. 4b GG
  quellen:
  - GG, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-10
- slug: or-kr-sv-oertliche-gemeinschaft
  type: definition
  front: Was sind „Angelegenheiten der örtlichen Gemeinschaft“, und was bedeutet Allzuständigkeit?
  back: >-
    Angelegenheiten der örtlichen Gemeinschaft sind solche Bedürfnisse und Interessen, die in der örtlichen
    Gemeinschaft wurzeln oder auf sie einen spezifischen Bezug haben und von ihr eigenverantwortlich und
    selbständig bewältigt werden können. Entscheidend ist der Bezug zum Gemeindegebiet und zu den
    Einwohnern, nicht die Größe oder Bedeutung der Aufgabe. Allzuständigkeit (Universalität des
    Wirkungskreises) bedeutet, dass die Gemeinde sich ohne besonderen Kompetenztitel jeder Angelegenheit der
    örtlichen Gemeinschaft annehmen darf, solange keine gesetzliche Zuweisung an einen anderen Träger
    besteht. Für Zuständigkeitsverlagerungen weg von der Gemeinde gilt deshalb ein Regel-Ausnahme-Verhältnis
    zugunsten der Gemeinde. Die Allzuständigkeit ist auf das Gemeindegebiet und auf die örtlichen
    Angelegenheiten begrenzt.
  norms:
  - Art. 28 Abs. 2 S. 1 GG
  quellen:
  - GG, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-10
- slug: or-kr-sv-kern-randbereich
  type: definition
  front: Wie ist die Selbstverwaltungsgarantie gegenüber Eingriffen des Gesetzgebers geschützt (Kernbereich und Randbereich)?
  back: >-
    Der Kernbereich der Selbstverwaltung ist absolut geschützt und darf auch aus Gründen des Gemeinwohls nicht
    ausgehöhlt werden. Er umfasst keinen gegenständlich bestimmten Aufgabenkatalog, wohl aber die
    Grundprinzipien, etwa die Eigenverantwortlichkeit und die Gemeindehoheiten (Gebiets-, Planungs-,
    Organisations-, Personal-, Finanz- und Satzungshoheit), und verlangt, dass der Gemeinde ein
    Aufgabenbereich verbleibt, in dem sie sich nennenswert betätigen kann. Außerhalb des Kernbereichs, im
    sogenannten Randbereich, darf der Gesetzgeber Aufgaben verändern oder entziehen, muss aber das
    Regel-Ausnahme-Prinzip zugunsten der Gemeinde beachten und ist an den Verhältnismäßigkeitsgrundsatz
    gebunden. Ein Entzug ist nur aus Gründen des Gemeininteresses gerechtfertigt, insbesondere wenn die
    ordnungsgemäße Aufgabenerfüllung auf andere Weise nicht sicherzustellen wäre.
  norms:
  - Art. 28 Abs. 2 S. 1 GG
  quellen:
  - GG, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-10
- slug: or-kr-sv-rastede
  type: rechtsprechung
  front: "Welche Anforderungen stellt das Rastede-Prinzip (BVerfGE 79, 127) an die Hochzonung einer Aufgabe von der Gemeinde auf den Kreis?"
  back: >-
    Wird eine örtliche Aufgabe den Gemeinden entzogen und höheren Verwaltungsebenen zugewiesen („Hochzonung“), ist in der Prüfung
    zunächst der Kernbereich abzugrenzen; bei einer einzelnen Aufgabe geht es regelmäßig um den Randbereich. Dort gilt das
    Regel-Ausnahme-Verhältnis zugunsten der Gemeinde: Der Entzug bedarf eines Grundes des Gemeininteresses. Ausreichend ist vor allem,
    dass die ordnungsgemäße Aufgabenwahrnehmung auf Gemeindeebene sonst nicht gewährleistet wäre, etwa weil ein überörtlicher Bezug
    oder fehlende Leistungsfähigkeit besteht. Das bloße Ziel der Verwaltungsvereinfachung, der Zuständigkeitskonzentration oder der
    Kostenersparnis genügt nicht. Der Gesetzgeber hat bei der Bewertung dieser Gründe einen Einschätzungsspielraum, muss seine
    Prognose aber auf tragfähige Tatsachen stützen und die betroffenen Gemeinden anhören. Die Grundsätze gehen auf den
    Rastede-Beschluss (BVerfGE 79, 127) zurück.
  norms:
  - Art. 28 Abs. 2 S. 1 GG
  quellen:
  - BVerfGE 79, 127 (Rastede)
  - Eigenformulierung Redaktion
  stand: 2026-10
- slug: or-kr-sv-gemeindehoheiten
  type: definition
  front: Welche Gemeindehoheiten werden aus Art. 28 Abs. 2 GG abgeleitet?
  back: >-
    Zur Selbstverwaltung gehört ein Bündel von Befugnissen, die als „Hoheiten“ bezeichnet werden: die
    Gebietshoheit (Hoheitsgewalt über das Gemeindegebiet), die Organisationshoheit (Regelung der inneren
    Organisation und Abläufe, im Rahmen der Gesetze), die Personalhoheit (Auswahl, Anstellung und
    Beförderung des Personals), die Planungshoheit (insbesondere die Bauleitplanung, vgl. § 2 Abs. 1 BauGB),
    die Finanzhoheit (eigenverantwortliche Einnahmen- und Ausgabenwirtschaft, Art. 28 Abs. 2 S. 3 GG), die
    Satzungshoheit (Erlass von Rechtsnormen für den eigenen Wirkungskreis) und teilweise die
    Kulturhoheit sowie die Abgabenhoheit. In der Klausur werden sie meist zur Bestimmung der verletzten
    Rechtsposition der Gemeinde genannt, etwa die Planungshoheit im Baurecht.
  norms:
  - Art. 28 Abs. 2 GG
  - § 2 Abs. 1 BauGB
  quellen:
  - GG, amtliche Fassung
  - BauGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-10
- slug: or-kr-sv-aufgabenarten
  type: definition
  front: Welche Aufgabenarten hat die Gemeinde, und wie unterscheiden sich das monistische und das dualistische System?
  back: >-
    Die Gemeinde nimmt zum einen Selbstverwaltungsaufgaben wahr, die sie in eigener Verantwortung erfüllt und
    bei denen sie nur der Rechtsaufsicht unterliegt. Zum anderen erfüllt sie Aufgaben, die ihr der Staat
    zugewiesen hat und bei denen sie an Weisungen gebunden sein kann. Im dualistischen System
    (z. B. Bayern, Niedersachsen) unterscheidet das Gesetz zwischen dem eigenen und dem übertragenen
    Wirkungskreis. Der übertragene Wirkungskreis umfasst die staatlichen Aufgaben, bei denen neben der
    Rechtsaufsicht auch Fachaufsicht besteht. Im monistischen System (z. B. Nordrhein-Westfalen, Baden-
    Württemberg) kennt man nur eine einheitliche Gemeindeaufgabe, die sich in weisungsfreie
    Selbstverwaltungsaufgaben und Weisungsaufgaben aufgliedert; bei Letzteren besteht ein Weisungsrecht
    der Fachbehörde. Maßgeblich ist stets die jeweilige Gemeindeordnung.
  norms:
  - Art. 28 Abs. 2 GG
  quellen:
  - Gemeindeordnungen der Länder (Landesrechtsportale)
  - Eigenformulierung Redaktion
  stand: 2026-10
- slug: or-kr-sv-allgemeinpolitisches-mandat
  type: streitstand
  front: Dürfen sich Gemeinderäte zu allgemeinpolitischen Fragen ohne örtlichen Bezug äußern (kein „allgemeinpolitisches Mandat“)?
  back: >-
    Nach der h. M. und der Rechtsprechung haben Gemeinden und ihre Organe kein allgemeinpolitisches Mandat.
    Die Zuständigkeit ist durch Art. 28 Abs. 2 S. 1 GG auf die Angelegenheiten der örtlichen Gemeinschaft
    begrenzt; Beschlüsse zu rein außen- oder bundespolitischen Themen (z. B. Resolutionen zu
    Kriegsfragen) überschreiten den Wirkungskreis und sind rechtswidrig. Zulässig sind Äußerungen, wenn die
    Gemeinde konkret und spezifisch betroffen ist (örtlicher Bezug), etwa bei einem Atommülllager im
    Gemeindegebiet. Eine in der Literatur vertretene Gegenansicht will der Gemeinde als politischer
    Gemeinschaft ein weiteres Äußerungsrecht zubilligen, soweit allgemeine Fragen die örtliche Gemeinschaft
    auch mittelbar berühren. Sie setzt sich nicht durch, weil sie die Kompetenzgrenzen des Art. 28 Abs. 2
    GG verwischt. Die Folge von Überschreitungen sind kommunalaufsichtliche Maßnahmen und
    Unterlassungsansprüche.
  norms:
  - Art. 28 Abs. 2 S. 1 GG
  quellen:
  - GG, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-10
- slug: or-kr-sv-finanzielle-eigenverantwortung
  type: norm
  front: Was besagt Art. 28 Abs. 2 S. 3 GG zur finanziellen Eigenverantwortung der Gemeinden?
  back: >-
    Art. 28 Abs. 2 S. 3 GG sichert die Grundlagen der finanziellen Eigenverantwortung. Dazu zählt seit der
    Grundgesetzänderung von 1997 eine den Gemeinden zustehende wirtschaftskraftbezogene Steuerquelle mit
    Hebesatzrecht (vgl. Art. 106 Abs. 6 GG; typischerweise die Gewerbesteuer, daneben steht den Gemeinden das Aufkommen der Grundsteuer zu). Aus der
    Garantie folgt kein Anspruch auf eine bestimmte Mindestausstattung im Einzelfall; die Länder haben
    aber über den kommunalen Finanzausgleich eine angemessene Finanzausstattung sicherzustellen, die den
    Gemeinden eine freiwillige Aufgabenwahrnehmung (nicht nur Pflichtaufgaben) ermöglicht. Bei einer
    Aufgabenübertragung müssen die Länder einen Mehrbelastungsausgleich regeln (landesverfassungsrechtlich,
    „Konnexitätsprinzip“). Der Bund darf den Gemeinden nach Art. 84 Abs. 1 S. 7 GG keine Aufgaben mehr
    unmittelbar übertragen.
  norms:
  - Art. 28 Abs. 2 S. 3 GG
  - Art. 106 Abs. 6 GG
  - Art. 84 Abs. 1 S. 7 GG
  quellen:
  - GG, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-10
- slug: or-kr-sv-kommunalverfassungsbeschwerde
  type: norm
  front: "Welche Rechtsschutzwege hat die Gemeinde gegen Eingriffe in die Selbstverwaltung, und wann kommt die Kommunalverfassungsbeschwerde in Betracht?"
  back: >-
    Der Rechtsschutz der Gemeinde richtet sich nach dem Angriffsgegenstand. Gegen ein Bundes- oder Landesgesetz, das ihr Recht auf
    Selbstverwaltung verletzt, steht die Kommunalverfassungsbeschwerde zum Bundesverfassungsgericht offen (Art. 93 Abs. 1 Nr. 4b GG,
    §§ 13 Nr. 8a, 91 BVerfGG). Die Gemeinde muss selbst, gegenwärtig und unmittelbar betroffen sein und die Beschwerde binnen eines
    Jahres seit Inkrafttreten des Gesetzes erheben (§ 93 Abs. 3 BVerfGG). Bei Landesgesetzen geht eine nach Landesrecht eröffnete
    Verfassungsbeschwerde zum Landesverfassungsgericht vor (§ 91 S. 2 BVerfGG, Subsidiarität). Prüfungsmaßstab ist allein
    Art. 28 Abs. 2 GG, weil die Gemeinde als Teil der Staatsorganisation sich grundsätzlich nicht auf Grundrechte berufen kann. Gegen
    Verwaltungsakte, etwa aufsichtliche Maßnahmen, klagt sie vor dem Verwaltungsgericht; ihre Klagebefugnis folgt ebenfalls aus
    Art. 28 Abs. 2 GG. Die Kommunalverfassungsbeschwerde ist kein Rechtsbehelf gegen Verwaltungsakte.
  norms:
  - Art. 93 Abs. 1 Nr. 4b GG
  - § 91 BVerfGG
  - § 93 Abs. 3 BVerfGG
  quellen:
  - GG, amtliche Fassung
  - BVerfGG, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-10
- slug: or-kr-sv-grundrechte-gemeinde
  type: definition
  front: Können sich Gemeinden gegenüber dem Staat auf Grundrechte berufen?
  back: >-
    Grundsätzlich nicht. Gemeinden sind juristische Personen des öffentlichen Rechts und gehören zur
    staatlichen Organisation. Grundrechte sind Abwehrrechte des Bürgers gegen den Staat; ein Träger
    öffentlicher Gewalt kann deshalb nicht zugleich Grundrechtsberechtigter sein (Konfusionsargument). Art. 19 Abs. 3 GG erstreckt die Grundrechte
    grundsätzlich nur auf inländische juristische Personen des Privatrechts; Ausnahmen für Einrichtungen des
    öffentlichen Rechts gibt es nur, wenn sie unmittelbar einem grundrechtsgeschützten Lebensbereich zugeordnet
    sind (etwa Universitäten oder Rundfunkanstalten), nicht aber für Gemeinden. Ausnahmen gelten für die
    Verfahrensgrundrechte Art. 101 Abs. 1 S. 2 und Art. 103 Abs. 1 GG, die in jedem gerichtlichen Verfahren
    gelten.
    Für den Schutz ihrer Rechtsstellung dient Art. 28 Abs. 2 GG; im Verwaltungsprozess folgt die
    Klagebefugnis der Gemeinde aus ihrer Selbstverwaltungsgarantie (z. B. Planungshoheit).
  norms:
  - Art. 19 Abs. 3 GG
  - Art. 28 Abs. 2 GG
  - Art. 101 Abs. 1 S. 2 GG
  - Art. 103 Abs. 1 GG
  quellen:
  - GG, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-10
schemata:
- slug: or-schema-kr-sv-kommunalverfassungsbeschwerde
  title: Kommunalverfassungsbeschwerde gegen ein Gesetz, Art. 93 Abs. 1 Nr. 4b GG
  norms:
  - Art. 93 Abs. 1 Nr. 4b GG
  - § 91 BVerfGG
  - Art. 28 Abs. 2 GG
  quellen:
  - GG, amtliche Fassung
  - BVerfGG, amtliche Fassung
  - Eigenformulierung Redaktion
  steps:
  - label: A. Zulässigkeit
    children:
    - label: I. Zuständigkeit des Bundesverfassungsgerichts, Art. 93 Abs. 1 Nr. 4b GG, § 13 Nr. 8a BVerfGG
    - label: II. Beschwerdeführer – Gemeinde oder Gemeindeverband, § 91 BVerfGG
    - label: III. Beschwerdegegenstand – Bundes- oder Landesgesetz
    - label: IV. Beschwerdebefugnis
      children:
      - label: 1. Möglichkeit der Verletzung des Art. 28 Abs. 2 GG
      - label: 2. Selbst, gegenwärtig und unmittelbar betroffen
    - label: V. Subsidiarität – Landesverfassungsbeschwerde, § 91 S. 2 BVerfGG
      hinweis: Nur bei Landesgesetzen und nur, wenn das Landesverfassungsrecht eine kommunale Verfassungsbeschwerde vorsieht.
    - label: VI. Form und Frist, §§ 23, 92 und 93 Abs. 3 BVerfGG
      hinweis: Ein Jahr ab Inkrafttreten des Gesetzes.
  - label: B. Begründetheit
    children:
    - label: I. Schutzbereich – Angelegenheit der örtlichen Gemeinschaft, Gemeindehoheit
    - label: II. Eingriff – Entzug oder Beschränkung einer Aufgabe oder Befugnis
    - label: III. Rechtfertigung
      children:
      - label: 1. Formelle Verfassungsmäßigkeit (Zuständigkeit, Verfahren, Anhörung der Gemeinde)
      - label: 2. Kernbereich nicht verletzt
      - label: 3. Randbereich – Regel-Ausnahme-Prinzip zugunsten der Gemeinde, Rastede
        hinweis: Entzug nur aus Gründen des Gemeininteresses; Verwaltungsvereinfachung allein genügt nicht.
      - label: 4. Verhältnismäßigkeit
faelle:
- slug: or-fall-kr-sv-hochzonung
  title: Die Hochzonung der Abwasserbeseitigung
  difficulty: 3
  minutes: 50
  quellen:
  - Eigener Sachverhalt der Redaktion
  - GG, amtliche Fassung
  - BVerfGG, amtliche Fassung
  facts: >-
    Ein Landesgesetz überträgt die bisher von allen kreisangehörigen Gemeinden des Landes in eigener
    Verantwortung wahrgenommene Aufgabe der Abwasserbeseitigung mit Wirkung zum 1. Januar auf die Landkreise.
    Zur Begründung nennt der Gesetzgeber lediglich, die Verwaltung solle vereinfacht und zentralisiert werden.
    Konkrete Defizite bei der Aufgabenwahrnehmung der Gemeinden werden nicht festgestellt; die Gemeinden
    erfüllen die Aufgabe bisher ordnungsgemäß. Die kreisangehörige Gemeinde G will sich gegen das Gesetz zur
    Wehr setzen. Das Landesverfassungsrecht sieht keine Verfassungsbeschwerde kommunaler Körperschaften zum
    Landesverfassungsgericht vor. G erhebt innerhalb von drei Monaten nach Inkrafttreten des Gesetzes
    Verfassungsbeschwerde zum Bundesverfassungsgericht.
  question: Hat die Verfassungsbeschwerde der G Aussicht auf Erfolg?
  steps:
  - prompt: Welche Verfahrensart ist statthaft, und welche Zulässigkeitsvoraussetzungen sind zu prüfen?
    erwartung: Die Kommunalverfassungsbeschwerde nach Art. 93 Abs. 1 Nr. 4b GG, § 91 BVerfGG. G ist als Gemeinde beschwerdefähig, Gegenstand ist ein Landesgesetz, G ist selbst, gegenwärtig und unmittelbar betroffen. Die Jahresfrist des § 93 Abs. 3 BVerfGG ist gewahrt. Eine Landesverfassungsbeschwerde ist nach dem Sachverhalt nicht eröffnet, die Subsidiarität nach § 91 S. 2 BVerfGG steht der Zulässigkeit also nicht entgegen.
  - prompt: Ist der Schutzbereich von Art. 28 Abs. 2 S. 1 GG berührt, und liegt ein Eingriff vor?
    erwartung: Die Abwasserbeseitigung ist eine Angelegenheit der örtlichen Gemeinschaft; der Entzug der bisher in eigener Verantwortung erfüllten Aufgabe greift in die Selbstverwaltungsgarantie ein.
  - prompt: Ist der Aufgabenentzug gerechtfertigt?
    erwartung: Der Kernbereich ist nicht berührt, es geht um den Randbereich (einzelne Aufgabe). Hier gilt das Regel-Ausnahme-Prinzip zugunsten der Gemeinde (Rastede). Ein Entzug ist nur aus Gründen des Gemeininteresses zulässig, namentlich wenn die ordnungsgemäße Aufgabenwahrnehmung sonst nicht gesichert ist. Verwaltungsvereinfachung und Zentralisierung allein genügen nicht, die Gemeinden erfüllen die Aufgabe ordnungsgemäß. Der Entzug ist deshalb nicht gerechtfertigt.
  - prompt: Wie lautet das Ergebnis?
    erwartung: Die Verfassungsbeschwerde ist zulässig und begründet. Das Gesetz verletzt G in ihrem Recht aus Art. 28 Abs. 2 S. 1 GG.
  expectation:
