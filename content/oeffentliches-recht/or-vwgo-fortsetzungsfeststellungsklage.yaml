topic:
  slug: or-vwgo-fortsetzungsfeststellungsklage
  area: oeffentliches-recht
  title: Die Fortsetzungsfeststellungsklage, § 113 Abs. 1 S. 4 VwGO
  parent: oeffentliches-recht
  relevance: 5
  stand: 2026-09
  redaktion:
    erzeugt_von: claude-fable-5-1
    status: in-pruefung
    normzitate_geprueft: true
cards:
- slug: or-vwgo-ffk-begriff-funktion
  type: definition
  front: 'Definiere: Fortsetzungsfeststellungsklage und nenne ihre Funktion'
  back: >-
    Die Fortsetzungsfeststellungsklage ist die Klage auf Feststellung, dass ein
    Verwaltungsakt rechtswidrig war, nachdem er sich erledigt hat. Sie setzt
    eine ursprünglich zulässige oder jedenfalls mögliche Anfechtungs- oder
    Verpflichtungsklage prozessual "fort": Weil der erledigte Verwaltungsakt
    nicht mehr aufgehoben oder erlassen werden kann, würde die Klage sonst
    unzulässig; § 113 Abs. 1 S. 4 VwGO erhält dem Kläger den bereits
    angefallenen Prozessstoff und schützt seinen Anspruch auf effektiven
    Rechtsschutz aus Art. 19 Abs. 4 GG.
  norms:
  - § 113 Abs. 1 S. 4 VwGO
  - Art. 19 Abs. 4 GG
  quellen:
  - VwGO, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: or-vwgo-ffk-norm-113-abs1-s4
  type: norm
  front: Was regelt § 113 Abs. 1 S. 4 VwGO seinem Wortlaut nach?
  back: >-
    Hat sich der Verwaltungsakt vorher - also nach Klageerhebung, aber vor der
    gerichtlichen Entscheidung - durch Zurücknahme oder anders erledigt, so
    spricht das Gericht auf Antrag durch Urteil aus, dass der Verwaltungsakt
    rechtswidrig gewesen ist, wenn der Kläger ein berechtigtes Interesse an
    dieser Feststellung hat. Die Vorschrift steht im Abschnitt über das Urteil
    und regelt unmittelbar nur die Anfechtungssituation mit Erledigung nach
    Rechtshängigkeit. Ihre Voraussetzungen sind: ein Verwaltungsakt, dessen
    Erledigung, ein Antrag des Klägers und ein berechtigtes
    Feststellungsinteresse.
  norms:
  - § 113 Abs. 1 S. 4 VwGO
  quellen:
  - VwGO, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: or-vwgo-ffk-erledigung-begriff
  type: definition
  front: Wann ist ein Verwaltungsakt "erledigt" i.S.d. § 113 Abs. 1 S. 4 VwGO?
  back: >-
    Erledigt ist ein Verwaltungsakt, wenn er keine Regelungswirkung mehr
    entfaltet, weil die von ihm ausgehende Beschwer nachträglich weggefallen
    ist. Maßgeblich ist, dass das Klageziel - die Aufhebung - dem Kläger keinen
    rechtlichen oder tatsächlichen Vorteil mehr bringen kann. Typische
    Erledigungsgründe sind Zeitablauf (befristete Verfügung), Vollzug ohne
    fortdauernde Wirkung, Aufhebung durch die Behörde, Wegfall des
    Regelungsobjekts oder eine Erledigung "auf andere Weise" i.S.d. § 43 Abs. 2
    VwVfG. Nicht erledigt ist ein vollzogener Verwaltungsakt, dessen Vollzug
    noch rückgängig gemacht werden kann (Vollzugsfolgenbeseitigung, § 113
    Abs. 1 S. 2 VwGO), oder eine Maßnahme, die weiterhin Grundlage einer
    Belastung (etwa einer Kostenforderung) ist.
  norms:
  - § 113 Abs. 1 S. 4 VwGO
  - § 113 Abs. 1 S. 2 VwGO
  - § 43 Abs. 2 VwVfG
  quellen:
  - VwGO, amtliche Fassung
  - VwVfG, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: or-vwgo-ffk-erledigung-vor-klageerhebung-analogie
  type: streitstand
  front: Ist § 113 Abs. 1 S. 4 VwGO anwendbar, wenn sich der Verwaltungsakt schon
    vor Klageerhebung erledigt hat?
  back: >-
    Der Wortlaut ("vorher") erfasst nur die Erledigung nach Klageerhebung. Für
    die Erledigung vor Klageerhebung ist nach ganz herrschender Meinung § 113
    Abs. 1 S. 4 VwGO analog anzuwenden: Es besteht eine planwidrige
    Regelungslücke, weil der Gesetzgeber die Fallgruppe nicht bedacht hat, und
    die Interessenlage ist vergleichbar - der Betroffene darf nicht schlechter
    stehen, nur weil sich die Maßnahme besonders schnell erledigt hat (Art. 19
    Abs. 4 GG). Eine Mindermeinung verweist stattdessen auf die allgemeine
    Feststellungsklage nach § 43 Abs. 1 VwGO, weil sich mit der Erledigung das
    "Rechtsverhältnis" des Verwaltungsakts feststellen lasse. Praktisch
    relevant ist der Streit vor allem für die Frage, ob Widerspruchsverfahren
    und Klagefrist zu beachten sind. Die herrschende Meinung verneint dies bei
    Erledigung vor Klageerhebung, weil kein aufhebbarer Verwaltungsakt mehr
    existiert, auf den sich Vorverfahren und Frist beziehen könnten; die
    Klagebefugnis nach § 42 Abs. 2 VwGO ist dagegen analog zu prüfen.
  norms:
  - § 113 Abs. 1 S. 4 VwGO
  - § 43 Abs. 1 VwGO
  - § 42 Abs. 2 VwGO
  - Art. 19 Abs. 4 GG
  quellen:
  - VwGO, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: or-vwgo-ffk-verpflichtungssituation
  type: streitstand
  front: Gilt § 113 Abs. 1 S. 4 VwGO auch für die erledigte Verpflichtungsklage?
  back: >-
    § 113 Abs. 1 S. 4 VwGO steht systematisch im Kontext der Anfechtungsklage.
    Hat sich das Verpflichtungsbegehren erledigt - etwa weil der beantragte
    Termin verstrichen ist oder die begehrte Erlaubnis inzwischen aus anderen
    Gründen nicht mehr benötigt wird -, wendet die herrschende Meinung die
    Vorschrift entsprechend an ("Fortsetzungsfeststellungsklage in der
    Verpflichtungssituation"). Festgestellt wird dann, dass die Ablehnung
    rechtswidrig war und die Behörde zum Erlass verpflichtet gewesen wäre,
    beziehungsweise bei Ermessensentscheidungen, dass sie zur Neubescheidung
    verpflichtet gewesen wäre. Eine Gegenauffassung möchte auch hier die
    allgemeine Feststellungsklage nach § 43 Abs. 1 VwGO anwenden. Da beide
    Wege zu ähnlichen Ergebnissen führen, genügt in der Klausur die Nennung des
    Meinungsstands und eine kurze Entscheidung; die Analogie verdient den
    Vorzug, weil sie die Sachurteilsvoraussetzungen der Verpflichtungsklage
    (insbesondere die Klagebefugnis) fortführt.
  norms:
  - § 113 Abs. 1 S. 4 VwGO
  - § 113 Abs. 5 VwGO
  - § 43 Abs. 1 VwGO
  quellen:
  - VwGO, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: or-vwgo-ffk-feststellungsinteresse-fallgruppen
  type: definition
  front: Nenne die anerkannten Fallgruppen des berechtigten Feststellungsinteresses
    bei der Fortsetzungsfeststellungsklage.
  back: >-
    Das berechtigte Interesse kann rechtlicher, wirtschaftlicher oder ideeller
    Natur sein. Anerkannt sind vier Fallgruppen: (1) Wiederholungsgefahr - die
    hinreichend konkrete Gefahr, dass unter im Wesentlichen unveränderten
    tatsächlichen und rechtlichen Umständen ein gleichartiger Verwaltungsakt
    erneut ergeht; (2) Rehabilitationsinteresse - der erledigte Verwaltungsakt
    wirkt diskriminierend fort, weil er dem Kläger ein ehrenrühriges oder
    strafbares Verhalten unterstellt und diese Wirkung nach außen erkennbar
    anhält; (3) tiefgreifender Grundrechtseingriff - Maßnahmen, die sich
    typischerweise so kurzfristig erledigen, dass Hauptsacherechtsschutz sonst
    nie erlangt werden könnte (Art. 19 Abs. 4 GG); (4) Präjudizinteresse - die
    Vorbereitung eines Amtshaftungs- oder Entschädigungsprozesses vor den
    Zivilgerichten. Das Interesse muss im Zeitpunkt der letzten mündlichen
    Verhandlung vorliegen und ist vom Kläger substantiiert darzulegen.
  norms:
  - § 113 Abs. 1 S. 4 VwGO
  - Art. 19 Abs. 4 GG
  quellen:
  - VwGO, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: or-vwgo-ffk-praejudizinteresse-grenzen
  type: streitstand
  front: Wann begründet die Vorbereitung eines Amtshaftungsprozesses ein
    Feststellungsinteresse - und wann nicht?
  back: >-
    Das Präjudizinteresse wird anerkannt, weil das Verwaltungsgericht über die
    Rechtswidrigkeit sachnäher entscheidet und die Feststellung das
    Zivilgericht im Amtshaftungsprozess bindet. Es bestehen aber zwei
    anerkannte Grenzen: Erstens muss der Schadensersatzprozess ernsthaft
    beabsichtigt und darf nicht offensichtlich aussichtslos sein - etwa weil
    ein Verschulden ersichtlich fehlt, weil ein Kollegialgericht die Maßnahme
    bereits gebilligt hat, oder weil ein Schaden erkennbar nicht eingetreten
    ist. Zweitens fehlt das Interesse nach herrschender Meinung, wenn sich
    der Verwaltungsakt bereits vor Klageerhebung erledigt hat: Dann kann der
    Kläger den Amtshaftungsprozess direkt vor dem Zivilgericht führen, das die
    Rechtswidrigkeit inzident prüft; es gibt keinen "Prozessstoff", der
    erhalten werden müsste. Eine Gegenauffassung hält den Sachverstand der
    Verwaltungsgerichte auch in dieser Konstellation für ausschlaggebend. Bei
    Erledigung nach Klageerhebung genügt dagegen die Präjudizwirkung.
  norms:
  - § 113 Abs. 1 S. 4 VwGO
  - Art. 34 GG
  - § 839 BGB
  quellen:
  - VwGO, amtliche Fassung
  - BGB, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: or-vwgo-ffk-wiederholungsgefahr-rehabilitation-anforderungen
  type: definition
  front: Welche Anforderungen gelten an Wiederholungsgefahr und
    Rehabilitationsinteresse im Einzelnen?
  back: >-
    Wiederholungsgefahr verlangt die konkrete, nicht nur abstrakte Erwartung,
    dass die Behörde in absehbarer Zeit bei im Wesentlichen gleicher Sach- und
    Rechtslage erneut eine gleichartige Maßnahme treffen wird; Indizien sind
    ein angekündigtes gleichbleibendes Verwaltungshandeln oder eine
    fortbestehende Situation (z. B. regelmäßig angemeldete Versammlungen mit
    denselben Auflagen). Eine bloß theoretische Möglichkeit genügt nicht. Das
    Rehabilitationsinteresse setzt eine fortdauernde Stigmatisierung voraus:
    Der Verwaltungsakt muss nach seinem Inhalt oder seiner Begründung den
    Vorwurf eines rechtswidrigen oder unehrenhaften Verhaltens enthalten und
    diese Wirkung muss objektiv nachwirken, etwa weil die Maßnahme öffentlich
    wahrgenommen wurde oder aktenkundig bleibt. Die bloße Behauptung, die
    Maßnahme sei "kränkend", reicht ebenso wenig wie das allgemeine Interesse an
    der Klärung einer Rechtsfrage.
  norms:
  - § 113 Abs. 1 S. 4 VwGO
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: or-vwgo-ffk-begruendetheit-massstab
  type: schema_step
  front: Wann ist die Fortsetzungsfeststellungsklage begründet?
  back: >-
    Die Fortsetzungsfeststellungsklage ist begründet, wenn der erledigte
    Verwaltungsakt rechtswidrig war und den Kläger in seinen Rechten verletzt
    hat (§ 113 Abs. 1 S. 4 VwGO i.V.m. dem Rechtsgedanken des § 113 Abs. 1
    S. 1 VwGO). Die Rechtmäßigkeitsprüfung folgt dem gewohnten Aufbau:
    Ermächtigungsgrundlage, formelle Rechtmäßigkeit (Zuständigkeit, Verfahren,
    Form), materielle Rechtmäßigkeit (Tatbestand, Rechtsfolge, Ermessen,
    Verhältnismäßigkeit). Maßgeblicher Zeitpunkt für die Beurteilung ist
    grundsätzlich der Zeitpunkt unmittelbar vor der Erledigung, bei
    Dauerverwaltungsakten also der gesamte Zeitraum bis zur Erledigung. Der
    Tenor lautet auf Feststellung der Rechtswidrigkeit, nicht auf Aufhebung.
  norms:
  - § 113 Abs. 1 S. 4 VwGO
  - § 113 Abs. 1 S. 1 VwGO
  quellen:
  - VwGO, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
schemata:
- slug: or-schema-vwgo-fortsetzungsfeststellungsklage
  title: Zulässigkeit und Begründetheit der Fortsetzungsfeststellungsklage, § 113
    Abs. 1 S. 4 VwGO
  norms:
  - § 113 Abs. 1 S. 4 VwGO
  - § 40 Abs. 1 S. 1 VwGO
  - § 42 Abs. 2 VwGO
  quellen:
  - VwGO, amtliche Fassung
  - Eigenformulierung Redaktion
  steps:
  - label: I. Eröffnung des Verwaltungsrechtswegs, § 40 Abs. 1 S. 1 VwGO
    hinweis: Öffentlich-rechtliche Streitigkeit nichtverfassungsrechtlicher Art
      ohne abdrängende Sonderzuweisung.
  - label: II. Statthafte Klageart
    children:
    - label: 1. Ursprüngliches Begehren war Anfechtungs- oder Verpflichtungsbegehren
        gegen einen Verwaltungsakt, § 35 VwVfG
    - label: 2. Erledigung des Verwaltungsakts (Wegfall der Beschwer)
    - label: 3. Zeitpunkt der Erledigung - nach Klageerhebung (direkt) oder vor
        Klageerhebung (analog)
    hinweis: Bei Erledigung eines Verpflichtungsbegehrens ebenfalls analoge
      Anwendung (h.M.).
  - label: III. Klagebefugnis, § 42 Abs. 2 VwGO analog
    hinweis: Möglichkeit einer Rechtsverletzung durch den erledigten Verwaltungsakt;
      beim Adressaten eines belastenden Verwaltungsakts regelmäßig gegeben.
  - label: IV. Vorverfahren und Klagefrist
    children:
    - label: 1. Erledigung nach Klageerhebung - Vorverfahren (§ 68 VwGO) und Frist
        (§ 74 VwGO) mussten für die ursprüngliche Klage gewahrt sein
    - label: 2. Erledigung vor Klageerhebung - nach h.M. weder Vorverfahren noch
        Klagefrist erforderlich; Grenze ist die Verwirkung
  - label: V. Besonderes Feststellungsinteresse
    children:
    - label: 1. Wiederholungsgefahr
    - label: 2. Rehabilitationsinteresse
    - label: 3. Tiefgreifender Grundrechtseingriff mit typischerweise kurzfristiger
        Erledigung, Art. 19 Abs. 4 GG
    - label: 4. Präjudizinteresse für Amtshaftungs- oder Entschädigungsprozess
    hinweis: Das Interesse muss vom Kläger dargelegt werden und im Zeitpunkt der
      letzten mündlichen Verhandlung noch bestehen.
  - label: VI. Richtiger Beklagter, § 78 VwGO, und Beteiligtenfähigkeit, § 61 VwGO
  - label: VII. Begründetheit
    children:
    - label: 1. Rechtswidrigkeit des erledigten Verwaltungsakts (Ermächtigungsgrundlage,
        formelle und materielle Rechtmäßigkeit)
    - label: 2. Verletzung des Klägers in seinen Rechten
    hinweis: Maßgeblicher Zeitpunkt ist grundsätzlich der Zeitpunkt unmittelbar
      vor der Erledigung.
faelle:
- slug: or-fall-versammlungsaufloesung-fortsetzungsfeststellung
  title: Die aufgelöste Kundgebung vor dem Rathaus
  difficulty: 4
  minutes: 60
  quellen:
  - Eigener Sachverhalt der Redaktion
  - VwGO, amtliche Fassung
  - GG, amtliche Fassung
  facts: >-
    A meldet bei der zuständigen Behörde der Stadt S für den 3. Mai eine
    Kundgebung mit 40 Teilnehmern vor dem Rathaus an, um gegen die geplante
    Schließung eines städtischen Schwimmbads zu protestieren. Die Versammlung
    wird ohne Auflagen bestätigt. Als am 3. Mai etwa 60 Personen erscheinen und
    ein einzelner Teilnehmer ein Transparent mit einer beleidigenden Parole
    zeigt, löst der Einsatzleiter der Polizei die gesamte Versammlung nach
    zwanzig Minuten mündlich auf. Er begründet dies damit, dass die
    Teilnehmerzahl über der angemeldeten liege und die Versammlung "insgesamt
    aus dem Ruder laufe". A hatte zuvor angeboten, den betreffenden Teilnehmer
    zum Entfernen des Transparents aufzufordern. A ist empört: Die Schließung
    des Schwimmbads sei noch nicht beschlossen, weitere Kundgebungen seien
    monatlich geplant, und die Auflösung habe ihn vor Passanten und der
    lokalen Presse als Veranstalter einer "entgleisten" Versammlung
    dargestellt. Drei Wochen später erhebt A ohne vorheriges
    Widerspruchsverfahren Klage vor dem Verwaltungsgericht mit dem Antrag
    festzustellen, dass die Auflösung rechtswidrig war. Das
    Landesversammlungsrecht sieht die Auflösung nur vor, wenn die öffentliche
    Sicherheit unmittelbar gefährdet ist und mildere Mittel nicht ausreichen.
  question: Hat die Klage des A Aussicht auf Erfolg?
  steps:
  - prompt: Welche Klageart ist statthaft? Berücksichtige den Zeitpunkt der
      Erledigung.
    erwartung: >-
      Die Auflösung ist ein Verwaltungsakt (§ 35 S. 1 VwVfG), der sich mit
      seinem Vollzug am 3. Mai erledigt hat - sie entfaltet keine
      Regelungswirkung mehr, eine Aufhebung würde A nichts nützen. Da die
      Erledigung vor Klageerhebung eingetreten ist, ist § 113 Abs. 1 S. 4 VwGO
      nicht unmittelbar, aber nach h.M. analog anwendbar. Statthaft ist die
      Fortsetzungsfeststellungsklage analog § 113 Abs. 1 S. 4 VwGO.
  - prompt: Ist A klagebefugt?
    erwartung: >-
      Ja - A ist als Veranstalter und Versammlungsleiter Adressat der
      Auflösungsverfügung; eine Verletzung seiner Versammlungsfreiheit aus
      Art. 8 Abs. 1 GG erscheint möglich (§ 42 Abs. 2 VwGO analog,
      Adressatengedanke).
  - prompt: Schadet es, dass A kein Widerspruchsverfahren durchgeführt hat und
      erst drei Wochen später klagt?
    erwartung: >-
      Nein - bei Erledigung vor Klageerhebung sind nach h.M. weder ein
      Vorverfahren nach § 68 VwGO noch die Klagefrist des § 74 VwGO zu wahren,
      da kein aufhebbarer Verwaltungsakt mehr existiert. Drei Wochen liegen
      zudem weit von einer Verwirkung entfernt.
  - prompt: Liegt ein besonderes Feststellungsinteresse vor? Prüfe alle in Betracht
      kommenden Fallgruppen.
    erwartung: >-
      Wiederholungsgefahr: A plant monatliche Kundgebungen zum selben Thema,
      die Sach- und Rechtslage ist unverändert - die konkrete Gefahr einer
      gleichartigen Maßnahme besteht. Rehabilitationsinteresse: Die Auflösung
      vor Passanten und Presse stellt A als Veranstalter einer "entgleisten"
      Versammlung dar; diese stigmatisierende Wirkung dauert an. Tiefgreifender
      Grundrechtseingriff: Die Auflösung einer Versammlung greift schwer in
      Art. 8 Abs. 1 GG ein und erledigt sich typischerweise, bevor
      Hauptsacherechtsschutz erlangt werden kann - Art. 19 Abs. 4 GG gebietet
      die nachträgliche Kontrolle. Jede Fallgruppe trägt für sich; das
      Feststellungsinteresse ist gegeben.
  - prompt: War die Auflösung rechtswidrig?
    erwartung: >-
      Die Auflösung ist die schärfste versammlungsrechtliche Maßnahme und nur
      als letztes Mittel zulässig. Die Überschreitung der angemeldeten
      Teilnehmerzahl begründet für sich keine unmittelbare Gefahr für die
      öffentliche Sicherheit. Das beleidigende Transparent eines einzelnen
      Teilnehmers rechtfertigt Maßnahmen gegen diesen Störer, nicht gegen die
      friedliche Gesamtversammlung; A hatte ein milderes Mittel sogar
      angeboten. Die Auflösung war daher unverhältnismäßig und verletzt A in
      Art. 8 Abs. 1 GG. Die Klage ist zulässig und begründet.
  expectation:
