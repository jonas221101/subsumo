cards:
- slug: or-vwvfg-ermessen-begriff
  type: definition
  front: 'Definiere: Ermessen i.S.d. § 40 VwVfG'
  back: Ermessen ist der auf der Rechtsfolgenseite einer Norm eröffnete Entscheidungsspielraum
    der Verwaltung, erkennbar an Formulierungen wie 'kann' oder 'darf'. Man unterscheidet
    Entschließungsermessen (Ob des Handelns) und Auswahlermessen (Wie des Handelns,
    insbesondere bei mehreren zulässigen Maßnahmen). Die Ermessensermächtigung
    ist nach § 40 VwVfG entsprechend dem Zweck der Ermächtigung auszuüben; die gesetzlichen
    Grenzen des Ermessens sind einzuhalten.
  norms:
  - § 40 VwVfG
  quellen:
  - VwVfG, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: or-vwvfg-ermessensfehler-arten
  type: definition
  front: Nenne die vier klassischen Arten von Ermessensfehlern
  back: '(1) Ermessensausfall: Die Behörde verkennt, dass ihr überhaupt Ermessen
    zusteht, und trifft eine gebundene Entscheidung. (2) Ermessensüberschreitung:
    Die gewählte Rechtsfolge liegt außerhalb des gesetzlich eröffneten Rahmens.
    (3) Ermessensfehlgebrauch: Die Behörde übt das Ermessen zwar aus, stützt sich
    dabei aber auf sachfremde Erwägungen oder verstößt gegen den Zweck der Ermächtigung,
    gegen Grundrechte, den Gleichheitssatz oder den Verhältnismäßigkeitsgrundsatz.
    (4) Ermessensunterschreitung (Ermessensdefizit): Die Behörde erkennt zwar ihr
    Ermessen, ermittelt aber nicht alle abwägungsrelevanten Gesichtspunkte.'
  norms:
  - § 40 VwVfG
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: or-vwvfg-ermessen-gerichtliche-kontrolle
  type: norm
  front: In welchem Umfang kontrollieren Gerichte Ermessensentscheidungen, § 114 S.
    1 VwGO?
  back: Das Gericht prüft nach § 114 S. 1 VwGO nur, ob der Verwaltungsakt rechtswidrig
    ist, weil die gesetzlichen Grenzen des Ermessens überschritten sind oder von
    dem Ermessen in einer dem Zweck der Ermächtigung nicht entsprechenden Weise Gebrauch
    gemacht wurde. Eine eigene Zweckmäßigkeitsentscheidung an Stelle der Behörde
    trifft das Gericht nicht - es kontrolliert nur Ermessensfehler, übt das Ermessen
    aber nicht selbst aus.
  norms:
  - § 114 VwGO
  quellen:
  - VwGO, amtliche Fassung
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: or-vwvfg-ermessensreduzierung-null
  type: definition
  front: Wann liegt eine Ermessensreduzierung auf Null vor?
  back: Eine Ermessensreduzierung auf Null liegt vor, wenn angesichts der Umstände
    des Einzelfalls - etwa bei einer Gefahr für besonders hochrangige Rechtsgüter
    wie Leben oder Gesundheit - nur noch eine einzige Entscheidung ermessensfehlerfrei
    ist. In diesem Fall verdichtet sich der Ermessensspielraum zu einer Pflicht zum
    Handeln in genau dieser Weise, und der Betroffene kann einen Anspruch auf genau
    diese Maßnahme haben.
  norms:
  - § 40 VwVfG
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: or-vwvfg-beurteilungsspielraum-begriff
  type: streitstand
  front: Grenze den Beurteilungsspielraum vom Ermessen ab
  back: 'Während Ermessen auf der Rechtsfolgenseite einer Norm angesiedelt ist, betrifft
    der Beurteilungsspielraum die Tatbestandsseite: Der Behörde wird bei der Anwendung
    eines unbestimmten Rechtsbegriffs ausnahmsweise ein eigener Wertungs- und Einschätzungsspielraum
    belassen, den die Gerichte grundsätzlich nur eingeschränkt nachprüfen - obwohl
    unbestimmte Rechtsbegriffe nach dem Regelfall vollständig gerichtlich überprüfbar
    sind. Ein Beurteilungsspielraum ist daher die begründungsbedürftige Ausnahme,
    kein allgemeines Prinzip.'
  norms:
  - § 40 VwVfG
  - Art. 19 Abs. 4 GG
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
- slug: or-vwvfg-beurteilungsspielraum-fallgruppen
  type: streitstand
  front: Nenne anerkannte Fallgruppen des Beurteilungsspielraums und den gerichtlichen
    Kontrollmaßstab
  back: Anerkannt sind u. a. prüfungsähnliche Entscheidungen (z. B. Examensbewertungen),
    Entscheidungen weisungsfreier, pluralistisch zusammengesetzter Gremien (z. B.
    Prüfungsausschüsse) sowie bestimmte Prognose- und Risiköntscheidungen in hochkomplexen
    fachlichen Zusammenhängen. Die gerichtliche Kontrolle beschränkt sich dann darauf,
    ob die Behörde ein ordnungsgemäßes Verfahren eingehalten, den anzuwendenden
    Rechtsbegriff nicht verkannt, keine sachfremden Erwägungen angestellt und allgemein
    gültige Bewertungsmaßstäbe beachtet hat (Beurteilungsfehler) - nicht, ob die
    Entscheidung inhaltlich 'richtig' ist.
  norms:
  - Art. 19 Abs. 4 GG
  - § 114 VwGO
  quellen:
  - Eigenformulierung Redaktion
  stand: 2026-09
schemata:
- slug: or-schema-vwvfg-ermessensfehlerkontrolle
  title: Prüfung von Ermessensfehlern
  norms:
  - § 40 VwVfG
  - § 114 VwGO
  quellen:
  - VwVfG und VwGO, amtliche Fassung
  - Eigenformulierung Redaktion
  steps:
  - label: I. Eröffnet die Ermächtigungsgrundlage Ermessen?
    hinweis: Wortlaut 'kann'/'darf' als Indiz.
  - label: II. Ermessensausfall
    hinweis: Hat die Behörde verkannt, dass ihr Ermessen zusteht?
  - label: III. Ermessensüberschreitung
    hinweis: Liegt die Rechtsfolge außerhalb des gesetzlichen Rahmens?
  - label: IV. Ermessensfehlgebrauch
    children:
    - label: 1. Sachfremde Erwägungen
    - label: 2. Verstoß gegen Zweck der Ermächtigung, § 40 VwVfG
    - label: 3. Verstoß gegen Grundrechte, Gleichheitssatz oder Verhältnismäßigkeit
  - label: V. Ermessensreduzierung auf Null missachtet?
    hinweis: Nur noch eine Entscheidung ist ermessensfehlerfrei.
  - label: VI. Ergebnis
faelle:
- slug: or-fall-einsturzgefaehrdeter-balkon-ermessensreduzierung
  title: Der einsturzgefährdete Balkon über der Fußgängerzone
  difficulty: 4
  minutes: 55
  quellen:
  - Eigener Sachverhalt der Redaktion
  - VwVfG, amtliche Fassung
  facts: Am Wohnhaus des V droht ein Balkon herabzustürzen; das Gebäude liegt unmittelbar
    an einer stark frequentierten Fußgängerzone. Ein Bausachverständigengutachten
    bestätigt akute Einsturzgefahr binnen weniger Tage. Nach der einschlägigen (fiktiven)
    Ermächtigungsnorm ist die zuständige Bauaufsichtsbehörde befugt, "die zur Abwehr
    der Gefahr erforderlichen Maßnahmen zu treffen". Trotz mehrfacher Hinweise lehnt
    die Behörde ein Einschreiten ab und begründet dies damit, sie habe "aktuell
    keine personellen Kapazitäten". Der täglich die Fußgängerzone passierende
    Nachbar N verlangt behördliches Einschreiten.
  question: Ist die Ablehnung des Einschreitens ermessensfehlerfrei?
  steps:
  - prompt: Räumt die Ermächtigungsnorm der Behörde Ermessen ein?
    erwartung: Ja - die Formulierung 'ist befugt, die erforderlichen Maßnahmen zu
      treffen' eröffnet Entschließungsermessen (Ob des Einschreitens).
  - prompt: Ist das Ermessen im vorliegenden Fall eingeschränkt?
    erwartung: 'Ja - angesichts der akuten Gefahr für Leben und Gesundheit einer
      unbestimmten Vielzahl von Passanten ist das Entschließungsermessen auf Null
      reduziert: Jede andere Entscheidung als ein Einschreiten wäre ermessensfehlerhaft.'
  - prompt: Ist die Berufung auf fehlende personelle Kapazitäten eine tragfähige
      Erwägung?
    erwartung: Nein - organisatorische Kapazitätsengpässe sind gegenüber der akuten
      Gefahr für Leib und Leben eine sachfremde Erwägung und vermögen die gebotene
      Maßnahme nicht zurückzustellen; es liegt ein Ermessensfehlgebrauch vor.
  - prompt: Welches Ergebnis folgt daraus für N?
    erwartung: Die Ablehnung ist ermessensfehlerhaft; N hat wegen der Ermessensreduzierung
      auf Null einen Anspruch auf behördliches Einschreiten.
  expectation:
    pruefpunkte:
    - id: p1
      label: Ermessensnorm (Entschließungsermessen) erkannt
      weight: 1.0
      required: false
      keywords:
