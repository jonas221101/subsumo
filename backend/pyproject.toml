[project]
name = "subsumo-backend"
version = "0.1.0"
description = "Subsumo - Backend fuer die Jura-Lern-App"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
