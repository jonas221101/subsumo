name: subsumo
description: Subsumo - Jura-Lern-App fuer Android, iOS, Windows und Web.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  # Bewusst minimal im M0-Geruest: nur HTTP und lokaler Key-Value-Speicher.
  # Riverpod (State) und drift (Offline-SQLite) kommen in M1 dazu, sobald die
  # Offline-Synchronisierung gebaut wird - siehe docs/03-roadmap.md.
  http: ^1.2.0
  shared_preferences: ^2.2.0
  # Oeffnet den Stripe-Checkout extern im System-/Tab-Browser (F2, siehe
  # docs/20-release-g2-bezahlstrecke.md) - kein In-App-WebView noetig.
  url_launcher: ^6.3.0
  # Pfadbasiertes URL-Routing (usePathUrlStrategy) fuer oeffentliche Marketing-/
  # Rechtsseiten vor dem Login-Gate (SUB-108, siehe docs/21).
  go_router: ^14.2.0
  # Rendert die docs/legal/*.md-Rechtstexte auf den oeffentlichen Routen
  # (SUB-111) mit ihrer echten Markdown-Formatierung statt als Rohtext.
  flutter_markdown_plus: ^1.0.12
  # Sandbox-Runtime fuer generierten Werkbank-Code (SUB-318, docs/27 Ticket
  # 5): eingebetteter QuickJS-Interpreter fuer Mobile/Desktop, pro Aufruf neu
  # instanziiert. Gewaehlt statt einer eigenen QuickJS-FFI-Bindung, weil das
  # Paket QuickJS bereits fuer Android/Windows per FFI und JavaScriptCore fuer
  # iOS bindet (siehe app/lib/sandbox/sandbox_runtime_io.dart) und
  # jsSetMemoryLimit/timeout als native, im Interpreter selbst durchgesetzte
  # Parameter mitbringt statt nur einer kooperativen Zeitmessung von aussen.
  flutter_js: ^0.8.7
  # dart:js_interop-Typen fuer die sandboxed Iframe/Web-Worker-Kommunikation
  # (app/lib/sandbox/sandbox_runtime_web.dart) - bislang nur dev_dependency
  # fuer Tests, jetzt auch fuer lib/ noetig.
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # Fuer Tests: erlaubt, UrlLauncherPlatform.instance im CheckoutPage-Test zu
  # ersetzen, statt echte Plattform-Channels zu brauchen (siehe test/checkout_page_test.dart).
  url_launcher_platform_interface: ^2.3.0

flutter:
  uses-material-design: true
  # docs/legal/*.md bleibt die einzige Quelle der Rechtstexte (SUB-85/SUB-111) -
  # die Rechtstexte-Seiten laden diese Dateien zur Laufzeit statt einer
  # eigenen Kopie, damit Aenderungen dort nicht separat nachgezogen werden
  # muessen.
  assets:
    - ../docs/legal/
  # Eigene Schrift statt Flutter Webs CanvasKit-Fallback auf fonts.gstatic.com -
  # siehe docs/07-spike-web-editor.md (Nebenbefund 2) und assets/fonts/LIZENZ.md.
  fonts:
    - family: Subsumo
      fonts:
        - asset: assets/fonts/DejaVuSans.ttf
    # Zweite Schriftfamilie (SUB-227/SUB-228, UI-Relaunch-Brief), streng
    # begrenzt auf die heroLarge/heroSmall-Rolle - siehe
    # design/tokens/typography.dart und assets/fonts/LIZENZ.md. Variable
    # Font (Achsen SOFT/WONK/opsz/wght) statt mehrerer statischer
    # Schnitte - eine Datei deckt alle benoetigten Gewichte/optischen
    # Groessen ab.
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces-Variable.ttf
