name: subsumo
description: Subsumo - Jura-Lern-App fuer Android, iOS, Windows und Web.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  # Bewusst minimal im M0-Geruest: nur HTTP und lokaler Key-Value-Speicher.
  # Riverpod (State) und drift (Offline-SQLite) kommen in M1 dazu, sobald die
  # Offline-Synchronisierung gebaut wird - siehe docs/03-roadmap.md.
  http: ^1.2.0
  shared_preferences: ^2.2.0
  # Oeffnet den Stripe-Checkout extern im System-/Tab-Browser (F2, siehe
  # docs/20-release-g2-bezahlstrecke.md) - kein In-App-WebView noetig.
  url_launcher: ^6.3.0
  # Pfadbasiertes URL-Routing (usePathUrlStrategy) fuer oeffentliche Marketing-/
  # Rechtsseiten vor dem Login-Gate (SUB-108, siehe docs/21).
  go_router: ^14.2.0
  # Rendert die docs/legal/*.md-Rechtstexte auf den oeffentlichen Routen
  # (SUB-111) mit ihrer echten Markdown-Formatierung statt als Rohtext.
  flutter_markdown_plus: ^1.0.12

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  web: ^1.1.1
  # Fuer Tests: erlaubt, UrlLauncherPlatform.instance im CheckoutPage-Test zu
  # ersetzen, statt echte Plattform-Channels zu brauchen (siehe test/checkout_page_test.dart).
  url_launcher_platform_interface: ^2.3.0

flutter:
  uses-material-design: true
  # docs/legal/*.md bleibt die einzige Quelle der Rechtstexte (SUB-85/SUB-111) -
  # die Rechtstexte-Seiten laden diese Dateien zur Laufzeit statt einer
  # eigenen Kopie, damit Aenderungen dort nicht separat nachgezogen werden
  # muessen.
  assets:
    - ../docs/legal/
  # Eigene Schrift statt Flutter Webs CanvasKit-Fallback auf fonts.gstatic.com -
  # siehe docs/07-spike-web-editor.md (Nebenbefund 2) und assets/fonts/LIZENZ.md.
  fonts:
    - family: Subsumo
      fonts:
        - asset: assets/fonts/DejaVuSans.ttf
